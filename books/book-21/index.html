","To the stomach only"],answer:1,explanation:"Cilia beat to move mucus and trapped particles upward to be cleared or swallowed.",topic:"Defence"},{q:"Macrophages in the lung:",options:["Produce oxygen","Engulf microbes and debris","Carry haemoglobin","Make surfactant"],answer:1,explanation:"Alveolar macrophages are immune cells that engulf particles and microbes.",topic:"Defence"},{q:"Secretory IgA protects mucosal surfaces by:",options:["Increasing pH","Blocking pathogens from attaching","Carrying oxygen","Thinning mucus"],answer:1,explanation:"Secretory IgA is an antibody on mucosal surfaces that helps block pathogen attachment.",topic:"Defence"},{q:"A productive cough means it:",options:["Is silent","Brings up mucus or phlegm","Occurs only at night","Is always dangerous"],answer:1,explanation:"Productive means it produces sputum; a persistent one should be reviewed if it lasts weeks.",topic:"Symptoms"},{q:"Cyanosis (blue lips/skin) suggests:",options:["Mild allergy","Low oxygen — an emergency warning sign","Good circulation","Dehydration"],answer:1,explanation:"Bluish discolouration indicates low oxygen and requires urgent medical attention.",topic:"Symptoms"},{q:"Asthma is best described as:",options:["A static lung scar","Inflamed, twitchy airways with variable airflow limitation","A heart condition","A bone disease"],answer:1,explanation:"Asthma features airway inflammation, hyperresponsiveness and variable airflow limitation.",topic:"Disease"},{q:"COPD is generally different from asthma because it is:",options:["Always reversible","Persistent and less reversible, often progressive","Caused only by viruses","A childhood condition"],answer:1,explanation:"COPD airflow limitation is usually persistent, less reversible and progressive, often from irritant exposure.",topic:"Disease"},{q:"Emphysema mainly damages the:",options:["Trachea","Alveolar walls","Vocal cords","Nasal cavity"],answer:1,explanation:"Emphysema destroys alveolar walls, reducing gas-exchange area and elastic recoil.",topic:"Disease"},{q:"Pneumonia is an infection that inflames the:",options:["Bronchi only","Alveoli (air sacs)","Diaphragm","Sinuses"],answer:1,explanation:"Pneumonia inflames the alveoli, which may fill with fluid or pus, impairing gas exchange.",topic:"Disease"},{q:"Tuberculosis is caused by:",options:["A virus","Bacteria (Mycobacterium tuberculosis)","Fungus only","Poor diet alone"],answer:1,explanation:"TB is a bacterial infection, usually of the lungs, spread through the air when untreated.",topic:"Disease"},{q:"Latent TB means the person:",options:["Has active contagious disease","Is infected but not contagious or symptomatic","Will never develop TB","Needs no monitoring"],answer:1,explanation:"Latent TB is infection without active disease; it is not contagious but may activate.",topic:"Disease"},{q:"Obstructive sleep apnoea involves:",options:["Repeated brain signalling failure only","Repeated airway collapse during sleep","Lung scarring","Low altitude"],answer:1,explanation:"OSA is repeated upper-airway collapse during sleep causing breathing pauses.",topic:"Disease"},{q:"A pulmonary embolism is:",options:["A lung infection","A clot blocking a lung artery","A type of asthma","Nasal inflammation"],answer:1,explanation:"A PE is typically a clot blocking a pulmonary artery — a potential emergency.",topic:"Disease"},{q:"Which is a known leading risk factor for lung cancer?",options:["Drinking water","Tobacco smoke","Regular walking","Fresh air"],answer:1,explanation:"Tobacco smoke is the leading risk, though non-smokers can also develop lung cancer.",topic:"Disease"},{q:"Bronchiectasis is characterised by:",options:["Temporary cough","Permanent airway widening impairing clearance","Reversible spasm only","Nasal polyps"],answer:1,explanation:"Bronchiectasis is permanent airway damage that traps mucus and invites infection.",topic:"Disease"},{q:"Interstitial lung disease primarily affects the:",options:["Airway muscles","Tissue around the alveoli (interstitium)","Diaphragm","Nose"],answer:1,explanation:"ILD affects the lung interstitium, causing stiffness and impaired oxygen transfer.",topic:"Disease"},{q:"Pulmonary fibrosis causes the lungs to become:",options:["More elastic","Stiff and scarred","Larger","Inflated"],answer:1,explanation:"Fibrosis scars and stiffens lung tissue, reducing compliance and gas exchange.",topic:"Disease"},{q:"Pulmonary hypertension strains the:",options:["Left kidney","Right side of the heart","Liver","Stomach"],answer:1,explanation:"High pressure in lung arteries makes the right heart work harder.",topic:"Disease"},{q:"The common cold is usually caused by:",options:["Bacteria requiring antibiotics","Viruses (e.g., rhinoviruses)","Fungi","Parasites"],answer:1,explanation:"Colds are usually viral; antibiotics do not help typical viral colds.",topic:"Disease"},{q:"Influenza is generally:",options:["Milder than a cold always","Often more severe than a cold with systemic symptoms","Caused by bacteria","Untreatable preventively"],answer:1,explanation:"Flu is typically more severe than a cold and vaccination reduces risk.",topic:"Disease"},{q:"COVID-19 is caused by:",options:["Influenza A","SARS-CoV-2 coronavirus","A bacterium","A fungus"],answer:1,explanation:"COVID-19 is caused by the SARS-CoV-2 coronavirus.",topic:"Disease"},{q:"Acute bronchitis is most often:",options:["Bacterial and needs antibiotics","Viral and self-limited","Fungal","Surgical"],answer:1,explanation:"Acute bronchitis is usually viral; antibiotics are rarely indicated.",topic:"Disease"},{q:"Which group is at higher risk from respiratory infections?",options:["Only young adults","Infants, older adults and those with chronic illness","Only smokers","No one"],answer:1,explanation:"Infants, older adults and people with chronic conditions face higher risk.",topic:"Public Health"},{q:"Spirometry measures:",options:["Blood oxygen only","How much and how fast you exhale","Heart rhythm","Bone density"],answer:1,explanation:"Spirometry measures exhaled volume and speed (e.g., FEV1, FVC).",topic:"Testing"},{q:"FEV1 is:",options:["Total lung weight","Forced expiratory volume in one second","A type of X-ray","A blood count"],answer:1,explanation:"FEV1 is the volume exhaled in the first second of a forced breath; reduced in obstruction.",topic:"Testing"},{q:"A pulse oximeter estimates:",options:["Blood pressure","Oxygen saturation (SpO2)","Lung volume","Bone density"],answer:1,explanation:"A pulse oximeter estimates oxygen saturation and pulse; it is a screening, not diagnostic, tool.",topic:"Testing"},{q:"Which can reduce pulse oximeter accuracy?",options:["Warm hands","Good circulation","Nail polish, cold extremities, movement","Correct sensor placement"],answer:2,explanation:"Nail polish, cold hands, movement and device quality can reduce accuracy; so can pigmentation bias.",topic:"Testing"},{q:"An arterial blood gas (ABG) measures:",options:["Only heart rate","Blood oxygen, CO2 and pH","Lung weight","Allergy type"],answer:1,explanation:"ABGs assess gas exchange and acid-base status precisely.",topic:"Testing"},{q:"A chest X-ray primarily shows:",options:["Function only","Structure of chest organs","Blood type","Muscle strength"],answer:1,explanation:"X-rays show structure; they do not measure function and need expert interpretation.",topic:"Testing"},{q:"A reliever inhaler typically contains a:",options:["Antibiotic","Bronchodilator","Steroid only","Vitamin"],answer:1,explanation:"Relievers are quick-acting bronchodilators that open airways during symptoms.",topic:"Treatment"},{q:"Inhaled corticosteroids are used to:",options:["Open airways instantly","Reduce airway inflammation (preventer)","Cure asthma","Replace oxygen"],answer:1,explanation:"Inhaled corticosteroids are preventer medicines reducing underlying inflammation.",topic:"Treatment"},{q:"Oxygen therapy should be:",options:["Used freely by anyone","Prescribed and supervised","A substitute for inhalers","Taken only at altitude"],answer:1,explanation:"Oxygen is a prescribed medical treatment; unsupervised use can be harmful.",topic:"Treatment"},{q:"Pulmonary rehabilitation is:",options:["A single pill","A supervised exercise, education and support programme","Surgery","A vaccine"],answer:1,explanation:"Pulmonary rehab combines supervised exercise, education and support for chronic lung disease.",topic:"Treatment"},{q:"PM2.5 refers to:",options:["Large pollen grains","Fine particulate matter under 2.5 micrometres","A gas","A vitamin"],answer:1,explanation:"PM2.5 is fine particulate matter able to penetrate deep into the lungs.",topic:"Environment"},{q:"Ground-level ozone is mainly a concern because it:",options:["Cools the air","Irritates airways and worsens on hot sunny days","Helps breathing","Is odourless and harmless"],answer:1,explanation:"Ground-level ozone irritates airways and often rises on hot, sunny days.",topic:"Environment"},{q:"Household air pollution is most associated with:",options:["Open windows","Burning solid fuels indoors","Electric lights","Cold air"],answer:1,explanation:"Burning wood, charcoal or coal indoors without ventilation causes household air pollution.",topic:"Environment"},{q:"The hierarchy of control for workplace hazards puts first:",options:["PPE","Eliminate or substitute the hazard","Training only","Ignoring it"],answer:1,explanation:"Elimination/substitution is the most effective control, ahead of PPE.",topic:"Environment"},{q:"Second-hand smoke harms mainly:",options:["Only the smoker","Non-smokers, especially children","No one","Only pets"],answer:1,explanation:"Second-hand smoke harms non-smokers, particularly children and people with asthma.",topic:"Environment"},{q:"Vaping is best described as:",options:["Completely safe water vapour","An aerosol exposure with known and unknown risks","A cure for asthma","Identical to fresh air"],answer:1,explanation:"Vaping exposes lungs to irritants; long-term effects are still being studied.",topic:"Environment"},{q:"At high altitude, the main challenge is:",options:["More oxygen per breath","Fewer oxygen molecules per breath due to lower pressure","Higher pressure","No change"],answer:1,explanation:"Lower atmospheric pressure means each breath contains fewer oxygen molecules.",topic:"Environment"},{q:"Exercise normally causes:",options:["No change in breathing","Increased breathing to meet demand","Cessation of breathing","Always dangerous breathlessness"],answer:1,explanation:"Breathing increases with exercise to meet oxygen demand; breathlessness easing with rest is normal.",topic:"Lifestyle"},{q:"Good nutrition for lung health is best understood as:",options:["A single cure food","Supportive of immunity and muscle, not a cure","Irrelevant","Only supplements"],answer:1,explanation:"Nutrition supports overall health but no food cures lung disease.",topic:"Lifestyle"},{q:"Drinking extra water is claimed to 'detox' the lungs. This is:",options:["Well proven","Unsupported; normal hydration supports mucus, not detox","A cure for COPD","Required in huge amounts"],answer:1,explanation:"Excess water does not detox lungs; normal hydration helps mucus without curing disease.",topic:"Lifestyle"},{q:"Pursed-lip breathing is often used in:",options:["Asthma attacks only","COPD to slow exhalation","Bone disease","Skin care"],answer:1,explanation:"Pursed-lip breathing helps some people with COPD slow exhalation and reduce breathlessness.",topic:"Lifestyle"},{q:"Breathing exercises should NOT replace:",options:["Water","Emergency care or prescribed medicine","Sleep","Walking"],answer:1,explanation:"Breathing techniques are supportive, not substitutes for emergency care or prescribed treatment.",topic:"Safety"},{q:"A diastolic blood pressure reading is unrelated to breathing. True or false: pulse oximeters diagnose asthma.",options:["True","False — they are screening tools only","Only at night","Only in children"],answer:1,explanation:"Pulse oximeters cannot diagnose asthma, COPD or emergencies; they only estimate saturation.",topic:"Safety"},{q:"Which is an emergency warning sign requiring urgent care?",options:["Mild hay fever","Severe breathlessness with blue lips","Yawning","Normal exercise breathlessness"],answer:1,explanation:"Severe breathlessness with cyanosis is an emergency; call local emergency services.",topic:"Safety"},{q:"You should adjust prescribed inhaler doses:",options:["Whenever you feel like it","Only on clinician advice","By reading online","Never use them"],answer:1,explanation:"Never change prescribed medicine without professional guidance.",topic:"Safety"},{q:"Vaccines for respiratory health include:",options:["Only flu","Influenza, pneumococcal, COVID-19 and others by schedule","None","Only antibiotics"],answer:1,explanation:"Several vaccines reduce respiratory infections; schedules vary by country and risk.",topic:"Prevention"},{q:"Effective infection control includes:",options:["Only masks","Hand hygiene, ventilation, masks and staying home when infectious","Ignoring symptoms","Crowding"],answer:1,explanation:"Layered measures — hygiene, ventilation, masks, isolation when feasible — reduce spread.",topic:"Prevention"},{q:"Ventilation improves indoor air by:",options:["Adding perfume","Replacing indoor air with fresh outdoor air","Closing windows","Increasing dust"],answer:1,explanation:"Ventilation dilutes indoor pollutants with fresh air.",topic:"Prevention"},{q:"Dampness and mould in homes are linked to:",options:["Better air","Cough, wheeze and asthma symptoms","No effect","More oxygen"],answer:1,explanation:"Dampness and mould are associated with respiratory symptoms, especially in children.",topic:"Environment"},{q:"Climate change affects respiratory health through:",options:["Nothing","Longer pollen seasons, wildfire smoke and heat","Cleaner air","Less allergen"],answer:1,explanation:"Warming extends pollen seasons, increases wildfire smoke and heat stress.",topic:"Environment"},{q:"The mucociliary escalator is part of:",options:["Digestion","Airway defence","Vision","Hearing"],answer:1,explanation:"It is a defence mechanism clearing mucus and particles from airways.",topic:"Defence"},{q:"Coughing up blood with breathlessness should be:",options:["Ignored","Treated as urgent and reviewed medically","Cured by tea","Expected"],answer:1,explanation:"Haemoptysis with breathlessness is a warning sign needing urgent assessment.",topic:"Safety"},{q:"Which is NOT a function of the larynx?",options:["Voice production","Protecting the airway during swallowing","Pumping blood","Regulating airflow"],answer:2,explanation:"The larynx makes voice and protects the airway; the heart pumps blood.",topic:"Anatomy"},{q:"Internal respiration occurs between:",options:["Alveoli and blood","Blood and body tissues","Nose and trachea","Lungs and diaphragm"],answer:1,explanation:"Internal respiration is gas exchange between blood and tissues.",topic:"Basics"},{q:"Mitochondria are important in breathing because they:",options:["Move air","Use oxygen to make cellular energy","Filter air","Make sound"],answer:1,explanation:"Mitochondria use oxygen to produce ATP, the cell's energy currency.",topic:"Physiology"},{q:"Hypocapnia means:",options:["High CO2","Low CO2","No oxygen","High oxygen"],answer:1,explanation:"Hypocapnia is abnormally low blood CO2, which can occur with over-breathing.",topic:"Physiology"},{q:"Hypercapnia means:",options:["Low CO2","High CO2","Low oxygen","Normal pH"],answer:1,explanation:"Hypercapnia is abnormally high blood CO2, which can acidify the blood.",topic:"Physiology"},{q:"The pleura normally contains:",options:["Air","A thin fluid layer","Bone","Muscle"],answer:1,explanation:"A thin fluid layer lets the lungs glide against the chest wall.",topic:"Anatomy"},{q:"A pneumothorax is:",options:["Fluid in the pleura","Air in the pleural space causing collapse","Lung infection","Nasal blockage"],answer:1,explanation:"Air entering the pleural space can cause part or all of a lung to collapse.",topic:"Anatomy"},{q:"Bronchioles differ from bronchi in that they:",options:["Have more cartilage","Lack cartilage and rely on smooth muscle","Are part of the nose","Carry food"],answer:1,explanation:"Bronchioles lack cartilage and depend on smooth muscle and elastic tissue.",topic:"Anatomy"},{q:"Smooth muscle in airways can cause:",options:["Bone growth","Bronchoconstriction or bronchodilation","Voice","Smell"],answer:1,explanation:"Airway smooth muscle tightens (constriction) or relaxes (dilation), changing diameter.",topic:"Physiology"},{q:"The oxygen dissociation curve shifts right when:",options:["Temperature rises or CO2 rises","Temperature falls","pH rises only","Oxygen falls to zero"],answer:0,explanation:"Higher temperature, CO2 or acidity shift the curve right, releasing oxygen more readily.",topic:"Physiology"},{q:"Dead space in the lung is air that:",options:["Participates fully in exchange","Reaches alveoli but not perfused","Is in the stomach","Carries haemoglobin"],answer:1,explanation:"Physiological dead space is ventilated but not perfused, so no exchange occurs.",topic:"Physiology"},{q:"Which is a physical barrier in airway defence?",options:["Antibodies only","Nasal hairs and mucus","Bone marrow","Platelets"],answer:1,explanation:"Nasal hairs, mucus and cilia are physical defences trapping particles.",topic:"Defence"},{q:"Allergic rhinitis is commonly known as:",options:["Pneumonia","Hay fever","Bronchitis","Emphysema"],answer:1,explanation:"Allergic rhinitis is inflammation of the nasal lining, often called hay fever.",topic:"Disease"},{q:"A common indoor allergen is:",options:["Fresh air","House-dust mites","Sunlight","Water"],answer:1,explanation:"Dust mites, mould, pollen and pet dander are common respiratory allergens.",topic:"Disease"},{q:"Anaphylaxis is:",options:["Mild rash","A severe allergic reaction needing immediate care","A cold","A cough"],answer:1,explanation:"Anaphylaxis is a life-threatening allergic emergency requiring urgent treatment.",topic:"Safety"},{q:"The respiratory microbiome is:",options:["Fully understood and curable","An emerging research area with uncertain links to disease","Absent in health","Identical in everyone"],answer:1,explanation:"Airway microbial communities are under active study; claims of cures exceed evidence.",topic:"Defence"},{q:"Respiratory infections spread by aerosols are best reduced by:",options:["Only hand washing","Ventilation and masks","Ignoring it","Crowding"],answer:1,explanation:"Aerosols linger indoors; ventilation and masks reduce transmission.",topic:"Prevention"},{q:"Acute inflammation is:",options:["Always harmful","A short-term protective response","Permanent","Unrelated to immunity"],answer:1,explanation:"Acute inflammation is protective; chronic inflammation can damage tissue.",topic:"Defence"},{q:"In asthma, airway inflammation leads to:",options:["Wider airways","Swelling, mucus and twitchiness","More oxygen","Bone loss"],answer:1,explanation:"Asthma inflammation causes swelling, mucus and hyperresponsiveness.",topic:"Disease"},{q:"A personal asthma action plan is:",options:["Optional decoration","A clinician-created guide for self-management","A cure","Only for hospitals"],answer:1,explanation:"Action plans, made with clinicians, guide daily management and worsening symptoms.",topic:"Treatment"},{q:"COPD is most commonly caused by:",options:["Only allergies","Long-term irritant exposure, especially tobacco smoke","Viral infection alone","Exercise"],answer:1,explanation:"COPD usually results from chronic irritant exposure; not only smokers are affected.",topic:"Disease"},{q:"A persistent cough lasting over three weeks is called:",options:["Acute","Chronic","Normal","Viral only"],answer:1,explanation:"Chronic cough warrants medical evaluation to find the cause.",topic:"Symptoms"},{q:"Stridor suggests:",options:["Lower-airway disease only","Upper-airway narrowing","Healthy breathing","Lung scarring"],answer:1,explanation:"Stridor is a high-pitched inspiratory noise indicating upper-airway narrowing.",topic:"Symptoms"},{q:"In children, fast breathing with rib retraction may indicate:",options:["Normal sleep","Serious breathing difficulty needing review","Dehydration only","Allergy cure"],answer:1,explanation:"Retractions and fast breathing in children are warning signs needing assessment.",topic:"Symptoms"},{q:"Older adults may present atypical pneumonia with:",options:["Only cough","Confusion or weakness","No symptoms ever","Improved appetite"],answer:1,explanation:"Atypical presentation (confusion, weakness) is common in older adults.",topic:"Disease"},{q:"Whooping cough (pertussis) vaccine is part of:",options:["No schedule","Routine immunisation in many countries","Only travel","Adult-only"],answer:1,explanation:"Pertussis vaccination is included in many national immunisation schedules.",topic:"Prevention"},{q:"RSV is particularly risky for:",options:["Only teens","Infants and older adults","No one","Athletes only"],answer:1,explanation:"RSV commonly causes severe disease in infants and older adults.",topic:"Prevention"},{q:"Spirometry results are interpreted against:",options:["Random numbers","Reference values adjusted for age, height, sex","Only weight","Blood type"],answer:1,explanation:"Results are compared with reference ranges accounting for individual factors.",topic:"Testing"},{q:"A normal chest X-ray:",options:["Rules out all lung disease","Does not rule out all disease","Measures oxygen","Cures cough"],answer:1,explanation:"Imaging shows structure; normal X-ray does not exclude all conditions.",topic:"Testing"},{q:"CT scans provide:",options:["Less detail than X-ray","Detailed cross-sectional images","Sound waves","Blood counts"],answer:1,explanation:"CT gives detailed anatomical images used when more information is needed.",topic:"Testing"},{q:"A full blood count can reveal:",options:["Only height","Infection or anaemia clues","Lung volume","Voice quality"],answer:1,explanation:"Blood counts can suggest infection or low haemoglobin affecting oxygen carriage.",topic:"Testing"},{q:"Inhaler technique matters because poor use:",options:["Improves delivery","Reduces medicine reaching airways","Cures disease","Is irrelevant"],answer:1,explanation:"Correct technique ensures medicine reaches the airways effectively.",topic:"Treatment"},{q:"Non-invasive ventilation means:",options:["Surgery","Assisted breathing without a tracheal tube","Oxygen pills","Ignoring symptoms"],answer:1,explanation:"Non-invasive ventilation supports breathing via a mask rather than an invasive tube.",topic:"Treatment"},{q:"Air quality indices help by:",options:["Confusing readers","Summarising pollution with health advice","Measuring heart rate","Predicting weather only"],answer:1,explanation:"AQI converts pollutant data into a health-related daily rating.",topic:"Environment"},{q:"Wildfire smoke mainly increases:",options:["Oxygen","Fine particulate matter","Nitrogen only","Sound"],answer:1,explanation:"Wildfire smoke raises fine-particle levels over wide areas.",topic:"Environment"},{q:"Occupational asthma is triggered by:",options:["Only pollen","Workplace exposures","Sleep","Water"],answer:1,explanation:"Workplace sensitisers can cause or trigger asthma.",topic:"Environment"},{q:"Silicosis is caused by:",options:["Asbestos only","Inhaled silica dust","Viruses","Cold air"],answer:1,explanation:"Silicosis is a pneumoconiosis from silica dust exposure.",topic:"Environment"},{q:"Asbestosis is associated with increased risk of:",options:["Only cough","Lung cancer and mesothelioma","No risk","Improved breathing"],answer:1,explanation:"Asbestos exposure raises risk of lung cancer and mesothelioma.",topic:"Environment"},{q:"Altitude illness is best prevented by:",options:["Rapid ascent","Gradual ascent and hydration","Holding breath","Smoking"],answer:1,explanation:"Gradual ascent lets the body adapt and reduces altitude-illness risk.",topic:"Environment"},{q:"Exercise-induced bronchoconstriction is common in:",options:["Asthma","Healthy bones","Skin","Teeth"],answer:0,explanation:"Exercise can trigger transient airway narrowing, especially in asthma.",topic:"Lifestyle"},{q:"A balanced dietary pattern is linked to respiratory health through:",options:["Causation proven","Associational, indirect support","No mechanism","Only vitamins"],answer:1,explanation:"Dietary-pattern studies are observational; they support general health, not cures.",topic:"Lifestyle"},{q:"Body composition can affect breathing by:",options:["Nothing","Abdominal weight reducing diaphragm movement","Increasing lung size","Curing asthma"],answer:1,explanation:"Excess abdominal weight can limit diaphragmatic excursion and increase work of breathing.",topic:"Lifestyle"},{q:"Poor sleep can worsen respiratory conditions because it:",options:["Helps immunity","Impairs immune and condition management","Cures asthma","Increases oxygen"],answer:1,explanation:"Poor sleep undermines immunity and self-management of chronic disease.",topic:"Lifestyle"},{q:"Stress and anxiety can cause perceived breathlessness via:",options:["Hyperventilation","Improved lungs","More oxygen","Bone growth"],answer:0,explanation:"Over-breathing lowers CO2 and creates a feeling of air hunger despite normal oxygen.",topic:"Lifestyle"},{q:"Diaphragmatic breathing emphasises:",options:["Shallow chest breathing","Using the diaphragm from the belly","Holding breath","Rapid panting"],answer:1,explanation:"Diaphragmatic breathing trains efficient, relaxed breathing using the diaphragm.",topic:"Lifestyle"},{q:"Daily respiratory-healthy habits include:",options:["Indoor smoking","Ventilation, no indoor smoke, hygiene, vaccination","Ignoring dampness","Skipping care"],answer:1,explanation:"Low-cost habits — ventilation, smoke-free homes, hygiene, vaccination — support lung health.",topic:"Prevention"},{q:"A lifelong respiratory plan should include:",options:["Only supplements","Prevention, environment, t:"What are alveoli?",back:"Tiny air sacs where oxygen enters the blood and carbon dioxide leaves it.",category:"Anatomy"},{front:"What are the upper airways?",back:"Nose, nasal cavity, sinuses, pharynx and larynx (above the vocal cords).",category:"Anatomy"},{front:"What are the lower airways?",back:"Trachea, bronchi, bronchioles and lungs (below the vocal cords).",category:"Anatomy"},{front:"What is the trachea?",back:"The windpipe; a cartilage-reinforced tube from larynx to bronchi.",category:"Anatomy"},{front:"What are the lungs' lobes?",back:"Right lung has three lobes; left lung has two to make room for the heart.",category:"Anatomy"},{front:"What is the pleura?",back:"The double membrane around the lungs; inflammation is called pleurisy.",category:"Anatomy"},{front:"What are intercostal muscles?",back:"Muscles between the ribs that assist chest expansion in breathing.",category:"Anatomy"},{front:"What is the epiglottis?",back:"A flap that covers the larynx during swallowing to protect the airway.",category:"Anatomy"},{front:"What are cilia?",back:"Tiny hair-like projections that move mucus and trapped particles upward.",category:"Anatomy"},{front:"What is mucus?",back:"A protective secretion that traps particles and microbes in the airways.",category:"Anatomy"},{front:"What is surfactant?",back:"A substance made by alveolar cells that lowers surface tension and keeps alveoli open.",category:"Physiology"},{front:"What is lung compliance?",back:"How easily the lungs stretch under pressure; low compliance means stiff lungs.",category:"Physiology"},{front:"What is airway resistance?",back:"Opposition to airflow, strongly affected by airway diameter.",category:"Physiology"},{front:"What is tidal volume?",back:"The air moved in and out during normal, quiet breathing (about 0.5 L).",category:"Physiology"},{front:"What is residual volume?",back:"Air that always remains after maximal exhalation; prevents alveolar collapse.",category:"Physiology"},{front:"What is vital capacity?",back:"The maximum air that can be moved voluntarily from full inhale to full exhale.",category:"Physiology"},{front:"What is total lung capacity?",back:"Vital capacity plus residual volume.",category:"Physiology"},{front:"What is diffusion?",back:"Passive movement of gas from higher to lower partial pressure across a membrane.",category:"Physiology"},{front:"What is a partial pressure gradient?",back:"The difference in a gas's pressure that drives its movement across the membrane.",category:"Physiology"},{front:"What is haemoglobin?",back:"The iron-rich protein in red cells that carries most oxygen in the blood.",category:"Physiology"},{front:"What is the oxygen dissociation curve?",back:"A graph of haemoglobin saturation versus oxygen partial pressure (S-shaped).",category:"Physiology"},{front:"What is bicarbonate?",back:"The main transported form of carbon dioxide; central to acid-base balance.",category:"Physiology"},{front:"What is the bicarbonate buffer?",back:"The CO2/bicarbonate system that helps keep blood pH stable.",category:"Physiology"},{front:"Which brain region controls breathing automatically?",back:"The brainstem — mainly the medulla oblongata and pons.",category:"Physiology"},{front:"What are chemoreceptors?",back:"Sensors that detect CO2, oxygen and pH to adjust breathing.",category:"Physiology"},{front:"What is the strongest driver of normal breathing?",back:"Rising carbon dioxide (and the resulting acidity) in the blood.",category:"Physiology"},{front:"What is V/Q matching?",back:"Balancing airflow (ventilation) and blood flow (perfusion) for efficient gas exchange.",category:"Physiology"},{front:"What is a pulmonary embolus?",back:"A clot blocking a lung artery; a potential medical emergency.",category:"Disease"},{front:"What is asthma?",back:"A long-term condition of inflamed, twitchy airways with variable airflow limitation.",category:"Disease"},{front:"What is COPD?",back:"Persistent, progressive airflow limitation, usually from irritant exposure.",category:"Disease"},{front:"What is chronic bronchitis (in COPD)?",back:"A chronic productive cough for at least 3 months in two consecutive years.",category:"Disease"},{front:"What is emphysema?",back:"Destruction of alveolar walls reducing gas-exchange area and recoil.",category:"Disease"},{front:"What is pneumonia?",back:"Infection inflaming the alveoli, often with fluid or pus, impairing gas exchange.",category:"Disease"},{front:"What is tuberculosis (TB)?",back:"A treatable bacterial infection, usually of the lungs, spread through the air.",category:"Disease"},{front:"What is bronchiectasis?",back:"Permanent airway widening that impairs mucus clearance and invites infection.",category:"Disease"},{front:"What is pulmonary fibrosis?",back:"Scarring of lung tissue that stiffens the lungs and impairs gas exchange.",category:"Disease"},{front:"What is obstructive sleep apnoea?",back:"Repeated airway collapse during sleep causing breathing pauses and drops in oxygen.",category:"Disease"},{front:"What is pulmonary hypertension?",back:"High pressure in lung arteries that strains the right side of the heart.",category:"Disease"},{front:"What is the common cold usually caused by?",back:"Viruses, most often rhinoviruses; antibiotics do not help.",category:"Disease"},{front:"What is influenza?",back:"A viral respiratory illness, usually more severe than a cold, with seasonal patterns.",category:"Disease"},{front:"What is acute bronchitis?",back:"Short-term inflammation of the bronchi, usually viral.",category:"Disease"},{front:"What is bronchoconstriction?",back:"Narrowing of airways by smooth-muscle tightening, raising resistance.",category:"Disease"},{front:"What is an allergen?",back:"A usually harmless substance that triggers an allergic response in sensitised people.",category:"Disease"},{front:"What is IgE?",back:"An antibody class involved in allergic reactions.",category:"Disease"},{front:"What is dyspnoea?",back:"The subjective feeling of breathlessness or difficult breathing.",category:"Symptoms"},{front:"What is a wheeze?",back:"A high-pitched sound from narrowed airways.",category:"Symptoms"},{front:"What is sputum?",back:"Mucus coughed up from the airways.",category:"Symptoms"},{front:"What is a chronic cough?",back:"A cough persisting beyond about three weeks; warrants medical assessment.",category:"Symptoms"},{front:"What is cyanosis?",back:"Bluish lips or skin from low oxygen; an emergency warning sign.",category:"Symptoms"},{front:"What is stridor?",back:"A high-pitched noise on inhalation suggesting upper-airway narrowing.",category:"Symptoms"},{front:"What is FEV1?",back:"Forced expiratory volume in one second; reduced in obstructive disease.",category:"Testing"},{front:"What is FVC?",back:"Forced vital capacity; the total air exhaled in a forced breath.",category:"Testing"},{front:"What is spirometry?",back:"A test measuring how much and how fast you can exhale.",category:"Testing"},{front:"What does a pulse oximeter measure?",back:"Estimated oxygen saturation (SpO2) and pulse rate — a screening tool, not a diagnosis.",category:"Testing"},{front:"What can make pulse oximetry inaccurate?",back:"Poor circulation, cold hands, movement, nail polish, device quality, pigmentation bias, altitude.",category:"Testing"},{front:"What is an arterial blood gas (ABG)?",back:"A test measuring blood oxygen, CO2 and pH to assess gas exchange.",category:"Testing"},{front:"What is a bronchodilator?",back:"A reliever medicine that relaxes airway muscle to widen airways.",category:"Treatment"},{front:"What is an inhaled corticosteroid?",back:"A preventer medicine reducing airway inflammation.",category:"Treatment"},{front:"What is pulmonary rehabilitation?",back:"A supervised programme of exercise, education and support for chronic lung disease.",category:"Treatment"},{front:"What is CPAP?",back:"Continuous positive airway pressure; a prescribed device keeping the airway open in sleep apnoea.",category:"Treatment"}, aled asbestos fibres; also raises cancer risk.",category:"Environment"},{front:"What is silicosis?",back:"Lung disease from inhaled silica dust.",category:"Environment"},{front:"What is occupational asthma?",back:"Asthma caused or triggered by workplace exposures.",category:"Environment"},{front:"What is the difference between asthma and COPD?",back:"Asthma: variable, often reversible; COPD: persistent, less reversible, progressive.",category:"Disease"},{front:"What is hyperventilation?",back:"Over-breathing that lowers CO2 and can cause light-headedness and tingling.",category:"Physiology"},{front:"What is the role of the nose in breathing?",back:"It filters, warms and humidifies incoming air and supports smell.",category:"Anatomy"},{front:"What are turbinates?",back:"Scroll-shaped structures in the nose that warm, humidify and filter air.",category:"Anatomy"},{front:"What are the paranasal sinuses?",back:"Air-filled skull cavities that drain into the nose and condition air.",category:"Anatomy"},{front:"What is Boyle's law in breathing?",back:"Expanding chest volume lowers pressure, drawing air in; recoil raises it, pushing air out.",category:"Physiology"},{front:"What is elastic recoil?",back:"The tendency of lung and chest tissue to return to a smaller size after stretching.",category:"Physiology"},{front:"What is the alveolar-capillary membrane?",back:"The thin barrier across which oxygen and CO2 diffuse.",category:"Physiology"},{front:"What is restrictive lung disease?",back:"A pattern where lung inflation is limited (e.g., pulmonary fibrosis).",category:"Disease"},{front:"What is obstructive lung disease?",back:"A pattern where airflow, especially exhalation, is limited (e.g., asthma, COPD).",category:"Disease"},{front:"What is a nebulizer?",back:"A device turning liquid medicine into an inhalable mist.",category:"Treatment"},{front:"What is a metered-dose inhaler (MDI)?",back:"An inhaler releasing a measured dose; often used with a spacer.",category:"Treatmen ,C=X.useMemo(()=>{let L=Uh;if(g&&(L=L.filter(P=>P.term.toUpperCase().startsWith(g))),f.trim()){const P=f.toLowerCase();L=L.filter(E=>E.term.toLowerCase().includes(P)||E.definition.toLowerCase().includes(P))}return L},[f,g]),q=X.useMemo(()=>Array.from(new Set(Uh.map(L=>L.term[0].toUpperCase()))).sort(),[]);return l.jsxs("div",{children:[l.jsx("input",{type:"search",value:f,onChange:L=>w(L.target.value),placeholder:"Search 200+ respiratory terms…","aria-label":"Search glossary",className:"mb-3 w-full rounded-lg border border-beige bg-cream px-3 py-2 text-sm outline-none focus:border-botanical-500 dark:border-[#38362b] dark:bg-[#1f1e17] dark:text-cream"}),l.jsxs("div",{className:"mb-4 flex flex-wrap gap-1 no-print",children:[l.jsx("button",{onClick:()=>d(null),className:`rounded px-2 py-1 text-xs font-semibold ${g?"bg-botanical-100 text-botanical-800 dark:bg-[#2a3a2f] dark:text-olive-300":"bg-botanical-700 text-white"}`,children:"All"}),q.map(L=>l.jsx("button",{onClick:()=>d(L),className:`rounded px-2 py-1 text-xs font-semibold ${g===L?"bg-botanical-700 text-white":"bg-botanical-100 text-botanical-800 dark:bg-[#2a3a2f] dark:text-olive-300"}`,children:L},L))]}),l.jsxs("p",{className:"mb-3 text-sm text-charcoal-soft dark:text-cream/70",children:[C.length," terms"]}),l.jsx("dl",{className:"grid gap-3 md:grid-cols-2",children:C.map((L,P)=>l.jsxs("div",{className:"card p-3",children:[l.jsx("dt",{className:"font-semibold text-botanical-800 dark:text-olive-300",children:L.term}),l.jsx("dd",{className:"mt-1 text-sm text-charcoal-soft dark:text-cream/80",children:L.definition})]},P))})]})}function Rg(){const[f,w]=X.useState("flash");return l.jsxs("div",{children:[l.jsx("div",{className:"mb-5 flex flex-wrap gap-2 no-print",role:"tablist",children:[["flash","Flashcards"],["quiz","Quizzes"],["gloss","Glossary"]].map(([g,d])=>l.jsx("button",{role:"tab","aria-selected":f===g,onClick:()=>w(g),className:`rounded-full px-4 py-2 text-sm font-semibold ${f===g?"bg-botanical-700 text-white":"bg-botanical-100 text-botanical-800 dark:bg-[#2a3a2f] dark:text-olive-300"}`,children:d},g))}),f==="flash"&&l.jsx(Bg,{}),f==="quiz"&&l.jsx(qg,{}),f==="gloss"&&l.jsx(Hg,{})]})}const Lg=[{id:1,title:"A student near heavy traffic",scenario:"Maya, 14, walks to school along a busy road and notices her chest feels tight on high-traffic mornings, especially in winter when windows are closed on the bus.",concepts:["Air pollution (PM2.5, NO2)","Exercise and airway reactivity","Personal exposure reduction"],questions:["What parts of the day might expose Maya most?","Could route or timing reduce exposure?","When would symptoms warrant a clinician?"],discussion:"Traffic-related pollution can irritate airways and worsen asthma-like symptoms. Practical steps include choosing less busy routes, avoiding the roadside during peak traffic, and indoor ventilation when outdoor air is better. Persistent or worsening symptoms, especially with wheeze or breathlessness, should be assessed by a clinician — this scenario is educational, not diagnostic.",safety:"If Maya has severe breathlessness, blue lips or poor response to a prescribed inhaler, emergency care is needed immediately.",lessons:["Exposure varies by route and time","Small changes can reduce contact","Persistent symptoms need professional review"]},{id:2,title:"A cook in a poorly ventilated kitchen",scenario:"Diego, 32, works in a small restaurant kitchen with gas stoves and little extraction. He often has a night cough after shifts and occasional wheeze.",concepts:["Indoor air quality","Combustion pollutants","Ventilation and occupational exposure"],questions:["What might the kitchen air contain?","How could ventilation help?","When is this an occupational-health issue?"],discussion:"Cooking with incomplete ventilation releases particulates and gases that can irritate airways. Improving extraction, opening windows when safe, and using lower-emission equipment help. If symptoms are work-related and persistent, occupational-health evaluation is appropriate. This is not a diagnosis.",safety:"Cough with breathlessness or chest pain should be medically evaluated; do not attribute all cough to work without review.",lessons:["Ventilation reduces indoor pollutants","Work-related symptoms deserve assessment","Source control beats masking"]},{id:3,title:"Seasonal allergic symptoms",scenario:"Aiko, 28, develops itchy eyes, runny nose and a tight chest each spring. Antihistamines help the nose but not the chest tightness.",concepts:["Allergens (pollen)","Allergic rhinitis vs asthma","Trigger management"],questions:["Why might nose and chest respond differently?","Could chest symptoms indicate lower-airway involvement?","What should prompt review?"],discussion:"Pollen is a common allergen causing upper-airway symptoms; chest tightness suggests airway involvement that a clinician should evaluate. Avoidance, timing outdoor activity, and prescribed therapy can help. Self-treatment of chest symptoms without assessment is not advised.",safety:"Wheeze with breathlessness, especially at rest, needs urgent care.",lessons:["Allergy can affect upper and lower airways","Chest tightness warrants evaluation","Management is individualised"]},{id:4,title:"Living with a long-term asthma diagnosis",scenario:"Sam, 19, has had asthma since childhood and uses a reliever when short of breath. Recently he needs it most days and wakes at night coughing.",concepts:["Asthma control","Reliever vs preventer","Action plans"],questions:["What does increasing reliever use suggest?","Why might a preventer help?","When should he seek help?"],discussion:"Needing a reliever most days and night-time symptoms suggest poorly controlled asthma. A clinician may add or adjust a preventer (inhaled corticosteroid). He should never stop prescribed medicine without advice. This scenario illustrates concepts, not treatment.",safety:"A severe attack not relieved by the inhaler is an emergency.",lessons:["Increasing reliever use signals poor control","Preventers reduce inflammation","Follow prescribed plans"]},{id:5,title:"An older adult recovering from pneumonia",scenario:"Mr Okafor, 71, was hospitalised with pneumonia and is home now, tired and short of breath on stairs he used to climb easily.",concepts:["Recovery after infection","Deconditioning","Gradual activity"],questions:["Why might breathlessness persist after infection?","How should activity be rebuilt?","What warns of relapse?"],discussion:"Recovery can take weeks; muscles decondition and inflammation resolves gradually. Gentle, progressive activity and good nutrition help. Worsening breathlessness, fever or confusion needs review. This is educational; his clinician guides his plan.",safety:"New high fever, breathlessness at rest or confusion requires urgent care.",lessons:["Recovery is gradual","Progress activity slowly","Watch for relapse signs"]},{id:6,title:"A construction worker exposed to mineral dust",scenario:"Liang, 45, cuts stone without consistent respiratory protection and has developed a persistent cough and breathlessness over years.",concepts:["Occupational dust","Pneumoconiosis (silicosis)","Prevention hierarchy"],questions:["What exposures concern here?","How could harm be prevented?","Why report symptoms early?"],discussion:"Silica dust can cause silicosis; prevention (elimination, wet methods, ventilation, correct respirators) is far better than treatment. Early reporting and occupational-health assessment matter. This is not a diagnosis of Liang's condition.",safety:"Sudden severe breathlessness could be a clot or other emergency — seek care.",lessons:["Dust prevention protects lungs","PPE is the last control, not first","Early reporting helps"]},{id:7,title:"Worried about a low pulse oximeter reading",scenario:"Priya buys a home pulse oximeter and reads 94% while feeling fine, then 91% after a hot bath, and becomes anxious.",concepts:["Pulse oximeter limits","Normal variation","When readings matter"],questions:["Why might a reading vary?","What factors reduce accuracy?","When is a reading an emergency?"],discussion:"Pulse oximeters are screening tools with many limitations (circulation, temperature, nail polish, device quality, pigmentation bias, altitude). A single reading in a well person is not diagnostic. Symptoms matter most. Discuss personal thresholds with a clinician.",safety:"Blue lips, severe breathlessness or confusion need emergency care regardless of the number.",lessons:["Oximeters are screening only","Many factors affect accuracy","Symptoms outrank numbers"]},{id:8,title:"An athlete's normal ventilation changes",scenario:"Tom, 24, a runner, breathes heavily and feels 'air hunger' at the end of hard intervals but recovers within minutes.",concepts:["Exercise ventilation","Normal vs warning breathlessness"],questions:["Why does breathing rise with exercise?","What distinguishes normal from warning signs?","When should he worry?"],discussion:"During exercise, breathing increases to meet oxygen demand; recovery within minutes is normal. Warning signs include breathlessness at rest, with minimal effort, or with chest pain/dizziness. This case shows healthy physiology, not illness.",safety:"Breathlessness with chest pain or fainting needs urgent evaluation.",lessons:["Exercise raises ventilation normally","Recovery time matters","Severe symptoms are not normal"]},{id:9,title:"Exposure to second-hand smoke",scenario:"Lena, 6, lives with a smoker and has frequent night cough and wheeze. Her parent is considering quitting.",concepts:["Second-hand smoke","Childhood airways","Cessation support"],questions:["How does smoke affect children?","What helps the home?","Where can support be found?"],discussion:"Second-hand smoke worsens children's respiratory symptoms and increases infection risk. A smoke-free home and cessation support help. Children's narrower airways make them more vulnerable. This is educational; a clinician can advise on the child's symptoms.",safety:"Stridor at rest or blue lips in a child is an emergency.",lessons:["Smoke-free homes protect children","Cessation support improves success","Children's airways are vulnerable"]},{id:10,title:"A damp, mouldy home",scenario:"The Reyes family notices mould on a bathroom wall and their child's asthma seems worse in winter when windows stay shut.",concepts:["Dampness and mould","Indoor air","Trigger reduction"],questions:["How might dampness affect breathing?","What practical steps help?","When involve the landlord/authority?"],discussion:"Dampness and mould are linked to cough, wheeze and asthma symptoms. Fixing leaks, ventilating, and reducing humidity help. Structural issues may need landlord or public-housing action. This scenario is illustrative, not diagnostic.",safety:"Severe breathlessness in the child needs urgent care.",lessons:["Control moisture to limit mould","Ventilation matters in winter","Structural help may be needed"]},{id:11,title:"Adjusting to high altitude",scenario:"Hannah travels from sea level to 3,500 m and gets headache, nausea and breathlessness on the second day despite feeling excited.",concepts:["Altitude physiology","Acute mountain sickness","Gradual ascent"],questions:["Why does breathing change at altitude?","What suggests altitude illness?","What should she do?"],discussion:"At altitude, lower pressure means fewer oxygen molecules per breath; the body adapts gradually. Headache with nausea after rapid ascent suggests altitude illness. Descent and medical advice help. This is educational; severe symptoms need urgent care.",safety:"Confusion, severe breathlessness or inability to walk are emergencies — descend and seek help.",lessons:["Altitude reduces oxygen per breath","Ascend gradually","Know warning signs"]},{id:12,title:"Sleep-related breathing interruptions",scenario:"Mr Tan, 52, snores loudly, his partner notices pauses in breathing, and he is very sleepy during the day despite a full night in bed.",concepts:["Obstructive sleep apnoea","Sleep quality","Cardiovascular links"],questions:["What might the pauses indicate?","Why does daytime sleepiness matter?","What evaluation helps?"],discussion:"Loud snoring with observed pauses and daytime sleepiness suggests possible sleep apnoea, which can affect heart and lung health. A sleep study and clinician evaluation guide management (e.g., CPAP if prescribed). This is illustrative, not a diagnosis.",safety:"Falling asleep while driving is dangerous; seek assessment.",lessons:["Snoring plus pauses warrants review","Daytime sleepiness affects safety","Sleep studies guide care"]},{id:13,title:"Chemical fume exposure at work",scenario:"Nadia works with cleaning chemicals in a closed space without gloves or mask and feels burning in her throat and cough.",concepts:["Irritant exposure","Ventilation","Workplace safety"],questions:["What might the fumes contain?","How should exposure be managed?","When leave and seek care?"],discussion:"Strong chemicals can irritate airways; ventilation, correct PPE and following safety data sheets reduce risk. Acute burning with breathlessness requires leaving the area and medical review. This scenario is educational.",safety:"Breathlessness, throat swelling or wheeze after exposure needs urgent care.",lessons:["Ventilate when using chemicals","Use appropriate PPE","Acute irritation needs assessment"]},{id:14,title:"Wanting to quit smoking",scenario:"George, 50, has smoked for 30 years and wants to quit after a coughing spell. He worries he 'lacks willpower'.",concepts:["Nicotine addiction","Non-stigmatising support","Cessation options"],questions:["Why is quitting hard?","What supports success?","How to approach relapses?"],discussion:"Nicotine is highly addictive; quitting is difficult and relapse is common. Judgement-free counselling and approved aids improve success. This book points to local cessation services; it does not prescribe. George's cough should also be reviewed.",safety:"Coughing blood or breathlessness needs medical evaluation.",lessons:["Addiction is not a willpower failure","Support improves outcomes","Get symptoms checked"]},{id:15,title:"A family learning infection prevention",scenario:"The Okonkwos want to protect their newborn during flu season and are unsure about masks, vaccines and visitors.",concepts:["Vaccination","Hygiene and ventilation","Protecting infants"],questions:["What prevention layers help?","How to decide on visitors?","Where to find local guidance?"],discussion:"Layered measures — hand hygiene, ventilation, vaccination per schedule, and cautious visiting during outbreaks — reduce risk. Local public-health guidance specifies current advice. This is educational; follow clinicians for the baby's care.",safety:"Infant breathing difficulty, poor feeding or blue lips is an emergency.",lessons:["Layered prevention works","Local guidance varies","Protect the vulnerable"]},{id:16,title:"Persistent cough",scenario:"Elena, 60, has coughed for six weeks, sometimes with mild breathlessness, but feels otherwise well.",concepts:["Chronic cough","When to investigate","Red-flag symptoms"],questions:["Why is duration important?","What features are concerning?","What might a clinician check?"],discussion:"A cough beyond three weeks is 'chronic' and warrants assessment to exclude asthma, reflux, post-viral cough or other causes. Smoking history and blood in sputum are red flags. This scenario is not a diagnosis.",safety:"Coughing blood or breathlessness at rest needs urgent care.",lessons:["Duration guides action","Red flags need review","Don't ignore chronic cough"]},{id:17,title:"Supporting someone with COPD",scenario:"Carlos cares for his mother with COPD; she gets breathless doing dishes and avoids activity, becoming weaker.",concepts:["COPD management","Activity and rehab","Caregiver support"],questions:["Why does avoiding activity backfire?","How can activity be safely maintained?","What supports caregivers?"],discussion:"Gradual, paced activity and pulmonary rehabilitation help maintain function; complete avoidance leads to deconditioning. Caregivers also need support and information. This is educational; her clinician directs her plan.",safety:"Sudden severe breathlessness or blue lips is an emergency.",lessons:["Stay active within limits","Rehab helps","Caregivers need support"]},{id:18,title:"Confused about inhaler categories",scenario:"Wei uses two inhalers but isn't sure which is the reliever and which the preventer, and sometimes skips one.",concepts:["Reliever vs preventer","Inhaler technique","Adherence"],questions:["Why are the two different?","How does technique affect delivery?","What to ask the pharmacist?"],discussion:"Relievers open airways quickly; preventers reduce inflammation and are used daily. Skipping preventers worsens control. A pharmacist or clinician can demonstrate technique and clarify each device. This is educational, not dosing advice.",safety:"Severe attack not responding to reliever is an emergency.",lessons:["Know your two inhaler types","Technique matters","Ask clinicians to demonstrate"]},{id:19,title:"Sudden severe breathlessness",scenario:"During a long flight, Anita, 55, suddenly feels sharp chest pain and severe breathlessness and is anxious.",concepts:["Pulmonary embolism risk","Emergency recognition","Immobility"],questions:["What features are concerning?","Why might immobility matter?","What should happen immediately?"],discussion:"Sudden breathlessness with chest pain after immobility can signal a pulmonary embolism — a potential emergency. This scenario teaches recognition; only clinicians diagnose. Immediate emergency assessment is required.",safety:"Call emergency services at once; do not wait or self-treat.",lessons:["Sudden breathlessness can be serious","Immobility raises clot risk","Act fast, seek emergency care"]},{id:20,title:"Unverified lung-detox supplements",scenario:"Omar sees online ads for 'lung detox' teas and pills promising to cleanse his smoker's lungs and buys them instead of seeing a doctor about his cough.",concepts:["Unproven remedies","Marketing claims","Delayed care"],questions:["What does evidence say about 'detox'?","What is the risk of delay?","What is a safer step?"],discussion:"No supplement or tea has been shown to detox or reverse lung damage. Relying on them can delay diagnosis of serious causes of cough. A clinician evaluation is the safe step. This scenario warns against unverified claims.",safety:"Persistent cough, blood or breathlessness needs medical review; don't delay care for remedies.",lessons:["'Detox' claims lack evidence","Delay can be harmful","See a clinician for symptoms"]}],_h=[{id:1,title:"Respiratory Health Learning Assessment",purpose:"Reflect on what you have learned and identify areas to revisit.",fields:[{label:"Three things I have learned",type:"area"},{label:"One concept I want to understand better",type:"text"},{label:"I can explain the difference between breathing and gas exchange",type:"check"},{label:"Questions I still have",type:"area"}],note:"This is a self-reflection tool, not a test or diagnosis."},{id:2,title:"Household Air-Quality Checklist",purpose:"Spot simple improvements for the air where you live.",fields:[{label:"No indoor smoking",type:"check"},{label:"Kitchen and bathroom ventilated during use",type:"check"},{label:"No visible mould; leaks repaired",type:"check"},{label:"Chemicals stored and used safely",type:"check"},{label:"Notes on what to improve",type:"area"}],note:"Affordable steps help most; structural repairs may need landlord or authority support."},{id:3,title:"Indoor Ventilation Observation Sheet",purpose:"Track when and how you ventilate your home.",fields:[{label:"Date",type:"text"},{label:"How long windows/extractor were used",type:"text"},{label:"Outdoor air quality that day (if known)",type:"text"},{label:"Any stuffiness or odour noticed",type:"text"}],note:"Ventilate when outdoor air is acceptable; avoid opening windows on high-smoke days."},{id:4,title:"Outdoor Air-Quality Awareness Log",purpose:"Connect symptoms and activities to local air quality.",fields:[{label:"Date and location",type:"text"},{label:"Local AQI or pollution level (if available)",type:"text"},{label:"Activity (e.g., walking near traffic)",type:"text"},{label:"Any breathing symptoms noticed",type:"text"}],note:"Use official local sources for air-quality data; this log is for awareness only."},{id:5,title:"Respiratory Symptom Discussion Preparation",purpose:"Organise your observations before a clinical appointment.",fields:[{label:"Main symptom and when it started",type:"area"},{label:"What makes it better or worse",type:"text"},{label:"Associated symptoms (fever, weight loss, etc.)",type:"area"},{label:"Questions for the clinician",type:"area"}],note:"This supports communication; it does not diagnose any condition."},{id:6,title:"Medical Appointment Preparation Worksheet",purpose:"Make the most of your healthcare visit.",fields:[{label:"Reason for the visit",type:"text"},{label:"Current medicines and inhalers (names)",type:"area"},{label:"Symptoms timeline",type:"area"},{label:"Top three questions to ask",type:"area"}],note:"Bring this, not sensitive records, to shared devices."},{id:7,title:"Respiratory Terminology Revision Sheet",purpose:"Practise key terms from the glossary.",fields:[{label:"Define: ventilation",type:"text"},{label:"Define: gas exchange",type:"text"},{label:"Define: surfactant",type:"text"},{label:"Define: V/Q matching",type:"text"}],note:"Use the in-app glossary to check your answers."},{id:8,title:"Smoking Cessation Conversation Planner",purpose:"Prepare a supportive conversation about quitting.",fields:[{label:"Person I want to support",type:"text"},{label:"Supportive points to share (non-judgemental)",type:"area"},{label:"Local cessation services to mention",type:"text"},{label:"What I will avoid saying",type:"area"}],note:"Approach with empathy; addiction is not a willpower failure."},{id:9,title:"Workplace Exposure Awareness Ch
