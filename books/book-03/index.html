n temperate climates as a fresh herb and for the dried flake market.",hist:"Used in ancient Greek and Roman cultures, with early uses that included garlands. It became a core herb of French, Middle Eastern, Eastern European and Italian cookery.",flav:"Green, clean and slightly peppery with a mild bitter edge; flat-leaf has a more pronounced flavour than curly.",uses:"Tabbouleh, chimichurri, salsa verde, gremolata, soups, stocks, stews, potato dishes and garnish.",prep:"Wash and dry thoroughly. Chop the leaves finely just before use; the stems are flavourful and good in stocks.",forms:"Fresh is vivid and green. Dried parsley is very mild and mostly adds colour.",best:"As a fresh finishing herb in large amounts, or the stems in stock.",store:"Treat like cut flowers: stems in water, loosely covered, in the fridge for several days.",subs:"Chervil, coriander leaf or celery leaves, depending on the dish.",safe:"Culinary amounts are widely eaten. Parsley belongs to Apiaceae; people with celery or mugwort-type allergies sometimes report cross-reactions. Concentrated parsley seed oil is not a food.",myth:"Parsley is only a garnish. In many cuisines it is the main ingredient of a dish.",pairs:["lemon","garlic","bulgur","potato","fish","eggs"]},{id:"coriander-leaf",n:"Coriander leaves",ch:5,g:"frond",c:"#3d9140",alt:"Cilantro (North America, Mexico); coriander (UK, Ireland, Australia, India); Chinese parsley; dhania (Hindi); pak chi (Thai)",bot:"Coriandrum sativum",fam:"Apiaceae",part:"Leaves, tender stems and roots (the seed is a separate spice)",desc:"An annual with lower broad, lobed leaves and upper feathery leaves; it bolts quickly in heat, producing the flowers and seeds that become coriander seed.",nat:"Southern Europe, North Africa and southwestern Asia.",cult:"Grown on every inhabited continent; India is one of the largest producers of both leaf and seed.",hist:"Seeds appear in very early archaeological records in the eastern Mediterranean region; leaf use is strongly associated with Mexican, Indian, Thai, Vietnamese and Chinese cooking.",flav:"Fresh, citrusy and green. A proportion of people perceive a soapy taste; research has linked this partly to genetic variation in smell receptors.",uses:"Salsas, chutneys, curries, dals, noodle soups, tacos, salads and rice dishes. Roots and stems are pounded into Thai curry pastes.",prep:"Wash and chop stems and leaves; add stems early, leaves late.",forms:"Fresh is the principal form. Dried leaf loses most of its aroma. Frozen leaf is a better compromise.",best:"Raw or added as the last stage of cooking.",store:"Stems in a jar of water with a loose bag over the top in the fridge, or wrap in damp paper.",subs:"Flat-leaf parsley with lime zest; culantro (Eryngium foetidum) where available for cooked dishes; Thai basil in some Southeast Asian dishes.",safe:"Cross-reactivity in people with allergies to mugwort, celery or other Apiaceae has been reported. Rinse well; fresh herbs have been involved in foodborne outbreaks.",myth:"Cilantro and coriander are different plants. They are the same plant: the name varies by country.",pairs:["lime","chilli","avocado","cumin","tomato","coconut"]},{id:"spearmint",n:"Spearmint",ch:5,g:"sprig",c:"#4a9d52",alt:"Garden mint; nana (Arabic, many regions); pudina (Hindi); menta verde (Spanish)",bot:"Mentha spicata",fam:"Lamiaceae",part:"Leaves",desc:"A spreading perennial with crinkled to smooth, pointed, bright green leaves and square stems. It forms runners and can become invasive in a garden bed, so many cooks grow it in pots.",nat:"Europe and western Asia; the species is of hybrid origin in the wider mint complex.",cult:"Widely grown in temperate climates; also an important crop for flavouring oil production (a non-culinary product).",hist:"A traditional herb in the Middle East, North Africa, Europe and South Asia, as in Moroccan tea, British mint sauce and Indian chutney.",flav:"Sweet, cool and herbaceous; less sharp than peppermint because it contains carvone as a major aroma compound rather than much menthol.",uses:"Tea and infusions, yogurt sauces, tabbouleh, chutneys, peas, lamb dishes, fruit salads and drinks.",prep:"Tear or finely slice; bruise lightly for drinks. Use whole sprigs for infusions.",forms:"Fresh is best for sauces and salads. Dried mint is a distinct ingredient with warm, hay-like notes used in Middle Eastern, Turkish and Iranian cooking.",best:"Raw or very briefly warmed; also as dried mint in finishing butter or oil for soups.",store:"Stems in water or wrapped in damp paper in the fridge. Dry in small bunches in a ventilated place.",subs:"Peppermint (use less), basil or fresh parsley with lemon zest.",safe:"Culinary amounts are widely eaten. Mint can aggravate heartburn in some people.",myth:"All mints taste the same. Spearmint, peppermint, apple mint and others differ in chemistry and flavour.",pairs:["yogurt","peas","lamb","cucumber","lemon","chocolate"]},{id:"peppermint",n:"Peppermint",ch:5,g:"sprig",c:"#2c8c68",alt:"Menta piperita (Italian); Pfefferminze (German); menthe poivrée (French)",bot:"Mentha × piperita",fam:"Lamiaceae",syn:"Hybrid of M. aquatica × M. spicata",part:"Leaves",desc:"A sterile hybrid mint with dark green, often purple-tinged stems and leaves with a strongly cooling aroma. It is propagated by cuttings or runners, not true seed.",nat:"Hybrid of garden origin in Europe; not found as a stable wild species.",cult:"Grown commercially in the USA, India and parts of Europe, mostly for oil used in confectionery, toothpaste and flavouring.",hist:"Described in botanical writings of the 17th century in England; popular in confectionery, tea and later toothpaste.",flav:"Pronounced menthol-driven cooling and a sweet-minty finish; the cooling effect is a sensory response rather than an actual temperature change.",uses:"Teas and infusions, desserts, chocolate, drinks, and sparingly in savoury sauces.",prep:"Steep whole or torn leaves in hot water; bruise lightly for cold drinks.",forms:"Fresh leaves are bright; dried leaves are the usual form for tea. Peppermint oil is a concentrated product, not a substitute for leaves.",best:"Infusions, desserts and drinks.",store:"Same as spearmint. Store dried leaf in an airtight container away from light.",subs:"Spearmint (milder) or a small amount of fresh mint with lemon balm.",safe:"Peppermint tea and leaf are commonly consumed. Peppermint oil is concentrated; NCCIH notes that oil products can cause side effects and should not be used without advice, and essential oils should not be swallowed in cooking. Menthol-containing products are not recommended for the faces of young children.",ev:"Peppermint oil capsules (not culinary leaf) have been studied for irritable bowel syndrome in human trials. This is a supplement product and is outside ordinary cooking.",myth:"Peppermint oil and peppermint tea have the same effects and safety profile. They are chemically and practically very different.",pairs:["chocolate","lemon","green tea","melon","cucumber"]},{id:"dill",n:"Dill",ch:5,g:"frond",c:"#58a05a",alt:"Aneth (French); Dill (German); shibint (Arabic); sowa (Hindi); kopr (Czech/Russian)",bot:"Anethum graveolens",fam:"Apiaceae",part:"Leaves ('dill weed'), flower heads and seeds",desc:"A tall annual with very fine, thread-like leaves and umbels of tiny yellow flowers that develop into flat, oval seeds.",nat:"Southwestern Asia and the Mediterranean region, though precise native distribution is uncertain.",cult:"Grown widely in temperate climates, with notable use in northern, central and eastern Europe, Russia, Iran and India (where it is called sowa or shepu).",hist:"Archaeological and historical records show cultivation in the ancient Mediterranean and Middle East. It features in Scandinavian, Eastern European, Persian and Indian cuisines.",flav:"Fresh, grassy and sweet with anise-like and slightly citrus notes; seed is warmer and more caraway-like.",uses:"Gravlax, pickles, yogurt sauces, potato salads, soups, eg um vulgare",fam:"Lamiaceae",syn:"Greek oregano is often sold as Origanum vulgare subsp. hirtum",part:"Leaves and flowering tops",desc:"A hardy perennial with oval, slightly hairy leaves and clusters of pink-purple flowers. Strength of flavour varies with subspecies and growing conditions.",nat:"Europe, western and central Asia and the Mediterranean region.",cult:"Grown commercially in Turkey, Greece, Italy, Mexico and elsewhere; some dried 'oregano' on the market comes from different species altogether.",hist:"Integral to Greek, southern Italian and wider Mediterranean cooking; the pizza association grew in the 20th century.",flav:"Warm, peppery and earthy with slightly bitter and minty notes; dried is typically more intense than fresh.",uses:"Pizza, tomato sauces, grilled meat and vegetables, Greek salad, marinades and bean dishes.",prep:"Crumble dried oregano in the palm to release aroma. Add dried early, fresh later.",forms:"Dried oregano is one of the few herbs that many cooks prefer to fresh; fresh is milder and sweeter.",best:"Tomato-based dishes, roasting, and marinades.",store:"Dried: airtight, away from heat and light; fresh: damp paper in the fridge.",subs:"Marjoram (milder), thyme, or Mexican oregano for Latin American dishes.",safe:"Culinary use is common. Oregano oil supplements are concentrated products and fall outside the normal food use discussed here.",myth:"'Oregano' always refers to one plant. Several unrelated plants share the name (see Mexican oregano).",pairs:["tomato","feta","lamb","lemon","olives","aubergine/eggplant"]},{id:"sage",n:"Sage",ch:5,g:"leaf",c:"#7f9a86",alt:"Salbei (German); salvia (Italian/Spanish); sauge (French); common sage; garden sage",bot:"Salvia officinalis",fam:"Lamiaceae",part:"Leaves",desc:"A woody perennial subshrub with soft, grey-green, textured leaves and spikes of blue-violet flowers. Purple, tricolour and golden forms exist.",nat:"The northern Mediterranean region, especially the Balkans.",cult:"Grown across Europe and North America, with significant production in Albania, the Balkans and Turkey.",hist:"Widely used in Italian, British and Balkan cooking, and in North American stuffing.",flav:"Musky, warm, camphoraceous and slightly peppery; it is strong and can dominate.",uses:"Brown butter sage sauces, stuffing, sausages, pasta fillings, roast poultry and pork, and bean dishes.",prep:"Fry whole leaves in butter or oil until crisp to tame the intensity; chop sparingly.",forms:"Fresh is milder and softer. Dried rubbed sage is concentrated and quickly becomes overpowering.",best:"Fat-rich dishes such as butter sauces and sausages.",store:"Fresh: damp paper in the fridge. Dried: airtight, avoid ground sage which fades quickly.",subs:"Poultry seasoning blends, thyme with a little rosemary, or marjoram.",safe:"Culinary use is common. Some sage species and essential oils contain thujone, a compound limited in some regulations; sage tea and oils are concentrated preparations, and pregnant or breastfeeding readers should ask a health professional about herbal teas and supplements.",myth:"All Salvia species are culinary sage. Many are ornamental or have different compositions; only use identified culinary sage.",pairs:["butter","pumpkin","pork","onion","beans","apple"]},{id:"bay-laurel",n:"Bay laurel",ch:5,g:"leaf",c:"#527a47",alt:"Bay leaf; sweet bay; Lorbeer (German); laurier (French); alloro (Italian); laurel (Spanish)",bot:"Laurus nobilis",fam:"Lauraceae",syn:"Not the same as Indian bay leaf (tej patta; Cinnamomum tamala) or California bay (Umbellularia californica)",part:"Leaves",desc:"An evergreen tree or large shrub with glossy, leathery, aromatic leaves and small yellow flowers followed by dark berries.",nat:"The Mediterranean region.",cult:"Grown in southern Europe, Turkey and widely in gardens; Turkey is a major source of the dried leaf traded internationally.",hist:"Associated with ancient Greek and Roman culture (laurel wreaths) and long used in Mediterranean cooking.",flav:"Subtle: herbal, floral and slightly eucalyptus-like; best appreciated in long-cooked dishes.",uses:"Stocks, soups, stews, braises, rice, beans, pickling brines and béchamel infusion.",prep:"Add whole, dried leaves and remove before serving; leaves are sharp-edged and tough to chew.",forms:"Dried bay is the standard; fresh bay is milder at first and can be bitter. Ground bay is uncommon.",best:"Slow simmered liquids; the flavour develops gradually.",store:"Whole dried leaves keep their aroma well when stored airtight and dark.",subs:"Thyme and a little parsley, or a small piece of dried tej patta (different flavour).",safe:"Whole leaves are not meant to be eaten and could cause choking or injury; remove them. Do not use other 'laurel' plants (such as cherry laurel or mountain laurel) which can be toxic.",myth:"Eating the bay leaf is harmful because it is poisonous. The real concern is the leaf's stiffness; and the real danger is mistaking toxic laurel-like plants.",pairs:["beans","tomato","rice","chicken stock","milk (infused)"]},{id:"tarragon",n:"Tarragon",ch:5,g:"blade",c:"#5f9a4a",alt:"Estragon (French/German); dragoncello (Italian); French tarragon; Russian tarragon is a different, weaker type",bot:"Artemisia dracunculus",fam:"Asteraceae (daisy family)",part:"Leaves",desc:"A perennial with narrow, smooth, dark green leaves. French tarragon is grown from cuttings; Russian tarragon (A. dracunculus var. inodora) produces seed but has a much weaker flavour.",nat:"Parts of Eurasia and North America.",cult:"French tarragon is grown in Europe and the USA for culinary use.",hist:"A characteristic herb in French classical cooking, as in béarnaise sauce.",flav:"Anise-like and slightly sweet with a hint of vanilla and a gentle bitter edge.",uses:"Béarnaise, chicken dishes, eggs, vinaigrettes, fish, and fines herbes.",prep:"Strip leaves and chop gently; add near the end of cooking.",forms:"Fresh is much better; dried tarragon is thin and grassy.",best:"Cream, butter and egg-based sauces; tarragon vinegar.",store:"Damp paper in the fridge; infuse in vinegar for a shelf-stable use.",subs:"Fennel fronds with a little parsley, or chervil.",safe:"Asteraceae allergy (ragweed, mugwort, chamomile) can occasionally cross-react. Contains estragole; ordinary culinary use is considered normal, but concentrated extracts are not.",myth:"Russian tarragon is as good as French tarragon. It is much less aromatic.",pairs:["chicken","eggs","mustard","cream","asparagus","white wine vinegar"]},{id:"lemongrass",n:"Lemongrass",ch:5,g:"blade",c:"#9bb342",alt:"Serai (Malay/Indonesian); takrai (Thai); sả (Vietnamese); West Indian lemongrass",bot:"Cymbopogon citratus",fam:"Poaceae (grass family)",part:"Lower leaf bases (stalks) and leaves",desc:"A tall, clump-forming tropical grass with long blades and a pale, bulb-like, fibrous base. The tender inner portion of the lower stalk is the main culinary part.",nat:"Likely tropical Asia; as a long-cultivated plant its native range is uncertain.",cult:"Grown across tropical and subtropical Asia, Africa and the Americas; also grown for lemony oil (a non-food product).",hist:"A staple of Southeast Asian cuisines such as Thai, Vietnamese, Indonesian and Malaysian, and also used in parts of Africa and the Caribbean.",flav:"Lemony, floral and green; its citral aroma has citrus notes with no acidity.",uses:"Soups such as tom yum, curry pastes, marinades, stir-fries, teas and syrups.",prep:"Trim, remove the dry outer layers, bruise the stalk, and either finely slice the tender core or add whole and remove it later.",forms:"Fresh and frozen are good; dried pieces suit infusions; pastes are convenient but vary.",best:"Simmered broths, pastes and infusions; the tough stalk is not eaten in large pieces.",store:"Wrap in the fridge for a couple of weeks or freeze whole or sliced.",subs:"Lemon zest with a little lime leaf; lemon verbena for infusions.",safe:"Culinary use is common. Lemongrass oil is concentrated and not for consumption.",myth:"Lemongrass tastes sour. It is aromatic rather than acidic.",pairs:["coconut milk","ginger","galangal","chilli","lime leaf","fish"]},{id:"curry-leaf",n:"Curry leaves",ch:5,g:"sprig",c:"#2e6b35",alt:"Kadi patta (Hindi); karuvepilai (Tamil); kari pata; Not the 'curry plant' (Helichrysum italicum)",bot:"Bergera koenigii",fam:"Rutaceae (citrus family)",syn:"Murraya koenigii (widely used older name)",part:"Leaves",desc:"A small tree or shrub with pinnate leaves made up of many glossy leaflets and clusters of small white flowers followed by small black fruits.",nat:"India and Sri Lanka, with a wider distribution into parts of Asia.",cult:"Grown across South and Southeast Asia and in countries with Indian diaspora communities.",hist:"A foundation of southern Indian and Sri Lankan cooking, tempered in oil at the start of many dishes.",flav:"Citrusy, nutty and slightly smoky and pungent with sulphur notes; very different from curry powder.",uses:"Tadka in dals and vegetable dishes, coconut chutney, curries, rice and snack mixes.",prep:"Add whole leaves to hot oil with mustard seed and let sizzle for several seconds. Stand back, because moisture causes spluttering.",forms:"Fresh or frozen retain character; dried leaves are relatively flavourless.",best:"Tempering in hot oil or ghee.",store:"Freeze in a bag; fresh keeps about a week in the fridge in a paper towel.",subs:"No true substitute; use a little lime zest with a pinch of fenugreek and some basil for general brightness.",safe:"Culinary use is traditional. Citrus-family allergens are possible but rare. Not related to curry powder.",myth:"Curry leaves flavour curry powder. Curry powder is a separate blend that usually does not contain them.",pairs:["mustard seeds","coconut","lentils","tamarind","chilli","yogurt"]},{id:"pandan",n:"Pandan",ch:5,g:"blade",c:"#4a9e6a",alt:"Screwpine (English); daun pandan (Malay/Indonesian); bai toei (Thai); lá dứa (Vietnamese); rampe (Sinhala)",bot:"Pandanus amaryllifolius",fam:"Pandanaceae",part:"Leaves",desc:"A tropical plant with long, ribbon-like, fragrant leaves that fan from a short stem. It is mainly propagated vegetatively and rarely flowers.",nat:"Probably Southeast Asia (the Maluku region); the native range is uncertain because it is only known in cultivation.",cult:"Grown across Southeast and South Asia, and in the Pacific and Africa as an ornamental and food plant.",hist:"Used in Southeast Asian desserts and rice dishes for centuries; sometimes called the 'vanilla of Asia' in popular language.",flav:"Sweet, grassy, nutty and floral with a note that resembles basmati rice and warm bread.",uses:"Rice cooked in coconut milk, cakes, jellies, custards, drinks and wrapped chicken.",prep:"Tie leaves in a knot and cook in liquids, or blend with water and strain for green colour and aroma.",forms:"Fresh or frozen are best; extracts and essences vary, and many contain artificial colour or flavour.",best:"Infused into rice, custards and syrups.",store:"Freeze whole leaves; fresh leaves keep about a week in the fridge.",subs:"A few drops of vanilla with a little green tea can mimic the effect; the aroma differs.",safe:"Culinary use is common. Check bottled extracts for colours and allergens.",myth:"Pandan flavour comes from the green colour. Colour and aroma are separate; many commercial products add colour alone.",pairs:["coconut","rice","palm sugar","mango","sticky rice"]},{id:"shiso",n:"Shiso (perilla)",ch:5,g:"leaf",c:"#7a2f6e",alt:"Ooba (green shiso, Japan); akajiso (red shiso); kkaennip (Korean); tía tô (Vietnamese)",bot:"Perilla frutescens var. crispa and var. frutescens",fam:"Lamiaceae",part:"Leaves, flowers and seeds",desc:"An annual mint-family plant with broad, serrated leaves, green or purple-red, flat or ruffled. The Korean 'kkaennip' is generally P. frutescens var. frutescens, a broader-leaved type.",nat:"East Asia, including parts of China, Japan and the Himalayas.",cult:"Grown in Japan, Korea, China and Vietnam, and increasingly in home gardens elsewhere.",hist:"A traditional ingredient in Japanese, Korean and Vietnamese cooking; red shiso colours umeboshi (pickled plums).",flav:"Complex and minty-herbal with notes of cinnamon, citrus, anise and basil; red shiso is more astringent.",uses:"Sushi and sashimi garnish, tempura, rice, pickles, wraps, salads and drinks.",prep:"Pick leaves, rinse and pat dry, then shred or use whole; add at the end.",forms:"Fresh is standard; dried shiso seasoning (such as in furikake) is mild.",best:"Raw or used as a wrapper.",store:"Wrap in damp paper or stand in water in the fridge; leaves bruise easily.",subs:"A mixture of basil, mint and a little cinnamon-leaf or coriander leaf.",safe:"Perilla seed oil is a separate product. Occasional allergies to Lamiaceae plants are reported.",myth:"Shiso is Japanese mint. It is related to mint but is a different genus.",pairs:["rice","plum","sesame","cucumber","ginger","fish"]}],cg=[{id:"ginger",n:"Ginger",ch:6,g:"rhizome",c:"#c9a15a",alt:"Adrak (Hindi); jahe (Indonesian); shōga (Japanese); sheng jiang (Chinese, fresh); zanjabil (Arabic)",bot:"Zingiber officinale",fam:"Zingiberaceae (ginger family)",part:"Rhizome (underground stem)",desc:"A perennial reed-like plant to about 1 m tall, growing from thick, knobbly, branching rhizomes with pale yellow flesh. It is grown from pieces of rhizome, and rarely sets seed.",nat:"Likely tropical Asia; as an ancient cultigen its wild ancestor is not established with certainty.",cult:"India, China, Nepal, Nigeria, Indonesia and Thailand are among the principal producers; young 'spring' ginger is harvested early.",hist:"Traded between Asia and the Mediterranean for over two millennia and widely used in Asian, African, Caribbean and European cooking; gingerbread traditions developed in medieval Europe.",flav:"Fresh: bright, citrusy and spicy-hot with a clean heat from gingerols. Dried: warmer, deeper and less citrusy, as heat converts gingerols to the sharper shogaols.",uses:"Stir-fries, curries, stocks, pickles, drinks, baking, marinades, dals and desserts.",prep:"Scrape off skin with a spoon, then slice, mince, grate or pound. Slice across the fibres for tenderness; grate for even flavour.",forms:"Fresh (mature or young), dried slices, ground, crystallised, pickled (such as Japanese gari) and juiced. Ground ginger is not interchangeable 1:1 with fresh.",best:"Added early with garlic for depth, or at the end for brightness.",store:"Unpeeled in the fridge in a paper bag, or freeze whole and grate from frozen.",subs:"Galangal for Southeast Asian dishes (different flavour); ground ginger, about a quarter of the volume of fresh.",safe:"Culinary amounts are widely consumed. Concentrated supplements are different; NCCIH notes possible interactions and cautions, so people on blood-thinning medicines or with gallstones should ask a health professional about supplements.",ev:"Human trials have studied ginger for nausea (including in pregnancy), but results are mixed and mostly use measured supplement doses rather than meal quantities. NCCIH summarises the research and cautions.",myth:"Ginger is a root. Botanically it is a rhizome, although it is used like a root.",pairs:["garlic","lemon","soy sauce","carrot","pear","chilli","honey"]},{id:"turmeric",n:"Turmeric",ch:6,g:"rhizome",c:"#e09a0e",alt:"Haldi (Hindi); kunyit (Malay/Indonesian); khamin (Thai); ukon (Japanese); yellow ginger",bot:"Curcuma longa",fam:"Zingiberaceae",part:"Rhizome",desc:"A large-leaved perennial growing from orange-fleshed rhizomes with short side fingers. The flowers are borne in a cone-like spike.",nat:"Southern Asia; wild populations of the plant are not clearly known, and it is a long-cultivated crop.",cult:"India produces and consumes most of the world's turmeric; also grown in Bangladesh, Myanmar, China, Indonesia and parts of the Caribbean and Africa.",hist:"Used in South Asian and Southeast Asian cooking and as a dye and ritual material in many communities for centuries.",flav:"Earthy, warm, slightly bitter and peppery with a mustard-like note; very staining.",uses:"Curries, dals, rice, pickles, golden milk beverages, vegetable dishes and as a natural yellow colour.",prep:"Fresh: peel (wear gloves) and grate or slice. Ground: fry in oil briefly, but do not scorch it.",forms:"Ground (dried and powdered rhizome) is standard; fresh rhizome tastes brighter and more floral. Curcumin extract is a concentrated product, not a spice.",best:"Bloomed in oil at the start of cooking; fat helps carry the colour and flavour.",store:"Ground: airtight, dark. Fresh: wrap in paper in the fridge or freeze.",subs:"A pinch of saffron for colour only (with a different flavour), or annatto/paprika for colour; mild mustard for slight earthiness.",safe:"Culinary use is common. Concentrated turmeric and curcumin supplements have been associated with rare liver injury (see NCCIH and LiverTox). Adulteration with lead chromate pigment has been documented in some South Asian markets.",ev:"Laboratory studies of curcumin are extensive; well-designed human trials have generally been small or inconsistent. Curcumin is poorly absorbed from food, and findings on supplements should not be applied to cooking.",myth:"Adding turmeric to meals delivers the doses used in studies. Trials typically use concentrated extracts.",pairs:["black pepper","ginger","coconut milk","cauliflower","lentils","rice"]},{id:"galangal",n:"Galangal",ch:6,g:"rhizome",c:"#d9c28c",alt:"Greater galangal: kha (Thai), lengkuas/laos (Malay/Indonesian), riềng (Vietnamese); lesser galangal is Alpinia officinarum",bot:"Alpinia galanga",fam:"Zingiberaceae",part:"Rhizome",desc:"A tall, leafy perennial with creamy-pink to yellowish rhizomes marked with dark rings. The flesh is firm, fibrous and woody when mature.",nat:"Likely Southeast Asia and possibly southern China; origin is uncertain.",cult:"Grown in Thailand, Indonesia, Malaysia and elsewhere in Southeast Asia and South Asia.",hist:"A staple in Thai, Malay, Indonesian and Vietnamese cookery for generations.",flav:"Piney, citrusy, camphor-like and sharp with a less sweet, more resinous character than ginger.",uses:"Tom kha soup, curry pastes, rendang, satay marinades, sambals.",prep:"Peel, slice thinly across the grain, then pound or blend. Mature rhizomes are very hard.",forms:"Fresh, frozen and brined are common; dried slices and powder are weaker.",best:"Pounded in pastes and simmered in coconut-based broths.",store:"Freeze sliced or whole; fresh keeps for a couple of weeks in the fridge.",subs:"Fresh ginger plus a squeeze of lime juice, though the flavour is different.",safe:"Culinary use is traditional. Because ginger-family names are confusing, check 'galangal' on labels refers to Alpinia.",myth:"Galangal and ginger are interchangeable. They taste distinct and behave differently in a dish.",pairs:["lemongrass","coconut milk","lime leaf","chilli","chicken","mushrooms"]},{id:"garlic",n:"Garlic",ch:6,g:"bulb",c:"#e8dcc4",alt:"Ail (French); Knoblauch (German); ajo (Spanish); aglio (Italian); lahsun (Hindi); suan (Chinese)",bot:"Allium sativum",fam:"Amaryllidaceae (Allioideae)",part:"Bulb (made of cloves) and sometimes scapes, leaves",desc:"A bulbous perennial grown as an annual. The bulb is composed of several cloves in a papery wrapper. Hardneck types produce a flowering scape; softneck types are better for braiding and storage.",nat:"Central Asia, probably.",cult:"China is the largest producer by far, followed by India and others; garlic is grown in temperate and subtropical areas.",hist:"Appears in written records of ancient civilisations across the Near East, Egypt, Asia and Mediterranean; cooking applications now span nearly every cuisine.",flav:"Whole or uncut garlic is mild. Crushing triggers an enzyme to form allicin, which then breaks down to a range of sulphur compounds; the sensation is pungent. Cooking mellows and sweetens it.",uses:"Nearly everywhere: sauces, soups, marinades, roasting whole, aioli, stir-fries.",prep:"Whole: gentle. Sliced: moderate. Crushed or minced: sharp. Roasting turns it soft and sweet. Burnt garlic turns bitter.",forms:"Fresh bulbs, scapes, black (aged) garlic, dried flakes, granules and powder. Garlic in oil has a botulism risk when kept at room temperature.",best:"Early in the cooking, over gentle heat; raw only when a pungent bite is wanted.",store:"Keep whole bulbs in a cool, dry, ventilated place; don't refrigerate for long. Never store homemade garlic-in-oil at room temperature.",subs:"Garlic chives or garlic powder (about 1/8 tsp per clove); asafoetida in some vegetarian traditions.",safe:"Garlic allergy is uncommon but real. Garlic supplements may interact with some medicines (see NCCIH). Garlic in oil needs refrigeration and short storage because of Clostridium botulinum risk. Can be toxic to dogs and cats.",ev:"Research on garlic and health mostly uses supplements; observations about whole garlic in diet are mixed. NCCIH summarises the evidence.",myth:"Letting crushed garlic rest is pointless. Resting briefly helps allicin form before heat deactivates the enzyme.",pairs:["olive oil","ginger","tomato","lemon","parsley","chilli"]},{id:"onion",n:"Onion",ch:6,g:"bulb",c:"#c47a4a",alt:"Oignon (French); Zwiebel (German); cebolla (Spanish); cipolla (Italian); pyaz (Hindi)",bot:"Allium cepa",fam:"Amaryllidaceae (Allioideae)",part:"Bulb (layers of swollen leaf bases); also green onions and leaves",desc:"A biennial usually grown as an annual, forming a bulb of concentric fleshy layers. Colours include yellow, white and red; flavours range from pungent to sweet.",nat:"Central Asia, probably; wild ancestors are not confirmed.",cult:"One of the most widely produced vegetables on Earth; grown in many climates with types suited to different day lengths.",hist:"A staple across almost every cuisine and among the oldest cultivated alliums.",flav:"Raw: sharp and sulphurous, which makes eyes water. Cooked: sweet, savoury and rounded; brown onions bring deep umami.",uses:"Bases of soups, stews, curries and sauces; raw in salads and salsas; caramelised; pickled.",prep:"Chilling before cutting reduces tear-inducing compounds. A sharp knife helps. Soak raw slices in water to soften bite.",forms:"Fresh, dried flakes and powder, fried onions, pickled and spring onions (scallions).",best:"Slowly sweated for base flavour; seared high for char.",store:"Dry bulbs: cool, dry, dark and ventilated; away from potatoes. Cut onion: covered in the fridge for a few days.",subs:"Shallots, leeks, spring onions, or onion powder.",safe:"Food allergy and intolerance to onions occur. Onions are toxic to dogs and cats.",myth:"Cut onions absorb bacteria. This is a persistent myth with no scientific support.",pairs:["garlic","thyme","tomato","cumin","bay leaf","vinegar (in pickles)"]},{id:"shallot",n:"Shallot",ch:6,g:"bulb",c:"#b86d63",alt:"Échalote (French); schalotte (German); eschalot; bawang merah (Indonesian/Malay); sambar onion is a small variant in South India",bot:"Allium cepa Aggregatum Group",fam:"Amaryllidaceae",syn:"Allium ascalonicum (older name, now generally treated as part of A. cepa)",part:"Bulb (clustered)",desc:"A group of onion cultivars that form clusters of small elongated bulbs with copper to pink-grey skin. Some are grown from bulbs rather than seed.",nat:"As with onion, cultivated for so long that a wild origin is uncertain.",cult:"Grown in France, the Netherlands, Southeast Asia, India and elsewhere.",hist:"Valued in French cooking and fundamental in Southeast Asian cookery as fried shallots.",flav:"Sweeter, more delicate and slightly garlicky; less harsh than an onion.",uses:"Vinaigrettes, sauces, pan sauces, fried shallots for topping and Southeast Asian curry pastes.",prep:"Peel; mince finely for raw; slice and fry until golden for crisp shallots.",forms:"Fresh, fried (sold in tubs), pickled and powdered.",best:"Gently cooked in butter or fried until crisp.",store:"Cool, dry and dark; keeps well for months in good conditions.",subs:"Mild onion with a little garlic.",safe:"Same as onion; toxic to dogs and cats. Store fried shallots dry to avoid rancidity.",myth:"Shallots are baby onions. They are a distinct cultivar group, not immature onions.",pairs:["wine","butter","tarragon","mustard","tamarind"]},{id:"horseradish",n:"Horseradish",ch:6,g:"root",c:"#e7dfc9",alt:"Raifort (French); Meerrettich/Kren (German/Austrian); chren (Slavic languages); wasabi is a different plant",bot:"Armoracia rusticana",fam:"Brassicaceae (cabbage family)",part:"Root (taproot)",desc:"A hardy perennial with large, coarse leaves and a thick, pale taproot. Stems and shoots grow from root fragments left in the soil.",nat:"Southeastern Europe and western Asia.",cult:"Grown in Central and Eastern Europe, Germany, the USA and the UK.",hist:"Used in Central and Eastern European Jewish and non-Jewish cooking, for example in roast beef accompaniments and Passover maror, and in British and Scandinavian foods.",flav:"Intense, nose-clearing pungency that comes from isothiocyanates formed when cells are broken; heat fades with time and with cooking.",uses:"Sauces for roast beef and fish, smoked fish, beetroot relish, cocktail sauce and sandwiches.",prep:"Peel and grate in a ventilated area; add vinegar soon after grating to stabilise heat.",forms:"Fresh root, prepared grated horseradish in vinegar, creamed sauces and powder.",best:"Raw, stirred in just before serving.",store:"Whole root in the fridge for a few weeks, or freeze grated portions. Prepared sauce keeps heat for only a limited time after opening.",subs:"Fresh wasabi (rare) or good mustard with a small amount of grated radish.",safe:"May irritate eyes, nose and stomach in large amounts; avoid contact with eyes. Many 'wasabi' pastes outside Japan are made from horseradish and mustard.",myth:"Wasabi tubes are always made from wasabi. Many contain horseradish, mustard and colour.",pairs:["beef","beetroot","smoked fish","cream","apple"]}],dg=[{id:"cumin",n:"Cumin",ch:7,g:"seeds",c:"#a97b3d",alt:"Jeera/zeera (Hindi); kamun (Arabic); comino (Spanish); kreuzkümmel (German); black cumin is usually a different plant",bot:"Cuminum cyminum",fam:"Apiaceae",part:"Dried fruit, usually called seed",desc:"A slender annual to about 30–50 cm with feathery leaves and small white-pink umbels. The 'seed' is a small, elongated dried fruit (a schizocarp half).",nat:"Eastern Mediterranean to Central Asia; the exact origin is debated.",cult:"India is the largest producer and consumer, with others including Syria, Iran, Turkey and China.",hist:"Found in ancient Egyptian and Near Eastern records and central to cooking in South Asia, the Middle East, North Africa and Latin America.",flav:"Warm, earthy, nutty and slightly bitter, with a distinct savoury aroma from cuminaldehyde; toasting deepens it.",uses:"Curries, dals, chilli, tacos, falafel, rice, spice rubs and yogurt dressings.",prep:"Toast whole seeds briefly in a dry pan, then grind. Bloom whole seeds in hot oil for tempering.",forms:"Whole seeds keep aroma for a long time; ground cumin fades faster and is the more common culprit of flat-tasting spice mixes.",best:"Tempered at the start of cooking or toasted and ground for finishing.",store:"Whole in an airtight jar away from light; grind small batches.",subs:"Ground coriander with a pinch of caraway, or smoked paprika for a smoky earthy note.",safe:"Apiaceae allergy possible. Culinary use is common.",myth:"Cumin and black cumin are the same. Black cumin may be Nigella sativa, Bunium persicum or Nigella-like seeds depending on the region.",pairs:["coriander seed","chilli","lentils","carrot","lamb","yogurt"]},{id:"coriander-seed",n:"Coriander seeds",ch:7,g:"seeds",c:"#c4a053",alt:"Dhania (Hindi); kuzbara (Arabic); cilantro seeds (US); coriandre (French)",bot:"Coriandrum sativum",fam:"Apiaceae",part:"Dried fruit (seed) of the same plant that gives coriander leaf",desc:"Round, ridged, beige to light brown fruits about 3–5 mm across that split into two halves. Varieties differ in size and oil content.",nat:"Southern Europe, North Africa and southwest Asia.",cult:"India, Russia, Morocco, Bulgaria and others.",hist:"One of the earliest spices recorded in the eastern Mediterranean and a base of most Indian spice mixes.",flav:"Warm, sweet, citrusy and slightly floral, unlike the fresh leaf; mellow and a good bridge between spices.",uses:"Curry powders, garam masala, pickling spices, sausages, breads and Scandinavian baking, and North African dishes.",prep:"Toast whole until fragrant; crush in a mortar or grind.",forms:"Whole keeps well; ground loses its citrus quickly.",best:"Early in cooking and as the backbone of a spice mixture.",store:"Whole in a sealed jar; grind as needed.",subs:"Cumin with a little lemon zest, or caraway for a different note; fennel seed in small quantities.",safe:"Cross-reaction in people allergic to mugwort or other Apiaceae is documented.",myth:"Seeds taste like the leaves. They taste warmly citrusy and not soapy to most people.",pairs:["cumin","orange","pork","beetroot","cauliflower"]},{id:"fennel-seed",n:"Fennel seeds",ch:7,g:"seeds",c:"#a8b36a",alt:"Saunf (Hindi); shamar (Arabic); finocchio (Italian); Fenchel (German); anise is a different plant (Pimpinella anisum)",bot:"Foeniculum vulgare",fam:"Apiaceae",part:"Dried fruit (seed); the bulb, fronds and pollen are also eaten",desc:"A tall, feathery perennial with yellow umbels. Florence fennel (var. azoricum) forms a swollen leaf base used as a vegetable; common fennel is grown more for seed and fronds.",nat:"The Mediterranean region.",cult:"India, Egypt, Syria, Turkey and others for seed; Italy and Spain for the vegetable.",hist:"Valued in Mediterranean and South Asian traditions; chewed after meals in some South Asian communities as a mouth freshener.",flav:"Sweet, anise-like and slightly camphory, with a fresh green edge. Its main aroma compound is anethole, shared with anise and star anise.",uses:"Italian sausage ing heat.",uses:"Pickles, curries, Moroccan blends, Indian pickling mixes and mulled drinks.",prep:"Grind or crush the spikes; sometimes whole in braises.",forms:"Whole spikes and ground.",best:"Long cooking and pickles.",store:"Airtight, dry place.",subs:"Black pepper with a pinch of cinnamon.",safe:"Culinary amounts are fine. Medicinal preparations have their own cautions.",myth:"Long pepper is just a long peppercorn. It's from a different species.",pairs:["pickles","lamb","root vegetables","cheese","honey"]},{id:"dried-lime",n:"Dried lime (loomi)",ch:8,g:"lime",c:"#8a6a3a",alt:"Loomi, limoo amani (Persian); noomi basra (Iraqi); black lime; omani lime",bot:"Citrus × aurantiifolia (probably)",fam:"Rutaceae",part:"Whole fruits, boiled in brine and sun-dried",desc:"Small limes boiled in salted water and dried until they are hard and either pale tan or nearly black. Species identification may vary by region and supplier.",nat:"Citrus originated in Southeast Asia; limes were spread through trade.",cult:"Produced in Oman, Iran, Iraq and the Gulf; sold across the Middle East and elsewhere.",hist:"An important souring agent in Persian, Gulf and Iraqi cuisines for stews and soups.",flav:"Sour, earthy, fermented, slightly bitter and musty; adds a deep tang.",uses:"Persian stews (ghormeh sabzi), Gulf rice dishes such as kabsa, soups and lamb dishes.",prep:"Pierce a few times and simmer whole; or crush and remove seeds.",forms:"Whole, broken, powder and slices.",best:"Long-simmered dishes.",store:"Airtight in a dry place for a long time.",subs:"Fresh lime zest and juice with a pinch of tamarind.",safe:"Fruit may be bitter. Citrus allergy is possible.",myth:"It is just a dried lime. The process gives fermentation-like flavours.",pairs:["lamb","rice","beans","herbs","tomato"]},{id:"juniper",n:"Juniper berries",ch:8,g:"cone",c:"#3a4a6a",alt:"Wacholder (German); genièvre (French); ginepro (Italian); enebro (Spanish)",bot:"Juniperus communis",fam:"Cupressaceae",part:"Seed cones (berry-like)",desc:"A coniferous shrub or tree whose fleshy cones ripen from green to blue-black over two to three years. Several Juniperus species exist, and not all are culinary or safe.",nat:"Widely across the northern hemisphere.",cult:"Collected from wild and cultivated stands in Europe and North America.",hist:"Used in Scandinavian, Alpine and Central European cooking and in flavouring gin.",flav:"Piney, resinous, citrusy and peppery, with a cool woodiness.",uses:"Game, sauerkraut, brines, sausages, marinades, stews and gin.",prep:"Crush lightly to release aromas; use a few berries only.",forms:"Whole dried berries and ground.",best:"Long cooking and cures.",store:"Airtight and dark.",subs:"A sprig of rosemary with a few peppercorns and a bay leaf.",safe:"Do not use berries from other juniper species without expert identification; some are toxic. Juniper is often advised against in pregnancy and for people with kidney conditions in herbal-safety guidance; discuss with a clinician.",myth:"All juniper berries are interchangeable. Some species are unsafe.",pairs:["game","cabbage","pork","gin","red wine","bay leaf"]},{id:"makrut-lime-leaf",n:"Makrut lime leaves",ch:8,g:"leaf",c:"#2a6a3a",alt:"Kaffir lime leaf (older name, now considered offensive in many places); bai makrut (Thai); daun jeruk purut (Indonesian)",bot:"Citrus hystrix",fam:"Rutaceae",part:"Leaves (double-lobed) and rind",desc:"A small thorny citrus tree with characteristic figure-eight leaves, with a leaf blade and a broad winged leaf stalk, and bumpy fruits.",nat:"Tropical Southeast Asia.",cult:"Thailand, Indonesia, Malaysia, Cambodia and the diaspora.",hist:"Used in Thai, Cambodian, Lao and Indonesian curries and soups.",flav:"Intensely fragrant, floral and citrusy with an oily-green character.",uses:"Tom yum, curries, fish cakes, curry paste (rind) and rice.",prep:"Tear or remove the central rib and slice very finely; or add whole to simmered liquids.",forms:"Fresh or frozen (good); dried is mild.",best:"Simmered liquids or finely shredded raw.",store:"Freeze in a bag; they keep their aroma well.",subs:"Lime zest with a few bay leaves is a rough alternative.",safe:"Culinary use is common. Citrus allergy is possible.",myth:"Dried leaves are as good as fresh. Freezing preserves much more aroma.",pairs:["lemongrass","galangal","coconut milk","chilli","fish"]}],Po=[{id:"title",part:"Front matter",title:"The World of Herbs & Spices",sub:"A Global Guide to Botanical Ingredients, Culinary Traditions, Flavour, Science & Safe Everyday Use",blocks:[{t:"p",x:"**HERBULANCE Educational Collection — Book 03**"},{t:"p",x:"First Edition — November 2026"},{t:"p",x:"NATURAL LIVING • FOOD EDUCATION • EVERYDAY WELLNESS"},{t:"p",x:"*Learn • Prepare • Thrive*"},{t:"fig",id:"emblem",cap:"The HERBULANCE emblem: a stylised leaf, seed and flower in a circle. Original artwork."}]},{id:"copyright",part:"Front matter",title:"Copyright and Publication Information",sub:"Edition, rights and editorial status",blocks:[{t:"p",x:"**The World of Herbs & Spices: A Global Guide to Botanical Ingredients, Culinary Traditions, Flavour, Science & Safe Everyday Use.** HERBULANCE Educational Collection, Book 03. First Edition, November 2026. Published by HERBULANCE."},{t:"p",x:"© 2026 HERBULANCE. All rights reserved. Text, illustrations, diagrams and the interactive features of this digital edition are original works of the publisher. No part may be reproduced without written permission, except for brief quotations in reviews and for personal printing of worksheets in Chapter 22."},{t:"h",x:"About the illustrations"},{t:"p",x:"Every illustration in this edition is an original, stylised drawing created for this book. They are designed to teach concepts such as plant parts, taxonomy, flavour families and storage. **They are not botanical identification plates and must never be used to identify a plant for eating.** This edition contains no photographs. A print edition would require licensed, expertly verified photography of each ingredient."},{t:"h",x:"Editorial status and corrections"},{t:"p",x:"Botanical names follow the naming conventions of Royal Botanic Gardens, Kew (Plants of the World Online) at the time of writing; where older names remain common on labels they are given as synonyms. Reference links were checked for availability on 14 November 2026; the status of each link is shown in the References section. Taxonomy, regulations and safety guidance change, so verify with current official sources."},{t:"note",k:"uncert",title:"Review before relying on this book",x:"This edition was prepared as an educational reference. Before use as a teaching text or print publication, we recommend independent review by a botanist, a registered dietitian or nutrition scientist, and a pharmacist or clinical herbalist for the safety chapters."}]},{id:"publisher",part:"Front matter",title:"About HERBULANCE",sub:"Publisher information",blocks:[{t:"p",x:"HERBULANCE is an international educational publishing brand focused on food education, natural living, culinary knowledge, ingredient literacy and everyday wellness."},{t:"p",x:"Our books are written for curious readers aged 14 and over around the world. We respect traditional knowledge while applying modern botanical, culinary and scientific standards. We are an independent educational resource: we do not sell supplements, we do not make treatment claims, and we do not present any single culinary tradition as superior to another."},{t:"h",x:"The collection"},{t:"ul",items:["Our books use the same structure: a clear idea, a reliable source trail, a practical activity and an honest note on limits.","Book 03 — *The World of Herbs & Spices* — is the first in the collection to treat plant ingredients as botanical, cultural, sensory and scientific subjects at once."]},{t:"p",x:"Tagline: NATURAL LIVING • FOOD EDUCATION • EVERYDAY WELLNESS. Secondary phrase: *Learn • Prepare • Thrive*."}]},{id:"disclaimer",part:"Front matter",title:"Medical, Nutritional and Educational Disclaimer",sub:"Please read before using this book",blocks:[{t:"note",k:"safety",title:"This book educates; it does not prescribe",x:"The information in this book is for general education about culinary herbs and spices. It is not medical advice, and it is not a substitute for advice from a qualified healthcare professional who knows your circumstances."},{t:"ul",items:["Nothing in this book is intended to diagnose, treat, cure or prevent any disease.","Mentions of scientific research are summaries for learning. They are not recommendations to use any ingredient for a health purpose.","Ordinary cooking amounts of herbs and spices are different from concentrated extracts, essential oils and dietary supplements. This book does not give dosages for medicinal use.","If you take prescription or over-the-counter medicines, are pregnant or breastfeeding, have a medical condition, are planning surgery, or are giving products to a child, speak to a doctor or pharmacist before using concentrated herbal products or supplements.","Do not stop or change prescribed medicines because of anything you read here.","Food allergies can be severe. Always read ingredient labels and seek medical advice about your own allergies.","Never eat a wild plant on the basis of a photograph or description. Plant identification requires expert verification, and some look-alike plants are toxic.","Regulations, labelling and food-safety advice differ between countries and change over time. Check your local authority."]},{t:"p",x:"Recipes are provided as cooking ideas. Follow safe food-handling practices, cook meat and poultry thoroughly, and adapt for your own dietary needs."}]},{id:"welcome",part:"Front matter",title:"A Welcome from HERBULANCE",sub:"Why this book exists",blocks:[{t:"p",x:"Open any kitchen cupboard in the world and you will find evidence of an extraordinary story: leaves, bark, seeds and roots that began as plants in many different landscapes, travelled across oceans and mountains, and ended up in a jar beside your stove."},{t:"p",x:"Yet most of us know remarkably little about them. Is cilantro the same as coriander? Is the cinnamon in your cupboard the cinnamon people mean in recipes from Sri Lanka? Can a spice that is 'natural' ever be a problem? And what does the research on turmeric actually say?"},{t:"p",x:"This book is our attempt to answer questions like these honestly. It does not promise miracles. Instead it offers something more durable: **ingredient literacy** — the ability to understand what you are cooking with, where it comes from, how it behaves in a pan, what science can and cannot tell us, and how to use it safely."},{t:"quote",x:"Understanding an ingredient is a form of respect — for the plant, for the people who grew it, and for the cooks who carried its flavours across the world."},{t:"p",x:"Whether you are a beginner learning to season a lentil soup, a student of botany, or a curious reader tired of exaggerated health headlines, we hope this book helps you cook with more confidence and think with more care."},{t:"p",x:"— The HERBULANCE editorial team"}]},{id:"why",part:"Front matter",title:"Why Herbs and Spices Deserve to Be Understood",sub:"Beyond trends and headlines",blocks:[{t:"p",x:"Herbs and spices are among the most traded and least understood foods on Earth. They are used in tiny quantities but shape the identity of whole cuisines. They are also the subject of an enormous amount of marketing, much of it built on a single word: *natural*."},{t:"h",x:"Three reasons to learn the fundamentals"},{t:"ol",items:["**Cooking improves when you understand why.** Knowing that cumin's aroma lives in volatile oils explains why toasting works and why old ground cumin tastes flat.","**Names can mislead.** 'Cinnamon', 'cardamom', 'oregano' and 'pepper' each cover several different plants with different flavours and, in some cases, different safety profiles.","**Health claims need context.** A compound that does something in a laboratory dish is not automatically a benefit at the dinner table, and an ordinary pinch of seasoning is not the same as a concentrated supplement."]},{t:"note",k:"tip",title:"Our approach",x:"We separate **established culinary use**, **traditional use** documented in particular communities, and **scientific evidence**, and we label which is which. Where evidence is limited, mixed or absent, we say so plainly."}]},{id:"howto",part:"Front matter",title:"How to Use This Book",sub:"Reading paths, tools and conventions",blocks:[{t:"p",x:"This is both a book and a reference. You can read it from start to finish, or jump straight to the Atlas for a particular ingredient."},{t:"h",x:"Suggested reading paths"},{t:"table",head:["If you are…","Start with…","Then…"],rows:[["A complete beginner","Chapter 1, Chapter 14 (Starter pantry)","Chapter 21 (14-day experience), Chapter 15 (Recipes)"],["A keen home cook","Chapter 3 and 11 (flavour and technique)","Chapter 9–10 (regions and blends), Atlas"],["A student or botany enthusiast","Chapter 2 (botany)","Chapter 17–18 (science and tradition), References"],["Concerned about safety","Chapter 19 and 20","Atlas profiles’ safety notes"]]},{t:"h",x:"Measurements"},{t:"p",x:"Metric measurements come first, with US customary equivalents in brackets where helpful. Teaspoon (tsp) and tablespoon (tbsp) mean standard measuring spoons of 5 ml and 15 ml. Oven temperatures are given in °C with °F equivalents; for fan ovens, reduce by about 20 °C."},{t:"widget",id:"converter"},{t:"h",x:"Interactive features"},{t:"ul",items:["Search every ingredient, chapter, recipe and term from the search bar.","Filter the Atlas by plant part, botanical family or flavour.","Bookmark pages; your bookmarks stay on your device.","Tick off pantry items, daily challenges and record notes in your Flavour Library; these are stored locally in your browser only.","Print or save any page using your browser’s print function."]}]},{id:"terms",part:"Front matter",title:"Botanical Names and Terminology Guide",sub:"Reading scientific names and regional naming",blocks:[{t:"p",x:"Common names are friendly but unreliable. 'Cilantro' and 'coriander' are the same plant in different countries. 'Basil' covers many species. 'Cinnamon' covers several. A botanical name is a short, internationally understood label that tells you exactly which plant is meant."},{t:"h",x:"How to read a botanical name"},{t:"ul",items:["**Genus and species** are written in italics: *Cinnamomum verum*. The genus starts with a capital.","**×** marks a hybrid: *Mentha × piperita*.","**subsp.** and **var.** mark subspecies and varieties: *Origanum vulgare* subsp. *hirtum*.","**Cultivars** appear in single quotes: *Ocimum basilicum* 'Genovese'.","A **synonym** is an older or alternative name for the same plant, such as *Rosmarinus officinalis* for *Salvia rosmarinus*."]},{t:"h",x:"Regional names you will meet in this book"},{t:"table",head:["Term","Also called","Notes"],rows:[["Coriander (leaf)","Cilantro (North America, Mexico)","In the UK, Australia and India the leaf and seed are both 'coriander'."],["Aubergine","Eggplant (US, Canada, Australia), brinjal (India, Africa)","Same plant: *Solanum melongena*."],["Courgette","Zucchini (US, Australia)","Same plant."],["Chilli","Chile (Mexico, US), chili (US)","Also 'chilli' (UK, India, Australia); the pepper, not the dish."],["Spring onion","Scallion (US), green onion","Immature *Allium cepa* or related types."],["Gram flour","Besan, chickpea flour",""],["Mint","*Mentha* species","Spearmint, peppermint and others differ."],["Kaffir lime leaf","Makrut lime leaf","The older name is considered offensive in some places; makrut is now preferred."]]},{t:"note",k:"uncert",title:"When names change",x:"Taxonomy is a living science. When an accepted name has changed (for example rosemary), we give the current accepted name first and the long-used synonym beside it."}]},{id:"symbols",part:"Front matter",title:"Guide to the Visual Symbols",sub:"Callouts and evidence labels used in this book",blocks:[{t:"p",x:"Coloured callout boxes appear throughout the book. Each type has a consistent meaning."},{t:"note",k:"tip",title:"Kitchen tip",x:"Practical cooking advice."},{t:"note",k:"science",title:"Science note",x:"Explains what research does and does not show."},{t:"note",k:"trad",title:"Tradition and culture",x:"Documented traditional or cultural context."},{t:"note",k:"uncert",title:"Uncertainty",x:"Where names, history or evidence are unsettled."},{t:"note",k:"safety",title:"Safety",x:"Allergy, interaction, contamination or toxicity information."},{t:"note",k:"warn",title:"Caution",x:"Important caution that can affect decisions."},{t:"h",x:"Evidence language"},{t:"table",head:["Label","Meaning"],rows:[["Established culinary use","Widely used as food by many people for a long time."],["Traditional use","Documented use in specific communities; does not prove effectiveness."],["Laboratory evidence","Findings from cells or test tubes."],["Animal research","Findings from experiments on animals."],["Limited human evidence","A few small or short human studies."],["Emerging research","Promising early work awaiting confirmation."],["Inconsistent findings","Studies disagree."],["Insufficient evidence","Not enough good evidence to say."]]},{t:"note",k:"uncert",title:"No evidence scores",x:"We do not use star ratings or numeric scores for evidence, because there is no single defensible method for scoring diverse ingredients and studies."},{t:"fig",id:"plantglyphs",cap:"Illustration icons used in the Atlas represent the main plant part used: leaf sprig, grass-like blade, feathery frond, rhizome, bulb, seeds, pod, bark quill, flower bud, star, berries, chilli and others."}]},{id:"contents",part:"Front matter",title:"Contents",sub:"Interactive table of contents",blocks:[{t:"widget",id:"toc"}]},{id:"intro",part:"Front matter",title:"Introduction: A World of Flavour in Every Plant",sub:"Curiosity before credulity",objectives:["Appreciate how herbs and spices connect plants, people and places","Understand the book’s approach to evidence","Identify what you most want to learn"],blocks:[{t:"p",x:"A pinch of saffron represents the hand-picked stigmas of many crocus flowers. A clove is an unopened flower bud. A cinnamon quill is the peeled inner bark of a tree. A piece of ginger is an underground stem. Each jar on a spice shelf is a small botanical story."},{t:"p",x:"Humans have been seasoning food with plants for thousands of years. Archaeological evidence from many places points to long histories of cooking with aromatic plants. Spices travelled on land and sea routes, shaping economies and, in many cases, causing harm through colonial exploitation. Herbs and spices are therefore not only flavour but also history."},{t:"h",x:"Why this book is different"},{t:"p",x:"A great deal of material about herbs and spices falls into two extremes. One side lists dozens of 'superfoods' and 'healing plants' with confident, unsupported claims. The other treats them as nothing more than flavour and skips the interesting biology and chemistry."},{t:"p",x:"We take a middle path. We treat herbs and spices as *culinary ingredients first*, describe the botany and sensory science that explain why they behave as they do, and then look carefully at what research has actually shown, including its limits."},{t:"note",k:"science",title:"A recurring rule",x:"A compound being present in a plant, active in a laboratory, or used traditionally does not mean that eating the plant in cooking amounts has a particular health effect. Throughout this book we will repeat this distinction because it is the most common source of confusion."},{t:"h",x:"What you will be able to do"},{t:"ul",items:["Tell a herb from a spice, and a plant name from a trade name.","Recognise plant parts and understand why they matter.","Describe flavour in useful words and combine ingredients with confidence.","Store, buy and use ingredients with less waste.","Read health claims critically and use herbal products safely."]},{t:"quote",x:"Cook curious. Read carefully. Taste everything attentively."}]}],fg=[{id:"ch1",num:1,part:"Part I — Understanding the World of Botanical Ingredients",title:"What Are Herbs and Spices?",sub:"Definitions, categories and the plant parts we eat",objectives:["Distinguish culinary herbs from spices","Name the plant parts used in cooking","Compare fresh, dried, whole and ground forms","Differentiate culinary ingredients from concentrated extracts"],blocks:[{t:"p",x:"Ask ten cooks to define 'herb' and 'spice' and you will get ten answers. That is because the words belong to cooking, not to botany, and different traditions draw the line in different places."},{t:"h",x:"The culinary definitions"},{t:"p",x:"In most kitchens, **herbs** are the leafy green parts of plants used for flavour, such as basil, parsley and mint. **Spices** are the other parts: seeds, bark, roots, buds, fruits and stigmas, typically dried, such as cumin, cinnamon and saffron. This convention is useful, but it is a convention."},{t:"p",x:"The botanical word 'herb' (or 'herbaceous plant') has another meaning altogether: a plant without a persistent woody stem above ground. Rosemary and bay laurel, for example, are woody, yet cooks call them herbs."},{t:"note",k:"uncert",title:"The categories overlap",x:"Coriander is both: its leaf is cooked as an herb and its seed used as a spice. Dill, fennel, fenugreek and mint family plants behave similarly. Garlic and ginger are often called spices or aromatics depending on tradition. Regulators and trade bodies also define 'spices and culinary herbs' in their own ways, often in a single combined category."},{t:"h",x:"Plant parts used in cooking"},{t:"fig",id:"plantparts",cap:"A schematic plant showing where common culinary ingredients come from: leaves, flowers, buds, fruits, seeds, bark, roots, rhizomes and bulbs."},{t:"table",head:["Plant part","Examples","Notes"],rows:[["Leaf","Basil, parsley, coriander leaf, bay, curry leaf, shiso","Usually fresh or dried; delicate aroma, often lost with long heat."],["Stem / leaf base","Lemongrass, chives","Fibrous stalks used for infusion or sliced finely."],["Flower or flower bud","Cloves (unopened bud), saffron (stigmas), capers (bud)","Hand-harvested, often small, concentrated."],["Fruit","Black pepper, allspice, chillies, vanilla, sumac, star anise","Includes berries and pods; ripeness and processing change flavour."],["Seed","Mustard, fenugreek, nigella, nutmeg, cumin and coriander ('seeds' are often fruits)","Hard, long-lasting when whole."],["Bark","Cinnamon, cassia","Inner bark, rolled or scraped."],["Root / rhizome","Ginger, turmeric, galangal, horseradish","Rhizomes are underground stems."],["Bulb","Garlic, onion, shallot","Swollen leaf bases or cloves."],["Resin / gum","Asafoetida, mastic","Dried plant exudate."],["Aril","Mace","Covering around a seed."]]},{t:"p",x:"This answers a puzzle: **dried oregano, fresh basil, cinnamon bark, cloves and black pepper** all season food, but each belongs to a different category. Oregano and basil are leaves (one dried, one fresh); cinnamon is bark; cloves are flower buds; black pepper is a dried fruit."},{t:"widget",id:"partquiz"},{t:"h",x:"One plant, several ingredients"},{t:"table",head:["Plant","Ingredients it provides"],rows:[["*Coriandrum sativum*","Coriander leaf and stems, roots (Thai cooking), coriander seed"],["*Myristica fragrans*","Nutmeg (seed) and mace (aril)"],["*Piper nigrum*","Green, black, white and red peppercorns (different ripeness and processing)"],["*Foeniculum vulgare*","Fennel bulb, fronds, pollen and seeds"],["*Trigonella foenum-graecum*","Fenugreek seeds and fresh or dried leaves (methi)"],["*Cinnamomum* species","Bark (cinnamon, cassia) and leaves (tej patta, in some species)"],["*Capsicum annuum*","Sweet pepper, paprika, many chillies"]]},{t:"h",x:"Fresh versus dried"},{t:"p",x:"Drying removes water and concentrates some flavours while destroying others. Oregano, thyme, rosemary and bay often hold their character when dried. Basil, parsley, coriander leaf and chives often lose much of their freshness. Dried herbs are generally used in smaller amounts than fresh (about one-third as a starting point), but the ratio is a guide, not a law."},{t:"h",x:"Whole versus ground"},{t:"p",x:"Whole spices keep their flavour oils sealed inside. Grinding exposes more surface area, so aroma is lost faster. This is why many cooks toast and grind small amounts as needed."},{t:"fig",id:"forms",cap:"Fresh, dried, whole and ground forms: what happens to aroma as a plant is processed."},{t:"h",x:"Culinary ingredients versus extracts"},{t:"p",x:"A pinch of dried turmeric in a curry is a culinary ingredient. A capsule of concentrated curcumin is a supplement with a very different composition and safety profile. Essential oils, tinctures and standardised extracts are further concentrated products. We return to these differences in Chapters 16, 17 and 19."}],takeaways:["Herb and spice are culinary categories, not strict botanical ones.","Plant part, not plant name alone, tells you what you are cooking with.","One plant can yield several ingredients.","Culinary use is different from concentrated extract use."],refs:["davidson","powo","katzer"]},{id:"ch2",num:2,part:"Part I — Understanding the World of Botanical Ingredients",title:"The Botany Behind Your Ingredients",sub:"Names, families, structures and origins",objectives:["Read a botanical name","Explain genus, species, family and cultivar","Recognise key plant structures","Distinguish native range from present-day cultivation"],blocks:[{t:"h",x:"Why scientific names matter"},{t:"p",x:"In 1753 the Swedish naturalist Carl Linnaeus popularised a system of two-part names that remain the basis of modern botanical nomenclature. Every plant has a unique, international name. The system is governed by an international code, and names are curated by botanical institutions such as the Royal Botanic Gardens, Kew."},{t:"fig",id:"taxonomy",cap:"The taxonomic ladder, from kingdom to species, using sweet basil as the example."},{t:"h",x:"Genus, species, family"},{t:"ul",items:["A **genus** (plural genera) groups closely related species: *Ocimum* (basils).","A **species** is a particular kind: *Ocimum basilicum*.","A **family** groups related genera: Lamiaceae (the mint family) includes basil, mint, thyme, oregano, sage, rosemary and shiso. Apiaceae (the carrot family) includes parsley, coriander, cumin, fennel, dill and asafoetida."]},{t:"p",x:"Families are useful to cooks because members often share aromas and sometimes allergens. People who react to celery, for example, sometimes report reactions to other members of Apiaceae. This is not guaranteed but is an important pattern."},{t:"table",head:["Family","Culinary members in this book"],rows:[["Lamiaceae (mint)","Basil, mint, thyme, oregano, sage, rosemary, shiso"],["Apiaceae (carrot)","Parsley, coriander, dill, cumin, fennel, ajwain, asafoetida, culantro, lovage"],["Zingiberaceae (ginger)","Ginger, turmeric, galangal, cardamom, grains of paradise"],["Lauraceae (laurel)","Bay laurel, cinnamon, cassia"],["Myrtaceae (myrtle)","Clove, allspice"],["Piperaceae (pepper)","Black, white and long pepper"],["Solanaceae (nightshade)","Chillies, paprika"],["Brassicaceae (cabbage)","Mustard, horseradish"],["Amaryllidaceae (allium subfamily)","Garlic, onion, shallot, chives"],["Rutaceae (citrus)","Curry leaf, Sichuan pepper, makrut lime"]]},{t:"h",x:"Cultivars and varieties"},{t:"p",x:"Within a species, plants can be selected for particular traits. 'Genovese' basil has large, sweet leaves; 'Thai' basil has an anise scent; purple types have coloured leaves. These cultivars belong to the same species but taste different, which is why one botanical name does not guarantee one flavour."},{t:"h",x:"Plant structures"},{t:"fig",id:"leaf",cap:"Leaf morphology: blade, petiole, midrib, veins, margin and the difference between simple and compound leaves."},{t:"fig",id:"flowerfruit",cap:"From flower to fruit to seed: why a 'seed' spice may actually be a whole fruit."},{t:"fig",id:"underground",cap:"Bulbs, rhizomes and taproots compared."},{t:"p",x:"Many spices called 'seeds' are botanically fruits. Cumin, coriander and fennel in Apiaceae produce a dry fruit that splits into two halves. Black pepper is a drupe, a fleshy fruit with a stone. Vanilla is a long capsule."},{t:"h",x:"Native range versus present-day cultivation"},{t:"p",x:"A plant's native range is where it evolved. Its cultivation range is where people grow it now. These can be very different. Chillies are native to the Americas yet are fundamental to cuisines in Asia and Africa; tomatoes, native to the Americas, define Italian sauces. Vanilla originated in Mesoamerica, but most vanilla today is grown in Madagascar. For long-cultivated plants such as ginger, turmeric and garlic, the wild ancestor may be unknown."},{t:"note",k:"uncert",title:"Uncertain origins",x:"For many ancient crops, native ranges are inferred from limited evidence. We say 'probably' and 'uncertain' where this is the case, and we do not claim any single country 'owns' an ingredient."},{t:"h",x:"Botanical identity versus commercial naming"},{t:"p",x:"Trade names can be broader than botanical names. 'Oregano' on a label may be *Origanum vulgare*, *Origanum onites*, or Mexican oregano (*Lippia graveolens*), which is in an entirely different family. 'Cinnamon' may be *Cinnamomum verum* or one of several cassia species. 'Bay leaf' may be *Laurus nobilis* or Indian bay (*Cinnamomum tamala*)."},{t:"note",k:"safety",title:"Look-alikes are not interchangeable",x:"Visually similar plants can have very different chemistry. Star anise (*Illicium verum*) has a toxic look-alike, Japanese star anise (*Illicium anisatum*). Cherry laurel and mountain laurel are not bay. Never identify a plant for eating from a picture, and never rely on this book’s stylised illustrations to identify one."}],takeaways:["Botanical names give precision that common names cannot.","Family membership predicts aroma patterns and sometimes allergen overlap.","A spice 'seed' may be a fruit.","Native range and cultivation range differ."],refs:["powo","ipni","katzer"]},{id:"ch3",num:3,part:"Part I — Understanding the World of Botanical Ingredients",title:"How Herbs and Spices Create Flavour",sub:"Aroma, taste, pungency and the effects of heat",objectives:["Distinguish taste, aroma and pungency","Describe flavour using the flavour wheel","Explain how heat, crushing and fat change flavour","Decide when to add an ingredient"],blocks:[{t:"h",x:"Flavour is mostly smell"},{t:"p",x:"What we call flavour is the combined impression of **taste** (detected on the tongue), **aroma** (detected by the nose, both before eating and from the mouth while eating) and **trigeminal sensations** such as heat, cooling and tingling. Herbs and spices contribute chiefly to aroma and trigeminal sensation, with some contribution to bitterness, sourness and sweetness."},{t:"ul",items:["**Basic tastes** are sweet, sour, salty, bitter and umami (savoury).","**Aroma** comes from volatile compounds that evaporate and reach receptors in the nose.","**Pungency** (chilli heat, mustard sting, peppery bite) and **cooling** (mint) are sensations carried by the trigeminal nerve, not the taste buds."]},{t:"note",k:"science",title:"Sensory description is not physiological claim",x:"Words such as 'warming' or 'cooling' describe sensations. Chilli feels hot because it activates a heat-sensing receptor; it does not raise the temperature of food. Mint feels cool because menthol activates a cold-sensing receptor. These are sensory facts, not health claims."},{t:"h",x:"The flavour wheel"},{t:"fig",id:"flavourwheel",cap:"An interactive flavour wheel grouping herbs and spices by dominant sensory family. Click a segment to see examples."},{t:"h",x:"Volatile compounds and temperature"},{t:"p",x:"Aroma molecules are volatile: they evaporate easily. Heat releases them faster, which is why a simmering pot smells strongly. But heat also drives them away, so delicate aromas of basil, parsley or chives vanish with long cooking. Hardy herbs (thyme, rosemary, bay) contain more robust compounds and tolerate longer heating."},{t:"fig",id:"aroma",cap:"Aroma release and loss as temperature and time increase: delicate and robust ingredients behave differently."},{t:"h",x:"Crushing, grinding and bruising"},{t:"p",x:"Intact plant cells hold flavour compounds in sealed compartments. Cutting, crushing or grinding breaks these open. In garlic and mustard, crushing also mixes enzymes with other compounds to form new pungent molecules. Fine grinding releases more flavour immediately, but it also lets flavour escape faster, so pre-ground spices fade sooner."},{t:"h",x:"Toasting, blooming and tempering"},{t:"ul",items:["**Dry toasting** gently heats whole spices to create roasted, nutty notes through browning reactions. Take them off the heat when they smell fragrant, before they smoke.","**Blooming** (or tempering) heats spices in oil or ghee. Many aroma compounds dissolve well in fat, so the fat carries flavour through a dish.","**Water-based cooking** extracts water-soluble flavours, such as sweet, bitter and some aromatic compounds, which is why long simmering suits bay and star anise."]},{t:"note",k:"tip",title:"When to add which",x:"Hardy herbs and whole spices go in early. Ground spices go in after the onions, briefly fried in fat. Delicate herbs and acids go in at the end. Always taste before serving."},{t:"h",x:"Practical pairing principles"},{t:"ul",items:["**Share and bridge:** ingredients with a shared aroma family (for example fennel and star anise, both anethole-rich) can harmonise.","**Contrast:** sour (lemon, sumac), fat (cream, oil) and heat (chilli) balance each other.","**Layer:** build from a base (onion, garlic, cumin) through a body (turmeric, coriander) to a top note (fresh herbs, citrus).","**Respect intensity:** strongly flavoured ingredients like cloves, rosemary and sage need restraint."]},{t:"p",x:"Taste is also personal. Genetic variation influences how people perceive coriander leaf, bitterness and heat, and culture shapes what is considered pleasant. Pairing guidance is a starting place, not a rule."}],takeaways:["Flavour = taste + aroma + trigeminal sensation.","Heat and time affect delicate and sturdy ingredients differently.","Fat is an effective carrier for many aroma compounds.","Sensory words are not health claims."],refs:["mcgee"]},{id:"ch4",num:4,part:"Part I — Understanding the World of Botanical Ingredients",title:"From Plant to Pantry",sub:"Growing, drying, processing, packaging and storage",objectives:["Trace the journey from field to jar","Explain how drying and grinding change an ingredient","Identify the enemies of stored spices","Explain why shelf life cannot be universal"],blocks:[{t:"fig",id:"supply",cap:"A simplified journey: cultivation → harvest → cleaning → drying or curing → grading → grinding or cutting → packaging → transport → storage → kitchen."},{t:"h",x:"Growing and harvesting"},{t:"p",x:"Climate, soil, altitude and rainfall influence the chemistry of herbs and spices. A thyme grown in cool, humid conditions can differ in oil content from the same species grown in hot, dry ones. Harvest timing matters too: leafy herbs are often picked just before flowering when oil content is high; fruits such as pepper are picked at specific ripeness; saffron stigmas are plucked within hours of the flower opening."},{t:"h",x:"Drying and curing"},{t:"p",x:"Drying slows spoilage by lowering moisture. Methods include sun drying, shade drying, mechanical hot-air drying and freeze drying. Some spices undergo curing: vanilla pods are scalded, sweated and slowly dried over weeks to develop flavour; cloves and pepper darken as they dry. Slow, low-temperature drying generally preserves more volatile aroma than rapid, high-heat drying."},{t:"h",x:"Processing and grinding"},{t:"p",x:"After drying, products are cleaned, graded, sorted and sometimes steam-treated or irradiated to reduce microbes. Spices and herbs are low-moisture foods, where bacteria do not multiply, but some can survive; contamination such as *Salmonella* has been documented in spice-related outbreaks (see References), which is why many producers apply a microbial reduction step. Grinding then increases surface area; some processors use cryogenic grinding to limit heat."},{t:"h",x:"Packaging, transport and storage"},{t:"ul",items:["**Moisture** promotes mould and caking and can encourage microbial growth.","**Heat** speeds the evaporation of volatile compounds and chemical reactions.","**Light** degrades pigments such as paprika’s red and many aroma compounds.","**Oxygen** causes oxidation, leading to stale or rancid notes, particularly in oil-rich seeds.","**Time** works on everything: volatile compounds are lost steadily."]},{t:"fig",id:"storage",cap:"Good versus poor storage: cool, dark, dry and airtight versus above the stove in a clear jar."},{t:"h",x:"Comparing forms"},{t:"table",head:["Form","Strengths","Weaknesses"],rows:[["Fresh","Brightest aroma, vivid colour, texture","Short life; seasonal; variable strength"],["Frozen","Preserves colour and aroma of many herbs; convenient","Texture changes; best for cooked dishes"],["Dried (leaf)","Long-lasting; concentrated for some herbs such as oregano","Loses top notes; may taste dusty"],["Whole spice","Retains aroma for a long time; versatile","Needs grinding or infusing"],["Cracked/coarse","Texture and quick flavour","Intermediate shelf life"],["Ground","Convenient; disperses evenly","Fastest aroma loss; easier to adulterate"]]},{t:"h",x:"Why there is no universal expiry date"},{t:"p",x:"A date on a jar is usually a 'best before' guide to quality, not a safety limit. Shelf life depends on the ingredient (whole nutmeg lasts longer than ground basil), storage, the grind, and the producer’s original quality. Spices rarely become unsafe in the way perishable foods do, but they can become stale, dusty and uninspiring, and visible mould, clumping from moisture or off-smells mean the product should be discarded."},{t:"note",k:"tip",title:"A practical freshness test",x:"Rub a little in your palm and smell it. If the aroma is faint compared with a freshly bought sample, it will contribute little. Use more, replace it, or save it for dishes where subtlety matters less."}],takeaways:["Drying, curing and grinding shape flavour and shelf life.","Heat, light, oxygen and moisture are the enemies of stored spices.","Whole spices outlast ground ones.","Best-before dates are about quality, not strict safety."],refs:["vandoren","who-fs","codex"]}],fr="Part II — The Global Herb and Spice Atlas",mr="Part III — How the World Uses Herbs and Spices",mg=[{id:"ch5",num:5,part:fr,title:"Leafy Culinary Herbs",sub:"Eighteen profiles of leaves and leaf-like parts",objectives:["Describe the main leafy herbs and their families","Choose between fresh and dried","Match herbs to early or late additions"],blocks:[{t:"p",x:"Leafy herbs fall into two practical groups. **Tender herbs** (basil, parsley, coriander leaf, chives, dill, mint, tarragon, shiso) have delicate aroma and are best fresh and added late. **Hardy herbs** (rosemary, thyme, oregano, sage, bay) contain sturdier compounds and tolerate long cooking and drying."},{t:"note",k:"tip",title:"Same word, different plants",x:"Basil has many types; mint has many species and hybrids; oregano may be Greek, Turkish or Mexican, which is a different family. The profiles that follow state the exact species so you can compare labels."},{t:"table",head:["Group","Examples","Typical handling"],rows:[["Tender, soft herbs","Basil, parsley, coriander leaf, dill, chives, mint, tarragon, shiso","Add at the end or serve raw; tear or chop gently; store with stems in water."],["Hardy, woody herbs","Rosemary, thyme, oregano, sage, bay","Add early; whole sprigs can be removed; dried versions work well."],["Tropical aromatic leaves and stalks","Lemongrass, curry leaf, pandan, makrut lime leaf","Bruise, simmer, temper or infuse; freeze for storage."]]},{t:"widget",id:"atlas:5"}],takeaways:["Tender herbs go in late; hardy herbs can go in early.","Check species on labels.","Freezing suits many tropical leaves."],refs:["powo","katzer","nccih-peppermint"]},{id:"ch6",num:6,part:fr,title:"Roots, Rhizomes, Bulbs and Underground Ingredients",sub:"Seven profiles from below the ground",objectives:["Tell roots, rhizomes and bulbs apart","Understand how preparation changes flavour","Store underground ingredients correctly"],blocks:[{t:"p",x:"Underground ingredients are botanically varied. A **bulb** (onion, garlic, shallot) is a short stem surrounded by swollen leaf bases or cloves. A **rhizome** (ginger, turmeric, galangal) is a horizontal underground stem. A **root** (horseradish) is a true root, typically a taproot."},{t:"table",head:["Type","What it is","Examples","Clue"],rows:[["Bulb","Compressed stem with fleshy leaf bases","Onion, garlic, shallot","Concentric layers or cloves in a papery skin."],["Rhizome","Underground horizontal stem","Ginger, turmeric, galangal","Segments with ‘nodes’ and growing buds (‘eyes’)."],["Taproot","Swollen primary root","Horseradish","Tapered shape; no nodes."]]},{t:"h",x:"Preparation changes flavour"},{t:"p",x:"Alliums (garlic, onion) and horseradish make pungent compounds only when their cells are damaged, which brings enzymes into contact with precursor molecules. The way you cut matters: whole cloves gentle, minced sharp. Heating stops the enzymes and mellows pungency. Burnt garlic turns bitter, so add it after onions and cook gently."},{t:"note",k:"safety",title:"Garlic in oil",x:"Raw garlic or herbs stored in oil at room temperature provide conditions where *Clostridium botulinum* can grow and produce a dangerous to
