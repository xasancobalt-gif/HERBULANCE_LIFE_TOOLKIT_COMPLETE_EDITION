ated checks.",status:"blocked"},{id:"katzer-"+h.id,by:"Katzer, G.",title:"Gernot Katzer’s Spice Pages (use the index to find this ingredient)",url:"https://gernot-katzers-spice-pages.com/",type:"Expert-maintained reference website",supports:"Names in many languages, plant part and culinary notes.",limits:"Single-author site; not peer reviewed.",status:"ok"}],m=(xg[h.id]||[]).map(g=>$o[g]).filter(Boolean);for(const g of m)o.push({id:g.id,by:g.by,title:g.title,url:g.url,type:g.type,supports:g.supports,limits:g.limits,status:g.status});return o.push({id:"fdc-"+h.id,by:"USDA Agricultural Research Service",title:"FoodData Central — nutrient composition (search for this ingredient)",url:"https://fdc.nal.usda.gov/",type:"Food-composition database",supports:"Typical nutrient composition; values vary by product.",limits:"Averages; not specific to your product.",status:"ok"}),o}const Fa=[{id:"herb-citrus-salad",n:"Fresh Herb and Citrus Salad",dish:"salad",tone:["#3f8a3c","#e8892b","#7a2f6e","#d9c28c"],desc:"A bright salad in which herbs are the main ingredient rather than a garnish, balanced by sweet citrus, salt and a little sourness.",insp:"Inspired by the many herb-forward salads of the eastern Mediterranean and Levant. It is an original composition, not a traditional named dish.",prep:20,cook:0,serves:4,ing:[[60,"g","flat-leaf parsley, leaves and tender stems",[2,"cups"]],[15,"g","fresh mint leaves",[.5,"cup"]],[2,"","oranges, peeled and cut into segments"],[1,"","small red onion, thinly sliced"],[60,"g","pitted olives",[.5,"cup"]],[2,"tbsp","extra-virgin olive oil"],[1,"tbsp","lemon juice"],[.5,"tsp","sumac"],[.25,"tsp","fine salt"]],steps:["Soak the sliced onion in cold water for 10 minutes to soften the bite; drain well.","Wash the parsley and mint and dry them thoroughly. Wet leaves dilute dressings and wilt quickly.","Roughly chop the parsley; tear the mint at the last moment to limit bruising.","Combine herbs, onion, orange segments and olives in a wide bowl.","Whisk oil, lemon juice, sumac and salt, then dress the salad just before serving and toss gently."],subs:["Coriander leaf (cilantro) for half of the parsley.","Grapefruit or tangerine instead of orange.","Lemon zest and a pinch of salt for sumac."],store:"Best eaten immediately. Undressed herbs and fruit keep covered in the fridge for up to a day.",allergy:"Free of the major allergens. Check olives for added ingredients.",tips:["Dry herbs completely; a salad spinner makes a real difference.","Taste an orange segment with salt; adjust the lemon to the sweetness of your fruit."],uses:["parsley","spearmint","sumac"]},{id:"green-herb-sauce",n:"Versatile Green Herb Sauce",dish:"sauce",tone:["#2f7a37","#6a8f3a","#d9c28c","#c23b1e"],desc:"A raw, vivid sauce that can be spooned over vegetables, eggs, grains, grilled fish, meat or beans.",insp:"There are many regional green herb sauces, including salsa verde in Italy, chimichurri in Argentina and Uruguay, and chermoula in North Africa. This is an adaptable recipe in that general family, not a version of any one of them.",prep:15,cook:0,serves:6,ing:[[40,"g","flat-leaf parsley",[1.5,"cups"]],[20,"g","coriander leaf (cilantro) or mint",[.75,"cup"]],[1,"","garlic clove, finely grated"],[80,"ml","extra-virgin olive oil",[.33,"cup"]],[2,"tbsp","lemon juice or red wine vinegar"],[.25,"tsp","chilli flakes"],[.5,"tsp","dried oregano"],[.5,"tsp","fine salt"]],steps:["Finely chop the parsley and coriander by hand for a textured sauce, or pulse a few times in a food processor.","Mix with garlic, oregano, chilli flakes and salt. Let stand for 5 minutes so that the garlic mellows.","Stir in the oil and acid. Taste on a piece of bread or potato and adjust salt and acid.","Rest for at least 15 minutes before serving to let flavours merge."],subs:["Dill or tarragon for a different character.","Capers or anchovy for savoury depth (check allergens).","Toasted cumin for a North African feel."],store:"Refrigerate in a jar covered with a thin layer of oil for up to 3–4 days. Freeze in ice-cube trays for longer, though texture softens.",allergy:"No major allergens. Anchovy would add fish.",tips:["Vinegar discolours chopped herbs over time; add acid shortly before serving for the greenest sauce.","Hand-chopping avoids bitter bruising."],uses:["parsley","coriander-leaf","oregano"]},{id:"spiced-chickpeas",n:"Spiced Roasted Chickpeas",dish:"bowl",tone:["#c9a15a","#c23b1e","#a97b3d","#e09a0e"],desc:"Crisp, savoury chickpeas seasoned with toasted ground spices, good as a snack, salad topper or soup garnish.",insp:"Inspired by flavour combinations found in South Asian street snacks (such as chaat) and Mediterranean roasted legumes. It is an original recipe.",prep:10,cook:30,serves:4,ing:[[800,"g","cooked chickpeas (2 × 400 g cans, drained)",[3,"cups"]],[2,"tbsp","neutral or olive oil"],[1,"tsp","cumin seeds, toasted and ground"],[1,"tsp","coriander seeds, toasted and ground"],[.5,"tsp","smoked or sweet paprika"],[.25,"tsp","ground turmeric"],[.5,"tsp","fine salt"],[1,"tbsp","lemon juice, to finish"]],steps:["Heat the oven to 200 °C (400 °F; 180 °C fan).","Drain and rinse the chickpeas, then dry them thoroughly on a clean towel. Remove loose skins if you wish.","Toast cumin and coriander seeds in a dry pan over medium heat for 1–2 minutes until fragrant; cool and grind.","Toss chickpeas with oil, spices and salt. Spread on a tray in a single layer.","Roast for 25–30 minutes, shaking the tray halfway, until crisp and golden. Cool for 5 minutes, then add lemon juice."],subs:["Use cooked white beans or butter beans.","Replace paprika with chilli powder or garam masala.","A pinch of amchur (dried mango powder) or sumac for tartness."],store:"Eat within a few hours for maximum crispness; store cooled leftovers in a loosely covered container for up to 2 days, and refresh in a hot oven.",allergy:"Legume (chickpea) allergy; check cross-contamination for spices.",tips:["Dry chickpeas are the secret to crisp results.","Add the lemon after roasting; acid softens the crust."],uses:["cumin","coriander-seed","paprika","turmeric"]},{id:"tarka-lentils",n:"Aromatic Lentils with a Spice Tempering",dish:"bowl",tone:["#e09a0e","#c23b1e","#2e6b35","#f3ead6"],desc:"Soft red lentils simmered with turmeric and ginger, finished with whole spices sizzled in hot fat.",insp:"The finishing technique (tempering, known as tadka, tarka or chaunk) is used throughout South Asia. This is a simplified original recipe and does not represent any regional or family dal.",prep:10,cook:30,serves:4,ing:[[200,"g","split red lentils, rinsed",[1,"cup"]],[750,"ml","water",[3,"cups"]],[.5,"tsp","ground turmeric"],[1,"tbsp","fresh ginger, grated"],[.5,"tsp","salt, plus more to taste"],[2,"tbsp","ghee or neutral oil"],[1,"tsp","cumin seeds"],[.5,"tsp","brown mustard seeds"],[10,"","fresh curry leaves (optional)"],[3,"","garlic cloves, sliced"],[1,"","dried red chilli (optional)"],[1,"pinch","asafoetida (hing, optional)"],[1,"tbsp","lemon juice"]],steps:["Simmer lentils with water, turmeric and ginger over medium-low heat, skimming foam, for 15–20 minutes until soft. Stir often; add water if needed.","Add salt and mash lightly for a creamy texture.","For the tempering, heat ghee or oil in a small pan on medium-high heat until shimmering (a seed should sizzle at once).","Add mustard seeds; when they start to pop (a few seconds), add cumin, chilli, asafoetida and curry leaves. Stand back, as the leaves splutter.","Add garlic and cook 20–30 seconds until just golden. Do not let it burn.","Pour over the dal, cover briefly to trap the aroma, then stir in lemon juice and serve."],subs:["Use split yellow lentils (longer cooking time).","Replace curry leaves with a bay leaf during simmering.","Use coconut oil for a different aroma."],store:"Refrigerate for up to 4 days; reheat with a splash of water. Freezes well without the garlic tempering.",allergy:"Lentils are legumes; ghee is dairy (use oil for dairy-free). Asafoetida compounds may contain wheat.",tips:["Fat must be hot enough to bloom spices but not smoking.","Taste after adding the tempering, then adjust salt and lemon."],uses:["turmeric","ginger","cumin","mustard-seed","curry-leaf","garlic","asafoetida"]},{id:"roasted-veg-herbs",n:"Roasted Vegetables with Herb Seasoning",dish:"plate",tone:["#d9822b","#5c8a3a","#a8452b","#e7dfc9"],desc:"A simple sheet-pan dish that demonstrates how robust herbs behave in dry heat.",insp:"Inspired by the herb mixtures of southern France and the Mediterranean (see herbes de Provence in Chapter 10). Not a regional recipe.",prep:15,cook:40,serves:4,ing:[[800,"g","mixed vegetables (carrot, courgette/zucchini, red onion, peppers, potato), cut into 3 cm pieces",[6,"cups"]],[3,"tbsp","olive oil"],[2,"tsp","dried herb mix (thyme, oregano, savory or rosemary)"],[.75,"tsp","fine salt"],[.25,"tsp","freshly ground black pepper"],[3,"","garlic cloves, unpeeled"],[1,"tbsp","lemon juice or balsamic vinegar"],[2,"tbsp","chopped parsley"]],steps:["Heat the oven to 220 °C (425 °F; 200 °C fan). Put a baking tray inside to heat.","Cut dense vegetables (carrots, potatoes) smaller than soft ones (courgette), so they finish together.","Toss vegetables with oil, dried herbs, salt and pepper. Crush the dried herbs in your palm first.","Spread on the hot tray in a single layer with the garlic. Roast for 35–40 minutes, turning once, until browned at the edges and tender.","Squeeze the soft garlic out of its skin, mash with lemon juice, toss with the vegetables and finish with parsley."],subs:["Fresh rosemary or thyme (use about three times the dried amount).","Any root or squash vegetables.","Smoked paprika or cumin for a different mood."],store:"Refrigerate for up to 3 days; reheat in a hot oven.",allergy:"No major allergens.",tips:["Crowding steams vegetables instead of roasting them.","Hardy herbs are added before roasting, while soft herbs (parsley) are added after."],uses:["thyme","oregano","rosemary","garlic","parsley"]},{id:"med-dressing",n:"Mediterranean-Inspired Herb Dressing",dish:"jar",tone:["#d4a62a","#5c8a3a","#f3ead6","#a8452b"],desc:"A shakeable dressing that shows how herbs behave in acid, fat and mustard.",insp:"Inspired by oil-and-lemon dressings found around the Mediterranean. An original, adaptable recipe.",prep:10,cook:0,serves:6,ing:[[80,"ml","extra-virgin olive oil",[.33,"cup"]],[3,"tbsp","lemon juice (about 1 lemon)"],[1,"tsp","Dijon or other mustard"],[1,"tsp","dried oregano"],[1,"tbsp","finely chopped parsley"],[1,"","small garlic clove, grated"],[1,"tsp","honey or other sweetener (optional)"],[.5,"tsp","fine salt"],[.25,"tsp","freshly ground black pepper"]],steps:["Combine lemon juice, mustard, oregano, garlic, salt and honey in a jar and let sit for 5 minutes to soften the dried oregano.","Add oil and shake vigorously until it thickens slightly.","Stir in parsley and pepper. Taste on a leaf and adjust acid, salt or sweetness."],subs:["Red wine vinegar for lemon juice, using a little less.","Thyme or marjoram for oregano.","Maple syrup or a pinch of sugar for honey."],store:"Refrigerate for up to 5 days; olive oil may thicken, so bring to room temperature and shake.",allergy:"Mustard is a major allergen in many countries.",tips:["The traditional ratio is about 3 parts oil to 1 part acid; reduce oil if acid is mild.","Mustard acts as an emulsifier and keeps the dressing from separating."],uses:["oregano","parsley","garlic"]},{id:"spice-grain-bowl",n:"Spice-Rich Grain Bowl",dish:"bowl",tone:["#c9a15a","#d9822b","#8e1f3a","#3f8a3c"],desc:"A warm bowl of bulgur or rice with toasted spices, roasted carrots, herbs and a tangy yogurt sauce.",insp:"Combines flavours often found in the Middle East and North Africa (cumin, coriander, cinnamon, sumac, mint). It is a modern composed bowl, not a traditional dish.",prep:20,cook:30,serves:4,ing:[[200,"g","bulgur wheat, brown rice or quinoa, rinsed",[1,"cup"]],[500,"g","carrots, cut into batons",[4,"medium"]],[2,"tbsp","olive oil"],[1,"tsp","cumin seeds"],[1,"tsp","coriander seeds"],[1,"","cinnamon stick (5 cm)"],[.5,"tsp","sumac"],[200,"g","plain yogurt",[.75,"cup"]],[2,"tbsp","chopped mint"],[1,"","garlic clove, grated"],[1,"tbsp","lemon juice"],[30,"g","toasted almonds or seeds (optional)",[.25,"cup"]]],steps:["Heat oven to 220 °C (425 °F). Toast cumin and coriander seeds dry for 1–2 minutes, then crush coarsely.","Toss carrots with 1 tbsp oil, half of the crushed spices and a pinch of salt. Roast 25–30 minutes, turning once.","Cook the grain with the cinnamon stick in salted water according to its package directions (bulgur: about 10–15 min; brown rice: about 30–35 min). Remove cinnamon and drain.","Mix yogurt with garlic, mint, lemon juice and a pinch of salt.","Dress the grain with remaining oil and spices, top with carrots, yogurt sauce, sumac and nuts."],subs:["Plant-based yogurt for dairy-free.","Parsley or dill in place of mint.","Sweet potato, cauliflower or beetroot instead of carrots."],store:"Keep components separate in the fridge for up to 3 days.",allergy:"Bulgur contains gluten (use rice or quinoa for gluten-free); dairy; nuts optional.",tips:["Toast spices briefly; once fragrant, take them off the heat.","Keep the yogurt cold and add it at the end."],uses:["cumin","coriander-seed","true-cinnamon","sumac","spearmint"]},{id:"ginger-lemongrass-soup",n:"Ginger and Lemongrass Soup",dish:"soup",tone:["#9bb342","#c9a15a","#f3ead6","#d1281b"],desc:"A fragrant, light broth with mushrooms, building flavour through an infusion of aromatic stalks and leaves.",insp:"Inspired by the sour-aromatic soups of Southeast Asia, such as Thai tom yum and tom kha. It is a simplified, original recipe and not an authentic version of either.",prep:15,cook:25,serves:4,ing:[[1,"L","vegetable or chicken stock",[4,"cups"]],[2,"","lemongrass stalks, trimmed and bruised"],[4,"cm","fresh ginger or galangal, sliced",[1.5,"inch"]],[4,"","makrut lime leaves (optional)"],[250,"g","mushrooms, sliced",[3,"cups"]],[200,"ml","coconut milk (optional)",[.75,"cup"]],[1,"","fresh red chilli, sliced (optional)"],[1,"tbsp","soy sauce or fish sauce"],[2,"tbsp","lime juice"],[1,"handful","coriander leaves"]],steps:["Trim the lemongrass, remove tough outer layers, and bruise the stalks with the back of a knife; cut into 5 cm pieces.","Bring stock, lemongrass, ginger and lime leaves to a gentle simmer. Cook uncovered for 15 minutes.","Add mushrooms and chilli, simmer 5 minutes more. Stir in coconut milk if using and warm gently; do not boil hard.","Season with soy or fish sauce. Take off the heat and add lime juice, since heat dulls acidity and aroma.","Remove lemongrass pieces and lime leaves if you wish, or warn diners not to eat them. Top with coriander leaves."],subs:["Lemon zest and a bay leaf for lemongrass and lime leaves (approximate).","Tofu, prawns or chicken pieces for protein.","Dried lime leaves, fewer pieces."],store:"Refrigerate for up to 3 days. Reheat gently.",allergy:"Soy, fish sauce (fish), possible shellfish if prawns are added. Check stock labels.",tips:["Bruising releases aroma from fibrous stalks.","Keep chilli optional so everyone can adjust at the table."],uses:["lemongrass","ginger","galangal","makrut-lime-leaf","coriander-leaf"]},{id:"baharat-rice",n:"Baharat-Style Spiced Rice Pilaf",dish:"bowl",tone:["#c9a15a","#7a4a2d","#e09a0e","#3f8a3c"],desc:"Fluffy rice scented with a warm spice mixture, toasted nuts and sweet dried fruit.",insp:"Inspired by spiced rice dishes in the Gulf and wider Middle East, where baharat (Arabic for 'spices') is a common blend. Formulas differ widely; see Chapter 10. This is not a specific traditional dish.",prep:15,cook:30,serves:4,ing:[[300,"g","basmati rice",[1.5,"cups"]],[1,"","onion, finely chopped"],[2,"tbsp","olive oil or butter"],[2,"tsp","baharat-style spice blend (see Chapter 10)"],[1,"","cinnamon stick"],[4,"","green cardamom pods, lightly crushed"],[550,"ml","water or stock",[2.25,"cups"]],[.75,"tsp","salt"],[40,"g","raisins or chopped dried apricots",[.25,"cup"]],[40,"g","toasted pine nuts or almonds",[.25,"cup"]],[2,"tbsp","chopped parsley"]],steps:["Rinse rice in several changes of water until it runs mostly clear; soak for 15 minutes and drain.","Warm the oil in a heavy pot. Cook the onion on medium heat for 8 minutes until soft and golden.","Add baharat, cinnamon and cardamom; stir for 30 seconds until fragrant.","Add the rice and stir for a minute to coat. Add water or stock and salt; bring to a boil.","Cover tightly, reduce to the lowest heat and cook for 12–15 minutes. Turn off the heat and let it rest, covered, for 10 minutes.","Fluff with a fork, fold in dried fruit, nuts and parsley; remove whole spices if you like."],subs:["Garam masala or a mix of cumin, coriander, and cinnamon for baharat.","Currants or chopped dates for raisins.","Toasted sunflower seeds for nuts."],store:"Cool quickly and refrigerate within 1 hour; reheat until steaming hot and eat within 1–2 days. Rice carries a small risk of Bacillus cereus if left warm.",allergy:"Tree nuts (pine nuts, almonds) optional; butter is dairy.",tips:["Resting the rice off the heat is what makes it fluffy.","Do not lift the lid while the rice cooks."],uses:["true-cinnamon","green-cardamom","parsley","cloves"]},{id:"shiso-rice",n:"Shiso and Sesame Rice",dish:"bowl",tone:["#7a2f6e","#f3ead6","#3f8a3c","#25221b"],desc:"Warm short-grain rice folded with fresh shiso, toasted sesame and a little vinegar.",insp:"Inspired by Japanese mixed-rice and furikake-style seasonings, where shiso and sesame are common. This is an original home-style adaptation, not a specific traditional dish.",prep:10,cook:20,serves:4,ing:[[300,"g","short-grain (sushi) rice",[1.5,"cups"]],[360,"ml","water, for rinsed rice",[1.5,"cups"]],[8,"","fresh green shiso leaves"],[2,"tbsp","toasted sesame seeds"],[1,"tbsp","rice vinegar"],[.5,"tsp","salt"],[1,"tsp","toasted sesame oil (optional)"]],steps:["Rinse the rice in cold water until it runs mostly clear; drain and soak for 20 minutes if time allows.","Cook rice with measured water: bring to a boil, cover, reduce to the lowest heat for 12 minutes, then rest covered for 10 minutes.","Meanwhile, rinse shiso, dry well, remove thick stems, stack and slice into thin ribbons.","Gently fold vinegar, salt and sesame oil into the hot rice with a rice paddle, cutting rather than stirring.","Fold in sesame seeds and shiso just before serving; shiso darkens as it sits."],subs:["Basil, mint and a little coriander leaf in place of shiso.","Black sesame seeds or crushed nori.","Brown rice with longer cooking."],store:"Eat on the day it is made. Refrigerate leftovers within 1 hour and reheat thoroughly.",allergy:"Sesame is a major allergen.",tips:["Add shiso at the end to keep its colour and aroma.","Use a gentle folding motion; stirring makes rice gluey."],uses:["shiso"]},{id:"cardamom-porridge",n:"Cardamom and Cinnamon Porridge",dish:"bowl",tone:["#c9a15a","#8cae4f","#c88a52","#e7dfc9"],desc:"A creamy oat porridge infused with whole spices and topped with fruit.",insp:"Spices and oats are combined in many breakfast traditions; cardamom with milk is common in South Asian and Scandinavian sweet dishes. This recipe is an original combination.",prep:5,cook:15,serves:2,ing:[[80,"g","rolled oats",[1,"cup"]],[500,"ml","milk or plant-based milk, plus water as needed",[2,"cups"]],[4,"","green cardamom pods, lightly crushed"],[1,"","cinnamon stick (or 0.5 tsp ground)"],[1,"pinch","salt"],[1,"","apple or pear, diced"],[2,"tsp","honey, maple syrup or sugar (optional)"],[2,"tbsp","chopped nuts or seeds (optional)"]],steps:["Warm the milk with cardamom and the cinnamon stick over low heat until steaming. Do not boil. Cover and infuse for 10 minutes if you have time.","Add oats and salt. Simmer gently for 5–8 minutes, stirring often, until creamy; add water if too thick.","Remove spice pieces. Taste and sweeten if wanted.","Top with fruit and nuts. A pinch of freshly ground cardamom seeds on top adds aroma."],subs:["Ground cardamom, 1/4 tsp, instead of pods.","Nutmeg or ginger for a different profile.","Quinoa flakes or millet for oats."],store:"Refrigerate for up to 3 days; add a splash of milk when reheating.",allergy:"Dairy (use plant milk); oats may contain gluten through cross-contamination; nuts optional.",tips:["Whole spices infuse gently without making the porridge gritty.","Add apple at the end for texture, or simmer it for a softer result."],uses:["green-cardamom","true-cinnamon"]},{id:"global-veg-stew",n:"Globally Inspired Vegetable Stew",dish:"soup",tone:["#d9822b","#c23b1e","#2e6b35","#7a4a2d"],desc:"A hearty stew that combines ginger, smoked paprika, cumin, allspice and thyme with sweet potato and greens.",insp:"Combines techniques and seasonings found in West African, Caribbean, Iberian and South Asian stews. It is an original fusion, not a traditional dish of any one place.",prep:20,cook:40,serves:6,ing:[[2,"tbsp","neutral oil"],[1,"","large onion, chopped"],[3,"","garlic cloves, minced"],[1,"tbsp","fresh ginger, grated"],[1,"tsp","ground cumin"],[1,"tsp","smoked paprika"],[.5,"tsp","ground allspice"],[400,"g","chopped tomatoes (1 can)",[1.75,"cups"]],[500,"g","sweet potato, cubed",[3,"cups"]],[400,"g","cooked chickpeas or beans (1 can), drained",[1.5,"cups"]],[750,"ml","vegetable stock",[3,"cups"]],[3,"","thyme sprigs"],[1,"","whole chilli (optional, do not burst)"],[100,"g","kale or other greens, chopped",[2,"cups"]],[1,"tbsp","lime or lemon juice"]],steps:["Heat oil in a large pot over medium heat. Cook the onion with a pinch of salt for 8 minutes until soft.","Add garlic and ginger and cook for 1 minute. Add cumin, paprika and allspice and stir for 30 seconds, keeping the heat moderate so the spices don't burn.","Add tomatoes and scrape up the browned bits. Cook for 5 minutes until thickened.","Add sweet potato, chickpeas, stock, thyme and the whole chilli. Bring to a boil, then simmer, partly covered, for 20–25 minutes until the potato is t ic word for spices. It describes a family of mixtures that vary by country: Gulf, Levantine, Iraqi and Turkish versions are all distinct.",common:["black pepper","cumin","coriander","cinnamon","cloves","cardamom","nutmeg","paprika","dried lime (sometimes)"],vary:"Gulf versions may include dried lime and saffron; Turkish baharat can contain mint; Levantine versions may emphasise allspice and cinnamon.",flav:"Warm, sweet-savoury and peppery.",uses:"Rice dishes, meat, kofta, stews, lentil soups and vegetable dishes.",home:{yield:"about 4 tbsp",parts:[[1,"tbsp","black pepper"],[1,"tbsp","ground paprika"],[2,"tsp","ground cumin"],[2,"tsp","ground coriander"],[2,"tsp","ground cinnamon"],[.5,"tsp","ground cloves"],[.5,"tsp","ground cardamom"],[.5,"tsp","grated nutmeg"]],method:"Combine and store airtight. Toast the cumin and coriander seeds before grinding for more aroma."},subs:"Allspice with cumin and cinnamon is a close approximation.",allergy:"Usually allergen-free; check commercial products."},{id:"berbere",n:"Berbere",region:"Ethiopia and Eritrea",ctx:"A red, chilli-based mixture that is central to Ethiopian and Eritrean stews such as doro wat and many vegetable and lentil dishes. Families often make their own, sometimes through lengthy, communal preparation.",common:["dried red chillies","paprika","garlic and ginger","fenugreek","coriander","cardamom","black pepper","cloves","korarima (Ethiopian cardamom)","ajwain or nigella (varies)","salt"],vary:"Heat level and the spices included vary widely. Some households blend with wet ingredients; others keep it dry.",flav:"Fiery, fruity, earthy and aromatic with a hint of fenugreek.",uses:"Stews (wat), lentils, vegetables, meat, eggs and flatbread dips.",home:{yield:"about 5 tbsp",parts:[[3,"tbsp","paprika or mild chilli powder"],[1,"tbsp","cayenne or hot chilli powder (adjust)"],[1,"tsp","ground ginger"],[1,"tsp","ground fenugreek"],[1,"tsp","ground coriander"],[.5,"tsp","ground cardamom"],[.5,"tsp","black pepper"],[.25,"tsp","ground cloves"],[1,"tsp","garlic powder"],[1,"tsp","salt"]],method:"Mix all the spices, taste a pinch in warm oil and adjust heat and salt. Store airtight."},subs:"Without korarima, add more cardamom. Replace some chilli with paprika for a milder version.",allergy:"Check commercial products for mustard, celery or other additions. Fenugreek is a legume."},{id:"herbes-de-provence",n:"Herbes de Provence",region:"Southern France (Provence); popularised internationally in the 20th century",ctx:"A mixture of dried herbs typical of the region's landscape. The 'classic' proportion is not codified, and lavender in the mix is a modern, largely commercial addition.",common:["thyme","savory","rosemary","oregano or marjoram","basil (sometimes)","lavender (sometimes)"],vary:"Commercial blends often have a heavier hand with fennel seed or lavender; French labels may state Label Rouge for some mixtures.",flav:"Herbaceous, piney and warm; lavender adds a floral note.",uses:"Roasted vegetables, grilled meats and fish, potatoes, stews and focaccia.",home:{yield:"about 5 tbsp",parts:[[2,"tbsp","dried thyme"],[1,"tbsp","dried savory"],[1,"tbsp","dried oregano or marjoram"],[2,"tsp","dried rosemary, crushed"],[.5,"tsp","dried lavender buds (optional, culinary grade)"]],method:"Crumble the herbs between your fingers, mix, and store in a dark jar. Use lavender sparingly; too much tastes soapy."},subs:"Italian seasoning (basil, oregano, thyme) is a rough approximation.",allergy:"Typically allergen-free. Use only culinary-grade lavender."},{id:"five-spice",n:"Chinese five-spice powder",region:"China, with variants across East and Southeast Asia",ctx:"A blend built on balancing five flavours in Chinese culinary thought (sweet, sour, bitter, pungent, salty), though the exact spices differ.",common:["star anise","cloves","cassia or Chinese cinnamon","Sichuan pepper","fennel seeds"],vary:"Some versions include ginger, licorice root, white pepper or dried tangerine peel. Taiwanese, Vietnamese and other versions differ.",flav:"Sweet, licorice-like, warm and slightly numbing.",uses:"Roast duck and pork, braises, marinades and stir-fries; use sparingly.",home:{yield:"about 3 tbsp",parts:[[3,"","whole star anise"],[1,"tsp","fennel seeds"],[1,"tsp","Sichuan peppercorns"],[1,"","cassia stick (5 cm), broken"],[.5,"tsp","cloves"]],method:"Toast whole spices briefly in a dry pan on low heat, cool, and grind finely in a spice mill."},subs:"Allspice with a bit of fennel and cinnamon approximates the warmth.",allergy:"Usually allergen-free. Verify star anise source (see the star anise profile)."},{id:"curry-powder",n:"Curry powder",region:"A British colonial-era commercial concept built from South Asian cooking; widely used in the UK, Caribbean, Japan, South Africa and elsewhere",ctx:"Curry powder is not a traditional Indian category; Indian cooks use dish-specific spice combinations. It evolved as a convenient commercial blend, and each country has its own style (for example, Japanese curry roux, Jamaican curry powder).",common:["turmeric","coriander","cumin","fenugreek","chilli or black pepper","ginger","mustard","fennel (varies)"],vary:"Madras-style blends are hotter; Jamaican blends often contain more allspice and little chilli; Japanese curry powder is milder with sweetness.",flav:"Earthy, warm, golden and mild to hot.",uses:"Quick curries, rice dishes, soups, egg salad and roasted vegetables.",home:{yield:"about 5 tbsp",parts:[[2,"tbsp","ground coriander"],[1,"tbsp","ground cumin"],[1,"tbsp","ground turmeric"],[1,"tsp","ground ginger"],[1,"tsp","ground fenugreek"],[1,"tsp","black pepper"],[.5,"tsp","chilli powder (adjust)"]],method:"Mix and bloom 1–2 tbsp of the blend in hot oil for 30 seconds at the start of cooking."},subs:"Garam masala plus turmeric works in a pinch, though garam masala is normally added late.",allergy:"Check commercial blends for mustard, celery and wheat-based fillers."},{id:"jerk",n:"Jerk seasoning",region:"Jamaica",ctx:"A seasoning and cooking method closely associated with Jamaica, with roots in the island's history, including the Maroon communities. Commercial 'jerk' products are often much simplified.",common:["allspice (pimento)","Scotch bonnet chilli","thyme","spring onion (scallion)","garlic","ginger","black pepper","nutmeg and cinnamon (varies)","salt"],vary:"Wet pastes and dry rubs both exist. Heat levels and sweetness (some add brown sugar) vary by cook; true jerk is traditionally cooked over pimento wood.",flav:"Hot, warmly spiced and fragrant.",uses:"Chicken, pork, fish, tofu and vegetables; grilled or roasted.",home:{yield:"about 4 tbsp (dry)",parts:[[1,"tbsp","ground allspice"],[2,"tsp","dried thyme"],[2,"tsp","garlic powder"],[1,"tsp","onion powder"],[1,"tsp","ground black pepper"],[.5,"tsp","cayenne or ground habanero (adjust)"],[.5,"tsp","ground nutmeg"],[.5,"tsp","ground cinnamon"],[1,"tsp","brown sugar (optional)"],[1,"tsp","salt"]],method:"Mix. For a wet marinade, blend 2 tbsp of the mix with 3 spring onions, 2 garlic cloves, 1 tbsp lime juice and 1 tbsp oil. Marinate for several hours; cook meat to a safe internal temperature."},subs:"Use another hot chilli if Scotch bonnet is unavailable; the fruity flavour differs.",allergy:"Usually allergen-free; some commercial marinades include soy or wheat."},{id:"cajun",n:"Cajun seasoning",region:"Louisiana, United States (Cajun culinary tradition of French-Acadian descent)",ctx:"A seasoning mixture associated with Louisiana cooking. The Cajun and Creole traditions are distinct but related, and commercial 'Cajun seasoning' is a modern convenience product.",common:["paprika","cayenne","garlic powder","onion powder","black pepper","white pepper","oregano","thyme","salt"],vary:"Salt content and heat vary a great deal between brands; check before adding salt to a recipe.",flav:"Savoury, peppery and moderately hot.",uses:"Blackened fish, shrimp, rice dishes, gumbo seasoning, fried chicken and roasted potatoes.",home:{yield:"about 5 tbsp",parts:[[2,"tbsp","paprika"],[2,"tsp","garlic powder"],[2,"tsp","onion powder"],[1,"tsp","dried oregano"],[1,"tsp","dried thyme"],[1,"tsp","black pepper"],[.5,"tsp","white pepper"],[.5,"tsp","cayenne (adjust)"],[1,"tsp","salt"]],method:"Mix thoroughly. Taste a pinch with rice or potato and adjust the salt and heat."},subs:"Smoked paprika adds depth; chilli flakes for cayenne.",allergy:"Check commercial blends for celery, mustard and anti-caking agents."},{id:"dukkah",n:"Dukkah",region:"Egypt, and wider eastern Mediterranean",ctx:"A dry, crunchy mixture of nuts, seeds and spices, traditionally used as a dip with bread and olive oil. Its name derives from the Arabic for 'to pound'.",common:["hazelnuts or other nuts","sesame seeds","coriander seeds","cumin seeds","salt","pepper (varies)"],vary:"Nuts, seeds and spices vary by family; some versions include chickpeas, fennel, thyme or mint.",flav:"Nutty, toasty and warmly spiced.",uses:"Dip for bread with oil; sprinkled on eggs, salads, soups, roasted vegetables and fish.",home:{yield:"about 1 cup",parts:[[75,"g","hazelnuts or almonds",[.5,"cup"]],[3,"tbsp","sesame seeds"],[2,"tbsp","coriander seeds"],[1,"tbsp","cumin seeds"],[1,"tsp","black peppercorns"],[.5,"tsp","flaky salt"]],method:"Toast nuts at 180 °C (350 °F) for 8–10 minutes, then toast seeds and spices in a dry pan. Cool; pulse or pound to a coarse, crumbly texture without making a paste."},subs:"Pistachios, cashews or sunflower seeds for hazelnuts.",allergy:"Tree nuts and sesame are major allergens."},{id:"furikake",n:"Furikake",region:"Japan",ctx:"A dry seasoning sprinkled over rice. The word relates to 'sprinkle'. Commercial products are very diverse; shiso, bonito, egg and seaweed varieties are all common.",common:["nori seaweed","toasted sesame seeds","salt","sugar","dried shiso (yukari) or bonito flakes","dried egg (some varieties)"],vary:"Vegan versions omit fish; some are very salty or sweet. Wasabi, plum and salmon are popular flavours.",flav:"Savoury, salty, toasty, with sea-like and umami notes.",uses:"Rice, onigiri, noodles, eggs, popcorn, avocado and fish.",home:{yield:"about 1/2 cup",parts:[[2,"","nori sheets, crumbled"],[2,"tbsp","toasted sesame seeds"],[1,"tsp","fine salt"],[1,"tsp","sugar"],[1,"tsp","dried shiso or crushed dried herbs"]],method:"Toast nori briefly over a low flame or in a dry pan, crumble and mix with the other ingredients. Store in a sealed jar."},subs:"Use dried bonito flakes (not vegan) or dried mushroom powder for umami.",allergy:"Sesame, fish and egg (varies); check labels. Seaweed iodine content is high; consult a health professional if on a thyroid-related diet."},{id:"adobo-seasoning",n:"Adobo-style seasoning",region:"Latin America and the Caribbean (dry seasoning); distinct from Filipino adobo, which is a cooking method",ctx:"'Adobo' has different meanings: in Spain and Mexico it refers to marinades or chilli-based sauces; in the Philippines it is a braise with vinegar, soy sauce, garlic and pepper; in Puerto Rico and across Latin America 'adobo' often means a dry all-purpose seasoning salt.",common:["garlic powder","onion powder","oregano","black pepper","salt","turmeric or annatto (colour)","cumin (varies)"],vary:"Commercial adobo is mostly salt. The blend is different from Mexican chilli adobo sauce and from Filipino adobo.",flav:"Savoury, garlicky and herbaceous.",uses:"Rubbing on meat, poultry, beans, rice and vegetables.",home:{yield:"about 1/3 cup",parts:[[1,"tbsp","garlic powder"],[1,"tbsp","onion powder"],[2,"tsp","dried oregano"],[2,"tsp","ground black pepper"],[1,"tsp","ground cumin"],[1,"tsp","turmeric"],[1,"tbsp","fine salt"]],method:"Mix; reduce the salt if you prefer to season separately."},subs:"Use Mexican oregano for a more regional feel.",allergy:"Check commercial blends for MSG, anti-caking agents or sulphites."},{id:"panch-phoron",n:"Panch phoron",region:"Eastern India and Bangladesh (Bengal, Odisha, Assam)",ctx:"A blend of five whole seeds ('panch' means five) rather than a powder, used mostly for tempering in hot oil.",common:["fenugreek seeds","nigella seeds","mustard seeds","cumin seeds","fennel seeds"],vary:"Equal parts are typical, but some cooks reduce fenugreek to avoid bitterness. Wild celery or radhuni may feature in some Bengali versions.",flav:"Nutty, bitter-sweet and anise-like with a slight pungency.",uses:"Tempering lentils, vegetables and fish dishes; flatbreads and pickles.",home:{yield:"about 5 tbsp",parts:[[1,"tbsp","cumin seeds"],[1,"tbsp","fennel seeds"],[1,"tbsp","nigella seeds"],[1,"tbsp","brown mustard seeds"],[1,"tsp","fenugreek seeds"]],method:"Mix whole seeds and store whole. Temper 1 tsp in hot oil until the mustard seeds start to pop."},subs:"A mixture of cumin, fennel and mustard seeds works if you have no nigella.",allergy:"Mustard is a major allergen; fenugreek is a legume."},{id:"shichimi",n:"Shichimi togarashi",region:"Japan",ctx:"The name means 'seven-flavour chilli pepper'. It has been used as a table seasoning in Japan for centuries, and formulas vary by shop and region.",common:["dried red chilli","sansho (Japanese pepper)","dried orange or tangerine peel","black and white sesame seeds","nori","ginger","poppy or hemp seeds"],vary:"Heat levels range from mild to hot; some shops grind their own.",flav:"Hot, citrusy, nutty and numbing from the sansho.",uses:"Noodle soups, grilled chicken (yakitori), udon, rice, tofu and vegetables.",home:{yield:"about 4 tbsp",parts:[[1,"tbsp","chilli flakes"],[2,"tsp","dried orange peel, crushed"],[2,"tsp","sesame seeds, toasted"],[1,"tsp","Sichuan peppercorns, ground (or sansho)"],[1,"tsp","crumbled nori"],[.5,"tsp","ground ginger"],[.5,"tsp","poppy seeds"]],method:"Combine and grind lightly, leaving some texture. Store airtight."},subs:"Sichuan pepper for sansho (a different but related type); lemon zest for orange peel.",allergy:"Sesame is a major allergen; some products include poppy or mustard seeds."}],Cf=[{t:"Adulteration",d:"Deliberate addition of foreign material (for example starch, dyes or other plant matter) to a product to increase profit or disguise low quality."},{t:"Aril",d:"A fleshy or lacy covering that grows around a seed. Mace is the aril of the nutmeg seed."},{t:"Bark",d:"The outer protective layer of a woody stem or branch. Cinnamon is made from the inner bark."},{t:"Botanical family",d:"A group of related genera that share structural features, such as Lamiaceae (the mint family) or Apiaceae (the carrot family)."},{t:"Bulb",d:"A short underground stem surrounded by fleshy storage leaves, as in onion and garlic."},{t:"Cassia",d:"Cinnamon-flavoured bark from several Cinnamomum species other than Cinnamomum verum. Usually thicker, darker and stronger."},{t:"Cultivar",d:"A cultivated plant variety selected and maintained for particular traits, written in single quotation marks, for example Ocimum basilicum 'Genovese'."},{t:"Decoction",d:"A liquid made by simmering tougher plant parts (roots, bark, seeds) in water for a period. A technical term used in food and herbal contexts."},{t:"Drupe",d:"A fleshy fruit with a hard stone enclosing the seed, such as a cherry or peppercorn."},{t:"Essential oil",d:"A concentrated, volatile, aromatic liquid extracted from plant material, usually by distillation. Not a cooking ingredient in the ordinary sense and not for swallowing."},{t:"Extract (flavour)",d:"A solution of flavour compounds, such as vanilla extract, made by soaking plant material in a solvent such as alcohol."},{t:"Genus",d:"The first word of a botanical name, grouping closely related species, for example Cinnamomum."},{t:"Herb",d:"In cooking, usually the leafy green parts of non-woody plants used for flavour. Botanically the word has several meanings."},{t:"Hybrid",d:"A plant that results from crossing two species or varieties. Marked with × in botanical names, as in Mentha × piperita."},{t:"Infusion",d:"A liquid made by steeping plant material in hot or cold water without extended simmering."},{t:"Lamiaceae",d:"The mint family. Includes basil, mint, thyme, oregano, sage and rosemary. Often square stems and aromatic leaves."},{t:"Maillard reaction",d:"A group of browning reactions between amino acids and sugars at higher temperatures that create roasted flavours."},{t:"Meta-analysis",d:"A statistical combination of results from several studies of the same question."},{t:"Morphology",d:"The form and structure of an organism, such as leaf shape or flower arrangement."},{t:"Native range",d:"The geographic area where a plant evolved or occurs naturally, as opposed to where it is grown today."},{t:"Pericarp",d:"The wall of a fruit. In pepper, the pericarp is the outer skin removed to make white pepper."},{t:"Phytochemical",d:"Any chemical compound produced by a plant. The word does not imply that a compound is beneficial or harmful."},{t:"Pungency",d:"A sensation of heat, bite or sting caused by compounds such as capsaicin (chilli), piperine (pepper) and allyl isothiocyanate (mustard, horseradish)."},{t:"Rhizome",d:"A horizontal underground stem that stores energy and produces roots and shoots, such as ginger and turmeric."},{t:"Secondary metabolite",d:"A compound not essential for basic plant growth but involved in defence, attraction or protection. Many flavours are secondary metabolites."},{t:"Species",d:"The second word of a botanical name, identifying a particular kind of plant, for example verum in Cinnamomum verum."},{t:"Spice",d:"In cooking, usually dried seeds, fruits, bark, roots, buds or other non-leafy parts used for flavour, colour or aroma."},{t:"Subspecies / variety",d:"Ranks below species used for distinct populations within it (subsp., var.)."},{t:"Synonym",d:"A scientific name no longer accepted that refers to the same plant as the accepted name."},{t:"Systematic review",d:"A structured and transparent search and appraisal of all relevant studies on a question."},{t:"Tempering (tadka, chaunk)",d:"Heating whole spices in hot fat until they release aroma, then adding them to or over a dish."},{t:"Terpene",d:"A large class of aromatic plant compounds, many of which contribute citrus, pine, floral or minty aromas."},{t:"Tincture",d:"A concentrated liquid extract made with alcohol, used mainly in herbal products rather than cooking."},{t:"Umami",d:"The savoury taste associated with glutamate and some other compounds."},{t:"Volatile compound",d:"A molecule that evaporates easily at room temperature and can reach the nose as aroma."},{t:"Whole spice",d:"A spice sold in its intact form: seeds, pods, bark pieces, buds and similar."},{t:"Wild-harvested",d:"Collected from natural populations rather than cultivated. Raises conservation and identification issues."}];function Qa(h,u){const[f,o]=re.useState(()=>{try{const g=localStorage.getItem("hb03:"+h);return g?JSON.parse(g):u}catch{return u}}),m=re.useCallback(g=>{o(j=>{const D=typeof g=="function"?g(j):g;try{localStorage.setItem("hb03:"+h,JSON.stringify(D))}catch{}return D})},[h]);return[f,m]}function zg(){const h=()=>window.location.hash.replace(/^#/,"")||"/",[u,f]=re.useState(h);return re.useEffect(()=>{const o=()=>f(h());return window.addEventListener("hashchange",o),()=>window.removeEventListener("hashchange",o)},[]),u}const Dg=h=>{window.location.hash=h},Rg=/(\*\*[^*]+\*\*|\*[^*]+\*|\[[^\]]+\]\([^)]+\))/g,yf=/\b(Chapters?) (\d{1,2})\b/g;function Og(h,u){const f=[];let o=0,m;for(yf.lastIndex=0;m=yf.exec(h);)m.index>o&&f.push(h.slice(o,m.index)),f.push(i.jsx("a",{href:`#/p/ch${m[2]}`,className:"link",children:m[0]},u+m.index)),o=m.index+m[0].length;return o<h.length&&f.push(h.slice(o)),f}function ft({x:h}){const u=h.split(Rg);return i.jsx(i.Fragment,{children:u.map((f,o)=>{if(!f)return null;if(f.startsWith("**")&&f.endsWith("**"))return i.jsx("strong",{children:f.slice(2,-2)},o);if(f.startsWith("*")&&f.endsWith("*")&&f.length>2)return i.jsx("em",{children:f.slice(1,-1)},o);const m=f.match(/^\[([^\]]+)\]\(([^)]+)\)$/);return m?i.jsx("a",{href:m[2],className:"link", atile.",uses:"Stir-fries, soups, drinks, baking.",subs:"Ground ginger (about a quarter the volume)."},{n:"Parsley (fresh or grown in a pot)",why:"A cheap, versatile fresh herb.",uses:"Sauces, grain salads, soups.",subs:"Coriander leaf, celery leaf."},{n:"Mustard (powder or seeds)",why:"Pungency, emulsifying power and tempering.",uses:"Dressings, pickles, sautés.",subs:"Prepared mustard in sauces."}]},{id:"intermediate",title:"Intermediate pantry",blurb:"Ingredients that expand your cooking range and let you build your own blends.",items:[{n:"Whole cumin and coriander seeds",why:"Toasting and grinding fresh transforms flavour.",uses:"Curries, rubs, dukkah.",subs:"Ground versions."},{n:"Green cardamom pods",why:"Floral and aromatic for sweet and savoury cooking.",uses:"Rice, porridge, baking, drinks.",subs:"Cinnamon with a pinch of nutmeg."},{n:"Whole cloves",why:"Powerful warmth for stocks, baking and braises.",uses:"Rice, mulled drinks, pickles.",subs:"Allspice."},{n:"Whole nutmeg and a fine grater",why:"Fresh grating gives much more aroma.",uses:"Béchamel, spinach, desserts.",subs:"Mace."},{n:"Fennel seeds",why:"Sweet and anise-like; pairs with tomato and pork.",uses:"Sauces, roasted vegetables, breads.",subs:"Anise, caraway."},{n:"Brown mustard seeds",why:"For tempering and pickling.",uses:"Dals, cabbage, pickles.",subs:"Yellow mustard seeds (milder)."},{n:"Sumac",why:"A tart, fruity, lemony finish.",uses:"Salads, grilled meat, yogurt.",subs:"Lemon zest and salt."},{n:"Rosemary (fresh or dried)",why:"Resinous, ideal for roasting.",uses:"Potatoes, lamb, bread.",subs:"Thyme with a little sage."},{n:"Fresh mint",why:"Cooling freshness for sauces and drinks.",uses:"Yogurt sauces, salads, infusions.",subs:"Basil."},{n:"Garam masala (or ingredients to make it)",why:"A finishing blend for South Asian-style dishes.",uses:"Dals, curries, roasted vegetables.",subs:"Cumin, cinnamon and black pepper blend."},{n:"Vanilla extract or pods",why:"Sweet floral depth for baking and okies.",subs:"Almond extract (a few drops)."}]}],Hg=[{title:"Very tight budget",text:"Start with 4–6 items: black pepper, one chilli, cumin, paprika, dried oregano and a bay leaf. Look for unit price (cost per 100 g), not package price. Markets, bulk bins, and South Asian, Middle Eastern and Latin American grocers often sell spices at lower unit prices in larger bags; share a bag with a friend if it is too large."},{title:"Moderate budget",text:"Follow the starter pantry and add 2–3 intermediate whole spices each month. Whole spices last longer, so they cost less over time. A basic blade or burr spice grinder or a mortar and pestle is a worthwhile purchase."},{title:"Flexible budget",text:"Explore: buy small quantities of unusual items and replace them when they fade. Spend where it changes flavour most noticeably (for example saffron, vanilla, whole nutmeg and fresh-ground pepper) while avoiding paying a premium for packaging alone."}],Bg=[{d:1,title:"Train your nose",goal:"Learn to describe aroma with specific words.",about:"Flavour is mostly aroma, perceived through the nose, including when we chew and breathe out (retronasal smell). Words such as 'woody', 'citrus' or 'earthy' make it easier to compare ingredients.",act:"Smell three spices you already own, one at a time, with a rest between each. Rub a little between your fingers first.",obs:"Write three words for each. Which smell comes first, and which lingers?",ask:"Which smell did you most expect to like or dislike, and was your guess right?"},{d:2,title:"Parsley, leaves and stems",goal:"Understand which parts of an herb carry flavour.",about:"In parsley and coriander, stems have concentrated flavour and a firmer texture; leaves are delicate. Chopping finely makes both more pleasant.",act:"Taste a leaf and a stem separately, then chop both and make the green herb sauce.",obs:"How do raw leaf and stem differ in sweetness, bitterness and crunch?",ask:"When might you use stems in cooking rather than discarding them?",recipe:"green-herb-sauce",recipeLabel:"Versatile Green Herb Sauce"},{d:3,title:"Pepper, whole versus ground",goal:"Compare whole and pre-ground spice.",about:"Whole spices keep volatile oils inside; grinding exposes more surface area, so aroma escapes faster.",act:"Crush a few peppercorns and compare with a pinch of old ground pepper on a slice of bread or potato.",obs:"Which is more citrusy or floral? Which is simply hot?",ask:"Which spices in your kitchen are worth buying whole?"},{d:4,title:"Toast and grind",goal:"Learn how dry toasting changes spices.",about:"Gentle heat deepens aroma through reactions that create new flavour compounds, but too much heat makes spices bitter.",act:"Toast cumin and coriander seeds in a dry pan on medium-low heat for 1–2 minutes. Compare them with untoasted seeds.",obs:"How does the aroma change? When did you notice it? Can you detect the point just before burning?",ask:"What cues tell you it is time to remove spices from the pan?",recipe:"spiced-chickpeas",recipeLabel:"Spiced Roasted Chickpeas"},{d:5,title:"Fresh and dried oregano",goal:"Understand why dried herbs are not weaker versions of fresh.",about:"Drying changes the chemistry. Oregano often tastes stronger and warmer when dried, while basil becomes hay-like.",act:"Taste a pinch of dried oregano and a leaf of fresh (if available) in a little olive oil.",obs:"Describe the difference in sweetness, bitterness and aroma.",ask:"Which dishes would suit each?",recipe:"med-dressing",recipeLabel:"Mediterranean-Inspired Herb Dressing"},{d:6,title:"Garlic: whole, sliced, crushed",goal:"See how preparation changes pungency.",about:"Crushing garlic breaks cells and starts enzyme reactions that generate pungent sulphur compounds; whole cloves cooked gently are mild and sweet.",act:"Gently sauté three small portions of garlic (whole, sliced, crushed) for the same time in oil. Taste each.",obs:"Rank them by pungency. Note which one burned most easily.",ask:"How would you cut garlic f
