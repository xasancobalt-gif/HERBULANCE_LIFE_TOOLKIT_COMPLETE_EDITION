xin. Refrigerate garlic-in-oil, use it within a few days, or follow tested preservation guidance from your national food-safety authority."},{t:"widget",id:"atlas:6"}],takeaways:["Bulbs, rhizomes and roots are different structures.","Cutting method determines pungency in alliums.","Never keep garlic in oil at room temperature."],refs:["nccih-ginger","nccih-garlic","nccih-turmeric","forsyth"]},{id:"ch7",num:7,part:fr,title:"Seeds, Barks, Flowers and Fruit-Based Spices",sub:"Twenty-six profiles of the classic spice rack",objectives:["Classify spices by plant part","Distinguish true cinnamon from cassia","Distinguish green from black cardamom","Understand pepper, chilli and paprika naming"],blocks:[{t:"p",x:"This is the heart of the spice rack: dry seeds, fruits, bark, buds, stigmas and resins. Here, naming confusion is most common, so this chapter includes several comparison guides."},{t:"h",x:"Cinnamon and cassia"},{t:"fig",id:"cinnamon",cap:"Cinnamon (Cinnamomum verum) forms thin, multi-layered quills; cassia is a thicker, single-layer bark roll."},{t:"table",head:["","True cinnamon","Cassia"],rows:[["Botanical name","*Cinnamomum verum*","*C. cassia* (China), *C. burmannii* (Indonesia), *C. loureiroi* (Vietnam)"],["Appearance","Pale tan, thin, many layers like a cigar","Dark reddish-brown, thick, hollow single scroll"],["Texture","Brittle, crumbly","Hard, woody"],["Flavour","Delicate, sweet, floral","Strong, spicy, pungent"],["Coumarin","Very low","Considerably higher"],["Typical source","Sri Lanka, Madagascar","China, Indonesia, Vietnam"]]},{t:"note",k:"safety",title:"Coumarin in cassia",x:"Cassia contains coumarin, which in high, sustained intakes can affect the liver in sensitive people. EFSA set a tolerable daily intake. Occasional baking is unlikely to approach it, but heavy daily use of cassia (for example in supplements or large amounts in porridge for children) deserves thought. Using true cinnamon, or varying your spices, is a sensible precaution."},{t:"h",x:"Cardamom"},{t:"fig",id:"cardamom",cap:"Green cardamom (Elettaria) and black cardamom (Amomum) are different genera."},{t:"table",head:["","Green cardamom","Black cardamom"],rows:[["Botanical name","*Elettaria cardamomum*","*Amomum subulatum* (and related species)"],["Pod","Small, pale green, smooth","Large, dark brown, wrinkled"],["Flavour","Sweet, floral, eucalyptus-like","Smoky, camphor-like, earthy"],["Used in","Sweets, tea, rice, coffee","Rich savoury dishes, long-cooked meat and rice"]]},{t:"h",x:"Pepper, peppercorns and ‘peppers’"},{t:"ul",items:["**Black, white, green and red peppercorns** are usually the same species (*Piper nigrum*) harvested and processed differently.","**Long pepper** (*Piper longum*) is a related species.","**Chilli peppers** (*Capsicum*) are unrelated to *Piper* and were named 'pepper' by Europeans for their heat.","**Sichuan pepper** (*Zanthoxylum*) is in the citrus family and gives tingling, not heat.","**Pink peppercorns** are usually from *Schinus* species in the cashew family, not *Piper*."]},{t:"note",k:"safety",title:"A star anise caution",x:"Star anise (*Illicium verum*) is a culinary spice. Japanese star anise (*Illicium anisatum*) is toxic and has been found in contaminated products, particularly teas. Buy from reputable suppliers and avoid unlabeled or foraged star-shaped fruits."},{t:"widget",id:"atlas:7"}],takeaways:["Most supermarket cinnamon is cassia.","Green and black cardamom are different genera.","Chilli, black pepper and Sichuan pepper are three unrelated plants.","Look-alike toxic species exist for some spices."],refs:["nccih-cinnamon","efsa-coum","iso3632"]},{id:"ch8",num:8,part:fr,title:"International Herbs and Spices — Beyond the Familiar",sub:"Thirteen regional ingredients with careful treatment",objectives:["Meet regionally important ingredients","Understand selection criteria","Recognise ingredients with specific cautions"],blocks:[{t:"p",x:"Every cuisine has ingredients that are essential locally but little known elsewhere. We included only ingredients with a verifiable botanical identity, clear culinary relevance, trustworthy sources and a safe treatment in an educational book. We did not add unusual plants merely to raise the count."},{t:"note",k:"safety",title:"Ingredients we left out on purpose",x:"Some plants are important to local food or medicine but difficult to identify, regulated, or toxic if misused. We have omitted practical use instructions for such plants. Where an included ingredient has a toxicity concern (epazote oil, juniper species, sorrel oxalate), the profile says so clearly."},{t:"note",k:"trad",title:"Za’atar and cultural meaning",x:"The za’atar herb carries deep cultural meaning in the Levant, and wild harvesting is a conservation concern in some places. Buy responsibly sourced material where possible."},{t:"widget",id:"atlas:8"}],takeaways:["Regional ingredients are best learned one at a time.","Check for toxicity or oxalate cautions in profiles.","Source wild-harvested herbs responsibly."],refs:["powo","katzer"]}],pg=[{id:"ch9",num:9,part:mr,title:"A Journey Through Global Culinary Traditions",sub:"Geography, trade, migration and flavour",objectives:["Understand how climate, trade and migration moved ingredients","Avoid single-origin and stereotype claims","Explore regional patterns respectfully"],blocks:[{t:"p",x:"No cuisine is a fixed list of ingredients. Each is a conversation among geography, agriculture, trade, migration, religion, technology and individual creativity. This chapter offers a map of patterns, not rules; every region contains many cuisines, and every kitchen has its own habits."},{t:"note",k:"uncert",title:"A caution on generalisations",x:"The table below lists **commonly used** ingredients in broad regions. It is not exhaustive, not exclusive, and certainly not a stereotype. Millions of cooks within each region cook differently from the pattern."},{t:"table",head:["Region","Frequently used herbs and spices (examples)","Context"],rows:[["South Asia","Cumin, coriander, turmeric, chilli, cardamom, cloves, mustard seed, curry leaf, fenugreek, asafoetida","Regional diversity is enormous; tempering, spice pastes and finishing blends such as garam masala feature, but styles differ by state, community and religion."],["East Asia","Ginger, garlic, Sichuan pepper, star anise, cassia, shiso, sesame, chives, white pepper","Aromatics and sauces often carry flavour; five-spice and shichimi are blended styles."],["Southeast Asia","Lemongrass, galangal, makrut lime, pandan, Thai basil, turmeric, coriander root, chilli","Fresh aromatics are pounded into pastes; herbs are eaten raw as part of the dish."],["Middle East","Sumac, za’atar herbs, cumin, coriander, cardamom, allspice, mint, parsley, saffron, dried lime","Herbs form the bulk of many dishes; spice blends such as baharat vary by country."],["North Africa","Cumin, coriander, ginger, turmeric, cinnamon, saffron, paprika, harissa chilli paste, preserved lemon","Tagines and couscous; ras el hanout is a merchant’s blend."],["Sub-Saharan Africa","Chilli, ginger, grains of paradise, berbere (Ethiopia), thyme, scent leaf, uziza (West Africa), fenugreek, nigella","A vast region with diverse foodways; many ingredients are native and many were introduced centuries ago."],["Mediterranean","Oregano, thyme, rosemary, parsley, basil, bay, fennel, garlic, saffron","Herb-forward, olive oil-rich cooking; tomatoes and chillies arrived after contact with the Americas."],["Europe (north, central, east)","Dill, caraway, juniper, horseradish, parsley, nutmeg, mustard, paprika (Hungary), chives","Preserving traditions such as pickling and curing shaped spice use."],["Latin America","Chillies, cilantro, epazote, Mexican oregano, achiote, cumin, allspice, vanilla, culantro","Many staples are native to the Americas and were later adopted worldwide."],["Caribbean","Allspice, thyme, Scotch bonnet, culantro, ginger, nutmeg, annatto, curry powder","A blend of Indigenous, African, European, Indian and Asian influences."],["North America","Chilli, paprika, sage, mustard, cinnamon, vanilla, Cajun and Southwestern blends; also Indigenous foods such as wild sumac and juniper in many Nations’ foodways","A mix of Indigenous, immigrant and regional traditions."]]},{t:"h",x:"What moved ingredients around?"},{t:"ul",items:["**Trade:** Spices such as pepper, cinnamon, clove and nutmeg moved along overland and maritime routes connecting Asia, the Middle East, Africa and Europe for millennia. Documented history includes both mutually beneficial exchange and exploitative colonial control.","**The Columbian Exchange:** After the late 15th century, plants moved between the Americas and the rest of the world. Chillies, vanilla, allspice and annatto spread from the Americas; Old World spices such as ginger and black pepper were cultivated in new regions.","**Migration and diaspora:** Indian cooks brought curry leaves and spice-tempering to East Africa, the Caribbean and Southeast Asia; West African foodways travelled with enslaved people to the Americas, shaping Caribbean and Southern US cooking.","**Climate and agriculture:** Tropical regions grow clove, pepper and cardamom; temperate regions grow dill, caraway and horseradish; Mediterranean climates favour woody herbs.","**Religion and culture:** Dietary practices (for example avoidance of onion and garlic in some traditions, which made asafoetida important) influence spice choices."]},{t:"note",k:"trad",title:"Indigenous and local culinary knowledge",x:"Indigenous peoples across the world developed, domesticated and cooked with plants long before others documented them. Examples include the Mesoamerican cultivation of chillies, vanilla and annatto, and the use of juniper, sumac and wild herbs in many North American Nations. We refer to peoples by name where sources allow, and we do not reproduce sacred or restricted knowledge. For a respectful and complete picture, seek out food writing and projects led by community members."},{t:"note",k:"uncert",title:"Folklore versus documented history",x:"Stories such as 'pepper was once worth its weight in gold' circulate widely. Spices were valuable, but specific claims about prices often come from selective sources. Where we can, we point readers to scholarly food history; where we cannot verify a claim, we leave it out."}],takeaways:["Cuisines are shaped by geography, trade, migration and creativity.","Avoid claiming that any ingredient belongs to only one place.","Distinguish documented history from folklore."],refs:["davidson","toussaint","katzer"]},{id:"ch10",num:10,part:mr,title:"Famous Spice Blends and Herb Mixtures",sub:"Fifteen blends, their variations and illustrative home versions",objectives:["Understand blends as families, not single recipes","Make small illustrative blends","Recognise allergen risks in commercial blends"],blocks:[{t:"p",x:"A blend is a flavour idea, not a formula. Most blends have many versions, shaped by place, family, season, budget and taste. A shop in one city may sell several types of garam masala; two households may make different za’atar from the same ingredients."},{t:"note",k:"uncert",title:"No ‘authentic’ recipe",x:"The home versions below are **illustrative starting points**. They are not presented as the authentic or only recipe, and they cannot represent the variation among cooks. Where cultural meaning is strong (za’atar, berbere, jerk), we describe regional context and encourage you to learn from cooks and writers from those communities."},{t:"note",k:"safety",title:"Blends and allergens",x:"Commercial blends can contain mustard, celery, sesame, wheat, soy, milk or other allergens, and may be produced on shared equipment. Always read the label; if a blend does not list ingredients clearly, ask the manufacturer."},{t:"widget",id:"blends"}],takeaways:["Blends are families of recipes.","Whole spices are best for making your own.","Check labels for allergens."],refs:["katzer"]},{id:"ch11",num:11,part:mr,title:"Building Flavour in the Kitchen",sub:"Techniques, timing and balance",objectives:["Perform key spice and herb techniques","Choose when to add each ingredient","Rescue an over-seasoned dish"],blocks:[{t:"p",x:"A technique is simply a way of persuading a plant ingredient to give up the flavour you want. Here are the essential ones, with step-by-step visuals."},{t:"h",x:"Toasting seeds"},{t:"fig",id:"tech-toast",cap:"Dry toasting in four steps: heat, add, shake, cool."},{t:"ol",items:["Heat a dry, heavy pan over medium-low heat.","Add whole seeds in a single layer.","Shake the pan constantly for 1–3 minutes until the seeds smell fragrant and darken slightly.","Tip out immediately onto a cool plate; the pan’s residual heat keeps cooking them."]},{t:"h",x:"Grinding spices"},{t:"fig",id:"tech-grind",cap:"Grinding with a mortar and pestle: crush, rotate, sift."},{t:"p",x:"A mortar and pestle crushes and releases oils; a blade grinder is faster but heats the spice slightly. Grind small quantities, and clean your grinder by grinding a little rice or bread, then discarding it."},{t:"h",x:"Bruising, chopping and tearing"},{t:"fig",id:"tech-bruise",cap:"Bruising fresh herbs: lightly press mint or lemongrass to release aroma."},{t:"fig",id:"tech-chop",cap:"Chopping: bunch tightly, use a sharp knife and rock gently rather than mashing."},{t:"ul",items:["A **sharp** knife avoids crushing and blackening basil and herbs.","**Tearing** suits basil and mint in salads.","**Bruising** (pressing with the back of a knife) suits lemongrass, mint for drinks and bay.","Chop herbs only **just before use**, because cut surfaces lose aroma and darken."]},{t:"h",x:"Tempering (tadka, chaunk)"},{t:"fig",id:"tech-temper",cap:"Tempering: heat fat, add whole seeds in order of hardness, pour over the dish."},{t:"ol",items:["Heat oil or ghee until shimmering.","Add mustard seeds first; wait for popping.","Add cumin and other seeds, then curry leaves or garlic.","Take care to avoid burning: once the aroma blooms, use immediately.","Pour over finished dal, vegetables or yogurt, or add as the base of a dish."]},{t:"h",x:"Infusing liquids and fats"},{t:"p",x:"Whole spices and herb stems give gentle flavour to stocks, milk, syrups and oils. Infuse in warm, not boiling, liquid for delicate aromas. For infused oils, fresh ingredients (garlic, herbs, chilli) added to oil can carry food-safety risks; use dried ingredients and refrigerate, or consult safe preservation guidance."},{t:"h",x:"Balance: salt, acid, sweetness, bitterness"},{t:"ul",items:["**Flat dish?** Add salt in small steps, then acid (lemon, vinegar).","**Too sharp or acidic?** A little sweetness (sugar, roasted vegetables) or fat (oil, cream) will soften it.","**Bitter?** Salt and fat reduce perceived bitterness; sweetness also helps.","**Too sweet?** Acid and a little salt will balance it."]},{t:"h",x:"Combining herbs and when to add them"},{t:"table",head:["Stage","What to add","Why"],rows:[["Start","Whole spices, bay, woody herbs, onion, garlic, ginger","Time and fat extract and mellow flavour."],["Middle","Ground spices (briefly in fat), pastes, tomatoes","Avoids burning; allows blending."],["End","Delicate herbs, citrus, garam masala, fresh chilli","Preserves aroma and brightness."],["At the table","Ground pepper, flaky salt, chilli flakes, sumac, fresh herbs","Let people adjust."]]},{t:"note",k:"tip",title:"Using too many herbs at once",x:"Choose one dominant herb, one supporting herb, and perhaps one accent. Strong herbs (rosemary, sage, tarragon, mint) rarely need partners."},{t:"h",x:"Rescuing an over-seasoned dish"},{t:"ul",items:["**Too salty:** add unsalted liquid or bulk (potatoes, rice, beans), then rebalance with acid or a little sweetness. (The idea that a raw potato absorbs salt is largely a myth; dilution works better.)","**Too spicy:** add dairy, coconut milk, yogurt, sugar or more bulk.","**Too much clove or sage:** dilute with more of the dish and add acid; they cannot be removed.","**Burnt spices:** discard and start again; bitterness does not cook out."]}],takeaways:["Technique decides which flavours you extract.","Add delicate ingredients late and sturdy ones early.","Balance salt, acid, fat and sweetness before adding more spice."],refs:["mcgee"]},{id:"ch12",num:12,part:mr,title:"Culinary Herb and Spice Pairings",sub:"A practical guide and an interactive pairing matrix",objectives:["Use pairing guidance as a starting point","Match seasonings to food types","Experiment with confidence"],blocks:[{t:"note",k:"uncert",title:"Pairings are suggestions, not rules",x:"Taste is personal and cultural. The matrix below shows commonly used combinations (●●) and ones worth exploring (●); empty cells do not mean 'wrong'."},{t:"widget",id:"pairing"},{t:"h",x:"Quick pairing ideas"},{t:"table",head:["Food","Herbs and spices commonly used","Notes"],rows:[["Vegetables","Parsley, dill, thyme, cumin, coriander seed, garlic, mint, basil, paprika","Roasting suits hardy herbs and warm spices; raw salads suit tender herbs."],["Legumes","Cumin, bay, garlic, coriander, paprika, epazote, turmeric, chilli","Add salt and acid late for tender beans if desired; simmer spices early."],["Grains","Cardamom, cinnamon, cumin, saffron, parsley, mint, bay","Toast spices in fat before adding grain."],["Soups and stews","Bay, thyme, rosemary, ginger, lemongrass, paprika, cumin","Add early and finish with fresh herbs and acid."],["Sauces","Basil, parsley, tarragon, garlic, oregano, chives, mustard","Tender herbs at the end."],["Roasted foods","Rosemary, thyme, sage, cumin, paprika, garlic, coriander seed","Coat with oil to carry the flavour."],["Fish","Dill, parsley, tarragon, fennel, lemongrass, ginger, chives","Gentle herbs match delicate flesh."],["Poultry","Thyme, sage, rosemary, tarragon, paprika, cumin, ginger","Under-the-skin herb butter is effective."],["Meat","Rosemary, cumin, coriander, black pepper, cinnamon, allspice, juniper","Warm spices suit slow cooking."],["Breakfast","Cardamom, cinnamon, dill, chives, paprika, black pepper","Eggs love chives, dill and paprika."],["Desserts and baking","Cinnamon, cardamom, vanilla, nutmeg, clove, ginger, star anise","Warm spices; use sparingly with clove."],["Drinks (non-alcoholic)","Mint, ginger, lemongrass, cinnamon, cardamom, saffron, vanilla","Infuse gently; see Chapter 16."]]},{t:"h",x:"Plant-forward combinations"},{t:"p",x:"Plant-based dishes benefit from layering umami and aroma. Smoked paprika, mushrooms, tomato paste, garlic, bay and thyme give savoury depth; fresh herbs and citrus add lift. For example, try chickpeas with cumin, garlic, lemon and parsley; lentils with turmeric, ginger and tempering; roasted squash with sage, nutmeg and chilli."}],takeaways:["Pairings show tradition, not rules.","Start with one dominant flavour.","Match intensity to the food."]}],pr="Part IV — Practical Applications",gg=[{id:"ch13",num:13,part:pr,title:"How to Buy, Select and Store Herbs and Spices",sub:"Quality, labels, storage and waste reduction",objectives:["Choose fresh herbs and quality dried products","Read packaging and labels","Store, rotate, freeze and dry ingredients safely","Understand adulteration and its limits"],blocks:[{t:"h",x:"Selecting fresh herbs"},{t:"ul",items:["Look for **firm, bright, evenly coloured leaves** without slime, dark spots, yellowing or wilting.","Smell them: a good fresh herb has a clear, characteristic aroma.","Check stems: basil and mint with black or slimy stems are on the way out.","Choose **potted herbs** for tender types you use often; they stay alive on a windowsill and cost less over time.","Fresh roots (ginger, turmeric) should be firm, heavy and plump, with taut skin."]},{t:"h",x:"Inspecting dried herbs and spices"},{t:"ul",items:["**Colour:** greens should be muted green rather than brown; paprika should be a good red, not brownish.","**Aroma:** rub a pinch; if it smells faint or dusty, the flavour will be weak.","**Whole versus ground:** buy whole when you can (cumin, coriander, pepper, cardamom, nutmeg) and grind as needed.","**Texture:** clumping suggests moisture. Avoid damp or caked products.","**Visible foreign matter:** stems, stones or insects are signs of poor handling."]},{t:"note",k:"uncert",title:"Appearance and smell do not prove purity",x:"Colour, smell and even certification cannot guarantee that a product is pure. Some adulterants are designed to look right. Laboratory analysis is the reliable method; for home cooks, buying from reputable suppliers with traceable labelling is the best practical approach."},{t:"h",x:"Reading labels"},{t:"fig",id:"label",cap:"An annotated example label showing what to look for: common name, botanical name, plant part, origin, ingredients, allergens, batch number and best-before date. The label is an invented example for teaching."},{t:"h",x:"Storing at home"},{t:"ul",items:["Keep spices in **airtight, opaque or dark containers**, in a cool, dry cupboard away from the stove, dishwasher and sunlight.","Never shake a spice jar over a steaming pot; steam enters the jar. Use a clean, dry spoon.","Label jars with the **date bought**. Rotate older stock to the front.","Keep paprika, chilli powder and red spices cool (a fridge or freezer is acceptable if sealed to prevent condensation).","Whole spices can last a long time; ground spices commonly fade within a year or so, though this varies a great deal.","Store **fresh herbs** like flowers (tender herbs, stems in water) or wrapped in damp paper (hardy herbs, coriander leaf)."]},{t:"h",x:"Freezing and drying at home"},{t:"ul",items:["**Freezing:** chop tender herbs and freeze in ice-cube trays with a little water or oil; also freeze curry leaves, makrut lime leaves and pandan whole; grated ginger and lemongrass freeze well.","**Drying:** hardy herbs such as thyme, rosemary and oregano can be hung in small bunches in a warm, dry, ventilated place away from direct sun, or dried in a very low oven. Make sure they are completely brittle before storing to avoid mould.","**Do not store fresh garlic or herbs in oil at room temperature.**"]},{t:"h",x:"Reducing waste"},{t:"ul",items:["Use **herb stems** in stocks, sauces and pastes.","Blend leftover herbs into a **green sauce** or pesto and freeze.","Plan a week of recipes that share the same fresh herb.","Buy small amounts of unfamiliar spices, or share with a friend."]},{t:"h",x:"Adulteration, substitution and contamination"},{t:"p",x:"Herbs and spices are valuable, dried, ground and traded globally, so they are vulnerable to **adulteration** (adding cheaper foreign material), **substitution** (swapping a cheaper species or part) and **contamination** (by microbes, pesticides, heavy metals or foreign matter). Reviews of the literature show these problems are documented, particularly for saffron, turmeric, oregano and paprika, but prevalence varies by product, source and sampling."},{t:"ul",items:["A peer-reviewed study documented lead chromate pigments added to turmeric in parts of South Asia (see References).","Microbial contamination, including *Salmonella*, has been linked to outbreaks traced to spices, which is why many suppliers apply heat or steam treatment (see References).","Saffron is graded under the ISO 3632 standard, and very cheap 'saffron' is a red flag."]},{t:"note",k:"tip",title:"Practical protection",x:"Buy whole spices, buy from suppliers that identify origin and plant, avoid suspiciously cheap high-value spices (saffron, vanilla), and cook spices thoroughly where recipes allow. Report concerns to your national food authority."}],takeaways:["Whole spices are easier to judge and keep longer.","Labels should name the plant part, origin and batch.","Smell and appearance alone cannot prove purity.","Never keep garlic or herbs in oil at room temperature."],refs:["galvin","forsyth","vandoren","who-fs","codex","iso3632"]},{id:"ch14",num:14,part:pr,title:"The Beginner's Herb and Spice Pantry",sub:"Starter, intermediate and exploration pantries",objectives:["Build a pantry in stages","Understand why each ingredient earns its place","Plan for different budgets"],blocks:[{t:"p",x:"A good pantry is a small, well-chosen, regularly refreshed collection. Start with a few ingredients you will actually use, learn them well, then expand. Tick items as you collect them; your selections stay on your device."},{t:"widget",id:"pantry"}],takeaways:["Start small and use what you buy.","Whole spices often cost less over time.","Explore one ingredient at a time."]},{id:"ch15",num:15,part:pr,title:"Twelve Original International Recipes",sub:"Practical recipes that demonstrate the principles in this book",objectives:["Practise the techniques in this book","Adapt recipes with substitutions","Understand cultural inspiration versus authenticity"],blocks:[{t:"p",x:"These twelve recipes were designed to put the book’s ideas into practice: bruising, toasting, tempering, infusing, balancing and finishing. Each is an **original recipe inspired by** flavour traditions, not a claim to be an authentic version of a traditional dish."},{t:"note",k:"uncert",title:"Photography and nutrition",x:"This edition shows stylised illustrations of each dish rather than photographs. Nutrition values are not included because reliable values depend on your exact ingredients; use a calculator based on USDA FoodData Central or your national food-composition database."},{t:"note",k:"safety",title:"Cooking safely",x:"Cool leftover rice and cooked foods promptly and refrigerate within about one to two hours. Reheat until steaming hot. Cook poultry and meat thoroughly according to your national guidance. Check every ingredient label for allergens."},{t:"widget",id:"recipes"}],takeaways:["Recipes are teaching tools.","Substitutions help you cook with what you have.","Inspiration is not authenticity."],refs:["fdc","who-fs"]},{id:"ch16",num:16,part:pr,title:"Beverages, Infusions and Aromatic Preparations",sub:"Food, flavouring and products regulated as medicines or supplements",objectives:["Understand terms such as infusion, decoction, extract and tincture","Identify which preparations are foods and which may be regulated products","Prepare ordinary culinary beverages"],blocks:[{t:"p",x:"The words used for plant preparations are often confused. This chapter explains them so that you can read labels and articles critically. It is **not** a manual for medicinal preparations."},{t:"table",head:["Term","What it is","Usually regarded as…","Notes"],rows:[["Culinary infusion","Herbs or spices steeped in hot or cold water, milk or syrup for flavour","Food or drink","Example: mint leaves in hot water."],["Herbal tea (tisane)","A drink made by steeping plant material (not necessarily *Camellia sinensis* tea)","Food or drink; some products make health claims and may be regulated differently","Ingredients should be identified and from a reliable source."],["Decoction","Simmering tougher plant parts (roots, bark) in water","Food-like when used in cooking; discussed in traditional medicine contexts","Used in cooking, such as simmered ginger drinks."],["Flavour extract","Flavour compounds drawn out with a solvent, e.g. vanilla extract in alcohol","Food ingredient","Used by the teaspoon in baking."],["Essential oil","Highly concentrated volatile aromatic liquid, usually distilled","Not a food in most countries; used in perfumery and aromatherapy","Not for swallowing; keep out of reach of children."],["Tincture","Plant material extracted in alcohol","Often a herbal medicinal product","Alcohol-based; strength varies."],["Concentrated botanical extract","Standardised extract with higher levels of some compounds","Supplement or herbal medicinal product, depending on country","Composition differs from the whole plant."],["Dietary supplement","Product containing plant extracts or powders, sold as capsules, tablets, powders or liquids","A regulated category that differs by country","See Chapters 19 and 20."]]},{t:"fig",id:"spectrum",cap:"From culinary use to concentrated products: the further right, the more concentrated the preparation and the more caution is needed."},{t:"note",k:"warn",title:"Essential oils are not cooking ingredients",x:"Essential oils are very concentrated. Swallowing them, particularly those containing eugenol (clove), thymol (thyme) or menthol (peppermint), can be harmful, especially to children. This book gives no instructions for ingesting essential oils or for making concentrated extracts."},{t:"note",k:"safety",title:"Foods or medicines? It depends where you live",x:"The same product can be treated as a food, a supplement or a medicine in different jurisdictions, and often depends on the claims made and the concentration. A claim to treat or prevent a disease generally turns a product into a medicine in many countries. Check your local regulator (Chapter 20)."},{t:"h",x:"Ordinary culinary beverages"},{t:"h3",x:"Fresh mint infusion (about 2 cups / 500 ml)"},{t:"ol",items:["Place a generous handful (about 15 g) of fresh spearmint sprigs in a heatproof jug.","Pour over 500 ml of hot, not violently boiling, water.","Cover and steep for 3–5 minutes; strain.","Sweeten with honey or sugar if you like, and serve hot or over ice with lemon slices.","Tip: Moroccan-style mint tea, made with green tea, is a distinct tradition; this recipe is a simple, caffeine-free infusion."]},{t:"h3",x:"Ginger-lemon beverage (about 4 cups / 1 L)"},{t:"ol",items:["Slice 4 cm (1½ in) of fresh ginger and simmer in 1 L of water for 10–15 minutes.","Strain; stir in juice of one lemon and honey or sugar to taste.","Serve hot, or chill and serve with ice.","Tip: longer simmering gives a stronger, spicier flavour. If you take medicines or have a condition, remember that this is a food-level beverage and not a treatment."]},{t:"h3",x:"Spiced milk infusion (2 cups / 500 ml)"},{t:"ol",items:["Warm 500 ml milk or plant milk with 4 crushed green cardamom pods and a cinnamon stick on low heat for 10 minutes.","Strain, sweeten if you like, and serve warm."]},{t:"h3",x:"Hibiscus cooler"},{t:"p",x:"In many parts of the world, dried hibiscus calyces (*Hibiscus sabdariffa*) are steeped to make a tart red drink known as agua de jamaica, bissap, zobo, sorrel (Caribbean) or karkadé. Steep a small handful in hot water, sweeten, and chill. Because hibiscus is the subject of some research and can interact with some medicines at higher intakes, people with specific conditions or on medicines should ask a pharmacist before drinking it regularly."}],takeaways:["Infusions and decoctions are cooking terms; extracts, tinctures and oils are concentrated products.","Never swallow essential oils.","The same product can be regulated differently in different countries."],refs:["nccih-supp","fda-ds","ema","nccih-peppermint"]}],gr="Part V — Botanical Science, Tradition and Safety",gf="Part VI — Applying the Knowledge",yg=[{id:"ch17",num:17,part:gr,title:"What Science Actually Says About Herbs and Spices",sub:"Phytochemistry, study types and reading claims critically",objectives:["Define phytochemicals, polyphenols, terpenes and pigments","Rank study types by what they can show","Separate cooking amounts from supplement amounts","Avoid equating lab antioxidant activity with health benefit"],blocks:[{t:"h",x:"Phytochemistry in plain language"},{t:"p",x:"Plants make thousands of chemical compounds. Some are **primary metabolites** needed for growth (sugars, proteins). Others are **secondary metabolites** that help plants defend themselves, attract pollinators or survive stress. Many flavours, colours and pungencies in herbs and spices are secondary metabolites."},{t:"table",head:["Group","What they are","Culinary examples"],rows:[["Phytochemical","Any chemical produced by a plant; does not imply benefit or harm","All of the below"],["Terpenes / essential-oil components","Aromatic, often volatile compounds","Limonene (citrus), menthol (mint), thymol (thyme), eugenol (clove), cinnamaldehyde (cinnamon)"],["Phenylpropanoids","Aromatic compounds from phenylalanine","Anethole (fennel, star anise), eugenol, vanillin"],["Polyphenols and flavonoids","Large group of plant compounds, many pigments and astringent compounds","Rosmarinic acid (rosemary, mint family), quercetin (onions, capers)"],["Pigments","Colour compounds","Curcumin (turmeric), crocin (saffron), capsanthin (paprika), bixin (annatto)"],["Pungent compounds","Trigger heat or bite receptors","Capsaicin (chilli), piperine (pepper), allicin (crushed garlic), isothiocyanates (mustard)"]]},{t:"p",x:"Heat, acid, oil and storage change these compounds. Cooking can destroy some (allicin from garlic breaks down with heat) and release or create others (browning reactions, extraction of pigments into fat). A single plant therefore behaves differently raw, boiled, fried or dried."},{t:"h",x:"Antioxidants: a cautionary tale"},{t:"p",x:"'Antioxidant activity' describes how well a compound neutralises certain reactive chemicals in a test tube. Spices and herbs often score highly in such tests. But **a laboratory antioxidant value does not show a benefit in the human body**. The US Department of Agriculture withdrew its public ORAC (oxygen radical absorbance capacity) database partly because test-tube values were not shown to predict effects in people, and because they were being misused in marketing."},{t:"note",k:"science",title:"Never equate ‘antioxidant’ with ‘health benefit’",x:"Compounds reach the body in very different forms after digestion, are often poorly absorbed, and are rapidly changed. A high number in a test tube is a starting point for questions, not an answer."},{t:"h",x:"The ladder of evidence"},{t:"fig",id:"evidence",cap:"A simplified hierarchy of evidence, from laboratory studies to systematic reviews. Higher does not mean ‘always better’; study quality matters at every level."},{t:"table",head:["Type","What it is","What it can show","Limits"],rows:[["Laboratory (in vitro)","Experiments on cells or chemicals","A compound has an effect in a dish","Cells in a dish are not people; concentrations are often far higher than from food."],["Animal studies","Experiments in animals","Whether an effect is plausible in a living body","Animals differ from humans; doses are often high and routes unusual."],["Observational studies","Observe groups of people over time","Associations between diet and outcomes","Cannot prove cause; confounders (income, lifestyle) are hard to remove."],["Randomised controlled trials","People randomly assigned to a treatment or comparison","Whether an intervention causes an effect","Often small, short and using supplements rather than foods."],["Systematic reviews and meta-analyses","Structured pooling of all relevant studies","Overall picture and consistency","Only as good as the studies included."]]},{t:"h",x:"Kitchen amounts versus extract amounts"},{t:"p",x:"Many studies use extracts: a capsule of curcumin may contain many times the amount of curcumin in a curry. Turmeric powder itself is only a few per cent curcumin by weight, and curcumin is poorly absorbed. Findings from extracts therefore cannot be transferred to cooking, and in the opposite direction, concentrated products can carry risks that ordinary food does not."},{t:"h",x:"Using cautious language"},{t:"table",head:["Ingredient (example)","What can responsibly be said"],rows:[["Ginger","Established culinary use. Some human trials of ginger supplements for nausea; results are mixed. Culinary amounts are not the amounts studied."],["Turmeric / curcumin","Established culinary use. Extensive laboratory research; human trials are generally small or inconsistent. Supplements have been linked to rare liver injury."],["Cinnamon","Established culinary use. Human studies on blood sugar are inconsistent; species matter because of coumarin."],["Garlic","Established culinary use. Research largely on supplements; results mixed."],["Peppermint oil","Specific oil capsules have been studied for irritable bowel syndrome; this is not the same as peppermint tea or leaf."],["Most other herbs and spices","Established culinary use; insufficient evidence to establish health benefits at normal cooking amounts."]]},{t:"note",k:"science",title:"How to check a headline",x:"Ask: Was it in people or in cells/animals? What dose and what form (food, extract)? How many participants and for how long? Was there a control group? Who funded it? Has it been replicated? What do independent reviews say? (NCCIH’s ‘Know the Science’ series offers more guidance.)"}],takeaways:["Phytochemical means ‘plant chemical’, not ‘healthy chemical’.","Test-tube antioxidant results do not prove benefit.","Study type matters.","Cooking amounts differ from extract amounts."],refs:["nccih-know","orac","nccih-ginger","nccih-turmeric","nccih-cinnamon","nccih-garlic","nccih-peppermint"]},{id:"ch18",num:18,part:gr,title:"Traditional Knowledge and Modern Research",sub:"Respecting culture while keeping evidence honest",objectives:["Appreciate traditional food knowledge","Distinguish tradition from clinical evidence","Use respectful attribution"],blocks:[{t:"p",x:"Every community has accumulated knowledge about the plants around it: which are food, which are poison, which are best in which season and how to prepare them. This knowledge is a form of science developed through generations of observation and practice, and a cultural heritage in its own right."},{t:"h",x:"Traditional food knowledge and culinary heritage"},{t:"p",x:"Cooking techniques such as fermenting, tempering, toasting and grinding, and combinations such as turmeric with black pepper or lentils with cumin and asafoetida, encode centuries of practical wisdom. They deserve to be recorded and credited to the communities who developed them."},{t:"h",x:"Traditional medicine systems as history and culture"},{t:"p",x:"Systems such as Ayurveda, traditional Chinese medicine, Unani, Kampo, West African and Indigenous American healing traditions are living cultural systems with their own concepts, practitioners and histories. This book treats them as important historical and cultural subjects. It does not evaluate individual therapeutic claims, and it does not claim that traditional ideas such as 'heating' and 'cooling' foods correspond to modern physiological categories."},{t:"h",x:"Tradition and research: a two-way street"},{t:"ul",items:["Some medicines in modern pharmacy began with plants known to traditional communities, so tradition can be a useful starting point for scientific inquiry.","However, **long use alone is not evidence of effectiveness or safety.** Some traditionally used plants have since been found to be harmful (for example, plants containing aristolochic acid, linked to kidney damage).","Placebo effects, natural recovery and the reality that harmful effects may appear years later all affect how we interpret historic use.","Research on traditional knowledge should be conducted with consent, benefit-sharing and community control where appropriate."]},{t:"note",k:"trad",title:"Attribution and respect",x:"We name communities and cuisines where sources are clear, avoid describing living cultures in the past tense, and do not reproduce sacred, restricted or commercially protected knowledge. Questions of biopiracy (commercial use of traditional knowledge without consent) are real; support producers and projects that return benefits to the communities involved."},{t:"note",k:"uncert",title:"What this book does not claim",x:"We do not state that any traditional use has been scientifically established unless a source supports it, and we do not recommend any ingredient for treatment."}],takeaways:["Traditional knowledge is valuable culture and heritage.","Long use is not proof of effectiveness or safety.","Credit communities and avoid restricted knowledge."],refs:["toussaint","nccih-know"]},{id:"ch19",num:19,part:gr,title:"Safety, Allergies and Responsible Use",sub:"Culinary versus medicinal use, interactions, contamination and reporting",objectives:["Distinguish culinary and supplement use","Recognise allergy, interaction and pregnancy considerations","Identify toxic look-alikes and contamination risks","Know how to report adverse reactions"],blocks:[{t:"note",k:"warn",title:"Talk to a professional first",x:"Consult a doctor or pharmacist **before using concentrated herbal products or supplements**, particularly if you take prescription or over-the-counter medicines, have a medical condition, are pregnant or breastfeeding, are planning surgery, or are giving products to a child. Do not stop or change prescribed medicines because of anything in this book."},{t:"h",x:"‘Natural’ is not the same as ‘safe’"},{t:"p",x:"Plants make powerful chemicals, many of which evolved to deter animals. That is why some are valued for flavour and others are poisonous. A product being natural, traditional or sold in a health store does not guarantee that it is safe for every person, in every amount, at every time."},{t:"h",x:"Culinary use versus concentrated products"},{t:"p",x:"Cooking uses a few grams, mixed into a meal. Supplements and extracts can deliver amounts of certain compounds that are far higher and chemically different from the whole plant. Most reported problems involve concentrated products, though some culinary ingredients can cause problems in unusual amounts (for example, very large amounts of nutmeg)."},{t:"h",x:"Herb–drug interactions"},{t:"p",x:"Some herbal products can interact with medicines by changing how they are absorbed, broken down or how they act. Interactions are best documented for certain supplements (the classic example is St John’s wort, which is not a culinary herb). For culinary herbs and spices, there is usually no concern at food amounts, but supplement forms of garlic, ginger, turmeric, fenugreek and others may be of concern with blood-thinning, blood-sugar-lowering or other medicines."},{t:"note",k:"safety",title:"How to check an interaction responsibly",x:"Identify the exact plant (botanical name), the part and preparation (food, tea, extract, capsule), the amount, and the medicine. Then ask a pharmacist, and consult official sources (for example NCCIH ‘Herbs at a Glance’ or your national medicines regulator). Do not rely on a single website, and do not generalise from one product to another."},{t:"h",x:"Allergies and sensitivities"},{t:"ul",items:["Spices can cause allergic reactions, from mild to severe. Mustard, celery and sesame are major regulated allergens in many countries; others (such as coriander, cumin and garlic) are less common but documented.","**Cross-reactivity:** people allergic to birch pollen, mugwort or celery sometimes react to related spices (Apiaceae family) such as coriander, cumin or fennel.","**Intolerances** (for example to onion or garlic fructans in some people with irritable bowel syndrome) are not allergies but affect which foods are comfortable.","Read labels on blends: 'spices' on a label can hide allergens in some jurisdictions. Contact the manufacturer when unsure.","Seek immediate medical help for signs of a severe reaction such as swelling of the lips or throat, difficulty breathing, or collapse."]},{t:"h",x:"Pregnancy, breastfeeding and children"},{t:"p",x:"Ordinary culinary amounts of herbs and spices are generally part of normal diets, but guidance for herbal teas, extracts and supplements is more cautious and varies by country and by plant. Official pregnancy and breastfeeding advice should be followed; examples include the UK NHS guidance and the NIH LactMed database (see References). Essential oils, high-dose supplements and concentrated extracts are generally not advised without professional guidance. Children should not be given herbal supplements or essential oils without advice from a paediatric health professional."},{t:"h",x:"Medical conditions, liver, kidney and surgery"},{t:"ul",items:["People with liver or kidney disease should seek advice before taking any concentrated herbal product; some supplements (such as certain turmeric products) have been linked to liver injury in case reports (see LiverTox).","High-oxalate foods such as sorrel may be a concern for people prone to kidney stones.","Tell your surgical team and anaesthetist about all herbal and supplement products you take; some may affect bleeding, blood pressure or anaesthesia, and clinicians often advise stopping certain products before surgery. Follow their individual advice."]},{t:"h",x:"Contamination and misidentification"},{t:"ul",items:["Spices can be contaminated by microbes, heavy metals, pesticides or foreign matter; heat treatment and good suppliers reduce risk (see Chapter 13).","Misidentified ingredients can be dangerous: Japanese star anise has been found in star anise products; some 'herbal teas' have contained unlabelled plants.","**Toxic look-alikes:** ramsons or wild garlic can be confused with lily-of-the-valley and autumn crocus; wild parsley relatives such as hemlock water-dropwort and hemlock are deadly; cherry laurel and mountain laurel are not bay. This list is illustrative, not complete."]},{t:"note",k:"warn",title:"Never eat a wild plant from a photograph",x:"Do not collect and eat wild plants based on pictures, apps or general descriptions. Identification needs expert, in-person verification of several features, and mistakes can be fatal."},{t:"h",x:"Essential oils and concentrated products"},{t:"p",x:"Essential oils are highly concentrated; accidental swallowing, especially by children, is a recognised cause of poisoning. Keep them in child-resistant containers out of reach, and do not use them as food ingredients."},{t:"h",x:"Reporting adverse reactions"},{t:"p",x:"If you think a herbal product or food has made you unwell, stop using it, seek medical advice, keep the packaging, and report it. Reporting helps regulators detect problems."},{t:"table",head:["Country or region","Where to report (verify current page)"],rows:[["United States","FDA MedWatch (also poison control centres)"],["United Kingdom","MHRA Yellow Card scheme"],["European Union","National medicines authority; consult your national pharmacovigilance website"],["Canada","Health Canada adverse reaction reporting for natural health products"],["Australia","TGA adverse event reporting"],["Elsewhere","Your national medicines or food-safety authority"]]}],takeaways:["Natural does not mean safe.","Concentrated products carry different risks from food.","Check interactions with a pharmacist.","Never eat wild plants from photographs.","Report suspected reactions."],refs:["nccih-supp","nccih-herbs","livertox","lactmed","nhs-preg","medwatch","yellowcard"]},{id:"ch20",num:20,part:gr,title:"Quality, Authenticity and Consumer Awareness",sub:"Labels, adulteration, testing and regulatory differences",objectives:["Read labels critically","Spot misleading marketing","Understand certification limits","Recognise regulatory differences across countries"],blocks:[{t:"h",x:"What a good label tells you"},{t:"ul",items:["**Ingredient identity:** the common name and, ideally, the botanical name (for example *Cinnamomum verum*).","**Plant part:** leaf, root, bark, seed.","**Country of origin**, where declared.","**Processing and storage** information (for example heat treated, store cool and dry).","**Batch or lot number and best-before date**, which allow traceability.","**Contact details** of the producer or importer.","**Allergen information** as required locally."]},{t:"h",x:"Problems to understand"},{t:"table",head:["Problem","Meaning","Example"],rows:[["Adulteration","Adding foreign material to extend or disguise","Starch or dyes in ground spices; lead chromate in turmeric (documented in some regions)"],["Substitution","Replacing the stated plant with a cheaper one","A cheaper oregano relative sold as oregano; cassia as cinnamon without disclosure"],["Contamination","Unwanted microbes, toxins, metals, pesticide residues or foreign bodies","Salmonella outbreaks linked to spices"],["Misleading marketing","Implying health benefits or purity with no evidence","'Detox', 'immune-boosting', 'miracle' spice blends"]]},{t:"note",k:"uncert",title:"Certification limits",x:"Organic, fair-trade and third-party tested labels can say something valuable about farming practices, working conditions or testing, but they do not guarantee that every batch is free from adulteration or contamination. Ask what was tested, by whom, and whether the report is available."},{t:"h",x:"Third-party testing"},{t:"p",x:"Independent testing by accredited laboratories can verify identity, strength and contaminants. Look for programmes that publish their standards and results, and be cautious about unexplained logos."},{t:"h",x:"Unsupported health claims"},{t:"ul",items:["Be wary of claims that a spice 'cures', 'detoxes', 'reverses' or 'boosts' anything.","Be wary of testimonials as proof.","Check whether claims come with references you can look up, and whether those references actually say what the claim says.","Remember that, in many countries, a product claiming to treat or prevent disease is treated as a medicine."]},{t:"h",x:"Regulation differs by country"},{t:"p",x:"There is no single global regulator. The same plant product can be classified as a food, a food supplement, a traditional herbal medicine or a medicine depending on where it is sold and what it claims. The summary below is general; check each regulator’s current page."},{t:"table",head:["Jurisdiction","Regulator","General approach (verify current rules)"],rows:[["United States","FDA","Dietary supplements are regulated as a category of food. Manufacturers are responsible for safety and truthful labelling; products do not need FDA approval before sale. Disease-treatment claims are not permitted for supplements."],["European Union","EMA (medicinal products); national authorities; EFSA for food-safety advice","Herbal medicinal products are authorised or registered under medicines law, with EMA herbal monographs; food supplements are regulated under food law, with national implementation."],["United Kingdom","MHRA (medicines); Food Standards Agency (food)","Traditional herbal medicines can be registered under a dedicated scheme; food supplements are regulated under food law."],["Canada","Health Canada","Natural health products are regulated under dedicated regulations and require product licences."],["Australia","TGA","Complementary medicines are regulated as therapeutic goods, with listed and registered categories."],["Other countries","National authorities","Frameworks differ widely; check locally."]]},{t:"note",k:"uncert",title:"Always verify",x:"Regulations change. Use each authority’s current website as the final word; some official pages could not be checked automatically when this edition was prepared (see References for status)."}],takeaways:["Labels should enable identification and traceability.","Certification is helpful but not a guarantee.","Regulation is national or regional, not global."],refs:["galvin","fda-ds","ema","mhra","hc","tga","codex","nccih-supp"]}],bg=[{id:"ch21",num:21,part:gf,title:"A 14-Day Herb and Spice Discovery Experience",sub:"Fourteen small, affordable kitchen experiments",objectives:["Learn one idea per day by tasting and doing","Build observational skills","Record reflections"],blocks:[{t:"p",x:"This flexible fourteen-day challenge builds knowledge through small experiments. You can do them on consecutive days or spread them across weeks. Each uses ordinary ingredients and takes about 10–20 minutes."},{t:"note",k:"uncert",title:"A learning experience, not a health programme",x:"This is not a detox, treatment or wellness intervention, and it makes no promise of any health outcome. It is a way to cook with more attention. Skip any ingredient that does not suit you or that you are allergic to."},{t:"widget",id:"discovery"}],takeaways:["Small experiments teach more than long lists.","Notice and record your observations."]},{id:"ch22",num:22,part:gf,title:"Build Your Personal Flavour Library",sub:"A living reference of your own tastes and recipes",objectives:["Record flavour observations","Compare fresh and dried preferences","Track pairings, substitutions and shopping priorities"],blocks:[{t:"p",x:"Professional cooks keep notebooks. A personal flavour library turns your experiments into knowledge: which ingredients you love, how they behave, what they go with and where to buy them."},{t:"h",x:"What to record"},{t:"ul",items:["Favourite ingredients and why.","Flavour descriptions in your own words.","Fresh versus dried preferences.","Pairing observations and successful recipes.","Substitutions that worked.","Storage notes and purchase dates.","Shopping priorities and where you buy."]},{t:"widget",id:"library"},{t:"note",k:"tip",title:"Printable",x:"Use the Print button to save a page or entire worksheet. Your entries are stored only in this browser; export or print them if you want a permanent copy."}],takeaways:["Write down what you taste.","Review regularly and refine."]}],wf="14 November 2026",kf=[{id:"powo",by:"Royal Botanic Gardens, Kew",title:"Plants of the World Online (POWO)",date:"Continuously updated",url:"https://powo.science.kew.org/",type:"Botanical database",supports:"Accepted botanical names, synonyms, families and native ranges used throughout the Atlas.",ch:"2, 5–8",limits:"Taxonomy is revised over time; commercial and culinary names are not covered; native-range maps can be coarse.",status:"blocked"},{id:"ipni",by:"Royal Botanic Gardens, Kew; Harvard University Herbaria; Australian National Botanic Gardens",title:"International Plant Names Index (IPNI)",date:"Continuously updated",url:"https://www.ipni.org/",type:"Botanical nomenclature database",supports:"Publication record of plant names and authorship; used to cross-check synonyms.",ch:"2",limits:"Records that a name was published, not whether it is currently accepted ih.gov/health/garlic",type:"Government health information",supports:"Evidence summary and safety notes for garlic (Allium sativum).",ch:"6, 17, 19",limits:"Mostly supplement research.",status:"ok"},{id:"nccih-turmeric",by:"NCCIH",title:"Turmeric",date:"Continuously updated",url:"https://www.nccih.nih.gov/health/turmeric",type:"Government health information",supports:"Evidence summary, supplement safety and liver-injury reports for turmeric products.",ch:"6, 17, 19",limits:"Distinguishes culinary turmeric from concentrated curcumin products only in general terms.",status:"ok"},{id:"nccih-cinnamon",by:"NCCIH",title:"Cinnamon",date:"Continuously updated",url:"https://www.nccih.nih.gov/health/cinnamon",type:"Government health information",supports:"Species of cinnamon and coumarin content.",ch:"7, 17",limits:"Supplement-focused.",status:"ok"},{id:"nccih-fenugreek",by:"NCCIH",title:"Fenugreek",date:"Continuously updated",url:"https://www.nccih.nih.gov/health/fenugreek",type:"Government health information",supports:"Evidence and safety for fenugreek (Trigonella foenum-graecum).",ch:"7, 8, 19",limits:"Supplement-focused.",status:"ok"},{id:"nccih-peppermint",by:"NCCIH",title:"Peppermint Oil",date:"Continuously updated",url:"https://www.nccih.nih.gov/health/peppermint-oil",type:"Government health information",supports:"Peppermint oil is a concentrated product with different safety considerations from leaf.",ch:"5, 16, 19",limits:"About oil products, not culinary leaf.",status:"ok"},{id:"fdc",by:"US Department of Agriculture, Agricultural Research Service",title:"FoodData Central",date:"Continuously updated",url:"https://fdc.nal.usda.gov/",type:"Food-composition database",supports:"Reference for nutrient composition of herbs and spices; use to calculate nutrition for recipes.",ch:"15, 17",limits:"Averages for sampled products; values vary by variety, origin and processing.",status:"ok"},{id:"orac",by:"USDA Agricultural Research Service / National Agricultural Library",title:" rrent guidance.",ch:"20",limits:"Landing page only; consult current guidance pages.",status:"ok"},{id:"yellowcard",by:"MHRA (UK)",title:"Yellow Card scheme",date:"Continuously updated",url:"https://yellowcard.mhra.gov.uk/",type:"Regulator reporting service",supports:"Reporting suspected side effects, including from herbal products, in the UK.",ch:"19",limits:"UK system.",status:"ok"},{id:"hc",by:"Health Canada",title:"Natural health products (Government of Canada)",date:"Continuously updated",url:"https://www.canada.ca/en/health-canada.html",type:"Regulator",supports:"Canada regulates natural health products under dedicated regulations; verify on the current Health Canada site.",ch:"20",limits:"Could not be reached from the build environment; verify directly.",status:"unreachable"},{id:"tga",by:"Therapeutic Goods Administration (Australia)",title:"Complementary medicines",date:"Continuously updated",url:"https://www.tga.gov.au/",type:"Regulator",supports:"Australia regulates complementary medicines as therapeutic goods; verify on the current TGA site.",ch:"20",limits:"Could not be reached from the build environment; verify directly.",status:"unreachable"},{id:"who-fs",by:"World Health Organization",title:"Food safety — fact sheet",date:"Continuously updated",url:"https://www.who.int/news-room/fact-sheets/detail/food-safety",type:"Intergovernmental fact sheet",supports:"Foodborne hazards, hygiene and safe handling principles.",ch:"4, 13, 19",limits:"General; not specific to herbs and spices.",status:"ok"},{id:"codex",by:"FAO / WHO Codex Alimentarius Commission",title:"Codex Committee on Spices and Culinary Herbs (CCSCH)",date:"Continuously updated",url:"https://www.fao.org/fao-who-codexalimentarius/committees/committee/en/?committee=CCSCH",type:"International standards body",supports:"International work on quality standards for dried spices and culinary herbs.",ch:"4, 13, 20",limits:"Standards are voluntary guidance unless adopted into national law.",status:"ok"},{id:"livertox",by:"National Institute of Diabetes and Digestive and Kidney Diseases (NIDDK), US NIH",title:"LiverTox: Clinical and Research Information on Drug-Induced Liver Injury",date:"Continuously updated",url:"https://www.ncbi.nlm.nih.gov/books/NBK547852/",type:"Government database",supports:"Case-based liver-injury information on herbal and dietary supplements.",ch:"19",limits:"Describes reported cases; cannot give incidence rates.",status:"ok"},{id:"lactmed",by:"NIH / National Library of Medicine",title:"Drugs and Lactation Database (LactMed)",date:"Continuously updated",url:"https://www.ncbi.nlm.nih.gov/books/NBK501922/",type:"Government database",supports:"Breastfeeding information on some herbal products. Always check the specific plant and preparation.",ch:"19",limits:"Coverage of culinary herbs is incomplete.",status:"ok"},{id:"nhs-preg",by:"NHS (UK)",title:"Foods to avoid in pregnancy",date:"Continuously updated",url:"https://www.nhs.uk/conditions/pregnancy-and-baby/foods-to-avoid-pregnant/",type:"Public-health guidance",supports:"Official UK pregnancy food guidance; a model of why advice is country-specific.",ch:"19",limits:"UK guidance; other countries differ.",status:"ok"},{id:"galvin",by:"Galvin-King, P.; Haughey, S. A.; Elliott, C. T.",title:"Herb and spice fraud; the drivers, challenges and detection",date:"2018",url:"https://doi.org/10.1016/j.foodcont.2017.12.031",type:"Peer-reviewed review (Food Control 88:85–97)",supports:"Economic drivers of adulteration in herbs and spices and the analytical methods used to detect it.",ch:"13, 20",limits:"Review; prevalence figures vary by product and sampling.",status:"ok"},{id:"vandoren",by:"Van Doren, J. M. et al.",title:"Foodborne illness outbreaks from microbial contaminants in spices, 1973–2010",date:"2013",url:"https://doi.org/10.1016/j.fm.2013.04.014",type:"Peer-reviewed article (Food Microbiology 36(2):456–464)",supports:"Documented outbreaks linked to spices and the role of low-moisture microbial risk.",ch:"4, 13, 19",limits:"Counts reported outbreaks only; absolute risk to a household cook is low.",status:"ok"},{id:"forsyth",by:"Forsyth, J. E. et al.",title:"Turmeric means 'yellow' in Bengali: Lead chromate pigments added to turmeric threaten public health across South Asia",date:"2019",url:"https://doi.org/10.1016/j.envres.2019.108720",type:"Peer-reviewed article (Environmental Research 179:108720)",supports:"Documented lead-chromate adulteration of turmeric in parts of South Asia.",ch:"13, 20",limits:"Regional study; does not describe all turmeric supply chains.",status:"ok"},{id:"efsa-coum",by:"European Food Safety Authority (EFSA)",title:"Opinion of the Scientific Panel on Food Additives, Flavourings, Processing Aids and Materials in Contact with Food on a request from the Commission related to Coumarin",date:"2004 (EFSA Journal 104:1–36, DOI 10.2903/j.efsa.2004.104)",url:"https://doi.org/10.2903/j.efsa.2004.104",type:"Regulatory scientific opinion",supports:"Tolerable daily intake for coumarin, relevant to heavy consumption of cassia cinnamon.",ch:"7, 19",limits:"Link was rate-limited when checked; confirm in a browser. Opinion is from 2004; check for later updates.",status:"unconfirmed"},{id:"iso3632",by:"International Organization for Standardization",title:"ISO 3632-1: Spices — Saffron (Crocus sativus L.) — Part 1: Specification",date:"2011",url:"https://www.iso.org/standard/44527.html",type:"International standard",supports:"Grading categories for saffron based on laboratory measures.",ch:"7, 20",limits:"Standard is paywalled; site blocks automated checks.",status:"blocked"},{id:"mcgee",by:"McGee, H.",title:"On Food and Cooking: The Science and Lore of the Kitchen (revised edition)",date:"2004",url:"",type:"Print book (Scribner)",supports:"Accessible food science: aroma volatiles, how heat and fat affect flavour, herb and spice chemistry.",ch:"3, 11",limits:"Popular science rather than primary research; check editions.",status:"print"},{id:"davidson",by
