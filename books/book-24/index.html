sition and movement from receptors in muscles, tendons and joints.",3],["Prostaglandin","A lipid signalling molecule involved in inflammation and pain, influenced by some medicines.",7],["Proteoglycan","A protein–carbohydrate molecule that attracts water and helps cartilage resist compression.",3],["Protein","A macronutrient made of amino acids, needed for tissue structure, enzymes and repair.",6],["Protein quality","An assessment of amino acid pattern and digestibility in a protein source.",6],["Quarterly review","A periodic check of a personal plan or clinical follow-up, adapted to need.",10],["Radiograph","A two-dimensional projection image produced by X-rays; a plain X-ray.",10],["RANKL","A signalling molecule that promotes osteoclast formation; targeted by some medicines.",5],["Rate coding","Increased frequency of nerve impulses that raises muscle force.",4],["Reablement","Support to regain or maintain independence after illness, injury or hospitalisation.",9],["Red flag","A symptom or history feature suggesting a need for prompt professional assessment.",7],["Referred pain","Pain perceived at a site distant from the tissue generating the signal.",3],["Rehabilitation","A structured process to restore function, activity and participation.",8],["Remodelling","Coordinated removal and replacement of bone, adapting structure and repairing damage.",5],["Repetition","One complete execution of an exercise movement.",8],["Resistance training","Exercise against an external or bodyweight load to build muscle and bone strength.",8],["Rhabdomyolysis","Serious muscle breakdown that can damage kidneys and requires urgent care.",7],["Rickets","Defective mineralisation of growing bone in children, affecting growth plates.",7],["Rotator cuff","Four shoulder muscles that stabilise and rotate the humeral head.",4],["Saddle anaesthesia","Reduced sensation around the groin and inner thighs; a red flag with bowel/bladder change.",7],["Sarcomere","The basic contractile unit of striated muscle, between two Z-lines.",4],["Sarcopenia","Clinically significant loss of muscle mass, strength or physical function.",9],["Scoliosis","A three-dimensional spinal deformity involving lateral curvature and vertebral rotation.",7],["Sedentary behaviour","Prolonged sitting or low energy expenditure while awake.",8],["Sepsis","A life-threatening organ dysfunction caused by a dysregulated response to infection.",7],["Set","A group of consecutive exercise repetitions.",8],["Shared decision-making","Choosing care together using clinical evidence and the person's values.",10],["Sesamoid bone","A small bone embedded in a tendon; the patella is the largest.",2],["Sliding filament theory","Explanation of muscle contraction by actin and myosin filaments sliding past one another.",4],["Smooth muscle","Involuntary, non-striated muscle in organs and blood vessels.",4],["Soft tissue","Connective and supporting tissues other than bone, including muscle, tendon, ligament and fascia.",3],["Spondylolisthesis","Forward displacement of one vertebra relative to another.",7],["Stability","The ability to maintain or regain equilibrium when challenged.",5],["Stiffness","Resistance to movement; may be protective, inflammatory or mechanical.",7],["Strain","Injury to muscle or tendon from excessive force or stretch.",7],["Strength","The maximal force a muscle or group can generate under specific conditions.",4],["Stress fracture","A bone injury from repeated loading that exceeds repair capacity.",7],["Subchondral bone","Bone immediately beneath articular cartilage, involved in joint loading and osteoarthritis.",3],["Supplement","A product supplying a nutrient or substance in addition to the diet.",6],["Synarthrosis","A joint allowing little or no movement, such as a skull suture.",3],["Synovial fluid","Fluid in a joint cavity that lubricates, nourishes cartilage and helps distribute load.",3],["Synovial joint","A freely movable joint with a fluid-filled cavity lined by synovial membrane. w movement is organised, and how posture, balance and loading shape the skeleton.",range:[25,32]},{id:5,roman:"V",title:"Bone Growth, Remodelling & Mineral Regulation",kicker:"Built and rebuilt",blurb:"Bone turnover, mechanical loading, mineral and hormonal control, and what changes with age.",range:[33,40]},{id:6,roman:"VI",title:"Nutrition & Musculoskeletal Wellness",kicker:"Everyday nourishment",blurb:"Calcium, vitamin D, protein and micronutrients explained across cultures, budgets and dietary patterns.",range:[41,48]},{id:7,roman:"VII",title:"Common Bone, Joint & Muscle Conditions",kicker:"Understanding disease",blurb:"Osteoporosis, arthritis, gout, fractures, spinal conditions, tendinopathy and soft-tissue injuries — described clearly.",range:[49,60]},{id:8,roman:"VIII",title:"Injury Prevention, Rehabilitation & Mobility",kicker:"Move with judgement",blurb:"Progressive loading, balance, flexibility, recovery and returning to activity, adapted to real people and settings.",range:[61,68]},{id:9,roman:"IX",title:"Musculoskeletal Health Throughout Life",kicker:"A lifelong trajectory",blurb:"Childhood, adolescence, adulthood, menopause, later life, disability, occupation and everyday movement.",range:[69,76]},{id:10,roman:"X",title:"Testing, Clinical Care & Lifelong Wellness",kicker:"Informed partnership",blurb:"DXA, imaging, laboratory tests, shared decision-making and a personal, sustainable mobility plan.",range:[77,80]}],Ey=[["How many bones are typically counted in an adult skeleton?","206 — a teaching figure; normal variation exists.","Anatomy"],["What forms the axial skeleton?","Skull, vertebral column, ribs and sternum.","Anatomy"],["What is the appendicular skeleton?","The shoulder and pelvic girdles plus the limb bones, specialised for movement.","Anatomy"],["What is the diaphysis?","The shaft of a long bone, with thick cortical bone and a marrow cavity.","Anatomy"],["What is an epiphysis?","The expanded end of a long bone, often covered by articular cartilage.","Anatomy"],["What is the periosteum?","A fibrous membrane covering most bone surfaces; carries vessels and contributes to growth and repair.","Anatomy"],["What is cortical bone?","Dense outer bone that resists bending and torsion.","Anatomy"],["What is trabecular bone?","A load-bearing lattice inside bone; high surface area and faster turnover.","Anatomy"],["What does red marrow produce?","Blood cells, including red cells, white cells and platelets.","Anatomy"],["What is a sesamoid bone?","A small bone embedded in a tendon; the patella is the largest.","Anatomy"],["What do osteoblasts do?","Form new bone matrix and support mineralisation.","Bone physiology"],["What do osteoclasts do?","Resorb bone mineral and matrix.","Bone physiology"],["What do osteocytes do?","Sense mechanical strain and microdamage and coordinate remodelling.","Bone physiology"],["What is hydroxyapatite?","The calcium phosphate mineral that reinforces bone and teeth.","Bone physiology"],["What is collagen's role in bone?","Type I collagen forms the flexible organic matrix that mineral crystals reinforce.","Bone physiology"],["What is an osteon?","A cylindrical unit of cortical bone with concentric lamellae around a central canal.","Bone physiology"],["What is remodelling?","The coordinated replacement of old or damaged bone by osteoclasts and osteoblasts.","Bone physiology"],["What is the growth plate?","Cartilage near the end of a growing long bone where lengthening occurs.","Bone physiology"],["What is endochondral ossification?","Bone formation in which a cartilage template is replaced by bone.","Bone physiology"],["What is the RANKL–OPG system?","A signalling balance that regulates osteoclast formation and bone resorption.","Bone physiology"],["What is a synovial joint?","A freely movable joint with a fluid-filled cavity and synovial lining.","Joints"],["What are the main functions of synovial fluid?","Lubrication, nutrition of cartilage, load distribution and immune surveillance.","Joints"],["What is hyaline cartilage?","A smooth, avascular load-distributing cartilage covering bone ends in synovial joints.","Joints"],["What does a ligament connect?","Bone to bone, restraining abnormal motion.","Joints"],["What does a tendon connect?","Muscle to bone, transmitting force.","Joints"],["What is a bursa?","A fluid-filled sac that reduces friction between moving tissues.","Joints"],["What is fascia?","Continuous connective tissue that surrounds and connects muscles and organs.","Joints"],["What is a meniscus?","A fibrocartilaginous pad in the knee that distributes load.","Joints"],["What is a joint capsule?","A fibrous and synovial envelope that stabilises and encloses a joint.","Joints"],["What is a labrum?","A fibrocartilaginous rim that deepens a socket, as in the hip or shoulder.","Joints"],["What is a motor unit?","One motor neuron and all the muscle fibres it activates.","Muscle"],["What is a sarcomere?","The basic contractile unit of striated muscle, between two Z-lines.","Muscle"],["What triggers the sliding-filament mechanism?","Calcium exposes actin binding sites; myosin heads cycle using ATP.","Muscle"],["What is an isometric contraction?","Muscle tension without a change in muscle length.","Muscle"],["What is a concentric contraction?","The muscle shortens while generating force.","Muscle"],["What is an eccentric contraction?","The muscle lengthens under tension, often controlling a movement.","Muscle"],["How does the nervous system increase muscle force?","By recruiting more motor units and increasing firing frequency.","Muscle"],["What is an agonist muscle?","The muscle primarily responsible for producing a given movement.","Muscle"],["What is proprioception?","The sense of body position and movement from receptors in tissues.","Muscle"],["What is a moment arm?","The perpendicular distance from a joint axis to a line of force; it determines leverage.","Muscle"],["What does calcium do in the body?","Supports bone mineral, muscle contraction, nerve function, clotting and enzyme activity.","Nutrition"],["What does vitamin D do for bone?","Supports intestinal calcium and phosphate absorption and bone mineralisation.","Nutrition"],["What is 25(OH)D?","The main circulating vitamin D metabolite and standard status marker.","Nutrition"],["What is the adult protein RDA?","About 0.8 g/kg/day in general guidance; older or active people may need more under clinical advice.","Nutrition"],["Why is vitamin C needed for connective tissue?","It supports collagen modification and cross-linking.","Nutrition"],["What does vitamin K do in bone?","Supports activation of osteocalcin, a bone matrix protein.","Nutrition"],["What foods provide magnesium?","Nuts, seeds, legumes, whole grains, cocoa and leafy greens.","Nutrition"],["What is ALA?","Alpha-linolenic acid, a plant omega-3 fat in flax, chia, hemp and walnuts.","Nutrition"],["Why may calcium-set tofu be useful?","The calcium salts used in setting can make it a substantial calcium source.","Nutrition"],["What is bioavailability?","The proportion of a nutrient that is absorbed and available for use.","Nutrition"],["Is a dairy-free diet automatically low in calcium?","No. Fortified drinks, tofu, legumes, greens and small fish with bones can contribute with planning.","Nutrition"],["What is the common upper intake level for vitamin D in adults?","About 100 micrograms (4,000 IU) daily from all sources, though clinical treatment can differ.","Nutrition"],["What is peak bone mass?","The highest bone mass attained, generally by the late twenties.","Bone physiology"],["What is sarcopenia?","Clinically significant loss of muscle mass, strength or physical function.","Ageing"],["What is the mechanostat?","A conceptual feedback system in which bone adapts its mass to habitual strain.","Bone physiology"],["What is low energy availability?","Insufficient energy remaining for normal function after exercise expenditure.","Life stages"],["What is bone quality?","Aspects of bone strength beyond density, including architecture and material properties.","Bone physiology"],["What is osteoporosis?","A disease of reduced bone strength that raises fragility fracture risk.","Conditions"],["What is a fragility fracture?","A fracture from a low-energy event that would not normally break healthy bone.","Conditions"],["What is osteopenia?","Low bone density between a T-score of −1.0 and −2.5; a risk category, not a fracture diagnosis.","Conditions"],["What is osteoarthritis?","A whole-joint condition involving cartilage, bone, synovium and muscles.","Conditions"],["Is osteoarthritis simply wear and tear?","No. It involves active joint tissues and multiple risk factors; exercise is a core treatment.","Conditions"],["What is rheumatoid arthritis?","A systemic autoimmune inflammatory disease that can damage joints and organs.","Conditions"],["What is a DMARD?","A disease-modifying antirheumatic drug used to control inflammatory arthritis and prevent damage.","Conditions"],["What causes gout?","Monosodium urate crystals trigger inflammation, often with high blood urate.","Conditions"],["What confirms gout in joint fluid?","Needle-shaped negatively birefringent monosodium urate crystals.","Conditions"],["How does osteomalacia differ from osteoporosis?","Osteomalacia is defective mineralisation of bone matrix; osteoporosis is low bone mass and impaired architecture.","Conditions"],["What causes rickets?","Defective mineralisation of growing bone, often vitamin D or phosphate deficiency.","Conditions"],["What is tendinopathy?","Tendon pain and dysfunction often with degenerative rather than purely inflammatory changes.","Conditions"],["What are cauda equina red flags?","New bladder/bowel dysfunction, saddle numbness or progressive leg weakness — emergency care.","Safety"],["What is progressive overload?","Gradually increasing training demand to stimulate adaptation.","Exercise"],["What is weight-bearing exercise?","Activity where the body supports its weight against gravity, such as walking.","Exercise"],["What is the base of support?","The area beneath and between contact points with the ground.","Exercise"],["What is the purpose of a warm-up?","Increase readiness, blood flow and movement rehearsal before activity.","Exercise"],["What is a deload?","A planned reduction in training stress to support recovery and adaptation.","Exercise"],["What is adaptive exercise?","Activity modified in position, load, equipment or environment to fit ability.","Exercise"],["What are return-to-activity criteria?","Multiple factors including pain, motion, strength, control and task demands — not time alone.","Exercise"],["What is a key treatment for persistent tendinopathy?","Progressive loading, individualised to the tendon and tolerance.","Exercise"],["What makes fall prevention effective?","A multifactorial approach: strength, balance, medication, vision, home and footwear.","Exercise"],["What is a stress fracture?","A bone injury from repeated loading exceeding repair capacity.","Conditions"],["What is DXA?","Dual-energy X-ray absorptiometry; the standard bone mineral density test.","Testing"],["What is a T-score?","Standard deviations from a young-adult bone density reference mean.","Testing"],["What is a Z-score?","Standard deviations from an age-matched bone density reference mean.","Testing"],["What is FRAX?","A fracture risk assessment tool combining clinical factors and bone density.","Testing"],["What is an X-ray best at showing?","Fractures, alignment and visible joint changes; not accurate bone density.","Testing"],["What is MRI useful for?","Soft tissues, nerves, marrow and certain occult fractures without ionising radiation.","Testing"],["Which fracture symptoms need urgent care?","Severe increasing pain, a cold pale limb, new numbness or a tight cast.","Safety"],["What is a general supplement caution?","Supplements can interact with medicines and are not automatically necessary or risk-free.","Safety"],["What is shared de  products.",discuss:"Whether testing is appropriate, the right dose, and whether another cause explains his symptoms.",lesson:"Vitamin D is essential but megadoses without diagnosis are unsafe."},46:{name:"Priya, 41 — collagen supplements",context:"Priya has knee discomfort and sees advertisements claiming collagen rebuilds cartilage.",issue:"She asks whether collagen powder can replace exercise or medication.",science:"Insufficient evidence shows collagen supplements regrow articular cartilage or treat osteoporosis. Some small studies report symptom changes, but results are inconsistent.",practical:"She keeps a food-first approach, considers supervised exercise for knee function and checks any product for interactions and cost.",discuss:"Her knee symptoms and whether a strength programme or clinical assessment would help.",lesson:"Digested collagen does not travel intact to a joint; claims outrun evidence."},48:{name:"Thabo, 52 — vegetarian meal planning",context:"Thabo eats a vegetarian diet based on maize porridge, beans and seasonal vegetables. He wants to support his bones without expensive imports.",issue:"He is unsure whether plant protein and limited dairy can meet his needs.",science:"Legumes, soy, grains, nuts and seeds supply protein; calcium sources include fortified foods, calcium-set tofu, greens and ground sesame.",practical:"He builds a weekly plan around affordable staples, adds a fortified drink where available and uses a chair-based strength routine at home.",discuss:"Whether any supplements are indicated and how to adapt meals to his budget and medical history.",lesson:"Plant-based nutrition can support bone health with planning and variety."},49:{name:"Katherine, 67 — osteoporosis diagnosis",context:"Katherine has a DXA T-score of −2.6 at the hip after a wrist fracture and feels anxious about falling.",issue:"She wants to know whether exercise is safe and whether she can avoid medication.",science:"Osteoporosis treatment combines risk assessment, nutrition, exercise, falls prevention and sometimes medicine. Exercise is beneficial but must be tailored.",practical:"She asks for a physiotherapy referral, discusses medication and monitoring with her clinician, and reviews her home for fall hazards.",discuss:"Treatment options, bone medicine risks and benefits, exercise modifications, vitamin D and calcium adequacy.",lesson:"Lifestyle and prescribed treatment are partners, not alternatives."},51:{name:"Ravi, 44 — runner's knee discomfort",context:"Ravi increased his weekly running from 15 to 35 km over three weeks and developed gradual front-of-knee ache.",issue:"He fears running has 'worn out' his knee and considers stopping all activity.",science:"Gradual load changes and muscle capacity matter. Persistent knee pain needs assessment; imaging findings do not always match symptoms.",practical:"He reduces the provoking load, keeps gentle movement and plans a supervised strength programme for the hip and knee.",discuss:"Assessment of the pain, whether running volume should change and any red flags.",lesson:"Sudden load increases can outpace tissue tolerance; complete rest is not always necessary."},52:{name:"Mei, 36 — rheumatoid arthritis",context:"Mei has morning stiffness lasting over an hour, swelling in both hands and fatigue.",issue:"A friend suggests a restrictive diet can replace her medication.",science:"RA is a systemic autoimmune condition. Early DMARD treatment reduces damage; diet can support general health but does not replace disease-modifying therapy.",practical:"She requests a rheumatology review, keeps a symptom and medication log and plans exercise adapted to flares.",discuss:"Diagnosis, DMARD options, monitoring, infection precautions, diet and bone health.",lesson:"Inflammatory arthritis needs specific medical treatment; supplements are not a substitute."},53:{name:"Samuel, 55 — gout flare",context:"Samuel has sudden severe pain and swelling at the base of his big toe and drinks sugary soft drinks daily.",issue:"He assumes gout is simply caused by eating tomatoes.",science:"Gout is caused by monosodium urate crystals. Genetics, kidney function, alcohol, sugary drinks, medicines and body composition contribute.",practical:"He seeks prompt assessment for diagnosis and treatment, reduces sugary drinks and asks about long-term urate-lowering therapy.",discuss:"Whether the joint should be aspirated, treatment for the flare, kidney function and prevention.",lesson:"Gout is metabolic, not a moral failing; long-term urate control matters."},55:{name:"Elena, 71 — fracture recovery",context:"Elena is recovering from a wrist fracture after a fall. The cast is due to be removed.",issue:"She wants to return immediately to heavy housework and does not know what exercises are safe.",science:"Fracture healing continues after immobilisation. Function requires graded range, strength and confidence work, and falls prevention.",practical:"She asks for rehabilitation guidance, modifies lifting and reviews her home hazards and bone health.",discuss:"Follow-up imaging, weight-bearing restrictions, osteoporosis assessment and fall prevention.",lesson:"Removing a cast is not the same as full functional recovery."},59:{name:"Lucas, 38 — office back discomfort",context:"Lucas works at a computer with long meetings and notices aching after sitting for hours.",issue:"He believes he needs a perfect chair to prevent all future back problems.",science:"Back pain is multifactorial. Movement variety and appropriate activity matter, while no single posture is universally correct.",practical:"He breaks up sitting, adjusts his screen and chair, walks at lunch and gradually adds strength work.",discuss:"Whether persistent pain or any red flags require assessment.",lesson:"Posture is dynamic; movement variety is more useful than a rigid ideal."},64:{name:"Grace, 76 — recurrent falls",context:"Grace has fallen twice in six months, once after standing up quickly. She now avoids going out.",issue:"She worries that exercising will cause another fall.",science:"Falls are multifactorial. Strength, balance, medication review, vision, footwear and home changes reduce risk. Fear itself reduces activity.",practical:"She requests a falls assessment, begins supported balance work and asks a pharmacist to review her blood pressure medicine.",discuss:"Why she is falling, dizziness, medication effects, bone health and community support.",lesson:"Recurrent falls need a multifactorial review, not just reassurance."},66:{name:"Noor, 29 — limited mobility",context:"Noor uses a wheelchair because of a chronic neurological condition and wants to stay active.",issue:"The local gym programme is all standing exercises and she feels excluded.",science:"Adapted strength, aerobic and mobility work can be performed seated or with support. Shoulder care and pressure management matter.",practical:"She asks for an adapted assessment and plans arm-based activity, seated mobility and accessible routes outdoors.",discuss:"Shoulder function, spasticity, fatigue, pressure areas and bone health with her rehabilitation team.",lesson:"Adapting the environment and task is more useful than excluding the person."},68:{name:"Jonah, 24 — returning after injury",context:"Jonah sprained his ankle in football four weeks ago. Swelling has settled but he still feels unsteady.",issue:"He wants to play a match this weekend because the pain is 'mostly gone'.",science:"Return decisions consider pain, swelling, range, strength, balance and task demands; time alone is insufficient.",practical:"He completes a progressive balance and strength plan with a physiotherapist and increases running and cutting gradually.",discuss:"Readiness, residual instability, reinjury risk and what to do if symptoms return.",lesson:"No pain does not automatically equal full readiness."},70:{name:"Aarav, 15 — adolescent movement habits",context:"Aarav plays cricket year-round and has cut back on meals to feel 'lighter'. His coaching load has increased.",issue:"He has repeated shin pain and has not had a growth spurt yet.",science:"Adolescent growth requires adequate energy and nutrition. Low energy availability can affect bone, hormones and injury risk, and the growth plate is vulnerable.",practical:"He sees a clinician, reduces training load, resumes regular meals and adds varied movement and recovery.",discuss:"Nutrition, growth, pubertal development, stress injury and safe training progression.",lesson:"More training and less fuel is not a safe route to performance."},73:{name:"Sophia, 52 — menopause discussion",context:"Sophia has hot flushes, disrupted sleep and a family history of hip fracture. Her periods stopped a year ago.",issue:"She is unsure whether hormone therapy or calcium tablets are the right answer.",science:"Oestrogen decline accelerates bone loss. Management considers symptoms, fracture risk, personal and family history and treatment benefits and risks.",practical:"She prepares questions, starts resistance training, reviews calcium and vitamin D intake and requests a risk assessment.",discuss:"MHT appropriateness, DXA testing, bone medicines and cardiovascular and breast risk.",lesson:"Menopause care is individual; both symptoms and bone health deserve attention."},74:{name:"Walter, 81 — maintaining independence",context:"Walter lives alone and wants to keep gardening and using the bus.",issue:"His family worries that lifting and walking will lead to a fracture, so they encourage him to rest.",science:"Older adults benefit from tailored strength, balance and aerobic activity, with falls prevention and bone assessment. Bed rest accelerates loss.",practical:"He uses raised garden beds, supportive shoes and a walking stick when needed, and starts supervised strength and balance sessions.",discuss:"Bone health, falls risk, medication review and a safe exercise plan.",lesson:"Restriction can create the very decline families fear; tailored activity supports independence."},75:{name:"The Okafor family — accessible home routine",context:"A multigenerational household includes a grandfather with knee osteoarthritis and a teenager with a physical disability.",issue:"They want one home routine that includes everyone without unsafe exercises.",science:"Adaptation can change position, support, range and environment. A shared routine can focus on nutrition, mobility and strength at individual levels.",practical:"They set a daily supported movement session, adapt the kitchen layout, and place fruit, beans and fortified milk at accessible heights.",discuss:"Individual clinical restrictions, falls hazards and local rehabilitation services.",lesson:"Inclusion means adapting the plan, not lowering the goals."},76:{name:"Mateo, 47 — demanding physical work",context:"Mateo installs tiles, often lifting heavy bags and kneeling for hours. He has constant shoulder and low back discomfort.",issue:"He believes pain is simply part of the job and avoids seeking help.",science:"Repetitive load, awkward positions, recovery and psychosocial work factors influence symptoms. Persistent or neurological symptoms need assessment.",practical:"He uses a trolley, adjusts work height, shares loads, takes microbreaks and reports persistent numbness.",discuss:"Whether there is an injury, workplace adjustments, rehabilitation and return-to-work planning.",lesson:"Pain is information; structural work hazards need shared solutions."},77:{name:"Rosa, 62 — understanding a DXA report",context:"Rosa receives a report with a hip T-score of −2.1 and a spine score of −1.6 and searches the internet for answers.",issue:"She reads that she definitely needs a drug and will inevitably fracture.",science:"Bone density categories are context-dependent. Fracture risk combines age, previous fracture, glucocorticoids and falls, among other factors.",practical:"She requests an appointment to interpret the report alongside her history and asks about risk calculation and follow-up intervals.",discuss:"What the numbers mean for her, whether treatment is indicated, and what lifestyle and falls measures are safe.",lesson:"A DXA score is one part of a risk assessment, not a crystal ball."},79:{name:"Helen, 58 — medication and supplement questions",context:"Helen takes several medicines and is considering a herbal menopause product advertised as supporting bones.",issue:"She is unsure whether it is safe or whether she can reduce her prescribed medicine.",science:"Supplements can interact with medicines, and many claims are not supported. Treatment changes require clinical oversight.",practical:"She brings all products to her pharmacist and primary-care clinician, asks about interactions and continues her prescribed treatment.",discuss:"Product safety, evidence, interactions, menopausal symptoms and bone health.",lesson:"Disclosure and shared decision-making reduce risk."}};function Qm(){return n.jsxs(fe,{label:"Anterior view of the adult skeleton with major regions labelled",children:[n.jsx(ni,{x:18,y:238,s:1.1,rotate:18}),n.jsx(ni,{x:422,y:62,s:.9,rotate:-160}),n.jsxs("g",{stroke:d.forest,fill:d.sage,strokeWidth:"1.3",strokeLinecap:"round",strokeLinejoin:"round",children:[n.jsx("ellipse",{cx:"240",cy:"44",rx:"21",ry:"25"}),n.jsx("path",{d:"M224 58 Q240 72 256 58",fill:"none"}),n.jsx("circle",{cx:"232",cy:"41",r:"3.6",fill:d.card,stroke:"none"}),n.jsx("circle",{cx:"248",cy:"41",r:"3.6",fill:d.card,stroke:"none"}),n.jsx("path",{d:"M240 70 V 152",stroke:d.amber,strokeWidth:"4",fill:"none"}),[80,92,104,116,128,140].map(r=>n.jsx("rect",{x:"235",y:r,width:"10",height:"5",rx:"2",fill:d.sageSoft},r)),n.jsx("path",{d:"M240 88 Q214 78 196 94",fill:"none"}),n.jsx("path",{d:"M240 88 Q266 78 284 94",fill:"none"}),n.jsx("path",{d:"M240 98 Q204 96 191 118 Q206 132 240 128",fill:d.sageSoft}),n.jsx("path",{d:"M240 98 Q276 96 289 118 Q274 132 240 128",fill:d.sageSoft}),n.jsx("path",{d:"M240 112 Q212 110 203 128",fill:"none"}),n.jsx("path",{d:"M240 112 Q268 110 277 128",fill:"no
