Do not apply a rehabilitation protocol suggested online for an undiagnosed injury. Exercises that are appropriate for one condition can be harmful in another. Persistent swelling, locking, instability, new weakness or worsening pain during rehabilitation should be reviewed rather than pushed through.`,safety:"Seek clinical review if rehabilitation produces escalating pain, new numbness or weakness, significant swelling, a joint that locks, or feelings of instability. Do not return to contact sport or heavy work while safety is uncertain."}],terms:[["Rehabilitation","A structured process to restore function, activity and participation after injury or illness."],["Return-to-activity criteria","Findings and tests used to judge readiness to resume specific demands."],["Graded exposure","Gradually increasing exposure to a feared or demanding activity under controlled conditions."]],myth:["A fixed number of weeks means you are fully recovered.","Tissue healing and functional readiness vary. Return should consider the task's demands, clinical assessment and individualized criteria, not time alone."],takeaways:["Rehabilitation progresses through overlapping phases as healing allows.","Return decisions combine symptoms, function and task demands.","Both premature return and prolonged inactivity carry risks."],quiz:[{q:"What is an appropriate criterion for returning to sport after injury?",o:["A fixed date regardless of function","A combination of pain, range, strength, control and task-specific readiness","The absence of all discomfort ever","One successful hop test only"],a:1,e:"Multiple factors matter, and no single test guarantees safety. Shared decision-making with a clinician is appropriate."},{q:"Why is prolonged inactivity after injury problematic?",o:["It can cause muscle and bone loss, stiffness and reduced confidence","It always accelerates healing","It increases synovial fluid","It prevents all pain"],a:0,e:"Inactivity has costs. Rehabilitation should balance protection with progressive movement and loading as appropriate."}],refs:["nhs-sprains","acsm"]}],zg=[{n:69,title:"Bone Development During Childhood",part:9,mins:10,summary:"Childhood is a critical period for bone growth and movement skill; varied play, adequate nutrition and safe supervised activity support the skeleton for life.",objectives:["Describe how bone develops in childhood.","Identify nutrition and activity factors that support growth.","Recognise injuries and patterns that need assessment."],sections:[{h:"Growth and modelling",p:`Bone grows through both endochondral and appositional mechanisms. Growth plates at the ends of long bones lengthen the skeleton, while bone is added to the outer surface and removed from the inner surface to reshape it. Childhood is also a time of 'modelling' — bone adapting its shape to load, not just replacing old bone.

Peak bone mass is built later, but childhood establishes the foundation. Children need adequate energy, protein, calcium, vitamin D and overall dietary quality. They also need varied movement, including running, jumping, climbing and play, to load the skeleton and develop coordination.`,fig:"life-stages",cap:"Figure 69.1 — Bone accrual from childhood through early adulthood; growth and loading interact with nutrition and hormones."},{h:"Active play and safe sport",p:`Children and adolescents benefit from a variety of physical activities. Active play, physical education, sport and daily movement support bone and muscle development, cardiovascular fitness and mental wellbeing. Supervised resistance training with good technique can be appropriate and does not stunt growth; the unfounded belief that it unavoidably damages growth plates can discourage beneficial activity.

Injury risks rise with abrupt increases in training, early specialisation, inadequate recovery and poor equipment. Encourage variety and rest. Persistent pain, limping, swelling or inability to play should be assessed, especially when symptoms occur around a growth plate. Delayed puberty or a pattern of multiple fractures needs medical evaluation.`,list:[{title:"Play",text:"Running, jumping, climbing and games provide varied loading and coordination."},{title:"Nutrition",text:"Balanced meals; dairy or fortified alternatives; fruit and vegetables; adequate energy."},{title:"Sleep",text:"Supports growth, recovery and mood; screen habits may affect sleep."},{title:"Recovery",text:"Avoid year-round single-sport overload and multiple games in a day."}]},{h:"What not to promise",p:`No food, exercise or supplement guarantees extra adult height beyond one's genetic potential, and growth hormone should only be used under specialist care for diagnosed deficiency or specific conditions. Nor should children be placed on restrictive diets for 'bone health' without medical or dietitian advice, as energy restriction can impair growth and puberty.

Community and school programmes can improve access to safe activity and nutritious food. Children living with disabilities need inclusive opportunities and adapted movement, not exclusion. Families should discuss persistent symptoms, growth concerns and suspected nutritional deficiencies with a paediatric clinician.`,safety:"Seek prompt assessment for a child with persistent limb pain, limping, joint swelling, fever with bone pain, or a pattern of unexplained fractures."}],terms:[["Bone modelling","The process by which growing bone changes shape and size in response to load and development."],["Peak bone mass","The maximum bone mass attained, generally in early adulthood, influenced strongly by childhood and adolescent accumulation."],["Growth plate","The cartilaginous region near the ends of growing bones where lengthening occurs."]],myth:["Children should avoid lifting weights because it will damage their growth.","Supervised resistance training with appropriate load and technique can be safe and beneficial. Proper coaching, age-appropriate progression and avoidance of maximal lifting without supervision are key."],takeaways:["Childhood is a foundation period for bone mass, movement skill and confidence.","Varied play and adequate nutrition are more important than specialised programmes.","Persistent pain, limping or multiple fractures need professional assessment."],quiz:[{q:"Which factor supports bone development in childhood?",o:["A restrictive diet without medical need","Adequate nutrition and varied weight-bearing play","Complete avoidance of activity","Only passive stretching"],a:1,e:"Bone development benefits from adequate energy, protein, calcium, vitamin D and varied loading through play and activity."},{q:"What should be assessed in a child with persistent limb pain and limping?",o:["Nothing; it always resolves","A clinician, as persistent symptoms can have specific causes including growth-plate injury","Only their spelling","Only their height"],a:1,e:"Persistent limping or pain is not always benign and should be evaluated. Growth, growth-plate injury, infection and inflammatory disease are among the considerations."}],refs:["who-pa","aaos"]},{n:70,title:"Adolescence, Growth and Peak Bone Mass",part:9,mins:10,summary:"Adolescence gives bone a critical chance to grow and accumulate mass; adequate energy, menstrual health and varied loading influence this window.",objectives:["Explain the adolescent growth spurt and peak bone mass.","Identify risks to bone from low energy availability.","Support safe activity and nutrition for adolescents."],sections:[{h:"A window for building",p:`Puberty brings a growth spurt and rapid changes in bone size and shape. Growth plates are active, muscle mass increases, and bone mineral accrual peaks. The exact timing of peak bone mass varies, but it is generally reached between the late teens and late twenties. Skeletal size and mineral density are strongly influenced by genetics, but nutrition and loading can modify how much of the genetic potential is reached.

Adolescents also develop lifelong habits and attitudes towards movement and body image. Messages about bone health should support these goals without promoting restrictive diets, supplement dependence or fear of activity.`,fig:"life-stages",cap:"Figure 70.1 — Bone mass rise through adolescence, peak in early adulthood and later decline. Individual trajectories vary."},{h:"Energy availability matters",p:`Bone needs energy and sex hormones. Chronic energy deficiency can suppress the menstrual cycle or testosterone, reduce growth and lower bone formation. In adolescent athletes, low energy availability may occur unintentionally through high training loads and insufficient intake, or alongside disordered eating. Performance and bone health can both suffer.

Signs may include recurrent injury, fatigue, delayed puberty, low libido or absence of periods for several months, but the underlying problem requires sensitive clinical assessment. Early support can improve hormonal and bone outcomes. Severe energy restriction and eating disorders require specialist care, not fitness advice.`,list:[{title:"Eat enough",text:"Energy needs rise during growth and training; underfuelling is a bone risk."},{title:"Variety",text:"Include protein, calcium-rich foods, vitamin D sources and colourful produce."},{title:"Menstrual health",text:"Delayed periods or prolonged loss of periods deserves assessment."},{title:"Training",text:"Avoid abrupt increases and year-round single-sport overload."}]},{h:"Training and injuries",p:`Resistance training can be safe and beneficial under supervision. The focus should be technique, gradual loading and enjoyment, not maximal lifts. Adolescent athletes benefit from rest days, off-seasons and varied movement. Growth-related pain is not a diagnosis; it is a descriptive phrase. Persistent pain, swelling or functional decline warrants assessment.

Fractures from low-energy trauma, multiple fractures or stress fractures in an adolescent may signal low bone strength or underlying disease and should be assessed. No product guarantees a taller or stronger skeleton. Encourage sleep, balanced meals and a relationship with movement that can last.`,safety:"Persistent absence of periods, rapid weight loss, delayed puberty or recurrent stress fractures in an adolescent should be assessed by a clinician."}],terms:[["Peak bone mass","The highest amount of bone tissue accumulated, generally reached by the late twenties."],["Low energy availability","Insufficient energy remaining for normal body functions after exercise expenditure."],["Functional hypothalamic amenorrhoea","Loss of menstrual periods due to hormonal suppression, often related to low energy availability and stress."]],myth:["More training is always better for a teenage athlete's development.","Adequate recovery, nutrition and variety matter for performance and bone health. Overtraining and underfuelling can impair growth, hormonal function and injury resistance."],takeaways:["Adolescence is a key period for bone mineral accrual.","Low energy availability and menstrual disruption threaten bone and performance.","Supervised, varied training and adequate nutrition support growth."],quiz:[{q:"When is peak bone mass generally reached?",o:["Early childhood","Late teens to late twenties","After menopause","After age 60"],a:1,e:"Peak bone mass is generally attained by the late twenties. Timing varies, and adolescent accumulation is an important foundation."},{q:"Why is prolonged loss of periods concerning in an adolescent athlete?",o:["It always indicates pregnancy","It may reflect low energy availability and oestrogen deficiency, which can reduce bone accrual","It improves bone density","It is required for peak performance"],a:1,e:"Menstrual disruption can reflect hormonal suppression from low energy availability, affecting bone formation and increasing stress fracture risk. Assessment is important."}],refs:["who-pa","iof"]},{n:71,title:"Adult Bone and Joint Maintenance",part:9,mins:9,summary:"Adulthood is a maintenance phase: consistent movement, adequate nutrition, sleep and risk management preserve bone, muscle and joint function.",objectives:["Describe adult bone maintenance needs.","Plan sustainable activity and nutrition habits.","Recognise when adult symptoms deserve assessment."],sections:[{h:"Maintenance, not coasting",p:`After peak bone mass, the balance shifts towards age-related loss. Adulthood is an opportunity to preserve what has been built. Weight-bearing activity, resistance training, adequate calcium and vitamin D, protein and overall dietary quality, not smoking and avoiding alcohol excess support maintenance.

Remodelling continues, responding to load and hormones. Prolonged sedentary periods reduce loading; prolonged high-impact training increases stress. Finding a sustainable middle path is more useful than extremes.`,fig:"loading",cap:"Figure 71.1 — Load and repair: consistent physical activity supports maintenance, while disuse reduces capacity."},{h:"The adult movement menu",p:`The WHO recommends 150–300 minutes of moderate-intensity aerobic activity or 75–150 minutes of vigorous activity per week for adults, plus muscle-strengthening activity on at least two days. These are population targets; a person can build towards them from any starting point.

Include variety: walking or cycling for aerobic health, resistance for muscle and bone, balance for falls prevention, and mobility for comfort. Work and home life contribute too. Carrying shopping, gardening, climbing stairs and playing with children all count. Shorter bursts can accumulate benefits.`,list:[{title:"Aerobic",text:"Walking, cycling, swimming or dance, progressed gradually."},{title:"Strength",text:"Major muscle groups twice weekly; household loads can be used."},{title:"Balance",text:"Especially valuable for older adults and those with falls risk."},{title:"Recovery",text:"Sleep, nutrition, stress management and lighter days."}]},{h:"Knowing when to check",p:`Adults should report persistent joint pain, swelling, morning stiffness, unusual fractures or back pain with warning signs. A medical review can address bone health risk, especially for people with a fragility fracture, prolonged steroid use, premature menopause, malabsorption, eating disorders or a strong family history.

Do not wait for symptoms to consider cardiovascular and bone health. Prevention is more effective when it starts before a fracture. A clinician can advise on screening intervals and whether a DXA scan or laboratory test is warranted.`,safety:"Report fragility fractures, new height loss or persistent unexplained bone pain. These may require assessment for osteoporosis or another condition."}],terms:[["Moderate-intensity activity","Activity that raises breathing and heart rate while allowing conversation in short sentences."],["Fragility fracture","A fracture caused by a low-energy event that would not normally break healthy bone."],["Sedentary behaviour","Prolonged sitting or low energy expenditure while awake."]],myth:["Bone health is only a concern after menopause or age 65.","Bone maintenance and fracture prevention are relevant at every adult age. Risk factors such as steroid use, low body weight, malabsorption and prior fractures can affect younger adults."],takeaways:["Adulthood is an active maintenance phase for bone and muscle.","Combine aerobic, strength, balance and mobility activities.","Address risk factors and symptoms before fractures occur."],quiz:[{q:"Which combination best supports adult bone and muscle maintenance?",o:["Walking only","Aerobic activity, resistance training, balanced nutrition and recovery","Calcium supplements alone","Long periods of sitting with occasional intense exercise"],a:1,e:"A combination supports the skeleton, muscle, cardiovascular health and function. Nutrition and recovery allow adaptation."},{q:"Which adult should discuss bone health with a clinician?",o:["Someone with a fragility fracture or prolonged steroid use","Anyone who has ever exercised","Someone with a mild cold","Only people over 65 with no risk factors"],a:0,e:"Prior fragility fracture, prolonged glucocorticoids and other risk factors warrant assessment at any adult age."}],refs:["who-pa","acsm"]},{n:72,title:"Pregnancy, Postpartum Changes and Skeletal Health",part:9,mins:10,summary:"Pregnancy and the postpartum period involve musculoskeletal changes, pelvic symptoms and altered activity; most are manageable, but some require clinical assessment.",objectives:["Describe common musculoskeletal changes in pregnancy.","Explain calcium and vitamin D considerations.","Support safe activity and postpartum recovery."],sections:[{h:"What changes",p:`Pregnancy increases body weight, alters posture and centre of mass, and loosens connective tissue through hormonal changes. Common symptoms include low back pain, pelvic girdle pain, rib discomfort and leg cramps. The abdominal muscles separate at the midline during pregnancy (diastasis recti) in many people; it often narrows after birth but can contribute to altered trunk function.

Most discomfort is manageable with activity adaptation, support and physiotherapy. Severe pelvic pain, difficulty walking, obstetric symptoms and reduced fetal movements need prompt obstetric advice.`,fig:"posture-balance",cap:"Figure 72.1 — Changing centre of mass and ligament laxity can alter loading during pregnancy; individual variation is wide."},{h:"Calcium, vitamin D and bone",p:`The fetus needs calcium for skeletal development, especially in the third trimester. Physiological changes increase calcium absorption. National reference intakes for pregnancy vary; UK guidance does not generally increase the adult calcium reference intake, while US guidance recommends about 1,000 mg per day for pregnant adults. Vitamin D supplementation is commonly recommended during pregnancy, and national doses should be followed.

Breastfeeding mobilises calcium, and some temporary bone loss can occur. It is generally reversible after weaning with adequate nutrition and does not mean breastfeeding causes osteoporosis. Do not exceed supplement guidance or take high-dose vitamin D without advice.`,list:[{title:"Calcium",text:"Include dairy or fortified alternatives, tofu, legumes and greens."},{title:"Vitamin D",text:"Follow national pregnancy guidance; discuss adequacy."},{title:"Pelvic floor",text:"Discuss pelvic floor assessment and exercises with a maternity professional."},{title:"Iron and folate",text:"Follow antenatal supplementation advice; these affect general health and energy."}]},{h:"Moving and recovering",p:`Physical activity is generally beneficial and recommended in uncomplicated pregnancy, with modifications as the body changes. Avoid contact sports, high fall-risk activity and overheating; use supportive footwear and stay hydrated. Aqua exercise, walking, stationary cycling and supervised strength work may suit many people. Specific medical conditions may require caution, so follow antenatal guidance.

After birth, recovery varies. Sleep deprivation, pelvic floor symptoms, wound healing and feeding demands affect the return to activity. Gentle pelvic floor and mobility work can begin when appropriate; more intense exercise should wait until bleeding and recovery allow and be progressed gradually. A physiotherapist can help with pelvic pain, bladder symptoms or abdominal wall concerns. Persistent symptoms should be assessed, not ignored.`,safety:"Seek urgent obstetric advice for severe abdominal or pelvic pain, heavy bleeding, headaches with visual changes, chest pain, calf swelling or reduced fetal movements. Postpartum wound infection or fever requires prompt care."}],terms:[["Pelvic girdle pain","Pain in the pelvic joints or surrounding structures, common in pregnancy and postpartum."],["Diastasis recti","Separation of the rectus abdominis muscles along the midline, often occurring during pregnancy."],["Pelvic floor","The muscular hammock supporting the pelvic organs and controlling continence."]],myth:["Pregnancy damages bones and creates permanent osteoporosis.","Pregnancy and lactation involve physiological changes, including temporary changes in bone turnover and sometimes bone density, but they do not typically cause permanent osteoporosis. Persistent bone fragility needs clinical assessment."],takeaways:["Pregnancy changes load, balance and connective tissue; adaptation helps.","Follow national calcium, vitamin D and antenatal supplementation guidance.","Postpartum recovery is individual; persistent pelvic symptoms need assessment."],quiz:[{q:"Which symptom in pregnancy requires urgent obstetric advice?",o:["Mild low back ache","Reduced fetal movements","Tired legs after walking","Occasional leg cramps"],a:1,e:"Reduced fetal movements require urgent obstetric assessment. Common aches and cramps should still be discussed at routine visits if persistent."},{q:"What does lactational bone change usually do after weaning?",o:["It is typically temporary and recovers","It always causes permanent osteoporosis","It prevents all exercise","It requires high-dose calcium megadose"],a:0,e:"Lactation can temporarily reduce bone density, but recovery usually occurs after weaning with adequate nutrition. Persistent fragility warrants assessment."}],refs:["nhs-vitd","nih-calcium"]},{n:73,title:"Menopause and Bone Health",part:9,mins:11,summary:"Menopause-related oestrogen decline accelerates bone loss in many people; assessment, lifestyle support and, for some, menopausal hormone therapy can reduce risk.",objectives:["Explain the relationship between menopause and bone loss.","Identify prevention and assessment options.","Discuss menopausal hormone therapy in general terms."],sections:[{h:"The bone transition",p:`Menopause is defined retrospectively after 12 months without a period in someone who is not pregnant or using continuous combined hormonal contraception. It typically occurs between 45 and 55 years, but timing varies. Early or premature menopause (before 40) carries a higher risk of bone loss and should be assessed and managed by a specialist.

Oestrogen deficiency increases bone resorption, causing accelerated loss in the years around menopause. Some people lose bone rapidly; others less so. Genetics, body weight, activity, nutrition, smoking and medical history influence the trajectory. Bone loss continues after the transition, at a slower rate.`,fig:"life-stages",cap:"Figure 73.1 — Bone density decline across menopause and later life; individual variation is substantial."},{h:"Assessment and support",p:`A fragility fracture, early menopause, prolonged amenorrhoea or significant risk factors warrant bone health assessment. National guidance may recommend DXA at a certain age or risk threshold; for example, UK guidance commonly suggests assessment around age 65 for women. Calcium, vitamin D, protein, resistance and weight-bearing activity, not smoking and limiting alcohol support bone.

Menopause symptoms such as hot flushes, sleep disturbance and mood changes matter in their own right. A clinician can discuss options, including non-hormonal treatments and menopausal hormone therapy (MHT). Symptoms and priorities should guide decisions, not a single rule.`,list:[{title:"Know your risk",text:"Early menopause, steroids, fractures, low weight and family history are relevant."},{title:"Move",text:"Resistance and weight-bearing activity help muscle and bone; balance matters."},{title:"Nourish",text:"Adequate protein, calcium, vitamin D and energy support the skeleton."},{title:"Review symptoms",text:"Hot flushes, sleep and mood deserve clinical discussion."}]},{h:"Menopausal hormone therapy",p:`MHT can reduce bone loss and fracture risk and can be appropriate for some people, especially those with significant bone loss and menopausal symptoms. Risks vary with age, time since menopause, type, dose, route and personal history. Breast cancer, cardiovascular and clot risks are considered individually. MHT is not a universal recommendation and should be reviewed regularly.

Other osteoporosis medicines may be appropriate for high fracture risk. Do not start, stop or adjust hormones or bone medicines based on general advice. Herbal products and supplements marketed for menopause are not all effective and can interact with treatment. HERBULANCE Book 17 explores hormonal health across life.`,safety:"Discuss MHT and osteoporosis medication with a qualified clinician. Seek assessment for a fracture after a low-energy fall, early menopause or a strong family history of osteoporosis."}],terms:[["Menopause","The permanent cessation of menstruation, typically diagnosed after 12 months without a period."],["Premature menopause","Menopause before age 40, which warrants specialist assessment and bone health support."],["Menopausal hormone therapy","Oestrogen with or without progestogen used to treat menopausal symptoms and prevent bone loss."]],myth:["Every woman loses significant bone at menopause and nothing can be done.","Bone loss accelerates for many people, but the magnitude varies. Exercise, nutrition, fall prevention and appropriately assessed hormone or bone treatment can reduce risk."],takeaways:["Oestrogen decline around menopause increases bone loss risk.","Bone assessment should account for early menopause and other risk factors.","Menopausal hormone therapy can help selected people; individual risk assessment is essential."],quiz:[{q:"Why does bone loss accelerate around menopause?",o:["Oestrogen decline increases bone resorption","Bone is converted into muscle","Synovial fluid disappears","Calcium absorption becomes perfect"],a:0,e:"Oestrogen restrains bone resorption. Its decline contributes to faster bone loss around the menopause transition."},{q:"Which statement is appropriate about hormone therapy?",o:["It is safe and recommended for everyone","It can reduce bone loss and symptoms for some people but requires individual risk assessment","It cures osteoporosis permanently after stopping","It replaces all need for activity"],a:1,e:"MHT can be beneficial for selected individuals, but breast, cardiovascular and clot risks and personal history must be considered. It is not appropriate for everyone."}],refs:["iof","ros"]},{n:74,title:"Musculoskeletal Health in Older Adults",part:9,mins:10,summary:"Older adults can maintain and improve strength, balance and bone health with tailored activity, adequate nutrition, falls prevention and wise medical review.",objectives:["Describe priorities for musculoskeletal health in later life.","Plan safe strength and balance activity.","Identify medical and environmental issues that increase risk."],sections:[{h:"Function is the goal",p:`In later life, musculoskeletal health supports independence: rising from a chair, walking to transport, carrying shopping, dressing and avoiding falls. Physiologically, bone loss, muscle decline, slower reactions and reduced balance are common but highly variable. Frailty is not inevitable, and it can improve with targeted support.

A functional assessment asks what matters to the person and what is limiting them. It considers strength, balance, gait, pain, vision, cognition, continence, medicines and home environment. Interventions should be meaningful and manageable rather than generic.`,fig:"exercise-progression",cap:"Figure 74.1 — Tailored strength and balance training can preserve function; load and support should match ability."},{h:"Priorities that work",p:`Progressive resistance training can increase strength even in advanced age. Balance training reduces falls in some populations, especially when combined with strength and medication review. Walking and other aerobic activity support cardiovascular health. Adequate protein, energy, calcium and vitamin D support tissue maintenance, with individual adaptation for kidney disease or other conditions.

Preventing falls is central to preventing fractures. Home modifications, vision correction, foot care, appropriate footwear, medication review and confidence-building are all relevant. An occupational therapist can help with daily tasks and equipment.`,list:[{title:"Strength",text:"Two sessions weekly using chairs, bands or small weights."},{title:"Balance",text:"Supported and progressive; consider tai chi or supervised programmes."},{title:"Walking",text:"Regular activity with safe routes and supportive footwear."},{title:"Review",text:"Medicines, vision, feet, home hazards and bone health."}]},{h:"When symptoms need attention",p:`A new fracture after a low-energy fall, height loss, sudden severe back pain or worsening mobility should prompt assessment. So should new numbness, weakness, bladder or bowel changes, fever, weight loss or night pain without explanation. These may have treatable causes.

Conversely, do not attribute all pain to 'old age' and assume nothing can be done. Osteoarthritis, spinal stenosis, osteoporosis and other conditions have management options. Autonomy matters: involve the person in decisions, respect their preferences and avoid ageism. Small gains in function can meaningfully improve quality of life.`,safety:"A fall with injury, suspected fracture or new neurological symptoms in an older adult needs prompt assessment. Recurrent falls should trigger a multifactorial review."}],terms:[["Frailty","A state of reduced physiological reserve and increased vulnerability to illness and injury."],["Multifactorial falls assessment","A review of medical, sensory, functional and environmental factors contributing to falls."],["Reablement","Support that helps a person regain or maintain independence after illness or injury."]],myth:["Older adults should rest more and avoid strength training.","Appropriate strength and balance training is beneficial and can preserve independence. Bed rest accelerates muscle and bone loss and increases falls risk."],takeaways:["Function, confidence and independence are the key outcomes.","Strength and balance training can benefit older adults at any starting level.","New symptoms and recurrent falls deserve assessment, not dismissal."],quiz:[{q:"Which activity most directly targets fall risk?",o:["Only seated arm exercises","Progressive balance and strength training with appropriate support","Long periods of bed rest","Stretching while lying down only"],a:1,e:"Balance and strength training are central to fall prevention, along with medication review and home modification."},{q:"Which symptom in an older adult should NOT be dismissed as normal ageing?",o:["A fracture after a low-energy fall","Mild stiffness after gardening","Occasional tiredness after a long walk","A passing cramp"],a:0,e:"A fragility fracture may indicate osteoporosis and warrants assessment. Many symptoms are manageable and should not be normalised without review."}],refs:["who-falls","acsm-older"]},{n:75,title:"Disability, Chronic Conditions and Adaptive Mobility",part:9,mins:10,summary:"People with disabilities and chronic conditions can benefit from movement adapted to their body, environment and goals, with attention to specialist risks.",objectives:["Explain principles of inclusive physical activity.","Recognise condition-specific bone and joint considerations.","Avoid one-size-fits-all exercise advice."],sections:[{h:"Inclusion is not a lower standard",p:`Physical activity is important for everyone, but the route may differ. A wheelchair user may use arm ergometry, resistance bands and seated balance work; a person with cerebral palsy or multiple sclerosis may need fatigue management and temperature control; someone with vision impairment may need a guided environment. Inclusion means adapting the activity, equipment and setting, not excluding the person.

Access barriers are real: transport, cost, inaccessible facilities, pain, fatigue and time. Community programmes and allied health professionals can help. Policy and design influence participation as much as individual motivation.`,fig:"workstation",cap:"Figure 75.1 — Adaptive movement uses supports, seating, reachable equipment and an environment that matches the person."},{h:"Condition-specific awareness",p:`Spinal cord injury and prolonged immobilisation can cause rapid bone loss below the level of injury, increasing fracture risk with transfers or falls. Shoulder pain is common in manual wheelchair users because the upper limbs take on weight-bearing roles; shoulder care and muscle balance matter. People with Down syndrome have a higher risk of certain upper cervical spine differences, and screening requirements vary; contact sports advice should come from clinicians.

Chronic kidney disease, liver disease and malabsorption affect bone mineral metabolism. Long-term glucocorticoids, some antiseizure medicines and other treatments increase fracture risk. inflammation in conditions such as rheumatoid arthritis also affects bone. A coordinated approach with the treating team is important.`,list:[{title:"Ask",text:"What are the person's goals, abilities and medical restrictions?"},{title:"Adapt",text:"Change position, equipment, pace, environment or support."},{title:"Monitor",text:"Watch pain, fatigue, pressure areas, spasticity and temperature."},{title:"Include",text:"Offer choices and respect autonomy; avoid assumptions."}]},{h:"Respect and realistic support",p:`People with disabilities are often portrayed either as inspirational or as unable to exercise. Both stereotypes are unhelpful. Training should be person-led, with professional expertise where needed and no requirement to meet an arbitrary standard. Appropriate exercise can improve function, mood and health, but it is not a cure for disability.

Carers and support workers may need training to assist safely. Accessible information, captioning, plain language and adapted equipment help. Cost and availability vary globally, so the book offers principles rather than prescribing an unaffordable programme. Seek medical advice for new pain, swelling, pressure injury or changes in function.`,safety:"If you have a spinal cord injury, a bleeding disorder, cardiac condition, uncontrolled epilepsy or other significant health condition, seek individual guidance before starting a new activity."}],terms:[["Adaptive exercise","Movement and equipment modified so a person with a disability or limitation can participate."],["Sublesional bone loss","Bone loss below the level of a spinal cord injury due to reduced loading and neural input."],["Accessibility","The extent to which an environment or service can be used by people with diverse abilities."]],myth:["People with disabilities cannot benefit from strength or balance exercise.","Many can, with appropriate adaptation. Benefits include strength, function, pain management, mood and participation. Safety depends on the condition and individual assessment."],takeaways:["Adapt the activity and environment, not the person's right to participate.","Some conditions carry specific bone, joint and safety risks requiring specialist advice.","Respect autonomy and avoid stereotypes about ability."],quiz:[{q:"What is adaptive exercise?",o:["Exercise that only athletes can do","Activity modified in equipment, position or setting to fit a person's abilities","A supplement programme","Exercise that avoids all challenge"],a:1,e:"Adaptive exercise changes the task or environment so it fits the person. It remains meaningful and appropriately challenging."},{q:"Why can bone loss occur after spinal cord injury?",o:["Reduced loading and neural input accelerate resorption below the injury","Bone is converted into cartilage","The skeleton disappears","Only vitamin D deficiency causes it"],a:0,e:"Immobility and lost mechanical loading can cause rapid bone loss, increasing fracture risk. Management should be coordinated with the rehabilitation team."}],refs:["who-pa","niams-bone"]},{n:76,title:"Occupational Health, Ergonomics and Everyday Movement",part:9,mins:10,summary:"Work shapes musculoskeletal load; ergonomics, load management, recovery and appropriate equipment can reduce avoidable strain without demanding perfect posture.",objectives:["Identify occupational risk factors for musculoskeletal problems.","Apply ergonomic and movement principles at work.","Recognise when symptoms should be reported and assessed."],sections:[{h:"Load, repetition and recovery",p:`Physically demanding work can provide useful activity but may also involve heavy lifting, awkward positions, vibration, repetition or prolonged standing. Sedentary jobs can involve prolonged sitting and low movement variety. Both patterns can cause discomfort, though the relationship with specific diagnoses is complex and individual.

The useful questions are about dose and recovery: How heavy? How often? For how long? With what support? How much sleep and recovery? What else is happening in the person's life? Psychosocial factors such as control, support and job stress also influence pain and disability.`,fig:"workstation",cap:"Figure 76.1 — A workstation fits the person: screen, chair, support and reach are adjustable and varied."},{h:"Ergonomics that helps",p:`Set up a workstation so forearms are supported, the screen is readable without neck strain, feet are supported and frequently used items are within easy reach. These are starting points; adjust to comfort and task. Standing desks can help some people vary position, but prolonged standing has its own risks. Regular brief movement breaks are usually more practical than holding a perfect posture for hours.

For manual work, keep loads close, avoid twisting under load, use handles and aids, and share heavy tasks where possible. Proper training and safe equipment matter. There is no single lifting technique that universally prevents injury; varied, progressive exposure and sensible load management are more realistic goals.`,list:[{title:"Support",text:"Use arm rests, footrests and appropriate chairs where available."},{title:"Reach",text:"Keep items used often between waist and shoulder height."},{title:"Variation",text:"Alternate tasks and take brief movement breaks."},{title:"Recovery",text:"Plan physically demanding tasks with adequate rest and recovery."}]},{h:"Reporting symptoms",p:`Report persistent pain, numbness, tingling, weakness or swelling to a manager, occupational health provider or clinician as appropriate. Early adjustments can prevent disruption. Symptoms that are severe, progressive or associated with red flags need prompt medical assessment, not just an ergonomic chair.

Workplace rights and access to occupational health vary by country. Some readers have limited power to change conditions; education should not blame them for structural hazards. The aim is to identify modifiable factors and seek support while maintaining function and safety.`,safety:"New numbness, weakness or loss of grip in a limb at work should be assessed promptly. High-risk work with dizziness, seizures or unstable joints needs medical and occupational advice."}],terms:[["Ergonomics","Designing work and equipment to fit human capabilities and reduce unnecessary strain."],["Repetitive strain","Loading of tissues from repeated movements without sufficient variation or recovery."],["Psychosocial work factors","Aspects such as job control, support, demands and security that influence health."]],myth:["Sitting in exactly the right posture prevents all back pain.","There is no single perfect posture. Comfort, variation, support and load management are more useful than rigid alignment, and persistent pain has multiple contributors."],takeaways:["Test whether work demands are balanced by support and recovery.","Adjust equipment and vary position; break up prolonged sitting or standing.","Persistent neurological or severe symptoms need prompt assessment."],quiz:[{q:"Which is a reasonable workstation principle?",o:["Keep frequently used objects far away","Support arms and feet, keep items within easy reach, and vary position","Hold one rigid posture all day","Ignore pain at work"],a:1,e:"A good setup supports the body and keeps tasks within comfortable reach. Variation and breaks matter as much as the initial arrangement."},{q:"What is a sensible manual handling approach?",o:["Twist while lifting to save time","Keep the load close, use aids, avoid twisting, and share heavy tasks","Lift the heaviest object without preparation","Ignore numbness"],a:1,e:"These principles reduce unnecessary leverage and load. No technique guarantees prevention, but sensible handling and equipment reduce risk."}],refs:["niosh","who-pa"]},{n:77,title:"Understanding Bone Density Tests and Imaging",part:10,mins:11,summary:"DXA, X-rays, CT, MRI and ultrasound answer different questions; understanding their purposes and limits helps readers prepare for results discussions.",objectives:["Describe the purposes of DXA, X-ray, CT, MRI and ultrasound.","Explain the meaning and limits of T-scores and Z-scores.","Prepare appropriate questions about imaging results."],sections:[{h:"DXA",p:`Dual-energy X-ray absorptiometry uses two X-ray energies to estimate bone mineral content and areal density, usually at the lumbar spine and hip. It is the standard test for diagnosing osteoporosis and for monitoring some people over time. The radiation dose is very low compared with many imaging tests.

DXA results include bone mineral density values, T-scores and Z-scores. T-scores compare with a young-adult reference mean; Z-scores compare with an age-matched reference. The WHO diagnostic thresholds apply mainly to postmenopausal women and men over 50, not to children. Degenerative change, previous fractures, implants, body size and positioning can affect readings.`,fig:"bone-density",cap:"Figure 77.1 — DXA reports include density, T-score and Z-score at specified sites; context is essential."},{h:"Other imaging",p:`Plain X-rays show fractures, alignment and joint changes but do not measure bone density reliably. CT provides detailed cross-sectional images and can identify fractures or structural problems, with a higher radiation dose than plain X-ray. MRI uses magnetic fields rather than ionising radiation and is valuable for soft tissues, bone marrow, nerves and some fractures that are hard to see. Ultrasound is useful for soft tissues, fluid and some tendons and can help guide procedures; it is not a standard bone density test.

Each test has indications, risks and limitations. In some situations, a combination is needed. Not every finding on a scan explains pain; some changes are age-related and common in asymptomatic people.`,list:[{title:"DXA",text:"Bone mineral density and fracture-risk assessment."},{title:"X-ray",text:"Fractures, alignment and visible joint changes."},{title:"CT",text:"Detailed cross-sectional anatomy; higher radiation."},{title:"MRI",text:"Soft tissues, nerves, marrow and certain radiographically occult fractures."},{title:"Ultrasound",text:"Soft tissue, fluid, tendon assessment and procedural guidance."}]},{h:"Preparing and interpreting",p:`For DXA, avoid clothing with metal zips or buttons and tell staff about recent contrast studies or implants. Results should be compared on the same type of machine where possible. Repeat scanning intervals depend on clinical context and expected change; more frequent scanning is not always better. Ask when to repeat and what would change.

Do not diagnose yourself from T-scores or online calculators. Treatment decisions integrate fracture history, age, medication, falls risk and preferences. Bring a list of questions and consider asking for a copy of the report. Imaging cannot show pain or predict every fracture, and normal results may still coexist with a treatable clinical problem.`,safety:"If you are pregnant or may be pregnant, tell the imaging service before any X-ray or CT. Your clinician will weigh the need for the test and the risks."}],terms:[["DXA","Dual-energy X-ray absorptiometry, the standard method for measuring bone mineral density."],["Z-score","A bone density comparison with an age-matched reference group."],["Osteoporosis diagnostic threshold","A T-score of −2.5 or below in appropriate adult populations, used with clinical context."]],myth:["A bone density scan tells you exactly how strong your bones are and whether you will fracture.","DXA measures areal mineral density at specific sites. Fracture risk also depends on architecture, bone quality, previous fracture, medical factors and falls. Risk assessment is broader than one score."],takeaways:["Different imaging tests answer different clinical questions.","DXA is central to osteoporosis diagnosis but has limitations.","Results must be interpreted by qualified professionals in context."],quiz:[{q:"Which test is standard for measuring bone mineral density?",o:["DXA","Ultrasound","Plain X-ray","Thermography"],a:0,e:"DXA is the standard clinical method for measuring areal bone mineral density. X-rays show fractures and alignment but not density accurately."},{q:"What does a Z-score compare with?",o:["A young-adult reference mean","An age-matched reference group","Muscle mass","Joint fluid volume"],a:1,e:"Z-scores compare with an age-matched group; T-scores compare with a young-adult reference. Each has specific uses."}],refs:["iof","niams-osteoporosis"]},{n:78,title:"Laboratory Tests and Musculoskeletal Assessments",part:10,mins:11,summary:"Blood and urine tests can support diagnosis and monitor treatment, but no single test stands alone; clinicians combine results with symptoms and examination.",objectives:["Identify common tests relevant to musculoskeletal conditions.","Explain why a normal or abnormal result needs context.","Prepare for tests and results discussions safely."],sections:[{h:"Common blood and urine tests",p:`A full blood count can show anaemia, infection or other abnormalities. Inflammatory markers such as ESR and CRP may be raised in inflammation but are nonspecific. Calcium, phosphate, albumin, alkaline phosphatase, vitamin D, PTH and kidney function help assess bone metabolism. Liver and thyroid tests may identify contributory conditions, and coeliac serology can be relevant to malabsorption.

Rheumatoid factor and anti-CCP antibodies support the assessment of inflammatory arthritis; uric acid is relevant to gout but can be normal during a flare. Joint fluid analysis can identify crystals or infection. Bone turnover markers may be used in selected patients or research, not as a universal screening test.`,fig:"assessment",cap:"Figure 78.1 — Assessment combines history, examination, laboratory tests and imaging; each contributes a piece of the picture."},{h:"Why context matters",p:`Test results vary with the laboratory, timing, fasting, medicines, hydration and concurrent illness. A result just outside a reference range may not be clinically significant, while an in-range result does not exclude disease. Reference ranges can differ by age, sex, pregnancy and laboratory method.

Some medicines alter results: biotin can affect certain immunoassays, oestrogen can alter inflammatory markers and blood counts, and steroids affect glucose and bone. Tell the clinician and laboratory about prescribed, over-the-counter and herbal products. Do not stop medicine for a test without advice.`,list:[{title:"Before testing",text:"Ask about fasting, timing, medicines and recent illness."},{title:"At the test",text:"Mention supplements, pregnancy and relevant symptoms."},{title:"After testing",text:"Ask what each abnormal result means and what happens next."},{title:"Do not",text:"Order tests yourself to self-diagnose or change treatment based on a result."}]},{h:"Diagnosis is not a single number",p:`Medical assessment also includes a history, physical examination, imaging, function and response to treatment. A normal test can be reassuring but is not absolute proof of health; for example, early inflammatory arthritis may have normal inflammatory markers. Conversely, an abnormal result may be incidental and need no intervention.

Bring your questions to the appointment and ask for an explanation in plain language. A second opinion can be appropriate when diagnosis or treatment is uncertain. In an emergency, do not wait for laboratory results; seek urgent care for red-flag symptoms.`,safety:"Abnormal calcium, unexplained fever with bone pain, high inflammatory markers or new neurological symptoms require timely clinical follow-up. Do not attempt to treat abnormal results with supplements or self-prescribed diets."}],terms:[["C-reactive protein","An inflammatory marker measured in blood; it is nonspecific and influenced by many conditions."],["Anti-CCP antibody","An autoantibody used in the assessment of rheumatoid arthritis."],["Bone turnover marker","A measure of bone formation or resorption used in selected clinical and research contexts."]],myth:["A blood test can rule out all bone and joint disease.","Many musculoskeletal conditions have normal routine blood tests. Diagnosis often relies on history, physical examination, imaging and specialist assessment."],takeaways:["Laboratory tests support, but do not replace, clinical assessment.","Context, timing and medicines affect results.","Ask what a test will change and what the next step is."],quiz:[{q:"Which test can help distinguish gout from infection in a joint?",o:["Joint fluid analysis","Bone density scan","A muscle power test","A hair mineral test"],a:0,e:"Joint aspiration and examination of fluid for crystals and infection is the key test when these diagnoses are uncertain."},{q:"What is a reasonable interpretation of a mild abnormality in a blood test?",o:["Immediately change all medication","Discuss it with a clinician and consider context and repeat testing","Assume it is definitely a serious disease","Ignore it permanently"],a:1,e:"Context, repeat testing and clinical assessment are needed. Self-generating a diagnosis can cause harm."}],refs:["niams-osteoporosis","acr-oa"]},{n:79,title:"Working With Healthcare Professionals and Understanding Treatment Options",part:10,mins:10,summary:"Effective musculoskeletal care is a partnership: prepare questions, share relevant history, discuss benefits and risks, and use shared decision-making.",objectives:["Prepare effectively for a musculoskeletal appointment.","Describe principles of shared decision-making.","Recognise safe use of medicines and non-drug treatments."],sections:[{h:"Making the most of an appointment",p:`Write down your main problem, when it began, what makes it better or worse, functional limits, medicines and allergies. Note questions and priorities. Bring a list of supplements and complementary products, and consider a trusted person to help you remember information. If possible, ask for the appointment to be conducted in a language or format you understand.

Report symptoms openly, including fatigue, mood, sleep, bladder or bowel symptoms and weight change. Tell the clinician if you are pregnant or planning pregnancy, have a history of cancer, or have recently started a new medicine. Ask for the reasoning behind tests and treatments.`,list:[{title:"Symptoms",text:"Onset, pattern, severity and effect on daily life."},{title:"History",text:"Previous fractures, falls, surgeries, family history and conditions."},{title:"Medicines",text:"Prescribed drugs, supplements, and allergic reactions."},{title:"Questions",text:"Diagnosis, options, benefits, risks, timing and follow-up."}]},{h:"Shared decision-making",p:`Treatment choices should reflect evidence and the person's values. Ask what the likely benefits and harms are, what happens without treatment, how long it takes to work, and what alternatives exist. For medication, ask about dose, duration, monitoring, interactions and side effects. For surgery, ask about recovery, revision and non-surgical options.

Clinicians may be uncertain, especially where evidence is limited. This is not necessarily incompetence. A respectful discussion can include uncertainty. You are entitled to ask questions, seek a second opinion and make informed choices, while acknowledging that some situations are emergencies requiring immediate care.`,fig:"assessment",cap:"Figure 79.1 — Shared decision-making blends clinical evidence, professional judgement and the person's goals and values."},{h:"Medicines and complementary care",p:`Take medications as prescribed and do not stop abruptly without advice, especially steroids, immunosuppressants, anticoagulants and osteoporosis drugs. Report side effects; alternatives may exist. Ask a pharmacist to check interactions if multiple products are used. Store medicines safely and check expiry dates.

Herbal and manual therapies range from useful adjuncts to ineffective or harmful practices. Regulation varies by country. Claims should be evaluated critically, and products should be disclosed to your treating team. Trusted educational resources such as national health services, professional bodies and original guidelines are better than anonymous testimonials.`,safety:"Seek urgent care for severe trauma, a hot swollen joint with fever, new neurological symptoms, chest pain or suspected serious medication reactions. Do not delay emergency care to ask an online question."}],terms:[["Shared decision-making","A collaborative process in which a clinician and patient choose care together using evidence and patient values."],["Second opinion","An additional professional assessment of diagnosis or treatment options, often useful for major decisions."],["Adverse drug reaction","An unwanted effect caused by a medicine; some are serious and require urgent care."]],myth:["Asking questions undermines the doctor–patient relationship.","Questions help ensure care fits the person's circumstances and improves safety. Good care welcomes informed participation."],takeaways:["Preparation improves the usefulness of a clinical appointment.","Shared decision-making weighs evidence, risks and personal priorities.","Never stop or change prescribed treatment without clinical advice."],quiz:[{q:"Which is a good question to ask about a new treatment?",o:["How much does the packaging cost?","What are the benefits, harms and alternatives, and what if I do nothing?","Can I take more than prescribed without asking?","Do online reviews replace evidence?"],a:1,e:"Understanding benefits, risks, alternatives and the untreated course supports informed consent and realistic expectations."},{q:"What should you do if a prescribed medicine causes concerning side effects?",o:["Abruptly stop it","Seek advice promptly and do not change the dose without guidance","Double the dose","Ignore it until the next annual visit"],a:1,e:"Some medicines cause serious reactions and stopping abruptly can be harmful. Contact the prescriber, pharmacist or urgent care, depending on severity."}],refs:["acr-oa","ros"]},{n:80,title:"Building a Lifelong Bone, Joint and Mobility Wellness Plan",part:10,mins:11,summary:"A sustainable plan starts with personal priorities, builds from current capacity, combines movement, nutrition, recovery and safety, and is reviewed over time.",objectives:["Combine the book's principles into a personal plan.","Set realistic, function-focused goals.","Monitor and adjust safely across life stages."],sections:[{h:"Begin with your why",p:`A plan is more likely to last if it serves a meaningful goal: playing with grandchildren, working without pain, walking to the market, gardening, climbing stairs or maintaining independence. Write down the specific activities that matter and where they currently feel difficult. These become your functional measures.

Choose a small number of changes that fit your time, money, culture and health. One strength session and a daily calcium-rich meal may be more valuable than an elaborate plan abandoned after two weeks. If you have a diagnosis, ask what your clinician advises about exercise and nutrition, and build around any restrictions.`,fig:"exercise-progression",cap:"Figure 80.1 — Start where you are, choose meaningful goals, progress gradually and review regularly."},{h:"The four foundations",p:`Movement: build aerobic activity, resistance training, balance work and mobility into a weekly rhythm, with rest days. Nourishment: include adequate energy, protein, calcium, vitamin D and overall dietary variety, adapting for health conditions. Recovery: prioritise sleep, stress management and lighter days. Safety: review falls risks, footwear, environment, medication and warning signs. These foundations reinforce one another.

Use the worksheets and challenge in this book to make the plan concrete. Track actions you actually control, such as planning meals, completing a session or practising balance, not medical outcomes such as bone density or diagnosis. Review monthly and adjust if the plan is too hard, too easy or no longer enjoyable.`,list:[{title:"Weekly rhythm",text:"Plan two strength sessions, regular walking, balance practice and mobility."},{title:"Daily nourishment",text:"Protein at meals, a calcium-rich food, produce and adequate overall energy."},{title:"Environment",text:"Supportive shoes, clear pathways, good lighting and safe equipment."},{title:"Review",text:"Reassess function, symptoms, confidence and appointments every 1–3 months."}]},{h:"Adjust across life",p:`Life changes — pregnancy, injury, illness, work stress, menopause, caring responsibilities, disability and ageing. A plan should move with you. Reduce load during acute illness; restart gradually. Discuss new symptoms and medication changes with appropriate professionals. Do not treat a new red flag as a reason to modify a worksheet.

This book is education, not a prescription or personal medical advice. The goal is informed, confident participation in your own health, supported by qualified clinicians when needed. Bone and joint health is not fixed at one age or defined by one scan. Small, consistent choices can support function, comfort and independence over years.`,safety:"This plan cannot diagnose or treat disease. Seek professional care for new or severe symptoms, suspected fracture, chest pain, neurological changes or before changing prescribed treatment."}],terms:[["Wellness plan","A personal, reviewed set of actions that support health, function and participation."],["Functional goal","A goal defined by a meaningful daily activity, such as walking to the shops or rising from a chair."],["Behavioural consistency","The ability to repeat a beneficial action over time, prioritising sustainability."]],myth:["There is a perfect bone-health plan that suits everyone and prevents all fractures.","There is no universal plan. Optimal action depends on health, age, culture, resources, ability and preferences. No plan guarantees prevention; the aim is to support resilience and function."],takeaways:["Build your plan around meaningful functional goals.","Combine movement, nourishment, recovery and safety; track actions, not diagnoses.","Review and adapt the plan through life with professional support where needed."],quiz:[{q:"What should a lifelong wellness plan measure?",o:["Only bone density","Actions and functions you can influence consistently","Other people's progress","The cost of supplements"],a:1,e:"Track controllable actions and meaningful function. Bone density is measured clinically and is not a daily self-tracking outcome."},{q:"What is the most sustainable starting point?",o:["A complex daily programme designed for an athlete","A small number of realistic changes aligned with your goals","No activity until symptoms disappear","Stopping prescribed medicine"],a:1,e:"Small, consistent, personal steps are more sustainable and adaptable than an unrealistic programme. Clinical treatment should be followed as prescribed."}],refs:["who-pa","iof"]}],ot=[...Ng,...Mg,...Cg,...Dg,...qg,...zg].sort((r,c)=>r.n-c.n),Eg=r=>ot.find(c=>c.n===r),Za=ot.flatMap(r=>r.quiz.map((c,m)=>({...c,id:`c${r.n}-q${m}`,chapter:r.n,chapterTitle:r.title,part:r.part}))),si=ot.length,ym=Za.length,Rg=[["Acetylcholine","Neurotransmitter released at the neuromuscular junction that activates skeletal muscle.",4],["Achilles tendon","The large tendon connecting the calf muscles to the heel bone; the calcaneal tendon.",3],["Activity limitation","Difficulty performing a task or action because of a health condition.",8],["Acute","Beginning suddenly and usually of short duration.",7],["Adaptation","A biological change in tissue in response to repeated demand and recovery.",8],["Adipose tissue","Fat-storing connective tissue, including yellow bone marrow.",2],["Afferent nerve","A nerve carrying sensory information towards the central nervous system.",1],["Agonist","The muscle primarily responsible for producing a movement.",4],["Alkaline phosphatase","An enzyme measured in blood that can rise with increased bone turnover or liver disease.",10],["Alpha-linolenic acid (ALA)","A plant-derived essential omega-3 fat found in flax, chia, hemp and walnuts.",6],["Amphiarthrosis","A joint allowing slight movement, such as a cartilaginous connection.",3],["Anabolic","Promoting tissue building; in bone care, describes medicines that increase bone formation.",7],["Anatomical position","Standing upright, facing forward with arms at the sides and palms forward.",1],["Antagonist","A muscle that opposes or controls the action of an agonist.",4],["Anterior","Towards the front of the body.",1],["Anti-CCP antibody","An antibody often found in rheumatoid arthritis and used to support diagnosis.",7],["Antiresorptive","A treatment that reduces bone resorption by osteoclasts.",7],["Arthralgia","Joint pain, which may occur with or without joint inflammation.",7],["Arthritis","A general term for joint disease; there are many inflammatory, degenerative and metabolic types.",7],["Articular cartilage","Smooth hyaline cartilage covering bone ends in synovial joints to reduce friction and distribute load.",3],["Atrophy","Reduction in tissue size, as in muscle or bone after disuse.",8],["Axial skeleton","The skull, vertebral column, ribs and sternum; the central supporting axis.",1],["Ball-and-socket joint","A synovial joint allowing multi-axis movement, such as the hip or shoulder.",3],["Base of support","The area beneath and between the points of contact with a supporting surface.",5],["Bioavailability","The proportion of a consumed nutrient that is absorbed and available to the body.",6],["Bisphosphonate","A class of medicine that reduces osteoclast activity and is used in osteoporosis.",7],["Bone","Living tissue with a collagen-rich matrix reinforced by mineral, remodelled throughout life.",2],["Bone mineral density (BMD)","The amount of mineral per measured area of bone, estimated by DXA.",5],["Bone quality","Aspects of bone beyond mineral density, including architecture and material properties.",5],["Bone remodelling","The coordinated removal and replacement of bone by osteoclasts and osteoblasts.",5],["Bone turnover marker","A blood or urine measure reflecting bone formation or resorption activity.",10],["Brace","An external support used to stabilise, protect or guide movement, including in scoliosis.",7],["Bursa","A small fluid-filled sac that reduces friction between moving tissues.",3],["Bursitis","Inflammation or irritation of a bursa; can be infective or non-infective.",7],["Calcitonin","A thyroid hormone that can reduce osteoclast activity and lower blood calcium.",5],["Callus","Bridging repair tissue formed around a fracture before remodelling into bone.",7],["Calcium","A mineral essential for bone mineralisation, muscle contraction, nerve function and clotting.",6],["Callus (fracture)","Temporary tissue that stabilises a fracture and is progressively replaced by bone.",7],["Cardiac muscle","Involuntary, striated heart muscle specialised for continuous rhythmic contraction.",4],["Cartilage","A specialised connective tissue providing smooth surfaces, flexibility and load distribution.",3],["Cauda equina syndrome","Compression of lumbosacral nerve roots causing bowel, bladder and neurological symptoms; an emergency.",7],["Cellulitis","A bacterial skin and deep-tissue infection that can cause redness, warmth and fever.",7],["Central nervous system","The brain and spinal cord, which integrate sensation and coordinate movement.",1],["Centre of mass","The average position of body mass; balance requires it over the base of support.",4],["Chondrocyte","A cartilage-producing cell that maintains the cartilage matrix.",3],["Chronic","Persisting for a long period, often months or longer.",7],["Cobb angle","A radiographic measurement of spinal curvature used in scoliosis assessment.",7],["Cofactor","A substance, often mineral-derived, required for an enzyme to function.",6],["Collagen","A family of structural proteins forming the organic framework of bone, tendon, ligament and cartilage.",2],["Compartment syndrome","A painful emergency in which pressure within a tissue compartment compromises circulation and nerves.",7],["Compensatory movement","An alternative movement strategy used when another part of the body is restricted or painful.",1],["Complete fracture","A fracture extending through the bone, as opposed to an incomplete fracture.",7],["Computed tomography (CT)","Cross-sectional X-ray imaging showing detailed anatomy at a higher radiation dose than plain X-ray.",10],["Concentric contraction","Muscle shortening while generating force.",4],["Congenital","Present from birth, whether inherited or arising during development.",7],["Connective tissue","Biological tissue that supports and binds other tissues, including bone, cartilage, tendon and fascia.",1],["Contusion","Bruising caused by direct impact, with bleeding into tissue.",7],["Cortical bone","Dense outer bone that resists bending and torsion; also called compact bone.",2],["Corticosteroid","A steroid medicine that reduces inflammation; prolonged use can weaken bone.",7],["Crepitus","A crackling or grinding sensation or sound, often with joint movement.",7],["Cross-bridge","The temporary attachment between myosin and actin that drives muscle filament sliding.",4],["Cytokine","A small signalling molecule involved in immunity and inflammation.",7],["Deload","A planned reduction in training stress to support recovery and adaptation.",8],["Densitometry","Measurement of bone mineral density, usually by DXA.",10],["Diaphysis","The shaft of a long bone, with thick cortical bone and a central cavity.",2],["Diarthrosis","A freely movable joint, typically synovial.",3],["Dietary pattern","The overall combination and frequency of foods and drinks consumed over time.",6],["Disability","The interaction of impairment with environmental and personal factors that limits participation.",9],["Disuse osteopenia","Bone loss caused by reduced mechanical loading during inactivity or immobilisation.",5],["DMARD","Disease-modifying antirheumatic drug used to control inflammatory arthritis and prevent damage.",7],["DXA","Dual-energy X-ray absorptiometry, the standard method for measuring bone mineral density.",10],["Dynamic balance","Control of balance while moving, as in walking or changing direction.",8],["Eccentric contraction","Muscle lengthening while generating force, often controlling a movement.",4],["Effective dose range","The range of exercise or load intensity that produces adaptation without excessive risk.",8],["Effusion","Abnormal accumulation of fluid within a joint cavity.",3],["Endochondral ossification","Bone formation in which a cartilage template is progressively replaced by bone.",2],["Endosteum","The thin membrane lining internal bone cavities and surfaces.",2],["Energy availability","Energy remaining for normal physiological function after exercise expenditure.",6],["Enthesis","The attachment site where tendon or ligament inserts into bone.",3],["Epiphyseal plate","The growth plate where longitudinal bone growth occurs in children and adolescents.",2],["Epiphysis","The expanded end of a long bone, often covered by articular cartilage.",2],["Ergonomics","Designing work and equipment to fit human capabilities and needs.",9],["Essential amino acid","An amino acid the body cannot synthesise and must obtain from food.",6],["Essential fatty acid","A fat the body cannot make and must obtain from food, such as ALA.",6],["Exertional compartment syndrome","Exercise-induced pressure within a muscle compartment causing pain and limitation.",7],["Extensor","A muscle that straightens or extends a joint or body part.",4],["Fascia","Continuous connective tissue surrounding muscles, organs and other structures.",3],["Fascicle","A bundle of muscle fibres surrounded by connective tissue.",4],["Fat pad","Adipose tissue that cushions and protects areas such as beneath the kneecap.",3],["Fatigue","Reduced capacity to generate force or perform work after exertion.",8],["FGF23","A hormone regulating phosphate excretion and vitamin D metabolism.",5],["Fibrocartilage","Tough cartilage adapted for load-bearing, found in menisci, discs and symphyses.",3],["Fibrous joint","A joint bound by dense connective tissue, usually allowing little movement.",3],["Flexibility","The available range of motion of a muscle–tendon unit or joint.",8],["Flexor","A muscle that bends or flexes a joint.",4],["Fracture","A break or crack in a bone caused by acute force, repeated stress or weakened bone.",7],["Fragility fracture","A fracture resulting from low-energy trauma that would not normally break healthy bone.",7],["FRAX","A fracture risk assessment tool combining clinical risk factors and, where available, bone density.",10],["Functional goal","A goal defined by a meaningful daily activity rather than an isolated measure.",10],["Gait cycle","The sequence from initial contact of one foot to the next contact of the same foot.",4],["Glenohumeral joint","The shoulder joint between the humeral head and the scapular glenoid cavity.",3],["Glucocorticoid","A steroid hormone or medicine that reduces inflammation but can weaken bone over time.",5],["Gout","An inflammatory arthritis caused by monosodium urate crystals in or around joints.",7],["Gracile","Slender, light-bodied; descriptive of some body types and skeletal proportions.",1],["Growth plate","Cartilage near the end of a growing long bone where longitudinal growth occurs.",2],["Haematoma","A local collection of blood, including the initial fracture repair environment.",7],["Haematopoiesis","Formation of blood cells from stem cells, including in red bone marrow.",2],["Health equity","Efforts to ensure fair opportunity for health, accounting for differing circumstances.",1],["Hinge joint","A synovial joint allowing mainly one-axis motion, such as the elbow.",3],["Homeostasis","The body's active maintenance of a stable internal environment.",1],["Hyaline cartilage","Smooth, avascular cartilage covering bone ends and reducing friction.",3],["Hydroxyapatite","The calcium phosphate mineral that reinforces bone and teeth.",2],["Hypercalcaemia","Elevated blood calcium, which can result from excessive vitamin D, hyperparathyroidism or malignancy.",5],["Hypermobility","Greater than typical joint range, which may be asymptomatic or associated with symptoms.",8],["Hyperparathyroidism","Excess parathyroid hormone activity, potentially causing high calcium and bone loss.",5],["Hypophosphatasia","A rare genetic disorder affecting mineralisation due to alkaline phosphatase deficiency.",7],["Immobilisation","Restriction of movement, which can cause rapid bone and muscle loss.",5],["Immunosuppression","Reduced immune function, whether from disease or medicine, increasing infection risk.",7],["Incidence","The number of new cases of a condition arising in a population over a period.",7],["Inflammation","A protective immune response to injury or infection; chronic inflammation can damage tissue.",7],["Insertional tendinopathy","Tendon pain localised at the attachment to bone.",7],["Insulin-like growth factor 1 (IGF-1)","A growth hormone–related factor that influences bone and muscle growth.",5],["Isometric contraction","Muscle tension without a change in muscle length.",4],["Joint","The region where bones meet, enabling stability and/or movement.",3],["Joint capsule","The fibrous and synovial envelope that encloses and stabilises a synovial joint.",3],["Joint effusion","Fluid accumulation within a joint cavity, causing swelling.",3],["Joint replacement","Surgery replacing a damaged joint surface with a prosthesis, used in selected advanced disease.",7],["Joint stability","The ability of a joint to resist unwanted movement under load.",3],["Kyphosis","Increased forward curvature of the thoracic spine, which can be age-related or structural.",7],["Labrum","A fibrocartilaginous rim that deepens a joint socket, as in the hip or shoulder.",3],["Lactation","Production of breast milk, associated with temporary changes in calcium and bone metabolism.",9],["Load tolerance","The amount of force a tissue can currently withstand without injury.",8],["Ligament","Dense connective tissue connecting bone to bone and restraining abnormal motion.",3],["Ligament sprain","Injury to a ligament from excessive stretch or tearing.",7],["Limp","An asymmetric gait pattern that can result from pain, weakness or structural difference.",7],["Low energy availability","Insufficient energy remaining for normal function after exercise expenditure.",6],["Low bone mass","Lower-than-normal bone density; often used interchangeably with osteopenia.",7],["Magnesium","A mineral cofactor for many enzymes, including ATP-related reactions and bone metabolism.",6],["Mechanical loading","Force applied to tissue through body weight, muscle action, impact or external resistance.",4],["Mechanostat","A conceptual feedback system in which bone adjusts mass to habitual strain.",5],["Menarche","The first menstrual period, influenced by growth, nutrition, stress and hormones.",9],["Meniscus","Fibrocartilaginous knee pad that distributes load and improves joint congruity.",3],["Menopause","The permanent cessation of menstruation, typically diagnosed after 12 months without a period.",9],["Menopausal hormone therapy","Oestrogen with or without a progestogen used for menopausal symptoms and bone protection.",9],["Metaphysis","The transition region between the shaft and end of a long bone, including the growth plate during growth.",2],["Minerals","Inorganic nutrients essential for structure and physiological function, such as calcium and magnesium.",6],["Modifiable risk factor","A factor influencing health that can be changed, at least partly.",1],["Moment arm","The perpendicular distance from a joint axis to the line of force; determines leverage.",4],["Morbidity","Illness or the burden of disease in a population.",1],["Motor neuron","A nerve cell that carries signals to muscle fibres.",4],["Motor unit","One motor neuron and all the muscle fibres it innervates.",4],["Muscle strain","Injury to muscle or its tendon from excessive force or stretch.",7],["Musculoskeletal system","The interacting bones, joints, muscles and connective tissues that support and move the body.",1],["Myelin sheath","A fatty insulating layer around some nerve fibres that speeds conduction.",1],["Myofibril","A thread-like structure within a muscle fibre containing contractile filaments.",4],["Myokine","A signalling molecule released by muscle that influences other tissues.",4],["Nerve root","The initial segment of a spinal nerve where it exits the spine.",7],["Neuromuscular junction","The connection where a motor neuron signals a muscle fibre.",4],["Nitric oxide","A signalling molecule with roles in blood flow and other physiological processes.",6],["Non-specific low back pain","Back pain not attributable to a specific identifiable disease or structural cause.",7],["Non-steroidal anti-inflammatory drug (NSAID)","A medicine that reduces pain and inflammation but can affect the stomach and kidneys.",7],["Non-weight-bearing exercise","Activity in which body weight is largely supported by water or equipment, such as swimming.",8],["Nutrient","A substance in food needed for growth, maintenance and physiological function.",6],["Obesity","A chronic condition of excess body fat with metabolic and mechanical consequences.",8],["Occupational therapy","Supporting participation and daily function through task adaptation, equipment and skill-building.",9],["Oestrogen","A sex hormone essential for skeletal maturation and restraint of bone resorption.",5],["Omega-3 fatty acid","A family of essential fats with roles in cell membranes and inflammation.",6],["Osteoarthritis","A whole-joint condition involving cartilage, bone, synovium, muscles and pain.",7],["Osteoblast","A bone-forming cell that produces organic matrix and supports mineralisation.",2],["Osteocalcin","A bone matrix protein whose activity depends on vitamin K–dependent modification.",6],["Osteoclast","A large multinucleated cell that resorbs bone mineral and matrix.",2],["Osteocyte","A bone cell embedded in matrix that senses strain and coordinates remodelling.",2],["Osteogenesis imperfecta","A genetic disorder of collagen causing variable bone fragility.",7],["Osteomalacia","Defective mineralisation of bone in adults, causing soft and weak bone.",7],["Osteon","A cylindrical cortical bone unit of concentric lamellae around a central canal.",2],["Osteopenia","Bone density between a T-score of −1.0 and −2.5; a risk category, not a fracture diagnosis.",7],["Osteophyte","A bony outgrowth at a joint margin, common in osteoarthritis.",7],["Osteoporosis","A disease of reduced bone strength that increases fragility fracture risk.",7],["Osteoprotegerin (OPG)","A soluble receptor that limits RANKL-mediated osteoclast formation.",5],["Osteotomy","Surgical cutting or repositioning of bone, used in selected orthopaedic procedures.",7],["Pain","An unpleasant sensory and emotional experience influenced by biological, psychological and social factors.",1],["Palliative","Care focused on relieving symptoms and supporting quality of life rather than curing disease.",7],["Parathyroid hormone (PTH)","A hormone that raises blood calcium through kidney, bone and vitamin D pathways.",5],["Passive range of motion","Movement of a joint produced by an external force rather than the person's muscles.",8],["Peak bone mass","The highest bone mass attained, generally by the late twenties.",5],["Pelvic floor","The muscles supporting pelvic organs and controlling continence.",9],["Periosteum","A fibrous membrane covering most bone surfaces, carrying vessels and contributing to repair.",2],["Phosphorus","A mineral essential to bone hydroxyapatite, energy metabolism and acid–base balance.",6],["Physical activity","Any bodily movement produced by skeletal muscles that increases energy expenditure.",4],["Physical literacy","The confidence, motivation and competence to be physically active across life.",9],["Placebo","A treatment with no active ingredient, used in trials and capable of producing real symptom effects.",6],["Plantar fascia","A strong fibrous band along the sole of the foot supporting the arch.",3],["Plyometric exercise","Fast stretch-shortening movements such as jumping, used to train power and bone loading.",8],["Polymyalgia rheumatica","An inflammatory condition causing proximal pain and stiffness, typically in older adults.",7],["Posterior","Towards the back of the body.",1],["Prevalence","The proportion of a population with a condition at a given time.",1],["Progressive overload","Gradually increasing training demand to stimulate adaptation.",8],["Proprioception","The sense of body po
