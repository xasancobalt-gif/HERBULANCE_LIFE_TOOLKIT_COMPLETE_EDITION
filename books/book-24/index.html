This is why no result should be over-interpreted by a reader alone. Height loss, back pain or a fracture after a low-energy fall may indicate clinically significant bone disease even if a density result seems reassuring. Similarly, low density does not always equal imminent fracture. Discuss the whole picture with the clinician who ordered the test.`,safety:"Do not change prescribed bone medication on the basis of a worksheet, a home scan or another person's experience. Interpreting DXA and deciding treatment requires qualified clinical assessment."}],terms:[["DXA","Dual-energy X-ray absorptiometry; the standard imaging method for measuring bone mineral density."],["T-score","The number of standard deviations a bone density result lies from a young-adult reference mean."],["FRAX","A fracture risk assessment tool that combines clinical risk factors with bone density where available."]],myth:["A diagnosis of osteoporosis can be made reliably from height loss, posture or a symptom checklist.","Diagnosis generally requires bone density testing, prior fragility fracture or a formal fracture-risk assessment, interpreted by a clinician. Symptoms alone are not diagnostic."],takeaways:["Bone density is a useful but incomplete measure of bone strength.","T-scores and Z-scores have specific contexts and limitations.","Fracture risk combines bone, falls, medical history and age."],quiz:[{q:"What does a T-score compare?",o:["Your height with your arm span","Bone density with a young-adult reference mean","Calcium intake with calcium excretion","Muscle mass with bone mass"],a:1,e:"A T-score expresses bone mineral density in standard deviations from a young-adult reference group. Z-scores compare with an age-similar group."},{q:"Which factor is NOT captured by a bone density measurement alone?",o:["Mineral content in the measured area","Trabecular architecture throughout the skeleton","A summary of mineral density at selected sites","Reference comparison for the measured site"],a:1,e:"DXA estimates areal density at specific sites. It does not provide a full three-dimensional picture of microstructure or bone quality everywhere."}],refs:["iof","niams-osteoporosis"]},{n:36,title:"Calcium Regulation and Bone Metabolism",part:5,mins:10,summary:"Blood calcium is tightly regulated because it supports nerves, muscles and clotting; when intake is low, hormones mobilise skeletal stores and influence bone turnover.",objectives:["Explain why blood calcium is tightly regulated.","Describe the roles of parathyroid hormone, vitamin D and calcitonin.","Recognise that bone is both a structural and a mineral reserve."],sections:[{h:"Calcium's critical jobs",p:`Calcium is essential for muscle contraction, nerve conduction, hormone secretion, blood clotting and enzyme activity. Only a small fraction of body calcium circulates; most is stored in bone. Because circulating calcium must remain within a narrow range, the body adjusts absorption, kidney excretion and bone exchange minute by minute.

The average adult body contains over a kilogram of calcium, almost all in bone and teeth. Bone is therefore both a structure and a reservoir. When dietary supply is persistently inadequate, hormones can draw on the skeleton, but this is not a free meal: sustained mobilisation can contribute to bone loss over time.`,fig:"calcium-vitamin-d",cap:"Figure 36.1 — Calcium homeostasis: parathyroid hormone and activated vitamin D raise blood calcium; calcitonin broadly opposes them; the kidneys regulate excretion."},{h:"Hormonal coordination",p:`When blood calcium falls, the parathyroid glands release parathyroid hormone (PTH). PTH increases renal calcium reabsorption, stimulates activation of vitamin D in the kidney, and indirectly increases bone resorption through osteoblast signalling. Activated vitamin D increases intestinal calcium absorption. Calcitonin, produced by the thyroid, can reduce bone resorption and renal calcium loss, though its role in normal human calcium balance is relatively modest.

In chronic kidney disease, phosphate retention, reduced vitamin D activation and elevated PTH create a complex disorder affecting bone and vessels. This is why HERBULANCE Book 22 on kidney health is a relevant companion. Albumin and blood pH also affect reported calcium values.`,list:[{title:"PTH",text:"Raises serum calcium and activates vitamin D; chronically excessive in some diseases."},{title:"Vitamin D",text:"Hormone-like nutrient that supports intestinal calcium and phosphate absorption."},{title:"Calcitonin",text:"Can reduce calcium release from bone; less central to usual calcium balance."},{title:"FGF23",text:"Regulates phosphate excretion and influences vitamin D activation."}]},{h:"Tests and clinical care",p:`Serum calcium, phosphate, albumin, alkaline phosphatase, kidney function, vitamin D and PTH are interpreted together. An elevated calcium result can reflect hyperparathyroidism, malignancy or other conditions and needs medical evaluation. A normal blood calcium does not exclude bone disease, because the body may be maintaining serum levels at the expense of bone.

Readers should not use supplemental calcium to treat symptoms without advice. High doses can cause gastrointestinal upset and, in excess, serious hypercalcaemia. Calcium supplements may interact with medicines and should be discussed with a pharmacist or clinician, especially in kidney disease.`,safety:"Very high calcium intake from supplements can be harmful. Avoid self-prescribing high doses; discuss supplements and abnormal blood results with a qualified professional."}],terms:[["Parathyroid hormone","A hormone that raises blood calcium by acting on kidney, bone and vitamin D metabolism."],["Calcitonin","A thyroid hormone that can inhibit osteoclast activity and lower calcium; used clinically in some conditions."],["FGF23","Fibroblast growth factor 23, a hormone regulating phosphate and vitamin D metabolism."]],myth:["If the calcium level in blood is normal, bone must be healthy.","Blood calcium is regulated even at the expense of skeletal stores. A normal blood calcium does not rule out low bone density or other bone disease."],takeaways:["Blood calcium is controlled within a narrow range through coordinated hormones.","Bone provides a substantial mineral reservoir that can be mobilised when needed.","Abnormal calcium tests need professional interpretation and should not be self-treated."],quiz:[{q:"Which hormone raises blood calcium through kidney and bone actions and vitamin D activation?",o:["Insulin","Parathyroid hormone","Calcitonin","Adrenaline"],a:1,e:"PTH increases renal calcium reabsorption, activates vitamin D and influences bone resorption to raise serum calcium."},{q:"Which statement is accurate?",o:["Bone calcium never interacts with blood calcium","A normal blood calcium always excludes bone disease","Bone acts as a regulated calcium reservoir","Calcitonin is the main calcium-raising hormone"],a:2,e:"Bone stores calcium and participates in homeostasis. Serum calcium can remain normal while bone mass is low, and calcitonin is not the main calcium-raising hormone."}],refs:["nih-calcium","niams-osteoporosis"]},{n:37,title:"Vitamin D and Calcium Absorption",part:5,mins:10,summary:"Vitamin D supports calcium and phosphate absorption and bone mineralisation; status depends on sunlight, diet, skin, age and medical factors, and public health advice varies by country.",objectives:["Explain vitamin D metabolism and its role in bone.","Identify factors affecting vitamin D status.","Interpret common supplement guidance without excess."],sections:[{h:"From skin and food to active hormone",p:`Vitamin D is synthesised in skin when UVB radiation converts a cholesterol derivative to vitamin D3. It is also obtained from some foods, including oily fish, egg yolks and fortified products. It is converted in the liver to 25-hydroxyvitamin D [25(OH)D], the usual status marker, and then in the kidney to its active form, 1,25-dihydroxyvitamin D.

Active vitamin D increases intestinal absorption of calcium and phosphate and supports bone mineralisation. Deficiency can cause rickets in children and osteomalacia in adults, with bone pain, weakness and fractures. Diagnosis requires clinical assessment and laboratory testing where indicated.`,fig:"calcium-vitamin-d",cap:"Figure 37.1 — Vitamin D pathway: skin synthesis and dietary intake → liver 25(OH)D → kidney activation → calcium and phosphate absorption."},{h:"Sunlight, latitude and skin",p:`Skin synthesis depends on UVB intensity, latitude, season, time of day, cloud, pollution, clothing, sunscreen, skin pigmentation and age. In many countries, little or no vitamin D is produced in winter months. People who cover their skin, work indoors, live in institutions, have darker skin in low-UV settings, are older, or have malabsorption are at higher risk.

Sun protection remains important for skin cancer prevention. The balance between synthesising vitamin D and avoiding sun damage is not the same for every location. National guidance should be prioritised, as recommendations differ between countries and population groups.`,list:[{title:"Diet",text:"Oily fish, egg yolk and fortified foods contribute, but intakes are often modest."},{title:"Sunlight",text:"Season, latitude, skin, clothing and sunscreen modulate synthesis."},{title:"Clinical risk",text:"Malabsorption, kidney or liver disease, obesity and some medicines affect status."},{title:"Testing",text:"25(OH)D is the usual measure; testing should be clinically appropriate."}]},{h:"Supplements and safety",p:`Public health recommendations vary. For example, UK advice for the general population includes a daily 10 microgram (400 IU) supplement during autumn and winter, and year-round for people with little sun exposure. US recommendations include about 15 micrograms (600 IU) daily for adults aged 19–70 and 20 micrograms (800 IU) for adults over 70, primarily as a dietary reference intake, with extra emphasis on older adults and others at risk. Some authorities use higher supplement doses for diagnosed deficiency, under clinical supervision.

More is not better. Very high doses can cause hypercalcaemia, nausea, kidney stones and harm. The tolerable upper intake level for most adults is commonly cited as 100 micrograms (4,000 IU) per day from all sources, though clinical deficiency treatment may exceed this under supervision. Do not take high-dose supplements without advice.`,safety:"Vitamin D supplements can interact with medicines and be inappropriate in some conditions. Seek advice if you are pregnant, have kidney disease or take high-dose or activated vitamin D products."}],terms:[["25-hydroxyvitamin D","The main circulating vitamin D metabolite and standard laboratory marker of status."],["Rickets","A childhood disorder of defective bone mineralisation associated with vitamin D deficiency."],["Osteomalacia","Softening of bone in adults due to inadequate mineralisation, often from vitamin D deficiency."]],myth:["A very high vitamin D dose will prevent all fractures and strengthen bones faster.","Vitamin D is essential, but excessive intake is harmful. Adequate vitamin D and calcium support bone, yet the evidence does not support megadoses for universal fracture prevention."],takeaways:["Vitamin D supports calcium and phosphate absorption and bone mineralisation.","Status depends on sunlight, diet, skin, age and health; national guidance varies.","Avoid high-dose supplementation without professional advice."],quiz:[{q:"Which is the usual marker of vitamin D status?",o:["1,25-dihydroxyvitamin D","25-hydroxyvitamin D","Serum calcitonin","Alkaline phosphatase only"],a:1,e:"25(OH)D is the major circulating form and is used to assess status. The kidney-produced active form is not the standard status marker."},{q:"What can excessive vitamin D supplementation cause?",o:["Hypercalcaemia and kidney problems","Permanent cartilage regrowth","Guaranteed bone perfection","Reduced need for clinical care"],a:0,e:"Excess vitamin D can raise blood calcium and cause problems including nausea, kidney stones and kidney injury. More is not better."}],refs:["nih-vitd","nhs-vitd"]},{n:38,title:"Phosphorus, Magnesium and Other Minerals",part:5,mins:10,summary:"Bone mineral is not only calcium: phosphorus, magnesium, vitamin K and several trace nutrients participate in matrix formation, mineralisation and energy metabolism.",objectives:["Describe phosphorus and magnesium in bone health.","Explain vitamin K's relationship to bone proteins.","Avoid unnecessary or excessive supplementation."],sections:[{h:"Phosphorus: structural and regulatory",p:`Phosphorus is a major component of hydroxyapatite and is central to energy transfer (ATP), cell membranes and acid–base balance. Most body phosphorus is in bone. Kidneys tightly regulate phosphate balance, with PTH and FGF23 adjusting excretion.

Phosphate is widespread in foods, and dietary deficiency is uncommon in healthy people eating adequate calories. Chronic kidney disease can cause phosphate retention, which is why clinical dietary advice may restrict phosphate under specialist guidance. Cola drinks and processed foods contribute phosphate for some people, but the relationship between dietary phosphate and bone health is more nuanced than a single 'bad' food label.`,list:[{title:"Phosphorus",text:"Structural mineral, energy metabolism and acid–base regulation; kidney regulated."},{title:"Magnesium",text:"Cofactor in hundreds of enzymes, ATP function and bone matrix; status matters, especially in malabsorption."},{title:"Vitamin K",text:"Required for carboxylation of osteocalcin and some clotting proteins."},{title:"Trace elements",text:"Copper, zinc and manganese support enzyme systems involved in connective tissue."}]},{h:"Magnesium and vitamin K",p:`About half to two-thirds of body magnesium is in bone. Magnesium is a cofactor for reactions involving ATP and influences parathyroid hormone and vitamin D metabolism. Deficiency can occur with malabsorption, excessive alcohol, certain medicines or poor intake, and may contribute to muscle cramps, weakness or arrhythmia. Clinical deficiency is diagnosed by a clinician; routine testing is not always straightforward.

Vitamin K is required for gamma-carboxylation of osteocalcin, a protein involved in bone matrix. Low vitamin K status has been associated with poorer bone measures, but evidence that supplements prevent fractures is limited. People taking warfarin need consistent vitamin K intake and should not change supplements without medical advice. Leafy greens and fermented foods provide vitamin K.`,fig:"nutrition-plate",cap:"Figure 38.1 — Nutrient variety from foods supports bone and muscle; the diagram is a teaching pattern, not a prescription."},{h:"Trace minerals and balanced intake",p:`Copper, zinc, manganese and other trace elements support enzymes involved in collagen formation and antioxidant defence. Serious deficiency can affect connective tissue, but routine high-dose supplementation in well-nourished people is not shown to strengthen bone. Interactions matter: high zinc can impair copper status, and excess of one mineral can disturb another.

A varied diet containing legumes, whole grains, nuts, seeds, leafy greens, dairy or fortified alternatives, and protein foods generally supplies these minerals. When a deficiency is suspected, testing and treatment should be clinically guided. This is the practical message echoed in HERBULANCE Book 10 on micronutrients.`,safety:"Do not take megadose mineral supplements. High doses can cause toxicity and interfere with other nutrients or medicines. Seek advice if you have kidney disease or take prescribed anticoagulants."}],terms:[["Osteocalcin","A bone protein whose activity depends on vitamin K–dependent carboxylation."],["Hyperphosphataemia","Elevated blood phosphate, especially relevant in kidney disease."],["Cofactor","A substance required for an enzyme to function, often a mineral-derived ion."]],myth:["Everyone needs a broad mineral supplement to build bones.","Most people meet their mineral needs through a varied diet. Supplements are not automatically beneficial and may be unnecessary or harmful in excess. Targeted treatment follows a diagnosed deficiency."],takeaways:["Phosphorus and magnesium are essential to bone and whole-body function.","Vitamin K supports bone proteins, but fractures are not prevented by supplements alone.","Varied food intake is preferable to unsupervised megadoses."],quiz:[{q:"Which nutrient is a major mineral component of hydroxyapatite alongside calcium?",o:["Phosphorus","Iodine","Iron","Selenium"],a:0,e:"Hydroxyapatite is a calcium phosphate mineral. Phosphorus is also central to energy metabolism."},{q:"Which statement about supplements is most accurate?",o:["More minerals always produce stronger bones","Supplements may be helpful for diagnosed deficiencies but are not automatically necessary or risk-free","Vitamin K supplements are safe for everyone on blood thinners","Magnesium cures muscle cramps for all people"],a:1,e:"Focus on evidence and individual diagnosis. Supplements can interact and cause harm; decisions should be based on clinical assessment."}],refs:["nih-magnesium","niams-osteoporosis"]},{n:39,title:"Hormones and Skeletal Health",part:5,mins:10,summary:"Oestrogen, testosterone, growth hormone, parathyroid hormone, thyroid hormone and cortisol all influence bone remodelling and mass across life.",objectives:["Name key hormones that influence bone.","Explain how hormone excess or deficiency affects the skeleton.","Recognise when clinical evaluation is warranted."],sections:[{h:"Sex hormones and growth",p:`Oestrogen is critical for skeletal maturity and maintenance of bone. It reduces bone resorption and helps close growth plates during puberty. After menopause, oestrogen decline is associated with accelerated bone loss. Oestrogen deficiency in younger women from functional hypothalamic amenorrhoea — often related to low energy availability and excessive exercise — can also harm bone.

Testosterone supports bone and muscle. Prolonged low testosterone may contribute to bone loss, but testosterone therapy has risks and is not a general anti-ageing treatment. Growth hormone and IGF-1 drive growth in childhood; growth hormone excess can cause bone overgrowth and organ problems, while deficiency in children causes short stature.`,fig:"life-stages",cap:"Figure 39.1 — Sex hormones, growth and age interact across life; individual trajectories vary significantly."},{h:"Calciotropic and thyroid hormones",p:`PTH controls calcium through kidney, bone and vitamin D pathways. In hyperparathyroidism, excessive PTH can cause hypercalcaemia and bone loss. In hypoparathyroidism, low calcium can cause cramps, tingling and seizures. Thyroid hormone excess can increase bone turnover and reduce bone density; both overtreatment and undertreatment with thyroid medication can be relevant, so monitoring is clinical.

Cortisol excess — whether endogenous (Cushing syndrome) or from prolonged glucocorticoid treatment — reduces bone formation and increases fracture risk. Bone loss can occur quickly with oral steroids, and preventive assessment is a recognised part of care. This is one reason prescriptions should be monitored rather than stopped suddenly.`,list:[{title:"Oestrogen",text:"Restrains bone resorption; aids skeletal maturation; declines at menopause."},{title:"Testosterone",text:"Supports bone and muscle; deficiency can reduce bone mass."},{title:"PTH",text:"Regulates calcium; excess causes bone loss and hypercalcaemia."},{title:"Cortisol",text:"Excess reduces bone formation and raises fracture risk."}]},{h:"When to seek assessment",p:`Hormonal effects are usually invisible until a fracture, growth abnormality or other symptom appears. A clinician may investigate unexplained fractures, early menopause, absent periods, low libido with bone density concerns, hypercalcaemia, unusual growth or possible steroid effects. Treatment targets the cause and is monitored with tests.

Readers should not self-manage hormones or take bone-active treatments obtained online. Hormone use can have systemic risks, and authenticity of products is uncertain. The endocrine system is examined further in HERBULANCE Book 17.`}],terms:[["Oestrogen","A sex hormone essential for skeletal maturation and restraint of bone resorption."],["Hyperparathyroidism","Excess parathyroid hormone activity, which can raise blood calcium and cause bone loss."],["Glucocorticoid","A steroid hormone or medicine that reduces inflammation but can weaken bone when used long term."]],myth:["Men do not get osteoporosis because they have testosterone.","Men do develop osteoporosis, especially with age, low testosterone, steroids, smoking, alcohol excess and other conditions. Assessment should be based on risk factors and symptoms, not sex alone."],takeaways:["Sex and growth hormones strongly shape bone across the lifespan.","Hormonal excess and deficiency can both harm the skeleton.","Hormone-related bone problems require clinical assessment, not self-treatment."],quiz:[{q:"Which hormonal change contributes most to accelerated bone loss after menopause?",o:["Rising oestrogen","Falling oestrogen","Falling calcitonin only","Rising insulin"],a:1,e:"Oestrogen decline increases bone resorption and is associated with accelerated bone loss around menopause."},{q:"Prolonged glucocorticoid (steroid) treatment is associated with:",o:["Increased bone formation and lower fracture risk","Reduced bone formation and increased fracture risk","No skeletal effect","Improved cartilage regeneration"],a:1,e:"Glucocorticoids can reduce bone formation and quality, increasing fracture risk. Patients on prolonged steroids should be assessed and monitored."}],refs:["ros","niams-osteoporosis"]},{n:40,title:"Ageing, Bone Loss and Structural Adaptation",part:5,mins:10,summary:"With age, bone formation and repair can lag behind resorption, muscle mass tends to decline, and fracture risk rises — but the trajectory is modifiable and highly individual.",objectives:["Describe age-related changes in bone and muscle.","Explain how these interact with falls and fracture risk.","Identify realistic strategies for preserving function."],sections:[{h:"Bone across the lifespan",p:`Bone mass increases through childhood and adolescence, with peak mass usually reached in the late teens to early twenties. It remains relatively stable in midlife, then declines in both sexes. In women, the decline often accelerates around menopause; men lose bone more gradually but can still develop osteoporosis.

Age-related changes include thinner trabeculae, loss of trabecular connections, increased cortical porosity and reduced repair capacity. These changes reduce strength beyond what mineral density alone explains. Previous fractures, chronic disease, inflammation, medication and low body weight further influence risk.`,fig:"life-stages",cap:"Figure 40.1 — Peak bone mass in young adulthood and later decline; menopause may accelerate loss in women."},{h:"Muscle and function",p:`Skeletal muscle mass and strength tend to decline with age, a process called sarcopenia when it becomes clinically significant. Muscle loss is accelerated by inactivity, illness, inadequate protein and energy intake, and some medicines. Loss of muscle contributes to slower gait, difficulty rising from a chair and greater fall risk.

Resistance exercise can increase strength even in advanced age, and adequate protein supports muscle maintenance. However, kidney disease or other conditions may change dietary recommendations. Ageing also brings sensory, cognitive and cardiovascular changes that influence movement safety. A comprehensive approach is more effective than focusing only on bone or only on muscle.`,list:[{title:"Resistance",text:"Progressive strengthening preserves muscle and bone loading."},{title:"Balance",text:"Challenging balance reduces falls risk when appropriately progressed."},{title:"Nutrition",text:"Adequate energy, protein and micronutrients support tissue maintenance."},{title:"Environment",text:"Remove home hazards, improve lighting and review footwear."}]},{h:"Ageing is not a diagnosis",p:`Many older adults remain strong, active and independent; others experience frailty or multiple conditions. Chronological age alone should not determine who is offered strength training or fracture prevention. Nor should a diagnosis of osteoporosis be treated as inevitable decline.

A positive approach emphasises what a person can do safely and what support helps. Clinicians can assess bone health, falls risk and medication, while allied professionals can adapt activity. Families and communities can improve access and reduce isolation. This echoes the wider perspective in HERBULANCE Book 15 on healthy ageing.`}],terms:[["Sarcopenia","Clinically significant loss of muscle mass, strength or physical function, particularly with ageing and illness."],["Frailty","A state of increased vulnerability to stressors due to reduced physiological reserve across multiple systems."],["Fragility fracture","A fracture resulting from a low-energy mechanism, such as a fall from standing height."]],myth:["Older adults are too old to build strength or benefit from resistance training.","Older adults can improve strength, balance and function with appropriate training. Programmes should be individualised and supervised when needed, but age alone is not a reason to avoid strengthening."],takeaways:["Bone and muscle loss are common but not uniform in ageing.","Strength, balance, nutrition and environmental changes preserve independence.","Age alone should not exclude anyone from appropriate preventive care."],quiz:[{q:"When is peak bone mass usually reached?",o:["By age 5","In late teens to early twenties","After menopause","In old age"],a:1,e:"Peak bone mass is generally attained in the late teens to early twenties, though timing varies. Building it earlier creates a reserve for later life."},{q:"Which change is typical of ageing muscle?",o:["Guaranteed complete loss of all fibres","Decline in mass and strength that is modifiable through exercise and nutrition","Conversion into ligament","Enhanced balance without training"],a:1,e:"Muscle declines in mass and strength with age and illness, but remains responsive to resistance training and adequate nourishment."}],refs:["who-pa","who-falls"]}],Dg=[{n:41,title:"Nutrition as a Foundation for Bone Health",part:6,mins:10,summary:"Bone and muscle need enough energy, protein and a range of micronutrients, delivered through a sustainable dietary pattern rather than a single 'superfood'.",objectives:["Identify the nutrients most central to bone and muscle health.","Explain why overall dietary pattern and energy intake matter.","Adapt nutritional principles across budgets and cultures."],sections:[{h:"Nutrients are a team",p:`Bone mineralisation requires calcium and phosphate, with vitamin D supporting absorption. The organic matrix needs protein and vitamin C for collagen synthesis, along with magnesium, zinc and other minerals as enzyme cofactors. Vitamin K supports bone proteins. Muscle maintenance needs adequate energy and protein.

No nutrient works alone. A diet with enough calcium but too little energy can still be harmful, especially during growth or recovery. Severe energy restriction can suppress sex hormones and bone formation. Readers should be cautious of plans that promote rapid weight loss while promising bone health.`,fig:"nutrition-plate",cap:"Figure 41.1 — A varied plate pattern: protein, calcium-rich foods, colourful vegetables and fruit, whole grains and healthy fats."},{h:"Patterns rather than perfection",p:`A dietary pattern high in vegetables, fruit, legumes, whole grains and appropriate protein is generally favourable for health. Dairy products, fortified plant alternatives, small fish with bones, calcium-set tofu, sesame, leafy greens and calcium-fortified foods can all contribute calcium. Protein sources include beans, lentils, fish, eggs, dairy, soy and other meat or alternatives.

Cultural food patterns can meet these needs. Indian dal with ragi, African bean stews with greens, Mediterranean yoghurt and legumes, East Asian tofu and leafy vegetables, and Latin American beans with maize are examples. No cuisine is inherently superior; variation, adequacy and accessibility are what matter.`,list:[{title:"Energy",text:"Match intake to needs; chronic restriction can impair bone and hormone function."},{title:"Protein",text:"Support muscle and bone matrix; distribute across meals where possible."},{title:"Calcium & vitamin D",text:"Support mineralisation; intake and status vary by diet and sunlight."},{title:"Fruit & vegetables",text:"Provide vitamin C, vitamin K, magnesium, potassium and diverse plant compounds."}]},{h:"Food first, but not food only",p:`Food-based approaches are preferred for most people because they supply a range of nutrients and support culture and enjoyment. Fortified foods can fill specific gaps. Supplements may be appropriate for diagnosed deficiencies, pregnancy, certain medical conditions or restricted diets, but they are not automatically necessary and can interact with medicines.

Ask what problem a supplement is meant to solve, what evidence supports it and whether your clinician or pharmacist has reviewed it. Avoid products with unregulated high doses or vague proprietary blends. Food and nutrition are explored more deeply in HERBULANCE Book 10.`,safety:"If you have kidney disease, malabsorption, an eating disorder, are pregnant, or take prescribed medicines, seek individual nutrition advice rather than following general guidance."}],terms:[["Energy availability","The energy remaining for normal physiological function after accounting for exercise expenditure."],["Fortified food","A food with added nutrients, such as plant drinks with added calcium and vitamin D."],["Dietary pattern","The overall combination and frequency of foods and drinks consumed over time."]],myth:["There is one perfect food for bone health.","Bone and muscle depend on many nutrients and on total energy. A varied, adequate diet is more useful than relying on a single food, and no food guarantees bone strength."],takeaways:["Bone health depends on energy, protein, minerals and vitamins working together.","Many cultural food patterns can supply the necessary nutrients.","Supplements can be useful in specific circumstances but are not risk-free."],quiz:[{q:"Which is NOT a directly relevant nutrient for bone matrix and mineralisation?",o:["Protein","Calcium","Vitamin D","Artificial food colouring"],a:3,e:"Protein supports the organic matrix; calcium and phosphate mineralise it; vitamin D supports absorption. Colouring agents are not established bone nutrients."},{q:"Why can severe energy restriction harm bone?",o:["It reduces nutrients and hormones needed for bone formation","It always increases bone mass","It increases synovial fluid","It prevents all cartilage loss"],a:0,e:"Chronic low energy availability can disrupt sex hormones, reduce bone formation and raise fracture risk, and may contribute to muscle loss."}],refs:["who-nutrition","nih-calcium"]},{n:42,title:"Calcium-Rich Foods Across Different Diets",part:6,mins:10,summary:"Calcium can be obtained from many plant, dairy and fish sources, with bioavailability, fortification and cultural acceptability shaping practical choices.",objectives:["Identify calcium-rich foods across dietary patterns.","Explain bioavailability and absorption factors.","Plan calcium intake without assuming dairy is essential."],sections:[{h:"How much is needed?",p:`Calcium requirements vary by age, sex, pregnancy, lactation and national guidance. UK reference intakes for adults are around 700 mg per day; US recommendations for many adults are 1,000 mg, rising to 1,200 mg for women over 50 and men over 70. Adolescent requirements are higher due to growth, and pregnancy and lactation have specific considerations. These are population reference values, not individual prescriptions.

More calcium is not automatically better. Absorption becomes less efficient at higher intakes, and very high supplemental doses can cause side effects. Spread calcium-rich foods across meals to support absorption and include vitamin D status in the picture.`,table:{head:["Food (approximate)","Serving","Calcium clue"],rows:[["Plain yoghurt","150 g","Usually 200–300 mg, varying by product and straining"],["Milk","250 ml","About 300 mg"],["Calcium-set tofu","100 g","Highly variable; check the label for calcium salts"],["Fortified plant drink","250 ml","Often 250–300 mg if fortified; check the label"],["Canned sardines with bones","100 g","A substantial source where culturally acceptable"],["Kale or bok choy","100 g","Useful and relatively bioavailable; amounts vary"],["Sesame/tahini","1 tablespoon","Contributes calcium; small servings, energy dense"],["Ragi (finger millet) flour","100 g","Notable calcium content; preparation matters"]]}},{h:"Bioavailability",p:`The amount of calcium a food contains is not the same as the amount absorbed. Oxalates in spinach and some other greens bind calcium and reduce absorption. Phytates in whole grains and legumes can reduce absorption, but they also have nutritional benefits and processing such as soaking, sprouting or fermentation can modify them. Lactose can aid absorption in some contexts, but people who avoid dairy can still meet needs.

Vitamin D is a major determinant of calcium absorption. Individual variation also matters: older adults and people with malabsorption may absorb less. Gut acid is needed for some calcium salts, so people using acid-suppressing medicines may be advised about timing or form.`,fig:"calcium-foods",cap:"Figure 42.1 — Calcium across cultures (illustrative): dairy, fortified drinks, tofu, beans, greens, sesame and small fish.",list:[{title:"Dairy pattern",text:"Milk, yoghurt and cheese; watch for lactose intolerance and added salt."},{title:"Plant-based",text:"Calcium-set tofu, fortified drinks, tahini, greens and almonds; check labels."},{title:"Traditional grains",text:"Ragi, teff and other grains contribute; pair with protein and produce."},{title:"Fish-containing",text:"Small fish with soft bones eaten whole can be a high-calcium food."}]},{h:"Practical planning",p:`A simple approach is to include two or three calcium-rich choices each day, for example a fortified drink with breakfast, yoghurt or tofu at lunch and a bean or green vegetable dish at dinner. For people with low intake, adding one modest source at a consistent meal is often more sustainable than a complete diet overhaul.

Foods can be affordable in different ways: regional grains, local vegetables and legumes may cost less than processed alternatives. Community nutrition workers and dietitians can help adapt plans. Calcium supplements may be appropriate in some circumstances but should be discussed, especially concerning dose, timing, interactions and kidney disease.`,safety:"Do not take large calcium doses without advice. Excess can cause constipation, kidney stones and, rarely, serious problems; interactions with some antibiotics and other medicines are possible."}],terms:[["Bioavailability","The proportion of a consumed nutrient that is absorbed and available to the body."],["Calcium-set tofu","Tofu made with calcium salts, which raises its calcium content substantially compared with other tofu."],["Fortification","Adding a nutrient to a food or drink to improve its nutritional value."]],myth:["Dairy is the only way to meet calcium needs.","Fortified plant drinks, calcium-set tofu, legumes, some green vegetables and small fish with bones are useful alternatives. With planning, dairy-free patterns can meet calcium needs."],takeaways:["Calcium requirements vary by age and guideline; more is not always better.","Bioavailability differs between foods; check labels and include vitamin D.","Dairy-free diets can support bone health with careful choices."],quiz:[{q:"Which food is often a useful calcium source for a dairy-free diet?",o:["Calcium-set tofu","White rice","Olive oil","Apple juice without fortification"],a:0,e:"Tofu prepared with calcium salts can be a substantial source. Fortified drinks, legumes, greens and some nuts and seeds also contribute."},{q:"Why is spinach not the best sole calcium source despite its calcium content?",o:["It contains oxalates that reduce calcium absorption","It has no calcium at all","It blocks vitamin D production permanently","It is always unsafe"],a:0,e:"Spinach is nutritious but its oxalates bind calcium and reduce bioavailability. Kale and bok choy are examples of greens with more available calcium."}],refs:["nih-calcium","nhs-vitd"]},{n:43,title:"Vitamin D: Food Sources, Sunlight and Supplement Considerations",part:6,mins:10,summary:"Food supplies modest vitamin D; sunlight synthesis varies enormously; supplements should follow national advice and clinical need rather than megadose trends.",objectives:["Compare dietary sources of vitamin D.","Explain factors that make deficiency more likely.","Apply safe supplement principles in different contexts."],sections:[{h:"Food and sunlight",p:`Oily fish such as salmon, mackerel and sardines contain vitamin D, as do egg yolks and some fortified products such as milk, plant drinks and cereals. Wild mushrooms exposed to UV may contain vitamin D2. The amounts vary widely, and dietary intake alone often falls short of reference intakes in winter.

Skin synthesis requires UVB radiation. At high latitudes, in winter, or when most skin is covered, little or none is produced. Sunscreen, shade and clothing reduce synthesis but are important for skin protection. National guidance balances these considerations differently according to location, skin type and culture.`,table:{head:["Group","Elevated risk considerations"],rows:[["Older adults","Skin synthesis and mobility/sun exposure may be reduced"],["People who cover skin","Less UVB exposure; cultural and religious practice varies"],["Darker skin in low-UV settings","More UVB exposure needed for synthesis; risk is context-dependent"],["Malabsorption","Coeliac disease, bariatric surgery, cystic fibrosis and others affect absorption"],["Babies and children","Specific guidance applies; breastfed infants may need supplements"],["Kidney or liver disease","Activation is impaired; specialist management needed"]]}},{h:"Testing and deficiency",p:`Deficiency is confirmed by measuring serum 25(OH)D and interpreting it in context. Severe deficiency can cause bone pain, muscle weakness, falls and osteomalacia, and in children rickets. A clinician may prescribe a high-dose treatment course followed by maintenance. Daily or weekly regimens may be preferred to large intermittent doses, depending on guidance.

Testing everyone is not usually recommended, but it may be appropriate for symptomatic people, those at high risk, or those who will receive treatment. Results should not be self-interpreted; thresholds and assays differ. Avoid taking multiple products that each contain vitamin D without adding up the dose.`,fig:"calcium-vitamin-d",cap:"Figure 43.1 — Sunlight and diet contribute to vitamin D status; kidney activation supports calcium absorption."},{h:"Supplement principles",p:`Public health recommendations differ. UK adults are commonly advised to consider 10 micrograms (400 IU) daily in autumn and winter, while people with little sun exposure may take it year-round. US guidance includes 15 micrograms (600 IU) for adults 19–70 and 20 micrograms (800 IU) for those over 70. EFSA has set dietary reference values and an upper intake level for adults. Always follow the guidance relevant to your country and personal risk.

Very high doses can cause hypercalcaemia and kidney problems. People with kidney disease, sarcoidosis, some lymphomas or those taking certain medicines require specialist advice. Vitamin D is important, but it is not a universal treatment for fatigue, pain or infection.`,safety:"Do not take vitamin D megadoses. Check combination products for overlapping vitamin D and discuss supplementation with a clinician or pharmacist if you are pregnant or have a chronic illness."}],terms:[["UVB radiation","Ultraviolet B light from the sun, required for vitamin D synthesis in skin."],["Reference nutrient intake","The intake judged to meet the needs of most healthy people in a population group."],["Hypercalcaemia","Elevated blood calcium, which can be caused by excessive vitamin D and other conditions."]],myth:["You cannot get too much vitamin D from supplements because it is a vitamin.","Excessive vitamin D supplementation can cause high blood calcium, kidney stones and kidney injury. Vitamins have dose limits, and combination products can make accidental excess more likely."],takeaways:["Food and sunlight are the main vitamin D sources; amounts depend on context.","Deficiency should be diagnosed and treated with clinical guidance.","Follow national advice and avoid high-dose supplementation without reason."],quiz:[{q:"Which is a significant dietary source of vitamin D?",o:["Oily fish","White rice","Spinach","Orange juice only"],a:0,e:"Oily fish, egg yolks and fortified products provide vitamin D. Many plant foods are not substantial sources unless fortified."},{q:"What is a risk of very high vitamin D intake?",o:["Hypercalcaemia and kidney problems","Improved kidney function in all people","Permanent cartilage growth","Guaranteed fracture prevention"],a:0,e:"Excess vitamin D can raise blood calcium and cause serious complications. It does not guarantee fracture prevention and can be harmful."}],refs:["nih-vitd","nhs-vitd"]},{n:44,title:"Protein and Muscle-Bone Support",part:6,mins:9,summary:"Protein supplies amino acids for muscle and bone matrix; adequate intake combined with resistance exercise supports function, especially in ageing and recovery.",objectives:["Explain protein's role in bone and muscle.","Estimate age-appropriate intake ranges in general terms.","Choose varied protein sources across dietary patterns."],sections:[{h:"More than a muscle nutrient",p:`About half of bone volume is organic matrix, of which type I collagen is a major component. Protein provides amino acids for collagen and for the cells that build and maintain bone. In older adults, low protein intake has been associated with bone loss and muscle weakness, while adequate intake may support maintenance when combined with exercise.

The current US recommended dietary allowance of 0.8 g per kg body weight per day is designed to prevent deficiency in healthy adults. Some expert groups suggest 1.0–1.2 g/kg for older adults, and higher intakes may be appropriate for some during illness or rehabilitation, but evidence and guidelines vary. More is not always better, and people with kidney disease need individual advice.`,fig:"nutrition-plate",cap:"Figure 44.1 — Protein distribution: including a palm-sized portion or plant equivalent at meals supports muscle maintenance."},{h:"Quality, distribution and dietary pattern",p:`Protein quality depends on essential amino acid content and digestibility. Animal foods such as eggs, dairy, fish and meat are complete; plant sources such as beans, lentils, tofu, soy and grains can complement each other across the day. A mixed plant-based diet with sufficient total protein can meet amino acid needs without food combining at every meal.

Distribution may matter for muscle protein synthesis. Some research suggests 20–30 g of high-quality protein per meal in older adults, but individual needs vary and exact thresholds are not settled. Including protein at breakfast, rather than only in the evening, is a practical change.`,list:[{title:"Affordable",text:"Eggs, lentils, beans, soy, sardines and locally available dairy or fortified alternatives."},{title:"Plant-friendly",text:"Combine legumes, wholegrains and soy across the day for essential amino acids."},{title:"Practical",text:"Use milk or fortified soy drinks in porridge, add beans to stews, and choose protein at breakfast."},{title:"Cautious",text:"Avoid high-dose protein powders that replace meals or unregulated supplements."}]},{h:"Protein and bone: a partnership",p:`Protein alone does not build bone; mechanical loading is the stimulus. A programme combining resistance exercise with adequate protein is more logical than either alone. During recovery from injury or illness, enough energy and protein support tissue repair, but the amount should be adjusted to clinical status.

Very high protein diets are not automatically harmful to healthy kidneys, but existing kidney disease changes recommendations. Readers with reduced kidney function should not increase protein or take bodybuilding supplements without medical input. HERBULANCE Book 22 explores kidney health in detail.`,safety:"If you have kidney disease, liver disease or are recovering from acute illness, discuss protein intake with a qualified clinician or dietitian."}],terms:[["Essential amino acid","An amino acid that cannot be made by the body and must be provided by food."],["Protein quality","An assessment of a protein's amino acid pattern and digestibility."],["Muscle protein synthesis","The process by which muscle builds new protein in response to feeding and exercise."]],myth:["A very high-protein diet guarantees stronger bones and muscles.","Adequate, not extreme, protein supports muscle and bone, particularly when paired with loading. Excess protein does not guarantee benefit, and high-dose supplements can displace other foods."],takeaways:["Protein supports both muscle and the bone matrix.","Requirements vary with age, health and activity; kidney disease needs individual advice.","Distribute varied protein foods across the day and combine with resistance exercise."],quiz:[{q:"Which combination best supports muscle maintenance?",o:["Protein alone without activity","Adequate protein with progressive resistance exercise","Only calcium supplements","Fasting with a multivitamin"],a:1,e:"Muscle responds best to loading plus sufficient protein and energy. One without the other is less effective."},{q:"Which is a practical plant protein choice?",o:["Lentils and beans","Olive oil","Sugar","Lettuce alone"],a:0,e:"Legumes are protein-rich and affordable. Soy foods and grains also contribute; variety across the day supports amino acid needs."}],refs:["who-nutrition","nih-calcium"]},{n:45,title:"Magnesium, Phosphorus and Vitamin K",part:6,mins:9,summary:"These nutrients support bone matrix, mineralisation and enzyme systems; most people can meet needs with varied foods, while supplements require care.",objectives:["Describe food sources of magnesium, phosphorus and vitamin K.","Explain their roles in bone and muscle.","Recognise circumstances in which supplementation is clinically indicated."],sections:[{h:"Magnesium",p:`Magnesium is a cofactor for ATP-related reactions and is involved in parathyroid hormone release and vitamin D activation. It can also influence glucose metabolism and neuromuscular function. Whole grains, nuts, seeds, legumes, cocoa and leafy green vegetables are major sources. Refining grains removes much of the magnesium.

Low intake is common in some populations, and deficiency can occur with malabsorption, chronic alcohol use or certain medicines. Severe deficiency can cause muscle cramps, weakness or arrhythmia. Routine supplementation is not needed for most healthy people, and high doses can cause diarrhoea and interfere with other care.`,list:[{title:"Magnesium foods",text:"Nuts, seeds, legumes, whole grains, cocoa and green leafy vegetables."},{title:"Phosphorus foods",text:"Widely present in protein foods, dairy, grains and processed foods."},{title:"Vitamin K foods",text:"Leafy greens, herbs, broccoli, soy and fermented foods."}]},{h:"Phosphorus and vitamin K",p:`Phosphorus is a major mineral in hydroxyapatite and in ATP and DNA. Healthy kidneys maintain balance, and deficiency is uncommon with adequate intake. Kidney disease can cause phosphate retention; in that situation, diet and medicines are tailored by specialists. Claims that all phosphate in soft drinks cause low bone density are oversimplified, though very frequent cola intake and low milk intake have been associated with poorer bone measures in some studies.

Vitamin K is essential for the carboxylation of osteocalcin, a bone matrix protein. Green leafy vegetables such as kale, spinach, broccoli and parsley are rich sources; natto and some fermented foods also provide K2. A warfarin prescription means vitamin K intake should be consistent, and supplements should not be started without medical advice. Direct fracture-prevention evidence for vitamin K supplements is limited.`,fig:"calcium-foods",cap:"Figure 45.1 — Minerals in food: a varied pattern supplies magnesium and phosphorus; leafy greens add vitamin K."},{h:"Choosing food over guesswork",p:`The practical strategy is to make these nutrients available without targeting exact numbers: include nuts, seeds, legumes, whole grains and greens regularly, and use dairy or fortified alternatives if they fit your diet. This supports overall nutrient density, not just bone.

If you are considering supplements, review the dose, form and reason. Magnesium oxide is poorly absorbed and can have a laxative effect; other forms differ. Combination bone supplements often contain several nutrients at unnecessary doses. Ask a pharmacist or clinician whether a product is appropriate and whether it interacts with your medicines.`}],terms:[["Cofactor","A molecule, often mineral-derived, required for an enzyme reaction."],["Osteocalcin","A bone protein associated with mineralisation whose activation depends on vitamin K."],["Warfarin","An anticoagulant whose effect can be influenced by dietary vitamin K."]],myth:["Magnesium supplements cure everyone's muscle cramps.","Cramps have many causes, including fatigue, nerve effects, medicines and dehydration. Magnesium may help specific deficiency states, but routine supplementation is not a universal cure."],takeaways:["Whole grains, nuts, seeds, legumes and greens provide these nutrients.","Kidney disease and anticoagulant treatment require individual advice.","Targeted supplementation should follow diagnosis, not marketing claims."],quiz:[{q:"Which food group is a strong source of magnesium?",o:["Nuts, seeds and whole grains","Refined sugar","Butter","White fish only"],a:0,e:"Whole plant foods, including nuts, seeds, legumes and whole grains, are rich in magnesium."},{q:"Why should a person taking warfarin be cautious with vitamin K supplements?",o:["Vitamin K interacts with the anticoagulant effect","Vitamin K causes immediate fractures","Vitamin K has no effect on the body","Warfarin contains vitamin K"],a:0,e:"Warfarin acts by interfering with vitamin K recycling. Consistent intake is important, and changes or supplements should be discussed with the prescribing clinician."}],refs:["nih-magnesium","nih-vitk"]},{n:46,title:"Vitamin C, Collagen Formation and Connective Tissues",part:6,mins:9,summary:"Vitamin C supports collagen synthesis and antioxidant defence; deficiency impairs connective tissue, while far higher intakes do not create stronger bone or cartilage.",objectives:["Explain vitamin C's role in collagen formation.","Identify diverse food sources of vitamin C.","Evaluate claims about collagen supplements and vitamin C."],sections:[{h:"An essential helper",p:`Vitamin C (ascorbic acid) is required for the hydroxylation of proline and lysine in collagen, enabling stable cross-linking of collagen fibres. It also supports antioxidant defences and assists iron absorption. Collagen is a major component of bone, skin, tendons, ligaments, cartilage and blood vessels.

Severe deficiency causes scurvy, with bleeding gums, easy bruising, poor wound healing and bone pain. This is rare today but can occur with very restricted diets, excessive alcohol use or severe food insecurity. Mild deficiency can contribute to fatigue and impaired tissue maintenance.`,fig:"tendon-ligament",cap:"Figure 46.1 — Collagen provides the fibrous framework of tendon, ligament and bone matrix; vitamin C is needed for its modification."},{h:"Food sources and needs",p:`Vitamin C is found in citrus fruits, guava, papaya, kiwi, peppers, tomatoes, berries, broccoli and many local vegetables. Amla, baobab, sea buckthorn and numerous other regional foods also contribute. Cooking and long storage can reduce content, so fresh or lightly cooked sources are useful.

Reference intakes are commonly around 40 mg/day in the UK and 75–90 mg/day in the US for adults, with higher allowances for smokers. Higher intakes than requirement do not increase collagen production beyond normal capacity. The tolerable upper level is commonly put at 2,000 mg/day because excess can cause gastrointestinal upset and increases oxalate availability in some people.`,list:[{title:"Citrus",text:"Oranges, lemons and grapefruits; culturally familiar and widely available."},{title:"Regional",text:"Amla, guava, baobab, kakadu plum, acerola and sea buckthorn are especially rich."},{title:"Vegetables",text:"Bell peppers, broccoli, tomatoes and leafy greens contribute."},{title:"Kitchen",text:"Avoid prolonged boiling and long storage if vitamin C content matters."}]},{h:"Collagen supplements",p:`A frequent claim is that collagen supplements directly strengthen joints, bones or skin. Collagen is a protein that is digested into amino acids and small peptides; it does not travel intact to a specific joint or bone. Some trials have reported small improvements in skin elasticity or joint discomfort, but results are inconsistent and often industry-funded. There is no established evidence that a collagen supplement regrows articular cartilage or treats osteoporosis.

A varied diet with enough protein and vitamin C supplies the raw materials for collagen synthesis. Anyone with a connective tissue disorder, joint pain or delayed healing should seek appropriate assessment rather than relying on supplements. If trying a collagen product, check its safety, interactions and cost, and do not stop prescribed treatment.`,safety:"Collagen or vitamin C supplements do not replace prescribed treatment for arthritis, osteoporosis or connective tissue disorders. High-dose vitamin C may worsen iron overload and increase kidney stone risk in susceptible people."}],terms:[["Collagen","A family of fibrous proteins forming the structural framework of many connective tissues."],["Scurvy","Vitamin C deficiency disease characterised by bleeding, impaired wound healing and connective tissue problems."],["Hydroxylation","A chemical modification involving addition of a hydroxyl group, required for stable collagen."]],myth:["Eating collagen means it goes directly to your joints and rebuilding cartilage.","Digestion breaks collagen into amino acids and peptides, and the body distributes them according to its own priorities. No evidence shows that collagen supplements rebuild human joint cartilage."],takeaways:["Vitamin C is required for collagen modification and connective tissue health.","A varied diet supplies what the body needs for collagen synthesis.","Collagen supplements have small, inconsistent evidence and are not a treatment for joint or bone disease."],quiz:[{q:"What is vitamin C's main role in connective tissue?",o:["It enables collagen modification and cross-linking","It directly acts as a bone mineral","It replaces calcium in hydroxyapatite","It is converted to vitamin D"],a:0,e:"Vitamin C supports enzymes that modify collagen, enabling stable connective tissue. It is not a mineral component of bone."},{q:"Which claim about collagen supplements is NOT supported?",o:["They contain protein that is digested into amino acids","They may be associated with modest symptom changes in some studies","They reliably regrow articular cartilage and reverse osteoporosis","They can be marketed under different regulations in different countries"],a:2,e:"There is no established evidence that collagen supplements regrow human articular cartilage or reverse osteoporosis. Some small studies report symptom changes, but findings are inconsistent."}],refs:["nih-vitc","niams-oa"]},{n:47,title:"Omega-3 Fatty Acids and Inflammatory Research",part:6,mins:9,summary:"Omega-3 fats are essential dietary fats with biological effects on inflammation; fish and plant sources are valuable, but supplements are not a proven arthritis cure.",objectives:["Distinguish ALA, EPA and DHA.","Identify plant and marine omega-3 sources.","Assess the evidence for omega-3 supplements in joint disease."],sections:[{h:"The omega-3 family",p:`Alpha-linolenic acid (ALA) is an essential omega-3 fat found in flaxseed, chia, hemp and walnuts. The body can convert small amounts of ALA to eicosapentaenoic acid (EPA) and docosahexaenoic acid (DHA), but conversion is limited. EPA and DHA are found in oily fish and algae, and are important for cell membranes, vision, the nervous system and inflammation regulation.

Oily fish such as sardines, mackerel, herring and salmon are rich sources. For people who do not eat fish, algae-based supplements provide EPA and DHA without fish; this is relevant for vegetarian, vegan and some cultural diets. ALA-rich plant foods also provide other nutrients and should not be dismissed.`,list:[{title:"Plant ALA",text:"Flaxseed, chia, hemp, walnuts and their oils."},{title:"Marine EPA/DHA",text:"Sardines, mackerel, herring and salmon; small fish are often more affordable and lower in mercury."},{title:"Algae",text:"A direct EPA/DHA source suitable for fish-free diets."},{title:"Routine food",text:"Choose sources that fit culture, budget and sustainability; avoid replacing whole meals with supplements."}]},{h:"Joints and inflammation",p:`Omega-3 fats can influence the production of inflammatory mediators, providing a plausible biological reason for interest in osteoarthritis and rheumatoid arthritis. Some systematic reviews suggest modest reductions in joint pain or morning stiffness with fish oil in rheumatoid arthritis, often alongside conventional treatment. Evidence in osteoarthritis is more mixed, with small and inconsistent effects.

Results depend on dose, formulation, duration, baseline diet and disease. Omega-3 supplements are not a substitute for disease-modifying therapy in inflammatory arthritis. They can interact with anticoagulants and may increase bleeding risk at high doses, so advice is needed before use.`,fig:"cartilage",cap:"Figure 47.1 — Joint inflammation involves many mediators; diet may modulate some pathways but does not replace clinical treatment."},{h:"A balanced approach",p:`Dietary patterns rich in plant foods, legumes and oily fish where accessible are generally healthful and may support joint health indirectly through cardiovascular and metabolic benefits. Frying, heavy sauces and ultra-processed foods can add energy without adding omega-3s. Grilling or baking small fish, adding ground flaxseed to porridge, or using walnut-based dishes are practical options.

Before taking high-dose fish oil, consider the reason, the expected benefit, interactions and cost. Purity and label accuracy vary by market. Pregnant readers should follow local guidance on fish types and methylmercury. HERBULANCE Book 18 provides context on dietary fats and cardiovascular health.`,safety:"High-dose omega-3 supplements can interact with anticoagulant or antiplatelet medicines. Discuss them with a clinician or pharmacist before use, especially before surgery."}],terms:[["Essential fatty acid","A fat that the body cannot synthesise and must obtain from food."],["EPA and DHA","Long-chain omega-3 fatty acids found in oily fish and algae, with roles in membranes and inflammation."],["Alpha-linolenic acid","A plant-derived essential omega-3 fat found in flax, chia, hemp and walnuts."]],myth:["Fish oil can replace arthritis medication and repair cartilage.","Some people may experience modest symptom benefits, but supplements are adjuncts at most. They do not replace treatment for inflammatory arthritis or surgery for structural damage, and evidence remains limited."],takeaways:["ALA, EPA and DHA are distinct omega-3 fats with different sources.","Fish oil may modestly help some joint symptoms but is not a cure or replacement for treatment.","Check interactions and choose food sources that fit culture and budget."],quiz:[{q:"Which is a plant source of ALA?",o:["Flaxseed","Sardine","Beef liver","Egg white"],a:0,e:"Flaxseed, chia, hemp and walnuts provide ALA. Oily fish provide EPA and DHA."},{q:"What is the best interpretation of fish oil for arthritis?",o:["It reverses cartilage loss in all people","It may modestly help pain or stiffness for some but does not replace appropriate treatment","It is required for everyone with joint pain","It cures rheumatoid arthritis without medicine"],a:1,e:"Evidence is modest and variable. Fish oil is at most an adjunct; decisions should account for interactions and individual clinical care."}],refs:["niams-oa","acr-oa"]},{n:48,title:"Building Balanced Meals for Musculoskeletal Health",part:6,mins:10,summary:"A balanced plate combines protein, calcium-rich choices, varied produce, whole grains and healthy fats, using affordable and culturally familiar foods.",objectives:["Construct balanced meals from locally available foods.","Plan placement of calcium, protein and produce across a day.","Adapt meals for budget, culture, allergies and clinical restrictions."],sections:[{h:"A flexible plate model",p:`A balanced meal can be pictured with roughly half the plate as vegetables and fruit, a quarter as whole-grain or starchy foods, and a quarter as protein. Add a calcium-rich food or drink and a source of healthy fat. The proportions are a guide, not a prescription; soups, stews and mixed dishes do not always divide neatly.

Consistency matters more than a perfect single meal. Aim to include protein and calcium across different meals and a variety of colours, textures and plant foods over the week. For people with small appetites, nutrient-dense choices and smaller frequent meals may work better than large plates.`,fig:"nutrition-plate",cap:"Figure 48.1 — A flexible plate: vegetables and fruit, protein, whole grains, and a calcium-rich addition."},{h:"Examples across cultures",p:`India: dal with ragi roti, a bowl of yoghurt or fortified drink, and a green vegetable curry. West Africa: bean stew with leafy greens, millet or rice, and small fish or eggs. Mediterranean: lentils, yoghurt, tomatoes, olive oil and grilled sardines. East Asia: calcium-set tofu, bok choy, rice or noodles, and soy milk fortified with calcium. Latin America: black beans, corn tortilla, cheese or fortified alternative, and fruit. Europe: rye bread, herring, greens and kefir where eaten.

These examples are not rules. Taste, faith, allergies, digestion, budget and availability shape what is realistic. Someone living without refrigeration may rely more on dried foods, canned goods or market produce. The principles travel better than a single menu.`,table:{head:["Meal","Protein","Calcium-rich add-on","Produce/grain"],rows:[["Breakfast","Egg or tofu","Fortified drink or yoghurt","Porridge or wholegrain bread, fruit"],["Lunch","Lentils or fish","Sesame/tahini or cheese","Vegetable salad, rice or flatbread"],["Snack","Nuts or roasted chickpeas","Fortified drink","Seasonal fruit or vegetable sticks"],["Dinner","Beans, soy or meat","Small fish with bones or calcium-set tofu","Leafy greens, whole grains"]]}},{h:"Practical planning",p:`Start with what is available. If calcium is low, add one fortified drink or calcium-set tofu to a usual meal. If protein is low at breakfast, add an egg or a spoon of yogurt to porridge. If variety is low, add a frozen, canned or dried vegetable. Small changes are easier to sustain than a complete plan from an unfamiliar cuisine.

Special situations need professional input: kidney disease, liver disease, food allergies, eating disorders, bariatric surgery, pregnancy and feeding tube use. Supplements are not the same as food and should not replace meals unless prescribed. Practical worksheets later in this book help readers translate these ideas without tracking medical outcomes.`}],terms:[["Dietary diversity","Eating a variety of food groups and types across days and weeks."],["Micronutrient density","The amount of vitamins and minerals relative to the energy a food provides."],["Portion","A practical amount of food served at one time, distinct from a standardised nutrient measure."]],myth:["A bone-healthy diet must be expensive or imported.","Local grains, legumes, greens, small fish and fortified staples can be affordable and nourishing. Cultural dishes can be adapted rather than replaced."],takeaways:["Build meals from affordable, familiar ingredients with protein, produce and a calcium source.","Consistency and variety matter more than one perfect plate.","Adapt to clinical needs and avoid unnecessary exclusion."],quiz:[{q:"Which pattern best supports both muscle and bone?",o:["Black coffee and toast only","Protein, calcium-rich food, vegetables and whole grains across meals","Calcium supplements alone","A high-sugar snack before bed only"],a:1,e:"A varied pattern supports muscle protein needs, bone minerals and overall health. Consistency across meals is practical."},{q:"For a vegan reader wanting more calcium, which choice works?",o:["Butter","Calcium-set tofu and a fortified plant drink","More white rice only","Avoiding all green vegetables"],a:1,e:"Calcium-set tofu and fortified plant drinks can be useful. Beans, some greens and sesame also contribute."}],refs:["who-nutrition","nih-calcium"]},{n:49,title:"Understanding Osteoporosis",part:7,mins:11,summary:"Osteoporosis is a skeletal disease of reduced bone strength and increased fracture risk, usually silent until a fragility fracture occurs; diagnosis and treatment are clinical.",objectives:["Define osteoporosis and fragility fracture.","Identify common risk factors and diagnostic steps.","Outline categories of prevention and treatment without prescribing."],sections:[{h:"A silent reduction in strength",p:`Osteoporosis is characterised by low bone mass and deterioration of bone architecture, leading to increased fragility. It is often asymptomatic until a fracture occurs after minimal trauma — for example a fall from standing height, a wrist fracture, a vertebral compression or a hip fracture. Vertebral fractures may cause height loss or back pain but can also be silent.

Diagnosis is based on a fragility fracture, a DXA T-score of −2.5 or lower in appropriate populations, or sometimes a very high fracture-risk assessment. A clinician may investigate secondary causes such as hormonal disorders, malabsorption, medication effects or kidney disease. A symptom checklist cannot diagnose osteoporosis.`,fig:"bone-density",cap:"Figure 49.1 — Healthy trabecular network compared with a porous, weakened structure; the image is illustrative, not a scan."},{h:"Risk factors",p:`Risk increases with age, menopause, low body weight, previous fracture, family history, smoking, alcohol excess, low physical activity, inadequate nutrition and prolonged glucocorticoid use. Rheumatoid arthritis, malabsorption, anorexia nervosa, hyperthyroidism, hyperparathyroidism, chronic kidney disease and some cancer treatments also increase risk. Falls are a major trigger for fracture.

Risk is not the same in every country or population, and guidelines differ. A person can have osteoporosis with no visible signs, or low bone density without an imminent fracture. Assessment integrates history, examination, DXA and risk tools such as FRAX.`,list:[{title:"Bone",text:"Density, architecture, previous fracture and medical conditions."},{title:"Falls",text:"Strength, balance, vision, medications, home hazards and footwear."},{title:"Lifestyle",text:"Nutrition, activity, smoking and alcohol."},{title:"Medication",text:"Steroids and other drugs can affect bone; do not stop without advice."}]},{h:"Prevention and treatment categories",p:`Management combines adequate calcium and vitamin D, tailored exercise, fall prevention and treatment of contributing conditions. Prescription medicines include antiresorptives such as bisphosphonates and denosumab, and anabolic agents such as teriparatide or romosozumab for selected high-risk patients. Menopausal hormone therapy may be appropriate for some women for symptom and bone benefits after individual risk assessment. Each option has benefits, risks and monitoring requirements.

Fracture liaison services identify people with fragility fractures and help them access assessment and treatment. If you have had a fragility fracture or are at high risk, ask about a fracture-risk assessment. Do not start, stop or change osteoporosis medicines based on this book or a home tool.`,safety:"A fragility fracture, sudden severe back pain or new height loss deserves prompt clinical assessment. Do not self-diagnose or self-medicate bone disease."}],terms:[["Osteoporosis","A disease of reduced bone strength that increases the risk of fragility fracture."],["Fragility fracture","A fracture from a low-energy event that would not normally break healthy bone."],["Bisphosphonate","A class of medicines that reduce osteoclast activity and are used in osteoporosis."]],myth:["Osteoporosis only affects frail older women.","Men, younger people with hormonal or inflammatory conditions, and people taking certain medicines can also be affected. Risk should be assessed rather than assumed from age or sex."],takeaways:["Osteoporosis is a silent disease often identified through fracture or DXA.","Risk combines bone strength, clinical factors and falls.","Prescribed treatment and lifestyle work together; medicine decisions belong with clinicians."],quiz:[{q:"Which event is a fragility fracture?",o:["A wrist fracture from a 5-metre fall","A vertebral fracture after lifting a light bag","A finger crush in a door","A bicycle crash at high speed"],a:1,e:"A fragility fracture occurs with low-energy trauma that would not normally fracture healthy bone. High-energy injuries are different and may have other causes."},{q:"Which statement about osteoporosis treatment is safest?",o:["Stop medication if you feel well","Prescribed medication and lifestyle measures may be combined, with decisions made with a clinician","Calcium supplements always replace prescribed medication","A DXA score is all that is needed to choose treatment"],a:1,e:"Care is individualised and monitoring is important. Never stop a prescribed medicine based on feeling well or on general advice."}],refs:["niams-osteoporosis","ros"]},{n:50,title:"Osteopenia and Fracture Risk",part:7,mins:9,summary:"Osteopenia describes lower-than-normal bone density that is not osteoporosis; it is a risk marker requiring context, not an automatic diagnosis or prescription.",objectives:["Define osteopenia in relation to diagnostic thresholds.","Explain why osteopenia is managed by risk rather than the score alone.","Identify appropriate follow-up questions."],sections:[{h:"A category, not a disease in itself",p:`Osteopenia is commonly defined by a bone mineral density T-score between −1.0 and −2.5. The term is sometimes called low bone mass. It is not a fracture diagnosis, and many people with osteopenia will not fracture. Conversely, some fractures occur in people whose bone density is above the osteopenia threshold, especially if they fall or have other risk factors.

Terminology varies between countries and professional societies. Some now use 'low bone density' to avoid implying that everyone with the label is ill. The result should be interpreted alongside age, sex, prior fracture, medication, disease and falls risk.`,fig:"bone-density",cap:"Figure 50.1 — Bone density categories: normal, low bone mass/osteopenia and osteoporosis, with risk determined by more than the score."},{h:"To treat or to monitor?",p:`Not everyone with osteopenia needs medication. A clinician estimates fracture risk using tools such as FRAX and considers factors such as a previous fracture, glucocorticoid use, smoking, alcohol, body weight and family history. They may recommend lifestyle measures, repeat scanning after an interval, or treatment if risk is high.

Repeat scans are useful only when the expected change or clinical question justifies them. Variations in testing and position can partly affect results. Ask what a repeat test would change and how the result should be interpreted.`,list:[{title:"Ask",text:"What is my actual T-score and Z-score, and at which sites?"},{title:"Discuss",text:"What is my estimated fracture risk, including falls risk?"},{title:"Understand",text:"What would trigger treatment rather than monitoring?"},{title:"Plan",text:"Which nutrition, activity and safety steps fit my health and circumstances?"}]},{h:"Lifestyle without panic",p:`Osteopenia can be a useful prompt to support bone and body health without fear. Adequate calcium and vitamin D, a varied diet, resistance and weight-bearing activity appropriate to ability, not smoking and avoiding alcohol excess are sensible. Fall prevention becomes increasingly relevant with age.

Do not assume that a low scan means you should avoid all movement; appropriate loading is usually beneficial. Equally, do not assume a workout can restore bone to a perfect score. The goal is a safe, functional life with managed risk, supported by regular clinical review where indicated.`}],terms:[["Osteopenia","Lower than normal bone mineral density that falls short of the osteoporosis threshold."],["Fracture risk","The estimated probability of sustaining a fracture, based on density and clinical factors."],["Bone mineral density","The amount of mineral per area of bone measured by DXA."]],myth:["Osteopenia is a disease that always needs immediate medication.","Osteopenia is a risk category. Management depends on overall fracture risk, comorbidities and preferences. Some people benefit from monitoring and lifestyle changes rather than drug treatment."],takeaways:["Osteopenia is low bone density, not automatically a fracture diagnosis.","Treatment decisions are based on overall risk, not the T-score alone.","Ask what follow-up would change and what lifestyle steps are safe for you."],quiz:[{q:"Which T-score range is usually described as osteopenia in older adults?",o:["Above +1","Between −1.0 and −2.5","Below −3.5","Exactly zero"],a:1,e:"Low bone mass/osteopenia is commonly defined between −1.0 and −2.5, with osteoporosis at −2.5 or below in appropriate populations."},{q:"What should guide management of osteopenia?",o:["The T-score alone","Overall fracture risk, history, falls risk and preferences","A social media protocol","Stopping all physical activity"],a:1,e:"Risk integrates density with clinical factors and falls. Movement is generally beneficial when appropriately adapted."}],refs:["niams-osteoporosis","iof"]},{n:51,title:"Osteoarthritis and Joint Degeneration",part:7,mins:11,summary:"Osteoarthritis is a whole-joint condition involving cartilage, bone, synovium and muscles; it is not simple wear-and-tear, and movement is a cornerstone of management.",objectives:["Describe the tissues involved in osteoarthritis.","Distinguish symptoms from imaging findings.","Outline evidence-based management categories and self-management."],sections:[{h:"The whole joint",p:`Osteoarthritis (OA) is a clinical syndrome that can involve cartilage loss, subchondral bone changes, osteophyte formation, mild synovial inflammation and muscle weakness. It most often affects knees, hips, hands and the spine, but can occur in other joints. Symptoms include activity-related pain, stiffness after inactivity, swelling and reduced function.

It is not simply normal ageing or uniform 'wear and tear'. Joint injury, genetics, obesity, altered mechanics and inflammation contribute. Imaging changes such as osteophytes and joint-space narrowing are common in people without pain, and severe imaging findings do not always match symptom severity.`,fig:"osteoarthritis",cap:"Figure 51.1 — Osteoarthritis involves cartilage, subchondral bone, osteophytes and synovium; it is a whole-joint process."},{h:"Diagnosis and management",p:`Diagnosis is usually clinical, based on history and examination, especially in people over 45 with activity-related joint pain and stiffness. Imaging is not required in every case and should not be used to determine how much pain a person feels. Blood tests may help exclude other conditions.

Core treatment includes education, exercise, weight management where relevant, and pain relief appropriate to the individual. Exercise can improve strength, function and pain, even in painful joints; the best mode is one the person can tolerate and repeat. Physical therapy, walking aids, braces and hot or cold packs may help some people. Steroid injections can provide short-term relief but are not a cure. Joint replacement may be considered for severe symptoms after shared decision-making.`,list:[{title:"Exercise",text:"Tailored strengthening, aerobic and range-of-motion work."},{title:"Weight",text:"Where relevant, reducing excess load on knees and hips."},{title:"Support",text:"Education, self-management, physical therapy and aids."},{title:"Medication",text:"Analgesia chosen with a clinician, considering interactions and risks."}]},{h:"Living with osteoarthritis",p:`A diagnosis does not mean inevitable decline. Symptoms fluctuate and can improve with activity, sleep, stress reduction and support. Planning valued activities, pacing and using walking aids can help. Many people continue work and activity with adjustments.

Be cautious of products promising to regrow cartilage, 'reset' joints or replace medicine. Some may be safe adjuncts, but evidence is often weak. Seek urgent care for a hot swollen joint with fever, a locked joint after injury, sudden severe inability to bear weight or calf swelling with pain and warmth.`,safety:"A suddenly hot, swollen joint with fever may be infection. A locked knee after injury, or new inability to bear weight, should be assessed promptly."}],terms:[["Osteophyte","A bony outgrowth at a joint margin, often seen in osteoarthritis."],["Subchondral sclerosis","Increased bone density beneath cartilage, a common radiographic feature of osteoarthritis."],["Synovitis","Inflammation of the synovial membrane, which can occur in osteoarthritis and other joint diseases."]],myth:["Osteoarthritis is caused by cartilage wearing out, and exercise makes it worse.","OA is a whole-joint condition. Appropriate exercise is a core recommended treatment and can reduce pain and improve function. Sudden high loads or injury may aggravate it, but general activity should not be avoided."],takeaways:["Osteoarthritis involves multiple joint tissues and is not uniform wear-and-tear.","Diagnosis is often clinical; imaging findings need context.","Exercise, weight management and individualised support are core treatments."],quiz:[{q:"Which is a core recommended treatment for knee osteoarthritis?",o:["Complete bed rest","Tailored exercise and education","High-dose calcium alone","Collagen supplements instead of assessment"],a:1,e:"Exercise and education are core treatments. They can reduce pain and improve function; complete rest can worsen stiffness and strength."},{q:"Which symptoms may indicate infection rather than typical osteoarthritis?",o:["Mild stiffness after gardening","A hot, swollen joint with fever","Clicking during squats without pain","Aching after a long walk"],a:1,e:"Fever with a hot swollen joint is a medical emergency until proven otherwise. Typical osteoarthr
