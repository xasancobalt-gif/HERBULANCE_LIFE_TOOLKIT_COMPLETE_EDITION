itis is not usually accompanied by systemic fever."}],refs:["niams-oa","acr-oa"]},{n:52,title:"Rheumatoid Arthritis and Autoimmune Joint Inflammation",part:7,mins:11,summary:"Rheumatoid arthritis is a systemic autoimmune disease that can damage joints and other organs; early specialist treatment improves outcomes and is not replaced by diet or supplements.",objectives:["Distinguish rheumatoid arthritis from osteoarthritis.","Describe common symptoms and why early assessment matters.","Explain treatment goals and safety considerations."],sections:[{h:"An autoimmune condition",p:`Rheumatoid arthritis (RA) is a chronic inflammatory disease in which the immune system targets the synovium. It often begins with pain and swelling in small joints of the hands and feet, usually on both sides, with prolonged morning stiffness, fatigue and sometimes low-grade fever. It can also affect the lungs, eyes, blood vessels, heart and bones.

RA is not caused by cold weather, a specific food or 'bad posture'. Genetic susceptibility, smoking, hormonal and environmental triggers interact in ways that are not fully understood. No dietary pattern prevents RA, though diet can influence overall health and symptoms indirectly.`,fig:"rheumatoid",cap:"Figure 52.1 — Rheumatoid arthritis: inflamed synovium can erode cartilage and bone; symmetry and small-joint involvement are common."},{h:"Diagnosis and early treatment",p:`Diagnosis by a rheumatologist uses symptom patterns, examination, blood tests such as rheumatoid factor and anti-CCP antibodies, inflammatory markers and imaging. Not everyone has positive antibodies, so diagnosis can be complex. Early assessment matters because joint damage can develop within months.

Disease-modifying antirheumatic drugs (DMARDs) aim to suppress inflammation and prevent damage. Methotrexate is commonly used, with folic acid to reduce side effects; biologics and other targeted medicines are used for active disease. Regular monitoring detects blood, liver and infection risks. Treatment should be adjusted by specialists, not stopped abruptly.`,list:[{title:"Symptoms",text:"Symmetrical small-joint swelling, morning stiffness, fatigue and flares."},{title:"Systemic",text:"Can affect lungs, eyes, blood vessels, heart and bone."},{title:"Treatment",text:"DMARDs aim to control disease and prevent damage."},{title:"Monitoring",text:"Blood tests, infection awareness and medication review."}]},{h:"Living well with RA",p:`Exercise is beneficial for joint function, muscle strength and fatigue, but the programme should be adapted during flares and guided by a physiotherapist when needed. Protecting joints at work, managing sleep and stress, and seeking support for daily tasks can help. Bone health assessment may be needed because inflammation and steroid treatment can weaken bone.

Claims that a supplement, elimination diet or herbal formula can replace DMARDs are not supported and can be dangerous. Complementary approaches should be discussed with the treating team. Seek urgent care for a hot swollen joint with fever, new breathing difficulty, chest pain or a serious infection concern while on immunosuppressive medicine.`,safety:"People with RA on immunosuppressive medicines need prompt advice for fever or suspected infection. Do not stop DMARDs without speaking to the treating clinician, and check interactions before starting supplements."}],terms:[["DMARD","Disease-modifying antirheumatic drug, used to suppress inflammatory arthritis and prevent joint damage."],["Anti-CCP antibody","An antibody often found in rheumatoid arthritis and associated with more specific disease."],["Synovitis","Inflammation of the synovial lining of a joint."]],myth:["Arthritis is one disease, so osteoarthritis and rheumatoid arthritis can be treated the same way.","RA is an autoimmune systemic disease requiring targeted medical treatment; OA is primarily a degenerative and functional joint condition. Distinguishing them matters for diagnosis and management."],takeaways:["RA is an autoimmune disease with systemic effects.","Early rheumatology treatment reduces damage and complications.","Supplements and diets do not replace DMARDs; infection warnings matter."],quiz:[{q:"Which feature is more typical of rheumatoid arthritis than osteoarthritis?",o:["Symmetrical small-joint swelling with prolonged morning stiffness","Pain only after a specific injury","No fatigue ever","Bone spurs only"],a:0,e:"RA commonly affects small joints symmetrically with prolonged stiffness and fatigue. OA may involve specific joints and activity-related pain."},{q:"What is a key purpose of DMARD treatment?",o:["To grow new cartilage instantly","To control systemic inflammation and prevent joint damage","To replace calcium supplements","To cure all cases permanently"],a:1,e:"DMARDs aim to control inflammation and prevent damage and complications. Treatment is individualised and monitored."}],refs:["niams-ra","acr-oa"]},{n:53,title:"Gout and Crystal-Related Arthritis",part:7,mins:10,summary:"Gout is an inflammatory arthritis caused by monosodium urate crystals in or around joints; urate management is often more important than avoiding individual foods.",objectives:["Explain how gout develops.","Describe typical symptoms and diagnostic steps.","Discuss management principles and correct common diet myths."],sections:[{h:"Crystals and inflammation",p:`Uric acid is produced from purine breakdown and excreted mainly by the kidneys. When urate levels are persistently high, monosodium urate crystals can form in joints, bursae or soft tissues. The immune system responds to crystals, causing sudden severe pain, swelling, redness and tenderness — a flare that often peaks within hours.

The first metatarsophalangeal joint of the big toe is classically affected, but the ankle, knee, wrist and other joints can be involved. Repeated flares can damage joints and form tophi. Gout is associated with kidney disease, obesity, metabolic syndrome, alcohol and certain medicines.`,fig:"rheumatoid",cap:"Figure 53.1 — Crystal deposition triggers intense inflammation; a clinician can identify urate crystals in joint fluid."},{h:"Diagnosis and treatment",p:`Gout can be diagnosed by examining joint fluid for needle-shaped negatively birefringent urate crystals, which distinguishes it from infection and other crystal diseases. Ultrasound and dual-energy CT can support diagnosis in some settings. Blood urate may be normal during a flare, so a single test cannot reliably exclude gout.

A flare is treated with medicines such as non-steroidal anti-inflammatory drugs, colchicine or corticosteroids, chosen according to health and interactions. Long-term urate-lowering therapy, usually allopurinol with titrated dose, can reduce flares and prevent damage. Treatment is started and monitored by a clinician; some people need anti-inflammatory cover when starting.`,list:[{title:"Flare",text:"Sudden severe joint pain, swelling, redness; seek assessment, especially if fever or systemically unwell."},{title:"Diagnosis",text:"Joint aspiration for crystals is definitive; clinical features support diagnosis."},{title:"Urate lowering",text:"Used for recurrent flares or complications; requires monitoring and adherence."},{title:"Kidney",text:"Kidney function and stones may affect treatment choices."}]},{h:"Food, alcohol and evidence",p:`Diet and lifestyle influence urate, but gout is not simply caused by eating the wrong foods. Weight reduction can reduce urate, and excess alcohol — especially beer — and sugary drinks are associated with higher risk. Some foods such as shellfish and organ meats are high in purines, but strict avoidance of many foods can harm nutrition. Reducing sugary drinks and excessive alcohol is generally more useful than banning tomatoes or particular vegetables.

Cherry products and vitamin C have been proposed as remedies; evidence is limited and they should not replace treatment. Adequate hydration supports kidney health. Sudden major dietary changes can also shift urate levels, so people on urate-lowering therapy should discuss plans. Seek urgent care for a hot swollen joint with fever, which may be infection.`,safety:"A hot, swollen joint with fever can be septic arthritis, not gout. Seek urgent medical assessment. Do not stop prescribed urate-lowering therapy during a flare unless advised."}],terms:[["Urate","A salt of uric acid that can crystallise in tissues when levels are persistently high."],["Tophus","A deposit of urate crystals under the skin or in tissues, often near joints."],["Urate-lowering therapy","Medicine such as allopurinol used to lower blood urate and prevent gout flares."]],myth:["Gout is caused simply by eating rich food, and avoiding cherries or tomatoes is the key to prevention.","Genetics, kidney function, alcohol, sugary drinks, medicines and body composition all matter. Effective urate-lowering treatment is often the most important long-term strategy."],takeaways:["Gout is caused by urate crystals and intense inflammation.","Joint fluid examination can confirm diagnosis; urate levels alone are not decisive.","Long-term urate management and monitoring matter more than restrictive diets."],quiz:[{q:"What crystals cause gout?",o:["Calcium oxalate crystals","Monosodium urate crystals","Cholesterol crystals","Collagen fibres"],a:1,e:"Monosodium urate crystals deposit in and around joints and trigger inflammation. Calcium oxalate crystals occur in kidney stones."},{q:"Which joint is classically affected first in gout?",o:["The first toe metatarsophalangeal joint","The shoulder","The jaw","The spine only"],a:0,e:"The big toe MTP joint is most classic, though gout can affect ankles, knees, wrists and other joints."}],refs:["niams-gout","aaos"]},{n:54,title:"Osteomalacia and Rickets",part:7,mins:10,summary:"Osteomalacia and rickets result from defective bone mineralisation rather than low bone mass alone; causes include vitamin D deficiency and phosphate disorders.",objectives:["Distinguish osteomalacia and rickets from osteoporosis.","Describe symptoms and diagnostic findings.","Recognise the importance of supervised treatment."],sections:[{h:"Soft bone, not simply thin bone",p:`Osteomalacia is a disorder of defective mineralisation in adults. Bone matrix forms but is inadequately mineralised, leaving bone soft and weak. Rickets affects growing bone, especially the growth plates, causing deformity and growth problems in children. Both differ from osteoporosis, where mineralised bone mass is low but the remaining bone is mineralised.

Vitamin D deficiency is a common cause of both, but not the only cause. Phosphate deficiency, renal tubular disorders, hypophosphatasia, malabsorption, bariatric surgery, chronic kidney disease and certain medicines can also cause defective mineralisation.`,table:{head:["Feature","Osteoporosis","Osteomalacia"],rows:[["Core problem","Low bone mass and weakened architecture","Defective mineralisation of bone matrix"],["Typical chemistry","Often normal calcium and phosphate","May show low vitamin D, calcium or phosphate; raised alkaline phosphatase"],["Symptoms","Often none until fracture","Bone pain, muscle weakness, waddling gait"],["Treatment example","Bone-active medication and risk management","Cause-specific correction, often vitamin D under monitoring"]]}},{h:"Symptoms and diagnosis",p:`Adults may experience aching bone pain, proximal muscle weakness, difficulty climbing stairs or rising from a chair, and a waddling gait. Children with rickets may have delayed walking, bowed legs, swollen wrists and growth failure. Symptoms are nonspecific, so assessment must include history, examination, blood tests and sometimes imaging.

Biochemistry may show low phosphate, low or normal calcium, elevated alkaline phosphatase and low 25(OH)D. X-rays may show characteristic changes, including widened growth plates in children. A clinician confirms the cause before treatment; taking broad supplements without diagnosis can mask a serious underlying disease.`,fig:"bone-density",cap:"Figure 54.1 — Mineralisation vs mass: osteomalacia involves poorly mineralised matrix; osteoporosis involves reduced bone tissue."},{h:"Treatment and prevention",p:`Treatment targets the cause. Vitamin D deficiency is corrected with supervised vitamin D, calcium if needed, and attention to sun exposure and diet. Phosphate disorders need specialist treatment, sometimes with phosphate and active vitamin D. Rickets prevention includes appropriate infant supplementation, adequate maternal vitamin D status and dietary adequacy, following national guidance.

Do not treat suspected osteomalacia with random combinations of supplements. Overcorrection of vitamin D or poorly monitored calcium can cause harm. Persistent bone pain, weakness or fracture after diagnostic tests should prompt review.`,safety:"Do not start high-dose vitamin D for bone pain without assessment. Some causes of osteomalacia are serious and require specific tests and specialist treatment."}],terms:[["Osteomalacia","Defective mineralisation of bone in adults, causing soft, weak bone."],["Rickets","Defective mineralisation of growing bone, especially at growth plates, in children."],["Alkaline phosphatase","An enzyme measured in blood that can rise when bone formation is increased, including in osteomalacia."]],myth:["Osteoporosis and osteomalacia are the same condition with different names.","They differ in mechanism. Osteoporosis is primarily low bone mass and impaired architecture; osteomalacia is defective mineralisation of matrix. Diagnosis and treatment differ."],takeaways:["Osteomalacia and rickets involve defective mineralisation, not just low bone density.","Causes include vitamin D deficiency and phosphate disorders, among others.","Diagnosis and treatment require clinical assessment and monitoring."],quiz:[{q:"Which finding is more associated with osteomalacia than typical osteoporosis?",o:["A raised alkaline phosphatase suggesting abnormal mineralisation","A completely normal physical examination","High bone density at all sites","No effect on muscles"],a:0,e:"Osteomalacia may show raised alkaline phosphatase, low vitamin D or phosphate, bone pain and muscle weakness. Osteoporotic blood tests are often normal."},{q:"What is rickets?",o:["A form of osteoarthritis in children","Defective mineralisation of growing bone","A ligament tear","A bone tumour"],a:1,e:"Rickets is defective mineralisation during growth, often due to vitamin D deficiency or phosphate disorders, affecting growth plates and bone shape."}],refs:["nhs-vitd","nih-vitd"]},{n:55,title:"Fractures and Bone Healing",part:7,mins:11,summary:"A fracture is a break caused by acute force, repetitive stress or weakened bone; healing is a staged biological repair influenced by alignment, blood supply and health.",objectives:["Distinguish acute, stress and fragility fractures.","Describe the stages of fracture healing.","Recognise factors that impair healing and warning signs."],sections:[{h:"Types of fracture",p:`Fractures can be closed or open (breaking the skin), displaced or undisplaced, transverse, spiral, comminuted or impacted. They can result from a single high-energy force, repetitive loading (stress fractures) or weakened bone (fragility fractures). A fracture may also occur through a bone containing a tumour or cyst, which is called pathological.

Imaging usually includes X-rays; sometimes CT or MRI is needed. A fracture that cannot be seen initially may still be present. Clinical assessment and follow-up are important, especially for injuries around growth plates, the hip, wrist and ankle.`,fig:"fracture-healing",cap:"Figure 55.1 — Fracture repair: haematoma and inflammation → soft callus → hard callus → remodelling."},{h:"The healing sequence",p:`Healing begins with bleeding, which forms a haematoma and attracts inflammatory cells. A soft callus of collagen and cartilage forms, then mineralises into a hard callus that bridges the break. Over months to years, remodelling reshapes the new bone in response to load. The process depends on the bone involved, fracture pattern, alignment, blood supply, age and general health.

Absolute stability may be used for some fractures with primary bone healing, while other fractures heal via callus with relative stability. Surgeons choose fixation methods based on the person and fracture type. Smoking, poor nutrition, diabetes, infection, certain medicines and extensive soft-tissue damage can delay healing.`,list:[{title:"Blood supply",text:"Essential for cells that build provisional and new bone."},{title:"Stability",text:"Appropriate alignment and fixation allow repair to proceed."},{title:"Nutrition",text:"Energy, protein, calcium and vitamin D support healing, but do not accelerate it unnaturally."},{title:"Recovery",text:"Rehabilitation restores motion, strength and function after union."}]},{h:"Care and warning signs",p:`Treatment may include casting, bracing, external fixation, plates and screws, or joint replacement. Pain control, swelling management and instructions on weight-bearing are important. Cast care, checking for pressure areas and understanding when to seek help prevent complications.

Seek urgent care if there is severe or increasing pain, a cold pale foot or hand, new numbness, a tight cast, wound discharge, fever, or shortness of breath after major injury. These can signal compartment syndrome, infection or venous thromboembolism. Do not try to straighten a suspected fracture or remove medical devices yourself.`,safety:"Severe swelling with pain out of proportion, reduced sensation or a cold limb can indicate compartment syndrome and is an emergency. Breathlessness after injury may signal a blood clot or other serious complication."}],terms:[["Callus","Bridging repair tissue that forms around a fracture and progressively mineralises."],["Open fracture","A fracture in which bone or the fracture site communicates with the outside environment."],["Compartment syndrome","A medical emergency in which pressure within a tissue compartment compromises blood flow and nerve function."]],myth:["A fracture is fully healed when the cast comes off or the pain stops.","Bone union and functional recovery continue after immobilisation ends. Strength, range, balance and confidence need graded rehabilitation, and some fractures require follow-up imaging."],takeaways:["Fracture types and treatment depend on mechanism, bone and tissue condition.","Healing proceeds through inflammation, callus and remodelling phases.","Pain out of proportion or neurovascular changes after injury are emergencies."],quiz:[{q:"Which structure forms first at a fracture site?",o:["A mineralised callus","A haematoma","A new joint capsule","A tendon"],a:1,e:"Haematoma forms quickly after injury and provides a scaffold and signals for repair, followed by soft callus and mineralisation."},{q:"Which factor can impair fracture healing?",o:["Adequate protein intake","Smoking","Good alignment","Appropriate load during remodelling"],a:1,e:"Smoking impairs blood supply and healing. Nutrition, alignment, stability and controlled loading generally support repair."}],refs:["aaos","nih-calcium"]},{n:56,title:"Scoliosis and Spinal Curvature",part:7,mins:10,summary:"Scoliosis is a three-dimensional spinal deformity; most adolescent cases are idiopathic, vary widely and should be assessed without fear or unfounded claims.",objectives:["Define scoliosis and describe common types.","Explain the role of examination, measurement and observation.","Distinguish evidence-based management from posture myths."],sections:[{h:"What scoliosis is",p:`Scoliosis is a lateral curvature of the spine combined with vertebral rotation, making it a three-dimensional deformity. It is commonly categorised as idiopathic, congenital or neuromuscular, and may occur in infancy, childhood or adolescence. Adolescent idiopathic scoliosis is the most common form; mild curves are often found during growth.

Structural scoliosis does not resolve simply by sitting straight or exercising differently. Many mild curves remain stable or progress slowly. Curves have a higher risk of progression during rapid growth, especially larger curves, so monitoring matters.`,fig:"spine",cap:"Figure 56.1 — Scoliosis involves lateral curvature and vertebral rotation, visible from the back and in forward bending."},{h:"Assessment",p:`Assessment includes history, neurological screening, a forward bending test to detect rotation and, where indicated, X-rays to measure the Cobb angle. The Risser sign or other growth markers may be used to estimate skeletal maturity. Clinicians look for warning signs such as severe pain, neurological changes, early onset or rapid progression, which require further investigation.

School screening policies differ across countries. Curves under about 10 degrees are typically not called scoliosis. Measurements have some variability, so repeated assessment by the same service can be helpful. Images should be interpreted by qualified professionals.`,list:[{title:"Mild curves",text:"Often observed with clinical review; activity remains encouraged."},{title:"Growing child",text:"Monitoring for progression is important."},{title:"Moderate curves",text:"Bracing may be considered in growing children, depending on the curve and guidance."},{title:"Severe curves",text:"Surgery may be considered after specialist assessment and shared decision-making."}]},{h:"Movement, bracing and support",p:`Exercise and physiotherapy can improve strength, comfort and confidence, and some specific scoliosis programmes aim to support curve management, but evidence that exercise alone prevents progression or corrects large curves is limited. Claims that a particular stretch will straighten the spine are generally unsupported. Bracing can reduce progression in some growing children with moderate curves, but it is uncomfortable and requires careful clinical selection and support.

Scoliosis can affect body image, clothing fit and psychological wellbeing. Support and respectful communication matter. Readers should avoid chiropractic or device claims that the spine can be permanently 'aligned' without evidence, and should discuss significant pain, neurological symptoms or rapid changes promptly.`,safety:"Seek prompt assessment for scoliosis with severe pain, new weakness or numbness, bowel or bladder changes, or rapid progression. These are not typical features of common adolescent idiopathic scoliosis."}],terms:[["Cobb angle","A measurement of spinal curvature on a radiograph, used in scoliosis assessment."],["Adolescent idiopathic scoliosis","Scoliosis without a known cause that appears around adolescence."],["Brace","A wearable support used in some growing children with scoliosis to reduce progression risk."]],myth:["You can straighten scoliosis by improving posture or doing a specific stretch.","Structural scoliosis involves vertebral rotation and cannot be corrected by posture alone. Exercise has value for strength and wellbeing, but curve management requires clinical assessment."],takeaways:["Scoliosis is a three-dimensional structural curve, not simply bad posture.","Most adolescent curves need monitoring rather than urgent intervention.","Bracing and surgery are specialist decisions; movement supports general wellbeing."],quiz:[{q:"What does the Cobb angle measure?",o:["Muscle strength","The degree of spinal curvature on imaging","Joint fluid pressure","Bone mineral density"],a:1,e:"The Cobb angle quantifies scoliosis curvature on a radiograph. It guides monitoring and treatment discussions."},{q:"Which statement is accurate about adolescent idiopathic scoliosis?",o:["Every curve requires surgery","Mild curves are often monitored and activity is encouraged","Posture correction always resolves the curve","It is caused by carrying a heavy bag on one side"],a:1,e:"Many mild curves remain stable and are monitored. Severe or progressive curves may need bracing or specialist surgery; posture alone does not resolve structural scoliosis."}],refs:["aaos","niams-bone"]}],qg=[{n:57,title:"Tendinopathy, Tendinitis and Bursitis",part:7,mins:10,summary:"Tendon and bursa problems often arise from load exceeding tissue tolerance; understanding the difference between acute inflammation and persistent tendon dysfunction guides safer choices.",objectives:["Distinguish tendinopathy, tendinitis and bursitis.","Describe why loading is central to tendon rehabilitation.","Recognise when a tendon or bursa problem needs urgent review."],sections:[{h:"Different labels, different processes",p:`Tendinitis implies acute inflammation of a tendon, but many persistent tendon complaints show degenerative changes with little classic inflammation — the preferred umbrella term is tendinopathy. Symptoms include local pain, stiffness and reduced tolerance to load, often beginning gradually and worsening with activity. A sudden, painful 'snap' with weakness may indicate a tendon tear.

Bursitis is irritation or inflammation of a fluid-filled sac. It can result from pressure, repetitive movement, crystal disease or infection. A tender bump over the elbow or kneecap may be a bursa. A hot, red bursa with fever needs urgent assessment for infection.`,fig:"tendon-ligament",cap:"Figure 57.1 — Tendon pain typically localises to the tendon or its insertion; load and recovery patterns shape symptoms."},{h:"Load is the treatment",p:`Persistent tendinopathy generally responds to progressive loading rather than complete rest. Strength exercises increase tendon capacity over weeks and months. The dose should be modified to symptoms: a manageable increase in pain during exercise that settles within a day or two is often acceptable, but sharp worsening or persistent swelling should prompt review.

A sudden increase in training volume, a new pair of shoes, a change in work task or a returning hobby can be the tipping point. Rather than searching for one 'cause', examine the recent load changes and the person's capacity. Complete avoidance may reduce pain temporarily but leave the tendon less tolerant.`,list:[{title:"Assess",text:"Location, onset, load history, function and red flags."},{title:"Modify",text:"Reduce the provoking load temporarily without stopping all activity."},{title:"Load",text:"Use progressive strengthening appropriate to the tendon and goals."},{title:"Review",text:"Adjust if pain or function is not improving over an expected timeframe."}]},{h:"Other care and cautions",p:`Ice or simple analgesia may help symptoms for some people, but neither speeds tissue repair reliably. Corticosteroid injections can reduce pain in some tendon and bursa conditions but may carry a risk of weakening tissue or flare; they are not universally indicated. Surgery is reserved for selected persistent cases after appropriate rehabilitation.

A hot, red, swollen swelling with fever should not be massaged or drained at home. A sudden weakness after a snap or a tendon that cannot support normal movement needs prompt assessment. Diabetes and some medicines affect healing and infection risk; discuss any procedure with the treating clinician.`,safety:"Do not self-drain a bursa or ignore a hot, red swelling with fever. A sudden loss of function after a snap may indicate a rupture and needs urgent assessment."}],terms:[["Tendinopathy","A clinical syndrome of tendon pain and impairment, often with degenerative rather than purely inflammatory changes."],["Bursitis","Inflammation or irritation of a bursa; can be infective or non-infective."],["Insertional pain","Pain at the point where a tendon attaches to bone."]],myth:["Tendinopathy is an inflammation that disappears with a short course of anti-inflammatories and rest.","Persistent tendinopathy often involves structural change and altered pain processing. Loading is usually necessary for recovery, and symptom relief does not automatically restore tendon capacity."],takeaways:["Tendinopathy, tendinitis and bursitis are different concepts despite overlapping symptoms.","Progressive loading is central for many tendon problems.","Sudden rupture or feverish swelling needs urgent care."],quiz:[{q:"What is often the key rehabilitation approach for persistent tendinopathy?",o:["Permanent immobilisation","Progressive loading within symptom tolerance","Long-term antibiotics","Stretching the tendon to its maximum daily"],a:1,e:"Gradual strengthening helps tendon capacity recover. The exact programme depends on the tendon and the person."},{q:"Which feature suggests a need for urgent assessment?",o:["Gradual Achilles discomfort after increasing running","A hot, red swollen bursa with fever","Morning stiffness that settles","Mild elbow tenderness after gardening"],a:1,e:"Fever with a hot, swollen bursa may indicate infection and requires urgent clinical care."}],refs:["aaos","nhs-sprains"]},{n:58,title:"Muscle Strains, Sprains and Soft-Tissue Injuries",part:7,mins:10,summary:"Strains injure muscle or tendon, sprains injure ligaments, and contusions bruise tissue; accurate language helps readers understand severity, first aid and rehabilitation.",objectives:["Differentiate a strain from a sprain and a contusion.","Describe initial management principles and their limits.","Recognise injury features that need prompt assessment."],sections:[{h:"Strain, sprain, contusion",p:`A strain is injury to muscle or its tendon, often at the musculotendinous junction, from force or stretch. A sprain is a ligament injury, commonly at the ankle, knee or wrist. A contusion is a bruise from direct impact. Severity ranges from microscopic fibre damage to complete tears, which can include instability or inability to bear weight.

The same mechanism can injure more than one tissue. An ankle inversion injury may damage the lateral ligaments, peroneal tendons and cartilage. A sudden knee twist may involve the meniscus, ligaments or bone. Assessment should consider the whole joint, not just the most obvious painful spot.`,fig:"sprain-strain",cap:"Figure 58.1 — Strain involves muscle/tendon; sprain involves ligament; contusion results from direct impact."},{h:"Initial care",p:`Initial care generally aims to limit additional swelling and pain, protect the tissue and restore function gradually. Protection, relative rest, compression, elevation and short periods of ice for comfort are common. Evidence for any single first-aid formula is limited, and prolonged rest and excessive icing may slow recovery. For minor soft-tissue injuries, early gentle movement within comfort is often helpful.

Avoid returning to sport or heavy work while pain, swelling and control are poor. Use of crutches, braces or taping should follow advice appropriate to the injury. NSAIDs and paracetamol may relieve pain but can affect wound healing and interact with other medicines; discuss choice with a pharmacist or clinician.`,list:[{title:"Protect",text:"Avoid aggravating load and consider support or crutches if needed."},{title:"Move",text:"Begin gentle pain-free movement earlier rather than waiting for complete symptom resolution."},{title:"Compress and elevate",text:"May reduce swelling; check devices are not too tight."},{title:"Progress",text:"Restore range, strength, balance and task-specific loading in stages."}]},{h:"When to get help",p:`Seek assessment if you cannot bear weight, the joint looks deformed, there is new numbness or weakness, pain is severe or worsening despite rest, swelling is rapid and large, or there is a wound. Calf swelling with pain and warmth after immobilisation can indicate a blood clot.

Persistent instability, a joint that locks, or symptoms that are not improving after a few days of sensible management warrant review. Imaging may or may not be needed. Returning to activity after a complete tear or surgery should follow a clinician-led plan, not a self-made schedule.`,safety:"Inability to bear weight after injury, a deformed joint, new numbness or a cold pale extremity requires prompt medical assessment. Do not delay for home remedies."}],terms:[["Strain","Injury to muscle or its tendon caused by excessive force or stretch."],["Sprain","Injury to a ligament caused by excessive force or stretch."],["Contusion","Bruising of tissue after direct impact, often internal bleeding and swelling."]],myth:["A sprain is always a minor injury that needs only rest.","A sprain indicates ligament damage, which can range from mild to severe. Repeated or severe sprains can cause instability and long-term problems. Assessment and rehabilitation are important for significant injuries."],takeaways:["Strain = muscle/tendon; sprain = ligament; contusion = direct-impact bruise.","Initial care combines protection with early gentle movement, not prolonged immobilisation.","Severe instability, inability to bear weight or neurovascular changes need prompt help."],quiz:[{q:"An injury to a ligament is called a:",o:["Strain","Sprain","Contusion","Tendinopathy"],a:1,e:"Sprains involve ligaments. Strains involve muscle or tendon; contusions result from direct impact."},{q:"Which suggestion is appropriate for a minor soft-tissue injury?",o:["Keep it completely still for several weeks","Protect it, compress if helpful, then begin gentle movement within tolerance","Return to full sport immediately","Ignore any numbness"],a:1,e:"Protection and relative rest can help initially, but early gentle movement and gradual loading generally support recovery. Severe symptoms need assessment."}],refs:["nhs-sprains","aaos"]},{n:59,title:"Back Pain and Common Spinal Conditions",part:7,mins:11,summary:"Most low back pain is non-specific and improves with reassurance and activity; serious causes are uncommon but require recognition of red flags.",objectives:["Describe common patterns of back and neck pain.","Recognise red flags requiring urgent assessment.","Apply evidence-based, non-diagnostic self-management principles."],sections:[{h:"Most back pain is not a disc emergency",p:`Non-specific low back pain is common and usually has no single identifiable tissue cause. It can be uncomfortable and disabling, yet most episodes improve within weeks. Pain can arise from muscles, joints, discs, nerves or sensitised systems, and psychological and social factors influence the experience. Imaging often shows age-related changes that are also common in people without pain.

A radicular pattern — pain travelling down a leg in a dermatomal distribution with tingling or weakness — may reflect nerve involvement. Spinal stenosis can cause leg symptoms with walking that improve with sitting or leaning forward. Persistent symptoms deserve assessment, but a serious cause is not the default explanation.`,fig:"spine",cap:"Figure 59.1 — Spinal regions and a simplified disc/nerve relationship; symptoms alone do not establish a diagnosis."},{h:"Red flags and urgent care",p:`Seek urgent medical care for back pain with new bladder or bowel dysfunction, saddle-area numbness, new or progressive leg weakness, unexplained weight loss, fever, significant trauma, a history of cancer, or pain that is severe and unremitting at rest. These features may indicate cauda equina syndrome, infection, fracture or cancer. Cauda equina syndrome is a surgical emergency and can cause permanent disability if treatment is delayed.

A hot swollen joint or widespread severe pain with feeling unwell needs urgent assessment. A person with osteoporosis and sudden severe back pain may have a vertebral fracture; this should be evaluated promptly but is not always an emergency.`,list:[{title:"Urgent",text:"New bladder/bowel problems, saddle numbness, progressive weakness, fever with spinal pain."},{title:"Prompt review",text:"Persistent night pain, unexplained weight loss, significant trauma or cancer history."},{title:"Routine",text:"Mechanical pain improving with activity, mild stiffness, no neurological symptoms."}]},{h:"What helps",p:`For uncomplicated back pain, staying active, avoiding prolonged bed rest and using position changes for comfort are usually recommended. Exercise and physiotherapy can improve function; sleep, stress and work factors matter. A short course of medication may be appropriate for some people, but opioids carry dependency risks and should be used cautiously. Massage, heat and manual therapy may provide short-term relief in some cases.

Imaging and surgery are not required for most cases. Ask what a test or treatment would change and what non-surgical options exist. Do not attempt to 'fix' a disc by extreme stretching or manipulation yourself. Readers with persistent, disabling or recurring pain should seek person-centred assessment.`,safety:"Cauda equina syndrome is an emergency. Back pain with new bladder or bowel dysfunction, saddle numbness or rapidly progressive leg weakness needs immediate medical attention."}],terms:[["Non-specific low back pain","Pain not attributable to a specific structural disease; the most common pattern."],["Radiculopathy","Symptoms produced by compression or irritation of a spinal nerve root."],["Cauda equina syndrome","Compression of the lumbosacral nerve roots, causing bowel/bladder and neurological symptoms; a surgical emergency."]],myth:["Back pain means a disc has slipped out of place permanently.","Labels like 'slipped disc' oversimplify. Disc changes are common in people without pain, and most episodes improve without surgery. Accurate assessment and activity-based care are more useful than fear-based wording."],takeaways:["Most low back pain improves with reassurance, activity and support.","Know the red flags and seek urgent care when they appear.","Imaging findings must be interpreted with the person's symptoms."],quiz:[{q:"Which is a red flag for urgent assessment in back pain?",o:["Mild stiffness after sitting","New bladder or bowel dysfunction with saddle numbness","Pain improving with walking","A muscle ache after gardening"],a:1,e:"These symptoms may indicate cauda equina syndrome, which requires emergency evaluation."},{q:"What generally helps uncomplicated low back pain?",o:["Strict bed rest for weeks","Remaining appropriately active and gradually returning to function","Immediate surgery for all cases","Avoiding all movement"],a:1,e:"Activity and function-focused care are generally recommended. Most cases do not require surgery or routine imaging."}],refs:["niams-back","aaos"]},{n:60,title:"Other Important Musculoskeletal Disorders",part:7,mins:10,summary:"Beyond common arthritis and osteoporosis, several genetic, inflammatory, metabolic and pain conditions affect the musculoskeletal system and require specialist care.",objectives:["Name additional musculoskeletal conditions and their main features.","Understand why specialist assessment matters.","Avoid confusing rare disease with common aches."],sections:[{h:"Genetic and inherited conditions",p:`Osteogenesis imperfecta is a group of disorders affecting collagen, causing fragility fractures, bone deformity and sometimes hearing loss or blue sclerae. Paget disease of bone is a localised disorder of excessive and disorganised remodelling, which can cause bone pain, deformity, fracture and secondary arthritis. Marfan syndrome and related conditions affect connective tissue and can include joint hypermobility, spinal changes and cardiovascular risks.

These conditions are not diagnosed by a questionnaire. They require clinical examination, imaging, genetic testing and specialist care. Knowing that fragility fractures can have causes beyond osteoporosis is important, especially in younger people or when fractures occur without major trauma.`,list:[{title:"Paget disease",text:"Abnormal remodelling in one or more bones; can cause pain, deformity and fracture."},{title:"Osteogenesis imperfecta",text:"Collagen disorder with variable bone fragility, beginning in childhood."},{title:"Marfan syndrome",text:"Connective tissue disorder with cardiovascular and musculoskeletal features."},{title:"Fibromyalgia",text:"Chronic widespread pain with fatigue and sleep or cognitive symptoms; clinical diagnosis."}],fig:"assessment",cap:"Figure 60.1 — Unusual or persistent bone and joint symptoms require a person-centred assessment, not a single test or a web checklist."},{h:"Inflammatory and pain conditions",p:`Polymyalgia rheumatica causes pain and stiffness in shoulders, hips and neck, typically in older adults, and can accompany giant cell arteritis, which risks vision loss and needs urgent treatment. Fibromyalgia is a central pain condition with widespread sensitivity, fatigue and unrefreshing sleep; it is real and can be disabling, but it is not an inflammatory arthritis.

Bone and joint infections, bone tumours and cancer metastatic to bone are less common but important. Persistent unexplained pain, night pain, fever, weight loss or a visible mass should be assessed. Treatments for these conditions are specialised and sometimes urgent.`},{h:"Respect for complexity",p:`People with long-term musculoskeletal conditions often navigate stigma and disbelief. Labels such as 'wear and tear' can imply inevitability and make care seem pointless. In reality, many conditions can be supported with movement, symptom management and, where indicated, disease-specific treatment.

Self-management complements but does not replace specialist care. Be cautious of claims that a single diet, supplement or manipulation cures all musculoskeletal disease. Ask what is known, uncertain and being investigated, and keep a list of symptoms, medicines and questions for appointments.`}],terms:[["Paget disease of bone","A disorder marked by excessive, disorganised bone remodelling in affected bones."],["Fibromyalgia","A chronic condition of widespread pain, fatigue and sensitivity not explained by joint inflammation."],["Polymyalgia rheumatica","An inflammatory condition causing proximal muscle pain and stiffness, typically in older adults."]],myth:["If blood tests and X-rays are normal, the pain is not real or is 'all in the mind'.","Many pain conditions, including fibromyalgia and early or mechanical problems, have normal routine tests. Normal results do not invalidate symptoms; they point towards different assessment and management."],takeaways:["Genetic, metabolic and inflammatory bone conditions can mimic common complaints but need specialist care.","The presence of chronic pain does not mean tissue damage is absent or that symptoms are unreal.","Persistent unexplained symptoms deserve assessment, not dismissal or self-diagnosis."],quiz:[{q:"Which condition is a central pain disorder rather than inflammatory joint disease?",o:["Rheumatoid arthritis","Fibromyalgia","Gout","Osteomyelitis"],a:1,e:"Fibromyalgia is characterised by widespread pain, fatigue and sensitivity. It is not primarily an inflammatory arthritis."},{q:"Which statement is true about normal test results?",o:["They prove a person has no pain","They may occur in several real pain conditions and require clinical interpretation","They guarantee no future disease","They mean treatment can be stopped"],a:1,e:"Normal tests do not negate symptoms. Diagnosis often integrates history and examination, and may change as the condition evolves."}],refs:["niams-bone","acr-oa"]},{n:61,title:"Principles of Safe Physical Activity",part:8,mins:10,summary:"Safe physical activity is progressive, individualised and sustainable, with attention to health, environment, recovery and warning symptoms.",objectives:["Apply the key principles of activity progression.","Identify safety considerations before starting or changing activity.","Adapt activity to real-world resources and constraints."],sections:[{h:"Start where you are",p:`Safe activity begins at the person's current capacity, not an idealised standard. Consider recent activity, health conditions, medications, pain, balance, confidence and access to space. A short walk, seated strength work or a few supported balance exercises can be meaningful. Gradual progression allows tissues to adapt.

The World Health Organization recommends regular aerobic activity and muscle-strengthening exercise for adults, with additional balance work for older adults. These are targets for populations, not a prescription for every individual. People with symptoms or medical conditions should adapt them with guidance.`,fig:"exercise-progression",cap:"Figure 61.1 — Progressive overload with recovery: increase gradually, consolidate, and avoid abrupt changes."},{h:"Warming up and cooling down",p:`A short warm-up of gentle movement and light activity increases blood flow, rehearses movement and gives you a chance to check how the body feels. A thorough static stretch before exercise is not required and may temporarily reduce power; dynamic preparation is more specific to many activities. A cool-down can help you return to resting state gradually, though its role in reducing soreness is modest.

The most useful safety rule is to match the warm-up to the activity. If you plan to lift a load, practise the movement with less load first. If you plan to walk quickly on a slope, start on flat ground.`,list:[{title:"Talk test",text:"Moderate activity allows talking in short sentences; vigorous activity makes speech harder."},{title:"Progression",text:"Increase only one variable at a time, such as duration, load or repetitions."},{title:"Recovery",text:"Alternate harder and easier days; sleep and nutrition matter."},{title:"Warning signs",text:"Chest pain, faintness, severe breathlessness, new weakness or numbness — stop and seek help."}]},{h:"Environment and equity",p:`Not everyone has a safe footpath, a gym or walking shoes. Exercise can be adapted: chair-based movement, home bands, water activity, culturally familiar dance, or walking indoors. Heat, cold, pollution, air quality and unsafe neighbourhoods may require timing changes. During illness or after injury, returning to activity should be cautious and sometimes supervised.

Use a pain-monitoring approach rather than a no-pain rule. Some discomfort may be acceptable, but sharp, escalating or persistent pain should prompt modification or review. In people with osteoporosis, balance problems or recent fractures, seek professional advice about loading and fall prevention.`,safety:"Stop and seek medical help for chest pain, fainting, severe breathlessness, sudden weakness or numbness, or severe pain during activity. Return gradually after acute illness."}],terms:[["Progressive overload","Gradually increasing demand so tissue can adapt without being overwhelmed."],["Warm-up","Brief preparatory activity that increases readiness for a task."],["Talk test","A practical way to gauge exercise intensity by the ability to speak."]],myth:["No pain, no gain applies to all exercise.","Excessive pain is not required for adaptation and can signal overload. A manageable level of effort and gradual progression are more sustainable, especially during rehabilitation."],takeaways:["Begin at current capacity and progress gradually.","Prepare specifically for the activity and respect warning symptoms.","Adapt movement to environment, culture and access."],quiz:[{q:"Which is the safest progression principle?",o:["Increase load, volume and complexity all at once","Increase one variable at a time and allow recovery","Train through sharp pain","Avoid warm-up for strength work"],a:1,e:"Gradual progression of one variable at a time allows tissue adaptation and reveals tolerance. Sharp pain should be assessed."},{q:"Which symptom should stop an activity?",o:["Feeling warm","Chest pain or faintness","Mild muscle effort","Breathing faster than at rest"],a:1,e:"Chest pain, fainting and severe breathlessness require stopping and medical assessment. Expecting to breathe harder is normal."}],refs:["who-pa","acsm"]},{n:62,title:"Strength Training and Bone Loading",part:8,mins:11,summary:"Resistance training builds muscle and loads bone at attachment sites; appropriate progression, technique and recovery are more important than complex equipment.",objectives:["Explain how resistance training loads bone and muscle.","Outline a basic, adaptable strength programme.","Apply safety considerations for osteoporosis and joint disease."],sections:[{h:"Why strength training matters",p:`Resistance training applies force through muscles and tendons to bone. It can increase muscle mass and strength, improve balance and function, and contribute to bone maintenance. Bone responds to progressive, repeated loading; muscle responds faster. Both contribute to mobility and fall prevention.

The largest benefits come from consistent training of major muscle groups with gradually increasing challenge. Exercise doesn't need to be complicated or expensive. Bodyweight, resistance bands, water bottles, bags, chairs and stairs can all provide load. Technique and control matter more than fancy equipment.`,fig:"loading",cap:"Figure 62.1 — Strength work loads muscle, tendon and bone; progression and recovery allow adaptation."},{h:"A basic programme",p:`A general programme might include two or three sessions per week, with exercises for sitting and standing, hip hinging, pushing, pulling, carrying and calf work. For each exercise, choose a resistance that allows controlled repetitions with good form. Two to three sets of around eight to twelve repetitions is a common starting structure, but ranges vary with goals and ability.

Start with one set and a light load if you are new. Progress by adding a repetition, then a set, then resistance. Leave at least a day between harder sessions for the same muscle groups, and reduce volume during illness or recovery. A qualified instructor or physiotherapist can help with complex needs or high fracture risk.`,table:{head:["Pattern","Home example","Functional link"],rows:[["Sit-to-stand","Chair squat with arm support","Getting up from a chair or toilet"],["Hip hinge","Light bag lift, spine long","Picking things up, dressing"],["Push","Wall push-up, then incline push-up","Pushing doors, getting off the floor"],["Pull","Band row or towel row","Carrying and pulling"],["Carry","Bottle or bag carry","Shopping, household tasks"],["Calf and balance","Heel raise near support; single-leg stand","Walking, stairs, falls prevention"]]}},{h:"Special considerations",p:`People with osteoporosis or a previous fragility fracture should discuss exercise with a qualified professional. Some movements, such as heavy loaded spinal flexion or twisting, high-risk balance tasks or certain high-impact activities, may be modified. There is no single forbidden list for everyone, but individual assessment is important. Joint disease may require reduced range, water-based activity or additional support.

Avoid holding your breath and straining during heavy lifts, especially if you have cardiovascular disease; coordinate breathing with effort. Stop for chest pain, dizziness, new numbness or sharp joint pain. Do not use unregulated performance-enhancing substances. Progress is measured by function and tolerance, not by how sore you feel.`,safety:"If you have osteoporosis, a previous fracture, balance problems, recent surgery or cardiovascular disease, seek individual advice before starting a heavy or high-impact programme."}],terms:[["Resistance training","Exercise that requires muscles to work against an external or bodyweight load."],["Progressive overload","Systematically increasing exercise demand to drive adaptation."],["Set and repetition","A group of consecutive repetitions is a set; one complete movement is a repetition."]],myth:["Strength training is unsafe for older adults or people with osteoporosis.","Resistance training can be safe and beneficial when tailored and supervised appropriately. Avoiding all load accelerates muscle and bone loss and increases function loss."],takeaways:["Progressive strength work benefits muscle, bone and function.","Basic home equipment and movement patterns can be enough.","High-risk individuals need individual advice and should stop for warning symptoms."],quiz:[{q:"What is progressive overload?",o:["Increasing demand gradually over time","Lifting your maximum every session","Avoiding all change","Only stretching"],a:0,e:"Progressive overload is a gradual increase in training demand. It allows tissue adaptation and reduces sudden overload risk."},{q:"Which exercise resembles a hip hinge?",o:["A wall push-up","A hip-dominant movement with a neutral spine lifting a bag","A heel raise","A bicep curl"],a:1,e:"A hip hinge involves hip flexion with a relatively neutral spine and loads glutes and hamstrings. It is relevant to bending and lifting."}],refs:["acsm","iof"]},{n:63,title:"Weight-Bearing and Resistance Exercise",part:8,mins:10,summary:"Weight-bearing activity loads bone through body weight; resistance exercise adds external load; both have a place, along with non-weight-bearing activity for fitness and recovery.",objectives:["Distinguish weight-bearing, resistance and non-weight-bearing exercise.","Choose activities suited to different goals and abilities.","Progress impact safely."],sections:[{h:"Three categories",p:`Weight-bearing exercise includes walking, stair climbing, dancing, hiking and jumping, where the body supports its weight against gravity. Swimming and cycling are largely non-weight-bearing; they provide cardiovascular and muscle benefits but less direct bone loading. Resistance exercise uses external loads or bodyweight against gravity to strengthen muscles and load bone.

Many activities combine categories. A gym circuit might include treadmill walking, stair climbing and resistance work. A home programme might use sit-to-stand, calf raises and walking. The best programme is one that is accessible, enjoyable and matched to health and goals.`,fig:"gait",cap:"Figure 63.1 — Walking is weight-bearing but must be progressed; the optimal load varies with individual capacity."},{h:"Impact and progression",p:`Higher-impact activities such as hopping or running produce larger and faster bone strains. They may be appropriate for people with good bone and joint health who progress gradually, but they are not for everyone. A person with osteoporosis, joint disease, a history of stress fracture or balance problems may be advised to avoid or adapt high-impact loading.

A safe approach is to master lower-impact weight-bearing activity, add resistance work, and only then consider small amounts of impact if appropriate. Monitor for pain, swelling, fatigue and function. A stress fracture may present as localised pain that worsens with activity and eases with rest; it needs clinical assessment rather than pushing through.`,list:[{title:"Beginner",text:"Walking, chair exercises, light bands, supported balance."},{title:"Intermediate",text:"Stairs, longer walks, moderate resistance, controlled step-ups."},{title:"Advanced (if suitable)",text:"Running, jump training or heavy resistance with expert progression."},{title:"Alternative",text:"Swimming, cycling, seated exercise and hydrotherapy for fitness and rehabilitation."}]},{h:"When non-weight-bearing helps",p:`Non-weight-bearing exercise is not inferior for general health. It can support cardiovascular fitness, muscle endurance and confidence when land-based activity is painful or unsafe. Aqua exercise can provide resistance with reduced joint impact. Cycling can be adapted with a stationary bike or supported bicycle.

For bone-specific loading, combine these with appropriate land-based or resistance work if possible. Ask a physiotherapist for help if pain limits activity, if you have osteoporosis, or if you are returning after a fracture or joint surgery. Exercise is valuable, but it must not replace prescribed treatment or a falls prevention plan.`,safety:"Localised bone pain that worsens with activity, especially in the foot or shin after increased load, should be assessed before continuing training. Do not run through suspected stress injury."}],terms:[["Weight-bearing exercise","Activity in which the body supports its weight against gravity."],["Non-weight-bearing exercise","Activity that does not load bones with body weight, such as swimming."],["Stress fracture","A bone injury caused by repeated loading that exceeds repair capacity."]],myth:["Only high-impact exercise builds bone, so walking is pointless.","Walking provides weight-bearing load, cardiovascular benefits and a foundation for progression, though bone may need varied and higher loads for maximal adaptation. A combination is practical."],takeaways:["Weight-bearing, resistance and non-weight-bearing activity each have a role.","Progress impact cautiously and only when appropriate.","Localised pain that worsens with load needs assessment."],quiz:[{q:"Which activity is primarily non-weight-bearing?",o:["Stair climbing","Swimming","Walking","Dancing"],a:1,e:"Swimming is non-weight-bearing because the water supports body weight. It still provides cardiovascular and muscle benefits."},{q:"How should impact exercise be introduced?",o:["At maximal intensity immediately","Gradually, if appropriate for bone and joint health","Only after a fracture","Without any recovery"],a:1,e:"Impact should be tailored and progressed. High-impact activity may be unsuitable for some people with osteoporosis, joint disease or balance problems."}],refs:["who-pa","iof"]},{n:64,title:"Balance, Coordination and Fall Prevention",part:8,mins:11,summary:"Falls usually result from multiple interacting factors; balance training, strength work, medication review and home adaptation can reduce risk when combined.",objectives:["Explain the multiple contributors to falls.","Design a progressive balance practice with safety measures.","Identify home and clinical fall-prevention actions."],sections:[{h:"Why falls happen",p:`Falls are not a normal inevitable part of ageing. They result from interactions between strength, balance, vision, sensation, cognition, medication, blood pressure, footwear and environment. Some medicines, especially sedatives and blood pressure drugs, can contribute; so can low blood sugar, dehydration and untreated vision problems. A fall may also be the first sign of a new medical issue.

Recurrent falls or a fall with injury should prompt a professional assessment. Clinicians may review gait, strength, cognition, vision, feet and medications, and recommend targeted interventions. The cause is usually multifactorial, so one solution rarely suffices.`,fig:"falls-home",cap:"Figure 64.1 — Common home hazards: loose rugs, poor lighting, clutter, wet floors and lack of handrails."},{h:"Progressive balance practice",p:`Start with a stable support within reach. A simple sequence is standing with feet apart, then feet together, then one foot forward (tandem), then single-leg stance. Add controlled reaching, head turns, stepping and changes of speed as confidence grows. Advance to uneven or softer surfaces and dual tasks only when appropriate, preferably with professional supervision if falls risk is high.

Practice should be challenging but safe: near a stable surface, with supportive footwear and a clear space. Tai chi and dance-based programmes are examples of balance activities with some evidence. A physiotherapist can design an individualised programme, especially after a fall or with neurological conditions.`,list:[{title:"Feet apart",text:"Stand tall near a bench or wall; hold 10–30 seconds."},{title:"Feet together",text:"Narrow the stance as control improves."},{title:"Tandem stance",text:"Place one foot directly in front of the other; use support."},{title:"Single leg",text:"Lift one foot slightly; progress only when stable."},{title:"Dynamic",text:"Step, reach and turn with support, then without if safe."}]},{h:"Home and medical review",p:`Remove loose rugs and clutter from walking paths, improve lighting, use night lights, keep items within easy reach, and consider grab rails and shower supports. Well-fitting, supportive footwear is safer than loose slippers or walking in socks on smooth floors. Pets and cables are common trip hazards. A home assessment by an occupational therapist can be valuable.

Ask a pharmacist or clinician to review medicines, especially if you feel dizzy or faint. Have vision checked, manage foot problems and discuss bone health if you have had a fragility fracture. Fear of falling is understandable; avoiding all activity can worsen strength and balance. A supportive programme can rebuild confidence.`,safety:"If you have had a fall with injury, lose consciousness, feel dizzy on standing, or have new weakness, seek medical assessment before starting a balance programme."}],terms:[["Fall risk assessment","A structured evaluation of factors contributing to falls, including health, medicines and environment."],["Tandem stance","Standing with one foot directly in front of the other to challenge balance."],["Dual-task training","Practice of a balance or walking task while performing a cognitive or motor secondary task."]],myth:["Falls are just part of getting old and nothing can be done.","Fall risk can be reduced. Strength and balance training, medication review, vision correction, home modification and footwear are evidence-supported components of multifactorial prevention."],takeaways:["Falls have multiple interacting causes and are not inevitable.","Progressive balance training should be safe and supported.","Home assessment and medication review are important companions to exercise."],quiz:[{q:"Which is a sensible first balance exercise?",o:["Eyes-closed single-leg stand on a pillow immediately","Feet apart standing near a stable support","Backward running","Standing on a chair"],a:1,e:"Begin with a stable base and available support. Progress gradually only as control and confidence improve."},{q:"Which action can reduce fall risk at home?",o:["Removing loose rugs and improving lighting","Using dim lights to sleep better","Keeping clutter on the floor","Wearing loose slippers on smooth floors"],a:0,e:"Removing trip hazards and improving visibility are practical modifications. Footwear and home assessment also matter."}],refs:["who-falls","cdc-falls"]},{n:65,title:"Flexibility, Mobility and Range of Motion",part:8,mins:9,summary:"Flexibility is available range; mobility is usable range with control. Both can be trained, but more range is not automatically better and goals should match function.",objectives:["Differentiate flexibility and mobility.","Choose appropriate stretching and mobility methods.","Recognise when restricted motion needs assessment."],sections:[{h:"Flexibility versus mobility",p:`Flexibility usually describes the available length or range of a muscle–tendon unit. Mobility is the ability to move through a range with control, often under load. A dancer may have a very wide hip range but need strength at those angles; a person who cannot reach overhead may have a shoulder, thoracic or soft-tissue restriction.

Range of motion depends on joint shape, capsule, ligaments, muscle, fascia, pain and neural tension. Stretching one tissue will not change bone shape or permanently lengthen ligaments, which is beneficial — stability depends on those restraints.`,fig:"exercise-progression",cap:"Figure 65.1 — Range of motion practice: gentle end-range work and controlled movement, not forcing through pain."},{h:"Methods and evidence",p:`Static stretching involves holding a position, often 15–60 seconds. Dynamic mobility uses controlled movement through a range, often as part of a warm-up. PNF techniques involve contract–relax cycles and may produce short-term range gains. Consistency over weeks is more important than a single intense session.

Stretching can improve range but is not reliably proven to prevent all injuries. For performance, dynamic preparation is generally more useful immediately before sport. Flexibility work can also support comfort and function in people with stiffness from sedentary time or joint disease. Use a gentle, tolerable stretch and avoid bouncing into pain.`,list:[{title:"Static",text:"Hold a comfortable position for 15–60 seconds; repeat a few times."},{title:"Dynamic",text:"Move smoothly through a progressively larger range as part of warm-up."},{title:"Loaded",text:"Strength through the available range builds usable mobility."},{title:"Consistency",text:"Short, regular practice is often more sustainable than long infrequent sessions."}]},{h:"When range is lost",p:`Sudden loss of range after injury can indicate swelling, a locked joint, dislocation or fracture and needs assessment. Progressive stiffness with pain, especially at night or with systemic symptoms, should be evaluated. A joint that feels unstable at end range may need stabilising work rather than more stretching.

Hypermobility varies between people. Some individuals have a wide range without problems; others experience pain or instability. Generic maximal-stretch routines may not be appropriate. Training control through a range, and avoiding forcing end range when pain or instability is present, is a sensible principle.`,safety:"Do not force a joint through pain or into a range it cannot actively control, especially after surgery or injury. Sudden locked or unstable joints need clinical assessment."}],terms:[["Range of motion","The extent to which a joint can move, measured actively or passively."],["Mobility","Usable, controlled movement through a functional range."],["PNF stretching","Proprioceptive neuromuscular facilitation, using contraction and relaxation cycles to improve range."]],myth:["Stretching loosens ligaments and prevents every injury.","Stretching mainly affects muscle–tendon and pain tolerance. Ligaments are not safely 'loosened' for flexibility, and no routine prevents all injuries. Strength, load management and balance matter."],takeaways:["Mobility is controlled range, not just passive flexibility.","Regular gentle practice is more useful than occasional forceful stretching.","Sudden range loss or instability requires assessment."],quiz:[{q:"What distinguishes mobility from passive flexibility?",o:["Mobility includes control through the range","Mobility only applies to the shoulder","Flexibility requires bone remodelling","They are identical"],a:0,e:"Mobility emphasizes active, controlled use of range, often under load, rather than passive reach alone."},{q:"Which is safe stretching guidance?",o:["Bounce rapidly into pain","Hold a comfortable stretch within tolerance and avoid forcing","Stretch a joint you cannot control","Only stretch once a year"],a:1,e:"Gentle holds within comfort are appropriate. Forcing or bouncing can aggravate tissues, especially after injury."}],refs:["acsm","who-pa"]},{n:66,title:"Exercise Modification for Different Abilities",part:8,mins:10,summary:"Exercise can be adapted in position, range, load, speed, support and environment so that almost everyone can participate at a meaningful level.",objectives:["Apply modification principles across abilities and settings.","Give examples of accessible strength and balance activities.","Involve appropriate professionals and respect autonomy."],sections:[{h:"Principles of adaptation",p:`A useful framework changes one or more variables: position (seated, standing, lying), range (partial vs full), load (bodyweight, band, weight), speed, support (wall, chair), complexity and environment. The goal is meaningful participation, not imitation of an athlete's programme. An adapted exercise should still challenge the person safely.

Disability is diverse. A wheelchair user may benefit from shoulder and trunk strength work, but shoulder health and pressure care matter. Someone with a prosthetic limb, vision loss, chronic pain or a neurological condition may need specialist input. Respect the person's expertise about their own body and preferences.`,fig:"workstation",cap:"Figure 66.1 — Adaptation can be as simple as appropriate seating, support surfaces and reachable equipment."},{h:"Examples",p:`For lower-body strength, a supported sit-to-stand, seated knee extension or water-based exercise may replace a squat. For balance, standing with hand support or seated weight shifting can replace unsupported single-leg work. For aerobic activity, chair aerobics, arm ergometry, swimming, walking aids or a pedal exerciser may be options.

In osteoporosis, avoid unnecessary end-range loaded twisting and discuss high-impact activity. In knee or hip osteoarthritis, reduced-range and water-based work can be helpful. After joint replacement, follow the surgical team's precautions. For children, play and supervision are central; for older adults, confidence and home safety matter.`,table:{head:["Goal","Standard option","Adapted options"],rows:[["Leg strength","Squat","Chair sit-to-stand; seated leg extension; water squat"],["Bone loading","Jumping","Brisk walking, stair work, resistance bands; specialist advice if fragility"],["Balance","Single-leg stand","Tandem stance with wall support; seated weight shift"],["Cardio","Running","Walking, cycling, swimming, seated aerobics"],["Mobility","Floor stretch","Seated mobility, supported standing mobility, bed-based range"]]}},{h:"Working with professionals",p:`A physiotherapist or exercise physiologist can tailor a programme for specific conditions. An occupational therapist can assess home and work tasks. A medical review addresses medicines, heart health and other risks. Support workers and adapted gyms can broaden access, but availability varies by country and income.

No one should be excluded because they cannot follow a generic programme. However, safety cautions are real. People with unstable fractures, active infection, severe heart disease or recent surgery need medical clearance. Exercise is important, but it is not a replacement for prescribed care or emergency treatment.`,safety:"Get individual advice if you have a recent fracture, unstable heart condition, active infection, a new neurological symptom or post-surgical restrictions before starting a new programme."}],terms:[["Adapted exercise","Activity modified in position, range, load, support or environment to fit a person's ability."],["Chair-based exercise","Exercises performed while seated, often used to improve strength and mobility safely."],["Activity prescription","A tailored physical activity plan designed for a person's health goals and restrictions."]],myth:["If you cannot do the standard version of an exercise, it is not worth doing.","Adapted versions can produce real benefits. Training the person, not the exercise, is the priority. Progress can occur within an adapted programme."],takeaways:["Modify position, range, load, support and environment to fit the person.","Adapted exercise can build strength, balance and confidence.","Respect individual autonomy and seek professional input when risk is higher."],quiz:[{q:"Which is a valid adaptation for a person who cannot stand unsupported?",o:["Give up on exercise","Perform seated or supported strength and balance activities","Only use supplements","Attempt maximal single-leg balance immediately"],a:1,e:"Seated and supported options can train strength and balance meaningfully. A professional can help progress safely."},{q:"Why is person-specific advice important after joint replacement?",o:["Because all exercise is unsafe","Because surgical approach and precautions affect what movements are appropriate","Because replacement joints cannot be loaded at all","Because balance is irrelevant"],a:1,e:"Post-surgical precautions vary. Follow the surgical team's instructions and progress with rehabilitation guidance."}],refs:["who-pa","acsm"]},{n:67,title:"Understanding Recovery and Tissue Adaptation",part:8,mins:10,summary:"Adaptation happens during recovery as well as training; sleep, nutrition, stress management and appropriate progression determine whether exercise builds capacity or erodes it.",objectives:["Describe the training–recovery–adaptation cycle.","Distinguish normal soreness from warning pain.","Plan recovery in a sustainable programme."],sections:[{h:"The adaptation cycle",p:`Exercise creates stress and microdamage. Recovery allows repair and adaptation, making tissue more capable over time. This cycle applies to muscle, tendon and bone, though each adapts at a different rate. Without enough recovery, performance falls and injury risk rises. With too little stress, capacity declines.

Recovery includes sleep, adequate energy and protein, hydration, stress management and lighter activity. It is not laziness. Older adults, people with chronic illness and those new to exercise may need more recovery or a different distribution of effort.`,fig:"exercise-progression",cap:"Figure 67.1 — Training stress and recovery cycle: load → fatigue → repair → adaptation, with excessive load leading to maladaptation."},{h:"Soreness versus injury",p:`Delayed-onset muscle soreness typically appears hours to a day or two after unaccustomed exercise, is diffuse, and eases with gentle movement. Sharp, localised pain, pain during rest, significant swelling, weakness, numbness or dark urine are not typical soreness and need assessment.

Persistent fatigue, sleep disruption, mood changes, recurrent illness and declining performance may suggest inadequate recovery. These signs are not diagnostic; medical conditions and life stress can look similar. A planned lighter week or a reduction in load is often sensible, with clinical review if symptoms persist.`,list:[{title:"Sleep",text:"Aim for regular, sufficient sleep; it supports hormonal and tissue recovery."},{title:"Nutrition",text:"Adequate energy, protein and micronutrients support repair."},{title:"Light movement",text:"Gentle activity may reduce stiffness and support circulation."},{title:"Deload",text:"Periodically reduce volume or intensity to consolidate adaptation."}]},{h:"Sustainable practice",p:`The best recovery strategy is individual. A single sleep tracker or supplement cannot replace consistent habits. Alcohol can impair sleep and recovery, and smoking affects tissue healing. Stress affects pain and performance, so support and realistic expectations matter.

Build recovery into the plan rather than waiting for a crisis. A monthly review of energy, function, sleep and enjoyment can help adjust the programme. If you are recovering from injury or illness, follow clinical guidance and progress gradually. Consistency with recovery is as important as consistency with training.`,safety:"Seek medical advice for persistent fatigue, unexplained weight loss, severe muscle pain with dark urine, or pain that keeps waking you from sleep."}],terms:[["Delayed-onset muscle soreness","Muscle discomfort typically beginning hours after unaccustomed exercise and settling over days."],["Deload","A planned reduction in training stress to support recovery."],["Overreaching","A short-term accumulation of fatigue that may reduce performance; prolonged unresolved stress can become more serious."]],myth:["If you are not sore, the workout did nothing.","Adaptation is not measured by soreness. Strength, function and gradual tolerance are better markers. Soreness can occur with novelty and does not confirm an effective stimulus."],takeaways:["Recovery is when adaptation occurs, not a break from progress.","Know the difference between normal soreness and warning symptoms.","Plan recovery and review the programme regularly."],quiz:[{q:"What is a sensible recovery practice?",o:["Removing all rest days","Sleeping adequately and including lighter days or deload periods","Training through severe pain","Ignoring persistent fatigue"],a:1,e:"Recovery combines sleep, nutrition, stress management and planned lighter periods. It supports adaptation and reduces injury risk."},{q:"Which symptom is NOT typical delayed-onset soreness?",o:["Diffuse muscle tenderness starting the next day","Sharp pain localised to a joint with swelling","Mild stiffness that eases with movement","Soreness after a new activity"],a:1,e:"Sharp localised joint pain and swelling suggest injury or another condition and should be assessed, not treated as ordinary soreness."}],refs:["acsm","who-pa"]},{n:68,title:"Rehabilitation Education and Returning to Activity",part:8,mins:10,summary:"Rehabilitation progresses from protecting tissue to restoring motion, strength, control and function; return decisions use a combination of criteria, not a fixed timeline.",objectives:["Describe phases of rehabilitation and their goals.","Explain how return-to-activity decisions are made.","Recognise risks of returning too soon or staying inactive too long."],sections:[{h:"Phases of rehabilitation",p:`Rehabilitation often begins with protection and pain control, then restores range of motion, builds strength and endurance, and retrains coordination and task-specific function. The phases overlap rather than follow rigidly. Progress depends on the injury, surgery, tissue healing and the person's goals.

Early movement is not always harmful; in many conditions, controlled movement supports healing and prevents stiffness. Conversely, loading too much too soon can disrupt repair. Rehabilitation performs a balancing act, guided by symptoms, clinical findings and tissue-specific timeframes.`,fig:"exercise-progression",cap:"Figure 68.1 — Rehabilitation progression: protect → restore motion → rebuild strength → retrain function → return with monitoring."},{h:"Return-to-activity criteria",p:`Return decisions consider pain, swelling, range, strength, balance, confidence, tissue-specific tests and the demands of the task. A calendar date alone is insufficient. An office worker and a construction worker with the same injury may need different criteria. Gradual exposure to sport-specific or work-specific demands helps identify remaining gaps.

Some professional guidelines use hop tests, strength ratios, single-leg control or sport-specific drills, but no single test perfectly predicts reinjury. Shared decision-making with a clinician or physiotherapist is appropriate, especially after surgery or a severe injury.`,list:[{title:"Pain",text:"Comfort during daily tasks and progressive loading."},{title:"Motion",text:"Range sufficient for the required activity."},{title:"Control",text:"Strength, balance and movement quality under load."},{title:"Demand",text:"Practice of the specific tasks and environment."}]},{h:"Avoiding both extremes",p:`Returning too quickly risks re-injury and may prolong recovery. Staying inactive for too long risks muscle loss, joint stiffness, reduced bone loading and loss of confidence. A graded plan with monitoring balances these risks. Flare-ups are common and do not necessarily mean failure; they may indicate that load needs adjustment.
