return n.jsx(Nm.Provider,{value:u,children:r})}function Ct(){const r=te.useContext(Nm);if(!r)throw new Error("useLibrary must be used inside LibraryProvider");return r}function Mm(r){try{return new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric"}).format(r)}catch{return new Date(r).toDateString()}}const Sg=ac;function gm(r){const c=r.replace(/^#\/?/,"").replace(/\/+$/,"");if(!c)return{view:"cover"};const[m,u,...k]=c.split("/");return{view:m||"cover",param:u,rest:k.join("/")||void 0}}function Tg(){const[r,c]=te.useState(()=>gm(typeof window>"u"?"":window.location.hash));return te.useEffect(()=>{const m=()=>{c(gm(window.location.hash)),window.scrollTo({top:0,behavior:"auto"})};return window.addEventListener("hashchange",m),()=>window.removeEventListener("hashchange",m)},[]),r}function Nt(r){const c=r.startsWith("#")?r:`#${r.startsWith("/")?r:`/${r}`}`;if(window.location.hash===c){window.scrollTo({top:0,behavior:"smooth"});return}window.location.hash=c}const Ng=[{n:1,title:"Introduction to the Human Musculoskeletal System",part:1,mins:9,summary:"A living network of bones, joints, muscles and connective tissues, directed by the nervous system, that lets us stand, move, protect organs and stay independent.",objectives:["Describe the main tissues and organs of the musculoskeletal system.","Explain how the skeletal, muscular and nervous systems cooperate.","Distinguish the structural and functional roles of the system."],sections:[{h:"One system, many living tissues",p:`The musculoskeletal system is not a set of inert supports. It is a working partnership of bone, cartilage, ligaments, tendons, fascia, skeletal muscle, nerves and blood vessels. Bone provides a stiff but adaptable frame; joints create controlled meeting points; muscles generate force; and connective tissues transmit that force while keeping joints stable. The nervous system decides when and how strongly muscles act, using feedback from receptors embedded in skin, joints and muscle.

Each tissue has its own cells, blood supply and repair capacity. Bone is continuously broken down and rebuilt, cartilage cushions and distributes load, and muscle changes size and metabolic capacity in response to use. Because these tissues communicate chemically as well as mechanically, movement influences bone strength, and bone health influences what movement is safe and comfortable.`,fig:"skeleton",cap:"Figure 1.1 — The adult skeleton, anterior view. Approximate proportions; individual anatomy and bone counts vary."},{h:"Five jobs, one body",p:`The system performs several overlapping jobs: support, protection, movement, mineral storage and blood formation. The skull and ribcage shield the brain, heart and lungs. The spine and pelvis transfer load between the upper and lower body. Bones store most of the body's calcium and phosphorus and house marrow, where blood cells are produced. Fat stored in yellow marrow is also an energy reserve.

These functions trade off against one another. A bone that is very light helps movement but may fracture more easily; a bone that is very dense may be strong but heavier. Health lies in adequate strength for the loads a person actually meets, not in maximising any one measure.`,list:[{title:"Support",text:"Maintains posture and gives soft tissues something to anchor to."},{title:"Protection",text:"Reduces injury to the brain, spinal cord, heart and lungs."},{title:"Movement",text:"Muscles pull on bones across joints to create controlled motion."},{title:"Storage and production",text:"Reserves calcium, phosphorus and fat, and houses blood-forming marrow."}]},{h:"Why this knowledge is practical",p:`Musculoskeletal conditions are among the most common reasons people seek healthcare worldwide, and they are a leading contributor to years lived with disability. Many of the forces shaping joint and bone health — physical activity, nutrition, sleep, injury prevention, occupational loading — are modifiable to some degree. Understanding them helps readers ask better questions and make informed choices.

That does not mean every condition can be prevented. Genetics, hormones, age, immune disease and injury all matter, and some people will need clinical treatment regardless of lifestyle. This book therefore teaches mechanisms and possibilities, never promises, and keeps the individual's own clinician at the centre of decisions.`}],terms:[["Musculoskeletal system","The interacting network of bones, joints, muscles and connective tissues that supports and moves the body."],["Skeletal muscle","Voluntary muscle attached to bone by tendon, responsible for posture and movement."],["Homeostasis","The body's active maintenance of a stable internal environment, including mineral balance and temperature."]],myth:["Bones are dead, hard scaffolding that only changes if they break.","Bone is living tissue with blood vessels and active cells. It is continually remodelled — roughly a small fraction of the skeleton is renewed each year — and responds to loading, nutrition and hormones."],takeaways:["Bones, joints, muscles, connective tissues and nerves function as one integrated system.","Musculoskeletal health is about function and resilience, not just how a bone looks on a scan.","Many influencing factors are modifiable, but no lifestyle choice guarantees freedom from disease."],quiz:[{q:"Which of these is NOT a primary function of the skeleton?",o:["Protection of organs","Storage of minerals","Production of bile","Support for posture and movement"],a:2,e:"Bile is produced by the liver. The skeleton protects organs, stores minerals such as calcium and phosphorus, supports movement, and houses marrow where blood cells form."},{q:"What is the main role of the nervous system in movement?",o:["It contracts directly, replacing muscle tissue","It initiates and coordinates muscle activity using sensory feedback","It produces synovial fluid","It stores calcium for the skeleton"],a:1,e:"Muscles generate force, but the nervous system activates them, sequences movements and uses feedback from joint and skin receptors to adjust posture and balance."}],refs:["who-pa","aaos"]},{n:2,title:"Why Bones, Joints and Muscles Matter",part:1,mins:8,summary:"Mobility is a practical asset: it shapes independence, participation, work, mental wellbeing and recovery, and it is influenced by how we use and support the system across life.",objectives:["Explain how musculoskeletal capacity supports everyday function.","Describe the relationship between physical function and participation.","Identify modifiable and non-modifiable influences on mobility."],sections:[{h:"Mobility is more than exercise",p:`Mobility is the ability to move safely and comfortably enough to do what matters: walk to a shop, carry a child, rise from a chair, wash, work, pray, play or travel. It depends on muscle strength, joint range and stability, balance, sensation, confidence, energy and the environment. A broken kerb, a steep staircase or an inaccessible bathroom can be as limiting as reduced strength.

For this reason, specialists increasingly describe musculoskeletal health in terms of function rather than a single measurement. Two people can have the same bone density and very different abilities; one may sustain a fracture in a fall, while another walks long distances with osteoporosis and no injury. Bone density is one useful piece of information, not a complete description of a person.`,fig:"posture-balance",cap:"Figure 2.1 — Posture and balance emerge from continuous negotiation between sensation, strength and environment."},{h:"The practical cost of musculoskeletal conditions",p:`Painful joints, fractures and muscle weakness can interrupt paid work, caregiving, education and social contact. A hip fracture is a serious event at any age, especially in later life, where it may trigger loss of independence and increased support needs. Low back pain is a leading cause of work absence but usually improves without surgery; most people benefit from reassurance, continued appropriate activity and assessment when warning signs are present.

These burdens are not distributed evenly. Manual labour, unsafe roads, limited food access, poor housing and restricted healthcare access can concentrate risk in particular communities. Effective education must acknowledge those realities rather than imply that individual effort alone determines health.`},{h:"What can and cannot be changed",p:`Genetic inheritance, age, sex hormones, previous injuries and some medical treatments cannot be chosen. Physical activity, dietary adequacy, sleep, not smoking, limiting alcohol excess, preventing falls and adapting the environment are more actionable. Even modest changes can matter, especially when maintained over years.

Context changes what is realistic. A reader who cannot afford a gym may walk, climb steps, use a chair for supported strength work or practice balance standing near a wall. A reader with a disability may focus on preserving range and comfort rather than impact exercise. The goal is a fit between the plan and the person.`}],terms:[["Physical function","The capacity to carry out everyday tasks and activities required for living and participation."],["Modifiable risk factor","An influence on health that can be altered, at least partly, through behaviour or environment."],["Fracture","A break or crack in a bone, caused by force, repetitive stress or weakened bone."]],myth:["If you exercise and eat well, you will not get osteoporosis or arthritis.","Lifestyle genuinely supports bone and joint health, but it cannot eliminate genetic, hormonal, immune and age-related risk. People can develop these conditions while being active and well nourished, and they deserve assessment and treatment without blame."],takeaways:["Mobility is shaped by body, mind and environment together.","Function matters more than a single test result.","Accessible, realistic movement is more sustainable than idealised programmes."],quiz:[{q:"Which statement best reflects a functional view of musculoskeletal health?",o:["Only a bone density score matters","Safety and ability to perform meaningful daily activities depend on multiple factors","Pain always indicates permanent tissue damage","Exercise should be avoided after any diagnosis"],a:1,e:"Function integrates strength, joint range, balance, sensation, confidence and environment. Bone density contributes but does not fully describe ability or fracture risk."},{q:"Which of these is a non-modifiable influence on musculoskeletal health?",o:["Physical activity level","Diet quality","Age","Access to a safe walking route"],a:2,e:"Age advances with time. Activity, diet, and the environments we can influence are modifiable, though access to resources varies and is not equally within personal control."}],refs:["who-pa","who-falls"]},{n:3,title:"Understanding the Relationship Between Structure and Movement",part:1,mins:9,summary:"Movement results from a chain of events: the nervous system signals muscle, muscle pulls tendon, tendon pulls bone, and joints guide the resulting motion while sensory feedback fine-tunes it.",objectives:["Trace the sequence from nerve signal to bone movement.","Explain how structure constrains and enables movement.","Recognise how muscles work in pairs and chains."],sections:[{h:"From signal to motion",p:`A decision to move begins in the nervous system. Motor neurons carry impulses to muscle fibres, where calcium release and energy-dependent protein interactions shorten the fibres. That tension travels through tendon, which is firmly attached to bone. Because the muscle crosses at least one joint, shortening creates rotation about a joint axis. Sensory receptors report length, tension, joint position and skin contact, letting the brain adjust the movement in real time.

This chain explains why a problem anywhere can change movement. A painful knee may cause someone to reduce loading on one side; the hip and trunk then compensate; and a limp can create discomfort elsewhere. Treating only the site of pain without considering the whole pattern may miss what maintains the problem.`,fig:"tendon-ligament",cap:"Figure 3.1 — Tendon and ligament positions differ: tendons connect muscle to bone; ligaments connect bone to bone and restrain motion."},{h:"Structure sets the rules",p:`A joint's shape dictates the directions it can move. The elbow is a stable hinge with limited side-to-side movement; the shoulder is a shallow ball-and-socket joint with a large range and greater dependence on muscles and ligaments for stability. Bone ridges, joint capsules and ligaments provide passive guidance, while muscles provide active control.

Muscles are arranged in opposing groups. When the elbow bends, elbow flexors shorten and extensors lengthen, then their roles reverse to straighten it. This is not a simple tug-of-war: the nervous system coordinates activation and relaxation with precise timing, and elastic connective tissue stores and returns some energy.`},{h:"Chains and compensations",p:`Most daily actions require coordinated motion at several joints. Standing up from a chair involves ankle, knee and hip extension, trunk control and arm support. A restriction at one joint changes demand at its neighbours. That is why rehabilitation often looks at the whole task rather than a single muscle.

Understanding structure and movement helps readers interpret advice. A strength exercise for the hips may help a person's balance and walking capacity; a mobility drill for the ankles may make it easier to squat or climb stairs. No single exercise addresses every goal, and progress should be judged by improved function and tolerance, not by discomfort during a single session.`}],terms:[["Motor neuron","A nerve cell that carries signals from the central nervous system to skeletal muscle fibres."],["Joint capsule","A fibrous sleeve around a synovial joint that encloses fluid and contributes to stability."],["Compensatory movement","An alternative movement strategy adopted when one part of the body is restricted, painful or weak."]],myth:["One muscle can be blamed for every movement problem.","Muscles work in coordinated chains, and tendons, joint structure, nerves and environment all influence the task. Careful assessment is needed to identify which factors are relevant for a particular person."],takeaways:["Movement is a nervous-system-led chain from muscle contraction to joint motion.","Joint structure both permits and limits motion.","Local pain can be accompanied by wider changes in movement patterns."],quiz:[{q:"Which structure connects muscle to bone?",o:["Ligament","Tendon","Bursa","Meniscoid fat pad"],a:1,e:"Tendons attach muscle to bone and transmit force. Ligaments attach bone to bone and are better described as passive stabilisers."},{q:"Why might knee pain alter movement at the hip and trunk?",o:["All joints share one blood supply","Reduced loading on the painful side can lead to compensating patterns elsewhere","Ligaments move the knee independently of muscle","Knee pain always indicates a hip fracture"],a:1,e:"Compensation redistributes load. A limp can change hip and trunk demand; this does not mean pain is imaginary or that the other joints are necessarily damaged."}],refs:["aaos","acsm"]},{n:4,title:"The Skeleton as the Body's Structural Framework",part:1,mins:9,summary:"The skeleton’s 206 bones are organised into an axial core and appendicular limbs, with living bone tissue continuously adapting to load and repair.",objectives:["Name the major divisions and regions of the skeleton.","Describe the key functions of the axial and appendicular skeleton.","Recognise normal variation in bone number and shape."],sections:[{h:"Axial and appendicular",p:`The adult skeleton is conventionally divided into the axial skeleton — skull, vertebral column, ribs and sternum — and the appendicular skeleton, which includes the shoulder and pelvic girdles and the limbs. The axial skeleton forms the body's central axis and protects the brain, spinal cord and internal organs. The appendicular skeleton is specialised for reach, grasp, load-bearing and locomotion.

The count of 206 bones is a useful teaching figure, not a universal constant. Sesamoid bones, inconstant ribs, fused joints and anatomical variation differ between people. Children have more separate bones because many growth regions fuse during development.`,fig:"skeleton",cap:"Figure 4.1 — Anterior skeleton: axial core in deep green, appendicular limbs in muted olive (teaching schematic)."},{h:"Regions with different jobs",p:`The skull consists mainly of flat and irregular bones that protect the brain and shape the face. The vertebral column supports the head and trunk while enclosing the spinal canal, and its curves allow balance and shock absorption. The ribcage protects the heart and lungs and moves with breathing. The pelvis transfers upper-body load into the hips and legs and links the spine to the lower limbs.

The arm is designed for mobility, with a shallow shoulder joint and a long lever system. The leg prioritises load-bearing and propulsion, with a deep hip socket, strong knee stabilisers and a sprung foot. These are tendencies, not rigid rules; function depends on the person and the task.`},{h:"A framework that remodels",p:`Bone is not a finished sculpture. Its outer shape changes gradually through the coordinated action of osteoblasts forming bone and osteoclasts resorbing it. Mechanical use influences where new bone is deposited, while calcium and phosphate supply the mineral that hardens it. Fracture callus is provisional bone that is later reshaped along lines of stress.

The skeleton also functions as an endocrine organ, releasing factors such as FGF23 that influence phosphate handling and vitamin D metabolism. Its marrow supports blood production and its mineral reserves buffer the bloodstream. This is why skeletal health cannot be understood as an isolated mechanical property.`}],terms:[["Axial skeleton","The skull, vertebral column, ribcage and sternum; the central supporting axis of the body."],["Appendicular skeleton","The girdles and limb bones, specialised for movement and manipulation."],["Remodelling","The coordinated removal and replacement of bone, allowing repair and adaptation to loading."]],myth:["Everybody has exactly 206 bones, so anatomy is identical from person to person.","206 is a common adult teaching count. Sesamoid and accessory bones, fusion between vertebrae or other variants are normal findings and can change the total. Imaging should be interpreted by qualified professionals who understand these variations."],takeaways:["The axial skeleton centres and protects; the appendicular skeleton moves and manipulates.","Bone counts and shapes vary between healthy people.","Bones are active organs involved in mineral and endocrine regulation."],quiz:[{q:"Which bones belong to the axial skeleton?",o:["Femur, tibia and fibula","Skull, vertebrae and ribs","Humerus, radius and ulna","Clavicle, scapula and pelvis"],a:1,e:"The skull, vertebral column, ribs and sternum form the axial skeleton. The limb bones and girdles belong to the appendicular skeleton."},{q:"What does 'remodelling' describe?",o:["The permanent loss of all bone mass after growth","Continuous removal and replacement of bone","The movement of joints through synovial fluid","The conversion of muscle to bone with training"],a:1,e:"Remodelling replaces old or damaged bone and adapts architecture to mechanical and metabolic needs, carried out by osteoclasts and osteoblasts."}],refs:["niams-bone","aaos"]},{n:5,title:"Mobility, Stability, Strength and Physical Independence",part:1,mins:9,summary:"Strength produces force, stability controls it, mobility supplies range, and independence emerges when these capacities match the demands of daily life.",objectives:["Define strength, mobility, stability and independence.","Explain how these capacities interact rather than compete.","Apply the concepts to a common task such as standing up."],sections:[{h:"Four related capacities",p:`Strength is the ability to generate force against resistance. Mobility is the ability to move a joint or whole body through a useful range with control. Stability is the ability to maintain or regain a position when challenged by internal or external forces. Physical independence is the practical outcome: managing personal care, home tasks, work and community participation with the support that is appropriate.

These qualities overlap. A hip that lacks range may prevent an older adult from rising from a low chair even if the muscles are strong. Strong legs are less useful for balance if sensory information is poor or confidence is low. Conversely, better strength often widens the range a person can control safely.`,fig:"posture-balance",cap:"Figure 5.1 — Balance depends on sensory input, central integration and a timely muscular response."},{h:"The chair-rise test",p:`Standing from a chair illustrates the system at work. The feet must be positioned over the base of support, the trunk leans forward to bring body weight over the feet, and ankle, knee and hip extensors produce force. Grip on the arms of the chair or a walking aid can reduce demand. Joint pain, low blood pressure, visual cues, cognitive load and the height of the chair all influence success.

A person may perform better with a firmer seat, supportive footwear, verbal cueing or an adjustable chair. These adaptations are not cheating; they make practice possible and can reveal what limits function. Healthcare professionals can help select appropriate challenges when falls risk, recent surgery or unstable medical conditions are present.`},{h:"Strength without stability",p:`Strength training can improve both force and control, but the relationship is not automatic. A person might be able to push a heavy load while having difficulty standing on one leg. Balance tasks and functional movements help transfer capacity into daily life.

Similarly, flexibility without strength can be a liability when an individual cannot control the available range. The practical aim is a usable range under load. Assessment and programming should be individualised, and no exercise should be attempted in a way that provokes sharp pain, dizziness or loss of control.`}],terms:[["Strength","The maximal force a muscle or muscle group can generate under specific conditions."],["Stability","The ability to maintain or regain postural equilibrium when challenged."],["Base of support","The area beneath and between the points of contact with a supporting surface."]],myth:["You must choose between flexibility and strength; they work against each other.","Range and force are complementary. Strength can be developed through a controlled range, and mobility work can be loaded progressively. Individual goals and health conditions determine the best balance."],takeaways:["Strength, mobility and stability combine to support independence.","Small environmental adaptations can make practice safe and effective.","Judge training by improved function, not one isolated performance test."],quiz:[{q:"Standing from a chair is made harder by which change?",o:["A firmer seat height","A lower seat that requires more knee and hip force","Supported footwear","Placing feet flat under the knees"],a:1,e:"A lower seat increases the range and force demand required to rise. Chair height, foot position, arm support and confidence all affect the task."},{q:"What best defines stability?",o:["Maximum muscle size","Ability to maintain or recover equilibrium when challenged","The amount of joint fluid present","A measure of bone mineral density"],a:1,e:"Stability concerns control of posture and balance. It relies on strength, sensation, coordination and environmental conditions."}],refs:["acsm","who-falls"]},{n:6,title:"Common Misconceptions About Bone and Joint Health",part:1,mins:8,summary:"Clear thinking about bones and joints requires separating evidence from folklore, remembering that pain is not identical to damage, and recognising when symptoms deserve assessment.",objectives:["Identify common myths about bone and joint health.","Use evidence reasoning to check a health claim.","Recognise potentially urgent musculoskeletal symptoms."],sections:[{h:"Myths worth retiring",p:`Myth: lifting heavy weights in adolescence damages growth plates, so teenagers should only use bodyweight. In reality, supervised resistance training with good technique can be safe and beneficial for young people, with appropriate loading and coaching. Myth: running inevitably wears out knees. Recreational running is not consistently associated with knee osteoarthritis, though injury history and individual factors matter. Myth: cracks or pops predict joint damage. Joint noise is common and by itself is not a diagnosis.

Other persistent claims deserve caution: foods that 'detoxify' joints, collagen supplements that are said to regrow cartilage in everyone, or posture rules promising to eliminate pain. Such claims often take a kernel of biology and extend it far beyond the evidence.`},{h:"A practical claim checklist",p:`Ask three questions of any bone or joint claim. First, what exactly is promised — prevention, symptom relief, structural change, cure? Second, what evidence would be needed to support that promise, and has it been responsibly reported? Third, who benefits from the claim, and does it conflict with established treatment?

Beware of dramatic anecdotes replacing research, absolute words such as 'always' and 'never', and claims that a product works for unrelated conditions. A single testimonial cannot show that a supplement rebuilt cartilage. Trustworthy educational sources separate established findings from preliminary hypotheses.`,fig:"bone-density",cap:"Figure 6.1 — Low bone density is not the same as having had a fracture; risk assessment combines measurements, history and clinical factors.",list:[{title:"Established",text:"Consistent findings from multiple well-designed studies; still interpreted for the individual."},{title:"Emerging",text:"Plausible and promising, but too uncertain for broad recommendations."},{title:"Unsupported",text:"Contradicted by evidence, or based only on anecdotes, laboratory mechanisms or marketing."}]},{h:"Pain is information, not a verdict",p:`Pain is produced by the nervous system and is influenced by tissue state, context, stress, sleep and prior experience. It can be present without ongoing damage, and significant damage can sometimes occur with little pain. That is why symptom checklists cannot diagnose osteoporosis, arthritis or spinal injury.

Some features do warrant urgent attention: severe trauma, inability to bear weight after injury, a feverish hot swollen joint, new limb weakness or numbness, or back pain with new bladder or bowel problems or saddle-area numbness. These require prompt professional assessment, not internet diagnosis.`}],terms:[["Pain","An unpleasant sensory and emotional experience influenced by biological, psychological and social factors."],["Anecdotal evidence","Information based on individual stories rather than controlled comparison; useful for generating questions, not for proving effectiveness."],["Red flag","A symptom or history feature suggesting a need for prompt professional assessment."]],myth:["A healthy lifestyle means you will never need medication for osteoporosis or arthritis.","Medication may be essential for some people, because fracture and inflammation risks can outweigh the benefits of lifestyle alone. Lifestyle and prescribed treatment are partners, not rivals."],takeaways:["Investigate claims by their promised outcome and the strength of supporting evidence.","Joint noise and posture imperfections are common; symptoms and function matter more.","Certain 'red flag' symptoms require urgent clinical care."],quiz:[{q:"Which is the strongest evidence claim?",o:["A celebrity says a supplement cured their arthritis","A single laboratory study suggests a plant compound may influence inflammation","Multiple randomised trials and a systematic review show a modest reduction in pain for a supervised exercise programme","A marketing website reports that thousands feel better"],a:2,e:"Evidence quality depends on study design, consistency and independent replication. Lab and anecdotal findings are useful starting points but far weaker than systematic reviews of controlled trials."},{q:"Which symptom needs urgent assessment?",o:["Knees that click when squatting, with no pain","A hot, swollen joint with fever","Mild stiffness after a long walk that settles with rest","A muscle that feels tired after carrying shopping"],a:1,e:"A hot, swollen joint plus fever may indicate infection, which is a medical emergency. Routine mechanical symptoms are still worth discussing but do not usually need the same urgency."}],refs:["niams-osteoporosis","nhs-oa"]},{n:7,title:"Factors That Influence Musculoskeletal Wellness",part:1,mins:9,summary:"Bone, joint and muscle health result from interacting genetic, hormonal, nutritional, mechanical, psychological, social and environmental factors across the entire lifespan.",objectives:["Map biological, behavioural and environmental influences on the system.","Explain why a single risk factor rarely tells the whole story.","Prioritise areas where change is realistic and safe."],sections:[{h:"Biological influences",p:`Genetics influence bone size, peak bone mass, joint shape and susceptibility to inflammatory disease. Sex hormones strongly affect bone turnover: oestrogen deficiency after menopause accelerates bone loss, and prolonged low testosterone can reduce bone and muscle mass. Age-related changes in growth hormone, thyroid hormone and parathyroid hormone also affect the skeleton. Chronic inflammatory conditions, kidney disease, digestive disorders and some medicines alter bone or muscle metabolism.

These biological factors are not destiny. They modify the effect of nutrition and loading, which is why an individual risk assessment considers medical history and family history rather than a single measurement.`,fig:"life-stages",cap:"Figure 7.1 — Bone mass changes across life. Peak bone mass is influenced by genetics, nutrition, hormones and activity."},{h:"Behaviour, environment and inequality",p:`Physical activity, nutrient adequacy, smoking, alcohol, sleep and injury exposure all influence musculoskeletal health. So do factors outside individual control: food prices, neighbourhood walkability, air quality, housing, physically demanding work, unsafe transport and access to care. A person working two physically demanding jobs may have high load exposure but little recovery; an office worker may have low overall movement and prolonged sitting.

Ageing, disability and social roles intersect. Caregiving can reduce time for exercise; a wheelchair user may face inaccessible sidewalks; a shift worker may struggle with consistent meals. Education should offer adaptable principles rather than one lifestyle template.`,list:[{title:"Mechanical",text:"Loading, impact, posture, occupational demands, immobilisation and injury."},{title:"Nutritional",text:"Energy, protein, calcium, vitamin D, vitamin K, magnesium and overall dietary quality."},{title:"Hormonal & medical",text:"Menopause, testosterone, thyroid and parathyroid disease, inflammation, kidney function, medications."},{title:"Social & environmental",text:"Access, income, safety, housing, work, culture, support and health services."}]},{h:"Avoid single-factor thinking",p:`The supplement that promises stronger bones, the posture cue that promises no back pain, or the app that promises perfect movement all ignore interaction. Calcium without adequate vitamin D has limited use for some people; vitamin D without adequate calcium cannot mineralise bone; exercise without enough energy or protein can leave muscle unable to adapt.

The useful question is not 'What is the one thing?' but 'Which few things are most relevant, realistic and safe for me right now?' That might be a daily source of calcium-rich food, gradual resistance training, a medication review, a home fall assessment or seeing a clinician about persistent pain. Priorities change across life stages.`}],terms:[["Peak bone mass","The highest bone mass an individual attains, usually by the late twenties; a major determinant of later fracture risk."],["Modifiable factor","An influence that can be changed, at least partly, through behaviour, environment or medical care."],["Immobilisation","Reduced movement or non-use of a body part, which can rapidly reduce bone and muscle mass."]],myth:["Bone health is decided entirely in old age.","Bone is built through childhood and adolescence, maintained in adulthood and lost more rapidly after menopause in some people. An adequate peak bone mass provides a reserve for later life."],takeaways:["Musculoskeletal wellness is multifactorial and shaped by inequality as well as behaviour.","Choose priorities that fit your circumstances and medical history.","Prevention and treatment work best as long-term partnerships."],quiz:[{q:"Which combination best supports bone mineralisation?",o:["Vitamin D excess without calcium","Adequate calcium and vitamin D as part of a balanced diet","Calcium alone in very high doses","Collagen supplements instead of a varied diet"],a:1,e:"Bone mineral requires calcium and phosphate, with vitamin D supporting calcium absorption. Excess of either nutrient is not a shortcut and can be harmful."},{q:"Why is 'one habit fixes bone health' misleading?",o:["Habits have no effect on bone","Bone health depends on interacting genetics, hormones, nutrition, loading and environment","Only medication affects bone","Exercise is the only factor that matters"],a:1,e:"Skeletal health is multi-determined. A useful habit matters, but it operates within a broader system including genetics, hormones, medical conditions and access to resources."}],refs:["niams-bone","who-pa"]},{n:8,title:"Understanding Musculoskeletal Health Across Different Populations",part:1,mins:9,summary:"Anatomy is universal, but risk, access and experience differ by sex, age, ancestry, occupation, culture, disability and economic circumstance — with important differences within groups.",objectives:["Describe variation in musculoskeletal health between and within populations.","Explain why population-level statistics do not predict an individual's outcome.","Adapt recommendations to ability, culture and resources."],sections:[{h:"Between and within groups",p:`Some conditions show different frequencies between populations. Hip fracture rates vary widely between countries and change over time, shaped by ageing, fracture prevention, nutrition and falls. Autoimmune conditions such as rheumatoid arthritis and lupus are generally more common in women; gout is associated with higher uric acid levels and is influenced by genetics, kidney function, diet, alcohol and medicines. These patterns inform public health, but they cannot diagnose an individual.

Differences within groups are equally important. A country may have excellent average statistics while some rural or low-income communities face severe barriers. Ethnic categories can hide genetic and social diversity. Treating group membership as a medical prediction risks both error and discrimination.`,fig:"assessment",cap:"Figure 8.1 — A person-centred assessment combines history, physical findings, function and context — not a single demographic label."},{h:"Culture, food and movement",p:`Dietary patterns differ around the world, and many can nourish bone if they provide enough calcium, protein, vitamin D (from diet or sunlight) and overall energy. Fermented dairy, fortified plant drinks, small fish eaten with bones, tofu set with calcium salts, beans, lentils, sesame, leafy greens and fortified cereals all contribute calcium. Lactose avoidance does not make a diet incapable of supporting bone health.

Culturally acceptable movement choices matter. Walking, dancing, gardening, stair climbing, carrying loads and domestic tasks can all count as activity. Prayer postures, household work and traditional games may include balance and mobility demands. Exercise advice that assumes a gym, a safe footpath or a particular body ideal is less useful and less equitable.`,table:{head:["Context","Practical adaptation"],rows:[["Lactose intolerance","Use calcium-set tofu, fortified alternatives, beans, leafy greens, canned fish with bones where suitable."],["Limited sun exposure","Consider fortified foods; discuss vitamin D supplement need with a clinician or pharmacist."],["Wheelchair user","Explore seated strength, supported balance and accessible routes; discuss shoulder care with a professional."],["Physically demanding work","Plan recovery, vary loads, use mechanical aids, prioritise sleep and report persistent pain."]]}},{h:"Equity matters for prevention",p:`A fall-prevention programme requires a safe home, suitable footwear, vision care and sometimes social support. Osteoporosis medication requires a prescriber, access and follow-up. Healthy food requires availability and affordability. A book can teach principles; it cannot remove these barriers.

Readers are encouraged to use what is accessible and to seek local services where needed. Community health workers, nurses, physiotherapists, pharmacists and primary-care clinicians can help translate principles into a workable plan. No reader should feel blamed for a health condition or for circumstances they cannot control.`}],terms:[["Prevalence","The proportion of a population with a condition at a given time."],["Equity","Attending fairly to differences so that everyone has a realistic opportunity for health, rather than applying one standard blindly."],["Person-centred care","Care that respects an individual's values, preferences, circumstances and goals."]],myth:["A country's average calcium intake or fracture rate predicts your personal risk.","Population data describe groups, not individuals. Personal risk depends on intake, absorption, hormones, activity, falls, medical history, medicines and many other factors assessed by a clinician."],takeaways:["Risk and access differ widely between and within populations.","Many cuisines and movement traditions can support musculoskeletal health.","Adapt recommendations to the body, culture, resources and goals of the reader."],quiz:[{q:"What does it mean that a condition is more prevalent in a population?",o:["Every member of that population will develop it","A higher proportion of that group has the condition at the measured time","The condition is genetically identical for all members","Lifestyle has no role"],a:1,e:"Prevalence describes proportions within groups. Individual risk requires personal assessment and can differ enormously inside the same group."},{q:"Which advice is most inclusive?",o:["Everyone must drink milk daily for strong bones","Only gym-based weight training counts for bone health","Offer multiple calcium sources and movement options and adapt to ability and resources","Older adults should avoid all resistance exercise"],a:2,e:"Calcium can come from many foods, and movement can take many forms. Adaptation to dietary pattern, ability, culture and resources makes advice more useful and safer."}],refs:["iof","who-nutrition"]},{n:9,title:"Introduction to Human Bone Anatomy",part:2,mins:9,summary:"Bones vary in shape and size but share a basic organisation of outer cortex, inner trabecular network, marrow, periosteum and blood supply.",objectives:["Name the main parts of a long bone.","Describe the periosteum, endosteum, marrow cavity and articular surfaces.","Explain why bone anatomy supports both strength and lightness."],sections:[{h:"The parts of a bone",p:`A typical long bone such as the femur has a central shaft (diaphysis) and two expanded ends (epiphyses). The region between them, the metaphysis, contains the growth plate in children. Compact (cortical) bone forms a strong outer tube, while spongy (trabecular) bone fills the expanded ends as a lightweight lattice. The marrow cavity holds yellow marrow, and some bones also contain red marrow in spaces among trabeculae.

A fibrous sheath called the periosteum covers most external surfaces except within joints, where smooth articular cartilage covers the ends. The endosteum lines internal cavities. Blood vessels enter through small openings and supply bone cells; nerves accompany them. These details explain why a bone can bleed, feel pain and heal actively after a fracture.`,fig:"long-bone",cap:"Figure 9.1 — Long-bone organisation. Expanded ends distribute load; the cortex carries bending and compressive stress."},{h:"Why the shape matters",p:`Bone organisation optimises strength relative to weight. The cortex is thickest where bending loads are greatest along the shaft. Trabeculae at the ends are arranged along lines of stress, spreading force across a wider surface and reducing pressure at the joint. The hollow shaft provides bending resistance similar to a tube, which is stiffer per unit mass than a solid rod of the same weight.

These arrangements are adaptable, not fixed. Bone responds to repeated loading by modifying its structure over time, and it loses mass when loading is removed. This is why returning to activity after a period of immobilisation requires patience and progression.`},{h:"Articular and attachment surfaces",p:`Joint surfaces are covered with hyaline cartilage that reduces friction and distributes load. Ligaments attach near joint margins; tendons attach at bony prominences such as tubercles and crests. These prominences increase the lever arm for muscle force and indicate where strong connective tissue anchors.

Anatomical terms like proximal, distal, medial and lateral help locate structures consistently. Proximal means closer to the trunk; distal means farther away; medial means towards the midline; lateral means away from it. Using standard terminology makes cross-referencing safer, whether in conversation, imaging reports or exercise instruction.`}],terms:[["Diaphysis","The shaft of a long bone, with a thick cortical wall and central marrow cavity."],["Periosteum","A tough fibrous membrane covering most bone surfaces; it carries blood vessels and contributes to growth and repair."],["Trabecula","A small strut of spongy bone; trabeculae form a load-bearing lattice."]],myth:["The marrow cavity is empty space that weakens the bone.","The cavity keeps the bone light while the cortex provides bending strength. In addition, the cavity houses marrow, a vital organ for blood and immune cell production."],takeaways:["Long bones combine a strong cortex with a lightweight trabecular end.","Periosteum and endosteum support growth, nutrition and repair.","Anatomical orientation terms matter for accurate communication."],quiz:[{q:"Which part of a long bone is the shaft?",o:["Epiphysis","Diaphysis","Metaphysis","Apophysis"],a:1,e:"The diaphysis is the shaft. The epiphyses are the ends, and the metaphysis is the transition region that includes the growth plate in childhood."},{q:"What covers the smooth articular surface within a joint?",o:["Periosteum","Endosteum","Hyaline cartilage","Yellow marrow"],a:2,e:"Hyaline (articular) cartilage lines the ends of bones at synovial joints, reducing friction and distributing load. Periosteum does not cover the articular surface."}],refs:["aaos","niams-bone"]},{n:10,title:"The Different Types of Bones",part:2,mins:8,summary:"Bones are classified by shape and function — long, short, flat, irregular and sesamoid — a system that helps explain how they handle load and movement.",objectives:["Classify bones by shape with examples.","Relate shape to mechanical function.","Explain what sesamoid bones are and where they occur."],sections:[{h:"Five useful categories",p:`Long bones are longer than they are wide and act as levers: the femur, tibia, humerus, radius, ulna and phalanges. Short bones are roughly cube-shaped, such as the carpals of the wrist and tarsals of the ankle; they provide stability with limited motion at individual joints. Flat bones, including the skull vault, sternum, ribs and scapulae, provide broad surfaces for protection and muscle attachment. Irregular bones have complex shapes — vertebrae, some facial bones and the pelvis — with varied functions.

Sesamoid bones are small bones embedded within tendons where they cross joints. The patella (kneecap) is the largest; the wrist and big toe may contain others. They protect tendons, change the angle of pull and can improve leverage.`,fig:"bone-types",cap:"Figure 10.1 — Bone shape categories are teaching aids; some bones combine features of more than one class."},{h:"Shape is functional",p:`A long bone's tubular shaft resists bending, while its broad ends spread load over a joint. A flat bone distributes impact over a larger area and gives a wide attachment surface for muscle. Irregular bones such as vertebrae must support load and allow controlled motion while protecting the spinal cord. Short bones and their ligaments allow many small movements to sum into adaptable hand and foot positions.

The classification is not a perfect taxonomy. The mandible and some other bones do not fit neatly; the pelvis is sometimes described as irregular but has flat regions. The value lies in connecting structure to purpose, and in using shared language.`,table:{head:["Type","Examples","Typical contribution"],rows:[["Long","Femur, tibia, humerus, radius, ulna, phalanges","Levers for movement; strong shafts for load"],["Short","Carpals, tarsals","Stability with controlled mobility"],["Flat","Skull bones, sternum, ribs, scapula","Protection and broad attachment surfaces"],["Irregular","Vertebrae, pelvis, mandible","Complex roles in support, protection and motion"],["Sesamoid","Patella; small bones near tendons","Protect tendon and modify mechanical pull"]]}}],terms:[["Lever","A rigid structure that rotates about a pivot when force is applied, allowing the body to create movement."],["Sesamoid bone","A small bone embedded in a tendon near a joint; the patella is the largest example."],["Attachment site","A region of bone where tendons, ligaments or capsules anchor via strong connective tissue."]],myth:["The patella is a bone that can be removed without consequence.","The patella improves the knee's extension lever and protects the front of the joint. Surgery may be appropriate for particular problems, but the patella is not a disposable accessory and must be managed by qualified clinicians."],takeaways:["Bone shape reflects load, protection and motion roles.","Sesamoids modify tendon mechanics; the patella is the largest.","Anatomical categories are teaching tools with overlap and variation."],quiz:[{q:"Which bones are flat?",o:["Carpals and tarsals","Femur and humerus","Sternum, ribs and scapulae","Vertebrae and mandible"],a:2,e:"The sternum, ribs and scapulae are flat bones, providing protection and broad attachment surfaces. Carpals and tarsals are short bones; vertebrae are irregular."},{q:"What is a sesamoid bone?",o:["A bone found only in children","A bone embedded in a tendon, often improving leverage","A bone that has no blood supply","Any bone that protects an organ"],a:1,e:"Sesamoids such as the patella sit within tendons, protecting the tendon and altering its line of action. They are not limited to one age group."}],refs:["aaos"]},{n:11,title:"Long, Short, Flat, Irregular and Sesamoid Bones",part:2,mins:8,summary:"Applying the shape classifications to real anatomical regions shows how the skeleton balances leverage, protection, stability and adaptability.",objectives:["Apply bone categories to upper and lower limb regions.","Explain the mechanical trade-offs of different bone shapes.","Recognise how training and injury affect bones of different shapes."],sections:[{h:"The upper limb and hand",p:`The humerus is a long bone with a rounded head for the shoulder and complex articular surfaces at the elbow. The radius and ulna are long bones whose arrangement permits rotation of the forearm. The carpals are short bones, the metacarpals and phalanges are miniature long bones, and small sesamoids can occur near the thumb and other joints.

This mix creates a hand that can apply force and make fine adjustments. Stability comes from ligaments and muscular control, not only from bone shape. Repetitive use can load tendons and joints; the response depends on intensity, duration, recovery and individual vulnerability.`},{h:"The lower limb and foot",p:`The femur is the longest and strongest bone, transferring load from the pelvis to the knee. The tibia bears most of the lower-leg load, while the fibula provides attachment and lateral stability without carrying much body weight. The tarsals and metatarsals form the arches of the foot; the calcaneus (heel bone) is the largest tarsal, and the patella is a sesamoid.

The foot demonstrates active shock management. Arches are supported by bone shape, ligaments and muscle activity, and they adapt to footwear and loading. Bone stress injuries in the foot are more common when load increases faster than tissue tolerance — useful context for people increasing walking or running distance.`,fig:"gait",cap:"Figure 11.1 — Walking uses alternating stance and swing phases, with force transmitted through a changing base of support."},{h:"Implications across life",p:`Growth, menstruation, nutrition, illness and load affect bone development. In children, growth plates are weaker than the surrounding bone and are vulnerable to specific injury patterns; training should be supervised and appropriate. In older adults, loss of trabecular bone at the ends of long bones and in the spine increases fragility fracture risk, especially with falls.

Bone shape and density are not the only determinants of injury. Muscle strength, balance, technique, footwear, fatigue and training progression all contribute. An educational plan should consider the whole person and modify load rather than insist on completing a programme.`}],terms:[["Callus","Temporary repair tissue formed around a fracture that is progressively replaced by new bone."],["Arch of the foot","A curved arrangement of bones and ligaments that distributes load and stores elastic energy."],["Load tolerance","The amount of force tissue can currently withstand without injury; it changes with training and recovery."]],myth:["Thick leg bones mean you can safely increase training or impact load very quickly.","Bone strength does not protect tendons, joints or the nervous system from sudden overload. Progress gradually and allow recovery. Sudden increases in distance, intensity or impact are common contributors to overuse injury."],takeaways:["Skeletal regions combine different bone shapes for specialised tasks.","The foot manages load through arches, ligaments and active control.","Training tolerance includes muscle, tendon, bone and recovery capacity."],quiz:[{q:"Which bone is a sesamoid bone in the lower limb?",o:["Tibia","Fibula","Patella","Calcaneus"],a:2,e:"The patella is a sesamoid bone within the quadriceps tendon. The tibia and fibula are long bones; the calcaneus is a tarsal bone."},{q:"Which statement about load tolerance is most accurate?",o:["Bone density alone determines whether a training increase is safe","Load tolerance adapts with training and is affected by recovery, nutrition and prior injury","Pain during every session is a sign of successful adaptation","Rest is never part of a bone-health programme"],a:1,e:"Tissue tolerance is dynamic. Gradual loading supports adaptation, while abrupt increases, inadequate recovery and poor energy availability raise injury risk."}],refs:["acsm","aaos"]},{n:12,title:"Compact Bone and Spongy Bone",part:2,mins:10,summary:"Cortical bone forms a dense outer shell, while trabecular bone creates a load-bearing lattice; together they provide strength, lightness and energy absorption.",objectives:["Contrast cortical and trabecular bone in structure and function.","Explain how bone architecture affects strength.","Describe how ageing and disuse affect different bone types."],sections:[{h:"Cortical bone: the dense shell",p:`Cortical (compact) bone makes up about four-fifths of the skeleton by mass but has a much smaller surface area than trabecular bone. It forms the outer tube of long bones and the shell of flat and irregular bones. It is densely mineralised, resists bending and torsion, and is arranged in circular layers that convey load along the shaft.

Because cortical bone is dense, its cells are supplied by canals running through the tissue. It turns over more slowly than trabecular bone, but can still change with loading. Cortical thinning and increased porosity contribute to fragility in later life and to some types of atypical fracture associated with particular long-term treatments.`,fig:"compact-spongy",cap:"Figure 12.1 — Cortical shell and trabecular lattice. Trabeculae are not random; they follow lines of mechanical stress."},{h:"Trabecular bone: architecture under the surface",p:`Trabecular (spongy or cancellous) bone is a network of small struts and plates separated by marrow spaces. It fills the ends of long bones and the bodies of vertebrae, where it spreads loads over a wide area and absorbs energy before transferring force. Its surface area is large, which supports metabolic exchange and rapid turnover.

Trabecular architecture can be understood as a load-following structure. Loss of horizontal cross-struts can reduce strength disproportionately even when total bone mineral is not dramatically lowered. This is one reason why a simple density measure does not capture every aspect of bone quality.`,list:[{title:"Cortical bone",text:"Dense, strong in bending and torsion; slower turnover; forms the outer shell."},{title:"Trabecular bone",text:"Lightweight lattice; high surface area and faster turnover; spreads load near joints and in vertebrae."},{title:"Both",text:"Respond to mechanical and hormonal signals and contribute to fracture resistance."}]},{h:"Ageing and disuse",p:`With age, trabecular plates can thin and perforate, while cortical bone may become more porous. Bone loss varies by sex, hormonal history, genetics, medication use, disease, nutrition and loading. Immobilisation can produce rapid loss in both compartments, and weightlessness or prolonged bed rest is a potent reminder that loading is a biological signal.

Bone quantity and quality interact with fall risk. Preventing a fall can matter as much for fracture prevention as improving a scan score. Strength, balance, vision, footwear, lighting, home hazards and medication side effects are all relevant, and a comprehensive approach is more useful than focusing on one element.`}],terms:[["Cortical bone","The dense outer bone tissue that resists bending and torsion; also called compact bone."],["Trabecular bone","A network of plates and struts inside bone; also called cancellous or spongy bone."],["Bone quality","Aspects of bone beyond mineral density, including architecture, material properties and accumulated damage."]],myth:["A normal bone density scan means bone structure is completely healthy.","Density is one contributor to strength. Trabecular architecture, cortical porosity, accumulated microdamage and fall risk all affect fracture. A clinician integrates the scan with history and other risk factors."],takeaways:["Cortical and trabecular bone carry different loads and turn over at different rates.","Trabecular architecture is load-sensitive and especially relevant at the spine and hip.","Fracture prevention combines bone health with fall prevention and clinical risk management."],quiz:[{q:"Which property best characterises trabecular bone?",o:["It is completely solid","It forms a load-bearing lattice with a high surface area","It turns over more slowly than cortical bone","It is found only in the skull"],a:1,e:"Trabecular bone is a lattice of plates and struts. Its large surface area and faster remodelling make it responsive to hormonal and mechanical signals."},{q:"What can happen during prolonged immobilisation?",o:["Bone and muscle can rapidly lose mass as loading signals are reduced","Bone mass always increases","Cartilage is converted to tendon","Vitamin D production increases dramatically"],a:0,e:"Unloading accelerates resorption relative to formation and reduces muscle mass. Recovery requires graded loading under appropriate guidance."}],refs:["niams-bone","nih-calcium"]}],Mg=[{n:13,title:"Bone Marrow and Its Functions",part:2,mins:9,summary:"Bone marrow is a specialised tissue inside bones where blood cells are produced, immune cells mature and fat is stored — linking the skeleton to the blood and immune systems.",objectives:["Distinguish red and yellow marrow.","Describe where marrow is found and how it changes with age.","Explain the relationship between marrow, blood and bone."],sections:[{h:"Two types of marrow",p:`Red marrow is the blood-forming tissue. It contains haematopoietic stem cells that give rise to red blood cells, platelets and most white blood cells, supported by a complex microenvironment of blood vessels, fat cells and signalling molecules. In infants, most marrow is red. With age, much of it is replaced by yellow marrow, which stores fat and can expand or shrink with nutritional state.

Red marrow persists mainly in the pelvis, sternum, ribs, vertebrae, skull and the upper ends of the femur and humerus. Imaging can show marrow changes, and a clinician may order a biopsy when a blood disorder is suspected. Marrow findings must be interpreted together with blood tests and the person's history.`,fig:"long-bone",cap:"Figure 13.1 — Marrow occupies the medullary cavity and the spaces among trabeculae, especially near the ends of long bones."},{h:"The marrow niche",p:`Bone-forming and bone-resorbing cells share the marrow environment with blood-forming cells. Signals from bone cells can influence blood cell production, and blood cells can influence bone remodelling. This reciprocity helps explain connections between blood, immune and skeletal disorders.

The marrow is also a site where some cancers arise or spread. Unexplained persistent bone pain, anaemia, unusual bruising or recurrent infections should be evaluated professionally; these are not self-diagnosable through lifestyle questionnaires.`},{h:"Marrow fat and fuel",p:`Yellow marrow is largely adipose tissue and is a substantial fat store. Its amount changes with age, nutritional status and some diseases. Marrow fat is not inert: it produces signals that can affect bone and blood formation, an area of active research rather than settled clinical practice.

Readers cannot directly 'improve' marrow with a particular food or supplement. General health behaviours — avoiding smoking, treating nutritional deficiencies, maintaining activity, and seeking care for persistent symptoms — are more grounded than promises aimed at marrow.`}],terms:[["Haematopoiesis","Formation of blood cells, including red cells, white cells and platelets, from stem cells."],["Yellow marrow","Fat-rich marrow that replaces much red marrow with age and serves as an energy reserve."],["Marrow niche","The specialised cellular and molecular environment that supports stem cells and bone cells."]],myth:["Marrow is a minor part of bone with no role beyond filling space.","Marrow is a major organ of blood and immune cell production and interacts actively with bone cells. Its health is clinically important, especially in blood cancers, anaemia and immune disorders."],takeaways:["Red marrow forms blood cells; yellow marrow stores fat.","Bone and marrow communicate through shared cellular signals.","Persistent unexplained bone or blood symptoms require professional assessment."],quiz:[{q:"What is the main function of red marrow?",o:["Storing fat only","Producing blood cells","Secreting bile","Producing synovial fluid"],a:1,e:"Red marrow contains haematopoietic stem cells and is the primary site of blood cell production in adults."},{q:"Where is red marrow most likely to persist in a healthy older adult?",o:["Only in the fingers","Pelvis, sternum, vertebrae and ribs","The lens of the eye","The patella only"],a:1,e:"Adults have red marrow mainly in the axial skeleton — pelvis, sternum, ribs, vertebrae, skull — and near the proximal ends of long bones."}],refs:["niams-bone","aaos"]},{n:14,title:"The Microscopic Structure of Bone",part:2,mins:10,summary:"At the microscopic scale, bone is a composite of collagen fibres and mineral crystals, organised into lamellae, osteons and canal systems that support load while allowing exchange.",objectives:["Describe the osteon and its lamellae.","Explain the roles of collagen and hydroxyapatite.","Recognise canal systems and how nutrients reach bone cells."],sections:[{h:"A composite material",p:`Bone matrix is about one-third organic and two-thirds mineral by weight, with water. The organic component is chiefly type I collagen, which gives tensile strength and flexibility. The mineral component is a carbonated hydroxyapatite, which gives compressive stiffness and hardness. Together they behave like reinforced concrete: a brittle mineral phase strengthened by a flexible fibre phase.

This composite design helps bone resist both stretching and compression. It also explains why mineral deficiency can soften bone (as in osteomalacia) while high mineral content with a damaged collagen matrix — as in osteogenesis imperfecta — can make it brittle. Bone strength is not simply the quantity of calcium.`,fig:"osteon",cap:"Figure 14.1 — A cortical osteon: concentric lamellae around a central canal, linked by small canaliculi."},{h:"Lamellae, osteons and canals",p:`In cortical bone, collagen fibres are organised in layers called lamellae. Many lamellae are arranged concentrically around a central canal containing blood vessels and nerves, forming an osteon or Haversian system. Osteons run roughly parallel to the long axis of the bone. Transverse Volkmann canals connect neighbouring osteons and the outer surface to the central network.

Osteocytes sit within small spaces called lacunae and extend long processes through narrow canaliculi. These processes connect to those of other osteocytes and to the central canal, forming a communication network. Blood flow is essential; a fracture that disrupts the blood supply delays healing.`,table:{head:["Component","Main composition","Contribution"],rows:[["Organic matrix","Type I collagen and other proteins","Tensile strength, flexibility and scaffold for mineral"],["Mineral phase","Carbonated hydroxyapatite crystals","Compressive strength and stiffness"],["Osteon","Concentric lamellae around a central canal","Structural unit of dense cortical bone"],["Canaliculi","Microscopic channels","Allow osteocyte communication and nutrient transport"]]}},{h:"Microdamage and repair",p:`Repeated loading can create microscopic cracks in bone. This is normal, and targeted remodelling repairs much of it. When damage accumulates faster than repair — from extreme repetitive loading, fatigue or disease — a stress injury may develop.

Cancer treatments and some medications can alter bone remodelling and its microarchitecture. This is one reason imaging and treatment decisions are made by specialists who can weigh benefits and risks. Bone microstructure is also studied with high-resolution imaging, but routine clinical decisions are usually based on broader measures and fracture risk assessment.`,fig:"compact-spongy",cap:"Figure 14.2 — Dense cortical bone and porous trabecular bone differ in arrangement but share the same collagen–mineral composite."}],terms:[["Osteon","A cylindrical unit of cortical bone with concentric lamellae around a central vascular canal."],["Collagen","A family of structural proteins; type I collagen is the main organic component of bone."],["Hydroxyapatite","The calcium phosphate mineral that reinforces bone and teeth."]],myth:["Bone strength is determined only by how much calcium it contains.","Strength depends on mineral content plus the collagen matrix, architecture, accumulated damage and repair capacity. A mineral-rich but poorly organised or damaged bone may still fracture."],takeaways:["Bone is a composite of collagen and mineral, giving complementary mechanical properties.","Osteons and canal networks support cortical bone's mechanical role and cell survival.","Microdamage is normal when repaired; overload can tip the balance towards injury."],quiz:[{q:"Which best describes the composition of bone?",o:["Only calcium crystals","A collagen-rich organic matrix mineralised with hydroxyapatite","Smooth muscle and fat","Cartilage without cells"],a:1,e:"Bone is a composite: type I collagen and other proteins form a framework that mineral crystals reinforce, creating both flexibility and stiffness."},{q:"What is a central canal of an osteon?",o:["A channel carrying blood vessels and nerves","The cavity that produces synovial fluid","The space occupied by articular cartilage","A tear in a ligament"],a:0,e:"Central canals carry blood vessels and nerves through cortical bone. Canaliculi connect osteocytes to this supply."}],refs:["niams-bone","aaos"]},{n:15,title:"Osteoblasts, Osteoclasts and Osteocytes",part:2,mins:10,summary:"Bone remodelling is a conversation between builder cells, resorbing cells and long-lived sensor cells, coordinated by mechanical and hormonal signals.",objectives:["Describe the roles of osteoblasts, osteoclasts and osteocytes.","Explain how their balance determines bone mass and repair.","Give examples of conditions that shift remodelling."],sections:[{h:"The three key cells",p:`Osteoblasts are bone-forming cells. They synthesise the organic matrix, regulate its mineralisation and help control resorption through signalling. Some become osteocytes, which are embedded in bone and act as mechanosensors; others line the bone surface or become inactive. Osteocytes detect strain and microdamage and influence remodelling by releasing signals that recruit osteoclasts and osteoblasts.

Osteoclasts are large, multinucleated cells that dissolve bone mineral and digest matrix. They are essential for growth, repair and calcium mobilisation, but excessive activity produces bone loss. Their formation is influenced by hormonal and inflammatory signals, including oestrogen withdrawal, parathyroid hormone, vitamin D and cytokines.`,fig:"osteon",cap:"Figure 15.1 — Osteocytes within lacunae sit in a communication network; osteoblasts work at the surface; osteoclasts resorb bone."},{h:"Coupling keeps balance",p:`Remodelling is coupled: resorption is normally followed by formation in the same site. When resorption outpaces formation, bone is lost. This imbalance accelerates after menopause and can occur with immobility, inflammation, some medicines and endocrine disease. When formation hyperstimulates without adequate quality, bone mass may rise but structure can be abnormal — as in some rare hereditary or metabolic conditions.

The body does not separately 'clean' and 'build' bone. A coordinated sequence of activation, resorption, reversal and formation replaces old bone. That cycle takes time, and recovery after major illness or immobilisation cannot be forced by a single supplement.`,list:[{title:"Osteoblast",text:"Builds new bone matrix and helps regulate mineralisation."},{title:"Osteoclast",text:"Resorbs old or damaged bone; essential but damaging in excess."},{title:"Osteocyte",text:"Senses loading and damage; coordinates repair and remodelling."}]},{h:"From cells to clinical conditions",p:`In osteoporosis, increased resorption and reduced formation reduce bone quantity and quality, raising fragility fracture risk. In Paget disease, localised remodelling becomes disorganised and bone may enlarge and weaken. In cancer that has spread to bone, tumour signals can trigger excess resorption and pain. Some older bone-density medicines reduce osteoclast activity, while anabolic treatments increase bone formation.

Readers should not attempt to speed or suppress bone cell activity through self-prescribed supplements. Medications that act on bone remodelling are prescribed and monitored by clinicians, with attention to benefits, side effects and rare risks.`}],terms:[["RANKL","A signalling molecule involved in osteoclast formation and activity; targeted by certain osteoporosis medicines."],["Mechanosensor","A cell that detects mechanical strain and converts it into biological signals."],["Coupling","The coordinated link between bone resorption and subsequent formation."]],myth:["Bone remodelling is a cleaning process that a diet or supplement can switch on at will.","Remodelling is a regulated multicellular process. Nutrition and loading influence it, but therapeutically important manipulation of resorption or formation requires clinician-prescribed treatment and monitoring."],takeaways:["Osteoblasts build, osteoclasts resorb and osteocytes sense and coordinate.","Conditions affecting bone often reflect a shift in the remodelling balance or its regulation.","Drugs targeting bone cells can be valuable but require clinical oversight."],quiz:[{q:"Which cell forms new bone matrix?",o:["Osteocyte","Osteoclast","Osteoblast","Chondrocyte"],a:2,e:"Osteoblasts synthesise bone matrix and contribute to mineralisation. Chondrocytes make cartilage; osteoclasts resorb bone."},{q:"What happens when resorption chronically exceeds formation?",o:["Bone mass and quality can decline, increasing fracture risk","Muscle is converted into tendon","Joint fluid increases permanently","Bone always becomes stronger"],a:0,e:"Imbalance can cause bone loss and deterioration of architecture. Causes include oestrogen withdrawal, inflammation, immobility and some medications."}],refs:["niams-osteoporosis","ros"]},{n:16,title:"Bone Formation, Growth and Development",part:2,mins:10,summary:"Bone forms by ossification, grows through endochondral and appositional mechanisms, and reaches its adult architecture through childhood, adolescence and early adulthood.",objectives:["Contrast endochondral and intramembranous ossification.","Explain how long bones lengthen and widen.","Describe what happens at a growth plate."],sections:[{h:"Two routes of bone formation",p:`Most limb and axial bones form through endochondral ossification: a cartilage template is gradually replaced by bone. This begins before birth and continues at growth plates until they fuse. Flat bones of the skull and part of the clavicle form directly from mesenchymal tissue through intramembranous ossification, without a cartilage model.

Both processes require adequate energy, protein, minerals, hormones and oxygen. Bone formation is not simply mineral deposition; it requires a collagen scaffold, specialised cells and a blood supply. Interference with these during growth can cause lasting structural effects.`,fig:"long-bone",cap:"Figure 16.1 — Growth plate regions: resting cartilage, proliferating cartilage, hypertrophic cartilage, calcification and bone formation."},{h:"Growing longer and wider",p:`Longitudinal growth occurs at the epiphyseal plate, where columns of cartilage cells proliferate, enlarge and are progressively replaced by bone. Growth hormone, sex hormones, thyroid hormone, insulin-like growth factor 1 and nutrition influence this process. Puberty produces a rapid growth spurt, after which the plates gradually close.

Bones also grow wider by appositional growth: osteoblasts add bone to the outer surface while osteoclasts reshape the inner surface, maintaining appropriate cortical thickness. This process continues into adulthood at a slower pace and remodels throughout life.`,fig:"life-stages",cap:"Figure 16.2 — The growth plate is temporary; its closure marks the end of lengthening but not the end of bone remodelling."},{h:"Growth plate vulnerability",p:`The growth plate is mechanically weaker than adjacent bone. Injuries in children may involve the plate rather than a ligament, and some patterns risk growth disturbance. A child with significant joint injury or persistent growth-related pain should be assessed by a qualified clinician rather than being advised simply to push through.

Nutritional deficiencies, chronic illness and excessive sports loading during growth can affect bone development and, in some cases, the menstrual cycle in girls. Early evaluation of delayed puberty, restrictive eating or persistent pain is important. Conversely, supervised varied activity supports bone development and does not 'damage' normal growth.`}],terms:[["Endochondral ossification","Bone formation in which a cartilage template is replaced by bone."],["Growth plate","The cartilaginous region near the end of a growing long bone where longitudinal growth occurs."],["Appositional growth","Increase in bone diameter through deposition on the outer surface and remodelling inside."]],myth:["A serious growth-plate injury always shows an obvious deformity or can always be seen clearly on a first X-ray.","Some growth-plate and stress injuries are subtle. Persistent pain, inability to use the limb normally or a concerning mechanism should be professionally assessed, with imaging interpreted in context."],takeaways:["Bones form by cartilage replacement or direct ossification.","Growth in length occurs at plates, while width increases by appositional remodelling.","Growing bones need cautious, individually appropriate loading and adequate nutrition."],quiz:[{q:"What replaces the cartilage template during endochondral ossification?",o:["Synovial fluid","Bone tissue","Adipose tissue only","Skeletal muscle"],a:1,e:"Endochondral ossification progressively replaces a cartilage model with bone. This process builds most limb and vertebral bones."},{q:"Which statement about growth plates is accurate?",o:["They remain open throughout life","They are a weak point and can be injured in young athletes","They are found only in the skull","They produce red blood cells"],a:1,e:"Growth plates are cartilaginous regions where long bones lengthen. They are vulnerable during growth and fusing in adolescence, so persistent pain and injury need proper assessment."}],refs:["niams-bone","aaos"]},{n:17,title:"Introduction to Human Joints",part:3,mins:9,summary:"A joint is where bones meet. Joints vary from rigid seams that protect and stabilise to complex synovial joints that allow precise, lubricated movement.",objectives:["Define a joint and its main functions.","Recognise the relationship between mobility and stability.","Name the major joints of the body."],sections:[{h:"Where bones meet",p:`A joint, or articulation, is the region where two or more bones meet. Some joints are built for stability and transmission of force (such as the sutures of the skull), while others allow large ranges of movement (such as the shoulder). The musculoskeletal system continuously balances these priorities.

Joints contain several tissue types depending on their design: articular cartilage, a joint capsule, synovial membrane, ligaments, tendons and sometimes menisci, discs or labra. Joints also contain nerve endings that contribute to position sense and pain. A joint is therefore an organ system in miniature, not simply a gap between bones.`,fig:"joint-types",cap:"Figure 17.1 — Joints classified by structure and mobility, from fibrous sutures to freely mobile synovial joints."},{h:"Naming major joints",p:`The body's major joints include the temporomandibular joints, the intervertebral joints of the spine, the shoulder (glenohumeral) joints, elbows, wrists, hips, knees and ankles. The hands and feet contain many small joints that enable fine movement and load adaptation.

Joint pain can be perceived locally or referred from elsewhere. For example, hip pathology may present as groin or thigh pain, while knee or spinal problems can also produce overlapping symptoms. Readers should not self-diagnose the source of pain from its location alone.`,table:{head:["Joint","Type","Main movement emphasis"],rows:[["Hip","Ball and socket (synovial)","Weight-bearing stability with wide multi-axis movement"],["Knee","Modified hinge (synovial)","Flexion, extension and limited rotation under load"],["Shoulder","Ball and socket (synovial)","Large range, dependent on dynamic stabilisers"],["Elbow","Hinge","Flexion and extension with forearm rotation nearby"],["Ankle","Hinge-like","Dorsiflexion and plantarflexion for gait"]]}},{h:"Mobility–stability trade-off",p:`Generally, a shallower joint offers more mobility at the cost of stability; a deeper or more constrained joint offers stability with less movement. The shoulder has a large range and frequently relies on muscles of the rotator cuff and scapular stabilisers. The hip is deeper and built to bear load, yet retains a wide range.

This trade-off is not fixed by anatomy. Training, injury, fatigue and confidence change control. A joint can be mobile but unstable, or stiff but reliable in a limited range. Rehabilitation aims for the range and control a person needs, not maximal flexibility for its own sake.`}],terms:[["Articulation","A joint; the anatomical connection between bones."],["Glenohumeral joint","The shoulder joint between the humeral head and the glenoid cavity of the scapula."],["Referred pain","Pain perceived at a site distant from the tissue generating the signal."]],myth:["A flexible joint is always a healthy joint.","Mobility without control can increase injury risk. Healthy joints offer a useful range that the person can stabilise and use. Goals depend on the person, activity and tissue tolerance."],takeaways:["Joints are complex organs containing cartilage, capsule, ligaments and nerves.","Anatomical design balances mobility against stability.","Pain location does not reliably identify its source without assessment."],quiz:[{q:"Which is the shoulder (glenohumeral) joint type?",o:["Fibrous suture","Ball and socket","Cartilaginous symphysis","Syndesmosis"],a:1,e:"The shoulder is a ball-and-socket synovial joint. Its wide range means dynamic stabilisers, including the rotator cuff, are especially important."},{q:"What is the general trade-off in joint design?",o:["More mobility usually demands more stabilising control","Joint fluid prevents all movement","Larger range always means stronger bone","Cartilage generates the force for movement"],a:0,e:"Shallow joints allow a wide range but need passive and active stabilisers. Muscle generates force; cartilage distributes load and reduces friction."}],refs:["aaos","acsm"]},{n:18,title:"Structural Classification of Joints",part:3,mins:9,summary:"Joints can be classified by structure — fibrous, cartilaginous or synovial — and by function as synarthrosis, amphiarthrosis or diarthrosis.",objectives:["Classify joints structurally and functionally.","Give examples of each joint category.","Explain why classification matters in clinical practice."],sections:[{h:"Structural and functional systems",p:`Structural classification groups joints by the tissue that binds them: fibrous joints are united by dense connective tissue, cartilaginous joints by cartilage, and synovial joints by a fluid-filled capsule. Functional classification describes movement: synarthroses are essentially immovable, amphiarthroses are slightly movable, and diarthroses are freely movable. Synovial joints are generally diarthroses.
