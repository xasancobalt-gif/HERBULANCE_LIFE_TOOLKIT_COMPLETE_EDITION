ract with medicines and is regulated differently by country.",see:["Adaptogen","Supplement"]},{term:"Heart rate variability (HRV)",def:"Variation in time between heartbeats, linked to autonomic regulation. Research use is complex; not a stress score.",see:["Autonomic nervous system"]},{term:"Hippocampus",def:"A brain structure important for memory and context, sensitive to some effects of stress.",see:["Memory"]},{term:"HPA axis",def:"Hypothalamic-pituitary-adrenal axis. A hormonal system linking brain and adrenal glands to regulate stress hormones.",see:["Cortisol","Negative feedback"]},{term:"Hyperarousal",def:"A state of heightened alertness that can interfere with rest and concentration.",see:["Insomnia"]},{term:"Hypothalamus",def:"A brain region coordinating hormonal and autonomic responses.",see:["HPA axis"]},{term:"Insomnia",def:"Persistent difficulty falling or staying asleep with daytime effects. Requires assessment if persistent.",see:["Sleep hygiene"]},{term:"Interoception",def:"Awareness of internal bodily signals such as heartbeat and breathing.",see:["Bodily feedback"]},{term:"Isolation",def:"Objective lack of social contact. Distinct from loneliness, which is a subjective feeling.",see:["Loneliness"]},{term:"Journaling",def:"Writing to reflect, process or plan. Used in many contexts.",see:["Expressive writing"]},{term:"Loneliness",def:"The distressing feeling of a gap between desired and actual social connection.",see:["Isolation","Social support"]},{term:"Loving-kindness practice",def:"A meditation cultivating warm wishes toward oneself and others.",see:["Meditation"]},{term:"Melatonin",def:"A hormone involved in signalling night-time to the body. Supplement use should be discussed with a clinician.",see:["Circadian rhythm"]},{term:"Mindfulness",def:"Paying attention to present experience with openness and without automatic judgement.",see:["Meditation"]},{term:"Microbiota",def:"The community of microorganisms living in the body, especially the gut.",see:["Gut-brain axis"]},{term:"Meditation",def:"Diverse contemplative practices training attention or awareness.",see:["Mindfulness"]},{term:"Negative feedback",def:"A regulatory loop where an output reduces further activation, as cortisol does on the HPA axis.",see:["HPA axis"]},{term:"Neuroplasticity",def:"The brain's capacity to change in structure and function through experience. Not a quick fix; changes are gradual.",see:["Learning"]},{term:"Noradrenaline",def:"Also called norepinephrine. A neurotransmitter and hormone involved in arousal and attention.",see:["Adrenaline"]},{term:"Occupational stress",def:"Stress arising from work demands, control, relationships and rewards.",see:["Burnout"]},{term:"Open monitoring",def:"A meditation style observing whatever arises without focusing on one object.",see:["Focused attention"]},{term:"Parasympathetic nervous system",def:"The autonomic branch associated with rest, digestion and recovery.",see:["Sympathetic nervous system"]},{term:"Peripheral nervous system",def:"Nerves outside the brain and spinal cord.",see:["Central nervous system"]},{term:"Perspective-taking",def:"Considering a situation from another person's viewpoint.",see:["Empathy"]},{term:"Post-traumatic stress",def:"Clinical symptoms following trauma. Requires professional assessment.",see:["Trauma"]},{term:"Prefrontal cortex",def:"Frontal brain regions supporting planning, working memory and flexible control of behaviour.",see:["Executive function"]},{term:"Problem-focused coping",def:"Coping that addresses the source of a stressor.",see:["Coping strategy"]},{term:"Progressive muscle relaxation",def:"Tensing then releasing muscle groups to increase awareness of tension.",see:["Muscle tension"]},{term:"Psychotherapy",def:"Psychological treatment delivered by trained professionals.",see:["Cognitive behavioural therapy"]},{term:"Psychological resilience",def:"Adapting well after adversity through many interacting factors.",see:["Protective factor"]},{term:"Protective factor",def:"A factor that reduces risk or supports wellbeing, such as social support or stable housing.",see:["Psychological resilience"]},{term:"Recovery",def:"Return of systems to baseline after demand, through rest, sleep and social support.",see:["Rest"]},{term:"Reappraisal",def:"See Cognitive reappraisal.",see:["Cognitive reappraisal"]},{term:"Respite",def:"Temporary relief for caregivers, through services or others.",see:["Caregiver strain"]},{term:"Rest",def:"Periods of reduced demand that support recovery. A basic need, not a reward.",see:["Recovery"]},{term:"Resilience",def:"See Psychological resilience.",see:["Psychological resilience"]},{term:"Rumination",def:"Repetitive, passive focus on distress and its causes, often without resolution.",see:["Worry","Repetitive negative thinking"]},{term:"Repetitive negative thinking",def:"Repetitive thought focused on negative content, including worry and rumination.",see:["Rumination"]},{term:"Salience",def:"The quality of standing out as important, which the amygdala contributes to detecting.",see:["Amygdala"]},{term:"Self-compassion",def:"Kindness toward oneself during difficulty, recognising shared humanity and mindful awareness.",see:["Self-esteem"]},{term:"Self-esteem",def:"An overall evaluation of one's own worth.",see:["Self-compassion"]},{term:"Self-criticism",def:"Harsh judgement of oneself, often linked with rumination.",see:["Self-compassion"]},{term:"Shame",def:"A painful feeling focused on the self as flawed. Often less helpful than guilt.",see:["Guilt"]},{term:"Sleep hygiene",def:"Habits supporting sleep, such as regular wake times and reduced evening light.",see:["Insomnia"]},{term:"Social support",def:"Help, connection and encouragement from others, including emotional, practical and informational forms.",see:["Loneliness"]},{term:"Stressor",def:"An event or condition placing demands on a person.",see:["Stress response"]},{term:"Stress response",def:"The coordinated physiological and psychological reaction to a stressor.",see:["Stressor"]},{term:"Suppression",def:"Holding back the outward expression of emotion. Has some costs when used habitually.",see:["Emotional regulation"]},{term:"Sympathetic nervous system",def:"The autonomic branch associated with mobilisation and alertness.",see:["Parasympathetic nervous system"]},{term:"Thought record",def:"A written tool noting a situation, thought, feeling and alternative view.",see:["Cognitive distortion"]},{term:"Threat detection",def:"Brain and body processes that identify potential danger.",see:["Amygdala"]},{term:"Transactional model",def:"Lazarus and Folkman's model of stress as a relationship between person and environment through appraisal.",see:["Appraisal"]},{term:"Trauma",def:"Experience overwhelming a person's capacity to cope. Responses vary widely.",see:["Trauma-informed care","Post-traumatic stress"]},{term:"Trauma-informed care",def:"An approach emphasising safety, trust, choice, collaboration and cultural respect.",see:["Trauma"]},{term:"Triggers",def:"Cues that bring up strong emotional responses, often linked to past experiences.",see:["Trauma"]},{term:"Vagus nerve",def:"A major nerve linking brain and many organs, involved in autonomic and gut communication.",see:["Gut-brain axis"]},{term:"Wellbeing",def:"A broad state including emotional, physical, social and psychological functioning.",see:["Protective factor"]},{term:"Working memory",def:"Short-term capacity to hold and manipulate information.",see:["Cognitive load"]},{term:"Worry",def:"Repetitive thinking about possible future problems.",see:["Anxiety","Rumination"]},{term:"Worry loop",def:"A cycle in which concern leads to imagined outcomes and returns to concern without resolution.",see:["Worry"]},{term:"Allostatic state",def:"A condition in which allostatic systems are adjusted to sustained demand.",see:["Allostasis"]},{term:"Assessment",def:"A professional evaluation conducted by a qualified clinician.",see:["Professional support"]},{term:"Professional support",def:"Care from qualified clinicians, counsellors, or other trained professionals.",see:["Assessment"]},{term:"Body scan",def:"A guided attention practice moving through body areas. Can be stopped at any time.",see:["Mindfulness"]},{term:"Focused attention",def:"A meditation style keeping attention on a single object such as the breath.",see:["Open monitoring"]},{term:"Gentle movement",def:"Low-intensity activity such as stretching, walking or tai chi.",see:["Physical activity"]},{term:"Physical activity",def:"Bodily movement producing energy expenditure, including daily tasks and exercise.",see:["Gentle movement"]},{term:"Hydration",def:"Maintaining adequate fluid intake, which varies with climate, activity and health.",see:["Nutrition"]},{term:"Nutrition",def:"Intake of nutrients through food; supports general health.",see:["Hydration"]},{term:"Food insecurity",def:"Limited or uncertain access to adequate food due to money or other constraints.",see:["Nutrition"]},{term:"Emotional eating",def:"Eating in response to feelings rather than hunger. Common and understandable.",see:["Appetite"]},{term:"Appetite",def:"Desire for food, influenced by hormones, habits, emotion and environment.",see:["Emotional eating"]},{term:"Caffeine",def:"A stimulant found in coffee, tea and other products. May affect sleep and anxiety in some people.",see:["Sleep hygiene"]},{term:"Alcohol",def:"A depressant that can disrupt sleep and mood. Dependence needs professional help.",see:["Substance use"]},{term:"Substance use",def:"Use of alcohol, drugs or other substances; problematic use may need support.",see:["Alcohol"]},{term:"Burnout risk factor",def:"Workplace features such as high demands and low control that are linked to burnout.",see:["Burnout"]},{term:"Vulnerability",def:"Increased susceptibility to harm due to circumstances. Structural factors often contribute.",see:["Protective factor"]},{term:"Mental-health condition",def:"A clinically recognised pattern of symptoms requiring assessment.",see:["Assessment"]},{term:"Emergency plan",def:"A personal plan listing safe contacts and crisis numbers for distress.",see:["Crisis line"]},{term:"Neurotransmitter",def:"A chemical messenger transmitting signals between neurons.",see:["Noradrenaline"]},{term:"Cortisol awakening response",def:"A rise in cortisol in the first 30–45 minutes after waking. Its meaning is still debated.",see:["Cortisol"]},{term:"Immune system",def:"Cells and signals that defend the body against infection and injury.",see:["Inflammation"]},{term:"Inflammation",def:"A regulated immune response to injury or infection. Chronic inflammation is complex.",see:["Immune system"]},{term:"Muscle tension",def:"Sustained contraction of muscles, which can be increased by stress and posture.",see:["Progressive muscle relaxation"]},{term:"Expressive writing",def:"Writing about emotional experiences, a method studied in research with mixed results.",see:["Journaling"]}],br=[{id:"nimh-stress",authors:"National Institute of Mental Health (NIMH)",title:"Stress (health topic page)",date:"Latest revision per website",source:"NIMH, National Institutes of Health",url:"https://www.nimh.nih.gov/health/topics/stress",category:"Public health agency",jurisdiction:"United States",chapters:[1,2,3,17,18,24,27,46,50,51,55]},{id:"nhs-mh",authors:"NHS England",title:"Mental health (self-help and support information)",date:"Latest revision per website",source:"National Health Service (UK)",url:"https://www.nhs.uk/mental-health/",category:"Government health information",jurisdiction:"United Kingdom",chapters:[4,6,9,11,12,13,14,17,20,30,35,36,37,43,46,49,50,52,55]},{id:"who-mh",authors:"World Health Organization",title:"Mental health: strengthening our response (fact sheet)",date:"Latest revision per website",source:"WHO",url:"https://www.who.int/news-room/fact-sheets/detail/mental-health-strengthening-our-response",category:"Public health agency",jurisdiction:"International",chapters ideline","Government health information","Peer-reviewed research","Systematic review / meta-analysis"],Hh=[{id:"breath",title:"Comfortable breathing awareness",minutes:"1–5 minutes",steps:["Sit or lie down in a position that feels supported.","Notice your breath without changing it for a moment.","Gently let the breath out a little longer than it came in, only if that feels comfortable.","Keep the pace easy. Let the breath be natural.","Finish by noticing your surroundings for a few seconds."],adapt:["Eyes open or closed.","Seated, standing or lying down.","Count breaths from 1 to 5 and start again, or simply notice."],stop:"Stop if you feel dizzy, faint, breathless or distressed. Do not hold your breath. Ask a clinician if you have a breathing or heart condition."},{id:"pmr",title:"Progressive muscle relaxation",minutes:"5–15 minutes",steps:["Settle into a comfortable seat or lying position.","Choose one muscle group, such as your hands. Tense gently for about 5 seconds, not to pain.","Release and notice the difference for 10–20 seconds.","Move through: shoulders, face, chest, abdomen, legs, feet.","End by resting for a minute and noticing how the body feels."],adapt:["Tense only one or two groups if preferred.","Skip any area that is injured, painful or recently operated on.","Seated versions work well at a desk."],stop:"Stop if cramping, pain or distress arises. This is optional and you can adapt or stop at any time."},{id:"ground",title:"Five-senses grounding",minutes:"2–5 minutes",steps:["Name five things you can see.","Notice four things you can feel (for example, your feet on the floor).","Listen for three sounds.","Notice two smells, or two gentle scents if available.","Notice one taste, or sip water."],adapt:["Use only the senses that feel comfortable.","Describe things silently or aloud."],stop:"If grounding brings up distressing memories, stop and contact a trusted person or professional."},{id:"walk",title:"Mindful walking",minutes:"5–20 minutes",steps:[  recovery","Whether it is physical","Whether it is pleasant"],answer:1,why:"Chronic stress persists over weeks or months with limited recovery (Chapter 7).",chapter:1},{q:"Appraisal theory suggests that:",options:["Stress is identical for everyone","Interpretation and resources shape the stress response","Only objective events matter","Stress cannot be studied"],answer:1,why:"Lazarus and Folkman's transactional model emphasises appraisal and resources (Chapter 1).",chapter:1},{q:"Fight, flight and freeze are best described as:",options:["Rare pathological states","Common defensive responses to threat","Only found in animals","Caused by caffeine"],answer:1,why:"These are common defensive patterns (Chapter 2).",chapter:2},{q:"Why can a useful survival response become difficult?",options:["It never becomes difficult","Repeated activation without recovery, especially from modern stressors","Only when we sleep","Only when we exercise"],answer:1,why:"Frequent activation without recovery is the core concern (Chapter 2, 7).",chapter:2},{q:"Which brain region is most associated with planning and flexible control?",options:["Prefrontal cortex","Spinal cord","Kidney","Liver"],answer:0,why:"The prefrontal cortex supports planning and control (Chapter 3).",chapter:3},{q:"The hypothalamus is important in stress because it:",options:["Digests food","Coordinates hormonal and autonomic responses","Produces red blood cells","Filters blood"],answer:1,why:"The hypothalamus coordinates responses including HPA signalling (Chapter 3, 6).",chapter:3},{q:"The autonomic nervous system regulates:",options:["Only voluntary movement","Involuntary functions such as heart rate and digestion","Only memory","Only vision"],answer:1,why:"The autonomic system controls involuntary functions (Chapter 4).",chapter:4},{q:"The enteric nervous system is:",options:["A network within the gut wall","A part of the eye","The same as the spinal cord","A hormone"],answer:0,why:"It is a gut-wall neural network (Chapter 4, 9).",chapter:4},{q:'Simplified labels like "switching your nervous system off" are:',options:["Fully supported","Not supported by research","Required for therapy","Proven by brain scans"],answer:1,why:"Autonomic regulation is complex; such labels oversimplify (Chapter 4).",chapter:4},{q:"Adrenaline acts:",options:["Slowly over days","Quickly, within seconds","Only during sleep","Only after meals"],answer:1,why:"Adrenaline and noradrenaline act rapidly (Chapter 5).",chapter:5},{q:"Cortisol is released under control of:",options:["The HPA axis","The kidneys alone","The heart","The skin"],answer:0,why:"Cortisol release follows the HPA cascade (Chapter 6).",chapter:6},{q:"Negative feedback in the HPA axis:",options:["Increases cortisol forever","Dampens further hormone release","Has no role","Only works in children"],answer:1,why:"Cortisol feeds back to dampen release (Chapter 6).",chapter:6},{q:"Cortisol levels follow a daily rhythm that is typically:",options:["Constant all day","Highest in the early morning after waking","Highest at midnight","Random"],answer:1,why:"Cortisol is usually highest after waking and lowest around midnight (Chapter 6).",chapter:6},{q:"Why are single cortisol tests hard to interpret?",options:["They are always accurate","Levels vary with time, sleep, food, medication and illness","Cortisol does not exist","Only doctors can measure cortisol"],answer:1,why:"Many factors affect cortisol (Chapter 6).",chapter:6},{q:"Allostatic load is best described as:",options:["A home test result","A research concept of cumulative stress wear","A type of medicine","A diet"],answer:1,why:"It is a research framework (Chapter 7).",chapter:7},{q:"Which statement about long-term stress and heart health is most accurate?",options:["Stress alone causes heart disease","Stress is one contributor among many, with complex evidence","Stress never affects the heart","Heart symptoms are always caused by stress"],answer:1,why:"Evidence shows associations with many contributing factors (Chapter 8).",chapter:8},{q:"Chest pain should be:",options:["Attributed to stress","Assessed promptly by a medical professional","Treated with supplements","Ignored"],answer:1,why:"Chest symptoms require prompt medical evaluation (Chapter 8).",chapter:8},{q:"The gut and brain communicate through:",options:["Only the skin","Nerves, hormones, immune and microbial signals","Only blood pressure","Nothing"],answer:1,why:"Multiple pathways link gut and brain (Chapter 9).",chapter:9},{q:"Gut microbiota findings for stress are best described as:",options:["Fully established","Preliminary or developing","Disproven","Required reading only"],answer:1,why:"Much evidence is preliminary (Chapter 9).",chapter:9},{q:"Acute stress and immune responses:",options:["Always destroy immunity","Can change immune activity temporarily","Have no effect","Make vaccines useless"],answer:1,why:"Temporary changes occur; effects vary (Chapter 10).",chapter:10},{q:'A "immunity-boosting" product:',options:["Is guaranteed to prevent illness","Should be assessed critically; many claims lack evidence","Replaces vaccination","Has no ingredients"],answer:1,why:"Immunity-boosting claims are often unsupported (Chapter 10).",chapter:10},{q:"Persistent jaw pain or numbness should be:",options:["Endured","Evaluated by a clinician or dentist","Treated only with breath holds","Ignored after one week"],answer:1,why:"Persistent symptoms need evaluation (Chapter 11).",chapter:11},{q:"The relationship between stress and sleep is best described as:",options:["One-way only","Two-way and bidirectional","Non-existent","Only related to diet"],answer:1,why:"Stress and sleep influence each other (Chapter 12).",chapter:12},{q:"Hyperarousal can:",options:["Always improve sleep","Interfere with falling or staying asleep","Remove all stress","Cure insomnia"],answer:1,why:"Heightened alertness can disrupt sleep (Chapter 12).",chapter:12},{q:"Stress can affect appetite by:",options:["Always increasing it","Increasing or decreasing it, varying by person","Having no effect ever","Only affecting teeth"],answer:1,why:"Responses vary (Chapter 13).",chapter:13},{q:"Which is the most helpful response to emotional eating?",options:["Shame and punishment","Non-judgemental awareness and regular meals where possible","Extreme restriction","Ignoring food completely"],answer:1,why:"Food shame is unhelpful (Chapter 13).",chapter:13},{q:"Fatigue lasting several weeks with other symptoms should be:",options:["Assumed to be stress","Discussed with a medical professional","Treated with unknown supplements","Ignored"],answer:1,why:"Persistent fatigue merits assessment (Chapter 14).",chapter:14},{q:"Emotions are best understood as:",options:["Commands that must be obeyed","Information about meaningful events and needs","Always false","Only physical"],answer:1,why:"Emotions carry information, not commands (Chapter 15).",chapter:15},{q:"Which is a reappraisal example?",options:["Ignoring the problem","Reinterpreting a stressful event as a challenge with a possible learning value","Drinking alcohol","Avoiding all contact"],answer:1,why:"Reappraisal changes interpretation (Chapter 16).",chapter:16},{q:"Habitual suppression of emotion:",options:["Always improves outcomes","Has limits and may be less favourable in some studies","Is required by law","Cures anxiety"],answer:1,why:"Gross and John found differences; suppression has costs (Chapter 16).",chapter:16},{q:"Worry is best described as:",options:["Repetitive thinking about possible future problems","A diagnosis","Always pathological","A type of food"],answer:0,why:"Worry is repetitive future-oriented thinking (Chapter 17).",chapter:17},{q:"An anxiety disorder differs from everyday worry because:",options:["It is always mild","It is a clinical condition with persistent, impairing symptoms","It only happens to adults","It cannot be treated"],answer:1,why:"Clinical conditions are defined by persistence and impairment (Chapter 17).",chapter:17},{q:"Rumination is:",options:["Productive problem-solving","Repetitive focus on distress, often without resolution","A type of exercise","Always helpful"],answer:1,why:"Rumination is repetitive and passive (Chapter 18).",chapter:18},{q:"Which action can help interrupt a worry loop?",options:["Writing a concrete next step","Replaying the problem silently for hours","Avoiding all information","Drinking more coffee"],answer:0,why:"Concrete planning may interrupt loops (Chapter 18).",chapter:18},{q:"When anger involves threats or violence, the priority is:",options:["Confrontation","Safety","Recording the event","Waiting for it to pass alone"],answer:1,why:"Safety comes first (Chapter 19).",chapter:19},{q:"Forced positivity is:",options:["Always the best approach","Potentially harmful when it dismisses real difficulty","A clinical treatment","Required for recovery"],answer:1,why:"It can invalidate real experience (Chapter 20).",chapter:20},{q:"Self-compassion involves:",options:["Harsh self-judgement","Kindness toward oneself during difficulty","Ignoring mistakes","Lowering all standards"],answer:1,why:"Self-compassion is kindness, not indulgence (Chapter 21).",chapter:21},{q:"Guilt differs from shame because guilt:",options:["Focuses on the whole self","Focuses on a specific action","Is always harmful","Requires no reflection"],answer:1,why:"Guilt focuses on behaviour; shame on the self (Chapter 21).",chapter:21},{q:"Emotional intelligence tests:",options:["Give fixed, diagnostic scores","Vary in quality and should not be treated as diagnostic","Are always validated","Replace counselling"],answer:1,why:"Measurement quality varies (Chapter 22).",chapter:22},{q:"Workplace stress has:",options:["Only personal causes","Structural causes such as workload and control","No connection to work design","Only medical causes"],answer:1,why:"Organisational factors matter (Chapter 23).",chapter:23},{q:"Active recall and spaced practice are:",options:["Pseudo-science","Supported by learning research","Forbidden in schools","Only for experts"],answer:1,why:"These strategies have strong learning evidence (Chapter 24).",chapter:24},{q:"Financial stress is best addressed by:",options:["Mindset alone","Practical planning plus structural and community support","Ignoring bills","Borrowing more"],answer:1,why:"Financial stress requires structural responses (Chapter 25).",chapter:25},{q:"Relationships involving threats or control are:",options:["Normal stress to manage alone","Unsafe and need safety planning and support","Only a communication problem","Improved by silence"],answer:1,why:"Safety comes first (Chapter 26).",chapter:26},{q:"Research on social media and wellbeing is:",options:["Conclusive that it is harmful","Mixed and context-dependent","Conclusive that it is beneficial","Non-existent"],answer:1,why:"Avoid simplistic claims (Chapter 27).",chapter:27},{q:"Discrimination is linked in research with:",options:["Better health","Poorer mental and physical health outcomes","No effect","Improved sleep only"],answer:1,why:"Discrimination is a serious social stressor (Chapter 28).",chapter:28},{q:"Comfortable breathing practice should:",options:["Involve forced breath holds","Be stopped if dizzy or distressed","Continue regardless of discomfort","Replace medical care"],answer:1,why:"Stop when uncomfortable (Chapter 29).",chapter:29},{q:"Progressive muscle relaxation should avoid:",options:["Gentle tensing","Tensing to pain or working through injury","Slow release","Noticing sensations"],answer:1,why:"Never tense to pain (Chapter 30).",chapter:30},{q:"Mindfulness research suggests effects that are:",options:["Universal and large for all","Moderate and population-specific","Zero in all studies","Proven to cure depression"],answer:1,why:"Systematic reviews show moderate effects (Chapter 31).",chapter:31},{q:"Open monitoring meditation involves:",options:["Focusing on one object only","Observing whatever arises without a single focus","Sleeping","Chanting only"],answer:1,why:"Open monitoring observes experience (Chapter 32).",chapter:32},{q:"WHO guidance on adult activity includes:",options:["No activity recommendations","Moderate aerobic activity plus muscle strengthening, adapted to ability","Only extreme exercise","Only sleep"],answer:1,why:"WHO 2020 guidance (Chapter 33).",chapter:33},{q:"Nature exposure research is best described as:",options:["Fully conclusive","Promising but heterogeneous","Disproven","Only for children"],answer:1,why:"Evidence is developing (Chapter 34).",chapter:34},{q:"No single food:",options:["Can cure stress or mental-health conditions","Has been shown to do so","Replaces all care","Is responsible for mood alone"],answer:0,why:"Avoid claims that specific foods cure conditions (Chapter 35).",chapter:35},{q:"Food insecurity is:",options:["A personal failing","A structural stressor needing community responses","Not stressful","Solved by supplements"],answer:1,why:"Structural causes matter (Chapter 35).",chapter:35},{q:"Rest should be treated as:",options:["A reward to earn","A basic need supporting recovery","Unnecessary","Only for weekends"],answer:1,why:"Rest is a need (Chapter 36).",chapter:36},{q:"Expressive writing research shows:",options:["Uniform benefits for everyone","Mixed results across studies","Harmful effects in all cases","No research"],answer:1,why:"Results are variable (Chapter 37).",chapter:37},{q:"Resilience is best described as:",options:["A fixed trait","Adaptation after difficulty, shaped by many factors","Tolerating harm","Positive thinking alone"],answer:1,why:"Resilience is adaptive and contextual (Chapter 39).",chapter:39},{q:"Problem-focused coping is most useful when:",options:["The situation is unchangeable","Some aspect of the situation can be changed","Never","Only at night"],answer:1,why:"Choose coping to match controllability (Chapter 40).",chapter:40},{q:"Assertiveness differs from aggression because it:",options:["Violates others' rights","States needs respectfully","Always shouts","Avoids all conflict"],answer:1,why:"Assertiveness respects others (Chapter 41).",chapter:41},{q:"Loneliness is:",options:["The same as living alone","A subjective feeling of a gap in connection","Always a diagnosis","Unrelated to health"],answer:1,why:"Loneliness is subjective; isolation is objective (Glossary, Chapter 42).",chapter:42},{q:"In a structured problem-solving approach, you should:",options:["Act impulsively","Define the problem and separate controllable from uncontrollable factors","Avoid writing anything","Wait forever"],answer:1,why:"Structured steps help (Chapter 43).",chapter:43},{q:"Burnout, according to WHO, is best understood as:",options:["A personal failure","An occupational phenomenon from chronic unmanaged workplace stress","A form of flu","A cure-all diagnosis"],answer:1,why:"WHO classification (Chapter 45).",chapter:45},{q:"Stress and clinical mental-health conditions are:",options:["Identical","Related but distinct","Unrelated","Always the same treatment"],answer:1,why:"Stress is not a diagnosis (Chapter 46).",chapter:46},{q:"Trauma-informed care emphasises:",options:["Forced disclosure","Safety, trust, choice and cultural respect","Confrontation","Silence"],answer:1,why:"SAMHSA principles (Chapter 47).",chapter:47},{q:"Supplements marketed as cures for anxiety or depression are:",options:["Reliable","Unsupported claims to be avoided","Required","Regulated medicines everywhere"],answer:1,why:"Avoid such claims (Chapter 49).",chapter:49},{q:"Stopping prescribed medication suddenly should be:",options:["Encouraged","Discussed with the prescriber first","Done by reading online","Done after a breathing exercise"],answer:1,why:"Do not stop prescribed medicine without advice (Chapter 49).",chapter:49},{q:"Immediate danger to yourself or another person requires:",options:["A journal entry","Local emergency services or crisis support now","Waiting a week","A breathing exercise only"],answer:1,why:"Urgent help is r isol awakening response describes:",options:["A fall in cortisol after waking","A rise in cortisol in the first 30–45 minutes after waking","Cortisol at midnight","No cortisol change ever"],answer:1,why:"Its meaning is debated (Chapter 6).",chapter:6}],jp=[{title:"Case 1: Examination pressure (fictional student, Nairobi)",background:"Amara, 17, prepares for national exams while helping at a family market stall in the afternoons.",challenge:"Limited study time, late nights and fear of falling behind classmates.",science:"Sustained academic demands can keep stress systems active; sleep loss reduces attention and memory consolidation.",considerations:"Time is limited, and household duties are real. Plans must fit the schedule.",approaches:"Short active-recall sessions, a fixed wind-down time, asking a teacher about a realistic study plan, and a brief daily walk.",cannot:"The case does not show that Amara will pass or fail, nor that any method guarantees results.",professional:"If sleep, appetite or mood change for several weeks, or if she feels hopeless, talk to a school counsellor or doctor.",learning:"Sleep and recall strategies support learning; workload is partly structural."},{title:"Case 2: Prolonged workplace demands (fictional nurse, Manchester)",background:"Daniel, 34, works extended shifts with staffing gaps and limited breaks.",challenge:"High workload, low control over rota and emotional exhaustion after difficult shifts.",science:"High job demands with low control are linked to strain in occupational research.",considerations:"Individual breaks help but cannot fix staffing shortages. Union and team routes may matter.",approaches:"Plan short recovery breaks, raise workload concerns with a manager in writing, use peer support, and protect sleep time.",cannot:"It cannot be concluded that Daniel will develop burnout or that a single change will fix the problem.",professional:"Persistent low mood or hopelessness should be discussed with occupational health or a GP.",learning:"Burnout is an organisational as well as personal issue."},{title:"Case 3: Caregiver with limited recovery time (fictional, Lagos)",background:"Ifeoma, 46, cares for an elderly parent while working part-time.",challenge:"Almost no uninterrupted rest and guilt about needing time away.",science:"Caregiving strain is associated with sleep disruption and reduced recovery opportunities.",considerations:"Extended family may help; cultural expectations around caring are important and valid.",approaches:"Map shared tasks with relatives, ask community or religious groups about support, schedule small breaks, and seek local respite services where available.",cannot:"The case does not show that caregiving always causes illness.",professional:"Signs of exhaustion, low mood or health changes should be checked by a clinician.",learning:"Caregiving needs shared responsibility."},{title:"Case 4: Family responsibilities (fictional parent, São Paulo)",background:"Lucas, 39, is a single parent of two children with irregular shift work.",challenge:"Childcare gaps, tight budgets and little time for himself.",science:"Role overload is a recognised stress source; social support buffers many stress responses in research.",considerations:"Childcare options and work schedules are structural constraints.",approaches:"List support contacts, use school or community services, build tiny routines, and ask for help with specific tasks.",cannot:"The case cannot tell us how Lucas's children are coping or what outcomes will follow.",professional:"If parenting feels unmanageable or safety is a concern, contact a family-support service or GP.",learning:"Specific, small requests for help can be effective."},{title:"Case 5: Financial uncertainty (fictional, Glasgow)",background:"Priya, 28, works on a zero-hours contract with fluctuating income.",challenge:"Unpredictable pay, rent worries and difficulty planning.",science:"Financial strain is associated with worry, sleep disruption and reduced wellbeing in research.",considerations:"Income security is a policy issue. Free advice services are available in many countries.",approaches:"Track income and bills, contact a free money-advice service early, check benefit or support eligibility, and talk to trusted people.",cannot:"Mindset alone cannot change income or rent prices.",professional:"If worry is persistent and affecting daily life, a GP can help.",learning:"Practical support and structural solutions matter."},{title:"Case 6: Remote work and isolation (fictional, Toronto)",background:"Sam, 31, works remotely and rarely meets colleagues in person.",challenge:"Limited social contact and blurred work-home boundaries.",science:"Social isolation is associated with poorer health outcomes in large studies.",considerations:"Some remote workers have less choice about location or hours.",approaches:"Schedule a weekly social contact, join community groups, set a finishing time, and take a short walk outside.",cannot:"Remote work is not inherently harmful; the case does not generalise to all workers.",professional:"Persistent loneliness with low mood should be discussed with a professional.",learning:"Connection is a protective factor that can be built deliberately."},{title:"Case 7: Digital information overload (fictional, Seoul)",background:"Jisoo, 22, follows multiple news feeds and messaging groups.",challenge:"Constant alerts, distressing headlines and difficulty concentrating.",science:"Frequent interruptions fragment attention; distressing news can increase anxiety for some people.",considerations:"Some information is necessary for work or safety.",approaches:"Turn off non-essential alerts, choose two trusted news times per day, and create a device-free period before bed.",cannot:"The case cannot show that technology alone causes distress.",professional:"If anxiety or intrusive thoughts persist, seek professional advice.",learning:"Technology choices can be adjusted."},{title:"Case 8: Major life transiti
