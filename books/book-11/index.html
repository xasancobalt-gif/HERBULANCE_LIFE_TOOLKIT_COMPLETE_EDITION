Some corticosteroids, antipsychotics, certain antidepressants and anticonvulsants, insulin and some diabetes medications can increase appetite, change fluid balance or alter metabolism. Beta-blockers and some others can reduce energy expenditure modestly.

!!S|Never start, stop, split or change a prescribed medication because of body weight. Discuss concerns with the prescriber — for many medicines there are alternatives, and abrupt change can be dangerous.

## Socioeconomic factors

Income, education, food prices, working hours, housing, transport and neighbourhood safety all predict population-level differences in body weight and health. These are not individual shortcomings.

> Blaming a body for its genetics is like blaming a person for their height.
`,takeaways:["Genetic influence on body weight is real and operates through environment.","Many medical conditions and medications affect weight — assessment belongs to clinicians.","Socioeconomic conditions are among the strongest population predictors."],crossrefs:[],refs:P("nice_obesity","who_obesity","world_obesity","niddk_weight")},{id:"ch29",num:29,part:5,title:"Weight Stigma and Body Image",kicker:"Part V — Understanding body-weight changes",objectives:["Define weight stigma and describe its documented health effects.","Recognise unrealistic beauty standards and media manipulation.","Use respectful, inclusive language and communication."],body:`
[[fig:stigma]]

## What weight stigma is

Weight stigma is the social devaluation and discrimination of people because of body size. It appears in healthcare, education, employment, media and family life. It is associated with increased stress, avoidance of healthcare, avoidance of physical activity, higher rates of depression and disordered eating — and with *worse* health outcomes, not better.

## Healthcare settings

Patients in larger bodies report being weighed less sensitively, having symptoms attributed to weight, receiving less investigation, and delaying or avoiding care. Weight-neutral and weight-inclusive approaches focus on behaviour, function and clinical markers first.

## Media and beauty standards

Idealised body types shift across decades and cultures. Images are filtered, posed, lit, and sometimes digitally altered. Exposure to idealised images is consistently associated with body dissatisfaction in both women and men, and increasingly in adolescents.

## Body respect as a practical skill

- Speak about your body the way you would speak about a friend's.
- Choose clothing that fits the body you have today.
- Move for pleasure and function, not to shrink.
- Curate media that makes you feel worse.
- Focus on what the body does, not only how it looks.

## Supportive communication

| Instead of | Try |
| "You've lost weight, you look great!" | "It's good to see you. How have you been?" |
| "That's a bad food" | "That food gives energy; this one gives fibre and iron" |
| "Just eat less and move more" | "What would make eating well easier in your week?" |
| "I feel fat" | "I'm feeling uncomfortable in my body today" |

!!K|Body image distress is a legitimate health concern at every body size. It deserves compassion and, when persistent, professional support.

!!S|This book uses no before-and-after imagery, no transformation challenges and no moral language about food or bodies. If body preoccupation is affecting your daily life, a mental-health professional with eating and body-image experience can help.

> Respect for a body is not conditional on what it looks like.
`,takeaways:["Weight stigma damages health and delays healthcare.","Beauty standards are culturally constructed and digitally enhanced.","Weight-neutral, behaviour-focused language supports better outcomes."],crossrefs:[],refs:P("who_mental","world_obesity","nice_ed")}],ep=[{id:"ch30",num:30,part:6,title:"Adolescent Growth and Development",kicker:"Part VI — Special populations and health considerations",objectives:["Describe the nutritional and activity needs of growth.","Recognise body-image and eating-disorder risk in adolescents.","Explain what a supportive family and school environment looks like."],body:`
## Growth is not a dieting period

Adolescence brings rapid changes in height, body composition, bone accrual, brain development and reproductive maturation. Energy and nutrient needs per kilogram are higher than at almost any other time of life, and requirements can change substantially from one year to the next.

[[fig:life-stages]]

## What adolescents need

- **Energy** — appetite often rises markedly during growth spurts. This is appropriate.
- **Protein** — for growth of muscle, organs and connective tissue.
- **Calcium and vitamin D** — peak bone mass is largely established by the early twenties.
- **Iron** — requirements rise, particularly with menstruation.
- **Iodine, zinc and folate** — commonly low in restricted diets.
- **Sleep** — 8–10 hours, against a biological tendency toward later sleep timing.
- **Activity** — an average of 60 minutes a day of moderate-to-vigorous activity, plus bone- and muscle-strengthening work.

## Body image in adolescence

Body dissatisfaction is common and is intensified by social media, peer comparison and pubertal timing. Comments about weight — even well-meant ones — from family members are a recognised risk factor for disordered eating.

## Warning signs in young people

Avoiding meals with the family, cutting out food groups, sudden interest in "clean eating", excessive exercise, frequent weighing, social withdrawal, rapid change in weight or growth trajectory, and persistent body preoccupation all warrant a calm conversation and professional assessment.

!!S|This book intentionally provides no weight-loss programme, calorie target or restriction instruction for anyone under 18. Intentional weight loss in adolescents should only ever occur under the supervision of a physician and a registered dietitian, using growth monitoring rather than a scale target.

## A supportive environment

Family meals, no weight talk at home, food available without conditions, adults modelling a relaxed relationship with food and movement, and schools that teach nutrition without assigning diet diaries.

> Growing bodies are meant to change. Let them.
`,takeaways:["Adolescence requires abundant energy and nutrients for growth and bone accrual.","Comments about weight from family are a risk factor, not a help.","Weight loss in minors is a clinical matter only."],crossrefs:["Book 10 — Essential Nutrients"],refs:P("who_adolescent","nhs_eating_disorders","nice_ed","nedc_au")},{id:"ch31",num:31,part:6,title:"Adult Lifestyle and Health",kicker:"Part VI — Special populations and health considerations",objectives:["Identify the domains that support adult health over decades.","Balance nutritional adequacy with work, family and financial demands.","Know which health measurements are worth monitoring."],body:`
[[fig:adult-habits]]

## The everyday system

Adult health is built from repeatable, boring, effective habits: an eating pattern rich in vegetables, legumes and whole grains; regular movement across the week; consistent sleep; managed stress; social connection; and routines that survive busy weeks.

## Nutritional adequacy under pressure

Common gaps in adult diets include fibre, potassium, calcium, iron (particularly in menstruating adults), folate (in pregnancy) and vitamin D (at higher latitudes or with limited sun exposure). Convenience foods are not the enemy — adding vegetables, legumes and whole grains to them is a practical middle ground.

## Monitoring that is meaningful

| Measure | Why it matters | How often |
| Blood pressure | Silent, common, modifiable | As advised by a clinician, often annually |
| Blood glucose / HbA1c | Diabetes risk and management | Per national screening guidance |
| Blood lipids | Cardiovascular risk | Per clinical guidance |
| Fitness and function | Stairs, walking distance, strength | Self-assessed, ongoing |
| Mood, sleep, energy | Early signals of strain | Ongoing self-awareness |
| Body weight | Optional; limited information alone | Only if it is useful to you |

## Sustainable habits

Consistency over intensity. Two strength sessions and most days with movement outperform heroic programmes abandoned after three weeks. Meal planning reduces weekday stress. Sleep is protected, not leftover.

!!S|Adults with chronic conditions — diabetes, cardiovascular disease, kidney disease, thyroid disorders — should have dietary and activity guidance adapted by their clinical team, particularly where medication is involved.

> Health in adulthood is less about a project and more about a system.
`,takeaways:["Adult health rests on repeatable habits across five domains.","Fibre, potassium, calcium and vitamin D are common shortfalls.","Clinical markers carry more information than the scale alone."],crossrefs:["Book 07 — Meal Planning & Balanced Nutrition","Book 10 — Essential Nutrients"],refs:P("who_healthy_diet","who_physical","eatright")},{id:"ch32",num:32,part:6,title:"Nutrition and Movement in Older Adults",kicker:"Part VI — Special populations and health considerations",objectives:["Describe the priorities of muscle, bone and functional independence.","Address protein, hydration and micronutrient needs in later life.","Apply balance and mobility work to reduce falls risk."],body:`
[[fig:older-adults]]

## The priority shifts to function

In later life, the practical question becomes: can I rise from a chair, carry my shopping, climb the stairs, dress myself and live where I want to? Muscle mass and strength decline with age — a process accelerated by inactivity but significantly slowed by resistance training at any age.

## Protein and nutrients

Protein needs per kilogram rise in older adults because of reduced anabolic efficiency. Spreading protein across meals (roughly 25–30 g per meal as a practical guide) supports muscle maintenance. Key nutrients include vitamin D and calcium for bone, vitamin B12 (absorption declines with age and with metformin or proton-pump inhibitors), fibre for bowel function, and fluid for hydration.

Appetite often falls, so nutrient density matters more: smaller meals with concentrated nutrition, flavoured and warm fluids, and eating with company.

## Balance and falls

[[fig:mobility-balance]]

Falls are a leading cause of injury and loss of independence. Balance training, strength work, vision checks, appropriate footwear, home hazard removal (loose rugs, poor lighting, clutter) and medication review all reduce risk.

## Hydration

Thirst sensation weakens with age, and some medications act as diuretics. Regular drinking opportunities — with meals, at medication times, and during activity — are more reliable than thirst alone.

## Nutritional risk

Poor dentition, difficulty swallowing, low income, cooking for one, transport difficulty, social isolation and bereavement all affect intake. These are common and treatable; asking for help is normal.

!!S|Unintentional weight loss in older adults is a medical concern, not a success. It can signal illness, depression, dental problems or food insecurity and should be assessed promptly.

> In later life, food and movement are about independence, not appearance.
`,takeaways:["Resistance training and protein intake support muscle at any age.","Balance work, home safety and vision checks reduce falls risk.","Unintentional weight loss in older adults needs medical review."],crossrefs:["Book 10 — Essential Nutrients"],refs:P("who_pa_guidelines","harvard_protein","efsa_drv","eatright")},{id:"ch33",num:33,part:6,title:"Pregnancy and Postpartum Considerations",kicker:"Part VI — Special populations and health considerations",objectives:["Describe normal body changes in pregnancy and postpartum.","Outline the nutrients and activity guidance that matter most.","Recognise what is inappropriate during these periods."],body:`
[[fig:pregnancy]]

## Body change is the point

Pregnancy involves growth of the fetus, placenta, uterus and breasts, increased blood volume and fluid, and stores that support later pregnancy and lactation. Weight change is expected and necessary. It is not an appropriate time for intentional weight loss.

## Nutritional requirements

- **Folate** — essential before conception and in the first trimester for neural tube development.
- **Iodine** — supports brain development; requirements rise in pregnancy.
- **Iron** — blood volume expands; deficiency is common and screened for.
- **Calcium and vitamin D** — for maternal bone and fetal skeleton.
- **Protein** — requirements rise modestly but importantly.
- **Omega-3 (DHA)** — supports fetal brain and eye development.
- **Energy** — needs rise modestly in the second and third trimesters; quality matters more than quantity.
- **Food safety** — avoid unpasteurised dairy, raw or undercooked eggs and meats, high-mercury fish, and unpasteurised soft cheeses.

## Activity during pregnancy

For most people with uncomplicated pregnancies, at least 150 minutes of moderate activity per week is recommended, plus muscle-strengthening work. Walking, swimming, stationary cycling and modified strength work are all suitable. Avoid contact sports, supine exercise late in pregnancy, overheating and high-altitude exposure without acclimatisation.

## Postpartum

Recovery from birth, wound healing, breastfeeding demands and severe sleep disruption dominate the early months. Aggressive postpartum weight-loss programmes and intense training are inappropriate. Gradual return to movement — walking first, then core and pelvic floor rehabilitation, then strength — is the standard approach.

!!S|This book promotes no pregnancy weight loss and no postpartum weight-loss challenge. Every pregnancy is individual: discuss nutrition, activity and weight questions with your midwife, obstetrician or physician. Seek urgent care for bleeding, severe headache, swelling, reduced fetal movement or chest pain.

> Pregnancy and postpartum are seasons of building, not of shrinking.
`,takeaways:["Weight change in pregnancy is expected and necessary.","Folate, iodine, iron, calcium, vitamin D and protein needs rise.","Postpartum recovery and gradual return to movement come before any weight discussion."],crossrefs:["Book 05 — Food Safety & Kitchen Hygiene"],refs:P("who_healthy_diet","who_pa_guidelines","eatright","efsa_drv")},{id:"ch34",num:34,part:6,title:"Eating Disorders and Disordered Eating",kicker:"Part VI — Special populations and health considerations",objectives:["Recognise restrictive eating, binge eating, purging and compulsive exercise.","Describe warning signs and the psychological impact.","Know how to seek and offer support using recovery-sensitive language."],body:`
[[fig:eating-disorder-signals]]

## What eating disorders are

Eating disorders are serious mental illnesses with physical consequences. They include anorexia nervosa, bulimia nervosa, binge-eating disorder, avoidant/restrictive food intake disorder and other specified feeding and eating disorders. They occur at every body size, gender, age, culture and socioeconomic level.

## Patterns to recognise

- **Restrictive eating** — severe food rules, elimination of food groups, ritualised eating, very low intake.
- **Loss-of-control eating (binge eating)** — eating large amounts with a sense of loss of control, followed by distress.
- **Purging** — self-induced vomiting, laxative or diuretic misuse, enemas.
- **Compulsive exercise** — exercising despite injury, illness or distress; exercising to compensate for eating.
- **Body-image distress** — persistent preoccupation, mirror avoidance, social withdrawal, reassurance-seeking.

## Warning signs in daily life

Skipping meals with explanations, cutting food into tiny pieces, eating alone, hiding wrappers, frequent bathroom visits after meals, excessive exercise at unusual hours, wearing oversized clothing, withdrawal from friends, irritability around food, and rapid change in weight or appearance.

## Psychological impact

Anxiety, depression, social isolation, cognitive difficulty, and reduced ability to study or work. Physical complications can affect the heart, bones, gut, hormones and teeth. Malnutrition can occur at any body weight.

## Recovery-sensitive language

Speak about behaviours and feelings, not bodies. Avoid commenting on weight or appearance. Do not praise weight loss. Do not offer diet advice. Encourage professional help and offer to help with the practical step of making an appointment.

!!S|Eating disorders carry the highest mortality of any mental illness. If you or someone you know is engaging in purging, laxative misuse, prolonged fasting or exercising through injury, seek professional help now. In an emergency — fainting, chest pain, confusion, very low heart rate — call emergency services.

## Where to start

A general practitioner or physician, a registered dietitian experienced in eating disorders, and a mental-health clinician trained in evidence-based treatments (CBT-E, family-based treatment for adolescents). Support organisations in your country can guide the first step.

> No body size rules this out. Asking for help is a sign of strength, not of failure.
`,takeaways:["Eating disorders occur at every body size and are serious medical conditions.","Warning signs are behavioural and emotional as well as physical.","Recovery is possible with professional support; language matters."],crossrefs:[],refs:P("nice_ed","nhs_eating_disorders","beat_ed","nedc_au")},{id:"ch35",num:35,part:6,title:"Medical Conditions and Individualised Weight Management",kicker:"Part VI — Special populations and health considerations",objectives:["Describe how common conditions change nutrition and activity considerations.","Explain why individualised care is essential.","Recognise the limits of educational information."],body:`
[[fig:medical-factors]]

## Diabetes

Type 1 diabetes requires insulin matched to carbohydrate intake and activity — dietary changes must be coordinated with the clinical team to avoid hypoglycaemia. Type 2 diabetes management includes dietary pattern, activity, medication and monitoring; carbohydrate quality and consistency matter more than elimination.

## Cardiovascular conditions

Hypertension responds to reduced sodium, increased potassium (from fruit and vegetables), physical activity, alcohol moderation and stress management. After cardiac events, supervised rehabilitation is standard. People on anticoagulants should be aware of vitamin K consistency rather than avoidance.

## Kidney conditions

Chronic kidney disease may require individualised protein, potassium, phosphate, sodium and fluid limits — these change with disease stage and treatment. Generic high-protein or "clean eating" advice can be harmful.

## Thyroid disorders

Both hypo- and hyperthyroidism alter energy expenditure, appetite, mood and body composition. Diagnosis is by blood test; treatment is medication. Dietary iodine needs are specific and supplements are not universally appropriate.

## Gastrointestinal disorders

Irritable bowel syndrome, coeliac disease, inflammatory bowel disease, reflux and gallbladder disease each have specific dietary considerations. Restrictive diets used for IBS (such as low-FODMAP elimination) are intended to be temporary and dietitian-guided.

## Mobility limitations and chronic pain

Adapted activity — seated strength, aquatic exercise, supported movement — remains valuable. Nutrition considerations include medication effects on appetite, and the energy cost of mobility aids and transfers.

!!S|Educational content cannot diagnose or treat. Do not change prescribed medication, begin a restrictive diet, or use supplements to self-treat a medical condition. Bring what you have learned to a qualified professional and build a plan together.

[[fig:case-framework]]

> Individual care means the plan fits the person — including their condition, their culture, their budget and their goals.
`,takeaways:["Most chronic conditions change nutrition or activity requirements specifically.","Restrictive therapeutic diets require professional guidance.","Educational material supports clinical care; it never replaces it."],crossrefs:["Book 09 — Food Allergies, Intolerances & Special Dietary Needs","Book 10 — Essential Nutrients"],refs:P("nice_obesity","eatright","niddk_programs","efsa_drv")}],tp=[{id:"ch36",num:36,part:7,title:"Building Sustainable Eating Habits",kicker:"Part VII — Practical lifestyle systems",objectives:["Build a practical meal-planning and shopping routine.","Work within budget, availability and family preferences.","Adapt planning to cultural traditions and changing weeks."],body:`
[[fig:meal-planning]]

## Plan less than you think

Planning every meal for a week rarely survives contact with real life. Three dinners, two repeatable breakfasts and two lunches is usually enough structure — the rest is leftovers, canteens, family plans and take-away.

## A four-step system

1. **Plan** — choose a small number of meals and write a list.
2. **Shop** — buy staples first, then seasonal produce, then extras.
3. **Prepare** — cook once and eat twice; wash and cut vegetables; freeze half.
4. **Assemble** — staple + protein + vegetables + fat + flavour.

## Shopping and budget

- Dried and canned legumes, whole grains, eggs, seasonal vegetables and frozen produce are the most nutrient-dense per unit cost.
- Store brands are usually nutritionally equivalent to branded products.
- Unit pricing (cost per kilogram or litre) reveals more than shelf price.
- Buying in bulk only saves money if the food is actually eaten or stored safely.

## Family and cultural flexibility

Meals can be built around a shared base — rice, bread, injera, noodles, tortillas, porridge — with toppings, sauces and sides that vary by person. This respects different tastes, ages and appetites without cooking several separate dinners.

[[fig:daily-environment]]

## Food safety at home

Cool leftovers quickly, refrigerate within two hours, reheat until steaming hot, and observe use-by dates on high-risk foods. Good storage habits reduce waste and illness — the foundation of any sustainable plan.

!!X|See HERBULANCE Book 04 for label reading and shopping, Book 05 for food safety, Book 06 for cooking techniques, Book 07 for full meal-planning systems and Book 08 for preserving and storing food.

!!S|Households under financial or food stress should prioritise access and adequacy before any discussion of diet quality. Community food programmes, school meals and social services exist to help.

> The best meal plan is the one you can still follow in a bad week.
`,takeaways:["Plan fewer meals than you think you need; leave room for real life.","Staples, legumes and seasonal produce deliver the most nutrition per unit cost.","Food safety and storage are part of sustainable eating."],crossrefs:["Book 04","Book 05","Book 06","Book 07","Book 08"],refs:P("fao_sustainable","eatright","who_healthy_diet")},{id:"ch37",num:37,part:7,title:"Creating a Home Movement Routine",kicker:"Part VII — Practical lifestyle systems",objectives:["Build a no-equipment routine covering strength, mobility and aerobic work.","Progress safely without a coach.","Plan a week that includes rest."],body:`
[[fig:home-routine]]

## The minimum effective routine

Two strength sessions, three short walks and five minutes of daily mobility is a genuine, evidence-consistent routine — not a compromise.

## A sample home session (20 minutes)

1. **Warm up** — 3 minutes of easy movement: marching, arm circles, gentle squats.
2. **Sit-to-stand** — 2 sets of 8–12.
3. **Wall or knee push** — 2 sets of 6–12.
4. **Hip hinge or glute bridge** — 2 sets of 10.
5. **Row with a band or bag** — 2 sets of 10 per side.
6. **Calf raise and balance** — 2 sets of 12, plus 30 seconds single-leg standing each side.
7. **Cool down** — 3 minutes of slow breathing and gentle stretching.

## Weekly planning

| Day | Session |
| Monday | Home strength (20 min) |
| Tuesday | Walk 20–30 min |
| Wednesday | Mobility 10 min + rest |
| Thursday | Home strength (20 min) |
| Friday | Walk or cycle 30 min |
| Saturday | Something enjoyable — dance, gardening, sport |
| Sunday | Rest |

## Safe progression

Add repetitions before load. Add load before complexity. Change one thing per week. Keep a training note — two lines is enough — so progress is visible rather than remembered.

[[fig:weekly-plan]]

## Recovery built in

Soreness that resolves in two to three days is expected. Sharp joint pain, pain that wakes you, or pain that changes how you move is a reason to stop and seek advice.

!!S|Exercise during pregnancy, with chronic illness, after surgery or with persistent pain should be adapted by a physiotherapist, exercise physiologist or physician.

> Ten minutes at home, done consistently, beats an hour you never start.
`,takeaways:["A minimal home routine covers strength, aerobic work and mobility.","Progress one variable at a week, and keep a short training note.","Rest and soreness management are part of the programme."],crossrefs:["Book 07 — Meal Planning & Balanced Nutrition"],refs:P("who_pa_guidelines","hhs_pag","nhs_exercise")},{id:"ch38",num:38,part:7,title:"Habit Formation and Behaviour Change",kicker:"Part VII — Practical lifestyle systems",objectives:["Explain the habit loop and how cues drive behaviour.","Design the environment to make habits easier.","Plan for barriers and lapses without self-blame."],body:`
[[fig:habit-loop]]

## The loop

Every habit has a **cue** (a time, place, feeling or preceding action), a **craving** for the reward, a **response** (the behaviour) and a **reward**. Change is easier when you change the cue or the friction than when you rely on motivation.

## Design principles

- **Make it obvious** — put the walking shoes by the door, the fruit on the counter, the band on the chair.
- **Make it easy** — two minutes is a valid start; reduce friction to almost zero.
- **Make it attractive** — attach the habit to something you enjoy (a podcast on a walk).
- **Make it satisfying** — mark an X on a calendar; visible progress is a reward.

## Goal setting that works

Behaviour goals ("walk after lunch three days this week") outperform outcome goals ("lose weight"). Add an implementation intention: "After I finish lunch, I will put on my shoes and walk to the corner."

## Self-monitoring

Brief tracking helps awareness — a two-line journal, a wall calendar, a step count. Tracking that becomes compulsive, anxiety-provoking or punitive should stop.

## Barriers and lapses

Lapses are expected. The "what-the-hell" effect — where one missed day becomes three weeks — is well documented and is reduced by a rule like: never miss twice, and shrink the habit rather than abandoning it.

[[fig:case-framework]]

!!K|Weight change is not simply a matter of willpower. Biology, environment and circumstance shape behaviour far more than most people are taught to believe.

!!S|If a habit cannot be sustained without rigid rules, anxiety or compensation, the habit itself may be harmful. Speak to a professional.

> You do not rise to the level of your goals. You fall to the level of your systems.
`,takeaways:["Habits are cue-driven; design the cue and the friction.","Behaviour goals outperform outcome goals.","Lapses are expected — plan a rule for them in advance."],crossrefs:[],refs:P("niddk_weight","who_mental","eatright")},{id:"ch39",num:39,part:7,title:"Evaluating Popular Diets and Weight-Loss Claims",kicker:"Part VII — Practical lifestyle systems",objectives:["Apply three critical questions to any weight-loss claim.","Describe the evidence and risks behind common approaches.","Know when medical supervision is required."],body:`
[[fig:diet-claims]]

## Three questions for every claim

1. **What exactly is claimed?** Mechanism, outcome, timeframe and who it applies to.
2. **What does the evidence show?** Randomised trials and systematic reviews, not testimonials.
3. **Who is at risk?** Which people should not do this, and what are the harms?

## Common claims, evaluated

| Approach | Evidence summary | Risks / limits |
| Detox and juice cleanses | No evidence of toxin removal; liver and kidneys perform this function | Nutrient deficiency, muscle loss, food–safety risk with unpasteurised juice |
| Extreme fasting / prolonged fasting | Some evidence for time-restricted eating; no special advantage over continuous restriction | Not appropriate in pregnancy, adolescence, diabetes medication use or eating disorder history |
| Crash and very-low-calorie diets | Rapid early loss, mostly water and lean tissue; high regain rates | Gallstones, fatigue, nutrient deficiency, disordered eating — medical supervision required |
| Ketogenic diets | Short-term weight change and glycaemic improvement in some people | Difficult to sustain; requires supervision with diabetes medication, in pregnancy and in adolescents |
| Commercial programmes | Modest average loss; variation by programme and adherence | Cost, dependency on products, weight-regain after stopping |
| Meal replacement products | Can support structured short-term change under supervision | Not a long-term eating pattern; cost; social isolation around food |
| Fat-burning supplements | No meaningful, lasting fat loss demonstrated | Undeclared stimulants, laxatives, cardiovascular risk, unregulated manufacture |
| Social media trends | Case reports and testimonials only | Unverifiable claims, no safety data, often sold by the promoter |

## When medical supervision is necessary

Any programme prescribing very low energy intake, eliminating whole food groups, using medication or supplements, or intended for a person with a medical condition, pregnancy, an eating disorder history, or anyone under 18.

!!S|Never use laxatives, diuretics, purging, dehydration or unregulated diet pills for weight change. These are dangerous and are features of eating disorders, not of health behaviour.

[[fig:recovery-signals]]

> If a claim sounds like it requires no effort and no patience, it is not describing physiology.
`,takeaways:["Ask what is claimed, what the evidence shows, and who is at risk.","Rapid-loss approaches mostly remove water and lean tissue.","Very low energy and supplement-based approaches need medical supervision."],crossrefs:["Book 04 — Smart Food Shopping & Label Reading Guide"],refs:P("niddk_programs","ods_supplements","nice_obesity","who_sugars")},{id:"ch40",num:40,part:7,title:"Fifteen Practical Case Studies",kicker:"Part VII — Practical lifestyle systems",objectives:["Apply scientific principles to realistic, diverse circumstances.","Practise separating educational options from clinical decisions.","Recognise what must not be assumed about a person."],body:`
## How to read these cases

The fifteen cases below are fictional and are written for teaching. They are not clinical evidence, and no outcome shown here should be read as proof that an approach works. Each case follows the same structure: background, educational challenge, relevant scientific principles, practical options, safety considerations, what not to assume, and a reflection question.

[[fig:case-framework]]

## Why fictional cases are useful

Real clinical reasoning depends on details that a textbook chapter cannot supply: budget, working hours, family expectation, culture, mobility and belief. Cases let you practise weighing those details without pretending to diagnose anyone.

## The fifteen cases

[[cases]]

!!S|If a case resembles your own situation, treat it as a prompt for reflection — not as a treatment plan. Bring it to a qualified professional.

> Notice how often the right answer is "it depends, and here is what to check".
`,takeaways:["Cases illustrate reasoning, not clinical outcomes.","Circumstances change which options are genuinely available.","What not to assume is as important as what to do."],crossrefs:[],refs:P("eatright","nice_ed","nedc_au")},{id:"ch41",num:41,part:7,title:"The 30-Day Sustainable Lifestyle Challenge",kicker:"Part VII — Practical lifestyle systems",objectives:["Complete a month of learning and safe practical activity.","Build reflection habits rather than measurement habits.","Finish with a flexible routine you can maintain."],body:`
[[fig:challenge-arc]]

## What this challenge is — and is not

It is a structured month of short learning tasks and safe, optional activities. It is **not** a weight-loss programme. No day requires weighing, measuring food, counting energy or taking body measurements. Completion is defined by reflection, not by body change.

## Ground rules

1. Skip any activity that does not fit your health circumstances — and say why in your reflection.
2. If you are under 18, do not restrict food or energy at any point. Growth comes first.
3. If an activity increases anxiety about food or your body, stop and speak to a professional.
4. Nothing here replaces medical, dietetic or mental-health care.

## The four weeks

- **Week 1 — Understand**: food, energy and how the body regulates itself.
- **Week 2 — Explore**: nutritious meals and everyday movement, tried rather than prescribed.
- **Week 3 — Build**: sleep, recovery and habits that survive an ordinary week.
- **Week 4 — Create**: a flexible routine you can keep without counting or measuring.

[[tracker]]

[[challenge]]

!!S|Any participant who develops distress around food, body image or exercise during the challenge should stop and contact a healthcare professional. Support is available and effective.

> Thirty days will not change your body. It can change how you think about it.
`,takeaways:["The challenge teaches and reflects; it does not measure.","No weigh-ins, no calorie counting, no body measurements.","The output is a flexible, maintainable weekly routine."],crossrefs:["Book 07 — Meal Planning & Balanced Nutrition"],refs:P("who_healthy_diet","who_physical","nhs_sleep")}],Da=[...Jg,...Fg,...$g,...Ig,...Pg,...ep,...tp],Yn=[{n:1,title:"Understanding Body Weight and Metabolism",strap:"Chapters 1–6",blurb:"What body weight is, what it is not, and how the body produces and spends energy.",image:"images/cover.jpg"},{n:2,title:"Nutrition and Eating Behaviour",strap:"Chapters 7–14",blurb:"Building a nutritious eating pattern that survives real life — hunger, portions, macronutrients, fibre, hydration and the food environment.",image:"images/part-nutrition.jpg"},{n:3,title:"Physical Activity and Body Function",strap:"Chapters 15–21",blurb:"Movement as a health input: walking, strength, aerobic work, mobility, recovery and a balanced week.",image:"images/part-movement.jpg"},{n:4,title:"Sleep, Stress and Lifestyle",strap:"Chapters 22–24",blurb:"The two regulators that quietly shape appetite, energy and every other habit.",image:"images/part-rest.jpg"},{n:5,title:"Understanding Body-Weight Changes",strap:"Chapters 25–29",blurb:"Fluctuation, BMI, metabolic adaptation, genetics and the harm of weight stigma.",image:"images/cover.jpg"},{n:6,title:"Special Populations and Health Considerations",strap:"Chapters 30–35",blurb:"Adolescents, adults, older adults, pregnancy, eating disorders and medical conditions.",image:"images/part-living.jpg"},{n:7,title:"Practical Lifestyle Systems",strap:"Chapters 36–41",blurb:"Meal systems, home movement, habit design, evaluating claims, cases and the 30-day challenge.",image:"images/part-living.jpg"}],Dt={number:"Book 11",subtitle:"Understanding energy balance, metabolism, eating behaviours, physical activity and sustainable approaches to long-term wellbeing.",brand:"HERBULANCE",identity:"NATURAL LIVING • FOOD EDUCATION • EVERYDAY WELLNESS",phrase:"Learn • Prepare • Thrive",edition:"First interactive edition, 2026"},ap=["Book 01 — The Plant-Forward Beginner's Guide","Book 02 — Gut Health & Digestion Guide","Book 03 — World of Herbs & Spices","Book 04 — Smart Food Shopping & Label Reading Guide","Book 05 — The Complete Food Safety & Kitchen Hygiene Guide","Book 06 — Cooking Methods, Kitchen Techniques & Culinary Skills","Book 07 — Meal Planning, Balanced Nutrition & Everyday Food Preparation","Book 08 — Food Preservation, Fermentation & Sustainable Food Storage","Book 09 — Food Allergies, Intolerances & Special Dietary Needs","Book 10 — Food Nutrition, Vitamins, Minerals & Essential Nutrients"],ip=`## Medical and psychological disclaimer

This publication is **educational material only**. It is not medical advice, a diagnosis, a treatment plan, a personalised nutrition programme or an individualised exercise prescription.

- It does not diagnose obesity, eating disorders, metabolic conditions or any other disease.
- It does not prescribe individualised calorie targets, macronutrient ratios or body-weight goals.
- It does not recommend crash dieting, prolonged fasting, laxatives, purging, dehydration, diet pills or unregulated supplements.
- It does not provide weight-loss programmes for anyone under 18. Intentional weight change in minors is a clinical matter requiring physician and registered-dietitian supervision.
- It does not replace assessment by a physician, registered dietitian, physiotherapist or mental-health clinician.

Body weight is influenced by biological, genetic, behavioural, environmental and social factors. Body mass index is a population-level screening measure with well-documented limitations and is not a complete description of an individual's health.

Medications and medical conditions can affect body weight and appetite. Never start, stop or change prescribed medication because of body weight without speaking to the prescriber.

Eating-disorder symptoms — restrictive eating, loss-of-control eating, purging, laxative misuse, compulsive exercise and body-image distress — can occur at **any body size** and require professional support. If you are affected, contact a healthcare professional or an eating-disorder support organisation in your country. In an emergency, contact your local emergency service.

!!S|Educational information supports a conversation with a qualified professional. It never replaces one.`,np=`## How to use this interactive book

1. **Navigate** with the contents rail on the left, the chapter list at the top of each part, or the full table of contents.
2. **Search** the whole book from the search field in the header — chapters, terms and sections are matched as you type.
3. **Track progress** — chapters you read are marked automatically on your device. Nothing is uploaded and no account is required.
4. **Bookmark and annotate** — save chapters and keep private notes in your browser's local storage. You can export and clear them at any time.
5. **Open the expandable panels** marked "Read more" for deeper explanations.
6. **Use the interactive tools** — the energy-balance beam, macronutrient explorer, activity reference, weekly planner, sleep and habit worksheets, flashcards, quiz and 30-day tracker.
7. **Switch themes** between warm daylight paper and inked night reading.
8. **Print** the worksheets, planners and any chapter — print styles are included.

!!K|Reading preferences, bookmarks, notes and challenge progress are stored locally in your browser. No account, no sign-up, no tracking.`,lp=`## Body respect and inclusive health principles

This book is written for bodies of every size, shape, age, ability, gender, ethnicity and economic circumstance. It follows five commitments:

1. **Health is not a size.** Nutritional adequacy, capability, metabolic markers and wellbeing describe health better than a scale number.
2. **No moral language about food.** Food is not good, bad, clean or cheating. It supplies nutrients, energy, culture and pleasure in different proportions.
3. **No body shaming, ever.** Weight stigma is a documented cause of harm, including delayed healthcare and disordered eating.
4. **Capability over appearance.** What a body can do — carry, climb, rest, recover, play, work — is the measure this book returns to.
5. **Circumstances are respected.** Budget, kitchen access, working hours, safety, climate, disability and culture all shape what is possible.

> Respect for a body is not conditional on what it looks like.`,sp=["Explain body weight, body composition and metabolism in evidence-based language.","Describe energy balance as a dynamic system rather than an arithmetic rule.","Build a nutritious, culturally flexible eating pattern within a real budget.","Apply current physical-activity guidance across aerobic, strength and mobility work.","Recognise the roles of sleep, stress, environment and habit in long-term behaviour.","Interpret BMI, weight fluctuation and metabolic adaptation accurately and critically.","Identify when educational information ends and professional care begins.","Recognise eating-disorder warning signs and respond with appropriate support.","Evaluate weight-loss claims using evidence rather than marketing.","Design a sustainable personal routine without rigid rules or self-blame."],Qi=[{term:"Adaptive thermogenesis",def:"The fall in energy expenditure beyond what is explained by loss of body mass during sustained energy restriction. Reversible, not permanent damage.",part:5},{term:"Anabolism",def:"The set of metabolic reactions that build and repair tissues, using energy and building blocks.",part:1},{term:"Appetite",def:"The psychological desire to eat, shaped by sight, smell, memory, culture and routine. Distinct from physical hunger.",part:2},{term:"Basal metabolic rate (BMR)",def:"Energy used by the body in a fully rested, fasted, thermoneutral state. The largest component of daily expenditure for most people.",part:1},{term:"Binge eating",def:"Eating an objectively large amount with a sense of loss of control, typically followed by distress. A feature of several eating disorders.",part:6},{term:"Bioelectrical impedance",def:"A method of estimating body composition from electrical resistance. Affected by hydration, food and recent exercise.",part:1},{term:"Body composition",def:"The proportions of fat mass, muscle, bone, water and organ tissue that make up a body.",part:1},{term:"Body image",def:"The thoughts, feelings and perceptions a person has about their own body. Can be positive or distressing at any size.",part:5},{term:"Body mass index (BMI)",def:"Weight in kilograms divided by height in metres squared. A population screening measure with significant individual limitations.",part:5},{term:"Catabolism",def:"Metabolic reactions that break molecules down to release energy and building blocks.",part:1},{term:"Circadian rhythm",def:"The internal 24-hour clock coordinating alertness, hormone release, temperature and digestion, entrained mainly by light.",part:4},{term:"Cortisol",def:"A steroid hormone released in response to stress and following a daily rhythm. Sustained elevation affects sleep, appetite and mood.",part:4},{term:"Craving",def:"A strong desire for a specific food or sensation, driven by reward learning, context and occasionally genuine physiological need.",part:2},{term:"Dietary diversity",def:"The range of different foods eaten across a period. A predictor of micronutrient adequacy.",part:2},{term:"Energy density",def:"The amount of energy per gram of food. Fats and fried foods are high; vegetables, soups and fruit are low.",part:2},{term:"Energy balance",def:"The relationship between energy taken in and energy expended over time. Dynamic: both sides adjust.",part:1},{term:"Essential fatty acids",def:"Fatty acids the body cannot synthesise and must obtain from food: alpha-linolenic acid (omega-3) and linoleic acid (omega-6).",part:2},{term:"Fat-free mass",def:"All body tissue that is not fat: muscle, bone, organs, connective tissue and body water.",part:1},{term:"Fibre",def:"Non-digestible carbohydrate from plant foods. Soluble fibre forms gels; insoluble fibre adds bulk. Fermented in part by gut microbes.",part:2},{term:"Flexibility",def:"The length to which a muscle and connective tissue can be extended. Distinct from mobility.",part:3},{term:"Ghrelin",def:"A hormone released mainly by the stomach before meals that increases the drive to eat.",part:1},{term:"Glycogen",def:"Stored carbohydrate in muscle and liver. Each gram holds roughly three grams of water, so it shifts body weight quickly.",part:5},{term:"Gut microbiota",def:"The community of microorganisms in the large intestine. Ferments fibre into short-chain fatty acids and influences metabolism and immunity.",part:2},{term:"Habit loop",def:"The cycle of cue, craving, response and reward that underpins automatic behaviour.",part:7},{term:"Homeostasis",def:"The body's tendency to maintain internal conditions within workable limits through feedback mechanisms.",part:1},{term:"Hyperthyroidism",def:"Overactivity of the thyroid gland, raising metabolic rate. A medical condition requiring diagnosis and treatment.",part:6},{term:"Hypothyroidism",def:"Underactivity of the thyroid gland, modestly lowering metabolic rate. Diagnosed by blood test and treated with medication.",part:6},{term:"Insulin",def:"A hormone released when nutrients arrive that promotes storage of glucose and signals satiety centrally.",part:1},{term:"Leptin",def:"A hormone released by fat tissue that signals long-term energy stores to the brain. Sensitivity falls in many people with more fat tissue.",part:1},{term:"Macronutrients",def:"Protein, carbohydrate and fat — the nutrients required in gram quantities that supply energy and structural material.",part:2},{term:"Metabolism",def:"The sum of all chemical reactions in the body, including both anabolism and catabolism.",part:1},{term:"Micronutrients",def:"Vitamins and minerals, required in small amounts for enzymes, bones, immunity, nerves and fluid balance.",part:2},{term:"Mobility",def:"The usable range of motion a joint can move through under control. Distinct from flexibility.",part:3},{term:"NEAT",def:"Non-exercise activity thermogenesis: energy used in everyday movement such as standing, walking, stairs and fidgeting.",part:1},{term:"Nutrient density",def:"The amount of nutrients per gram or per calorie of food. Vegetables, legumes, fish and whole grains score highly.",part:2},{term:"Obesity",def:"A clinical condition of excess adiposity, defined in practice using several measures and interpreted in individual clinical context.",part:5},{term:"Portion",def:"The amount of food a person actually takes at one time. Distinct from a standardised serving size.",part:2},{term:"Progressive overload",def:"The gradual increase in training demand — repetitions, sets, range, load or tempo — required for continued adaptation.",part:3},{term:"Protein",def:"A macronutrient supplying amino acids for tissue structure, enzymes, hormones, antibodies and transport.",part:2},{term:"Purging",def:"Self-induced vomiting, laxative or diuretic misuse, or enemas used to compensate for eating. A serious clinical behaviour.",part:6},{term:"Relative energy deficiency in sport (RED-S)",def:"A condition of insufficient energy availability affecting hormones, bone, metabolism and performance, in any gender.",part:3},{term:"Resting energy expenditure (REE)",def:"Energy used at rest under practical measurement conditions; close to BMR and the largest share of daily expenditure.",part:1},{term:"Satiation",def:"The processes that end a meal. Influenced by volume, protein, fibre, fat, texture and eating speed.",part:2},{term:"Satiety",def:"The sense of fullness and suppression of hunger between meals.",part:2},{term:"Sedentary behaviour",def:"Time spent sitting or lying with low energy expenditure. A separate behaviour from not exercising.",part:3},{term:"Serving size",def:"A standardised amount used on food labels and in guidance. Not a recommendation for how much to eat.",part:2},{term:"Short-chain fatty acids",def:"Compounds produced when gut microbes ferment fibre; they nourish colon cells and influence metabolism.",part:2},{term:"Stigma",def:"Social devaluation of people because of a characteristic — here, body size. Associated with worse health outcomes.",part:5},{term:"Thermic effect of food",def:"The energy cost of digesting, absorbing and processing nutrients. Highest for protein.",part:1},{term:"Total daily energy expenditure (TDEE)",def:"Resting expenditure plus physical activity, NEAT and the thermic effect of food.",part:1},{term:"VO2max",def:"The maximum rate at which the body can use oxygen during exercise. A strong predictor of long-term health.",part:3},{term:"Weight-neutral care",def:"A clinical approach focusing on behaviour, function and metabolic markers rather than body weight change as the goal.",part:5}],Rr=[{q:"Which component usually accounts for the largest share of total daily energy expenditure in a moderately active adult?",options:["Physical activity","Resting metabolism","The thermic effect of food","Digestion of fibre"],answer:1,explain:"Resting metabolism typically accounts for 50–70% of daily energy use. Activity varies most, but resting metabolism is the largest share for most people (Chapter 4)."},{q:"Your body weight rises by 1.2 kg between morning and evening. The most likely explanation is:",options:["You gained 1.2 kg of body fat","Fluid, sodium and gastrointestinal contents","Your metabolism slowed suddenly","You built muscle during the day"],answer:1,explain:"Daily change is dominated by water, sodium, glycogen and gut contents. A kilogram of fat tissue would require a very large sustained energy surplus (Chapter 25)."},{q:"BMI is best described as:",options:["A diagnostic test for individual health","A population-level screening measure with limitations","A measure of body fat percentage","A measure of metabolic rate"],answer:1,explain:"BMI was developed as a population statistic. It does not distinguish muscle from fat, ignores fat distribution, and is not valid as an adult measure for adolescents (Chapter 26)."},{q:"Which statement about eating disorders is correct?",options:["They only occur in people in very low body weights","They are only serious when weight changes","They can occur at any body size and need professional support","They can be managed with a well-planned diet"],answer:2,explain:"Eating disorders occur at every body size and carry the highest mortality of any mental illness. They require specialist care, not a diet plan (Chapter 34)."},{q:"Satiation refers to:",options:["The signals that end a meal","The time between meals","Long-term energy stores","The desire for a specific food"],answer:0,explain:"Satiation ends a meal; satiety is the interval until the next meal; craving is the desire for a specific food (Chapter 8)."},{q:"Which change is most likely to improve a habit's chance of sticking?",options:["Setting a larger goal","Relying on stronger motivation","Redesigning the environment to reduce friction","Publicly committing to a target weight"],answer:2,explain:"Environmental design consistently outperforms motivation. Making the behaviour obvious and easy is the most reliable lever (Chapter 38)."},{q:"Which statement about protein is accurate?",options:["It should be eaten in one large meal to maximise use","Only animal foods contain complete protein","Distributing protein-rich foods across meals supports muscle maintenance","High-protein diets are safe for everyone without supervision"],answer:2,explain:"Spreading protein-containing foods across meals supports muscle protein synthesis. Plant proteins combined across the day are entirely adequate (Chapters 10 and 32)."},{q:"During sustained energy restriction, what happens to energy expenditure?",options:["It rises steadily","It stays exactly the same","It falls with body mass and adapts slightly beyond that","It is permanently damaged"],answer:2,explain:"Adaptive thermogenesis lowers expenditure beyond the change explained by mass alone. It is reversible and does not represent permanent damage (Chapter 27)."},{q:"Which is a warning sign that eating has become a clinical concern?",options:["Enjoying a wide variety of foods","Eating meals with family","Purging or using laxatives after eating","Having seconds at a shared meal"],answer:2,explain:"Purging, laxative misuse, compulsive exercise and rigid restriction are clinical warning signs that warrant professional assessment at any body size (Chapter 34)."},{q:"For an adolescent who wants to lose weight, the appropriate response is:",options:["Follow the adult chapters and reduce portions","Add daily exercise and skip snacks","Seek physician and registered-dietitian guidance; growth comes first","Try a time-restricted eating window"],answer:2,explain:"This book provides no weight-loss instruction for anyone under 18. Adolescent growth requires abundant energy and nutrients; any weight concern is a clinical matter (Chapter 30)."},{q:"Which everyday practice best supports sleep?",options:["Sleeping longer on weekends only","A consistent wake time and morning light","Exercising vigorously immediately before bed","A nightcap to help you fall asleep"],answer:1,explain:"A consistent wake time anchors circadian rhythm, and morning light strengthens it. Alcohol fragments sleep later in the night (Chapter 22)."},{q:"A supplement claims you can lose 10 kg in 30 days with no diet or exercise. The most useful first question is:",options:["Where can I buy it?","What is the evidence and who is at risk?","Which influencers use it?","Does it contain natural ingredients?"],answer:1,explain:"Ask what is claimed, what the evidence shows, and who is at risk. Rapid-loss claims usually reflect water and lean tissue, and supplements are largely unregulated (Chapter 39)."}],cs={weeklyPlanner:{title:"Weekly movement planner",intro:"A one-page template. Plan the week you can actually live — including rest.",columns:["Day","Aerobic activity","Strength","Mobility / balance","Rest & notes"],rows:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]},mealPlanner:{title:"Flexible meal planning worksheet",intro:"Plan fewer meals than you think. Base + protein + vegetables + fat + flavour.",columns:["Meal","Base (grain, tuber, bread)","Protein-rich food","Vegetables / fruit","Fat & flavour","What is already at home?"],rows:["Dinner 1","Dinner 2","Dinner 3","Lunch (repeatable)","Breakfast (repeatable)"]},sleepReflection:{title:"Sleep and recovery reflection",intro:"Complete weekly. This is reflection, not diagnosis.",prompts:["What time did you go to bed, and what time did you wake?","How rested did you feel on waking (1–10)?","How many nights included caffeine after 15:00?","What helped you wind down, and what got in the way?","How did sleep affect your hunger and mood the next day?","One change to try next week:"]},habitBuilder:{title:"Habit-building worksheet",intro:"Design the loop before you rely on motivation.",prompts:["The behaviour I want (small and specific):","The cue — when and where it will happen:","The reward — what makes it satisfying:","The friction I will remove:","My backup plan for a busy day:","My rule for a missed day (e.g. never miss twice):"]}},op=`## Professional support and body-respect resources

**General health information**
- World Health Organization — fact sheets on obesity, physical activity, healthy diet and mental health: https://www.who.int/news-room/fact-sheets
- National Health Service (UK) — Live Well guidance on exercise, sleep, food labels and eating disorders: https://www.nhs.uk/live-well/
- Centers for Disease Control and Prevention (US) — body mass index information: https://www.cdc.gov/bmi/about/index.html
- National Institute of Diabetes and Digestive and Kidney Diseases (US) — weight management information: https://www.niddk.nih.gov/health-information/weight-management
- European Food Safety Authority — dietary reference values: https://www.efsa.europa.eu/en/interactive-pages/drv

**Eating-disorder support**
- Beat (United Kingdom) — information, support and helplines: https://www.beateatingdisorders.org.uk/
- National Eating Disorders Collaboration (Australia) — prevention, identification and referral: https://nedc.com.au/
- National Eating Disorders Association and equivalent national bodies — see your country's listed service.

**Nutrition professionals**
- Academy of Nutrition and Dietetics (US) — find a registered dietitian: https://www.eatright.org/
- In most countries, a physician can refer you to a registered dietitian, physiotherapist or mental-health clinician.

!!S|If you are in immediate danger or thinking about harming yourself, contact your local emergency service or crisis line now. In many countries, short-code crisis lines are available 24 hours a day.`,rp=`## Further reading and how to evaluate it

1. **Prefer institutional guidance** — WHO, FAO, national academies, public-health agencies and national clinical guideline bodies.
2. **Prefer systematic reviews** over single studies, and human studies over animal or laboratory studies.
3. **Check the sample, not the headline** — small studies and short interventions rarely justify strong claims.
4. **Check who benefits** — a study funded and promoted by a product seller needs more scrutiny.
5. **Check the date** — nutrition guidance is revised as evidence accumulates; older guidance may have been superseded.
6. **Be wary of** single-nutrient explanations, detox language, promises of rapid results, and before-and-after testimonials.`,cp={"factors-weight":{id:"factors-weight",kind:"flow",title:"Plate 1 — The many factors that influence body weight",alt:"Diagram with five groups of factors — biology, behaviour, physical environment, social circumstances and healthcare — each pointing toward a central box labelled body weight and health.",caption:"Body weight sits at the intersection of biology, behaviour, environment, social circumstances and healthcare. No single factor explains an individual body.",nodes:[{id:"bio",col:0,row:0,label:"Biology",sub:"Genes, hormones, growth, age"},{id:"beh",col:0,row:1,label:"Behaviour",sub:"Eating, movement, sleep"},{id:"env",col:0,row:2,label:"Physical environment",sub:"Food supply, streets, housing"},{id:"soc",col:0,row:3,label:"Social circumstances",sub:"Income, work, culture, stigma"},{id:"hc",col:0,row:4,label:"Healthcare",sub:"Medicines, conditions, support"},{id:"out",col:2,row:2,label:"Body weight & health",sub:"A result, not a verdict",accent:!0}],edges:[{from:"bio",to:"out"},{from:"beh",to:"out"},{from:"env",to:"out"},{from:"soc",to:"out"},{from:"hc",to:"out"}]},"body-composition":{id:"body-composition",kind:"bars",title:"Plate 2 — What a human body is made of",alt:"Horizontal bars showing typical body composition: water about 60 percent, muscle and organ tissue about 25 percent, fat mass varying widely, bone minerals about 4 percent.",caption:"Illustrative adult proportions. Fat mass varies enormously between people and across the lifespan; water content shifts daily. These are teaching ranges, not targets.",segments:[{label:"Body water",value:60,note:"Shifts with intake, sodium, activity"},{label:"Muscle & organ tissue",value:22,note:"The most metabolically active tissue"},{label:"Fat mass",value:14,note:"Essential and storage fat; wide healthy variation"},{label:"Bone mineral",value:4,note:"Dense tissue, low mass share"}]},"metabolism-overview":{id:"metabolism-overview",kind:"cycle",title:"Plate 3 — Metabolism: build, break down, rebuild",alt:"Circular diagram showing food energy and nutrients entering catabolism to release energy, then anabolism building and repairing tissues, returning to the body's structures.",caption:"Metabolism is not a single organ or switch. It is the continuous chemistry of building (anabolism) and breaking down (catabolism) that keeps every cell working.",items:[{label:"Food & drink",note:"Carbohydrate, fat, protein, alcohol"},{label:"Digestion & absorption",note:"Nutrients enter the bloodstream"},{label:"Catabolism",note:"Molecules broken down, energy released"},{label:"ATP — usable energy",note:"Powers muscle, nerve, repair"},{label:"Anabolism",note:"Tissue built, repaired, stored"},{label:"Structure & function",note:"Muscle, bone, organs, immunity"}]},"energy-expenditure":{id:"energy-expenditure",kind:"bars",title:"Plate 4 — Where the day's energy goes",alt:"Four horizontal bars comparing components of total daily energy expenditure: resting metabolism the largest, then physical activity, then the thermic effect of food, then non-exercise activity.",caption:"Typical shares for a moderately active adult. Resting metabolism is the largest component for most people; proportions differ by body size, age, occupation and fitness.",segments:[{label:"Resting metabolism (BMR/REE)",value:60,note:"Breathing, circulation, cellular repair"},{label:"Physical activity",value:20,note:"Planned movement; highly variable"},{label:"NEAT — everyday movement",value:12,note:"Standing, fidgeting, stairs, chores"},{label:"Thermic effect of food",value:8,note:"Energy used to digest and process food"}]},"energy-balance":{id:"energy-balance",kind:"beam",title:"Plate 5 — Dynamic energy balance",alt:"A balance scale with intake on one pan and expenditure on the other, connected to a feedback loop showing appetite, metabolic adaptation and body stores changing over time.",caption:"Energy balance is dynamic, not arithmetic. Change one side and the body adjusts the other through appetite, movement drive and thermogenesis — which is why simple subtraction rarely predicts an individual outcome.",segments:[{label:"Energy intake",value:100,note:"Food and drink, across days and weeks"},{label:"Energy expenditure",value:100,note:"Resting, movement, digestion, adaptation"}],extras:["Feedback: appetite rises or falls with body stores and food availability","Feedback: thermogenesis and movement efficiency adapt over weeks","Feedback: sleep, stress and medication shift both sides of the scale"]},"hormone-appetite":{id:"hormone-appetite",kind:"flow",title:"Plate 6 — Hormones and appetite signalling",alt:"Flow diagram linking body stores and the digestive tract to the brain's appetite centres, showing leptin, ghrelin, insulin, cortisol and sex hormones as messengers rather than switches.",caption:"Hormones carry information about stores, meals, stress and reproductive status. They modulate appetite and expenditure — none of them acts as an independent weight switch.",nodes:[{id:"stores",col:0,row:0,label:"Body stores",sub:"Fat tissue, liver, muscle"},{id:"gut",col:0,row:1,label:"Digestive tract",sub:"Meal volume, nutrients"},{id:"stress",col:0,row:2,label:"Stress & sleep",sub:"Cortisol, circadian rhythm"},{id:"brain",col:1,row:1,label:"Brain appetite centres",sub:"Hypothalamus, reward circuits",accent:!0},{id:"out",col:2,row:1,label:"Hunger, satiety & expenditure",sub:"Adjusted continuously"}],edges:[{from:"stores",to:"brain",label:"Leptin, insulin"},{from:"gut",to:"brain",label:"Ghrelin, PYY, GLP-1"},{from:"stress",to:"brain",label:"Cortisol, melatonin"},{from:"brain",to:"out"}]},"hunger-satiety":{id:"hunger-satiety",kind:"wave",title:"Plate 7 — Hunger, satiation and satiety across a day",alt:"Line chart of a rising and falling fullness signal across the day, marking physical hunger before a meal, satiation at the end of eating, and satiety until the next meal.",caption:"Satiation ends a meal; satiety is the time between meals. Meal composition, sleep, routine and environment all bend this curve — there is no single correct shape.",series:[{label:"Fullness signal",points:[55,30,12,78,92,84,70,52,34,16,74,90,80,62,44,26],accent:!0}],xlabels:["7:00","","11:00","","","13:00","","","17:00","","19:00","","","22:00","",""]},macros:{id:"macros",kind:"compare",title:"Plate 8 — The three macronutrients at a glance",alt:"Three-column comparison of protein, carbohydrate and fat showing their main roles and typical food sources.",caption:"All three macronutrients are essential. Restricting an entire group removes nutrients, fibre and cultural foods without a compensating benefit for most people.",cols:[{title:"Protein",items:["Builds and repairs tissue","Enzymes, antibodies, transport","Supports satiety and muscle","Sources: legumes, fish, eggs, dairy, soy, meat, nuts"]},{title:"Carbohydrate",items:["Preferred fuel for brain and muscle","Fibre feeds the gut microbiota","B vitamins and minerals in whole forms","Sources: grains, tubers, fruit, legumes, dairy"]},{title:"Fat",items:["Concentrated energy reserve","Absorbs vitamins A, D, E, K","Cell membranes and hormones","Sources: oils, nuts, seeds, fish, avocado, dairy"]}]},"fiber-digestion":{id:"fiber-digestion",kind:"steps",title:"Plate 9 — Fibre through the digestive tract",alt:"Four-stage diagram following fibre from the mouth and stomach through the small intestine to the large intestine, where fermentation produces short-chain fatty acids.",caption:"Soluble fibre slows digestion and forms gels; insoluble fibre adds bulk. Both reach the large intestine where microbes ferment part of the residue.",steps:[{n:"1",title:"Mouth & stomach",body:"Chewing and gastric filling begin satiation. Fibre holds water and slows gastric emptying."},{n:"2",title:"Small intestine",body:"Soluble fibre slows glucose and cholesterol absorption; nutrients are absorbed."},{n:"3",title:"Large intestine",body:"Microbes ferment resistant starch and soluble fibre into short-chain fatty acids."},{n:"4",title:"Bowel function",body:"Insoluble fibre adds bulk and supports regular, comfortable bowel movements."}]},hydration:{id:"hydration",kind:"bars",title:"Plate 10 — Where everyday fluid comes from",alt:"Horizontal bars showing that drinks provide most daily fluid, with a smaller contribution from food moisture and a modest obligatory loss through urine, skin, lungs and stool.",caption:"Fluid needs rise with heat, humidity, altitude, pregnancy, breastfeeding, illness and long or intense activity. Thirst and urine colour are reasonable everyday guides.",segments:[{label:"Beverages (water, tea, milk, broth)",value:70,note:"The largest source for most adults"},{label:"Moisture in food",value:25,note:"Soups, stews, fruit, vegetables, rice dishes"},{label:"Metabolic water",value:5,note:"Produced when nutrients are oxidised"}],extras:["Losses: urine, sweat, breathing, stool — all increase with heat and activity","Water needs are individual: body size, climate, diet, pregnancy and health all matter"]},"dietary-patterns":{id:"dietary-patterns",kind:"grid",title:"Plate 11 — Dietary patterns compared as patterns, not races",alt:"Six cards comparing Mediterranean-style, plant-forward, traditional regional, vegetarian, vegan and flexible omnivorous patterns by emphasis and nutritional considerations.",caption:"Patterns overlap. What they share — vegetables, legumes, whole grains, minimally processed foods — matters more than the label on the diet.",cells:[{title:"Mediterranean-style",body:"Olive oil, legumes, vegetables, fish, whole grains. Strong evidence base; adaptable to any coastline or market."},{title:"Plant-forward",body:"Plants dominate the plate, animal foods optional and small. Flexible, affordable, culturally neutral."},{title:"Traditional regional",body:"Injera, rice and dal, maize and beans, taro and fish. Long-tested combinations that already fit local supply."},{title:"Vegetarian",body:"No meat or fish; often includes dairy and eggs. Watch iron, zinc, iodine and omega-3 variety."},{title:"Vegan",body:"No animal foods. Requires reliable vitamin B12, and attention to calcium, iodine, iron and long-chain omega-3."},{title:"Flexible / omnivorous",body:"Everything in varying proportions. Quality and consistency matter more than category."}]},"food-environment":{id:"food-environment",kind:"flow",title:"Plate 12 — How the food environment shapes eating",alt:"Flow diagram from availability, price, marketing and social norms into the individual decision to eat, then to the eating pattern over time.",caption:"Eating decisions are made inside an environment. Availability, price, marketing, time and social norms usually exert more influence than individual willpower.",nodes:[{id:"avail",col:0,row:0,label:"Availability",sub:"Home, shops, school, work"},{id:"price",col:0,row:1,label:"Price & income",sub:"Cost per meal, seasonality"},{id:"mkt",col:0,row:2,label:"Marketing",sub:"Packaging, media, promotions"},{id:"time",col:1,row:0,label:"Time & energy",sub:"Shift work, care duties, cooking facilities"},{id:"soc",col:1,row:2,label:"Social & cultural norms",sub:"Family, celebration, religion"},{id:"eat",col:2,row:1,label:"Everyday eating pattern",sub:"Shaped over months, not moments",accent:!0}],edges:[{from:"avail",to:"eat"},{from:"price",to:"eat"},{from:"mkt",to:"eat"},{from:"time",to:"eat"},{from:"soc",to:"eat"}]},"balanced-plate":{id:"balanced-plate",kind:"plate",title:"Plate 13 — A flexible plate model",alt:"A plate divided into sections: half vegetables and fruit, a quarter protein-rich foods, a quarter starchy staples, with water as the default drink and a small fat or oil portion.",caption:"One optional visual aid among many. It is not a prescription, does not translate directly into grams or calories, and can be adapted to any cuisine.",sectors:[{label:"Vegetables & fruit",pct:50,note:"Colour and variety across the week"},{label:"Protein-rich foods",pct:25,note:"Legumes, fish, eggs, soy, dairy, meat"},{label:"Starchy staples",pct:25,note:"Grains, tubers, bread, noodles"}],extras:["Add a source of fat for flavour and nutrient absorption","Water or unsweetened tea as the everyday drink","Adjust the size of the plate to appetite and needs"]},"portion-visual":{id:"portion-visual",kind:"compare",title:"Plate 14 — Portion awareness without portion obsession",alt:"Comparison of hand-based visual cues, everyday household objects and cultural serving styles as informal ways to describe amounts of food.",caption:"Hand and household cues are rough guides, not measurements. Appetite, body size, activity and life stage all change how much food is appropriate at a given meal.",cols:[{title:"Hand cues (informal)",items:["Palm ≈ a portion of protein foods","Cupped hand ≈ cooked grains or fruit","Thumb tip ≈ a spoon of oil or nut butter","Hands differ — this is an approximation"]},{title:"Household objects",items:["A tennis ball ≈ a piece of fruit","A matchbox ≈ a small cube of cheese","A standard bowl is not a standard amount","Serving vessels shape how much we eat"]},{title:"Cultural structures",items:["Shared dishes and rice bowls","Thali, mezze, bento, braai plates","Communal serving can slow eating","Family style supports self-regulation"]}]},"movement-benefits":{id:"movement-benefits",kind:"flow",title:"Plate 15 — What movement does beyond body weight",alt:"Diagram showing everyday movement branching into cardiovascular, musculoskeletal, metabolic, mental and social benefits.",caption:"The strongest case for movement is functional and metabolic. Weight change is a possible side effect, not the measure of whether movement is working.",nodes:[{id:"move",col:0,row:1,label:"Everyday movement",sub:"Any intensity, any duration",accent:!0},{id:"cv",col:1,row:0,label:"Cardiovascular",sub:"Heart, lungs, circulation"},{id:"msk",col:1,row:1,label:"Musculoskeletal",sub:"Muscle, bone, joints"},{id:"met",col:1,row:2,label:"Metabolic",sub:"Glucose handling, insulin sensitivity"},{id:"men",col:2,row:0,label:"Mental wellbeing",sub:"Mood, stress, sleep quality"},{id:"soc",col:2,row:2,label:"Function & connection",sub:"Independence, confidence, community"}],edges:[{from:"move",to:"cv"},{from:"move",to:"msk"},{from:"move",to:"met"},{from:"cv",to:"men"},{from:"msk",to:"soc"}]},"everyday-movement":{id:"everyday-movement",kind:"grid",title:"Plate 16 — Movement that fits real days",alt:"Six cards listing movement opportunities across home, transport, work and community settings, including options for limited space and limited mobility.",caption:"Accumulated movement counts. Ten minutes of walking to a bus stop is not lesser activity than ten minutes on a treadmill.",cells:[{title:"Transport",body:"Walk or cycle part of a journey, alight one stop early, park further away, use stairs where safe."},{title:"Home",body:"Sweeping, washing by hand, gardening, carrying shopping, playing with children, active video games."},{title:"Work or study",body:"Stand during calls, walk at lunch, take stairs, brief movement breaks every 30–60 minutes."},{title:"Seated options",body:"Chair-based leg lifts, seated marching, resistance bands, upper-body mobility, wheelchair pushes."},{title:"Community",body:"Dance, tai chi in the park, walking groups, faith-community activities, local sports, market trips."},{title:"Safety first",body:"Lighted routes, clean air, weather, footwear, pain, chronic conditions and personal safety all shape what is possible."}]},"strength-guide":{id:"strength-guide",kind:"steps",title:"Plate 17 — A beginner strength session, drawn",alt:"Four-step diagram of a beginner strength routine: a squat-to-chair sit, a wall or knee push, a hip hinge and a row with a band or bag, each shown with a simple line figure.",caption:"No gym required. A chair, a wall, a filled backpack or a resistance band covers most beginner needs. Technique and control matter more than load.",steps:[{n:"1",title:"Sit-to-stand",body:"Sit on a chair, stand up, sit down slowly. 6–12 repetitions. Add a bag of rice for load."},{n:"2",title:"Push (wall or floor)",body:"Hands on a wall, counter or floor. Lower with control, breathe out as you push."},{n:"3",title:"Hinge & carry",body:"Push hips back with a flat spine, stand tall, then carry something heavy across the room."},{n:"4",title:"Pull (band or bag)",body:"Pull a band or a heavy bag toward you, shoulder blades drawing together. Repeat both sides."}]},"aerobic-zones":{id:"aerobic-zones",kind:"spectrum",title:"Plate 18 — Intensity is a dial, not a switch",alt:"A horizontal intensity scale from very light to vigorous, with the talk test used to mark the boundaries between easy, moderate and hard effort.",caption:"Talk test, not heart-rate charts: if you can hold a conversation you are working at a moderate level; if you can only say a few words you are working hard. Both belong in a balanced week.",axis:"Effort — from everyday movement to vigorous training",marks:[{pos:8,label:"Very light",note:"Standing, slow walking, gentle mobility"},{pos:32,label:"Light",note:"Brisk walking, easy cycling, housework"},{pos:56,label:"Moderate",note:"Talking possible; brisk pace, dancing, swimming"},{pos:80,label:"Vigorous",note:"Few words at a time; running, singles sport, hills"}]},"mobility-balance":{id:"mobility-balance",kind:"cycle",title:"Plate 19 — Mobility, flexibility, balance and coordination",alt:"Circular diagram linking joint range of motion, muscle length, balance reactions and coordination into functional movement such as reaching, turning and stepping.",caption:"These capacities support each other. Functional movement — reaching a shelf, stepping over a kerb, turning to look behind you — is the real outcome.",items:[{label:"Joint mobility",note:"Range available at the joint"},{label:"Muscle length",note:"Comfortable extensibility, not maximum stretch"},{label:"Balance",note:"Reactions from foot, inner ear and vision"},{label:"Coordination",note:"Timing of muscle sequences"},{label:"Strength control",note:"Stability through the range"},{label:"Functional movement",note:"Everyday tasks performed safely"}]},"recovery-cycle":{id:"recovery-cycle",kind:"cycle",title:"Plate 20 — The training–recovery cycle",alt:"Circular diagram of the training cycle: stimulus, refuelling, sleep and repair, adaptation, then performance returning at a higher level before the next stimulus.",caption:"Adaptation happens during recovery, not during the session. Without sleep, food and rest days, training load becomes accumulated fatigue.",items:[{label:"Training stimulus",note:"The session that asks the body to work"},{label:"Refuelling",note:"Carbohydrate, protein, fluids, micronutrients"},{label:"Sleep",note:"Growth hormone release, repair, memory"},{label:"Rest days",note:"Low-load movement, walking, mobility"},{label:"Adaptation",note:"Muscle, tendon, heart and nerve rebuild"},{label:"Readiness",note:"Energy, mood and performance return"}]},"weekly-plan":{id:"weekly-plan",kind:"grid",title:"Plate 21 — The shape of a balanced week",alt:"Seven-day grid showing a mix of aerobic movement, strength work, mobility and rest days for a beginner-intermediate week.",caption:"An example shape, not a schedule to follow exactly. Two strength sessions, most days with some movement, and at least one full rest day is a workable pattern for many adults.",cells:[{title:"Monday — Move",body:"20–30 min brisk walking or cycling at a conversational pace."},{title:"Tuesday — Strength",body:"25 min: sit-to-stand, push, hinge, row, carry. Two rounds."},{title:"Wednesday — Recover",body:"Easy walk, gentle mobility, longer sleep opportunity."},{title:"Thursday — Move",body:"30 min continuous activity: swimming, dancing, walking."},{title:"Friday — Strength",body:"25 min: the same patterns, slightly more repetitions or load."},{title:"Saturday — Play",body:"Something enjoyable: hike, sport, gardening, market walk."},{title:"Sunday — Rest",body:"Rest or very light activity. Reflect and plan the week ahead."}]},"sleep-circadian":{id:"sleep-circadian",kind:"wave",title:"Plate 22 — Circadian rhythm and the sleep period",alt:"Chart of alertness across 24 hours showing a peak in the morning, a dip in the early afternoon, a rise in the evening and a low overnight during sleep.",caption:"Alertness and appetite hormones follow a roughly 24-hour rhythm. Late nights and rotating shifts disrupt it — which affects hunger and energy as well as alertness.",series:[{label:"Alertness",points:[20,45,78,92,88,70,58,66,82,90,84,60,30,12,8,12],accent:!0}],xlabels:["02:00","","06:00","","10:00","","14:00","","18:00","","22:00","","","","",""]},"stress-response":{id:"stress-response",kind:"flow",title:"Plate 23 — The stress response and everyday wellbeing",alt:"Flow diagram from a stressor through the brain and nervous system to cortisol and adrenaline release, then to short-term helpful effects and longer-term strain on sleep, appetite and mood.",caption:"Short bursts of stress are normal and useful. Sustained stress shifts sleep, appetite and motivation — the target is recovery and support, not eliminating stress entirely.",nodes:[{id:"stressor",col:0,row:1,label:"Stressor",sub:"Work, money, care, illness, noise"},{id:"brain",col:1,row:1,label:"Brain & nervous system",sub:"Threat detection, arousal",accent:!0},{id:"horm",col:2,row:0,label:"Cortisol & adrenaline",sub:"Glucose release, alertness"},{id:"body",col:2,row:2,label:"Body changes",sub:"Heart rate, muscle tension, digestion"},{id:"out",col:3,row:1,label:"Sleep, appetite & mood",sub:"Often the first things to shift"}],edges:[{from:"stressor",to:"brain"},{from:"brain",to:"horm"},{from:"brain",to:"body"},{from:"horm",to:"out"},{from:"body",to:"out"}]},"daily-environment":{id:"daily-environment",kind:"flow",title:"Plate 24 — Habits live inside daily circumstances",alt:"Diagram linking work schedule, home routines, budget, transport and social environment to the practical opt
