ions available for eating, movement and sleep.",caption:"Sustainable change works with circumstances, not against them. A plan that ignores shift work, care duties or budget is not a plan — it is a wish.",nodes:[{id:"work",col:0,row:0,label:"Work & study schedule",sub:"Shifts, hours, commute"},{id:"home",col:0,row:1,label:"Home routines",sub:"Kitchen access, storage, cooking time"},{id:"budget",col:0,row:2,label:"Budget & transport",sub:"Prices, distance, storage"},{id:"social",col:1,row:0,label:"Social environment",sub:"Family, peers, culture, media"},{id:"space",col:1,row:2,label:"Space & safety",sub:"Room to move, safe streets, air quality"},{id:"plan",col:2,row:1,label:"Realistic habits",sub:"Built on what is actually available",accent:!0}],edges:[{from:"work",to:"plan"},{from:"home",to:"plan"},{from:"budget",to:"plan"},{from:"social",to:"plan"},{from:"space",to:"plan"}]},"weight-fluctuation":{id:"weight-fluctuation",kind:"wave",title:"Plate 25 — Daily weight is noisy; the trend is quieter",alt:"Two overlapping line charts over eight weeks: a jagged daily weight line varying by up to two kilograms and a smooth underlying trend line moving slowly downward.",caption:"Water, glycogen, sodium, meal timing, the menstrual cycle and bowel contents move the scale daily. A single reading is not a measurement of body fat.",series:[{label:"Daily reading",points:[72,70,73,71,74,72,70,71,69,72,70,68,71,69,67,68]},{label:"Underlying trend",points:[71,70.8,70.6,70.3,70.1,69.9,69.7,69.5,69.3,69.1,68.9,68.7,68.5,68.3,68.1,68],accent:!0}],xlabels:["Week 1","","","","Week 3","","","","Week 5","","","","Week 7","","",""]},"bmi-limits":{id:"bmi-limits",kind:"spectrum",title:"Plate 26 — BMI as a population ruler",alt:"A horizontal scale showing adult BMI category cut-offs from underweight to obesity class 3, annotated with the factors BMI cannot see such as muscle mass, age, ethnicity and body fat distribution.",caption:"BMI was designed to describe populations, not to diagnose individuals. Adult cut-offs are not validated for adolescents, pregnancy, or people with high muscle mass or certain chronic conditions.",axis:"Adult BMI (kg/m²) — a screening aid only",marks:[{pos:10,label:"< 18.5",note:"Underweight — may signal undernutrition or illness"},{pos:34,label:"18.5 – 24.9",note:"Healthy weight range — not a guarantee of health"},{pos:58,label:"25 – 29.9",note:"Overweight — risk varies with fitness and body composition"},{pos:82,label:"≥ 30",note:"Obesity classes 1–3 — clinical context decides what follows"}]},"metabolic-adaptation":{id:"metabolic-adaptation",kind:"wave",title:"Plate 27 — Why progress slows: adaptive thermogenesis",alt:"Chart showing energy expenditure falling faster than body weight over twelve weeks of reduced intake, then plateauing while appetite signals rise.",caption:"As body mass falls, less tissue needs fuel, and expenditure adapts slightly beyond that. This is normal physiology and reversible — it is not a permanently damaged metabolism.",series:[{label:"Energy expenditure",points:[100,98,96,93,91,89,87,86,85,84,84,83],accent:!0},{label:"Body weight",points:[100,99,98,97,96,95,94.4,94,93.7,93.5,93.3,93.2]}],xlabels:["Week 1","","3","","5","","7","","9","","11",""]},"genetics-environment":{id:"genetics-environment",kind:"flow",title:"Plate 28 — Genes load the gun, environment holds the setting",alt:"Diagram showing genetic variation influencing appetite, fat distribution and metabolic rate, meeting environmental influences such as food supply, sleep and medication to produce individual outcomes.",caption:"Genetic differences are real and measurable, but they operate through an environment. Neither genes nor circumstances are destiny, and neither is a moral category.",nodes:[{id:"genes",col:0,row:0,label:"Genetic variation",sub:"Appetite signalling, fat distribution, rate"},{id:"epi",col:0,row:1,label:"Early life & development",sub:"Growth, birth weight, feeding history"},{id:"env",col:0,row:2,label:"Environment",sub:"Food supply, sleep, work, pollution"},{id:"med",col:1,row:1,label:"Health & medication",sub:"Thyroid, steroids, insulin, antipsychotics",accent:!0},{id:"out",col:2,row:1,label:"Individual body & health",sub:"Unique combination"}],edges:[{from:"genes",to:"med"},{from:"epi",to:"med"},{from:"env",to:"med"},{from:"med",to:"out"}]},stigma:{id:"stigma",kind:"grid",title:"Plate 29 — Weight stigma: what it does and what helps",alt:"Four cards describing where weight stigma appears, how it affects health and behaviour, what respectful communication sounds like, and what to avoid.",caption:"Stigma is a health issue in its own right. It reduces healthcare access, increases stress and discourages the very behaviours that support wellbeing.",cells:[{title:"Where it appears",body:"Healthcare, workplaces, schools, media, family comments, seating and equipment that does not fit."},{title:"What it does",body:"Delay in seeking care, avoidance of movement, elevated stress, disordered eating and reduced trust in health advice."},{title:"What helps",body:"People-first language, accessible equipment, weight-neutral health goals, and focusing on behaviour and function."},{title:"What to avoid",body:"Before-and-after imagery, moral labels like good or bad food, assumptions about health from appearance, and unsolicited weight comments."}]},"life-stages":{id:"life-stages",kind:"spectrum",title:"Plate 30 — Nutrition and movement needs change across life",alt:"A life-course timeline from adolescence through adulthood to older age, marking growth, pregnancy, midlife and later life as distinct nutritional and activity stages.",caption:"Growth, pregnancy, ageing and illness change requirements. Guidance written for one life stage can be inappropriate — even harmful — for another.",axis:"Life course",marks:[{pos:10,label:"Adolescence",note:"Growth, bone accrual, development. No weight-loss dieting without clinical oversight."},{pos:38,label:"Early adulthood",note:"Establishing routines; fertility, work and study pressures"},{pos:62,label:"Midlife",note:"Muscle maintenance, sleep, chronic-disease prevention"},{pos:88,label:"Older adulthood",note:"Protein, bone, balance, hydration, food security"}]},"adult-habits":{id:"adult-habits",kind:"cycle",title:"Plate 31 — The everyday system that supports adult health",alt:"Circular diagram linking eating pattern, movement, sleep, stress management, social connection and routine into a self-reinforcing system.",caption:"These domains interact. Improving one usually helps another; neglecting one usually costs the others.",items:[{label:"Eating pattern",note:"Regular, varied, mostly minimally processed"},{label:"Movement",note:"Aerobic, strength, mobility, everyday activity"},{label:"Sleep",note:"Consistent timing, sufficient duration"},{label:"Stress",note:"Recovery practices and realistic demands"},{label:"Connection",note:"Shared meals, community, support"},{label:"Routine",note:"Small repeatable actions that survive busy weeks"}]},"older-adults":{id:"older-adults",kind:"grid",title:"Plate 32 — Priorities in later adulthood",alt:"Four cards covering muscle and bone maintenance, protein and hydration, balance and fall prevention, and food access and eating support.",caption:"In later life the aim shifts decisively toward function: staying strong enough to live independently, and eating well enough to stay nourished.",cells:[{title:"Muscle & bone",body:"Resistance work twice weekly, weight-bearing activity, adequate protein, calcium and vitamin D."},{title:"Appetite & hydration",body:"Appetite often falls; smaller nutrient-dense meals, flavoured and warm fluids, and regular drinking opportunities help."},{title:"Balance & falls",body:"Balance practice, vision checks, footwear, home hazards, lighting and strength work reduce fall risk."},{title:"Food access",body:"Dentition, swallowing, transport, income, cooking alone and medication all affect what is actually eaten."}]},pregnancy:{id:"pregnancy",kind:"steps",title:"Plate 33 — Body change across pregnancy and postpartum",alt:"Four-stage diagram from early pregnancy through late pregnancy to birth and postpartum recovery, with the changing nutritional and activity priorities at each stage.",caption:"Pregnancy is a period of growth, not of weight loss. Requirements rise for energy, protein, folate, iodine, iron and fluid; activity guidance depends on the individual pregnancy.",steps:[{n:"1",title:"Early pregnancy",body:"Nausea, taste change and fatigue are common. Folate, iodine and food safety matter most; eating small amounts regularly is acceptable."},{n:"2",title:"Mid and late pregnancy",body:"Energy needs rise modestly; protein, iron, calcium and fluid needs rise more. Activity should continue within comfort and clinical advice."},{n:"3",title:"Birth and early postpartum",body:"Recovery, wound healing, sleep disruption and feeding demands dominate. Restriction and aggressive exercise are inappropriate."},{n:"4",title:"Later postpartum",body:"Gradual return to movement, continued nutrient-dense eating, and support for mood, sleep and body image."}]},"eating-disorder-signals":{id:"eating-disorder-signals",kind:"flow",title:"Plate 34 — Recognising when eating needs professional support",alt:"Diagram of warning signs — rigid food rules, secretive eating, purging, compulsive exercise, rapid weight change and body-image distress — converging on a box recommending professional support.",caption:"Eating disorders occur at every body size, including bodies that look healthy. Any of these signs warrants professional assessment, regardless of weight.",nodes:[{id:"rules",col:0,row:0,label:"Rigid food rules",sub:"Eliminating groups, ritualised eating"},{id:"binge",col:0,row:1,label:"Loss of control eating",sub:"Binge episodes, secrecy, distress"},{id:"purge",col:0,row:2,label:"Purging or compensation",sub:"Vomiting, laxatives, compulsive exercise"},{id:"body",col:1,row:0,label:"Body-image distress",sub:"Avoiding mirrors, social withdrawal"},{id:"weight",col:1,row:2,label:"Rapid physical change",sub:"Or persistent preoccupation with weight"},{id:"help",col:2,row:1,label:"Professional support",sub:"GP, dietitian, mental-health clinician",accent:!0}],edges:[{from:"rules",to:"help"},{from:"binge",to:"help"},{from:"purge",to:"help"},{from:"body",to:"help"},{from:"weight",to:"help"}]},"medical-factors":{id:"medical-factors",kind:"grid",title:"Plate 35 — Medical conditions that change the picture",alt:"Four cards listing conditions and treatments that affect body weight, appetite or activity, plus the principle that management must be individualised by qualified clinicians.",caption:"Educational information cannot replace clinical assessment. Never start, stop or change a prescribed medicine because of body weight without speaking to the prescriber.",cells:[{title:"Hormonal & metabolic",body:"Thyroid disorders, polycystic ovary syndrome, Cushing syndrome, diabetes, menopause-related change."},{title:"Medication-related",body:"Some corticosteroids, antipsychotics, insulin, certain antidepressants and anticonvulsants can change appetite or weight."},{title:"Mechanical & mobility",body:"Arthritis, chronic pain, injury, respiratory disease and disability change what movement is possible."},{title:"Individualised care",body:"Dietitians, physiotherapists, physicians and psychologists work together; the plan follows the person, not the category."}]},"meal-planning":{id:"meal-planning",kind:"steps",title:"Plate 36 — A practical weekly food system",alt:"Four-step diagram: plan the week, shop to a list, prepare components in advance, and assemble flexible meals using what is available.",caption:"A food system reduces daily decision-making. It must survive a busy week, a tight budget and people who do not all eat the same way.",steps:[{n:"1",title:"Plan",body:"Sketch 3–5 dinners and repeat breakfasts and lunches. Leave room for leftovers, canteens and take-away."},{n:"2",title:"Shop",body:"List by aisle or market section; check what is already at home; buy seasonal and store-brand staples first."},{n:"3",title:"Prepare",body:"Cook a pot of grains or legumes, wash and cut vegetables, portion snacks, freeze half of a large batch."},{n:"4",title:"Assemble",body:"Staple + protein + vegetables + fat + flavour = a meal. Rotate sauces and spices rather than recipes."}]},"home-routine":{id:"home-routine",kind:"grid",title:"Plate 37 — A no-equipment home movement routine",alt:"Six cards describing equipment-free exercises: sit-to-stand, wall push, hip hinge, calf raise, band row and a mobility flow.",caption:"Ten to twenty minutes at home is enough to maintain strength and mobility. Space of roughly two by one metres and a chair are sufficient.",cells:[{title:"Sit-to-stand ×8",body:"Sit tall on a chair, stand without using hands if possible, lower with control. Add a bag for load."},{title:"Wall or counter push ×8",body:"Body straight, elbows at a comfortable angle, lower for two counts."},{title:"Hip hinge ×10",body:"Push hips back, spine long, feel the stretch in the back of the thighs, stand tall."},{title:"Calf raise ×12",body:"Hold a wall, rise onto the balls of the feet, lower slowly. Great for balance and walking."},{title:"Band or bag row ×10",body:"Pull toward the ribs, squeeze the shoulder blades, control the return."},{title:"Mobility flow ×5 min",body:"Neck, shoulders, spine rotation, hips and ankles — move through comfortable range only."}]},"habit-loop":{id:"habit-loop",kind:"cycle",title:"Plate 38 — The habit loop, and how to change one",alt:"Circular diagram of the habit loop: cue, craving, response, reward, with a design step showing how changing the environment makes the wanted response easier.",caption:"Habits are cue-driven, not character-driven. Changing the environment usually outperforms relying on motivation.",items:[{label:"Cue",note:"Time, place, emotion, preceding action"},{label:"Craving",note:"The anticipated reward, not the habit itself"},{label:"Response",note:"The behaviour, easy or hard depending on design"},{label:"Reward",note:"Satisfaction, relief, energy, connection"},{label:"Reflection",note:"What made it easy or hard this time?"},{label:"Redesign",note:"Adjust the cue or the friction, then repeat"}]},"diet-claims":{id:"diet-claims",kind:"compare",title:"Plate 39 — Reading a weight-loss claim",alt:"Three columns comparing the claim, what the evidence usually shows, and the safety question to ask for detoxes, supplements and very-low-calorie programmes.",caption:"Use the same three questions every time: what is claimed, what is the evidence, and who is at risk. Claims that promise fast, permanent, effortless results fail all three.",cols:[{title:"The claim",items:["Detox or cleanse the body","Melt fat with one capsule","Never count calories again","Lose 10 kg in 30 days"]},{title:"What evidence shows",items:["Liver and kidneys already do this work","No supplement produces meaningful, lasting fat loss","Randomised trials show modest average differences between named diets","Rapid loss is largely water and lean tissue; most is regained"]},{title:"The safety question",items:["Is a nutrient group being removed?","Is a stimulant or laxative involved?","Is medical supervision offered for very low intakes?","Is the product sold by the person recommending it?"]}]},"case-framework":{id:"case-framework",kind:"flow",title:"Plate 40 — How to read a case study",alt:"Flow diagram of the case-study method: background, educational challenge, scientific principles, practical options, safety considerations, what not to assume, and reflection.",caption:"Cases are fictional teaching tools. They illustrate reasoning, not clinical outcomes, and no case here should be read as evidence that a particular approach works.",nodes:[{id:"bg",col:0,row:0,label:"Background",sub:"Circumstances, not verdicts"},{id:"ch",col:0,row:1,label:"Educational challenge",sub:"What is actually being asked?"},{id:"pr",col:1,row:0,label:"Scientific principles",sub:"Which evidence applies"},{id:"op",col:1,row:1,label:"Practical options",sub:"Several, with trade-offs"},{id:"safe",col:2,row:0,label:"Safety considerations",sub:"Who needs clinical support"},{id:"ref",col:2,row:1,label:"Reflection",sub:"What would you check first?"}],edges:[{from:"bg",to:"pr"},{from:"ch",to:"op"},{from:"pr",to:"safe"},{from:"op",to:"ref"}]},"challenge-arc":{id:"challenge-arc",kind:"steps",title:"Plate 41 — The 30-day learning arc",alt:"Four-step diagram showing the four weeks of the challenge: understanding energy, exploring food and movement, building sleep and recovery, and creating a flexible long-term routine.",caption:"The challenge is a learning programme. No day requires weighing, measuring or restriction, and completion is about reflection rather than body change.",steps:[{n:"1",title:"Week 1 — Understand",body:"Food, energy and how the body regulates itself."},{n:"2",title:"Week 2 — Explore",body:"Nutritious meals and everyday movement, tried rather than prescribed."},{n:"3",title:"Week 3 — Build",body:"Sleep, recovery and habits that survive an ordinary week."},{n:"4",title:"Week 4 — Create",body:"A flexible routine you can maintain without counting or measuring."}]},"plate-protein":{id:"plate-protein",kind:"plate",title:"Plate 42 — Spreading protein across the day",alt:"A plate diagram showing protein-rich food distributed across three meals rather than concentrated in one, with plant and animal sources listed.",caption:"For most adults, distributing protein-containing foods across meals is more useful than any single supplement. Needs rise in later life, in pregnancy and with heavy training.",sectors:[{label:"Plant proteins",pct:50,note:"Legumes, soy, peanuts, seeds, whole grains"},{label:"Animal proteins",pct:35,note:"Fish, eggs, dairy, poultry, meat"},{label:"Other foods",pct:15,note:"Vegetables, grains and fats also contribute"}],extras:["Aim for a protein-containing food at each main meal","Combine plant sources across the day rather than at one sitting","Whole foods first; powders are convenience, not necessity"]},"tdee-variation":{id:"tdee-variation",kind:"bars",title:"Plate 43 — Why two people eat the same and differ",alt:"Bars comparing four causes of variation in total daily energy expenditure: body size and composition, activity and occupation, adaptive thermogenesis, and measurement error.",caption:"Total daily energy expenditure varies by several hundred calories a day between individuals — far more than most food labels acknowledge.",segments:[{label:"Body size & composition",value:40,note:"More lean tissue means more resting expenditure"},{label:"Activity & occupation",value:30,note:"Sedentary desk work versus field or care work"},{label:"Adaptive thermogenesis",value:18,note:"Expenditure adjusts to intake and history"},{label:"Measurement error",value:12,note:"Labels, apps and self-report are all approximate"}]},"sleep-hygiene":{id:"sleep-hygiene",kind:"grid",title:"Plate 44 — Practical sleep-supportive habits",alt:"Six cards of sleep-supportive practices covering light, timing, caffeine, screens, temperature and wind-down routines.",caption:"Sleep habits are supportive, not curative. Persistent insomnia, loud snoring or marked daytime sleepiness deserve medical assessment.",cells:[{title:"Light",body:"Bright light in the morning; dim, warm light in the last hour before bed."},{title:"Timing",body:"A consistent wake time anchors the rhythm more effectively than a fixed bedtime."},{title:"Caffeine & alcohol",body:"Caffeine can act for 6–8 hours; alcohol fragments sleep later in the night."},{title:"Screens & stimulation",body:"Wind down with low-stimulation activity; put the phone out of reach if it delays sleep."},{title:"Temperature & comfort",body:"A cool, dark, quiet room; breathable bedding; treat noise and heat where possible."},{title:"Wind-down routine",body:"A repeatable sequence — wash, stretch, read, breathe — tells the body that sleep is coming."}]},"recovery-signals"  work you would actually do twice this week?"},{n:4,name:"The Okonkwo household",setting:"Family of five, limited food budget, Lagos",background:"Both parents work; the weekly shop is mostly staples; fresh vegetables are expensive and spoil quickly.",challenge:"Improve nutritional quality without raising costs.",principles:["Dried legumes, whole grains, eggs and seasonal vegetables are among the cheapest nutrient-dense foods.","Frozen and canned produce retains most micronutrients.","Batch cooking reduces fuel costs and weekday decision load."],options:["Cook a large pot of beans twice a week.","Buy vegetables in season or frozen.","Add a groundnut or soy protein to staple dishes."],safety:"Food insecurity is a structural issue; community food programmes and social support come before diet quality advice.",notAssume:"Do not assume the family is unaware of nutrition; budget and availability are the constraints.",reflection:"Which existing family dish already combines a staple and a legume?"},{n:5,name:"Tomas, 44",setting:"Long-haul driver, Poland",background:"Irregular sleep, five to six hours, roadside meals, evening eating when he finally gets home.",challenge:"Appetite feels out of control at night.",principles:["Short sleep raises ghrelin and lowers leptin.","Irregular timing disrupts circadian rhythm.","Restriction earlier in the day increases evening hunger."],options:["A planned meal before the shift rather than grazing after it.","Consistent wake time on days off.","Caffeine cut-off six hours before the intended sleep period."],safety:"Excessive daytime sleepiness at the wheel is a safety emergency — see a doctor for sleep apnoea screening.",notAssume:"Do not assume the night eating is a willpower problem; it is strongly sleep-driven.",reflection:"Which comes first in your week: better sleep or better eating? What would change if you worked on sleep?"},{n:6,name:"Eun-ji, 71",setting:"Retired teacher, Seoul",background:"Lives alone since her husband died, has n.","Weight-loss supplements can contain undeclared stimulants and laxatives."],options:["Apply three questions: what is claimed, what is the evidence, who profits?","Check whether a national regulator has approved the product.","Invest in a consultation with a registered dietitian instead."],safety:"Laxative and stimulant products carry real risks, including dehydration, electrolyte disturbance and dependency.",notAssume:"Do not assume a product is safe because it is sold openly or labelled as natural.",reflection:"Which single claim in the advertisement is not verifiable?"},{n:9,name:"The Nguyen household",setting:"Two working parents, two teenagers, Melbourne",background:"Everyone eats at a different time; takeaway three nights a week; no shared meals.",challenge:"Build sustainable family routines.",principles:["Shared meals support dietary variety and wellbeing.","Routine reduces weekday decision fatigue.","Flexibility protects the habit when the week goes wrong."],options:["Two fixed family dinners per week, not seven.","A base meal (rice, noodles, soup) with toppings that vary.","A weekly 20-minute planning conversation."],safety:"Family food rules should never involve weighing, measuring or commenting on a child's body.",notAssume:"Do not assume resistance means disinterest; it often means the plan does not fit their schedule.",reflection:"Which meal would be easiest to share as a family first?"},{n:10,name:"Fatima, 31",setting:"Postpartum, three months, Casablanca",background:"Her weight has gone up and down by 2 kg in a week and she is weighing herself daily.",challenge:"Understand short-term fluctuation.",principles:["Daily change reflects water, glycogen, digestion and hormones.","Postpartum fluid balance shifts substantially.","Frequent weighing increases distress in many people."],options:["Weigh weekly at most, or not at all for a month.","Track energy, sleep and how clothing fits instead.","Discuss postpartum recovery with her midwife."],safety:"Postpartum is a recovery period. No weight-loss target is appropriate in the early months.",notAssume:"Do not assume fluctuation is failure; it is normal physiology.",reflection:"What information would actually tell you how you are recovering?"},{n:11,name:"Ahmed, 52",setting:"Shopkeeper, Dhaka",background:"Recently told he has elevated blood pressure. Has never exercised and is nervous about starting.",challenge:"Plan a walking programme safely.",principles:["Walking at a conversational pace is moderate-intensity activity.","Blood pressure responds to regular aerobic activity.","Progression of about 10% per week is realistic."],options:["Ten minutes daily for two weeks, then add five minutes per week.","Walk with a neighbour for safety and company.","A blood pressure check before and after starting."],safety:"Chest pain, dizziness or severe breathlessness during walking requires immediate medical attention.",notAssume:"Do not assume he can walk safely at night or far from the shop.",reflection:"What time of day is safest and coolest for a walk where you live?"},{n:12,name:"Sofia, 19",setting:"University student, Mexico City",background:"Family comments about her body at every gathering; she skips meals before events and overeats afterwards.",challenge:"Manage social pressure about appearance.",principles:["Comments about weight are a risk factor for disordered eating.","Restriction before social events increases the likelihood of loss-of-control eating.","Body respect is a skill that can be practised."],options:["Have a prepared response ready: I would rather not talk about my body, thank you.","Eat regularly before events.","Talk to a counsellor at the university health service."],safety:"Restrict-then-overeat cycles are common and distressing; professional support is appropriate and effective.",notAssume:"Do not assume family comments are helpful or intended to harm; the effect still matters.",reflection:"Which one sentence could you use at the next family meal?"},{n: re clinical warning signs.","Early intervention improves outcomes substantially."],options:["Speak to his general practitioner this week.","Contact an eating disorder support organisation.","Tell one trusted person what is happening."],safety:"Urgent medical review if there is fainting, chest pain, confusion, very low heart rate or inability to stop exercising.",notAssume:"Do not assume a statistically normal BMI rules out an eating disorder. It does not.",reflection:"What is the first practical step you could take within seven days?"}],sf=[{day:1,week:1,title:"What 'healthy weight' actually means",objective:"Separate body weight from health outcomes.",explanation:"Health includes nutritional adequacy, capability, metabolic markers and wellbeing. Weight is one measurement.",activity:"Write three things your body lets you do that you value.",reflection:"Which of these has nothing to do with appearance?"},{day:2,week:1,title:"Your body's building blocks",objective:"Understand body composition.",explanation:"Fat, muscle, bone, water and organs all contribute to weight and change at different rates.",activity:"Note one function of each tissue you are grateful for.",reflection:"Which tissue responds fastest to activity and food?"},{day:3,week:1,title:"Metabolism demystified",objective:"Describe anabolism and catabolism.",explanation:"Metabolism is continuous chemistry — building and breaking down — not a switch or a personality.",activity:"Explain metabolism out loud to someone in one sentence.",reflection:"What surprised you about how metabolism works?"},{day:4,week:1,title:"Where the day's energy goes",objective:"Name the components of daily energy expenditure.",explanation:"Resting metabolism, activity, everyday movement and digestion all contribute.",activity:"Estimate which component is largest in your own day.",reflection:"Which component could realistically change this month?"},{day:5,week:1,title:"Energy balance is dynamic",objective:"Understand why arithmetic fails individuals.",explanation:"Appetite and expenditure adjust to change over time; day-to-day weight is mostly water.",activity:"Draw the balance beam from Plate 5 from memory.",reflection:"Why is a single weigh-in uninformative?"},{day:6,week:1,title:"Hunger, satiation, satiety",objective:"Tell three signals apart.",explanation:"Hunger starts a meal, satiation ends it, satiety is the gap until the next.",activity:"Rate your hunger before and after one meal on a 1–10 scale.",reflection:"What did the numbers tell you that you did not expect?"},{day:7,week:1,title:"Food environments",objective:"See the setting behind eating.",explanation:"Availability, price, marketing and time shape choices more than willpower.",activity:"List what is visible in your kitchen right now.",reflection:"What would you move to make the better choice easier?"},{day:8,week:2,title:"Build a balanced plate",objective:"Assemble a flexible plate.",explanation:"A staple, a protein-rich food, vegetables or fruit and a source of fat — adapted to any cuisine.",activity:"Build one plate from foods you already have.",reflection:"What was missing, and is it affordable where you shop?"},{day:9,week:2,title:"Protein across the day",objective:"Distribute protein across meals.",explanation:"Protein supports muscle, satiety and repair; needs vary by age and activity.",activity:"Include a protein-rich food at two meals today.",reflection:"Which protein foods are cheapest in your area?"},{day:10,week:2,title:"Fibre and digestion",objective:"Increase fibre safely.",explanation:"Fibre supports bowel function, glucose control and the gut microbiota; increase gradually with fluids.",activity:"Add one high-fibre food today.",reflection:"How did your digestion respond?"},{day:11,week:2,title:"Hydration habits",objective:"Build a simple fluid routine.",explanation:"Needs vary with climate, activity and body size; thirst and urine colour are practical guides.",activity:"Drink a glass of water with each main meal today.",reflection:"Did it change how much you ate or how you felt?"},{day:12,week:2,title:"Reading food labels",objective:"Understand what a label does and does not say.",explanation:"Serving sizes are standardised, not personal. Ingredients are listed by weight.",activity:"Compare two similar products in your cupboard.",reflection:"Which difference actually matters to you?"},{day:13,week:2,title:"Cook one staple well",objective:"Master one base dish.",explanation:"A repeatable staple reduces weekday stress and protects budget.",activity:"Cook a pot of grains or legumes.",reflection:"How could this become a weekly default?"},{day:14,week:2,title:"Movement beyond the gym",objective:"Count everyday movement.",explanation:"Walking, stairs, chores and active transport all contribute to fitness and energy.",activity:"Take a 10-minute walk after one meal.",reflection:"Where in your day could movement fit without effort?"},{day:15,week:3,title:"Sleep and appetite",objective:"Connect sleep with hunger.",explanation:"Short sleep raises hunger hormones and food reward the next day.",activity:"Set a wake time and keep it for the rest of the challenge.",reflection:"What did you notice about hunger after a short night?"},{day:16,week:3,title:"Wind-down routine",objective:"Design a repeatable pre-sleep sequence.",explanation:"Consistent routines cue the body; light and screens delay sleep onset.",activity:"Create a 20-minute wind-down sequence and use it tonight.",reflection:"Which part was easiest to keep?"},{day:17,week:3,title:"Stress and eating",objective:"Notice the stress–appetite link.",explanation:"Stress shifts eating in both directions and disrupts sleep.",activity:"Write down one stressor and one non-food coping strategy.",reflection:"When do you most often eat in response to stress?"},{day:18,week:3,title:"Ten minutes of strength",objective:"Try basic strength work.",explanation:"Muscle adapts to load; bodyweight and household objects are sufficient.",activity:"Do sit-t This publication — text, structure, original diagrams, tables, worksheets and interactive tools — is the intellectual property of HERBULANCE. It is offered as educational material.

**Educational use permitted.** Teachers, students, community health workers, public-health programmes, libraries and non-profit organisations may reproduce extracts for non-commercial educational use, provided that attribution is given to *HERBULANCE Book 11 — The Complete Guide to Healthy Weight Management, Metabolism & Sustainable Lifestyle Habits* and that extracts are reproduced without alteration of meaning.

**Illustrations.** All 45 plates in this edition are original vector illustrations produced for this publication. They may not be reproduced separately from the book for commercial purposes.

**Medical and psychological status.** Nothing in this publication constitutes medical, dietetic or mental-health advice, diagnosis or treatment. Educational information is clearly distinguished from clinical care throughout, and signposting to qualified professionals is provided in every chapter where it is relevant.

**Language.** International English is used. Food examples, activities and household circumstances are drawn from every inhabited region.`,yp=`## Introduction to healthy weight management

This book is about a simple idea with complicated edges: **the habits that support a healthy body are the same habits that support a good life** — eating in a way that nourishes, moving in ways that build capability, sleeping enough to recover, and living inside circumstances that make those things possible.

It is not a weight-loss manual. It contains no calorie targets, no diet plans, no weigh-in schedules and no body measurements. Those tools are inappropriate for a general readership, harmful for some readers, and unnecessary for the educational goal of this volume: understanding.

## What you will find here

Forty-one chapters across seven parts, each written from institutional and peer-reviewed evidence, each with learning objectives, safety notes, takeaways and verified references. Forty-five original scientific plates, drawn as vector diagrams, illustrate everything from body composition to the habit loop. Interactive tools let you explore energy balance as a concept, compare macronutrients, plan a week of movement, and complete a 30-day learning challenge that never asks you to weigh yourself.

## A note on tone

You will find no moral language about food or bodies in these pages. Food is not good or bad. Bodies are not before or after. Health is not a size, and exercise is never punishment for eating. Where the evidence is uncertain, the book says so. Where a question belongs to a clinician, it says that too.
