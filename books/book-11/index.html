hapters:"10, 32",accessed:re},harvard_carbs:{org:"Harvard T.H. Chan School of Public Health — The Nutrition Source",title:"Carbohydrates and blood sugar",date:"Reviewed; current edition 2023",url:"https://nutritionsource.hsph.harvard.edu/carbohydrates/",jurisdiction:"United States / International",chapters:"10, 11, 13",accessed:re}};function P(...g){const S=[];for(const p of g){const c=lf[p];c&&!S.includes(c)&&S.push(c)}return S}const Jg=[{id:"ch01",num:1,part:1,title:"What Does Healthy Weight Management Mean?",kicker:"Part I — Understanding body weight and metabolism",objectives:["Describe body weight, body composition and weight management as separate concepts.","Explain why health-related outcomes, physical capability and nutritional adequacy matter more than appearance.","Recognise individual variation and what it means for long-term wellbeing."],body:`
## Weight is a measurement, not a summary of health

Body weight is the force gravity exerts on a body, measured in kilograms or pounds. It is easy to measure and therefore often treated as if it described everything about a person. It does not. Two people of the same weight can differ greatly in height, body composition, fitness, blood pressure, blood glucose, mental wellbeing, mobility and medical history.

*Weight management* is the set of behaviours and circumstances that influence how body mass changes over months and years. The word management is useful: it implies an ongoing process shaped by many inputs, not a single decision made on a single day.

!!K|Healthy weight management means supporting nutritional adequacy, physical capability, mental wellbeing and metabolic health over the long term — at whatever body size those are achieved.

## Four outcomes that matter more than a number

1. **Nutritional adequacy** — eating enough energy and nutrients to support the brain, organs, immune function, growth and repair.
2. **Physical capability** — the strength, stamina and mobility to live the life you want: carrying shopping, climbing stairs, playing with children, working, travelling.
3. **Metabolic health** — blood pressure, blood lipids and blood glucose patterns that reflect physiology rather than appearance.
4. **Mental and social wellbeing** — an untroubled relationship with food, freedom to eat with others, and the confidence to seek healthcare without shame.

[[fig:factors-weight]]

## Why appearance does not determine health

Visible body size cannot tell you about a person's diet quality, cardiorespiratory fitness, sleep, blood pressure, family history or how much muscle they carry. Weight stigma — the assumption that larger bodies are lazy or unhealthy — causes real harm: it delays healthcare seeking, increases stress and discourages movement.

!!S|This book does not diagnose obesity, eating disorders or metabolic conditions, and it does not prescribe individualised calorie targets. Educational information supports a conversation with a qualified professional; it never replaces one.

## Habits beat targets

A goal of "weigh x kilograms" gives you no instructions. A goal of "eat vegetables most days, walk after lunch, sleep seven hours, and lift something heavy twice a week" gives you many. Habits are also resilient: when life becomes difficult, behaviours survive better than numbers.

??|What does the evidence say about modest weight change?|Population studies show that even modest changes in eating quality, physical activity, sleep and smoking status improve cardiometabolic risk markers independently of whether body weight changes at all. This is the basis of the "health at every size" style of weight-neutral care used in many clinical settings.

> The question is not "how much do you weigh?" but "what does your body let you do, and how do you feel inside it?"
`,takeaways:["Body weight is one measurement among many; it is not a diagnosis.","Nutritional adequacy, capability and wellbeing are the real targets of healthy weight management.","Behaviours can be controlled directly; body weight cannot."],crossrefs:["Book 10 — Food Nutrition, Vitamins, Minerals & Essential Nutrients","Book 01 — The Plant-Forward Beginner's Guide"],refs:P("who_obesity","niddk_weight","world_obesity")},{id:"ch02",num:2,part:1,title:"Understanding Body Composition",kicker:"Part I — Understanding body weight and metabolism",objectives:["Distinguish fat mass from fat-free mass and name the main tissue compartments.","Describe how body composition is estimated and why each method has limits.","Appreciate natural variation between people and across the lifespan."],body:`
## The body is a mixture, not a single substance

Body weight is the sum of several compartments with very different functions. **Fat mass** includes essential fat (needed for nerves, hormones, brain and cell membranes) and storage fat. **Fat-free mass** includes muscle, bone, organs, connective tissue and body water.

[[fig:body-composition]]

## What each compartment does

- **Muscle tissue** — movement, strength, glucose disposal and a large share of resting energy expenditure. It responds quickly to training and to disuse.
- **Bone** — mineral reservoir and structural support. Bone accrues through childhood, adolescence and early adulthood, then is maintained by load-bearing activity and adequate calcium, vitamin D and protein.
- **Body water** — the largest single component. It shifts within hours with fluid intake, sodium intake, carbohydrate intake (glycogen holds water), the menstrual cycle, heat and activity.
- **Organ tissue** — brain, heart, liver, kidneys and gut are metabolically expensive per kilogram and relatively stable in mass.
- **Fat** — energy reserve, insulation, cushioning and hormone production. A wide range of body fat levels is compatible with good health.

!!D|Fat-free mass is sometimes called "lean mass", but lean tissue still contains water. Neither term means "muscle only".

## How composition is estimated

| Method | What it does | Main limitation |
| Skinfold calipers | Measures folds at standard sites | Operator dependent; less accurate at higher body fat |
| Bioelectrical impedance | Estimates from electrical resistance | Hydration, food and recent exercise change the result |
| Underwater weighing / air displacement | Compares body volume and mass | Assumes constant fat-free mass density |
| Dual-energy X-ray absorptiometry (DXA) | Estimates fat, lean tissue and bone mineral | Cost, availability and still an estimate |
| Waist circumference | Simple proxy for central fat | Varies with breathing, posture and tape placement |

## Measurement limitations

Every method estimates; none directly measures "health". Results also shift with hydration, time of day, recent activity and the specific equations used. A single measurement should never drive a medical decision on its own.

!!S|Body composition testing is not recommended for adolescents as a weight-management tool, and repeated testing can intensify body preoccupation in people vulnerable to eating disorders.

> Two bodies can weigh the same and be built completely differently. The scale cannot tell them apart.
`,takeaways:["Body weight combines fat, muscle, bone, water and organs — each with a different function.","Body water alone can move body weight by a kilogram or more within a day.","Every measurement method is an estimate with assumptions and error margins."],crossrefs:["Book 10 — Food Nutrition, Vitamins, Minerals & Essential Nutrients"],refs:P("niddk_weight","nas_dri_water","fao_energy")},{id:"ch03",num:3,part:1,title:"Introduction to Metabolism",kicker:"Part I — Understanding body weight and metabolism",objectives:["Define metabolism, anabolism and catabolism in plain language.","Explain basal metabolic rate and resting energy expenditure.","Describe why metabolic rate differs between people and changes with age."],body:`
## Metabolism is chemistry, not a thermostat

Metabolism is the sum of all chemical reactions that keep an organism alive. It has two directions running at the same time: **catabolism**, which breaks molecules down to release energy and building blocks, and **anabolism**, which uses those resources to build and repair tissue, make enzymes and hormones, and store reserves.

[[fig:metabolism-overview]]

## Energy production in cells

Nutrients are progressively broken down inside cells. Carbohydrate and fat are the main fuels; protein contributes when needed and is preferentially used for structure. The usable energy currency is **ATP**. The final common pathway is oxidative metabolism in mitochondria, which requires oxygen — which is why breathing rate rises with effort.

## Basal and resting metabolic rate

**Basal metabolic rate (BMR)** is the energy the body uses in a completely rested, fasted, thermoneutral state — measured in a laboratory. **Resting energy expenditure (REE)** is the same idea measured under slightly less strict conditions and is what most practical estimates describe. Together they account for the largest share of daily energy use for most people.

| Component | Typical share of daily energy use |
| Resting metabolism | 50–70% |
| Physical activity | 15–40% (highly variable) |
| Thermic effect of food | 5–10% |
| Non-exercise movement (NEAT) | Highly variable between individuals |

## Why people differ

- **Body size and composition** — more tissue, especially fat-free mass, uses more energy at rest.
- **Age** — REE falls gradually with age, largely because of declining fat-free mass and organ metabolic rate.
- **Growth** — children, adolescents and pregnancy require additional energy for new tissue.
- **Hormonal status** — thyroid hormone, catecholamines and sex hormones modulate rate.
- **Energy balance history** — prolonged restriction lowers expenditure slightly; overfeeding raises it.
- **Genetics** — inherited differences in metabolic efficiency, appetite signalling and fat distribution.

!!K|There is no credible evidence that ordinary dieting "damages" metabolism permanently. Metabolic rate adapts in both directions and largely returns when intake and body mass return.

> Your metabolism is not a personality trait. It is a physiological state that responds to what the body is doing.
`,takeaways:["Metabolism is the continuous chemistry of building up and breaking down.","Resting metabolism is the largest daily energy component for most people.","Metabolic rate varies by size, age, hormones, genetics and energy history."],crossrefs:["Book 10 — Food Nutrition, Vitamins, Minerals & Essential Nutrients"],refs:P("fao_energy","niddk_weight","nas_dri_macro")},{id:"ch04",num:4,part:1,title:"How the Body Uses Energy",kicker:"Part I — Understanding body weight and metabolism",objectives:["Identify the four components of total daily energy expenditure.","Explain non-exercise activity thermogenesis and the thermic effect of food.","Understand how energy is stored and mobilised."],body:`
## Four components of a day's energy use

Total daily energy expenditure (TDEE) is the sum of basal/resting expenditure, the cost of planned physical activity, non-exercise activity thermogenesis (NEAT), and the thermic effect of food.

[[fig:energy-expenditure]]

- **Basal/resting expenditure** — the cost of staying alive: heartbeat, breathing, brain activity, temperature control, tissue repair.
- **Physical activity** — planned movement of any kind. Its cost varies more than any other component: a manual job and a desk job can differ by hundreds of units of energy a day.
- **NEAT** — standing, fidgeting, walking to the bus, carrying children, climbing stairs. Underrated, and partly involuntary.
- **Thermic effect of food** — digesting, absorbing and processing nutrients. Protein costs the most to process; fat the least.

## Energy storage

Excess energy is stored as glycogen in muscle and liver (a small, fast-access reserve holding water) and as fat in adipose tissue (a large, dense reserve). Between meals the body switches smoothly between fuel sources; this flexibility is a normal feature, not a defect.

!!D|One kilogram of body fat contains roughly 7,700 kilocalories of stored energy, but changes in body weight never follow this arithmetic exactly, because water and lean tissue change too.

## Energy utilisation during activity

At low intensity, fat supplies most of the fuel. As intensity rises, carbohydrate contributes more. This does **not** determine fat loss over days and weeks — total energy turnover does. "Fat-burning zones" describe fuel selection in a moment, not changes in body composition over a month.

| Situation | Predominant fuel source |
| Rest, overnight | Fat |
| Easy walking | Mixture, mostly fat |
| Brisk walking / cycling | Mixture |
| Running / intervals | Mostly carbohydrate |
| Recovery after exercise | Replenishing glycogen, repairing tissue |

## Why this matters practically

Understanding the components tells you where change is realistic. NEAT and activity are adjustable; the thermic effect of food is small; resting expenditure changes slowly and is strongly influenced by body size.

[[fig:tdee-variation]]

!!S|This book provides no individual energy targets. Energy needs are individual and are best estimated by a registered dietitian or physician when a clinical reason exists to calculate them.

> The body is not a bank account. It is a responsive system that adjusts its spending.
`,takeaways:["TDEE = resting expenditure + activity + NEAT + thermic effect of food.","NEAT and planned activity are the most adjustable components.","Fuel selection during exercise does not dictate fat loss over time."],crossrefs:["Book 07 — Meal Planning, Balanced Nutrition & Everyday Food Preparation"],refs:P("fao_energy","hhs_pag","niddk_weight")},{id:"ch05",num:5,part:1,title:"Energy Balance Explained",kicker:"Part I — Understanding body weight and metabolism",objectives:["Describe energy intake and expenditure as a dynamic system.","Explain surplus and deficit without turning them into instructions.","Understand why simple calorie equations do not predict individual outcomes."],body:`
## The first law, and everything that follows it

Energy balance compares energy taken in from food and drink with energy expended. Over long periods, the difference is reflected in body energy stores. That principle is not in dispute. What is often misunderstood is how the two sides interact over time.

[[fig:energy-balance]]

## It is dynamic, not arithmetic

- **Appetite responds.** Restrict intake and hunger, food preoccupation and reward sensitivity tend to rise. Increase intake and satiety signals strengthen.
- **Expenditure adapts.** As body mass falls, less tissue needs fuel. Expenditure also falls slightly more than predicted by mass alone — adaptive thermogenesis.
- **NEAT moves.** People often unconsciously move less during periods of lower intake and more during overfeeding.
- **Time scale matters.** Day-to-day differences are dominated by water, sodium and gut contents. Trends appear over weeks to months.

## Surplus and deficit, without instructions

An **energy surplus** means intake exceeds expenditure over a period. A **energy deficit** means the reverse. Neither term is a moral category and neither is a personal prescription in this book. The same surplus will produce different outcomes in different people, and the same deficit carries different risks depending on age, medical history, relationship with food and current nutritional adequacy.

!!S|Intentional energy restriction is not appropriate for everyone. It is inappropriate during pregnancy, for adolescents without clinical supervision, for anyone with an active or recovering eating disorder, and for anyone with a medical condition requiring individualised dietary management.

## Why equations disappoint

Prediction equations for energy needs were developed from group averages. Typical error margins are wide; self-reported intake is notoriously inaccurate; food labels themselves are permitted to vary from their stated values. Any individual prediction will be wrong to some degree — which is why behaviour-focused goals outperform arithmetic ones.

??|What about "calories in, calories out"?|As a description of physics it is true. As a plan for a human being it is incomplete, because both sides of the equation are regulated by biology, environment and circumstance — and all three change over time. Teaching energy balance is valuable; treating it as a personal calculator is not.

> Energy balance is a useful explanation and a poor instruction manual.
`,takeaways:["Energy balance is dynamic: appetite and expenditure adjust to change.","Daily weight reflects water and gut contents far more than stored energy.","Group-level equations cannot predict an individual outcome."],crossrefs:["Book 07 — Meal Planning, Balanced Nutrition & Everyday Food Preparation"],refs:P("fao_energy","niddk_weight","who_obesity")},{id:"ch06",num:6,part:1,title:"Hormones and Body Weight Regulation",kicker:"Part I — Understanding body weight and metabolism",objectives:["Describe the roles of insulin, leptin, ghrelin and other hormones in appetite regulation.","Distinguish hunger signalling from satiety and satiation.","Recognise hormonal adaptation without attributing weight to a single hormone."],body:`
## Messengers, not switches

Hormones carry information between tissues: how much is stored, whether a meal has arrived, whether the environment is threatening, and whether it is a suitable time for growth or reproduction. They modulate appetite and expenditure continuously.

[[fig:hormone-appetite]]

| Hormone | Main signal | What it does to appetite |
| Ghrelin | Stomach empties before meals | Increases meal initiation |
| Leptin | Long-term energy stores (fat tissue) | Suppresses appetite over weeks to months |
| Insulin | Nutrient arrival, especially carbohydrate | Promotes storage, signals satiety centrally |
| PYY and GLP-1 | Nutrients in the small intestine | Increase satiation, slow gastric emptying |
| Cortisol | Stress, sleep loss, circadian pattern | Can increase appetite and reward-driven eating |
| Thyroid hormones | Energy status and temperature control | Modulate resting metabolic rate |
| Sex hormones | Puberty, cycle, pregnancy, menopause | Influence fat distribution and appetite |

## Leptin resistance

In people with more fat tissue, leptin levels are high, yet the brain may respond less effectively — a state called leptin resistance. This is one reason appetite regulation can feel harder for some people than for others. It is physiology, not weakness.

## Hunger, satiation and satiety

- **Hunger** — the drive to begin eating, driven by ghrelin, habit, low blood glucose and learned cues.
- **Satiation** — the signals that end a meal: stomach volume, protein, fat, fibre and time spent eating.
- **Satiety** — the period of comfortable fullness between meals.

[[fig:hunger-satiety]]

## Hormonal adaptation

With sustained restriction, hunger hormones rise and satiety hormones fall; with weight regain, these changes may persist for a time. This is a documented physiological response and one reason long-term maintenance requires ongoing support rather than a temporary diet.

!!K|No hormone, food, supplement or "reset" independently controls body weight. Anyone claiming a single hormonal solution is selling something.

!!S|Thyroid disorders, polycystic ovary syndrome, menopause and some medications genuinely alter appetite and weight. These require medical assessment — never self-diagnosis or unsupervised medication changes.

> Hormones explain why appetite is not a matter of character. They do not hand you a single lever to pull.
`,takeaways:["Appetite is regulated by many hormones acting together over different timescales.","Hunger, satiation and satiety are three different things.","Hormonal adaptation is real, reversible, and never a reason for self-blame."],crossrefs:["Book 10 — Food Nutrition, Vitamins, Minerals & Essential Nutrients"],refs:P("fao_energy","niddk_weight","nice_obesity")}],Fg=[{id:"ch07",num:7,part:2,title:"Building a Nutritious Eating Pattern",kicker:"Part II — Nutrition and eating behaviour",objectives:["Describe dietary diversity, macronutrients, micronutrients, fibre and hydration as the foundations of adequacy.","Distinguish food quality from food rules.","Apply portion awareness and cultural flexibility without prescribing one diet."],body:`
## Pattern over plate

Nutritional quality is built across days and weeks, not at a single meal. The strongest common features of health-supporting eating patterns worldwide are: plenty of vegetables and fruit, legumes, nuts, whole grains and other minimally processed staple foods; adequate protein; moderate amounts of unsaturated fat; limited salt and free sugars; and water as the everyday drink.

[[fig:balanced-plate]]

## The foundations

- **Dietary diversity** — different foods supply different micronutrients and different fibres. Diversity within a cuisine is as valid as diversity across cuisines.
- **Macronutrients** — protein, carbohydrate and fat all have essential roles (see Chapter 10).
- **Micronutrients** — vitamins and minerals. Common gaps globally include iron, iodine, zinc, calcium, folate and vitamin D.
- **Fibre** — most adults eat less than recommended (see Chapter 11).
- **Hydration** — needs vary with climate, body size, activity and life stage (see Chapter 12).

## Food quality, not food morality

Quality describes what a food contributes: nutrients, fibre, protein, water, pleasure. Moral language — "clean", "cheat", "guilty" — adds nothing measurable and can harm people vulnerable to disordered eating. A bowl of rice, beans and vegetables and a slice of birthday cake belong in the same life.

## Portion awareness without obsession

Portion awareness means noticing amounts, not measuring them. Useful, low-effort strategies include serving from the stove rather than the table, using smaller bowls for energy-dense foods and larger ones for vegetables, eating without a screen for one meal a day, and allowing hunger to guide a second helping.

[[fig:portion-visual]]

## Cultural flexibility

There is no nutritionally privileged cuisine. Sorghum and cowpeas, rice and dal, maize and beans, noodles and greens, bread and lentil soup, fish and taro — all can deliver a complete pattern. What matters is the structure: a staple, a protein-rich food, vegetables or fruit, and a source of fat.

!!X|See HERBULANCE Book 10 for a complete guide to vitamins, minerals and essential nutrients, and Book 01 for plant-forward foundations.

!!S|Adolescents have raised needs for growth and should not restrict food groups or energy without clinical guidance. Pregnancy, older age and chronic illness each change requirements — see Part VI.

> A nutritious eating pattern is one you can afford, cook, enjoy and repeat. Perfection is not a nutrient.
`,takeaways:["Quality is a pattern-level judgement, never a single-meal verdict.","All three macronutrients and a wide micronutrient range are required.","Cultural staples can all deliver adequacy when structured well."],crossrefs:["Book 10 — Food Nutrition, Vitamins, Minerals & Essential Nutrients","Book 01 — The Plant-Forward Beginner's Guide","Book 07 — Meal Planning & Balanced Nutrition"],refs:P("who_healthy_diet","nas_dri_macro","efsa_drv","fao_sustainable")},{id:"ch08",num:8,part:2,title:"Understanding Hunger and Fullness",kicker:"Part II — Nutrition and eating behaviour",objectives:["Distinguish physical hunger from appetite, craving and habit.","Explain satiation and satiety and the factors that influence both.","Describe environmental and emotional influences without moral judgement."],body:`
## Four different experiences

- **Physical hunger** — a gradual, body-based signal: emptiness, low energy, thinking about food. Builds over time and is satisfied by a range of foods.
- **Appetite** — the psychological desire to eat, shaped by sight, smell, memory, culture and routine. Appetite can be present without hunger and absent despite it.
- **Craving** — a desire for a specific food or sensation (see Chapter 14).
- **Habit-driven eating** — eating because it is a certain time, place or social situation.

All four are normal. None is a character flaw.

[[fig:hunger-satiety]]

## What shapes satiation

Meal volume, protein content, fibre, fat, water content, temperature, texture and eating speed all affect how quickly fullness arrives. Liquid calories tend to produce less satiation than solid foods with the same energy. Eating while distracted reduces awareness of these signals.

## What shapes satiety

Sleep, stress, physical activity, meal composition and the length of the previous eating episode all influence how long fullness lasts between meals. Irregular eating patterns can amplify hunger swings for some people and reduce them for others — individual responses vary.

## Environmental influence

Plate size, serving vessel, packaging, the presence of others, food visibility and social expectations all change how much is eaten, usually without awareness. This is not a lack of willpower; it is how human eating behaves in a normal environment.

!!D|Emotional eating is eating in response to an emotion. It is a common, understandable coping strategy. It only becomes a clinical concern when it is frequent, distressing, out of control, or accompanied by compensatory behaviours.

## Using hunger signals without worshipping them

Signals are useful but not perfect: medications, stress, sleep loss, illness and hormonal change can all distort them. A practical approach is to notice signals *and* to keep reasonably regular eating occasions, so that neither severe hunger nor routine-driven eating dominates the day.

!!S|Ignoring hunger cues repeatedly does not build discipline. It increases the likelihood of intense hunger, loss-of-control eating and preoccupation with food.

> Hunger is information, not an emergency and not a confession.
`,takeaways:["Hunger, appetite, craving and habit are different experiences with different causes.","Meal composition and eating speed shape satiation; sleep, stress and routine shape satiety.","Environment influences intake automatically — which is why design beats willpower."],crossrefs:["Book 07 — Meal Planning & Balanced Nutrition"],refs:P("fao_energy","nhs_sleep","who_mental")},{id:"ch09",num:9,part:2,title:"Portions, Servings and Food Awareness",kicker:"Part II — Nutrition and eating behaviour",objectives:["Distinguish a serving size from a portion size.","Explain energy density and nutrient density.","Use visual and cultural cues without prescribing a single portion."],body:`
## Serving versus portion

A **serving size** is a standardised amount used on labels and in guidance — for example, one slice of bread or 250 ml of milk. A **portion** is what a person actually takes. One meal may contain several servings, and neither number tells you whether it suits your needs.

[[fig:portion-visual]]

## Two densities worth knowing

| Concept | Meaning | Practical use |
| Energy density | Energy per gram of food | Foods with high energy density (oils, nuts, chocolate, fried foods) provide a lot of energy in small volume |
| Nutrient density | Nutrients per gram or per calorie | Vegetables, legumes, fish, eggs, whole grains and fruit score highly |

Neither density is a moral score. Energy-dense foods are valuable when food is scarce, when work is physically demanding, for people with poor appetite, and for young children who cannot eat large volumes.

## Visual education

Hand-based and household-object comparisons are widely used in nutrition education because they travel well and require no equipment. They are approximations: hands differ, bowls differ, and appetite differs. Use them as vocabulary, not as measurement.

## Cultural meal structures

- **Shared dishes** — rice, injera, flatbreads, hotpot, mezze: people serve themselves, and pace is set by conversation.
- **Thali and bento** — pre-structured variety, which naturally limits any single food dominating.
- **Communal protein and stew** — one dish served over a staple, stretching costly ingredients with legumes and vegetables.

These structures are already nutritionally sound. They do not need to be replaced with imported portion plates.

## Flexible food choices

Portion awareness is most useful when it is quiet: noticing when a portion was far larger or smaller than needed, noticing how hunger responded, and adjusting next time. It becomes harmful when every amount must be counted, weighed or logged.

!!S|Repeated weighing, measuring and logging of food is a recognised feature of disordered eating. If tracking increases anxiety rather than confidence, stop and speak to a professional.

> The goal is knowing roughly what is on your plate — not knowing it to the gram.
`,takeaways:["Serving sizes are labels; portions are what you actually eat.","Energy density and nutrient density answer different questions.","Cultural serving structures are nutritionally legitimate and often self-regulating."],crossrefs:["Book 04 — Smart Food Shopping & Label Reading Guide"],refs:P("nhs_food_labels","nas_dri_macro","who_healthy_diet")},{id:"ch10",num:10,part:2,title:"Protein, Carbohydrates and Fats in Everyday Eating",kicker:"Part II — Nutrition and eating behaviour",objectives:["Describe the physiological role of each macronutrient.","Identify nutrient-dense sources from diverse food traditions.","Explain why eliminating a macronutrient group is rarely necessary."],body:`
[[fig:macros]]

## Protein

Protein supplies amino acids for muscle, skin, enzymes, hormones, antibodies and transport molecules. Requirements are individual: higher in growth, pregnancy, older age and heavy training; lower in sedentary adulthood. Spreading protein-containing foods across meals is generally more useful than one large dose.

Sources across traditions: lentils, beans, chickpeas, tofu and tempeh, soy milk, peanuts, eggs, yoghurt and cheese, fish and shellfish, poultry, meat, quinoa, amaranth, pumpkin seeds.

[[fig:plate-protein]]

## Carbohydrate

Carbohydrate is the preferred fuel for the brain and for high-intensity muscle work. The important distinction is not "carbs" versus "no carbs" but the form: intact grains, legumes, tubers and fruit deliver fibre, minerals and slower energy release, while free sugars deliver little beyond energy.

- **Fibre-rich carbohydrates** — oats, barley, brown rice, millet, maize, legumes, fruit, root vegetables.
- **Refined carbohydrates** — white flour products, polished rice, sweets, sugary drinks. Useful in specific contexts (recovery, illness, convenience), less useful as a staple.

## Dietary fibre

Fibre is a carbohydrate that human enzymes cannot digest, but gut microbes can. It slows glucose absorption, supports bowel function, feeds the microbiota and contributes to satiation. Most adults eat well below recommended amounts.

## Fats

Dietary fat provides concentrated energy, carries fat-soluble vitamins (A, D, E, K), builds cell membranes and supports hormone production. **Essential fatty acids** — alpha-linolenic acid (omega-3) and linoleic acid (omega-6) — must come from food. Long-chain omega-3 (EPA and DHA) comes mainly from oily fish and, in smaller amounts, from algae and eggs.

| Fat type | Typical sources | Everyday note |
| Unsaturated | Oils, nuts, seeds, avocado, oily fish | Make these the everyday fats |
| Saturated | Butter, ghee, coconut and palm oils, fatty meats, cheese | Fine in context; not the focus of every meal |
| Trans (industrial) | Partially hydrogenated oils, some fried and packaged foods | Best limited where labels make this visible |

!!K|No food group is the enemy. Patterns that remove an entire macronutrient group require careful planning and, for some people, supplementation.

!!S|Very low-carbohydrate diets require medical supervision in diabetes (risk of hypoglycaemia with medication), in pregnancy, in adolescents and in anyone with a history of disordered eating.

> Balance is not a ratio on a spreadsheet. It is what your week looks like.
`,takeaways:["Protein supports structure; carbohydrate supports fuel; fat supports membranes, hormones and vitamins.","Food form matters more than macronutrient percentage for most people.","Essential fatty acids and essential amino acids must come from food."],crossrefs:["Book 10 — Food Nutrition, Vitamins, Minerals & Essential Nutrients"],refs:P("nas_dri_macro","harvard_protein","harvard_carbs","efsa_drv")},{id:"ch11",num:11,part:2,title:"Fibre, Digestion and Satiety",kicker:"Part II — Nutrition and eating behaviour",objectives:["Distinguish soluble and insoluble fibre and describe their behaviour in the gut.","Explain the relationship between fibre, gut microbiota and satiety.","Identify affordable, culturally diverse high-fibre foods."],body:`
[[fig:fiber-digestion]]

## Two broad types

- **Soluble fibre** (oats, barley, legumes, apples, citrus, flaxseed, psyllium) dissolves into a gel. It slows gastric emptying and glucose absorption and can help lower blood cholesterol.
- **Insoluble fibre** (wheat bran, whole grains, vegetable skins, nuts, seeds) adds bulk and shortens transit time.

Most plant foods contain both. Resistant starch — found in cooked and cooled potatoes and rice, green banana, legumes and whole grains — behaves like soluble fibre and is fermented in the colon.

## The gut microbiota

The large intestine hosts trillions of microorganisms that ferment fibre into short-chain fatty acids, which nourish colon cells and influence inflammation and appetite signalling. A varied, plant-rich, fibre-adequate diet supports a more diverse community than a diet high in ultra-processed, low-fibre foods.

!!D|"Gut health" is not a single measurable state. Regular comfortable bowel movements, absence of pain, tolerance of a varied diet and adequate fibre are practical everyday indicators.

## Fibre and satiety

Fibre adds volume and slows the release of energy, so meals feel more substantial for longer. Increasing fibre too quickly — especially with low fluid intake — can cause bloating and gas. Build up gradually over two to three weeks and increase fluids alongside it.

| Food | Serving | Approximate fibre |
| Cooked lentils | 150 g | 8–11 g |
| Pear with skin | 1 medium | 5–6 g |
| Oats (dry) | 40 g | 4 g |
| Cooked brown rice | 150 g | 2–3 g |
| Broccoli | 100 g | 3 g |
| Almonds | 30 g | 4 g |

## Affordable, global sources

Dried beans and lentils, chickpeas, split peas, whole maize meal, millet, oats, brown rice, sweet potato, cabbage, carrots, bananas, apples, seasonal greens, seeds and whole-grain bread. These are among the least expensive foods in almost every market.

!!X|See HERBULANCE Book 02 for the complete guide to gut health and digestion, and Book 08 for soaking, cooking and preserving legumes.

> Fibre is the one nutrient most people would benefit from eating more of — and it is cheap.
`,takeaways:["Soluble fibre gels and slows digestion; insoluble fibre adds bulk.","Gut microbes ferment fibre into compounds that support the colon and appetite regulation.","Increase fibre gradually, with fluids, from affordable staple foods."],crossrefs:["Book 02 — Gut Health & Digestion Guide","Book 08 — Food Preservation & Fermentation"],refs:P("nas_dri_macro","efsa_drv","who_healthy_diet")},{id:"ch12",num:12,part:2,title:"Hydration and Everyday Fluid Balance",kicker:"Part II — Nutrition and eating behaviour",objectives:["Describe how fluid needs vary with climate, activity and life stage.","Explain fluid balance, hydrating foods and the role of electrolytes.","Evaluate claims about water, sugary drinks and caffeinated drinks."],body:`
[[fig:hydration]]

## How much is enough?

Fluid requirements are individual. Body size, heat, humidity, altitude, physical activity, pregnancy, breastfeeding, illness (fever, vomiting, diarrhoea) and high-fibre diets all raise needs. Rather than a fixed number of glasses, useful everyday indicators are thirst, a pale straw urine colour, and drinking regularly across the day.

Water needs are typically estimated at around 2 litres a day for adult women and 2.5 litres a day for adult men in temperate conditions, including water from food — but these are population averages, not prescriptions.

## Fluid from food

Soups, stews, congee, dhal, yoghurt, fruit, vegetables and rice dishes contribute meaningfully to fluid intake. In hot climates and for people who drink little, food-based fluid is a practical and culturally familiar route.

## Sugary drinks

Sugary drinks provide energy without satiation, and regular consumption is associated with greater risk of dental caries and type 2 diabetes. WHO suggests adults and children reduce free sugar intake to less than 10% of total energy, with further benefit below 5%. This is guidance about patterns, not a ban.

## Caffeine

Caffeine can improve alertness and exercise performance but can disrupt sleep, especially in sensitive people and when consumed late. Tea, coffee, yerba mate, guarana and cola all contain it; energy drinks often combine caffeine with sugar.

## Electrolytes

Sodium, potassium and chloride are replaced by ordinary food in most circumstances. Oral rehydration solutions are essential in diarrhoeal illness. Sports drinks have a role for prolonged, intense or hot-weather activity — not as an everyday beverage.

!!S|Drinking excessive water does not increase fat loss and can be dangerous. Water intoxication (hyponatraemia) occurs when intake far exceeds the kidneys' ability to excrete, and it has caused deaths in endurance events. Drink to thirst and conditions.

> Hydration supports every system in the body. It is not a weight-loss strategy.
`,takeaways:["Fluid needs are individual and rise with heat, activity, pregnancy and illness.","Food provides meaningful fluid; water is not the only route.","Excess water intake is not helpful and can be harmful."],crossrefs:["Book 10 — Food Nutrition, Vitamins, Minerals & Essential Nutrients"],refs:P("nas_dri_water","who_sugars","who_sodium","efsa_drv")},{id:"ch13",num:13,part:2,title:"Eating Patterns and Dietary Approaches",kicker:"Part II — Nutrition and eating behaviour",objectives:["Compare major dietary patterns by emphasis, evidence and limitations.","Assess nutritional adequacy of plant-exclusive and higher-protein patterns.","Explain why no single pattern is best for every person."],body:`
[[fig:dietary-patterns]]

## Patterns, not products

Named diets are convenient labels for underlying patterns. Randomised trials comparing named diets generally find modest differences in average weight change and cardiometabolic markers, with adherence being the strongest predictor of outcome. What a person can sustain matters more than which label they choose.

## Mediterranean-style

Emphasises olive oil, vegetables, legumes, whole grains, nuts, fish and moderate dairy, with limited red meat. Supported by a large evidence base for cardiovascular outcomes. Easily adapted anywhere olive oil can be replaced with another unsaturated fat.

## Plant-forward and vegetarian patterns

Vegetarian and vegan patterns are associated with adequate or improved cardiometabolic markers when well planned. Vegan diets require reliable **vitamin B12**, and attention to iodine, calcium, iron, zinc, vitamin D and long-chain omega-3. Vegetarian diets share most of these considerations to a lesser degree.

## Traditional regional diets

Injera with lentils and greens; maize, beans and squash; rice, dal and vegetables; taro, coconut and fish; miso soup, rice and pickles. These combinations evolved to be nutritionally complete from local supply and usually cost less than imported alternatives.

## Higher-protein patterns

Useful for satiety, muscle maintenance during weight change, older adults and people doing heavy training. Less useful when they displace fibre-rich carbohydrates entirely, or when they rely heavily on processed meats.

## Lower-carbohydrate and ketogenic patterns

Can produce short-term weight change and can improve glycaemia in some people with type 2 diabetes under clinical supervision. Long-term adherence is often limited; very low-carbohydrate ketogenic diets require medical oversight, particularly with diabetes medication, in pregnancy, and in adolescents.

## Time-restricted and intermittent approaches

Time-restricted eating (eating within a defined window) changes meal timing rather than food quality. Trial results are mixed and similar to continuous restriction in average outcomes. Prolonged fasting is not appropriate for adolescents, pregnancy, people on insulin or sulfonylureas, or anyone with an eating disorder history.

!!K|Judge a pattern by four questions: Is it nutritionally adequate? Is it affordable and available? Is it culturally acceptable? Can it be maintained for years?

!!S|Any pattern that eliminates entire food groups, requires supplements to avoid deficiency, or prescribes very low energy intake requires guidance from a registered dietitian or physician.

> The best diet is the one that nourishes you and still leaves room for a life.
`,takeaways:["Adherence predicts outcomes better than the diet's name.","Plant-exclusive patterns are viable with attention to B12 and a few other nutrients.","Very low-energy or ketogenic approaches require clinical supervision."],crossrefs:["Book 01 — The Plant-Forward Beginner's Guide","Book 10 — Essential Nutrients"],refs:P("who_healthy_diet","fao_sustainable","eatright","nice_obesity")},{id:"ch14",num:14,part:2,title:"Food Cravings, Emotional Eating and Food Environments",kicker:"Part II — Nutrition and eating behaviour",objectives:["Explain the biology and psychology of cravings.","Describe how stress, sleep and marketing shape eating.","Recognise when distress around food warrants professional support."],body:`
## What a craving is

A craving is a strong desire for a specific food or sensory experience. It is driven by reward learning, memory, context and — occasionally — genuine need (for example, a strong desire for salty food after heavy sweating). Restriction reliably increases craving intensity.

[[fig:food-environment]]

## Stress and sleep

Stress shifts eating in both directions: some people lose appetite, others eat more, particularly energy-dense foods. Short sleep raises ghrelin, lowers leptin, and increases reward sensitivity to food the next day. Both effects are physiological and are not evidence of weak character.

## The food environment

- **Availability** — what is in the home, at work, at school and on the route between them.
- **Price** — energy-dense, nutrient-poor foods are often the cheapest per calorie.
- **Marketing** — globally, marketing of foods high in sugar, salt and fat is concentrated on children and adolescents.
- **Convenience and time** — preparation time, kitchen access and storage determine what is realistic.
- **Social and cultural setting** — celebration, hospitality, religion and family expectation all shape what and how much is eaten.

## Restriction and rebound

Rigid restraint — strict rules, banned foods, "on plan" versus "off plan" thinking — is associated in research with increased preoccupation with food and greater likelihood of loss-of-control eating. Flexible restraint — where all foods are permitted within a generally nutritious pattern — shows better long-term outcomes.

## When to seek support

Speak to a healthcare professional if eating or body-image concerns are causing significant distress, if you are hiding eating, purging, using laxatives or diet pills, exercising to compensate for eating, avoiding social situations involving food, or thinking about food most of the day.

!!S|If you recognise these patterns, this is not a matter of discipline. Eating disorders are serious mental and physical illnesses that occur at every body size and deserve specialist care.

[[fig:recovery-signals]]

> Most cravings pass. The habits around them are what shape the outcome.
`,takeaways:["Cravings intensify with restriction and are shaped by reward learning and context.","Sleep and stress change appetite hormones the next day.","Flexible eating patterns outperform rigid rules over time."],crossrefs:["Book 04 — Smart Food Shopping & Label Reading Guide"],refs:P("who_mental","nhs_sleep","who_sugars","nice_ed")}],$g=[{id:"ch15",num:15,part:3,title:"Why Movement Matters",kicker:"Part III — Physical activity and body function",objectives:["Describe the benefits of physical activity independent of body weight.","Distinguish physical activity, exercise and sedentary behaviour.","Explain physical capability as a health outcome in its own right."],body:`
## Movement is a health input, not a punishment

Physical activity is any movement that raises energy expenditure above rest. Exercise is planned and structured. Sedentary behaviour is time spent sitting or lying with low energy expenditure — it is a separate behaviour from not exercising, and both matter.

[[fig:movement-benefits]]

## What changes when you move

- **Cardiovascular** — the heart pumps more per beat, blood pressure tends to fall, and circulation improves.
- **Musculoskeletal** — muscle adapts quickly; bone is preserved by loading; joints are nourished by movement.
- **Metabolic** — insulin sensitivity improves for 24–72 hours after activity; glucose is taken up by muscle independently of insulin during contraction.
- **Mental** — reductions in anxiety and depressive symptoms, better stress tolerance and improved sleep quality.
- **Functional** — carrying, climbing, rising from a chair, playing, travelling and working.
- **Social** — walking groups, team sport, dance and community activity provide connection.

## Weight-independent benefits

Improvements in cardiorespiratory fitness, blood pressure, blood lipids, glucose regulation, sleep and mood occur whether or not body weight changes. Fitness level predicts health outcomes independently of body size.

!!K|Exercise is never a punishment for eating, and it does not need to be "earned". Movement should be chosen for what it gives you, not for what it takes off you.

## Sedentary time

Long uninterrupted sitting is associated with adverse metabolic markers even in people who exercise. Breaking up sitting every 30–60 minutes — standing, walking to get water, a few stretches — has measurable benefit.

## How much is recommended

Guidance for adults is broadly consistent internationally: 150–300 minutes per week of moderate-intensity aerobic activity, or 75–150 minutes of vigorous activity, plus muscle-strengthening activity on two or more days, and limiting sedentary time. Any movement is better than none, and benefits accrue rapidly when previously inactive people begin.

!!S|People with chronic conditions, symptoms during exertion, pregnancy, recent surgery, or anyone currently inactive with health concerns should seek individualised advice before increasing intensity.

> You do not have to earn food, and you do not have to exercise to deserve a healthy body.
`,takeaways:["Movement improves cardiovascular, metabolic, mental and functional health independently of weight.","Sedentary time is a separate behaviour from not exercising.","Any increase in activity produces benefit; the first gains come fastest."],crossrefs:["Book 07 — Meal Planning & Balanced Nutrition"],refs:P("who_physical","who_pa_guidelines","hhs_pag","nhs_exercise")},{id:"ch16",num:16,part:3,title:"Walking and Everyday Movement",kicker:"Part III — Physical activity and body function",objectives:["Identify movement opportunities in transport, work and home life.","Adapt activity to limited space, limited mobility and unsafe environments.","Build up gradually using a simple progression rule."],body:`
[[fig:everyday-movement]]

## Walking is the most available exercise

Walking requires no equipment, no membership and no skill. It scales with fitness: slow walking is valuable for beginners, older adults and people recovering from illness; brisk walking is a genuine moderate-intensity workout.

## Accumulated movement counts

Ten minutes on the way to work, ten at lunch and ten after dinner equal thirty minutes. Studies of activity accumulation show benefits equivalent to a single continuous session.

## Adapting to circumstance

| Circumstance | Practical options |
| Long desk hours | Standing calls, walking meetings, stairs, brief hourly movement |
| Night or shift work | Short walks before and after shifts, light indoor movement |
| Caregiving at home | Squats while supervising, walking with a stroller, active play |
| Unsafe neighbourhoods | Indoor walking, stairwells, shopping centres, home routines, community centres |
| Cold, heat or poor air quality | Indoor routines, mall walking, active video games, timing around air quality |
| Limited mobility | Seated marching, resistance bands, wheelchair pushes, upper-body mobility |
| No equipment, no space | A two-metre square is enough for a full routine |

## Gradual progression

A widely used rule is to increase total weekly activity by no more than about 10% at a time, and to add intensity only after duration feels comfortable. Soreness for a day or two after new activity is normal; sharp pain, chest pain, dizziness or unusual breathlessness is not.

[[fig:aerobic-zones]]

!!S|Stop exercising and seek urgent medical care for chest pain or pressure, fainting, severe breathlessness, or an irregular heartbeat during exertion.

> The best activity is the one that fits inside a life you already have.
`,takeaways:["Walking, active transport and household work are legitimate physical activity.","Accumulated bouts of ten minutes provide real benefit.","Increase volume gradually; pain and warning symptoms are not normal."],crossrefs:["Book 06 — Cooking Methods & Kitchen Techniques (standing and kitchen movement)"],refs:P("who_pa_guidelines","cmo_uk","nhs_exercise")},{id:"ch17",num:17,part:3,title:"Strength Training and Muscle Health",kicker:"Part III — Physical activity and body function",objectives:["Explain how muscle adapts to resistance training.","Perform beginner strength movements without gym equipment.","Apply progressive overload and recovery safely."],body:`
## Why strength training matters

Muscle is contractile tissue that responds to load. Resistance training preserves and builds muscle mass, strengthens bone and tendons, improves glucose disposal, supports joints, and makes everyday tasks easier. In later life it is one of the strongest interventions for maintaining independence.

[[fig:strength-guide]]

## Muscle adaptation

A training session creates a temporary disturbance in muscle fibres. During recovery, protein synthesis repairs and reinforces the tissue, and the nervous system becomes better at recruiting it. This is why strength rises faster than muscle size in the first weeks.

## Progressive overload

Adaptation requires a gradually increasing demand. Practical ways to progress:
1. More repetitions with the same load.
2. More sets.
3. Slower, more controlled lowering.
4. Longer range of motion.
5. Heavier load, a stronger band, or a heavier bag.
6. Shorter rest between sets.

Only one variable should increase at a time.

## Equipment-free and low-cost options

- **Bodyweight** — sit-to-stand, wall or knee push-ups, hip hinges, calf raises, lunges, planks and their regressions.
- **Resistance bands** — inexpensive, portable, and suitable for pulling movements that are hard to do with bodyweight.
- **Household objects** — a filled backpack, water bottles, a bag of rice or flour, a chair, a towel.
- **Free weights** — dumbbells or kettlebells where affordable and safely stored.

[[fig:home-routine]]

## Beginner safety

Warm up with five to ten minutes of easy movement. Learn the movement pattern before adding load. Keep the spine long and neutral, breathe out on the effort, and never train through sharp or joint pain. Two sessions per week with a day between is a sound starting point for most adults.

!!S|People with uncontrolled blood pressure, retinopathy, hernia, acute injury, recent surgery, or pregnancy should seek individualised guidance before heavy lifting. Adolescents can strength train safely with supervision and good technique — the goal is skill and confidence, not maximal lifting.

> Strength is the ability to live your own life without asking permission from your body.
`,takeaways:["Muscle adapts to load during recovery, not during the session.","Progress one variable at a time; technique first, load second.","No gym is required — bodyweight, bands and bags are enough."],crossrefs:["Book 07 — Meal Planning & Balanced Nutrition"],refs:P("who_pa_guidelines","hhs_pag","cmo_uk")},{id:"ch18",num:18,part:3,title:"Cardiovascular Exercise",kicker:"Part III — Physical activity and body function",objectives:["Describe aerobic capacity and how it improves.","Use the talk test to gauge intensity.","Choose low-impact options and plan progression and recovery."],body:`
## Aerobic capacity

Cardiorespiratory fitness (often expressed as VO2max) describes how efficiently the heart, lungs and muscles deliver and use oxygen. It improves with consistent aerobic training and is one of the strongest predictors of long-term health — including in people whose body weight does not change.

[[fig:aerobic-zones]]

## Choosing an activity

| Activity | Impact | Notes |
| Walking | Low | Accessible everywhere; brisk pace is moderate intensity |
| Cycling / stationary bike | Very low | Joint-friendly; requires a bike or access |
| Swimming / water exercise | Very low | Excellent for arthritis, pregnancy, high body mass |
| Dancing | Variable | Social, cultural, enjoyable — adherence is high |
| Running | High | Efficient, but build volume slowly; footwear and surface matter |
| Rowing / skipping / team sport | Variable | High skill and intensity; learn technique first |

## Intensity: the talk test

- **Light** — you can sing.
- **Moderate** — you can talk but not sing.
- **Vigorous** — you can only say a few words.

Heart-rate monitors and perceived exertion scales are useful but not required.

## Progression

Begin with what you can do comfortably — even five to ten minutes. Add five minutes per week, or add one extra session. Include one slightly harder session per week only when easy sessions feel comfortable.

## Recovery

Aerobic training is lower cost per session than strength training, but fatigue still accumulates. Include at least one low-load day per week, and treat persistent tiredness, resting heart rate elevation, poor sleep and falling performance as signals to reduce volume.

[[fig:recovery-signals]]

!!S|Chest pain, fainting, severe breathlessness or palpitations during exertion require immediate medical attention. People with asthma should carry their prescribed reliever; people with diabetes should understand hypoglycaemia risk before long sessions.

> Fitness is built by consistency at a comfortable intensity far more than by occasional suffering.
`,takeaways:["Cardiorespiratory fitness predicts health independently of body weight.","The talk test is a reliable, equipment-free intensity guide.","Low-impact options deliver the same aerobic benefit."],crossrefs:[],refs:P("who_pa_guidelines","hhs_pag","nhs_exercise")},{id:"ch19",num:19,part:3,title:"Flexibility, Mobility and Balance",kicker:"Part III — Physical activity and body function",objectives:["Distinguish mobility, flexibility, balance and coordination.","Describe how joint function supports everyday movement.","Apply safe stretching and balance practice."],body:`
[[fig:mobility-balance]]

## Four related capacities

- **Flexibility** — the length a muscle and connective tissue can reach.
- **Mobility** — the usable range a joint can move through under control.
- **Balance** — the ability to maintain or recover a stable position, drawing on vision, the inner ear and sensation in the feet.
- **Coordination** — the timing and sequencing of muscle activation.

Mobility and strength together matter more than flexibility alone. Being able to stretch far does not guarantee control through that range.

## Functional value

Reaching a shelf, stepping over an obstacle, turning to look behind you, getting off the floor, carrying a child — these are the outcomes that matter. Balance ability is a strong predictor of falls risk in later life, and it responds to training.

## Practical practice

- **Dynamic mobility before activity** — arm circles, leg swings, spinal rotation, ankle circles.
- **Static stretching after activity** — hold 20–40 seconds at a comfortable length; never bounce or force.
- **Balance work** — stand on one foot while brushing teeth, tandem stance along a counter, gentle tai chi or yoga.
- **Whole-body flows** — sun salutations, qigong, mobility flows of five to ten minutes.

## Safety

Stretching should feel like a mild pull, never pain. People with hypermobility, connective-tissue conditions, acute injury or joint replacement should follow clinical guidance rather than generic stretching advice.

!!S|Stretching does not prevent injury on its own and does not cause fat loss. It is one component of a balanced routine alongside strength and aerobic work.

> Range of motion you can control is worth more than range of motion you cannot.
`,takeaways:["Mobility is controlled range; flexibility is tissue length; balance is stability.","Balance training reduces falls risk and responds well to practice.","Stretch to discomfort, not to pain."],crossrefs:[],refs:P("who_pa_guidelines","cmo_uk","nhs_exercise")},{id:"ch20",num:20,part:3,title:"Rest, Recovery and Exercise Adaptation",kicker:"Part III — Physical activity and body function",objectives:["Explain how adaptation occurs during recovery.","Recognise the signs of under-recovery and overtraining.","Plan rest days and sleep as part of training."],body:`
[[fig:recovery-cycle]]

## Adaptation happens at rest

Training is a stimulus; the improvement occurs between sessions. Muscle protein synthesis, tendon remodelling, glycogen replenishment and cardiovascular adaptation all require time, food and sleep.

## Rest days are training days

A rest day does not mean inactivity. Walking, gentle mobility, easy swimming and household work all support recovery while maintaining movement. Complete rest is appropriate when fatigue is high.

## Sleep and repair

Deep sleep is associated with growth hormone release, tissue repair and memory consolidation — including motor learning from a new exercise. Sleep restriction reduces endurance, strength, coordination and motivation, and increases injury risk.

## Overtraining warning signs

[[fig:recovery-signals]]

- Performance that falls despite consistent training.
- Persistent heavy legs or muscle soreness lasting more than 72 hours.
- Resting heart rate elevated on waking, or unusually low.
- Disrupted sleep, irritability, loss of motivation.
- Recurrent minor illness, headaches, appetite change.
- In women, menstrual irregularity can be a sign of relative energy deficiency.

## Deload and variation

Reducing volume for a week every four to six weeks allows accumulated fatigue to clear. Varying activities — walking, swimming, strength, dance — distributes load across tissues and reduces overuse risk.

!!S|Persistent fatigue, unexplained weight change, chest symptoms, dizziness, or menstrual irregularity with heavy training warrant medical assessment. Relative energy deficiency in sport is a clinical condition, not a badge of effort.

> Rest is not the opposite of training. It is the part where training works.
`,takeaways:["Adaptation requires time, food and sleep between sessions.","Rest days can be active and still count as recovery.","Persistent fatigue and falling performance are signals, not failures."],crossrefs:["Book 10 — Essential Nutrients"],refs:P("nhs_sleep","who_pa_guidelines","hhs_pag")},{id:"ch21",num:21,part:3,title:"Building a Balanced Weekly Activity Routine",kicker:"Part III — Physical activity and body function",objectives:["Construct a beginner and an intermediate weekly activity plan.","Balance aerobic work, strength, mobility and recovery.","Adapt the plan to home, outdoor and low-impact settings."],body:`
[[fig:weekly-plan]]

## The shape of a balanced week

For most adults, a workable week contains: aerobic movement on most days, two strength sessions, mobility or balance practice sprinkled through the week, and at least one low-load day.

## Age and jurisdiction: what guidance says

| Group | Guideline | Source |
| Adults 18–64 | 150–300 min moderate or 75–150 min vigorous aerobic per week, plus muscle strengthening 2+ days | WHO 2020; US HHS 2018; UK CMO 2019 |
| Adults 65+ | As above, plus balance training 3+ days per week | WHO 2020 |
| Children and adolescents | Average 60 min per day of moderate-to-vigorous activity | WHO 2020 |
| Pregnancy and postpartum | At least 150 min moderate activity per week, adjusted to the individual | WHO 2020; national guidance varies |
| Everyone | Limit sedentary time; replace with activity of any intensity | WHO 2020 |

## Beginner week (weeks 1–4)

- **3 days**: 10–20 minutes of easy walking, broken into bouts if needed.
- **2 days**: 15 minutes of bodyweight strength (sit-to-stand, wall push, hip hinge, calf raise).
- **Daily**: 5 minutes of mobility, and standing breaks each hour.
- **1 day**: full rest.

## Intermediate week

- **3 days**: 30–45 minutes of continuous aerobic activity at a conversational pace, with one session slightly harder.
- **2 days**: 30–40 minutes of strength work with progressive load.
- **2 days**: mobility or balance practice of 10 minutes.
- **1 day**: rest or gentle recreation.

## Home, outdoor and low-impact

All three can deliver the same weekly structure. Home routines need only a chair and a band. Outdoor activity adds terrain and daylight. Low-impact options — cycling, swimming, elliptical, chair-based work — protect joints while improving aerobic fitness.

[[fig:everyday-movement]]

!!S|These are general educational templates. People with medical conditions, disabilities, pregnancy or persistent symptoms should have a plan adapted by a qualified professional.

> Plan the week you can actually live, not the week you wish you lived.
`,takeaways:["A balanced week combines aerobic work, strength, mobility and rest.","International guidelines are broadly consistent across adults and older adults.","Templates are starting points — individual plans come from professionals."],crossrefs:["Book 07 — Meal Planning & Balanced Nutrition"],refs:P("who_pa_guidelines","hhs_pag","cmo_uk","nhs_exercise")}],Ig=[{id:"ch22",num:22,part:4,title:"Sleep and Body Regulation",kicker:"Part IV — Sleep, stress and lifestyle",objectives:["Describe sleep stages and circadian rhythm.","Explain how sleep influences appetite, energy and recovery.","Apply practical sleep-supportive habits."],body:`
[[fig:sleep-circadian]]

## Sleep stages

Sleep cycles roughly every 90 minutes through light sleep, deep (slow-wave) sleep and REM sleep. Deep sleep dominates early in the night and supports tissue repair and growth hormone release; REM dominates later and supports memory and emotional processing.

## Circadian rhythm

An internal clock, entrained mainly by light, coordinates alertness, temperature, hormone release and digestion. It expects light in the morning, darkness at night and regular meal timing. Shift work, jet lag and late-night screens all disturb it.

## Sleep and appetite

Short sleep increases ghrelin, decreases leptin, and raises reward sensitivity to food. It also reduces insulin sensitivity the next day. These are measured physiological effects — not a moral failure of the person who is tired.

## Duration and quality

Most adults need roughly 7–9 hours; adolescents need 8–10; older adults need 7–8 but often sleep in shorter, more fragmented periods. Quality — continuity, timing, breathing, and how you feel on waking — matters alongside duration.

[[fig:sleep-hygiene]]

## Practical sleep routines

1. Keep a consistent wake time, even after a poor night.
2. Get bright light within an hour of waking.
3. Keep the bedroom cool, dark and quiet.
4. Stop caffeine by early afternoon.
5. Reduce alcohol and heavy meals late at night.
6. Build a repeatable wind-down sequence.

!!K|Sleep supports weight regulation but does not determine it. Treating sleep as a weight-loss tool misses the point — it is a foundation for appetite, mood, safety and performance.

!!S|Persistent insomnia, loud snoring with pauses in breathing, restless legs, or marked daytime sleepiness should be assessed by a clinician. Sleep disorders are treatable conditions.

> Sleep is the cheapest, most available recovery tool there is — and the one most often traded away.
`,takeaways:["Sleep architecture and circadian timing both matter, not just hours in bed.","Short sleep measurably shifts appetite hormones and food reward.","A consistent wake time anchors the rhythm more than a fixed bedtime."],crossrefs:[],refs:P("nhs_sleep","fao_energy","who_mental")},{id:"ch23",num:23,part:4,title:"Stress and Everyday Wellbeing",kicker:"Part IV — Sleep, stress and lifestyle",objectives:["Describe the acute and chronic stress responses.","Explain how stress influences appetite and eating behaviour.","Identify practical and professional sources of support."],body:`
[[fig:stress-response]]

## Acute versus chronic stress

Acute stress is fast and useful: alertness rises, glucose is mobilised, digestion pauses, and the body prepares to act. Chronic stress keeps these systems active for weeks or months, which affects sleep, blood pressure, immunity, mood and appetite.

## Cortisol and appetite

Cortisol follows a daily rhythm, peaking in the morning. Under sustained stress that rhythm flattens, and appetite — particularly for energy-dense, rewarding foods — may increase. Some people eat less under stress; both responses are normal.

## What helps

- **Movement** — walking, cycling and strength work reduce perceived stress and improve sleep.
- **Breathing and relaxation** — slow breathing, progressive muscle relaxation, prayer, meditation, tai chi.
- **Connection** — talking to someone, shared meals, community and faith groups.
- **Structure** — regular meals, regular sleep, and realistic daily plans.
- **Reducing load where possible** — some stressors can be changed: boundaries, delegation, saying no, asking for help.

## Professional support

Psychologists, counsellors, social workers, physicians and community mental-health services provide structured support. Cognitive behavioural therapy has strong evidence for stress, anxiety, depression and insomnia.

!!S|If you feel hopeless, unable to cope, or are thinking about harming yourself, contact local emergency services or a crisis line in your country immediately. Support exists and it works.

!!X|See HERBULANCE Book 05 for kitchen and food-safety routines that reduce everyday decision load, and Book 07 for planning habits that lower weekday stress.

> Stress management is not indulgence. It is maintenance for every other habit you are trying to keep.
`,takeaways:["Chronic stress changes sleep, appetite, mood and metabolic markers.","Movement, sleep, connection and structure are evidence-based stress supports.","Professional help is appropriate and effective for sustained distress."],crossrefs:["Book 07 — Meal Planning & Balanced Nutrition"],refs:P("who_mental","nhs_sleep","fao_energy")},{id:"ch24",num:24,part:4,title:"Daily Habits and Environment",kicker:"Part IV — Sleep, stress and lifestyle",objectives:["Identify how work, budget, transport and household routines shape health behaviours.","Design environmental changes that make habits easier.","Recognise the limits of individual responsibility."],body:`
[[fig:daily-environment]]

## Circumstances are not excuses; they are the setting

Plans fail when they ignore reality. A twelve-hour shift, three buses, a shared kitchen, a single income, a small child, a chronic illness or a cold flat are not minor details — they are the conditions a habit has to survive.

## Practical design changes

| Barrier | Environmental change |
| Little time to cook | Batch-cook staples, keep frozen vegetables and canned legumes, plan 15-minute meals |
| Limited budget | Buy dried legumes, seasonal produce, whole grains and store brands; cook once, eat twice |
| Sedentary work | Hourly standing breaks, walking meetings, a longer route to the bathroom |
| Screen time at night | Charge the phone outside the bedroom; set a household "screens off" time |
| Shared household with mixed tastes | Build meals around a base everyone eats, with toppings and sauces that vary |
| Transport dependence | Alight one stop early, park further away, walk part of the route |
| Unsupportive social environment | Find one ally, join a group, choose your social setting for meals where possible |

## Family and social routines

Households where meals are eaten together tend to have more varied diets and better wellbeing in children and adolescents. The effect comes from routine and connection, not from any specific recipe.

## Media environment

Food marketing, social media and comparison culture all shape expectations. Curating who you follow, muting content that triggers body comparison, and remembering that online content is edited and monetised are protective habits.

!!K|Sustainable change must fit real living circumstances. If a plan only works in a life you do not have, it is not a plan.

!!S|Households experiencing food insecurity need access and affordability solutions — community food programmes, social services and practical budgeting support — before any discussion of diet quality. Hunger is not a nutrition choice problem.

> Design the environment first. Motivation is unreliable; a well-designed kitchen is not.
`,takeaways:["Time, money, transport and household structure determine what is possible.","Environmental design outperforms willpower for most habits.","Food insecurity is a structural problem requiring structural support."],crossrefs:["Book 04 — Smart Food Shopping & Label Reading Guide","Book 07 — Meal Planning & Balanced Nutrition"],refs:P("fao_sustainable","who_healthy_diet","eatright")}],Pg=[{id:"ch25",num:25,part:5,title:"Why Body Weight Fluctuates",kicker:"Part V — Understanding body-weight changes",objectives:["Identify the main causes of short-term weight change.","Explain why daily readings do not reflect body fat.","Decide whether, when and how to use weight data at all."],body:`
[[fig:weight-fluctuation]]

## The scale measures everything

A body weight measurement includes fat, muscle, bone, water and the contents of the gastrointestinal tract. Only a small part of day-to-day change reflects tissue gain or loss.

## Main causes of short-term fluctuation

- **Body water** — the largest and fastest variable. Sodium, carbohydrate intake (each gram of glycogen holds roughly three grams of water), hydration, heat and the menstrual cycle all shift it.
- **Glycogen** — a hard training week or a higher-carbohydrate day increases glycogen and its associated water.
- **Digestive contents** — a large meal, high-fibre foods and constipation all change the reading.
- **Hormonal cycle** — many people see a 1–3 kg rise in the days before menstruation, largely from fluid.
- **Time of day** — people are typically lightest on waking, after using the bathroom, and heaviest in the evening.
- **Measurement error** — different scales, different floors, clothing, and posture can shift readings by a kilogram or more.

## What this means practically

A single reading contains very little information. Trends across weeks contain more, and only if they are interpreted alongside sleep, stress, activity, appetite and health markers.

## Options other than the scale

- How clothing fits.
- Functional measures: distance walked, stairs climbed, repetitions completed, how easily you rise from the floor.
- Energy and mood across the day.
- Clinical markers measured by a healthcare professional.

!!K|Short-term weight change is mostly water and gut content. It does not tell you whether body fat changed.

!!S|Frequent weighing can increase anxiety and preoccupation in people vulnerable to disordered eating. If the scale changes your mood for the day, it is reasonable to stop weighing and to focus on behaviour and function instead.

> The scale is a tool, not a judge. If it is not useful to you, you are allowed to put it away.
`,takeaways:["Water, glycogen, sodium, digestion and hormones move the scale daily.","Trends over weeks are more informative than any single reading.","Choosing not to weigh is a valid, evidence-consistent option."],crossrefs:[],refs:P("niddk_weight","who_sodium","fao_energy")},{id:"ch26",num:26,part:5,title:"Body Mass Index and Its Limitations",kicker:"Part V — Understanding body-weight changes",objectives:["State the BMI formula and adult categories.","Explain what BMI can and cannot indicate.","Recognise why BMI is inappropriate as a standalone measure in adolescents and several other groups."],body:`
[[fig:bmi-limits]]

## The formula

BMI = body mass (kilograms) divided by height squared (metres squared). It was developed in the 19th century by Adolphe Quetelet as a population statistic, and adopted in the late 20th century as a screening measure because height and weight are cheap and quick to measure.

| Adult category | BMI (kg/m²) |
| Underweight | Below 18.5 |
| Healthy weight range | 18.5 to 24.9 |
| Overweight | 25.0 to 29.9 |
| Obesity class 1 | 30.0 to 34.9 |
| Obesity class 2 | 35.0 to 39.9 |
| Obesity class 3 | 40.0 and above |

These are adult categories, developed from population data, and are used alongside other assessments in clinical practice.

## What BMI cannot see

- **Muscle mass** — muscular individuals are frequently classified as overweight despite low body fat.
- **Fat distribution** — central adiposity carries different risk from peripheral fat at the same BMI.
- **Age** — body composition changes with ageing; older adults may have higher BMI with protective lean mass, or normal BMI with low muscle.
- **Ethnicity** — risk thresholds differ: many guidelines recommend lower action points for people of South Asian, Chinese, Japanese and other Asian backgrounds, and different cut-offs apply in Black populations in some studies.
- **Fitness** — cardiorespiratory fitness modifies risk substantially at any BMI.
- **Illness and life stage** — pregnancy, oedema, acute illness and certain conditions distort interpretation.

## Adolescents: a different system entirely

Adult BMI categories must not be applied to children or adolescents. Paediatric assessment uses age- and sex-specific growth charts (for example, BMI-for-age percentiles) and is interpreted by clinicians trained in growth and development.

!!S|This book contains no BMI calculator and no weight-loss instruction for anyone under 18. Adolescent growth is unpredictable, and restriction during growth can cause lasting harm to bone, brain and development.

## Using BMI responsibly

As a screening conversation-starter at population level, BMI is useful. As a description of an individual's health, it is incomplete. A clinical assessment adds waist circumference, blood pressure, blood glucose and lipids, fitness, medical history, diet quality and the person's own goals.

> BMI is a ruler for populations. It is a poor portrait of a person.
`,takeaways:["BMI is weight divided by height squared, developed for population statistics.","It ignores muscle, fat distribution, age, ethnicity and fitness.","Adult categories never apply to adolescents."],crossrefs:[],refs:P("cdc_about_bmi","cdc_bmi_categories","who_adolescent","nice_obesity")},{id:"ch27",num:27,part:5,title:"Metabolic Adaptation and Weight Plateaus",kicker:"Part V — Understanding body-weight changes",objectives:["Explain adaptive thermogenesis.","Describe why progress slows and plateaus occur.","Set realistic expectations without blaming the individual."],body:`
[[fig:metabolic-adaptation]]

## What happens as body mass changes

When body mass falls, resting expenditure falls with it — there is simply less tissue to maintain. In addition, expenditure tends to fall slightly more than the change in mass predicts, and non-exercise movement often declines. This is adaptive thermogenesis.

## Why plateaus occur

1. Smaller bodies use less energy at rest.
2. Adaptive thermogenesis lowers expenditure beyond that.
3. NEAT and spontaneous movement quietly reduce.
4. Appetite signals rise, and intake creeps up without being noticed.
5. Fluid shifts can mask slow tissue change on the scale.

## It is reversible

Adaptive thermogenesis is not permanent damage. When intake and body mass rise, expenditure rises too. Research on people who have maintained weight change over years shows that a modest, manageable increase in activity and a consistent eating pattern can hold a new weight — it requires ongoing attention, not permanent restriction.

## Expectations matter

Early weight change is often faster because of water and glycogen loss. Later change is slower. Progress that looks like a flat line on a scale may still reflect improved fitness, better sleep, improved blood pressure and preserved muscle.

## What to focus on during a plateau

- Performance and function markers.
- Sleep, energy and mood.
- Eating pattern quality and consistency.
- Strength, endurance and mobility gains.
- Clinical markers measured by a professional, where relevant.

!!K|A plateau is normal physiology, not personal failure. It is also not evidence that the metabolism has been "broken".

!!S|Avoid responding to a plateau with extreme restriction, unregulated supplements or excessive exercise. These raise the risk of nutrient deficiency, muscle loss, injury and disordered eating.

> Progress has more than one axis. The scale is only one of them.
`,takeaways:["Expenditure falls with body mass and adapts slightly beyond it.","Plateaus are expected, common and reversible.","Function, fitness and clinical markers can improve while weight is stable."],crossrefs:[],refs:P("fao_energy","niddk_weight","nice_obesity")},{id:"ch28",num:28,part:5,title:"Genetics, Medications and Medical Factors",kicker:"Part V — Understanding body-weight changes",objectives:["Describe genetic contributions to body weight and shape.","Identify medical conditions and medications that affect weight.","Understand socioeconomic determinants without fatalism."],body:`
[[fig:genetics-environment]]

## Genetic variation

Twin and family studies show that a substantial share of variation in body weight, fat distribution and appetite is inherited. Identified variants affect appetite signalling, satiety, fat storage location and metabolic efficiency. Genetic predisposition is real — and it interacts with environment rather than acting alone.

## Conditions that influence weight

- **Thyroid disorders** — hypothyroidism reduces expenditure modestly; hyperthyroidism raises it. Both require diagnosis and treatment by a clinician.
- **Polycystic ovary syndrome** — associated with insulin resistance and weight gain, particularly central.
- **Cushing syndrome** — cortisol excess, rare but important.
- **Type 1 and type 2 diabetes** — insulin therapy and some other medications affect weight.
- **Sleep disorders** — obstructive sleep apnoea disrupts appetite regulation and is both a cause and consequence of weight change.
- **Mobility limitations, chronic pain, arthritis and respiratory disease** — reduce activity capacity and often require adapted programmes.

## Medications
