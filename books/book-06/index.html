n. Simmer to concentrate the liquid; this is reduction. Watch closely because salt and strong flavours also become more concentrated.","Do not deglaze a dangerously hot or smoking pan. Liquid can splatter and alcohol can ignite; a non-alcoholic stock or water is a useful alternative."]}],key:"Choose a fat or liquid for its job and change the amount only after considering its effect on heat and flavour.",activity:"Add a spoonful of water or stock to a warm, not smoking, pan after cooking vegetables. Scrape the browned bits and observe how the liquid changes.",diagram:{title:"Four jobs in a pan",labels:["Fat: transfers heat and carries flavour","Acid: adds brightness","Liquid: loosens browned bits","Reduction: concentrates"],caption:"A small change can affect flavour, texture and cooking behaviour at once."},refs:[1,8]},{id:20,part:4,title:"Sauces, Thickening and Emulsions",description:"Turn a few ingredients into texture and cohesion.",minutes:9,intro:"A sauce connects elements on a plate. It can add moisture, acidity, richness or contrast, and it can be as simple as a well-seasoned pan liquid.",objectives:["Compare reduction, roux, slurry and puree.","Make a basic temporary emulsion.","Troubleshoot lumps or separation."],sections:[{title:"Four ways to thicken",paragraphs:["A reduction thickens by evaporating water and concentrating dissolved ingredients. A roux combines flour and fat, cooked together before liquid is gradually added. A slurry disperses starch in cold liquid before it goes into a hot mixture. A vegetable or bean puree can add body without dairy.","Starches need liquid and suitable heat to swell and thicken. Whisk gradually and simmer as directed; too much starch or prolonged cooking can alter the texture. Begin with less, because you can add more but cannot easily remove it."]},{title:"Emulsions",paragraphs:["Oil and water naturally separate. Whisking breaks one into droplets dispersed in the other; mustard can help stabilise a vinaigrette. Mix a small amount of vinegar with mustard, then whisk in oil gradually. A vinaigrette may still separate on standing: whisk it again.","Mayonnaise is a more stable emulsion traditionally made with egg yolk and oil. Use pasteurised egg products when appropriate and follow local guidance for raw or lightly cooked eggs, especially for people at higher risk. A dairy-free dressing can use mustard or a suitable plant ingredient instead. [4]"]},{title:"Fix the texture",paragraphs:["For lumps, whisk or strain a safe sauce and add liquid gradually next time. A split emulsion may come together when whisked slowly into a small amount of fresh base, but results vary. If a milk sauce scorches, do not scrape the burnt layer into the rest.","Keep perishable sauces at safe temperatures and cool or refrigerate promptly. Texture fixes do not make contaminated or improperly stored food safe."]}],key:"Choose the thickener for the texture you want, and add it gradually.",activity:"Whisk 5 mL mustard and 15 mL vinegar together, then slowly whisk in 30 mL oil. Let it stand and observe any separation. Taste only with a clean spoon.",diagram:{title:"Four paths to a sauce",labels:["Reduction: less water","Roux: flour and fat","Slurry: starch and cold liquid","Emulsion: dispersed droplets"],caption:"Each method changes texture in a different way."},refs:[1,4]},{id:21,part:4,title:"Grains, Rice, Pasta and Legumes",description:"Learn the flexible foundations of many meals.",minutes:11,intro:"Grains and legumes are used in countless distinct food traditions. The variety, age, processing and equipment all affect the method.",objectives:["Choose absorption or excess-water cooking.","Adapt water and time to the ingredient.","Prepare dried beans responsibly."],sections:[{title:"Rice and whole grains",paragraphs:["Rice varieties differ in starch, texture and water needs. In an absorption method, measured water is absorbed in a covered pot; an excess-water method uses more water and drains the remainder. Follow the package or a tested recipe, and adjust for your equipment. Do not apply one ratio to every rice.","Whole grains such as barley and millet and pseudograins such as quinoa vary in preparation. Rinse when appropriate, simmer or steam as directed, and check for the desired texture. If rice is left over, cool and store it promptly under local guidance. UK guidance advises cooling rice quickly, ideally within one hour, refrigerating and using within one day. [7]"]},{title:"Pasta, lentils and chickpeas",paragraphs:["Cook pasta in enough boiling water for movement, stir to prevent sticking and begin checking before the package estimate. Drain when the texture suits the dish; reserve a little cooking water if it will help a sauce cling. Avoid scalds when draining.","Lentils differ: some hold their shape while others soften into a puree. Chickpeas and other dried legumes often benefit from soaking, but needs vary. Sort, rinse and follow ingredient-specific instructions. Canned beans are already cooked; drain or rinse according to the dish and label."]},{title:"A critical bean safety note",paragraphs:["Raw or undercooked kidney beans contain lectins that can cause illness. Do not cook raw kidney beans only in a slow cooker. University of Minnesota Extension advises soaking dried beans for 12 hours, rinsing, then boiling on the stovetop for at least 10 minutes before adding them to a slow cooker. Continue cooking until appropriately tender and follow local and product guidance. [7, 10]","Hard water, acidic ingredients, bean age and variety can change softening. Do not treat a generic time or pressure setting as a universal safety guarantee."]}],key:"Match the method to the variety, and follow specific safety guidance for dried beans.",activity:"Compare two packages of rice or grains. Note their recommended liquid and preparation methods. What differences might explain why one ratio does not fit both?",diagram:{title:"From dry ingredient to meal",labels:["Sort or rinse as appropriate","Soak when required","Cook using the right method","Serve or cool safely"],caption:"Kidney beans need special treatment; consult the cited guidance before cooking them."},refs:[7,10],related:"BOOK 01 offers plant-forward meal ideas; BOOK 02 explores food components and digestion in broader educational context; BOOK 05 expands on safe storage and handling."},{id:22,part:4,title:"Vegetables, Fruits and Plant-Based Foods",description:"Choose heat and texture for each ingredient.",minutes:9,intro:"Plant ingredients are wonderfully varied. The best method for a delicate leaf is often not the best method for a dense root.",objectives:["Match plant ingredients to suitable cooking methods.","Manage water and browning.","Use plant proteins in inclusive meals."],sections:[{title:"Vegetables by structure",paragraphs:["Leafy greens soften quickly and can be steamed or added near the end of a stew. Cruciferous vegetables such as cabbage and broccoli can be steamed, roasted or stir-fried; cut stems smaller than florets when needed. Roots and winter squash often benefit from even cuts and longer cooking.","Mushrooms release moisture and can brown once the surface dries. Onions soften and sweeten as they cook; tomatoes provide acidity and body. Courgettes and other gourds can become watery if crowded. Taste and texture preferences vary."]},{title:"Fruit and plant proteins",paragraphs:["Fruit can provide sweetness and acidity in savoury dishes, such as a citrus dressing or a fruit-topped grain dish. Use a clean board and prevent raw-animal-food cross-contamination.","Tofu can be drained and gently pressed for some preparations, then browned, simmered or steamed. Tempeh and other plant proteins have different textures; follow packaging and choose seasonings compatible with the household's dietary and allergy needs."]},{title:"Quality and nutrition",paragraphs:["Cutting, storage, cooking time and contact with water can change nutrient content in different ways. No single method preserves every nutrient best in every food. Use a variety of appealing methods and avoid unnecessary holding or overcooking.","Use safe water, wash produce before cutting and store prepared food appropriately. For limited equipment, a lidded pan can cook many vegetables with a small amount of water, followed by a brief uncovered finish."]}],key:"Start with the ingredient's structure, then choose the texture you want.",activity:"Choose a leafy vegetable and a firm root. Write a different cooking sequence for each and explain why their cooking needs differ.",diagram:{title:"Match the ingredient to the method",labels:["Leaves: brief heat","Roots: even pieces, longer heat","Mushrooms: manage moisture","Tofu: drain, then season"],caption:"These are starting points, not fixed rules for every variety or dish."},refs:[4,6],related:"BOOK 01 explores plant-forward meal building and ingredient choices."},{id:23,part:4,title:"Meat, Poultry, Fish and Eggs",description:"Balance texture with careful safety verification.",minutes:11,intro:"Animal proteins have different structures and different safety requirements. A beautiful surface is not a substitute for careful handling and measurement.",objectives:["Choose methods for tender and collagen-rich cuts.","Use a food thermometer correctly.","Separate culinary doneness from safety requirements."],sections:[{title:"Structure and method",paragraphs:["Tender cuts can suit quicker pan cooking or grilling; collagen-rich cuts often benefit from a longer braise. Poultry pieces vary in size and thickness. Fish can be delicate and may benefit from gentle heat. Eggs set as proteins coagulate, and excessive heat can make them rubbery.","Dry surfaces can brown better, but do not wash raw meat or poultry. Keep juices away from ready-to-eat food, use clean plates and utensils for cooked food, and wash and sanitise surfaces appropriately. [4]"]},{title:"A thermometer, not a guess",paragraphs:["Insert a clean food thermometer into the thickest part, avoiding bone, and check more than one location when appropriate. Follow the thermometer instructions, including depth and calibration. Clean it between uses. Colour, smell, firmness and flaking describe quality but are not reliable general safety tests. [4, 5]","For illustration only, current US guidance lists poultry at 74°C (165°F), ground beef, pork, veal and lamb at 71°C (160°F), and whole cuts of beef, pork, veal and lamb at 63°C (145°F) plus a three-minute rest. Categories and advice differ by jurisdiction; consult the current local authority and the complete chart. [5]"]},{title:"Eggs, fish and resting",paragraphs:["US FDA guidance recommends cooking eggs until both yolk and white are firm, and using appropriate thoroughly cooked or pasteurised egg products for dishes that would otherwise contain raw egg. Other jurisdictions have different advice for particular certified eggs and populations. [4, 7]","Resting can improve serving texture and is a required safety step for certain US whole cuts. Do not assume an estimated carryover rise will reach a safe temperature. Cool leftovers promptly and follow local storage guidance."]}],key:"Measure the thickest part and follow the current guidance for the specific food and jurisdiction.",activity:"Practise placing a clean, unheated thermometer in a thick piece of fruit or a folded clean cloth. Explain where you would measure a real piece of poultry and why the probe must avoid bone.",diagram:{title:"A safer protein workflow",labels:["Separate raw foods","Cook with suitable heat","Measure the thickest part","Rest when required"],caption:"Appearance is useful for quality but does not reliably establish food safety."},refs:[4,5,7],related:"BOOK 05 provides more detail on safe temperatures, contamination prevention and storage."}],eS=[{id:24,part:5,title:"Introduction to Baking Science",description:"Understand the ingredients that create structure and lift.",minutes:11,intro:"Baking rewards careful measurement because structure depends on the relationship among flour, liquid, fat, sugar, leavening and heat.",objectives:["Identify the roles of common baking ingredients.","Distinguish baking powder from baking soda.","Recognise common mixing methods and problems."],sections:[{title:"The building blocks",paragraphs:["Flour provides starch and, in wheat flour, proteins that can form gluten when hydrated and worked. Protein content differs among flours; the right choice depends on the desired structure. Liquid hydrates, eggs can bind and aerate, fat tenderises, and sugar contributes sweetness, colour and moisture retention.","Yeast produces gas through fermentation. Baking soda is a base that reacts with acid; baking powder contains a base and acid components. They are not interchangeable in equal quantities. Many baking powders react when moistened and again with heat. [12]"]},{title:"Mixing and baking",paragraphs:["Creaming beats fat and sugar to incorporate air. Rubbing-in distributes fat through flour. Folding combines mixtures gently to preserve air; whisking can incorporate air; kneading and stretch-and-fold develop dough structure. The right amount of mixing depends on the food.","Weigh ingredients where possible. Prepare the tin, preheat if instructed, and use the specified rack. A batter is usually more fluid than a dough, but there is no strict boundary. Proof yeasted dough until its condition suits the recipe rather than relying only on a clock. Cool as directed so the structure can set. [13]"]},{title:"When results disappoint",paragraphs:["Dense bread can reflect insufficient fermentation, weak yeast, too much flour or other causes. A flat cake can result from old leavening, inaccurate measuring or a disrupted structure. Dry cake may have baked too long or contained too little liquid or fat. Change one variable at a time and record the result.","Raw flour and raw eggs can carry harmful microorganisms. Do not taste raw dough or batter. Use suitable cooling and storage practices. [4]"]}],key:"Baking is a system: measure carefully and change one variable at a time.",activity:"Compare the labels of baking soda and baking powder. Write down which one already contains an acid component and why equal substitutions are unreliable.",diagram:{title:"The structure of a bake",labels:["Flour and liquid: structure","Leavening: gas","Fat and sugar: tenderness","Heat: structure sets"],caption:"The result depends on proportions, mixing, time and oven conditions."},refs:[1,4,12,13]},{id:25,part:5,title:"Fermentation and Dough Techniques",description:"Learn to read a living dough.",minutes:9,intro:"A rising dough changes over time because microorganisms and enzymes act within a flour-and-water mixture. The baker works with that process, not just a timer.",objectives:["Explain yeast fermentation and proofing.","Recognise dough development.","Separate bread fermentation from food preservation."],sections:[{title:"Yeast, sourdough and gas",paragraphs:["Yeast consumes available sugars and produces carbon dioxide and other compounds. A developed gluten network can trap gas so dough expands. Commercial yeast and sourdough cultures behave differently; sourdough also involves lactic-acid bacteria. Temperature, flour, hydration and culture activity influence the pace. [13]","Fermentation is practised in many forms, from steamed breads and flatbreads to sourdough loaves. These traditions have distinct histories and methods; avoid treating one as the universal model."]},{title:"Mix, develop, rise, shape",paragraphs:["Mix until flour is hydrated. Knead or use gentle stretch-and-folds according to the dough. Cover during bulk fermentation to limit drying; look for expansion and a more aerated feel. Shape with care, allow a final proof and bake using a tested recipe.","A sluggish dough may be cool, dry, salty in the wrong proportion, or made with inactive yeast. An overproofed dough may lose strength. Observe the dough and change one condition next time instead of assuming the stated time will always fit your kitchen."]},{title:"A boundary for safety",paragraphs:["Ordinary bread fermentation is not a guarantee that other fermented foods are safely preserved. Vegetable, dairy, meat and other fermentations need ingredient-specific, validated controls and clean equipment. Follow authoritative local guidance.","Do not taste raw dough. Maintain clean containers and discard a culture if its safety is in doubt; appearance alone cannot identify every hazard. [4]"]}],key:"Time is a guide; dough development is something you can observe.",activity:"Mix a small amount of flour and water into a firm paste. Rest it, then compare how it stretches before and after gentle folding. Do not taste raw flour.",diagram:{title:"The life of a dough",labels:["Mix and hydrate","Develop structure","Ferment and expand","Shape, proof and bake"],caption:"A warm or cool kitchen changes the pace; observe the dough rather than the clock alone."},refs:[4,13],related:"BOOK 05 discusses safe preservation and storage beyond the bread-dough introduction here."},{id:26,part:5,title:"Meal Assembly, Presentation and Plating",description:"Bring a meal together with care, not expensive equipment.",minutes:6,intro:"Presentation begins with food that is ready to eat at the right time. Colour, texture and arrangement can make an ordinary meal easier and more enjoyable to serve.",objectives:["Assemble components with useful contrast.","Consider serving temperature and portion needs.","Present food practically on any budget."],sections:[{title:"Build a useful plate",paragraphs:["Consider how the components work together: a grain or starch, vegetables, a protein source and a sauce are one flexible pattern, not a universal prescription. A crisp element beside a soft one adds contrast; a bright herb or citrus finish can make a warm dish feel fresh.","Portions depend on the person, meal and context. Serve the way that suits the household, including shared platters or bowls; restaurant-style plating is not required."]},{title:"A simple sequence",paragraphs:["Choose a clean plate or bowl. Place the main component, add supporting ingredients without piling them so high that they fall, and use a modest amount of sauce where it is useful. Garnishes should be edible, appropriate and add something to the dish.","Coordinate hot and cool components so food does not sit in unsafe conditions while being decorated. Use separate clean utensils for ready-to-eat food and account for allergies and dietary requirements."]},{title:"Everyday presentation",paragraphs:["A sprinkle of chopped herbs, a contrasting vegetable or a neatly cut wedge can provide colour without specialised tools. Leave room at the edge of a bowl for carrying it safely.","If preparing for several people, set out dishes and serving utensils before finishing the food. Good presentation is practical, welcoming and appropriate to the meal."]}],key:"A thoughtful plate is about enjoyment and usability, not expensive equipment.",activity:"Arrange a cooked grain, vegetable and protein of your choice in a bowl. Add one contrasting texture or colour and explain your choice.",diagram:{title:"A balanced visual arrangement",labels:["Main component","Supporting colour and texture","A useful sauce or garnish","Room to serve"],caption:"These are flexible visual principles, not a prescribed portion or dietary formula."},refs:[4],related:"BOOK 01 offers more ideas for flexible plant-forward meals."},{id:27,part:6,title:"Common Cooking Mistakes and How to Fix Them",description:"Diagnose quality problems without guessing about safety.",minutes:12,intro:"Every cook encounters disappointing results. Treat a mistake as evidence: what happened, what might have caused it, and what could you change next time?",objectives:["Identify plausible causes rather than a single assumed cause.","Choose a practical correction when one exists.","Know when not to try to rescue food."],sections:[{title:"A useful diagnostic sequence",paragraphs:["Describe the result precisely: pale rather than browned, sticky rather than fluffy, or separated rather than smooth. Consider heat, moisture, ingredient size, pan load, proportion and timing. More than one cause can be present.","Try a small correction only if the food has been handled safely. Reduce a watery sauce, loosen an overly thick one, or cook an underdone grain a little longer with suitable liquid. Record the change so you can test one variable next time."]},{title:"The safety boundary",paragraphs:["A troubleshooting tool cannot diagnose contamination or decide whether questionable food is safe. Do not taste food with an unsafe or unknown storage history, and do not attempt to rescue potentially contaminated food by adding acid, seasoning or extra heat.","If there is uncertainty about safety, consult your local food authority. When safe handling cannot be established, discard the food. The problem finder below addresses quality, not contamination."]},{title:"Use the problem finder",paragraphs:["Select a symptom to see likely causes, a possible correction, a prevention step and a safety reminder. The list covers pan cooking, grains, sauces, baking, heat control and timing.","Not every result is reversible. A badly burnt spice or overcooked pasta may be better treated as a lesson for the next attempt."]}],key:"Quality problems can sometimes be corrected; unsafe food cannot be made safe by guesswork.",activity:"Select a problem in the troubleshooting assistant. Explain which cause seems most plausible and which single change you would try first next time.",diagram:{title:"A cook's troubleshooting loop",labels:["Observe the result","Consider likely causes","Adjust if safe","Record and prevent"],caption:"A quality diagnosis is not a determination of food safety."},refs:[4,5]},{id:28,part:6,title:"Reading, Understanding and Adapting Recipes",description:"Treat a recipe as a useful guide, not a rigid mystery.",minutes:8,intro:"A recipe describes an intended result under particular conditions. Reading it closely helps you decide what can change and what must remain controlled.",objectives:["Read quantities, timing and terminology critically.","Scale and substitute with awareness.","Record changes for future cooking."],sections:[{title:"Read the whole recipe",paragraphs:["Check servings, equipment, ingredients and the complete method before starting. Note whether an ingredient is measured before or after chopping. Preparation time, cooking time, soaking and resting may be listed separately.","Metric weights are useful for consistency. A volume measure describes space; a weight measures mass. One litre is approximately 4.2 US cups, but a cup of flour does not weigh the same as a cup of water. Cup sizes vary by country."]},{title:"Adapt with a purpose",paragraphs:["For a smaller household, halve many ingredients but consider whether the pan is now too large and whether liquid will evaporate faster. For a larger batch, a crowded pan or deeper dish may require cooking in batches or different timing. Linear ingredient scaling does not guarantee identical heat transfer.","A vegetable soup can often use a locally available root or bean; a baking recipe or an emulsion is less forgiving. Consider allergies, salt content, water content and texture. Never substitute for a safety-critical step, validated preservation process or required equipment."]},{title:"Keep a useful record",paragraphs:["Write the date, quantities, pan, heat setting, texture and changes made. Mark whether the result served the intended number of people. Next time, change one important variable and compare.","Recipe times are prompts to check, not universal guarantees. Follow current food-safety guidance for the ingredient regardless of the wording in a recipe."]}],key:"Adapt ingredients thoughtfully, but do not improvise away a safety-critical control.",activity:"Take a familiar soup recipe and plan a half batch. List what changes besides ingredient quantities, including pot size and when you will check it.",diagram:{title:"Read a recipe in four passes",labels:["Servings and equipment","Ingredients and measures","Method and timing","Adapt and record"],caption:"Scaling changes the cooking environment as well as the ingredient amounts."},refs:[4,5]},{id:29,part:6,title:"Budget-Conscious Cooking and Reducing Waste",description:"Plan flexible meals and use food responsibly.",minutes:7,intro:"Using food well begins before shopping. A short plan can help match purchases, available storage and the time you have to cook.",objectives:["Plan around what is already available.","Use flexible ingredients and sensible quantities.","Distinguish safe reuse from unsafe reuse."],sections:[{title:"Plan and shop",paragraphs:["Check what you already have, make a short meal plan and choose quantities you can use or safely store. Seasonal produce, dried staples or frozen vegetables may be practical in some places; compare unit prices and availability rather than assuming one form is always cheapest.","A grain, a cooked legume and a vegetable can become a soup, salad or warm bowl with different seasonings. Choose ingredients that fit your household, dietary needs, budget and access to reliable storage."]},{title:"Use what is appropriate",paragraphs:["Clean vegetable stems and suitable trimmings can add flavour to a stock when handled and stored safely. Use prepared leftovers only within applicable safe storage guidance. Cool promptly, use shallow containers and label what you store.","Do not use food beyond safe limits simply to avoid waste. Smell, taste and reheating cannot reliably undo unsafe storage. If refrigeration is unreliable, make smaller batches or use shelf-stable ingredients and serve promptly. [4, 7]"]},{title:"Freeze and share thoughtfully",paragraphs:["Freeze suitable food promptly in appropriate containers when a reliable freezer is available. Record the contents and date, and thaw using a safe method. Texture may change after freezing.","Share clean equipment and plan overlapping ingredients across meals. Reducing waste is a practice of planning and safe handling, not a reason to take a food-safety risk."]}],key:"The least wasteful meal is one you can prepare, store and eat safely.",activity:"List three ingredients already available to you and plan two different meals using them. Include a safe storage plan or choose amounts that can be served immediately.",diagram:{title:"A practical food-use cycle",labels:["Check what you have","Buy a useful amount","Cook flexible components","Store or serve safely"],caption:"Plan around your actual storage and cooking conditions."},refs:[4,7],related:"BOOK 04 covers shopping and labels; BOOK 05 provides detailed guidance on leftovers and storage."},{id:30,part:6,title:"Building Your Personal Cooking Skill",description:"Make progress through repetition, reflection and curiosity.",minutes:6,intro:"Skill develops in small, repeated decisions. You do not need perfect results or professional equipment to become more independent in the kitchen.",objectives:["Recognise eight practical stages of development.","Set a realistic milestone.","Reflect on observations rather than perfection."],sections:[{title:"A progression, not a test",paragraphs:["Begin with kitchen familiarity: identify tools and safe work areas. Next practise ingredient preparation and stable cuts. Learn basic heat control, then repeat core methods such as simmering, steaming and pan cooking.","Build flavour and seasoning judgment, adapt familiar recipes, plan and coordinate multiple components, and finally create simple meals independently. These eight levels overlap; it is normal to revisit an earlier skill."]},{title:"Practise deliberately",paragraphs:["Repeat one small task with similar ingredients, then change one factor. Describe what you noticed: the sound in the pan, the size of the cut, the texture after a rest. A note can be more useful than an elaborate rating.","Choose a milestone appropriate to your circumstances: safely prepare one vegetable, cook a grain without constant checking, or coordinate two components. Use the 30-day plan flexibly; a rest day is not a failure."]},{title:"Learn with others",paragraphs:["Family members, community cooks, cookbooks and local food educators can offer different knowledge. Ask about the context of a technique and respect the people and traditions that share it.","Know when specialised training is appropriate, particularly for preservation, pressure equipment, deep-frying and temperature-controlled cooking. Reading alone is not a professional qualification."]}],key:"Confidence grows from a cycle of preparation, observation, adjustment and repetition.",activity:"Choose one skill you want to repeat this week. Define what you will observe, what equipment you need and how you will know you are more comfortable.",diagram:{title:"The learning loop",labels:["Prepare","Practise","Notice","Adjust and repeat"],caption:"Progress is gradual and personal; return to any step whenever useful."},refs:[1]},{id:31,part:7,title:"The Beginner's Cooking Practice Lab",description:"Fifteen small experiments for a more confident kitchen.",minutes:15,intro:"These exercises turn reading into observation. Choose the activities that fit your equipment and household; a sketch or comparison can replace a cooking task when necessary.",objectives:["Practise one skill at a time.","Observe sensory and physical changes.","Reflect on what you would change."],sections:[{title:"How to use the lab",paragraphs:["Each activity includes an objective, materials, a procedure, something to observe, a reflection question and a safety reminder. Use clean equipment and safe water. Quantities can be small; the purpose is learning, not producing a large meal.","Read the whole activity before beginning. A young reader should seek appropriate supervision for knives, hot liquids, appliances and oil. Never taste raw flour, raw animal products or food with an uncertain safety history."]},{title:"Record what you notice",paragraphs:["Write the ingredient, method, equipment and result. Compare like with like: if you change both heat and pan size, it will be harder to know which made the difference.","Cooking times vary. Check quality as you work, and use a food thermometer for foods that require safety verification."]}],key:"An experiment succeeds when it helps you notice something, even if the result is not perfect.",activity:"Choose any one of the fifteen labs below. Complete it at a comfortable pace and write one observation in your local learning notes.",diagram:{title:"A practical experiment",labels:["Choose one question","Prepare a small sample","Observe and compare","Reflect and record"],caption:"Change one variable at a time when a meaningful comparison is possible."},refs:[4,5]},{id:32,part:7,title:"A 30-Day Culinary Skills Learning Plan",description:"A gentle, flexible pathway from preparation to independence.",minutes:12,intro:"This is a menu of short practices rather than a deadline. Repeat, skip or adapt a day to suit your time, access and confidence.",objectives:["Develop confidence in four progressive stages.","Track practice locally in your browser.","Reflect on what is useful to repeat."],sections:[{title:"Four stages",paragraphs:["Week 1 explores the kitchen, safe preparation and organisation. Week 2 focuses on heat and cooking methods. Week 3 examines flavour, texture and food science. Week 4 brings skills together through planning, adaptation and independent cooking.","Each day includes a goal, a manageable task, an approximate time and a reflection question. Times are planning estimates, not cooking or safety guarantees. If an oven or other tool is unavailable, use the suggested observation or planning alternative."]},{title:"Make it your own",paragraphs:["Use the checkboxes to mark a day when you have completed your chosen version of the task. Progress is stored only in this browser when local storage is available. Your notes can record what you would do differently.","Prepare food safely, respect household allergies and ask for help with unfamiliar equipment. Take breaks or repeat days whenever useful."]}],key:"A short practice repeated thoughtfully is more valuable than rushing through a schedule.",activity:"Choose a starting day below, estimate when it fits your week, and write one reason the skill matters to you.",diagram:{title:"Four stages of practice",labels:["Week 1: prepare","Week 2: control heat","Week 3: build flavour","Week 4: cook independently"],caption:"Move at your own pace and substitute planning for unavailable equipment."},refs:[4]},{id:33,part:7,title:"The Culinary Reference Desk",description:"Keep the most useful comparisons close at hand.",minutes:10,intro:"A reference is most useful when it helps you make a decision. Use these comparisons as starting points and return to the relevant chapter for context.",objectives:["Compare cooking methods by heat, moisture and result.","Look up cuts, equipment and flavour adjustments.","Convert measures without confusing weight and volume."],sections:[{title:"Choose a method",paragraphs:["Moist methods such as simmering and steaming use liquid or steam; dry methods such as roasting and grilling use hot air, a hot surface or radiation. Braising combines approaches. Compare equipment, moisture, texture and limitations in the method comparison tool.","A gentle poach protects delicate structure; a spacious pan encourages browning; a covered braise suits some firm ingredients. No method is universally best."]},{title:"Quick cutting and equipment reference",paragraphs:["Slices are flat pieces; dice are cubes; julienne are thin sticks; batonnet are thicker sticks; chiffonade is ribbons of leaves. A saucepan handles liquid, a wide frying pan provides surface contact, and a thermometer checks internal temperature when safety requires it.","For a flat flavour, consider a small amount of acid, an aromatic or texture contrast. For a watery dish, consider reducing liquid or cooking in batches. Use the troubleshooting index for possible causes, not a food-safety verdict."]},{title:"Measurements",paragraphs:["1 litre is approximately 4.2 US cups; 1 kilogram is approximately 2.2 pounds. Water freezes at approximately 0°C (32°F) and boils at approximately 100°C (212°F) at sea-level pressure. Boiling temperature changes with altitude and other conditions.","A gram is weight; a millilitre is volume. The weight of a cup varies with the ingredient and how it is packed, and cup sizes vary across countries. Prefer a scale when a baking recipe gives weights. [14]"]}],key:"Reference figures are starting points; use the instructions for your ingredient, equipment and local safety guidance.",activity:"Use the method comparison tool to compare steaming and sauteing. Which would you choose for tender leafy greens, and what texture would you expect?",diagram:{title:"A decision, not a rule",labels:["Ingredient and size","Available equipment","Desired texture","Safety and serving"],caption:"The best method is the one suited to the food, household and intended result."},refs:[1,14]}],Oe=[..._g,...$g,...eS],Qi=[{id:1,roman:"I",title:"Understanding Cooking"},{id:2,roman:"II",title:"Building Kitchen Confidence"},{id:3,roman:"III",title:"Mastering Cooking Methods"},{id:4,roman:"IV",title:"Flavour, Texture & Judgment"},{id:5,roman:"V",title:"Specialised Foundations"},{id:6,roman:"VI",title:"Problem Solving & Development"},{id:7,roman:"VII",title:"Practical Application"}],ao=[{chapter:1,name:"Carrot, two ways",outcome:"Compare a raw and a gently simmered texture.",ingredients:"1 medium carrot; water for simmering.",equipment:"Board, knife, small saucepan and fork.",method:"Wash the carrot, make a flat side and cut even pieces. Set one aside; simmer the rest in enough water to cover until tender. Drain carefully.",observe:"Compare the crisp raw piece with the softer cooked pieces.",problem:"Uneven pieces soften at different rates.",variation:"Use another suitable firm vegetable.",safety:"Use safe water and a clean fork; protect hands from hot liquid."},{chapter:6,name:"A one-pot vegetable soup",outcome:"Practise mise en place and cooking order.",ingredients:"1 small onion, 1 carrot, 1 small potato, 500 mL vegetable stock, 5 mL oil and herbs.",equipment:"Board, knife, lidded saucepan and spoon.",method:"Wash and dice vegetables. Soften onion in oil, add carrot, potato and stock, then simmer until vegetables are tender. Finish with herbs.",observe:"The liquid takes on the aroma of the vegetables.",problem:"Large potato pieces may remain firm.",variation:"Add drained, fully cooked chickpeas.",safety:"Use clean utensils and cool leftovers promptly."},{chapter:8,name:"Pasta with tomato and greens",outcome:"Practise boiling and coordinating a quick sauce.",ingredients:"150 g dried pasta, 200 g chopped tomatoes, a handful of washed greens, 5 mL oil.",equipment:"Saucepan, colander and small pan.",method:"Boil pasta according to its package, checking texture early. Warm tomatoes in oil, add greens until tender, and combine with drained pasta.",observe:"Pasta should be tender with the amount of bite you prefer.",problem:"Pasta can stick if not stirred early.",variation:"Add cooked beans or herbs.",safety:"Drain away from your body and use a stable colander."},{chapter:9,name:"Steamed green vegetables",outcome:"Use steam without immersing the food.",ingredients:"200 g broccoli or green beans; water; a squeeze of lemon.",equipment:"Lidded pot and suitable steamer basket.",method:"Wash and cut the vegetables evenly. Simmer water below the basket, add vegetables, cover and check until tender. Finish with lemon.",observe:"Look for a bright colour and a texture you enjoy.",problem:"A crowded basket cooks unevenly.",variation:"Use sliced carrots, allowing for different cooking needs.",safety:"Open the lid away from your face and do not let the pot boil dry."},{chapter:10,name:"Sauteed mushrooms",outcome:"See how space encourages evaporation and browning.",ingredients:"200 g mushrooms, 10 mL oil, a small pinch of salt.",equipment:"Wide frying pan and spatula.",method:"Clean and slice mushrooms. Warm the pan and oil, spread mushrooms in a single layer and cook, turning as needed, until browned.",observe:"Moisture appears, then evaporates; the aroma deepens.",problem:"Too many mushrooms at once can steam rather than brown.",variation:"Finish with parsley or a little lemon.",safety:"Stay with the hot pan and avoid overheating the oil."},{chapter:10,name:"A simple vegetable stir-fry",outcome:"Practise cutting and adding ingredients in sequence.",ingredients:"1 carrot, 1 small pepper, 1 handful greens, 10 mL oil, 10 mL low-salt soy sauce or suitable alternative.",equipment:"Board, knife and wide pan or wok.",method:"Wash and thinly slice vegetables. Heat oil, cook carrot first, add pepper, then greens. Add sauce and toss briefly.",observe:"The vegetables should retain some texture and colour.",problem:"Very large pieces can remain firm while small ones soften.",variation:"Add properly handled firm tofu or another suitable protein.",safety:"Check soy and other allergen labels; keep oil below smoking."},{chapter:12,name:"Roasted root vegetables",outcome:"Practise oven spacing and even cuts.",ingredients:"300 g carrots and potatoes, 10 mL oil, herbs.",equipment:"Oven, tray, board and knife.",method:"Heat the oven to about 200°C (392°F). Wash and cut vegetables evenly, coat lightly with oil and spread on a tray. Roast, turning as needed, until tender and browned.",observe:"The dry edges brown while the centres soften.",problem:"Crowding traps steam.",variation:"Use locally available roots or a suitable stovetop method.",safety:"Use oven mitts; the time depends on size and oven."},{chapter:14,name:"A gentle vegetable braise",outcome:"Use a covered pot and modest liquid.",ingredients:"1 onion, 2 carrots, 200 g cabbage, 150 mL vegetable stock, 10 mL oil.",equipment:"Lidded pot and spoon.",method:"Cut vegetables. Soften onion in oil, add carrots and stock, cover and simmer gently. Add cabbage later and cook until all are tender.",observe:"The vegetables soften and the stock becomes flavourful.",problem:"Too much liquid makes a soup rather than a braise.",variation:"Add fully cooked beans near the end.",safety:"Watch the liquid level and lift the lid away from your face."},{chapter:17,name:"Lentils with a bright finish",outcome:"Compare flavour before and after a small acid addition.",ingredients:"150 g cooked lentils, 100 mL water or stock, 5 mL lemon juice, herbs.",equipment:"Small saucepan and clean tasting spoon.",method:"Warm the cooked lentils with the liquid. Taste a safe sample, then add lemon and herbs a little at a time.",observe:"The acid may make the lentils taste brighter.",problem:"Too much lemon can overwhelm the dish.",variation:"Use a mild vinegar instead.",safety:"Use safely stored cooked lentils and a clean spoon for each taste."},{chapter:18,name:"Aromatic spiced onions",outcome:"Practise adding spices after an aromatic has softened.",ingredients:"1 onion, 10 mL oil, 1 mL ground cumin, optional herbs.",equipment:"Frying pan and spoon.",method:"Slice onion and soften in oil over moderate heat. Add cumin briefly, stir, and remove from heat before it darkens excessively.",observe:"The aroma changes as the spice warms.",problem:"Ground spice can burn rapidly.",variation:"Use another spice appropriate to the meal.",safety:"Do not leave the pan unattended; discard badly burnt spice."},{chapter:19,name:"A simple vegetable pan sauce",outcome:"Practise deglazing and reduction.",ingredients:"100 mL vegetable stock, browned bits from cooked vegetables, 5 mL lemon juice.",equipment:"Frying pan and spoon.",method:"Remove cooked vegetables. Lower heat, carefully add stock to the warm pan and scrape up browned bits. Simmer briefly and finish with lemon.",observe:"The liquid darkens slightly and tastes more concentrated.",problem:"A very salty stock becomes saltier as it reduces.",variation:"Use water and fresh herbs.",safety:"Do not pour liquid into a smoking or dangerously hot pan."},{chapter:20,name:"Mustard vinaigrette",outcome:"Make and observe a temporary emulsion.",ingredients:"5 mL mustard, 15 mL vinegar, 30 mL oil.",equipment:"Small bowl and fork or whisk.",method:"Whisk mustard and vinegar, then add oil gradually while whisking. Taste a small safe sample and adjust.",observe:"The dressing looks thicker and may separate on standing.",problem:"Adding oil too quickly can leave large droplets.",variation:"Use citrus instead of some vinegar.",safety:"Check mustard and vinegar labels for relevant allergens."},{chapter:20,name:"A basic starch-thickened sauce",outcome:"Practise making a smooth slurry.",ingredients:"200 mL vegetable stock, 5 mL cornstarch, 15 mL cold water.",equipment:"Small saucepan, bowl and whisk.",method:"Mix cornstarch and cold water until smooth. Bring stock to a gentle simmer, whisk in the slurry and cook until thickened.",observe:"The cloudy liquid becomes thicker as starch swells.",problem:"Dry starch added directly can form lumps.",variation:"Use a tested flour-based roux or vegetable puree.",safety:"Keep the pan stable and avoid splashes."},{chapter:21,name:"A small pot of rice",outcome:"Practise the absorption method for a selected rice.",ingredients:"100 g rice and water in the quantity specified on its package.",equipment:"Small lidded saucepan and fork.",method:"Rinse if the package recommends it. Add the stated water, bring to the instructed heat, cover and cook as directed. Rest and fluff.",observe:"Grains absorb water and become tender.",problem:"A loose lid or incorrect ratio can leave grains hard or wet.",variation:"Use a different grain and follow its own instructions.",safety:"Serve promptly or cool quickly and store according to local rice guidance. [7]"},{chapter:21,name:"Grain and chickpea bowl",outcome:"Combine separately prepared components.",ingredients:"150 g cooked grain, 100 g drained canned chickpeas, 1 chopped tomato, 10 mL lemon dressing.",equipment:"Bowl, board and clean spoon.",method:"Prepare the grain according to its package. Drain chickpeas, wash and chop tomato, and combine with dressing.",observe:"Notice the contrast between soft grains, beans and juicy tomato.",problem:"Excess dressing can make the bowl watery.",variation:"Use cooked lentils or a locally available vegetable.",safety:"Use safely stored ingredients and refrigerate leftovers promptly."},{chapter:22,name:"Pan-browned tofu and greens",outcome:"Manage moisture and timing in a plant-based dish.",ingredients:"150 g firm tofu, 100 g washed greens, 10 mL oil, 5 mL soy sauce or suitable alternative.",equipment:"Pan, clean towel or paper, spatula.",method:"Drain and gently dry tofu, cut into even pieces and brown in oil. Add greens and a little sauce; cook until the greens are tender.",observe:"The tofu surface colours while the greens soften quickly.",problem:"Wet tofu may spatter and brown poorly.",variation:"Use another suitable plant protein.",safety:"Check allergen labels and add food carefully to hot oil."},{chapter:24,name:"A simple baked oat mixture",outcome:"Observe how proportions and oven heat set a mixture.",ingredients:"100 g rolled oats, 150 mL milk or suitable plant drink, 1 mashed banana, 2 mL baking powder.",equipment:"Bowl, small oven-safe dish and oven.",method:"Heat oven to about 180°C (356°F). Mix ingredients, place in the dish and bake until the centre is set. Check early because dishes and ovens differ.",observe:"The oats absorb liquid and the mixture firms.",problem:"A deep dish may cook unevenly.",variation:"Add a small amount of cinnamon if appropriate.",safety:"Use oven mitts; check ingredient labels for allergies."},{chapter:25,name:"Small basic bread dough",outcome:"Observe yeast fermentation and dough development.",ingredients:"250 g bread flour, 175 mL water, 3 g instant yeast, 4 g salt.",equipment:"Scale, bowl, tray and oven.",method:"Mix ingredients into a dough, knead until smoother, cover and allow to expand. Shape, proof until airy and bake in a preheated oven until the loaf is cooked through; cool before slicing.",observe:"The dough becomes more elastic and expands as gas is retained.",problem:"Cool conditions or inactive yeast can slow the rise.",variation:"Use a tested flatbread method if an oven is unavailable.",safety:"Do not taste raw dough; use oven mitts and safe cooling practices."}],no=`
Acid|An ingredient or substance with a sour character and a pH below neutral.
Aerate|Incorporate air into a mixture.
Al dente|Cooked until tender but still offering some bite, often used for pasta.
Alkali|A basic substance, such as baking soda, with a pH above neutral.
Amino acid|A building block of proteins; some participate in Maillard reactions.
Aroma|Smell produced by volatile compounds reaching the nose.
Aromatic|An ingredient used to build fragrance and flavour, such as onion or ginger.
Bain-marie|A water bath used to heat a container gently.
Baking|Cooking in an enclosed dry-heat environment, often to set a dough or batter.
Baking powder|A chemical leavener containing a base and acid components.
Baking soda|Sodium bicarbonate, a base that can produce gas when combined with acid.
Basting|Moistening food with liquid or fat during cooking.
Batter|A pourable or spoonable mixture, usually made with flour and liquid.
Batonnet|A relatively thick, even stick-shaped cut.
Blanch|Briefly cook in boiling water or steam, often followed by rapid cooling.
Bloom spices|Warm spices in fat to develop their aroma.
Boil|Cook in liquid with active bubbles rising and breaking at the surface.
Braise|Cook food gently in a covered vessel with a modest amount of liquid.
Breading|A coating, often made with crumbs, applied before cooking.
Broil|In North American usage, cook with strong radiant heat from above.
Broth|A flavourful liquid made by cooking ingredients in water.
Brunoise|A very small, even dice made from fine sticks.
Caramelisation|A family of browning and flavour changes caused by heating sugars.
Carryover cooking|Continued movement of heat within food after removal from the heat source.
Chiffonade|Thin ribbons made by slicing stacked or rolled leaves.
Claw grip|A guiding-hand position with fingertips curled away from a knife edge.
Coagulation|The formation of a more solid protein network, as in a cooked egg.
Conduction|Transfer of heat through direct contact or through a material.
Convection|Transfer of heat by the movement of a liquid or gas.
Core temperature|The measured temperature in the interior of a food.
Creaming|Beating fat and sugar together to incorporate air.
Cross-contact|The unintended transfer of an allergen from one food or surface to another.
Cross-contamination|The transfer of harmful microorganisms from one food or surface to another.
Crumb|The interior texture of bread or cake.
Cube|A piece cut to have roughly equal dimensions on all sides.
Cutlet|A relatively thin portion of food, often suitable for quick cooking.
Deglaze|Add liquid to a pan to loosen flavourful browned bits.
Denaturation|A change in the folded structure of a protein.
Dice|Cut food into approximately even cubes.
Direct heat|Heat applied close to or directly over or under its source.
Dough|A mixture, often of flour and liquid, firm enough to shape or work.
Drain|Remove liquid from food using a sieve, colander or other suitable tool.
Dredge|Coat food lightly with a dry ingredient such as flour.
Dry heat|A cooking approach using hot air, a hot surface, radiation or fat rather than cooking liquid.
Emulsion|A dispersion of droplets of one liquid in another liquid with which it normally separates.
Enzymatic browning|Browning caused by enzyme-driven reactions, often after cut produce meets oxygen.
Evaporation|The change of liquid into vapour, removing moisture from a surface.
Fermentation|Transformation of food by microorganisms or their enzymes under particular conditions.
Fillet|A boneless cut or portion, often of fish.
Fold|Combine mixtures gently to preserve incorporated air.
Fond|Browned material left on a pan after cooking, often used for a sauce.
Gelatinisation|Swelling and structural change of starch granules when heated with water.
Glaze|A thin coating or concentrated liquid applied to food.
Gluten|A network formed from certain wheat proteins when hydrated and worked.
Grate|Rub food against a perforated tool to make small pieces or shreds.
Grill|Cook using strong radiant heat; the direction of heat varies by regional terminology.
Honing|Realigning an existing knife edge, as distinct from sharpening.
Hydration|The addition or absorption of water.
Indirect heat|Cooking away from the strongest direct heat source.
Infuse|Transfer flavour from an ingredient into a liquid or fat over time.
Julienne|Cut into thin, matchstick-like strips.
Knead|Work dough to develop structure and distribute ingredients.
Leavening|The production or incorporation of gas that makes a mixture expand.
Marinate|Hold food in a seasoned mixture before cooking; perishables need safe temperature control.
Maillard reaction|Browning reactions involving reducing sugars and amino compounds.
Mince|Cut food into very small pieces.
Mise en place|Preparing and organising ingredients and equipment before cooking.
Moist heat|Cooking with water, steam or another liquid as the main heat medium.
Mouthfeel|The physical sensation of food in the mouth.
Oxidation|A reaction involving oxygen or electron transfer that can change food quality.
Parboil|Partly cook food in boiling liquid before another preparation.
Pasteurisation|A controlled heat treatment used to reduce specified harmful microorganisms.
Poach|Cook gently in hot liquid with little visible bubbling.
Preheat|Bring equipment toward its intended temperature before adding food.
Pressure cooker|A sealed cooking vessel that uses pressure to raise the boiling temperature of water.
Proof|Allow shaped yeasted dough to rise before baking; usage can vary.
Puree|Food blended or mashed to a smooth consistency.
Radiation|Transfer of energy by electromagnetic waves, including infrared heat.
Reduce|Simmer liquid so water evaporates and the remaining flavours concentrate.
Render|Melt and release fat from animal tissue through heat.
Rest|Allow food or dough to stand for a specified purpose after a preparation step.
Roast|Cook with dry heat, commonly in an oven, often to develop surface colour.
Roux|A cooked mixture of flour and fat used to thicken liquids.
Saute|Cook relatively small pieces in a pan with a modest amount of fat.
Scale|Change recipe quantities, or a device for measuring weight.
Score|Make shallow cuts in the surface of food or dough.
Sear|Brown the surface of food using relatively strong heat.
Season|Add ingredients to adjust flavour, or prepare certain cookware for use.
Sharpen|Remove a small amount of material to restore a knife edge.
Simmer|Cook in liquid with gentle movement and small intermittent bubbles.
Slurry|A mixture of starch and cold liquid added to a hot liquid for thickening.
Smoke point|The temperature at which a fat begins to give off visible smoke under particular conditions.
Sous vide|A method using controlled-temperature water and sealed packaging.
Steam|Cook using hot vapour, generally with food held above the water.
Stew|Cook smaller pieces gently in liquid, often in a covered pot.
Stir-fry|Cook small pieces quickly with frequent movement in a suitable hot pan.
Stock|A liquid made by simmering ingredients to extract flavour.
Tadka|A South Asian technique in which spices and aromatics are heated, often in fat.
Tenderise|Make food easier to chew through a suitable physical, chemical or cooking process.
Thermometer|A device that measures temperature; food probes must be suitable and clean.
Toast spices|Warm spices, often in a dry pan, to develop aroma.
Umami|A commonly recognised savoury basic taste.
Vinaigrette|A dressing commonly made by dispersing oil in an acidic liquid.
Water activity|A measure of water available for reactions and microbial growth, not simply total moisture.
Whisk|Beat or combine ingredients with a whisk or similar tool.
Zest|The coloured outer layer of citrus peel, used for aroma.

`).map(s=>{const[u,h]=s.split("|");return{term:u,definition:h}}).sort((s,u)=>s.term.localeCompare(u.term)),Fs=[{question:"Is cooking a science or an art?",answer:"Both. Heat and ingredients follow physical and chemical principles, while a cook uses observation, preference, tradition and creativity to choose a result."},{question:"Does a high burner setting mean a precise temperature?",answer:"No. The pan, food, burner and time determine the actual temperature. Watch the food and use a suitable thermometer when precision or safety matters."},{question:"What is the difference between boiling and simmering?",answer:"Boiling has vigorous, continuous bubbling. A simmer has gentler movement and intermittent bubbles, which can protect delicate ingredients and limit evaporation."},{question:"Is steaming always more nutritious?",answer:"No single method preserves every nutrient in every ingredient. Cutting, time, water, storage and the food itself all affect the result."},{question:"Why do mushrooms release water?",answer:"Mushrooms contain moisture that escapes as they heat. A crowded pan can trap that moisture; a spacious pan helps it evaporate and encourages browning."},{question:"Does browning mean food is safely cooked?",answer:"No. A brown exterior can surround an undercooked centre. Use a suitable food thermometer and current guidance for the specific food."},{question:"Are caramelisation and Maillard browning the same?",answer:"No. Caramelisation involves heated sugars; Maillard reactions involve reducing sugars and amino compounds. Both can contribute to flavour in one food."},{question:"Do I need an expensive knife?",answer:"No. Choose a comfortable, sharp, maintained knife and a stable board. Control and safe habits matter more than price."},{question:"Why should I curl my guiding fingertips?",answer:"The claw position keeps fingertips away from the cutting edge while the knuckles can guide the blade. Work slowly and keep the thumb protected."},{question:"Should I wash raw poultry?",answer:"No. Washing can spread raw juices and microorganisms around the kitchen. Separate it from ready-to-eat food and cook it to the applicable safe temperature."},{question:"Can I replace baking powder with equal baking soda?",answer:"Not reliably. Baking soda needs an acid to react, while baking powder includes acid components. Use a tested substitution rather than an equal swap."},{question:"Why did my sauce separate?",answer:"The emulsion may have become too hot or received oil too quickly. Some dressings naturally separate and can be whisked again; not every sauce is recoverable."},{question:"What is a slurry?",answer:"A slurry is starch mixed smoothly with cold liquid before being added to a hot mixture. It helps prevent lumps and thickens as the starch heats."},{question:"Why are my vegetables soggy?",answer:"Crowding, too much water or prolonged cooking can soften them excessively. Cut evenly, give them space and begin checking earlier."},{question:"Is one rice-to-water ratio correct for all rice?",answer:"No. Rice variety, processing, pot and cooking method all affect the water needed. Follow the specific package or a tested recipe."},{question:"Can I cook raw kidney beans only in a slow cooker?",answer:"No. Raw kidney beans contain lectins. Follow authoritative soaking and boiling guidance before slow cooking; see Chapter 21 and references [7] and [10]."},{question:"Why does bread dough rise?",answer:"Yeast produces gas during fermentation, and a sufficiently developed dough network traps some of that gas. Temperature and ingredient proportions affect the pace."},{question:"Can I taste raw bread dough?",answer:"No. Raw flour and eggs can carry harmful microorganisms. Taste only after the food has been appropriately cooked."},{question:"What does resting meat do?",answer:"Resting can affect texture and allow heat to redistribute. Some food-safety authorities also specify a required rest for particular whole cuts; follow that guidance."},{question:"Can I use a pressure cooker for canning?",answer:"Not automatically. Validated canning processes require appropriate equipment and procedures. US guidance does not recommend its processes for small pressure cookers."},{question:"Is an air fryer the same as a deep fryer?",answer:"No. An air fryer circulates hot air; deep frying immerses food in hot oil. Both can create a browned or crisp surface, but the heat medium differs."},{question:"How do I prevent uneven microwave heating?",answer:"Use a suitable container, stir or rotate where possible, allow the stated standing time, and check temperatures in several places when needed."},{question:"Can I rescue food that was stored unsafely?",answer:"Do not rely on smell, taste, acid or reheating to make it safe. Consult local guidance and discard food when safe handling cannot be established."},{question:"What should I do with a cooking-oil fire?",answer:"Never use water or carry the pan. If safe, turn off the heat and slide on a metal lid; otherwise evacuate and call emergency services, following local guidance."},{question:"Do I need an oven to learn to cook?",answer:"No. A lidded pot and suitable pan can teach many methods. The book offers planning alternatives when specialised equipment is unavailable."},{question:"Why does my recipe take longer than expected?",answer:"Ingredient size, starting temperature, equipment, altitude and heat all vary. Treat stated times as prompts to check, not guarantees."},{question:"How can I learn without wasting food?",answer:"Use small quantities, plan flexible meals and repeat one skill at a time. Never keep or reuse food beyond safe storage limits just to avoid waste."},{question:"Where are my notes stored?",answer:"Notes, bookmarks and progress are stored locally in this browser when storage is available. They are not sent to a server by this application."}],Vi=[{id:1,category:"Cooking science and heat transfer",title:"Professional Cooking: Basic Principles of Cooking a
