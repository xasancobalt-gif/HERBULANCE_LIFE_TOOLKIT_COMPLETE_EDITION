ion:"What helped you keep the food stable?",safety:"Seek supervision if needed; never race."},{title:"Pan crowding",goal:"Observe moisture management.",materials:"Mushrooms, pan, oil and spatula.",procedure:"Cook one crowded batch and one spacious batch using similar heat.",observe:"Look for liquid, colour and aroma.",question:"Which batch browned more readily?",safety:"Stay with the pan and keep oil below smoking."},{title:"Onion changes",goal:"Observe softening and browning.",materials:"One onion, pan, oil and spoon.",procedure:"Cook sliced onion over moderate heat, checking at intervals.",observe:"Notice colour, volume and aroma.",question:"What happened when moisture evaporated?",safety:"Lower heat if the onion begins to scorch."},{title:"Whole and ground spices",goal:"Compare aroma and surface area.",materials:"A whole spice and the same ground spice.",procedure:"Smell each, then gently warm a few whole seeds if equipment permits.",observe:"Compare aromas before and after warming.",question:"Why might ground spice scorch more quickly?",safety:"Keep spices away from smoke and check allergies."},{title:"Starch thickening",goal:"Observe gelatinisation.",materials:"Cornstarch, cold water, saucepan and whisk.",procedure:"Mix a little starch with cold water; whisk into warm water and heat gently.",observe:"Notice the change in flow and appearance.",question:"What did the cold-water mixing prevent?",safety:"Do not taste raw starch; handle hot liquid carefully."},{title:"A temporary emulsion",goal:"Observe dispersed oil droplets.",materials:"Mustard, vinegar, oil and fork.",procedure:"Whisk 5 mL mustard and 15 mL vinegar; slowly whisk in 30 mL oil.",observe:"Watch the consistency and any later separation.",question:"What happens when you whisk again?",safety:"Check ingredients for allergies."},{title:"Compare grains",goal:"Recognise variety-specific instructions.",materials:"Two grain packages or reliable labels.",procedure:"Read the water, rinsing and cooking instructions on each.",observe:"List the differences.",question:"Why is one universal ratio misleading?",safety:"Follow the instructions for the actual grain."},{title:"Two vegetable textures",goal:"Match a method to an ingredient.",materials:"Leafy greens and a root vegetable.",procedure:"Plan or cook each using a suitable method and order.",observe:"Compare how quickly each becomes tender.",question:"Why did their structures need different treatment?",safety:"Wash produce and use a stable board."},{title:"A simple pan sauce",goal:"Practise deglazing.",materials:"Cooked vegetables, pan and a little stock.",procedure:"Remove vegetables, lower heat, add stock carefully and loosen browned bits.",observe:"Watch colour and aroma move into the liquid.",question:"How would further reduction change it?",safety:"Never add liquid to a smoking pan."},{title:"Thermometer placement",goal:"Practise measuring the thickest part.",materials:"Clean food thermometer and thick piece of fruit.",procedure:"Insert the probe into the centre without touching the board.",observe:"Notice how placement changes the reading.",question:"Why should a probe avoid bone?",safety:"Clean the probe and use current local food guidance for real cooking."},{title:"One-pot planning",goal:"Organise a complete sequence.",materials:"Paper, pencil and a simple soup idea.",procedure:"List ingredients, preparation, cooking order and cleanup.",observe:"Identify tasks that can happen while another cooks.",question:"Which ingredient should be added last?",safety:"Plan separation and safe storage."},{title:"Choose a method",goal:"Explain a cooking decision.",materials:"A vegetable or other suitable ingredient.",procedure:"Choose a method, prepare a small portion or make a written plan.",observe:"Describe the intended and actual texture.",question:"Would another method improve or change the result?",safety:"Use appropriate equipment and do not judge safety by appearance."}],Ng=[["Meet your kitchen","Identify your workspace.","Locate a stable surface, heat source and clean-up area.",10,"What would make this space easier to use?"],["Know your tools","Select useful basics.","Choose a knife, board, pot, spoon and thermometer where needed.",10,"Which tool serves more than one purpose?"],["Clean and separate","Prevent cross-contamination.","Plan separate spaces or a cleaning sequence for raw and ready-to-eat food.",10,"Where could contamination be transferred?"],["A stable board","Practise a safe setup.","Place a damp cloth beneath a board and make a flat side on a washed vegetable.",10,"What made the ingredient stable?"],["Slice with control","Make even cuts.","Slowly slice a washed carrot or cucumber using a guiding claw.",15,"Were the pieces similar in thickness?"],["Dice and prepare","Practise a sequence of cuts.","Cut vegetable planks into sticks and then cubes.",15,"What could make the next batch more even?"],["Mise en place","Organise before heating.","Read a simple meal plan and arrange ingredients in cooking order.",15,"Which task could be completed earlier?"],["Read the bubbles","Identify heat levels.","Observe water moving from a simmer to a boil and back.",10,"How did the movement change?"],["Cook a grain","Follow variety-specific directions.","Prepare a small quantity of rice or another grain using its package.",25,"How did the grain change as it absorbed water?"],["Simmer a soup","Maintain gentle movement.","Simmer chopped vegetables in stock until tender.",25,"What happened when the heat was too high?"],["Explore steam","Cook above water.","Steam a small amount of vegetables or sketch a safe setup.",20,"How was steaming different from boiling?"],["Preheat a pan","Observe contact heat.","Warm a suitable pan as directed and cook a few vegetable slices.",15,"What sound or colour told you about the heat?"],["Give food space","Recognise crowding.","Cook vegetables in a spacious batch and compare with a crowded one.",20,"What happened to moisture in each batch?"],["Consider roasting","Understand oven airflow.","Roast even vegetable pieces or plan a spaced tray on paper.",25,"Why does space around the food matter?"],["Five tastes","Name basic tastes.","List sweet, sour, salty, bitter and umami examples you know.",10,"Which tastes do you notice in a favourite dish?"],["Taste and aroma","Notice the role of smell.","Smell a fresh herb and describe its aroma before adding it to food.",10,"How might heat change the aroma?"],["Herbs and spices","Compare seasoning forms.","Compare a whole spice with its ground form or read their labels.",10,"Which might scorch more quickly?"],["A brighter finish","Practise a small adjustment.","Add a few drops of citrus to a safe sample of cooked soup.",10,"Did the acid improve it for you?"],["Observe starch","Understand thickening.","Make a small starch slurry and whisk it into warm liquid.",15,"What changed as it heated?"],["Make a dressing","Build an emulsion.","Whisk a small mustard vinaigrette and watch it stand.",10,"What happened after a few minutes?"],["Study browning","Distinguish surface changes.","Review Maillard browning and caramelisation in Chapter 3.",10,"Why is brown colour not proof of safety?"],["Read a recipe","Find hidden steps.","Read a complete recipe and highlight preparation, cooking and rest.",10,"What would surprise you if you skipped the first read?"],["Adapt a component","Choose a reasonable substitution.","Replace one vegetable in a soup plan with an available alternative.",10,"What texture or timing might change?"],["Plan two components","Coordinate timing.","Write an order for a grain and a quick vegetable.",15,"Which should start first, and why?"],["Use the problem finder","Diagnose a quality issue.","Select a common problem and compare its possible causes.",10,"Which prevention step is most useful to you?"],["Practise a sauce","Connect food with a sauce.","Make a small starch-thickened sauce or vinaigrette.",15,"What consistency did you prefer?"],["Plan a balanced bowl","Assemble a flexible meal.","Choose a grain, vegetable, protein and optional sauce.",15,"How do the textures complement each other?"],["Cook or rehearse","Combine familiar skills.","Prepare your planned meal or write the complete sequence.",30,"Which step needed the most attention?"],["Record and adjust","Learn from the result.","Write one success and one change for next time.",10,"Which single variable would you change?"],["Your next meal","Build independence.","Plan a meal using a cooking method you can explain and safely use.",20,"Which skill will you practise again next week?"]],Os=Ng.map(([s,u,h,d,x],T)=>({day:T+1,week:T<7?1:T<14?2:T<21?3:4,title:s,goal:u,task:h,minutes:d,reflect:x})),Hs=[{name:"Rough chop",result:"Irregular but reasonably similar chunks for a rustic texture.",ingredients:"Onion, carrot, cabbage or herbs.",steps:"Make a flat side; cut into broad sections; cut across into manageable pieces.",mistake:"Pieces of very different sizes cook at different rates.",safety:"Keep the guiding fingertips curled and cut on a stable board."},{name:"Fine chop",result:"Small, fairly even pieces that distribute through a dish.",ingredients:"Onion, herbs, ginger or garlic.",steps:"Make stable slices, cut across them, then gather and carefully chop again if needed.",mistake:"Crushing tender herbs or chopping so unevenly that some pieces burn.",safety:"Keep the tip close to the board and do not place the free hand in the blade path."},{name:"Slice",result:"Flat pieces of a chosen, consistent thickness.",ingredients:"Cucumber, onion, tomato or cooked ingredients.",steps:"Trim a flat side if needed, position it down, and cut across in controlled strokes.",mistake:"Varying thickness makes some pieces soften before others.",safety:"Do not balance a round ingredient on an unstable end."},{name:"Dice",result:"Even cubes; size is chosen for the dish.",ingredients:"Carrot, potato, pepper or onion.",steps:"Cut a flat side, then planks, then sticks; turn the sticks and cut across into cubes.",mistake:"Uneven planks produce uneven cubes.",safety:"Stack only as much as you can guide securely."},{name:"Mince",result:"Very small pieces that disperse flavour quickly.",ingredients:"Garlic, ginger, herbs or shallot.",steps:"Slice, chop across, gather with the blunt spine and carefully chop finer.",mistake:"Mincing garlic far ahead can change its aroma; tiny pieces also scorch quickly.",safety:"Keep fingertips clear when gathering; never scrape with the sharp edge toward your hand."},{name:"Julienne",result:"Thin matchsticks, often about 3 mm across; dimensions vary by use.",ingredients:"Carrot, cucumber or other firm vegetables.",steps:"Cut a flat side, slice into thin planks, stack a few securely and cut into thin sticks.",mistake:"Uneven planks create sticks that cook at different rates.",safety:"Use a stable stack and slow, controlled strokes."},{name:"Batonnet",result:"Thicker rectangular sticks, often about 6 mm across.",ingredients:"Potato, carrot or squash.",steps:"Square or flatten the ingredient, cut even planks, then cut each plank into sticks.",mistake:"Leaving a curved surface against the board can make the ingredient roll.",safety:"Keep the flat side down; do not force the knife through hard produce."},{name:"Chiffonade",result:"Thin ribbons rather than cubes or sticks.",ingredients:"Basil, spinach and other suitable leaves.",steps:"Wash and dry leaves, stack a few, roll loosely and slice crosswise into ribbons.",mistake:"Squeezing or crushing leaves can bruise them.",safety:"Keep fingertips tucked while holding the loose roll."},{name:"Brunoise",result:"A fine, even dice, often roughly 3 mm on each side.",ingredients:"Carrot, celery or other firm vegetables.",steps:"Cut fine planks and julienne sticks, line up a small bundle and cut across into cubes.",mistake:"Trying to cut too much at once sacrifices consistency.",safety:"Move slowly and keep the guiding hand behind the knife edge."},{name:"Wedges",result:"Tapered segments, useful for roasting or serving.",ingredients:"Potato, tomato, onion or citrus.",steps:"Halve the ingredient, put the cut face down and cut each half into stable segments.",mistake:"Very thick wedges may cook more slowly than thin ones.",safety:"Keep each cut face against the board and protect the guiding hand."},{name:"Citrus segments",result:"Pieces of fruit freed from peel and membranes.",ingredients:"Orange, grapefruit or other citrus.",steps:"Cut a flat base, remove peel and pith on the board, then cut alongside each membrane over a bowl.",mistake:"Cutting too deeply wastes flesh or leaves bitter pith.",safety:"Work on a board with a small knife rather than cutting toward a hand-held fruit."}],Is=[{chapter:8,name:"Boiling",principle:"Food cooks immersed in actively bubbling liquid; a rolling boil is more vigorous than a gentle boil.",heat:"Moving water transfers heat by convection; heat moves inward by conduction.",equipment:"A roomy pot, heat source and suitable draining tool.",steps:"Bring enough liquid to a boil; add food carefully; stir if needed; regulate overflow; check and drain.",suitable:"Pasta, some grains and firm vegetables in many traditions.",result:"Tender food with little surface browning.",improve:"Use a large enough pot and avoid an unnecessarily violent boil.",safety:"Prevent scalds and do not treat time alone as a safety guarantee."},{chapter:8,name:"Simmering",principle:"Food cooks in gently moving liquid with small intermittent bubbles.",heat:"Convection in liquid and conduction into food.",equipment:"A pot, lid if appropriate and spoon.",steps:"Bring the liquid up to heat, reduce it to a gentle simmer, add or retain food, and check texture and liquid level.",suitable:"Broths, soups, lentils and many stews.",result:"A gentle texture and liquid that carries flavour.",improve:"Skim foam if desired and prevent the liquid from reducing away.",safety:"Different legumes and proteins have specific safety requirements."},{chapter:8,name:"Poaching",principle:"Delicate food cooks in hot liquid with little visible bubbling.",heat:"Gentle liquid convection and conduction.",equipment:"A shallow pan or saucepan and a slotted spoon.",steps:"Warm the liquid, add food without crowding, maintain gentle heat, and lift out carefully when appropriately cooked.",suitable:"Fruit, eggs and delicate fish in appropriate preparations.",result:"A moist texture with little browning.",improve:"Keep the liquid calm and use similarly sized portions.",safety:"Use the appropriate safe-temperature guidance; a quiet surface is not a measurement."},{chapter:8,name:"Blanching and parboiling",principle:"Blanching briefly exposes food to boiling water or steam; parboiling partly cooks it before another method.",heat:"Hot liquid or steam transfers heat to the surface and inward.",equipment:"Pot, strainer and, if needed, a suitable cooling bath.",steps:"Prepare even pieces, expose briefly as directed, then cool rapidly for blanching or continue the next cooking step for parboiling.",suitable:"Some vegetables before freezing, stir-frying or roasting.",result:"Partly cooked food ready for a further step.",improve:"Follow a tested ingredient-specific blanching process when preserving.",safety:"Blanching alone is not a guarantee of safe preservation."},{chapter:9,name:"Steaming above water",principle:"Steam circulates around food held above simmering water.",heat:"Steam condenses on cooler food, transferring energy; conduction heats the centre.",equipment:"Covered pot and a stable basket or rack.",steps:"Add water below the insert, bring to a simmer, space the food, cover, check and remove with suitable utensils.",suitable:"Vegetables, dumplings and suitable proteins.",result:"Moist, tender food without immersion.",improve:"Leave space for vapour and keep the water from boiling dry.",safety:"Lift the lid away from hands and face; verify safety-sensitive food."},{chapter:9,name:"Steaming in a covered vessel",principle:"A heat-safe dish of food is placed inside a covered steamer, sometimes with its own cover.",heat:"Steam heats the dish and food through contact and condensation.",equipment:"A stable steamer and manufacturer-approved heat-safe dish.",steps:"Add the specified water, secure the dish above it, cover and steam according to a suitable recipe.",suitable:"Some savoury custards, fish and other regional preparations.",result:"A gentle, moist result with juices retained in the dish.",improve:"Keep the dish level and follow recipe instructions for covering.",safety:"Use heat-safe equipment and beware of trapped steam."},{chapter:10,name:"Sauteing",principle:"Small pieces cook in a modest amount of fat in a wide pan.",heat:"Conduction from pan and hot fat.",equipment:"A frying or saute pan and a spatula.",steps:"Prepare even, dry pieces; preheat as appropriate; add fat and food; turn as needed; finish seasoning.",suitable:"Mushrooms, onions and small vegetable pieces.",result:"Tender pieces with potential surface browning.",improve:"Cook in batches and lower heat for delicate aromatics.",safety:"Stay with the pan and keep oil below smoking."},{chapter:10,name:"Stir-frying",principle:"Small pieces cook quickly with frequent movement, often in a wok or wide pan.",heat:"Hot pan and fat transfer heat by contact.",equipment:"A suitable wok or wide pan and heat-safe utensil.",steps:"Prepare all ingredients; heat the pan as suitable; add firm pieces first; move frequently; add tender ingredients and sauce later.",suitable:"Thin vegetables and properly handled proteins in many East and Southeast Asian preparations.",result:"Cooked pieces that may retain some bite.",improve:"Cut evenly and avoid overloading the pan.",safety:"Ventilate, avoid hot-oil splashes and verify protein safety."},{chapter:10,name:"Pan-frying",principle:"Food cooks with sustained contact in a moderate amount of fat, then is turned.",heat:"Conduction through pan and fat.",equipment:"A stable frying pan and turning utensil.",steps:"Dry or coat the food as appropriate; heat a suitable pan and fat; place food carefully; turn when ready; finish and drain if needed.",suitable:"Vegetable patties and suitable portions of protein.",result:"A browned or crisp surface with a cooked centre.",improve:"Use enough space and moderate heat so the exterior does not burn first.",safety:"Check temperature-sensitive food with a thermometer."},{chapter:11,name:"Shallow-frying",principle:"Food is partly immersed in hot oil and typically turned.",heat:"Hot fat and pan contact heat the surface.",equipment:"A stable, suitable pan, lid nearby and oil thermometer.",steps:"Measure oil within safe limits; heat under control; carefully add dry food in batches; turn; drain safely.",suitable:"Suitable coated vegetables and patties.",result:"A crisp surface; the centre depends on size and heat.",improve:"Avoid crowding and allow oil to recover between batches.",safety:"Never leave oil unattended or use water on an oil fire."},{chapter:11,name:"Deep-frying",principle:"Food is immersed in a controlled amount of hot oil.",heat:"Oil surrounds the food and transfers heat to the surface.",equipment:"A suitable deep fryer or stable purpose-suitable vessel and thermometer.",steps:"Follow fill limits; heat with temperature control; lower dry food carefully in small batches; lift and drain.",suitable:"Foods designed for deep-frying, including some coated foods.",result:"A crisp exterior when conditions are appropriate.",improve:"Do not overfill; monitor oil temperature continuously.",safety:"Keep water away, stay nearby, and never carry a burning pan. Evacuate if in doubt."},{chapter:12,name:"Roasting",principle:"Food cooks in an oven or similar dry-heat environment, often with the aim of developing colour.",heat:"Oven radiation and moving air; conduction from the tray.",equipment:"Oven, oven-safe tray and mitts.",steps:"Preheat as directed, cut evenly, lightly coat if desired, space on the tray, turn and check for tenderness or safe temperature.",suitable:"Roots, whole vegetables and suitable proteins.",result:"A browned surface and tender centre.",improve:"Leave room for airflow and account for your oven.",safety:"Use oven-safe equipment and a thermometer where required."},{chapter:12,name:"Baking",principle:"Enclosed heat cooks a mixture or assembled food and sets its structure.",heat:"Oven air, radiation and contact with the tin.",equipment:"Oven, suitable tin and measuring tools.",steps:"Measure carefully, prepare the tin, preheat, mix as instructed, bake and cool appropriately.",suitable:"Bread, cakes, biscuits and assembled vegetable dishes.",result:"A set interior and a surface that may brown.",improve:"Follow proportions and begin checking before the estimated time.",safety:"Do not taste raw batter; handle hot tins with dry mitts."},{chapter:13,name:"Direct grilling or broiling",principle:"Food is close to a strong radiant heat source.",heat:"Infrared radiation plus contact with the grate or pan.",equipment:"Suitable grill or overhead broiler and long tongs.",steps:"Preheat safely, place suitable food near the heat, turn as needed and move away if browning too fast.",suitable:"Thin vegetables and suitable smaller portions.",result:"Pronounced surface colour and flavour.",improve:"Watch closely and avoid excessive charring.",safety:"Use fuel-burning grills outdoors only and verify safety-sensitive food."},{chapter:13,name:"Indirect grilling",principle:"Food is placed away from the strongest heat to cook more gently.",heat:"Circulating hot air and radiation from surrounding surfaces.",equipment:"A grill that allows separate heat zones.",steps:"Create a hotter and cooler zone, start or finish food in the suitable zone, and monitor throughout.",suitable:"Thicker vegetables or larger foods that need a gentler finish.",result:"A more gradually cooked centre with less direct surface exposure.",improve:"Use the lid and zones according to the equipment instructions.",safety:"Appearance does not prove internal safety; use a thermometer where needed."},{chapter:14,name:"Braising",principle:"Larger pieces cook gently, partly surrounded by liquid, usually covered.",heat:"Pan contact followed by liquid and steam.",equipment:"Lidded pot and spoon.",steps:"Brown if desired, add aromatics and modest liquid, cover, simmer gently, check and finish the sauce.",suitable:"Firm vegetables and collagen-rich cuts.",result:"Tender food with a concentrated cooking liquid.",improve:"Avoid boiling away the liquid and add delicate ingredients later.",safety:"Use safe handling and temperature checks for animal proteins."},{chapter:14,name:"Stewing",principle:"Smaller pieces cook gently in a more generous amount of liquid.",heat:"Convection in liquid and conduction into pieces.",equipment:"A lidded pot and spoon.",steps:"Prepare even pieces, build a liquid base, add firm ingredients first, simmer and finish with delicate ingredients.",suitable:"Vegetables, thoroughly prepared legumes and suitable proteins.",result:"Tender pieces served with their cooking liquid.",improve:"Adjust liquid and thickening near the end.",safety:"Kidney beans and other ingredients need their own preparation requirements."},{chapter:14,name:"Electric slow cooking",principle:"A countertop appliance cooks in a covered pot over an extended period.",heat:"Heat from the vessel plus liquid and steam.",equipment:"A functioning slow cooker and its manual.",steps:"Thaw animal proteins, prepare ingredients, add the specified liquid, fill and select the cooking setting as directed.",suitable:"Tested slow-cooker stews and suitable braises.",result:"A tender, moist dish with less active attention.",improve:"Use the manufacturer's fill range and avoid frequent lid lifting.",safety:"Do not cook on warm or rely on a slow cooker alone for raw kidney beans."},{chapter:15,name:"Stovetop pressure cooking",principle:"A sealed vessel raises pressure and the boiling temperature of water.",heat:"Pressurised steam and liquid transfer heat to food.",equipment:"A maintained stovetop pressure cooker and its manual.",steps:"Inspect seals and vent, add specified liquid, respect fill limits, lock, heat to pressure and release as directed.",suitable:"Recipes developed for the specific cooker.",result:"Often tender food in less time than an open pot.",improve:"Account for heat-up and release time as well as pressure time.",safety:"Never block a safety device or force the lid; do not use as a substitute for validated canning."},{chapter:15,name:"Electric pressure cooking",principle:"An electric appliance controls a pressure-cooking cycle.",heat:"A heated vessel produces pressurised steam and hot liquid.",equipment:"A compatible electric pressure cooker and its manual.",steps:"Check the seal and vent, add required liquid, fill within limits, select the tested setting and release as instructed.",suitable:"Manufacturer-approved recipes and ingredients.",result:"A controlled covered cook; results differ by model.",improve:"Use the correct release method for foaming foods.",safety:"Do not open before pressure is released or use unvalidated canning processes."},{chapter:16,name:"Microwave cooking",principle:"Electromagnetic energy is absorbed unevenly by food and converted to heat.",heat:"Microwave absorption followed by conduction within food.",equipment:"Microwave-safe container and vented cover.",steps:"Arrange food evenly, cover and vent, heat, stir or rotate, stand, and check as appropriate.",suitable:"Reheating and suitable vegetable preparations.",result:"Convenient cooking without reliable surface browning.",improve:"Arrange thinner pieces toward the centre and follow standing time.",safety:"Check several locations with a thermometer when required."},{chapter:16,name:"Air frying",principle:"A compact appliance circulates hot air around food.",heat:"Forced convection, radiation and contact with the basket.",equipment:"An air fryer and manufacturer-approved basket.",steps:"Prepare even pieces, load without crowding, cook as d  the main mechanism?",choices:["Radiation","Fermentation","Gelatinisation"],answer:0,explanation:"The glowing element emits infrared radiation; the oven can also use convection and conduction."}],Ms=[{prompt:"Which cut produces thin, matchstick-like pieces?",choices:["Julienne","Dice","Chiffonade"],answer:0,explanation:"Julienne are thin sticks. Start with stable planks and cut slowly."},{prompt:"Which cut produces small cubes from evenly cut sticks?",choices:["Wedges","Dice","Chiffonade"],answer:1,explanation:"Dice are cubes; a fine brunoise is a particularly small dice."},{prompt:"Which cut makes ribbons from stacked leafy herbs?",choices:["Batonnet","Mince","Chiffonade"],answer:2,explanation:"Chiffonade makes ribbons by rolling or stacking leaves and slicing carefully."}],Ws=[{prompt:"A safely prepared lentil soup tastes a little flat. What is a thoughtful first experiment?",choices:["Add a little lemon to a small sample","Add a large amount of salt to the whole pot","Keep boiling until dry"],answer:0,explanation:"A little acid may add brightness, but preference varies. Test a small sample before changing the pot."},{prompt:"A sauce tastes too salty after reduction. What might help?",choices:["Reduce it further","Dilute with unsalted ingredients","Add more salty stock"],answer:1,explanation:"Dilution can reduce salt concentration. The exact adjustment depends on the dish."}],ji=[...io,{prompt:"True or false: a brown surface proves poultry is safely cooked.",choices:["True","False"],answer:1,explanation:"Browning is a quality cue. Check the thickest part with a thermometer against current local guidance."},{prompt:"Which statement distinguishes Maillard browning from caramelisation?",choices:["They are the same process","Maillard involves reducing sugars and amino compounds; caramelisation involves heated sugars","Both require raw egg"],answer:1,explanation:"They are different families of reactions and can occur together in the same food."},{prompt:"Your mushrooms assName:"small-note",children:[i.jsx(to,{size:14})," ",s.length," of ",Bs.length," skills marked"]})]})}const _g=[{id:1,part:1,title:"The Art and Science of Cooking",description:"Begin with the principles that make every meal possible.",minutes:8,intro:"Cooking is not a talent you either have or do not. It is a set of decisions you can learn: what to prepare, how much heat to use, when to stop, and how to notice what changes along the way.",objectives:["Recognise cooking as a combination of heat, time and judgment.","Distinguish enjoyable texture and flavour from food safety.","Observe how one ingredient changes with different methods."],sections:[{title:"What does it mean to cook?",paragraphs:["In the everyday kitchen, cooking usually means applying heat to change food. Some preparation, such as mixing a salad or fermenting dough, does not itself require heat; it is still part of the broader craft of making a meal. Heat can soften plant fibres, set proteins, swell starches, evaporate water and create new aromas. [1]","People cook for many reasons: to make some foods easier to chew, create variety, share traditions and, when done correctly, reduce particular food-safety risks. Cooking does not make every food safe in every circumstance; contamination, storage and handling matter too."]},{title:"The same carrot, three possibilities",paragraphs:["A raw carrot is crisp and fresh. Simmered in water, it softens as its structure changes and produces a gentle, sweet impression. Roasted in a little oil with space around the pieces, its surface dries and can brown, producing a deeper aroma. A steamed carrot can be tender without sitting in cooking water.","None is the single correct result. Choose the method for the dish, the equipment and the texture you want. Cut similarly sized pieces so they cook more evenly."]},{title:"Quality is not the same as safety",paragraphs:["Colour, aroma and tenderness help you judge eating quality, but they cannot reliably identify dangerous microorganisms. For foods requiring temperature control, measure the thickest part with a suitable food thermometer and consult the current guidance for that food and your location. [4, 5]","A recipe time is a starting point, not a guarantee. Pieces differ in size and starting temperature; pans, heat sources, altitude and personal preferences differ too. Begin checking early, keep observing and write down what worked in your kitchen."]}],key:"Good cooking is observation in action: adjust heat, time and technique to the ingredient in front of you.",activity:"Cut a washed carrot into similar pieces. Keep one raw and simmer the others until tender. Compare colour, aroma, resistance to a fork and flavour. What changed? Use a clean utensil for tasting.",diagram:{title:"One ingredient, three outcomes",labels:["Raw: crisp and fresh","Simmered: soft and gentle","Roasted: browned and deep"],caption:"The same carrot offers different textures and aromas when preparation and heat change."},refs:[1,4,5]},{id:2,part:1,title:"Understanding Heat and Heat Transfer",description:"Learn to read heat, not just the dial.",minutes:10,intro:"The heat setting is a request to your appliance, not a measurement of the temperature inside your food. A confident cook learns to watch how heat actually moves.",objectives:["Identify conduction, convection and radiation.","Adjust a heat source using visible, audible and measured cues.","Recognise carryover cooking and uneven heating."],sections:[{title:"Three ways energy reaches food",paragraphs:["Conduction is heat moving through direct contact: a hot pan warms a flatbread where the two touch, then heat travels into the bread. The pan itself receives energy from the burner. Convection is heat carried by moving liquid or gas: circulating water heats a vegetable in a simmering pot, while a fan moves air around an oven. [1, 2]","Radiation transfers energy as electromagnetic waves. A glowing grill, broiler or fire sends infrared radiation to the surface of food. Most cooking combines mechanisms: an oven roast receives radiation from hot surfaces, convection from air and conduction through the food itself."]},{title:"Dry heat, moist heat and intensity",paragraphs:["Dry-heat methods include roasting, grilling and pan cooking; moist-heat methods use water, steam or another liquid. Braising deliberately combines browning and moist heat. These are useful categories, not claims that a pan or a piece of food contains no moisture.","A high dial setting can scorch a thin pan; a low setting on a heavy pan can retain heat for some time. Preheat as the pan and manufacturer allow, then adjust by watching gentle bubbling, a steady sizzle, or the temperature on a suitable thermometer. Never preheat an empty non-stick pan beyond its instructions."]},{title:"Distribution, hot spots and carryover",paragraphs:["Aluminium conducts heat well; thick or layered cookware can spread heat more evenly, but shape, thickness and the burner all matter. Rotate a baking tray or move food to a cooler grill zone if one area browns too fast.","After food leaves heat, energy can continue moving from its hot surface toward its cooler centre. This is carryover cooking, especially relevant to larger pieces. It varies: do not assume an estimated rise will make an undercooked item safe. Measure and follow required rest guidance. [5]"]}],key:"A heat setting is not a food temperature. Watch the food and measure when safety requires it.",activity:"With an adult or experienced cook if needed, watch a pan of water warm. Describe the still water, then small moving bubbles, then an active boil. Turn the heat down and notice the change.",diagram:{title:"Three paths of heat",labels:["Conduction: contact","Convection: moving liquid or air","Radiation: energy waves"],caption:"A single dish often uses all three forms of heat transfer, not just one."},refs:[1,2,5]},{id:3,part:1,title:"What Happens to Food When It Cooks?",description:"Meet the transformations behind texture and flavour.",minutes:14,intro:"A cook does not need a laboratory to observe food science. A thickening sauce, a setting egg and a browned crust are all clues to changes taking place.",objectives:["Explain major transformations in plain language.","Distinguish Maillard browning from caramelisation.","Use observation to prevent texture problems."],sections:[{title:"Proteins, starches and structure",paragraphs:["Protein denaturation means that proteins change their folded shape; heat, acid or mechanical action can cause it. Coagulation is the joining of some unfolded proteins into a network, as an egg sets. Too much heat can squeeze out moisture and produce toughness. A firm appearance is a quality cue, not proof of safety. [1]","Starch gelatinisation occurs when starch granules absorb water and swell as they are heated. A flour sauce thickens and rice softens; the amount of water, starch type, acidity and heating all matter. Cooling may create a gel and later firming. Thickening is not the same as caramelisation."]},{title:"Browning, moisture and fat",paragraphs:["Maillard browning involves reactions between reducing sugars and amino compounds and creates many savoury aromas. Caramelisation is a different family of changes involving heated sugars. Both can contribute to the colour of a baked crust; a brown surface does not prove the centre is safely cooked. [1, 3]","Evaporation removes surface moisture, enabling hotter, drier conditions and often better browning. Water activity is the availability of water for chemical reactions and microbial growth, not simply how wet food looks; it is useful in preservation but cannot be judged by eye. Fats melt and some animal fat renders as heat releases it from tissue. Hot fat carries flavour but can burn."]},{title:"Other useful transformations",paragraphs:["An emulsion disperses droplets of one liquid in another that normally separates, as in vinaigrette. Gluten forms when suitable wheat proteins are hydrated and worked; a strong network helps bread hold gas, while excess mixing can toughen tender cakes. Acid can change colour, flavour, protein structure and the speed at which some vegetables soften.","Enzymatic browning occurs when cut fruit exposes enzymes and their substrates to oxygen; lemon juice can slow some browning but is not a safety treatment. Oxidation can change colour and flavour, for example in stale oil. Heating can soften plant cell walls. Fermentation uses microorganisms to transform food, as in bread dough; it is not automatically a validated preservation method."]}],key:"Name the change you want, then choose the conditions that encourage it. Different changes can happen at the same time.",activity:"Mix a small spoonful of cornstarch with cold water. Add it to gently heated water, stirring until the mixture changes from cloudy and thin to thicker. Let it cool and compare again. Do not taste uncooked starch.",diagram:{title:"A small atlas of transformation",labels:["Protein: sets","Starch: swells","Sugar + amino compounds: browning","Fat + water: emulsion"],caption:"These simplified pathways are an introduction; real foods undergo several changes at once."},refs:[1,3]},{id:4,part:2,title:"Your Kitchen and Its Equipment",description:"Choose tools for the work, not the price tag.",minutes:11,intro:"A useful kitchen can be very small. Start with tools that fit your hands, your heat source and the food you actually prepare.",objectives:["Select a practical starter set.","Understand basic cookware materials and maintenance.","Use specialised equipment only as directed."],sections:[{title:"The preparation essentials",paragraphs:["A stable board, comfortable chef or utility knife, bowl, spoon, saucepan with lid and frying pan can accomplish a surprising amount. A food thermometer is important when preparing temperature-sensitive foods. A scale helps especially with baking; measuring spoons and cups are useful for small amounts and liquids.","A paring knife, peeler, grater, sieve, whisk, spatula, tongs and ladle each solve particular problems. A fork can whisk a small dressing; a clean plate can cover a bowl when suitable. Choose food-contact-safe tools that are easy to clean and store."]},{title:"Pots, pans and materials",paragraphs:["A saucepan handles grains and sauces; a stockpot holds larger volumes. A frying pan offers wide contact; a saute pan has higher sides; a wok is useful for tossing when it fits the heat source. A tray, roasting pan and oven-safe dish are useful only if you have an oven. A steamer basket or heat-safe rack can suspend food above water.","Stainless steel is durable and often layered for even heating. Cast iron and carbon steel retain heat and may need seasoning and thorough drying. Aluminium conducts heat readily; glass and ceramic have different heating and breakage limits. Non-stick coatings need gentle utensils and manufacturer-approved heat. No material is always best; replace damaged coatings or cracked cookware and follow its instructions."]},{title:"Optional appliances",paragraphs:["Rice cookers, microwaves, ovens, grills, pressure cookers and multicookers can be useful but are not requirements for learning to cook. Check capacity, ventilation, suitable utensils and cleaning instructions before use. Never improvise a deep fryer or disable a pressure-cooker safety mechanism.","In a shared or limited-equipment kitchen, plan around one burner and a lidded pot. Cook components in sequence, use safe holding practices, and wash between raw and ready-to-eat foods. If refrigeration is unavailable, plan smaller amounts to serve promptly and follow local guidance on perishables."]}],key:"A well-maintained basic tool is more useful than a specialised tool you cannot safely use or store.",activity:"Inventory the tools you already own. Identify one item for cutting, one for mixing and one for heating. Use the equipment checklist to decide what is genuinely missing.",diagram:{title:"A practical kitchen toolkit",labels:["Prepare: board and knife","Mix: bowl and spoon","Cook: pan and lidded pot","Check: thermometer"],caption:"Start with purpose; add equipment when a real task calls for it."},refs:[4,5]},{id:5,part:2,title:"Knife Skills and Ingredient Preparation",description:"Build control and confidence, one careful cut at a time.",minutes:15,intro:"Knife skill is not a race. A stable board, a comfortable grip and deliberate movements create more consistent pieces and a safer working rhythm.",objectives:["Set up a stable, clean cutting area.","Use a controlled grip and protect the guiding hand.","Recognise common cuts and their purposes."],sections:[{title:"A safe foundation",paragraphs:["Choose a sharp, well-maintained knife that feels manageable. The blade has a tip, edge, heel and spine; the handle supports the grip. Hold the handle securely, optionally pinching the blade just ahead of the handle with thumb and index finger. Curl the guiding-hand fingertips inward in a claw and keep the thumb behind them; use the knuckles as a gentle guide.","Place a damp cloth beneath a slipping board. Make a flat side on round produce before cutting, and use small controlled strokes away from your body. Carry a knife at your side with its point down; store it protected, never hidden in a sink. Honing realigns an edge; sharpening removes material to restore it. Follow the tool instructions."]},{title:"Everyday cuts",paragraphs:["Even pieces cook more evenly; the exact dimensions below are approximate rather than rules. Wash produce under safe running water and dry it before cutting. Do not wash raw meat or poultry, because splashes can spread contamination. [4, 6]"],list:["Rough chop: cut into similar irregular chunks for soups. Stabilise first; avoid chasing pieces around the board.","Fine chop: make smaller crosswise cuts for aromatics. Keep the tip near the board and gather carefully, keeping fingers clear.","Slice: cut an ingredient into flat pieces, keeping thickness even. Use for onions or cucumbers; do not hold a round piece upright.","Dice: slice into planks, then sticks, then cubes. Use for carrots or onions; match the size to the cooking method.","Mince: chop very finely, often for garlic or ginger. Gather with the blunt spine rather than sweeping with the cutting edge.","Julienne: cut stable planks into thin matchsticks, roughly 3 mm wide. Stack only as many as you can hold securely.","Batonnet: cut planks into thicker, roughly 6 mm sticks. Useful for firm vegetables and a starting point for dice.","Brunoise: cut small, even cubes from fine sticks. Work slowly; precision is less important than control.","Chiffonade: stack tender leaves, roll loosely and slice into ribbons. Do not squeeze delicate herbs to a pulp.","Wedges: halve a stable round ingredient, place cut side down and cut into segments. Keep the knife away from the supporting hand.","Citrus segments: cut away peel and pith on a board, then cut beside each membrane over a bowl. Use a small knife and slow strokes."]},{title:"Working with difficult ingredients",paragraphs:["For a slippery squash, use a nonslip board, a knife suited to its size and a stable flat surface; if it cannot be controlled, choose a safer ingredient or ask an experienced person for help. Never try to catch a falling knife. Wipe the board and handle when wet.","Use separate clean boards and utensils for produce and raw animal products where possible. Otherwise wash and sanitise appropriately between tasks. Prepare ready-to-eat food first."]}],key:"Stability and control matter more than speed or perfect dimensions.",activity:"Practise slicing a washed cucumber or carrot on a stable board. Make a flat side first. Aim for similarly thick pieces and keep your guiding fingertips curled back.",diagram:{title:"From a stable ingredient to even cuts",labels:["Flat side down","Guiding hand: fingertips tucked","Planks to sticks","Sticks to cubes"],caption:"Create a flat surface, protect your fingertips and work deliberately."},refs:[4,6],related:"BOOK 05: THE COMPLETE FOOD SAFETY & KITCHEN HYGIENE GUIDE expands on clean tools and cross-contamination prevention."},{id:6,part:2,title:"Mise en Place and Kitchen Workflow",description:"A little preparation makes room for better judgment.",minutes:7,intro:"Mise en place is a French term commonly translated as “everything in its place.” At home it means preparing just enough to make the next steps calm and practical.",objectives:["Read a recipe before heating a pan.","Organise tasks by timing and safety.","Adapt a workflow to a small or shared kitchen."],sections:[{title:"Read, plan, prepare",paragraphs:["Read the full method, including resting, soaking and equipment instructions. Check the number of servings, ingredients, allergies and the heat source. Gather tools, wash hands, clear a work surface, and place a waste bowl or compost container within reach.","Measure baking ingredients carefully by weight when the recipe provides it. For flexible cooking, group ingredients by when they enter the pan rather than filling many tiny bowls. Label or separate raw animal products and ready-to-eat food."]},{title:"A realistic sequence",paragraphs:["For breakfast, wash fruit and set the table before heating a pan. For one-pot soup, chop vegetables before warming the pot, then add firm ingredients before delicate leaves. For a multi-component dinner, start the longest safe task first and finish quick greens near serving.","For baking, weigh ingredients, prepare the tin and preheat the oven before mixing a leavened batter. Clean as you work, but never leave hot oil unattended. In a shared kitchen, agree on space, avoid allergen cross-contact and put clean equipment away promptly."]},{title:"Time and waste",paragraphs:["A written sequence can be as short as “wash, cut, heat, finish.” Account for active work and unattended time separately. If a step takes longer than expected, reduce the heat or pause safely rather than rushing a knife.","Save suitable clean trimmings only when they are appropriate to use and can be stored safely. Do not keep perishables without safe temperature control. Local guidance and the needs of your household take priority."]}],key:"Preparation is a way to make decisions before heat and time begin to compete for your attention.",activity:"Plan a one-pot meal on paper: list ingredients, equipment, preparation, cooking order and cleanup. Check each task in the workflow builder as you go.",diagram:{title:"A calmer kitchen workflow",labels:["Read","Gather and prepare","Cook in order","Serve and clean"],caption:"The sequence is flexible, but reading the complete method comes first."},refs:[4]},{id:7,part:2,title:"Ingredient Selection, Preparation and Storage",description:"Start with good ingredients and handle them thoughtfully.",minutes:11,intro:"Preparation depends on the ingredient. A leafy herb, a dried bean and a raw fish fillet need different treatment, even when they end up in the same meal.",objectives:["Choose preparation methods that suit the ingredient.","Separate raw and ready-to-eat food.","Plan safe storage for your circumstances."],sections:[{title:"Plants, grains and pantry ingredients",paragraphs:["Choose produce that is sound and appropriate for its use; imperfect shapes can still be excellent. Rinse fresh produce under safe running water just before use, including skins you plan to cut through. Use a clean brush for firm produce. Do not use soap or detergent on food. Dry leaves and mushrooms when surface moisture would interfere with browning. [6]","Trim only what is needed. Rinse rice or quinoa when the variety or recipe benefits from it; follow the package. Sort dried beans for debris, soak when appropriate and cook thoroughly. Herbs bruise easily; whole spices can be toasted briefly, while ground spices burn more quickly. Store nuts, seeds, grains and spices according to their packaging and local conditions."]},{title:"Perishable and protein foods",paragraphs:["Keep raw meat, poultry, seafood and their juices separate from foods that will not be cooked. Do not wash raw meat or poultry. Wash hands, utensils and work surfaces after handling; prevent allergen cross-contact as well as microbial cross-contamination. [4]","Thaw perishable foods in the refrigerator, in cold water using a leakproof package, or in the microwave; cook immediately after cold-water or microwave thawing. Marinate in the refrigerator. Handle eggs, dairy, tofu and other plant proteins according to their labels and applicable local guidance. [4]"]},{title:"Storage without assumptions",paragraphs:["Use safe water and clean containers. Refrigerate perishable food promptly where refrigeration is available. If it is not, choose shelf-stable ingredients, prepare manageable quantities and serve promptly; a cool-looking room is not reliable refrigeration.","Quality cannot be assessed by smell alone. When the safe history of perishable food is unknown, do not try to taste it into safety. Follow the current guidance of your local food authority."]}],key:"Clean, separate, cook and chill are connected steps; none replaces the others.",activity:"Choose three ingredients for a meal. Write one preparation step and one storage or separation precaution for each.",diagram:{title:"A thoughtful preparation sequence",labels:["Select sound food","Wash produce and dry","Keep raw foods separate","Store or cook promptly"],caption:"Preparation needs differ by ingredient; raw meat and poultry should not be washed."},refs:[4,6,7],related:"BOOK 04 explains shopping and labels; BOOK 05 goes further into safe handling and storage."},{id:8,part:3,title:"Boiling, Simmering and Poaching",description:"Control the movement of liquid for the texture you want.",minutes:10,intro:"A pot of water can be energetic or almost still. The difference matters: vigorous movement that suits pasta may tear a delicate piece of fish.",objectives:["Distinguish boiling, simmering and poaching.","Choose a liquid and movement level for the food.","Understand blanching and parboiling."],sections:[{title:"What the liquid tells you",paragraphs:["A rolling boil has vigorous bubbles breaking continuously; a gentle boil is active but less forceful. A simmer shows smaller, intermittent bubbles and gentle movement. Poaching uses hot liquid with very little visible bubbling. Exact temperatures vary with altitude, the liquid and the equipment; bubbles are practical cues, not precision measurements.","Heat moves through the liquid by convection and into food by conduction. Pasta and some grains tolerate a boil; stocks and legumes often benefit from a gentle simmer; delicate fruit or fish may hold its shape better when poached. Follow ingredient-specific safety guidance."]},{title:"A useful method",paragraphs:["Choose a pot large enough to prevent overflow. Add enough suitable liquid, bring it to the desired movement, add evenly sized prepared food and adjust the heat. Stir where sticking is likely. Begin checking texture before the recipe estimate and drain, lift out or serve in the cooking liquid as appropriate.","Blanching is a brief exposure to boiling water or steam, often followed by rapid cooling to stop cooking. Parboiling partially cooks an ingredient before another method, such as roasting. Neither automatically makes food shelf-stable. Follow tested preservation instructions if preparing food for storage."]},{title:"What can go wrong?",paragraphs:["A hard boil can break delicate food, cloud a stock or evaporate too much liquid. Too little heat can make a starchy ingredient cook unevenly. Choose a larger pot for foam-prone foods, adjust the heat and use a lid carefully to avoid boil-overs.","Lift lids away from your face and drain into a stable colander. Times are only estimates; beans, grains and other ingredients vary. Never use a tasting test to decide whether potentially unsafe food is safe."]}],key:"Choose the movement of the liquid for the structure of the ingredient.",activity:"Heat a pot of water and observe the change from a gentle simmer to a rolling boil. Lower the heat again. Describe the bubbles and movement at each stage.",diagram:{title:"Reading the surface of the water",labels:["Poach: little movement","Simmer: gentle bubbles","Boil: vigorous bubbles"],caption:"Bubble patterns are useful cues; liquid temperature also varies with conditions."},refs:[1,4]},{id:9,part:3,title:"Steaming",description:"Let circulating steam gently cook without immersion.",minutes:7,intro:"Steaming surrounds food with hot vapour instead of submerging it. It can be gentle and practical, but it is not automatically quicker or more nutritious than every other method.",objectives:["Set up a safe steaming arrangement.","Allow space for steam circulation.","Avoid burns and recognise texture changes."],sections:[{title:"How steaming works",paragraphs:["Steam transfers energy as it contacts and condenses on cooler food. A basket, perforated insert or suitable rack holds food above simmering water under a lid. Some dishes use a covered vessel inside a larger steamer; follow a tested method and use heat-safe equipment.","Vegetables, dumplings, fish and certain grains can be steamed in different traditions. Cut pieces evenly, avoid packing the basket tightly and leave room for steam to circulate. Delicate foods may need a shallow layer."]},{title:"The process",paragraphs:["Add water below the basket, bring it to a simmer, arrange the food, cover and begin checking at an appropriate interval. Add hot water carefully if needed so the pot does not boil dry. Remove food with heat-safe utensils and set the lid down safely.","Texture depends on size, variety and the amount of food. A fork can judge vegetable tenderness, while safety-sensitive foods need the correct internal-temperature check. Nutrient changes vary with ingredient, cutting, water, time and storage."]},{title:"Avoiding common mistakes",paragraphs:["Crowding blocks steam and can produce uneven cooking; very large pieces may remain firm in the middle. A lid that does not fit can let heat escape, and a pot that boils dry can damage cookware.","Steam burns rapidly. Open the lid away from your face and hands, and keep children clear of the rising vapour. An improvised insert must be stable, food-safe and suitable for heat."]}],key:"The food should sit above the water with room for steam to circulate.",activity:"Steam similar-sized carrot or broccoli pieces in a suitable basket. Check one piece at intervals with a fork and record the texture you prefer.",diagram:{title:"A simple steaming setup",labels:["Lid contains steam","Food rests above water","Steam circulates upward","Water simmers below"],caption:"Keep the water below the food and lift the lid away from your face."},refs:[1,4]},{id:10,part:3,title:"Sauteing, Stir-Frying and Pan-Frying",description:"Use a pan, a little fat and attentive heat.",minutes:10,intro:"Pan cooking is a conversation between food and a hot surface. Listen to the sizzle, look for moisture and adjust before the pan gets too hot.",objectives:["Distinguish three related pan methods.","Manage moisture, crowding and heat.","Adapt the technique to firm and delicate foods."],sections:[{title:"Three useful approaches",paragraphs:["Sauteing cooks relatively small pieces in a modest amount of fat, often moving them as needed. Stir-frying uses high heat and frequent movement, often in a wok or suitable wide pan; different regional traditions use distinct ingredients and sequences. Pan-frying generally gives larger or coated pieces more sustained surface contact in a moderate amount of fat.","All use contact with the pan, with hot fat helping transfer heat. Select a pan that fits the burner, preheat according to its material, add a suitable oil and then the prepared food. Smoke point is one consideration alongside flavour, stability, ventilation and manufacturer limits; avoid overheating any fat."]},{title:"A step-by-step rhythm",paragraphs:["Cut food evenly and dry wet surfaces. Have ingredients ready because a stir-fry moves quickly. Add firmer vegetables first and tender leaves later. Leave room around mushrooms if browning is the goal; cook in batches when needed. Turn or stir according to the food, not continuously by habit.","Lower the heat if garlic or spices darken too quickly. Let a delicate protein release naturally before turning and verify its safety as required. Add a little liquid at the end if you want a brief steam or sauce."]},{title:"Moisture and safety",paragraphs:["A crowded pan traps moisture and cools the cooking surface, often producing soft, pale food rather than a browned result. A little more time may allow water to evaporate, but an overloaded pan is best divided into batches.","Ventilate and keep handles turned safely inward. Add food carefully to hot oil, stay with the pan and never add water to a cooking-oil fire. [8]"]}],key:"Space, dry surfaces and appropriate heat make browning more likely; browning alone does not establish safety.",activity:"Cook washed, dried sliced mushrooms in two small batches. Compare a crowded pan with a spacious one, keeping the heat similar. Record the moisture and colour.",diagram:{title:"Three ways to use a pan",labels:["Saute: small pieces, move as needed","Stir-fry: quick, frequent movement","Pan-fry: sustained surface contact"],caption:"The techniques overlap, but differ in movement, food size and pan contact."},refs:[1,3,8]},{id:11,part:3,title:"Shallow-Frying and Deep-Frying",description:"Understand hot oil before you use it.",minutes:10,intro:"Frying can create a crisp surface, but hot oil can cause severe burns and fires. If suitable equipment or safe temperature control is unavailable, choose another method.",objectives:["Distinguish shallow and deep frying.","Explain the role of temperature and dry surfaces.","Respond cautiously to a cooking-oil fire."],sections:[{title:"How the methods differ",paragraphs:["In shallow-frying, oil reaches partway up the food and the pieces are usually turned. In deep-frying, food is immersed in oil in a suitable fryer or deep, stable, heavy vessel. Pan-frying overlaps with shallow-frying but often uses less fat. Hot oil transfers heat; water in the food turns to steam and a coating or surface can become crisp.","Use an appropriate thermometer or appliance control, a stable vessel and the manufacturer's fill limits. Leave substantial room for displacement and bubbling. Dry the food carefully, lower it away from you in small batches and never overfill the pan. A coating can protect food and provide texture, but does not guarantee a safe centre. [8, 9]"]},{title:"Managing the cook",paragraphs:["Oil that is too cool may produce a greasy, pale result; oil that is too hot can burn the outside before the centre is properly cooked. Food size, temperature and batch size all matter. Drain on a suitable rack or absorbent paper and verify the internal temperature of safety-sensitive food.","Never leave hot oil unattended. Keep water away from hot oil and avoid wet utensils. Turn off the heat and allow oil to cool completely before moving, straining or disposing of it according to local rules. Filtering does not make used oil safe indefinitely."]},{title:"If oil catches fire",paragraphs:["Never pour water on a grease or cooking-oil fire and never carry a burning pan. If it is small and you can do so safely with a clear exit, turn off the heat and slide a suitable metal lid over the pan; leave it covered until cool. Follow local fire-service guidance. If in doubt, evacuate, close the door if possible and call emergency services. [9]","Use only an appropriate fire extinguisher if you know how and it is safe to do so. Protect yourself first; do not attempt a rescue that puts you at risk."]}],key:"Stay with the pan. Water and burning oil must never meet.",activity:"Without heating oil, identify a suitable stable pan, its lid, a thermometer and a clear route out of the kitchen. Explain why each matters.",diagram:{title:"The level of the cooking fat",labels:["Shallow: food partly immersed","Deep: food surrounded by oil","Both: leave room and monitor"],caption:"Use only appropriate equipment and follow its fill and temperature instructions."},refs:[8,9]}],$g=[{id:12,part:3,title:"Roasting and Baking",description:"Use the enclosed heat of an oven with intention.",minutes:10,intro:"An oven creates a shared environment of hot air, radiant heat and hot surfaces. Understanding that environment makes vegetables, bread and cakes more predictable.",objectives:["Explain roasting and baking as related oven methods.","Manage the tray, rack and airflow.","Assess quality and safety separately."],sections:[{title:"Two names, related heat",paragraphs:["Roasting commonly describes vegetables or proteins cooked with dry oven heat to develop colour and flavour. Baking commonly describes breads, cakes, pastries and assembled dishes in which structure sets as they cook. Terminology varies across cuisines, and the methods overlap.","Preheat when the recipe calls for it. Choose oven-safe cookware and place it on a rack that allows air to circulate. A crowded tray traps moisture; a dark tray can brown the underside more quickly than a pale one. A fan-assisted or convection oven moves air, so follow your appliance and recipe guidance rather than assuming a universal conversion."]},{title:"A practical sequence",paragraphs:["For root vegetables, wash, cut evenly, dry, coat lightly with suitable oil and spread on a tray. Turn when the undersides have developed colour. For a cake, measure carefully, prepare the tin, mix as directed and avoid disturbing the batter unnecessarily while its structure sets.","An oven thermometer can help reveal differences between the dial and the oven. Rack height, tray thickness, load and door opening also influence results. Start checking before the suggested time. Use texture cues for quality and a food thermometer when the ingredient requires one. [5]"]},{title:"Resting and alternatives",paragraphs:["Resting lets some foods finish setting and makes hot food easier to handle; follow the safety authority's required rest time where relevant. Cool baked goods as the recipe directs. Use dry oven mitts and keep flammable material clear.","No oven? Explore covered stovetop preparations, a suitable lidded pan or a community oven with a tested method. A stovetop substitute will behave differently; do not assume the same temperature or cooking time."]}],key:"Space and airflow support browning; accurate proportions support the structure of baked goods.",activity:"If you have an oven, compare a crowded and a spacious tray of similar vegetable pieces. Otherwise sketch the layout you would use and explain why.",diagram:{title:"Inside an oven",labels:["Radiant heat from walls","Air circulates around food","Rack position changes exposure","Tray conducts heat to base"],caption:"Ovens combine several heat-transfer mechanisms; each oven behaves a little differently."},refs:[1,5]},{id:13,part:3,title:"Grilling and Broiling",description:"Work with direct radiant heat and cooler zones.",minutes:8,intro:"A grill can create appealing surface flavour quickly. The skill is knowing when food needs direct heat and when it needs a gentler place to finish.",objectives:["Create direct and indirect heat zones.","Manage flare-ups and avoid excessive charring.","Use outdoor cooking equipment safely."],sections:[{title:"Heat from above or below",paragraphs:["Grilling often means heat from below; in some countries “grill” also means the overhead element called a broiler in North America. Gas, charcoal and electric equipment behave differently. Read the instructions and preheat safely.","A direct zone places food over the heat for surface colour. An indirect zone is away from the strongest heat and allows thicker food to cook more gently. Heat also travels by contact through the grate and by moving air."]},{title:"The process",paragraphs:["Clean and preheat the grate as directed. Prepare even pieces and use long, heat-safe tongs. Start over the appropriate zone, turn as needed and move food away from excessive flames. Rest where the recipe or food-safety guidance requires it.","Use separate plates and utensils for raw and cooked foods. A dark exterior or attractive grill marks cannot prove safety in the centre; use a food thermometer for foods requiring it. [5]"]},{title:"Fire and ventilation",paragraphs:["Avoid excessive charring and manage dripping fat and flare-ups by moving food to a cooler area. Keep a clear zone around the equipment and follow local fire rules.","Use charcoal and fuel-burning outdoor grills outdoors only, never inside a home, garage, tent or enclosed shelter: carbon monoxide can accumulate. Never leave a lit grill unattended."]}],key:"A browned surface is flavour information, not a food-safety measurement.",activity:"Draw a grill with a hot zone and a cooler zone. Explain where you would begin a thick vegetable wedge and where you would move it if the surface browned too quickly.",diagram:{title:"Two zones, more control",labels:["Direct zone: surface colour","Indirect zone: gentler finish","Thermometer: verify when needed"],caption:"The arrangement of heat sources differs by grill; consult the equipment instructions."},refs:[5,9]},{id:14,part:3,title:"Braising, Stewing and Slow Cooking",description:"Combine time, moisture and gentle heat.",minutes:9,intro:"A covered pot turns a small amount of liquid and patient heat into tender food and a flavourful cooking medium.",objectives:["Distinguish a braise from a stew.","Select ingredients suited to longer cooking.","Use a slow cooker according to its safety instructions."],sections:[{title:"Braise or stew?",paragraphs:["Braising usually cooks larger pieces partly surrounded by liquid in a covered pot, often after browning. Stewing typically uses smaller pieces in more liquid. Both combine conduction and convection and can be made with beans, firm vegetables or animal proteins.","Long gentle cooking can soften collagen-rich cuts as connective tissue changes; firm vegetables may also become tender. Delicate greens or fish can fall apart and often belong near the end. Browning first adds flavour but is optional for some preparations."]},{title:"Build a braise",paragraphs:["Prepare even pieces. If desired, brown them in batches, then soften aromatics in the pot. Add a modest quantity of stock or water and scrape up flavourful browned bits. Return the ingredients, cover and maintain a gentle simmer until the desired texture is reached.","Check the liquid level and adjust if the pot is drying out. Finish by reducing the cooking liquid, adding herbs or a small amount of acid, or thickening with a suitable slurry. Use a clean spoon to taste."]},{title:"Slow-cooker considerations",paragraphs:["Follow the appliance instructions for fill, liquid, setting and timing. Thaw meat before adding it; do not use the warm setting to cook. Use a thermometer for foods requiring one, and cool leftovers promptly in shallow containers rather than in the slow cooker. [10]","Raw dried kidney beans require special preparation before slow cooking. Follow authoritative bean-specific guidance; never rely on a slow cooker alone to destroy their lectins. [7, 10]"]}],key:"Gentle heat and time can change texture, but long cooking is not a substitute for safe handling.",activity:"Plan a vegetable braise using a firm vegetable, an aromatic and a liquid. Decide which delicate ingredient, if any, should be added near the end.",diagram:{title:"Four stages of a braise",labels:["Brown if desired","Add aromatics and liquid","Cover and simmer gently","Finish and adjust"],caption:"The liquid need not completely cover the food in a braise."},refs:[1,7,10]},{id:15,part:3,title:"Pressure Cooking",description:"Understand pressure, liquid and a safe release.",minutes:8,intro:"A pressure cooker raises the boiling temperature of water in a sealed, controlled vessel. It can change the cooking time and texture of foods, but it must be used exactly as designed.",objectives:["Explain why pressure changes cooking conditions.","Identify the lid, seal, valve and indicator.","Distinguish pressure cooking from validated pressure canning."],sections:[{title:"The principle and equipment",paragraphs:["As steam builds in a sealed cooker, pressure increases and water can boil at a higher temperature than in an open pot. Stovetop and electric cookers control pressure differently. Read the specific manual for your model before you begin.","Inspect the lid, sealing ring, valve, vent and pressure indicator for cleanliness and damage. Add at least the manufacturer's required liquid. Respect maximum fill lines and lower limits for foaming or expanding ingredients such as grains and beans."]},{title:"A safe sequence",paragraphs:["Prepare ingredients according to a tested recipe. Add the specified liquid, close and lock the lid, and heat using the manufacturer's settings. Allow the cooker to reach and maintain pressure as directed. Timing begins at the point specified by the recipe or appliance.","Natural release allows pressure to fall on its own. Controlled quick release vents steam according to the manufacturer's directions; it may not be suitable for foaming foods. Keep hands and face away from the vent. Open only after the indicator and instructions confirm it is safe. Never defeat a lock or force the lid."]},{title:"Not pressure canning",paragraphs:["A pressure cooker or electric multicooker is not automatically suitable for pressure canning. Safe preservation requires a validated process, appropriate canner, filling, venting and altitude adjustments. The US National Center for Home Food Preservation does not recommend its canning processes for small pressure cookers. [11]","If you do not have the right appliance or instructions, use an ordinary pot and allow more time rather than inventing a pressure method."]}],key:"The manufacturer's manual controls filling, liquid, release and maintenance; never force a pressurised lid.",activity:"Find the fill line, sealing ring, vent and pressure indicator in a pressure-cooker manual. If you do not own one, identify the parts in the diagram and explain their purpose.",diagram:{title:"Pressure-cooker safety points",labels:["Lid and seal","Clear vent and valve","Pressure indicator","Liquid and fill limit"],caption:"Component placement varies by model. Follow the actual manufacturer's instructions."},refs:[10,11]},{id:16,part:3,title:"Microwave Cooking and Modern Methods",description:"Use convenient appliances without losing control.",minutes:8,intro:"Modern equipment can save effort, but every appliance has its own heat pattern, material limits and safety instructions.",objectives:["Explain uneven microwave heating and standing time.","Use microwave-safe containers and covers.","Recognise the limits of air frying, induction and sous vide."],sections:[{title:"Microwave basics",paragraphs:["Microwaves are electromagnetic waves absorbed unevenly by food; energy causes molecules, particularly water, to interact and heat. They do not simply cook from the inside out. Food shape, quantity and composition affect hot and cold spots.","Use a container labelled microwave-safe and a suitable vented cover. Follow the appliance instructions for metals and other materials. Stir and rotate when possible, allow the stated standing time, then check temperature in several places for foods where safety requires it. [4]"]},{title:"Defrosting and reheating",paragraphs:["Microwave-thawed perishable food should be cooked immediately because some areas may begin to warm while others remain frozen. Reheat using local food-safety guidance; the US recommendation for leftovers is 74°C (165°F), checked with a thermometer. [4, 5]","Open covers away from your face. Avoid sealed containers that can build pressure and be cautious with superheated liquids. A microwave can steam food with a small amount of water in suitable covered, vented equipment."]},{title:"Other modern methods",paragraphs:["Induction generates heat in compatible cookware using an electromagnetic field; check that your pan works on the hob. Air fryers circulate hot air in a compact chamber: they can brown food, but are not literally deep-frying. Multicookers combine functions and need function-specific instructions.","Sous vide is an advanced method using controlled water temperature and sealed packaging. Safety depends on validated time-temperature combinations, suitable equipment, handling and cooling. Do not improvise low-temperature or long-hold animal-protein methods."]}],key:"Appliance settings and elapsed time do not eliminate the need to check unevenly heated food.",activity:"On a cold plate, arrange pieces of food in a ring with thinner parts toward the centre. Explain how stirring, rotating and standing time can improve even heating.",diagram:{title:"Microwave heating is uneven",labels:["Arrange evenly","Cover and vent","Stir or rotate","Stand, then check"],caption:"Standing time lets heat redistribute; use a thermometer where food safety requires it."},refs:[4,5]},{id:17,part:4,title:"Understanding Flavour",description:"Taste thoughtfully and adjust with purpose.",minutes:8,intro:"Flavour is more than salt. It is the combined experience of taste, aroma, texture, temperature and expectation.",objectives:["Identify the five commonly recognised basic tastes.","Distinguish aroma from taste.","Make small, thoughtful adjustments."],sections:[{title:"Taste and aroma",paragraphs:["The five commonly recognised basic tastes are sweet, sour, salty, bitter and umami. Aroma comes from volatile compounds sensed by smell; a blocked nose can make food seem less flavourful even when basic tastes remain.","Fat contributes texture and carries some aroma compounds. Temperature, crispness, creaminess and visual appearance also affect perception. What tastes balanced is personal and culturally shaped, not a universal formula."]},{title:"A practical way to adjust",paragraphs:["Taste with a clean spoon when food is safe to taste. First identify what is missing: brightness, depth, aroma, contrast or texture. Try a few drops of citrus in a small sample of a flat lentil soup, or fresh herbs in a mild vegetable dish, before changing the whole pot.","A bitter sauce may be improved by dilution or a complementary sweet ingredient, but burnt flavours can be difficult to remove. Umami-rich ingredients include mushrooms, tomatoes and fermented products; check labels for allergens and dietary needs. Do not automatically add more salt, sugar or fat."]},{title:"Layering and restraint",paragraphs:["Season in small stages, allowing ingredients to cook together, and taste again near the end. Toasted spices, fresh aromatics, sour fruit or a crunchy garnish can add interest without all performing the same role.","Examples include lemon with Mediterranean beans, lime and herbs with a Southeast Asian-inspired salad, and tomatoes with a West African-inspired stew. These are individual possibilities, not descriptions of entire cuisines."]}],key:"Make a small change, taste a safe sample, and decide whether it improved the dish.",activity:"Divide a small amount of cooked, safe soup between two bowls. Add a few drops of lemon to one and compare aroma and flavour. Which do you prefer, and why?",diagram:{title:"Flavour is a combination",labels:["Taste: five basic qualities","Aroma: sensed by smell","Texture and temperature","Personal and cultural preference"],caption:"Flavour balance is a useful way to think, not a fixed recipe."},refs:[1]},{id:18,part:4,title:"Herbs, Spices, Seasoning and Aromatics",description:"Build layers of aroma across many traditions.",minutes:8,intro:"Herbs, spices and aromatics are small ingredients with a large influence. Timing, freshness and the cooking medium shape what they contribute.",objectives:["Distinguish fresh herbs, dried herbs and spices.","Toast, bloom and infuse carefully.","Recognise regional flavour foundations without generalising."],sections:[{title:"Fresh, dried, whole and ground",paragraphs:["Fresh herbs often add a bright finishing note; sturdy herbs may tolerate longer cooking. Dried herbs are concentrated differently and need time to hydrate. Whole spices keep their character longer than ground spices in many storage conditions, but freshness varies; store them sealed away from heat, moisture and light.","Gently toasting whole spices in a dry pan can release aroma. Blooming means warming spices in a small amount of fat; ground spices need particular attention because they can scorch quickly. Infusion draws flavour into a liquid or fat over time."]},{title:"Aromatics and cultural context",paragraphs:["Onion, garlic, ginger, chilli, celery and other aromatics provide different foundations. A South Asian tadka may bloom spices in fat; a French mirepoix often uses onion, carrot and celery; a Thai curry paste may include lemongrass and other aromatics. Each example belongs to particular practices, with many regional and household variations.","Add ingredients in an order suited to their heat tolerance: soften onions, then briefly cook minced garlic or ground spices. A scorched spice can taste bitter. Ventilate, keep the pan at a manageable heat and do not leave hot fat unattended."]},{title:"Season with curiosity",paragraphs:["Start with a small amount, taste once the food is safe, and record what you like. Use a clean spoon each time. If a spice is unfamiliar, smell it and try it in a small portion rather than committing a whole meal.","Check packaged blends for allergens and salt; respect dietary and religious requirements. There is no single “authentic” seasoning for a continent or population."]}],key:"The same spice can taste different when added whole, ground, toasted or at the end.",activity:"Smell a whole spice and a small amount of the same ground spice. If appropriate equipment is available, gently warm a few seeds and compare their aroma after cooling.",diagram:{title:"Ways to release aroma",labels:["Whole: toast gently","Ground: bloom briefly","Herbs: add at the right stage","Liquid: infuse"],caption:"Heat and timing affect aroma; ground spices can burn quickly."},refs:[1],related:"BOOK 03: WORLD OF HERBS & SPICES explores ingredients, botanical context and culinary traditions in greater depth."},{id:19,part:4,title:"Fats, Oils, Acids and Liquids",description:"Choose the medium that helps the food do its work.",minutes:8,intro:"Fat, acid and liquid are not merely additions. They carry heat, create texture, move flavour and change how ingredients interact.",objectives:["Choose a suitable fat for the task.","Use acid and liquid to adjust flavour and texture.","Understand deglazing and reduction."],sections:[{title:"Fats and oils",paragraphs:["Oils, butter and other fats conduct heat between a pan and food and help carry some flavour compounds. Choose based on flavour, cooking conditions, availability, allergies and manufacturer guidance. Smoke point is useful but not the sole measure of suitability or stability.","Butter contains water and milk solids as well as fat; its solids can brown and then burn. Use a moderate heat and watch closely. Never leave hot oil unattended and do not use visibly deteriorated oil."]},{title:"Acid and liquid",paragraphs:["Vinegar, citrus and other acidic ingredients can brighten flavour and change colour or texture. Acid affects proteins and plant structure in different ways; adding tomato early to some beans can slow softening. Acid does not reliably make raw food safe.","Water is a neutral cooking medium; stock or broth adds savoury flavour; dairy or plant-based liquids can add body. Check labels and handle perishable liquids safely."]},{title:"Deglazing and reduction",paragraphs:["After sauteing, remove food if necessary, lower the heat and add a suitable liquid carefully to loosen browned bits from the pa
