 legs syndrome.",region:"International",linkType:"Verified record"},{id:"PATIL-2019",author:"Patil SP, Ayappa IA, Caples SM, Kimoff RJ, Patel SR, Harrod CG (American Academy of Sleep Medicine)",title:"Treatment of adult obstructive sleep apnea with positive airway pressure: An American Academy of Sleep Medicine clinical practice guideline",date:"2019",venue:"Journal of Clinical Sleep Medicine, 15(2):335–343",url:"https://doi.org/10.5664/jcsm.7640",access:Se,category:"Clinical guideline",relevance:"Recommendations for positive airway pressure therapy in adults with obstructive sleep apnoea.",region:"International (United States-based professional body)",linkType:"Verified record"},{id:"QASEEM-2016",author:"Qaseem A, Kansagara D, Forciea MA, Cooke M, Denberg TD (Clinical Guidelines Committee, American College of Physicians)",title:"Management of Chronic Insomnia Disorder in Adults: A Clinical Practice Guideline From the American College of Physicians",date:"2016",venue:"Annals of Internal Medicine, 165(2):125–133",url:"https://doi.org/10.7326/M15-2175",access:Se,category:"Clinical guideline",relevance:"CBT-I recommended as initial treatment for chronic insomnia disorder in adults; medicine discussion as second step.",region:"United States (international relevance)",linkType:"Verified record"},{id:"DIEKELMANN-2010",author:"Diekelmann S, Born J",title:"The memory function of sleep",date:"2010",venue:"Nature Reviews Neuroscience, 11(2):114–126",url:"https://doi.org/10.1038/nrn2762",access:Se,category:"Peer-reviewed research",relevance:"Review of sleep’s role in memory consolidation, including the roles of slow-wave sleep and REM sleep.",region:"International (Germany and international research)",linkType:"Verified record"},{id:"CHANG-2015",author:"Chang AM, Aeschbach D, Duffy JF, Czeisler CA",title:"Evening use of light-emitting eReaders negatively affects sleep, circadian timing, and next-morning alertness",date:"2015",venue:"Proceedings of the National Academy of Sciences, 112(4):1232–1237",url:"https://doi.org/10.1073/pnas.1418490112",access:Se,category:"Peer-reviewed research",relevance:"Laboratory study comparing evening reading on a light-emitting eReader with reading a printed book; effects on timing, sleep and alertness.",region:"United States (laboratory study in healthy young adults)",linkType:"Verified record"},{id:"BRAINARD-2001",author:"Brainard GC, Hanifin JR, Greeson JM, et al.",title:"Action spectrum for melatonin regulation in humans: Evidence for a novel circadian photoreceptor",date:"2001",venue:"Journal of Neuroscience, 21(16):6405–6412",url:"https://doi.org/10.1523/jneurosci.21-16-06405.2001",access:Se,category:"Peer-reviewed research",relevance:"Human action spectrum for melatonin suppression; sensitivity greatest in the blue part of the spectrum.",region:"United States",linkType:"Verified record"},{id:"XIE-2013",author:"Xie L, Kang H, Xu Q, et al. (Nedergaard M)",title:"Sleep drives metabolite clearance from the adult brain",date:"2013",venue:"Science, 342(6156):373–377",url:"https://doi.org/10.1126/science.1241224",access:Se,category:"Peer-reviewed research",relevance:"Mouse study linking sleep with clearance of brain metabolites; cited as preliminary for human relevance.",region:"United States (animal research)",linkType:"Verified record"},{id:"ROENNEBERG-2004",author:"Roenneberg T, Kuehnle T, Pramstaller PP, et al.",title:"A marker for the end of adolescence",date:"2004",venue:"Current Biology, 14(24):R1038–R1039",url:"https://www.cell.com/current-biology/fulltext/S0960-9822(04)00928-5",access:Se,category:"Peer-reviewed research",relevance:"Age-related changes in chronotype across the lifespan; abrupt change around age twenty.",region:"Germany and Europe (population data)",linkType:"Verified record"},{id:"WITTMANN-2006",author:"Wittmann M, Dinich J, Merrow M, Roenneberg T",title:"Social jetlag: misalignment of biological and social time",date:"2006",venue:"Chronobiology International, 23(1–2):497–509",url:"https://pubmed.ncbi.nlm.nih.gov/?term=Social+jetlag%3A+misalignment+of+biological+and+social+time",access:Se,category:"Peer-reviewed research",relevance:"Original description of social jet lag as the mismatch between biological and social time.",region:"Germany and Europe",linkType:"Database search"},{id:"BORBELY-1982",author:"Borbély AA",title:"A two process model of sleep regulation",date:"1982",venue:"Human Neurobiology, 1(3):195–204",url:"https://pubmed.ncbi.nlm.nih.gov/?term=Borbely+A+two+process+model+of+sleep+regulation",access:Se,category:"Peer-reviewed research",relevance:"Two-process model of sleep regulation (homeostatic and circadian processes).",region:"Switzerland and international",linkType:"Database search"},{id:"CAPPUCCIO-2010",author:"Cappuccio FP, D’Elia L, Strazzullo P, Miller MA",title:"Quantity and quality of sleep and incidence of type 2 diabetes: a systematic review and meta-analysis",date:"2010",venue:"Diabetes Care, 33(2):414–420",url:"https://pubmed.ncbi.nlm.nih.gov/?term=Cappuccio+quantity+and+quality+of+sleep+and+incidence+of+type+2+diabetes",access:Se,category:"Peer-reviewed research",relevance:"Systematic review linking short and poor-quality sleep with later type 2 diabetes (association, not proof of cause).",region:"International",linkType:"Database search"},{id:"IRWIN-2015",author:"Irwin MR",title:"Why sleep is important for health: a psychoneuroimmunology perspective",date:"2015",venue:"Annual Review of Psychology, 66:143–172",url:"https://pubmed.ncbi.nlm.nih.gov/?term=Irwin+MR+why+sleep+is+important+for+health+psychoneuroimmunology",access:Se,category:"Peer-reviewed research",relevance:"Review of sleep’s links with immunity, inflammation and health.",region:"United States",linkType:"Database search"},{id:"MORIN-BENCA-2012",author:"Morin CM, Benca R",title:"Chronic insomnia",date:"2012",venue:"The Lancet, 379(9821):1129–1141",url:"https://pubmed.ncbi.nlm.nih.gov/?term=Morin+CM+Benca+R+chronic+insomnia+Lancet",access:Se,category:"Peer-reviewed research",relevance:"Review of chronic insomnia, its causes and evidence for CBT-I.",region:"Canada and international",linkType:"Database search"}],Ro=[{id:1,chapter:13,title:"A teenager with an early school schedule",setting:"Fictional secondary-school student in a large city, with a 7:00 am bus.",background:"A 15-year-old student, here called 'Case 1', has lessons that start early. They describe feeling alert late in the evening and struggling to get up on weekdays. Weekends include late mornings.",challenge:"Weekday sleep appears short and weekend sleep appears much later, with tiredness in class.",science:"Adolescent circadian timing shifts later (Chapter 13). Early start times can create a mismatch between biological timing and school demands, producing social jet lag (Chapter 10).",considerations:"Options might include a steadier weekend wake time, morning daylight, a calm evening routine that the student helps design, and a conversation with the school about timetable flexibility where possible.",cannotConclude:"The case does not show that the student has a sleep disorder, that phones are the cause, or that a particular school start time would solve the problem for this student.",professional:"Seek medical advice if daytime sleepiness is severe, if snoring or breathing pauses are noticed, or if mood or concentration changes are significant.",learning:["Adolescent timing is biological, not a lack of discipline.","Weekend lie-ins can reduce acute tiredness but may shift timing later.","Solutions are often shared between student, family and school."]},{id:2,chapter:17,title:"A university student with inconsistent routines",setting:"Fictional first-year university student sharing a flat.",background:"'Case 2' has late-night study sessions, irregular lectures and frequent social events. Sleep times vary by several hours from one day to the next.",challenge:"Inconsistent timing leaves the student feeling groggy in morning lectures and unsure how to recover after a late night.",science:"Regular wake times anchor the body clock (Chapter 17). Irregular timing can produce social jet lag and reduce sleep quality. Sleep supports memory consolidation after learning (Chapter 44).",considerations:"Small steps might include a consistent wake time on most days, planning demanding study earlier, limiting late caffeine, and recovering from a late night by returning to the usual wake time rather than sleeping very late.",cannotConclude:"The case does not show that the student has insomnia or that a single habit change will solve workload or social pressures.",professional:"Speak with a university health service if sleep problems persist for several weeks, if anxiety or low mood affects daily life, or if sleepiness affects safety.",learning:["Irregular timing is a common student experience, and it is not a personal failing.","Returning to a steady wake time helps more than extreme catch-up.","Study planning is part of sleep planning."]},{id:3,chapter:28,title:"A remote worker with prolonged screen use",setting:"Fictional remote professional working from a small apartment.",background:"'Case 3' works on a laptop all day and often continues to answer messages in bed. Evening use can extend beyond midnight.",challenge:"Falling asleep takes longer than desired, and the person feels less alert in the morning.",science:"Evening device use can affect timing through light and stimulation (Chapter 28). Laboratory research suggests reading on a light-emitting device before bed can delay timing and reduce next-morning alertness (Chapter 8).",considerations:"Boundaries such as charging the phone outside the bedroom, reducing notifications, setting a work-stopping time and using a wind-down routine can help. Daylight breaks during the working day support timing.",cannotConclude:"The case does not show that screens are the only cause. Work stress, workload and sleep environment may all contribute.",professional:"Seek advice if sleep problems last several weeks, or if work stress or mood affects health and safety.",learning:["Screen effects depend on how, when and why devices are used.","Boundaries work best when they fit real work demands.","Screens are one part of sleep health."]},{id:4,chapter:16,title:"A parent caring for a newborn",setting:"Fictional parent with a newborn, sharing night duties with a partner.",background:"'Case 4' is caring for a baby who wakes often for feeds and comfort. Sleep is fragmented for several months, and the parent feels exhausted during the day.",challenge:"Sleep loss is expected in early infancy, yet it affects mood, concentration and safety when driving or handling tasks.",science:"Newborn care causes fragmented sleep, which is common (Chapter 16). Sharing night duties and using safe-sleep practices are recommended by national health guidance (Chapter 12). Persistent low mood after birth needs prompt professional support.",considerations:"Practical steps include sharing night feeds where possible, resting when the baby sleeps if feasible, asking family or services for help, and protecting a sleep-friendly room for daytime rest.",cannotConclude:"Tiredness alone does not show postnatal depression or another condition, and the case does not suggest that the parent is failing.",professional:"Seek urgent help if there are thoughts of harming yourself or your baby, if low mood or anxiety persists, or if the parent feels unable to cope.",learning:["Fragmented sleep in newborn care is common and expected.","Shared responsibilities matter greatly.","Mental health after birth deserves prompt support."]},{id:5,chapter:43,title:"A night-shift worker",setting:"Fictional healthcare support worker working three night shifts per week.",background:"'Case 5' works nights and tries to sleep in the morning. Daytime noise, light and family obligations make main sleep short and broken.",challenge:"Sleepiness during shifts and difficulty settling for daytime sleep.",science:"Night work conflicts with the body clock, and daytime sleep is often shorter and lighter (Chapter 43). Strategic napping, light management and protected main sleep are used in shift-work planning.",considerations:"Options include a planned nap before the shift where workplace policy allows, blackout curtains, earplugs used safely, a cool room, a clear family agreement about quiet time, and avoiding bright light on the commute home.",cannotConclude:"The case does not show that the worker has a sleep disorder or that a single strategy will fully adapt the body clock.",professional:"Seek occupational-health advice if fatigue affects safety or persists. Seek medical advice for severe sleepiness, shift-work disorder symptoms or near-misses while driving.",learning:["Night shifts disrupt biology and daytime sleep quality.","Drowsy driving after shifts is a serious risk.","Workplace rota design is a shared responsibility."]},{id:6,chapter:11,title:"A frequent international traveller",setting:"Fictional consultant who travels across several time zones each month.",background:"'Case 6' flies between continents several times a month. Adjustment takes several days, and sleep before meetings is often poor.",challenge:"Repeated jet lag, poor sleep and daytime fatigue during trips.",science:"Jet lag is a circadian mismatch (Chapter 11). Eastward travel often requires advancing the clock. Light timing, meal timing and realistic planning help, while melatonin evidence is mixed.",considerations:"Strategies might include shifting bedtime gradually before departure when possible, using morning or evening light according to direction, planning meals around local time, and limiting alcohol and caffeine late in the day.",cannotConclude:"The case does not show that melatonin or any supplement is appropriate or safe for this traveller.",professional:"Seek advice from a clinician or pharmacist before using melatonin or any sleep product, particularly when travelling with medicines or medical conditions.",learning:["Jet lag is a biological mismatch that takes time to adjust.","Light and meal timing are useful levers.","Realistic expectations prevent unnecessary frustration."]},{id:7,chapter:15,title:"An older adult experiencing sleep changes",setting:"Fictional retired person living alone.",background:"'Case 7' wakes earlier than before and has lighter sleep. They take a short nap after lunch and sometimes wake at night to urinate.",challenge:"Concern about whether these changes are normal or need checking.",science:"Lighter sleep and earlier timing can be part of ageing (Chapter 15). Night-time urination, daytime napping and other changes can also reflect medical conditions or medicines, which need assessment.",considerations:"Options include keeping regular daylight exposure, a short nap at a suitable time, reviewing evening fluids and caffeine, creating a safe night-time path to the bathroom, and reviewing medicines with a pharmacist.",cannotConclude:"The case does not show that the changes are normal or abnormal, and it cannot identify a condition from this description.",professional:"Consult a clinician for new snoring with breathing pauses, sudden confusion, falls, persistent night-time urination, or significant daytime sleepiness.",learning:["Some sleep changes are common with age, but not all changes are normal.","Medicines and conditions can affect sleep.","Never stop prescribed medicines without advice."]},{id:8,chapter:27,title:"A person in a noisy shared household",setting:"Fictional household with several adults and children sharing a small flat near a busy road.",background:"'Case 8' shares a bedroom and hears traffic, household activity and late-night television. Sleep is light and frequently interrupted.",challenge:"Constant noise makes falling and staying asleep difficult.",science:"Night-time noise can fragment sleep even without full awakening (Chapter 27). Light and noise management, and household agreements, can reduce disturbance.",considerations:"Options include a curtain or screen to create a sleep zone, earplugs used safely, rugs and door seals, quieter appliances, agreed quiet hours and asking the landlord or local services about persistent noise.",cannotConclude:"The case does not show whether the noise alone explains all sleep problems, or that earplugs will suit everyone.",professional:"Seek advice if sleep problems persist despite environmental changes, or if stress, low mood or sleepiness affects health or safety.",learning:["Noise can fragment sleep even when people do not fully wake.","Household agreements can be as valuable as equipment.","Housing conditions are structural, not personal failings."]},{id:9,chapter:25,title:"A person living in a hot climate without air conditioning",setting:"Fictional person living in a hot, humid city in a low-income household.",background:"'Case 9' sleeps in a room that stays warm at night. A fan is used, and windows are opened when it is cooler.",challenge:"Warm nights lead to disturbed sleep and feelings of exhaustion.",science:"Thermoregulation affects sleep onset and continuity (Chapter 25). Cooling the environment and bedding, and using ventilation and shade, can support comfort. Heat can also be a serious health risk.",considerations:"Practical measures include ventilating at cooler times, shading windows during the day, using fans safely, choosing breathable clothing and bedding, drinking enough fluids, and checking on vulnerable household members.",cannotConclude:"The case does not show that cold showers or other specific measures will work for every person.",professional:"Seek urgent help for signs of heat illness such as confusion, fainting, very high temperature or severe headache.",learning:["Warm rooms can disturb sleep and create serious health risks.","Affordable measures can help a great deal.","Community support and heat advice matter."]},{id:10,chapter:30,title:"A person with stress-related bedtime worry",setting:"Fictional employee with a demanding job and family responsibilities.",background:"'Case 10' lies awake planning tomorrow’s tasks and worrying about performance. Watching the clock increases frustration.",challenge:"Racing thoughts and sleep effort delay sleep onset most nights.",science:"Cognitive arousal and rumination increase bedtime alertness (Chapter 30). Sleep effort can strengthen the problem. Structured approaches such as worry planning, relaxation and CBT-I have evidence (Chapter 33).",considerations:"Options include a worry list earlier in the evening, a brief writing routine, leaving bed if awake for a long time, gentle relaxation and talking with someone supportive.",cannotConclude:"The case does not show a diagnosis of insomnia or anxiety, and it does not replace a mental health assessment.",professional:"Seek professional support if worry is intense or persistent, if sleep loss affects work or relationships, or if there are thoughts of self-harm, contacting emergency services or a crisis line immediately if in danger.",learning:["Worry and arousal can interact with sleep.","Trying harder to sleep can backfire.","Support for persistent worry is a valid choice."]},{id:11,chapter:34,title:"A heavy snorer who feels sleepy during the day",setting:"Fictional adult whose partner has noticed loud snoring and breathing pauses.",background:"'Case 11' snores loudly most nights. The partner describes pauses in breathing followed by gasping. The person feels sleepy at work and has morning headaches.",challenge:"Daytime sleepiness and reports of breathing interruptions during sleep.",science:"Loud snoring with witnessed breathing pauses and daytime sleepiness may be associated with obstructive sleep apnoea (Chapter 34). NHLBI advises medical evaluation, because untreated sleep apnoea is associated with serious health risks.",considerations:"A clinician may discuss a sleep study, the possible role of weight, alcohol and sleep position, and treatment options such as PAP therapy. Avoid self-diagnosis or reliance on apps alone.",cannotConclude:"The case does not confirm sleep apnoea, and it cannot determine severity, risk or treatment from this description.",professional:"Seek medical evaluation promptly. Seek urgent help for chest pain, fainting, severe breathlessness or confusion.",learning:["Snoring with breathing pauses warrants evaluation.","Daytime sleepiness can be a sign to speak to a clinician.","Risk factors are not moral failings."]},{id:12,chapter:14,title:"A person with irregular work schedules",setting:"Fictional gig-economy worker whose rota changes weekly.",background:"'Case 12' has shifts that start at different times each week. Sleep duration changes accordingly, and commuting is unpredictable.",challenge:"Difficulty establishing any stable routine and recurring tiredness.",science:"Irregular schedules can disrupt circadian timing and sleep quality (Chapter 10). Consistency of key anchors, such as a regular wake time on most days, can help where possible.",considerations:"Options include choosing a consistent wake-time window, protecting a daytime rest period, using daylight when possible, planning caffeine around shifts, and discussing predictable rotas with employers where feasible.",cannotConclude:"The case does not show a sleep disorder, and structural working conditions are the main constraint.",professional:"Seek advice if persistent fatigue affects safety, or if work conditions create serious health concerns.",learning:["Irregular work is a structural constraint.","Consistent anchors help even in changing schedules.","Fatigue affects safety and deserves discussion."]},{id:13,chapter:45,title:"An athlete balancing training and rest",setting:"Fictional amateur endurance athlete training most mornings and some evenings.",background:"'Case 13' trains intensively and feels that sleep is sometimes short after evening sessions. Recovery feels slower than expected.",challenge:"Balancing training load with adequate sleep and recovery.",science:"Sleep supports physical recovery and is linked with performance in sports science research (Chapter 45). Evening exercise responses vary between individuals (Chapter 18).",considerations:"Options include planned rest days, adjusting session timing to suit sleep, protecting a consistent wake time, reviewing caffeine timing, and discussing persistent fatigue with a sports medicine professional.",cannotConclude:"The case does not show that more sleep alone will improve performance, or that a specific training schedule is right for the athlete.",professional:"Consult a sports medicine clinician or doctor if fatigue persists, performance declines unexpectedly, or there are signs of overtraining or injury.",learning:["Recovery includes sleep and rest, not only training.","Exercise timing should be tested individually.","Persistent fatigue deserves professional review."]},{id:14,chapter:39,title:"A person concerned about supplement marketing",setting:"Fictional adult who has seen social-media advertisements for sleep supplements.",background:"'Case 14' is attracted by claims that a product will 'guarantee deep sleep' and is 'completely natural'. They are considering buying several products at once.",challenge:"Deciding whether marketing claims are reliable and whether any product is safe.",science:"Melatonin has timing effects with variable evidence and product quality (Chapter 39). Herbal products and magnesium have limited or mixed evidence. Regulation of supplements varies between countries.",considerations:"Useful questions include: what evidence exists, who funded the research, what the actual dose and contents are, whether the product interacts with medicines, and whether a pharmacist or clinician has been consulted. Avoid buying several products at once.",cannotConclude:"The case does not show that any product is ineffective or unsafe, and it cannot assess the individual’s health or medicines.",professional:"Ask a pharmacist or clinician before using any sleep product, especially if you take medicines, are pregnant or breastfeeding, or are considering use for a child.",learning:["Natural does not mean safe.","Marketing claims should be checked against evidence.","Interactions and safety matter more than advertising."]},{id:15,chapter:33,title:"A person with persistent sleep difficulties who needs professional evaluation",setting:"Fictional adult whose sleep problems have lasted several months.",background:"'Case 15' has difficulty falling asleep and staying asleep most nights for several months. Daytime tiredness affects work, and they have tried several self-help approaches without lasting change.",challenge:"Persistent sleep difficulty that is affecting daily life.",science:"Insomnia lasting months with daytime impact warrants professional evaluation (Chapter 33). CBT-I is recommended as first-line treatment for chronic insomnia in adults, and other conditions should be considered.",considerations:"Helpful steps include keeping a sleep diary for about two weeks, listing any medicines or substances, noting symptoms such as snoring, leg discomfort or low mood, and preparing questions for an appointment (Chapter 40).",cannotConclude:"The case does not diagnose insomnia or any other condition, and it cannot determine the right treatment from this description.",professional:"Make an appointment with a GP or doctor. Seek urgent help if there are thoughts of self-harm or severe symptoms.",learning:["Persistent problems deserve assessment rather than endurance.","Diaries help clinicians understand patterns.","CBT-I is a recognised first-line option for chronic insomnia."]}],Fe=[{part:1,chapter:1,q:"Which description best fits sleep?",options:["Complete absence of brain activity","A reversible state of reduced responsiveness with characteristic brain patterns","The same as quiet rest with eyes closed","Only the time spent in deep sleep"],answer:1,explanation:"Sleep is a reversible state with reduced responsiveness and characteristic EEG patterns. Quiet rest keeps broader awareness."},{part:1,chapter:2,q:"Which neurotransmitter is the brain’s main inhibitory messenger?",options:["Dopamine","GABA","Glutamate","Acetylcholine"],answer:1,explanation:"GABA is the main inhibitory neurotransmitter and plays a central role in sleep promotion."},{part:1,chapter:3,q:"Which sleep stage contains the most slow waves?",options:["N1","N2","N3","REM"],answer:2,explanation:"N3 (deep, slow-wave sleep) has the highest proportion of slow waves."},{part:1,chapter:3,q:"What characterises REM sleep?",options:["Increased muscle tone","Rapid eye movements and muscle atonia","No brain activity","Continuous slow waves"],answer:1,explanation:"REM sleep includes rapid eye movements, low muscle tone (atonia), and more active EEG patterns."},{part:1,chapter:3,q:"On average, how long is a typical adult sleep cycle?",options:["About 20 minutes","About 90 minutes","About 4 hours","About 60 minutes exactly"],answer:1,explanation:"Adult cycles average around 90 minutes, but individual variation is normal."},{part:1,chapter:4,q:"What does current research suggest about sleep and memory?",options:["Sleep stores all information","Sleep supports consolidation of some memory types","Sleep erases memories","Sleep has no role"],answer:1,explanation:"Sleep supports consolidation of some memory types. It does not store everything, and its roles are still being studied."},{part:1,chapter:4,q:"Where was the 2013 brain-clearance finding by Xie and colleagues primarily observed?",options:["Human volunteers in a trial","Mice","Fruit flies","Cell cultures only"],answer:1,explanation:"The 2013 study was in mice. Human relevance is still being studied, so the finding is preliminary for humans."},{part:1,chapter:5,q:"What do AASM and SRS consensus recommendations advise for healthy adults?",options:["Exactly eight hours","Seven or more hours regularly","Five hours","Six hours"],answer:1,explanation:"The 2015 joint consensus recommends seven or more hours regularly as a minimum for healthy adults."},{part:1,chapter:5,q:"Which statement about sleep need is most accurate?",options:["Everyone needs seven hours exactly","Needs vary between individuals","Older adults need four hours","Children need the same as adults"],answer:1,explanation:"Sleep needs vary by person and age. Population ranges are guidance, not individual prescriptions."},{part:2,chapter:6,q:"What is the approximate period of a circadian rhythm?",options:["12 hours","About 24 hours","36 hours","48 hours"],answer:1,explanation:"Circadian rhythms run close to 24 hours and are aligned mainly by light."},{part:2,chapter:6,q:"What is the main cue that aligns the human body clock?",options:["Diet","Light","Exercise","Room temperature"],answer:1,explanation:"Light is the main entraining cue. Meals, activity and social timing also contribute."},{part:2,chapter:7,q:"Where are peripheral clocks found?",options:["Only in the brain","In many organs such as the liver and gut","Only in the skin","Only in the heart"],answer:1,explanation:"Many organs contain peripheral clocks, coordinated by the SCN and responding to local cues such as meal timing."},{part:2,chapter:8,q:"How is melatonin best described?",options:["A stimulant","A timing signal for darkness","A caffeine-like compound","A vitamin"],answer:1,explanation:"Melatonin is a hormone that signals darkness and helps time the body clock. Its sedative effects are small and variable."},{part:2,chapter:8,q:"In Brainard and colleagues’ human action spectrum (2001), where was melatonin suppression most sensitive?",options:["Red, 650 to 700 nanometres","Blue, around 460 to 480 nanometres","Infrared","Ultraviolet"],answer:1,explanation:"The human action spectrum showed greatest sensitivity in the blue part of the spectrum, around 460 to 480 nanometres."},{part:2,chapter:8,q:"Which statement about blue light is most accurate?",options:["All light is equally harmful","The effect depends on intensity, duration, timing and content","Only red light matters","Blue light never affects timing"],answer:1,explanation:"Screen effects depend on several factors. Daylight also contains blue light and is generally helpful for daytime alertness."},{part:2,chapter:9,q:"What is a chronotype?",options:["A fixed medical diagnosis","A natural preference for timing along a continuum","A blood-test result","The same as insomnia"],answer:1,explanation:"Chronotype describes a preference for sleep and activity timing along a continuous spectrum."},{part:2,chapter:9,q:"Roenneberg and colleagues (2004) reported an abrupt change in sleep timing around which age?",options:["12","16","20","30"],answer:2,explanation:"The authors reported an abrupt change around age 20, proposed as a biological marker for the end of adolescence."},{part:2,chapter:10,q:"How is social jet lag typically measured?",options:["Difference in mid-sleep between free days and workdays","Number of coffees per day","Hours of screen time","Blood melatonin concentration"],answer:0,explanation:"Social jet lag is commonly calculated from the difference in mid-sleep between free days and workdays."},{part:2,chapter:11,q:"What does eastward travel usually require of the body clock?",options:["Delaying the clock","Advancing the clock","No change","Stopping sleep entirely"],answer:1,explanation:"Eastward travel requires advancing the clock, which many people find harder than delaying it."},{part:2,chapter:11,q:"Which is a sound practical approach to jet lag?",options:["Avoid all light at the destination","Use light timing and meals aligned to the destination","Sleep for the whole day","Drink alcohol to sleep"],answer:1,explanation:"Light timing and aligned meals are reasonable. Alcohol is not a sleep aid, and melatonin use should be discussed with a clinician."},{part:3,chapter:12,q:"What is the recommended infant sleep position in national safe-sleep guidance?",options:["Front","On the back, on a firm, flat surface","Propped on soft pillows","On a sofa with an adult"],answer:1,explanation:"National guidance recommends placing babies on their back on a firm, flat, clear sleep surface."},{part:3,chapter:13,q:"Which direction does adolescent circadian timing typically shift?",options:["Earlier","Later","No change","It becomes random"],answer:1,explanation:"Adolescent timing typically shifts later, which can clash with early school starts."},{part:3,chapter:13,q:"What school start time has the AASM advocated for middle and high schools?",options:["6:00 am","7:00 am","No earlier than 8:30 am","5:00 am"],answer:2,explanation:"The AASM has advocated that middle and high schools start no earlier than 8:30 am."},{part:3,chapter:14,q:"Which approach is supportive for adults with caring responsibilities?",options:["Assuming poor sleep is a willpower problem","Sharing night-time duties where possible","Avoiding all stress management","Ignoring caregiving load"],answer:1,explanation:"Sharing responsibilities is practical. Sleep loss often reflects structural constraints, not personal failings."},{part:3,chapter:15,q:"Which change in an older adult warrants prompt assessment?",options:["Lighter sleep","New loud snoring with breathing pauses","A short daytime nap","Waking a little earlier"],answer:1,explanation:"New loud snoring with breathing pauses warrants medical evaluation for possible sleep apnoea."},{part:3,chapter:16,q:"How is sleep disruption after childbirth best described?",options:["Never occurs","Common and linked with newborn care","Only occurs with twins","Always treated with sleeping tablets"],answer:1,explanation:"Postpartum sleep disruption is common. Shared responsibilities and support help, and persistent low mood needs help."},{part:4,chapter:17,q:"Which daily anchor is most useful for many people?",options:["An exact bedtime every night","A steady wake time","Dinner time","Screen time"],answer:1,explanation:"A steady wake time is a strong anchor for the body clock and often improves sleep onset over time."},{part:4,chapter:17,q:"When does the NHS suggest going to bed?",options:["Whenever you feel like it","When you feel sleepy","Always at 10 pm","After 2 am"],answer:1,explanation:"NHS behavioural guidance suggests going to bed when sleepy rather than trying to force sleep."},{part:4,chapter:18,q:"What is the WHO minimum weekly moderate aerobic activity guideline for adults?",options:["30 minutes","150 minutes","75 minutes","300 minutes"],answer:1,explanation:"WHO 2020 guidance suggests at least 150 minutes of moderate aerobic activity per week, with additional benefits at higher levels."},{part:4,chapter:18,q:"What is the best supported view of exercise timing and sleep?",options:["A universal rule: never late","Responses vary, so test what works for you","Always before 6 pm","Exercise always causes insomnia"],answer:1,explanation:"Evidence does not support a universal timing rule. Individual responses differ."},{part:4,chapter:19,q:"What is the best-supported view of turkey and sleepiness?",options:["Strongly proven","Food-related tryptophan effects are small and inconsistent","Works only in children","Causes insomnia"],answer:1,explanation:"Dietary tryptophan effects on sleep are small and inconsistent. Large meals and alcohol are more plausible contributors."},{part:4,chapter:20,q:"How does caffeine work on sleep-promoting signals?",options:["Activates GABA","Blocks adenosine receptors","Stops melatonin production in all people","Increases cortisol only"],answer:1,explanation:"Caffeine blocks adenosine receptors, which increases alertness without removing the underlying sleep pressure."},{part:4,chapter:20,q:"What upper caffeine level is commonly cited in NHS guidance for pregnancy?",options:["No limit","About 200 mg a day","About 1,000 mg a day","About 50 mg a day"],answer:1,explanation:"NHS guidance commonly cites about 200 mg of caffeine a day as an upper limit during pregnancy."},{part:4,chapter:21,q:"What does alcohol tend to do later in the night?",options:["Increase REM sleep","Fragment the second half of the night and reduce REM","Eliminate all dreams","Have no effect on breathing"],answer:1,explanation:"Alcohol tends to fragment later sleep, reduce REM, and can worsen snoring and breathing pauses."},{part:4,chapter:22,q:"Is the 'eight glasses of water a day' rule strongly supported as a universal target?",options:["Yes, strongly supported","No, it is not well supported as a universal target","Yes, it is required by law","Only for children"],answer:1,explanation:"Fluid needs vary with climate, activity and health. National guidance gives ranges rather than universal quotas."},{part:4,chapter:23,q:"What nap length is often associated with improved alertness and less grogginess?",options:["About 10 to 20 minutes","About 3 hours","About 8 hours","About 45 minutes every time"],answer:0,explanation:"Brief naps of around 10 to 20 minutes are often associated with alertness benefits and less grogginess."},{part:5,chapter:24,q:"Which is a low-cost bedroom improvement?",options:["Curtains or an eye mask","An expensive mattress only","Air conditioning always","Removing all ventilation"],answer:0,explanation:"Curtains and eye masks are affordable ways to reduce light. Many effective changes are low cost."},{part:5,chapter:25,q:"What is a serious risk when heating a room with unsafe fuel appliances?",options:["Carbon monoxide poisoning","Improved sleep","Better ventilation","Reduced humidity"],answer:0,explanation:"Unvented fuel appliances can release carbon monoxide, which is dangerous and requires urgent help if symptoms occur."},{part:5,chapter:25,q:"What usually happens to core body temperature in the evening?",options:["It rises sharply","It tends to fall","It stays constant","It doubles"],answer:1,explanation:"Core body temperature tends to fall in the evening, supported by heat loss through the skin."},{part:5,chapter:26,q:"Which statement about pillows is most accurate?",options:["One pillow suits everyone","Choice depends on sleep position and comfort","Pillows never matter","Only memory foam works"],answer:1,explanation:"Pillow comfort depends on the person’s sleep position and body. Evidence for specific designs is limited."},{part:5,chapter:27,q:"What is an important safety rule for earplugs?",options:["Use them in every situation","They must not stop you hearing alarms, emergencies or children","Never use them","Use them with alcohol"],answer:1,explanation:"Earplugs should be used safely. They must not prevent you from hearing important alarms or people who need you."},{part:5,chapter:28,q:"How should evidence on evening screen use be described?",options:["Definitive for all people","Laboratory evidence is promising; real-world size is uncertain","Proven to cause insomnia","No evidence at all"],answer:1,explanation:"Laboratory studies show effects on circadian timing and alertness, but real-world effects vary and remain uncertain."},{part:6,chapter:29,q:"What is the sympathetic nervous system’s main role?",options:["Promoting rest","Preparing the body for action","Controlling digestion only","Having no role in sleep"],answer:1,explanation:"The sympathetic branch mobilises the body for action, increasing heart rate and alertness."},{part:6,chapter:29,q:"How does cortisol typically follow the day?",options:["Highest at midnight","Rises before waking and falls through the day","Constant all day","Only rises during exercise"],answer:1,explanation:"Cortisol typically rises before waking, then falls through the day and evening."},{part:6,chapter:30,q:"What is rumination?",options:["Repetitive, unproductive thinking","Deep sleep","A breathing exercise","Muscle relaxation"],answer:0,explanation:"Rumination is repetitive, unproductive thinking about past or future concerns."},{part:6,chapter:31,q:"Around what breathing rate has slow breathing been examined in research?",options:["30 breaths per minute","About 6 breaths per minute","60 breaths per minute","1 breath per minute"],answer:1,explanation:"Research has examined breathing around six breaths per minute in relation to heart rate variability."},{part:6,chapter:32,q:"How is the relationship between sleep and emotion best described?",options:["One-way only","Two-way and complex","Sleep has no effect","Mood never affects sleep"],answer:1,explanation:"Sleep and mood influence each other. Oversimplified causal claims should be avoided."},{part:7,chapter:33,q:"Which is the recommended first-line treatment for chronic insomnia in adults, according to the ACP guideline?",options:["Sleeping tablets","CBT-I","Alcohol","Herbal tea"],answer:1,explanation:"The American College of Physicians recommends CBT-I as the initial treatment for chronic insomnia disorder in adults."},{part:7,chapter:33,q:"According to the NHS, insomnia lasting less than how long is described as short-term?",options:["Three months","One year","Two years","Five years"],answer:0,explanation:"NHS guidance describes insomnia lasting less than three months as short-term."},{part:7,chapter:34,q:"What characterises obstructive sleep apnoea?",options:["Brain fails to send breathing signals","The upper airway is repeatedly blocked","Insomnia from caffeine","Restless legs"],answer:1,explanation:"Obstructive sleep apnoea involves repeated upper airway blockage during sleep."},{part:7,chapter:34,q:"Which option is a form of positive airway pressure therapy?",options:["CPAP","Melatonin","Valerian","Magnesium"],answer:0,explanation:"CPAP is a form of positive airway pressure therapy used for many adults with obstructive sleep apnoea."},{part:7,chapter:35,q:"Which description best fits restless legs syndrome?",options:["A sensation-based urge to move the legs, relieved by movement","A condition that occurs only at sunrise","A type of snoring","Caused by alcohol only"],answer:0,explanation:"RLS involves an urge to move the legs, often with uncomfortable sensations, that starts or worsens at rest and is relieved by movement."},{part:7,chapter:35,q:"Why should iron not be self-prescribed for restless legs?",options:["Iron is always harmless","Iron status should be checked with blood tests","Iron has no effect","Iron replaces CBT-I"],answer:1,explanation:"Blood tests guide iron treatment, because excess iron can be harmful and deficiency is only one possible cause."},{part:7,chapter:36,q:"What is non-24-hour sleep-wake rhythm disorder?",options:["The body clock free-runs and does not align with the 24-hour day","Sleeping only in the afternoon","Caused by sugar intake","The same as insomnia"],answer:0,explanation:"In non-24-hour rhythm disorder the body clock free-runs and does not synchronise with the day."},{part:7,chapter:37,q:"From which sleep stage does sleepwalking mainly arise?",options:["REM sleep","Deep non-REM sleep","The awake state","Breathing pauses"],answer:1,explanation:"Sleepwalking mainly arises from deep non-REM sleep, often early in the night."},{part:7,chapter:37,q:"Which is a sensible household precaution for someone who sleepwalks?",options:["Leave stairs unguarded","Secure windows and clear pathways","Wake the person abruptly","Keep sharp objects by the bed"],answer:1,explanation:"Securing windows and doors, clearing pathways and guarding stairs reduce injury risk."},{part:7,chapter:38,q:"Which distinction is most accurate?",options:["Sleepiness is always persistent","Sleepiness is a tendency to fall asleep, fatigue is broader exhaustion","They are identical","Fatigue is always caused by lack of sleep"],answer:1,explanation:"Sleepiness refers to the tendency to fall asleep. Fatigue is broader and may persist after sleep."},{part:7,chapter:38,q:"Narcolepsy type 1 is associated with loss of which signalling?",options:["Hypocretin (orexin)","Excess melatonin only","Caffeine excess","Iron deficiency"],answer:0,explanation:"Loss of hypocretin (orexin) signalling is linked with narcolepsy type 1."},{part:7,chapter:39,q:"Which statement about melatonin is most accurate?",options:["Always safe for children without advice","Product content can vary; discuss with a clinician","Has the same effect as a sedative medicine","Regulated identically worldwide"],answer:1,explanation:"Melatonin products vary, and regulation differs between countries. Discuss use with a clinician, especially for children."},{part:7,chapter:39,q:"What is a key risk of sedating antihistamines in older adults?",options:["Improved memory","Confusion and falls","Enhanced balance","Better breathing"],answer:1,explanation:"Sedating antihistamines can cause confusion, next-day drowsiness and falls in older adults."},{part:7,chapter:40,q:"Which symptom requires immediate local medical help?",options:["Mild tiredness after a long week","Severe breathing difficulty or chest pain","Feeling sleepy after lunch","Mild snoring on holiday"],answer:1,explanation:"Severe breathing difficulty or chest pain requires immediate medical attention."},{part:7,chapter:40,q:"About how long is a sleep diary often kept for a clinical discussion?",options:["One day","About two weeks","One year","Five minutes"],answer:1,explanation:"A diary kept for about two weeks is commonly used, or for as long as a clinician requests."},{part:8,chapter:41,q:"What is the best use of a wearable sleep score?",options:["Definitive diagnosis","Estimate useful for trends, not diagnosis","Always accurate","Measuring blood sugar"],answer:1,explanation:"Wearables estimate sleep and can show trends. They cannot diagnose sleep disorders."},{part:8,chapter:42,q:"What is a balanced response to a setback in a sleep routine?",options:["Abandon the routine","Return to the usual routine and avoid extreme compensation","Sleep 16 hours","Start a strict new plan at once"],answer:1,explanation:"Returning to the usual routine without extreme compensation supports consistency."},{part:8,chapter:43,q:"What is the safest response after a night shift if you feel drowsy on the commute?",options:["Drive anyway with the window open","Do not drive when drowsy; rest or use other transport","Drive if you have had coffee","Drive if the distance is short"],answer:1,explanation:"Drowsy driving is dangerous. Rest or use another form of transport."},{part:8,chapter:44,q:"How does sleep relate to learning?",options:["Sleep is wasted time","Sleep supports memory consolidation","Sleep deprivation improves attention","Sleep erases learning"],answer:1,explanation:"Sleep supports memory consolidation for some kinds of learning, while sleep loss impairs attention."},{part:8,chapter:45,q:"Which statement about sleep and long-term health is most accurate?",options:["Association proves cause","Associations do not automatically prove cause","Causation is always proven","Observational studies are definitive"],answer:1,explanation:"Observational studies show associations. Causal conclusions require careful evidence."},{part:8,chapter:46,q:"What does the Japanese concept inemuri describe?",options:["Sleeping while present in a public or working setting","A type of meditation","A night-shift schedule","A pillow design"],answer:0,explanation:"Inemuri describes brief sleep taken while present in a public or working environment."},{part:8,chapter:47,q:"How should the claim 'everyone needs exactly eight hours' be evaluated?",options:["True for everyone","Misleading: adult guidance is a minimum range, and needs vary","Proven scientifically","Only for infants"],answer:1,explanation:"Adult guidance is seven or more hours regularly, and individual needs vary. A fixed eight hours for everyone is misleading."},{part:8,chapter:49,q:"Which statement describes the 30-day challenge rules?",options:["Mandatory early wake-ups","Skipping is allowed with no punishment","Competitive sleep scores","A promise to cure insomnia"],answer:1,explanation:"The challenge has no mandatory targets or punishments, and activities may be skipped or adapted."},{part:8,chapter:50,q:"Which reflects the book’s guidance on warning signs?",options:["Ignore breathing pau
