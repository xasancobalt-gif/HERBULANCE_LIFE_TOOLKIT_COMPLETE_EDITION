mal."},{claim:"Stress is separate from sleep.",reality:"Stress and sleep influence each other, so both need attention."}],takeaways:["Work, caregiving and housing shape sleep, and structural constraints should be recognised.","Stress and sleep reinforce each other.","Realistic routines start from real constraints and can be adapted over time."],refs:["WATSON-2015","NHS-INSOMNIA","AASM-EDU"],keyTerms:["Stress","Rota","Sleep hygiene","Fatigue"]},{id:15,part:3,title:"Sleep and Healthy Ageing",subtitle:"Normal changes, medical influences and when a change needs assessment",minutes:11,objectives:["Describe typical age-related changes in sleep architecture and timing.","Explain how medicines and health conditions can affect sleep in later life.","Distinguish normal changes from symptoms that warrant professional assessment."],figure:{kind:"compare",title:"Typical changes versus changes that need assessment",caption:"A general educational comparison. Sudden or severe changes, or any new confusion, should be assessed promptly rather than attributed to ageing.",alt:"Two-column comparison. Often-seen changes include lighter sleep, more awakenings, some earlier timing and short daytime rests. Changes that need assessment include new breathing pauses, loud snoring, sudden confusion, excessive daytime sleepiness, acting out dreams, or falls.",columns:[{title:"Often-seen changes",items:["Lighter sleep and more awakenings","Less deep (N3) sleep","Some people go to bed and wake earlier","Short daytime rests that do not disturb night sleep","Needing more time to settle at night"]},{title:"Changes that need assessment",items:["New or loud snoring with breathing pauses","Sudden or severe daytime sleepiness","New confusion or memory changes","Acting out dreams or moving violently in sleep","Falls, night-time injuries or restless legs symptoms"]}]},sections:[{heading:"Age-related changes in sleep",paras:["Sleep architecture tends to change with age. Deep non-REM sleep usually decreases, sleep becomes lighter, and awakenings become more frequent. Many older adults go to bed and wake earlier, although this varies. These changes are common, but they are not uniform, and they do not mean that older adults need much less sleep. The AASM and SRS consensus continues to recommend seven or more hours for healthy adults, while recognising that consolidation may be harder."],evidence:{level:"established",text:"The general direction of age-related sleep change is well supported. Its size varies between individuals."}},{heading:"Daytime naps and night-time sleep",paras:["Short daytime naps are common and may help some older adults, particularly if night sleep is light. However, long or frequent daytime sleep can be linked with poor night sleep and sometimes with underlying conditions, so changes in napping are worth discussing with a clinician. Chapter 23 considers napping in more detail."],evidence:{level:"developing",text:"Napping associations with health outcomes vary across studies and depend on duration and timing."}},{heading:"Medicines and medical conditions",paras:["Many medicines can affect sleep, including some blood pressure medicines, antidepressants, corticosteroids, and drugs for breathing, allergy or pain. Timing and dose matter. Diuretics taken late in the day may increase night-time urination. Sedating antihistamines in older adults can cause confusion and falls. Conditions such as sleep apnoea, restless legs syndrome, chronic pain, heart failure, dementia and depression can also disrupt sleep.","Never stop or change a prescribed medicine without advice from the prescriber or a pharmacist. Ask a clinician if a medicine may be affecting your sleep."],evidence:{level:"safety",text:"Medicine changes should be discussed with a clinician. This is educational information, not individual medicine advice."}},{heading:"Realistic, safe sleep-supporting habits",paras:["Practical habits include getting daylight during the day, keeping regular activity levels within personal capacity, limiting caffeine and alcohol, reducing night-time disruptions such as a dim, safe route to the bathroom, and preparing a comfortable and safe bedroom. Night lights and clear pathways can reduce falls. Avoid unsupported products claiming rapid results, particularly those containing sedating ingredients, and check any supplement with a pharmacist first."],evidence:{level:"established",text:"Falls are a major safety concern in older adults, and home safety measures are recommended by health services."}}],misconceptions:[{claim:"Older adults do not need much sleep.",reality:"Older adults still need adequate sleep, although the pattern may change. Persistent sleepiness is not simply normal ageing."},{claim:"Sleep problems are just part of getting older.",reality:"Some changes are common, but many sleep problems have treatable causes and deserve assessment."},{claim:"Sleeping tablets are safe for older adults if used regularly.",reality:"Sedating medicines carry risks of dependence, falls and confusion in older adults, and should be used only under professional guidance."}],takeaways:["Lighter, more fragmented sleep is common in older age, but it is not the same as needing much less sleep.","Medicines and health conditions can affect sleep, and changes should be discussed with a clinician.","Breathing pauses, sudden confusion or unusual movements during sleep warrant prompt assessment."],refs:["NHLBI-APNEA","NHS-INSOMNIA","WATSON-2015","NHLBI-DEP"],keyTerms:["Sleep architecture","Nocturia","Polypharmacy","Sleep apnoea"]},{id:16,part:3,title:"Sleep During Pregnancy and Major Life Changes",subtitle:"Pregnancy, postpartum care, menstrual and menopausal changes, and life transitions",minutes:12,objectives:["Describe common sleep changes during pregnancy and the postpartum period.","Explain how menstrual and menopausal hormonal changes can affect sleep.","Identify when professional support is important."],figure:{kind:"flow",title:"Sleep-relevant life stages",caption:"A general overview of life stages where sleep often changes. Individual experiences differ widely, and support should be sought when changes are severe or persistent.",alt:"Flow diagram of six life stages: early pregnancy, middle pregnancy, late pregnancy, birth and postpartum period, newborn care, and perimenopause and menopause, each linked to a common sleep change.",steps:["Early pregnancy: tiredness and early waking","Late pregnancy: discomfort and frequent waking","Birth and postpartum: fragmented sleep","Newborn care: shared night duties","Perimenopause: hormonal shifts","Menopause: hot flushes and night sweats"]},sections:[{heading:"Sleep during pregnancy",paras:["Pregnancy often brings changes in sleep. Early pregnancy may cause strong tiredness, while later pregnancy can involve frequent urination, back pain, heartburn, vivid dreams, restless legs symptoms and difficulty finding a comfortable position. Some pregnant people develop snoring or breathing pauses, which should be discussed with a midwife or doctor because they can be associated with complications.","Some health services suggest side sleeping in later pregnancy because it may improve blood flow to the uterus. Evidence on sleeping position is limited, and advice should be discussed with a midwife or obstetric clinician."],evidence:{level:"developing",text:"Pregnancy-related sleep changes are common, but the evidence for specific positions and interventions is limited."}},{heading:"The postpartum period and newborn care",paras:["Newborns wake frequently for feeding and comfort, so new parents often experience fragmented sleep for months. Sharing night duties where possible, using safe-sleep practices, and asking for practical help from family or services can make a substantial difference. Postpartum sleep loss overlaps with the risk of postnatal depression, so persistent low mood, anxiety or thoughts of harm require urgent professional support."],evidence:{level:"established",text:"Postpartum sleep disruption is common, and postnatal mental health concerns should be assessed promptly."}},{heading:"Menstrual cycle and menopause",paras:["Many people notice that sleep changes across the menstrual cycle, particularly in the days before menstruation. Hormonal shifts during perimenopause and menopause can cause hot flushes, night sweats, mood changes and sleep disruption. Some people find that symptoms improve with treatment options discussed with a clinician, including hormonal and non-hormonal approaches, though not everyone can use them."],evidence:{level:"developing",text:"The link between menstrual phases and sleep varies between individuals, and research continues."}},{heading:"Caregiving, transitions and professional support",paras:["Major transitions such as bereavement, moving home, starting a new job, or caring for someone with illness can all disrupt sleep. These changes are not personal failings. Professional support is important if sleep problems persist for weeks, if mood or safety is affected, or if breathing or movement problems during sleep are noticed."],evidence:{level:"safety",text:"Pregnant or postpartum people with breathing pauses, severe symptoms or thoughts of self-harm should seek urgent medical attention."}}],misconceptions:[{claim:"Tiredness in pregnancy means something is wrong.",reality:"Tiredness and sleep changes are common. Severe or unusual symptoms should still be checked."},{claim:"New parents should just sleep when the baby sleeps.",reality:"This is sometimes possible, but it is not always realistic. Sharing responsibilities is often more practical."},{claim:"Menopausal sleep problems are inevitable and untreatable.",reality:"Several evidence-based options exist and can be discussed with a clinician."}],takeaways:["Pregnancy, the postpartum period and menopause commonly alter sleep through physical and hormonal changes.","Shared night duties, safe-sleep practices and support improve the situation for many families.","Persistent sleep loss, low mood or breathing concerns should prompt professional advice."],refs:["NHS-INSOMNIA","NHLBI-APNEA","AASM-EDU","CDC-SLEEP"],keyTerms:["Postpartum","Perimenopause","Restless legs syndrome","Nocturia"]}],zf=[{id:17,part:4,title:"Building a Consistent Sleep Routine",subtitle:"Anchors, wind-down time and routines that survive real life",minutes:10,objectives:["Explain why regular wake times act as the strongest daily anchor for sleep.","Design a wind-down routine that suits your own circumstances.","Maintain consistent habits without perfectionism when schedules are irregular."],figure:{kind:"flow",title:"A wind-down routine timeline (adaptable)",caption:"An adaptable sequence for the evening and morning. Times are examples. Choose steps that suit your home, responsibilities and preferences, and skip any that are not possible.",alt:"Vertical flow of eight steps: consistent wake time, morning daylight, daytime movement, caffeine window, wind-down period starting about an hour before bed, dim lights and calm activity, bedtime when sleepy, and returning to the same wake time.",steps:["Consistent wake time","Morning daylight","Daytime movement","Caffeine window (personal)","Wind-down period, about 30–60 minutes","Dim lights and calm activity","Bed when sleepy","Same wake time next day"],vertical:!0},sections:[{heading:"Regular wake times",paras:["Regular wake times are often the most useful anchor for a sleep routine. Waking at a similar time each day helps the body clock stay aligned and makes sleep pressure build more predictably. Bedtime is harder to control directly because falling asleep depends on sleep pressure and arousal, so many people find that a steady wake time gradually improves sleep onset."],evidence:{level:"developing",text:"Regular timing is associated with better sleep in observational and some experimental studies. The best wake time for each person depends on responsibilities and chronotype."}},{heading:"Bedtime consistency and going to bed when sleepy",paras:["Going to bed when you feel sleepy, rather than when you feel you ought to be asleep, is advised in insomnia guidance from the NHS. Lying in bed for long periods without sleep can strengthen an association between bed and wakefulness, which is one reason behavioural approaches such as stimulus control are used in cognitive behavioural therapy for insomnia (Chapter 33)."],evidence:{level:"established",text:"Going to bed when sleepy and leaving bed when awake for long periods are standard elements of behavioural insomnia treatment (NHS and CBT-I guidance)."}},{heading:"Wind-down activities",paras:["A wind-down period, often 30 to 60 minutes, can help the mind move from activity to rest. NHS self-help guidance suggests relaxing for at least an hour before bed, for example by taking a bath or reading a book. Helpful activities are usually calm, low in stimulation and enjoyable: gentle stretching, a shower, reading on paper, quiet conversation, or simple breathing practice (Chapter 31)."],evidence:{level:"developing",text:"Wind-down routines are supported as practical habits. Trial evidence for specific routines is limited, and their benefit varies between people."}},{heading:"Managing irregular schedules",paras:["Some people cannot keep fixed hours because of shift work, caregiving, study or changing jobs. In these cases, keeping a consistent sleep window within the constraints available may be more useful than trying to match an ideal timetable. Chapters 10, 43 and 46 discuss irregular schedules in more detail."],evidence:{level:"traditional",text:"Approaches for irregular schedules draw on chronobiology principles and clinical experience, and specific strategies vary by occupation."}},{heading:"Routine without perfectionism",paras:["A routine should reduce stress rather than create it. Missing a day or waking early once does not undo progress. Gentle consistency, applied most days, is more sustainable than strict rules. The aim is to build a pattern that is realistic, flexible and supportive, and to review it periodically (Chapter 42)."],evidence:{level:"traditional",text:"Recommendations about routine flexibility reflect practical sleep education rather than a single validated protocol."}}],misconceptions:[{claim:"You must go to bed at exactly the same time every night.",reality:"Consistency helps, but small variations are normal. Large, repeated shifts are more likely to cause problems than occasional differences."},{claim:"A bedtime routine has to be long and elaborate.",reality:"Short, simple, calm routines often work better than complex rituals that become another source of stress."},{claim:"If you do not sleep within 20 minutes, you have failed.",reality:"Falling asleep takes time for many people. Getting up and doing something calm until sleepy is often advised in behavioural guidance."}],takeaways:["A steady wake time is the most useful daily anchor for most people.","Go to bed when sleepy and keep a calm, short wind-down period.","Flexibility and self-compassion are part of a sustainable routine."],refs:["NHS-INSOMNIA","AASM-EDU","QASEEM-2016"],keyTerms:["Sleep hygiene","Stimulus control","Wind-down","Sleep window"]},{id:18,part:4,title:"Exercise and Physical Activity",subtitle:"Regular movement, timing, intensity and individual responses",minutes:10,objectives:["Describe how regular physical activity relates to sleep in research.","Compare aerobic, resistance and gentle movement in terms of sleep relevance.","Explain why universal timing rules for exercise are not well supported."],figure:{kind:"bars",title:"WHO adult activity guidance (minutes per week)",caption:"Summary of World Health Organization guidance for adults aged 18 to 64 (2020). Activity supports general health, and its effect on sleep is an additional, variable benefit rather than a guarantee.",alt:"Bar chart of WHO 2020 adult guidance in minutes per week: moderate aerobic activity 150 minutes at minimum and 300 minutes for additional benefit; vigorous aerobic activity 75 minutes at minimum. Muscle-strengthening activity on two or more days is also recommended.",unit:"minutes per week",max:300,items:[{label:"Moderate aerobic (minimum)",value:150,note:"Or equivalent vigorous activity"},{label:"Vigorous aerobic (minimum)",value:75,note:"Alternative to moderate activity"},{label:"Moderate aerobic (higher)",value:300,note:"For additional health benefit"}]},sections:[{heading:"Physical activity and sleep",paras:["Regular physical activity is associated with better self-reported sleep quality and, in some studies, with shorter time to fall asleep. Sleep and activity appear to reinforce each other: activity can help sleep, and better sleep supports the energy to stay active. Some people with insomnia find that exercise helps their symptoms, but it is not a replacement for other treatments."],evidence:{level:"developing",text:"Associations between physical activity and sleep are consistent in observational research and some trials, with benefits that vary by population and measure."}},{heading:"Aerobic activity, resistance training and gentle movement",paras:["Aerobic activity such as brisk walking, cycling, swimming or dancing supports cardiovascular fitness and is the form most often studied for sleep. Resistance training builds strength and can be combined with aerobic activity. Gentle movement, including walking, stretching, tai chi and yoga, may be especially suitable for older adults, people in recovery from illness, or those with pain."],evidence:{level:"developing",text:"Several trials and reviews report small to moderate sleep benefits from exercise programmes, but the quality of evidence varies."}},{heading:"Timing and intensity",paras:["Advice on exercise timing is inconsistent. NHS guidance notes that exercising close to bedtime can make it harder to sleep for some people, and suggests avoiding vigorous exercise in the hours before bed. Others find that an evening workout relaxes them. Individual responses differ, so the best timing is the one that allows sleep to follow comfortably. If evening exercise disturbs sleep, moving it earlier is a reasonable experiment."],evidence:{level:"uncertain",text:"Evidence on the optimal exercise time for sleep is mixed and does not support a universal rule."}},{heading:"Exercise, recovery and balance",paras:["Physical recovery needs adequate sleep, and very high training loads without rest can reduce sleep quality and performance. Athletes and active people may benefit from monitoring their sleep, planning rest days and speaking with a sports medicine professional if sleep problems persist (Chapter 45)."],evidence:{level:"developing",text:"Links between training load, recovery and sleep are supported in sports science research, but individual thresholds vary."}}],misconceptions:[{claim:"Exercising late always prevents sleep.",reality:"Responses vary. Many people sleep well after evening exercise, while others find vigorous activity close to bedtime stimulating."},{claim:"More exercise is always better for sleep.",reality:"Sustained very high training loads without recovery can disturb sleep. Balance matters."},{claim:"Exercise cures insomnia.",reality:"Exercise can help some people, but it is not a cure. Persistent insomnia should be assessed (Chapter 33)."}],takeaways:["Regular physical activity is associated with better sleep for many people.","A mix of aerobic, strength and gentle movement suits different needs.","Timing should be tested on your own experience rather than set by a universal rule."],refs:["WHO-PA","NHS-INSOMNIA","AASM-EDU"],keyTerms:["Aerobic activity","Resistance training","Recovery","Sedentary behaviour"]},{id:19,part:4,title:"Food, Nutrition and Sleep",subtitle:"Meal timing, dietary patterns and what research does and does not show",minutes:11,objectives:["Describe the general, mainly observational relationship between diet and sleep.","Explain how meal timing and digestive comfort can influence sleep.","Evaluate claims about tryptophan, specific foods and sleep."],figure:{kind:"flow",title:"General pathways linking food and sleep (hypothetical links)",caption:"A simplified map of pathways studied in nutrition and sleep research. Several links are plausible but unproven, and no single food or pathway explains sleep.",alt:"Flow diagram of general pathways: eating pattern and meal timing feed into digestion and comfort, hormone signals of hunger and fullness, blood glucose changes, and gut-brain signalling; these may influence sleep onset and sleep quality, while overall diet quality is associated with sleep in observational studies.",steps:["Eating pattern and meal timing","Digestion and comfort","Hunger and fullness hormones","Blood glucose changes","Gut–brain signalling","Sleep onset and quality"]},sections:[{heading:"The general relationship",paras:["Observational studies report associations between diet quality, meal patterns and sleep, including links with short or very long sleep and poor sleep quality. These studies cannot easily show direction of effect: poor sleep can change food choices, and diet is linked with many other lifestyle factors. The most reliable conclusion is that healthy eating and regular sleep are both part of general wellbeing."],evidence:{level:"developing",text:"Diet and sleep are associated in many observational studies, but causal effects are not well established."}},{heading:"Meal timing and digestive comfort",paras:["A large, rich or spicy meal close to bedtime can cause discomfort, heartburn or indigestion for some people, which can make it harder to fall asleep. The NHS advises against eating a big meal late at night. Eating a moderate evening meal earlier, and allowing time to digest before lying down, is a practical approach. People with reflux or medical conditions should follow clinical advice."],evidence:{level:"established",text:"Late heavy meals causing discomfort are widely recognised. Individual tolerance differs."}},{heading:"Balanced eating patterns and nutrient adequacy",paras:["Balanced eating patterns that include vegetables, fruit, whole grains, pulses, nuts and sources of protein are generally recommended for health. Nutrient deficiencies can affect general wellbeing and, in some cases, sleep. For example, iron deficiency is associated with restless legs symptoms, and iron status should be checked by a clinician rather than self-treated (Chapter 35). Books 07, 10 and 02 in the HERBULANCE collection discuss meal planning, vitamins and minerals, and digestive health in more depth."],evidence:{level:"established",text:"Balanced eating and adequate nutrition support health. The link between specific nutrient deficiencies and sleep varies by nutrient."}},{heading:"Tryptophan, serotonin and melatonin",paras:["Tryptophan is an amino acid that the body uses to make serotonin, which is in turn a precursor to melatonin. This pathway is real, but it does not mean that eating tryptophan-containing foods reliably causes sleepiness. Tryptophan competes with other amino acids to enter the brain, and the effects of food on brain tryptophan are complex. Some studies of carbohydrate-containing meals suggest small effects, but results are inconsistent. Turkey is often blamed for post-meal sleepiness, yet large meals in general and alcohol are more plausible contributors."],evidence:{level:"uncertain",text:"The biochemical pathway is established, but the effect of dietary tryptophan on sleep in real life is small or inconsistent."}},{heading:"What research does and does not show",paras:["There is preliminary research on specific foods, such as kiwifruit and tart cherry, reporting small sleep benefits in limited trials. These findings are not strong enough to recommend them as sleep treatments, and they should not replace evidence-based care. Supplements and 'sleep foods' marketed for sleep should be treated with caution, and no single food guarantees better sleep."],evidence:{level:"preliminary",text:"Small trials of specific foods are interesting but limited in size and quality."}}],misconceptions:[{claim:"Turkey makes you sleepy.",reality:"A big meal and alcohol are more plausible causes of post-meal drowsiness. Tryptophan effects from food are small and inconsistent."},{claim:"One food can cure insomnia.",reality:"No single food has been shown to cure insomnia. Sleep problems are multi-factorial."},{claim:"Going to bed hungry is the best way to sleep.",reality:"Severe hunger can be disruptive for some people, and moderate evening eating is compatible with good sleep for many."}],takeaways:["Diet and sleep are linked, but the relationship is mainly observational and multi-directional.","Large late meals may disturb sleep; a moderate evening meal earlier is a practical approach.","No single food guarantees better sleep, and nutritional gaps should be checked with a clinician."],refs:["NHS-INSOMNIA","IRWIN-2015","ALLEN-2014"],keyTerms:["Tryptophan","Serotonin","Meal timing","Reflux"],related:"Book 02 (Gut Health & Digestion Guide), Book 07 (Meal Planning, Balanced Nutrition & Everyday Food Preparation) and Book 10 (Food Nutrition, Vitamins, Minerals & Essential Nutrients) explore nutrition in more depth."},{id:20,part:4,title:"Caffeine and Stimulants",subtitle:"How caffeine blocks adenosine, where it hides, and how timing and sensitivity matter",minutes:10,objectives:["Explain how caffeine interacts with adenosine receptors.","Identify common caffeine sources and their approximate effect on daily intake.","Describe how timing, individual sensitivity and age influence caffeine’s effects on sleep."],figure:{kind:"flow",title:"How caffeine interferes with sleep pressure",caption:"A simplified explanation. Caffeine does not remove sleep pressure; it blocks the signal, so the body may feel less sleepy while sleep pressure still builds.",alt:"Flow diagram: caffeine is absorbed; it blocks adenosine receptors; alertness rises; adenosine continues to build up; caffeine is gradually cleared over several hours; sleep may be lighter or later if caffeine is still active at bedtime.",steps:["Caffeine absorbed","Blocks adenosine receptors","Alertness rises","Adenosine keeps building","Caffeine cleared over hours","Lighter sleep if still active at bedtime"]},sections:[{heading:"How caffeine works",paras:["Adenosine accumulates in the brain during wakefulness and contributes to sleep pressure (Chapter 2). Caffeine is structurally similar to adenosine and blocks its receptors, so the brain receives less of the 'time to rest' signal. This increases alertness, but it does not reduce the underlying build-up of adenosine."],evidence:{level:"established",text:"Caffeine’s action as an adenosine receptor antagonist is well established."}},{heading:"Sources of caffeine",paras:["Caffeine is found in coffee, tea (black, green and others), cola, energy drinks, chocolate and some cold and pain remedies. Some 'caffeine-free' products contain small amounts, and some energy drinks and supplements contain high doses. Labels may list caffeine in different units, and sources may be hidden in combined products. Check labels, especially if you are sensitive, pregnant, or caring for children."],evidence:{level:"established",text:"Caffeine content varies widely between products. Labelling and regulation vary by country."}},{heading:"Timing, duration and individual sensitivity",paras:["Caffeine is absorbed over minutes to an hour and then cleared from the body gradually. Its half-life varies widely between people; in healthy adults it is often several hours, with substantial individual variation. Laboratory studies show that caffeine taken several hours before bedtime can reduce total sleep time and deepen sleep disturbance, even in people who report no sense of being wakeful. Genetics, liver metabolism, medicines and habitual use all influence sensitivity.","Because sensitivity varies, there is no universal safe cut-off time. Many people find that afternoon or evening caffeine affects sleep, while others tolerate it well. Experimenting carefully with timing can help, particularly if sleep is difficult."],evidence:{level:"developing",text:"Caffeine’s effects on sleep are established in laboratory studies. Individual cut-off times vary and are not universal."}},{heading:"Age, pregnancy and special circumstances",paras:["Children and adolescents generally should consume less caffeine, and energy drinks are not suitable for children. During pregnancy, the NHS advises limiting caffeine, with a commonly cited upper level of about 200 mg per day. People who are breastfeeding, have heart conditions, anxiety, reflux or take certain medicines should seek advice on caffeine intake. Older adults may be more sensitive to its effects on sleep."],evidence:{level:"safety",text:"Caffeine guidance differs for children, pregnancy and medical conditions. Discuss personal limits with a clinician or pharmacist."}}],misconceptions:[{claim:"Coffee after dinner has no effect on sleep.",reality:"Caffeine can still be active hours later in many people, and sleep may be affected even when it does not feel like it."},{claim:"Caffeine removes tiredness, so it fixes sleep problems.",reality:"Caffeine masks sleepiness but does not replace sleep, and it can worsen sleep if used late."},{claim:"Decaf is completely caffeine-free.",reality:"Decaffeinated drinks contain small amounts of caffeine, which may matter for some people."}],takeaways:["Caffeine blocks adenosine signalling and makes you feel alert without reducing sleep pressure.","Caffeine can be hidden in drinks, foods and medicines, so check labels.","Because sensitivity varies, personal awareness of timing is more useful than a universal cut-off."],refs:["AASM-EDU","NHS-INSOMNIA","BORBELY-1982"],keyTerms:["Adenosine","Caffeine","Half-life","Adenosine receptor"]},{id:21,part:4,title:"Alcohol, Nicotine and Other Substances",subtitle:"Why substances should never be used as sleep treatments",minutes:11,objectives:["Explain how alcohol changes sleep architecture across the night.","Describe how nicotine and other stimulants can disturb sleep.","Recognise safety considerations for alcohol, recreational substances and medicines."],figure:{kind:"compare",title:"Early-night sedation versus later-night disruption",caption:"Simplified description of common findings for alcohol. The effect depends on dose, timing, body weight, health conditions and tolerance. No amount of alcohol is recommended as a sleep aid.",alt:"Two-column comparison. Early in the night, alcohol can make people feel drowsy and may increase deep sleep. Later in the night, alcohol can fragment sleep, suppress REM sleep, worsen snoring and breathing pauses, and cause early waking.",columns:[{title:"Early night",items:["Feels sedating and may speed sleep onset","Can increase deep (N3) sleep at first","Often reduces the quality of the second half of the night"]},{title:"Later night",items:["REM sleep may be suppressed","Sleep becomes fragmented","Snoring and breathing pauses may worsen","Early waking and dehydration-related thirst are common"]}]},sections:[{heading:"Alcohol and sleep architecture",paras:["Alcohol can make people feel drowsy and may shorten the time taken to fall asleep. However, as it is metabolised during the night, sleep often becomes lighter and more fragmented, with reduced REM sleep and more awakenings in the second half of the night. Alcohol also relaxes the throat muscles, which can worsen snoring and sleep apnoea. Regular use can worsen sleep over time and is associated with dependence in some people."],evidence:{level:"established",text:"The effects of alcohol on sleep architecture, particularly REM suppression and fragmentation in the second half of the night, are well supported."}},{heading:"Nicotine and smoking",paras:["Nicotine is a stimulant. Smoking close to bedtime, or waking at night with cravings, can delay sleep and disturb it. Nicotine withdrawal can also cause restlessness and night-time waking. Smoking is associated with insomnia and sleep-disordered breathing in observational research. Stopping smoking can be difficult, and support is available through health services in many countries."],evidence:{level:"developing",text:"Associations between smoking and sleep problems are reported in many studies, though causal pathways are complex."}},{heading:"Recreational substances",paras:["Cannabis, stimulants, sedatives and other recreational drugs can alter sleep in different ways. Some produce stimulation, others sedation, and many cause rebound effects when they wear off. Dependence can develop, and withdrawal may cause insomnia and anxiety. People using these substances to manage sleep should talk to a health professional. Stopping certain sedative substances abruptly can be dangerous, so seek medical guidance."],evidence:{level:"safety",text:"Never use alcohol or recreational substances as sleep treatments. Seek medical advice about dependence and withdrawal."}},{heading:"Medicines and withdrawal",paras:["Many medicines can affect sleep, including some for blood pressure, asthma, depression and pain. Some sleep medicines, including sedating antihistamines and prescription sleep medicines, carry risks of dependence, next-day drowsiness and interactions with alcohol. Withdrawal from long-term sedatives or alcohol needs medical supervision. Never stop or change prescribed medicines without speaking to the prescriber."],evidence:{level:"safety",text:"Mixing alcohol with sedating medicines can be dangerous, including for breathing. This section is educational and not individual medical advice."}}],misconceptions:[{claim:"Alcohol is an effective sleep aid.",reality:"Alcohol may make you drowsy at first but disrupts sleep later. It is not a treatment for sleep problems."},{claim:"A nightcap is harmless if you only have one.",reality:"Even modest amounts can affect sleep architecture and breathing, especially in people with snoring or sleep apnoea."},{claim:"Nicotine helps you relax and sleep.",reality:"Nicotine is a stimulant. Smoking late or waking with cravings can disturb sleep."}],takeaways:["Alcohol fragments sleep and suppresses REM sleep later in the night, and worsens snoring and breathing.","Nicotine and many recreational substances are stimulants or cause rebound disturbance.","Substances should never be used to treat sleep problems; seek professional help for dependence or withdrawal."],refs:["NHS-INSOMNIA","NHLBI-APNEA","AASM-EDU"],keyTerms:["REM suppression","Rebound insomnia","Withdrawal","Dependence"]},{id:22,part:4,title:"Hydration and Night-Time Comfort",subtitle:"Drinking enough during the day while limiting night-time disruption",minutes:9,objectives:["Explain why hydration matters for general health and how needs vary.","Describe how evening drinking can cause night-time waking for some people.","Identify medical circumstances that require individual fluid advice."],figure:{kind:"compare",title:"Daytime hydration and evening fluid timing",caption:"General guidance only. Fluid needs depend on climate, activity, health and medicines. People with heart, kidney, liver or fluid-balance conditions should follow clinical advice.",alt:"Two-column comparison. Daytime hydration through regular drinks and water-rich foods is generally encouraged. Large drinks in the hour or two before bed may increase night-time bathroom trips for some people.",columns:[{title:"Daytime hydration (generally encouraged)",items:["Drink regularly through the day","Adjust intake in hot weather or during exercise","Use water-rich foods such as fruit and vegetables"]},{title:"Late evening (may disrupt sleep)",items:["Large drinks shortly before bed","Caffeinated or alcoholic drinks","Fluids taken in a rush before lying down"]}]},sections:[{heading:"Hydration and general health",paras:["Water is needed for many body processes, and fluid needs vary with climate, body size, physical activity, illness and pregnancy. Mild dehydration can cause thirst, headaches and reduced concentration, which may affect how alert you feel. Universal daily targets, such as eight glasses of water, are not well supported by evidence, and national guidance gives general ranges rather than fixed quotas."],evidence:{level:"uncertain",text:"Individual fluid needs vary widely. Universal daily quotas lack strong evidence."}},{heading:"Evening drinks and night-time waking",paras:["Drinking a large volume in the hours before bed can lead to waking to urinate. For some people, moderating fluid intake in the late evening, while still drinking enough during the day, may reduce interruptions. Caffeinated and alcoholic drinks may also increase urine production or disturb sleep, as discussed in Chapters 20 and 21."],evidence:{level:"developing",text:"Practical links between evening fluids and night-time waking are plausible and commonly reported, though the magnitude varies."}},{heading:"When night-time urination needs assessment",paras:["Frequent night-time urination, known as nocturia, can have many causes, including diabetes, urinary tract infection, enlarged prostate, heart or kidney conditions, sleep apnoea, pregnancy and some medicines. Waking to urinate two or more times a night, especially with thirst, tiredness or other symptoms, deserves medical assessment. Do not restrict fluids significantly without advice."],evidence:{level:"safety",text:"Persistent nocturia should be assessed by a clinician, particularly when accompanied by other symptoms."}}],misconceptions:[{claim:"You must drink eight glasses of water every day.",reality:"Fluid needs vary. Eight glasses is a popular rule of thumb, not a scientifically fixed requirement."},{claim:"Restricting all fluids in the evening will fix insomnia.",reality:"Some people benefit from moderating late-evening drinks, but fluid restriction is not a treatment for insomnia and can cause dehydration."},{claim:"Night-time urination is always caused by drinking too much.",reality:"Frequent night-time urination can have medical causes that need assessment."}],takeaways:["Stay adequately hydrated across the day, adjusting for climate and activity.","Moderating large or caffeinated drinks in the late evening may reduce night-time waking for some people.","Persistent night-time urination deserves medical advice rather than self-restriction."],refs:["AASM-EDU","NHLBI-DEP"],keyTerms:["Hydration","Nocturia","Diuresis"]},{id:23,part:4,title:"Naps and Daytime Rest",subtitle:"Why humans nap, how to nap wisely, and when daytime sleepiness needs assessment",minutes:10,objectives:["Explain why naps occur and how they relate to sleep pressure and circadian timing.","Compare the effects of short and longer naps.","Recognise cultural and occupational contexts for napping and identify when assessment is needed."],figure:{kind:"bars",title:"Nap length and its typical considerations",caption:"General guidance for healthy adults. A short nap can improve alertness for many people, while longer or late naps are more likely to affect night sleep or cause grogginess.",alt:"Bar chart of nap durations in minutes: a brief nap of 10 to 20 minutes, a nap of about 30 minutes, and a longer nap of around 60 to 90 minutes. Shorter naps are shown as more likely to avoid grogginess, while longer naps may cause grogginess and affect night sleep.",unit:"minutes",max:90,items:[{label:"Brief nap",value:20,note:"Often a useful alertness boost"},{label:"Medium nap",value:45,note:"Risk of grogginess for some people"},{label:"Long nap",value:90,note:"May reduce night sleep if late"}]},sections:[{heading:"Why humans nap",paras:["Naps can occur because sleep pressure has built up, or because the circadian system signals a natural dip in alertness, often in the early afternoon. Many people feel sleepy after a heavy lunch, though this is also influenced by the body clock. Napping is a biological response, not simply a lapse of discipline."],evidence:{level:"established",text:"The early-afternoon dip in alertness is supported by circadian research, and naps are common across cultures."}},{heading:"Short and longer naps",paras:["Brief naps of around 10 to 20 minutes are often associated with improved alertness and less grogginess on waking. Longer naps can bring deeper sleep and may cause sleep inertia, the temporary grogginess that follows waking from deep sleep. Late-afternoon or evening naps are more likely to reduce sleep pressure at night, which may delay bedtime or disturb sleep."],evidence:{level:"developing",text:"Laboratory and field studies support short-nap benefits for alertness. The optimal duration varies with the task and the individual."}},{heading:"Cultural differences and everyday napping",paras:["Napping has deep cultural roots in many places. Many countries in Southern Europe and Latin America have traditions of a midday rest or siesta, which may be shorter or may be being reshaped by modern work patterns. In Japan, the concept of inemuri describes brief sleep taken while present in a public or working setting. In many parts of East and South Asia, a short lunchtime rest is common. These traditions show that daytime rest can be a normal part of life, not just a sign of insufficient night sleep."],evidence:{level:"traditional",text:"Cultural napping practices vary widely and are described in ethnographic and public health sources, rather than being evaluated in controlled trials."}},{heading:"Shift work and napping strategies",paras:["For night-shift workers, planned naps before or during a shift can reduce sleepiness, particularly where safety is important. Chapter 43 explores strategic napping and shift-work safety in more depth. Workplaces and individuals should consider occupational health advice when shift patterns create persistent fatigue."],evidence:{level:"developing",text:"Strategic napping supports alertness in shift work, though its benefit depends on timing and context."}},{heading:"When daytime sleepiness needs assessment",paras:["If you feel sleepy most days despite adequate night sleep, fall asleep unintentionally during conversations, meetings or driving, or find that naps do not refresh you, seek professional advice. Excessive daytime sleepiness can be linked with sleep apnoea, narcolepsy, insomnia, medicines, depression and other conditions (Chapter 38)."],evidence:{level:"safety",text:"Drowsiness while driving is dangerous. Do not drive when sleepy, and seek assessment for persistent excessive sleepiness."}}],misconceptions:[{claim:"Napping is always unhealthy.",reality:"Short, timely naps can be beneficial for many people. Long, late or very frequent naps may signal a problem worth discussing."},{claim:"A nap always makes you more alert.",reality:"Longer naps can leave you groggy, and naps late in the day can disrupt night sleep."},{claim:"Naps are only for lazy people.",reality:"Naps are biologically normal and are part of many cultures and working lives."}],takeaways:["Short naps can help alertness; longer or late naps may cause grogginess or disturb night sleep.","Napping traditions differ widely, and daytime rest can be a normal part of life.","Persistent excessive daytime sleepiness, and any drowsiness while driving, need assessment."],refs:["AASM-EDU","NHS-INSOMNIA","NHLBI-DEP"],keyTerms:["Nap","Sleep inertia","Siesta","Inemuri","Sleepiness"]}],Hf=[{id:24,part:5,title:"Creating a Sleep-Friendly Bedroom",subtitle:"Practical environmental factors and low-cost improvements for every kind of home",minutes:11,objectives:["Assess a bedroom against the main environmental factors affecting sleep.","Identify low-cost improvements that suit shared rooms and limited space.","Recognise that not every household can achieve ideal conditions, and plan within constraints."],figure:{kind:"grid",title:"A sleep-friendly bedroom at a glance",caption:"A conceptual overview of environmental factors. Use it as a checklist, adapting each item to what your home allows.",alt:"Grid of seven cards: light, noise, temperature, air and ventilation, privacy, cleanliness, and comfort. Each card has a short description of a sleep-supporting measure.",items:[{title:"Light",text:"Keep the sleep area as dark as practical; use curtains, a covered window or an eye mask."},{title:"Noise",text:"Reduce or mask disruptive sound with rugs, door seals, fans or earplugs where safe."},{title:"Temperature",text:"Aim for a cool, comfortable room using ventilation, bedding and fans."},{title:"Air and ventilation",text:"Open windows when safe and reduce dust, smoke and damp."},{title:"Privacy",text:"Create a small personal zone, even behind a screen or curtain."},{title:"Cleanliness",text:"Wash bedding regularly and reduce dust and clutter."},{title:"Comfort",text:"Support the body with a mattress and pillows that suit you."}]},sections:[{heading:"Why the environment matters",paras:["The bedroom is where most people spend a large share of their sleep time, so its conditions can strongly influence how easily they fall asleep and how often they wake. Noise, light, temperature and comfort are the main factors. Their effects vary between individuals, and they interact with stress, health and schedules."],evidence:{level:"established",text:"Noise, light and temperature are well-established influences on sleep in research and clinical guidance."}},{heading:"Light, noise and temperature",paras:["Light and noise are discussed in detail in Chapter 27. Temperature is covered in Chapter 25. In practice, small changes often help: placing the bed away from a noisy window, using blinds or thick curtains, moving a phone charger away from the bed, or keeping bedding breathable. Where a room is very hot, cold, damp or noisy, environmental change may need landlord, employer or community support."],evidence:{level:"developing",text:"The benefit of individual environmental changes varies, and combined changes often work better than single measures."}},{heading:"Air quality, cleanliness and allergies",paras:["Ventilation influences comfort and air quality. Stuffy rooms can feel warmer and more uncomfortable, and damp or mould can affect breathing and allergies. Dust mites, pet dander and pollen can trigger allergy symptoms that disturb sleep. Regular washing of bedding in hot water where appropriate, vacuuming, reducing clutter and controlling damp are practical steps. Allergy symptoms that persist should be discussed with a clinician."],evidence:{level:"developing",text:"Links between damp, allergens and sleep disturbance are plausible and reported, but the size of effect varies."}},{heading:"Shared rooms, limited space and low-cost improvements",paras:["Many people share bedrooms, live in multigenerational households, or use a living room for sleep. In these conditions, consider sleep schedules that respect everyone’s needs, a simple curtain or screen to create a sleep zone, a fan for moving air, and agreements about lights and phones at night. Low-cost options include draught excluders, reflective window film, door sealing strips and reusing existing fabrics as light-blocking curtains."],bullets:["Use a free-standing screen or curtain to create a sleep zone.","Agree quiet hours and screen-free times with household members.","Move the bed away from light sources or draughts when possible.","Use a small, safe nightlight for night-time bathroom trips."],evidence:{level:"traditional",text:"Low-cost measures are based on general environmental principles and practical experience."}}],misconceptions:[{claim:"A perfect sleep environment is required for good sleep.",reality:"Many people sleep well in imperfect conditions. Improvements are helpful, but they are not a precondition for rest."},{claim:"Expensive products are essential for a good bedroom.",reality:"Many effective measures are low cost. Expensive products are not always more effective."},{claim:"If you cannot control your bedroom, you cannot sleep well.",reality:"Structural constraints are real. Planning within them, and seeking support where possible, is often the best approach."}],takeaways:["Light, noise, temperature, air, privacy, cleanliness and comfort all shape sleep.","Low-cost, incremental changes are often as effective as expensive ones.","Constraints such as shared housing deserve practical planning and, where needed, support from others."],refs:["AASM-EDU","NHS-INSOMNIA","NHLBI-DEP"],keyTerms:["Sleep environment","Ventilation","Dust mite","Sleep zone"]},{id:25,part:5,title:"Temperature and Thermal Comfort",subtitle:"How the body loses heat at night and how to stay comfortable safely in any climate",minutes:10,objectives:["Explain the body’s temperature rhythm and its role in sleep onset.","Describe practical, safe approaches for hot, humid, cold and heatwave conditions.","Recognise individual comfort differences and the special needs of infants and older adults."],figure:{kind:"flow",title:"How heat leaves the body as sleep begins",caption:"Simplified process. Warm hands and feet often indicate that blood vessels near the skin are open, helping the body release heat. This is one reason why a comfortable, cooler environment supports sleep onset.",alt:"Flow diagram: core body temperature begins to fall in the evening; blood vessels in hands and feet widen to release heat; sleep onset becomes easier; core temperature stays lowest in the early morning and rises towards waking.",steps:["Core temperature begins to fall","Blood flow to hands and feet increases","Heat released through the skin","Sleep onset becomes easier","Lowest core temperature in early morning","Temperature rises toward waking"]},sections:[{heading:"Thermoregulation during sleep",paras:["Core body temperature follows a daily rhythm that tends to fall in the evening and reach its lowest point in the early morning. Heat is released mainly through the skin, especially the hands and feet, when blood vessels there widen. This process helps the brain to transition into sleep. Sleep itself also changes thermoregulation, and people often find that they sweat or feel cold more easily while asleep."],evidence:{level:"established",text:"The role of skin heat loss and the nightly fall in core temperature in sleep onset is well supported in research."}},{heading:"Bedroom temperature and bedding",paras:["Most people sleep best in a room that feels cool and comfortable rather than hot or cold. Individual preferences differ widely, and there is no single 'ideal' temperature for everyone. Bedding should be breathable and adjustable, so that layers can be added or removed through the night. Light nightwear made from natural or breathable fabrics can help in warm conditions."],evidence:{level:"developing",text:"Thermal comfort strongly affects sleep, but the exact best temperature varies by person, age and climate."}},{heading:"Hot and humid climates",paras:["In hot climates, many people sleep poorly when nights remain warm. Practical measures include ventilation through open windows at cooler times, shading windows during the day, using fans to move air, sleeping on breathable bedding, drinking enough water and keeping the room as cool as possible. Where air conditioning is not available, cross-ventilation, cooling the room before bedtime through night-time air, and wet-cloth cooling of the forehead or wrists may help. Evidence for the latter is mostly traditional or anecdotal."],evidence:{level:"traditional",text:"Many cooling practices are widely used in hot climates. Their effectiveness varies, and some are based on practical experience rather than trials."}},{heading:"Cold climates and safe heating",paras:["In cold climates, warm bedding, insulation, draught-proofing and warm nightwear can help. Electric blankets and heaters should be used according to manufacturer instructions. Never use barbecues, gas cookers, or unvented heaters indoors to warm a room, as these can release carbon monoxide, a dangerous gas. Install and test carbon monoxide alarms where possible, and seek help if you feel unwell."],evidence:{level:"safety",text:"Carbon monoxide poisoning is a serious risk from unsafe heating appliances. Seek urgent medical help if you develop headache, dizziness or confusion with fuel appliances in use."}},{heading:"Heatwaves, infants and older adults",paras:["Heatwaves increase risks for infants, older adults, people with chronic illness and people working outdoors. Infants should be dressed lightly and kept at a comfortable temperature without overheating, following safe-sleep guidance. Older adults may have reduced heat tolerance and should be checked on during heat events. Medicines can affect body temperature regulation, so people taking them should seek advice in heat. Cooling centres, public advice and community support may be available in many areas."],evidence:{level:"safety",text:"Heat exposure can be dangerous. Seek medical help for severe heat illness symptoms such as confusion, fainting or very high temperature."}}],misconceptions:[{claim:"Colder rooms always produce better sleep.",reality:"Cool and comfortable is best for many people. A room that is too cold can disturb sleep and create health risks."},{claim:"Cold showers guarantee better sleep.",reality:"Evidence is limited. Some people find warm showers or baths before bed relaxing, and their effects depend on timing and individual response."},{claim:"Fans are dangerous to sleep with.",reality:"Fans can help comfort in hot weather. Avoid directing fans at infants’ faces, and follow national guidance on safe use."}],takeaways:["Core body temperature falls during the evening, and heat loss through the skin supports sleep onset.","Hot and cold climates need different strategies, and both must be used safely.","Heatwaves and carbon monoxide are serious risks that require immediate attention."],refs:["AASM-EDU","CDC-SLEEP","NHS-INSOMNIA"],keyTerms:["Thermoregulation","Vasodilation","Core body temperature","Carbon monoxide"]},{id:26,part:5,title:"Mattresses, Pillows and Bedding",subtitle:"Comfort, support, hygiene and avoiding unsupported product claims",minutes:9,objectives:["Describe what matters in mattress and pillow choice, and why preferences vary.","Explain how bedding can affect allergies and hygiene.","Evaluate marketing claims about sleep products critically."],figure:{kind:"grid",title:"Bedding choices and how to judge them",caption:"A practical guide. Expensive products are not necessarily better for sleep, and the most suitable option depends on the individual and budget.",alt:"Grid of six cards covering mattress support, pillow height and support, breathable bedding materials, washing and cleaning, allergy management, and sleep position preferences.",items:[{title:"Mattress support",text:"Look for a surface that keeps the spine reasonably aligned and that feels comfortable for your body."},{title:"Pillow",text:"Choose a height and firmness that keeps the head and neck comfortable in your usual position."},{title:"Materials",text:"Breathable cotton, linen or other fabrics suit many climates; choose wool or down with allergy considerations."},{title:"Cleaning",text:"Wash sheets and pillowcases regularly, following fabric instructions, and air mattresses and pillows."},{title:"Allergies",text:"Use dust-mite-resistant covers where helpful, and seek advice if allergy symptoms persist."},{title:"Preferences",text:"Different body shapes, pain patterns and sleep positions call for different setups."}]},sections:[{heading:"Mattress support and comfort",paras:["A mattress should support the body comfortably and allow the spine to remain reasonably aligned for the sleeper’s usual position. The best firmness varies by body size, sleep position, pain and personal preference. Studies comparing mattresses are often small and industry-funded, so claims about 'the best mattress' should be treated with caution."],evidence:{level:"uncertain",text:"Evidence on mattress types for sleep quality is limited and varies by study design and population."}},{heading:"Pillows and sleep positions",paras:["Pillow choice depends on how a person sleeps. Side sleepers usually need more height to keep the head aligned with the spine, while back sleepers often need less. People with neck pain or breathing problems should seek professional advice rather than relying on a particular pillow to solve the issue. No single sleeping position suits everyone, and no position cures medical conditions."],evidence:{level:"uncertain",text:"Comfort-based pillow advice is common, but evidence on specific pillow designs for sleep outcomes is limited."}},{heading:"Bedding materials, cleaning and allergies",paras:["Breathable fabrics help manage temperature and moisture. Regular washing of sheets and pillowcases reduces dust mites, sweat and skin cells. For people with allergies, dust-mite-proof covers can be useful, but they should be combined with other measures such as regular cleaning and humidity control. Persistent allergy, asthma or breathing symptoms should be assessed by a clinician."],evidence:{level:"developing",text:"Allergen-reduction measures show mixed results in trials, so combined approaches are usually recommended."}},{heading:"Judging product claims",paras:["Sleep products are often marketed with promises of 'better sleep', 'deep recovery' or 'natural calm'. Ask what evidence supports the claim, who funded the study, how many people were included and whether results were measured objectively. Be cautious with products that promise to cure sleep disorders. Chapter 39 covers medicines and supplements, which need even more scrutiny."],evidence:{level:"safety",text:"Products claiming to treat or cure sleep disorders should be checked with a health professional."}}],misconceptions:[{claim:"The most expensive mattress guarantees the best sleep.",reality:"Cost does not reliably predict comfort or sleep quality. Personal fit matters more."},{claim:"Everyone should sleep on their back for the best posture.",reality:"No single position is best for everyone. Comfort and personal circumstances matter."},{claim:"Changing your mattress will cure insomnia.",reality:"Bedding may improve comfort but is not a treatment for insomnia."}],takeaways:["Comfort and support matter more than price; personal fit is the main guide.","Regular cleaning and allergy-aware choices can reduce dust and allergen exposure.","Be sceptical of unsupported claims for sleep products."],refs:["NHS-INSOMNIA","AASM-EDU"],keyTerms:["Dust mite","Mattress support","Sleep position"]},{id:27,part:5,title:"Noise and Light Management",subtitle:"Environmental noise, shared housing, light control and affordable solutions",minutes:10,objectives:["Explain how noise and light affect sleep and when each matters most.","Compare curtains, eye masks and earplugs, including their safety considerations.","Identify when environmental interventions are insufficient and further help is needed."],figure:{kind:"compare",title:"Light and noise: a practical comparison",caption:"A simplified comparison. Light and noise can both fragment sleep, but the most effective measures differ and depend on the source and the person.",alt:"Two-column comparison of light and noise. Light sources include streetlights, early sunrise, phones and standby lights; solutions include blackout curtains and eye masks. Noise sources include traffic, neighbours, shared rooms and appliances; solutions include earplugs, sound-absorbing materials and white-noise devices.",columns:[{title:"Light",items:["Sources: streetlights, early sunrise, phones, standby lights","Solutions: blackout or lined curtains, eye masks, covering LEDs","Caution: keep nightlights low and safe for night-time walks"]},{title:"Noise",items:["Sources: traffic, neighbours, shared rooms, appliances","Solutions: earplugs, rugs, door seals, quiet appliances, white-noise devices","Caution: earplugs must not prevent hearing alarms, infants or emergencies"]}]},sections:[{heading:"Environmental noise and sleep",paras:["Noise can disrupt sleep through awakenings, shallow sleep and changes in heart rate, even when people do not fully wake up. Traffic, aircraft, trains, neighbours and night-time work nearby are common sources. The WHO’s guidance on night noise highlights the importance of keeping night-time noise levels low for healthy sleep. Individual sensitivity varies, and some people adapt to noise over time while others do not."],evidence:{level:"established",text:"Night-time noise is recognised by WHO guidance as a risk to sleep and health. The degree of harm depends on level, timing and individual sensitivity."}},{heading:"Street noise and shared households",paras:["In shared households, noise often comes from people rather than traffic. Agreed quiet hours, lower-volume devices after a certain time, and a shared plan for late-night activity can help. Where noise is a persistent problem, tenants can contact landlords or local housing services, and communities may have noise-management programmes."],evidence:{level:"developing",text:"Shared-household agreements and community noise programmes show practical promise, but evidence on specific approaches is limited."}},{heading:"Curtains, eye masks and earplugs",paras:["Lined or blackout curtains reduce light from outside and can help in bright summer evenings or early mornings. Eye masks are a low-cost option if they are comfortable. Earplugs reduce noise, but they can cause discomfort, ear irritation and should not be used if they stop you hearing alarms, emergencies, children or someone calling for help. Careful, correct use is important, and people with ear conditions should seek advice before using them."],evidence:{level:"developing",text:"Eye masks, curtains and earplugs can help some people, but trial evidence in everyday settings is mixed."}},{heading:"When environmental measures are not enough",paras:["If noise or light changes do not help, or if sleep disturbance is severe, there may be other causes such as stress, insomnia, sleep apnoea or medicines. Consider speaking with a clinician, particularly if sleep problems persist for several weeks or affect your health and safety."],evidence:{level:"safety",text:"Persistent sleep problems should be assessed rather than managed only by environmental adjustments."}}],misconceptions:[{claim:"You get used to noise, so it does not affect sleep.",reality:"Some adaptation occurs, but noise can still fragment sleep and affect how rested you feel."},{claim:"Earplugs make any noise problem disappear.",reality:"They help some people, but they can cause discomfort and should be used safely."},{claim:"Total darkness is essential.",reality:"A dark room is helpful, but a very dim, safe nightlight can be sensible for many people."}],takeaways:["Light and noise are both common sleep disruptors, and their solutions differ.","Affordable options include curtains, eye masks, earplugs and shared-household agreements, used safely.","Persistent disturbance deserves assessment, not only environmental fixes."],refs:["NHS-INSOMNIA","AASM-EDU","NHLBI-DEP"],keyTerms:["Night-time noise","White noise","Blackout curtain","Arousal"]},{id:28,part:5,title:"Technology and Screen Habits",subtitle:"Evidence-based digital boundaries for evenings, notifications and gaming",minutes:10,objectives:["Describe how evening screen use can affect sleep through light, stimulation and interruptions.","Evaluate screen settings, e-readers and gaming habits.","Apply realistic digital boundaries that fit work, study and social life."],figure:{kind:"grid",title:"Digital boundaries that fit real life",caption:"Practical options rather than rules. Choose changes that match your needs; screens are only one factor in sleep.",alt:"Grid of six cards offering digital boundary ideas: reduce brightness in the evening, set a device-free wind-down period, charge phones outside the bedroom, switch off non-essential notifications, plan late-night gaming and social media around sleep, and use paper books where practical.",items:[{title:"Dim the evening",text:"Lower brightness and use warmer display settings in the last hour before bed, if you use screens."},{title:"Wind-down window",text:"Plan a short screen-free period before bed, adjusted to what your work allows."},{title:"Charge elsewhere",text:"Keep phones out of arm’s reach so you are not tempted to check them in the night."},{title:"Quiet notifications",text:"Switch off non-essential alerts and set focus modes for evenings."},{title:"Plan gaming and scrolling",text:"Decide on a stopping time before you start, and avoid fast-paced content close to bed."},{title:"Paper alternatives",text:"Printed books or quiet audio can offer a calmer wind-down for many people."}]},sections:[{heading:"Evening device use and light",paras:["Devices emit light that can influence the body clock, especially when used at high brightness for long periods in the evening (Chapter 8). Laboratory evidence suggests that reading on a light-emitting device before bed can delay circadian timing and reduce alertness the next morning. Real-world effects depend on brightness, distance, duration and whether a person is in a dark room."],evidence:{level:"preliminary",text:"Light from devices can affect circadian timing in laboratory conditions. The real-world size of effect is not yet clear."}},{heading:"Psychological stimulation and interruptions",paras:["Exciting games, social media, work messages and news can keep the mind alert, make it harder to switch off and encourage prolonged use. Notifications can wake people and fragment sleep. Emotional content close to bedtime may increase arousal for some people. These mechanisms are often more important than light for many users."],evidence:{level:"developing",text:"Associations between evening screen engagement and later sleep are consistent, though causal effects vary by content and person."}},{heading:"Gaming, social media and e-readers",paras:["Gaming and social media can be enjoyable and socially valuable, but they can delay sleep when they replace it. E-readers that use backlit screens can have similar effects to other devices, while e-ink readers that do not emit light in the same way may be less stimulating. Screen settings such as night mode may help some people, but their effect on sleep is not fully established."],evidence:{level:"developing",text:"Night-mode and e-ink comparisons show mixed evidence. The value of these tools depends on use pattern."}},{heading:"Evidence-based digital boundaries",paras:["Boundaries are most effective when they are specific and realistic: a set stopping time, a charging location outside the bedroom, notification changes and a plan for urgent calls. Families and workplaces can agree on expectations for after-hours communication. Screens are one part of sleep health, and boundaries should be combined with routine, environment and stress management."],evidence:{level:"developing",text:"Digital boundary strategies show promising results in some studies, but the evidence base is still developing."}}],misconceptions:[{claim:"Screens are the single cause of poor sleep.",reality:"Screens are one of many factors. Stress, schedules, health and environment all matter."},{claim:"Night-mode settings solve the problem.",reality:"They may reduce some light exposure, but stimulation, timing and total use still matter."},{claim:"Switching to a tablet is always worse than paper.",reality:"The effect depends on brightness, duration, content and habits. Some devices are less disruptive than others."}],takeaways:["Evening screen use can affect timing through light and stimulation, though effects vary.","Practical boundaries include stopping times, charging elsewhere and reducing notifications.","Screens are one part of sleep health, not the whole picture."],refs:["CHANG-2015","BRAINARD-2001","AASM-EDU"],keyTerms:["Blue light","Night mode","Arousal","Notification"]},{id:29,part:6,title:"Stress and the Nervous System",subtitle:"How stress responses, the autonomic nervous system and cortisol shape sleep",minutes:11,objectives:["Describe the body’s stress response and its relationship with sleep.","Explain the roles of the sympathetic and parasympathetic branches of the autonomic nervous system.","Describe cortisol’s daily rhythm and the concept of hyperarousal."],figure:{kind:"flow",title:"The stress-response pathway and sleep",caption:"A simplified pathway. Acute stress is a normal and adaptive response. Persistent stress and hyperarousal can make falling and staying asleep harder.",alt:"Flow diagram: a stressor is perceived by the brain; the hypothalamic-pituitary-adrenal axis and sympathetic nervous system activate; heart rate and alertness rise and cortisol is released; if activation persists into the evening, arousal stays high; sleep onset and continuity may be disrupted.",steps:["Stressor perceived by the brain","Sympathetic activation","HPA axis releases cortisol","Heart rate and alertness rise","Arousal persists into evening","Sleep onset and continuity affected"]},sections:[{heading:"Stress responses",paras:["Stress activates the body’s threat-response systems, increasing heart rate, blood pressure, alertness and muscle tension. These responses are useful in short bursts, such as avoiding a hazard. Long-term or repeated stress can keep these systems active when they should be settling for sleep, creating a sense of being 'wired but tired'."],evidence:{level:"established",text:"The physiological stress response and its effects on alertness and arousal are well established."}},{heading:"The autonomic nervous system",paras:["The autonomic nervous system regulates involuntary functions. Its sympathetic branch prepares the body for action, while its parasympathetic branch supports rest, digestion and recovery. Sleep involves a shift towards parasympathetic activity, although the balance changes through the night, and REM sleep involves variable heart rate and breathing."],evidence:{level:"established",text:"The sympathetic and parasympathetic roles are standard physiology. Their precise patterns across sleep stages are subject to ongoing research."}},{heading:"Cortisol and daily rhythms",paras:["Cortisol is released by the adrenal glands under control of the hypothalamic-pituitary-adrenal (HPA) axis. Cortisol normally follows a daily rhythm, rising in the early morning and falling through the day and evening. A stress-related increase in evening cortisol can make the body feel more alert at bedtime. Cortisol is not a simple 'bad hormone'; it has important roles in energy and immune regulation."],evidence:{level:"established",text:"The daily rhythm of cortisol is well documented. Its relationship with insomnia is complex and still under study."}},{heading:"Hyperarousal and stress-related sleep disruption",paras:["Hyperarousal is a state of heightened mental and physical activation. People with hyperarousal may experience racing thoughts, muscle tension, heightened awareness of sounds and difficulty switching off. It is a common feature of stress-related insomnia and is a focus of cognitive behavioural approaches (Chapter 33). Practical stress management, including relaxation, activity and support, can reduce arousal over time."],evidence:{level:"developing",text:"Hyperarousal is a useful concept in insomnia research, and interventions targeting it show benefits in some trials."}}],misconceptions:[{claim:"All stress is harmful to sleep.",reality:"Short-term stress can be normal and sometimes helpful. Persistent stress is the greater risk."},{claim:"Cortisol is always bad for sleep.",reality:"Cortisol has essential roles and follows a daily rhythm. Problems arise when its pattern is disturbed."},{claim:"Relaxing on demand can instantly switch off your stress.",reality:"Stress responses take time to settle. Gradual practice works better than forced relaxation."}],takeaways:["Stress activates the sympathetic nervous system and cortisol, which are useful in short bursts.","Persistent arousal can make sleep onset and continuity harder.","Stress management and relaxation help reduce hyperarousal over time."],refs:["AASM-EDU","NHLBI-DEP","NHS-INSOMNIA"],keyTerms:["Autonomic nervous system","Sympathetic","Parasympathetic","Cortisol","Hyperarousal","HPA axis"]},{id:30,part:6,title:"Anxiety, Overthinking and Bedtime Worry",subtitle:"Cognitive arousal, rumination, performance pressure and practical responses",minutes:10,objectives:["Explain how cognitive arousal and rumination keep people awake.","Describe the concept of sleep-related performance anxiety.","Apply practical strategies such as writing and relaxation, and recognise when mental health support may help."],figure:{kind:"flow",title:"How worry can keep sleep away",caption:"A simplified cycle. Worry at bedtime can increase arousal, which makes sleep harder, which can then increase worry the next day. Breaking the cycle usually requires several approaches.",alt:"Circular flow of four steps: bedtime worry increases arousal; arousal makes sleep difficult; poor sleep increases daytime worry; daytime worry returns to bedtime worry. Breaking the loop includes writing thoughts down, relaxation practice and seeking support.",steps:["Bedtime worry raises arousal","Sleep becomes harder","Daytime worry increases","Worry returns to bedtime"]},sections:[{heading:"Cognitive arousal and rumination",paras:["Cognitive arousal means that the mind stays active, often with thoughts about the day, plans, or possible problems. Rumination is repetitive, unproductive thinking about the past or future. Both can increase physiological arousal and delay sleep onset. Many people experience some of this, particularly in stressful periods."],evidence:{level:"established",text:"Cognitive arousal and rumination are well-established features of insomnia and anxiety."}},{heading:"Anticipatory anxiety and performance pressure",paras:["Anticipatory anxiety about not sleeping can make sleep harder, creating a cycle of worry and wakefulness. Trying too hard to sleep, checking the clock, or calculating remaining hours can all increase frustration. Recognising this 'sleep effort' pattern is an important step in managing it (Chapter 33)."],evidence:{level:"established",text:"Sleep effort and performance pressure are recognised mechanisms in clinical insomnia models."}},{heading:"Writing and externalising thoughts",paras:["Writing down worries, plans or unfinished tasks before bed can help some people reduce bedtime rumination. Some people find a 'worry list' with an agreed time for problem-solving earlier in the day useful. Expressive writing about difficult experiences has been studied in other contexts with mixed results, so writing should be approached as a personal tool rather than a guaranteed treatment."],evidence:{level:"developing",text:"Writing and worry-planning show promising results in some studies, though the effects vary between people."}},{heading:"Relaxation and when to seek mental health support",paras:["Relaxation practices (Chapter 31) may reduce arousal for some people. If worry is intense, frequent, or interferes with daily life, or if you have thoughts of harming yourself, seek professional support promptly. Mental health services, general practitioners and local crisis lines can help. Insomnia and anxiety often occur together and can be treated together."],evidence:{level:"safety",text:"Persistent anxiety, depression or thoughts of self-harm require professional support and, in emergencies, immediate help from local services."}}],misconceptions:[{claim:"Bedtime worry is just a bad habit you can switch off.",reality:"Worry is driven by stress, biology and experience. Practical strategies help, but they may take time and support."},{claim:"Writing in a journal always fixes insomnia.",reality:"Writing can help some people, but it is not a universal treatment."},{claim:"If you cannot sleep, you should force yourself to try harder.",reality:"Trying harder often increases arousal. Calm, low-effort approaches are usually more helpful."}],takeaways:["Worry and rumination increase arousal and can make sleep harder.","Writing, worry planning and relaxation can help some people.","Intense or persistent worry deserves mental health support."],refs:["QASEEM-2016","AASM-EDU","MORIN-BENCA-2012"],keyTerms:["Rumination","Cognitive arousal","Sleep effort","Worry"]},{id:31,part:6,title:"Relaxation and Mind-Body Practices",subtitle:"Breathing, muscle relaxation, mindfulness and culturally varied practices",minutes:11,objectives:["Describe common relaxation methods and their proposed mechanisms.","Assess the strength of evidence for each practice.","Adapt practices safely for different bodies, conditions and abilities."],figure:{kind:"flow",title:"A slow-breathing practice (about five minutes)",caption:"A gentle, general practice. Breathing that is comfortable and unforced is the aim. Stop if you feel dizzy, breathless or unwell, and adapt for any breathing condition.",alt:"Vertical flow of five steps: sit or lie comfortably; breathe in gently through the nose for about four seconds; breathe out slowly through the nose or mouth for about six seconds; repeat for around five minutes; notice how the body feels.",steps:["Sit or lie comfortably","Breathe in gently for about four seconds","Breathe out slowly for about six seconds","Repeat for about five minutes","Notice how the body feels"],vertical:!0},sections:[{heading:"Slow breathing",paras:["Slow, steady breathing is a widely used relaxation technique. Some studies have examined breathing around six breaths per minute because it is associated with changes in heart rate variability, a measure linked with autonomic balance. Slow breathing is simple and low risk for most people, though it should be adapted for those with breathing conditions, dizziness or heart problems."],evidence:{level:"developing",text:"Slow-breathing effects on heart rate variability are reported in research, but links to sleep outcomes are less consistent."}},{heading:"Progressive muscle relaxation",paras:["Progressive muscle relaxation involves tensing and then releasing muscle groups in sequence, from feet to face or the reverse. The contrast can help people notice tension. Some studies report benefits for sleep, particularly in people with insomnia. People with injuries, pain or muscle conditions should adapt or avoid tensing particular areas."],evidence:{level:"developing",text:"Progressive muscle relaxation shows benefits in several trials, although quality varies and it is often used as part of wider programmes."}},{heading:"Mindfulness, meditation and gentle stretching",paras:["Mindfulness and meditation train attention towards present-moment experience without judgement. Some trials suggest modest benefits for sleep, particularly when combined with other approaches. Gentle stretching, when comfortable, may reduce muscle tension and support a calmer evening. Be cautious of intense stretching or breath holding without guidance."],evidence:{level:"developing",text:"Mindfulness-based approaches show promising but variable results for sleep in systematic reviews."}},{heading:"Yoga and culturally varied practices",paras:["Yoga, tai chi, qigong, and many traditional breathing and prayer practices across cultures are used to promote calm and rest. Their benefits may come from relaxation, movement, social connection and routine. Evidence for specific sleep outcomes is growing but still limited. Respect for cultural practices is important, and people should choose approaches that fit their values and abilities."],evidence:{level:"traditional",text:"Many culturally varied practices have long histories but limited high-quality trial evidence for sleep."}},{heading:"Evidence quality and safe adaptations",paras:["Relaxation practices are generally low risk, but they are not guaranteed to help. Adapt the
