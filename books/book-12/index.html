eep matters. Misleading: an early bedtime suits everyone, as chronotype varies. Uncertain: best timing for each person."},{claim:"9. Sleeping late always indicates laziness.",reality:"Supported: late chronotype is biologically based. Misleading: late sleep reflects laziness. Uncertain: how to best adapt schedules in individual cases."},{claim:"10. A wearable can accurately diagnose every sleep disorder.",reality:"Supported: wearables estimate sleep and trends. Misleading: they can diagnose sleep disorders. Uncertain: accuracy varies by device and by condition."},{claim:"11. Dreams only happen during REM sleep.",reality:"Supported: dreams are most vivid and common in REM. Misleading: dreams never occur outside REM; non-REM reports are often less vivid. Uncertain: the function of dreaming."},{claim:"12. One sleeping position is best for everyone.",reality:"Supported: comfort varies. Misleading: one position suits all bodies and conditions. Uncertain: position effects in specific medical conditions."},{claim:"13. Napping is always unhealthy.",reality:"Supported: short, well-timed naps can improve alertness. Misleading: all naps are harmful. Uncertain: long-term effects of regular long naps."},{claim:"14. Exercising late always prevents sleep.",reality:"Supported: vigorous exercise close to bedtime can be stimulating for some people. Misleading: it always prevents sleep. Uncertain: optimal timing."},{claim:"15. A single food can cure insomnia.",reality:"Supported: some foods have small trial effects. Misleading: a single food cures insomnia. Uncertain: effect sizes in everyday life."},{claim:"16. Sleep is wasted time that could be used productively.",reality:"Supported: sleep supports memory, attention and safety. Misleading: sleep is unproductive. Uncertain: exact contributions of specific stages to specific tasks."},{claim:"17. Melatonin is harmless because it is natural.",reality:"Supported: melatonin is a hormone with timing effects. Misleading: a hormone product is harmless for everyone. Uncertain: long-term safety in many uses."},{claim:"18. Blue-blocking glasses cure insomnia.",reality:"Supported: some light effects are established. Misleading: glasses are a treatment for insomnia. Uncertain: benefit for sleep outcomes, which is mixed."},{claim:"19. You can reset your body clock overnight.",reality:"Supported: light can shift the clock. Misleading: shifts are instant. Uncertain: exact rates in each person, which are usually gradual."},{claim:"20. You can store up sleep in advance for a late night.",reality:"Supported: extending sleep before a known restriction may help some people. Misleading: sleep can be banked like money. Uncertain: effects of short-term extension in different groups."},{claim:"21. Background TV is harmless sleep company.",reality:"Supported: noise and light can fragment sleep. Misleading: background TV has no effect. Uncertain: effects of low-level background media for different people."},{claim:"22. Cold showers are the best bedtime remedy.",reality:"Supported: temperature and relaxation influence sleep. Misleading: cold showers are the best option. Uncertain: specific cold-shower effects on sleep."},{claim:"23. Hot milk or cherry juice always works.",reality:"Supported: small trials exist for some foods. Misleading: these reliably work for everyone. Uncertain: consistency and effect size."},{claim:"24. Sleeping tablets are safe for long-term nightly use.",reality:"Supported: some sleep medicines are restricted to short periods. Misleading: long-term nightly use is risk-free. Uncertain: individual risk profile."},{claim:"25. Mouth taping or nasal strips cure sleep apnoea.",reality:"Supported: some nasal devices may ease snoring in some people. Misleading: they cure sleep apnoea or replace clinical treatment. Uncertain: evidence for mouth taping is limited."},{claim:"26. A sleep score shows whether you are healthy.",reality:"Supported: scores can show trends. Misleading: a score defines health or diagnoses disorders. Uncertain: how scores relate to health outcomes."},{claim:"27. Women always need more sleep than men.",reality:"Supported: sleep patterns differ between sexes in some studies. Misleading: a universal sex-based requirement is established. Uncertain: how much sex and hormonal factors contribute."}],takeaways:["Most sleep myths contain a grain of truth that is exaggerated or misapplied.","Ask who made the claim, what evidence exists, and whether it is causal.","When a claim promises a cure or requires purchase, seek advice from a health professional."],refs:["WATSON-2015","HIRSHKOWITZ-2015","AASM-EDU","NHS-INSOMNIA","PATIL-2019","CHANG-2015"],keyTerms:["Myth","Evidence","Causation","Association","Sleep product"]},{id:48,part:8,title:"Fifteen Realistic Sleep-Education Case Studies",subtitle:"Fictional scenarios for learning. They are not real patients or testimonials.",minutes:14,objectives:["Apply sleep science to varied realistic situations.","Identify what can and cannot safely be concluded from limited information.","Recognise when professional advice may be appropriate."],figure:{kind:"grid",title:"The fifteen case studies",caption:"Fictional, clearly labelled educational scenarios. Each case lists background, challenge, science, practical considerations, limits of conclusions, professional advice and learning points. Open the full set from the link below.",alt:"Grid of fifteen cards listing the fictional case study themes: teenager with an early school schedule; university student with inconsistent routines; remote worker with prolonged screen use; parent of a newborn; night-shift worker; frequent traveller; older adult with sleep changes; person in a noisy shared household; person in a hot climate without air conditioning; stress-related bedtime worry; heavy snorer with daytime sleepiness; irregular work schedule; athlete balancing training and rest; supplement marketing concern; persistent difficulties needing evaluation.",items:[{title:"1. Early school schedule",text:"A teenager with early starts and weekend catch-up."},{title:"2. Inconsistent routines",text:"A university student with irregular term-time patterns."},{title:"3. Screen-heavy remote work",text:"A remote worker with long evening screen use."},{title:"4. Newborn care",text:"A parent managing fragmented night-time sleep."},{title:"5. Night shifts",text:"A night-shift worker managing daytime sleep."},{title:"6. Frequent travel",text:"A traveller managing repeated time-zone changes."},{title:"7. Ageing changes",text:"An older adult noticing lighter sleep."},{title:"8. Noisy household",text:"A person sharing a home with constant noise."},{title:"9. Hot climate",text:"A person sleeping without air conditioning in heat."},{title:"10. Bedtime worry",text:"A person with stress-related racing thoughts at bedtime."},{title:"11. Heavy snoring",text:"A person who snores and feels sleepy during the day."},{title:"12. Irregular work hours",text:"A worker whose rota changes each week."},{title:"13. Athlete",text:"An athlete balancing heavy training and rest."},{title:"14. Supplement marketing",text:"A person weighing claims made about a sleep product."},{title:"15. Persistent difficulties",text:"A person whose problems have lasted months and need evaluation."}]},sections:[{heading:"How to use these case studies",paras:["Each case study is fictional and was written for education. It does not describe real people, and it is not a clinical testimonial. Read each case with its learning points in mind: identify the sleep-science concepts, consider practical constraints, and notice what cannot be concluded from limited information. The full set is available on the case studies page with links back to the relevant chapters."],evidence:{level:"safety",text:"The case studies are illustrative only. They should not be used to self-assess or to decide treatment."}}],misconceptions:[],takeaways:["Realistic cases help connect sleep science with everyday constraints.","Limited information rarely supports firm conclusions.","Use case-based learning to plan questions for a health professional, not to replace one."],refs:["AASM-EDU","NHLBI-APNEA","NHS-INSOMNIA"],keyTerms:["Case study","Fictional scenario"]},{id:49,part:8,title:"The 30-Day Restorative Sleep Education Challenge",subtitle:"A flexible, four-week educational programme with no targets, scores or punishments",minutes:10,objectives:["Follow a four-week educational programme that builds awareness and sustainable habits.","Skip or adapt any activity that is unsuitable for your circumstances.","Log progress privately, without scoring, competition or punishment."],figure:{kind:"flow",title:"The 30-day challenge roadmap",caption:"A four-week roadmap. Each week has a focus. Activities are optional, and you are free to adapt, pause or stop at any time.",alt:"Horizontal roadmap of four weeks: week one, awareness, observing patterns and learning about circadian rhythm; week two, daily habits, including wake times, caffeine awareness, activity and wind-down; week three, environment and stress, including bedroom comfort, light, noise, relaxation and stress sources; week four, sustainability, reviewing what helped and building a long-term plan.",steps:["Week 1: Awareness","Week 2: Daily habits","Week 3: Environment and stress","Week 4: Sustainability"]},sections:[{heading:"Rules of the challenge",paras:["The challenge has no mandatory sleep targets, no forced early wake-ups, no punishment for missed activities, no competitive sleep scoring, no promises of curing insomnia and no medical treatment instructions. You may skip any activity that is unsuitable for you. If sleep problems are persistent or worrying, speak with a health professional rather than relying on the challenge."],evidence:{level:"safety",text:"This challenge is educational and does not replace professional assessment or treatment."}},{heading:"Structure and tracking",paras:["The challenge is divided into four weeks with daily activities. You can track each day as done, adapted, skipped or not today, and add a short private note. Your tracking is saved only in this browser, and you can clear it at any time. Use the challenge page to follow daily activities."],evidence:{level:"traditional",text:"Structured habit programmes are a common approach in health education, with variable evidence depending on design."}}],misconceptions:[],takeaways:["Progress comes from consistent, realistic steps, not perfect execution.","Skipping is allowed and does not count against you.","Keep a private log and review what helps in week four."],refs:["AASM-EDU","NHS-INSOMNIA","WHO-PA"],keyTerms:["Challenge","Habit","Sustainability"]},{id:50,part:8,title:"Your Lifelong Sleep-Wellbeing Reference Guide",subtitle:"Core principles, everyday habits, checklists, worksheets, warnings, glossary and a final message",minutes:12,objectives:["Summarise the core scientific principles and everyday habits covered in this book.","Use the checklists and worksheets to plan your own environment and routine.","Recognise warning signs, and know where to find the glossary, further reading and references."],figure:{kind:"grid",title:"Sleep terminology at a glance",caption:"A short terminology infographic. The full glossary, with over one hundred terms, is available from the Glossary page.",alt:"Grid of eight key sleep terms with short definitions: circadian rhythm, sleep architecture, REM sleep, NREM sleep, sleep latency, homeostatic sleep pressure, melatonin, and sleep apnoea.",items:[{title:"Circadian rhythm",text:"A roughly 24-hour biological cycle, aligned mainly by light."},{title:"Sleep architecture",text:"The organisation of sleep stages and cycles through the night."},{title:"NREM sleep",text:"Non-REM stages N1, N2 and N3, including deep sleep."},{title:"REM sleep",text:"Stage with rapid eye movements, muscle atonia and most vivid dreaming."},{title:"Sleep latency",text:"Time taken to fall asleep after lights out."},{title:"Sleep pressure",text:"The build-up of need for sleep with time awake."},{title:"Melatonin",text:"A hormone that signals darkness and helps time the body clock."},{title:"Sleep apnoea",text:"Breathing pauses during sleep, obstructive or central in type."}]},sections:[{heading:"Core scientific principles",paras:["Sleep is an active, regulated state that supports memory, emotion, metabolism, immunity and physical recovery, though not every function is fully understood. Sleep is governed by sleep pressure and a roughly 24-hour circadian clock aligned mainly by light. Quantity, quality and timing all matter. Individual needs vary, and population guidance (seven or more hours for typical adults) is a minimum reference point, not a personal prescription."],evidence:{level:"established",text:"These principles are supported by the consensus statements, clinical guidelines and reviews cited throughout this book."}},{heading:"Practical everyday habits",paras:["Keep a steady wake time on most days and get daylight soon after waking when possible. Be aware of caffeine and alcohol timing. Move regularly during the day, eat a moderate evening meal, and keep the last hour before bed calm and dim. Keep the bedroom cool, quiet and as dark as practical, and use the bed mainly for sleep. Seek help early if problems persist."],evidence:{level:"developing",text:"Habits are supported by a combination of guideline, trial and observational evidence; effects vary between people."}},{heading:"Checklists and worksheets",paras:["The Worksheets page includes interactive tools for sleep-pattern observation, bedtime-routine planning, bedroom assessment, caffeine awareness, travel planning, shift-work preparation, stress and relaxation reflection, 30-day challenge tracking and preparing for a healthcare appointment. Use them privately, and remember that the information you enter stays on your device."],bullets:["Sleep-environment checklist: light, noise, temperature, air, comfort and privacy.","Bedtime routine plan: wake time, daylight, wind-down, bedtime and rest-of-day habits.","Travel planning: time zones, light timing, meals and an adjustment plan.","Shift-work preparation: main sleep protection, strategic naps and commute safety."]},{heading:"Warning signs that need professional assessment",paras:["Seek professional assessment for persistent sleep difficulties lasting several weeks, loud snoring with breathing pauses, excessive daytime sleepiness, drowsiness while driving, unusual movements or injuries during sleep, persistent night-time urination, low mood or anxiety that affects daily life, or medicine concerns. Seek urgent help for severe breathing difficulty, fainting, chest pain, confusion, dangerous medicine reactions or thoughts of self-harm (Chapter 40)."],evidence:{level:"safety",text:"This list is educational. It is not a diagnostic checklist, and a professional can give individual advice."}},{heading:"Glossary, further reading and references",paras:["The Glossary page defines over one hundred essential terms. The Reference Library organises the sources cited in this book, including government and national institutes, professional societies, clinical guidelines and peer-reviewed research, with direct links where verified. Recommended further reading includes the NHS sleep pages, the AASM’s Sleep Education site and the Sleep Research Society’s public resources."],evidence:{level:"established",text:"These sources are among the most authoritative public resources for sleep health."}},{heading:"A final HERBULANCE message",paras:["Good sleep is not a test you pass or fail, and it is not a moral achievement. It is a biological need shaped by biology, work, family, housing, culture, health and luck. Begin with one small, realistic step, be patient with yourself, and seek professional help when something feels wrong. Rest is part of a healthy life, and you deserve it on your own terms."],evidence:{level:"traditional",text:"This closing reflection reflects the HERBULANCE editorial principles of balance, respect and evidence-based education."}}],misconceptions:[],takeaways:["Build your routine around regular wake times, daylight, calm evenings and a supportive bedroom.","Use the checklists and worksheets to make steady, realistic improvements.","Seek professional help early for persistent problems, and urgent help for emergencies."],refs:["AASM-EDU","SRS-HOME","NHS-INSOMNIA","NHS-TIRED","NHLBI-DEP","NHLBI-APNEA","CDC-SLEEP","WHO-PA","WATSON-2015"],keyTerms:["Sleep hygiene","Circadian rhythm","Sleep architecture","Glossary"],related:"The HERBULANCE collection, including Book 02 (Gut Health & Digestion Guide), Book 07 (Meal Planning), Book 09 (Food Allergies, Intolerances & Special Dietary Needs), Book 10 (Food Nutrition, Vitamins, Minerals & Essential Nutrients) and Book 11 (Healthy Weight Management), complements the topics covered here."}],Bf=d=>d.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""),Uf=[["Actigraphy","Estimating sleep and wake patterns from a wrist-worn motion sensor. It is useful for trends but does not replace a full sleep study.",36],["Adenosine","A chemical that builds up during wakefulness and contributes to sleep pressure. Caffeine blocks its receptors.",20],["Adenosine receptor","A cell-surface receptor that adenosine binds to. Caffeine acts as a blocker (antagonist) at these receptors.",20],["Advanced sleep-wake phase disorder","A persistent circadian disorder in which sleep and wake times occur earlier than desired, with early-evening sleepiness and early waking.",36],["Alertness","The state of being awake and responsive. It varies across the day with circadian timing and sleep pressure.",6],["Alcohol and sleep architecture","Changes in the stages and continuity of sleep caused by alcohol, including REM suppression and fragmentation later in the night.",21],["Anticipatory anxiety","Worry about future events, including worry about not sleeping, which can increase arousal at bedtime.",30],["Apnoea-hypopnoea index (AHI)","A count of breathing pauses (apnoeas) and reduced airflow episodes (hypopnoeas) per hour of sleep, used in sleep study reports.",34],["Arousal","A brief or sustained increase in brain and body activity, which can interrupt sleep or delay sleep onset.",2],["Atonia","Loss of muscle tone. Normal REM sleep includes atonia of most skeletal muscles, which is why dream enactment is a concern when it is lost.",3],["Autonomic nervous system","The part of the nervous system that controls involuntary functions such as heart rate, digestion and breathing, with sympathetic and parasympathetic branches.",29],["Blue light","Short-wavelength visible light, roughly 400 to 500 nanometres, which is particularly effective at influencing the circadian system.",8],["Body clock","The collective term for the body’s circadian timing system, centred on the suprachiasmatic nucleus and peripheral clocks.",7],["Brainstem","The lower part of the brain that connects to the spinal cord. It contains arousal networks and circuits involved in REM sleep.",2],["Caffeine","A stimulant found in coffee, tea, cola, energy drinks and some medicines. It blocks adenosine receptors and increases alertness.",20],["Cataplexy","Sudden, brief loss of muscle tone triggered by strong emotion, a feature of narcolepsy type 1.",38],["Catch-up sleep","Extra sleep taken after a period of restriction, such as weekend lie-ins. It can reduce sleepiness but does not fully repay chronic loss.",10],["CBT-I","Cognitive behavioural therapy for insomnia, a structured, evidence-based programme and the first-line treatment for chronic insomnia in adults.",33],["Central sleep apnoea","A type of sleep apnoea in which the brain does not consistently send breathing signals during sleep.",34],["Chronobiology","The scientific study of biological rhythms and timing, including circadian and other rhythms.",6],["Chronotype","An individual’s natural preference for timing sleep and activity, ranging from early to late along a spectrum.",9],["Circadian misalignment","A mismatch between the body clock and the timing of sleep, meals, light or activity.",10],["Circadian rhythm","A biological rhythm with a period close to 24 hours, which is aligned to the day mainly by light.",6],["Clock genes","Genes such as PER, CRY, CLOCK and BMAL1 whose feedback loops generate circadian rhythms in cells.",7],["Cognitive arousal","Mental activity such as racing thoughts that keeps the mind alert and can delay sleep onset.",30],["Cortisol","A hormone released through the HPA axis that follows a daily rhythm, typically rising before waking and falling through the day.",29],["Core body temperature","The temperature of the body’s internal organs. It falls in the evening and reaches its lowest point in the early morning.",25],["Correlation","A statistical relationship between two variables. It does not, on its own, show that one causes the other.",45],["Causation","A relationship in which one factor produces a change in another. It needs careful study design to establish.",45],["Daytime sleepiness, excessive","Persistent tendency to fall asleep during the day, which can indicate a sleep disorder, medicine effect or medical condition.",38],["Delayed sleep-wake phase disorder","A circadian disorder in which sleep and wake times are persistently later than desired, with difficulty waking at conventional times.",36],["Dementia-related sleep change","Changes in sleep timing and quality that can occur with dementia. They require clinical assessment and support.",15],["Dim light melatonin onset (DLMO)","The time at which melatonin begins to rise in dim light, used by specialists to assess circadian timing.",8],["Dream enactment","Acting out dreams with movements or speech, typical of REM sleep behaviour disorder and a reason for clinical assessment.",37],["Drug interaction","A change in the effect or safety of one medicine or substance caused by another. Alcohol and sedatives can interact dangerously.",39],["Dust mite","A microscopic organism found in household dust that can trigger allergy symptoms. Bedding hygiene can reduce exposure.",26],["Electroencephalography (EEG)","Recording of electrical activity in the brain using scalp electrodes. It is central to identifying sleep stages.",1],["Emotional regulation","The processes by which people influence which emotions they have and how they experience and express them.",32],["Entrainment","The alignment of the internal body clock to external cues, mainly light, so that it matches the 24-hour day.",6],["Epoch","A fixed time unit, usually 30 seconds in standard adult sleep scoring, to which a sleep stage is assigned.",3],["Fatigue","A broad sense of exhaustion that may be physical or mental and may not improve with sleep. It has many possible causes.",38],["Ferritin","A protein that stores iron. Blood levels are used to assess iron status, which is relevant to restless legs syndrome.",35],["Glymphatic system","A proposed brain fluid-clearance system, studied in animals, in which cerebrospinal fluid moves through brain tissue, with clearance enhanced during sleep in mice.",4],["GABA","Gamma-aminobutyric acid, the brain’s main inhibitory neurotransmitter, which is central to sleep promotion.",2],["Growth hormone","A hormone whose release is linked with deep non-REM sleep, relevant to growth and tissue repair.",4],["Half-life","The time taken for the amount of a substance in the body to fall by half. Caffeine’s half-life varies widely between people.",20],["Homeostatic sleep pressure","The build-up of need for sleep with time spent awake, which dissipates during sleep. Also called Process S.",6],["Hyperarousal","A state of heightened mental and physical activation that makes falling and staying asleep harder.",29],["Hypnagogic hallucination","Vivid sensory experiences that can occur as a person falls asleep.",37],["Hypnogram","A chart showing sleep stages across a night. Clinical hypnograms require professional scoring.",3],["Hypnopompic","Relating to the transition from sleep to wakefulness, including possible hallucinations on waking.",37],["Hypocretin (orexin)","A neuropeptide produced in the hypothalamus that helps stabilise wakefulness. Its loss is linked with narcolepsy type 1.",2],["Hypothalamus","A small brain region that regulates many body functions, including sleep and circadian timing.",2],["Inemuri","A Japanese concept describing brief sleep taken while present in a public or working setting.",23],["Insomnia","A persistent difficulty with sleep onset, maintenance or early waking, with daytime impact, despite adequate opportunity to sleep.",33],["Interstitial fluid","Fluid that surrounds brain cells. Its volume and movement are studied in relation to sleep and clearance.",4],["Irregular sleep-wake rhythm","A circadian disorder with multiple, fragmented sleep and wake periods and no consistent daily pattern.",36],["Jet lag","A temporary mismatch between the body clock and the local time after rapid travel across time zones.",11],["K-complex","A large, brief waveform on EEG during N2 sleep, often triggered by sound and associated with arousal regulation.",3],["Light therapy","Controlled exposure to bright light at specific times, used clinically for some circadian disorders under supervision.",36],["Lux","The unit of illuminance, measuring the light falling on a surface. Daylight is much brighter than typical indoor light.",8],["Melanopsin","A light-sensitive pigment in intrinsically photosensitive retinal ganglion cells that signals light information to the brain for timing.",8],["Melatonin","A hormone produced by the pineal gland that signals darkness and helps time the body clock. Its effects are mainly on timing.",8],["Memory consolidation","Processes that stabilise and reorganise memories after learning, which are supported by sleep.",4],["Microsleep","A brief involuntary episode of sleep, lasting seconds, which can occur during severe sleep loss and is dangerous when driving.",2],["Mid-sleep","The midpoint between sleep onset and waking. Used in measuring chronotype and social jet lag.",10],["Morningness","A preference for earlier sleep and wake times. Associated with the early end of the chronotype spectrum.",9],["Eveningness","A preference for later sleep and wake times. Associated with the late end of the chronotype spectrum.",9],["Multiple sleep latency test","A daytime test measuring how quickly a person falls asleep in a series of nap opportunities, used by specialists for sleepiness assessment.",38],["Narcolepsy","A neurological sleep disorder with excessive daytime sleepiness, sudden sleep attacks and disrupted night sleep, with cataplexy in type 1.",38],["Nicotine","A stimulant in tobacco that can delay sleep and cause night-time waking through withdrawal.",21],["Nightmare","A distressing dream usually occurring in REM sleep, typically remembered on waking.",37],["Night terror","A sudden episode of fear and screaming arising from deep non-REM sleep, usually with no recall.",37],["Nocturia","Waking at night to urinate, which can have many causes that deserve assessment if frequent.",22],["NREM sleep","Non-rapid eye movement sleep, made up of N1, N2 and N3 stages, in which dreams are less vivid than in REM.",3],["N1 sleep","The lightest non-REM stage, the transition from wakefulness into sleep.",3],["N2 sleep","A stable light non-REM stage with sleep spindles and K-complexes, making up much of adult sleep.",3],["N3 sleep","Deep non-REM sleep with slow waves, which is hardest to wake from and most prominent early in the night.",3],["Non-24-hour sleep-wake rhythm disorder","A circadian disorder in which the body clock free-runs and does not synchronise with the 24-hour day.",36],["Obstructive sleep apnoea","A type of sleep apnoea in which the upper airway is repeatedly blocked during sleep.",34],["Observational study","A study that observes groups without assigning exposures. Useful for associations but not for proving cause.",45],["Parasomnia","An unwanted behaviour, experience or physiological event that occurs during sleep, such as sleepwalking or nightmares.",37],["Parasympathetic nervous system","The branch of the autonomic nervous system that supports rest, digestion and recovery.",29],["PAP therapy","Positive airway pressure treatment for obstructive sleep apnoea, such as CPAP or auto-adjusting PAP.",34],["Peripheral clock","A circadian clock in a body organ outside the brain, such as the liver or gut, which is coordinated by the SCN and local cues.",7],["Periodic limb movements","Repetitive, involuntary leg movements during sleep that may be noticed by a bed partner and assessed in sleep studies.",35],["Pineal gland","A small endocrine gland in the brain that produces melatonin in response to darkness.",8],["Placebo effect","An improvement in symptoms that results from expectation or context rather than the active treatment. Controlled trials account for it.",47],["Polysomnography (PSG)","A comprehensive overnight sleep study recording brain activity, eye movements, muscle activity, breathing and heart rhythm.",40],["Postpartum","The period following childbirth, which often involves significant sleep disruption and needs support.",16],["Process C","The circadian component of the two-process model, which follows a daily cycle independent of time awake.",6],["Process S","The homeostatic sleep-pressure component of the two-process model, which rises with wakefulness.",6],["Progressive muscle relaxation","A technique of tensing and releasing muscle groups in sequence to reduce tension.",31],["Randomised controlled trial","A study that randomly assigns participants to groups, which strengthens causal inference.",47],["REM sleep","Rapid eye movement sleep, with low muscle tone, a more active EEG pattern, variable heart rate and most vivid dreaming.",3],["REM sleep behaviour disorder","A condition in which normal muscle atonia in REM sleep is lost, leading to dream enactment that can cause injury.",37],["Restless legs syndrome","A neurological sensorimotor condition with an urge to move the legs, usually at rest and relieved by movement.",35],["Retinal ganglion cell","A retinal neuron whose axons carry visual information to the brain. Some types also carry light information for timing.",8],["Rods and cones","Retinal photoreceptors used for vision in dim and bright light respectively.",8],["Rumination","Repetitive, unproductive thinking about past events or future concerns, which can keep the mind awake.",30],["Sedative","A substance that reduces alertness and can promote drowsiness. Many sedatives carry risks of dependence and interactions.",39],["Shift-work disorder","A circadian disorder with insomnia or excessive sleepiness related to work schedules that conflict with the body clock.",36],["Sleep apnoea","A condition in which breathing repeatedly stops or is reduced during sleep, obstructive or central in type.",34],["Sleep architecture","The organisation of sleep into stages and cycles across the night.",3],["Sleep debt","The cumulative shortfall of sleep compared with need, which builds with repeated restriction.",5],["Sleep deficiency","A broader term covering insufficient sleep, poor-quality sleep, sleep at the wrong time, or a sleep disorder.",1],["Sleep diary","A written record of sleep timing, awakenings, naps, substances and alertness, used for self-reflection and clinical discussion.",41],["Sleep effort","Trying hard to sleep, which can increase arousal and make sleep less likely.",33],["Sleep efficiency","The proportion of time in bed that is spent asleep, often used in sleep studies and behavioural programmes.",33],["Sleep hygiene","General habits and environmental practices that support sleep. Evidence for individual practices varies.",17],["Sleep inertia","Temporary grogginess and reduced alertness on waking, which can be stronger after deep sleep or long naps.",13],["Sleep latency","The time taken to fall asleep after lights out or after trying to sleep.",33],["Sleep maintenance insomnia","Difficulty staying asleep, with frequent or prolonged awakenings during the night.",33],["Sleep onset insomnia","Difficulty falling asleep at the start of the night.",33],["Sleep paralysis","A temporary inability to move or speak at sleep onset or waking, often with hallucinations, which is usually harmless but may need assessment if frequent.",37],["Sleep restriction","A structured reduction in time in bed used in CBT-I to improve sleep efficiency, applied only with professional guidance.",33],["Sleep spindle","A brief burst of brain activity during N2 sleep, produced by thalamic circuits and linked with memory processing.",2],["Sleep study","A clinical recording of sleep, such as polysomnography or home testing, interpreted by a qualified specialist.",40],["Sleepwalking","Walking or complex movements during deep non-REM sleep, with little or no awareness or recall.",37],["Slow-wave sleep","Deep non-REM sleep (N3), characterised by slow, high-amplitude EEG waves.",3],["Social jet lag","A mismatch between biological time and social time, measured as the shift in mid-sleep between free days and workdays.",10],["Stimulus control","A CBT-I technique that strengthens the link between bed and sleep by using the bed only for sleep and leaving it when awake for a long time.",17],["Suprachiasmatic nucleus (SCN)","A pair of nerve-cell clusters in the anterior hypothalamus that act as the brain’s master circadian pacemaker.",7],["Sympathetic nervous system","The branch of the autonomic nervous system that mobilises the body for action, increasing heart rate and alertness.",29],["Systematic review","A structured review of all studies on a question, using explicit methods. Often combined with meta-analysis.",47],["Thalamus","A brain region that relays sensory information to the cortex and produces sleep spindles in N2 sleep.",2],["Thermoregulation","The control of body temperature, which changes during sleep and influences sleep onset.",25],["Tolerance","A reduced response to a substance after repeated use, which can lead to higher doses and dependence.",39],["Tryptophan","An essential amino acid that is a precursor of serotonin and, through it, melatonin. Dietary effects on sleep are small or inconsistent.",19],["Two-process model","Borbély’s model of sleep regulation combining the homeostatic (Process S) and circadian (Process C) processes.",6],["Vasodilation","Widening of blood vessels, such as in the hands and feet, which helps the body release heat.",25],["Wearable device","A consumer device that estimates sleep and activity. It is useful for trends but cannot diagnose sleep disorders.",41],["Willis-Ekbom disease","The clinical name for restless legs syndrome, used by many researchers and clinicians.",35],["Wind-down","A short period of calm activity before bed intended to ease the transition into sleep.",17],["Zeitgeber","An external cue, such as light, meals or social activity, that helps synchronise the body clock. Literally 'time giver'.",6]],Di=Uf.map(([d,h,S])=>({term:d,def:h,chapter:S,slug:Bf(d)})).sort((d,h)=>d.term.localeCompare(h.term)),Ri=[{front:"What is the main difference between sleep and quiet rest?",back:"In sleep, responsiveness to the environment is reduced and the brain shows characteristic patterns on EEG. In quiet rest, a person remains broadly aware.",chapter:1},{front:"Why is sleep described as an active process?",back:"Brain and body activity change in organised ways across sleep stages, and sleep is regulated by sleep pressure and the circadian clock.",chapter:1},{front:"What is the difference between sleep quantity and sleep quality?",back:"Quantity is total time asleep. Quality covers continuity, depth, timing and how refreshed a person feels.",chapter:1},{front:"Which brain region contains the suprachiasmatic nucleus?",back:"The anterior hypothalamus, just above the optic chiasm.",chapter:7},{front:"What does the ventrolateral preoptic area (VLPO) do?",back:"It is a sleep-promoting region of the hypothalamus that helps quieten arousal systems.",chapter:2},{front:"What is orexin (hypocretin) involved in?",back:"Stabilising wakefulness. Loss of orexin signalling is linked with narcolepsy type 1.",chapter:2},{front:"Which neurotransmitter is the brain’s main inhibitory messenger?",back:"GABA (gamma-aminobutyric acid).",chapter:2},{front:"What is N3 sleep?",back:"Deep non-REM sleep with slow waves; hardest to wake from and most prominent early in the night.",chapter:3},{front:"What defines REM sleep?",back:"Rapid eye movements, low muscle tone (atonia), a more active EEG and most vivid dreaming.",chapter:3},{front:"What is a typical adult sleep cycle length?",back:"On average about 90 minutes, though this varies between people and nights.",chapter:3},{front:"What is slow-wave sleep associated with?",back:"Memory consolidation and growth hormone release, as shown in research, though details are still being studied.",chapter:4},{front:"What did Xie and colleagues (2013) find in mice?",back:"Brain clearance of metabolites increased during sleep. Human relevance is still being studied.",chapter:4},{front:"What do AASM and SRS recommend for adults?",back:"Seven or more hours of sleep on a regular basis as a minimum for healthy adults.",chapter:5},{front:"What is a circadian rhythm?",back:"A biological rhythm with a period close to 24 hours that is aligned to the day mainly by light.",chapter:6},{front:"What is entrainment?",back:"The alignment of the internal body clock to external cues such as light, meals and activity.",chapter:6},{front:"What is Process S in the two-process model?",back:"Homeostatic sleep pressure, which rises with time awake and falls during sleep.",chapter:6},{front:"What is Process C?",back:"The circadian process, which follows a daily cycle independent of time awake.",chapter:6},{front:"Which retinal cells signal light for circadian timing?",back:"Intrinsically photosensitive retinal ganglion cells (ipRGCs), which contain melanopsin.",chapter:8},{front:"When is the human melatonin response most sensitive to light?",back:"Human action-spectrum research points to greatest sensitivity in the blue part of the spectrum, around 460 to 480 nanometres.",chapter:8},{front:"Is melatonin mainly a sedative or a timing signal?",back:"Mainly a timing signal for darkness and the body clock, with smaller and variable sedative effects.",chapter:8},{front:"What is a chronotype?",back:"A person’s natural preference for timing sleep and activity, ranging along an early-to-late spectrum.",chapter:9},{front:"What is social jet lag?",back:"The mismatch between biological and social timing, typically measured as the shift in mid-sleep between free days and workdays.",chapter:10},{front:"Why is eastward travel often harder for adjusting sleep?",back:"It requires the body clock to advance, and many people find advancing harder than delaying, though responses vary.",chapter:11},{front:"What is the first-line treatment for chronic insomnia in adults?",back:"CBT-I (cognitive behavioural therapy for insomnia), according to the American College of Physicians guideline.",chapter:33},{front:"What is the difference between obstructive and central sleep apnoea?",back:"Obstructive involves repeated airway blockage; central involves inconsistent brain signals for breathing.",chapter:34},{front:"What are the five essential features of restless legs syndrome in the 2014 IRLSSG criteria?",back:"An urge to move the legs with unpleasant sensations; onset or worsening at rest; relief with movement; circadian worsening; and exclusion of other causes.",chapter:35},{front:"What is sleepiness versus fatigue?",back:"Sleepiness is a tendency to fall asleep, often relieved by sleep. Fatigue is broader exhaustion that may persist after sleep.",chapter:38},{front:"What is a parasomnia?",back:"An unwanted behaviour, experience or physiological event during sleep, such as sleepwalking, nightmares or sleep paralysis.",chapter:37},{front:"Why should iron supplements not be self-prescribed for restless legs?",back:"Iron status should be checked with blood tests, because excess iron can be harmful and deficiency is only one possible cause.",chapter:35},{front:"Why are sleep trackers not diagnostic tools?",back:"They estimate sleep from movement and sometimes heart signals, and their accuracy varies. They cannot diagnose sleep disorders.",chapter:41},{front:"What is sleep inertia?",back:"Temporary grogginess after waking, which can be stronger after deep sleep or long naps.",chapter:23},{front:"What is a useful nap length for many adults?",back:"Brief naps of about 10 to 20 minutes are often associated with improved alertness with less grogginess.",chapter:23},{front:"What is the function of melatonin in jet lag?",back:"It is a timing signal. Evidence for its benefit is mixed, and advice from a clinician is needed before use.",chapter:11},{front:"What does the NHS say about going to bed when you are not sleepy?",back:"Go to bed only when sleepy, and leave bed if awake for a long time, as part of behavioural insomnia guidance.",chapter:17},{front:"How does caffeine affect sleep pressure?",back:"It blocks adenosine receptors and increases alertness, but it does not remove the underlying build-up of sleep pressure.",chapter:20},{front:"Why can alcohol worsen snoring?",back:"It relaxes throat muscles, which can increase airway narrowing and breathing pauses in people with sleep apnoea.",chapter:21},{front:"What is the body’s core temperature pattern in the evening?",back:"Core temperature tends to fall, and heat loss through the hands and feet supports sleep onset.",chapter:25},{front:"What is the main purpose of a sleep diary?",back:"To record sleep timing, awakenings, habits and alertness so patterns can be observed and discussed with a clinician.",chapter:40},{front:"What is the NREM-REM cycle?",back:"A repeating pattern of non-REM stages followed by REM sleep, typically about 90 minutes in adults on average.",chapter:3},{front:"What is the SCN’s role in the body?",back:"The suprachiasmatic nucleus acts as the master clock, coordinating peripheral clocks and daily rhythms.",chapter:7},{front:"What does 'circadian misalignment' mean?",back:"A mismatch between the body clock and the timing of sleep, meals, light or activity.",chapter:10},{front:"What is the best approach to a bedtime worry loop?",back:"Writing worries down with a plan, relaxation, and seeking professional support if worry is intense or persistent.",chapter:30},{front:"What is the role of the thalamus in sleep?",back:"It relays sensory information and produces sleep spindles in N2 sleep.",chapter:2},{front:"What is a hypnagogic hallucination?",back:"A vivid sensory experience that can occur as a person falls asleep.",chapter:37},{front:"Why are blue-light claims complex?",back:"Effects depend on intensity, duration, timing and content, and daylight is generally beneficial for daytime alertness.",chapter:8},{front:"What is a safe approach to earplugs?",back:"Use them only where they do not prevent you from hearing alarms, emergencies, infants or others who need you.",chapter:27}],Se="2026-11-15",Dn=[{id:"NINDS-ROOT",author:"National Institute of Neurological Disorders and Stroke (NINDS), National Institutes of Health",title:"NINDS brain and nervous system information (organisation homepage; sleep topic pages were not retrieved during verification)",date:"Organisation homepage (retrieved 2026)",venue:"NINDS, National Institutes of Health (United States)",url:"https://www.ninds.nih.gov/",access:Se,category:"National institute",relevance:"General neuroscience background for brain regions and networks. Readers should search the NINDS site for sleep topics.",region:"United States (general relevance worldwide)",linkType:"Organisation page"},{id:"NHLBI-DEP",author:"National Heart, Lung, and Blood Institute (NHLBI), National Institutes of Health",title:"What Ar
