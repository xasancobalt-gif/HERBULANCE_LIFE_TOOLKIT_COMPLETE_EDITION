m for pregnancy, heart or lung conditions, injury, disability, and older age. If a practice causes distress, dizziness or pain, stop and seek advice. Relaxation should complement, not replace, professional assessment of persistent sleep problems."],evidence:{level:"safety",text:"Relaxation practices can be adapted, and any symptoms during practice should be discussed with a clinician."}}],misconceptions:[{claim:"Meditation cures insomnia.",reality:"Some people benefit, but meditation is not a cure. Its effects are modest and vary."},{claim:"Breathing exercises always work quickly.",reality:"Some people feel calmer quickly, while others need repeated practice and some find breathwork uncomfortable."},{claim:"Relaxation practices are risk-free for everyone.",reality:"Most are low risk, but some people need adaptation or advice, particularly with medical conditions."}],takeaways:["Slow breathing, progressive muscle relaxation and mindfulness have some promising evidence for sleep.","Evidence strength and effect size differ between practices.","Adapt practices for your body and health, and seek advice if they cause symptoms."],refs:["AASM-EDU","QASEEM-2016","MORIN-BENCA-2012"],keyTerms:["Heart rate variability","Progressive muscle relaxation","Mindfulness","Meditation"]},{id:32,part:6,title:"Emotional Regulation and Sleep",subtitle:"The two-way relationship between sleep, mood and emotional resilience",minutes:10,objectives:["Describe how sleep supports emotional processing and regulation.","Explain the two-way relationship between sleep disturbance and mood.","Avoid oversimplified causal claims in discussing sleep and emotion."],figure:{kind:"flow",title:"A two-way relationship between sleep and emotion",caption:"A simplified model. Sleep supports emotional regulation, and emotional states influence sleep. Both directions matter, and each can reinforce the other.",alt:"Circular flow with two directions: sleep supports emotional regulation, which supports stress recovery and resilience; emotional stress and mood problems disturb sleep, which further reduces emotional regulation.",steps:["Sleep supports emotional processing","Better regulation and resilience","Stress recovery","Stress or low mood disturbs sleep","Poorer regulation the next day"]},sections:[{heading:"Sleep and emotional processing",paras:["Research suggests that sleep helps the brain process emotional experiences, in part by changing how emotional memories are stored and how emotional reactions are regulated. REM sleep has been studied in this context. Sleep loss in experimental studies is associated with greater emotional reactivity and reduced regulation."],evidence:{level:"developing",text:"Experimental evidence supports sleep’s role in emotion. The mechanisms and their importance in everyday life are still being studied."}},{heading:"Irritability, mood and resilience",paras:["Many people notice that after a poor night they feel more irritable, less patient and more sensitive to small setbacks. Persistent sleep loss can affect resilience, the ability to recover from stress. Sleep is therefore one part of emotional wellbeing, alongside relationships, work, health and support."],evidence:{level:"established",text:"Short-term sleep loss is associated with increased irritability and reduced emotional control in many studies."}},{heading:"The two-way relationship",paras:["The relationship between sleep and mood is bidirectional. Depression and anxiety frequently involve sleep disturbance, and sleep problems are a risk factor for later mood disorders in observational research. Treating sleep problems can help mood in some people, and treating mood problems can help sleep. Neither should be reduced to a single cause."],evidence:{level:"developing",text:"The bidirectional link is well supported observationally. Causal direction varies between people and conditions."}},{heading:"Avoiding oversimplified claims",paras:["Statements such as 'bad sleep causes depression' or 'a good night fixes your mood' oversimplify a complex picture. Sleep, mood, stress, physical health, relationships and circumstances all interact. If you are concerned about your mood or sleep, a health professional can help you understand your situation and options."],evidence:{level:"safety",text:"Mood and sleep problems can both require professional support. Seek help if low mood persists or if you have thoughts of self-harm."}}],misconceptions:[{claim:"Poor sleep is the only cause of low mood.",reality:"Mood is shaped by many factors. Sleep matters, but so do biology, relationships, work and life events."},{claim:"A good night’s sleep fixes emotional problems.",reality:"Sleep supports emotional wellbeing but does not replace support for persistent mood problems."},{claim:"Irritability after poor sleep means you have a personality flaw.",reality:"Sleep loss strongly affects mood in most people. It is a normal response to insufficient sleep."}],takeaways:["Sleep supports emotional regulation, and emotional states influence sleep.","The relationship is two-way and complex.","Persistent low mood or self-harm thoughts need professional support."],refs:["IRWIN-2015","DIEKELMANN-2010","NHLBI-DEP"],keyTerms:["Emotional regulation","Emotional reactivity","Resilience","Stress recovery"]}],Of=[{id:33,part:7,title:"Understanding Insomnia",subtitle:"Definitions, types, contributing factors and evidence-based professional approaches",minutes:12,objectives:["Describe the main types of insomnia and their common features.","Explain why trying too hard to sleep can make insomnia worse.","Outline cognitive behavioural therapy for insomnia (CBT-I) as the recommended first-line approach for chronic insomnia."],figure:{kind:"flow",title:"An educational flowchart: when to seek help with sleep difficulties",caption:"An educational flowchart, not a diagnostic tool. Only a qualified clinician can assess whether a sleep disorder is present.",alt:"Vertical flowchart: start with a sleep difficulty; if it lasts several weeks or affects daytime life, review habits, environment and stress; if still persistent or worrying, speak to a doctor, nurse or pharmacist; consider CBT-I and clinical assessment; any thoughts of self-harm or severe symptoms require urgent help.",steps:["Sleep difficulty noticed","Has it lasted several weeks or affected daytime life?","Review routines, environment, stress and substances","Still persistent or worrying? Speak to a doctor, nurse or pharmacist","Consider CBT-I and clinical assessment","Severe symptoms or self-harm thoughts: seek urgent help now"],vertical:!0},sections:[{heading:"Definition and types",paras:["Insomnia is a persistent difficulty with sleep onset, sleep maintenance or early waking, that is accompanied by daytime problems such as tiredness, poor concentration or mood changes, despite adequate opportunity to sleep. Clinical definitions usually require these difficulties to occur several times a week for several months. Short-term insomnia may follow a stressful event, while chronic insomnia persists for three months or more. The NHS describes insomnia lasting less than three months as short-term and three months or more as long-term.","This publication does not diagnose insomnia. If your sleep has been difficult for weeks, speak with a health professional who can take a full history."],evidence:{level:"established",text:"Clinical definitions and the short-term versus long-term distinction are standard in NHS and specialist sources."}},{heading:"Common contributing factors",paras:["Insomnia often has several interacting causes. Stress, anxiety, low mood, pain, noise, uncomfortable temperature, caffeine, alcohol, nicotine, irregular schedules, jet lag, shift work and some medicines are all frequently noted. Medical conditions such as restless legs syndrome, sleep apnoea, overactive thyroid, menopause and chronic pain can also contribute. These factors are not moral failings and often reflect circumstances."],evidence:{level:"established",text:"The NHS lists stress, noise, uncomfortable rooms, substances, shift work and some medical conditions as common contributors to insomnia."}},{heading:"Why trying harder can backfire",paras:["A pattern common in insomnia is 'sleep effort': trying hard to fall asleep, watching the clock, and worrying about the consequences of poor sleep. This increases arousal and can make sleep less likely. Behavioural approaches therefore encourage going to bed when sleepy, leaving bed if awake for long periods, and reducing time in bed to match sleep ability in structured programmes."],evidence:{level:"established",text:"The role of sleep effort and conditioned arousal in chronic insomnia is well supported by clinical research."}},{heading:"Evidence-based professional approaches",paras:["Cognitive behavioural therapy for insomnia (CBT-I) is a structured programme that addresses thoughts, behaviours and sleep habits. It often includes sleep restriction, stimulus control, cognitive restructuring and relaxation. The American College of Physicians recommends CBT-I as the first-line treatment for adults with chronic insomnia disorder, and the NHS also describes it as a treatment option, sometimes delivered online. Medicines may be considered when CBT-I is insufficient, but they carry risks and are discussed as a shared decision with a clinician (Chapter 39)."],evidence:{level:"established",text:"The ACP guideline (Qaseem and colleagues, 2016) recommends CBT-I as initial treatment for chronic insomnia disorder in adults. NHS guidance describes CBT-I as a key option."}},{heading:"Why this publication cannot diagnose you",paras:["Insomnia shares features with many other conditions, and assessment requires history, sometimes diaries or sleep tests, and attention to physical and mental health. This book can explain concepts, but it cannot determine whether you have insomnia, what is causing it, or what treatment is right for you."],evidence:{level:"safety",text:"Persistent insomnia should be assessed by a qualified health professional."}}],misconceptions:[{claim:"Insomnia is just a bad night, and it always passes.",reality:"Occasional poor nights are common. Persistent insomnia can be long-lasting and deserves assessment."},{claim:"Sleeping pills are the best long-term treatment for insomnia.",reality:"CBT-I is recommended first-line for chronic insomnia. Medicines carry risks, including dependence and next-day drowsiness."},{claim:"Insomnia can be cured naturally with herbs.",reality:"Herbal products have limited, mixed evidence and cannot be assumed to cure insomnia."}],takeaways:["Insomnia is a persistent sleep difficulty with daytime impact, not simply a bad night.","Trying harder to sleep can increase arousal; behavioural approaches often help.","CBT-I is the recommended first-line treatment for chronic insomnia in adults."],refs:["NHS-INSOMNIA","QASEEM-2016","MORIN-BENCA-2012","AASM-EDU"],keyTerms:["Insomnia","CBT-I","Sleep effort","Sleep restriction","Stimulus control"]},{id:34,part:7,title:"Sleep Apnoea",subtitle:"Obstructive and central types, warning signs, risk factors and clinical pathways",minutes:12,objectives:["Distinguish obstructive sleep apnoea from central sleep apnoea.","Recognise common signs that merit medical evaluation without self-diagnosing.","Summarise the main categories of clinical assessment and treatment."],figure:{kind:"compare",title:"Obstructive and central sleep apnoea compared",caption:"A simplified educational comparison. Only a clinician can determine which type, if any, applies to a person, and how it should be treated.",alt:"Two-column comparison. Obstructive sleep apnoea: the upper airway is repeatedly blocked during sleep despite breathing effort, with loud snoring and gasping. Central sleep apnoea: the brain does not send consistent breathing signals, so breathing effort pauses, often with less snoring.",columns:[{title:"Obstructive (OSA)",items:["Upper airway is repeatedly blocked or narrowed","Breathing effort continues during pauses","Loud snoring and gasping are common","The most common type","Risk factors include excess weight, neck size, nasal obstruction, age and alcohol or sedatives"]},{title:"Central (CSA)",items:["Brain does not consistently send breathing signals","Breathing effort is reduced or absent during pauses","Snoring may be less prominent","Can be linked with heart failure, stroke, some medicines and altitude","Requires specialist assessment for cause"]}]},sections:[{heading:"Obstructive sleep apnoea",paras:["Obstructive sleep apnoea (OSA) happens when the upper airway becomes blocked repeatedly during sleep, reducing or stopping airflow. The NHLBI describes this as the most common type. Its causes include obesity, enlarged tonsils, changes in hormone levels, and anatomical features of the airway. Repeated pauses can lower oxygen levels and disturb sleep structure, which may cause daytime sleepiness, morning headaches and difficulty concentrating."],evidence:{level:"established",text:"The description and main features of OSA are supported by NHLBI and clinical guidelines."}},{heading:"Central sleep apnoea",paras:["Central sleep apnoea (CSA) occurs when the brain does not send the signals needed to breathe consistently. Health conditions affecting the brain’s control of breathing or the chest muscles can cause it. Central and obstructive patterns can coexist, and the cause must be identified by a specialist."],evidence:{level:"established",text:"NHLBI describes central sleep apnoea as a failure of brain signalling for breathing."}},{heading:"Signs, symptoms and risk without stigma",paras:["Possible signs include loud or frequent snoring, witnessed breathing pauses, gasping or choking during sleep, waking with a dry mouth, morning headaches, night-time urination, and daytime sleepiness. Risk factors such as older age, male sex, excess weight, family history and nasal problems are associated with OSA, but they are not moral failings and many people with risk factors never develop it. Sleep apnoea can affect people of all sizes and backgrounds."],evidence:{level:"developing",text:"Risk-factor associations are well documented, though individual prediction is limited."}},{heading:"Why professional evaluation matters",paras:["Untreated sleep apnoea is associated with higher risks of heart disease, stroke and daytime accidents, according to the NHLBI. Evaluation usually involves a clinical history, questionnaires and a sleep study, which may be done in a sleep laboratory or, when appropriate, at home using a home sleep apnoea test. Results must be interpreted by a clinician."],evidence:{level:"safety",text:"Anyone with witnessed breathing pauses, gasping, or significant daytime sleepiness should seek medical evaluation. Avoid home self-diagnosis."}},{heading:"Treatment categories",paras:["Treatment depends on the type, severity and cause. Positive airway pressure (PAP) therapy, such as CPAP or auto-adjusting PAP, is a well-studied first-line option for many adults with OSA; a 2019 American Academy of Sleep Medicine guideline (Patil and colleagues) recommends PAP therapy for many adults with OSA. Other options include oral appliances fitted by a dentist or sleep specialist, positional therapy, weight management, treatment of nasal problems, upper airway surgery and upper airway stimulation. Lifestyle measures such as avoiding alcohol close to bedtime can help but do not replace clinical treatment."],evidence:{level:"established",text:"PAP therapy is well supported for OSA in AASM clinical guidance (Patil and colleagues, 2019). Other options depend on individual assessment."}}],misconceptions:[{claim:"Snoring is always harmless.",reality:"Simple snoring is common, but snoring with breathing pauses or daytime sleepiness should be assessed."},{claim:"Only overweight older men get sleep apnoea.",reality:"Risk factors vary, and sleep apnoea affects people of different ages, sexes and body types."},{claim:"You can diagnose sleep apnoea with a phone app.",reality:"Apps and wearables can suggest patterns, but they cannot diagnose sleep apnoea. A clinical assessment is needed."}],takeaways:["Obstructive sleep apnoea involves repeated airway blockage; central sleep apnoea involves inconsistent breathing signals.","Breathing pauses, gasping and daytime sleepiness warrant medical evaluation.","Treatment is individual and clinical; PAP therapy is well established for many adults with OSA."],refs:["NHLBI-APNEA","PATIL-2019","NHLBI-DEP","AASM-EDU"],keyTerms:["Sleep apnoea","Obstructive sleep apnoea","Central sleep apnoea","PAP therapy","Polysomnography"]},{id:35,part:7,title:"Restless Legs Syndrome and Periodic Limb Movements",subtitle:"Symptoms, clinical criteria, possible contributors and why self-treatment can be unsafe",minutes:10,objectives:["Describe the core features of restless legs syndrome (RLS) as used in clinical criteria.","Explain how periodic limb movements during sleep differ from RLS.","Explain why iron and other supplements should be used only under clinical guidance."],figure:{kind:"grid",title:"Restless legs: educational overview",caption:"A general overview based on international diagnostic features. Diagnosis is clinical and requires exclusion of other causes. This is not a self-test.",alt:"Grid of six cards describing restless legs syndrome: an urge to move the legs with uncomfortable sensations; onset or worsening at rest; relief with movement; often worse in the evening or night; sleep disruption for the person and sometimes their partner; and clinical assessment including iron status.",items:[{title:"Urge to move",text:"An urge to move the legs, often with uncomfortable sensations, is central."},{title:"Starts at rest",text:"Symptoms begin or worsen during rest or inactivity, such as sitting or lying down."},{title:"Relief with movement",text:"Movement such as walking or stretching partly or fully relieves the urge."},{title:"Evening pattern",text:"Symptoms are often worse in the evening and at night, though this may be less prominent in severe cases."},{title:"Sleep disruption",text:"Sleep can be delayed or fragmented, and a bed partner may notice leg movements."},{title:"Clinical assessment",text:"A clinician considers history, examination, blood tests such as ferritin, and other causes."}]},sections:[{heading:"Definition and diagnostic criteria",paras:["Restless legs syndrome (RLS), also called Willis-Ekbom disease, is a neurological sensorimotor condition. The updated International RLS Study Group criteria (Allen and colleagues, 2014) describe five essential features, including an urge to move the legs usually with unpleasant sensations, onset or worsening at rest, relief with movement, and circadian worsening, together with a requirement that other conditions are excluded. Diagnosis is clinical rather than based on a single test."],evidence:{level:"established",text:"The 2014 IRLSSG consensus criteria are the reference used by clinicians for diagnosing RLS."}},{heading:"Symptoms and sleep disruption",paras:["People describe sensations such as crawling, tingling, aching or pulling in the legs, often relieved by walking or stretching. Symptoms can delay sleep onset and cause awakenings. Daytime tiredness and reduced concentration can follow. Periodic limb movements of sleep (PLMS) are involuntary jerks or twitches of the legs during sleep, which may occur with or without RLS. They can be assessed in sleep studies."],evidence:{level:"established",text:"Symptoms and sleep disruption are standard features described in clinical sources, and PLMS is recognised in sleep medicine."}},{heading:"Possible contributing factors",paras:["Several factors have been associated with RLS, including low iron stores in the brain and body, kidney disease, pregnancy, some medicines, and certain neurological conditions. Research on brain iron and dopamine signalling is ongoing. Lifestyle factors such as caffeine, alcohol and poor sleep may worsen symptoms for some people, but evidence of their effects is mixed."],evidence:{level:"developing",text:"Associations with iron status, pregnancy and other conditions are supported; the mechanisms are still being researched."}},{heading:"Why self-treating with iron or supplements can be unsafe",paras:["Iron supplements should not be started without a blood test, because iron excess can be harmful and iron deficiency is only one possible cause of RLS. Clinicians may check ferritin and transferrin saturation and decide whether iron treatment is appropriate. Other supplements, including magnesium and herbal products, have limited evidence for RLS, and some may interact with medicines. Seek clinical advice rather than self-treating."],evidence:{level:"safety",text:"Self-prescribed iron, magnesium or herbal treatments for RLS should be discussed with a clinician first."}}],misconceptions:[{claim:"Restless legs is just fidgeting.",reality:"RLS is a recognised clinical condition with distinctive features and effects on sleep and daily life."},{claim:"Everyone with restless legs needs iron tablets.",reality:"Iron treatment depends on blood test results and clinical judgement. Excess iron can be harmful."},{claim:"Leg jerks at night are always harmless.",reality:"Often they are not dangerous, but persistent or disruptive leg movements deserve assessment."}],takeaways:["RLS is diagnosed clinically using defined criteria, and it can disrupt sleep.","Periodic limb movements in sleep are a separate but related phenomenon.","Iron and supplements should follow blood tests and clinical advice, not self-prescription."],refs:["ALLEN-2014","NHS-INSOMNIA","AASM-EDU"],keyTerms:["Restless legs syndrome","Willis-Ekbom disease","Periodic limb movements","Ferritin"]},{id:36,part:7,title:"Circadian Rhythm Sleep-Wake Disorders",subtitle:"Persistent timing problems, how they differ and how they are assessed",minutes:11,objectives:["Compare the main circadian rhythm sleep-wake disorders.","Explain how clinicians assess timing problems, including sleep diaries and light history.","Outline the general categories of treatment without offering personal treatment advice."],figure:{kind:"compare",title:"Circadian sleep-wake disorders: educational comparison",caption:"A broad educational comparison. Each category has specific clinical criteria. This table is not a diagnostic tool.",alt:"Two-column comparison of circadian sleep-wake disorders. Delayed sleep-wake phase: sleep and wake times much later than desired, often in teenagers and young adults. Advanced sleep-wake phase: early evening sleepiness and early waking. Irregular sleep-wake rhythm, non-24-hour rhythm and shift-work disorder are also described.",columns:[{title:"Timing too late or early",items:["Delayed sleep-wake phase: sleep onset much later than desired, with difficulty waking at conventional times","Advanced sleep-wake phase: early-evening sleepiness and early waking, often in older adults","Irregular sleep-wake rhythm: no clear daily pattern, with fragmented sleep and wake periods"]},{title:"Persistent or work-related",items:["Non-24-hour sleep-wake rhythm: a clock that does not synchronise with the 24-hour day, often reported in people with little or no light perception","Shift-work disorder: insomnia or excessive sleepiness linked to work schedules","All require clinical assessment and treatment planning"]}]},sections:[{heading:"Delayed and advanced sleep-wake phase disorders",paras:["Delayed sleep-wake phase disorder involves a persistent pattern of falling asleep and waking much later than socially acceptable times, with difficulty adjusting to conventional schedules. Advanced sleep-wake phase disorder involves early-evening sleepiness and early morning waking. Both can significantly affect school, work and wellbeing, and both are clinically assessed rather than managed by willpower."],evidence:{level:"established",text:"These disorders are defined in clinical classification systems and described in AASM patient resources."}},{heading:"Irregular, non-24 and shift-work patterns",paras:["Irregular sleep-wake rhythm involves multiple sleep and wake periods without a consistent pattern, often seen in some people with neurological conditions or very limited light exposure. Non-24-hour sleep-wake rhythm involves a free-running clock, and it is reported most often in people who cannot perceive light cues. Shift-work disorder involves insomnia or excessive sleepiness related to work schedules that conflict with the body clock (Chapter 43)."],evidence:{level:"established",text:"These patterns are defined in clinical literature and are assessed by specialists."}},{heading:"How clinicians assess timing problems",paras:["Assessment often begins with a detailed history and sleep diary covering several weeks, including timing of sleep, light exposure, work and social schedules. Actigraphy, a wrist-worn activity monitor, may be used to estimate sleep and wake patterns. In some cases, clinicians measure melatonin timing or use other specialist tests. Sleep studies are used when other conditions must be excluded."],evidence:{level:"established",text:"Diaries, actigraphy and specialist timing tests are standard tools in circadian sleep medicine."}},{heading:"General treatment approaches",paras:["Treatment is individual. General approaches include structured light exposure at specific times, scheduled sleep and wake times, behavioural strategies, and in some cases timed melatonin prescribed and supervised by a specialist. Bright light therapy is used clinically under supervision. These are educational descriptions, and self-directed use of bright light or melatonin for a persistent circadian disorder is not recommended without advice."],evidence:{level:"developing",text:"Light therapy and melatonin have evidence for some circadian disorders, but treatment must be individualised and clinically supervised."}}],misconceptions:[{claim:"A late sleeper just needs more discipline.",reality:"Some circadian disorders are biologically based and require clinical assessment, not willpower alone."},{claim:"Shift-work problems are unavoidable and can never be improved.",reality:"Structured planning, light management and occupational health input can help; outcomes vary."},{claim:"Melatonin is a simple fix for any timing problem.",reality:"Melatonin timing matters greatly, and its use should be supervised for circadian disorders."}],takeaways:["Circadian sleep-wake disorders involve persistent timing problems with distinct patterns.","Assessment uses diaries, history and sometimes actigraphy or specialist tests.","Treatment is clinically supervised and individual, including light and timed melatonin where appropriate."],refs:["AASM-EDU","NHS-INSOMNIA","ROENNEBERG-2004"],keyTerms:["Delayed sleep-wake phase disorder","Advanced sleep-wake phase disorder","Non-24-hour sleep-wake rhythm","Actigraphy","Shift-work disorder"]},{id:37,part:7,title:"Parasomnias and Unusual Sleep Experiences",subtitle:"Sleepwalking, night terrors, dream enactment, nightmares and sleep paralysis",minutes:11,objectives:["Describe the main parasomnias and the sleep stages they are associated with.","Explain practical household safety measures for people who move during sleep.","Identify features that require prompt medical assessment."],figure:{kind:"compare",title:"Parasomnias: common features and safety considerations",caption:"A safety-focused overview. Any unusual movement during sleep that could cause injury needs assessment and household precautions.",alt:"Two-column comparison. Common features: sleepwalking and night terrors occur in deep non-REM sleep, nightmares and REM sleep behaviour disorder occur in REM, and sleep paralysis occurs at sleep transitions. Safety considerations: secure the room, clear pathways, keep the sleeping area safe, and seek assessment for dream enactment or frequent distressing episodes.",columns:[{title:"Common features",items:["Sleepwalking and night terrors: arise from deep non-REM sleep, often earlier in the night","Nightmares: vivid, distressing dreams in REM, usually recalled","REM sleep behaviour disorder: acting out dreams with movement or speech","Sleep paralysis: unable to move briefly at sleep onset or waking"]},{title:"Safety considerations",items:["Clear floors and pathways; lock doors and windows for sleepwalkers where needed","Use a lower bed or bed guard if there is risk of falling","Keep sharp or hot objects away from the bed","Seek medical assessment for dream enactment or injuries","Inform your bed partner so they can help if needed"]}]},sections:[{heading:"Sleepwalking and night terrors",paras:["Sleepwalking and night terrors arise mainly from deep non-REM sleep, often in the first part of the night, and are more common in children. Sleepwalking involves walking or complex movements while not fully awake, with little memory of the episode. Night terrors involve sudden arousal with screaming, fear and rapid heart rate, usually without recall. Both are often outgrown, although they can persist."],evidence:{level:"established",text:"The NREM origin and typical features of sleepwalking and night terrors are described in AASM and clinical sources."}},{heading:"Nightmares, sleep talking and REM sleep behaviour disorder",paras:["Nightmares are distressing dreams that usually occur in REM sleep and are typically remembered. Sleep talking is common and often harmless. REM sleep behaviour disorder (RBD) involves loss of normal muscle atonia in REM sleep, leading to dream enactment such as punching, kicking or shouting. RBD can cause injury to the person or their bed partner and requires specialist assessment, because it has been associated with later neurological conditions in some people."],evidence:{level:"established",text:"RBD features and its safety risks are described in clinical sleep medicine. The association with later neurological conditions is recognised but individual outcomes vary."}},{heading:"Sleep paralysis",paras:["Sleep paralysis is a temporary inability to move or speak while falling asleep or waking, usually lasting seconds to minutes. It is associated with REM sleep and can be accompanied by hypnagogic or hypnopompic hallucinations, often frightening but not harmful. It is relatively common, especially with sleep deprivation or irregular sleep. Frequent or distressing episodes, or episodes with other symptoms such as excessive sleepiness, should be discussed with a clinician."],evidence:{level:"established",text:"Sleep paralysis is recognised as a REM-related phenomenon. Frequency and triggers vary."}},{heading:"Household safety and when to seek assessment",paras:["If someone sleepwalks, practical safety steps include securing windows and doors, removing hazards, using stair gates, keeping a light on the route, and sleeping on the ground floor where possible. Avoid waking a sleepwalker abruptly; guide them gently back to bed if needed. Seek medical assessment for episodes that cause injury, occur frequently, involve complex behaviour, or accompany other concerns."],evidence:{level:"safety",text:"Injuries from parasomnias are preventable in many cases through household precautions. Seek medical help for any injury or dangerous behaviour during sleep."}}],misconceptions:[{claim:"Sleepwalkers are acting out a dream and are fully aware of what they do.",reality:"Sleepwalkers are not fully awake and typically have little recall of episodes."},{claim:"Sleep paralysis is dangerous and a sign of severe illness.",reality:"It is usually harmless, though frequent or distressing episodes merit a conversation with a clinician."},{claim:"Dream enactment is just a funny habit.",reality:"RBD can cause real injury and needs specialist assessment."}],takeaways:["Parasomnias are behaviours or experiences during sleep, arising from different sleep stages.","Household safety measures can prevent injury for people who move during sleep.","Dream enactment, injuries and frequent distressing episodes need medical assessment."],refs:["AASM-EDU","NHS-INSOMNIA","NHLBI-DEP"],keyTerms:["Parasomnia","Sleepwalking","Night terror","REM sleep behaviour disorder","Sleep paralysis","Hypnagogic hallucination"]},{id:38,part:7,title:"Excessive Daytime Sleepiness and Fatigue",subtitle:"Distinguishing sleepiness from fatigue, contributing factors, narcolepsy and driving safety",minutes:11,objectives:["Distinguish excessive daytime sleepiness from fatigue.","Describe common contributors, including insufficient sleep, medical conditions and medicines.","Explain the safety risks of drowsy driving and when to seek assessment."],figure:{kind:"compare",title:"Sleepiness versus fatigue",caption:"A simplified comparison. Many people experience both, and the causes can overlap. Persistent symptoms in either category need clinical assessment.",alt:"Two-column comparison. Sleepiness: a strong pull towards sleep, especially in quiet settings; often improves with sleep or a nap. Fatigue: a persistent sense of physical or mental exhaustion; may not improve with rest and can have many medical and lifestyle causes.",columns:[{title:"Sleepiness",items:["A strong urge to fall asleep, especially in quiet or monotonous settings","Often improves with sleep or a nap, at least briefly","Can cause micro-sleeps, nodding off and dangerous lapses","Often linked with sleep duration, timing or sleep disorders"]},{title:"Fatigue",items:["A persistent sense of exhaustion, physical or mental","May not improve with sleep","Can be linked with mood, illness, anaemia, thyroid or other medical conditions","Needs medical review if persistent and unexplained"]}]},sections:[{heading:"Sleepiness versus fatigue",paras:["Sleepiness is the tendency to fall asleep, while fatigue is a broader sense of tiredness or exhaustion that may involve the body, the mind or both. Sleepiness often responds to sleep or naps, whereas fatigue can persist even after sleep. This distinction helps clinicians direct assessment, though the two often overlap."],evidence:{level:"established",text:"The distinction between sleepiness and fatigue is widely used in sleep medicine and public health guidance."}},{heading:"Common contributing factors",paras:["Insufficient or irregular sleep is a common cause of sleepiness, along with circadian misalignment, shift work and some sleep disorders. Medical causes of fatigue include anaemia, thyroid disorders, infection, chronic illness and depression. Medicines, including some sedatives, antihistamines and antidepressants, can cause drowsiness. Alcohol and heavy meals can add to sleepiness in the short term."],evidence:{level:"established",text:"These are common contributors recognised in clinical sources. Individual cause requires clinical assessment."}},{heading:"Narcolepsy: an educational overview",paras:["Narcolepsy is a neurological sleep disorder characterised by excessive daytime sleepiness, sudden sleep attacks, disrupted night-time sleep and, in type 1, cataplexy (sudden loss of muscle tone triggered by emotion). It is associated with loss of hypocretin (orexin) signalling in the brain in type 1. Narcolepsy is diagnosed by specialists using clinical history and tests such as the multiple sleep latency test. It is not diagnosed by self-assessment."],evidence:{level:"established",text:"The link between orexin loss and type 1 narcolepsy is well established. Diagnosis is specialist-led."}},{heading:"Drowsy driving and machinery safety",paras:["Sleepiness while driving is responsible for serious crashes and deaths, according to the NHLBI, and can occur even without alcohol. Warning signs include yawning, drifting from lanes, missed exits, and microsleeps. Do not drive when sleepy. Stop in a safe place and rest, or use public transport. Operating machinery, working at heights, and caring for children while drowsy also carry serious risks."],evidence:{level:"safety",text:"Drowsy driving is a serious risk. If you have nodded off, fallen asleep at the wheel, or had near misses, seek professional advice."}}],misconceptions:[{claim:"Sleepiness during the day is normal and can be ignored.",reality:"Feeling sleepy most days is a signal to review sleep, medical and medicine factors, and it should not be ignored."},{claim:"You can drive safely if you open the window or drink coffee.",reality:"These measures may feel helpful but do not remove the danger of drowsy driving. Stop and rest."},{claim:"Narcolepsy is just being lazy.",reality:"Narcolepsy is a recognised neurological condition that needs specialist care."}],takeaways:["Sleepiness is a tendency to sleep; fatigue is a broader exhaustion that may persist after sleep.","Many causes are possible, including sleep habits, medical conditions and medicines.","Drowsy driving is dangerous: stop, rest, and seek help if sleepiness is persistent."],refs:["NHLBI-DEP","NHLBI-APNEA","AASM-EDU"],keyTerms:["Excessive daytime sleepiness","Fatigue","Narcolepsy","Cataplexy","Microsleep"]},{id:39,part:7,title:"Medicines, Supplements and Sleep Products",subtitle:"Melatonin, herbal products, sedating antihistamines, interactions and safe decision-making",minutes:12,objectives:["Describe the role, limitations and safety considerations for melatonin.","Evaluate evidence quality for herbal products and magnesium.","Recognise risks from self-medication and special cautions for children, pregnancy and older adults."],figure:{kind:"grid",title:"Sleep products: evidence and cautions at a glance",caption:"A general educational summary. Supplement quality and regulation vary between countries, and no product should be presumed safe or necessary for everyone.",alt:"Grid of six cards summarising sleep products: melatonin is a timing signal with variable product quality; herbal products have limited or mixed evidence; magnesium has limited evidence for sleep; sedating antihistamines can cause next-day drowsiness and confusion in older adults; prescription sleep medicines carry risks of dependence; interactions can occur with other medicines and alcohol.",items:[{title:"Melatonin",text:"A timing signal, not a general sedative. Product content varies, and use should be discussed with a clinician, especially in children and pregnancy."},{title:"Herbal products",text:"Evidence is limited or mixed. Quality and contents vary, and interactions are possible."},{title:"Magnesium",text:"Evidence for sleep benefit is limited. Discuss supplements with a clinician if you have kidney problems or take medicines."},{title:"Sedating antihistamines",text:"Can cause next-day drowsiness, confusion and falls, particularly in older adults."},{title:"Prescription sleep medicines",text:"Carry risks of dependence, tolerance, next-day effects and interactions. Use only under professional guidance."},{title:"Interactions",text:"Alcohol, other sedatives and some other medicines can interact dangerously with sleep products."}]},sections:[{heading:"Melatonin: role, limitations and safety",paras:["Melatonin is a hormone that signals darkness and helps time the body clock (Chapter 8). Melatonin supplements are used for sleep onset and jet lag, and they may have modest effects in some people. Their effects vary with dose, timing and individual factors. Product content can differ from the label in some studies, and regulation varies between countries. Melatonin may interact with other medicines, and its safety in children, pregnant and breastfeeding people, and people with certain medical conditions requires professional advice."],evidence:{level:"uncertain",text:"Melatonin has evidence for some circadian and insomnia-related uses, but results vary, and long-term safety data are limited for many uses."}},{heading:"Herbal products and evidence quality",paras:["Herbal sleep products include valerian, passionflower, chamomile, lavender, hops and others. Some trials report small benefits, but many studies are small, short or of mixed quality, and products vary greatly in content. 'Natural' does not mean safe: herbal products can interact with medicines, cause side effects, and be unsuitable for pregnancy or certain conditions. Ask a pharmacist before using any herbal product."],evidence:{level:"uncertain",text:"Evidence for herbal sleep products is limited and inconsistent. Traditional use does not establish effectiveness or safety."}},{heading:"Magnesium and other supplements",paras:["Magnesium is sometimes marketed for sleep. Evidence for a sleep benefit in people without deficiency is limited. Excess magnesium can be harmful, particularly for people with kidney problems. Other supplements, such as those containing amino acids or 'calming' blends, may have unclear effects and variable quality. No supplement is universally necessary for sleep."],evidence:{level:"uncertain",text:"Evidence for magnesium and many other supplements in sleep is limited or inconclusive."}},{heading:"Sedating antihistamines and prescription sleep medicines",paras:["Some over-the-counter sleep aids contain sedating antihistamines. These can cause next-day drowsiness and dry mouth, and in older adults they may cause confusion and falls. The NHS notes that pharmacy sleep products may help for one to two weeks but should not be used for longer and can make driving unsafe. Prescription sleep medicines are generally used for limited periods because of dependence risk, and the decision should be shared with a clinician."],evidence:{level:"safety",text:"Sedating medicines carry risks, and long-term use should be reviewed by a clinician. Never stop or change prescribed medicines without advice."}},{heading:"Special cautions and avoiding self-medication",paras:["Children, adolescents, pregnant and breastfeeding people, and older adults need particular caution with sleep products. Do not give children sleep medicines or supplements without professional advice. Do not combine sleep products with alcohol or other sedatives. Always check medicine interactions with a pharmacist, and keep a list of what you take to share with clinicians. Products should never be presented as a substitute for diagnosis or treatment."],evidence:{level:"safety",text:"Self-medication can be dangerous. Seek urgent help for overdose, severe drowsiness, breathing difficulty or confusion after taking a sleep product."}}],misconceptions:[{claim:"Melatonin is natural and therefore harmless.",reality:"Melatonin is a hormone with effects and interactions. It is not appropriate for every person, and product quality varies."},{claim:"Supplements are always safe because they are sold over the counter.",reality:"Supplements can cause harm, interact with medicines and vary in quality. Safety should be checked."},{claim:"If one product works for a friend, it will work for you.",reality:"Responses vary greatly, and personal circumstances determine safety and suitability."}],takeaways:["Melatonin is a timing signal with variable products and limited, context-specific evidence.","Herbal products and magnesium have limited or mixed evidence and can interact with medicines.","Ask a pharmacist or clinician before using any sleep product, especially for children, pregnancy and older adults."],refs:["NHS-INSOMNIA","BRAINARD-2001","AASM-EDU","QASEEM-2016"],keyTerms:["Melatonin","Herbal product","Magnesium","Antihistamine","Dependence","Drug interaction"]},{id:40,part:7,title:"When and How to Seek Professional Help",subtitle:"Warning signs, sleep diaries, clinical appointments, sleep studies and urgent safety",minutes:11,objectives:["Recognise warning signs that justify professional sleep assessment.","Prepare for a medical appointment using a sleep diary and specific questions.","Understand the types of sleep tests and the urgent situations that require immediate help."],figure:{kind:"flow",title:"A typical professional sleep assessment pathway",caption:"A general pathway. Specific steps vary by country, health system and clinical need. This is informational and does not describe a guaranteed sequence.",alt:"Vertical pathway of six steps: noticing persistent symptoms; keeping a sleep diary for two weeks or more; speaking with a GP, doctor or pharmacist; clinical history, questionnaires and examination; a sleep study or specialist test if indicated; treatment options discussed with follow-up.",steps:["Persistent symptoms noticed","Keep a sleep diary for about two weeks","Speak with a GP, doctor or pharmacist","History, questionnaires and examination","Sleep study or specialist test if indicated","Treatment options and follow-up"],vertical:!0},sections:[{heading:"Recognising persistent sleep difficulties",paras:["Seek advice if sleep problems last several weeks, if you snore loudly or have witnessed breathing pauses, if you are sleepy during the day despite adequate time in bed, if you experience unusual movements or behaviour in sleep, or if sleep changes are accompanied by low mood, anxiety, pain, or medication concerns. The NHS advises seeing a GP if changing habits has not helped insomnia after a reasonable period, or if trouble sleeping has lasted for months."],evidence:{level:"established",text:"Warning signs and NHS and NHLBI advice on when to seek help are consistent across major health sources."}},{heading:"Keeping a sleep diary for clinical discussion",paras:["A sleep diary records bedtime, approximate time to fall asleep, awakenings, wake time, naps, caffeine, alcohol, exercise, stress and how rested you feel. Chapter 41 and the worksheet section include templates. Keep it for about two weeks, or as your clinician requests. A diary is not a diagnosis, but it can help professionals understand patterns."],evidence:{level:"established",text:"Sleep diaries are standard tools in clinical sleep assessment."}},{heading:"Preparing for an appointment and sleep tests",paras:["Bring your sleep diary, a list of medicines and supplements, a note of symptoms and questions, and information from a bed partner if they have observed snoring or movements. Clinicians may use questionnaires, examination, blood tests and sleep studies. Sleep tests include polysomnography in a sleep laboratory, home sleep apnoea testing where clinically appropriate, actigraphy, and daytime sleepiness tests such as the multiple sleep latency test and maintenance of wakefulness test."],evidence:{level:"established",text:"These tests are described in AASM patient resources. Their use depends on clinical indication."}},{heading:"Questions to ask a clinician",paras:["Useful questions include: What might be causing my symptoms? Which tests do you recommend and why? What are the benefits and risks of each treatment option? Are there non-medicine approaches such as CBT-I that I could try? How will we know if treatment is working, and when will we review it? Are any of my medicines affecting my sleep?"],evidence:{level:"safety",text:"Never stop or change prescribed medicines without advice. Ask about alternatives if concerned."}},{heading:"Urgent and emergency safety",paras:["Seek immediate local medical help for severe breathing difficulty, chest pain, fainting, sudden weakness or facial drooping, slurred speech, sudden severe headache, acute confusion, a serious reaction to a medicine such as swelling of the face or throat, or suspected overdose. If you have thoughts of harming yourself, contact emergency services or a local crisis line straight away. Emergency numbers vary by country; for example, 112 is used across much of Europe, 911 in the United States and Canada, 999 or 112 in the United Kingdom, 000 in Australia and 111 in New Zealand. Check the number for your location now."],evidence:{level:"safety",text:"This section is urgent safety information. It is not a substitute for emergency care."}}],misconceptions:[{claim:"You should wait years before asking a doctor about sleep.",reality:"Persistent sleep difficulties are worth raising early. Earlier help can prevent unnecessary suffering."},{claim:"A sleep diary is only useful if it looks perfect.",reality:"Diaries are most useful when honest and consistent. Clinicians use them to find patterns, not to judge."},{claim:"Sleep studies are always painful or overwhelming.",reality:"Some tests are simple home or wearable-based options. Your clinician will explain which test is appropriate and what to expect."}],takeaways:["Persistent sleep difficulties, breathing concerns or daytime sleepiness warrant professional assessment.","A two-week sleep diary and a list of medicines help appointments be productive.","Urgent symptoms, including breathing difficulty and self-harm thoughts, require immediate help."],refs:["AASM-EDU","NHS-INSOMNIA","NHLBI-APNEA","NHLBI-DEP"],keyTerms:["Sleep study","Polysomnography","Sleep diary","Home sleep apnoea test","Multiple sleep latency test"]}],qf=[{id:41,part:8,title:"Understanding Your Personal Sleep Patterns",subtitle:"Sleep diaries, observation, wearables and avoiding monitoring perfectionism",minutes:10,objectives:["Use a simple sleep diary to observe patterns without judgement.","Understand what wake-time consistency, bedtime observations and daytime alertness can reveal.","Evaluate the limits of wearable devices and avoid excessive monitoring."],figure:{kind:"grid",title:"Example sleep diary entries (illustrative)",caption:"Illustrative entries only, showing the kind of information a diary can capture. These are not real records. A clinician may ask for a specific format.",alt:"Grid of six example diary cards for three days: bedtime and time taken to fall asleep, number of awakenings, wake time, naps and caffeine timing, evening activity, and an alertness rating from one to five.",items:[{title:"Day 1 (example)",text:"In bed 23:15; about 30 minutes to fall asleep; woke twice; up 06:45; alertness 3 of 5."},{title:"Day 2 (example)",text:"In bed 23:50; about 60 minutes to fall asleep; woke once; up 06:45; alertness 2 of 5; coffee at 16:00."},{title:"Day 3 (example)",text:"In bed 22:50; about 15 minutes to fall asleep; woke once; up 07:00; alertness 4 of 5; 20-minute walk at lunch."},{title:"Patterns to notice",text:"Wake-time variation, late caffeine, and whether alertness changes after evening screen use or late meals."},{title:"Environment notes",text:"Noise, temperature, light and who else was in the room."},{title:"Limits",text:"A diary describes patterns; it does not diagnose. Share it with a clinician if sleep problems persist."}]},sections:[{heading:"Why observe your sleep",paras:["Observing sleep can reveal patterns that are hard to notice from memory: how long sleep takes to start, how often you wake, whether weekends differ from weekdays, and how daytime alertness relates to caffeine, exercise, meals and stress. A diary can be a useful starting point for making changes and for discussions with a health professional."],evidence:{level:"established",text:"Sleep diaries are standard tools in both research and clinical sleep assessment."}},{heading:"Wake-time consistency and bedtime observations",paras:["Note your wake time on each day, including weekends, and approximate bedtime and time taken to fall asleep. Patterns of variation can be more informative than any single night. Observations about bedtime, such as whether you lie awake with worry, read, or check devices, may point to habits worth exploring."],evidence:{level:"developing",text:"Diary-based observations are useful for pattern recognition, though self-report has known limitations."}},{heading:"Daytime alertness and environment",paras:["Rate your alertness at key points in the day on a simple scale. Record environmental factors such as noise, light, temperature and shared rooms, and any substances or medicines taken. Doing this for a short period can reveal connections between conditions and sleep."],evidence:{level:"developing",text:"Self-rated alertness is widely used, though it is subjective."}},{heading:"Wearables and their limits",paras:["Wearable devices can estimate sleep duration and movement, and some estimate sleep stages and heart rate. These estimates are useful for trends but are not perfect: they can misclassify wakefulness and light sleep, and they cannot diagnose sleep disorders. Wearables that measure breathing or oxygen may still require clinical interpretation. Excessive checking of a sleep score can increase anxiety and reduce sleep for some people."],evidence:{level:"uncertain",text:"Accuracy varies by device and by sleep stage. Wearable data should be interpreted cautiously and never used alone to diagnose a condition."}}],misconceptions:[{claim:"A sleep tracker score shows whether your sleep is good.",reality:"Scores are estimates built from algorithms. They can be useful for trends but do not replace how you feel and function."},{claim:"Recording sleep every night is necessary to improve it.",reality:"Short, focused observation periods are often enough. Constant monitoring can increase pressure and worry."},{claim:"A diary is only for people with serious problems.",reality:"Diaries help anyone understand their sleep pattern and can be a useful first step."}],takeaways:["A simple sleep diary over one to two weeks can reveal useful patterns.","Wearables estimate sleep and cannot diagnose disorders.","Avoid perfectionism: observation should reduce worry, not add to it."],refs:["AASM-EDU","NHS-INSOMNIA"],keyTerms:["Sleep diary","Actigraphy","Wearable device","Alertness"]},{id:42,part:8,title:"Designing a Realistic Personal Sleep Routine",subtitle:"From assessing habits to reviewing progress without self-criticism",minutes:10,objectives:["Assess current habits and identify manageable changes.","Set priorities that fit work, family and other responsibilities.","Plan for setbacks and review progress kindly."],figure:{kind:"flow",title:"A realistic routine-design cycle",caption:"An iterative cycle. Most people repeat it several times, adjusting as life changes.",alt:"Vertical cycle of seven steps: assess current habits; choose one or two manageable changes; set priorities; adapt to responsibilities; build consistency; plan for setbacks; review progress without self-criticism, then return to assessment.",steps:["Assess current habits","Choose one or two manageable changes","Set priorities","Adapt to work and family","Build consistency gently","Plan for setbacks","Review without self-criticism"],vertical:!0},sections:[{heading:"Assessing current habits",paras:["Begin with an honest picture of your current pattern, without judging it. Consider your wake time, bedtime, caffeine and alcohol timing, meals, activity, screen use, environment and stress. Your diary from Chapter 41 provides the raw data. Note which factors are fixed (such as shift times) and which are flexible."],evidence:{level:"traditional",text:"Assessment-first approaches are common in practical sleep education and behavioural planning."}},{heading:"Identifying manageable changes and setting priorities",paras:["Choose one or two changes that are realistic, specific and linked to a reason you care about. Examples include keeping a steady wake time on most days, moving caffeine earlier, or setting a 20-minute wind-down. Smaller, sustained changes are generally more effective than sweeping ones. Priorities should consider safety first: if you drive while drowsy, that becomes an immediate priority."],evidence:{level:"developing",text:"Stepwise approaches are supported by behavioural research, though specific sequences are not validated for everyone."}},{heading:"Adapting to responsibilities and building consistency",paras:["Work, childcare, caring, study and finances shape what is possible. Plan changes around these responsibilities, using 'if-then' plans such as: if the baby wakes at 2 am, then I will use the feed as a chance to rest my eyes in a dim room. Build consistency with reminders, a visible plan and support from others. Expect uneven weeks."],evidence:{level:"developing",text:"Implementation planning improves follow-through in behavioural research, though the best forms vary."}},{heading:"Handling setbacks and reviewing progress",paras:["Setbacks are normal, such as an illness, a late night or a stressful week. Plan in advance what you will do: return to your usual wake time the next day and avoid compensating with extreme changes. Review progress every two to four weeks, noting what helped, what did not, and what new constraints arose. Reviewing kindly is more useful than criticising."],evidence:{level:"traditional",text:"Review and relapse-planning strategies are widely used in behavioural health, with varying evidence in sleep specifically."}}],misconceptions:[{claim:"A good routine means changing everything at once.",reality:"Gradual, focused changes are usually easier to sustain and easier to evaluate."},{claim:"One bad night means the whole routine has failed.",reality:"Single nights matter less than patterns over weeks. Returning to your routine is what counts."},{claim:"If I cannot follow the plan exactly, it is pointless.",reality:"Adapting the plan to real life is part of the process, not a failure."}],takeaways:["Assess before you change, and choose one or two realistic steps.","Plan around work and family, using simple if-then plans.","Plan for setbacks and review progress without self-criticism."],refs:["AASM-EDU","NHS-INSOMNIA"],keyTerms:["Implementation intention","Relapse prevention","Routine","Priority"]},{id:43,part:8,title:"Sleep and Shift Work",subtitle:"Night shifts, rotating rosters, long hours, strategic rest and workplace responsibilities",minutes:12,objectives:["Describe the challenges of night and rotating shift work for sleep and the body clock.","Explain strategic rest, napping and light-management approaches.","Identify workplace responsibilities and when occupational-health advice is needed."],figure:{kind:"day",title:"An illustrative night-shift day with strategic rest",caption:"An illustrative example, not a recommended roster. Actual schedules must be set with employers and occupational health, and the protective measures depend on the work.",alt:"24-hour bar showing an illustrative night-shift pattern: a main sleep period in the morning, a short strategic nap before a shift in the late afternoon, a night shift in the evening and overnight, and a commute and wind-down in the early morning.",segments:[{label:"Main sleep (morning)",start:8,end:15,tone:"dark"},{label:"Strategic nap",start:17,end:19,tone:"routine"},{label:"Night shift (approx.)",start:21,end:24,tone:"caution"},{label:"Night shift continues",start:0,end:7,tone:"caution"},{label:"Commute and wind-down",start:7,end:8,tone:"routine"}]},sections:[{heading:"Night shifts and rotating rosters",paras:["Night shift work requires sleeping during the day, when light, noise and social demands make rest harder. Rotating shifts repeatedly disturb the body clock, which can cause fatigue, digestive problems and sleep difficulties. Shift-work disorder is a recognised condition (Chapter 36). Many shift workers manage well with planning, but the burden varies widely."],evidence:{level:"established",text:"The sleep and alertness challenges of night and rotating shifts are well documented in occupational research."}},{heading:"Long hours and safety-sensitive roles",paras:["Long working hours increase fatigue, and fatigue affects safety in driving, healthcare, transport, construction and many other roles. Workplaces with safety-critical tasks should consider fatigue risk management, which can include rota design, rest periods and training. Workers should not be blamed for accidents caused by unsafe schedules."],evidence:{level:"established",text:"Fatigue is recognised as a safety risk in many occupations, and risk-management approaches are used in several sectors."}},{heading:"Strategic rest, light and environment",paras:["Strategic naps before a night shift or during a break can reduce sleepiness. Main sleep may be better with blackout curtains, earplugs, a cool room and clear communication with household members. Light exposure can be used strategically: bright light during the night shift and avoidance of bright light on the way home in the morning are often recommended, with individual variation. Caffeine timing should be planned to avoid disrupting main sleep."],evidence:{level:"developing",text:"Light and napping strategies show promise in shift-work research, but effects vary and outcomes depend on schedule design."}},{heading:"Workplace responsibilities and occupational-health advice",paras:["Employers can support workers by planning rosters that allow adequate rest between shifts, limiting consecutive nights, providing rest facilities, and offering occupational-health advice. Workers can ask for support if fatigue affects them, and should seek medical advice if symptoms persist. Commuting after night shifts requires particular care: if you feel drowsy, do not drive, and consider rest or a taxi or public transport."],evidence:{level:"safety",text:"Drowsy driving after shifts is dangerous. Workers should seek occupational-health advice when fatigue is persistent or affects safety."}}],misconceptions:[{claim:"Shift workers can simply adapt their body clock to any schedule.",reality:"Full adaptation is rare, and rotating patterns are particularly difficult. Many shift workers experience partial adjustment."},{claim:"Shift workers who are tired are not committed.",reality:"Fatigue is a biological and structural issue. It should be addressed through workplace design and support."},{claim:"Napping before a night shift is unprofessional.",reality:"Planned naps can be a recognised safety strategy when agreed within workplace policy."}],takeaways:["Night and rotating shifts disrupt the body clock and daytime sleep, and their effects vary.","Strategic naps, light management and protected main sleep help many shift workers.","Employers have responsibilities for rota design and fatigue risk, and drowsy driving is dangerous."],refs:["AASM-EDU","NHLBI-DEP","NHLBI-APNEA"],keyTerms:["Shift-work disorder","Fatigue risk management","Strategic napping","Rotating shift"]},{id:44,part:8,title:"Sleep, Learning and Productivity",subtitle:"Memory, attention, decisions and creativity, without unsupported promises",minutes:10,objectives:["Explain how sleep supports memory consolidation, attention and decision-making.","Discuss sleep’s role in creativity and learning with appropriate caution.","Avoid unsupported productivity promises while recognising the value of sleep in study and work."],figure:{kind:"flow",title:"How sleep supports learning and performance",caption:"A simplified pathway. Sleep supports learning and performance, but it is one factor among many, and effects depend on the task and person.",alt:"Flow diagram: learning happens during the day; sleep supports memory consolidation; consolidated memories are more available the next day; attention and decision-making improve with adequate sleep; creativity may benefit in some tasks; performance improves over time when sleep is regular.",steps:["Learning during the day","Memory consolidation in sleep","Memories more available next day","Attention and decisions improve","Some creative tasks may benefit","Regular sleep supports long-term performance"]},sections:[{heading:"Memory consolidation and learning",paras:["Sleep supports memory consolidation, particularly after learning. Studies in which people learn material and are tested after sleep or wakefulness often find benefits of sleep, with stronger effects for some kinds of tasks. Students who spread learning across days and protect sleep before exams may find this approach helpful, but there is no single 'perfect' study schedule."],evidence:{level:"developing",text:"The benefits of sleep for memory are supported, though the size of effects and the best strategies remain under study."}},{heading:"Attention, decision-making and safety",paras:["Sleep deprivation impairs attention, reaction time, working memory and decision-making. Errors can increase even when people feel they are performing well. This is one reason sleep is a safety issue in driving, healthcare and high-stakes work."],evidence:{level:"established",text:"Impairments in attention and performance from sleep loss are well documented in experimental and occupational studies."}},{heading:"Creativity and productivity claims",paras:["Some evidence suggests sleep can help insight and creative problem-solving on certain tasks, particularly after rest. However, claims that a particular sleep pattern will unlock genius, or that sleeping less will raise productivity, are not supported by reliable evidence. Sleep should not be treated as wasted time."],evidence:{level:"preliminary",text:"Creativity effects of sleep are reported in small studies. Generalisations to everyday creativity are not established."}},{heading:"Learning environments and workplaces",paras:["Schools and workplaces can support learning by scheduling demanding tasks at suitable times, allowing breaks, and recognising the effects of late-night study and overwork. Students and employees can plan demanding work earlier in the day when alert, protect sleep before important sessions, and avoid all-night cramming."],evidence:{level:"traditional",text:"Scheduling and workplace guidance draws on sleep research and practice, with varying evidence."}}],misconceptions:[{claim:"Sleep is wasted productive time.",reality:"Sleep supports the processes that make learning and performance possible."},{claim:"You can become a genius by sleeping less.",reality:"There is no reliable evidence for this. Sleep loss consistently impairs performance."},{claim:"All-night study before an exam is the best strategy.",reality:"Sleep before and after learning supports memory, and extended sleep loss tends to impair performance."}],takeaways:["Sleep supports memory consolidation and attention.","Sleep loss impairs learning, decision-making and safety.","Avoid unsupported productivity promises; protect sleep as part of learning."],refs:["DIEKELMANN-2010","WATSON-2015","AASM-EDU"],keyTerms:["Memory consolidation","Working memory","Attention","Insight"],related:"Book 11 (Healthy Weight Management, Metabolism & Sustainable Lifestyle Habits) also explores sustainable habit-building that complements sleep routines."},{id:45,part:8,title:"Sleep, Physical Recovery and Wellbeing",subtitle:"Recovery, immunity, metabolism, emotional wellbeing and the limits of current evidence",minutes:11,objectives:["Describe how sleep supports physical recovery after exercise and illness.","Explain the associations between sleep and metabolic, immune and emotional health.","Distinguish correlation from causation and state the limits of current evidence."],figure:{kind:"flow",title:"Sleep and physical recovery pathways (general)",caption:"A general overview. Several pathways are plausible and studied, but most links with long-term health are observational and multifactorial.",alt:"Flow diagram: physical activity and illness create demand for recovery; sleep supports tissue repair and hormone release; immune signalling is adjusted; metabolic regulation is supported; emotional wellbeing is supported; long-term health outcomes depend on many factors including sleep.",steps:["Exercise or illness creates demand","Sleep supports tissue repair","Hormone release and recovery","Immune signalling adjusted","Metabolic regulation","Emotional wellbeing"]},sections:[{heading:"Exercise recovery and physical restoration",paras:["Recovery after exercise involves muscle repair, hormone regulation and nervous system recovery, and sleep is an important part of this process. Athletes and active people may find that poor sleep reduces performance and increases injury risk, though individual responses vary. Adequate rest days and sleep should be built into training plans."],evidence:{level:"developing",text:"Sleep and recovery links are supported in sports science, but many studies are small and mechanisms are complex."}},{heading:"Immune system and infection",paras:["Sleep interacts with immune function. Short sleep has been associated with increased susceptibility to some infections in observational studies, and sleep patterns have been linked with vaccine responses in some research. These findings are not strong enough to claim that sleep prevents infection, and general prevention measures remain essential."],evidence:{level:"developing",text:"Associations between sleep and immune outcomes are reported, but causal effects and their size are not firmly established."}},{heading:"Metabolic and emotional associations",paras:["Short or irregular sleep is associated in observational studies with higher risks of type 2 diabetes, weight gain and cardiovascular disease, and with poorer mood. Experimental sleep restriction studies also show changes in appetite-related hormones and glucose handling. These associations are important, but they are influenced by many other factors, including diet, activity, income, smoking and genetics."],evidence:{level:"developing",text:"The association between sleep and metabolic and emotional health is consistent across studies. Causation is partially established and requires more research for many outcomes."}},{heading:"Correlation, causation and scientific uncertainty",paras:["A key principle is that correlation does not prove causation. People who sleep poorly may also have stress, illness, shift work or other conditions that affect health. Many long-term studies rely on self-reported sleep. Readers should be cautious of claims that a single sleep change will prevent serious disease. Sleep is one of several important aspects of health, alongside nutrition, activity, social connection and healthcare."],evidence:{level:"uncertain",text:"Long-term causal conclusions about sleep and disease remain uncertain for many outcomes."}}],misconceptions:[{claim:"Sleep alone prevents serious illness.",reality:"Sleep is one part of health. Many factors interact, and sleep should be considered alongside other health measures."},{claim:"Hard training always needs more sleep than anything else.",reality:"Sleep matters greatly, but nutrition, training structure and medical factors also influence recovery."},{claim:"The research proves that sleep causes weight gain.",reality:"The research shows associations and some experimental effects on appetite-related hormones. Causal claims require careful interpretation."}],takeaways:["Sleep supports physical recovery, immune function, metabolism and emotional wellbeing.","Most long-term evidence is observational, so correlation does not prove causation.","Sleep is important but is one part of overall health."],refs:["CAPPUCCIO-2010","IRWIN-2015","WHO-PA","NHLBI-DEP"],keyTerms:["Correlation","Causation","Observational study","Recovery"]},{id:46,part:8,title:"Global Sleep Cultures and Different Living Conditions",subtitle:"Respecting diverse approaches to rest across climates, households and economies",minutes:12,objectives:["Describe how culture, climate and household structure shape sleep across the world.","Identify affordable sleep-supporting practices suited to different living conditions.","Approach cultural differences with respect and avoid assuming one standard of sleep."],figure:{kind:"grid",title:"Sleep across different contexts",caption:"A broad overview. Sleep practices vary greatly within each region, and every category includes many individual circumstances.",alt:"Grid of six cards describing contexts that shape sleep: cultural rest traditions such as midday rest; multigenerational households with shared rooms; warm climates needing ventilation and shade; cold climates needing insulation and safe heating; urban noise and light; rural and remote living with different light and access to care.",items:[{title:"Cultural rest",text:"Midday rest, siesta-style breaks and other traditions can coexist with healthy night sleep."},{title:"Shared households",text:"Multigenerational homes often mean shared rooms and changing responsibilities at night."},{title:"Warm climates",text:"Ventilation, shade, fans and careful bedding help in heat, with heat safety in mind."},{title:"Cold climates",text:"Insulation, warm bedding and safe heating reduce discomfort, with carbon monoxide safety."},{title:"Urban life",text:"Traffic, nightlife and street lighting can disrupt sleep; community noise measures may help."},{title:"Rural and remote",text:"Darker nights can help sleep, but healthcare access and transport can be limited."}]},sections:[{heading:"Cultural approaches to rest",paras:["Across the world, people have developed different patterns of rest. Some countries have long traditions of midday rest; others have strong evening social lives; some cultures include religious or community sleep schedules. In Japan, inemuri (brief sleep while present) is socially recognised. In many regions, multiple sleep periods have historically been normal. Modern schooling and work have often compressed sleep into a single block, which is one reason for social jet lag and sleep loss."],evidence:{level:"traditional",text:"Cultural sleep practices are documented in ethnographic and historical sources. Their health implications vary and are not uniformly studied."}},{heading:"Households, rooms and shared sleep",paras:["Many families share bedrooms or sleep in communal spaces. Shared sleeping is common in many cultures and can bring warmth and safety. For infants, safe-sleep guidance applies, and national advice should be followed. Practical measures include sleep zones, agreed quiet times, and rotating night responsibilities across adults in the household."],evidence:{level:"established",text:"Safe-sleep guidance for infants is established in national health recommendations."}},{heading:"Climate, seasons and urban or rural life",paras:["Hot climates can make sleep difficult without air conditioning, and cold climates can cause discomfort or unsafe heating practices. Seasonal changes in daylight affect many people’s timing. Urban residents may face noise and light pollution, while rural and remote residents may have darker nights but less access to health services. None of these situations is a personal failing."],evidence:{level:"developing",text:"Climate and urban factors influence sleep in observational and some experimental research, with variation across populations."}},{heading:"Affordable, respectful sleep-supporting practices",paras:["Affordable practices include ventilating rooms, using shade and fans, insulating or draught-proofing, using light-blocking fabrics, arranging quiet hours, protecting morning light exposure, and building simple wind-down routines. Respect cultural and religious practices, and avoid assuming that one schedule suits every community. Health professionals can work with communities to adapt advice to local realities, language and resources."],evidence:{level:"traditional",text:"Affordable and culturally sensitive approaches are supported by public health practice rather than always by trials."}}],misconceptions:[{claim:"Western eight-hour sleep is the universal standard.",reality:"Sleep patterns vary across cultures and history. Health guidance focuses on adequate, regular sleep rather than one pattern."},{claim:"Napping in some cultures shows those societies are unproductive.",reality:"Rest traditions reflect diverse lifestyles and climates, and they can coexist with healthy productivity."},{claim:"Poor sleep in low-income or crowded housing is a personal failing.",reality:"Structural conditions strongly shape sleep. Solutions require community, housing and policy action as well as personal habits."}],takeaways:["Sleep patterns vary across cultures, households and climates, and there is no single global model.","Affordable measures such as ventilation, shade, insulation, sleep zones and quiet hours can help.","Cultural respect and structural awareness are essential for useful sleep advice."],refs:["AASM-EDU","CDC-SLEEP","HIRSHKOWITZ-2015"],keyTerms:["Siesta","Inemuri","Multigenerational household","Sleep zone","Heat stress"]},{id:47,part:8,title:"Common Sleep Myths and Misconceptions",subtitle:"Twenty-seven widely repeated claims, evaluated against the evidence",minutes:14,objectives:["Evaluate common sleep claims by separating what is supported, what is misleading and what is uncertain.","Practise critical reading of sleep products, wellness content and social-media advice.","Build confidence in evidence-based sources for everyday decisions."],figure:{kind:"compare",title:"Myth versus evidence: examples from this chapter",caption:"Examples only. The full list of evaluated claims appears in the chapter text, below the figure.",alt:"Two-column comparison. The left column lists common myths: everyone needs exactly eight hours, alcohol is an effective sleep aid, and one food cures insomnia. The right column summarises evidence: seven or more hours is a minimum guideline for adults, alcohol disrupts later sleep, and no single food has been shown to cure insomnia.",columns:[{title:"Common myths",items:["Everyone needs exactly eight hours","Alcohol is an effective sleep aid","One food cures insomnia","Snoring is always harmless"]},{title:"What evidence shows",items:["Seven or more hours is a minimum guideline for typical adults; individual needs vary","Alcohol can cause early drowsiness but disrupts later sleep and worsens breathing","No single food has been shown to cure insomnia","Simple snoring is common, but breathing pauses need assessment"]}]},sections:[{heading:"How to evaluate a sleep claim",paras:["Ask: Who is making the claim, and what is their interest? What kind of study supports it, and how many people were included? Was the outcome measured objectively, such as with a sleep study, or only by self-report? Is the claim a causal statement or an association? Has it been reproduced? Claims that promise rapid cures or require purchase are particularly worth scrutiny. Each claim below is evaluated in three parts: what is supported, what is misleading and what remains uncertain."],evidence:{level:"established",text:"These questions reflect standard principles of evidence appraisal in health education."}}],misconceptions:[{claim:"1. Everyone needs exactly eight hours.",reality:"Supported: adults generally need seven or more hours regularly. Misleading: eight is a fixed requirement. Uncertain: exact individual needs."},{claim:"2. Older adults do not need much sleep.",reality:"Supported: sleep architecture and timing often change with age. Misleading: older adults need substantially less sleep. Uncertain: precise targets for older individuals."},{claim:"3. You can fully compensate for chronic sleep loss on weekends.",reality:"Supported: catch-up sleep can reduce acute sleepiness. Misleading: weekend catch-up fully restores chronic restriction. Uncertain: long-term effects of irregular catch-up."},{claim:"4. Alcohol is an effective sleep aid.",reality:"Supported: alcohol can cause early drowsiness. Misleading: it is effective, since later-night sleep is disrupted and breathing can worsen. Uncertain: how much harm occurs at low doses for each person."},{claim:"5. More supplements always improve sleep.",reality:"Supported: some products have limited studies. Misleading: more is better, as interactions and safety risks increase. Uncertain: benefit for specific people."},{claim:"6. All blue light is equally harmful.",reality:"Supported: short-wavelength light can affect circadian timing. Misleading: all light sources and amounts are equivalent; daylight is beneficial. Uncertain: real-world size of screen effects."},{claim:"7. Snoring is always harmless.",reality:"Supported: simple snoring is common. Misleading: snoring with pauses or sleepiness is harmless. Uncertain: which snorers develop complications."},{claim:"8. Everyone should go to bed early.",reality:"Supported: adequate, regular sl
