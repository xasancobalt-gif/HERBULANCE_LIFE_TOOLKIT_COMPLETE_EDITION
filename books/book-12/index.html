al flow diagram with six boxes: wakefulness, sleep pressure builds, sleep onset, repeating NREM and REM cycles, restoration and processing, and waking in the morning.",steps:["Wakefulness","Sleep pressure builds","Sleep onset","Repeating NREM and REM cycles","Restoration and processing","Waking"]},sections:[{heading:"What sleep is",paras:["Sleep is a reversible state of reduced responsiveness to the surrounding environment. During sleep, people usually lie still, respond less to sounds and other stimuli, and can be woken, although sleep is not the same as being unconscious. Scientists identify sleep using brain-wave recordings (electroencephalography, or EEG), eye movements and muscle activity, usually measured together in a sleep study.","Quiet rest differs from sleep. A person resting with their eyes closed remains broadly aware of their surroundings and their brain activity resembles that of wakefulness. In sleep, the brain shows distinctive patterns that change across the night and are recognised by standard scoring systems used in sleep medicine."],evidence:{level:"established",text:"The definition of sleep by behavioural and EEG criteria is standard in sleep medicine and research (American Academy of Sleep Medicine, Sleep Education resources)."}},{heading:"Sleep as an active, regulated process",paras:["Sleep is not simply a pause in brain activity. Its timing is regulated by two interacting systems: a homeostatic drive that builds during wakefulness and dissipates during sleep, and a circadian system that sets the broad timing of sleepiness and alertness across the 24-hour day (Chapter 6). Sleep stages involve characteristic patterns of neural firing, hormone release and changes in heart rate and breathing.","Because sleep is regulated, it can be disturbed. Illness, pain, stress, medicines, light, noise and irregular schedules can all change when sleep begins, how deep it is, and how often it is interrupted. Understanding this regulation helps readers see why sleep difficulties are usually the result of several interacting factors rather than a single cause."]},{heading:"Why humans need sleep",paras:["Across animal species, sleep or sleep-like states are widely observed, although their form differs greatly. In humans, sleep is considered essential because prolonged sleep restriction is associated with impaired attention, memory, mood, decision-making and reaction time, and with higher risks of accidents. Research has also linked long-term insufficient sleep to several chronic health conditions, although many of these associations are observational.","The National Heart, Lung, and Blood Institute describes sleep as a basic need, like eating, drinking and breathing, that is vital for health throughout life. The exact purpose of sleep is not fully explained by a single theory; current research points to several overlapping functions covered in Chapter 4."],evidence:{level:"developing",text:"The core functions of sleep are not fully understood. Several theories are supported by evidence, but no single explanation accounts for all observed effects."}},{heading:"Sleep quantity and sleep quality",paras:["Sleep quantity is the total time spent asleep, usually measured across 24 hours or during a main overnight period. Sleep quality describes how well sleep serves the person: how quickly it begins, how continuous it is, how deep it becomes, whether it occurs at a suitable time of day, and whether the person wakes feeling reasonably rested.","The two are related but not identical. A person can spend many hours in bed with fragmented, light sleep and wake unrefreshed. Another person may sleep fewer hours with consolidated, restorative sleep and function well during the day. However, a person who consistently feels sleepy during the day should consider whether their quantity, quality or timing is insufficient for them, and seek advice if the problem persists."],bullets:["Quantity: total hours asleep.","Continuity: how many times sleep is interrupted.","Timing: whether sleep occurs at a biologically and socially suitable time.","Daytime functioning: whether alertness, mood and performance are adequate."]},{heading:"Why sleep needs differ",paras:["Sleep needs change with age and vary between individuals. Genetic influences, health status, pregnancy, physical activity, previous sleep loss, mental health and environmental conditions all contribute. Some people habitually sleep less without apparent harm, but researchers consider this uncommon, and most people who sleep consistently less than recommended show measurable effects.","No single number suits everyone. Chapter 5 explains population-level recommendations and why they are guidance rather than individual targets. Readers should be cautious of anyone, including online sources, who offers a fixed number of hours as universally correct."],evidence:{level:"established",text:"Individual sleep need varies, and population guidelines describe typical ranges, not personal prescriptions."}}],misconceptions:[{claim:"Sleep is wasted time.",reality:"Sleep is a biological need. Time spent asleep supports memory, emotional processing, physical recovery and many regulatory functions."},{claim:"Some people function perfectly well on four hours of sleep.",reality:"Naturally short sleepers are very rare. Most people who regularly sleep far less than they need show impaired attention and performance even when they feel used to it."},{claim:"Sleep is the same as the brain switching off.",reality:"Many brain regions remain active during sleep, and the sleeping brain shows structured patterns that change through the night."}],takeaways:["Sleep is a regulated, reversible state, not a passive shutdown.","Quantity and quality both matter, and neither alone describes sleep health.","Sleep needs vary; population ranges are a guide, not a fixed target for every person."],refs:["NHLBI-DEP","NHS-TIRED","AASM-EDU","WATSON-2015"],keyTerms:["Sleep","Electroencephalography (EEG)","Sleep quality","Sleep quantity"]},{id:2,part:1,title:"The Science of the Sleeping Brain",subtitle:"Networks, neurotransmitters and the switch between wakefulness and sleep",minutes:11,objectives:["Describe the main brain regions and networks involved in regulating sleep and wakefulness.","Explain the roles of key neurotransmitters, including GABA, adenosine, orexin and noradrenaline.","Describe how the brain transitions from wakefulness to sleep."],figure:{kind:"compare",title:"Systems that promote wakefulness versus sleep",caption:"A simplified comparison. Real regulation involves many interacting cell groups and chemical messengers, and the diagram is not a complete anatomical map.",alt:"Two-column comparison. The left column lists wake-promoting systems: brainstem arousal networks, hypothalamic orexin neurons, histamine and cholinergic pathways. The right column lists sleep-promoting systems: the ventrolateral preoptic area of the hypothalamus, GABA-releasing inhibitory neurons, and adenosine build-up.",columns:[{title:"Wake-promoting influences",items:["Brainstem arousal networks (noradrenaline, serotonin and acetylcholine pathways)","Orexin (hypocretin) neurons in the hypothalamus that help stabilise wakefulness","Histamine-releasing neurons in the hypothalamus","Light input that signals daytime to the body clock"]},{title:"Sleep-promoting influences",items:["Ventrolateral preoptic area (VLPO) of the hypothalamus","GABA-releasing inhibitory neurons that quieten arousal centres","Adenosine accumulating during extended wakefulness","Evening rise in melatonin, a signal of biological night"]}]},sections:[{heading:"Brain activity during sleep",paras:["EEG recordings show clear changes between wakefulness and sleep. Wakefulness is typically characterised by fast, low-amplitude activity. Non-REM sleep becomes progressively slower and larger in amplitude, and deep non-REM sleep (N3) contains slow waves at roughly 0.5 to 2 cycles per second. REM sleep looks more like wakefulness on the EEG, yet muscles are largely switched off, which is why REM is often called paradoxical sleep.","Brain activity during sleep is not uniform. Different regions switch their activity at different times, and networks coordinate communication between the cortex, thalamus and deeper structures."],evidence:{level:"established",text:"EEG patterns for wakefulness, non-REM stages and REM sleep are defined in the American Academy of Sleep Medicine scoring manual used in clinics and research."}},{heading:"Key regions: hypothalamus, brainstem, thalamus and cortex",paras:["The hypothalamus, a small region at the base of the brain, contains groups of neurons that promote sleep, such as the ventrolateral preoptic area, and others that promote wakefulness, such as orexin-producing neurons. The suprachiasmatic nucleus, the master circadian clock, also sits in the hypothalamus (Chapter 7).","The brainstem contains arousal networks that influence the cortex, and circuits involved in generating REM sleep and muscle atonia. The thalamus acts as a relay for sensory information. During lighter non-REM sleep, thalamic circuits produce sleep spindles, brief bursts of activity that help shield the sleeping brain from some external sounds. The cerebral cortex generates the slow waves typical of deep sleep."],evidence:{level:"developing",text:"The general roles of these regions are well supported. The precise circuit mechanisms are an active area of research."}},{heading:"Sleep-related neurotransmitters",paras:["GABA is the main inhibitory neurotransmitter in the brain and is central to sleep promotion. Many sleep-related medicines act on GABA receptors, but this does not mean that such medicines reproduce natural sleep. Adenosine accumulates during wakefulness and contributes to the drive to sleep; caffeine works largely by blocking adenosine receptors (Chapter 20). Orexin helps maintain stable wakefulness, and its loss is involved in narcolepsy type 1. Noradrenaline, serotonin, histamine and acetylcholine modulate arousal and sleep states at different times.","Melatonin is a hormone rather than a classic neurotransmitter, but it provides a strong signal about night-time and helps time the body clock (Chapter 8)."],evidence:{level:"established",text:"The roles of GABA, orexin and adenosine in sleep regulation are supported by substantial research. The complete balance of signals is still being mapped."}},{heading:"How the brain moves from wakefulness to sleep",paras:["Sleep onset depends on decreasing arousal and increasing sleep-promoting activity. Sleep pressure builds with time awake, and the circadian system signals when the biological night approaches. Together these reduce wake-promoting input and allow sleep-promoting networks to dominate. Many researchers describe this as a switch-like transition, in which the brain moves relatively rapidly between states rather than gradually fading.","Transitions are not always clean. Brief awakenings, drifting thoughts (hypnagogic experiences) and muscle twitches are common at sleep onset. Under severe sleep loss, people may experience brief involuntary sleep episodes called microsleeps, which can be dangerous during driving or other tasks."],evidence:{level:"developing",text:"The switch-like model is useful and supported by many experiments, but the details of transition dynamics continue to be refined."}}],misconceptions:[{claim:"The brain shuts down during sleep.",reality:"Many areas are highly active. Sleep involves organised changes in activity rather than an absence of activity."},{claim:"One brain region controls sleep.",reality:"Sleep is regulated by interacting networks spanning the hypothalamus, brainstem, thalamus and cortex."},{claim:"Sleep medicines produce exactly the same brain state as natural sleep.",reality:"Medicines can change sleep architecture in different ways. This is one reason they are discussed with clinicians rather than used casually (Chapter 39)."}],takeaways:["Sleep is produced by networks that balance wake-promoting and sleep-promoting signals.","Adenosine, GABA and orexin are important messengers in this balance.","Sleep onset is shaped by both sleep pressure and the body clock."],refs:["NINDS-ROOT","AASM-EDU","BORBELY-1982"],keyTerms:["Hypothalamus","Thalamus","GABA","Orexin","Adenosine","Sleep spindle","Microsleep"]},{id:3,part:1,title:"Understanding Sleep Architecture",subtitle:"Stages, cycles and the changing structure of a night’s sleep",minutes:10,objectives:["Name and describe the N1, N2, N3 and REM stages of sleep.","Explain how sleep cycles are organised across a typical night.","Describe how sleep architecture changes with age and why a single 'ideal' pattern does not exist."],figure:{kind:"hypnogram",title:"An illustrative night of sleep stages",caption:"An illustrative pattern in 15-minute blocks. It is not anyone’s real data. Clinical sleep studies score 30-second epochs, and real nights vary widely.",alt:"Stepped line chart showing an illustrative night. Deep sleep (N3) appears mostly in the first half of the night, REM periods become longer toward the morning, and brief wake periods appear occasionally. Stages are labelled on the vertical axis from wake to REM.",stages:["W","N1","N2","N2","N3","N3","N3","N2","R","N2","N2","N3","N3","N2","R","N2","N2","N2","R","N2","N2","N2","R","N2","N2","N2","R","W","N2","R","N2","W"],epochMinutes:15},sections:[{heading:"The non-REM stages",paras:["Non-REM sleep is divided into three stages. N1 is the lightest stage and the transition from wakefulness. It usually lasts only a few minutes, and people often do not realise they have been asleep. N2 is a stable light sleep with sleep spindles and K-complexes on the EEG; in adults it typically accounts for the largest share of total sleep. N3, sometimes called slow-wave or deep sleep, has the highest proportion of slow waves. It is the hardest stage from which to wake and is most prominent early in the night.","Under the American Academy of Sleep Medicine scoring system, stages are assigned in 30-second epochs. The proportions of each stage differ between individuals, and the usual adult proportions are general descriptions rather than targets."],evidence:{level:"established",text:"The N1, N2, N3 and REM definitions are standard, and typical adult stage proportions are widely reported in sleep medicine references."}},{heading:"REM sleep",paras:["REM (rapid eye movement) sleep is characterised by rapid eye movements, low muscle tone (atonia) and a more active EEG pattern that resembles wakefulness. Heart rate and breathing become more variable. Vivid dreams are more common in REM, although dreaming also occurs in non-REM sleep, often with less visual detail.","REM sleep is more prominent in the second half of the night, when longer REM periods tend to occur. Its functions are still being studied, and research suggests links with emotional processing and some forms of memory (Chapter 4)."],evidence:{level:"developing",text:"The association of REM with dreaming and some memory processes is supported, but precise functions remain debated."}},{heading:"Sleep cycles through the night",paras:["A sleep cycle moves through non-REM stages and then into REM sleep, after which the cycle begins again. On average in adults, a cycle lasts around 90 minutes, but this is an average rather than a fixed length. Cycles vary between people and between nights, and some people have more or fewer cycles in a night.","Early cycles contain more N3, while later cycles contain more REM and lighter sleep. This is why cutting sleep short in the morning often removes a larger share of REM sleep, and why short nights reduce REM in particular."],bullets:["Early night: deeper non-REM sleep predominates.","Later night: REM periods tend to lengthen.","Brief awakenings between cycles are common and usually forgotten."],evidence:{level:"established",text:"The overall cycle structure and the early-versus-late distribution of N3 and REM are well documented in polysomnography research."}},{heading:"Architecture across the lifespan",paras:["Sleep architecture changes markedly with age. Infants spend a larger share of sleep in REM-like states and sleep in many shorter periods. Slow-wave sleep is most prominent in childhood and declines through adult life. Older adults often have lighter, more fragmented sleep, though the amount of change varies and is influenced by health and medication.","Because architecture changes with age, a 'normal' hypnogram for a teenager or an older adult may look different from one for a young adult. Interpretation requires professional expertise, and a single night’s recording is not sufficient for diagnosis."],evidence:{level:"developing",text:"The direction of age-related change is well established, but the magnitude and causes vary across studies."}}],misconceptions:[{claim:"Dreams only happen during REM sleep.",reality:"Dreams are most vivid in REM, but people also report dream-like experiences from non-REM sleep, often less visual and less narrative."},{claim:"You need exactly five sleep cycles a night.",reality:"Cycle length and number vary. Cycles are a useful descriptive model, not a precise quota."},{claim:"A sleep chart reveals whether you have a disorder.",reality:"Sleep stage charts require professional scoring and clinical context. Self-made charts or wearable graphs cannot diagnose sleep disorders."}],takeaways:["N1, N2 and N3 form non-REM sleep, while REM is a distinct stage with different features.","Sleep cycles last around 90 minutes on average, but individual variation is normal.","Architecture changes with age, so there is no single ideal pattern for everyone."],refs:["AASM-EDU","DIEKELMANN-2010","NHLBI-DEP"],keyTerms:["N1 sleep","N2 sleep","N3 sleep","REM sleep","Slow-wave sleep","Sleep architecture","Sleep cycle"]},{id:4,part:1,title:"The Biological Functions of Sleep",subtitle:"Memory, emotion, brain maintenance, hormones, metabolism, immunity and recovery",minutes:12,objectives:["Explain how sleep supports learning and memory consolidation.","Describe evidence linking sleep to emotional regulation, metabolism, hormones and immune function.","Identify the limits of current scientific knowledge about sleep’s functions."],figure:{kind:"flow",title:"Systems that sleep is thought to support",caption:"Many functions are supported by sleep. Strength of evidence varies, and many links are observational rather than proven causes.",alt:"Flow diagram titled sleep supports, with eight boxes arranged in sequence: memory consolidation, emotional processing, brain clearance in animal studies, hormone release, metabolic regulation, immune signalling, physical recovery and childhood growth.",steps:["Memory consolidation","Emotional processing","Brain clearance (animal research)","Hormone release","Metabolic regulation","Immune signalling","Physical recovery","Growth in childhood"]},sections:[{heading:"Learning and memory consolidation",paras:["Memory consolidation refers to processes that stabilise newly acquired memories. Research suggests that slow-wave sleep supports the transfer and reorganisation of memories from short-term to longer-term stores, while sleep spindles and REM sleep are also implicated in different forms of memory processing. Studies in which people learn a task and are tested after sleep or wakefulness often show benefits of sleep, especially for certain kinds of skills and for information organised into patterns.","This does not mean that sleep 'stores' everything or that studying late at night is a substitute for rest. Sleep supports memory best when learning has already taken place and when sleep is sufficient and regular."],evidence:{level:"developing",text:"A major review by Diekelmann and Born (2010) supports a memory function of sleep. The specific roles of individual stages remain under investigation."}},{heading:"Emotional regulation and brain maintenance",paras:["Experimental studies suggest that sleep loss increases reactivity to negative emotional stimuli and reduces the brain’s ability to regulate emotion, and that sleep helps to process emotional experiences. These findings are part of a growing picture that connects sleep with mood and resilience (Chapter 32).","A widely discussed mouse study by Xie and colleagues (2013) found that the space between brain cells expanded during sleep and that waste products were cleared more quickly. This glymphatic-type clearance has generated considerable interest, but the findings come from animal research and their relevance to human brain health is still being studied."],evidence:{level:"preliminary",text:"The brain clearance findings are from animal research and have not yet been fully confirmed in humans."}},{heading:"Hormones, metabolism and immune function",paras:["Sleep influences the release of several hormones. Growth hormone secretion is linked with slow-wave sleep, and cortisol rhythms interact with sleep timing. Controlled studies have shown that restricted sleep can alter appetite-related hormones and glucose handling. Large observational studies have associated short sleep with a higher risk of type 2 diabetes, for example in a meta-analysis by Cappuccio and colleagues (2010), though association does not prove that sleep loss causes the condition.","Sleep also interacts with immune signalling. Acute sleep loss can change immune cell activity, and some studies link sleep patterns with vaccine responses, but findings are mixed and do not support simple claims that sleep prevents infection."],evidence:{level:"developing",text:"Associations between sleep, metabolism and immunity are supported by multiple studies, but the size and direction of effects vary, and causation is not established for most outcomes."}},{heading:"Physical recovery and growth",paras:["Physical recovery after exercise, illness and injury involves rest, and sleep is an important component of it. Growth hormone pulses during deep sleep support tissue repair in children and adults. During childhood, sleep is also closely linked with growth and brain development.","Scientists continue to debate how much of sleep’s restorative effect is due to specific chemical events, how much reflects reduced demands on the body, and how these vary with age and health. Readers should treat claims about any single mechanism with caution."],evidence:{level:"uncertain",text:"The mechanisms of physical restoration during sleep are not fully defined. Several proposed pathways are plausible, but not all are confirmed in humans."}}],misconceptions:[{claim:"Sleep only benefits the brain.",reality:"Sleep affects many organ systems. The brain is one important focus, but hormones, metabolism, immunity and physical recovery are also involved."},{claim:"Sleeping more will prevent colds or cure metabolic disease.",reality:"Sleep is one factor among many. Associations between sleep and health outcomes are real but do not mean that sleep alone prevents or cures disease."},{claim:"Sleep consolidates everything you learned during the day.",reality:"Sleep supports consolidation of some kinds of memory, under conditions that depend on learning, timing and sleep quality."}],takeaways:["Sleep supports memory consolidation, especially when sleep is adequate and regular.","Links with emotion, metabolism and immunity are supported by research, but many are observational.","Scientific understanding is incomplete, so claims should be evaluated carefully."],refs:["DIEKELMANN-2010","XIE-2013","CAPPUCCIO-2010","IRWIN-2015","NHLBI-DEP"],keyTerms:["Memory consolidation","Glymphatic system","Growth hormone","Cortisol","Sleep spindle"]},{id:5,part:1,title:"How Much Sleep Do We Need?",subtitle:"Population guidance, life stages, individual variation and when to seek advice",minutes:10,objectives:["Describe age-related sleep duration guidance from authoritative sources.","Explain why guidance is not the same as an individual target.","Recognise signs of persistent insufficient sleep and know when professional advice may help."],figure:{kind:"ranges",title:"Typical sleep duration ranges by life stage",caption:"Ranges from the National Sleep Foundation’s 2015 consensus process (children and teenagers) and the AASM/SRS adult consensus (7 or more hours). Labels indicate 'may be appropriate' outside a range for some people; they are not personal prescriptions.",alt:"Horizontal range bars for sleep duration by life stage from newborns to adults, measured in hours on a scale from 0 to 18. Newborns 14 to 17 hours, infants 12 to 15, toddlers 11 to 14, preschoolers 10 to 13, school-age children 9 to 11, teenagers 8 to 10, young adults 7 to 9.",unit:"hours per 24 hours",scaleMax:18,rows:[{label:"Newborns (0–3 months)",min:14,max:17},{label:"Infants (4–11 months)",min:12,max:15},{label:"Toddlers (1–2 years)",min:11,max:14},{label:"Preschoolers (3–5 years)",min:10,max:13},{label:"School-age (6–13 years)",min:9,max:11},{label:"Teenagers (14–17 years)",min:8,max:10},{label:"Young adults (18–25 years)",min:7,max:9}]},sections:[{heading:"Why there is no single number",paras:["The 2015 joint consensus statement from the American Academy of Sleep Medicine and the Sleep Research Society recommends that adults sleep seven or more hours per night on a regular basis to promote optimal health. This is a minimum for typical adults, not a claim that seven hours is sufficient for everyone or that eight is required. The NHS similarly describes adults as needing about seven to nine hours on average, and emphasises that people differ.","Individual needs depend on genetics, age, health, pregnancy, physical demands and recent sleep loss. Some people feel well with the lower end of a range; others need more. A person’s best indicator is how they function across days and weeks, especially whether they feel unusually sleepy during the day."],evidence:{level:"established",text:"The 7-hour-or-more guidance for adults comes from a formal consensus. Individual variation is also established."}},{heading:"Children, teenagers and older adults",paras:["Infants and young children need substantially more sleep than adults, including daytime sleep in early life. The National Sleep Foundation’s 2015 consensus process gave recommended ranges for children and teenagers, which are shown in the chart. Teenagers’ needs are similar to adult needs, but their biological timing shifts later (Chapter 13).","Older adults are often advised to aim for the same seven-or-more-hour guidance, but they may find that sleep becomes lighter and more fragmented (Chapter 15). Changes in sleep duration in later life can have medical causes that deserve assessment, so they should not be dismissed as normal ageing without a conversation with a clinician."],evidence:{level:"developing",text:"Age-specific ranges for older adults are less consistently defined across organisations than for children."}},{heading:"Duration, quality and consistency",paras:["Duration alone is not enough. Regular timing, continuous sleep and waking refreshed matter as much as hours. Long time in bed with frequent awakenings may not restore someone as well as a shorter, consolidated night. Irregular timing can cause sleepiness even when total hours look adequate.","Signs that sleep may be insufficient include feeling tired most days, needing an alarm to wake on most days, falling asleep unintentionally, irritability, difficulty concentrating, and reliance on caffeine to function. The NHS notes that you probably do not get enough sleep if you are constantly tired during the day."],bullets:["Tired most days despite spending time in bed.","Falling asleep unintentionally during quiet activities or while driving.","Frequent irritability, concentration problems or memory lapses.","Snoring, gasping or pauses in breathing reported by someone who shares your bed."]},{heading:"When professional advice may be appropriate",paras:["Seek advice from a doctor, nurse, pharmacist or sleep specialist if sleep problems persist for several weeks or longer, if daytime sleepiness affects work, school, safety or relationships, if breathing pauses or loud snoring are noticed, or if there are concerns about medicines or mental health. The NHS advises seeing a GP if changing sleep habits has not helped insomnia, or if trouble sleeping has lasted for months."],evidence:{level:"safety",text:"This chapter is educational only. It cannot assess whether any individual’s sleep is sufficient."}}],misconceptions:[{claim:"Everyone needs exactly eight hours.",reality:"Eight hours is a common reference point, but population guidance is a range. Individuals vary."},{claim:"Seven hours is sufficient for everyone.",reality:"Seven hours is a minimum for typical adults. Some people need more, and sleep quality and daytime function also matter."},{claim:"Needing less sleep is a sign of being exceptionally productive.",reality:"Most people who habitually sleep less than they need show measurable impairments. True short sleepers are rare."}],takeaways:["Adults are generally advised to aim for seven or more hours on a regular basis.","Children and teenagers need more sleep, and their ideal timing changes with development.","Persistent daytime sleepiness or breathing concerns deserve professional assessment."],refs:["WATSON-2015","HIRSHKOWITZ-2015","NHS-INSOMNIA","NHS-TIRED","CDC-SLEEP"],keyTerms:["Sleep duration","Sleep deficiency","Consensus statement","Sleep debt"]}],Rf=[{id:6,part:2,title:"Understanding the Circadian Rhythm",subtitle:"An internal clock that runs close to 24 hours and is set by daily cues",minutes:10,objectives:["Explain what circadian rhythms are and why they are close to, but not exactly, 24 hours long.","Describe how daily cues such as light, meals and activity keep the clock aligned.","Explain why regular daily timing supports healthy sleep."],figure:{kind:"day",title:"An illustrative 24-hour day and its circadian influences",caption:"An illustrative day. Light exposure, activity and meal timing all send timing signals to the body clock. Real days vary with work, climate, culture and season.",alt:"Horizontal 24-hour bar with coloured segments: night sleep from midnight to 7 am, morning light from 7 to 10 am, daytime activity from 10 am to 5 pm, an evening period from 5 to 10 pm with dim light, and a final dark period from 10 pm to midnight.",segments:[{label:"Dark, sleep",start:0,end:7,tone:"dark"},{label:"Morning light",start:7,end:10,tone:"light"},{label:"Daytime activity",start:10,end:17,tone:"activity"},{label:"Evening, dimmer light",start:17,end:22,tone:"routine"},{label:"Wind-down, dark",start:22,end:24,tone:"dark"}]},sections:[{heading:"What a circadian rhythm is",paras:["Circadian rhythms are biological processes that repeat roughly every 24 hours. The word comes from the Latin circa (about) and diem (day). Sleep and wakefulness are the most visible circadian rhythms, but many others exist, including body temperature, hormone release, blood pressure, digestion and alertness.","Under constant conditions without clocks or daylight cues, human circadian rhythms typically run slightly longer than 24 hours in many people. Daily cues, mainly light, bring the clock into line with the actual day. This process is called entrainment, and it is why regular daily exposure to light and darkness matters."],evidence:{level:"established",text:"Circadian rhythms and their entrainment by light are well established in chronobiology research."}},{heading:"Daily fluctuations in body processes",paras:["Across the day, core body temperature tends to be lowest in the early morning and highest in the late afternoon or early evening. Melatonin rises in the evening under dim conditions and falls in the morning. Cortisol, a stress-related hormone, usually begins to rise before waking, which may help prepare the body for the day. Alertness tends to show a dip in the early afternoon and another during the biological night.","These patterns explain why the same person may feel very different at 3 pm and at 3 am, even after similar amounts of sleep, and why shift workers and travellers often feel disoriented."],evidence:{level:"established",text:"The timing of body temperature, melatonin and cortisol rhythms is supported by controlled studies, though exact times vary between people."}},{heading:"How timing and sleep pressure interact",paras:["Sleep regulation is often described using a two-process model proposed by Alexander Borbély in 1982. Process S (homeostatic sleep pressure) rises during wakefulness and falls during sleep. Process C (the circadian process) follows a daily cycle independent of how long a person has been awake. Sleep is easiest when high sleep pressure coincides with the biological night.","This model helps explain why staying up very late can still leave a person sleepy the next morning, and why a nap in the afternoon may be harder to take if the biological clock is signalling alertness."],evidence:{level:"developing",text:"The two-process model is widely used and has been refined over decades. It is a simplified framework rather than a complete account of sleep control."}},{heading:"Why regularity matters",paras:["Regular wake times are one of the strongest anchors for the body clock because morning light and activity are reliable signals. Irregular timing gives the clock mixed messages, which can make it harder to fall asleep at a consistent time and can produce grogginess after waking.","Regularity does not need to be perfect. Many people manage a consistent wake time on most days while varying bedtime and weekend routines somewhat. Gentle consistency is more realistic and helpful than rigid perfectionism, and the aim is to reduce unnecessary variation, not to eliminate all flexibility."],evidence:{level:"developing",text:"Consistent sleep timing is associated with better sleep and daytime functioning in several studies. The optimal degree of regularity is not precisely defined."}}],misconceptions:[{claim:"Circadian rhythm simply means your bedtime.",reality:"Circadian rhythms affect many systems. Sleep timing is one visible output of a wider timing system."},{claim:"You can reset your biological clock overnight.",reality:"Clocks shift gradually, and the speed depends on light, timing, and individual factors. Quick fixes are not supported by evidence."},{claim:"Everyone’s body clock runs to exactly 24 hours.",reality:"The internal period varies between people and is often slightly longer than 24 hours, which is why daily cues matter."}],takeaways:["Circadian rhythms repeat about every 24 hours and are aligned mainly by light.","Body temperature, hormones and alertness follow predictable but individual daily patterns.","Consistent daily timing helps the clock stay aligned, but perfection is not required."],refs:["AASM-EDU","BORBELY-1982","WITTMANN-2006"],keyTerms:["Circadian rhythm","Entrainment","Zeitgeber","Process S","Process C"],related:"Book 11 (Healthy Weight Management, Metabolism & Sustainable Lifestyle Habits) discusses how meal timing and metabolic rhythms interact with daily routines."},{id:7,part:2,title:"The Suprachiasmatic Nucleus and the Biological Clock",subtitle:"A master clock in the brain and clocks throughout the body",minutes:10,objectives:["Locate the suprachiasmatic nucleus (SCN) and describe its main role.","Explain how the SCN coordinates peripheral clocks in other organs.","Describe what happens when internal timing becomes misaligned."],figure:{kind:"cycle",title:"How the central clock coordinates the body",caption:"A simplified loop. The SCN receives light information and sends timing signals to the rest of the body, including peripheral clocks in organs such as the liver and gut that also respond to meal timing.",alt:"Circular diagram with a centre label 24-hour cycle and five connected nodes: light enters the eye, light-sensing retinal cells signal the brain, the suprachiasmatic nucleus acts as master clock, nervous and hormonal signals, peripheral clocks in organs, and daily rhythms in behaviour that feed back into the cycle.",center:"24-hour cycle",nodes:["Light enters the eye","Retinal cells signal the brain","SCN (master clock)","Nervous and hormonal signals","Peripheral clocks in organs","Daily rhythms in behaviour"]},sections:[{heading:"Location and function of the SCN",paras:["The suprachiasmatic nucleus (SCN) is a pair of small clusters of nerve cells in the anterior hypothalamus, located just above the optic chiasm, where the optic nerves partly cross. Its position allows it to receive direct light information from the retina. The SCN is widely described as the brain’s master circadian pacemaker.","Each SCN neuron contains molecular feedback loops involving clock genes such as PER, CRY, CLOCK and BMAL1. These loops take roughly a day to complete and generate rhythmic activity. The discovery of this molecular mechanism was recognised by the 2017 Nobel Prize in Physiology or Medicine."],evidence:{level:"established",text:"The location of the SCN and the molecular clock mechanism are well established."}},{heading:"Communication with the body",paras:["The SCN coordinates other clocks using nerve connections and hormonal and other signals. Its output affects patterns of sleep, temperature, hormone release and alertness. Many organs, including the liver, gut, heart and skeletal muscle, contain their own peripheral clocks. These clocks can be influenced by the SCN and by local signals such as feeding, exercise and temperature.","Meal timing appears to be an important cue for some peripheral clocks, which is why late eating can alter digestive rhythms even when the central clock is unchanged. The relative strength of meal timing and light for different organs is an area of active research."],evidence:{level:"developing",text:"The existence of peripheral clocks is well supported. The relative influence of meals and light on different organs is still being clarified."}},{heading:"Internal synchronisation and misalignment",paras:["Healthy timing requires that the central clock, peripheral clocks and daily behaviour are reasonably synchronised. When they are not, people may experience circadian misalignment. Examples include eating at unusual times during night shifts, travelling across time zones, or irregular sleep and light exposure.","Misalignment is associated with fatigue, poor sleep, reduced alertness, digestive discomfort and mood changes. Long-term patterns of misalignment, such as those experienced by some shift workers, have been linked with various health outcomes in observational research, but the causal pathways are not fully established."],evidence:{level:"developing",text:"The short-term effects of misalignment are well documented. Long-term health associations are observational and require more research."}},{heading:"When misalignment becomes a clinical concern",paras:["Most everyday misalignment is temporary and is managed through routine and light exposure. Some people have persistent circadian rhythm sleep-wake disorders that cause recurring sleep difficulties despite opportunity to sleep. These conditions are assessed by clinicians and are described in Chapter 36."],evidence:{level:"safety",text:"Persistent sleep timing problems that affect daily life should be discussed with a clinician rather than treated with unsupervised supplements or medicines."}}],misconceptions:[{claim:"The SCN is the only biological clock.",reality:"The SCN coordinates the system, but peripheral clocks in many organs also keep time and respond to local cues."},{claim:"Clock genes only operate in the brain.",reality:"Clock genes are active across many tissues, which is why body-wide rhythms exist."},{claim:"Changing meal times instantly shifts all body clocks.",reality:"Changes are gradual and partial. Central and peripheral clocks can adjust at different speeds."}],takeaways:["The SCN is a master clock in the hypothalamus that receives light information from the eyes.","Peripheral clocks throughout the body respond to the central clock and to local cues such as meal timing.","Misalignment causes short-term problems, and persistent problems deserve professional assessment."],refs:["AASM-EDU","NHLBI-DEP"],keyTerms:["Suprachiasmatic nucleus","Peripheral clock","Clock genes","Circadian misalignment"]},{id:8,part:2,title:"Light, Darkness and Melatonin",subtitle:"How the eye tells the brain what time it is, and what evidence says about screens",minutes:12,objectives:["Describe how light reaches the brain’s clock via specialised retinal cells.","Explain melatonin’s role as a timing signal rather than a simple sedative.","Evaluate blue-light claims, including the difference between screens, daylight and indoor lighting."],figure:{kind:"flow",title:"The light-to-brain signalling pathway",caption:"Simplified pathway. Intrinsically photosensitive retinal ganglion cells send light information to the SCN, which influences the pineal gland’s melatonin rhythm. Melatonin is released mainly in darkness.",alt:"Flow diagram with six boxes: light reaches the retina, intrinsically photosensitive retinal cells respond, retinohypothalamic pathway carries signals, suprachiasmatic nucleus interprets the timing, pineal gland changes melatonin output, and melatonin is released in darkness.",steps:["Light reaches the retina","Light-sensing retinal cells respond","Signal travels to the SCN","SCN sets timing","Pineal gland adjusts melatonin","Melatonin rises in darkness"]},sections:[{heading:"How light enters the eye",paras:["Light passes through the cornea and lens and reaches the retina at the back of the eye. Rods and cones are the photoreceptors used for seeing. A separate group of retinal ganglion cells contains the light-sensitive pigment melanopsin and is called intrinsically photosensitive retinal ganglion cells (ipRGCs). These cells send signals to the brain for timing and some non-visual responses, including pupil constriction.","Research on melatonin suppression has shown that the sensitivity of this system is greatest to light in the blue part of the spectrum, around 460 to 480 nanometres. This is the basis for many blue-light claims, which need to be understood in context (see below)."],evidence:{level:"established",text:"The role of ipRGCs and melanopsin in non-visual light responses is well supported. The action spectrum for melatonin suppression was described in human studies by Brainard and colleagues (2001)."}},{heading:"Melatonin: a timing signal",paras:["Melatonin is produced by the pineal gland, a small structure in the brain. Its secretion rises in the evening as light dims, peaks during the night and falls by morning. Melatonin is therefore best understood as a signal of darkness and of biological night. It helps the body clock align and contributes to the timing of sleepiness. It is not a general-purpose sedative in the way many people assume.","Clinicians sometimes measure the dim light melatonin onset (DLMO) to assess circadian timing. Melatonin products used as supplements vary in dose, quality and regulation between countries (Chapter 39)."],evidence:{level:"established",text:"Melatonin’s role in signalling darkness and helping to time circadian rhythms is well supported. Its sedative effects are small and variable."}},{heading:"Morning and evening light",paras:["Bright light in the morning tends to move the clock earlier, which can help people who wake too late relative to their goals. Bright light in the late evening tends to delay the clock, which can make falling asleep harder at a usual time. The size of these effects depends on the brightness, duration and timing of light, as well as individual differences.","Daylight outdoors is usually many times brighter than indoor lighting. People who spend most of the day indoors may therefore receive less light signal than they expect. Going outside for a few minutes in daylight, where it is safe and practical, can be a simple way to strengthen daytime timing cues."],evidence:{level:"developing",text:"The direction of phase shifts from morning and evening light is established. Practical guidance on exact timing and dose is still developing."}},{heading:"Blue light, screens and the evidence",paras:["Screens emit light that includes short wavelengths, so claims that screens affect sleep have some biological basis. However, most evidence concerns the combined effect of brightness, duration, timing and content. A controlled study by Chang and colleagues (2015) found that reading an eReader for several hours before bed, compared with reading a printed book, delayed melatonin timing, lengthened the time to fall asleep, reduced REM sleep and lowered alertness the next morning. These findings were in healthy young adults in a laboratory setting.","Everyday screen use involves many variables: brightness, distance, time of day, content, and whether a person uses the device in bed. Blue-blocking glasses and screen filters have been marketed widely, but the evidence for their effect on sleep outcomes is mixed. Reducing bright evening screen use and keeping bedrooms dim is a reasonable low-cost approach, though the magnitude of benefit for each person is uncertain."],evidence:{level:"preliminary",text:"Laboratory evidence that evening light-emitting devices can affect circadian timing is supported, but the size of real-world effects and the value of blue-blocking products are uncertain."}},{heading:"Darkness and sleep timing",paras:["A dark sleeping environment supports melatonin release and consolidated sleep. In practice, streetlights, early sunrise, shared rooms and night-time bathroom trips can all add light. Low-level night lights, blackout curtains or an eye mask can help where they are affordable and safe. In some households, a light-blocking option may be a practical improvement and in others it is not possible; the aim is to reduce unnecessary bright light, not to achieve perfect darkness."],evidence:{level:"established",text:"Darkness at night supports melatonin signalling and sleep, although the relative importance of each light source varies."}}],misconceptions:[{claim:"All blue light is equally harmful.",reality:"The effect depends on intensity, duration, timing and content. Daylight contains large amounts of blue light and is generally beneficial for daytime alertness and body timing."},{claim:"Blue-blocking glasses fix insomnia.",reality:"Evidence for blue-blocking glasses as a treatment for sleep problems is limited and mixed."},{claim:"Melatonin is a sedative that knocks you out.",reality:"Melatonin is mainly a timing signal. Supplements vary in effect and quality, and they are not appropriate for everyone."}],takeaways:["Light reaches the SCN through specialised retinal cells, which are most sensitive to blue-enriched light.","Melatonin rises in darkness and signals biological night; it is a timing signal more than a sedative.","Bright daylight in the morning and reduced bright light in the evening support timing; the screen evidence is promising but still developing."],refs:["BRAINARD-2001","CHANG-2015","AASM-EDU","NHS-INSOMNIA"],keyTerms:["Melanopsin","ipRGC","Melatonin","Dim light melatonin onset","Blue light","Pineal gland"]},{id:9,part:2,title:"Chronotypes and Individual Sleep Timing",subtitle:"Why people differ in their natural preference for early or late schedules",minutes:10,objectives:["Define chronotype and describe the early, intermediate and late spectrum.","Explain biological, environmental and age-related influences on chronotype.","Discuss why a single schedule may not suit everyone."],figure:{kind:"spectrum",title:"The chronotype spectrum",caption:"Chronotype describes a preferred timing of sleep and activity along a continuous spectrum. Labels show descriptive categories; they are not diagnoses and most people fall in the middle.",alt:"Horizontal gradient bar from early to late, with markers labelled extreme early, moderately early, intermediate, moderately late and extreme late. Left end labelled earlier timing, right end labelled later timing.",left:"Earlier timing (morning preference)",right:"Later timing (evening preference)",markers:[{label:"Extreme early",pos:6},{label:"Moderately early",pos:28},{label:"Intermediate",pos:50},{label:"Moderately late",pos:72},{label:"Extreme late",pos:94}]},sections:[{heading:"What chronotype means",paras:["Chronotype describes an individual’s natural timing of sleep and wakefulness when they are free to choose their schedule. People are often described as 'larks' (early) or 'owls' (late), but these are descriptive labels along a continuum. Chronotype is commonly measured with questionnaires, such as the Munich ChronoType Questionnaire, which asks about sleep timing on free days.","Chronotype is not the same as sleep quality or sleep duration. A person can have a late chronotype and still sleep well if their schedule fits their biology."],evidence:{level:"established",text:"Chronotype as a continuous trait is well supported. Questionnaire measures are useful for research but are not clinical diagnostic tests."}},{heading:"Biological and environmental influences",paras:["Chronotype has a genetic component, supported by twin and population studies, and it differs between people even under similar conditions. Environmental factors also matter, including light exposure history, age, sex, occupation, social schedules and the timing of meals. Living in a different time zone within a region, or having long evening light exposure, may shift timing in some people.","Because genetic and environmental influences interact, it is not possible to 'choose' a chronotype through willpower alone. Adjusting routines can shift timing somewhat, but there are limits."],evidence:{level:"developing",text:"The genetic contribution to chronotype is supported, but the individual genes and their combined effects are still being mapped."}},{heading:"Changes across the lifespan",paras:["Chronotype changes with age. Roenneberg and colleagues (2004) reported that sleep timing becomes progressively later through childhood and adolescence, reaching a peak around the early twenties, and then gradually becomes earlier. The authors proposed this as a biological marker of the end of adolescence. The pattern differed between males and females in their data.","These shifts mean that adolescents’ natural timing may be far from typical school start times (Chapter 13). Older adults often prefer earlier schedules, which may be relevant to family routines and healthcare appointments."],evidence:{level:"established",text:"The age-related pattern of chronotype is well documented in large population studies, though the exact timing varies across populations."}},{heading:"Social schedules and forcing a routine",paras:["Many people live by schedules set by schools, employers or caring responsibilities that do not match their biological timing. A late chronotype in a household with early start times can produce sleep loss and daytime sleepiness. Forcing very early wake times on a late chronotype may reduce sleep without improving alertness, particularly if bedtime is not adjusted.","Where possible, flexible scheduling, gradual changes, morning light exposure and consistent timing are more realistic approaches than attempting an abrupt change. Where schedules cannot change, the aim is to protect sleep opportunity and reduce unnecessary variation rather than to make the person 'a morning person'."],evidence:{level:"developing",text:"Evidence supports flexible and gradual scheduling approaches in several contexts, but more trials are needed in many populations."}}],misconceptions:[{claim:"Night owls are lazy.",reality:"Late chronotype is a biological preference and is not a character flaw. Schedules that ignore it can cause problems."},{claim:"You can become a morning person through willpower alone.",reality:"Timing can shift gradually with light and routine, but there are limits set partly by biology."},{claim:"Chronotype is fixed for life.",reality:"Chronotype changes with age, as well as responding to environment and routine."}],takeaways:["Chronotype is a continuous trait describing natural sleep timing preference.","Genetics, age, light and social routines all influence chronotype.","Forcing a mismatched schedule without flexibility can reduce sleep; gradual adjustments are usually more realistic."],refs:["ROENNEBERG-2004","WITTMANN-2006","AASM-EDU"],keyTerms:["Chronotype","Morningness","Eveningness","MCTQ","Mid-sleep"]},{id:10,part:2,title:"Social Jet Lag and Circadian Misalignment",subtitle:"When the demands of work, school and family pull the clock in different directions",minutes:10,objectives:["Define social jet lag and explain how it is measured conceptually.","Describe how workdays, school schedules and shift patterns create misalignment.","Identify practical approaches that reduce unnecessary disruption without blaming individuals."],figure:{kind:"compare",title:"Illustrative example: workdays versus free days",caption:"An illustrative example, not real data. Social jet lag is the difference between a person’s sleep timing on free days and on workdays, after accounting for sleep debt.",alt:"Two-column comparison. Workday column: alarm at 06:30, bedtime at 23:00, about 6.5 hours sleep, limited morning daylight. Free-day column: wake at 09:30, bedtime at 01:00, about 8.5 hours sleep, later daylight exposure.",columns:[{title:"Workdays (illustrative)",items:["Alarm at 06:30","Bedtime around 23:00","About 6.5 hours of sleep","Limited daylight before work"]},{title:"Free days (illustrative)",items:["Wake around 09:30","Bedtime around 01:00","About 8.5 hours of sleep","Later morning light exposure"]}]},sections:[{heading:"Defining social jet lag",paras:["Social jet lag is a term introduced by Wittmann and colleagues (2006) to describe the mismatch between biological time and social time. It is typically calculated as the difference between the midpoint of sleep on free days and on workdays, adjusted for sleep debt. A larger difference indicates a greater mismatch between the body clock and the schedule imposed by social life.","The concept is useful because it names a common experience: many people feel like they are travelling across time zones every week without leaving home."],evidence:{level:"established",text:"Social jet lag is an established research concept. Its measurement methods are still being refined across studies."}},{heading:"Workdays, free days and catch-up sleep",paras:["On free days, many people sleep later and take longer to wake, sometimes recovering some of the sleep lost during the week. This catch-up sleep can reduce sleepiness, but it does not fully restore the effects of chronic restriction, and it can shift the body clock later, making Monday mornings harder. The effects are individual and depend on the scale of the mismatch."],evidence:{level:"developing",text:"Weekend catch-up sleep can reduce acute sleepiness, but it does not fully compensate for chronic sleep restriction. Evidence on long-term consequences is still developing."}},{heading:"Schools, shifts and household demands",paras:["Early school starts, long commutes, rotating shifts, caring responsibilities and night-time work all push sleep timing away from biological preferences. Many people have little control over these demands. Shift workers, parents of young children and people working multiple jobs may experience social jet lag without any personal choice to change their timing.","This is a structural issue as much as an individual one. Chapter 43 explores shift work in detail, and Chapter 46 considers how different living conditions affect sleep across the world."],evidence:{level:"established",text:"Structural constraints on sleep timing are well documented, including in adolescent and shift-working populations."}},{heading:"Possible health and wellbeing links",paras:["Observational studies have linked larger social jet lag with poorer mood, daytime sleepiness and, in some populations, higher body weight and metabolic markers. These findings do not show that social jet lag causes these outcomes, and they may be influenced by many other factors such as work stress, diet and physical activity."],evidence:{level:"uncertain",text:"Associations between social jet lag and health outcomes are reported in observational studies. Causal conclusions are not yet established."}},{heading:"Reducing unnecessary disruption",paras:["Practical approaches that many people find helpful include keeping wake times within a reasonably consistent window across the week, getting daylight soon after waking when possible, limiting bright light late in the evening, and planning naps so they do not replace night sleep. Some people find that a modest later-to-earlier shift for a few days before a schedule change helps. These are practical suggestions based on general chronobiology, not validated universal thresholds."],bullets:["Aim for a consistent wake time on most days where possible.","Use morning daylight to anchor the body clock.","Keep the last hour before bed calmer and dimmer.","Discuss persistent schedule problems with an employer, school or clinician where appropriate."],evidence:{level:"traditional",text:"Some suggestions reflect general chronobiology principles and common practice rather than trial-validated programmes."}}],misconceptions:[{claim:"Weekend lie-ins fully repay the sleep lost during the week.",reality:"Catch-up sleep can help with acute sleepiness but does not fully compensate for chronic restriction, and it can shift timing."},{claim:"Sleeping in on weekends is always harmful.",reality:"It depends on the size of the shift and the person’s circumstances. Large, repeated shifts are more likely to create difficulties."},{claim:"Social jet lag is a personal discipline problem.",reality:"Social jet lag often reflects structural demands such as school, work and caregiving, rather than poor choices."}],takeaways:["Social jet lag describes the mismatch between biological and social timing.","Structural factors such as school, shift work and caregiving are major drivers.","Consistency, morning light and realistic planning can reduce unnecessary disruption."],refs:["WITTMANN-2006","ROENNEBERG-2004","AASM-EDU","NHS-INSOMNIA"],keyTerms:["Social jet lag","Mid-sleep","Circadian misalignment","Catch-up sleep"]}],Df=[{id:11,part:2,title:"Travel, Time Zones and Jet Lag",subtitle:"Why crossing time zones disrupts the body clock, and realistic ways to adjust",minutes:11,objectives:["Explain how jet lag develops as a circadian mismatch.","Compare the usual challenges of eastward and westward travel.","Describe practical light, meal and sleep-scheduling strategies and when medical advice is appropriate."],figure:{kind:"bars",title:"Time-zone shifts and the difficulty of adjusting",caption:"Illustrative relationship only. Larger shifts usually require more days to adjust, and the rule of thumb of roughly one day per time zone is a common approximation rather than a validated formula.",alt:"Horizontal bar chart of time-zone differences: 1, 3, 6, 9 and 12 time zones. Longer bars indicate larger shifts and more days needed for the body clock to adjust, with eastward travel generally harder for advancing the clock.",unit:"time zones crossed",max:12,items:[{label:"1 zone",value:1,note:"Often a short adjustment"},{label:"3 zones",value:3,note:"Several days for many people"},{label:"6 zones",value:6,note:"Often a week or more"},{label:"9 zones",value:9,note:"Variable; eastward often harder"},{label:"12 zones",value:12,note:"Highly variable"}]},sections:[{heading:"How jet lag develops",paras:["Jet lag is a temporary mismatch between the internal circadian clock and the local light-dark and social cycle at the destination. The body clock continues to follow the timing of the departure location for a while, so sleepiness, wakefulness, appetite and digestion may all fall at the wrong times. Symptoms can include difficulty sleeping at a local bedtime, daytime sleepiness, poor concentration, digestive discomfort and irritability.","Jet lag is not a sleep disorder in itself, but it can be the trigger for a more persistent problem if sleep timing remains unsettled for a long time."],evidence:{level:"established",text:"Jet lag as a circadian mismatch is a well-established concept in chronobiology, and its symptoms are widely described in clinical sleep resources."}},{heading:"Eastward and westward travel",paras:["Eastward travel requires the body clock to advance, meaning going to bed and waking earlier relative to the body’s habits. Westward travel requires a delay, which is generally easier for many people because the natural clock tends to run slightly longer than 24 hours. Many travellers therefore find that adjusting after eastward flights takes longer, although individual responses vary considerably."],evidence:{level:"developing",text:"The general asymmetry between eastward and westward adjustment is commonly reported, but its size varies and individual differences are large."}},{heading:"Light, meals and melatonin",paras:["Light is the most important cue for clock adjustment. For eastward travel, morning light at the destination generally helps advance the clock, whereas for westward travel, evening light can help delay it. Avoiding bright light at the wrong time can be as helpful as seeking it at the right time. Meal timing can also be aligned with local mealtimes to reinforce the new schedule.","Melatonin is sometimes used for jet lag. Some trials suggest small benefits for certain travellers, while others show limited effects. Melatonin products vary in quality, may interact with other medicines, and are not appropriate for everyone. Anyone considering melatonin for travel, particularly children, pregnant people or those on other medicines, should seek advice from a clinician or pharmacist first."],evidence:{level:"uncertain",text:"Light timing has strong biological rationale. The benefit of melatonin for jet lag is inconsistent across studies, and product quality varies internationally."}},{heading:"Sleep planning before and after travel",paras:["A practical approach is to begin shifting bedtime and wake time by an hour or so over several days before departure, where the trip allows. Once travelling, many people find it helpful to follow the destination’s meal and activity times as closely as is practical, to use daylight at the right times, and to plan naps carefully. Long naps close to local bedtime can make adjustment harder for some people.","Realistic expectations matter. Full adjustment often takes several days, and short trips may not allow complete adaptation. Trying to force sleep at the destination’s night when the body is strongly alert can produce frustration without benefit."],bullets:["Keep hydration and rest sensible during long flights, with attention to alcohol and caffeine timing (Chapters 20 to 22).","Carry medicines in their original packaging and check prescriptions for travel with a clinician.","Plan light exposure, meals and rest around your first full day at the destination."]},{heading:"When medical guidance is appropriate",paras:["Seek medical advice if jet lag is severe or lasts for many days, if you have a medical condition, if you are pregnant or breastfeeding, if you travel frequently and feel persistently unwell, or if you are considering prescription sleep medicines. Travel-related sleep problems should not be managed with alcohol or recreational substances."],evidence:{level:"safety",text:"This section is general education and does not replace individual medical or pharmacy advice."}}],misconceptions:[{claim:"Melatonin cures jet lag.",reality:"Evidence for melatonin is mixed. It may help some people in some situations, but it is not a cure and it is not suitable for everyone."},{claim:"You can sleep off jet lag on the plane.",reality:"Sleep on flights is often fragmented and at the wrong biological time. Light and routine at the destination usually matter more."},{claim:"Jet lag is only tiredness that goes away quickly.",reality:"Adjustment can take several days, and the time needed depends on the number of time zones crossed and the direction of travel."}],takeaways:["Jet lag reflects a mismatch between the body clock and the destination’s timing.","Eastward travel usually requires advancing the clock and can be harder to adjust to.","Light timing, meal timing and realistic planning help; melatonin use should be discussed with a clinician."],refs:["AASM-EDU","NHS-INSOMNIA","BRAINARD-2001"],keyTerms:["Jet lag","Phase advance","Phase delay","Entrainment"]},{id:12,part:3,title:"Sleep During Childhood",subtitle:"Developmental needs, bedtime routines, naps, school and family life",minutes:11,objectives:["Describe typical sleep needs in early childhood and school age.","Explain how bedtime routines, environment and daytime naps influence children’s sleep.","Recognise situations in which a parent or guardian should seek professional advice."],figure:{kind:"flow",title:"A calm, predictable bedtime sequence for young children",caption:"A general example. Routines should be adapted to family life, culture and the child’s age, and the sequence does not need to match exactly.",alt:"Vertical-style flow of six steps: set a consistent wake time, daytime light and activity, calm wind-down, dim lights and quiet play, same bedtime routine each night, lights out at a consistent time.",steps:["Consistent wake time","Daylight and active play","Calm wind-down","Dim lights and quiet activities","Same routine each night","Lights out at a consistent time"],vertical:!0},sections:[{heading:"Developmental sleep needs",paras:["Infants and toddlers sleep for long total periods across day and night, including several daytime sleeps. The National Sleep Foundation’s 2015 consensus ranges, summarised in Chapter 5, describe typical totals of roughly 11 to 14 hours for toddlers and 9 to 11 hours for school-age children, with individual variation. Sleep is closely linked with growth, learning, emotional regulation and immune function in childhood.","Children with consistently short sleep may show hyperactivity, irritability, difficulty concentrating and changes in school performance, though these signs can have other causes."],evidence:{level:"established",text:"Age-related sleep duration ranges come from consensus processes. Individual children vary, and health-care professionals consider the whole picture."}},{heading:"Bedtime routines and environment",paras:["Predictable bedtime routines help children learn when sleep is coming. Simple steps such as washing, a short story, dimmed lights and a consistent order of activities can signal the transition. Routines work best when they are short, calm and repeated, rather than long or punitive. Bedrooms should be as quiet, comfortably cool and dark as possible within the household’s circumstances.","Safe-sleep guidance for infants is different and is essential. National health services recommend placing babies on their back for sleep, on a firm, flat, clear sleep surface, and avoiding soft bedding, pillows and bed-sharing practices that increase risk. Parents should follow current national guidance in their country."],evidence:{level:"established",text:"Safe-sleep recommendations for infants are established in national health guidance."}},{heading:"Daytime naps and school schedules",paras:["Nap needs decrease as children grow. Many young children benefit from daytime naps, while school-age children typically no longer need them. Late naps can make bedtime difficult. School timetables, after-school activities and homework may compress sleep, and screens can delay bedtime. Families can support children by agreeing consistent wake times, limiting late evening activity and protecting the bedtime window."],evidence:{level:"developing",text:"Guidance on nap timing is based on developmental observations and clinical experience, with less trial evidence."}},{heading:"Common childhood challenges and when to seek help",paras:["Many children have occasional difficulties such as bedtime resistance, night waking, nightmares or sleepwalking. These are common at some ages and often improve with consistent routines. Night terrors and sleepwalking are described in Chapter 37. Snoring, pauses in breathing, restless sleep, bedwetting that persists, or extreme daytime sleepiness deserve medical assessment. Children with breathing pauses should be evaluated, because enlarged tonsils or adenoids and other causes of sleep-disordered breathing can affect development and behaviour.","Parents and guardians should seek professional advice if sleep difficulties are persistent, interfere with a child’s development, school or family wellbeing, or if they are worried about the child’s breathing or safety during sleep."],evidence:{level:"safety",text:"Medicines for children’s sleep, including antihistamines and melatonin, should only be used on the advice of a qualified clinician."}}],misconceptions:[{claim:"Children who fight bedtime are being naughty.",reality:"Bedtime resistance is common and is often shaped by routine, tiredness, anxiety, developmental stage and environment."},{claim:"Children always outgrow snoring.",reality:"Some snoring resolves, but breathing pauses should be assessed rather than assumed harmless."},{claim:"A little over-the-counter medicine every night is harmless for children.",reality:"Children’s medicines require professional guidance. Products sold for adults may be unsuitable for children."}],takeaways:["Predictable, calm routines support children’s sleep across ages.","Infant safe-sleep guidance is essential and should follow national recommendations.","Breathing pauses, persistent problems or daytime sleepiness in children warrant professional assessment."],refs:["HIRSHKOWITZ-2015","WATSON-2015","NHLBI-APNEA","CDC-SLEEP"],keyTerms:["Safe sleep","Sleep-disordered breathing","Nap","Bedtime routine"]},{id:13,part:3,title:"Teenagers and Adolescent Sleep",subtitle:"Biological timing, school schedules, technology and supportive routines",minutes:11,objectives:["Explain how puberty shifts adolescent circadian timing.","Discuss the role of school schedules, social life and technology in teenage sleep.","Describe supportive approaches that avoid shame and unrealistic restrictions."],figure:{kind:"flow",title:"How biology, schedules and habits interact in adolescence",caption:"A simplified model. Teenagers differ widely, and school, family and social factors can strengthen or reduce the effects of biological timing.",alt:"Flow diagram: puberty shifts circadian timing later; early school start times create a mismatch; mismatch leads to short sleep on school nights; short sleep leads to daytime sleepiness and mood or learning effects; supportive routines and schedule flexibility can reduce the mismatch.",steps:["Puberty shifts timing later","Early school start","Mismatch with biology","Short school-night sleep","Daytime sleepiness and mood effects","Supportive routines and flexibility"]},sections:[{heading:"Biological changes during puberty",paras:["During puberty, many adolescents show a shift in their circadian timing, making it natural to feel alert later at night and to wake later in the morning. The research of Roenneberg and colleagues (2004) found that sleep timing is delayed through adolescence and peaks in the early twenties (Chapter 9). Melatonin timing changes may contribute, along with other developmental factors, though the mechanisms are still under study.","Teenagers also need more sleep than many adults. The consensus ranges give 8 to 10 hours per night for adolescents (Chapter 5)."],evidence:{level:"established",text:"The adolescent shift in circadian timing is well documented. The mechanisms are only partly understood."}},{heading:"Academic schedules and early school starts",paras:["Many schools begin before biological preferences allow adolescents to wake easily. Early starts can lead to short sleep on school nights, with some teenagers catching up at weekends. This pattern can produce social jet lag and daytime sleepiness (Chapter 10). Some studies have linked later school start times with improvements in attendance, alertness and wellbeing, although results vary and other factors matter.","The American Academy of Sleep Medicine has advocated that middle and high schools start no earlier than 8:30 am. Schools in many countries and districts are weighing this evidence against transport, staffing and family constraints."],evidence:{level:"developing",text:"Evidence for later school start times is promising, with some natural experiments and observational studies reporting benefits. Results are not uniform and implementation varies."}},{heading:"Technology, social life and sleep",paras:["Phones, games and social media can extend evening activity and encourage late use, especially when notifications are frequent. Evening device use can also increase mental stimulation and can delay sleep onset for some people (Chapter 28). However, screens are only one part of the picture. Homework load, part-time work, caring responsibilities, sport, friendships and mental health all influence sleep."],evidence:{level:"developing",text:"Associations between evening screen use and later sleep are consistently reported, but causal effects vary by content, duration and individual circumstances."}},{heading:"Supporting healthy routines without shame",paras:["Teenagers respond better to collaboration than to criticism. Helpful approaches include explaining the biology of adolescent timing, agreeing on realistic wind-down routines, reducing late-evening stimulation, protecting morning daylight exposure, and discussing sleep as part of wellbeing rather than discipline. Blanket rules that ignore individual circumstances may be difficult to sustain.","Adolescents who have persistent insomnia, daytime sleepiness, snoring or mood changes should be encouraged to speak with a trusted adult and a health professional. Some teenagers experience sleep changes linked with depression or anxiety, which deserve support."],evidence:{level:"traditional",text:"Many family and school strategies are based on practical experience and general sleep science rather than trial-validated programmes."}}],misconceptions:[{claim:"Teenagers are lazy and simply need more discipline.",reality:"Biological timing shifts during puberty. Blaming young people ignores biology and structural constraints."},{claim:"Phones are the only cause of teenage sleep problems.",reality:"Schedules, mental health, workload, social life and environment all contribute."},{claim:"Teenagers can function well on less sleep as long as they try hard.",reality:"Insufficient sleep affects attention, mood and learning, even when young people feel adapted."}],takeaways:["Adolescent circadian timing shifts later, making early starts difficult for many teenagers.","School schedules, technology and social life interact with biology.","Supportive, non-punitive routines work better than shame or rigid restrictions."],refs:["ROENNEBERG-2004","HIRSHKOWITZ-2015","AASM-EDU","NHLBI-DEP"],keyTerms:["Adolescent sleep phase delay","Sleep inertia","Later school start times"]},{id:14,part:3,title:"Adult Sleep and Daily Responsibilities",subtitle:"Working, caring, managing stress and building routines that fit real life",minutes:10,objectives:["Identify common sources of sleep pressure in working adults and caregivers.","Explain the two-way relationship between stress and sleep.","Describe realistic, flexible routine-building approaches."],figure:{kind:"compare",title:"Common pressures and realistic adjustments",caption:"Examples of how daily responsibilities can affect sleep and some practical responses. Not every adjustment will be possible for every person.",alt:"Two-column comparison. Pressures on sleep include long hours, commuting, night-time care, noisy housing and irregular rotas. Realistic adjustments include protecting a consistent wake time, sharing night duties, reducing work communication late at night, and seeking employer or medical support where needed.",columns:[{title:"Common pressures",items:["Long or unpredictable working hours","Long commutes and early starts","Caring for children or relatives at night","Noisy housing or shared rooms","Financial stress and multiple jobs"]},{title:"Realistic adjustments",items:["Protect a consistent wake time where possible","Share night-time care with others","Reduce work messages late at night","Use short wind-down routines that fit the space","Seek workplace or health support when needed"]}]},sections:[{heading:"Sleep in working adults",paras:["Many adults work long hours, commute, care for others and manage household responsibilities. Sleep is often one of the first things to be shortened. Sleep duration in working adults has been linked with productivity, road safety and health, and reduced sleep may affect decision-making and mood."],evidence:{level:"established",text:"The effects of insufficient sleep on alertness and performance are well documented."}},{heading:"Balancing work and rest",paras:["Balancing work and rest is easier when boundaries are realistic. Some people benefit from setting a time after which work communication stops, creating a short transition routine, or taking short breaks during the day. Employers and occupational health services can help with rotas, workload and fatigue risk, particularly in safety-sensitive roles (Chapter 43)."],evidence:{level:"developing",text:"Workplace interventions and boundaries show promise, but evidence varies by sector and organisation."}},{heading:"Parenting, caregiving and night-time responsibilities",paras:["Parents of newborns and young children and people caring for ill or older relatives often experience fragmented sleep over long periods. Sharing night-time duties, rotating responsibilities, asking for help from family or services, and accepting that sleep may be patchy in some phases are important practical steps. Caregivers should also seek support for their own health, since persistent sleep loss can affect mood and safety."],evidence:{level:"developing",text:"Evidence on caregiver sleep is growing. Support services vary greatly between countries."}},{heading:"Stress and sleep",paras:["Stress and sleep influence each other. Stress can make it harder to fall asleep and stay asleep, and poor sleep can increase emotional reactivity and reduce coping. Chapter 29 explains stress physiology and Chapter 30 explores bedtime worry. Addressing stress at the level of workload, support and boundaries can be as important as adjusting bedtime routines."],evidence:{level:"established",text:"The bidirectional relationship between stress and sleep is well supported across research."}},{heading:"Building realistic routines",paras:["A realistic routine starts with the constraints a person actually faces. It might include a steady wake time on most days, a short daylight walk, a limited caffeine window, and a wind-down period of 20 to 30 minutes. Routines should be adjusted when life changes, and missing a day is not a failure. Chapter 42 offers a structured approach to building a personal plan."],evidence:{level:"traditional",text:"Routine-building suggestions are drawn from general sleep hygiene and behavioural principles. Their effect varies between people."}}],misconceptions:[{claim:"Busy adults just need better time management to sleep enough.",reality:"Some sleep loss is caused by structural constraints such as work hours, caregiving and housing. Individual planning helps, but it cannot remove every barrier."},{claim:"Being tired is the price of success.",reality:"Chronic sleep loss is associated with reduced performance and health risks, even when it feels nor
