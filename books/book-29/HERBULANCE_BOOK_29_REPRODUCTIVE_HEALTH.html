:1,title:"Reproductive Anatomy Visual Guide",category:"anatomy",description:"Interactive visual guide to female and male internal and external reproductive organs with clinical descriptions.",iconName:"Eye",printable:!0,interactive:!0},{id:"tool2",number:2,title:"Reproductive Hormone Overview Chart",category:"anatomy",description:"Comprehensive reference chart detailing site of origin, target tissue, physiological actions, and feedback loops.",iconName:"Activity",printable:!0,interactive:!0},{id:"tool3",number:3,title:"Menstrual Cycle Educational Diagram",category:"menstrual",description:"Dynamic phase-by-phase simulator illustrating follicular growth, endometrial changes, and hormonal fluctuations.",iconName:"Calendar",printable:!0,interactive:!0},{id:"tool4",number:4,title:"Menstrual Health Tracking Worksheet",category:"menstrual",description:"Printable and offline clinical tracking sheet for cycle dates, flow volume, clot size, and symptom severity.",iconName:"FileText",printable:!0,interactive:!0},{id:"tool5",number:5,title:"Menstrual Symptom Discussion Sheet",category:"menstrual",description:"Structured S-B-A-R consultation sheet for presenting period pain, heavy bleeding, or PMS to your healthcare provider.",iconName:"MessageSquare",printable:!0,interactive:!0},{id:"tool6",number:6,title:"PCOS and Endometriosis Learning Guide",category:"menstrual",description:"Side-by-side clinical comparison of diagnostic criteria (Rotterdam vs Laparoscopy/TVUS), symptoms, and management pathways.",iconName:"GitCompare",printable:!0,interactive:!0},{id:"tool7",number:7,title:"Male Reproductive Anatomy Guide",category:"male",description:"Detailed structural mapping of testicular seminiferous tubules, epididymis, vas deferens, and accessory glands.",iconName:"Compass",printable:!0,interactive:!0},{id:"tool8",number:8,title:"Testicular and Prostate Awareness Checklist",category:"male",description:"Monthly testicular self-examination protocol and age-appropriate prostate symptom (LUTS) evaluation checklist.",iconName:"CheckSquare",printable:!0,interactive:!0},{id:"tool9",number:9,title:"Fertility Terminology Glossary",category:"fertility",description:"Key terms explained: AMH, AFC, fecundability, blastocyst, cryopreservation, morphology, and motility.",iconName:"BookOpen",printable:!0,interactive:!0},{id:"tool10",number:10,title:"Fertility Appointment Preparation Worksheet",category:"fertility",description:"Non-blaming diagnostic preparation template covering both partners: semen analysis history, ovulatory records, and questions to ask.",iconName:"ClipboardCheck",printable:!0,interactive:!0},{id:"tool11",number:11,title:"Contraception Comparison Explorer",category:"prevention",description:"Interactive comparison matrix of 10 modern contraceptive categories across typical vs perfect effectiveness, mechanisms, and side effects.",iconName:"Shield",printable:!0,interactive:!0},{id:"tool12",number:12,title:"STI Prevention and Testing Discussion Guide",category:"prevention",description:"Testing windows, transmission risks, asymptomatic prevalence, and conversation prompts for sexual partners.",iconName:"AlertCircle",printable:!0,interactive:!0},{id:"tool13",number:13,title:"Consent and Healthy Relationship Educational Guide",category:"prevention",description:"The FRIES model in action: practical communication scripts, boundary affirmations, and digital privacy principles.",iconName:"HeartHandshake",printable:!0,interactive:!0},{id:"tool14",number:14,title:"Pregnancy-Care Discussion Worksheet",category:"planning",description:"Antenatal appointment planner, prenatal screening questions, birth preference organizer, and red-flag checklist.",iconName:"Heart",printable:!0,interactive:!0},{id:"tool15",number:15,title:"Menopause Symptom Discussion Sheet",category:"planning",description:"Symptom severity matrix for vasomotor, mood, sleep, cognitive, and genitourinary symptoms to review with your GP/gynecologist.",iconName:"Sliders",printable:!0,interactive:!0},{id:"tool16",number:16,title:"Pelvic-Floor Health Awareness Guide",category:"planning",description:"Distinguishing hypotonic from hypertonic pelvic floor dysfunction, why generic Kegels can harm, and rehabilitation pathways.",iconName:"ShieldAlert",printable:!0,interactive:!0},{id:"tool17",number:17,title:"Reproductive-Health Appointment Notes Template",category:"planning",description:"Universal printable clinic template for capturing diagnoses, prescribed medications, follow-up timelines, and second opinion plans.",iconName:"PenTool",printable:!0,interactive:!0},{id:"tool18",number:18,title:"Personal Lifelong Reproductive Health Action Plan",category:"planning",description:"Decade-by-decade prevention roadmap covering adolescence, 20s, 30s, 40s, 50s, and beyond with personalized goals.",iconName:"Award",printable:!0,interactive:!0},{id:"tool19",number:19,title:"Comprehensive Medical Terminology Glossary",category:"reference",description:"Alphabetical, searchable database of over 50 essential reproductive, endocrine, and urological clinical terms.",iconName:"Search",printable:!0,interactive:!0},{id:"tool20",number:20,title:"Frequently Asked Questions (FAQ)",category:"reference",description:"Medically vetted answers to the most common patient questions regarding fertility, contraception, periods, and sexual wellness.",iconName:"HelpCircle",printable:!0,interactive:!0}],um=[{id:"implant",name:"Etonogestrel Subdermal Implant (Nexplanon)",type:"hormonal",mechanism:"Releases progestin slowly; thickens cervical mucus, suppresses ovulation in most cycles, and thins the endometrial lining.",typicalEffectiveness:"99.95% (0.05% failure rate)",perfectEffectiveness:"99.95% (0.05% failure rate)",duration:"Up to 3–5 years (removable anytime)",stiProtection:!1,benefits:["Highest real-world efficacy of any reversible contraceptive",'Completely user-independent ("set and forget")',"Safe for individuals who cannot take oestrogen","Rapid return of baseline fertility upon removal"],limitations:["Requires minor in-office clinical insertion and removal procedure","Does not protect against STIs"],commonSideEffects:["Unpredictable light bleeding or spotting (common in first 6 months)","Infrequent bleeding or complete amenorrhoea (often viewed as a benefit)"],safetyConsiderations:"MEC Category 1 or 2 for nearly all individuals; safe during breastfeeding and in smokers.",sourceGuideline:"WHO Medical Eligibility Criteria (MEC) / CDC Selected Practice Recommendations"},{id:"iud-hormonal",name:"Levonorgestrel Intrauterine System (Mirena, Kyleena, Liletta)",type:"intrauterine",mechanism:"Releases local progestin into uterine cavity; thickens cervical mucus to block sperm, produces foreign-body reaction, thins endometrium.",typicalEffectiveness:"99.8% (0.1–0.2% failure rate)",perfectEffectiveness:"99.8% (0.1–0.2% failure rate)",duration:"3 to 8 years depending on device brand",stiProtection:!1,benefits:["Exceptional efficacy with minimal systemic hormone absorption","FDA-approved first-line treatment for heavy menstrual bleeding (reduces blood loss by up to 90%)","Protects endometrium in women taking systemic oestrogen therapy"],limitations:["Insertion requires speculum exam and may cause moderate cramping","Small risk of expulsion (~3–5%) or uterine perforation (~1 in 1,000 insertions)","No STI protection"],commonSideEffects:["Initial spotting for 3–6 months","Marked reduction or total cessation of menstrual bleeding over time"],safetyConsiderations:"Must rule out active pelvic infection or pregnancy prior to insertion.",sourceGuideline:"ACOG Practice Bulletin No. 186 / WHO MEC"},{id:"iud-copper",name:"Copper Intrauterine Device (Paragard, Nova-T)",type:"intrauterine",mechanism:"Releases copper ions that create a sterile inflammatory response in uterine and tubal fluid; highly toxic to sperm motility and prevents fertilisation.",typicalEffectiveness:"99.2% (0.6–0.8% failure rate)",perfectEffectiveness:"99.4% (0.6% failure rate)",duration:"Up to 10–12 years",stiProtection:!1,benefits:["100% hormone-free; ideal for individuals who want completely natural menstrual cycles","Most effective form of emergency contraception (>99.9% effective within 5 days)","Immediate return of fertility upon removal"],limitations:["May increase menstrual cramp intensity and heavier menstrual flow, particularly during the first 3–6 months","No STI protection"],commonSideEffects:["Heavier periods and dysmenorrhoea (often manageable with NSAIDs)"],safetyConsiderations:"Contraindicated in Wilson's disease or severe uterine structural cavity distortion.",sourceGuideline:"WHO MEC / Faculty of Sexual and Reproductive Healthcare (FSRH)"},{id:"injectable",name:"DMPA Injectable (Depo-Provera)",type:"hormonal",mechanism:"Intramuscular or subcutaneous injection of depot medroxyprogesterone acetate every 12 weeks; completely inhibits pituitary gonadotropins and ovulation.",typicalEffectiveness:"96% (4% failure rate in typical use)",perfectEffectiveness:"99.8% (0.2% failure rate)",duration:"12 weeks per injection",stiProtection:!1,benefits:["Private and convenient; only requires action 4 times a year","High rate of amenorrhoea after 12 months (~55%)","Oestrogen-free"],limitations:["Delayed return to baseline fertility (can take 6 to 12 months after discontinuation)","Requires strict adherence to 12-week schedule","Transient reduction in bone mineral density with long-term use (reversible upon cessation)"],commonSideEffects:["Irregular bleeding in first cycles","Weight gain in some individuals","Mild mood alterations"],safetyConsiderations:"Ensure adequate calcium and vitamin D intake during extended use.",sourceGuideline:"CDC SPR / WHO MEC"},{id:"cocp",name:"Combined Oral Contraceptive Pill (COCP)",type:"hormonal",mechanism:"Combines an oestrogen (ethinyl oestradiol) with a progestin. Suppresses hypothalamic GnRH and pituitary FSH/LH to prevent follicular maturation and ovulation.",typicalEffectiveness:"93% (7% failure rate in typical use)",perfectEffectiveness:"99.7% (0.3% failure rate)",duration:"Daily pill taking",stiProtection:!1,benefits:["Predictable, lighter, and less painful withdrawal bleeds","Significantly lowers long-term risk of ovarian, endometrial, and colorectal cancers","Improves acne and hirsutism"],limitations:["Requires consistent daily adherence at the same time","Efficacy reduced by severe vomiting/diarrhoea or certain anti-epileptic drugs","Slightly increases risk of venous thromboembolism (VTE)"],commonSideEffects:["Mild nausea, breast tenderness, or headache during initial cycles"],safetyConsiderations:"CONTRAINDICATED in individuals age ≥35 who smoke, migraine with aura, severe hypertension, or history of DVT/PE.",sourceGuideline:"ACOG Practice Bulletin No. 206 / WHO MEC"},{id:"pop",name:'Progestin-Only Pill (POP / "Mini-Pill")',type:"hormonal",mechanism:"Thickens cervical mucus within 2–4 hours of ingestion, preventing sperm penetration; newer drospirenone POPs also reliably suppress ovulation.",typicalEffectiveness:"93% (7% failure rate in typical use)",perfectEffectiveness:"99.7% (0.3% failure rate)",duration:"Daily pill taking (strict timing for traditional POPs)",stiProtection:!1,benefits:["Safe for individuals who cannot take oestrogen (smokers over 35, migraine with aura)","Compatible with immediate postpartum breastfeeding"],limitations:["Traditional norethindrone POPs must be taken within a strict 3-hour window daily; drospirenone has a 24-hour window","No STI protection"],commonSideEffects:["Unscheduled spotting or amenorrhoea"],safetyConsiderations:"Excellent safety profile with virtually no cardiovascular clotting risks.",sourceGuideline:"CDC SPR / FSRH UK"},{id:"condoms-male",name:"External (Male) Latex / Polyurethane Condom",type:"barrier",mechanism:"Mechanical sheath worn over the erect penis that captures semen and prevents mucosal contact between partners.",typicalEffectiveness:"87% (13% failure rate in typical use)",perfectEffectiveness:"98% (2% failure rate)",duration:"Single act of intercourse",stiProtection:!0,benefits:["ONLY CONTRACEPTIVE METHOD THAT PROTECTS AGAINST STIs","Non-hormonal, zero systemic side effects, immediately accessible without prescription","Shared male responsibility in contraception"],limitations:["User-dependent; requires proper technique at every sexual encounter","Can break, slip, or leak if used incorrectly or with oil-based lubricants (on latex)"],commonSideEffects:["Rare latex allergy (use polyurethane or polyisoprene alternatives)"],safetyConsiderations:"Always pair with water-based or silicone-based lubricant. Never use oil, petroleum jelly, or cooking oil with latex.",sourceGuideline:"WHO / CDC Contraceptive Guidance"},{id:"vasectomy",name:"Vasectomy (Male Surgical Sterilisation)",type:"permanent",mechanism:"Surgical transection and occlusion of the bilateral vas deferens, preventing sperm from entering the ejaculated seminal fluid.",typicalEffectiveness:">99.85% (<0.15% failure rate)",perfectEffectiveness:">99.9% (<0.1% failure rate)",duration:"Permanent",stiProtection:!1,benefits:["Simpler, safer, and less invasive than female tubal ligation (performed under local anaesthesia in 15–20 minutes)","Does NOT alter testosterone levels, sexual desire, erection, or ejaculate volume (sperm is only 2–5% of semen)","Permanent peace of mind"],limitations:["Intended to be permanent; reversal surgeries are expensive and not guaranteed","NOT IMMEDIATELY EFFECTIVE: Requires alternative contraception for 3 months until post-vasectomy semen analysis confirms azoospermia","No STI protection"],commonSideEffects:["Mild scrotal bruising and aching for 3–5 days post-surgery"],safetyConsiderations:"Must confirm azoospermia via laboratory semen analysis at 12 weeks before abandoning alternative contraception.",sourceGuideline:"AUA Vasectomy Guideline / EAU Guidelines"},{id:"tubal-ligation",name:"Laparoscopic Tubal Occlusion / Bilateral Salpingectomy",type:"permanent",mechanism:"Surgical clipping, cauterization, or complete removal (salpingectomy) of both fallopian tubes to prevent sperm from contacting the oocyte.",typicalEffectiveness:">99.5% (<0.5% failure rate)",perfectEffectiveness:">99.5% (<0.5% failure rate)",duration:"Permanent",stiProtection:!1,benefits:["Permanent contraception","Bilateral salpingectomy (complete tubal removal) significantly lowers lifetime risk of high-grade serous ovarian cancer (which arises in tubal fimbriae)","Does not alter ovarian hormone output or menstrual cycle hormones"],limitations:["Requires laparoscopic abdominal surgery under general anaesthesia","Surgical risks (bleeding, infection, anaesthesia complications)","Intended to be irreversible; no STI protection"],commonSideEffects:["Post-operative abdominal soreness and shoulder pain from laparoscopic gas"],safetyConsiderations:"Permanent surgical decision; requires unhurried, voluntary informed consent.",sourceGuideline:"ACOG Practice Bulletin No. 208"},{id:"emergency-contraception",name:"Emergency Contraception (Ulipristal / Levonorgestrel / Copper IUD)",type:"emergency",mechanism:"Delays or inhibits ovulation (ulipristal/levonorgestrel) or prevents fertilisation and implantation (copper IUD) after unprotected intercourse.",typicalEffectiveness:"Copper IUD: >99.9%; Ulipristal: ~98.5%; Levonorgestrel: ~95% within 24h, dropping to 58% at 72h",perfectEffectiveness:"Same as typical when used within designated timeframe",duration:"One-time emergency use (Copper IUD can remain 10+ years)",stiProtection:!1,benefits:["Provides a critical second chance to prevent pregnancy after condom breakage, assault, or missed pills","Over-the-counter access for levonorgestrel in many countries"],limitations:["Does NOT protect against STIs","Does NOT induce abortion; ineffective if pregnancy is already established","Less effective in higher BMI for oral tablets (Copper IUD retains 99.9% efficacy regardless of weight)"],commonSideEffects:["Mild transient nausea, headache, temporary cycle irregularity"],safetyConsiderations:"Take as early as possible. Ulipristal is effective up to 120 hours; Levonorgestrel is best within 72 hours.",sourceGuideline:"WHO Emergency Contraceptive Guidelines / ACOG Practice Bulletin No. 152"}],hm=[{id:"chlamydia",name:"Chlamydia (Chlamydia trachomatis)",pathogenType:"Bacterial",transmission:["Vaginal intercourse","Anal intercourse","Oral sex","Perinatal transmission during vaginal birth"],asymptomaticRate:"70% to 80% of women; ~50% of men have ZERO symptoms",symptoms:{general:["Often completely absent"],women:["Abnormal watery/mucopurulent discharge","Burning during urination","Intermenstrual spotting","Postcoital bleeding","Deep pelvic aching"],men:["Clear or milky penile discharge","Dysuria (burning with urination)","Testicular/epididymal ache or swelling"]},testingWindow:"1 to 2 weeks post-exposure for highest NAAT accuracy",testingMethod:"Nucleic Acid Amplification Test (NAAT) via first-catch urine (men) or self-collected vaginal swab (women)",treatmentAndManagement:"Curable with antibiotics: Oral Doxycycline 100 mg twice daily for 7 days (first-line). Abstain from sex for 7 days post-treatment. Retest at 3 months.",vaccineAvailable:!1,preventionGuidance:"Consistent condom use; annual screening for sexually active individuals <25 years or those with new partners.",urgentWarnings:"Untreated chlamydia can ascend into the upper reproductive tract, causing Pelvic Inflammatory Disease (PID), permanent fallopian tube scarring, ectopic pregnancy, and chronic pelvic pain."},{id:"gonorrhoea",name:"Gonorrhoea (Neisseria gonorrhoeae)",pathogenType:"Bacterial",transmission:["Vaginal, anal, or oral sex with an infected partner","Perinatal transmission"],asymptomaticRate:">50% of women; 10% to 15% of men asymptomatic; pharyngeal/rectal infections are >85% asymptomatic",symptoms:{general:["Can infect cervix, urethra, rectum, pharynx (throat), and eyes"],women:["Increased yellowish/green discharge","Painful urination","Intermenstrual bleeding","Lower abdominal tenderness"],men:["Copious, thick yellow-green penile discharge",'Severe urethral burning ("drip")',"Swollen or tender testicles"]},testingWindow:"1 to 2 weeks post-exposure",testingMethod:"NAAT swab of vagina, cervix, urethra, rectum, or oropharynx depending on sexual practices",treatmentAndManagement:"Curable with antibiotics: Single high-dose intramuscular injection of Ceftriaxone 500 mg. High levels of resistance have rendered older oral drugs ineffective. Dual-site testing recommended.",vaccineAvailable:!1,preventionGuidance:"Condoms and dental dams; regular multi-site screening (throat, rectum, urogenital) for individuals engaging in oral/anal intimacy.",urgentWarnings:"Can disseminate hematogenously (Disseminated Gonococcal Infection - DGI), causing septic arthritis, tenosynovitis, and dermatitis."},{id:"syphilis",name:"Syphilis (Treponema pallidum)",pathogenType:"Bacterial",transmission:["Direct contact with an infectious syphilitic sore (chancre or mucous patch) during vaginal, anal, or oral sex","Congenital transmission"],asymptomaticRate:"Can remain latent and clinically silent for decades between active stages",symptoms:{general:["Follows classic staged progression: Primary, Secondary, Latent, and Tertiary"],women:["Primary: Painless, firm, round ulcer (chancre) on vulva, cervix, or mouth (often unnoticed). Secondary: Non-itchy rough reddish rash on palms and soles, condyloma lata (moist warts)."],men:["Primary: Painless chancre on penis, scrotum, or anus. Secondary: Rash on palms/soles, swollen lymph nodes, patchy alopecia."]},testingWindow:"3 to 6 weeks for antibody detection in blood",testingMethod:"Serological blood testing: Non-treponemal tests (RPR or VDRL) confirmed by treponemal antibody tests (TPHA, FTA-ABS, or CIA)",treatmentAndManagement:"Curable with antibiotics: Intramuscular Benzathine Penicillin G (single dose for early syphilis; 3 weekly doses for late latent).",vaccineAvailable:!1,preventionGuidance:"Condoms reduce risk if ulcers are covered; routine universal prenatal screening is mandatory to prevent devastating congenital syphilis.",urgentWarnings:"Untreated tertiary syphilis leads to neurosyphilis (dementia, paralysis, stroke), cardiovascular aortitis, and blindness."},{id:"hpv",name:"Human Papillomavirus (HPV)",pathogenType:"Viral",transmission:["Direct skin-to-skin genital, anal, or oral contact, even without penetrative intercourse"],asymptomaticRate:">90% of infections are completely silent and cleared by the immune system within 1–2 years",symptoms:{general:["Low-risk types (6, 11) cause benign flesh-colored or cauliflower-like warts. High-risk oncogenic types (16, 18, 31, 33, 45) cause NO outward symptoms but can lead to cell dysplasia."],women:["Usually no symptoms until advanced precancer or cervical/anal/vulvar cancer develops."],men:["Usually asymptomatic; can cause penile, anal, or oropharyngeal malignancies."]},testingWindow:"Cervical screening begins at ages 21–25 depending on country guidelines",testingMethod:"Primary high-risk HPV DNA testing (from cervical swab) during routine screening. No approved commercial test exists for men or throat HPV.",treatmentAndManagement:"No cure for the virus itself, but cellular precancerous dysplasias (CIN) are easily excised/monitored (LEEP, cryotherapy, cone biopsy). Genital warts treated with topicals or cryotherapy.",vaccineAvailable:!0,preventionGuidance:"Gardasil 9 vaccine (routinely given at ages 9–14, approved up to age 45) protects against 9 oncogenic and wart-causing types. Consistent condom use reduces transmission.",urgentWarnings:"High-risk HPV causes virtually all cervical cancers worldwide, as well as significant percentages of anal and throat cancers."},{id:"hsv",name:"Herpes Simplex Virus (HSV-1 and HSV-2)",pathogenType:"Viral",transmission:["Direct mucosal contact with active lesions, saliva, or subclinical asymptomatic shedding from infected skin"],asymptomaticRate:"Up to 70–80% of infected individuals are unaware because symptoms are mild or subclinical",symptoms:{general:["Recurrent clusters of painful, fluid-filled vesicles that ulcerate, crust over, and heal over 7–14 days. Accompanied by prodromal tingling/itching."],women:["Painful genital blisters on vulva, cervix, buttocks; painful urination; tender inguinal lymph nodes during primary outbreak."],men:["Painful clusters of vesicles on penile shaft, glans, scrotum, or perianal area."]},testingWindow:"PCR swab of active blister fluid is most accurate within 48–72 hours of appearance; blood IgG serology takes 6–12 weeks",testingMethod:"Direct viral PCR swab of unroofed lesion base (gold standard)",treatmentAndManagement:"Not curable, but highly manageable: Oral antivirals (Valacyclovir, Acyclovir) shorten outbreak duration, decrease pain, and daily suppressive therapy cuts transmission risk by ~50%.",vaccineAvailable:!1,preventionGuidance:"Avoid sexual contact during prodrome or active lesions; condoms reduce transmission by ~50% in men and ~30% in women; daily suppressive antiviral therapy.",urgentWarnings:"Active genital lesions during labor can cause neonatal herpes (potentially fatal); cesarean delivery is indicated if active prodrome/lesions exist at delivery."},{id:"hiv",name:"Human Immunodeficiency Virus (HIV)",pathogenType:"Viral",transmission:["Condomless sexual intercourse (anal highest risk, then vaginal), shared needles/syringes, vertical mother-to-child transmission during birth/breastfeeding"],asymptomaticRate:"Initial acute flu-like seroconversion illness (2–4 weeks), followed by clinical latency lasting 8–10 years without symptoms while immune system is gradually damaged",symptoms:{general:["Acute retroviral syndrome: fever, sore throat, maculopapular rash, lymphadenopathy, myalgia. Advanced untreated HIV (AIDS): opportunistic infections, severe weight loss, night sweats."],women:["Recurrent severe candidiasis, persistent HPV dysplasias, pelvic inflammatory disease."],men:["Recurrent infections, persistent lymph node enlargement."]},testingWindow:"4th generation lab Ag/Ab blood test: 18 to 45 days post-exposure; rapid fingerstick: up to 90 days",testingMethod:"4th generation HIV-1/2 antigen/antibody immunoassay blood draw",treatmentAndManagement:"Manageable chronic condition: Antiretroviral Therapy (ART) suppresses viral replication. Undetectable = Untransmittable (U=U). With modern treatment, life expectancy equals the general population.",vaccineAvailable:!1,preventionGuidance:"PrEP (Pre-Exposure Prophylaxis) provides >99% sexual protection for HIV-negative individuals; PEP (within 72 hours of exposure); consistent condom use; sterile injection equipment.",urgentWarnings:"Seek Post-Exposure Prophylaxis (PEP) within 72 hours of any high-risk exposure; early diagnosis and immediate ART initiation preserve full immune health."}],Jo=[{term:"Adenomyosis",pronunciation:"ad-uh-no-my-OH-sis",category:"Gynaecology",definition:"A condition where the inner endometrial lining of the uterus breaks through the muscle wall (myometrium).",clinicalContext:"Presents with heavy, painful periods and an enlarged globular tender uterus; diagnosed via transvaginal ultrasound or MRI.",plainEnglishSummary:"Uterine lining tissue growing directly into the muscular wall of the womb, causing heavy periods and deep cramping."},{term:"Aneuploidy",pronunciation:"an-yoo-PLOY-dee",category:"Fertility & Genetics",definition:"The presence of an abnormal number of chromosomes in a cell (e.g., 45 or 47 instead of the typical 46).",clinicalContext:"Primary cause of age-related female subfertility and early miscarriage, resulting from meiotic non-disjunction in ageing oocytes.",plainEnglishSummary:"An embryo having too many or too few chromosomes, which often prevents healthy implantation."},{term:"Anti-Müllerian Hormone (AMH)",pronunciation:"an-tee myoo-LAIR-ee-un",category:"Endocrinology & Fertility",definition:"A glycoprotein hormone secreted by granulosa cells of small growing pre-antral and early antral ovarian follicles.",clinicalContext:"Used clinically as a serum biomarker for ovarian reserve (egg quantity); does not predict monthly natural conception likelihood or egg quality.",plainEnglishSummary:"A blood test that estimates how many responsive eggs remain in the ovaries, useful for fertility treatment planning."},{term:"Azoospermia",pronunciation:"ay-zoh-uh-SPER-mee-uh",category:"Andrology",definition:"The complete absence of spermatozoa in the ejaculated semen after centrifugation.",clinicalContext:"Differentiated into obstructive (blockage in vas deferens or epididymis) and non-obstructive (testicular failure of spermatogenesis).",plainEnglishSummary:"Having zero sperm cells detected in an ejaculate sample."},{term:"Benign Prostatic Hyperplasia (BPH)",pronunciation:"hy-per-PLAY-zhuh",category:"Urology",definition:"Non-malignant enlargement of the prostate gland transition zone, compressing the prostatic urethra.",clinicalContext:"Common in men over 50, causing urinary hesitancy, weak stream, nocturia, and incomplete bladder emptying.",plainEnglishSummary:"A natural, non-cancerous swelling of the prostate that pinches the urine tube as men age."},{term:"Corpus Luteum",pronunciation:"KOR-pus LOO-tee-um",category:"Physiology",definition:"A transient endocrine structure formed from the ruptured ovarian follicle after ovulation.",clinicalContext:"Secretes high levels of progesterone during the luteal phase to prepare and maintain the secretory endometrium for potential implantation.",plainEnglishSummary:"The yellow glandular structure left behind on the ovary after an egg is released; it pumps out progesterone."},{term:"Dysmenorrhoea",pronunciation:"dis-men-uh-REE-uh",category:"Menstrual Health",definition:"Painful menstruation, divided into primary (excessive prostaglandins) and secondary (underlying pelvic disease like endometriosis).",clinicalContext:"Treated first-line with NSAIDs (COX inhibitors) and continuous heat therapy; persistent secondary dysmenorrhoea requires ultrasound evaluation.",plainEnglishSummary:"Medical term for severe period cramps and pelvic menstrual pain."},{term:"Dyspareunia",pronunciation:"dis-puh-ROO-nee-uh",category:"Sexual Medicine",definition:"Persistent or recurrent genital pain that occurs just before, during, or after sexual intercourse.",clinicalContext:"Categorised into superficial (vestibulodynia, vaginismus, infection) and deep (endometriosis, PID, retroverted uterus).",plainEnglishSummary:"Pain experienced during or after sexual intimacy."},{term:"Endometriosis",pronunciation:"en-doh-mee-tree-OH-sis",category:"Gynaecology",definition:"A systemic inflammatory condition characterized by the presence of endometrium-like tissue outside the uterine cavity.",clinicalContext:"Causes severe chronic pelvic pain, fatigue, painful bowel movements, and subfertility; managed medically, surgically, and multidisciplinarily.",plainEnglishSummary:"Tissue similar to the lining of the womb growing outside of it on organs like ovaries, bladder, and intestines."},{term:"Genitourinary Syndrome of Menopause (GSM)",pronunciation:"jen-ih-toh-YUR-ih-nair-ee",category:"Menopause",definition:"A collection of symptoms resulting from oestrogen deficiency affecting the labia, vagina, urethra, and bladder.",clinicalContext:"Includes vaginal dryness, burning, dyspareunia, and recurrent UTIs; highly responsive to low-dose local vaginal oestrogen.",plainEnglishSummary:"Vaginal dryness, irritation, and bladder urgency caused by the natural drop in oestrogen after menopause."},{term:"Laparoscopy",pronunciation:"lap-uh-ROS-kuh-pee",category:"Surgical Procedures",definition:"Minimally invasive keyhole surgery using a camera inserted through the umbilicus to inspect and treat pelvic organs.",clinicalContext:"Gold standard for definitive surgical diagnosis and excision of endometriosis and tubal assessment.",plainEnglishSummary:"Keyhole surgery where a doctor looks inside the pelvis through small incisions with a lighted camera."},{term:"Pampiniform Plexus",pronunciation:"pam-PIN-ih-form",category:"Anatomy",definition:"A network of numerous small veins found in the male spermatic cord.",clinicalContext:"Acts as a counter-current heat exchanger to cool arterial blood entering the testes; abnormal dilation creates a varicocele.",plainEnglishSummary:"The web of veins in the scrotum that keeps the testicles cool."},{term:"Polycystic Ovary Syndrome (PCOS)",pronunciation:"pah-lee-SIS-tik",category:"Endocrinology",definition:"A common endocrine-metabolic disorder characterized by ovulatory dysfunction, hyperandrogenism, and polycystic ovarian morphology.",clinicalContext:"Driven largely by insulin resistance; diagnosed using the international Rotterdam criteria.",plainEnglishSummary:"A hormone and metabolic condition that leads to irregular periods, elevated androgens, and immature ovarian follicles."},{term:"Prostate-Specific Antigen (PSA)",pronunciation:"P-S-A",category:"Urology",definition:"A glycoprotein enzyme produced by prostate epithelial cells to liquefy semen.",clinicalContext:"Measured in blood as a biomarker for prostate tissue activity; elevated in BPH, prostatitis, and prostate cancer.",plainEnglishSummary:"A protein made by the prostate; tested in blood to help screen for prostate changes and cancer."},{term:"Spermatogenesis",pronunciation:"sper-mat-oh-JEN-uh-sis",category:"Physiology",definition:"The biological process of cellular division and maturation producing haploid spermatozoa from germ cells.",clinicalContext:"Spans approximately 64 to 74 days within the testicular seminiferous tubules, followed by epididymal maturation.",plainEnglishSummary:"The complete biological cycle of making new sperm in the testicles, taking roughly 2.5 months."},{term:"Testicular Torsion",pronunciation:"tes-TIK-yoo-ler TOR-shun",category:"Emergency Medicine",definition:"Twisting of the spermatic cord cutting off testicular arterial blood supply and venous drainage.",clinicalContext:"Surgical emergency requiring detorsion within 6 hours to prevent permanent ischemic testicular necrosis.",plainEnglishSummary:"An emergency where the testicle twists, cutting off its blood supply. Requires immediate hospital surgery."},{term:"Ulipristal Acetate",pronunciation:"yoo-lih-PRIS-tal",category:"Pharmacology",definition:"A selective progesterone receptor modulator used as oral emergency contraception (ella).",clinicalContext:"Effective up to 120 hours (5 days) post-unprotected intercourse by delaying follicular rupture even during early LH surge.",plainEnglishSummary:"A modern emergency contraceptive pill that delays ovulation up to 5 days after unprotected sex."},{term:"Varicocele",pronunciation:"VAIR-ih-koh-seel",category:"Urology",definition:"An abnormal tortuosity and dilation of the internal spermatic veins (pampiniform plexus) in the scrotum.",clinicalContext:'Present in ~15% of men and ~35–40% of men with primary infertility; often described as a "bag of worms".',plainEnglishSummary:"Enlarged varicose veins in the scrotum that can overheat the testicle and impair sperm quality."}],mm=[{category:"General & Hormones",question:'Can commercial "hormone detox teas" or supplements balance my hormones?',answer:'No. There is no credible scientific evidence that commercial detox teas, cleanses, or unregulated herbal drops balance reproductive hormones. The human liver, kidneys, and endocrine feedback loops continuously process and regulate hormones. Many unregulated "hormone balancers" have been found to contain hidden pharmaceuticals or heavy metals that can harm your health.'},{category:"General & Hormones",question:"Are human hormones supposed to be completely stable every day?",answer:"No. Natural biological hormones are designed to fluctuate dynamically. In people who menstruate, oestrogen and progesterone shift continuously across the cycle. In men, testosterone follows a circadian diurnal rhythm, peaking in the morning and declining in the evening. True clinical hormone imbalances (like PCOS, thyroid dysfunction, or hyperprolactinaemia) are diagnosed through structured medical tests, not wellness questionnaires."},{category:"Menstrual Health",question:"Is it true that every healthy menstrual cycle must be exactly 28 days long?",answer:"No. According to the International Federation of Gynecology and Obstetrics (FIGO), normal menstrual cycles range between 24 and 38 days. Variation of up to 7 to 9 days from your longest to shortest cycle over a year is completely physiological."},{category:"Menstrual Health",question:"How do I know if my menstrual bleeding is abnormally heavy (menorrhagia)?",answer:"Clinical red flags for abnormally heavy bleeding include: needing to change a high-absorbency pad or tampon every 1 to 2 hours for consecutive hours, needing double protection (pad plus tampon), passing blood clots larger than a golf ball, bleeding lasting longer than 8 days, or feeling exhausted, dizzy, and short of breath (signs of iron deficiency anaemia). If you experience these, consult a doctor."},{category:"Male Health",question:"What should I do if I feel sudden, severe pain in one testicle?",answer:"GO IMMEDIATELY TO THE NEAREST HOSPITAL EMERGENCY DEPARTMENT. Sudden severe testicular pain can be testicular torsion, where the blood vessels supplying the testicle twist shut. Irreversible tissue death can occur within 6 hours. Emergency surgery can untwist and save the testicle. Never wait to see if it gets better."},{category:"Male Health",question:"Does having a vasectomy reduce testosterone levels or change ejaculate volume?",answer:"No. A vasectomy interrupts only the vas deferens, blocking sperm from entering the semen. Testosterone is produced by Leydig cells and enters the bloodstream directly. Sperm make up only 2% to 5% of the total ejaculate volume; seminal fluid from the prostate and seminal vesicles remains unchanged in volume and appearance."},{category:"Fertility & Conception",question:"When is the best time to have intercourse if we are trying to conceive?",answer:"The fertile window spans the 5 days before ovulation plus ovulation day itself. Having intercourse every 1 to 2 days during the 2 to 3 days immediately preceding ovulation yields the highest biological probability of conception because sperm can survive up to 5 days in fertile cervical mucus waiting for the short-lived egg."},{category:"Fertility & Conception",question:"Does taking an AMH (Anti-Müllerian Hormone) test tell me if I am fertile right now?",answer:"No. AMH is a biomarker of ovarian reserve—meaning the quantity of responsive eggs remaining in your ovaries. It is useful for predicting how many eggs might be retrieved during IVF, but it does NOT measure egg quality, does not check fallopian tube patency, and does not predict whether you can get pregnant naturally this month."},{category:"Contraception & STIs",question:"Do birth control pills or IUDs protect against STIs?",answer:"No. Hormonal methods and intrauterine devices protect exclusively against pregnancy. CONDOMS are the ONLY contraceptive method that provides protection against Sexually Transmitted Infections (such as chlamydia, gonorrhoea, syphilis, HIV, and HPV). Dual protection (condom + highly effective contraceptive) is the gold standard for sexual health."},{category:"Contraception & STIs",question:"If I have an STI, will I always have obvious symptoms like sores or discharge?",answer:"No. The majority of common STIs are completely silent and asymptomatic. Up to 70–80% of women and 50% of men with chlamydia have no symptoms. HPV and herpes are frequently shed without symptoms. Routine laboratory screening based on your sexual activity is the only reliable way to know your status."},{category:"Menopause & Ageing",question:"Is Menopausal Hormone Therapy (MHT / HRT) safe to use for hot flashes?",answer:'Yes, for the majority of healthy symptomatic individuals who begin treatment within 10 years of menopause or before age 60 (the "window of opportunity"). Modern formulations using transdermal bioidentical estradiol and oral micronized progesterone carry low risks of blood clots and cardiovascular events while effectively relieving symptoms and protecting bone mineral density.'},{category:"Pelvic Health",question:"Should everyone do Kegel exercises every day for pelvic health?",answer:"No! While Kegels (pelvic floor muscle contractions) help a hypotonic (weak) pelvic floor with stress incontinence, they are HARMFUL for a hypertonic (overactive, tight) pelvic floor. If you experience pelvic pain, pain with intercourse, or constipation, your pelvic muscles are already in spasm; doing Kegels will worsen your pain. You need relaxation and down-training from a specialized pelvic floor physical therapist."}],Zo={"female-internal":{title:"Female Internal Reproductive System",subtitle:"Coronal section of uterus, fallopian tubes, ovaries, cervix, and upper vagina",description:"The internal female reproductive system is located within the pelvic basin, protected by the pelvic bones. It is responsible for oocyte maturation, hormone production, fertilisation site, and nurturing fetal development.",hotspots:[{id:"uterus",name:"Uterus (Fundus & Body)",x:50,y:42,category:"Organ",description:"Muscular pear-shaped organ consisting of three layers: outer serosa/perimetrium, middle thick smooth muscle (myometrium), and inner cyclical lining (endometrium).",clinicalNote:"Responds dynamically to oestrogen and progesterone. In non-pregnant adults, measures ~7.5 cm in length and weighs ~60 grams.",variation:"Position varies naturally: ~75% anteverted (tilted forward over bladder); ~25% retroverted (tilted backward toward rectum), which is a normal benign variation."},{id:"endometrium",name:"Endometrium (Lining)",x:50,y:48,category:"Tissue Layer",description:"The mucosal inner lining that thickens during the follicular phase and develops secretory glands in the luteal phase to receive a blastocyst.",clinicalNote:"Sheds during menstruation if implantation does not occur. Tissue growing outside the uterus leads to the condition endometriosis.",variation:"Thickness fluctuates normally from 1–4 mm post-menses to 8–16 mm in the secretory phase."},{id:"ovary-left",name:"Ovary (Left & Right)",x:22,y:45,category:"Gonad",description:"Dual female gonads that house the lifetime reserve of primordial follicles and produce oestrogens, progesterone, and inhibin.",clinicalNote:"Connected to the uterus via the utero-ovarian ligament and supported by the infundibulopelvic (suspensory) ligament containing ovarian vessels.",variation:"Average size is ~3.5 × 2 × 1.5 cm; volume decreases naturally after menopause due to follicular exhaustion."},{id:"fallopian-tube",name:"Fallopian Tube (Ampulla & Isthmus)",x:28,y:33,category:"Duct",description:"Paired hollow muscular tubes (~10–12 cm long) lined with ciliated epithelium that transport the oocyte toward the uterus and sperm toward the oocyte.",clinicalNote:"Fertilisation typically occurs in the outer ampullary segment. Tubal blockage from prior infections (chlamydia, PID) can cause ectopic pregnancy or infertility.",variation:"Fimbriae at the distal infundibulum sweep rhythmically over the ovarian surface during ovulation to capture the released oocyte."},{id:"cervix",name:"Cervix (External Os & Canal)",x:50,y:68,category:"Structure",description:"The cylindrical neck of the uterus that connects the uterine cavity to the vagina. Features the endocervical canal and transformation zone.",clinicalNote:"The squamocolumnar transformation zone is the primary site evaluated during cervical cancer screening (HPV testing and Pap cytology).",variation:"Produces thin, stretchy fertile mucus around ovulation and thick, impermeable mucus during the luteal phase and pregnancy."},{id:"vagina",name:"Vagina (Vaginal Canal)",x:50,y:84,category:"Canal",description:"Elastic, muscular canal lined with non-keratinized stratified squamous epithelium with transverse folds (rugae) that distend during childbirth and intercourse.",clinicalNote:"Maintains an acidic physiological pH (3.8–4.5) driven by beneficial Lactobacillus bacteria metabolising glycogen into lactic acid.",variation:"Resting length averages 7–10 cm; expands significantly during sexual arousal and delivery."}]},"female-external":{title:"Female External Genitalia (The Vulva)",subtitle:"Surface structures and internal erectile clitoral complex",description:"The vulva encompasses all external female genital organs. It is essential to distinguish the external vulva from the internal vaginal canal. The clitoris is an extensive 3D organ of sexual pleasure.",hotspots:[{id:"clitoris-glans",name:"Clitoral Glans & Prepuce (Hood)",x:50,y:32,category:"Sensory Organ",description:"The visible external tip of the clitoris, densely packed with an estimated 8,000–10,000 sensory nerve endings dedicated to sexual pleasure.",clinicalNote:"Covered by a protective fold of skin (clitoral hood or prepuce). Highly responsive to touch, temperature, and vibration.",variation:"Size, prominence, and hood coverage vary widely; asymmetry and differing degrees of visibility are completely normal."},{id:"clitoris-crura",name:"Internal Clitoral Crura & Bulbs",x:35,y:46,category:"Erectile Tissue",description:"Two deep erectile wings (crura) extending 7–9 cm along the pubic arch, and paired vestibular bulbs flanking the vaginal opening that engorge with blood during sexual arousal.",clinicalNote:"First comprehensively mapped in modern medicine by urologist Dr. Helen O'Connell in 1998, disproving historical misconceptions of the clitoris as a tiny superficial organ.",variation:"Engorges significantly with blood during excitement, providing sensation across the entire anterior vaginal wall."},{id:"urethral-opening",name:"Urethral Meatus",x:50,y:48,category:"Urinary Tract",description:"Small external orifice of the female urethra, positioned between the clitoral glans and vaginal opening.",clinicalNote:"Because the female urethra is short (~4 cm), bacteria from the perianal area can enter more easily, making urinary tract infections (UTIs) common. Urinating after intercourse helps flush bacteria.",variation:"Natural variations exist in proximity to the vaginal introitus."},{id:"labia-majora",name:"Labia Majora (Outer Folds)",x:25,y:60,category:"External Fold",description:"Paired outer cutaneous folds rich in adipose tissue, sebaceous glands, and hair follicles, protecting delicate inner structures.",clinicalNote:"Homologous to the male scrotum in embryonic origin.",variation:"Varies naturally in volume, pigment (often darker than surrounding skin), hair distribution, and symmetry."},{id:"labia-minora",name:"Labia Minora (Inner Folds)",x:40,y:64,category:"Mucosal Fold",description:"Delicate, highly vascular inner folds rich in sebaceous glands and nerve endings, framing the vaginal opening.",clinicalNote:"Contain no hair follicles. Engorge and darken subtly during sexual arousal.",variation:"Tremendous healthy diversity: may be longer or shorter than labia majora, ruffled, smooth, asymmetrical, or differently pigmented."},{id:"vaginal-introitus",name:"Vaginal Introitus & Hymenal Ring",x:50,y:72,category:"Orifice",description:"The external entrance into the vaginal canal, surrounded by the hymenal membrane fringe.",clinicalNote:'The hymen is not a solid "seal," but a flexible mucosal fringe that stretches with tampon use, exercise, and intercourse.',variation:"Bartholin's glands at the 4 and 8 o'clock positions secrete tiny amounts of lubricating mucus during arousal."}]},"male-internal":{title:"Male Internal Reproductive System",subtitle:"Sagittal view of testes, duct system, and accessory glands",description:"The male internal system is dedicated to continuous spermatogenesis, biochemical fluid synthesis (seminal plasma), and precise ejaculation transport.",hotspots:[{id:"testis",name:"Testis (Seminiferous Tubules)",x:35,y:80,category:"Gonad",description:"Primary male gonad containing hundreds of tightly coiled seminiferous tubules (spermatogenesis) and interstitial Leydig cells (testosterone synthesis).",clinicalNote:"Produces 100–200 million sperm daily. Maintained at 34–35°C (2–3°C cooler than core body temperature).",variation:"Left testis usually hangs slightly lower than the right; average volume is 15–25 mL."},{id:"epididymis",name:"Epididymis (Head, Body & Tail)",x:43,y:76,category:"Duct System",description:"Crescent-shaped coiled duct (~6 metres long uncoiled) resting along the posterior border of each testis.",clinicalNote:"Sperm spend 10–14 days here acquiring forward progressive motility and membrane stabilization. Can become inflamed in epididymitis.",variation:"Firm, soft cord-like ridge palpable during testicular self-checks (must not be confused with a tumor)."},{id:"vas-deferens",name:"Vas Deferens (Ductus Deferens)",x:48,y:56,category:"Muscular Tube",description:"Thick-walled muscular tube (~45 cm long) that carries sperm from the epididymal tail through the inguinal canal into the pelvis.",clinicalNote:"The target of surgical vasectomy: cut and sealed to prevent sperm from entering the ejaculate.",variation:"Peristaltic smooth muscle contractions rapidly propel sperm during the emission phase."},{id:"seminal-vesicles",name:"Seminal Vesicles",x:64,y:44,category:"Accessory Gland",description:"Paired sac-like glands located behind the bladder base, joining the vas deferens to form the ejaculatory duct.",clinicalNote:"Contribute ~65–70% of total semen volume: a thick, alkaline fluid rich in fructose (fuel for sperm), ascorbic acid, and prostaglandins.",variation:"Fructose content is tested clinically in semen analysis to verify patent ejaculatory ducts."},{id:"prostate",name:"Prostate Gland",x:58,y:52,category:"Accessory Gland",description:"Walnut-sized fibromuscular gland surrounding the proximal urethra directly beneath the bladder neck.",clinicalNote:"Secretes ~25–30% of semen: a thin, milky alkaline fluid containing zinc, citric acid, and Prostate-Specific Antigen (PSA) to liquefy semen.",variation:"Benign enlargement (BPH) is common after age 50, causing urinary hesitancy and nocturia."},{id:"bulbourethral",name:"Bulbourethral (Cowper's) Glands",x:55,y:62,category:"Accessory Gland",description:"Pea-sized paired glands situated at the base of the penis below the prostate.",clinicalNote:"Secrete pre-ejaculatory clear alkaline mucus during arousal to neutralize residual acidic urine in the urethra and lubricate the glans.",variation:"While pre-ejaculate itself does not originate with sperm, viable sperm can occasionally leak from earlier ejaculations."}]},"male-external":{title:"Male External Anatomy & Penile Erectile Chambers",subtitle:"Cross-section of shaft, erectile cylinders, and scrotal architecture",description:"The external male anatomy encompasses the penis and scrotum, integrating complex vascular, neural, and muscular systems responsible for erection, urinary drainage, and thermoregulation.",hotspots:[{id:"corpora-cavernosa",name:"Corpora Cavernosa (Paired Erectile Cylinders)",x:48,y:40,category:"Erectile Tissue",description:"Two dorsal erectile columns composed of vascular sinusoidal spaces lined by endothelium and smooth muscle, enclosed in the tough tunica albuginea.",clinicalNote:"During arousal, nitric oxide relaxes vascular smooth muscle, filling the sinusoids with blood under arterial pressure. Emissary veins compress against the tunica albuginea to maintain rigidity.",variation:"Asymmetry in blood flow can cause mild physiological curvature during erection (<30° without pain is normal)."},{id:"corpus-spongiosum",name:"Corpus Spongiosum & Urethra",x:48,y:58,category:"Tissue & Duct",description:"The single ventral column that surrounds and protects the urethra, expanding distally to form the glans penis.",clinicalNote:"Maintains lower internal pressure than the cavernosa during erection so the urethra remains patent, allowing semen expulsion.",variation:"Urethral meatus normally opens at the tip; opening on underside is hypospadias (congenital variation)."},{id:"glans-penis",name:"Glans Penis & Corona",x:68,y:46,category:"Sensory Structure",description:"The sensitive bulbous head of the penis, rich in sensory nerve endings, crowned by the coronal ridge.",clinicalNote:"Highly sensitive to mechanical, thermal, and erotic stimuli; contains the external urethral meatus.",variation:"May be covered by a natural retractile foreskin (prepuce) or exposed if circumcised; both states are healthy."},{id:"scrotum-skin",name:"Scrotum & Dartos Muscle",x:30,y:68,category:"Thermoregulatory Sac",description:"Cutaneous dual-chambered sac containing smooth dartos muscle and skeletal cremaster muscle fibers.",clinicalNote:"Contracts and tightens in cold conditions to draw testes toward body heat; relaxes in warmth to allow convective cooling, preserving 34°C for sperm viability.",variation:"Pigmentation is typically darker than adjacent thigh skin; surface rugae expand and contract constantly."}]},"pelvic-floor":{title:"The Pelvic Floor Muscular Architecture",subtitle:"Dynamic muscular hammock supporting viscera, continence, and sexual arousal",description:"The pelvic floor is a multi-layered group of muscles stretching from the pubic bone to the tailbone (coccyx). It supports pelvic viscera, regulates continence, and plays a vital role in sexual health.",hotspots:[{id:"puborectalis",name:"Puborectalis Muscle",x:50,y:52,category:"Levator Ani",description:"U-shaped muscular sling originating from the pubic bones and looping around the anorectal junction.",clinicalNote:"Creates the anorectal angle (~80–90°), maintaining fecal continence. Must fully relax during defecation (facilitated by squatting posture).",variation:"Hypertonicity in this muscle contributes to severe constipation and chronic pelvic pain."},{id:"pubococcygeus",name:"Pubococcygeus Muscle",x:40,y:45,category:"Levator Ani",description:"Primary muscular sheet of the levator ani supporting the bladder neck, urethra, and vaginal/prostatic structures.",clinicalNote:"Contracts during voluntary pelvic floor squeezes and during orgasm in rhythmic 0.8-second spasms.",variation:"Vulnerable to over-stretching during vaginal delivery; responds well to targeted physical therapy."},{id:"iliococcygeus",name:"Iliococcygeus Muscle",x:30,y:60,category:"Levator Ani",description:"Posterior fan-shaped component of the pelvic diaphragm attaching to the tendinous arch and coccyx.",clinicalNote:"Provides broad horizontal shelf-like structural support against intra-abdominal pressure (coughing, heavy lifting).",variation:"Often becomes lax in pelvic organ prolapse (cystocele, rectocele)."},{id:"perineal-body",name:"Perineal Body (Central Tendon)",x:50,y:65,category:"Fibromuscular Node",description:"Pyramidal fibromuscular node situated between the anterior urogenital triangle and posterior anal triangle.",clinicalNote:"The anchor point where eight pelvic muscles converge. Essential for structural stability of the pelvic outlet.",variation:"May tear or be incised (episiotomy) during birth; requires careful anatomic repair."}]}},fm=()=>{const[z,W]=Se.useState("female-internal"),[y,b]=Se.useState(Zo["female-internal"].hotspots[0]),N=Zo[z],d=h=>{W(h),b(Zo[h].hotspots[0])};return n.jsxs("div",{className:"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden my-8",children:[n.jsxs("div",{className:"p-6 bg-slate-900 text-white",children:[n.jsxs("div",{className:"flex flex-wrap items-center justify-between gap-4",children:[n.jsxs("div",{children:[n.jsxs("div",{className:"inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-semibold mb-2",children:[n.jsx(Pm,{className:"w-3.5 h-3.5"}),"Interactive Clinical Anatomy Guide"]}),n.jsx("h3",{className:"text-xl md:text-2xl font-bold font-serif",children:N.title}),n.jsx("p",{className:"text-sm text-slate-300 mt-1",children:N.subtitle})]}),n.jsxs("div",{className:"flex isuses "vagina" to refer to the entire genital area; accurate terminology reduces medical confusion and shame.'},{id:"fc2",category:"Anatomy",question:"What is the full anatomical extent of the clitoris?",answer:"The visible external clitoral glans is merely the tip of an extensive 3D organ containing paired internal erectile wings (crura) and vestibular bulbs that flank the vaginal canal, measuring 7 to 10 cm in total depth.",clinicalContext:"It contains 8,000–10,000 sensory nerve endings dedicated solely to sexual sensation."},{id:"fc3",category:"Physiology",question:"Why are the testes housed outside the abdominal cavity in the scrotum?",answer:"Human spermatogenesis requires a temperature approximately 2°C to 3°C lower than core body temperature (34–35°C). The scrotum, dartos, and cremaster muscles dynamically regulate distance from the body to maintain this thermal differential.",clinicalContext:"Prolonged heat exposure (saunas, hot tubs, tight non-breathable gear) impairs sperm production."},{id:"fc4",category:"Endocrinology",question:"What is the physiological role of the mid-cycle LH surge?",answer:"Sustained high oestradiol levels from the dominant follicle switch pituitary feedback from negative to positive. The resulting LH surge triggers the resumption of meiosis in the oocyte and rupture of the ovarian follicle within 24–36 hours.",clinicalContext:"Ovulation prediction kits (OPKs) detect this urinary LH surge."},{id:"fc5",category:"Menstrual Health",question:"What is considered a normal menstrual cycle length under FIGO clinical guidelines?",answer:"FIGO defines a normal menstrual cycle as lasting between 24 and 38 days. Variation of up to 7 to 9 days between longest and shortest cycles over a year is normal physiological variance.",clinicalContext:"The assumption that all healthy cycles are exactly 28 days is a medical myth."},{id:"fc6",category:"Emergency Medicine",question:"Why is sudden severe testicular pain considered an absolute surgical emergency?",answer:"It may indicate Testicular Torsion—where the spermatic cord twists, cutting off arterial blood supply. Without surgical detorsion within 6 hours, permanent ischemic necrosis occurs, often requiring removal of the testis.",clinicalContext:"Immediate emergency hospital evaluation is critical; do not wait."},{id:"fc7",category:"Contraception",question:"Which contraceptive methods protect against Sexually Transmitted Infections (STIs)?",answer:"ONLY external and internal condoms provide barrier protection against STIs. Implants, IUDs, pills, injections, and vasectomy provide excellent pregnancy prevention but zero STI protection.",clinicalContext:"The Dual Protection Principle recommends combining condoms with a highly effective contraceptive."},{id:"fc8",category:"Sexual Medicine",question:'What does the scientific consensus "U=U" mean in HIV medicine?',answer:"Undetectable = Untransmittable. A person living with HIV on effective Antiretroviral Therapy (ART) who maintains an undetectable viral load in their blood cannot transmit HIV sexually to partners.",clinicalContext:"Established by prospective international trials (PARTNER 1 and PARTNER 2)."},{id:"fc9",category:"Fertility",question:"What does an Anti-Müllerian Hormone (AMH) blood test accurately indicate?",answer:"AMH reflects ovarian reserve—the relative quantity of remaining responsive primordial and antral follicles. It is useful for IVF dosage planning, but does NOT predict natural monthly conception ability or egg quality.",clinicalContext:"Normal or low AMH does not mean a person cannot achieve pregnancy naturally in a given cycle."},{id:"fc10",category:"Pelvic Health",question:"Why can doing repetitive Kegel exercises harm someone with pelvic pain or vaginismus?",answer:"Pelvic pain and vaginismus are often driven by a hypertonic (chronically tight, spasming) pelvic floor. Adding contracting Kegels shortens and fatigues the muscles further. What they need is down-training, relaxation, and physical therapy.",clinicalContext:"Strengthening is for hypotonic (weak) pelvic floors; hypertonic floors require relaxation and elongation."}],$y=()=>{const[z]=Se.useState(Jy),[W,y]=Se.useState(0),[b,N]=Se.useState(!1),[d,h]=Se.useState(new Set),c=z[W],p=()=>{N(!1),y(k=>(k+1)%z.length)},u=()=>{N(!1),y(k=>(k-1+z.length)%z.length)},A=()=>{h(k=>new Set(k).add(c.id)),p()},w=()=>{h(k=>{const f=new Set(k);return f.delete(c.id),f}),p()};return n.jsxs("div",{className:"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden my-8",children:[n.jsxs("div",{className:"p-6 bg-slate-900 text-white flex flex-wrap items-center justify-between gap-4",children:[n.jsxs("div",{children:[n.jsxs("div",{className:"inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 text-xs font-semibold mb-2",children:[n.jsx(Nr,{className:"w-3.5 h-3.5"}),"Active Recall Study System"]}),n.jsx("h3",{className:"text-xl md:text-2xl font-bold font-serif",children:"Reproductive Science Flashcards"}),n.jsx("p",{className:"text-sm text-slate-300 mt-1",children:"Master core anatomical, endocrine, contraceptive, and clinical terms through spaced repetition."})]}),n.jsxs("div",{className:"text-xs bg-slate-800 px-3.5 py-2 rounded-xl border border-slate-700 font-mono",children:["Mastered: ",n.jsx("span",{className:"text-emerald-400 font-bold",children:d.size})," / ",z.length]})]}),n.jsxs("div",{className:"p-6 md:p-10 max-w-xl mx-auto flex flex-col items-center",children:[n.jsxs("div",{className:"w-full flex items-center justify-between text-xs text-slate-400 mb-3",children:[n.jsx("span",{className:"font-medium text-cyan-700 bg-cyan-50 px-2.5 py-0.5 rounded-full border border-cyan-200",children:c.category}),n.jsxs("span",{children:["Card ",W+1," of ",z.length]})]}),n.jsxs("div",{onClick:()=>N(!b),className:"w-full min-h-[280px] cursor-pointer rounded-2xl border border-slate-200 bg-slate-50 hover:border-cyan-400 p-8 flex flex-col justify-between transition-all duration-200 shado <body>
  <header class="main-header">
    <div class="brand-tag">HERBULANCE — The Complete Life Toolkit (Book 29)</div>
    <h1>The Complete Guide to Reproductive, Sexual & Lifelong Health</h1>
    <p>Offline Single-File Self-Contained Edition • Published March 2026</p>
  </header>

  <main class="container">
    ${xt.map(p=>`
      <article id="${p.id}" class="chapter-card">
        <header>
          <span class="part-badge">${p.partTitle}</span>
          <span class="ch-badge">Chapter ${p.chapterNumber}</span>
          <h1>${p.title}</h1>
          <p class="subtitle">${p.subtitle}</p>
        </header>
        
        <div class="meta-bar">
          <span>Read time: ${p.readTimeMinutes} minutes</span>
        </div>

        <section class="learning-objectives">
          <h3>Core Learning Objectives</h3>
          <ul>
            ${p.learningObjectives.map(u=>`<li>${u}</li>`).join("")}
          </ul>
        </section>

        <section class="overview">
          <p>${p.overview}</p>
        </section>

        ${p.sections.map(u=>`
          <div class="content-section">
            <h2>${u.heading}</h2>
            ${u.paragraphs.map(A=>`<p>${A}</p>`).join("")}
            ${u.bulletPoints?`<ul>${u.bulletPoints.map(A=>`<li>${A}</li>`).join("")}</ul>`:""}
            ${u.evidenceBox?`
              <div class="evidence-box ${u.evidenceBox.type}">
                <strong>${u.evidenceBox.title}</strong>
                <p>${u.evidenceBox.text}</p>
                ${u.evidenceBox.source?`<small>Source: ${u.evidenceBox.source}</small>`:""}
              </div>`:""}
            ${u.clinicalNote?`<div class="clinical-note"><strong>Clinical Note:</strong> ${u.clinicalNote}</div>`:""}
            ${u.mythVsFact?`
              <div class="myths-container">
                <h3>Myths vs Scientific Facts</h3>
                ${u.mythVsFact.map(A=>`
                  <div class="myth-row">
                    <div class="myth"><strong>Myth:</strong> ${A.myth}</div>
                    <div class="fact"><strong>Evidence Fact:</strong> ${A.fact}</div>
                  </div>
                `).join("")}
              </div>
            `:""}
          </div>
        `).join("")}

        <section class="takeaways">
          <h3>Key Practical Takeaways</h3>
          <ul>
            ${p.practicalTakeaways.map(u=>`<li>${u}</li>`).join("")}
          </ul>
        </section>

        <section class="quiz-section">
          <h3>Review & Knowledge Check</h3>
          ${p.quiz.map((u,A)=>`
            <div class="quiz-q">
              <p><strong>Q${A+1}: ${u.question}</strong></p>
              <ul>
                ${u.options.map((w,k)=>`<li>${String.fromCharCode(65+k)}) ${w}</li>`).join("")}
              </ul>
              <div class="explanation"><strong>Answer Explanation:</strong> ${u.explanation}</div>
            </div>
