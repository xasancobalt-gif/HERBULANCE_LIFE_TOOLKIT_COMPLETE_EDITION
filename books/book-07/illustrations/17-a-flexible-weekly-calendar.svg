<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">A flexible weekly calendar</title><desc id="desc">A flexible weekly calendar. Anchor meals plus open space. Mon-Tue: Use fresh food; Wed-Thu: Shared ingredients; Fri-Sat: Quick backup; Sunday: Review and reset.</desc><rect width="800" height="420" rx="20" fill="#f1f0e6"/><path d="M0 386C210 356 456 406 800 370" stroke="#d6dacb" stroke-width="2" fill="none"/><circle cx="755" cy="39" r="58" fill="#e3e9dc"/><text x="42" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#718274" text-anchor="start">FIELD NOTE / 17</text><text x="42" y="105" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#173b2f" text-anchor="start">A flexible weekly calendar</text><text x="42" y="132" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d705f" text-anchor="start">Anchor meals plus open space</text><path d="M99 228H705" stroke="#aebaa7" stroke-width="4" stroke-linecap="round"/><circle cx="99" cy="228" r="24" fill="#d3b75f" stroke="#fffdf5" stroke-width="5"/><text x="99" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#173b2f" text-anchor="middle">1</text><text x="99" y="181" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173b2f" text-anchor="middle">Mon-Tue</text><text x="99" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526558" text-anchor="middle">Use fresh food</text><circle cx="301" cy="228" r="24" fill="#8ca384" stroke="#fffdf5" stroke-width="5"/><text x="301" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#173b2f" text-anchor="middle">2</text><text x="301" y="292" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173b2f" text-anchor="middle">Wed-Thu</text><text x="301" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526558" text-anchor="middle">Shared ingredients</text><circle cx="503" cy="228" r="24" fill="#cb8b68" stroke="#fffdf5" stroke-width="5"/><text x="503" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#173b2f" text-anchor="middle">3</text><text x="503" y="181" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173b2f" text-anchor="middle">Fri-Sat</text><text x="503" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526558" text-anchor="middle">Quick backup</text><circle cx="705" cy="228" r="24" fill="#97a7a0" stroke="#fffdf5" stroke-width="5"/><text x="705" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#173b2f" text-anchor="middle">4</text><text x="705" y="292" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173b2f" text-anchor="middle">Sunday</text><text x="705" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526558" text-anchor="middle">Review and reset</text><text x="42" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#738173" text-anchor="start">HERBULANCE  /  LEARN  PREPARE  THRIVE</text><text x="754" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#738173" text-anchor="end">17 / 35</text></svg>