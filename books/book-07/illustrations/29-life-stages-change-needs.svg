<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Life stages change needs</title><desc id="desc">Life stages change needs. No one menu fits every person. Adolescence: Growth and enough food; Adulthood: Changing routines; Pregnancy: Individual care; Older age: Access and absorption.</desc><rect width="800" height="420" rx="20" fill="#f1f0e6"/><path d="M0 386C210 356 456 406 800 370" stroke="#d6dacb" stroke-width="2" fill="none"/><circle cx="755" cy="39" r="58" fill="#e3e9dc"/><text x="42" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#718274" text-anchor="start">FIELD NOTE / 29</text><text x="42" y="105" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#173b2f" text-anchor="start">Life stages change needs</text><text x="42" y="132" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d705f" text-anchor="start">No one menu fits every person</text><path d="M99 228H705" stroke="#aebaa7" stroke-width="4" stroke-linecap="round"/><circle cx="99" cy="228" r="24" fill="#d3b75f" stroke="#fffdf5" stroke-width="5"/><text x="99" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#173b2f" text-anchor="middle">1</text><text x="99" y="181" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173b2f" text-anchor="middle">Adolescence</text><text x="99" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526558" text-anchor="middle">Growth and enough food</text><circle cx="301" cy="228" r="24" fill="#8ca384" stroke="#fffdf5" stroke-width="5"/><text x="301" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#173b2f" text-anchor="middle">2</text><text x="301" y="292" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173b2f" text-anchor="middle">Adulthood</text><text x="301" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526558" text-anchor="middle">Changing routines</text><circle cx="503" cy="228" r="24" fill="#cb8b68" stroke="#fffdf5" stroke-width="5"/><text x="503" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#173b2f" text-anchor="middle">3</text><text x="503" y="181" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173b2f" text-anchor="middle">Pregnancy</text><text x="503" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526558" text-anchor="middle">Individual care</text><circle cx="705" cy="228" r="24" fill="#97a7a0" stroke="#fffdf5" stroke-width="5"/><text x="705" y="236" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#173b2f" text-anchor="middle">4</text><text x="705" y="292" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173b2f" text-anchor="middle">Older age</text><text x="705" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526558" text-anchor="middle">Access and absorption</text><text x="42" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#738173" text-anchor="start">HERBULANCE  /  LEARN  PREPARE  THRIVE</text><text x="754" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#738173" text-anchor="end">29 / 35</text></svg>