se safe water and cool the soup in shallow containers rather than a large hot pot.",nutrition:"Lentils provide carbohydrate, protein and fibre; greens and tomato add different micronutrients. Lemon adds flavour and vitamin C."},{name:"Chickpea, cucumber and flatbread lunch",context:"Mediterranean and West Asian-inspired assembly",purpose:"Assemble a portable meal with no cooking when using canned chickpeas.",ingredients:["1 can cooked chickpeas, drained (about 240 g)","1 cucumber","2 flatbreads (about 140 g)","2 tbsp plain yoghurt or suitable tahini sauce","1 tomato, lemon and herbs"],steps:["Rinse chickpeas if desired; chop cucumber and tomato.","Fill flatbreads with chickpeas, vegetables and sauce, or pack the components separately."],equipment:"Knife, bowl",time:"About 10 minutes; no cooking",variation:"Add chopped parsley or shredded cabbage.",substitute:"Use cooked white beans; for dairy-free choose a suitable non-dairy sauce.",storage:"Keep prepared perishable filling chilled; assemble close to eating for texture.",safety:"Pack with a cold source if refrigeration is unavailable; tahini contains sesame, an allergen.",nutrition:"Chickpeas add protein and fibre, bread supplies starch and vegetables provide variety."},{name:"Maize, bean and cabbage plate",context:"Inspired by maize-and-bean combinations across regions",purpose:"Show how an affordable staple can anchor a meal.",ingredients:["150 g dry maize meal or polenta","1 can cooked black or red beans, drained (about 240 g)","200 g cabbage","1 tomato","1 tsp oil","Water as directed on maize package"],steps:["Cook maize meal according to the packet with safe water.","Pan-cook shredded cabbage in oil, warm beans with chopped tomato until hot, and serve alongside the maize."],equipment:"Pot, pan, knife",time:"About 10 minutes prep + 20 minutes cooking",variation:"Add a little avocado or a local herb if available.",substitute:"Use another suitable cooked legume or a different leafy vegetable.",storage:"Serve freshly cooked maize; chill any bean mixture promptly and follow local guidance.",safety:"Use only properly cooked beans; never rely on undercooked dried kidney beans.",nutrition:"Maize provides energy, beans add protein and fibre, and cabbage adds produce."},{name:"Tofu and vegetable noodle pan",context:"East and Southeast Asian-inspired technique",purpose:"Use a single pan and quick-cooking vegetables.",ingredients:["180 g dry noodles","250 g firm tofu","250 g mixed vegetables","1 tsp oil","1 tbsp soy sauce or suitable seasoning","Ginger or garlic, optional"],steps:["Cook noodles according to the package. Cut tofu and vegetables into bite-size pieces.","Cook tofu and vegetables in a hot pan until thoroughly heated and vegetables are tender; toss with drained noodles and seasoning."],equipment:"Pot, pan or wok, knife",time:"About 12 minutes prep + 12 minutes cooking",variation:"Use frozen mixed vegetables, heated through thoroughly.",substitute:"Use an egg or cooked chicken if suitable; check cooking needs and allergens.",storage:"Chill promptly if keeping leftovers; reheat thoroughly only as appropriate.",safety:"Soy and wheat are common allergens; check noodle and sauce labels and prevent raw-meat cross-contamination if substituting.",nutrition:"Noodles are a starch; tofu adds protein; vegetables and a small amount of oil add variety and texture."},{name:"Tomato, sardine and greens pasta",context:"Practical coastal-inspired pantry meal",purpose:"Build dinner from pasta and shelf-stable foods.",ingredients:["180 g dry pasta","1 small tin sardines (about 100 g drained)","250 g canned tomatoes","150 g leafy greens","1 clove garlic and 1 tsp oil"],steps:["Cook pasta according to the packet. Warm garlic, tomatoes and greens in a pan until the greens soften.","Gently fold in sardines until hot and toss with drained pasta."],equipment:"Pot, pan, spoon",time:"About 8 minutes prep + 15 minutes cooking",variation:"Finish with lemon or local herbs.",substitute:"Use cooked white beans instead of fish; this changes the fat profile.",storage:"Refrigerate leftovers promptly and follow local guidance; fish changes storage risk.",safety:"Check for fish allergy and bones; keep opened fish chilled and avoid prolonged room-temperature holding.",nutrition:"Pasta is a starchy base; sardines contribute protein and fat; greens and tomatoes add produce."},{name:"Roasted vegetable and lentil grain bowl",context:"Flexible mixed-component bowl",purpose:"Combine independently prepared components.",ingredients:["300 g safely prepared cooked grain","240 g cooked lentils","300 g mixed vegetables","1 tbsp oil","2 tbsp lemon-herb dressing"],steps:["Roast vegetables until tender in an oven at about 200 C (390 F), or pan-cook until tender.","Warm grain and lentils thoroughly if previously chilled; combine with vegetables and dressing."],equipment:"Oven tray or pan, bowl",time:"About 10 minutes prep + 25 minutes cooking",variation:"Add toasted seeds if safe.",substitute:"Use rice, bulgur or another grain; use canned beans instead of lentils.",storage:"Store components separately in clean containers; follow food-specific local guidance, especially for cooked rice.",safety:"Do not repeatedly reheat the same large batch; check sesame or seed allergies in dressing.",nutrition:"Grain supplies carbohydrate, lentils add protein and fibre, and vegetables add range."},{name:"Potato, pea and egg pan",context:"Low-equipment everyday meal",purpose:"Make a filling meal with a single burner.",ingredients:["400 g potatoes","150 g frozen peas","2 eggs","1 onion","1 tsp oil","Herbs or pepper"],steps:["Cut potatoes into small pieces and boil or steam until tender; drain.","Cook onion in oil, add potatoes and peas, heat through, then crack eggs into the pan and cook until set."],equipment:"Pot and pan, or one deep pan with lid",time:"About 10 minutes prep + 25 minutes cooking",variation:"Add chopped greens at the end.",substitute:"Use canned beans instead of eggs if preferred; adjust heating.",storage:"Chill leftover cooked mixture promptly; eggs and potatoes are perishable once cooked.",safety:"Heat frozen peas through and cook eggs safely; keep leftovers cold.",nutrition:"Potatoes supply starch, peas contribute fibre and protein, and eggs add protein."},{name:"Peanut-free vegetable and chicken rice pot",context:"Family-style mixed-diet supper",purpose:"Cook a shared base with a clear protein and vegetables.",ingredients:["180 g dry rice","250 g boneless chicken","250 g mixed vegetables","1 onion","1 tsp oil","500 ml water or suitable stock"],steps:["Cut chicken on a separate board and wash hands and tools. Brown chicken, then add onion, rice, vegetables and liquid.","Cover and simmer according to rice directions until rice is cooked and chicken reaches a safe internal temperature using a thermometer."],equipment:"Deep pot with lid, thermometer, separate boards",time:"About 15 minutes prep + 25 minutes cooking, variable",variation:"Serve sauce or herbs at the table so each person can choose.",substitute:"Use cooked chickpeas instead of chicken and adjust liquid and cooking time.",storage:"Chill leftovers promptly in shallow containers; follow local rice guidance before any reheating.",safety:"Prevent raw-chicken cross-contamination, verify safe chicken temperature using local guidance, and handle rice leftovers carefully. [14][16]",nutrition:"Rice supplies starch, chicken protein and vegetables additional variety; no single pot suits every eater's needs."},{name:"Couscous, bean and pepper jar",context:"Portable low-equipment lunch",purpose:"Assemble a meal using a kettle or hot safe water.",ingredients:["120 g dry couscous","1 can cooked beans, drained (about 240 g)","1 bell pepper","1 small cucumber","1 tbsp oil and lemon"],steps:["Prepare couscous with safe hot water according to its packet; allow to cool promptly if packing.","Chop vegetables, mix with beans, couscous, oil and lemon; pack in a clean container."],equipment:"Kettle or pot, bowl, knife",time:"About 15 minutes prep + packet standing time",variation:"Add parsley or a suitable spice blend.",substitute:"Use another quick grain; for gluten-free use a suitable certified product instead of wheat couscous.",storage:"Keep the packed meal chilled until eating and follow local transport guidance.",safety:"Couscous contains wheat gluten; do not leave prepared grain at room temperature for prolonged periods.",nutrition:"Couscous adds starch, beans add protein and fibre, vegetables bring texture and variety."},{name:"Coconut-free chickpea and vegetable curry",context:"South Asian-inspired weeknight pot",purpose:"Use pantry chickpeas and vegetables in a flexible spiced sauce.",ingredients:["1 can cooked chickpeas, drained (about 240 g)","250 g chopped tomatoes","250 g vegetables such as cauliflower or greens","1 onion","1 tsp oil and a suitable curry spice blend","Freshly cooked rice or bread to serve"],steps:["Cook onion and spice in oil, then add tomatoes and vegetables; simmer until vegetables are tender.","Add chickpeas and heat thoroughly. Serve with freshly cooked rice or bread."],equipment:"Pot, spoon, knife",time:"About 12 minutes prep + 20 minutes cooking, plus rice",variation:"Add plain yoghurt at the table if suitable.",substitute:"Use lentils that have been properly cooked or another available vegetable.",storage:"Chill curry promptly; prepare or handle rice according to local rice-specific guidance.",safety:"Check spice blends and accompaniments for allergens; never use undercooked dried kidney beans as a shortcut.",nutrition:"Chickpeas add protein and fibre, vegetables add variety, and the staple supplies energy."},{name:"Vegetable, bean and tortilla fold",context:"Latin American-inspired quick assembly",purpose:"Turn a few components into a hand-held meal.",ingredients:["4 small tortillas (about 160 g)","1 can cooked beans, drained (about 240 g)","200 g cooked or raw suitable vegetables","1 tomato","2 tbsp yoghurt or avocado, optional"],steps:["Warm beans until hot and chop vegetables and tomato.","Warm tortillas according to package directions, fill and fold; add topping if desired."],equipment:"Pan or microwave, knife",time:"About 8 minutes prep + 7 minutes cooking",variation:"Use cabbage for crunch or add cooked egg.",substitute:"Use a different flatbread, checking gluten and other allergens where needed.",storage:"Store wet filling separately from tortillas; chill perishable components promptly.",safety:"Check tortillas and toppings for allergens; use properly stored cooked vegetables only.",nutrition:"Tortillas supply starch, beans add protein and fibre, and vegetables add colour and texture."},{name:"Frozen-vegetable tomato noodle soup",context:"Pantry and freezer meal",purpose:"Use long-keeping ingredients without relying on a large fresh shop.",ingredients:["120 g dry noodles","300 g frozen mixed vegetables","250 g canned tomato","700 ml safe water or suitable stock","1 can cooked white beans, drained (about 240 g)"],steps:["Bring water, tomato and vegetables to a simmer until vegetables are cooked through.","Add noodles and cook by package directions; stir in beans and heat thoroughly."],equipment:"One pot and spoon",time:"About 5 minutes prep + 15 minutes cooking",variation:"Add dried herbs or a squeeze of lemon.",substitute:"Use a different pasta or suitable grain; adjust liquid and timing.",storage:"Chill promptly; noodles may soften after storage, so cook them separately if making extra.",safety:"Cook frozen vegetables through and follow local guidance for cooling and storage.",nutrition:"Beans add protein and fibre, noodles supply starch and vegetables contribute variety."},{name:"Tuna, potato and green-bean plate",context:"Simple fish-based meal",purpose:"Build a plate with one pot and a canned protein.",ingredients:["400 g potatoes","200 g green beans, fresh or frozen","1 can tuna, drained (about 120 g)","1 tomato","1 tbsp olive or other oil and lemon"],steps:["Boil or steam potatoes until tender; add green beans and cook through.","Drain and serve warm with tuna, chopped tomato, oil and lemon."],equipment:"Pot, colander, knife",time:"About 10 minutes prep + 20 minutes cooking",variation:"Add a boiled egg if suitable.",substitute:"Use cooked chickpeas instead of tuna; check how the meal changes for your needs.",storage:"Keep tuna and cooked vegetables refrigerated if not eaten promptly.",safety:"Check fish allergy, keep opened tuna cold and follow local guidance about fish intake for pregnancy.",nutrition:"Potatoes provide starch, tuna protein, vegetables variety and oil dietary fat."},{name:"Hummus, carrot and egg sandwich",context:"Practical packed lunch",purpose:"Make a portable meal with flexible fillings.",ingredients:["4 slices bread (about 160 g)","4 tbsp hummus","2 fully cooked eggs","1 carrot","A handful of lettuce if available"],steps:["Cook eggs thoroughly and cool appropriately before packing; grate carrot.","Spread hummus on bread and layer egg, carrot and lettuce; pack promptly."],equipment:"Pot, knife, grater",time:"About 10 minutes prep + 10 minutes egg cooking",variation:"Serve ingredients separately as a picnic-style lunch.",substitute:"Use tofu or a different suitable spread instead of egg; check hummus for sesame.",storage:"Keep assembled perishable sandwiches cold and eat within appropriate local guidance.",safety:"Hummus often contains sesame, egg is an allergen, and packed perishable food needs cold transport.",nutrition:"Bread is a starchy base, egg and chickpeas supply protein, and carrot adds produce."},{name:"Savory oat and mushroom pot",context:"Grain-based quick meal",purpose:"Use oats beyond breakfast bowls.",ingredients:["100 g oats","200 g mushrooms","150 g greens","400 ml safe water or suitable stock","2 eggs or 150 g cooked beans","1 tsp oil"],steps:["Cook mushrooms in oil, add oats and liquid, and simmer by packet directions until tender.","Stir in greens until cooked and top with fully cooked eggs or heated beans."],equipment:"One deep pan, spoon",time:"About 10 minutes prep + 12 minutes cooking",variation:"Add ginger or a little grated cheese if suitable.",substitute:"Use another quick-cooking grain; adjust liquid and time.",storage:"Eat freshly prepared or chill promptly and reheat thoroughly according to local advice.",safety:"Cook eggs safely and avoid holding cooked oats warm for long periods.",nutrition:"Oats provide starch and fibre; eggs or beans add protein and greens contribute produce."},{name:"Pumpkin, lentil and bread supper",context:"Vegetable-centred one-pot meal",purpose:"Make vegetables the focus without forgetting a substantial accompaniment.",ingredients:["400 g pumpkin or squash","120 g dry red lentils","1 onion","600 ml safe water or suitable stock","2 slices bread per person, approximately","1 tsp oil"],steps:["Cook chopped onion and squash in oil, add rinsed lentils and liquid, and simmer until both are tender.","Mash lightly for a thicker stew and serve with bread."],equipment:"Pot, knife, spoon",time:"About 12 minutes prep + 25 minutes cooking",variation:"Add a green vegetable near the end.",substitute:"Use sweet potato or another suitable firm vegetable; adjust cooking time.",storage:"Divide leftovers into shallow containers and chill or freeze promptly.",safety:"Use safe water, cook lentils fully and reheat leftovers evenly.",nutrition:"Squash contributes produce, lentils protein and fibre, and bread adds an accessible staple."},{name:"Fresh component wrap with safe leftovers",context:"Flexible leftover meal",purpose:"Practise deciding whether leftovers can be used safely.",ingredients:["2 large wraps (about 140 g)","200 g safely chilled cooked vegetables","160 g suitable freshly cooked tofu or safely stored chicken","2 tbsp yoghurt-herb sauce or suitable alternative","A handful of fresh greens"],steps:["Confirm the leftovers were cooled and stored correctly; otherwise do not use them. Heat any previously cooked components thoroughly as locally advised.","Layer with fresh greens and sauce in wraps and serve immediately."],equipment:"Pan or microwave, knife, clean board",time:"About 10 minutes prep + 5 minutes heating, if needed",variation:"Serve as a bowl over a freshly cooked grain instead of a wrap.",substitute:"Use freshly opened canned beans when safe leftovers are unavailable.",storage:"Do not store an assembled wrap with warm fillings for later; keep components under appropriate conditions.",safety:"Do not repeatedly reheat a whole batch or use leftovers of uncertain history; check allergens in sauce and wrap.",nutrition:"The wrap supplies a staple, the protein option and vegetables make a useful combination; amounts are flexible."}],qh=[{title:"A budget-conscious mixed-diet week",description:"Illustrative plan for a small household with a hob and modest cold storage; not a nutrition prescription.",context:"Batch-cook only what can be chilled or frozen safely. Make rice fresh when practical; vary vegetables by local price.",days:[{breakfast:"Oats, banana and plain yoghurt",lunch:"Bean and tomato toast",dinner:"Lentil, spinach and lemon soup with bread",optional:"Seasonal fruit"},{breakfast:"Egg and tomato on bread",lunch:"Freshly made bean wrap with cabbage",dinner:"Potato, pea and egg pan",optional:"Yoghurt if wanted"},{breakfast:"Warm oats with fruit",lunch:"Soup from safely chilled portion or a fresh sandwich",dinner:"Fresh rice with vegetables and cooked chicken",optional:"Carrot and suitable dip"},{breakfast:"Toast and fruit",lunch:"Tuna, potato and green-bean plate",dinner:"Tomato and white-bean pasta with greens",optional:"A handful of nuts if safe"},{breakfast:"Yoghurt, oats and apple",lunch:"Egg and cabbage sandwich",dinner:"Maize, beans and greens",optional:"Fruit"},{breakfast:"Savory oat and mushroom pot",lunch:"Fresh tomato and bean toast",dinner:"Vegetable and egg noodle pan",optional:"Crackers and cheese or alternative"},{breakfast:"Choice of remaining breakfast ingredients",lunch:"Bread, hummus and cucumber",dinner:"Flexible soup from suitable fresh or frozen vegetables",optional:"As desired"}],core:"Oats, bread, rice or maize, pasta, dry or canned lentils and beans, eggs, one chicken meal, canned fish, yoghurt, frozen peas, cabbage, carrots, tomatoes, seasonal fruit.",substitutions:"Replace chicken with tofu or extra beans; use locally affordable greens; switch fish to a tolerated protein. Check changes in allergens and storage.",safety:"Chill perishables promptly; use leftovers only within local guidance. For cooked rice, follow local rice-specific advice; UK FSA guidance is particularly cautious. [14][16]"},{title:"A plant-forward week",description:"An example with legumes, tofu and varied produce; check B12 and other nutrients if fully vegan.",context:"Use fortified alternatives when suitable and check labels. This example is educational, not proof of vegan nutritional adequacy.",days:[{breakfast:"Oats with fruit and fortified soy yoghurt",lunch:"Chickpea, cucumber and flatbread",dinner:"Lentil and vegetable stew with bread",optional:"Fruit and seeds if safe"},{breakfast:"Bean and tomato toast",lunch:"Fresh couscous, bean and pepper jar",dinner:"Tofu and vegetable noodle pan",optional:"A suitable fortified drink"},{breakfast:"Oats and seasonal fruit",lunch:"Bread with hummus and carrot",dinner:"Maize, bean and cabbage plate",optional:"Fruit"},{breakfast:"Savory oats with mushrooms and beans",lunch:"Fresh tomato-lentil soup",dinner:"Chickpea and vegetable curry with freshly cooked rice",optional:"Nuts if safe"},{breakfast:"Fortified soy yoghurt, oats and fruit",lunch:"Vegetable and bean tortilla fold",dinner:"Pasta with tomato, beans and greens",optional:"Cucumber with suitable dip"},{breakfast:"Bread and peanut-free seed spread if safe",lunch:"Frozen-vegetable tomato noodle soup",dinner:"Roasted vegetable and lentil grain bowl",optional:"Fruit"},{breakfast:"Choice of oats or toast",lunch:"Chickpea and vegetable wrap",dinner:"Pumpkin, lentil and bread supper",optional:"As desired"}],core:"Oats, bread or flatbread, couscous or suitable grain, pasta, beans, lentils, chickpeas, tofu, fortified soy alternative, canned tomato, fresh and frozen vegetables, fruit, herbs and seasonings.",substitutions:"Use a local staple instead of couscous; switch tofu to a suitable legume; choose seasonal vegetables. For a fully vegan pattern, confirm reliable B12 and ask a qualified professional about individual needs. [5][22]",safety:"Chill cooked legumes and prepared meals promptly. Check soy, wheat, sesame and nut allergens in sauces and accompaniments. [14][18]"},{title:"A flexible family-style week",description:"One shared base with optional additions so the household can choose without several separate dinners.",context:"For a household of varied ages and appetites; quantities depend on actual eaters, needs and schedule.",days:[{breakfast:"Oat and fruit bowls with choice of dairy or suitable alternative",lunch:"Bread, eggs or beans, sliced vegetables",dinner:"Family rice pot with vegetables; chicken or chickpeas",optional:"Seasonal fruit"},{breakfast:"Toast, yoghurt and fruit",lunch:"Freshly assembled wraps with vegetable and bean fillings",dinner:"Lentil tomato soup with bread and toppings",optional:"Crackers and suitable dip"},{breakfast:"Egg or bean toast",lunch:"School or work meal; plan a portable backup",dinner:"Noodle pan with vegetables; tofu or egg",optional:"Fruit"},{breakfast:"Oats with fruit",lunch:"Chickpea, cucumber and flatbread",dinner:"Baked or boiled potatoes, greens, tuna or beans",optional:"Yoghurt or alternative"},{breakfast:"Toast with varied toppings",lunch:"Fresh sandwiches with carrot and fruit",dinner:"Pasta with tomato sauce, vegetables and optional fish or beans",optional:"Nuts or seeds where safe"},{breakfast:"Savory oats or fruit bowl",lunch:"Flexible lunch from safely stored components",dinner:"Bean and vegetable tortilla fold; toppings served separately",optional:"Fruit"},{breakfast:"Household choice",lunch:"Bread, soup or another suitable simple meal",dinner:"One-pot vegetable and lentil supper with bread",optional:"As desired"}],core:"Two staples, a variety of vegetables, beans and lentils, eggs, tofu, optional fish or chicken, fruit, yoghurt or alternative, sauces and seasonings; choose according to household restrictions.",substitutions:"Keep toppings separate for preferences and allergens. Change the shared base from rice to bread, potato or maize. Do not assume one family portion fits children and adults equally.",safety:"For allergies, prevent cross-contact rather than simply removing a topping. Refrigerate prepared components promptly and follow local leftover guidance. [14][18]"}],Fg="14 November 2026",rs=[{id:1,category:"Nutrition fundamentals",organisation:"FAO & WHO",title:"What are healthy diets? Joint statement",date:"24 October 2024",url:"https://www.who.int/publications/i/item/9789240101876",note:"Global principles: adequacy, diversity, balance and moderation; a population-level framework."},{id:2,category:"Nutrition fundamentals",organisation:"World Health Organization",title:"Healthy diet",date:"26 January 2026",url:"https://www.who.int/news-room/fact-sheets/detail/healthy-diet",note:"Global fact sheet; exact needs vary with age, context and health."},{id:3,category:"Food-based dietary guidance",organisation:"NHS (United Kingdom)",title:"The Eatwell Guide",date:"9 October 2025",url:"https://www.nhs.uk/live-well/eat-well/food-guidelines-and-food-labels/the-eatwell-guide/",note:"UK population food guide; balance can be considered across a day or week. Not an individual prescription."},{id:4,category:"Macronutrients",organisation:"World Health Organization",title:"WHO updates guidelines on fats and carbohydrates",date:"17 July 2023",url:"https://www.who.int/news/item/17-07-2023-who-updates-guidelines-on-fats-and-carbohydrates",note:"Summary of 2023 carbohydrate quality and fibre guidance; population-level advice."},{id:5,category:"Vitamins and minerals",organisation:"NIH Office of Dietary Supplements (United States)",title:"Vitamin B12: Consumer Fact Sheet",date:"Page reviewed 14 November 2026",url:"https://ods.od.nih.gov/factsheets/VitaminB12-Consumer/",note:"B12 sources, fortification and groups needing attention; US context."},{id:6,category:"Vitamins and minerals",organisation:"NIH Office of Dietary Supplements (United States)",title:"Iron: Consumer Fact Sheet",date:"Page reviewed 14 November 2026",url:"https://ods.od.nih.gov/factsheets/Iron-Consumer/",note:"Plant and animal iron sources and vitamin C interaction; US context."},{id:7,category:"Vitamins and minerals",organisation:"NIH Office of Dietary Supplements (United States)",title:"Vitamin D: Health Professional Fact Sheet",date:"Page reviewed 13 November 2026",url:"https://ods.od.nih.gov/factsheets/VitaminD-HealthProfessional/",note:"Food sources, fortification, sunlight and variation; US context."},{id:8,category:"Vitamins and minerals",organisation:"NIH Office of Dietary Supplements (United States)",title:"Iodine: Consumer Fact Sheet",date:"Page reviewed 14 November 2026",url:"https://ods.od.nih.gov/factsheets/Iodine-Consumer/",note:"Food sources and higher-risk patterns; iodine content varies substantially."},{id:9,category:"Vitamins and minerals",organisation:"NHS Lanarkshire (Scotland)",title:"Food sources of vitamins and minerals",date:"30 August 2023",url:"https://www.nhslanarkshire.scot.nhs.uk/patient-information-leaflets/nutrition-dietetics/pil-fodsrc-21-12986-l/",note:"Illustrative source atlas; food nutrient content varies by variety and preparation."},{id:10,category:"Dietary fibre and hydration",organisation:"European Food Safety Authority",title:"Dietary reference values for nutrients: Summary report",date:"4 December 2017",url:"https://www.efsa.europa.eu/sites/default/files/2017_09_DRVs_summary_report.pdf",note:"European reference values differ by nutrient and population group; not personal targets."},{id:11,category: gency (United Kingdom)",title:"Best before and use-by dates",date:"8 January 2018; living page",url:"https://www.food.gov.uk/safety-hygiene/best-before-and-use-by-dates",note:"UK date-label meanings; packaging and storage instructions still matter."},{id:18,category:"Special dietary considerations",organisation:"US Food and Drug Administration",title:"Food Allergies",date:"11 March 2026",url:"https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/food-allergies",note:"US allergen labelling and cross-contact; legal lists vary internationally."},{id:19,category:"Special dietary considerations",organisation:"US National Institute of Diabetes and Digestive and Kidney Diseases",title:"Eating, Diet, & Nutrition for Celiac Disease",date:"7 October 2025",url:"https://www.niddk.nih.gov/health-information/digestive-diseases/celiac-disease/eating-diet-nutrition",note:"Coeliac disease requires medical diagnosis and individual gluten-free management."},{id:20,category:"Special dietary considerations",organisation:"NHS (United Kingdom)",title:"Pregnancy vitamins and supplements",date:"11 June 2026",url:"https://www.nhs.uk/pregnancy/keeping-well/pregnancy-vitamins-and-supplements/",note:"UK pregnancy-specific advice; consult local pregnancy care and do not apply UK supplement advice globally."},{id:21,category:"Meal planning and preparation",organisation:"USDA MyPlate (United States)",title:"Registered Dietitian Nutritionists: MyPlate tools and healthy eating on a budget",date:"Page accessed 2026",url:"https://www.myplate.gov/professionals/toolkits/dietitians-and-nutritionists",note:"Describes shopping plans, budget-conscious preparation and adaptable food-group resources; US examples."},{id:22,category:"Special dietary considerations",organisation:"NHS (United Kingdom)",title:"Vegetarian and vegan diets during pregnancy",date:"14 November 2024",url:"https://www.nhs.uk/pregnancy/keeping-well/vegetarian-or-vegan-and-pregnant/",note:"Pregnancy and plant-based nutrient c `).map(r=>{const[f,g]=r.split("|");return{term:f,definition:g}}).sort((r,f)=>r.term.localeCompare(f.term)),Rh=[{question:"Do I need a seven-day plan to eat well?",answer:"No. A next-day plan, two repeated dinners or a short ingredient list may solve your actual problem better than a full calendar. The purpose is to reduce friction, not fill boxes.",sources:[1,21]},{question:"Does every meal have to look balanced?",answer:"No. A food pattern develops over days and weeks. A visual framework helps with ideas, but a single meal cannot describe an overall diet, and individual needs differ.",sources:[1,3]},{question:"Can white rice belong in a varied diet?",answer:"Yes. Rice is a staple in many food traditions. Combine it with accessible vegetables, legumes or another protein-containing food and consider the rest of the pattern. Higher-fibre options can be useful where practical.",sources:[2,4]},{question:"Are canned beans useful if I cannot cook dried beans?",answer:"Yes. Canned beans are a practical protein- and fibre-containing ingredient. Compare labels if sodium matters to you, rinse when appropriate, and store opened portions safely.",sources:[2,11,14]},{question:"Is frozen produce less nutritious than fresh produce?",answer:"Not necessarily. Nutrient content depends on variety, handling and preparation; frozen produce is a useful option and may reduce waste. Check added ingredients and prepare it safely.",sources:[2,13]},{question:"How do I start if I have no freezer?",answer:"Plan smaller quantities, choose some shelf-stable ingredients, cook amounts you can eat promptly and shop more frequently only if feasible. Do not use a no-freezer plan that depends on storing cooked food at room temperature.",sources:[14,15]},{question:"What if I have only one cooking burner?",answer:"Choose one-pot lentils, noodles, a potato and egg pan, or assembled meals using suitable ready-to-eat foods. Make equipment and safe storage your starting point, not an afterthought.",sources:[14]},{question:"Is meal prep the same as batch cooking?",answer:"Not exactly. Meal prep can be washing produce, making one sauce or writing a list. Batch cooking specifically means preparing extra portions. Neither requires preparing every meal in advance.",sources:[14,21]},{question:"How long can I keep leftovers?",answer:"It depends on the food, how it was handled, the storage temperature and the local authority's guidance. US FoodSafety.gov lists three to four days for many cooked meat or poultry leftovers at 4 C (40 F) or below; cooked rice has stricter UK-specific advice. Never treat a general chart as a guarantee. [15][16]",sources:[14,15,16]},{question:"Can I tell whether leftovers are safe by smelling them?",answer:"No. Harmful microorganisms may not change smell or appearance. Do not taste questionable perishable food. Use handling history, time, temperature and local guidance.",sources:[14,17]},{question:"Should I reheat the entire batch every time?",answer:"No. Portion before storage so you heat only what you need, and follow local guidance for the food. Repeated warming and cooling adds risk; rice deserves particular care.",sources:[14,16]},{question:"Does freezing make food safe forever?",answer:"No. Freezing does not reverse unsafe preparation or remove every hazard, and quality declines over time. Follow food-specific storage, thawing and reheating guidance.",sources:[14,15]},{question:"What is the difference between serving and portion?",answer:"A labelled serving is a reference amount used for nutrition information. A portion is what a person chooses to eat; the labelled amount is not a personal recommendation.",sources:[11]},{question:"Must I count calories to plan meals?",answer:"No. This book does not require calorie tracking. Planning around available foods, varied components, satisfaction, schedule and safety is useful without a universal calorie target.",sources:[1,3]},{question:"Do plant proteins have to be combined in one meal?",answer:"No precise pairing is needed at each meal in a varied eating pattern with enough food. Different plant foods can contribute amino acids across the day. Specific clinical needs may require individual advice.",sources:[2,3]},{question:"How can I plan a vegan week responsibly?",answer:"Include varied staples, legumes, produce and suitable fats; check reliable B12 sources in fortified foods or seek professional supplement advice. Other nutrients may also need attention according to the pattern and person.",sources:[5,6,8,22]},{question:"Is a gluten-free label a sign of a healthier product?",answer:"No. It identifies a restriction-related property, not overall nutritional quality. Coeliac disease requires strict management, while others need not assume gluten avoidance is beneficial.",sources:[19]},{question:"How should I compare two breads?",answer:"Compare the same amount, then look at the factor relevant to you, such as fibre, sodium, ingredients or allergens. Also consider cost, taste and how the bread fits your meals.",sources:[11]},{question:"Can I trust a 'natural' front-of-pack claim?",answer:"It is not a complete nutrition or safety assessment. Read the full ingredients, nutrition panel and allergens, and check the claim under your local labelling rules.",sources:[11,18]},{question:"What if groceries cost more than planned?",answer:"Change the plan: compare unit prices and useful pack sizes, try locally available seasonal or frozen options, or choose another suitable protein-containing food. Food insecurity is not a personal failure.",sources:[1,21]},{question:"Is it always cheaper to buy in bulk?",answer:"No. Bulk can waste money if you cannot use or store it safely. Consider transport, fuel, storage and the amount your household will actually eat.",sources:[21,14]},{question:"How do I plan for picky or different preferences at one table?",answer:"Try a shared base with separate suitable toppings or side components. Ask household members what they will eat and share the work; allergies need stricter separation than ordinary preferences.",sources:[1,18]},{question:"What if my work hours change unexpectedly?",answer:"Keep a shelf-stable backup, move a safely stored perishable meal earlier and use a flexible component rather than trying to keep the original plan. Re-plan without treating the change as failure.",sources:[14,21]},{question:"Does everyone need the same amount of water?",answer:"No. Heat, activity, illness, age and medications all matter; some people need medical fluid limits. Keep suitable fluids accessible and seek individual advice if needed.",sources:[10,30]},{question:"Can I use spices to make low-cost meals interesting?",answer:"Yes. Familiar dried or fresh seasonings can change flavour without requiring a new set of main ingredients. Check blends for allergens and salt if relevant.",sources:[11,18]},{question:"Is raw food always more nutritious than cooked food?",answer:"No. Preparation can change nutrients, texture and safety in different directions. Use a variety of safe methods that make foods enjoyable and accessible.",sources:[14,28]},{question:"Are there special precautions for cooked rice?",answer:"Yes. The UK FSA advises cooling cooked rice quickly, ideally within an hour, refrigerating no more than one day before reheating, and reheating only once. Follow local guidance for your setting. [16]",sources:[16]},{question:"Do adolescents need a diet plan?",answer:"Adolescents need adequate food for growth and should not be pushed toward restrictive plans or body targets. A qualified professional can help when there is a specific concern.",sources:[1,2]},{question:"When should I ask a dietitian?",answer:"Seek qualified local advice for medical conditions, pregnancy, suspected deficiencies, strict allergies, eating disorders or complex restrictions. This book is general education, not an individual care plan.",sources:[5,18,19,20]},{question:"Where are my planner and notes saved?",answer:"Only in this browser's local storage when available. They are not transmitted by this app. People who share the browser profile may see them; use Settings to clear all saved book data.",sources:[]}],Bh=[{type:"Multiple choice",question:"Which statement best describes a balanced eating pattern?",choices:["Every single meal contains all nutrients","Adequacy and variety are considered over time","One food must be eaten daily"],correct:1,explanation:"Balance is about the pattern over time; one meal is not the whole picture. [1][3]",chapter:1},{type:"Multiple choice",question:"Which food can contribute both carbohydrate and protein?",choices:["Cooked lentils","Plain cooking oil","Water"],correct:0,explanation:"Legumes such as lentils contain carbohydrate, protein and fibre. [2]",chapter:2},{type:"Multiple choice",question:"For a varied plant-based pattern, must two plant proteins be paired in every meal?",choices:["Yes, exactly","No, variety across the pattern matters","Only at breakfast"],correct:1,explanation:"Specific pairings in each meal are unnecessary in a varied adequate pattern; B12 still needs attention for vegan eating. [5]",chapter:3},{type:"Multiple choice",question:"Which item is a useful source of unsaturated fat?",choices:["Olive oil","Water","Plain sugar"],correct:0,explanation:"Many plant oils provide unsaturated fats; the overall pattern still matters. [2][24]",chapter:4},{type:"True or false",question:"A food label serving size is a recommended amount that everyone should eat.",choices:["True","False"],correct:1,explanation:"A serving size is a label reference amount, not a personal portion instruction. [11]",chapter:7},{type:"Scenario",question:"A family has little fridge space. Which plan is most realistic?",choices:["Cook seven large batches and leave them on the counter","Choose smaller quantities and shelf-stable backup foods","Ignore storage until after shopping"],correct:1,explanation:"Storage capacity should shape purchasing and batch size. Perishables need safe cold handling. [14]",chapter:14},{type:"Scenario",question:"Two recipes need onions and you already have one at home. What should the shopping list do?",choices:["Add onions twice","Consolidate needs, then subtract existing supply","Buy none without checking the recipes"],correct:1,explanation:"Extract, combine duplicates and inventory before buying. [21]",chapter:19},{type:"Multiple choice",question:"A package's front says 'natural'. What is the best next step?",choices:["Assume it meets all needs","Read the full label for the factors that matter","Ignore all labels"],correct:1,explanation:"A claim is not a full assessment of ingredients, nutrients, allergens or fit. [11]",chapter:7},{type:"True or false",question:"Frozen food can remain good-quality forever if handled poorly before freezing.",choices:["True","False"],correct:1,explanation:"Freezing cannot undo unsafe preparation and quality changes over time. [14][15]",chapter:22},{type:"Scenario",question:"Cooked rice was left on the counter overnight. What is the safer choice?",choices:["Taste it first","Reheat it repeatedly","Discard it; do not taste-test"],correct:2,explanation:"Time and temperature history matter; reheating cannot reliably rescue unsafe handling. [14][16]",chapter:23},{type:"Multiple choice",question:"What does a food allergy require beyond merely removing a visible ingredient?",choices:["Only a nicer plate","Attention to cross-contact","A different meal time"],correct:1,explanation:"Allergen residues can transfer through shared preparation; medical advice and labels matter. [18]",chapter:30},{type:"True or false",question:"A vegan pattern can rely on unfortified plant foods for vitamin B12.",choices:["True","False"],correct:1,explanation:"B12 is not naturally present in unfortified plant foods; a reliable source needs planning. [5]",chapter:11},{type:"Scenario",question:"The market has no planned green vegetable. What is a flexible response?",choices:["Cancel all meals","Use a suitable available vegetable and adapt the method","Buy a spoiled replacement"],correct:1,explanation:"Swap by role and check new cooking and storage needs. [1]",chapter:18},{type:"Multiple choice",question:"Which is the best question when a large pack has a lower unit price?",choices:["Can I use and store it safely?","Is it the largest pack?","Does it look premium?"],correct:0,explanation:"Value includes actual use, waste, space, fuel and transport. [21]",chapter:16},{type:"True or false",question:"A missed planned meal means the whole week has failed.",choices:["True","False"],correct:1,explanation:"A plan is a tool to revise; flexible replacement is part of good planning.",chapter:27},{type:"Scenario",question:"You are packing a perishable lunch without refrigeration at the destination. What matters most?",choices:["Attractive packaging","Appropriate cold holding and local time guidance","Adding more seasoning"],correct:1,explanation:"Perishable food must be transported and held safely. [14][27]",chapter:28},{type:"Multiple choice",question:"Which statement about hydration is most accurate?",choices:["Exactly one volume fits everyone","Needs vary with climate, activity and health","Food contains no water"],correct:1,explanation:"Water from drinks and foods contributes, and needs vary. [30]",chapter:6},{type:"True or false",question:"One observational association always proves that a food caused an outcome.",choices:["True","False"],correct:1,explanation:"Associations alone cannot establish causation; evaluate the broader evidence.",chapter:33},{type:"Scenario",question:"A recipe includes an allergen for a guest. What is the right action?",choices:["Remove the visible topping after it touched the meal","Ask about the allergy and prepare a safely separate suitable option","Assume a small amount is harmless"],correct:1,explanation:"Allergen cross-contact can matter; ask the person and follow medical guidance. [18]",chapter:30},{type:"Multiple choice",question:"What is an appropriate first step in weekly planning?",choices:["Purchase every recipe ingredient","Check supplies and the coming schedule","Cook all food at once"],correct:1,explanation:"Inventory and schedule precede shopping and preparation. [21]",chapter:15}],Pf=["Check the coming week's actual schedule and number of meals needed.","Look at pantry, refrigerator and any freezer before choosing meals.","Ask household members about preferences, access and shared responsibilities.","Choose familiar flexible meals and allow one open slot.","Use a few ingredients in more than one different meal.","Plan a safe, shelf-stable or easy backup for disrupted days.","Estimate amounts for actual eaters and storage space, not a universal portion chart.","Consolidate shopping items and subtract what is already available.","Compare useful pack sizes, unit prices, labels and allergens where relevant.","Choose only preparation tasks that will reduce real effort.","Clean, separate, cook and chill according to local food-safety guidance.","Label suitable leftovers and decide how they will be used safely.","Check transport plans for perishable packed meals.","Review what worked, what was wasted and what to change without judgement."],Zg=[{title:"Macronutrients",rows:[["Carbohydrate","Starches, sugars and fibre; grain foods, fruit, vegetables and legumes"],["Protein","Amino acids; legumes, soy, eggs, dairy, fish, poultry, meat and nuts"],["Fat","Essential fatty acids and fat-soluble vitamin absorption; oils, nuts, seeds, avocado, fish"]],note:"Foods often contain more than one macronutrient. [2]"},{title:"Micronutrients",rows:[["A, C and K","Different fruits and vegetables contribute different vitamins"],["B12 and D","Animal foods or fortified foods contribute B12; D sources are fewer and context varies"],["Iron, calcium, iodine","Sources and absorption vary by food, life stage and country"]],note:"Not a nutrient-intake table; seek individual advice where needed. [5][6][7][8][9]"},{title:"Fibre sources",rows:[["Legumes","Lentils, chickpeas, beans, peas"],["Grains","Oats, whole-grain bread, millet, brown rice"],["Produce","Vegetables and whole fruit"],["Other","Nuts and seeds where safe"]],note:"Add gradually if changing intake; clinical needs may differ. [4]"},{title:"Food groups in real meals",rows:[["Staple","Rice, maize, bread, potatoes, noodles, oats"],["Produce","Fresh, frozen or suitable canned vegetables and fruit"],["Protein-containing","Beans, lentils, tofu, eggs, fish, dairy, meat"],["Flavour and fat","Oils, seeds, herbs, spices, sauces"]],note:"Categories overlap and this is not a compulsory plate rule. [1][3]"},{title:"Build a meal",rows:[["1","Choose a substantial staple or base"],["2","Add available produce"],["3","Include a suitable protein-containing food"],["4","Consider flavour, fat, fluid and satisfaction"]],note:"Balance can occur across meals rather than in each one. [3]"},{title:"Shopping checklist",rows:[["Before","Inventory and schedule"],["On the list","Combine repeats and note substitutions"],["At the shop","Compare equivalent amounts and check labels"],["On return","Put perishables away promptly"]],note:"Price and access differ by location. [11][14][21]"},{title:"Planning workflow",rows:[["Look","Inventory, people and schedule"],["Choose","Meals, shared ingredients and backups"],["Buy","Only missing ingredients in usable quantities"],["Adapt","Leave space for changes"]],note:"The smallest useful plan is enough."},{title:"Preparation workflow",rows:[["Clean","Hands, water and work surfaces"],["Separate","Raw animal foods and ready-to-eat foods"],["Cook","Use appropriate food-specific safe methods"],["Chill","Cool and refrigerate perishables promptly"]],note:"Check local authority guidance for exact foods and temperatures. [14]"},{title:"Dietary patterns",rows:[["Vegetarian","No meat or fish; some include eggs and dairy"],["Vegan","No animal foods; reliable B12 source essential"],["Pescatarian","Fish but no other meat"],["Omnivorous","Plant and animal foods"],["Gluten-free for coeliac","Strict gluten avoidance and cross-contact management"]],note:"None guarantees adequacy; restrictions and needs differ. [5][19]"},{title:"Label glossary",rows:[["Serving size","Reference amount, not a mandated portion"],["Per 100 g","Common basis for comparing products in many countries"],["Ingredient list","What is in the product, often by descending weight"],["Allergen statement","Regulated allergen information; local laws vary"]],note:"Front-of-pack claims are not a complete assessment. [11][18]"},{title:"Substitution guide",rows:[["Staple","Rice / bread / maize / potato, adjusting cooking"],["Protein-containing","Beans / tofu / egg / fish, adjusting allergens and needs"],["Produce","Seasonal local greens / cabbage / frozen vegetables"],["Flavour","Lemon / vinegar / herbs / suitable spice blend"]],note:"A replacement is not nutritionally identical; check safety and labels."},{title:"Waste reduction",rows:[["Buy","Choose quantities your household can use"],["Store","Follow packaging, local guidance and temperature needs"],["Rotate","See older suitable foods first"],["Reuse","Plan safe use for leftovers; do not rescue unsafe food"]],note:"Food safety takes priority over avoiding waste. [14][17]"}],Wg=JSON.parse(`[{"id":1,"title":"Balanced meal framework","subtitle":"Many foods, one flexible pattern","path":"/illustrations/01-balanced-meal-framework.svg","alt":"Balanced meal framework. Many foods, one flexible pattern. Staple: Rice, bread, maize; Produce: Fruit and vegetables; Protein: Beans, eggs, tofu, fish; Flavour: Fats, herbs, fluids.","labels":[["Staple","Rice, bread, maize"],["Produce","Fruit and vegetables"],["Protein","Beans, eggs, tofu, fish"],["Flavour","Fats, herbs, fluids"]]},{"id":2,"title":"Macronutrients in context","subtitle":"Food groups overlap","path":"/illustrations/02-macronutrients-in-context.svg","alt":"Macronutrients in context. Food groups overlap. Carbohydrate: Energy and fibre; Protein: Amino acids; Fat: Essential fatty acids; Overlap: Beans, milk, nuts.","labels":[["Carbohydrate","Energy and fibre"],["Protein","Amino acids"],["Fat","Essential fatty acids"],["Overlap","Beans, milk, nuts"]]},{"id":3,"title":"Where carbohydrates live","subtitle":"A source map, not a ranking","path":"/illustrations/03-where-carbohydrates-live.svg","alt":"Where carbohydrates live. A source map, not a ranking. Grains: Rice, oats, wheat, maize; Starchy foods: Potato, cassava; Fruit: Whole fruit and berries; Legumes: Beans and lentils.","labels":[["Grains","Rice, oats, wheat, maize"],["Starchy foods","Potato, cassava"],["Fruit","Whole fruit and berries"],["Legumes","Beans and lentils"]]},{"id":4,"title":"Sources of protein","subtitle":"Different foods, different extras","path":"/illustrations/04-sources-of-protein.svg","alt":"Sources of protein. Different foods, different extras. Legumes: Protein and fibre; Soy foods: Tofu and tempeh; Animal foods: Eggs, fish, meat, dairy; Nuts & seeds: Protein and fats.","labels":[["Legumes","Protein and fibre"],["Soy foods","Tofu and tempeh"],["Animal foods","Eggs, fish, meat, dairy"],["Nuts & seeds","Protein and fats"]]},{"id":5,"title":"Dietary fat types","subtitle":"Quality matters in the pattern","path":"/illustrations/05-dietary-fat-types.svg","alt":"Dietary fat types. Quality matters in the pattern. Mono-unsat.: Olive oil, avocado; Poly-unsat.: Seeds, fish, oils; Saturated: Butter, ghee, coconut; Trans: Check local labels.","labels":[["Mono-unsat.","Olive oil, avocado"],["Poly-unsat.","Seeds, fish, oils"],["Saturated","Butter, ghee, coconut"],["Trans","Check local labels"]]},{"id":6,"title":"Micronutrient atlas","subtitle":"No food supplies everything","path":"/illustrations/06-micronutrient-atlas.svg","alt":"Micronutrient atlas. No food supplies everything. Colourful plants: A, C, folate, potassium; Legumes & grains: Iron, B vitamins, magnesium; Animal foods: B12, iron, iodine; Fortified foods: Check the actual label.","labels":[["Colourful plants","A, C, folate, potassium"],["Legumes & grains","Iron, B vitamins, magnesium"],["Animal foods","B12, iron, iodine"],["Fortified foods","Check the actual label"]]},{"id":7,"title":"Fibre comes with food","subtitle":"Small additions across a day","path":"/illustrations/07-fibre-comes-with-food.svg","alt":"Fibre comes with food. Small additions across a day. Oats: Breakfast base; Beans: Add to lunch; Vegetables: Add to dinner; Fruit: An easy extra.","labels":[["Oats","Breakfast base"],["Beans","Add to lunch"],["Vegetables","Add to dinner"],["Fruit","An easy extra"]]},{"id":8,"title":"Hydration is contextual","subtitle":"Environment changes fluid needs","path":"/illustrations/08-hydration-is-contextual.svg","alt":"Hydration is contextual. Environment changes fluid needs. Drinks: Water, tea, milk; Foods: Soup, fruit, vegetables; Conditions: Heat, activity, illness; Individual: Medical advice may differ.","labels":[["Drinks","Water, tea, milk"],["Foods","Soup, fruit, vegetables"],["Conditions","Heat, activity, illness"],["Individual","Medical advice may differ"]]},{"id":9,"title":"Read the whole label","subtitle":"Start with the comparison basis","path":"/illustrations/09-read-the-whole-label.svg","alt":"Read the whole label. Start with the comparison basis. 1  Amount: Serving or per 100 g; 2  Nutrients: Compare what matters; 3  Ingredients: Check the full list; 4  Allergens: Check every time.","labels":[["1  Amount","Serving or per 100 g"],["2  Nutrients","Compare what matters"],["3  Ingredients","Check the full list"],["4  Allergens","Check every time"]]},{"id":10,"title":"Balanced meals, many tables","subtitle":"Different traditions, shared reasoning","path":"/illustrations/10-balanced-meals-many-tables.svg","alt":"Balanced meals, many tables. Different traditions, shared reasoning. Rice & dal: With greens; Maize & beans: With vegetables; Bread & hummus: With tomato; Fish & potato: With cabbage.","labels":[["Rice & dal","With greens"],["Maize & beans","With vegetables"],["Bread & hummus","With tomato"],["Fish & potato","With cabbage"]]},{"id":11,"title":"The meal component method","subtitle":"Start anywhere; add what is useful","path":"/illustrations/11-the-meal-component-method.svg","alt":"The meal component method. Start anywhere; add what is useful. Base: A substantial staple; Add: Produce available; Include: Protein-containing food; Finish: Flavour and a drink.","labels":[["Base","A substantial staple"],["Add","Produce available"],["Include","Protein-containing food"],["Finish","Flavour and a drink"]]},{"id":12,"title":"Serving is not portion","subtitle":"Labels describe; people decide","path":"/illustrations/12-serving-is-not-portion.svg","alt":"Serving is not portion. Labels describe; people decide. Serving size: A label reference; Portion: What you choose; Appetite: Not always predictable; Pattern: Matters over time.","labels":[["Serving size","A label reference"],["Portion","What you choose"],["Appetite","Not always predictable"],["Pattern","Matters over time"]]},{"id":13,"title":"Different dietary patterns","subtitle":"Adequacy is not a label","path":"/illustrations/13-different-dietary-patterns.svg","alt":"Different dietary patterns. Adequacy is not a label. Vegetarian: May include egg or dairy; Vegan: Plan a B12 source; Pescatarian: Includes fish; Omnivorous: Plant and animal foods.","labels":[["Vegetarian","May include egg or dairy"],["Vegan","Plan a B12 source"],["Pescatarian","Includes fish"],["Omnivorous","Plant and animal foods"]]},{"id":14,"title":"Cooking changes food","subtitle":"Safety, nutrients and enjoyment","path":"/illustrations/14-cooking-changes-food.svg","alt":"Cooking changes food. Safety, nutrients and enjoyment. Prepare: Wash and cut; Heat: Boil, steam, saute; Consider: Water and cooking time; Serve: Safe and enjoyable.","labels":[["Prepare","Wash and cut"],["Heat","Boil, steam, saute"],["Consider","Water and cooking time"],["Serve","Safe and enjoyable"]]},{"id":15,"title":"The planning loop","subtitle":"A plan is allowed to change","path":"/illustrations/15-the-planning-loop.svg","alt":"The planning loop. A plan is allowed to change. Check: Food and schedule; Choose: Meals and backups; Buy: Only what is needed; Adapt: Revise with life.","labels":[["Check","Food and schedule"],["Choose","Meals and backups"],["Buy","Only what is needed"],["Adapt","Revise with life"]]},{"id":16,"title":"Plan for your household","subtitle":"Real circumstances are the starting point","path":"/illustrations/16-plan-for-your-household.svg","alt":"Plan for your household. Real circumstances are the starting point. People: Who eats when?; Time: Which days are busy?; Kitchen: What can be stored?; Access: What is affordable here?.","labels":[["People","Who eats when?"],["Time","Which days are busy?"],["Kitchen","What can be stored?"],["Access","What is affordable here?"]]},{"id":17,"title":"A flexible weekly calendar","subtitle":"Anchor meals plus open space","path":"/illustrations/17-a-flexible-weekly-calendar.svg","alt":"A flexible weekly calendar. Anchor meals plus open space. Mon-Tue: Use fresh food; Wed-Thu: Shared ingredients; Fri-Sat: Quick backup; Sunday: Review and reset.","labels":[["Mon-Tue","Use fresh food"],["Wed-Thu","Shared ingredients"],["Fri-Sat","Quick backup"],["Sunday","Review and reset"]]},{"id":18,"title":"From plan to shopping list","subtitle":"Extract, combine, subtract","path":"/illustrations/18-from-plan-to-shopping-list.svg","alt":"From plan to shopping list. Extract, combine, subtract. Meals: List ingredients; Combine: Merge repeats; Inventory: Remove what you have; Shop: Group by section.","labels":[["Meals","List ingredients"],["Combine","Merge repeats"],["Inventory","Remove what you have"],["Shop","Group by section"]]},{"id":19,"title":"Budget decisions","subtitle":"Value is more than a unit price","path":"/illustrations/19-budget-decisions.svg","alt":"Budget decisions. Value is more than a unit price. Price: Compare units; Amount: Buy what
