 and least-understood surface of food: the package."},{t:"p",x:"The book is written for readers aged 14 and over in many countries. Whether you shop in a large supermarket, a neighbourhood market, a specialist food store or online, the same core skills apply: identifying what a product is, reading its information accurately, comparing it fairly and recognising when a label cannot answer your question."},{t:"callout",kind:"CHECK THE EVIDENCE",x:"This book is not a diet plan, a supplement guide, a fear-based warning about packaged food, or a promotion for any brand. Its purpose is consumer literacy: understanding information that already appears on food packaging, so that you can decide for yourself with more confidence."}]},{id:"welcome-method",title:"How this edition was prepared",blocks:[{t:"p",x:"The text draws on official food-labelling guidance and legislation from several jurisdictions, international Codex Alimentarius texts, and public-health and consumer-protection sources. Every regulatory statement is tied to a jurisdiction. Where rules differ between countries, the book says so rather than presenting one country's system as universal."},{t:"p",x:"Food law changes. Several front-of-pack and date-labelling systems were under review while this edition was prepared. Treat the Regulatory Reference Register in the References section as a dated starting point, and check the official authority for any decision that matters to you. Fictional product examples are invented educational simulations and are labelled as such throughout."}]}],takeaways:["This is a consumer-education book, not a diet prescription or legal manual.","Rules differ by country; always identify the jurisdiction before applying a rule."]},{id:"edition",group:"front",title:"Title, Edition, Copyright and Disclaimer",objectives:["Find the edition, publisher and series information.","Understand the educational disclaimer and how the digital tools store data."],sections:[{id:"title-page",title:"Title page and publication details",blocks:[{t:"table",caption:"Publication details",head:["Item","Detail"],rows:[["Series","HERBULANCE Educational Collection"],["Book number","04"],["Title","The Smart Food Shopping & Label Reading Guide"],["Subtitle","Understand Food Labels, Ingredients, Nutrition Claims, Packaging and Make Informed Choices Anywhere in the World."],["Edition","First Edition — November 2026"],["Publisher","HERBULANCE"],["Brand phrases","NATURAL LIVING • FOOD EDUCATION • EVERYDAY WELLNESS · Learn • Prepare • Thrive"]]}]},{id:"copyright",title:"Copyright statement",blocks:[{t:"p",x:"Copyright © 2026 HERBULANCE. All text, diagrams, package illustrations, interactive tools and data sets in this digital edition are original to HERBULANCE or are described as public-source references. Short passages may be quoted for educational purposes with attribution. Reproduction for commercial use requires written permission from the publisher."},{t:"p",x:"Official laws, standards and guidance are owned by their issuing governments and organisations. This book describes them in summary form and links to the originals; it does not reproduce them."}]},{id:"disclaimer",title:"Educational disclaimer",blocks:[{t:"callout",kind:"SAFETY FIRST",x:"This book and its tools provide general educational information. They are not medical, dietary, allergy, legal or food-safety advice for any individual. A label cannot tell you whether a food is suitable for a particular person. For allergies, coeliac disease, pregnancy, kidney disease, diabetes, or any other medical condition, speak to a qualified health professional and, where needed, contact the manufacturer directly."},{t:"p",x:"Nutrition calculators in this book show arithmetic on the values you type in. They do not assess your needs, and they are not designed to set calorie or nutrient targets."}]},{id:"data-privacy",title:"How the digital tools handle your data",blocks:[{t:"p",x:"The application does not require an account and sends nothing to a server. Reading progress, the grocery checklist and 14-day challenge completion ticks may be saved in your browser's local storage so they survive a page refresh. Allergy selections, health-related choices and personal reflections are kept only for the current session and are never written to storage. The Reset button in the footer clears everything the book has saved."}]}],takeaways:["The book is educational and cannot replace advice from health professionals or official authorities.","Sensitive selections stay in your session only."]},{id:"why-labels",group:"front",title:"Why Understanding Food Labels Matters",objectives:["Explain why packaging information is valuable to everyday shoppers.","Recognise the limits of what a label can tell you."],sections:[{id:"labels-and-trust",title:"The package is a conversation",blocks:[{t:"p",x:"A packaged food carries a set of messages from the company that made it, the country that regulates it, and the certification bodies that may have checked it. Some messages are required by law. Others are voluntary. A few are designed mainly to attract attention. Learning to tell these apart is the core skill of label reading."},{t:"p",x:"Label information matters most in situations where you cannot see or smell the food: buying in advance, shopping online, buying for other people, and choosing among many similar products on a shelf."}]},{id:"who-benefits",title:"Who benefits from label literacy",blocks:[{t:"ul",items:["**Students and first-time shoppers**, who are learning to make independent decisions about food and money.","**Parents and carers**, who need to check ingredients, allergens and portion sizes for family members.","**People with food allergies, coeliac disease or other medical needs**, who depend on accurate allergen and ingredient information.","**Home cooks and budget-conscious shoppers**, who want to compare value rather than just the shelf price.","**People who follow religious, ethical or cultural food practices**, who need to understand what different symbols and certifications mean."]}]},{id:"label-limits",title:"What a label cannot tell you",blocks:[{t:"p",x:"A label does not tell you how a food tastes, how it was grown in detail, how it will affect your overall diet, or whether it is right for your body. It cannot show what happened during transport, whether storage was interrupted at home, or whether a product has been recalled since it was printed. Good label reading means knowing where the label stops and where other sources of information start."},{t:"callout",kind:"CONSUMER MISTAKE",x:"Treating one label as the complete answer. A product can be accurately labelled and still be unsuitable for a specific purpose, budget or dietary need. Read the label, then check the context."}]}],takeaways:["Labels are a source of verifiable information, alongside marketing and certification.","Context and personal needs decide what a label means for you."]},{id:"how-to-use",group:"front",title:"How to Use This Book",objectives:["Choose a reading path that suits your goals.","Find the interactive tools and understand how they work."],sections:[{id:"reading-paths",title:"Reading paths",blocks:[{t:"ul",items:["**Complete beginner:** Read the Opening Pages, then Part I (Chapters 1–4), then the Introduction to Part VI.","**Nutrition-focused reader:** Parts I and II, then the Nutrition Panel Reader and Serving Size Calculator.","**Claims and marketing:** Part III, then the Claims Decoder and the Front-of-Pack Systems chapter.","**Safety-focused reader:** Chapters 18–22, then the Allergen Awareness Explorer and the Date Label Explorer.","**Busy shopper:** Chapter 30 (the framework and checklist), then the Grocery Checklist Builder."]}]},{id:"tools-overview",title:"Interactive tools",blocks:[{t:"table",caption:"The twelve interactive tools",head:["Tool","What it does"],rows:[["A. Label Anatomy Explorer","Click regions of an illustrative fictional package to learn what each area means."],["B. Nutrition Panel Reader","Explore sample declarations and switch between per-serving and per-100 g values."],["C. Serving Size Calculator","Work out declared nutrient totals for the amount you enter."],["D. Product Comparison Tool","Compare fictional products on equivalent bases, with missing data flagged."],["E. Ingredient List Decoder","Look up ingredient names, functions and additive categories."],["F. Claims Decoder","Search common food claims and their limits and context."],["G. Allergen Awareness Explorer","Compare allergen labelling approaches across selected jurisdictions."],["H. Date Label Explorer","Compare date markings by country or region."],["I. Unit Price Calculator","Compare unit prices for different pack sizes and currencies."],["J. Food Claims Knowledge Quiz","Test your knowledge, with an explanation after every answer."],["K. Grocery Checklist Builder","Build, group and tick off a shopping list."],["L. Fourteen-Day Learning Tracker","Track completion of the 14-day smart shopping challenge."]]}]}],takeaways:["Pick a reading path that matches your immediate goal.","Use the tools alongside the chapters, not instead of them."]},{id:"packaging-quick-guide",group:"front",title:"A Quick Guide to Food Packaging",objectives:["Locate the main information areas on a typical package.","Know which details to check first."],sections:[{id:"front-of-pack",title:"Front of pack",blocks:[{t:"p",x:"The front usually carries the product name, brand, net quantity, and often a claim or symbol. Pictures of ingredients, fruit, grains or landscapes are design choices; they are not a list of contents. Front-of-pack nutrition systems, where used, add a summary symbol or colour code."}]},{id:"back-of-pack",title:"Back or side of pack",blocks:[{t:"p",x:"The back or side panels usually contain the ingredient list, allergen information, nutrition declaration, storage instructions, date marking, preparation instructions, and the name and address of the responsible business. The exact layout and required items depend on the country (see Chapter 1)."}]},{id:"quick-order",title:"A fast reading order",blocks:[{t:"ol",items:["Confirm the **product name** and the **net quantity**.","Read the **allergen statement** and the **ingredient list** (look for emphasised allergen words).","Check the **nutrition declaration**, noting whether values are per serving or per 100 g.","Check the **date marking** and **storage instructions**.","Review **claims and certification logos** and ask what they actually mean."]}]}],takeaways:["Start with name, quantity, allergens and ingredients; then nutrition, dates and claims."]},{id:"terminology",group:"front",title:"International Terminology",objectives:["Understand the core labelling terms used in this book and in most markets."],sections:[{id:"terms",title:"Core terms",blocks:[{t:"table",caption:"Terms used throughout the book",head:["Term","Plain-language meaning"],rows:[["Net quantity","The amount of food in the pack, excluding packaging. Shown by weight (g, kg, oz, lb) or volume (ml, l, fl oz)."],["Serving size","A reference amount chosen by the labelling system. It is not a recommendation of how much to eat."],["Per 100 g / per 100 ml","A standard basis that allows fair comparison between products of different sizes."],["Ingredient","Any substance used in making the food, including those that remain only in modified form."],["Additive","A substance added for a technological purpose, such as preservation, colour or texture. Each jurisdiction lists permitted additives."],["Allergen","A food or ingredient known to cause allergic reactions in some people. Lists vary by jurisdiction."],["Use by","A safety-related date for certain perishable foods. Do not eat or sell after it (rules vary; see Chapter 21)."],["Best before","A quality-related date. Food may still be safe after it, if stored correctly and checked."],["Nutrient reference value","A reference amount used to express nutrients as a percentage. Examples: US Daily Value (%DV); EU Nutrient Reference Value (NRV)."],["Fortification / enrichment","Adding vitamins or minerals to a food. Enrichment usually refers to restoring nutrients lost in processing."],["Claim","Any statement or symbol that describes or implies a property of the food."],["Certification","A process in which an independent body checks that a product meets a defined standard."],["Front-of-pack (FOP)","Nutrition information placed on the front of the package, in the form of a symbol, rating or summary."]]}]}],takeaways:["Term meanings can differ by jurisdiction; always check the definition that applies where you live."]},{id:"symbols",group:"front",title:"Visual Symbols Explained",objectives:["Recognise the main symbols and colour systems and what each one communicates."],sections:[{id:"dietary-symbols",title:"Dietary and category symbols",blocks:[{t:"p",x:"In **India**, the Food Safety and Standards (Labelling and Display) Regulations, 2020 require a veg or non-veg mark on pre-packaged food. A **green filled circle inside a green square** indicates vegetarian. A **brown filled triangle inside a brown square** indicates non-vegetarian. The mark must be prominent on the principal display panel."},{t:"p",x:"Symbols for vegan, halal, kosher or gluten-free status are not standardised worldwide. They may be government marks, certification-body marks or company statements. Their meaning depends on who issued them (see Chapter 14)."}]},{id:"certification-symbols",title:"Certification and organic symbols",blocks:[{t:"p",x:"The **EU organic logo** (a leaf made of stars on a green background) is used on pre-packaged organic food in the European Union. Many other countries have their own organic logos. Private certification marks, such as those for animal welfare or fair trade, each have their own standards and scope. Chapter 13 explains how to check them."}]},{id:"nutrition-symbols",title:"Front-of-pack nutrition symbols",blocks:[{t:"table",caption:"Examples of front-of-pack approaches (each is explained in Chapter 15)",head:["Approach","Visual form","Example markets (verify current status)"],rows:[["Traffic-light labelling","Red, amber and green indicators for nutrient levels","United Kingdom (voluntary)"],["Nutri-Score","Letters A–E in colours from dark green to dark red","Several EU countries and Switzerland (voluntary)"],["Health Star Rating","Star rating from 0.5 to 5","Australia and New Zealand (voluntary)"],["Warning labels",'Black octagonal warnings such as "High in sugars"',"Chile (mandatory under Law 20.606)"],['"High in" symbols',"Standardised symbol for high saturated fat, sugars or sodium","Canada (mandatory from 1 January 2026 for products over thresholds)"]]},{t:"callout",kind:"REGIONAL DIFFERENCE",x:'The same product can display different symbols, or none, depending on the market. A "green" result in one system is not a guarantee of a good food in another system. Always know which system you are looking at.'}]}],takeaways:["A symbol summarises one system's criteria. Learn the criteria before you rely on the symbol."]},{id:"introduction",group:"front",title:"Introduction: Become a More Informed Food Consumer",subtitle:"Learn • Prepare • Thrive",objectives:["Understand the book's central approach: identify, check, compare, verify, decide.","Appreciate that packaged food varies widely and must be judged in context."],sections:[{id:"packaged-food-varies",title:"Packaged food is not one thing",blocks:[{t:"p",x:'The phrase "packaged food" covers an enormous range: plain rice, dried lentils, canned tomatoes, frozen peas, bread, yoghurt, breakfast cereal, sauces, biscuits, instant noodles, fortified drinks and ready meals. Some are simple, affordable and nutritious. Some are convenient and occasional. Some provide nutrients that are hard to obtain otherwise, or food safety and accessibility benefits that matter to a household. Others may be high in sugar, salt or saturated fat compared with alternatives. Each product should be evaluated in its own context.'},{t:"p",x:"This book does not treat processing as a moral category. Freezing, canning, drying, fermenting, baking and fortifying are all forms of processing, and many are long-established food-preservation methods."}]},{id:"five-steps",title:"The five-step method",blocks:[{t:"ol",items:["**Identify** what the product actually is (Chapters 1–4).","**Check** its nutrition, ingredients, allergens and dates (Chapters 5–11, 18–21).","**Compare** it with suitable alternatives on equivalent bases (Chapters 23–24).","**Verify** claims and unclear information with official sources (Chapters 12–17, 25).","**Decide** based on your needs, budget, preferences and safety requirements (Chapters 27–30)."]},{t:"callout",kind:"WHAT THE SCIENCE SAYS",x:"Public-health guidance generally focuses on overall eating patterns, such as the intake of free sugars, sodium and saturated fat across the whole diet, rather than on single foods. A label gives one piece of that picture, which is why this book emphasises comparison and context."}]}],takeaways:["Packaged food varies widely; evaluate each product in context.","Use the five-step method on every shopping trip, even briefly."]}],Gg=[{id:"ch01-meet-your-label",group:"I",num:"1",title:"Meet Your Food Label",subtitle:"The anatomy of a packaged food",objectives:["Name the main information areas on a typical package.","Distinguish legally required, optional and category-specific information.","Recognise that requirements differ between countries."],sections:[{id:"anatomy",title:"The anatomy of a package",blocks:[{t:"p",x:"Every package tells a story in layers. The **front** presents the brand and product name. The **back or side** carries the detailed information that regulators and manufacturers require. Some details appear once; others are repeated on the outer carton, the inner pack, or in a digital record."},{t:"figure",id:"package-anatomy",caption:"Figure 1.1 — An original, fictional package illustration showing the typical information areas. Numbers match the list below.",alt:"Illustration of a fictional pouch-style food package with numbered callouts for product name, brand, claim, ingredient list, nutrition declaration, allergen statement, net quantity, date marking, storage instructions, responsible business and batch code."},{t:"ol",items:["Product name (the name that describes the food).","Brand identity (a trade name; it does not describe the food).","Claims and symbols (voluntary or regulated; see Part III).","Ingredient list (descending order, with allergens emphasised in many systems).","Nutrition declaration (energy and nutrients, often per 100 g and per serving).",'Allergen statement (for example, a "Contains" line).',"Net quantity (the amount of food, excluding packaging).","Date marking (use by or best before in many markets).","Storage and preparation instructions.","Responsible business name and address.","Batch or lot code (used for traceability)."]}]},{id:"required-optional",title:"Required, optional or category-specific?",blocks:[{t:"p",x:"Labelling rules usually sort information into three groups. **Mandatory** information must appear for most pre-packaged foods. **Conditional** information applies only when a condition is met, such as a claim being made or a particular ingredient being emphasised. **Voluntary** information is optional for the producer, though it must not be false or misleading."},{t:"table",caption:"Typical examples. Exact requirements depend on the jurisdiction and product category; verify with the official authority.",head:["Information","Often mandatory","Often conditional or voluntary"],rows:[["Product name and ingredient list","Yes, in most systems","Ingredient exemptions exist for some single-ingredient foods"],["Net quantity","Yes, in most systems","Drained weight for some products"],["Nutrition declaration","Required in many markets; some small or unprocessed foods may be exempt","Extended nutrient lists; front-of-pack symbols depend on the system"],["Allergen information","Required for specified allergens (see Chapter 20)",'Precautionary "may contain" statements'],["Date marking","Often required for some foods (for example, use by)","Some foods exempt; quality date markings are category-specific"],["Country of origin","Required in some markets for some foods",'Often voluntary "Made in" statements'],["Certification logos","Never required as such, but regulated when claimed (for example, organic)","Private certification marks"]]},{t:"callout",kind:"REGIONAL DIFFERENCE",x:"In the EU and UK, the nutrition declaration generally covers energy plus six nutrients (fat, saturates, carbohydrate, sugars, protein and salt) per 100 g or 100 ml, under Regulation (EU) No 1169/2011 and its UK equivalent. In the United States, the Nutrition Facts panel shows a set of nutrients per serving, with %DV. In India, the Labelling and Display Regulations, 2020 set the mandatory declarations. The label may look different, but the question each one answers is similar."}]},{id:"codes-digital",title:"Batch codes, certification marks and QR codes",blocks:[{t:"p",x:"A **batch or lot code** helps a manufacturer trace a production run, for example during a recall. It does not tell a shopper whether a product is safe or how fresh it is. Keep batch codes if you need to report a problem or check a recall notice."},{t:"p",x:"A **QR code** may link to a website with extra information such as ingredients, recipes or sourcing details. Codex guidance adopted in 2024 recognises that some information can be provided digitally, but safety and nutrition information must remain on the physical label. A QR code does not, by itself, guarantee traceability or authenticity (see Chapter 25)."}]}],takeaways:["Know the typical layout, but check the rules that apply where you buy the food.","Safety-critical information belongs on the physical package, not only on a website."]},{id:"ch02-ingredient-lists",group:"I",num:"2",title:"How Ingredient Lists Work",subtitle:"Order, names, compound ingredients and allergen emphasis",objectives:["Explain how ingredient ordering rules work.","Interpret compound ingredients, flavourings and added vitamins.","Understand the limits of reading only the first few ingredients."],sections:[{id:"ordering",title:"Ordering by weight",blocks:[{t:"p",x:"In the EU (Regulation (EU) No 1169/2011), the Codex General Standard for the Labelling of Pre-Packaged Foods (CXS 1-1985), and many national systems, ingredients are listed in **descending order of weight** at the time of manufacture. The first ingredient is the one present in the largest amount by weight. Water, if used, is usually counted as an ingredient in the same way."},{t:"figure",id:"ingredient-order",caption:"Figure 2.1 — Illustrative only: a fictional ingredient list shown as relative weight. Real products vary.",alt:"Bar chart of a fictional recipe showing ingredients ordered from largest to smallest by weight: oats, water, sugar, rapeseed oil, salt, natural flavouring."},{t:"callout",kind:"CONSUMER MISTAKE",x:"Assuming the list is in order of nutritional importance. It is not. An ingredient near the top may be present in a modest amount, and an ingredient near the bottom may still be significant for allergens, sodium or sugar."}]},{id:"compound",title:"Compound ingredients and sub-ingredients",blocks:[{t:"p",x:"A **compound ingredient** is a food made from several ingredients, such as a biscuit used in a dessert or a seasoning mix used in a snack. Many systems allow the compound ingredient to be listed by name, with its own ingredients in brackets or in a sub-list. This means the top-level list can be shorter than the full recipe."},{t:"example",title:"Worked example: reading a compound ingredient",steps:['Fictional label: "Yoghurt (milk, sugar, live cultures), strawberry preparation (strawberry, sugar, pectin, citric acid), cornflour."',"The parentheses show what the compound ingredient contains. Sugar appears twice: once in the yoghurt and once in the fruit preparation.",'Adding the sugars from both sub-lists gives a more complete picture than looking at "sugar" alone in the top-level list.']}]},{id:"flavourings-additions",title:"Flavourings, vitamins and minerals",blocks:[{t:"p",x:'Flavourings are described in generic categories, such as "natural flavouring" or "flavouring", with specific rules about what each term may mean (see Chapter 19). Added vitamins and minerals are often named in the list (for example, "iron" or "vitamin D" in fortified cereals). Their presence is information about the product; it does not make the whole food complete.'},{t:"ul",items:["Processing aids used during manufacture but not intended to remain in the finished food may be exempt from listing under some rules.","Ingredients present only in very small amounts may still need to be listed, although some systems allow exemptions for trace quantities that have no technological function.",'Ingredient names may differ between countries (for example, "icing sugar" and "powdered sugar" can refer to the same product in different markets).']}]},{id:"allergen-quid",title:"Allergen emphasis and quantitative declarations",blocks:[{t:"p",x:'Many systems require allergens within the ingredient list to be emphasised, for example in bold, capitals or a contrasting style. Some systems also require a separate "Contains" statement. Where a food is emphasised by a name, picture or words (for example, "strawberry yoghurt" with strawberries on the front), the EU requires a **quantitative ingredient declaration** (QUID) showing the percentage of that ingredient.'},{t:"callout",kind:"SAFETY FIRST",x:"Never assume an allergen is absent because you cannot see it in a photograph or in an online summary. Read the full ingredient list and the allergen statement on the physical package. See Chapter 20."}]},{id:"first-ingredients",title:"Reading the first few ingredients",blocks:[{t:"p",x:"The first three or four ingredients often show what makes up the bulk of a product. That is useful for comparison. A breakfast cereal that lists wholegrain oats first is different from one that lists sugar first; but the first ingredients do not reveal the full nutritional profile, the sodium content, or the overall role of the food in a diet. Use the ingredient list together with the nutrition declaration."},{t:"callout",kind:"WHAT THE SCIENCE SAYS",x:"Long ingredient lists are not automatically a sign of poor quality, and short lists do not automatically mean better nutrition. Many simple foods, such as bread and tofu, need several ingredients or processing aids to be made well. Judge each product on its evidence."}]}],takeaways:["Order by weight shows relative bulk, not nutritional importance.","Compound ingredients can hide repeated ingredients such as sugar; read the sub-lists.","Allergens must be checked on the full list, not inferred."]},{id:"ch03-product-names",group:"I",num:"3",title:"Product Names and What They Actually Mean",subtitle:"Legal names, descriptive names and brand names",objectives:["Distinguish legal, common, descriptive and brand names.","Identify what a product is, rather than relying only on front-of-pack branding."],sections:[{id:"name-types",title:"Four kinds of name",blocks:[{t:"table",caption:"Name types on packaged food",head:["Type","What it does","Example (fictional)"],rows:[["Legal or statutory name","Set by law or standard for some foods. It tells you the category of food.",'"Fruit jam" or "Milk chocolate" (where a standard applies)'],["Common name","A widely understood name for the food, not necessarily set by law.",'"Peanut butter", "Vegetable stock"'],["Descriptive name","Says something about the food, such as its style, form or main ingredient.",'"Smoked tofu", "Wholegrain oat bar"'],["Brand name","A trade name used by the manufacturer. It may be imaginative and does not describe the food.",'"Harvest Lantern Crunch" (fictional)']]},{t:"p",x:"Brand names are often the most prominent words on a package. They can be useful for recognising a product, but they do not tell you what the product is. Look for the product name nearby, and check the ingredient list if the name is ambiguous."}]},{id:"variants",title:'Variants, flavours and "with" statements',blocks:[{t:"p",x:'Product variants can be confusing. "Chocolate-flavoured" usually means the chocolate taste comes from flavouring or cocoa, and may contain little or no cocoa. "Chocolate" or "with chocolate" may mean something else. Similarly, "with real fruit" or "made with fruit" does not indicate how much fruit is present; check the ingredient list and any quantitative declaration.'},{t:"callout",kind:"LABEL DECODER",x:'"Flavoured" means a taste has been added. "Made with" means an ingredient has been used, often in a small amount. "Filled" can describe a product that contains a substitute fat in place of a dairy fat, in some markets.'}]},{id:"imitation",title:"Imitation, substitute and analogue products",blocks:[{t:"p",x:"Some foods are designed to resemble another product, such as a plant-based cheese or a meat analogue. Their names must reflect their composition in many markets. Analogues may have different nutrient profiles, ingredients, allergens and price levels. Compare them with the original product only on equivalent bases, and check their own labels rather than assuming a similarity."},{t:"callout",kind:"REGIONAL DIFFERENCE",x:'The protection of dairy terms (such as "milk", "cheese" or "yoghurt") differs between countries. Some markets restrict the use of dairy names for plant-based products, while others permit them with qualifying words. Check the rule in the market where you shop.'}]},{id:"traditional-premium",title:"Traditional, artisan and premium names",blocks:[{t:"p",x:`Words such as "traditional", "artisan", "heritage", "premium" and "authentic" are often marketing descriptions. Some may have legal meaning in specific cases, such as protected designations of origin or geographical indications in the EU and elsewhere. Those terms have defined conditions. Where a term has no legal definition, it describes the producer's intention rather than a verifiable standard.`}]}],takeaways:["Find the descriptive name and read the ingredient list to see what the product really is.",'Imitation and "flavoured" products can differ greatly from their names suggest.']},{id:"ch04-package-size",group:"I",num:"4",title:"Package Size, Net Quantity and Serving Information",subtitle:"How much is in the pack, and what counts as a serving",objectives:["Distinguish net weight, drained weight and volume.","Explain why a declared serving size is not a recommendation.","Calculate the total amount of nutrients in a multi-serving pack."],sections:[{id:"net-quantity",title:"Net quantity, drained weight and volume",blocks:[{t:"p",x:"The **net quantity** is the amount of food in the pack, excluding packaging. For solid foods it is usually shown by weight; for liquids by volume. Some canned or jarred foods also show a **drained weight**, which is the weight of the food after the liquid has been drained. A can of beans may weigh 400 g with liquid, but only 240 g of beans when drained. Nutrition values may be given for either basis, so check which one applies."},{t:"callout",kind:"CONSUMER MISTAKE",x:"Comparing a drained-weight price with a total-weight price. Always compare the same basis, and say so when you record the figure (see Chapter 24)."}]},{id:"serving-reference",title:"Serving size: a reference amount, not a target",blocks:[{t:"p",x:"A **declared serving size** is a reference amount chosen to make labels comparable and to help people understand how much food the nutrition values refer to. In the United States, serving sizes are based on Reference Amounts Customarily Consumed (RACCs) set by the FDA. In the EU and UK, the declaration is usually per 100 g or 100 ml, and a per-portion value may be added voluntarily. Serving sizes are not identical across systems, so two labels can show different serving amounts for similar foods."},{t:"callout",kind:"CHECK THE EVIDENCE",x:"A serving size on a nutrition panel is information about the product, not advice about how much to eat. What counts as a sensible amount depends on your needs, appetite, activity and the rest of your diet."}]},{id:"servings-and-household",title:"Servings per pack and household measures",blocks:[{t:"p",x:'Many labels list "servings per pack". This is a helpful count, but it can differ from how people actually eat. A cereal serving may be 30 g, which is about a bowl-sized handful for some people and a light snack for others. Household measures such as a "tablespoon" or "cup" vary between countries, and a level spoonful of oil is not the same mass as a level spoonful of sugar. Where possible, weigh or measure once to learn your own portions.'},{t:"figure",id:"serving-compare",caption:"Figure 4.1 — Illustrative: the same 400 g package shown with two different declared serving sizes, giving different servings-per-pack counts.",alt:"Two bars representing a fictional 400 gram pack divided into 40 gram servings (10 servings) and 50 gram servings (8 servings), showing that the same pack can be described with different serving counts."}]},{id:"multi-serving-totals",title:"Multi-serving packs and how totals add up",blocks:[{t:"p",x:"The amount of any nutrient you consume is the value per serving multiplied by the number of servings, or the value per 100 g multiplied by the number of hundred-gram portions you eat. This simple multiplication shows why a label can seem fine per serving yet add up quickly across a whole pack."},{t:"example",title:"Worked example: a 375 g fictional pack",steps:["Fictional granola: net quantity 375 g; declared serving 30 g; therefore 375 ÷ 30 = 12.5 servings per pack.","Declared energy: 1,600 kJ per 100 g. Per serving: 1,600 × 30 ÷ 100 = 480 kJ.","If someone eats 3 servings (90 g): 480 × 3 = 1,440 kJ, which is the same as 1,600 × 90 ÷ 100 = 1,440 kJ.","If the same person eats the whole pack (375 g): 1,600 × 375 ÷ 100 = 6,000 kJ, or about 1,434 kcal (6,000 ÷ 4.184)."]},{t:"callout",kind:"REAL-WORLD EXAMPLE",x:"The per-serving figure is correct, but the pack is 12.5 servings. Calculating totals before you open a pack, or using the Serving Size Calculator, helps you understand the real amounts."}]}],takeaways:["Check whether values are per serving or per 100 g, and whether the weight is net or drained.","A declared serving is a reference amount, not a target.","Totals are the value per unit multiplied by the amount you actually eat."]}],Ig=[{id:"ch05-nutrition-declaration",group:"II",num:"5",title:"How to Read a Nutrition Declaration",subtitle:"Layouts, rows, reference values and what they can show",objectives:["Read a nutrition declaration in the EU/UK and US styles.","Explain %DV and nutrient reference values.","Describe what a nutrition declaration cannot tell you."],sections:[{id:"two-layouts",title:"Two common layouts",blocks:[{t:"p",x:"In the **EU and UK**, the nutrition declaration usually appears as a table per 100 g or 100 ml, and may also show per portion. It lists energy (in kJ and kcal) followed by fat, of which saturates, carbohydrate, of which sugars, protein and salt. Under Regulation (EU) No 1169/2011, these are the mandatory items for most pre-packed foods."},{t:"p",x:"In the **United States**, the Nutrition Facts panel shows values per serving, with the serving size and servings per container at the top, and a **% Daily Value (%DV)** column. Total sugars and added sugars are both listed, and trans fat appears as a separate line. **Canada** uses a similar format with bilingual text. Other markets, including India, Australia and New Zealand, use tables that combine per-100 g and per-serving information in different ways."},{t:"callout",kind:"REGIONAL DIFFERENCE",x:"Do not compare a per-100 g figure with a per-serving figure. Convert both to the same basis first. The Product Comparison Tool and the Nutrition Panel Reader both help with this."}]},{id:"reading-rows",title:"Reading the rows from top to bottom",blocks:[{t:"ul",items:["**Energy** in kilojoules (kJ) and kilocalories (kcal). See Chapter 6.","**Total fat**, and **saturates** (saturated fat). Trans fat appears in some systems. See Chapter 8.","**Carbohydrate** and **sugars**. Some systems also declare **added sugars**. See Chapter 7.","**Fibre**, where declared. Definitions vary; see Chapter 10.","**Protein**.","**Sodium** (US, Canada and some others) or **salt** (EU, UK and many others). See Chapter 9.","**Vitamins and minerals**, where declared, usually as %DV or as a percentage of a nutrient reference value."]}]},{id:"daily-values",title:"Percentage Daily Values and reference values",blocks:[{t:"p",x:"A **Daily Value (DV)** is a reference amount used in US labelling, and %DV tells you how much of that reference a serving provides. The FDA sets DVs for many nutrients for a reference diet of 2,000 kcal. In the EU, labels may use **Nutrient Reference Values (NRVs)** in Annex XIII of Regulation (EU) No 1169/2011 to express vitamins and minerals as a percentage of a reference intake. The concept is similar but the numbers and rules differ."},{t:"example",title:"Worked example: calculating %DV",steps:["Fictional soup, per serving: sodium 460 mg. US sodium DV: 2,300 mg.","%DV = amount ÷ DV × 100 = 460 ÷ 2,300 × 100 = 20%.","Fictional snack, per serving: added sugars 12 g. US added sugars DV: 50 g.","%DV = 12 ÷ 50 × 100 = 24%."]},{t:"callout",kind:"CONSUMER MISTAKE",x:"Treating a %DV as a personal target. A %DV is a general reference for a reference diet, not a measure of your individual needs. Some DVs are set as upper limits (for example, sodium) and some as recommended daily amounts (for example, fibre). Read the label's wording."}]},{id:"limits-declaration",title:"What a declaration can and cannot show",blocks:[{t:"p",x:"A nutrition declaration is laboratory-based or calculation-based information about one product. It is useful for comparing products, tracking your intake of specific nutrients, and checking changes after a reformulation. It cannot show the overall balance of your meals, the quality of the food's structure, its effect on health, or whether it is suitable for a medical condition."},{t:"callout",kind:"WHAT THE SCIENCE SAYS",x:"Dietary patterns, not single products, are the main focus of most nutrition guidance. A nutrition declaration informs a decision; it does not replace guidance from a health professional for individual needs."}]}],takeaways:["Identify the basis (per 100 g, per serving or per pack) before comparing.","A %DV is a reference, not a personal target."]},{id:"ch06-energy",group:"II",num:"6",title:"Calories, Energy and Serving Calculations",subtitle:"Kilojoules, kilocalories and the arithmetic behind them",objectives:["Convert between kilojoules and kilocalories.","Calculate energy per serving and per pack.","Explain why energy alone does not rank foods."],sections:[{id:"units",title:"Kilojoules and kilocalories",blocks:[{t:"p",x:'Food energy is measured in **kilojoules (kJ)** in many countries and in **kilocalories (kcal)** in others. The word "calorie" on food labels usually means kilocalorie. Both units describe the same quantity of energy: **1 kcal = 4.184 kJ**. Most EU and UK labels show both. US labels show kilocalories only.'},{t:"ol",items:["To convert kJ to kcal, divide by 4.184.","To convert kcal to kJ, multiply by 4.184."]}]},{id:"basis",title:"Per 100 g, per serving and per pack",blocks:[{t:"p",x:"The same food can have different energy figures depending on the basis. Per 100 g lets you compare products of different sizes. Per serving tells you the energy in a labelled amount. Per pack tells you the total in a package that may contain several servings. For the energy in any amount, use: **energy per 100 g × amount eaten (g) ÷ 100**."},{t:"example",title:"Worked example 1: a serving from a per-100 g value",steps:["Fictional cereal: 1,650 kJ per 100 g; serving 40 g.","Energy per serving = 1,650 × 40 ÷ 100 = 660 kJ.","In kcal: 660 ÷ 4.184 = 157.7, or about 158 kcal."]},{t:"example",title:"Worked example 2: a liquid product",steps:["Fictional plant drink: 180 kJ per 100 ml; bottle 250 ml.","Whole bottle = 180 × 250 ÷ 100 = 450 kJ.","In kcal: 450 ÷ 4.184 = 107.6, or about 108 kcal.","Note: for liquids, the basis is volume. Convert with the density only when weight is required."]}]},{id:"presentation",title:"How packaging can change perception",blocks:[{t:"p",x:"Some packs contain more than one serving but are designed to look like a single item, such as a 500 ml bottle or a single-serve bar that contains two labelled servings. Some systems require the label to show both per-serving and per-package values for such packs. Read the servings-per-pack line and check the whole-pack total before assuming a pack is one portion."},{t:"callout",kind:"CONSUMER MISTAKE",x:"Reading only the per-serving energy on a pack that contains two or three servings. The per-pack total may be a better measure of what you will eat in one sitting."}]},{id:"not-ranking",title:"Why energy does not rank foods",blocks:[{t:"p",x:"Energy tells you how much energy a food provides. It does not tell you how filling it is, how much protein, fibre or micronutrient it contains, how it fits into your meals, or how it supports your activity. A lower-energy product is not automatically better, and a higher-energy product is not automatically unhealthy. Energy needs vary greatly between people, and this book does not provide calorie targets or restriction advice."},{t:"callout",kind:"CHECK THE EVIDENCE",x:'Claims such as "low calorie", "lite" or "light" have legal definitions in several markets, but they describe energy only. Check the other nutrients and the ingredient list before deciding.'}]}],takeaways:["Use 1 kcal = 4.184 kJ for conversions.","Energy for any amount = energy per 100 g × grams ÷ 100.","Energy is one piece of the nutritional picture, not a ranking tool."]},{id:"ch07-sugars",group:"II",num:"7",title:"Understanding Sugars and Sweeteners",subtitle:"Total, added and free sugars, and the terms that hide them",objectives:["Distinguish naturally occurring, total, added and free sugars.","Recognise sugar-containing ingredients, sugar alcohols and sweeteners.","Interpret sugar-related claims and their limits."],sections:[{id:"sugar-types",title:"Naturally occurring, total, added and free sugars",blocks:[{t:"p",x:'Some sugars occur naturally in food. **Lactose** is the main sugar in milk, and **fructose** occurs in fruit. **Total sugars** on a label include these natural sugars as well as any sugars added during processing. **Added sugars** are sugars and syrups added to food during manufacture or preparation. The US label shows added sugars separately; many EU and UK labels show only total sugars ("of which sugars").'},{t:"figure",id:"sugar-terms",caption:"Figure 7.1 — Nested categories. Free sugars are a WHO concept that counts added sugars and sugars naturally present in honey, syrups, and fruit juices and concentrates.",alt:"Nested diagram: total sugars contain naturally occurring sugars in whole fruit and milk, and sugars added during processing; free sugars overlap with added sugars and include sugars in honey, syrups, fruit juices and concentrates."},{t:"p",x:"The **World Health Organization** defines **free sugars** as monosaccharides and disaccharides added to foods by the manufacturer, cook or consumer, plus sugars naturally present in honey, syrups, fruit juices and fruit juice concentrates. Sugars inside intact whole fruit and vegetables, and lactose in milk, are not counted as free sugars. Free sugars are the category used in WHO's guidance."}]},{id:"sugar-names",title:"Names of sugar-containing ingredients",blocks:[{t:"p",x:'Manufacturers use many names for sugars and sugar-containing syrups. Recognising them helps you see added sugars in an ingredient list even when the word "sugar" does not appear.'},{t:"table",caption:"Common sugar-containing ingredient names (not exhaustive)",head:["Group","Examples on labels"],rows:[["Sucrose and similar","Sugar, cane sugar, beet sugar, icing sugar, brown sugar, demerara, jaggery, panela"],["Glucose and related","Glucose, dextrose, glucose syrup, corn syrup, maltodextrin (a starch-derived carbohydrate, check local rules), invert sugar"],["Fructose-based","Fructose, high-fructose corn syrup, agave syrup, fruit sugar"],["Syrups and concentrates","Honey, maple syrup, rice syrup, malt extract, molasses, fruit juice concentrate"],["Ending in -ose","Maltose, lactose (in milk), galactose, sucrose"]]},{t:"callout",kind:"CONSUMER MISTAKE",x:'Thinking honey, agave or "fruit juice concentrate" are not added sugars. WHO counts them as free sugars. Their nutrient content differs in small ways, but they contribute to free sugar intake in a similar way to other sugars.'}]},{id:"sweeteners",title:"Sugar alcohols and other sweeteners",blocks:[{t:"p",x:"**Sugar alcohols** (polyols) such as sorbitol, xylitol, maltitol, erythritol and isomalt provide sweetness with less energy than sugar in many products, and are not counted as sugars in some labelling systems. In large amounts they can have a laxative effect; some markets require a warning on products containing them, so check the rules where you shop."},{t:"p",x:"**Intense or non-sugar sweeteners**, such as aspartame, sucralose, acesulfame K, saccharin and steviol glycosides (stevia), are authorised in many countries with defined acceptable daily intakes. Some products state that they contain a source of phenylalanine (aspartame), which matters for people with phenylketonuria. Authorisation and labelling differ between countries."}]},{id:"sugar-claims",title:"Sugar claims: sugar-free, no added sugar and reduced sugar",blocks:[{t:"p",x:'"Sugar-free", "no added sugar" and "reduced sugar" are nutrition or comparative claims with specific definitions in many markets. For example, the EU sets maximum sugar levels for a "sugars-free" claim (Regulation (EC) No 1924/2006), and the US FDA sets its own definitions for "sugar free" and "no added sugars". Neither claim means the product is low in energy, and a "no added sugar" product can still contain high levels of naturally present sugars.'},{t:"example",title:'Worked example: "no added sugar" does not mean "low sugar"',steps:["Fictional plain yoghurt with fruit pieces, no sugar added: 14 g total sugars per 100 g.","Most of these sugars come from lactose in milk and fructose or glucose in the fruit.",'The product may legitimately claim "no added sugar" but still has 14 g of total sugars per 100 g.',"Comparing its total sugars with a plain, unsweetened yoghurt is the way to see the difference."]}]},{id:"sugar-guidance",title:"Guidance on free sugars",blocks:[{t:"p",x:"The WHO guideline on sugars intake for adults and children recommends limiting free sugars to less than 10% of total energy intake, and suggests a further reduction to below 5% for additional health benefit. The US Dietary Guidelines recommend limiting added sugars to less than 10% of calories. These are population guidelines. Use them as background, not as personal targets, and check current editions for updates."},{t:"callout",kind:"WHAT THE SCIENCE SAYS",x:"Free sugars are linked to dental caries and to excess energy intake when consumed frequently in drinks and processed foods. Whole fruit and milk contain natural sugars within a food structure that differs from sweetened products; this is why the WHO definition excludes them."}]}],takeaways:["Total sugars include natural sugars; added and free sugars are narrower categories.","Honey, syrups and fruit juice concentrates count as free sugars.","Sugar-free and no-added-sugar claims do not guarantee low total sugar or low energy."]},{id:"ch08-fats",group:"II",num:"8",title:"Fats, Oils and Saturated Fat",subtitle:"Fat types, hidden fats and fat-related claims",objectives:["Name the main fat types on a label.","Explain trans fat, hydrogenation and industrially produced trans fats.","Interpret fat declarations and fat-related claims."],sections:[{id:"fat-types",title:"Fat types and what labels show",blocks:[{t:"p",x:"Fats are mixtures of fatty acids. The main groups are **saturated**, **monounsaturated** and **polyunsaturated** fats. **Trans fats** are a further group and can be naturally occurring in small amounts in some animal products or industrially produced through partial hydrogenation of oils. Most labels show total fat and saturated fat; some show trans fat (US, Canada and some others), and some voluntarily show omega-3 or other fatty acids."},{t:"figure",id:"fat-types",caption:"Figure 8.1 — Illustrative grouping of common dietary fats. Real foods contain mixtures of fatty acids.",alt:"Diagram grouping fats into saturated, monounsaturated, polyunsaturated and trans categories, with example sources such as butter, olive oil, sunflower oil and partially hydrogenated oils."}]},{id:"oils-blends",title:"Oils, blends and common sources",blocks:[{t:"p",x:'Many fats come from oils and fats used as ingredients. Terms such as "vegetable oil" or "vegetable fat" do not name the oil and may mean a blend. Naming a specific oil (for example, "rapeseed oil", "olive oil", "sunflower oil" or "palm oil") is more informative. Plant oils are not all alike; olive oil, rapeseed oil and palm oil differ in their fatty-acid profiles, and coconut oil and palm oil are both high in saturated fat. Dairy, meat and some baked goods are important sources of saturated fat in many diets.'},{t:"callout",kind:"CHECK THE EVIDENCE",x:'Claims that a single oil is "healthy" or "toxic" usually go beyond the evidence. Judge the product by its total fat, saturated fat, and the rest of the diet, and treat oil-specific claims with caution.'}]},{id:"trans-fat",title:"Trans fats and hydrogenation",blocks:[{t:"p",x:"Hydrogenation adds hydrogen to unsaturated oils to make them more solid or stable. Partial hydrogenation historically produced industrial trans fats, which are associated with raised LDL cholesterol. Many countries have restricted industrially produced trans fat. The EU applies a limit on industrially produced trans fat in foods supplied to final consumers; in 2015 the US FDA determined that partially hydrogenated oils are no longer generally recognised as safe for use in food. Check the current rules in your market."},{t:"callout",kind:"LABEL DECODER",x:'"Partially hydrogenated oil" in an ingredient list is a signal that the product may contain industrially produced trans fat. Where a US label shows "0 g trans fat", the product may still contain small amounts below the labelling threshold.'}]},{id:"fat-claims",title:"Low-fat, reduced-fat and light claims",blocks:[{t:"p",x:'"Low fat" claims have defined thresholds in many countries. In the EU, a "low fat" product has no more than 3 g fat per 100 g for solids, or 1.5 g per 100 ml for liquids. In the US, "low fat" means 3 g or less per reference amount. A "reduced fat" claim compares the product with a reference product and has its own minimum reduction. A low-fat product can still be high in sugar or energy, and a fat claim does not state the type of fat.'},{t:"example",title:"Worked example: saturated share of total fat",steps:["Fictional biscuit: total fat 12 g per 30 g serving; saturates 4 g per serving.","Fat per 100 g = 12 ÷ 30 × 100 = 40 g; saturates per 100 g = 4 ÷ 30 × 100 = 13.3 g.","Saturated share of total fat = 4 ÷ 12 × 100 = 33%.","The figure shows what proportion of the fat is saturated; it does not show the energy or other nutrients in the biscuit."]}]}],takeaways:["Total fat alone does not describe fat quality; check saturates and whether trans fat is declared.",'Named oils are more informative than "vegetable oil".',"Fat-related claims have specific thresholds, and they say nothing about sugar or energy."]},{id:"ch09-sodium-minerals",group:"II",num:"9",title:"Sodium, Salt and Minerals",subtitle:"Converting between sodium and salt, and spotting hidden sodium",objectives:["Convert sodium to salt and back.","Identify added and naturally present sodium.","Interpret sodium-related claims and mineral declarations."],sections:[{id:"sodium-vs-salt",title:"Sodium versus salt",blocks:[{t:"p",x:"Table salt is **sodium chloride**, which is about 39% sodium by weight. Labels show either **sodium** (common in the US and Canada) or **salt** (common in the EU, UK and many other markets). Salt is calculated as sodium × 2.5, so the two figures describe the same thing in different units. Sodium is measured in milligrams (mg) and salt in grams (g)."},{t:"figure",id:"sodium-salt",caption:"Figure 9.1 — The same amount of sodium expressed as salt, for a fictional 600 mg sodium serving.",alt:"Two bars: a 600 milligram sodium bar and a 1.5 gram salt bar, with the note that 1.5 grams of salt contains 600 milligrams of sodium."},{t:"example",title:"Worked example: sodium to salt and %DV",steps:["Fictional noodle pot: sodium 600 mg per serving.","Salt per serving = 600 mg × 2.5 = 1,500 mg = 1.5 g.","US sodium %DV = 600 ÷ 2,300 × 100 = 26% (based on the 2,300 mg reference).","Reverse check: 1.5 g salt ÷ 2.5 = 0.6 g = 600 mg sodium."]}]},{id:"sources",title:"Where sodium comes from",blocks:[{t:"p",x:"Sodium comes from added salt, but also from sodium-containing ingredients and additives, and from naturally occurring sodium in foods. Some ingredients that contain sodium are obvious (soy sauce, stock cubes, salted butter). Others are less obvious: **monosodium glutamate**, **sodium bicarbonate** (baking soda), **baking powder**, **sodium benzoate** (a preservative), **disodium phosphate** and **sodium nitrite** (used in some cured meats). The presence of these ingredients does not make a product unsafe; it helps you see where sodium is coming from."},{t:"callout",kind:"CONSUMER MISTAKE",x:"Expecting a savoury snack to be the only salty food. Bread, breakfast cereals, sauces and ready meals often contribute a substantial share of total sodium in many diets, because they are eaten frequently."}]},{id:"guidance-claims",title:"Guidance and sodium claims",blocks:[{t:"p",x:'The WHO recommends that adults consume less than 2,000 mg of sodium per day, which is equivalent to less than 5 g of salt. The US Dietary Guidelines and many national guidelines use similar limits. Sodium-related claims have defined thresholds. In the United States, "low sodium" means 140 mg or less per reference amount, and "sodium free" means less than 5 mg. The EU has thresholds for "low sodium" and "very low sodium" claims under Regulation (EC) No 1924/2006; check the current annex.'},{t:"callout",kind:"SAFETY FIRST",x:"Potassium-based salt substitutes can be unsuitable for some people, including those with kidney disease or those taking certain medicines. If you are considering a salt substitute for health reasons, speak to a health professional first."}]},{id:"minerals",title:"Potassium and other minerals",blocks:[{t:"p",x:"Some labels declare **potassium**, **calcium**, **iron**, **magnesium** or **zinc**. Potassium-rich foods such as beans, potatoes, leafy vegetables and some fruit are part of many recommended eating patterns. Calcium and iron are often added to fortified foods; Chapter 11 covers this. A mineral declaration tells you the amount in the product, not how much your body will absorb."}]}],takeaways:["Salt = sodium × 2.5. Check which figure the label uses before comparing.","Sodium comes from many foods, not only savoury snacks.","Potassium salt substitutes are not suitable for everyone."]},{id:"ch10-carbs-fibre-protein",group:"II",num:"10",title:"Carbohydrates, Fibre and Protein",subtitle:"Reading macronutrients together, not in isolation",objectives:["Explain total carbohydrate, starch, sugars and fibre.","Interpret fibre and protein claims using defined thresholds.","Correct common myths about carbohydrate and protein."],sections:[{id:"carbohydrates",title:"Carbohydrates, starch and fibre",blocks:[{t:"p",x:"Carbohydrates include sugars, starch and fibre. Labels commonly show **total carbohydrate**, of which **sugars**. In the US, total carbohydrate includes dietary fibre. In some EU and UK labels, carbohydrate and fibre are declared differently, and fibre may appear only if a claim is made or if the manufacturer chooses to show it. Definitions of fibre differ by country because they depend on which compounds are counted and which analytical method is used."},{t:"callout",kind:"CONSUMER MISTAKE",x:"Treating all carbohydrates as the same, or all carbohydrates as unhealthy. Wholegrains, legumes, fruit, vegetables, potatoes and bread differ in fibre, micronutrients, texture and how they fit into meals. Judge the whole food and the context."}]},{id:"whole-refined",title:"Whole grains and refined grains",blocks:[{t:"p",x:'A **whole grain** contains the bran, germ and endosperm of the grain in natural proportions. A **refined grain** has had the bran and germ removed. Whole-grain content is best assessed from the ingredient list, which shows whether a whole grain is the first ingredient and whether refined flour is also present. Phrases such as "multigrain", "seven-grain" or "made with wholegrain" do not necessarily mean the product is mainly whole grain. The regulatory definition of "whole grain" varies by country.'},{t:"example",title:'Worked example: "multigrain" in a fictional loaf',steps:["Ingredient list: enriched wheat flour, water, seven-grain mix (wheat, oats, barley, rye, linseed), sugar, salt, yeast.",'The first ingredient is refined wheat flour, so the loaf is not mainly whole grain by weight, despite the "seven-grain" name.',"The fibre per 100 g in the nutrition panel helps confirm the picture, but check how fibre is defined in that market."]}]},{id:"fibre-claims",title:"Fibre claims and thresholds",blocks:[{t:"p",x:`Under Regulation (EC) No 1924/2006, the EU defines a "source of fibre" as at least 3 g per 100 g and "high fibre" as at least 6 g per 100 g (or the energy-based equivalent). In the US, "good source" and "high" fibre claims are defined relative to the %DV for fibre. A fibre claim tells you about one nutrient only. It does not describe the product's sugar, fat or sodium.`}]},{id:"protein",title:"Protein declarations and claims",blocks:[{t:"p",x:'Protein is declared in most nutrition panels. Protein-rich foods include meat, fish, eggs, dairy, soy, pulses (lentils, beans, chickpeas and peas), nuts, seeds and some grains. Under the EU rules, a "high protein" claim requires at least 20% of the energy value to come from protein. A "source of protein" requires at least 12% of energy from protein.'},{t:"example",title:'Worked example: testing a "high protein" claim',steps:["Fictional bean snack: protein 20 g per 100 g; energy 400 kcal per 100 g.","Energy from protein = 20 g × 4 kcal/g = 80 kcal.","Share of energy from protein = 80 ÷ 400 × 100 = 20%.",'This meets the EU threshold for "high protein". It does not tell you whether the snack is high in sugar, sodium or fat.']},{t:"callout",kind:"CHECK THE EVIDENCE",x:'A "high protein" claim is a nutrient-content claim. It does not prove that a product is nutritionally superior, complete, or better for muscle or weight outcomes. Protein quality, fibre, energy and other ingredients still matter.'}]},{id:"plant-protein",title:"Plant and animal protein sources",blocks:[{t:"p",x:"Plant proteins from soy, pulses, wheat gluten, pea and other sources are used in many products. Their amino-acid profiles differ, and many people combine different plant foods across meals to meet their needs. Some products use isolated proteins (such as pea protein isolate). Labels may list them as ingredients. Their presence is information about composition; check the energy, fat, sodium and sugar as well."}]}],takeaways:["Read carbohydrate, sugars, fibre and protein together with the ingredient list.","Fibre and protein claims are defined by thresholds; each describes one nutrient.","A protein claim does not mean the product is nutritionally balanced."]},{id:"ch11-vitamins-fortified",group:"II",num:"11",title:"Vitamins, Minerals and Fortified Foods",subtitle:"Fortification, enrichment and nutrient reference values",objectives:["Distinguish fortification, enrichment and naturally occurring nutrients.","Interpret %DV and nutrient reference values on fortified products.","Explain why a high nutrient percentage does not make a product complete."],sections:[{id:"fortification",title:"Fortification and enrichment",blocks:[{t:"p",x:"**Fortification** means adding vitamins or minerals to a food that does not naturally contain them in significant amounts, or adding more than it naturally contains. **Enrichment** usually refers to restoring nutrients lost during processing, such as iron and B vitamins in refined wheat flour. Some countries require certain staple foods to be fortified, for example with folic acid in wheat flour; others permit voluntary fortification under specific rules."},{t:"callout",kind:"REGIONAL DIFFERENCE",x:"Mandatory fortification programmes differ between countries. Some staple foods are fortified in one market and not in another. India, for example, has standards for fortified rice (check the current FSSAI rules). Look at the label to see whether a nutrient is added, rather than assuming it is present."}]},{id:"reference-values",title:"Nutrient reference values and %DV on fortified foods",blocks:[{t:"p",x:"When a nutrient is declared as a percentage, the percentage is always relative to a reference value. In the US, this is the Daily Value; in the EU, the Nutrient Reference Value. Reference values are set for population guidance and do not reflect individual requirements."},{t:"example",title:"Worked example: %DV for a fortified cereal",steps:["Fictional fortified cereal, per 30 g serving: iron 8 mg; US iron DV 18 mg.","Iron %DV = 8 ÷ 18 × 100 = 44%.","Vitamin D 2 µg per serving; US vitamin D DV 20 µg. %DV = 2 ÷ 20 × 100 = 10%.","The cereal is a meaningful source of these two nutrients in one serving, but the other nutrients in the list (sugar, fibre, protein, fat) still need checking."]}]},{id:"bioavailability",title:"Bioavailability: more than the label",blocks:[{t:"p",x:"**Bioavailability** describes how much of a nutrient the body can absorb and use. It depends on the chemical form of the nutrient, the rest of the food, the person's own physiology and other factors. A label %DV shows the amount declared, not the amount absorbed. This is one reason fortified foods should be understood as one source among many."}]},{id:"plant-alternatives",title:"Fortified plant-based drinks",blocks:[{t:"p",x:"Plant-based drinks (made from soy, oats, almonds, rice, pea or other sources) often have calcium, vitamin D, vitamin B12 or other nutrients added. Their nutrient content varies a great deal between brands and countries. Compare the per-100 ml values with the milk you already use, shake the carton as the label directs (some minerals settle), and check the ingredient list for sugars and sweeteners."},{t:"callout",kind:"CONSUMER MISTAKE",x:"Assuming that a fortified drink is nutritionally equivalent to dairy milk, or that a plant-based drink is automatically fortified. Some are, some are not, and the amounts differ."}]},{id:"upper-limits",title:"High percentages and upper limits",blocks:[{t:"p",x:"A product that provides 100% of a nutrient's reference value may still be nutritionally incomplete. Some nutrients also have upper intake levels, above which intake may be harmful, and supplements can provide amounts that are much higher than food. If you combine fortified products with supplements, check the total intake with a health professional."},{t:"callout",kind:"SAFETY FIRST",x:"Do not use fortified foods or supplements to treat a suspected deficiency or medical condition without advice from a qualified health professional."}]}],takeaways:["Fortified means the nutrient was added; check the label rather than assuming.","%DV is relative to a reference value, not to your personal requirement.","Absorption and the overall diet matter as much as the declared amount."]}],Vg=[{id:"ch12-marketing-language",group:"III",num:"12",title:"The Language of Food Marketing",subtitle:"What consumers may think a claim means, and what it actually communicates",objectives:["Analyse common marketing terms using a six-part method.","Separate regulated terms from voluntary or ambiguous ones.","Avoid automatically labelling any term as fraudulent."],sections:[{id:"six-questions",title:"A six-question method for every claim",blocks:[{t:"ol",items:["What might a shopper think the claim means?","What does the claim actually communicate?","Is there a legal definition anywhere?","Which jurisdiction is being discussed?","Is the statement regulated, voluntary or ambiguous?","What additional information should be checked?"]},{t:"p",x:"Many marketing words have no single legal meaning. Some are controlled only when they appear as a nutrition or health claim. Others are general terms that a company may use with few restrictions, although misleading claims can still be challenged under general consumer-protection and food-information rules. Treat each word as a question to answer, not a verdict."}]},{id:"claim-table",title:"Common marketing terms analysed",blocks:[{t:"table",caption:'Claim analysis. "Ambiguous" means no widely applied definition exists. Always check the rules in the market where you shop.',head:["Claim","Likely shopper meaning","What it may communicate","Legal status (examples)","Check"],rows:[["Natural","Minimally processed, no chemicals",'A company view of "close to nature"','Ambiguous in many markets; the US FDA has an informal policy from 1993; the EU regulates specific terms such as "natural flavouring"',"Ingredient list and processing details"],["All natural","Entirely natural",'Often the same as "natural", but more absolute','Ambiguous; "all" adds no defined meaning',"Whether additives or processing aids are present"],["Clean label","Few or simple ingredients","An industry trend term","No legal definition","The full ingredient list"],["Real food","Unprocessed or wholesome","A design message","No general legal definition in most markets","What the product is made from"],["Fresh","Recently made or harvested","Product condition","Not defined generally; some categories have specific rules","Date marking and storage instructions"],["Pure","Nothing added","A quality message","Some foods (for example, honey or olive oil) have compositional standards","The standard for the category"],["Traditional","Old recipe, authentic","Heritage or method","Some EU products have protected traditional names; otherwise undefined","Any protected name or certification"],["Farm fresh","From a farm, very recent","Origin story","Usually undefined","Origin, dates and producer details"],["Premium","Better quality","Price positioning","No legal definition","Ingredients and price per unit"],["Superfood","Especially healthy","Marketing shorthand","No legal definition; health claims must meet claim rules","Evidence for specific health benefits"],["Wholesome","Healthy and nourishing","A general feeling","No legal definition","Full nutrition declaration"],["Simple ingredients","Few, familiar ingredients","Simplicity","Undefined","Count and identify each ingredient"],["No artificial ingredients","No synthetic additives","A company statement","Undefined in many markets; must not be misleading","Additive names in the list"],["Free from","Lacks a named substance","Depends on the substance",'Specific "free from" claims (gluten, lactose) have rules; generic phrases may be unclear',"The named substance and its thresholds"],["Light / lite","Lower in energy or fat","A comparison with a reference","Defined in several markets, including the EU and US, with thresholds","The reference product and the difference"],["Reduced","Less of something","A comparison with a reference product","Comparative claims need a stated reference and minimum reduction","Reference product and the amount of the difference"],["Low fat","Little fat","Fat content only","Defined thresholds (for example, EU and US)","Energy, sugars and fat type"],["High protein","Lots of protein","Protein content only","Defined thresholds (for example, EU 20% of energy; US 20% DV)","Sugars, sodium and energy"],["High fibre","Lots of fibre","Fibre content only","Defined thresholds; fibre definitions differ","Fibre definition and the ingredients"]]}]},{id:"claim-reasoning",title:"Reasoning about a claim",blocks:[{t:"example",title:'Worked example: "Light" on a fictional snack',steps:['The front says "Light". The shopper may think it is low in energy overall.',"The actual claim is comparative: the product has less energy than a stated reference product.","Check the reference: which product, what size, and what difference?","Read the per-100 g energy and compare it with a similar product, rather than assuming the claim tells you the whole story."]},{t:"callout",kind:"CHECK THE EVIDENCE",x:"A claim is more reliable when it is specific, measurable, defined in law, and supported by the nutrition declaration or certification. Vague terms can still be true in a narrow sense, but they do not give you enough information to compare products."}]}],takeaways:["Ask what each claim communicates and whether it has a legal definition.","Specific, measurable claims are easier to verify than broad feelings."]},{id:"ch13-organic-certification",group:"III",num:"13",title:"Organic, Non-GMO and Certification Claims",subtitle:"What certification means, and what it does not",objectives:["Explain how organic certification and labelling work.","Understand GMO and non-GMO terminology and disclosure rules.","Recognise the limits of certification as a measure of nutrition, safety or environmental performance."],sections:[{id:"organic-rules",title:'What "organic" means in law',blocks:[{t:"p",x:'Organic is a legally defined production system in many countries. It covers how crops and animals are farmed and processed, including restrictions on many synthetic inputs, and rules on record-keeping and traceability. In the **European Union**, Regulation (EU) 2018/848 sets the rules; pre-packed organic food must carry the EU organic logo where it is produced in the EU, along with the code of the control authority or body. In the **United States**, the USDA National Organic Program (7 CFR Part 205) allows labels such as "100% organic", "organic" (at least 95% organic ingredients), and "made with organic ingredients" (at least 70%). The **Codex Alimentarius** provides international guidelines for organic production (GL 32-1999).'},{t:"callout",kind:"REGIONAL DIFFERENCE",x:"Organic rules, logos and thresholds differ between countries. An organic product certified in one market is not automatically certified under another market's rules without meeting its requirements or a recognised equivalence arrangement. Check the logo and the certifier code."}]},{id:"certification-process",title:"How certification works",blocks:[{t:"ul",items:["Operators are registered with a competent authority or an accredited control body.","Farms and processors are inspected, usually at least once a year, with sampling and checks on records.","Products must be traceable from input to final package.","Land or animals may need a **conversion period** before organic status is granted; the length depends on the crop, livestock and rules.","Non-compliance can lead to suspension or removal of the right to use the organic claim."]}]},{id:"gmo-terms",title:"GMO, non-GMO and bioengineered labelling",blocks:[{t:"p",x:`A **genetically modified organism (GMO)** is one whose genetic material has been altered in a way that does not occur naturally. Rules for labelling GMO foods differ. The EU requires labelling of food containing GMOs above a threshold of 0.9% of each ingredient, under Regulation (EC) No 1829/2003 and Regulation (EC) No 1830/2003. The United States uses a national bioengineered food disclosure standard, which may use text, a symbol or a QR code or digital link, depending on the food. A **"non-GMO" claim** is often a private verification. Its meaning depends on the verifier's standard and testing method.`},{t:"callout",kind:"CHECK THE EVIDENCE",x:'A "non-GMO" label on a product made from ingredients that are not usually genetically modified (for example, oats or many fruits) does not show that the product has an advantage over others. Check whether the claim is required, voluntary or private, and what the verifier tests.'}]},{id:"certification-limits",title:"What certification does not guarantee",blocks:[{t:"p",x:"Organic certification shows that a product meets production standards. It does not automatically mean the product is more nutritious, that it is free from all residues, or that it has a smaller environmental footprint in every case. A 2012 systematic review in the Annals of Internal Medicine (Smith-Spangler and colleagues) found limited evidence that organic foods are more nutritious than conventional alternatives, and little evidence of a health benefit for consumers, although some organic products had lower pesticide residue levels. Evidence continues to develop, so read recent reviews before drawing conclusions."},{t:"callout",kind:"WHAT THE SCIENCE SAYS",x:"The conclusion that organic food is not automatically more nutritious is not the same as saying that it is never different. Some studies report differences in particular compounds. Evidence is mixed, and it depends on the crop, season and comparison."}]},{id:"other-certifications",title:"Other certification marks",blocks:[{t:"p",x:"Many products carry private certification marks for animal welfare, fair trade, sustainable forestry or sourcing, and other issues. Each mark has its own standard, scope, inspection method and governance. Some cover only one ingredient or one stage of production. Look up the certifying body, read the standard, and check whether the mark covers the whole product or only part of it."}]}],takeaways:["Organic is a legally defined production system in many countries; logos and thresholds differ.","Certification is a process check, not a guarantee of superior nutrition in every case.","Check the scope and standard behind any certification mark."]},{id:"ch14-dietary-labels",group:"III",num:"14",title:"Vegan, Vegetarian, Gluten-Free, Halal and Other Dietary Labels",subtitle:"Purpose, limits and respect for different needs and beliefs",objectives:["Explain the purpose and limits of common dietary labels.","Distinguish gluten-free claims from general wheat-free descriptions.","Understand cross-contact and why a label cannot guarantee suitability for every person."],sections:[{id:"plant-labels",title:"Vegetarian, vegan and plant-based",blocks:[{t:"p",x:"**Vegetarian** generally means the product contains no meat, poultry, fish or slaughter by-products, but definitions vary; some vegetarians avoid eggs or dairy and some do not. **Vegan** generally means the product contains no animal-derived ingredients, including dairy, eggs and honey, and may also reflect animal-welfare or ethical principles in the production chain. **Plant-based** is usually a marketing description, not a guarantee that every ingredient is free from animal sources."},{t:"callout",kind:"CONSUMER MISTAKE",x:'Assuming "plant-based" means vegan. A product may contain milk powder, egg white or animal-derived enzymes or additives. Check the ingredient list, and the certification if you need a vegan product.'},{t:"p",x:"In India, the veg/non-veg mark required by the Labelling and Display Regulations provides a regulated indication of the food's category, but it does not tell you about every production or ethical detail."}]},{id:"gluten",title:"Gluten-free, coeliac disease and wheat-free",blocks:[{t:"p",x:'**Coeliac disease** is an autoimmune condition triggered by gluten, a protein found in wheat, rye, barley and related grains, and it requires strict avoidance of gluten. A "wheat-free" product is free from wheat, but may still contain barley, rye or oats. A "gluten-free" claim has a defined meaning in many markets. The Codex standard for gluten-free foods limits gluten to no more than 20 mg/kg, and the EU (Regulation (EU) No 828/2014) and US FDA apply the same 20 ppm (mg/kg) threshold for a "gluten-free" claim. Some countries also define "very low gluten" claims.'},{t:"callout",kind:"SAFETY FIRST",x:"A gluten-free claim describes the product against a legal threshold. It does not describe how the food was handled in a shared kitchen or on a shared line, and oats may be cross-contaminated with wheat unless they are specifically sourced. If you have coeliac disease, read the claim, the certification and any cross-contact statement, and consult your health professional."}]},{id:"dairy-lactose",title:"Dairy-free and lactose-free",blocks:[{t:"p",x:'"Dairy-free" usually means the product contains no milk-derived ingredients, while "lactose-free" means the product contains very little or no lactose, the sugar in milk. A lactose-free dairy product still contains milk protein and is not suitable for people with a milk allergy. A dairy-free product can still contain traces of milk from shared equipment. Check the allergen statement and the ingredient list for milk-derived words such as whey, casein, lactose, milk solids and butterfat.'}]},{id:"religious",title:"Halal, kosher and other religious standards",blocks:[{t:"p",x:"**Halal** and **kosher** are religious dietary standards. Their certification is usually issued by a recognised religious or certification authority, which sets its own requirements for ingredients, slaughter, equipment and supervision. Standards and recognised bodies differ between countries and communities. Do not assume that a symbol from one authority is equivalent to another. If you need certification for religious reasons, check which authority issued it and whether it covers the whole product."},{t:"callout",kind:"REGIONAL DIFFERENCE",x:"Some countries regulate the use of halal terms and certification bodies, and others leave it to private certifiers. Check local rules and the certifier's scope."}]},{id:"allergen-free",title:"Allergen-free claims and cross-contact",blocks:[{t:"p",x:`Claims such as "nut-free" or "dairy-free" should be read carefully. Cross-contact means an allergen unintentionally transferred into a product from shared equipment, ingredients or facilities. Some manufacturers use precautionary statements (see Chapter 20). A dietary label is only as reliable as the manufacturer's controls, and it cannot guarantee that a product is safe for every person with an allergy.`}]}],takeaways:["Vegan, vegetarian and plant-based have different meanings; check the ingredients and certifications.","Gluten-free has a defined threshold; wheat-free does not mean gluten-free.","No dietary label replaces an individual medical or religious assessment."]},{id:"ch15-front-of-pack",group:"III",num:"15",title:"Front-of-Pack Nutrition Systems",subtitle:"Traffic lights, letter scores, star ratings and warning symbols",objectives:["Describe the main front-of-pack systems and their status.","Explain why different systems can classify the same food differently.","Use front-of-pack information as a starting point, not a complete verdict."],sections:[{id:"systems",title:"The main systems in use",blocks:[{t:"table",caption:"Front-of-pack systems (status checked during preparation; verify current rules with the official authority)",head:["System","Where used","Mandatory or voluntary","What it shows","Limitation"],rows:[["Traffic-light (multiple) labelling","United Kingdom (and Ireland)","Voluntary","Red, amber or green indicators for fat, saturates, sugars and salt, per portion, with the amount
