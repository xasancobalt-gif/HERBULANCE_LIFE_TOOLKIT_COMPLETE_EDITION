","Shows four nutrients; does not show fibre, protein or ingredient quality"],["Nutri-Score","Several EU countries and Switzerland","Voluntary; EU-wide harmonisation not in place","Letters A to E in colours from dark green to dark red, based on the food's positive and negative components per 100 g","Scores 100 g of food, so portion size is not shown; criteria differ by food category"],["Health Star Rating","Australia and New Zealand","Voluntary (ministers have reportedly asked FSANZ to consider a mandatory option; verify)","Star rating from 0.5 to 5, with the energy shown","Star rating depends on the algorithm; can favour some foods over others"],['"High in" symbols',"Canada","Mandatory from 1 January 2026 for products exceeding thresholds for saturated fat, sugars or sodium",'A standard "High in" symbol on the principal display panel',"Covers only three nutrients; no positive nutrients"],["Warning octagons","Chile (Law 20.606); other markets use similar warning seals","Mandatory in those markets",'Black warning labels such as "High in sugars"',"Covers only nutrients above thresholds; does not show portion size"],["Nutrient-level summaries (for example, Italy's NutrInform Battery)","Italy and other markets","Voluntary","Batteries or bars showing the amount of nutrients per portion","Does not give an overall grade"]]},{t:"figure",id:"fop-systems",caption:"Figure 15.1 — Generic illustration of three approaches: colour-coded levels, a letter scale and star ratings. These are not official designs.",alt:"Three illustrative front-of-pack approaches: a row of red, amber and green chips for levels, a five-step letter scale from A to E with colours from green to red, and a row of five stars with half a star."}]},{id:"why-differ",title:"Why systems can disagree about the same food",blocks:[{t:"ul",items:["**Different nutrients.** Some systems include fibre, protein or fruit and vegetable content; others do not.","**Different bases.** Some score per 100 g; others per serving or per portion.",'**Different thresholds.** A "high" sugar level is defined differently in each system.',"**Different food categories.** Criteria may vary for cheese, cereals, drinks or oils.","**Different purposes.** Some systems aim to inform shoppers; others aim to identify foods that should be restricted in advertising or in schools."]},{t:"example",title:"Worked example: one fictional yoghurt, three systems",steps:["Fictional plain yoghurt, 150 g pot, no fruit; sugars 4 g per 100 g, saturates 3 g per 100 g, salt 0.1 g per 100 g.","A system that scores per 100 g and counts protein positively may give a favourable grade.",'A system that uses "high" thresholds for saturates may flag the product as high in saturated fat if the threshold is low.',"The same food can therefore be classified differently. Read the system's criteria, then apply them to your own priorities."]}]},{id:"fop-limits",title:"Limits of front-of-pack symbols",blocks:[{t:"callout",kind:"CHECK THE EVIDENCE",x:"Front-of-pack systems are designed to make a few nutrients easier to see at the point of purchase. They are useful for comparing similar foods, but they do not capture the whole quality of a food, the portion you will eat, your personal needs, or the overall balance of your diet."},{t:"p",x:"Systems also change. Nutri-Score has been the subject of ongoing debate about EU-wide harmonisation, and Canada's symbol requirements came into force in 2026. Check the current status before relying on any symbol for a decision."}]}],takeaways:["A front-of-pack symbol summarises one system's criteria; learn those criteria.","Systems can disagree because they measure different things on different bases."]},{id:"ch16-health-claims",group:"III",num:"16",title:"Health and Nutrition Claims",subtitle:"Authorised, substantiated, qualified or restricted",objectives:["Distinguish nutrition content, comparative, health, disease-risk and function claims.","Ask whether a claim is authorised, substantiated and appropriately qualified.","Understand why supplement claims are treated differently in many markets."],sections:[{id:"claim-types",title:"Types of claim",blocks:[{t:"table",caption:"Claim types (hypothetical wording; examples are educational, not quotations of real products)",head:["Type","What it describes","Example wording (hypothetical)","Typical control"],rows:[["Nutrition content claim","The level of a nutrient or energy",'"High in fibre"',"Defined thresholds (for example, in EU Regulation (EC) 1924/2006)"],["Comparative claim","A difference from a reference product",'"25% less sugar than our standard cereal"',"Stated reference and minimum difference"],["Health claim","A relationship between a food and health",'"Calcium helps maintain normal bones"',"Authorised claims lists (for example, EU); pre-approval in some systems"],["Disease-risk reduction claim","Reduced risk of a disease",'"Helps reduce the risk of heart disease"',"Strictly controlled; often not permitted without authorisation"],["General wellness statement",'A vague benefit, such as "for your wellbeing"','"Nourishes your body every day"',"Varies; may be treated as misleading if unsubstantiated"],["Structure/function claim (US)","How a nutrient affects normal body structure or function",'"Supports healthy digestion"',"Must be truthful; must carry a disclaimer that FDA has not evaluated it"],["Supplement claim","A benefit of a supplement product",'"Boosts immunity"',"Supplement rules; claims often restricted"]]}]},{id:"questions",title:"Questions to ask about any health claim",blocks:[{t:"ol",items:["Is the claim about a nutrient, a health outcome, or a general feeling?","Is it permitted in the market where I am buying it, and under which rule?","Does it name the amount of food or nutrient needed to achieve the effect?","Does the product meet the conditions the rule sets for the claim?","Is there a disclaimer, and is it easy to see?","What does the wider evidence say, and does it apply to me?"]},{t:"callout",kind:"REGIONAL DIFFERENCE",x:"In the EU, health claims are generally permitted only if they are on the authorised list and meet the conditions of use. In the US, structure/function claims may be made without FDA pre-approval, but they must be truthful and not misleading, and they must carry the standard disclaimer. These are different systems. Do not assume one country's wording is permitted elsewhere."}]},{id:"supplements",title:"Supplement marketing",blocks:[{t:"p",x:"Dietary supplements are regulated differently from foods in many countries. Some markets restrict the claims that supplements can make, and some require pre-market notification or approval. A supplement that is sold as a capsule, powder or drink can still make claims that are not permitted for a food. Be cautious of statements that promise cures, guaranteed results or rapid improvements, and speak to a health professional before using supplements, particularly if you are pregnant, taking medicines or have a medical condition."},{t:"callout",kind:"SAFETY FIRST",x:"Some supplements and herbal products can interact with medicines or cause harm at high doses. Do not use a product's marketing to decide whether it is safe for you."}]}],takeaways:["Identify the claim type before judging it.","Authorised, substantiated, qualified and restricted are different questions."]},{id:"ch17-advertising",group:"III",num:"17",title:"How Advertising Influences Food Choices",subtitle:"Persuasive design and verifiable product information",objectives:["Identify design features that influence perception.","Separate persuasive presentation from verifiable product information.","Recognise endorsement, disclosure and children's marketing issues."],sections:[{id:"design",title:"Colour, typography and imagery",blocks:[{t:"p",x:"Design shapes first impressions. Green and earth tones often suggest nature; gold and black can suggest premium quality; bright primary colours suggest fun for children. Large, bold typography makes claims easier to notice, and small print is easy to overlook. Pictures of fruit, grains or herbs may suggest that these ingredients are a major part of the product, even when they are a small part of the recipe. Use the ingredient list and the quantitative declarations (see Chapter 2) to check the picture."},{t:"callout",kind:"CHECK THE EVIDENCE",x:"A picture of strawberries on a yoghurt is a design choice. In the EU, where an ingredient is emphasised in words, pictures or graphics, a quantitative ingredient declaration is generally required; check the ingredient list for the actual amount."}]},{id:"halo-premium",title:"Health halos, premium positioning and scarcity",blocks:[{t:"ul",items:['**Health halo:** a product is made to look healthy through words such as "pure", "active" or "natural", even when its nutrition profile is mixed.',"**Premium positioning:** a higher price and sophisticated design may suggest higher quality, which the label may or may not show.",'**Scarcity messaging:** "limited edition" or "only today" can encourage a quick decision, but it does not change the product.',"**Emotional marketing:** stories about family, tradition or nature can make a product feel meaningful, separate from its content."]}]},{id:"endorsement",title:"Endorsements, influencers and disclosure",blocks:[{t:"p",x:"Celebrity and influencer endorsements can be paid, gifted or free. Many countries require paid or commercial relationships to be disclosed clearly. For example, US Federal Trade Commission Endorsement Guides (16 CFR Part 255) explain that material connections must be disclosed, and the UK Advertising Standards Authority and the Competition and Markets Authority have guidance on influencer marketing. Social proof (such as large follower counts or reviews) is not verification of product content."}]},{id:"children",title:"Marketing to children",blocks:[{t:"p",x:"The World Health Organization's recommendations on the marketing of foods and non-alcoholic beverages to children (2010) encourage governments to reduce the exposure and power of food marketing aimed at children. Many countries have their own restrictions on advertising high-fat, high-sugar or high-salt foods to children, and on promotions and toys. Parents and carers can use label information, and the ingredients and nutrition declaration, to make decisions for children."}]},{id:"online-ads",title:"Online descriptions and search advertising",blocks:[{t:"p",x:"Online product pages and sponsored search results can highlight the features a company wants you to see. They may use images that differ from the current packaging, show only some nutrients, or place a sponsored result above other options. Check the product's packaging, and compare several sources before deciding."},{t:"callout",kind:"CONSUMER MISTAKE",x:"Treating a persuasive design as evidence. Good design can make a product look appealing without changing its ingredients or nutrition. Separate what is designed to attract you from what is verifiable."}]}],takeaways:["Design influences attention; the ingredient list and nutrition declaration provide verifiable information.","Endorsements and social proof should be assessed for disclosure and relevance."]}],Kg=[{id:"ch18-additives",group:"IV",num:"18",title:"Understanding Food Additives",subtitle:"Functions, names, codes and how authorisation works",objectives:["Identify the main functional classes of food additive.","Read additive names and codes, and understand where they come from.","Explain how safety evaluation considers dose and exposure."],sections:[{id:"what-additives-do",title:"What additives are for",blocks:[{t:"p",x:"A **food additive** is a substance added to food for a technological purpose, such as preserving it, improving texture, stabilising colour or helping ingredients mix. The Codex General Standard for Food Additives (GSFA, CXS 192-1995) groups additives into functional classes. The table below describes the main classes you will see on labels."},{t:"table",caption:"Functional classes of food additive (names follow Codex and common labelling practice)",head:["Class","Function","Example (E-number in the EU system)"],rows:[["Preservatives","Slow microbial growth or spoilage","Sodium benzoate (E211); potassium sorbate (E202)"],["Antioxidants","Slow oxidation of fats and other components","Ascorbic acid (E300); tocopherols (E306–E309)"],["Colours","Add, restore or stabilise colour","Annatto (E160b); beetroot red (E162); caramel colours (E150a–d)"],["Emulsifiers","Help oil and water stay mixed","Lecithins (E322); mono- and diglycerides of fatty acids (E471)"],["Stabilisers and thickeners","Control texture and viscosity","Xanthan gum (E415); carrageenan (E407)"],["Gelling agents","Form gels","Pectin (E440); agar (E406)"],["Acidity regulators","Control acidity or pH","Citric acid (E330)"],["Flavour enhancers","Strengthen existing flavours","Monosodium glutamate (E621)"],["Sweeteners","Provide sweetness","Sucralose (E955); steviol glycosides (E960)"],["Humectants","Retain moisture","Glycerol (E422); sorbitol (E420)"],["Anti-caking agents","Keep powders free-flowing","Silicon dioxide (E551)"],["Raising agents","Release gas for leavening","Sodium bicarbonate (E500)"]]},{t:"callout",kind:"LABEL DECODER",x:"E-numbers are the European system for additives authorised in the EU. Codex uses INS numbers, which largely match. Some additives are permitted in one country and not another, and some names are used for the same substance. Do not assume that a number means the same thing everywhere without checking."}]},{id:"authorisation",title:"How authorisation works",blocks:[{t:"p",x:'In the EU, food additives are authorised under Regulation (EC) No 1333/2008 and listed in a Union list, with conditions of use for each food category. In the United States, additives are approved by the FDA, or used under "generally recognised as safe" (GRAS) status. Many countries use the scientific opinions of the **Joint FAO/WHO Expert Committee on Food Additives (JECFA)** and the **European Food Safety Authority (EFSA)** as references, but each jurisdiction makes its own decisions.'},{t:"p",x:"Safety evaluations typically set an **acceptable daily intake (ADI)**, expressed as milligrams per kilogram of body weight per day, based on the amount that can be consumed daily over a lifetime without appreciable risk. Exposure is then estimated from the foods where the additive is permitted, at the levels permitted. This is why dose and exposure matter: the same substance can be safe at one level and not at another."},{t:"callout",kind:"CHECK THE EVIDENCE",x:"An approved additive has been evaluated for specific uses and levels. Approval is not a claim that the additive is beneficial, and a long name is not evidence that it is harmful."}]},{id:"selected-examples",title:"Selected examples with verifiable context",blocks:[{t:"ul",items:["**Lecithins** (E322) are emulsifiers, often from soybean or sunflower. Soy lecithin is a soy-derived ingredient, so check the allergen rules where you shop, because refined derivatives may be treated differently in some systems.","**Pectin** (E440) is a gelling and thickening agent extracted mainly from citrus peel or apple pomace. It is also a naturally occurring fibre in fruit.","**Ascorbic acid** (E300) is vitamin C. Its function as an antioxidant helps prevent browning and fat oxidation, and it is also a nutrient.","**Citric acid** (E330) is an acidity regulator found naturally in citrus fruits and widely produced by fermentation.","**Sodium benzoate** (E211) is a preservative. In some acidic soft drinks containing benzoate and ascorbic acid, benzene can form under certain conditions of heat and storage. Regulators set limits and monitor this; see Chapter 19.","**Monosodium glutamate** (E621) is a flavour enhancer. EFSA has evaluated glutamates and concluded that they are not of safety concern at reported levels of use; some people report sensitivity, but controlled studies have not consistently confirmed a reaction."]},{t:"callout",kind:"CONSUMER MISTAKE",x:"Treating natural ingredients as automatically safer. Natural substances can be hazardous at high doses, and some additives derived from natural sources are highly purified and carefully regulated. The question is always the use, the level and the evidence."}]}],takeaways:["Additives are classified by function; learn the classes.","Authorisation is use- and level-specific and varies by jurisdiction.",'Neither "natural" nor a long name tells you the safety profile by itself.']},{id:"ch19-preservatives-colours-flavourings",group:"IV",num:"19",title:"Preservatives, Colours and Flavourings",subtitle:"Preserving food, stabilising colour and describing flavour",objectives:["Explain how food is preserved, and where additives fit in.","Understand natural and artificial flavouring terminology.","Separate permitted use from unlimited consumption."],sections:[{id:"preservation",title:"How food is preserved",blocks:[{t:"p",x:"Preservation controls three main threats: **microbial growth**, **oxidation** and **physical change**. Heat treatment (such as pasteurisation or canning), drying, fermentation, acidification, refrigeration, freezing, reduced water activity (salt, sugar), and modified-atmosphere packaging all work without additives. Preservatives such as sorbates, benzoates and natamycin add a further barrier in some foods. Antioxidants such as tocopherols and ascorbic acid slow fat oxidation, which causes rancidity."},{t:"callout",kind:"CHECK THE EVIDENCE",x:"Preservatives are not all alike, and not all preservatives are needed in every food. Many traditional foods, from pickles to cured fish, rely on preservation methods that do not require added chemicals. Preservatives are not inherently dangerous, and regulators set limits for each use."}]},{id:"colours",title:"Colours",blocks:[{t:"p",x:"Colours are added to restore colour lost in processing, to standardise appearance, or to improve appeal. Some colours are natural extracts (such as annatto, beetroot or paprika extract) and some are synthetic. Caramel colours are produced by heating carbohydrates and come in several classes. Regulators assess each colour for each permitted use. Some markets require a warning statement for certain colours; check the rules where you shop."},{t:"callout",kind:"REGIONAL DIFFERENCE",x:'Some colours permitted in one country are restricted or not permitted in another, and some countries require a warning on products containing certain colours (for example, a "may have an adverse effect on activity and attention in children" statement in the EU for some specific colours). Check the local rule.'}]},{id:"flavourings",title:"Flavourings: natural, nature-identical and artificial",blocks:[{t:"p",x:'The EU, under Regulation (EC) No 1334/2008, classifies flavourings into **natural flavouring substances**, **nature-identical** flavouring substances and **artificial** flavouring substances. In the United States, 21 CFR 101.22 defines "natural flavour" as derived from a natural source such as a spice, fruit, vegetable, meat or dairy product. **Smoke flavourings** are regulated separately in the EU (Regulation (EC) No 2065/2003). The term "natural flavouring" does not mean the flavour is a whole fruit or spice; it describes the origin of the flavouring material.'},{t:"callout",kind:"LABEL DECODER",x:'"Natural flavouring" describes where a flavouring substance comes from; it does not tell you how much of the named food is present. "Vanilla flavour" may come from vanilla beans or other sources. Check whether the label says "vanilla extract" or "vanilla flavour" to understand the source.'}]},{id:"permitted-use",title:"Permitted use is not unlimited consumption",blocks:[{t:"p",x:"A substance that is authorised for a specific food, at a specified maximum level, has been judged acceptable for that use. It is not a statement that the substance can be consumed without limit, and it does not mean the amount in a food is unimportant. Consider the number of servings, the number of products that contain the same additive, and your own circumstances. Official evaluations are the place to check these details."}]}],takeaways:["Most preservation works through physical methods; additives add extra control where needed.","Flavouring terms describe the origin of the flavouring, not the amount of the named food.","Authorised use does not mean unlimited use."]},{id:"ch20-allergens",group:"IV",num:"20",title:"Allergens and Precautionary Labels",subtitle:"Read this chapter carefully. Incorrect information can affect safety.",objectives:["Name the major allergen groups and explain how they are declared.",'Interpret "Contains" and precautionary "may contain" statements.',"Recognise hidden allergen names and the limits of online and photographed information.","Know when and how to verify information with a manufacturer or authority."],sections:[{id:"why-matters",title:"Why allergen information matters",blocks:[{t:"callout",kind:"SAFETY FIRST",x:"A food allergy is an immune reaction to a food protein. Reactions can range from mild to severe, including anaphylaxis, which can be life-threatening. Food intolerances (such as lactose intolerance) work differently and are not allergies. This chapter explains labelling; it does not provide medical advice. If you or someone in your household has a food allergy, follow the plan agreed with your health professional and check every product, every time."},{t:"p",x:"Allergen labelling is one of the most standardised parts of food law, yet the lists and rules are not identical worldwide. Some systems name more allergens, some require different wording, and some treat derivatives differently. The **Allergen Awareness Explorer** tool compares selected jurisdictions, but it cannot verify any product."}]},{id:"major-lists",title:"Major allergens and how they are named",blocks:[{t:"p",x:"The Codex General Standard for the Labelling of Pre-Packaged Foods lists foods and ingredients known to cause hypersensitivity, including cereals containing gluten, crustaceans, eggs, fish, peanuts, soybeans, milk, tree nuts, sesame and sulphites at 10 mg/kg or above. Individual countries add or adjust items. In the EU, Regulation (EU) No 1169/2011 Annex II lists 14 groups: cereals containing gluten; crustaceans; eggs; fish; peanuts; soybeans; milk; nuts; celery; mustard; sesame seeds; sulphur dioxide and sulphites above 10 mg/kg; lupin; and molluscs. In the United States, the major allergens under federal law include milk, eggs, fish, crustacean shellfish, tree nuts, peanuts, wheat, soybeans and sesame (sesame added from 1 January 2023). Check the current official text for each market."},{t:"callout",kind:"REGIONAL DIFFERENCE",x:'The EU list includes celery, mustard and lupin, which are not on the US federal major-allergen list. Australia and New Zealand require "Contains" declarations for a list that includes lupin and molluscs. Canada and India use their own lists. A product that is labelled under one system may not show every allergen named by another.'}]},{id:"how-declared",title:"How allergens are declared on the package",blocks:[{t:"ul",items:["**Emphasis within the ingredient list.** Many systems (including the EU) require allergens to be emphasised, for example in bold, capitals or a contrasting style.",'**A separate "Contains" statement.** Australia and New Zealand require a summary statement starting with a bold "Contains" that lists the allergens in plain English. India uses a "Contains" declaration for allergy-causing ingredients. Many other systems use a similar statement.','**Parenthetical naming.** Some systems (including US labels) allow an allergen to be named in brackets within the ingredient list, such as "whey (milk)".','**Plain-English names.** Under some rules, allergens must be named with a common word (for example "milk") rather than a technical term (for example "casein") in the declaration.']},{t:"figure",id:"allergen-highlight",caption:'Figure 20.1 — Fictional ingredient list showing allergen emphasis and a "Contains" summary. This is an educational simulation, not a regulatory template.',alt:"A fictional ingredient list where allergen words are shown in bold, followed by a Contains summary line naming wheat, milk and sesame, and a separate may-contain line naming peanuts as a precautionary statement."}]},{id:"hidden-names",title:"Hidden allergen names to recognise",blocks:[{t:"p",x:"Allergens are sometimes disguised by technical or regional names. The list below gives examples. It is not complete, and the presence of a name does not mean an allergen is present in a given product. The purpose is to help you spot words that need checking."},{t:"table",caption:"Examples of names that may point to an allergen",head:["Allergen group","Example names to check"],rows:[["Milk","Casein, caseinate, whey, lactose, milk solids, butter, ghee, cream, curd"],["Egg","Albumin (albumen), globulin, lysozyme, ovomucoid, mayonnaise"],["Wheat and gluten cereals","Semolina, durum, spelt, bulgur, couscous, farina, malt (barley-based), some soy sauces"],["Fish","Anchovy, fish sauce, surimi, Worcestershire sauce (may contain anchovy)"],["Crustaceans and molluscs","Shrimp paste, oyster sauce, prawn or crab flavouring, squid ink, abalone"],["Peanuts","Groundnut, arachis oil, some satay sauces, mixed-nut products"],["Tree nuts","Almond, hazelnut, walnut, cashew, pistachio, pecan, macadamia, Brazil nut, praline, marzipan"],["Soy","Tofu, tempeh, edamame, miso, soy lecithin, textured soy protein"],["Sesame","Tahini, gingelly, benne, sesame oil, halva"],["Mustard","Mustard seed, mustard flour, some sauces and dressings"],["Celery","Celeriac, celery salt, some stock powders"],["Sulphites","Sulphur dioxide (E220), sodium metabisulphite (E223), potassium metabisulphite (E224)"]]},{t:"callout",kind:"SAFETY FIRST",x:"Never assume an allergen is absent because a word does not appear in a photograph, a short product description or a search result. Read the complete ingredient list and allergen statement on the physical package at the time of purchase and before each use."}]},{id:"precautionary",title:'"May contain" and precautionary allergen labelling',blocks:[{t:"p",x:'A **precautionary allergen label** (often "may contain" or "may be present") indicates that cross-contact with an allergen is possible during manufacture, for example on shared equipment. Precautionary labelling is generally voluntary, although it must be accurate. In Australia and New Zealand, "may contain" statements are not mandatory and must be kept separate from the mandatory "Contains" statement. Precautionary statements do not indicate how much allergen may be present, and they do not indicate that the allergen is present in every batch.'},{t:"callout",kind:"SAFETY FIRST",x:"If a product carries a precautionary statement for an allergen you must avoid, ask the manufacturer about its controls and follow the advice of your health professional. Do not treat the absence of a precautionary statement as proof of absence."}]},{id:"non-prepacked",title:"Restaurants, bakeries and non-pre-packed food",blocks:[{t:"p",x:"Allergen information for food that is not pre-packed is handled differently. In the EU, Regulation (EU) No 1169/2011 requires allergen information to be available for non-pre-packed food, although it may be provided in different ways. In India, food service establishments must provide allergen information against menu items under the Labelling and Display Regulations, 2020. In many other places, information is requested verbally or through an allergen matrix. Shared kitchens, fryers and equipment can create cross-contact. Ask staff directly and verify with the business."}]},{id:"online-allergens",title:"Online product pages and loose or bulk foods",blocks:[{t:"p",x:"Online information may not show the latest packaging. Recipes change, suppliers change and product pages can be out of date. Loose or bulk foods (for example, from open bins) may have no labels at all. For these products, ask the seller or the manufacturer, and do not rely on the product name alone."},{t:"ol",items:["Find the physical package, or the current ingredient list from the manufacturer.","Read the full ingredient list and the allergen statement, including any precautionary line.","Check the product code and date against the manufacturer's current information if anything is unclear.","Contact the manufacturer or the relevant food authority if you still have questions.","Record the product name, batch code and date of purchase, and keep the packaging until you are sure."]}]},{id:"worked-allergen",title:"Worked example: reading an allergen statement",blocks:[{t:"example",title:"Fictional seeded loaf (educational simulation)",steps:["Ingredient list: wheat flour, water, sunflower seeds, **sesame seeds**, salt, yeast, **milk powder**.","The emphasised words show the allergens in the ingredient list: sesame seeds and milk powder.","Contains summary: wheat, sesame, milk. This matches the emphasised ingredients and adds wheat, which appears as wheat flour.","May contain: peanuts. This is a precautionary statement from shared equipment. It is not an ingredient.","Conclusion for this simulated product: it contains wheat, sesame and milk, and carries a precautionary peanut statement. A person with any of those allergies must decide with their health professional whether the product is suitable. The label cannot make that decision for them."]}]}],takeaways:["Allergen lists and rules differ by jurisdiction; check the market where the food is sold.","Read the full ingredient list and the allergen statement on the physical package every time.","Precautionary statements indicate cross-contact risk; they are not ingredients.","No label, photograph or online summary can guarantee that a product is safe for a specific allergic person."]},{id:"ch21-dates-storage",group:"IV",num:"21",title:"Date Marking, Food Storage and Product Safety",subtitle:"Safety dates, quality dates and the signs that matter",objectives:["Distinguish use by, best before and other date markings.","Explain how storage instructions protect food quality and safety.","Recognise packaging and food signs that call for caution, and their limits."],sections:[{id:"date-types",title:"The main date markings",blocks:[{t:"table",caption:"Date markings are not interchangeable. Rules differ by country and category.",head:["Marking","Usual purpose","What it means for you"],rows:[["Use by","Safety, for perishable foods that may become unsafe","Do not eat or sell after that date (for example, soft cheese or ready meals in the UK guidance)"],["Best before","Quality, for most foods","The food should be at its best up to the date. It may still be safe to eat afterwards if it has been stored correctly and checked"],["Best before end","Quality, used in some markets","Similar to best before, with the end of the period stated"],["Sell by","Stock control for retailers","Information for shops. Many guidelines recommend removing it from consumer packaging"],["Display until","Stock control","Information for shops; not a consumer safety date"],["Production or packing date","Traceability and shelf-life calculation","Helps you work out how long a product has been in the supply chain"],["Expiration date","Used in some markets for specific products","For infant formula and some other products, an expiry date may be required; read the local rules"]]},{t:"callout",kind:"REGIONAL DIFFERENCE",x:`The UK's Food Standards Agency describes "use by" as the safety date and "best before" as the quality date. In the EU, Regulation (EU) No 1169/2011 uses "use by" for microbiologically perishable foods and "date of minimum durability" (best before). In the US, most dates are voluntary quality indicators, while infant formula is subject to specific rules. Canada and Australia have their own rules. Check the official guidance for the country where you shop.`}]},{id:"storage",title:"Storage instructions",blocks:[{t:"p",x:'Storage instructions are part of the safety information. Follow them exactly: "keep refrigerated", "store below 25 °C", "keep in a cool, dry place", "once opened, consume within 3 days" and "keep frozen" mean what they say. Many national authorities advise keeping a domestic fridge at 5 °C or below, and a freezer at −18 °C or below. Once a product is opened, its shelf life may change and the after-opening instructions take priority.'},{t:"figure",id:"storage-icons",caption:"Figure 21.1 — Generic storage categories. Your label's instructions take priority over general guidance.",alt:"Four generic storage categories shown with simple icons and text: keep cool or refrigerated, keep frozen, keep in a cool dry place, and follow after-opening instructions."}]},{id:"damage-signs",title:"Packaging and food signs that call for caution",blocks:[{t:"ul",items:["Swollen, bulging or leaking cans, jars or pouches. Bulging can indicate gas production; do not taste the product to check.","Broken, missing or damaged seals, or a jar lid that has popped or is not sealed.","Deep dents, especially on seams, or significant rust on cans.","Mould, unusual discolouration or a slimy texture where it should not be.","Storage errors: a product left at room temperature when it should be chilled, or thawed and refrozen."]},{t:"callout",kind:"SAFETY FIRST",x:"Smell and appearance alone cannot establish that a food is safe. Some harmful bacteria and toxins do not change the smell or look of food. If a product shows any sign of damage, leakage, swelling or storage problems, do not eat it and discard it according to local guidance. When in doubt, throw it out."}]},{id:"safety-quality",title:"Food safety versus food quality",blocks:[{t:"p",x:"A safety date and a quality date answer different questions. A quality date tells you when a food may start to lose flavour, colour, texture or crispness. A safety date tells you when a food may become unsafe if it is not kept under the right conditions. Using the right date for the right question helps reduce both food waste and foodborne illness."},{t:"callout",kind:"CONSUMER MISTAKE",x:"Treating every date as a strict deadline, or treating every date as a suggestion. Read the wording on the label, and check the storage instructions."}]}],takeaways:["Use by is a safety date; best before is a quality date in most systems.","Follow storage and after-opening instructions as part of the safety information.","Damaged packaging is a reason for caution; appearance and smell are not sufficient checks."]},{id:"ch22-packaging",group:"IV",num:"22",title:"Packaging Materials and Food Contact Safety",subtitle:"Protection, migration, reheating, reuse and recycling",objectives:["Identify the main packaging materials and their roles.","Explain food-contact rules and the concepts of migration and exposure.","Use reheating, reuse and recycling information correctly."],sections:[{id:"materials",title:"Common packaging materials",blocks:[{t:"table",caption:"Packaging types and typical roles",head:["Type","Typical use","Main protective role"],rows:[["Glass","Jars, bottles","Inert, impermeable barrier; reusable and recyclable where systems exist"],["Metal (tinplate, aluminium)","Cans, lids, foil","Strong barrier to light, oxygen and moisture; suitable for heat processing"],["Paperboard","Boxes, trays, folding cartons","Structure and printing; often combined with barrier layers"],["Flexible plastics (for example, PE, PP)","Bags, pouches, films","Light, lightweight barrier; variable barrier properties"],["Rigid plastics (for example, PET, HDPE, PP)","Bottles, tubs, trays","Shape and strength; barrier varies by polymer"],["Laminates and multilayer films","Snack bags, meat trays","Combine layers for oxygen, moisture and light barrier"],["Cartons (composite)","Milk, juice, soups","Paperboard with thin plastic and sometimes aluminium layers for liquid and oxygen barrier"],["Reusable containers","Jars, lunch boxes, bottles","Designed for repeated use; cleaning and condition matter"]]}]},{id:"food-contact",title:"Food-contact materials and migration",blocks:[{t:"p",x:"Materials that touch food are regulated. The EU framework is Regulation (EC) No 1935/2004, with specific measures such as Regulation (EU) No 10/2011 for plastics. These rules set limits for **specific migration** of substances from the packaging into food, and require manufacturers to show that their materials are suitable for food contact. The US FDA regulates food-contact substances through a premarket process. Migration is measured in small amounts, and the risk depends on the substance, the level, the food, the temperature and the time of contact."},{t:"callout",kind:"CHECK THE EVIDENCE",x:"The presence of a substance that can migrate in trace amounts is not, by itself, a demonstration of harm. Authorisation and migration limits are designed to keep exposure within safe levels. Avoid panic-based claims; check the official evaluation and the packaging's food-contact declaration."}]},{id:"heating-reuse",title:"Reheating, microwave suitability and reuse",blocks:[{t:"ul",items:['Follow the instructions on the package. Only heat in packaging labelled for that purpose (for example, "microwave safe" or "oven safe").',"Vent films or lids as directed, and do not heat sealed containers unless the instructions say they can be heated.","Single-use packaging is not always designed for repeated use. Washing and reusing thin plastic can damage it and change its properties.","Glass jars and metal containers may be reused for storage if they are clean, undamaged and suitable for the food.","Do not reuse packaging that was used for chemicals, pesticides or non-food products."]}]},{id:"recycling",title:"Recyclable does not always mean recycled in your area",blocks:[{t:"p",x:'A package may be **technically recyclable**, meaning its materials can be recycled in principle. Whether it is **recyclable in your local system** depends on local collection, sorting and processing facilities. A recycling symbol, such as a loop of arrows, does not by itself confirm local acceptance. Check your local waste authority, and remember that many systems accept only certain plastics, cartons or metals. Labels such as "compostable" or "biodegradable" depend on specific standards and conditions; for example, the EU standard EN 13432 applies to industrial composting of packaging. Read the claim, the standard and the conditions.'}]}],takeaways:["Packaging materials are chosen for protection, safety and performance.","Food-contact rules control migration; avoid panic and check the official basis.","Technically recyclable and locally recyclable are different things."]}],Qg=[{id:"ch23-compare",group:"V",num:"23",title:"Compare Products Like an Informed Consumer",subtitle:"A repeatable method, with eleven worked scenarios",objectives:["Apply a fourteen-step comparison method to any two or more products.","Convert values to equivalent bases before comparing.","Explain trade-offs and avoid declaring a universal winner."],sections:[{id:"method",title:"The comparison method",blocks:[{t:"ol",items:["Confirm **product identity**: the legal or descriptive name and what it is for.","Check the **serving information** and net quantity.","Convert nutrition to **per 100 g or 100 ml**, where available.","Compare **energy**.","Compare **sugars**, noting total or added sugars.","Compare **saturated fat**.","Compare **sodium or salt**.","Compare **fibre**.","Compare **protein**.","Read the **ingredients** for differences in composition and processing.","Check the **allergen** statements.","Calculate the **price per unit** on the same basis.","Check **storage** and **shelf-life** information.","Consider your **relevant personal requirements** and preferences."]},{t:"callout",kind:"SAFETY FIRST",x:"Step 11 is never optional for people with allergies or intolerances. A favourable nutrition comparison does not make a product suitable for someone who must avoid an ingredient."}]},{id:"fair-comparison",title:"When products cannot be compared fairly",blocks:[{t:"p",x:"Two products with different purposes may not be directly comparable. A breakfast cereal, a dessert and a sandwich bread have different roles in a day of eating. A ready meal is designed as a complete plate; a soup may be a starter. Compare products that are used in similar ways, and state the purpose when you record the comparison."},{t:"callout",kind:"QUICK COMPARISON",x:"Per 100 g shows composition; per serving shows a typical amount; per pack shows the whole item. Each answers a different question. Pick the one that matches the decision you are making."}]},{id:"scenarios",title:"Eleven worked comparison scenarios",blocks:[{t:"p",x:"The products below are **fictional educational simulations**. Their values are invented to show the method and are not real food-composition data. Product codes (P01 and so on) match the Product Comparison Tool."},{t:"example",title:"Scenario 1 — Breakfast cereals (P01 Oat Crunch vs P02 Honey Puffs)",steps:["Per 100 g sugars: P01 12 g; P02 30 g. Per 40 g serving (P01) sugars = 4.8 g; per 30 g serving (P02) = 9.0 g.","Per 100 g fibre: P01 8.0 g; P02 3.0 g. Per serving: P01 3.2 g; P02 0.9 g.","Price per 100 g: P01 2.80 ÷ 500 × 100 = 0.56; P02 2.40 ÷ 375 × 100 = 0.64.","Trade-off: P01 is lower in sugar and higher in fibre per 100 g, and lower in price per 100 g. P02 may suit a preference for a sweeter taste and lists added vitamins and minerals on its fictional label. No universal winner."]},{t:"example",title:"Scenario 2 — Bread (P03 Seeded Wholemeal vs P04 Soft White)",steps:["Ingredients: P03 lists wholemeal wheat flour first; P04 lists wheat flour (refined) first.","Fibre per 100 g: P03 7.5 g; P04 2.5 g. Per 50 g slice: P03 3.75 g; P04 1.25 g.","Sodium per 100 g: P03 480 mg; P04 520 mg. Per slice: P03 240 mg; P04 260 mg.","Price per 100 g: P03 1.90 ÷ 600 × 100 = 0.32; P04 1.50 ÷ 500 × 100 = 0.30.","Trade-off: P03 has more fibre and sesame, and a higher price per 100 g. P04 has a lower price, a softer texture, and less fibre. Both contain wheat."]},{t:"example",title:"Scenario 3 — Yoghurt (P05 Plain vs P06 Strawberry)",steps:["Sugars per 100 g: P05 4.7 g; P06 11.5 g. Per 125 g serving of P06: 11.5 × 1.25 = 14.4 g.","Protein per 100 g: P05 3.5 g; P06 3.8 g. The difference is small.","Price per 100 g: P05 1.80 ÷ 500 × 100 = 0.36; P06 2.20 ÷ 500 × 100 = 0.44.",'The EU-style label shows only total sugars. Some sugar in both products is natural lactose from milk. Only the ingredient list shows whether sugar has been added, which is why P06 lists "sugar" among its ingredients.']},{t:"example",title:"Scenario 4 — Plant-based drinks (P07 Oat Drink vs P08 Almond Drink)",steps:["Per 100 ml energy: P07 42 kcal; P08 16 kcal. Per 250 ml glass: P07 ≈ 105 kcal; P08 ≈ 40 kcal.","Sugars per 100 ml: P07 4.0 g; P08 0.5 g. Per 250 ml: P07 10 g; P08 1.25 g.","Protein per 250 ml: P07 2.5 g; P08 1.25 g.","Price per 100 ml: P07 1.60 ÷ 1,000 × 100 = 0.16; P08 2.10 ÷ 1,000 × 100 = 0.21.","Check fortification (calcium, vitamin D, B12) on each label. The almond drink declares a tree nut. The oat drink declares oats, which are cereals containing gluten, and its precautionary line names barley from shared processing."]},{t:"example",title:'Scenario 5 — Peanut butter (P09) and the "high protein" question',steps:["Fictional P09 per 100 g: energy 599 kcal; protein 25 g; fat 51 g; saturates 10 g; sodium 450 mg.","Energy from protein = 25 × 4 = 100 kcal; 100 ÷ 599 × 100 = 16.7%.",'This is below the EU threshold of 20% of energy for a "high protein" claim, even though protein is a visible feature.',"Per 32 g serving: energy 192 kcal; saturates 3.2 g; sodium 144 mg. The ingredient list shows peanuts first."]},{t:"example",title:"Scenario 6 — Cooking oils (named rapeseed oil vs a hypothetical vegetable oil blend)",steps:["Both oils provide about 900 kcal per 100 g, because fat provides 9 kcal per gram.","Named rapeseed oil (fictional): saturates 7 g per 100 g. Hypothetical blend: saturates 12 g per 100 g.","For a 15 g portion: rapeseed 15 × 7 ÷ 100 = 1.05 g saturates; blend 15 × 12 ÷ 100 = 1.8 g saturates.",'The named oil gives more information than "vegetable oil". Neither calculation shows how the oils perform in cooking, which is a separate question.']},{t:"example",title:"Scenario 7 — Canned beans (P11) and the drained-weight basis",steps:["Fictional can: net 400 g; drained 240 g; price 0.95.","Price per 100 g of the whole net contents: 0.95 ÷ 400 × 100 = 0.24.","Price per 100 g of drained beans: 0.95 ÷ 240 × 100 = 0.40.","Per 130 g serving (as labelled): fibre 4.5 × 1.3 = 5.85 g; sodium 290 × 1.3 = 377 mg. Use the same basis for all cans you compare."]},{t:"example",title:"Scenario 8 — Tomato pasta sauce (P12) and sodium per serving",steps:["Fictional P12 per 100 g: sodium 380 mg (salt 0.95 g); sugars 6.0 g; energy 60 kcal.","Per 125 g serving: sodium 380 × 1.25 = 475 mg; salt 0.95 × 1.25 = 1.19 g.","Price per 100 g: 2.10 ÷ 400 × 100 = 0.53; per serving: 2.10 ÷ 400 × 125 = 0.66.","A sauce used with pasta also contributes sodium from the pasta, cheese or stock used. Consider the whole dish."]},{t:"example",title:"Scenario 9 — Protein bar (P14): unit cost per gram of protein",steps:["Fictional P14: 12 bars per 600 g pack; price 14.40; per 100 g protein 30 g; energy 360 kcal; sugars 18 g.","Price per 100 g: 14.40 ÷ 600 × 100 = 2.40. Price per bar (50 g): 1.20.","Protein per bar: 15 g. Cost per 10 g protein: 1.20 ÷ 15 × 10 = 0.80.",'Energy from protein = 120 ÷ 360 × 100 = 33%, which meets the EU "high protein" threshold. The bar still provides 9 g of sugars per bar.']},{t:"example",title:"Scenario 10 — Frozen vegetables (P13): usable portion and price",steps:["Fictional P13 per 100 g: energy 27 kcal; fibre 3.0 g; sodium 20 mg. Price per 750 g bag: 2.30.","Price per 100 g: 2.30 ÷ 750 × 100 = 0.31.","Fresh produce can include inedible parts such as peel, stalks or stones. Compare the usable amount, not just the purchase weight.","Frozen vegetables may be chosen for convenience, storage life and reduced waste. They are not automatically nutritionally inferior to fresh produce."]},{t:"example",title:"Scenario 11 — Ready meal (P16) and soup (P15): different purposes",steps:["Per 100 g: P16 ready meal 129 kcal; P15 soup 56 kcal. Sodium: P16 520 mg; P15 330 mg.","Fibre: P16 4.0 g; P15 1.0 g. Protein: P16 6.0 g; P15 3.0 g.","Price per 100 g: P16 2.95 ÷ 350 × 100 = 0.84; P15 1.70 ÷ 400 × 100 = 0.43.","The two products are used differently. A soup may be a starter or a light meal; a ready meal is designed as a complete plate. Comparing them per 100 g is informative, but it does not show which is the better choice for a meal."]}]}],takeaways:["Use the same basis (per 100 g, per serving, per pack, or per unit price) for every comparison.","Products with different purposes need careful framing.","Trade-offs are normal. Choose according to your criteria."]},{id:"ch24-budgets",group:"V",num:"24",title:"Smart Shopping on Different Budgets",subtitle:"Unit prices, usable servings and genuine value",objectives:["Calculate unit prices per 100 g, kilogram, litre and usable serving.","Evaluate bulk, store-brand, frozen and canned options.","Interpret multi-buy and promotional offers accurately."],sections:[{id:"unit-price",title:"Unit price: the basic calculation",blocks:[{t:"p",x:"The **unit price** divides the price by the quantity to give a comparable figure, such as the price per 100 g, per kilogram, per 100 ml or per litre. Many shops show unit prices on the shelf, usually as required by local price-display rules. If they are not shown, calculate them. Use the same unit for each product, and keep the currency consistent."},{t:"ul",items:["Price per kilogram = price ÷ weight in kg (grams ÷ 1,000).","Price per 100 g = price ÷ grams × 100.","Price per litre = price ÷ litres (millilitres ÷ 1,000).","Cost per usable serving = price per 100 g × serving size (g) ÷ 100."]},{t:"callout",kind:"CONSUMER MISTAKE",x:"Choosing the cheapest unit price without checking the usable amount, the drained weight, the quality, or whether the product will be used before it spoils."}]},{id:"value-not-price",title:"Low unit price is not the same as good value",blocks:[{t:"p",x:"Good value depends on what you will actually eat and how the food fits your needs. A cheaper product that you throw away is not good value. A slightly more expensive product with more fibre, protein or convenience may cost less per useful serving. Consider waste, storage, cooking time, fuel, and the amount of food you need to make a satisfying meal."},{t:"example",title:"Worked example: cost per usable serving",steps:["Fictional P13 frozen vegetables: 0.31 per 100 g. A 80 g serving costs 0.31 × 80 ÷ 100 = 0.25.","Fictional P11 canned beans: 0.24 per 100 g net. A 130 g serving costs 0.24 × 130 ÷ 100 = 0.31.","If you usually eat 80 g of vegetables and 130 g of beans per meal, these numbers help you compare each food within your own budget."]}]},{id:"bulk-store-brands",title:"Bulk, store brands and premium brands",blocks:[{t:"p",x:"Larger packs often have a lower unit price, but only if the food is used before it deteriorates. Store-brand (private-label) products are not automatically inferior: they must meet the same labelling rules, and their ingredient lists should be compared like any other product. Premium products may offer different ingredients, packaging or certification; check whether those differences matter to you."}]},{id:"seasonal-frozen-canned",title:"Seasonal, frozen and canned alternatives",blocks:[{t:"p",x:"Fresh produce is often cheaper when it is in season and locally grown, but prices vary by region and time. Frozen fruit and vegetables are often picked and frozen at peak ripeness and can be a practical choice when fresh produce is expensive or will not be eaten quickly. Canned foods (beans, tomatoes, fish) are shelf-stable and useful for planning. Drained weight matters for canned products."}]},{id:"imported-waste",title:"Imported products, food waste and household purchasing",blocks:[{t:"p",x:"Imported products may carry higher transport costs, currency effects and different labelling, including the importer's details and local-language information. Food waste is one of the largest hidden costs in a household. Buying a size you can finish, planning meals, storing food correctly and using leftovers help preserve value. Use the date-label guidance in Chapter 21 to avoid discarding food that is still safe for its intended use."}]},{id:"promotions",title:"Promotions and multi-buy offers",blocks:[{t:"example",title:'Worked example: "2 for 3" offers',steps:["Fictional item with a regular price of 2.00 per pack.","Offer: buy two for 3.00. Price per pack = 3.00 ÷ 2 = 1.50.","Discount = (2.00 − 1.50) ÷ 2.00 × 100 = 25%.","Ask: will I use two packs before the date? If not, the offer may not be good value."]},{t:"callout",kind:"CHECK THE EVIDENCE",x:'Promotions can change the price you pay, not the nutritional content of the food. A "limited time" or "bonus" label still needs the same unit-price check.'}]}],takeaways:["Calculate on a common basis: per 100 g, per kg, per litre or per usable serving.","The best value is the cost of food you will actually eat.","Check the terms of any promotion and the unit price after the offer."]},{id:"ch25-online-shopping",group:"V",num:"25",title:"Online Food Shopping and Digital Labels",subtitle:"Product pages, QR codes and verifying the physical package",objectives:["Identify what online product pages can and cannot show reliably.","Explain the difference between physical labels and digital information.","Verify safety-critical information through the manufacturer or authority."],sections:[{id:"codex-guidance",title:"What Codex has adopted on e-commerce and digital labelling",blocks:[{t:"p",x:"In November 2024, the Codex Alimentarius Commission adopted two sets of guidelines: **Guidelines on the Provision of Food Information for Pre-Packaged Foods Offered via E-Commerce**, and **Guidelines on the Use of Technology to Provide Food Information in Food Labelling**. The e-commerce guidelines apply to the product information shown online and complement, rather than replace, the labelling rules for the package. The technology guidelines recognise that some information may be provided electronically, but that information concerning safety and nutrition should remain on the physical label. Codex texts are international references; national rules decide what applies in each market, and Codex has updated related texts since, so check the current version."},{t:"callout",kind:"REGIONAL DIFFERENCE",x:"Codex guidance is not automatically law. Check your national food authority for the rules that apply to online sales, imported products and digital labels in your country."}]},{id:"product-pages",title:"Product pages, photographs and ingredient information",blocks:[{t:"ul",items:["Product photographs may be old, show a different pack size, or show a previous recipe.","Ingredient and nutrition information may be incomplete, summarised or out of date.","Allergen information online may be shorter than the package statement. Some pages do not show precautionary statements at all.","Product descriptions are marketing copy. Check the ingredients and allergen statements against the package."]}]},{id:"qr-traceability",title:"QR codes, batch codes and traceability",blocks:[{t:"p",x:"A QR code can link to more detail, such as the manufacturer's product page, sourcing information or recipe. It does not guarantee traceability, authenticity or current accuracy. A batch or lot code helps identify a production run, and it is useful when checking a recall notice. Digital product passports are being developed for some product categories in some regions; their coverage of food varies, so check what applies to the product you are buying."},{t:"callout",kind:"CHECK THE EVIDENCE",x:"Scanning a QR code is a way to access information, not a verification. Confirm that the linked website belongs to the manufacturer or an official body before relying on it."}]},{id:"marketplaces",title:"Marketplaces, subscriptions and imported products",blocks:[{t:"p",x:"On online marketplaces, the seller may not be the manufacturer, and the product may be repackaged, imported or sold after its shelf life. Subscription products may change recipe or packaging over time. For imported products, check that the label includes the information required in the country of sale, including the importer's details and the date marking. If the seller cannot provide the information, do not buy the product for a safety-critical purpose."}]},{id:"verify",title:"How to verify official product information",blocks:[{t:"table",caption:"Where to check each type of information",head:["Information","Best source","Why"],rows:[["Ingredients and allergens","The physical package; then the manufacturer's current specification","Recipes change; the package is the legal record for the product in your hand"],["Nutrition declaration","The physical package","Values are specific to the recipe and pack"],["Date and storage","The physical package","Batch and date are tied to the item you are buying"],["Recalls and safety notices","National food authority or regulator","Official notices list affected products and batches"],["Certification","The certifying body's public register, where available","Confirms current status of the certificate"]]},{t:"callout",kind:"SAFETY FIRST",x:"If safety-critical information (such as allergens) is unclear or missing, contact the manufacturer before purchase. Keep the package until you are satisfied."}]}],takeaways:["Online pages can be incomplete or outdated; the physical package is the reference.","A QR code is an access route, not proof of traceability.","For safety-critical details, verify with the manufacturer or an official source."]},{id:"ch26-sustainability",group:"V",num:"26",title:"Sustainability and Environmental Claims",subtitle:"Broad terms, third-party certification and the question of scope",objectives:["Analyse environmental and sustainability claims for scope and evidence.","Distinguish third-party certification from self-declared company claims.","Understand why sustainability needs more than one indicator."],sections:[{id:"broad-terms",title:'Broad terms such as "eco-friendly" and "green"',blocks:[{t:"p",x:`Terms such as "eco-friendly", "green", "planet-friendly" or "climate-positive" are general and often undefined. They rarely say which environmental impact is being reduced, how it was measured, over what time period, or compared with what. Ask: what exactly is claimed, what is the evidence, and what does it cover? The US Federal Trade Commission's Green Guides (16 CFR Part 260) give guidance on avoiding deceptive environmental marketing, and many countries have similar principles.`},{t:"callout",kind:"CHECK THE EVIDENCE",x:'A claim such as "carbon neutral" can depend on offsets, system boundaries and methods. Look for the scope (for example, which stages of production are included), the reference period and the verification method.'}]},{id:"packaging-claims",title:"Recyclability, recycled content and packaging reduction",blocks:[{t:"ul",items:["**Recyclable:** see Chapter 22. Technical recyclability is not the same as local collection.","**Recycled content:** states the share of recycled material in the package. Check whether it is post-consumer or pre-consumer, and whether it is stated per component.","**Packaging reduction:** a claim about less material compared with an earlier version or a reference. Ask for the baseline and the measurement.","**Plastic-free or paper-based:** the packaging may still contain plastic linings or coatings. Check the material description."]}]},{id:"sourcing-certifications",title:"Sourcing, animal welfare and fair-trade certifications",blocks:[{t:"p",x:"Certifications for fair trade (for example, Fairtrade International), palm oil (the Roundtable on Sustainable Palm Oil, RSPO), animal welfare (for example, RSPCA Assured in the UK) and responsible forestry each cover specific issues. Some cover one ingredient; some cover a whole product. Read the standard and the scope. A certification does not cover aspects it does not measure, such as packaging or transport emissions."},{t:"callout",kind:"REGIONAL DIFFERENCE",x:"Animal welfare labelling is regulated in some countries and voluntary in others. Check whether the logo is a government scheme, a private scheme, or a company statement."}]},{id:"methodology",title:"Life-cycle thinking and methodology",blocks:[{t:"p",x:"A **life-cycle assessment (LCA)** examines environmental impacts across the stages of a product's life, such as agriculture, processing, packaging, transport, use and disposal. The methodology is standardised internationally (ISO 14040 and ISO 14044 describe the principles). Results depend on assumptions. A product may have a lower carbon footprint and a higher water use than another, so one indicator cannot describe overall sustainability."},{t:"callout",kind:"WHAT THE SCIENCE SAYS",x:"Environmental performance of food depends on the food, the origin, the season, the farming system, transport, packaging and waste. Simple comparisons can be misleading, and the relative importance of each factor varies."}]},{id:"food-waste",title:"Food waste as a sustainability issue",blocks:[{t:"p",x:"Food that is not eaten wastes the resources used to grow, process, package and transport it. Reducing waste at home is one of the most direct actions a shopper can take. Plan meals, buy quantities you can use, store food correctly and use the date-label guidance in Chapter 21."}]}],takeaways:["Ask what exactly is claimed, what it covers and how it was measured.","Third-party certification is a different thing from a company's own claim.","Sustainability requires more than one indicator and a clear methodology."]},{id:"ch27-dietary-needs",group:"V",num:"27",title:"Shopping for Different Dietary Needs",subtitle:"Practical label reading, not medical prescriptions",objectives:["Identify the label features relevant to common dietary needs and preferences.","Recognise when individual clinical advice is necessary."],sections:[{id:"intro-needs",title:"Principles for every dietary need",blocks:[{t:"p",x:"The sections below describe what to look for on labels. They are not medical dietary prescriptions. Suitability depends on the individual, the ingredient details, the manufacturing context and advice from a qualified health professional. Dietary preferences, religious practice and medical needs deserve respect; this chapter does not judge them."}]},{id:"needs-table",title:"Label features by dietary need",blocks:[{t:"table",caption:"Practical label reading for common needs (educational summary)",head:["Need or preference","Look for","Check carefully"],rows:[["Vegetarian or vegan","Ingredient list, vegetarian or vegan certification, veg/non-veg mark where used","Milk, egg, honey, gelatin, animal-derived enzymes, flavourings, and processing aids"],["Gluten-free",'A "gluten-free" claim that meets the legal threshold, or a certification',"Cross-contact statements; oats; malt; wheat-based thickeners; soy sauce"],["Lactose intolerance","Lactose-free or dairy-free labelling where applicable","Milk solids, whey, lactose and butter; a lactose-free product may still contain milk protein"],["Food allergies",'The "Contains" statement and the emphasised allergens in the ingredient list',"Precautionary statements; hidden names (Chapter 20); changes in recipe"],["Religious requirements","Recognised certification, or the veg/non-veg and halal or kosher marks where used","Who issued the certificate, which products it covers, and how processing is controlled"],["Higher fibre","Fibre per 100 g; wholegrains in the ingredient list; fibre claims","Fibre definitions, sugars and sodium in the same product"],["Lower sodium","Sodium or salt per 100 g; low-sodium claims with defined thresholds","Sodium in seasonings, bread, sauces and processed meats"],["Higher protein","Protein per 100 g; protein claims with defined thresholds","Energy, sugars, fat and sodium; protein source and processing"]]}]},{id:"individual",title:"Why individual advice matters",blocks:[{t:"callout",kind:"SAFETY FIRST",x:"For coeliac disease, severe allergies, kidney disease, diabetes, pregnancy, eating disorders, or any condition that changes what food you can safely eat, consult a qualified health professional or registered dietitian. Use this book to read labels more confidently, not to replace clinical care."}]}],takeaways:["Each need has specific label features to check, and a list of hidden risks.","Individual suitability requires individual advice."]},{id:"ch28-grocery-system",group:"V",num:"28",title:"A Complete Grocery Shopping System",subtitle:"Twelve repeatable steps for small households, larger families and beginners",objectives:["Apply a complete planning-to-storage grocery system.","Adapt the system to a small household, a larger family and a first-time shopper."],sections:[{id:"twelve-steps",title:"The twelve steps",blocks:[{t:"ol",items:["**Plan meals and household needs** for the coming days, including any allergies or preferences.","**Check the pantry** and fridge for what you already have.","**Create a shopping list** grouped by category (see the Grocery Checklist Builder).","**Set a realistic budget** for the trip or the week.","**Compare suitable products** using the method in Chapter 23.","**Read the labels** on the physical package.","**Verify allergens** and any precautionary statements.","**Check storage requirements** (chilled, frozen, dry, after opening).","**Evaluate unit prices** on the same basis.","**Purchase appropriate quantities** you can use before the date.","**Store products safely** as soon as you get home.","**Review food waste** and update the plan for next time."]}]},{id:"examples",title:"Three applications",blocks:[{t:"example",title:"A small household (one or two adults)",steps:["Plan three dinners, two breakfasts and lunches for the week. Choose a pack size you can finish, such as a 400 g can rather than a 2 kg bag of beans.","Check the freezer and pantry first, then add only what is missing. Compare unit prices for frozen vegetables and fresh alternatives.","Store leftovers within their stated safety guidance, and note the use-by dates of opened products."]},{t:"example",title:"A larger family (four or more people)",steps:["Build a standard list for weekly staples (grains, legumes, dairy alternatives, bread) and a flexible list for seasonal items.","Use unit prices to compare bulk packs, and check that the larger pack will be used before its date.","Keep allergen information for every household member in a written, private note. Verify each new product, because recipes and packaging change."]},{t:"example",title:"A beginner shopping independently",steps:["Start with five familiar staples and one new item per shop. Read the name, the ingredients and the nutrition declaration for each one.","Use the 30-second method (Chapter 30): identify, check, compare, verify and decide.","Keep a short record of what you bought, how much it cost and whether you used it. Adjust next time."]}]}],takeaways:["A repeatable system saves time, money and food.","Adjust the system to your household, budget and needs."]}],Xg=[{id:"ch29-case-studies",group:"VI",num:"29",title:"Twelve Real-World Label Reading Case Studies",subtitle:"Fictional packages, clearly marked sample data",objectives:["Apply the label-reading skills from Parts I–V to realistic examples.","Separate hypothetical values from real food-composition data.","Recognise common consumer mistakes in each category."],sections:[{id:"how-to-use-cases",title:"How to use these case studies",blocks:[{t:"callout",kind:"SAFETY FIRST",x:"Every product in this chapter is an **invented educational simulation**. The brand names, packages, ingredient lists, nutrition values, prices and claims were created for teaching. They do not describe any real product, and they must not be used to judge real products. Real labels must be read on the real package."},{t:"p",x:"Open the Product Comparison Tool or the Case Study Explorer in the Tools section to see each package. Each case study contains a front-of-pack description, an ingredient list, a nutrition declaration per 100 g, serving information, claims, allergen information, a step-by-step interpretation, observations, common mistakes and a reasoned conclusion. Work through the steps before reading the conclusion."}]},{id:"case-index",title:"The twelve cases",blocks:[{t:"table",caption:"Case studies in this edition (all fictional)",head:["No.","Category","Fictional product","Main teaching point"],rows:[["CS1","Breakfast cereal","Hollow Hill Wholegrain Oat Crunch","Reading sugars, fibre and serving size together"],["CS2","Flavoured yoghurt","Quillen Farm Strawberry Yoghurt","Total sugars versus added sugars; reading the ingredient list"],["CS3","Plain yoghurt","Tallowmoor Natural Yoghurt","Natural sugars in dairy; comparing like with like"],["CS4","Plant-based drink","Harvest Lantern Oat Drink","Fortification claims and per-serving amounts"],["CS5","Packaged bread","Kestrel Bay Seeded Wholemeal Loaf",'Whole grains, the "multigrain" name and allergens'],["CS6","Peanut butter","Kestrel Bay Smooth Peanut Spread",'Allergen emphasis; testing a "high protein" idea'],["CS7","Tomato sauce","Harvest Lantern Tomato & Basil Sauce","Salt versus sodium; sodium per serving"],["CS8","Canned beans","Kestrel Bay Red Kidney Beans","Net versus drained weight in unit prices"],["CS9","Frozen vegetables","Meadowlark Frozen Garden Mix","Usable weight, storage and unit price"],["CS10","Protein snack","Quillen Peak Protein Bar","Energy from protein; sugars and cost per protein gram"],["CS11","Packaged soup","Tallowmoor Chicken & Vegetable Soup","Serving size and sodium in ready-to-heat food"],["CS12","Ready-to-eat meal","Hollow Hill Lentil & Vegetable Curry Meal",'Meal-level comparison; allergens and the "per pack" view']]}]},{id:"common-mistakes",title:"Mistakes the case studies are designed to expose",blocks:[{t:"ul",items:["Trusting the front of the pack without reading the ingredient list.","Comparing per-serving values with per-100 g values.",'Assuming "no added sugar" means "low sugar".','Confusing "multigrain" with "wholegrain".',"Treating a precautionary statement as an ingredient, or ignoring it altogether.","Ignoring the drained-weight basis when comparing prices."]}]}],takeaways:["Every case is fictional and clearly identified as a simulation.","Use the case steps to practise the method, not to judge real products."]},{id:"ch30-framework",group:"VI",num:"30",title:"Your Personal Food Label Reading Framework",subtitle:"IDENTIFY → CHECK → COMPARE → VERIFY → DECIDE",objectives:["Apply the five-stage framework during ordinary shopping.","Use a compact checklist without needing to re-read the whole book."],sections:[{id:"five-stages",title:"The five stages",blocks:[{t:"table",caption:"The framework at a glance",head:["Stage","Question","Typical actions"],rows:[["1. IDENTIFY","What is this product, and what am I buying?","Read the descriptive name, net quantity, serving information and brand; ignore the design for a moment"],["2. CHECK","What does the package say about its contents and safety?","Read the ingredient list, allergen statement, nutrition declaration, date and storage instructions"],["3. COMPARE","How does it compare with a suitable alternative?","Use the same basis (per 100 g, per serving or unit price); note trade-offs"],["4. VERIFY","Is the claim, certification or unclear information reliable?","Check the claim type, the certifier, the manufacturer, or the official authority"],["5. DECIDE","Does this fit my needs, budget and safety requirements?","Choose, or set the product aside; record what you learned"]]}]},{id:"demonstration",title:"Demonstration: the Seeded Wholemeal Loaf (CS5)",blocks:[{t:"example",title:"Using the framework on a fictional loaf",steps:['IDENTIFY: a wholemeal bread, 600 g, sold as "Seeded Wholemeal". The descriptive name matches the first ingredient, wholemeal wheat flour.',"CHECK: ingredients include seeds; the allergen statement names wheat and sesame. Per 100 g: fibre 7.5 g, sodium 480 mg, sugars 4.0 g.","COMPARE: against a soft white loaf (P04, Meadowlark Soft White Sandwich Loaf): per 100 g, the seeded loaf has more fibre (7.5 g against 2.5 g) and slightly less sodium (480 mg against 520 mg).",'VERIFY: no health claim is made; the wholemeal name is supported by the first ingredient. If the label had made a "high fibre" claim, the threshold would need checking.',"DECIDE: the loaf may suit a preference for fibre and seeds, provided sesame is not a problem. The price per 100 g (0.32) is slightly higher than the alternative (0.30). The decision is yours."]}]},{id:"checklist",title:"The 60-second shopping checklist",blocks:[{t:"ol",items:["Is the **product name** clear, and does it match the ingredient list?","Is the **net quantity** the one I need?","Are my **allergens** listed in the allergen statement, and is there any precautionary statement I need to ask about?","Does the **ingredient list** show what I expected (and no surprises for my needs)?","Which **nutrition values** matter to me, and are they on the same basis as my comparison?","Does the **date** fit my plan, and do I have the **storage** conditions?","Are **claims or logos** defined, verifiable, and relevant to what I need?","Is the **unit price** fair for what I will actually use?","Have I checked anything I could not understand, with the manufacturer or an authority?"]},{t:"callout",kind:"CHECK THE EVIDENCE",x:"You do not need to complete every step for every item. Use the full checklist for new products, for allergen-sensitive purchases and for products you buy regularly but have not checked for a while."}]}],takeaways:["IDENTIFY → CHECK → COMPARE → VERIFY → DECIDE works in under a minute once practised.","Print or save the 60-second checklist and use it while shopping."]},{id:"ch31-fourteen-day-challenge",group:"VI",num:"31",title:"A Fourteen-Day Smart Shopping Challenge",subtitle:"One consumer skill a day, using products you already have",objectives:["Practise one label-reading skill each day for two weeks.","Reflect on your progress without making unnecessary purchases."],sections:[{id:"how-challenge-works",title:"How the challenge works",blocks:[{t:"p",x:"Each day has an objective, an activity, a learning explanation and a reflection question. Use products already in your home, or look at a package you would normally buy. Do not buy anything new to complete the challenge. If a day's activity involves a product you do not have, use the fictional case studies in Chapter 29 instead."},{t:"callout",kind:"SAFETY FIRST",x:"Reflection notes are private. The tracker keeps them for your current session only and does not store them. Allergy or health information should never be recorded in a shared place."}]},{id:"day-overview",title:"The fourteen days at a glance",blocks:[{t:"table",caption:"Daily focus (full activities, explanations and reflection questions are in the Learning Tracker)",head:["Day","Consumer skill"],rows:[["1","Identify the product: name, type and purpose"],["2","Compare two serving sizes and net quantities"],["3","Interpret a nutrition declaration per 100 g and per serving"],["4","Find sugar information: total sugars and any added sugars"],["5","Read an ingredient list, including compound ingredients"],["6","Understand an allergen statement and precautionary wording"],["7","Compare unit prices on the same basis"],["8","Investigate a certification logo"],["9","Understand a date label and storage instructions"],["10","Examine a marketing claim with the six-question method"],["11","Compare front-of-pack systems"],["12","Explore packaging and recycling information"],["13","Verify an online product page against the package"],["14","Build a personal shopping checklist and reflect on progress"]]}]}],takeaways:["Small daily practice builds confident label reading.","Use products you already have; avoid unnecessary purchases."]},{id:"continue",group:"back",title:"Continue Learning with HERBULANCE",subtitle:"Four books, one connected food-education library",objectives:["See how the HERBULANCE collection connects across food knowledge topics."],sections:[{id:"library",title:"The HERBULANCE Educational Collection",blocks:[{t:"table",caption:"How the four books connect",head:["Book","Title","Where it connects with this guide"],rows:[["01","The Plant-Forward Beginner's Guide","Balanced eating, plant foods, food groups, meal preparation and grocery planning. Pairs with Chapters 23, 27 and 28."],["02","The Gut Health & Digestion Guide","Fibre, fermented foods, ingredient names and digestive considerations. Pairs with Chapters 10 and 19."],["03","The World of Herbs & Spices","Spice blends, botanical ingredients and seasoning names on labels. Pairs with Chapters 2 and 3."],["04","The Smart Food Shopping & Label Reading Guide","This book: the practical consumer-literacy reference for the foods and ingredients discussed across the series."]]},{t:"p",x:"Read the books in any order. Each one stands on its own, and cross-references appear only where they are useful. When you meet an unfamiliar ingredient name in a recipe from another book, the Ingredient List Decoder in this guide can help you recognise its label name."}]}],takeaways:["The four HERBULANCE books cover planning, digestion, seasoning and label literacy."]}],_r=[{id:"front",title:"Opening Pages",intro:"Welcome, edition and copyright information, why labels matter, how to use this book, a quick guide to packaging, terminolog
