id:"pure",term:"Pure",category:"Marketing",meaning:"Nothing added.",limits:'Often a quality message. Some foods have compositional standards that define "pure" or "extra virgin".',context:"Category standards (for example, honey and olive oil rules) can apply.",check:"The ingredient list and the standard for that category."},{id:"traditional",term:"Traditional",category:"Marketing",meaning:"Made in an established way.",limits:"Undefined for most products. Protected traditional names are a separate, specific legal status.",context:"The EU has protected designations (PDO, PGI, TSG). Those have defined conditions.",check:"Whether the name is a registered protected name, and what the registration covers."},{id:"farm-fresh",term:"Farm fresh",category:"Marketing",meaning:"Came directly from a farm, very recently.",limits:"Usually undefined, and the farm may be far away.",context:"Origin storytelling.",check:"Origin, date marking and producer details."},{id:"premium",term:"Premium",category:"Marketing",meaning:"Higher quality.",limits:"No legal definition. Price and design do not establish composition.",context:"Positioning term.",check:"Ingredients, certification and price per unit."},{id:"superfood",term:"Superfood",category:"Marketing",meaning:"Especially healthy.",limits:"No legal definition. Implied health benefits must meet health-claim rules.",context:"Marketing term; health claims are separately regulated.",check:"The specific nutrient and any evidence for the benefit."},{id:"wholesome",term:"Wholesome",category:"Marketing",meaning:"Healthy and nourishing.",limits:"No legal definition. It is a general feeling, not a measure.",context:"Marketing term.",check:"The full nutrition declaration and ingredient list."},{id:"simple-ingredients",term:"Simple ingredients",category:"Marketing",meaning:"Few and familiar ingredients.",limits:"Undefined. Simplicity does not indicate nutrition.",context:"Marketing term.",check:"The ingredient list."},{id:"no-artificial",term:"No artificial ingredients",category:"Marketing",meaning:"No synthetic additives or flavours.",limits:"Undefined in many markets. Substances may still be processed or synthetic in ways the claim does not cover.",context:"Must not mislead; the claim should match the ingredient list.",check:"Additive and flavouring names in the list."},{id:"free-from",term:"Free from (named substance)",category:"Dietary",meaning:"Does not contain the named substance.",limits:'Specific claims have legal thresholds (for example, gluten-free). Generic "free from" phrases can be vague.',context:"Gluten-free claims: Codex and EU threshold of 20 mg/kg.",check:"The named substance, the threshold and the certification."},{id:"light",term:"Light / lite",category:"Comparative",meaning:"Lower in energy or fat than usual.",limits:'Describes a difference from a reference product. "Light" can refer to taste, colour or texture in some products.',context:"Defined in several markets, including the EU and US, with thresholds and reference products.",check:"Which nutrient is reduced, the reference product and the size of the difference."},{id:"reduced",term:"Reduced (nutrient)",category:"Comparative",meaning:"Less of a nutrient than a reference product.",limits:"The reference product and minimum reduction must be stated and defined.",context:"US: at least 25% less per reference amount. EU comparative rules apply (Regulation (EC) 1924/2006).",check:"Reference product, percentage reduction and the nutrient's value per 100 g."},{id:"low-fat",term:"Low fat",category:"Nutrition",meaning:"Little fat.",limits:"Says nothing about the type of fat, sugar or energy.",context:"EU: no more than 3 g fat per 100 g (solids) or 1.5 g per 100 ml (liquids). US: 3 g or less per reference amount.",check:"Saturates, sugars and energy."},{id:"high-protein",term:"High protein",category:"Nutrition",meaning:"Lots of protein.",limits:"Does not describe protein quality, sugars, fat or sodium.",context:"EU: at least 20% of energy from protein. US: 20% DV or more per reference amount.",check:"Energy from protein (protein × 4 ÷ energy), and the rest of the nutrition declaration."},{id:"high-fibre",term:"High fibre",category:"Nutrition",meaning:"Lots of fibre.",limits:"Fibre definitions differ by country.",context:'EU: at least 6 g per 100 g; "source of fibre" at least 3 g per 100 g. US: %DV-based thresholds.',check:"Fibre per 100 g and per serving; the market's fibre definition."},{id:"sugar-free",term:"Sugar-free",category:"Nutrition",meaning:"No sugar.",limits:"Thresholds apply; sweeteners and sugar alcohols may be present. Energy may still be present.",context:"EU: sugar-free claims have a low maximum sugar level under Regulation (EC) 1924/2006. US: less than 0.5 g per reference amount.",check:"Sweeteners and sugar alcohols in the list and any laxative warning."},{id:"no-added-sugar",term:"No added sugar",category:"Nutrition",meaning:"No sugar was added during processing.",limits:"Naturally present sugars (from fruit, milk or the base ingredient) can remain. Total sugars may still be high.",context:"Rules vary, including whether ingredients containing sugars count.",check:"Total sugars per 100 g and the ingredient list."},{id:"multigrain",term:"Multigrain / seven-grain",category:"Marketing",meaning:"Several grains are used.",limits:"Does not mean wholegrain. Refined grains may make up most of the product.",context:'Undefined in most markets; "wholegrain" claims have their own definitions.',check:"Whether the first ingredient is wholegrain and whether refined flour is present."},{id:"organic",term:"Organic",category:"Certification",meaning:"Produced to organic production standards.",limits:"Describes production methods, not guaranteed nutrition or environmental performance in every case.",context:"Legally defined in the EU (Regulation (EU) 2018/848) and the US (USDA NOP, 7 CFR Part 205). Logos and thresholds differ.",check:"The logo, certifier code and the percentage of organic ingredients where stated."},{id:"non-gmo",term:"Non-GMO",category:"Certification",meaning:"No genetically modified ingredients.",limits:"Verification methods and standards vary. Many ingredients are not GM-produced in the first place.",context:"Private verification in many markets; the EU has labelling thresholds (0.9%) for GMO content.",check:"Who verified the claim and the standard used."},{id:"vegan",term:"Vegan",category:"Dietary",meaning:"No animal-derived ingredients.",limits:"Certification standards vary. Processing aids and cross-contact can still be relevant for some people.",context:"Often certified privately; some markets regulate the term.",check:"The ingredient list (milk, egg, honey, gelatin, animal-derived enzymes) and the certifier."},{id:"vegetarian",term:"Vegetarian",category:"Dietary",meaning:"No meat, poultry, fish or slaughter by-products.",limits:"Definitions differ on eggs and dairy. Some systems use a veg/non-veg mark.",context:"India requires a veg/non-veg mark on pre-packaged food under the 2020 Regulations.",check:"The ingredient list and the mark or certification."},{id:"halal-kosher",term:"Halal / Kosher",category:"Certification",meaning:"Prepared according to religious dietary standards.",limits:"Standards and certifying authorities differ. Scope may cover only part of a product.",context:"Certified by religious or private bodies; some countries regulate the terms.",check:"The certifying authority, its scope and whether it meets your requirements."},{id:"plant-based",term:"Plant-based",category:"Marketing",meaning:"Made mainly from plants.",limits:"Does not guarantee the absence of all animal-derived ingredients.",context:'Usually undefined; "vegan" is a separate claim.',check:"The ingredient list."},{id:"carbon-neutral",term:"Carbon neutral / climate-friendly",category:"Environmental",meaning:"Lower or balanced carbon emissions.",limits:"Depends on scope, methods, offsets and time period.",context:"Environmental claims can be challenged if they are vague uctose and glucose, with small amounts of other compounds.",seenIn:"Cereals, granola, baked goods, dressings",labelNote:"WHO counts sugars in honey as free sugars. Nutritionally it is still a source of sugars."},{id:"fruit-juice-concentrate",name:"Fruit juice concentrate",aliases:["Apple juice concentrate","Grape juice concentrate"],kind:"Sugar or sweetener",summary:"Fruit juice with most of its water removed. It provides sugars from the fruit in concentrated form.",seenIn:"Yoghurts, cereal bars, sweetened drinks",labelNote:"WHO counts sugars in fruit juices and concentrates as free sugars."},{id:"maltodextrin",name:"Maltodextrin",aliases:["Starch hydrolysate"],kind:"Ingredient",summary:"A carbohydrate made by partially breaking down starch. It is made of several glucose units and is not a simple sugar.",seenIn:"Sports drinks, sauces, sweets, dry mixes",labelNote:"Contributes to total carbohydrate. Because it is a polysaccharide, WHO does not count it as a free sugar, although it can raise blood glucose."},{id:"lecithin",name:"Lecithin",aliases:["Soy lecithin","Sunflower lecithin","Egg lecithin"],kind:"Additive",eNumber:"E322",functionClass:"Emulsifier",summary:"A mixture of phospholipids, usually from soybean or sunflower, that helps oil and water stay mixed.",seenIn:"Chocolate, baked goods, margarine, coatings",labelNote:"Soy lecithin is a soy-derived ingredient. Check the allergen rules where you shop, because refined derivatives can be treated differently."},{id:"mono-diglycerides",name:"Mono- and diglycerides of fatty acids",aliases:["Mono and diglycerides","E471"],kind:"Additive",eNumber:"E471",functionClass:"Emulsifier",summary:"Emulsifiers made from fats or oils, used to keep ingredients mixed and to adjust texture.",seenIn:"Bread, ice cream, spreads, cakes",labelNote:"Often plant-derived or animal-derived depending on the source fat. Check the certification if source matters to you."},{id:"pectin",name:"Pectin",aliases:["Citrus pectin","Apple pectin"],kind:"Additive",eNumber:"E440",functionClass:"Gelling agent",summary:"A natural polysaccharide found in fruit cell walls, extracted mainly from citrus peel or apple pomace. It forms gels with sugar and acid.",seenIn:"Jam, jelly, yoghurt, fruit preparations",labelNote:"Pectin is also a naturally occurring dietary fibre in fruit."},{id:"xanthan",name:"Xanthan gum",aliases:["E415"],kind:"Additive",eNumber:"E415",functionClass:"Thickener and stabiliser",summary:"A polysaccharide produced by fermentation of a bacterium. It increases viscosity at low concentrations.",seenIn:"Gluten-free bread, dressings, sauces, plant-based drinks",labelNote:"Authorised for a range of uses. It is often used in gluten-free products to improve texture."},{id:"carrageenan",name:"Carrageenan",aliases:["E407"],kind:"Additive",eNumber:"E407",functionClass:"Thickener and gelling agent",summary:"Extracted from red seaweed. It forms gels and thickens dairy and plant-based products.",seenIn:"Dairy desserts, plant-based milks, deli meats",labelNote:"Authorisation and conditions vary. Some regulators restrict certain forms; check the rules in your market."},{id:"gelatin",name:"Gelatin",aliases:["Gelatine","E441"],kind:"Additive",eNumber:"E441",functionClass:"Gelling agent",summary:"A protein obtained from animal collagen, used to form gels and stabilise foams.",seenIn:"Jelly sweets, desserts, yoghurts, some capsules",labelNote:"Animal-derived, so relevant for vegetarian, vegan, halal and kosher choices. Check the certification and source."},{id:"citric-acid",name:"Citric acid",aliases:["E330"],kind:"Additive",eNumber:"E330",functionClass:"Acidity regulator",summary:"An organic acid found naturally in citrus fruit and widely produced by fermentation. It adds tartness and controls pH.",seenIn:"Sweets, soft drinks, jams, sauces",labelNote:"Natural occurrence does not change its role as an additive in the list. It also acts as a preservative and antioxidant synergist in some foods."},{id:"ascorbic-acid",name:"Ascorbic acid",aliases:["Vitamin C","E300"],kind:"Additive",eNumber:"E300",functionClass:"Antioxidant",summary:"Vitamin C, used as an antioxidant to slow browning and fat oxidation, and as a nutrient.",seenIn:"Fruit preparations, cured meats, bread, juices",labelNote:"Its presence can also add vitamin C to the nutrition panel."},{id:"tocopherols",name:"Tocopherols (mixed)",aliases:["Vitamin E","E306","E307","E308","E309"],kind:"Additive",eNumber:"E306–E309",functionClass:"Antioxidant",summary:"Forms of vitamin E used to slow the oxidation of fats and oils.",seenIn:"Vegetable oils, margarines, snacks",labelNote:"Used to protect fats from going rancid during storage."},{id:"sodium-benzoate",name:"Sodium benzoate",aliases:["E211"],kind:"Additive",eNumber:"E211",functionClass:"Preservative",summary:"A preservative that works best in acidic conditions to limit yeasts, moulds and some bacteria.",seenIn:"Acidic soft drinks, sauces, pickles",labelNote:"In some acidic drinks containing benzoate and ascorbic acid, benzene can form under heat and light. Regulators set limits and monitor this."},{id:"potassium-sorbate",name:"Potassium sorbate",aliases:["E202","Sorbic acid"],kind:"Additive",eNumber:"E202",functionClass:"Preservative",summary:"A salt of sorbic acid, used to inhibit moulds and yeasts in many acidic and some other foods.",seenIn:"Cheese, baked goods, wine, dried fruit, drinks",labelNote:"Authorised for specific uses and levels. Check local rules for specific foods."},{id:"natamycin",name:"Natamycin",aliases:["Pimaricin","E235"],kind:"Additive",eNumber:"E235",functionClass:"Preservative (surface treatment)",summary:"An antifungal used on the surface of some cheeses and cured meats to prevent mould growth.",seenIn:"Hard cheese, cured sausages",labelNote:"Typically applied to the surface, so it is not distributed through the food in the same way as additives mixed into the recipe."},{id:"sulphites",name:"Sulphites (sulphur dioxide and salts)",aliases:["E220","E223"," rry a phenylalanine warning in many markets, which matters for people with phenylketonuria."},{id:"erythritol",name:"Erythritol",aliases:["E968"],kind:"Sugar or sweetener",eNumber:"E968",functionClass:"Sugar alcohol (polyol)",summary:"A sugar alcohol with a low energy value and about 60–70% of the sweetness of sugar. It is absorbed differently from sugar.",seenIn:"Sugar-free sweets, drinks, baking blends",labelNote:"Large amounts can have a laxative effect. Some markets require a warning when polyols are present in certain amounts."},{id:"sorbitol",name:"Sorbitol",aliases:["E420"],kind:"Sugar or sweetener",eNumber:"E420",functionClass:"Sugar alcohol (polyol) and humectant",summary:"A sugar alcohol used as a sweetener and to retain moisture.",seenIn:"Sugar-free sweets, chewing gum, some baked goods",labelNote:"Excessive amounts can cause a laxative effect. Check any warning statement on the package."},{id:"glycerol",name:"Glycerol",aliases:["Glycerine","E422"],kind:"Additive",eNumber:"E422",functionClass:"Humectant",summary:"A simple polyol that retains moisture and softens texture.",seenIn:"Cakes, soft sweets, dried fruit",labelNote:"Can be from plant or animal sources; check the certification if source matters."},{id:"silicon-dioxide",name:"Silicon dioxide",aliases:["Silica","E551"],kind:"Additive",eNumber:"E551",functionClass:"Anti-caking agent",summary:"A fine mineral powder that stops powders from clumping.",seenIn:"Powdered spices, dried soup mixes, grated cheese, supplements",labelNote:"Used in very small amounts. Its presence indicates a powder that would otherwise cake."},{id:"sodium-bicarbonate",name:"Sodium bicarbonate",aliases:["Bicarbonate of soda","Baking soda","E500"],kind:"Additive",eNumber:"E500",functionClass:"Raising agent",summary:"Releases carbon dioxide when heated or combined with acid, causing baked goods to rise.",seenIn:"Biscuits, cakes, baking powder",labelNote:"Contains sodium; include it in sodium estimates for baked foods."},{id:"calcium-carbonate",name:"Calcium carbonate",aliases:["E170"],kind:"Fortificant",eNumber:"E170",functionClass:"Colour, anti-caking or calcium source",summary:"A calcium salt used as a calcium source in fortified drinks and as a whitener or anti-caking agent in other products.",seenIn:"Plant-based drinks, flour, tablets",labelNote:"Its function can be fortification (calcium) or technological; the label may not specify which."},{id:"natural-flavouring",name:"Natural flavouring",aliases:["Natural flavour","Flavouring"],kind:"Flavouring",summary:"A general term for flavouring substances obtained from a natural source. The EU and US define the terms in their own rules.",seenIn:"Snacks, cereals, drinks, sweets",labelNote:"Describes the origin of the flavouring material, not the proportion of the named food."},{id:"smoke-flavouring",name:"Smoke flavouring",aliases:["Liquid smoke","Smoke flavour"],kind:"Flavouring",summary:"A flavouring produced from condensed wood smoke, used to give a smoked taste without smoking the food.",seenIn:"Sausages, cheeses, crisps, sauces",labelNote:"Regulated separately in the EU (Regulation (EC) No 2065/2003). Check local rules."},{id:"vitamin-d",name:"Vitamin D (D2 or D3)",aliases:["Cholecalciferol","Ergocalciferol"],kind:"Fortificant",summary:"A vitamin added to some foods and drinks to increase the nutrient content.",seenIn:"Plant-based drinks, fortified cereals, margarines",labelNote:"Declared amount is the product's content; check the %DV or nutrient reference value on the label."},{id:"iron-ferrous",name:"Iron (added forms)",aliases:["Ferrous fumarate","Ferrous sulphate","Electrolytic iron"],kind:"Fortificant",summary:"Mineral forms added to enrich flour and cereals.",seenIn:"Fortified cereals, enriched flour, instant noodles",labelNote:"Absorption depends on the form and other food components."},{id:"gum-arabic",name:"Gum arabic (acacia gum)",aliases:["Acacia gum","E414"],kind:"Additive",eNumber:"E414",functionClass:"Emulsifier and stabiliser",  most useful clue to what is inside.",checks:["Does the name match the first ingredients listed on the back?","Does a word such as “flavoured”, “style” or “with” change what the food is?","Is this a brand name that says little about the food itself?"],mistake:"Judging a product by an imaginative brand name instead of its descriptive name and ingredient list.",chapterId:"ch03-product-names"},{id:"brand",side:"front",label:"Brand identity",box:{top:8,left:6,width:56,height:6},sampleText:"Meadow Sample Co. is the brand on this fictional pack.",explain:"The brand is the trade name a company uses. It identifies who sells the product, but it does not describe the food. The company named on the brand may not be the one that made the food.",checks:["Find the responsible business name on the back of the pack (region 12).","Remember that one brand can sell several products with different recipes.","Compare products by their descriptive name, ingredients and nutrition, not by the brand alone."],mistake:"Assuming that everything from a familiar brand has the same ingredients, nutrition or quality.",chapterId:"ch03-product-names"},{id:"claim",side:"front",label:"Claim on the front",box:{top:34,left:6,width:46,height:9},sampleText:"Front claim: “High in fibre”. The sample nutrition panel shows 8.0 g fibre per 100 g.",explain:"A claim such as “High in fibre” describes one nutrient. Where a rule defines the claim, the product must meet a set threshold. The claim says nothing about sugars, salt or fat.",checks:["Find the fibre value per 100 g in the nutrition declaration (region 8).","Look up the threshold that applies to the claim in the market where you shop.","Read the other nutrients before deciding whether the product suits you."],mistake:"Treating one positive claim as a summary of the whole product.",chapterId:"ch12-marketing-language",note:{kind:"CHECK THE EVIDENCE",text:"In the EU, a “high fibre” claim requires at least 6 g of fibre per 100 g, or the energy-based equivalent (Regulation (EC) No 1924/2006). Other markets define fibre claims differently, so check the rule for your country."}},{id:"cert",side:"front",label:"Certification mark",box:{top:33,left:60,width:34,height:12},sampleText:"A generic certification mark, drawn for illustration only. It is not a real logo.",explain:"A certification mark shows that an independent body checked the product against a named standard. Each mark has its own scope. Some cover the whole product; others cover one ingredient or one stage of production.",checks:["Identify the certifier and look up its standard or public register, where one is available.","Check what the mark covers: the whole product, one ingredient, or the production method.","A certificate describes how a product was checked. It does not by itself make the product more nutritious."],mistake:"Assuming that a green leaf, a farm picture or the word “natural” means a certification exists.",chapterId:"ch13-organic-certification",note:{kind:"REGIONAL DIFFERENCE",text:"Organic logos, rules and recognition differ by country. A logo from one market is not automatically valid in another, so check the rules where you buy."}},{id:"net",side:"front",label:"Net quantity",box:{top:80,left:6,width:40,height:7},sampleText:"Net 500 g (fictional).",explain:"The net quantity is the amount of food in the pack, excluding packaging. Canned and jarred foods may also show a drained weight. Where the rules require it, net quantity appears in a set place, and the placement rules vary by country.",checks:["Compare prices using the same unit, such as per 100 g or per litre.","For canned or jarred foods, look for the drained weight as well.","Divide the net quantity by the serving size to estimate the number of servings (region 9)."],mistake:"Comparing the price of a drained weight with the price of a total weight.",chapterId:"ch04-package-size"},{id:"ingredients",side:"back",label:"Ingredient list",box:{top:4,left:6,width:88,height:16},sampleText:"Wholegrain oats (62%), rice flour, sugar, barley malt extract, salt, rapeseed oil, natural flavouring. The allergen words are emphasised in bold.",explain:"Ingredients are listed in descending order of weight at the time of manufacture. Compound ingredients may have their own sub-list, and allergens are emphasised in many systems. The order shows relative amounts, not health value.",checks:["Read the first three to five ingredients to see what makes up most of the product.","Look for sugar-containing names such as syrup, glucose, dextrose, honey and fruit juice concentrate.","Find the emphasised allergen words, and read any sub-list in brackets."],mistake:"Assuming the list ranks ingredients by nutritional value, or that a long list is always a poor one.",chapterId:"ch02-ingredient-lists",note:{kind:"LABEL DECODER",text:"“Natural flavouring” describes where the flavouring material comes from. It does not tell you how much of a named food is present."}},{id:"allergens",side:"back",label:"Allergen statement",box:{top:22,left:6,width:88,height:13},sampleText:"Contains: cereals containing gluten (oats, barley). May contain: milk, peanuts (shared line).",explain:"The allergen statement names allergens that are intentional ingredients under the rules of the market. A separate “may contain” line is a precautionary statement about possible cross-contact. It is not an ingredient.",checks:["Read the whole statement, not only the emphasised words.","Compare the allergen names with the table in the Allergen Awareness Explorer for your market.","If you must avoid an allergen, read this statement on every purchase and contact the manufacturer when anything is unclear."],mistake:"Treating a “may contain” line as an ingredient, or ignoring it because it is not in the ingredient list.",chapterId:"ch20-allergens",note:{kind:"SAFETY FIRST",text:"This sample is illustrative. A photograph, a short online description or a partial summary cannot show that a product is free from an allergen. Verify on the physical pack and with the manufacturer, and follow advice from your health professional."}},{id:"nutrition",side:"back",label:"Nutrition declaration",box:{top:37,left:6,width:53,height:34},sampleText:"Per 100 g (fictional): energy 1,448 kJ (346 kcal); fat 6.0 g; saturates 1.0 g; carbohydrate 66 g; sugars 12 g; fibre 8.0 g; protein 11 g; salt 0.9 g.",explain:"The nutrition declaration gives energy and nutrients for a stated amount, usually per 100 g or 100 ml and sometimes per serving. Start by confirming the basis, then compare like with like.",checks:["Confirm the basis (per 100 g, per serving or per pack) before comparing products.","Convert between salt and sodium when units differ. Salt = sodium × 2.5.","Read sugars, saturates and salt together rather than one at a time."],mistake:"Comparing a per-serving figure with a per-100 g figure, or treating a %DV as a personal target.",chapterId:"ch05-nutrition-declaration",note:{kind:"REGIONAL DIFFERENCE",text:"Layouts differ. EU and UK labels usually show values per 100 g with salt. US labels show values per serving with sodium and %DV. Both answer similar questions in different formats."}},{id:"serving",side:"back",label:"Serving information",box:{top:37,left:62,width:32,height:15},sampleText:"Serving size 40 g (about three heaped tablespoons, fictional). About 12.5 servings per pack.",explain:"The declared serving size is a reference amount chosen for labelling. It helps you read the nutrition values and estimate totals. It is not a recommendation of how much to eat.",checks:["Work out the servings per pack: net quantity ÷ serving size (500 ÷ 40 = 12.5).","Compare the declared serving with the amount you usually eat.","Multiply per-serving values by the number of servings you actually eat."],mistake:"Treating one serving as the whole pack, or treating the serving size as a target to aim for.",chapterId:"ch04-package-size"},{id:"date",side:"back",label:"Date marking",box:{top:54,left:62,width:32,height:18},sampleText:"Best before: [date printed here]. The sample uses a placeholder, so no real date is implied.",explain:"Date markings are not interchangeable. In many systems, “use by” is a safety date for perishable food, while “best before” is a quality date. Some terms, such as “sell by”, mainly help shops manage stock.",checks:["Identify which date term is printed, then read the official guidance for your country.","Check the storage instructions too, because storage affects both safety and quality.","Inspect the packaging for damage. Smell and appearance alone cannot establish that food is safe."],mistake:"Treating every date as the same, or treating a best-before date as a strict deadline.",chapterId:"ch21-dates-storage",note:{kind:"SAFETY FIRST",text:"Do not eat food after its “use by” date. A “best before” date concerns quality, but it does not make damaged, mouldy or badly stored food acceptable."}},{id:"storage",side:"back",label:"Storage instructions",box:{top:74,left:6,width:53,height:10},sampleText:"Store in a cool, dry place. Reseal after opening.",explain:"Storage instructions explain how to keep the food safe and in good condition from purchase to use, including what to do after opening. Follow them exactly.",checks:["Find out whether the pack asks you to refrigerate, freeze or keep the food in a cool, dry place.","Note the after-opening instruction and how long it applies.","Follow any preparation or reheating instructions the label gives."],mistake:"Leaving a chilled product unrefrigerated during shopping or travel, or ignoring the after-opening instruction.",chapterId:"ch21-dates-storage"},{id:"business",side:"back",label:"Responsible business",box:{top:85,left:6,width:53,height:7},sampleText:"Packed for: Meadow Sample Co. (fictional).",explain:"The business name and address identify the manufacturer, packer or seller responsible for the product information. Use these details to contact the business about safety-critical questions.",checks:["Check whether the named business is the manufacturer, packer or seller.","For imported products, look for the importer’s details and the country of origin where shown.","Keep these details if you need to report a problem."],mistake:"Assuming that the brand owner made the food, or that an online seller is the manufacturer.",chapterId:"ch01-meet-your-label"},{id:"qr",side:"back",label:"Digital link (QR code)",box:{top:74,left:62,width:32,height:10},sampleText:"An illustrative digital link. The pattern is not a working code.",explain:"A QR code can link to more information, such as a product page, recipe or sourcing details. Scanning it does not confirm that the information is current, complete or genuine.",checks:["Confirm that the web address belongs to the manufacturer or to an official body.","Compare online ingredients, allergens and dates with the physical pack.","Codex guidance adopted in 2024 keeps safety and nutrition information on the physical label. National rules decide the details."],mistake:"Trusting a page reached through a QR code without checking where it comes from.",chapterId:"ch25-online-shopping",note:{kind:"CHECK THE EVIDENCE",text:"A QR code gives access to information. It is not proof of authenticity or traceability."}},{id:"batch",side:"back",label:"Batch or lot code",box:{top:85,left:62,width:32,height:7},sampleText:"Batch: 0457 (fictional).",explain:"The batch or lot code identifies a production run. Manufacturers use it for traceability, and it helps when you check a recall notice.",checks:["Keep a note or photo of the batch code if you may need to report a problem.","Check official recall notices against the product name and batch code.","A batch code does not show how fresh or safe a product is on its own."],mistake:"Assuming that a batch code is a date or a guarantee of quality. Its format is set by the manufacturer.",chapterId:"ch01-meet-your-label"}],Sp=[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2],[4,0],[5,0],[6,0],[4,1],[6,1],[4,2],[5,2] 100 g ÷ (usable share ÷ 100). Imperial units use 1 oz = 28.3495 g, 1 lb = 453.592 g and 1 US fl oz = 29.5735 ml."})]})]})}const Ra=[{id:"q1",topic:"Ingredient lists",question:"In the EU and in the Codex general standard, how are ingredients normally ordered?",options:["By nutritional importance","Alphabetically","In descending order of weight at the time of manufacture","By cost to the manufacturer"],answer:2,explanation:"Ingredients are listed in descending order by weight at manufacture. The order shows relative bulk, not health value, and does not show how much a small ingredient contributes to sodium, sugar or allergens."},{id:"q2",topic:"Sodium and salt",question:"A product declares 600 mg of sodium per serving. What is the approximate salt equivalent?",options:["0.6 g","1.5 g","2.5 g","6.0 g"],answer:1,explanation:"Salt = sodium × 2.5. So 600 mg × 2.5 = 1,500 mg, which is 1.5 g of salt. The same arithmetic in reverse: 1.5 g ÷ 2.5 = 0.6 g = 600 mg sodium."},{id:"q3",topic:"Energy",question:"Approximately how many kilojoules are in one kilocalorie?",options:["1.0","2.5","4.184","10"],answer:2,explanation:"One kilocalorie equals 4.184 kilojoules. To convert kJ to kcal, divide by 4.184."},{id:"q4",topic:"Daily Values",question:"The US sodium Daily Value is 2,300 mg. A serving contains 460 mg. What is the %DV?",options:["10%","20%","46%","200%"],answer:1,explanation:"%DV = 460 ÷ 2,300 × 100 = 20%. A %DV is a reference for a general diet, not a personal target."},{id:"q5",topic:"Sugar claims",question:'Which statement about a "no added sugar" yoghurt with fruit pieces is most accurate?',options:["It contains no sugars at all","It may still contain high levels of naturally occurring sugars","It must be low in energy",'It is "sugar-free" under WHO definitions'],answer:1,explanation:"No added sugar means no sugar was added during processing. Milk lactose and fruit sugars remain, so total sugars can still be high. Energy is not implied by a sugar claim."},{id:"q6",topic:"Allergens",question:'What does a "may contain peanuts" statement usually indicate?',options:["Peanut is an intentional ingredient","Peanut cross-contact is possible during manufacture","The product is guaranteed peanut-free","The product has been tested and approved as safe for allergic people"],answer:1,explanation:"A precautionary statement indicates a possible cross-contact risk, for example from shared equipment. It is not an ingredient. It does not guarantee the presence or absence of the allergen in a given pack, and it does not approve the product for anyone."},{id:"q7",topic:"Date marks",question:"In UK guidance, which date mark is primarily a safety date?",options:["Best before","Use by","Sell by","Display until"],answer:1,explanation:'The FSA describes "use by" as the safety date, and "best before" as the quality date. Eggs are an exception: do not eat them after the best-before date.'},{id:"q8",topic:"Gluten-free",question:"Under the Codex standard and the EU rules, what is the threshold for a gluten-free claim?",options:["2 mg/kg","20 mg/kg","200 mg/kg","1,000 mg/kg"],answer:1,explanation:"The Codex standard for gluten-free foods and EU rules (Regulation (EU) No 828/2014) set 20 mg/kg as the maximum for a gluten-free claim. Wheat-free and gluten-free are not the same."},{id:"q9",topic:"Organic",question:"Which statement about organic certification is accurate?",options:["Organic guarantees a food is more nutritious","Organic certification relies on inspection by control authorities or accredited bodies","Organic foods are always free from all pesticide residues","Organic labels are unregulated in the EU"],answer:1,explanation:"Organic is a legally defined production system in many countries, verified through inspection and traceability. Certification describes how food was produced; it does not guarantee higher nutrition or zero residues in every case."},{id:"q10",topic:"Front-of-pack",question:"Why can two front-of-pack systems classify the same food differently?",options:["They always use identical criteria","They may use different nutrients, thresholds and bases","Only one of them is scientifically valid","Colour is the only difference between them"],answer:1,explanation:"Systems differ in which nutrients they count, the thresholds they use, whether they score per 100 g or per serving, and the food categories they cover. A single symbol summarises one system's criteria."},{id:"q11",topic:"Marketing terms",question:'In many markets, how is the general claim "natural" treated?',options:["Defined by one global standard","Often undefined as a general food claim","Used only for organic foods","Banned everywhere"],answer:1,explanation:'Many markets do not define "natural" for food in general, although specific terms (such as "natural flavouring") have rules. Check the ingredient list and processing details rather than the word alone.'},{id:"q12",topic:"Sugars guidance",question:"What is the WHO strong recommendation for free sugars, as a share of total energy intake?",options:["Less than 5%","Less than 10%","Less than 25%","Less than 50%"],answer:1,explanation:"WHO recommends less than 10% of total energy from free sugars for adults and children, with a further reduction to below 5% suggested as a conditional recommendation. These are population guidelines, not personal targets."},{id:"q13",topic:"Fibre claims",question:'Under the EU rules, what is the threshold for a "high fibre" claim?',options:["At least 3 g per 100 g","At least 6 g per 100 g","At least 10 g per 100 g","At least 20 g per 100 g"],answer:1,explanation:'The EU requires at least 6 g of fibre per 100 g for "high fibre", and at least 3 g per 100 g for "source of fibre" (Regulation (EC) No 1924/2006).'},{id:"q14",topic:"Packaging",question:"Does a recycling symbol confirm that a package can be recycled in your local area?",options:["Yes, always","No. Technical recyclability is not the same as local acceptance","Only for plastic packaging","Only inside the EU"],answer:1,explanation:"A symbol may show that a material is recyclable in principle. Local collection and processing decide whether it can be recycled where you live. Check your local waste authority."},{id:"q15",topic:"Protein claims",question:"A product has 25 g protein and 599 kcal per 100 g. What share of its energy comes from protein?",options:["4.2%","16.7%","25%","40%"],answer:1,explanation:'Protein provides 4 kcal per gram, so 25 × 4 = 100 kcal. 100 ÷ 599 × 100 = 16.7%. This is below the EU threshold of 20% for "high protein".'}];function ey(){const[r,u]=G.useState(0),[p,d]=G.useState(null),[m,x]=G.useState(!1),[A,O]=G.useState(()=>Ra.map(()=>null)),[v,y]=G.useState(!1),j=Ra[r],R=Ra.length,E=G.useMemo(()=>A.reduce((q,J,X)=>q+(J===Ra[X].answer?1:0),0),[A]),w=G.useMemo(()=>{const q=new Map;return A.forEach((J,X)=>{if(J!==null&&J!==Ra[X].answer){const K=Ra[X].topic;q.set(K,(q.get(K)??0)+1)}}),Array.from(q.entries())},[A]),L=()=>{p!==null&&(O(q=>q.map((J,X)=>X===r?p:J)),x(!0))},H=()=>{if(r+1>=R){y(!0);return}u(r+1),d(null),x(!1)},be=()=>{u(0),d(null),x(!1),O(Ra.map(()=>null)),y(!1)};return n.jsx(Et,{id:"quiz",intro:"Answer each question, then read the explanation. The explanation appears after every answer, so you learn why an option is right or wrong. Your results stay in this session.",children:v?n.jsxs("section",{"aria-labelledby":"res-h",className:"rounded-2xl border border-forest/15 bg-white p-5 sm:p-7",children:[n.jsx("h2",{id:"res-h",className:"font-serif text-2xl font-semibold text-forest",children:"Your results"}),n.jsxs("p",{className:"mt-2 text-lg text-charcoal",children:["You answered ",n.jsx("strong",{children:E})," of ",n.jsx("strong",{children:R})," correctly."]}),w.length===0?n.jsx("p",{className:"mt-3 text-sm leading-6 text-charcoal",children:"No misses to review. Revisit any chapter if you want to deepen a topic."}):n.jsxs("div",{className:"mt-4 text-sm leading-6 text-charcoal",children:[n.jsx("p",{className:"font-semibold text-forest",c
