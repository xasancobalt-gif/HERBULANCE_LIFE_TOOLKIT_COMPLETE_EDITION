."},{question:"What should prompt prompt medical assessment?",options:[{text:"Tinnitus that is one-sided, pulsatile or accompanied by sudden hearing loss.",correct:!0,feedback:"These features need clinical evaluation; sudden hearing loss is time-sensitive."},{text:"Tinnitus that you can hear only in a soundproof room.",feedback:"This may need discussion but is not the same red-flag cluster as sudden hearing loss or neurological symptoms."},{text:"Tinnitus remembered from childhood without current impact.",feedback:"A remote, resolved symptom is different from new, persistent or escalating symptoms; discuss current concerns with a professional."},{text:"Any question about tinnitus.",feedback:"Many questions deserve advice, but urgency depends on features. Sudden hearing loss and neurological signs require urgent care."}],explanation:"Red flags help prioritise care. They never replace a proper clinical history and examination."}],related:[{number:12,title:"Sleep, Circadian Rhythm and Natural Restorative Living",reason:"Tinnitus can be more noticeable at night; reliable sleep strategies can support coping."},{number:13,title:"Stress Management and Emotional Wellbeing",reason:"CBT-based coping and stress reduction are relevant to how intrusive tinnitus feels."}]},{number:12,id:"hearing-loss",part:3,title:"Hearing loss: types, causes and recognition",subtitle:"Recognise change early and seek the right assessment",readingMinutes:11,lede:"Hearing loss is a common health experience, not a personal failure. It can be temporary or permanent, conductive or sensorineural, present at birth or acquired later. Sudden hearing loss is the most time-critical presentation.",objectives:["Distinguish conductive, sensorineural and mixed hearing loss.","Recognise common acquired and congenital contributors.","Identify sudden hearing loss and understand why it is urgent.","Describe typical signs and the role of formal assessment."],blocks:[{type:"p",text:"Hearing loss is described by its type, degree, pattern and cause. Conductive hearing loss occurs when sound is not transmitted efficiently through the outer or middle ear—for example with wax, fluid or a middle-ear problem. Sensorineural hearing loss arises from the cochlea or auditory nerve and is usually permanent. Mixed hearing loss combines both."},{type:"callout",tone:"safety",title:"Sudden hearing loss is urgent",text:"Hearing that drops suddenly, especially in one ear, needs prompt medical assessment—ideally the same day or within days. Do not wait to see whether it clears. Sudden sensorineural hearing loss may benefit from timely treatment, and some treatable causes need to be excluded."},{type:"heading",text:"Common contributors"},{type:"table",headers:["Category","Examples","Typical pattern"],rows:[["Conductive","Impacted wax, middle-ear fluid, eardrum perforation, ossicular problem","Often temporary or treatable; hearing may be muffled"],["Sensorineural","Age-related change, noise, genetic factors, infection, ototoxic medicines","Often permanent; high frequencies or speech clarity may be affected"],["Mixed","Chronic infection with inner-ear involvement, some congenital conditions","Both transmission and sensory components"]]},{type:"p",text:"Age-related hearing loss is usually gradual and often affects high frequencies first. Speech may sound clear enough in a quiet room while consonants seem to disappear in noise. Noise-induced hearing loss is often linked to years of exposure, although a single very loud event can cause permanent damage. Genetic factors, congenital infections, head injury, some medicines and certain health conditions can also contribute."},{type:"heading",text:"Early signs worth discussing"},{type:"list",items:["People seem to mumble, especially in groups or restaurants.","You need a higher television volume than others.","Phone conversations are harder, or one ear is clearly different.","Ringing, fullness or discomfort accompanies hearing change.","You avoid social situations because listening feels exhausting.","A child does not respond consistently, has speech delay or struggles at school.","A sudden change occurs—get assessed urgently."]},{type:"heading",text:"What assessment looks like"},{type:"p",text:"Assessment starts with history and examination. An audiologist may measure hearing with pure-tone and speech testing, and check middle-ear function. Additional tests such as otoacoustic emissions or auditory brainstem response can be useful in specific situations. The average hearing of low, mid and high frequencies does not tell the whole story; speech discrimination and the shape of the audiogram matter."},{type:"callout",tone:"evidence",title:"Communication, not just sensitivity",text:"Hearing difficulty is not fully described by how quiet a tone must be before it is heard. Speech clarity, tinnitus, listening effort, background noise and social participation all matter. Person-reported experiences and communication goals belong in assessment and support planning."},{type:"heading",text:"Prevention and action"},{type:"p",text:"Reduce avoidable noise, use appropriate protection, manage cardiovascular and general health with your clinician, avoid unproven ear treatments and follow up after infections or trauma. Do not stop a prescribed medicine because of a possible effect without urgent medical advice; ask the prescriber. If hearing changes suddenly or affects only one side, seek prompt care rather than waiting."},{type:"p",text:"Hearing loss does not need to be hidden. Assessment opens options that may include monitoring, medical treatment, hearing technology, assistive listening, communication strategies and support for psychological wellbeing. The right plan depends on the person, the cause, communication needs and available services."}],takeaways:["Hearing loss is classified by type and cause; not all loss is permanent or due to ageing.","Sudden hearing loss requires prompt assessment—do not wait it out.","High-frequency loss and difficulty in noise are common early patterns.","Assessment and support should address communication and participation, not only volume."],quiz:[{question:"Which statement about sudden hearing loss is correct?",options:[{text:"It is usually safe to wait several months to see whether it resolves.",feedback:"Waiting can delay treatment for a potentially time-sensitive condition. Sudden hearing loss needs prompt assessment."},{text:"It should be assessed urgently, especially if it affects one ear.",feedback:"Correct. Sudden hearing loss can have treatable causes and needs prompt evaluation.",correct:!0},{text:"It always means permanent deafness.",feedback:"Sudden hearing loss can recover partially or fully, but outcomes vary. Timely assessment maximises the chance of identifying and managing causes."},{text:"Cotton buds are the first step to unblock it.",feedback:"Do not insert objects. Sudden hearing loss is not assumed to be wax and requires medical assessment."}],explanation:"Sudden sensorineural hearing loss is a medical urgency. Prompt assessment helps identify conditions that need timely treatment or specialist care."},{question:"What is sensorineural hearing loss?",options:[{text:"Loss due to a block in the outer ear canal only.",feedback:"Outer- or middle-ear obstruction causes conductive loss. Sensorineural involves the cochlea or auditory nerve."},{text:"Hearing loss related to the inner ear or auditory nerve.",correct:!0,feedback:"It usually reflects damage to sensory hair cells or neural pathways and is often permanent."},{text:"A temporary change caused only by earwax.",feedback:"Wax causes conductive loss. It can coexist with sensorineural loss and should not be assumed."},{text:"A condition that cannot affect speech understanding.",feedback:"Speech understanding can be affected, especially in noise; that is a central part of the experience."}],explanation:"Sensorineural loss involves the inner ear or nerve pathway. The pattern and severity guide support options, but they do not predict every communication experience."}],related:[{number:19,title:"Brain Health, Memory and Cognitive Function",reason:"Hearing supports communication and cognitive engagement; Book 19 explores brain-health habits and cognition."}]},{number:13,id:"dizziness-and-vertigo",part:3,title:"Dizziness, vertigo and balance disorders",subtitle:"A symptom, not a diagnosis",readingMinutes:12,lede:"Dizziness is a description, not a diagnosis. Vertigo, unsteadiness, light-headedness and presyncope can feel similar yet point in different directions. The timing, triggers and associated symptoms are essential—and some patterns require emergency care.",objectives:["Differentiate dizziness, vertigo, unsteadiness and light-headedness.","Understand common vestibular conditions without self-diagnosing.","Recognise emergency neurological warning signs.","Describe assessment, rehabilitation and fall-prevention principles."],blocks:[{type:"p",text:"Vertigo is the false sensation that you or the room is spinning or moving. Dizziness is broader and may mean light-headedness, disorientation or disequilibrium. Unsteadiness may come from vestibular, visual, neurological, muscular, medication-related or circulatory factors. A person can use these words differently, so clinicians ask about what actually happens."},{type:"callout",tone:"safety",title:"Call emergency services",text:"Sudden severe vertigo with weakness, facial drooping, slurred speech, double vision, trouble swallowing, severe headache, confusion, fainting, chest pain or inability to walk may indicate a stroke or another emergency. Do not try repositioning exercises, drive yourself or wait at home."},{type:"heading",text:"Common vestibular patterns"},{type:"table",headers:["Condition","Typical experience","Important note"],rows:[["BPPV","Brief spinning triggered by head position changes","Diagnosis uses specific eye-movement findings; treatment manoeuvres are condition-specific"],["Vestibular neuritis","Sudden prolonged vertigo, often with nausea, without hearing loss","Needs prompt assessment when stroke cannot be excluded"],["Labyrinthitis","Vertigo with hearing change or tinnitus","Sudden hearing loss needs urgent assessment"],["Ménière's disease","Episodes of vertigo with fluctuating hearing, fullness or tinnitus","Episodes vary; diagnosis is clinical and requires specialist input"],["Vestibular migraine","Recurrent dizziness/vertigo with migraine features","May occur without headache; diagnosis follows recognised criteria"]]},{type:"p",text:"BPPV—benign paroxysmal positional vertigo—occurs when calcium-carbonate crystals move into a semicircular canal and cause brief vertigo with certain head positions. It is common and often treatable, but the diagnosis depends on the specific eye movements observed during positional testing. Repositioning manoeuvres are safe only when the correct canal is identified and the person is suitable."},{type:"callout",tone:"evidence",title:"Do not skip the differential diagnosis",text:"A textbook description cannot rule out stroke, medication toxicity, cardiac causes, neurological disease or inner-ear infection. New severe vertigo, especially in someone with vascular risk factors or neurological signs, needs immediate evaluation. Online checklists and videos are not diagnostic tools."},{type:"heading",text:"How assessment works"},{type:"p",text:"A clinician asks about onset and duration, triggers, hearing, tinnitus, headache, visual symptoms, weakness and medications. Examination may include eye movements, positional testing, balance and neurological checks. Hearing tests and sometimes imaging or specialist assessment are arranged when indicated. Tests are chosen to answer specific questions, not as a universal battery for every symptom."},{type:"heading",text:"Rehabilitation and daily safety"},{type:"p",text:"Vestibular rehabilitation is tailored by a trained therapist. It may include habituation and gaze-stability exercises, balance training and gradual return to movement. It is not a generic “dizziness workout”. If symptoms are new or severe, or you cannot walk safely, seek urgent assessment first."},{type:"list",items:["Avoid driving, ladders or high-risk tasks while acutely unsteady or after intense vertigo.","Remove trip hazards and use night lighting; discuss walking aids if balance is uncertain.","Do not stop medications without advice, and review sedating or blood-pressure medicines with a clinician.","Keep eyes and hearing as well supported as possible; both contribute to orientation.","Discuss recurrent falls with a healthcare professional, even if the cause seems obvious."]},{type:"heading",text:"Living with uncertainty"},{type:"p",text:"Vestibular symptoms can affect work, travel, relationships and confidence. Cognitive behavioural support, careful pacing and a clear safety plan may help while diagnosis and rehabilitation proceed. Seek help if dizziness is affecting mood or daily function. The goal is not to ignore symptoms, but to reduce avoidable harm and make informed decisions with a qualified team."}],takeaways:["Dizziness is a symptom with many causes; vertigo is a specific false sensation of movement.","Common conditions include BPPV, vestibular neuritis, Ménière’s disease and vestibular migraine, but diagnosis needs clinical assessment.","Repositioning exercises are not appropriate for every dizzy person.","Stroke-like symptoms with vertigo are an emergency; fall safety is part of ongoing care."],quiz:[{question:"Which description best fits vertigo?",options:[{text:"A false sensation that you or the room is spinning or moving.",correct:!0,feedback:"Vertigo specifically describes a false sensation of movement, though people may use “dizzy” more broadly."},{text:"A type of hearing test.",feedback:"Hearing tests include pure-tone audiometry and speech testing, not vertigo."},{text:"The highest point of the skull.",feedback:"The vertex is an anatomical landmark at the top of the head; it is not vertigo."},{text:"A middle-ear bone.",feedback:"The middle-ear bones are the malleus, incus and stapes."}],explanation:"Knowing whether you feel spinning versus light-headedness helps communication with a clinician, but it does not by itself establish a diagnosis."},{question:"When is BPPV repositioning appropriate?",options:[{text:"Whenever someone feels slightly dizzy after standing.",feedback:"Standing light-headedness has many causes and is not automatically BPPV. A manoeuvre could be inappropriate and delay other care."},{text:"When the symptom has been assessed and the specific positional pattern is identified by a trained clinician.",correct:!0,feedback:"Treatment depends on the affected canal and the person’s circumstances. Assessment precedes the manoeuvre."},{text:"For every type of vertigo, because the manoeuvre is harmless.",feedback:"Manoeuvres can worsen symptoms and are not appropriate for every condition. Some causes need urgent different care."},{text:"Only when vertigo is accompanied by weakness or slurred speech.",feedback:"Those are emergency symptoms; repositioning should not delay emergency assessment."}],explanation:"BPPV treatment is effective in the right context, but the context must be established clinically—especially when symptoms are new, severe or atypical."}],related:[{number:14,title:"Physical Activity, Movement and Lifelong Fitness",reason:"Strength and balance activity can support confidence and reduce fall risk, alongside professional rehabilitation."},{number:25,title:"Nervous System Health",reason:"Dizziness can involve the brain, nerves, circulation and inner ear; understanding nervous-system health supports informed conversations."}]},{number:14,id:"other-ear-conditions",part:3,title:"Other important ear conditions",subtitle:"A proportionate guide to less common diagnoses",readingMinutes:10,lede:"Some ear conditions are uncommon but important enough to recognise. Knowing their names can reduce fear and help you ask better questions—without turning a general guide into a diagnostic manual.",objectives:["Recognise the basic features of selected ear conditions.","Understand which findings need prompt specialist assessment.","Avoid self-diagnosis and unsafe home management.","Know what questions to ask when a specialist gives a diagnosis."],blocks:[{type:"p",text:"Most ear symptoms do not signal a rare disease. Still, conditions such as a perforated eardrum, cholesteatoma, otosclerosis, vestibular schwannoma and barotrauma have distinct features. This chapter is an orientation, not a substitute for examination or imaging."},{type:"heading",text:"Perforated eardrum"},{type:"p",text:"A hole or tear in the eardrum can follow infection, trauma, a sudden pressure change or insertion of an object. Symptoms may include sudden pain, reduced hearing, ringing, blood or discharge. Some perforations heal without surgery. Do not put anything into the ear, avoid water exposure, and seek assessment—especially if you have severe pain, dizziness or ongoing discharge."},{type:"heading",text:"Eustachian tube dysfunction"},{type:"p",text:"When the Eustachian tube does not open normally, the middle ear can feel full, pop, or produce altered hearing. Colds, allergies, weight changes and anatomical factors may contribute. Persistent cases can involve fluid or retraction of the eardrum. Gentle equalisation is safe for some but not all people; forceful manoeuvres can cause injury. Ask a clinician if symptoms persist."},{type:"heading",text:"Cholesteatoma"},{type:"p",text:"Despite the name, a cholesteatoma is not a cancer. It is an abnormal collection of skin-like tissue in the middle ear or mastoid that can erode bone. A persistent smelly discharge, hearing loss, a retraction pocket or repeated ear infections may prompt evaluation. Surgical treatment is often needed. New facial weakness, severe headache, swelling behind the ear or dizziness needs urgent assessment."},{type:"heading",text:"Otosclerosis"},{type:"p",text:"Otosclerosis involves abnormal bone remodelling around the middle-ear structures, often causing progressive conductive hearing loss. It can run in families and may affect both ears. Diagnosis is made by a clinician with history, examination and hearing tests. Options may include monitoring, hearing aids or surgery after specialist discussion; no single option fits everyone."},{type:"heading",text:"Vestibular schwannoma"},{type:"p",text:"A vestibular schwannoma is a usually slow-growing benign tumour of the nerve carrying balance and hearing information. It can cause one-sided hearing loss, tinnitus or imbalance and is sometimes found incidentally. It is rare compared with age-related hearing change. One-sided hearing loss needs assessment, but an audiogram alone cannot diagnose or exclude a tumour. MRI and specialist input are used when indicated."},{type:"heading",text:"Injury, barotrauma and congenital conditions"},{type:"p",text:"Head trauma can fracture bones, disrupt the ossicles, damage the inner ear or cause a cerebrospinal-fluid leak. A clear watery discharge after head trauma needs urgent emergency assessment. Pressure injuries from diving or flying can perforate the eardrum or affect the inner ear. Congenital conditions may affect the shape of the outer ear, the canal, middle-ear structures or the inner ear, and may occur with other health needs. Care is individual and often multidisciplinary."},{type:"callout",tone:"safety",title:"Symptoms that need urgent review",text:"Facial weakness, severe headache, swelling or pain behind the ear, confusion, neck stiffness, severe dizziness with neurological signs, clear watery discharge after head injury or blood from the ear after trauma requires urgent medical assessment. Do not place drops or objects into an ear after trauma."},{type:"table",headers:["Condition","Possible clue","Typical next step"],rows:[["Perforation","Pain then hearing change; discharge after infection/trauma","Examination; protect from water and objects"],["Cholesteatoma","Smelly discharge, hearing loss, retraction","ENT assessment; may require surgery"],["Otosclerosis","Gradual conductive loss, family history","Audiometry; discuss monitoring/aids/surgery"],["Vestibular schwannoma","One-sided hearing loss or tinnitus","Audiologic and specialist assessment; MRI if indicated"]]},{type:"p",text:"When you receive a diagnosis, useful questions include: What part of the ear is affected? Is this urgent? What tests confirm it? What are the benefits and risks of each option? What should I do if symptoms change? Do I need a follow-up hearing test? Ask for written information and, where possible, bring a support person to help remember details."}],takeaways:["A perforated eardrum needs protection and assessment; keep objects and unadvised drops out.","Cholesteatoma is not cancer but can erode bone and usually needs specialist treatment.","One-sided hearing loss deserves assessment; it does not automatically mean a tumour.","Urgent symptoms after trauma or with neurological change require emergency care."],quiz:[{question:"A person develops clear watery fluid from the ear after a head injury. What is the priority?",options:[{text:"Use earplugs to stop the fluid.",feedback:"This could trap fluid and delay diagnosis. Clear fluid after trauma may indicate a cerebrospinal-fluid leak and needs emergency assessment."},{text:"Start antibiotic ear drops from an old prescription.",feedback:"Do not put anything into the ear after trauma without emergency assessment and advice."},{text:"Seek emergency medical assessment.",correct:!0,feedback:"Clear fluid, blood or neurological symptoms after head trauma need urgent evaluation."},{text:"Wait until the next scheduled hearing test.",feedback:"This is potentially serious. Immediate medical assessment is needed."}],explanation:"Post-traumatic clear discharge can be a sign of a skull-base injury and possible cerebrospinal-fluid leak. Do not self-treat."},{question:"Which statement about a vestibular schwannoma is accurate?",options:[{text:"It is a common result of earwax.",feedback:"It is not caused by wax. It is a usually slow-growing benign tumour of the vestibular nerve."},{text:"It is usually slow-growing and can cause one-sided hearing loss or tinnitus.",correct:!0,feedback:"These symptoms warrant assessment and specialist imaging when appropriate; age-related hearing loss is much more common."},{text:"It can be reliably diagnosed by an audiogram alone.",feedback:"Audiometry shows hearing function but cannot diagnose or exclude this tumour; specialist assessment and imaging may be needed."},{text:"It always causes immediate facial weakness.",feedback:"Facial weakness can occur with large tumours but is not universal; any facial weakness needs urgent assessment."}],explanation:"Rare conditions need proportionate awareness. One-sided hearing symptoms are checked clinically; the most likely cause is usually not a tumour."}],related:[{number:26,title:"Eye Health and Vision",reason:"Vision problems can contribute to unsteadiness and falls; Book 26 covers the visual half of sensory balance."}]}],pb=[{number:15,id:"understanding-hearing-tests",part:4,title:"Understanding hearing tests",subtitle:"What the tests measure, and what they do not",readingMinutes:11,lede:"A hearing test is more than a set of numbers. It describes how you hear across frequencies and in speech, how your middle ear is working and what support might help. Knowing the basics makes the appointment less mysterious.",objectives:["Distinguish hearing screening from diagnostic assessment.","Describe common hearing tests and their purposes.","Read a simplified audiogram without treating it as a diagnosis.","Prepare useful questions for a hearing appointment."],blocks:[{type:"p",text:"A screening test sorts people into those who need further assessment and those for whom no immediate concern is identified. It is not designed to diagnose. A diagnostic assessment is more detailed and is interpreted by a qualified professional in the context of your history, symptoms, communication needs and examination."},{type:"heading",text:"Common tests"},{type:"p",text:"Pure-tone audiometry measures the quietest tone you can hear at several frequencies, usually from low to high pitch. Sounds may be delivered through headphones or insert earphones, and bone-conduction testing may compare inner-ear function directly. Speech audiometry checks how well you recognise speech at different levels. Tympanometry assesses middle-ear mobility and pressure."},{type:"list",items:["Pure-tone audiometry: sensitivity across frequencies; the core hearing test.","Bone-conduction testing: helps distinguish conductive from sensorineural components.","Speech audiometry: word or sentence recognition at comfortable or varying levels.","Tympanometry: indirectly assesses middle-ear pressure and eardrum movement.","Otoacoustic emissions (OAEs): measure sounds produced by healthy cochlear outer hair cells; useful in newborn screening.","Auditory brainstem response (ABR): records neural responses to sound; useful when behavioural testing is limited, such as in infants."]},{type:"diagram",kind:"audiogram",caption:"Illustrative audiogram with educational patterns. This is not a patient’s result and cannot diagnose hearing loss. Lower dB values mean quieter sounds; frequency increases to the right."},{type:"heading",text:"The axes and symbols"},{type:"p",text:"On an audiogram, frequency in hertz (Hz) runs across the bottom—usually low to high. Hearing level in decibels (dB HL) runs down the side, with lower numbers near the top. The softest sounds a person can hear at each frequency are plotted. Symbols vary between services; blue or X often relates to the left ear, red or O to the right, and brackets for bone conduction. Always ask your clinician to explain your own chart; symbol conventions and masking procedures can be technical."},{type:"callout",tone:"evidence",title:"An audiogram is not the whole story",text:"Two people can have the same audiogram and different communication experiences. Speech understanding, tinnitus, listening effort, cognitive factors, environment and personal goals matter. A hearing test should lead to a conversation about function, not simply a category."},{type:"heading",text:"How to prepare"},{type:"p",text:"Bring a list of medicines and supplements, relevant health conditions, previous ear surgery, noise exposure and family history. Note when symptoms began and what situations are difficult. If you use hearing aids or other devices, bring them and their accessories. Unless the clinic tells you otherwise, do not clean your ears or use unfamiliar drops before the appointment. Ask if you need someone to help you get home, especially if balance or bright-light sensitivity is a concern."},{type:"checklist",title:"Hearing-test preparation",items:["I have noted my hearing and balance symptoms and when they started.","I have listed medicines, supplements and allergies.","I can describe situations that are difficult—phone, work, restaurants, family.","I have considered bringing a support person if communication is tiring.","I know what to expect and who will explain the results.","I have prepared questions about follow-up, technology and costs."]},{type:"heading",text:"Questions worth asking"},{type:"list",items:["What does my audiogram show in plain language?","Is my hearing change temporary, stable or likely to change?","Do I need medical or surgical follow-up?","What are my options, including communication strategies and assistive technology?","What follow-up interval do you recommend, and why?","How do my results compare with what I experience in conversation?"]},{type:"callout",tone:"note",title:"Learning activity",text:"Open the Audiogram Explorer in the Learning Studio and compare illustrative patterns. Practise describing the shape of a curve rather than diagnosing it: “hearing is better in low frequencies than high” or “there is a dip around 4 kHz”. The purpose is to build comfort with the language of hearing."}],takeaways:["Screening identifies need for further testing; diagnostic assessment is more detailed.","Audiometry measures hearing sensitivity, while speech tests and middle-ear tests add function and context.","Audiograms must be interpreted by a qualified professional in the context of the person.","Preparation and good questions improve the value of a hearing appointment."],quiz:[{question:"How is frequency represented on a typical audiogram?",options:[{text:"From top to bottom, with higher frequencies at the bottom.",feedback:"Hearing level runs down the vertical axis. Frequency usually runs left to right."},{text:"From left to right, with low frequencies on the left.",correct:!0,feedback:"The horizontal axis typically shows frequency increasing from left (low) to right (high)."},{text:"By the colour of the ear canal.",feedback:"Colour may indicate ear side in some charts, but it does not represent frequency."},{text:"By the length of the sound sample only.",feedback:"Stimulus duration is controlled in testing but is not the audiogram’s frequency axis."}],explanation:"Standard audiograms place frequency across the horizontal axis and hearing level down the vertical axis. Symbol conventions vary and should be explained by your clinician."},{question:"What is the purpose of speech audiometry?",options:[{text:"To measure middle-ear pressure only.",feedback:"Tympanometry is used to assess middle-ear function and pressure."},{text:"To see how well words or sentences are recognised, adding functional information to tone thresholds.",correct:!0,feedback:"Speech tests can reveal difficulty that a pure-tone average does not capture, especially in noise."},{text:"To replace a medical examination.",feedback:"A test is one part of assessment. It does not replace history, examination and clinical judgement."},{text:"To diagnose a vestibular disorder.",feedback:"Vestibular assessment uses different tests. Hearing tests may support broader assessment but do not diagnose balance conditions on their own."}],explanation:"Speech audiometry connects hearing sensitivity with the real task of understanding spoken language. Its format and interpretation vary by service."}],related:[{number:19,title:"Brain Health, Memory and Cognitive Function",reason:"Understanding speech and listening in challenging conditions involves memory, attention and cognitive processing."}]},{number:16,id:"hearing-support-and-treatment",part:4,title:"Understanding hearing support and treatment",subtitle:"From medical care to hearing technology",readingMinutes:12,lede:"Support for hearing loss is not one product or one decision. It can include medical treatment, surgery, hearing aids, implants, assistive technology, communication strategies and rehabilitation. Benefits depend on the cause, the person and the fit of the plan.",objectives:["Describe the main categories of hearing treatment and support.","Explain how hearing aids, bone-conduction devices and cochlear implants differ.","Recognise that technology does not restore normal hearing for everyone.","Identify questions and practical supports for informed decisions."],blocks:[{type:"p",text:"The first question is whether a treatable medical condition is contributing. Wax, fluid, infection, a perforated eardrum, otosclerosis or other middle-ear problems may need medical or surgical management before—or alongside—hearing technology. Some sensorineural hearing loss has no reversible cause, which is why support focuses on communication and function."},{type:"heading",text:"Hearing aids"},{type:"p",text:"Hearing aids are small electronic devices that receive, process and amplify sound. Modern aids can be customised across frequencies and may include directionality, noise management, feedback control and wireless connectivity. They do not restore a normal cochlea or make every listening situation easy. Benefit depends on the fitting, the type and degree of hearing loss, the person’s communication goals and consistent use."},{type:"list",items:["Receiver-in-canal and behind-the-ear styles suit many hearing profiles and allow more features.","In-the-ear styles vary in size and may be more discreet but have fit and maintenance considerations.","Rechargeable and disposable-battery models have different practical trade-offs.","A qualified professional fits and adjusts devices using hearing tests and real-life feedback.","Follow-up visits and realistic expectations are part of good support."]},{type:"callout",tone:"evidence",title:"Evidence and expectations",text:"A systematic Cochrane review found that hearing aids can improve hearing-related quality of life for adults with mild to moderate hearing loss, though evidence quality varied. Benefits are not uniform. Hearing aids do not promise “normal” hearing, and they are not the right choice for every type or degree of loss."},{type:"heading",text:"Bone-conduction devices"},{type:"p",text:"Bone-conduction devices send vibration through the skull to the inner ear, bypassing the outer or middle ear. They may suit particular conductive or mixed hearing losses, single-sided deafness and some congenital conditions, depending on candidacy criteria. Devices can be worn on a headband, attached to a softband, or in some cases implanted after specialist assessment."},{type:"heading",text:"Cochlear implants"},{type:"p",text:"A cochlear implant is an electronic medical device. An external processor picks up sound, processes it and sends signals to an electrode array surgically placed in the cochlea, where it stimulates auditory nerve fibres. A receiver is placed under the skin. It does not produce normal hearing. Outcomes vary widely and depend on factors such as age at implant, hearing history, communication experience and rehabilitation."},{type:"callout",tone:"safety",title:"Medical devices need specialist care",text:"Cochlear implants and some implanted hearing devices require surgery and lifelong follow-up. MRI and certain medical treatments may need device-specific precautions. Do not rely on general internet advice about compatibility; contact the implant team. Report new pain, skin irritation, device malfunction or sudden hearing change promptly."},{type:"heading",text:"Assistive listening and access"},{type:"p",text:"Hearing aids are not the only option. Assistive listening systems can deliver speech directly from a microphone or television to headphones or a hearing device. Captions, speech-to-text apps, vibrating alerts, amplified phones, induction loops and visual alarms can reduce barriers. Communication access also depends on the environment: quiet rooms, good lighting, clear speech and a willingness to repeat or rephrase."},{type:"heading",text:"Rehabilitation and communication strategies"},{type:"p",text:"A good hearing plan includes practice and support, not just a device. Listening programmes, communication training, family involvement and realistic environmental strategies can help. For some, auditory rehabilitation after implantation is substantial and essential. For others, strategies such as asking people to face them or repeating the key word in a phrase are more useful than pretending to understand."},{type:"table",headers:["Support","What it can do","What it does not do"],rows:[["Hearing aids","Amplify and shape sound; support communication","Restore a normal ear or eliminate all listening effort"],["Bone-conduction devices","Bypass outer/middle-ear sound transmission","Treat every sensorineural hearing loss"],["Cochlear implants","Stimulate the auditory nerve in selected candidates","Produce normal hearing or work identically for all users"],["Assistive technology","Deliver and visualise information in accessible ways","Replace the need for communication-friendly environments"]]},{type:"heading",text:"Cost, suitability and consent"},{type:"p",text:"Access varies by country, insurance, public programmes and personal finances. Ask about total costs, trials, warranties, repairs, batteries, accessories and follow-up. A clinician should explain candidacy, alternatives, benefits and limitations without pressure. A trial period or second opinion may be useful. The best plan is one that helps the person participate in their own life—not the most expensive device on the page."}],takeaways:["Treatable medical contributors should be considered before or alongside technology.","Hearing aids can improve function and quality of life for many people but do not restore normal hearing universally.","Cochlear implants stimulate the auditory nerve and require specialised surgery and follow-up.","Assistive access, communication strategies and rehabilitation are part of hearing care."],quiz:[{question:"What is the best description of a hearing aid?",options:[{text:"A device that cures all hearing loss.",feedback:"Hearing aids do not cure hearing loss. They amplify and process sound for people with suitable hearing profiles."},{text:"A device that amplifies and processes sound, with results that vary by person and fitting.",correct:!0,feedback:"Benefit depends on hearing profile, device fitting, communication needs and consistent use, not simply the device model."},{text:"A surgical implant in the cochlea.",feedback:"Cochlear implants are surgically placed devices that stimulate the auditory nerve. Hearing aids are worn in or behind the ear."},{text:"A substitute for medical assessment.",feedback:"Hearing technology should follow a suitable assessment. Treatable middle-ear or ear-canal problems may need different care."}],explanation:"Hearing aids are useful technology, not a cure. Informed expectations and good fitting support better outcomes."},{question:"Who may need specialist assessment for a cochlear implant?",options:[{text:"Anyone who wants smaller devices.",feedback:"Device style preference alone is not an indication for an implant. Candidacy depends on hearing profile and medical factors."},{text:"Selected people whose hearing loss is not sufficiently helped by hearing aids and who meet specialist candidacy criteria.",correct:!0,feedback:"Cochlear implant candidacy is individual and requires hearing, medical, anatomical and communication assessment."},{text:"People with earwax only.",feedback:"Wax is managed after examination, not with an implant. Implants are for selected auditory nerve stimulation candidates."},{text:"Only children under 12 months.",feedback:"Candidacy is not limited to infants. Age and circumstances are considered individually, and rehabilitation needs vary."}],explanation:"Cochlear implants are powerful but not universal. Multidisciplinary assessment weighs likely benefits, risks, anatomy, communication history and support."}],related:[{number:13,title:"Stress Management and Emotional Wellbeing",reason:"Adjusting to hearing change and new technology can involve stress, identity and confidence."}]},{number:17,id:"living-well-with-hearing-differences",part:4,title:"Living well with hearing differences",subtitle:"Communication, access, identity and belonging",readingMinutes:10,lede:"Hearing is one way—not the only way—to connect. Living well with hearing difference is less about passing as hearing and more about having access, agency and relationships that respect how you communicate.",objectives:["Apply practical communication strategies with respect and consent.","Identify accessible environments and assistive technology options.","Recognise emotional wellbeing and stigma as legitimate aspects of hearing care.","Respect Deaf culture, sign languages and individual communication identity."],blocks:[{type:"p",text:"A hearing difference is not a character flaw. Many people benefit from technology and communication strategies, while others find identity and belonging in Deaf communities and signed languages. Both are legitimate. A respectful book should not imply that everyone wants the same intervention or that a hearing future is automatically a better future."},{type:"heading",text:"Communication strategies that help both sides"},{type:"list",items:["Get attention before speaking; face the person and keep lip movements visible.","Reduce background noise: turn down music, move away from running water, choose a quieter table.","Speak clearly at a natural volume—not exaggeratedly slowly or from another room.","Rephrase rather than repeating the same words in the same way.","Check understanding by summarising important details and asking what support is preferred.","Use visual cues, writing, captions and message apps when they make communication easier.","Do not say “never mind” when a person asks for repetition; the information matters."]},{type:"callout",tone:"practice",title:"Consent over assumptions",text:"Ask whether someone uses hearing aids, sign language, lip-reading or captions—and do not touch or adjust their device without permission. Helpfulness is not deciding what someone needs. It is making access possible and respecting their answers."},{type:"heading",text:"Accessible environments"},{type:"p",text:"Accessibility is designed, not improvised. Good lighting, clear sightlines, reduced reverberation, visible alarms and captioning support participation. In classrooms, loop or remote-microphone systems and real-time captioning can be important. At work, reasonable adjustments may include written instructions, meeting notes, communication support or modified telephone duties. Access is typically a shared responsibility between organisations and individuals."},{type:"heading",text:"Emotional wellbeing and stigma"},{type:"p",text:"People may avoid hearing checks because they fear looking old or disabled. They may nod along in conversation to avoid seeming confused. Stigma can delay care and increase isolation. A better response is to make hearing conversations ordinary, offer practical support and challenge jokes that mock hearing loss. If hearing difficulty is affecting mood, sleep or relationships, tell a professional; psychological support is valid care."},{type:"heading",text:"Deaf culture and identity"},{type:"p",text:"Sign languages are complete natural languages with their own grammar and communities—not gestures or spoken-language substitutes. Deaf identity is not defined by a desire to hear. A person may use cochlear implants and sign language, or neither. In healthcare, education and public services, qualified interpreters and accessible communication are part of equitable care."},{type:"heading",text:"Supporting caregivers and families"},{type:"p",text:"Caregivers often manage appointments, technology, batteries and communication access. Their support matters, but the person’s autonomy matters too. Ask before speaking for someone, include them directly in conversations and share information in a format they can use. Support groups and audiology follow-up can help the whole family adjust."},{type:"p",text:"A practical plan might include a captioning app, a preferred communication note in a wallet, a routine check of device batteries and a quiet table at family gatherings. Small design choices often have a bigger effect than forcing a person to “try harder”."}],takeaways:["Communication access is a shared responsibility; ask about preferences rather than assuming.","Reduce environmental barriers and use captioning, assistive technology and visual supports.","Stigma and emotional strain are legitimate reasons to seek support.","Respect sign languages, Deaf culture and each person’s communication identity."],quiz:[{question:"What is a respectful response when someone asks you to repeat a sentence?",options:[{text:"Say “never mind” to save time.",feedback:"This can exclude the person and imply their participation does not matter. Rephrase instead."},{text:"Speak very slowly and loudly from another room.",feedback:"Volume and exaggeration do not replace clarity and proximity. Move closer, face them and speak naturally."},{text:"Rephrase clearly, face them and reduce background noise.",correct:!0,feedback:"Rephrasing and removing barriers makes understanding easier without blaming the listener."},{text:"Write every conversation out in full even if not requested.",feedback:"Writing can help, but access should be negotiated. Do not assume a single method is preferred."}],explanation:"Communication is a two-way design problem. Repeating differently and reducing background noise are often more useful than simply increasing volume."},{question:"Which statement about sign language is accurate?",options:[{text:"Sign languages are complete languages with their own grammar and communities.",correct:!0,feedback:"They are natural languages, not visual codes for spoken English or gestures."},{text:"Sign language is only used when hearing aids fail.",feedback:"People use sign languages for identity, community, access and communication preferences—not only as a last resort."},{text:"All countries use the same sign language.",feedback:"Sign languages differ greatly around the world and within regions; interpreters need appropriate language skills."},{text:"A person cannot use both sign language and hearing technology.",feedback:"People can and do combine approaches. Decisions are personal and should be respected."}],explanation:"Respecting language access means recognising sign languages as languages and not assuming a hierarchy of communication methods."}]},{number:18,id:"professional-care-navigation",part:4,title:"Professional care and healthcare navigation",subtitle:"Who to ask, what to bring and how to choose",readingMinutes:10,lede:"Finding the right ear and hearing care depends on the symptom, the health system and the person’s needs. A general practitioner is often the first contact; urgent symptoms need emergency care. Knowing what each professional does helps you ask for the right help.",objectives:["Identify when to contact primary care, emergency care, ENT or audiology.","Prepare a useful history and medication list for an appointment.","Understand referrals, second opinions and shared decision-making.","Navigate cost and access questions realistically."],blocks:[{type:"p",text:"Healthcare systems differ. In some countries, you see a GP who refers you to an ear, nose and throat (ENT) specialist or audiologist. Elsewhere you may access audiology directly. Emergency services are for sudden severe symptoms and red flags, not routine wax removal. If you are unsure, call the local health service or pharmacist for guidance rather than delaying."},{type:"table",headers:["Professional","Common role","When to consider"],rows:[["Emergency services","Immediate assessment of serious or life-threatening symptoms","Stroke signs, severe trauma, suspected button battery, facial weakness, severe infection signs"],["General practitioner / primary care","Initial assessment, treatment of common conditions, referral","Ear pain, discharge, persistent hearing change, medication questions"],["ENT specialist","Medical and surgical care of ear, nose, throat and related structures","Complex infections, persistent one-sided symptoms, structural problems, surgery"],["Audiologist","Hearing assessment, rehabilitation, hearing aids and communication support","Suspected hearing loss, tinnitus, hearing aid fitting, follow-up"],["Vestibular therapist / physiotherapist","Vestibular rehabilitation and balance rehabilitation","Referred vestibular symptoms, balance goals, fall prevention"]]},{type:"callout",tone:"safety",title:"Do not wait for a routine appointment",text:"Call emergency services or seek immediate care for sudden neurological symptoms, severe head injury, major ear trauma, a suspected button battery, severe infection with systemic symptoms or uncontrolled bleeding. Sudden hearing loss should be assessed urgently, even if you feel otherwise well."},{type:"heading",text:"Preparing for the appointment"},{type:"p",text:"Bring a concise timeline: when symptoms started, whether one or both ears are affected, triggers, associated dizziness, hearing change, tinnitus, pain, discharge, recent colds, travel, noise exposure and previous ear problems. List all medicines and supplements, including non-prescription products. Note allergies and relevant conditions such as diabetes or immune suppression. Bring previous hearing tests and device information if available."},{type:"p",text:"Write down the two or three questions that matter most. If you are supporting someone, ask how they want you to help. Ask for an interpreter or accessible information if needed. A good clinician will explain findings in plain language, outline options and make space for questions."},{type:"heading",text:"Referrals and second opinions"},{type:"p",text:"A referral is not a rejection; it is a route to the right expertise. Ask what the referral is for and how long it may take. A second opinion can be appropriate when a diagnosis is uncertain, when major surgery is proposed, when options have not been clearly explained or when you need to check suitability for a device. Gather your records and ask specific questions rather than simply starting again."},{type:"heading",text:"Cost and access"},{type:"p",text:"Hearing care may be funded publicly, privately or through insurance and charities. Ask about the full cost, including appointments, tests, device trials, fitting, follow-up, repairs and accessories. Public programmes may have eligibility criteria and waiting times. If cost is a barrier, ask about subsidised devices, school or disability services, community audiology, telehealth and charitable schemes. No purchase is required to ask questions."},{type:"heading",text:"Medicines and supplements"},{type:"p",text:"Tell the clinician about everything you take. Some medicines can affect hearing or balance, but this does not mean you should stop them on your own. Prescribing decisions weigh the condition being treated against potential risks. Ask about monitoring and alternatives rather than stopping abruptly."},{type:"callout",tone:"evidence",title:"Shared decisions",text:"Informed choice includes the option to wait, monitor, use technology or seek another opinion. Ask what the evidence is, how much benefit is typical, what side effects or limitations exist and what follow-up is needed. Shared decision-making is not a test you can fail; it is a conversation."},{type:"p",text:"You are allowed to ask for an explanation that makes sense to you. If information is rushed or unclear, request a written summary. Patient organisations and reputable national health services can help you prepare questions, but they should not replace individual clinical advice."}],takeaways:["Choose the care setting according to urgency and symptom: emergency, primary care, ENT or audiology.","A concise history, complete medication list and focused questions make appointments more useful.","Referrals and second opinions are legitimate parts of safe healthcare navigation.","Ask about cost, access, follow-up and the option to monitor or decline treatment."],quiz:[{question:"Which situation is most appropriate for emergency services?",options:[{text:"Routine wax removal.",feedback:"Routine wax care should be arranged through community, pharmacy or audiology services, not emergency care."},{text:"Sudden facial weakness and severe dizziness.",correct:!0,feedback:"This could be a stroke or another neurological emergency and needs immediate assessment."},{text:"Mild itching after swimming.",feedback:"This is not usually an emergency; seek advice if it persists or worsens."},{text:"A hearing test for a work application.",feedback:"Occupational or routine audiology is the appropriate route, not emergency care."}],explanation:"Emergency care is for serious or time-critical symptoms. Correctly choosing the setting protects both the person and urgent services."},{question:"What does informed decision-making look like?",options:[{text:"Choosing the most expensive device without asking questions.",feedback:"Cost is not the same as suitability. Ask about benefits, limitations, follow-up and alternatives."},{text:"Doing what a website tells you without professional input.",feedback:"Websites can support preparation, but individual assessment and advice are needed for medical decisions."},{text:"Understanding the alternatives, benefits, limitations and follow-up, then deciding with professional input.",correct:!0,feedback:"Good decisions require relevant, understandable information and respect for the person’s values and circumstances."},{text:"Avoiding a second opinion because it may be confusing.",feedback:"A second opinion can clarify uncertainty, especially before major treatment or when options have not been fully explained."}],explanation:"Informed choice is a process. It includes asking what the evidence says, what matters to you and what follow-up is available."}]}],gb=[{number:19,id:"hearing-safe-lifestyle",part:5,title:"Building a hearing-safe lifestyle",subtitle:"Small choices that reduce avoidable risk",readingMinutes:9,lede:"A hearing-safe life does not require silence or fear. It requires a little attention: turn down what can be turned down, protect the ears when sound is loud and give them quieter recovery time.",objectives:["Audit daily, work and recreational noise exposure.","Choose practical protection for different situations.","Set family-friendly listening norms without shame.","Know when to arrange a hearing or balance assessment."],blocks:[{type:"p",text:"Hearing protection is most effective when it is easy, comfortable and normal. Keep reusable earplugs where loud events happen, learn how to insert them correctly, and use noise-cancelling headphones to listen at a lower level in noisy places. No single purchase guarantees safety; behaviour and environment matter."},{type:"heading",text:"A daily listening audit"},{type:"p",text:"Notice how long you listen, how loudly and in what environment. Is music competing with traffic or gym music? Are you using headphones for hours without a break? Do you leave a concert with muffled hearing? Do power tools run while protection is absent? These observations are more useful than chasing a perfect volume setting."},{type:"diagram",kind:"balance",caption:"Protection is shared across daily life: quieter environments, appropriate fit, duration limits, recovery breaks and regular checks."},{type:"heading",text:"Work, recreation and household life"},{type:"list",items:["Use correctly fitted earmuffs or plugs around loud power tools, machinery and lawn equipment.","Keep headphones away from dangerously high volume; take breaks and use noise-cancelling features sensibly.","At sporting events and concerts, move away from speakers and consider musicians’ plugs.","For shooting or motorsport, follow sport-specific hearing-protection advice and training.","Reduce household noise where possible; use quieter appliances and give the ears quiet periods.","Do not assume earplugs make it safe to stand beside an extremely loud sound for hours."]},{type:"callout",tone:"safety",title:"Protection must not create danger",text:"Hearing protection should not block emergency alarms or essential communication. In a hazardous workplace, follow the employer’s risk assessment and do not remove protection to talk beside loud machinery. People with hearing aids can ask about hearing-protection options that work with their devices."},{type:"heading",text:"Family listening culture"},{type:"p",text:"Family rules work better when they are shared. Decide where headphones are used, set volume limits together, choose quieter table settings and model protection at concerts. Avoid using hearing loss as a threat; explain that the ears do not regenerate all damaged hair cells, and that reducing exposure is a practical way to protect future options."},{type:"heading",text:"Travel, swimming and pressure"},{type:"p",text:"Dry outer ears after swimming, equalise gently during flights, and do not dive or force pressure when congested. Follow diving training and seek advice if you have an existing ear problem. Use a hat or ear protection in cold, windy conditions if the external ear is uncomfortable. These steps support comfort and reduce avoidable complications."},{type:"heading",text:"Regular checks and knowing your baseline"},{type:"p",text:"Ask about hearing screening when it is offered, and arrange assessment when you notice change. There is no single universal interval that fits all adults. People with hearing aids, significant noise exposure, tinnitus, balance concerns, a family history of hearing loss or conditions affecting the ear may need more frequent follow-up. Ask your clinician what interval makes sense."},{type:"checklist",title:"My hearing-safe week",items:["I chose quieter listening levels for at least some sessions.","I used appropriate hearing protection in loud settings.","I gave my ears a quiet break after louder exposure.","I kept water and foreign objects out of my ear canal.","I noticed whether ringing, fullness or muffled hearing occurred.","I planned a professional check if symptoms persist or a routine check is due."],note:"Use this as a reflection tool. It does not calculate a personal safe noise dose or diagnose hearing loss."},{type:"p",text:"The aim is consistency, not perfection. One loud event does not guarantee permanent damage, and one quiet week does not resolve years of exposure. But each practical reduction contributes to a safer pattern—and knowing when to seek help ensures that temporary or treatable problems do not go unnoticed."}],takeaways:["Reduce the level, shorten the duration and allow quieter recovery time.","Choose protection that fits the setting and the person.","Family and workplace culture matter more than one-off resolutions.","Diagnosis is individual. Ask what follow-up interval is appropriate for your health and exposure history."],quiz:[{question:"Which action reduces avoidable noise exposure most reliably?",options:[{text:"Standing near the speakers at a concert to avoid crowd noise.",feedback:"Distance from speakers substantially reduces exposure. This action would increase it."},{text:"Using noise-cancelling headphones to listen at a lower volume in a noisy commute.",correct:!0,feedback:"Reducing the need to compete with background noise can allow a lower delivered level. Total exposure still depends on use."},{text:"Intermittently removing foam earplugs in very loud machinery.",feedback:"Removing protection in high noise defeats the purpose and may be unsafe."},{text:"Using cotton buds to clear wax after exposure.",feedback:"Cotton buds can cause injury and push wax deeper; they do not protect hearing."}],explanation:"Hearing safety is usually a combination of actions. Fewer loud exposures and lower listening levels matter more than one supposedly perfect product."},{question:"When are follow-up hearing checks most clearly worth discussing?",options:[{text:"Only after a diagnosis of permanent deafness.",feedback:"Checks can be useful earlier, when changes are noticed or risk factors are present."},{text:"When there are persisting symptoms, relevant exposure, device use or a clinician-recommended follow-up schedule.",correct:!0,feedback:"Individual follow-up depends on symptoms, exposure, health conditions, device use and local guidance."},{text:"Every day at home with headphones.",feedback:"Daily self-testing with headphones is not a validated medical monitoring method."},{text:"Never, because hearing does not change.",feedback:"Hearing can change through life. Noticing change and seeking advice is appropriate."}],explanation:"There is no single screening interval for everyone. A clinician can tailor follow-up to the person’s circumstances."}],related:[{number:12,title:"Sleep, Circadian Rhythm and Natural Restorative Living",reason:"Protective routines are easier to sustain when rest and daily rhythms are supportive."},{number:14,title:"Physical Activity, Movement and Lifelong Fitness",reason:"Movement and balance training support safe, active living, especially with vestibular symptoms."}]},{number:20,id:"family-ear-health",part:5,title:"The family ear-health guide",subtitle:"Listening, language and the next generation",readingMinutes:10,lede:"Children give subtle clues when hearing is difficult. Families do not need to diagnose; they need to notice, reduce barriers and ask for assessment when something does not add up.",objectives:["Understand key hearing and communication milestones.","Identify signs of possible hearing difficulty in children.","Reduce avoidable noise and model safer listening at home.","Support a child through appointments, school and communication access."],blocks:[{type:"p",text:"Children’s hearing can change temporarily with colds and fluid, or persistently because of congenital, genetic, infectious or other causes. Some children are born with hearing difference; others acquire it. Newborn screening helps early identification in many health systems, but hearing can change later, so ongoing attention matters."},{type:"callout",tone:"practice",title:"Milestones are a starting point",text:"Babies usually respond to sound and familiar voices, then babble and begin to use words. Exact timing varies, and bilingual children may follow different patterns. If a child does not respond consistently, has speech delay, loses skills or has repeated ear infections, request a hearing evaluation. Do not rely on a single checklist or wait indefinitely."},{type:"heading",text:"Signs that deserve a closer look"},{type:"list",items:["Frequent shouting or increasing television volume.","Turning one ear towards sounds or watching faces closely.","Seeming not to hear in groups but responding well one-to-one.","Speech that is unclear for their age or slower to develop.","Struggling to follow instructions, especially in background noise.","Frustration, withdrawal or behaviour changes around listening tasks.","Ear pain, discharge, fever or repeated infections."]},{type:"p",text:"A child who “passes” a screening can still have a hearing difficulty that appears later or affects only one ear. Screening is a filter, not a final diagnosis. If concerns persist, ask for a full hearing assessment. For children, play-based testing and physiological tests such as OAEs or ABR may be used depending on age and need."},{type:"heading",text:"Creating a listening-friendly home"},{type:"p",text:"Set headphones and device volume limits, take listening breaks and use headphones at lower levels. Ask older children to tell you if they hear ringing after loud gaming or music. Keep the television and kitchen noise lower where possible. Make conversations easy by getting face-to-face and repeating instructions in a different way. Never punish a child for saying they cannot hear."},{type:"callout",tone:"safety",title:"Objects, injuries and pain",text:"Do not put cotton buds or oils in a child’s ear. Seek urgent care for a suspected button battery, sharp object, severe pain, ear injury, discharge with severe illness, facial weakness or unsteady walking with ear symptoms. Children should not use ear candles or home suction devices."},{type:"heading",text:"At school"},{type:"p",text:"Hearing affects access to instruction, peer relationships and participation. If a child has a hearing difference, ask the school about seating near the teacher, classroom acoustics, remote-microphone access, captions, notetaking and staff training. A communication plan should include the child’s own preferences. Do not assume that a child is “not trying” when they are missing information."},{type:"heading",text:"Communicating with healthcare professionals"},{type:"p",text:"Bring the child’s timeline, vaccination and infection history, medicines, family history and any previous tests. Describe what you observe rather than only asking for a label: “She turns her head to the right when I call from behind” is helpful. Ask who will explain the results, how to arrange follow-up and what signs should prompt a return visit."},{type:"heading",text:"Supporting a person with hearing difference"},{type:"p",text:"Do not make hearing difference a family secret. Talk openly, include the person in decisions and ask how they want to communicate. For adults, respect their choices and support access at appointments. For children, build confidence by responding to their communication attempts and making sure they have access to language—whether spoken, signed, visual or multimodal."},{type:"checklist",title:"Family hearing-health notes",items:["I know how to ask for a hearing check if I am concerned.","I have checked that anyone using headphones understands safer listening.","I keep button batteries and small objects away from young children.","I model calm, face-to-face communication and never mock hearing difficulty.","I have asked each person how they prefer to communicate."],note:"This form can be printed for family planning. It does not assess a child’s hearing."}],takeaways:["Newborn screening is valuable but not a complete lifetime guarantee of hearing.","Notice communication, learning and behavioural clues without assuming a diagnosis.","Make the home quieter and access easier; do not blame the listener.","Ask for a full assessment when concerns persist, especially after infection or injury."],quiz:[{question:"A child passes newborn screening. What should a family understand?",options:[{text:"Hearing can never be an issue later.",feedback:"Some hearing differences are acquired or detected later. Milestones and ongoing concerns still matter."},{text:"Screening is one important check; ongoing communication milestones and surveillance still matter.",correct:!0,feedback:"Screening supports early identification but does not replace later monitoring or diagnostic assessment."},{text:"The child does not need any language support.",feedback:"Language access and support depend on the child’s needs and communication development, not only newborn screening."},{text:"A second test is only needed if the child complains.",feedback:"Children may not recognise or report hearing difficulty; caregivers and educators can notice communication signs."}],explanation:"Screening reduces the chance of missing early hearing loss, but it is not a one-time guarantee. Accessible communication and follow-up remain important."},{question:"What is a useful way to help a child who often misses instructions?",options:[{text:"Repeat the instruction more loudly from another room.",feedback:"Shouting from another room makes speech harder to understand. Move closer and reduce noise."},{text:"Arrange a hearing assessment and meanwhile use face-to-face, clear communication.",correct:!0,feedback:"Assessment helps identify the cause; communication strategies reduce immediate barriers."},{text:"Assume the child is not paying attention.",feedback:"Hearing difficulty and listening fatigue can look like inattention. Check hearing before blaming effort."},{text:"Use ear drops at home.",feedback:"Ear drops are not appropriate without examination and advice, especially if the eardrum may be perforated."}],explanation:"Communication support and assessment are complementary. A child should not have to fail repeatedly before hearing is checked."}],related:[{number:15,title:"Healthy Ageing and Lifelong Vitality",reason:"Hearing and communication are part of healthy development across the whole lifespan."},{number:26,title:"Eye Health and Vision",reason:"Vision and hearing both support learning and communication; Book 26 covers visual health."}]},{number:21,id:"healthy-ageing-hearing",part:5,title:"The healthy ageing and hearing guide",subtitle:"Stay connected, oriented and confident",readingMinutes:10,lede:"Age changes the ear, but ageing is not a reason to give up on communication. Hearing care can support relationships, independence and safety—and balance deserves the same practical attention as hearing.",objectives:["Describe common age-related hearing and balance changes.","Distinguish association from causation in brain-health claims.","Plan communication and technology support for changing needs.","Reduce fall risk and ensure accessibility in care settings."],blocks:[{type:"p",text:"Presbycusis is the gradual decline in hearing associated with ageing. It often affects high frequencies, speech clarity and the ability to understand in noise. It can also be accompanied by tinnitus. The change is common, but the experience varies because of genetics, noise history, health conditions, medicines and environment."},{type:"heading",text:"What actually helps"},{type:"p",text:"Hearing assessment provides a baseline and helps identify treatable contributors. Hearing aids and assistive listening can reduce communication barriers for some people; the fit and expectations matter. Captions, visual supports and written information extend access. Tell people how to help: face me, reduce background noise, rephrase rather than shout, and don’t cover your mouth."},{type:"callout",tone:"evidence",title:"Cognitive health: be precise",text:"Population studies show associations between hearing loss and cognitive decline or dementia risk. Association does not prove that hearing loss causes dementia or that hearing aids prevent it. Researchers are studying whether hearing support affects cognitive outcomes. Hearing care is justified by communication and quality of life, regardless of this research question."},{type:"heading",text:"Social participation and independence"},{type:"p",text:"Hearing difficulty can make restaurants, family gatherings and phone calls tiring. People may withdraw to avoid misunderstanding. Instead, plan access: request a quieter table, use a captioning app, ask for written follow-up, choose a hearing-friendly venue or arrange transport. Participation is not a luxury. It is part of health and dignity."},{type:"heading",text:"Balance, falls and safe movement"},{type:"p",text:"Age-related balance changes often reflect multiple systems: vestibular function, vision, muscles, joints, blood pressure and medication. Strength and balance activity can help in general, but new dizziness or recurrent falls should be assessed. Keep paths clear, use good lighting, avoid rushing and have vision checked. Discuss exercises with a qualified professional if you have significant balance disease or a fall history."},{type:"callout",tone:"practice",title:"Make care settings accessible",text:"At appointments, ask for a written summary, a quiet room and enough time for questions. Use a qualified interpreter if needed. If you support someone, let them answer for themselves and ask how they prefer to communicate. Accessible care is not an extra; it is safer care."},{type:"heading",text:"Hearing aids and technology over time"},{type:"p",text:"Hearing aid technology can be useful across ages, but ability and preference vary. Make sure batteries or chargers are manageable, cleaning is feasible and follow-up is available. Bluetooth connectivity, remote microphones, television streamers, captions and alerting systems can make daily life easier. There is no prize for the smallest device; the best device is one that is worn and supports communication."},{type:"heading",text:"For caregivers"},{type:"p",text:"Caregivers may notice hearing difficulty before the person does. Bring it up gently and privately. Offer a hearing check as support, not as a confrontation. At appointments, share observations but do not speak over the person. Caregivers also need support, respite and accurate information about accessible technology."},{type:"p",text:"Healthy ageing is not about staying young. It is about preserving access to the people, activities and choices that make a life meaningful. Hearing and balance care belong in that picture."}],takeaways:["Age-related hearing change is common but support and assessment can reduce communication barriers.","Hearing loss is associated with cognitive outcomes, but causation is not established; be cautious with claims.","Balance care and fall prevention are part of healthy ageing.","Accessible communication and respect for autonomy improve care for older adults."],quiz:[{question:"What can we reasonably say about hearing loss and cognitive health?",options:[{text:"Hearing loss is proven to directly cause dementia in all cases.",feedback:"That overstates the evidence. Associations have been observed, but causation and the effect of interventions are still being studied."},{text:"Population studies show associations, but causation is not established.",correct:!0,feedback:"The relationship is complex and may involve shared risk factors. Be cautious about prevention claims."},{text:"Hearing aids guarantee better memory.",feedback:"No evidence supports a universal guarantee. Research on cognitive outcomes is ongoing."},{text:"Cognitive health has no relationship to communication access.",feedback:"Communication, participation and health behaviours can interact with brain health and quality of life; the relationship is multifactorial."}],explanation:"Use careful language: hearing support is valuable for communication and quality of life. Cognitive benefits remain an important research area."},{question:"Which is a reasonable hearing-friendly habit with an older relative?",options:[{text:"Exaggerate every word and speak as loudly as possible.",feedback:"Exaggerated speech can distort lips and sound. Face the person, speak naturally and reduce background noise."},{text:"Repeat important information in a clearer, calmer way and provide written follow-up.",correct:!0,feedback:"Rephrasing, reducing noise and offering written information support understanding and safety."},{text:"Avoid involving them in medical decisions to reduce effort.",feedback:"Respect autonomy and supported decision-making. Communication access should be provided, not removed."},{text:"Assume hearing aids mean no support is needed.",feedback:"Hearing aids help some people but do not restore normal hearing or solve every environment."}],explanation:"Communication support is practical and respectful. It should make participation easier, not reduce the person’s control."}],related:[{number:15,title:"Healthy Ageing and Lifelong Vitality",reason:"This volume explores the broader habits and systems that support an active, connected later life."},{number:12,title:"Sleep, Circadian Rhythm and Natural Restorative Living",reason:"Sleep and nighttime symptoms such as tinnitus can affect daily energy and wellbeing."}]},{number:22,id:"personal-ear-health-plan",part:5,title:"My personal ear-health action plan",subtitle:"Turn understanding into a realistic next step",readingMinutes:7,lede:"A plan should be small enough to keep and clear enough to share. Use this chapter to review your listening environment, decide on protective habits and prepare for a conversation with a professional if needed.",objectives:["Review current listening and ear-care habits.","Identify warning signs that deserve professional discussion.","Prepare a concise appointment summary and question list.","Set realistic personal and family goals."],blocks:[{type:"p",text:"Start with observation, not judgement. Where is sound loud in your week? When do you notice ringing, fullness or difficulty understanding? Which tasks do you avoid because of balance or hearing? A useful plan is based on what actually happens, not on what you think you should do."},{type:"heading",text:"Four questions to begin"},{type:"steps",items:[{title:"Review exposure",text:"List the three loudest parts of your week and the three longest listening sessions. Could any be quieter, shorter or further from the source?"},{title:"Notice symptoms",text:"Record sudden changes, one-sided symptoms, ringing, dizziness, discharge, pain or hearing difficulty in conversation. Do not diagnose them."},{title:"Choose one protection habit",text:"Examples: carry earplugs, reduce headphone volume in a noisy commute, take a quiet break after an event or check the fit of workplace protection."},{title:"Set a follow-up point",text:"Decide when to review. If symptoms persist or worsen, bring the date forward and contact a clinician."}]},{type:"callout",tone:"practice",title:"Open the action planner",text:"The Learning Studio includes a private, printable Ear-Health Action Planner with fields for habits, symptoms, appointment notes and goals. It saves locally in your browser on this device; it is not a medical record and is not sent anywhere."},{type:"heading",text:"Prepare for an appointment"},{type:"list",items:["When did the symptom start, and was it sudden or gradual?","Is it in one ear, both ears, or hard to tell?","What makes it better or worse—noise, position, pressure, medicines, tiredness?","What other symptoms occur: tinnitus, dizziness, pain, discharge, fever, weakness, headache?","What hearing or balance situations are affecting daily life?","Which medicines, supplements and previous treatments are relevant?","What do you hope to get from the appointment?"]},{type:"heading",text:"Set a family standard"},{type:"p",text:"A family plan might include: headphones used at a comfortable level with breaks; earplugs available for concerts and tools; no cotton buds in ears; water only in the pool and not forced into canals; children’s hearing concerns raised promptly; and older relatives included in decisions with accessible communication."},{type:"checklist",title:"My smart next step",items:["One protection action I will take this week.","One communication change I can ask for or offer.","One symptom I will track without trying to diagnose it.","One professional conversation I will arrange if needed.","One family or workplace change that makes listening safer."],note:"This reflection is educational. It is not a diagnostic checklist and does not replace medical advice."},{type:"heading",text:"A closing thought"},{type:"p",text:"Your hearing and balance support participation in the world. Protecting them does not require perfection or fear. It requires enough attention to make better choices, enough curiosity to ask questions and enough self-respect to seek care when something changes."},{type:"quote",text:"A hearing-safe life is not a quieter life. It is a life with more of the sound you choose—and less of the sound you cannot avoid."}],takeaways:["Begin with observation: exposure, symptoms, difficult situations and existing habits.","Choose one or two realistic protection and communication changes.","Write a concise appointment summary and bring it with you.","Persistent, sudden or one-sided symptoms deserve professional assessment."],quiz:[{question:"Which is the best first step for reducing hearing risk?",options:[{text:"Buy an expensive supplement.",feedback:"There is no established supplement that reduces overall hearing risk. Environmental and health actions are more reliable."},{text:"Review loud exposures and make one realistic reduction.",correct:!0,feedback:"A practical exposure audit leads to changes that are more likely to be sustained and to matter."},{text:"Clean the ears with cotton buds every day.",feedback:"This can cause harm. The canal usually self-cleans."},{text:"Wait until hearing loss is severe.",feedback:"Early assessment and prevention preserve options. Sudden or persistent changes deserve prompt advice."}],explanation:"Sustainable change starts with a realistic observation. The aim is improved protection, not perfection."},{question:"What should an appointment summary include?",options:[{text:"Only the diagnosis you found online.",feedback:"Avoid self-diagnosis. Share observations, timeline, symptoms and questions; let a clinician assess."},{text:"A timeline, affected ear, associated symptoms, medicines, relevant history and your main questions.",correct:!0,feedback:"A concise, factual summary helps the clinician focus the assessment and supports shared
