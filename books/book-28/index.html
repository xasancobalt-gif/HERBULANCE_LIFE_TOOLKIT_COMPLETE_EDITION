decisions."},{text:"No information, to keep the appointment brief.",feedback:"Important history can be missed if not shared. Preparation supports efficient, safer care."},{text:"Only the brand of hearing aid you want.",feedback:"Device preference is one consideration, but assessment comes first and options depend on findings."}],explanation:"Good notes make the appointment more useful. They support conversation without replacing professional assessment."}],related:[{number:13,title:"Stress Management and Emotional Wellbeing",reason:"A realistic plan includes emotional wellbeing, sleep and support—not just physical protection."},{number:14,title:"Physical Activity, Movement and Lifelong Fitness",reason:"Movement, strength and balance habits support independence and fall safety."}]}],Ft=[...hb,...mb,...fb,...pb,...gb],Nn=[{number:1,title:"Understanding your ears",description:"Build a clear, accurate picture of how hearing and balance work—from the visible ear to the brain.",chapters:[1,2,3,4]},{number:2,title:"Everyday ear and hearing health",description:"Practical care, safer listening and environment-aware habits for real life.",chapters:[5,6,7,8]},{number:3,title:"Common ear and hearing conditions",description:"Recognise symptoms, understand common diagnoses and know what needs professional care.",chapters:[9,10,11,12,13,14]},{number:4,title:"Hearing tests, treatment and care",description:"Navigate assessment, technology, communication access and the health system with confidence.",chapters:[15,16,17,18]},{number:5,title:"A practical lifelong system",description:"Turn the evidence and ideas in this book into a personal, family and workplace plan.",chapters:[19,20,21,22]}];function Lr(l){return Ft.find(d=>d.number===l)}function Hp(l){return Nn.find(d=>d.chapters.includes(l))}function hi(l,d){const[h,c]=K.useState(()=>{try{const m=window.localStorage.getItem(l);return m?JSON.parse(m):d}catch{return d}});return K.useEffect(()=>{try{window.localStorage.setItem(l,JSON.s ken and non-speech audio information. Captions can be live, automated or pre-recorded and support access in many settings."},{term:"Cerumen",definition:"The medical term for earwax. It protects the ear canal, repels some water and helps remove debris."},{term:"Cholesteatoma",definition:"An abnormal collection of skin-like tissue in the middle ear or mastoid that can enlarge and erode bone. Usually treated surgically."},{term:"Cochlea",definition:"The fluid-filled, spiral-shaped hearing organ of the inner ear. It contains sensory hair cells that convert sound vibration into nerve signals."},{term:"Cochlear implant",definition:"An electronic device for selected people with severe hearing loss. It bypasses damaged hair cells and stimulates the auditory nerve."},{term:"Conductive hearing loss",definition:"Reduced hearing because sound is not transmitted efficiently through the outer or middle ear—for example because of wax, fluid or a structural problem."},{term:"Decibel (dB)",definition:"A unit used to compare sound levels or hearing thresholds. In hearing tests, dB HL describes hearing level; environmental dB SPL describes physical sound pressure."},{term:"Deaf culture",definition:"The language, identity, history and community of Deaf people, often centred around sign language and shared experience. It is not defined by deficiency."},{term:"Ear canal",definition:"The passage from the outer ear to the eardrum. It is lined with skin and wax glands and usually self-cleans."},{term:"Earwax impaction",definition:"A build-up of wax that blocks the ear canal and causes symptoms such as fullness or hearing change. Removal should be done safely by a trained professional."},{term:"Eardrum",definition:"The tympanic membrane. It vibrates in response to sound and separates the outer-ear canal from the middle ear."},{term:"Eustachian tube",definition:"A tube connecting the middle ear to the back of the nose. It helps equalise middle-ear pressure and drain fluid."},{term:"Hearing aid",definition:"A device worn in or behind the ear that amplifies and processes sound. It does not restore normal hearing or cure hearing loss."},{term:"Hearing level (dB HL)",definition:"A decibel scale used on audiograms to compare hearing thresholds with reference values. It is not the same as environmental sound level."},{term:"Hearing loop",definition:"An assistive listening system that transmits sound wirelessly to a telecoil-enabled hearing aid or receiver."},{term:"Hertz (Hz)",definition:"The unit of frequency, meaning one cycle per second. Human hearing is often described from around 20 Hz to 20,000 Hz, though sensitivity varies."},{term:"Hyperacusis",definition:"A reduced tolerance for everyday sounds that most people find comfortable. It is different from tinnitus and needs individual assessment."},{term:"Labyrinthitis",definition:"Inflammation of the inner ear, often used for vertigo with hearing change or hearing loss. It is a clinical description rather than a self-diagnosis."},{term:"Mastoiditis",definition:"Inflammation or infection of the air-filled bone behind the ear, often as a complication of middle-ear infection. Swelling, redness or severe pain behind the ear is urgent."},{term:"Ménière’s disease",definition:"A vestibular condition characterised by recurrent vertigo episodes with fluctuating hearing, ear fullness or tinnitus. Diagnosis is based on clinical criteria."},{term:"Microsuction",definition:"Removal of earwax or debris using a suction instrument under magnification, usually performed by a trained clinician."},{term:"Mixed hearing loss",definition:"Hearing loss with both conductive and sensorineural components."},{term:"Noise dose",definition:"An estimate of total noise exposure based on sound level and duration. Occupational dose concepts are population-level guides, not individual diagnoses."},{term:"Noise-induced hearing loss",definition:"Hearing damage caused or contributed to by loud sound. It may occur gradually or after a single ."},{term:"Vestibular schwannoma",definition:"A usually slow-growing, non-cancerous tumour of the vestibular nerve. It can cause one-sided hearing loss, tinnitus or imbalance."},{term:"Vestibular system",definition:"The inner-ear balance organs—semicircular canals, utricle and saccule—and their central pathways."},{term:"Vestibulo-ocular reflex (VOR)",definition:"A fast reflex that moves the eyes to stabilise vision when the head rotates."}],Wv="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");function Qv(){const[l,d]=K.useState(""),[h,c]=K.useState("All"),m=K.useMemo(()=>{const v=l.trim().toLowerCase();return gs.filter(T=>{const f=h==="All"||T.term.toUpperCase().startsWith(h),p=!v||T.term.toLowerCase().includes(v)||T.definition.toLowerCase().includes(v)||(T.seeAlso??"").toLowerCase().includes(v);return f&&p}).sort((T,f)=>T.term.localeCompare(f.term))},[l,h]),b=K.useMemo(()=>{const v={};return m.forEach(T=>{const f=T.term[0].toUpperCase();v[f]||(v[f]=[]),v[f].push(T)}),v},[m]);return n.jsxs("div",{className:"mx-auto max-w-[1120px] px-4 pb-24 pt-6 sm:px-6 lg:px-9 lg:pt-9",children:[n.jsxs("header",{className:"grid gap-7 border-b border-line pb-8 lg:grid-cols-[1fr_300px] lg:items-end",children:[n.jsxs("div",{children:[n.jsxs("div",{className:"eyebrow flex items-center gap-2 text-clay",children:[n.jsx(Mt,{className:"h-3.5 w-3.5"})," Glossary"]}),n.jsxs("h1",{className:"mt-3 font-serif text-[clamp(2.5rem,5vw,4rem)] leading-[1] tracking-[-0.045em] text-ink",children:["Plain language for ",n.jsx("span",{className:"italic text-clay",children:"important terms."})]}),n.jsx("p",{className:"mt-4 max-w-2xl text-[0.83rem] leading-relaxed text-muted",children:"Look up a word you met in a chapter, an appointment or a test result. Definitions are educational and do not replace individual clinical advice."})]}),n.jsxs("div",{className:"rounded-xl border border-line bg-surface p-4",children:[n.jsx("p",{className:"text-[0.6rem] font-bold uppercase tracking-[0.12em] text-muted",children:"In this ent looks for treatable contributors. Evidence-supported approaches include audiology care and cognitive behavioural therapy for distress. Sound therapy may help some people, but evidence is inconsistent. No supplement is established as a universal cure."},{q:"Do I need an MRI for one-sided tinnitus?",a:"Not everyone does. One-sided or pulsatile tinnitus needs professional assessment, and imaging may be recommended depending on the history, examination and hearing findings. This decision belongs to a qualified clinician."},{q:"Can I diagnose BPPV from my symptoms?",a:"No. The diagnosis depends on the pattern and on eye movements observed during positional testing. Vertigo can have other serious causes. Repositioning manoeuvres are condition-specific and not appropriate for everyone."},{q:"Is dizziness with weakness an emergency?",a:"Sudden weakness, facial drooping, difficulty speaking, double vision, severe headache, confusion or inability to walk requires emergency assessment. This could be a stroke. Do not try home exercises or wait."},{q:"When does sudden hearing loss need care?",a:"Immediately. Sudden hearing loss—especially in one ear—should be assessed promptly. Do not spend days hoping it will clear. Contact urgent care or your local emergency advice service for guidance."},{q:"Can ear infections be prevented?",a:"Not all can. Hand hygiene, avoiding tobacco smoke around children, keeping routine vaccinations up to date, managing allergies and following local health advice can reduce some risk. Ear infections are not a sign of poor parenting."},{q:"Are ear infections always treated with antibiotics?",a:"No. Treatment depends on the age, severity, certainty of diagnosis and local guidelines. Some middle-ear infections are observed, while others need antibiotics. A clinician should assess the eardrum and the whole person."},{q:"Can headphones cause hearing loss?",a:"Sound delivered at high levels for long periods can contribute to hearing damage, but headphones themselves are not automatically harmful. Lower the level, shorten sessions, use noise-cancelling features sensibly and take breaks."},{q:"Do supplements protect hearing?",a:"There is no established supplement that prevents or cures hearing loss or tinnitus in the general population. Some products interact with medicines. Discuss supplements with a pharmacist or clinician rather than self-medicating."},{q:"Are sign languages the same as spoken languages?",a:"They are complete natural languages with their own grammar, vocabulary and communities. They differ across countries and are not simply visual versions of spoken language."},{q:"Why do I struggle in restaurants but pass a hearing test?",a:"Hearing in noise is harder than detecting tones in a quiet test booth. Some people have normal audiometric thresholds but still find speech-in-noise difficult. Share this experience with the audiologist; additional tests and communication strategies may help."},{q:"Can hearing loss affect my mood?",a:"Yes. Communication difficulty, strain and stigma can contribute to fatigue, anxiety and isolation. These experiences are valid reasons for support. Tell your clinician; psychological support and communication access are part of whole-person care."}];function Jv(){const[l,d]=K.useState(""),[h,c]=K.useState(0),m=K.useMemo(()=>{const b=l.trim().toLowerCase();return b?xs.filter(v=>`${v.q} ${v.a}`.toLowerCase().includes(b)):xs},[l]);return n.jsxs("div",{className:"mx-auto max-w-[1000px] px-4 pb-24 pt-6 sm:px-6 lg:px-9 lg:pt-9",children:[n.jsxs("header",{className:"border-b border-line pb-8",children:[n.jsxs("div",{className:"eyebrow flex items-center gap-2 text-clay",children:[n.jsx(Tf,{className:"h-3.5 w-3.5"})," Frequently asked questions"]}),n.jsxs("h1",{className:"mt-3 max-w-3xl font-serif text-[clamp(2.5rem,5vw,4rem)] leading-[1] tracking-[-0.045em] text-ink",children:["Straight answers to the ",n.jsx("span",{className:"italic text-clay",children:"common questions."})]}),n.jsx("
