osed and treated properly and is different from taking a supplement 'for the brain'. High doses can be harmful, interact with medicines or delay diagnosis. Clinicians and dietitians can adapt plans to health conditions, food availability and cultural preferences."]}],terms:[{t:"Dietary pattern",d:"The overall combination and frequency of foods and drinks consumed over time."},{t:"Fortification",d:"Addition of nutrients to foods to prevent or correct deficiencies in a population."},{t:"Micronutrient",d:"A vitamin or mineral required in small amounts for normal physiology."}],figure:{d:"nutrient",title:"Nutrients that support neural function",caption:"Different nutrients support membrane structure, neurotransmitter synthesis, myelination, oxygen transport and enzyme function. Deficiency, excess and interactions all matter.",labels:["Energy","B vitamins","Iron","Iodine","Omega-3 fats"]},example:{t:"A traditional bean and millet meal",p:"Legumes provide protein, folate and minerals; millet contributes energy and some B vitamins; vegetables add vitamin C and diverse plant compounds. The value is in the whole pattern and food security, not one ingredient marketed as 'brain food'."},practice:["List three locally available foods that contribute protein, iron and vitamin C.","Identify one claim that a food 'repairs nerves' and explain why it lacks support."],myth:{claim:"A 'brain diet' can prevent all dementia.",fix:"No diet guarantees prevention. Risk reduction involves blood pressure, smoking, physical activity, alcohol, hearing, social connection and other factors; nutrition is one part."},safety:"Unexplained weight loss, persistent fatigue, neurological symptoms or suspected deficiency is a reason for professional evaluation, not unsupervised high-dose supplementation.",takeaways:["Whole dietary patterns and food security support neurological health.","Nutrient needs depend on life stage, health and diet.","Supplements treat specific deficiencies; they are not universal nerve cures."],check:{q:"Which statement is best supported by current evidence?",options:["A single supplement prevents dementia in everyone","Brain-healthy dietary patterns are associated with better health but do not guarantee disease prevention","Foods with 'brain' labels are always nutritionally superior","Nutrition has no relationship to neurological function"],a:1,why:"Population evidence supports healthy dietary patterns as part of overall health. It does not establish a universal preventive supplement, and marketing labels have no special scientific status."},refs:["who-dementia","ods-b12","ods-omega3","ods-iron"],related:[42,43,44,45],books:[10,11,15]},{id:42,part:6,title:"Essential Nutrients for Neural Function",kicker:"Enzymes, membranes and oxygen",readMins:9,lead:"Vitamins, minerals, fats, protein and glucose participate in complementary physiological roles. Understanding what each nutrient does helps distinguish a genuine deficiency problem from a general supplement claim.",objectives:["State one key role of each nutrient covered in this chapter.","Recognise populations at higher risk of deficiency.","Explain why more of a nutrient is not automatically better."],sections:[{h:"Vitamins, minerals and iodine",p:["Vitamin B1 (thiamine) supports energy metabolism; severe deficiency can cause Wernicke encephalopathy or beriberi. Vitamin B6 is involved in neurotransmitter synthesis, but excessive intake is associated with peripheral neuropathy. Vitamin B12 and folate support red cells, DNA synthesis and myelin-related function. Vitamin D contributes to bone, muscle and immune function; deficiency is common in some settings and relevant to neuromuscular health.","Iron is needed for oxygen transport and myelination; deficiency can impair attention and energy. Iodine is essential for thyroid hormones and brain development. Choline contributes to membrane and neurotransmitter physiology. Needs differ by age, pregnancy, diet and illness. Food fortification, supplementation and screening policies vary by country."]},{h:"Fats, protein and glucose",p:["Omega-3 fatty acids, particularly DHA, are structural components of cell membranes, including in the retina and brain. The brain is rich in lipids, but dietary amounts, conversion from plant sources and clinical benefits vary. Protein supplies amino acids for enzymes, transport and neurotransmitter synthesis. The brain uses glucose and, during prolonged fasting, ketones.","More is not always better. Supplement doses can interact with medicines, cause toxicity or waste money. The most useful question is whether a person has a deficiency, risk factor or clinical condition that will respond to treatment. That question requires appropriate tests and professional advice."]}],terms:[{t:"Cofactor",d:"A substance required for an enzyme to function, often a vitamin or mineral."},{t:"DHA",d:"Docosahexaenoic acid, a long-chain omega-3 fatty acid enriched in neural membranes."},{t:"Bioavailability",d:"The proportion of a nutrient that is absorbed and available to the body."}],figure:{d:"nutrient",title:"Nutrients in neural physiology",caption:"Thiamine and glucose support energy metabolism; iron and iodine affect development and thyroid function; B12 and folate support cell division and myelin physiology; DHA contributes to membrane structure.",variant:"roles"},example:{t:"Eating across a week, not a single meal",p:"One meal cannot correct a long-term inadequacy, and one nutrient cannot substitute for an overall pattern. A week with varied grains, legumes, vegetables, fruits, protein sources and fortified staples is a more useful planning unit."},practice:["Match B12, iron, iodine and DHA to one broad role each.","Name two groups who may need nutrient-specific advice from a clinician."],myth:{claim:"Everyone should take a high-dose B-complex to protect nerves.",fix:"High-dose B6 can itself cause nerve damage. B12 treatment is valuable in deficiency but should be guided by tests and context. Routine high-dose supplements are not universally protective."},safety:"Do not self-treat neurological symptoms with vitamins or minerals. High doses of some nutrients can cause harm, and symptoms may have other urgent causes.",takeaways:["Each nutrient has specific physiology and a range of adequate intake.","Deficiency risk depends on diet, absorption, illness, medicines and life stage.","Supplementation is targeted treatment, not a universal health upgrade."],check:{q:"Excessive vitamin B6 intake has been associated with which problem?",options:["Improved nerve function in everyone","Peripheral neuropathy","Immediate loss of vision","Permanent memory erasure"],a:1,why:"High-dose B6 can cause sensory peripheral neuropathy. It is essential in normal amounts but not safe to assume that more is always better."},refs:["ods-b6","ods-b12","ods-folate","ods-iron","ods-vitd","ods-iodine"],related:[41,43,44,55],books:[10,17]},{id:43,part:6,title:"Vitamin B12, Folate and Neurological Health",kicker:"Deficiency can mimic other conditions",readMins:9,lead:"Vitamin B12 and folate are involved in red blood cell formation, DNA synthesis and normal neurological function. Deficiency can cause fatigue, cognitive change, balance problems and peripheral neuropathy, so accurate diagnosis matters.",objectives:["Identify major dietary sources and absorption requirements for B12 and folate.","Describe neurological presentations of deficiency without encouraging self-diagnosis.","Understand the purpose and limits of tests and supplementation."],sections:[{h:"B12 and folate roles",p:["Vitamin B12 is found mainly in animal-source foods and fortified products. It requires gastric acid, intrinsic factor and a functioning terminal ileum for absorption; absorption can also be bypassed by injections or high-dose oral treatment when prescribed. Long-term metformin, some gastric surgeries, autoimmune gastritis, inadequate intake and older age can increase risk.","Folate occurs in legumes, green vegetables and fortified grains. It is especially important around conception for neural tube development. Folate policies differ by country. B12 and folate interact in one-carbon metabolism; giving large folate doses can mask the blood changes of B12 deficiency without correcting neurological harm."]},{h:"Diagnosis and care",p:["Symptoms are nonspecific and can include fatigue, sore tongue, cognitive changes, unsteadiness and peripheral neuropathy. Anaemia may be absent. Measurement of B12 can be affected by pregnancy, supplements and liver disease; methylmalonic acid and homocysteine may help clarify borderline cases under clinical guidance.","Treatment usually involves replacing the deficiency by an appropriate route and investigating the cause. Neurological symptoms can improve with early treatment but may become persistent. B12 is not a proven general treatment for nerve disease when deficiency is absent."]}],terms:[{t:"Intrinsic factor",d:"A gastric protein required for efficient absorption of vitamin B12."},{t:"Megaloblastic anaemia",d:"Anaemia associated with large blood cell precursors, often due to B12 or folate deficiency."},{t:"One-carbon metabolism",d:"Interconnected biochemical pathways involving folate and B12, important for DNA synthesis and methylation."}],figure:{d:"nutrient",title:"B12, folate and normal neural function",caption:"B12 and folate participate in DNA synthesis and methylation. Deficiencies can affect blood formation, cognition and the nervous system. Injection or oral replacement and testing strategies vary by context.",variant:"b12",labels:["Dietary intake","Intrinsic factor","Bloodstream","Nervous system","RBC formation"]},example:{t:"A plant-based diet and B12 planning",p:"People who eat little or no animal-source food may need reliable fortified foods or a B12 supplement. The right amount and monitoring depend on the person's diet, age and health. A normal energy level does not rule out a deficiency."},practice:["List three factors that can impair B12 absorption.","Explain why a folate supplement should not be used to self-treat neurological symptoms."],myth:{claim:"If blood count is normal, B12 status must be fine.",fix:"B12 deficiency can cause neurological symptoms before or without anaemia. Assessment includes history, risk factors and, when appropriate, targeted biochemical tests."},safety:"Avoid high-dose folate without addressing possible B12 deficiency. New unsteadiness, memory change or neuropathy should be clinically assessed, especially in people with risk factors.",takeaways:["B12 and folate are essential for blood and neurological function.","Absorption, diet and medicines influence B12 status.","Testing guides treatment; supplements are not a generic nerve treatment."],check:{q:"Which factor is required for efficient absorption of vitamin B12?",options:["Intrinsic factor","Insulin","Melatonin","Thyroxine"],a:0,why:"Intrinsic factor allows B12 absorption in the terminal ileum. Insulin, melatonin and thyroxine are hormones with different roles; B12 absorption does not directly depend on them."},refs:["ods-b12","ods-folate","nhs-b12"],related:[42,55,59],books:[10,20]},{id:44,part:6,title:"Omega-3 Fatty Acids and Neural Structure",kicker:"Membranes matter",readMins:8,lead:"Omega-3 fatty acids are structural and signalling molecules in nervous tissue. Dietary patterns high in these fats are part of a healthy eating pattern, but supplement effects on neurological disease are mixed and should not be overgeneralised.",objectives:["Distinguish ALA, EPA and DHA.","Name major dietary sources and factors affecting intake.","Explain why promising biology does not guarantee a disease benefit."],sections:[{h:"Structure and sources",p:["Alpha-linolenic acid (ALA) is an essential omega-3 fat found in flaxseed, chia, walnuts and some oils. The body can convert a small percentage to EPA and DHA, but conversion is limited. Oily fish and shellfish are the richest direct sources of EPA and DHA; fortified foods and algal supplements are alternatives for some diets.","DHA is enriched in retinal and neural membranes, and omega-3 lipids influence membrane fluidity and inflammation-related signalling. These roles are established. The extent to which supplementation improves function or changes a disease course is a separate question."]},{h:"Evidence, limitations and safety",p:["Observational studies link some healthier dietary patterns with better outcomes, but associations are not proof of causation. Trials of omega-3 supplements have produced inconsistent results across cardiovascular and neurological outcomes. A person with a deficiency, poor intake or a specific clinical indication may benefit from advice, but supplements are not a universal nerve repair strategy.","High supplement doses can increase bleeding risk and interact with anticoagulants; fish can carry contamination concerns depending on source. Review any product and dose with a clinician or pharmacist, especially during pregnancy or before surgery."]}],terms:[{t:"ALA",d:"Alpha-linolenic acid, an essential plant-based omega-3 fat."},{t:"EPA",d:"Eicosapentaenoic acid, a long-chain omega-3 fat with signalling and inflammatory roles."},{t:"DHA",d:"A long-chain omega-3 fat enriched in the brain and retina."}],figure:{d:"nutrient",title:"Omega-3 fats in a neural membrane",caption:"DHA is enriched in phospholipid membranes of neurons and retinal cells. Dietary ALA can be converted to DHA only to a limited extent; direct dietary sources are important.",variant:"omega3",labels:["Phospholipid bilayer","DHA","Membrane protein","Synapse","Blood vessel"]},example:{t:"Fish in different food systems",p:"Coastal communities may eat fish regularly; inland or low-income households may rely more on fortified foods, eggs or plant sources. Public-health advice should fit availability and culture rather than assume one expensive product is essential."},practice:["Name three dietary sources of omega-3 fats.","Explain the difference between a structural role and a proven treatment effect."],myth:{claim:"Omega-3 supplements repair damaged nerves.",fix:"Omega-3 fats are essential for membrane structure, but no supplement has been shown to reliably repair damaged nerves. Deficiency and specific conditions require individual advice."},safety:"Discuss high-dose omega-3 supplements with a pharmacist if you take anticoagulants, have a bleeding disorder or are preparing for surgery.",takeaways:["Omega-3 fats are essential structural and signalling molecules.","DHA is especially enriched in neural and retinal membranes.","Supplement trials have mixed results; structural roles do not guarantee disease benefits."],check:{q:"Which fatty acid is especially enriched in neural and retinal membranes?",options:["DHA","Glucose","B12","Thiamine"],a:0,why:"DHA is an omega-3 fatty acid incorporated into membrane phospholipids of nervous tissue. Glucose is a fuel and B12/thiamine are vitamins, not fatty acids."},refs:["ods-omega3","who-dementia"],related:[41,42,65,79],books:[10,18]},{id:45,part:6,title:"Glucose, Energy Metabolism and the Brain",kicker:"Fuel for a demanding organ",readMins:8,lead:"The brain has a high energy demand and depends mainly on glucose under ordinary conditions. A steady supply matters, but 'brain foods', stimulants and blood-sugar claims are often framed far beyond the evidence.",objectives:["Explain how the brain uses glucose and alternative fuels.","Describe the effects of hypoglycaemia and extreme diets.","Critique common claims about sugar, focus and 'brain fuel'."],sections:[{h:"Fuel supply",p:["Glucose crosses the blood-brain barrier through specific transporters and is metabolised for ATP. Neurons have limited fuel reserves, so the brain relies on continuous delivery via the bloodstream. During prolonged fasting, the liver produces ketones that the brain can use partly, which reduces glucose requirements but does not make extreme diets universally safe.","Brain activity increases local blood flow and energy use in active regions. Functional imaging exploits this coupling indirectly. A 'thinking' task may use measurable energy, but the popular claim that intense mental work exhausts glucose reserves so much that willpower collapses is oversimplified."]},{h:"Glucose dysregulation and everyday focus",p:["Hypoglycaemia can cause sweating, tremor, confusion, irritability and, if severe, seizure or loss of consciousness. It is a medical issue, especially in people using insulin or some diabetes medicines. Hyperglycaemia over time damages blood vessels and nerves.","Sugary foods provide quick energy, but the 'sugar rush' is not consistently supported. Meals combining fibre, protein and fats generally support steadier energy. Supplements marketed for concentration are not established for general brain health and may interact with medications."]}],terms:[{t:"ATP",d:"Adenosine triphosphate, the cell's main energy-carrying molecule."},{t:"Ketones",d:"Molecules produced from fat during prolonged low glucose availability and usable by some tissues."},{t:"Hypoglycaemia",d:"Abnormally low blood glucose, potentially causing neurological and autonomic symptoms."}],figure:{d:"nutrient",title:"Brain energy use and fuel balance",caption:"Glucose uptake through endothelial transporters supplies neurons and glia. Astrocytes share metabolic support. Prolonged low glucose can impair consciousness and requires urgent care.",variant:"glucose",labels:["Blood glucose","Transporter","Neuron","Astrocyte","ATP"]},example:{t:"A skipped lunch",p:"Hunger and reduced concentration can follow a missed meal, but true dangerous hypoglycaemia is uncommon in people without glucose-lowering medication or specific conditions. Drinking sugary drinks may briefly relieve hunger while providing little sustained nutrition."},practice:["Explain why the brain needs a continuous fuel supply.","Name two warning signs of hypoglycaemia and when to seek emergency care."],myth:{claim:"Sugar gives the brain a boost and makes you smarter.",fix:"Glucose is essential fuel, but added sugar does not reliably improve cognition and excessive intake is linked to dental and metabolic harms. Stable meals and overall diet quality matter more."},safety:"Severe confusion, sweating, seizure or loss of consciousness in a person taking glucose-lowering medication is an emergency. Follow their individual emergency plan and local advice; do not give food or drink by mouth to an unconscious person.",takeaways:["Brain function depends on tightly regulated glucose delivery.","Hypoglycaemia is a medical problem, not a personality issue.","Simple 'sugar rush' and brain-boost claims are not well supported."],check:{q:"Which statement about brain energy is most accurate?",options:["The brain can store unlimited glucose","The brain mainly uses glucose and needs a continuous supply","Thinking requires no energy","Ketones are the only fuel the brain ever uses"],a:1,why:"Under usual conditions the brain relies on glucose delivered by the blood and has limited local stores. It can use ketones partly during prolonged fasting, but not exclusively."},refs:["ninds-brain-basics","who-activity","nhlbi-sleep"],related:[42,46,47,48],books:[11,17,23]},{id:46,part:6,title:"Sleep, Circadian Rhythms and Neurological Regulation",kicker:"A nightly neurological process",readMins:9,lead:"Sleep is an active state that supports memory, attention, immune function and metabolism. Circadian rhythms also influence temperature, hormone release and alertness across the day.",objectives:["Describe the basic architecture of sleep and circadian timing.","Explain sleep's contribution to cognition and neurological wellbeing.","Identify evidence-based sleep practices and warning signs."],sections:[{h:"Sleep architecture",p:["Sleep alternates between non-REM stages and REM. Deep slow-wave sleep is prominent early in the night, while REM periods lengthen toward morning. These cycles are regulated by homeostatic sleep pressure and a circadian clock in the hypothalamus, entrained mainly by light.","Sleep supports memory consolidation, emotional processing, attention and immune regulation. The brain does not 'switch off'. Sleep-like slow waves and clearance processes are actively studied; claims that one product detoxifies the brain during sleep are not established."]},{h:"Practical support and clinical care",p:["Regular sleep and wake times, morning daylight, a dark and quiet room, and limiting evening caffeine and alcohol can help. Screens are not the only factor; stress, shift work, illness, medication, pain, sleep apnoea and restless legs often matter more.","Persistent insomnia, loud snoring with breathing pauses, overwhelming daytime sleepiness, acting out dreams or sudden sleep attacks need professional assessment. Do not drive when dangerously sleepy. Sleep aids and supplements can interact with medicines and should be discussed."]}],terms:[{t:"Circadian rhythm",d:"An approximately 24-hour biological cycle influencing sleep, temperature and physiology."},{t:"REM sleep",d:"A sleep stage with rapid eye movements, muscle atonia and vivid dreaming."},{t:"Sleep homeostasis",d:"Increasing sleep pressure during wakefulness that is relieved by sleep."}],figure:{d:"sleep",title:"A night of sleep cycles",caption:"Deep non-REM sleep is concentrated early in the night, while REM periods lengthen toward morning. Brief awakenings are common and normal; cycle timing varies between people.",variant:"architecture",labels:["Awake","Light sleep","Deep sleep","REM","Morning"]},example:{t:"Learning a new route",p:"Practising a route during the day and sleeping well afterwards may support recall and adjustment. Sleep is not a passive gap; it is part of how experience is stabilised and integrated with prior knowledge."},practice:["Record your bedtime and wake time for three days and look for variability.","List one factor that interferes with your sleep and one realistic change to test."],myth:{claim:"Everyone needs exactly eight hours, and a supplement can replace sleep.",fix:"Needs vary with age and individual biology. Good sleep includes duration, timing and quality. No supplement replaces the core sleep your body needs."},safety:"Seek medical advice for breathing pauses, severe daytime sleepiness, sleep attacks or insomnia lasting weeks. Do not drive while drowsy, and discuss sleep-related medication effects with a clinician.",takeaways:["Sleep is active and essential for cognition and regulation.","Circadian timing and sleep pressure jointly shape sleep.","Evidence-based habits plus clinical care for sleep disorders are more effective than unproven products."],check:{q:"Which statement about sleep cycles is generally accurate?",options:["Deep sleep is usually concentrated early and REM periods lengthen toward morning","There is no REM sleep in healthy adults","Sleep ends brain activity completely","Awakening during the night always indicates a disease"],a:0,why:"Slow-wave sleep tends to dominate early cycles, while REM increases toward morning. Sleep involves active brain states, and brief awakenings are common in health."},refs:["nhlbi-sleep","cdc-sleep","ninds-brain-basics"],related:[7,39,47,61],books:[12,13,15]},{id:47,part:6,title:"Physical Activity and Brain Function",kicker:"Movement supports the whole system",readMins:8,lead:"Physical activity improves cardiovascular fitness, balance, mood and sleep, and is associated with reduced risk of stroke, cognitive decline and falls. It supports the brain partly by supporting the body.",objectives:["Summarise established benefits of physical activity for neurological health.","Describe practical aerobic, strength and balance activities.","Evaluate claims about exercise and 'brain growth' without overstatement."],sections:[{h:"What is established",p:["Adults who meet physical activity guidelines generally have lower cardiovascular and metabolic risk, better mood and sleep, and lower fall risk when balance work is included. For people with neurological conditions, individualised exercise and rehabilitation can improve function, endurance and participation.","Animal research shows exercise-related molecular changes including growth-factor signalling and new neuron production in some brain regions. Human studies also show structural and functional changes, but the translation to disease prevention is complex. Exercise is valuable without being a guaranteed cure."]},{h:"A practical approach",p:["Aerobic activity improves endurance and circulation; strength training supports muscle and bone; balance and mobility training reduce falls risk; stretching supports range of motion. Any increase should match current ability and health status. Start gradually, choose activities you can repeat and use local options such as walking, stairs, dancing, cycling or household tasks.","People with cardiac disease, severe fatigue, recent injury, uncontrolled seizures or neurological instability should seek personalised guidance. Rehabilitation professionals can adapt movement rather than simply advising rest."]}],terms:[{t:"Aerobic activity",d:"Activity that increases heart and breathing rate and uses oxygen over a sustained period."},{t:"Balance training",d:"Exercises that challenge postural control and reduce fall risk."},{t:"Neuroplasticity",d:"The nervous system's capacity to change with experience and practice."}],figure:{d:"homeostasis",title:"How movement supports neurological health",caption:"Activity influences blood flow, metabolic health, muscle strength, sleep, mood and balance. Benefits emerge through multiple body systems rather than a single 'brain booster' pathway.",variant:"exercise",labels:["Movement","Cardiovascular fitness","Sleep","Mood","Balance"]},example:{t:"A walking group after stroke",p:"A supervised group can pace activity, include balance practice and reduce isolation. Progress varies. The point is not a miracle brain cure; it is safer function, endurance, confidence and participation, supported by qualified rehabilitation where available."},practice:["Plan one aerobic, one strength and one balance activity for the coming week.","Describe how you would adapt the plan during fatigue while remaining safe."],myth:{claim:"One type of exercise is the best way to protect the brain.",fix:"Different activities contribute different benefits. A combined pattern of aerobic, strength, balance and flexibility work is generally more useful than a single 'brain exercise'."},safety:"Stop and seek medical advice for chest pain, severe breathlessness, fainting or new neurological symptoms during activity. Recent surgery, serious heart conditions or falls risk may need supervised exercise.",takeaways:["Activity supports vascular, metabolic, mental and balance health.","Combining aerobic, strength and balance activity is practical and useful.","Exercise is beneficial but not a guaranteed disease prevention strategy."],check:{q:"Which benefit is best supported by physical activity for neurological health?",options:["Guaranteed prevention of all dementia","Improved balance and reduced fall risk with appropriate training","Immediate repair of damaged nerves","Replacement of sleep"],a:1,why:"Balance and strength training can reduce fall risk, and activity supports overall health. It does not guarantee prevention of every neurological condition, repair nerves immediately or replace sleep."},refs:["who-activity","who-dementia","nice-neuro-rehab"],related:[31,46,48,79],books:[14,15,18]},{id:48,part:6,title:"Hydration, Alcohol, Tobacco and Other Lifestyle Factors",kicker:"Risk and responsibility without stigma",readMins:9,lead:"Hydration, alcohol, tobacco, caffeine, recreational substances and medicines can all affect the nervous system. The goal is informed, compassionate risk reduction and appropriate care, not judgement.",objectives:["Describe neurological effects of alcohol, tobacco, dehydration and substance use.","Distinguish moderate evidence-informed guidance from moralistic messaging.","Identify situations where medical help is essential."],sections:[{h:"Water, alcohol and tobacco",p:["Water and electrolyte balance are essential for circulating volume and neural function. Dehydration can cause headache, confusion and orthostatic symptoms, but drinking extreme amounts can also cause dangerous hyponatraemia. Thirst, urine colour, climate and activity are approximate guides.","Alcohol affects coordination, sleep, memory and mood in the short term. Long-term heavy use is associated with thiamine deficiency, peripheral neuropathy, seizures and cognitive harm. No safe level can be assumed for every outcome; guidance differs by country. Nicotine and tobacco increase stroke and vascular risk, and second-hand smoke harms others."]},{h:"Medicines and other substances",p:["Cannabis, stimulants, opioids and other substances can affect cognition, sleep, mood and seizure risk. Interactions with prescribed medicines are important. Stigma prevents people from seeking help; healthcare interactions should be respectful and confidential.","Medication-related neurological symptoms such as tremor, drowsiness, dizziness or confusion should be reported to a prescriber or pharmacist. Never stop neurological or psychiatric medication abruptly without advice, and do not replace prescribed care with unproven wellness products."]}],terms:[{t:"Hyponatraemia",d:"Abnormally low blood sodium, which can cause confusion, seizures and severe illness."},{t:"Neurotoxicity",d:"Harm to the nervous system caused by a substance, including alcohol and some medicines."},{t:"Risk reduction",d:"Practical steps to lower the likelihood or severity of harm without demanding perfection."}],figure:{d:"compare",title:"Lifestyle exposures and neurological risk",caption:"Risk factors interact: smoking and alcohol affect vascular and neural tissue, sleep and mental health influence coping, and access to care shapes outcomes. Support should address the whole context.",variant:"lifestyle",labels:["Alcohol","Tobacco","Medicines","Sleep","Access to care"]},example:{t:"Talking with a pharmacist",p:"A new tremor or confusion after starting a medicine can be discussed without blame. The pharmacist can review interactions, alternative doses and timing. Adjustments should be made with the prescriber, not by stopping treatment alone."},practice:["Identify two local sources of confidential information about alcohol or substance support.","Name one medicine interaction question worth asking a pharmacist."],myth:{claim:"You can 'dry out' or detox your brain with a cleanse.",fix:"Support for harmful alcohol use may involve medically supervised withdrawal, which can be dangerous on its own. Commercial cleanses do not remove neurological harm and may delay effective care."},safety:"Seek emergency care for alcohol withdrawal with severe agitation or seizures, suspected overdose, confusion, breathing difficulty, sudden weakness or a head injury while intoxicated. Do not stop prescribed medicines abruptly.",takeaways:["Hydration must be balanced; both dehydration and overdrinking can be harmful.","Alcohol and tobacco are modifiable neurological risk factors.","Non-judgemental, professional support is more useful than blame."],check:{q:"Which statement about alcohol and neurological health is most accurate?",options:["Alcohol has no effect on the nervous system","Heavy long-term use is associated with thiamine deficiency and neuropathy","A commercial cleanse reverses alcohol-related brain harm","Alcohol improves sleep quality in every person"],a:1,why:"Chronic heavy alcohol use can impair thiamine absorption and damage peripheral nerves. Cleanses are not established treatments, and alcohol commonly disrupts sleep architecture even if it feels sedating."},refs:["who-alcohol","who-tobacco","ods-b6","who-stroke"],related:[39,41,55,59],books:[10,13,23]}],ag=[{id:49,part:7,title:"Understanding Headaches and Migraine",kicker:"Common, real and sometimes urgent",readMins:9,lead:"Headache is among the most common neurological symptoms. Migraine is a distinct neurological condition, not simply a severe headache, and some headaches signal dangerous underlying problems requiring emergency care.",objectives:["Distinguish migraine from ordinary headache and recognise red flags.","Describe migraine phases and mechanisms at an introductory level.","Outline general treatment categories without giving prescribing advice."],sections:[{h:"Migraine is more than pain",p:["Migraine often involves sensitisation of trigeminal pathways and brain networks that regulate sensory processing. It can include nausea, light or sound sensitivity and functional disability. Some people experience a reversible aura with visual, sensory, language or motor symptoms before or during an attack.","Attacks vary in frequency and duration. Common triggers may include stress, sleep disruption, fasting, hormonal shifts and certain cues, but triggers are individual and not necessarily causal. Keeping a record can reveal patterns, while over-focusing on triggers can create anxiety."]},{h:"Recognition and treatment",p:["Red flags include a sudden severe 'thunderclap' headache, new headache after head injury, fever with neck stiffness, weakness, confusion, visual loss, pregnancy with associated symptoms, headache with cancer or immune compromise, or progressive worsening over weeks. These need urgent assessment.","Treatment categories include acute pain relief, anti-nausea medicines and preventive treatments, alongside sleep, hydration and stress support. Frequent use of acute medicines can cause medication-overuse headache, so treatment should be planned with a clinician. Pregnancy and other conditions change the risk-benefit balance."]}],terms:[{t:"Aura",d:"Reversible focal neurological symptoms, often visual, that can occur around a migraine attack."},{t:"Phonophobia",d:"Increased sensitivity to sound, common during migraine."},{t:"Medication-overuse headache",d:"A persistent headache pattern worsened by frequent use of acute headache medicines."}],figure:{d:"pain",title:"Migraine and the trigeminovascular system",caption:"Cranial nerve triggers and brain networks interact with meningeal blood vessels to produce pain and sensitisation. Aura involves cortical spreading change. Light, sound and nausea reflect widespread sensory and autonomic effects.",variant:"migraine",labels:["Trigeminal nerve","Meningeal vessel","Sensory cortex","Sensitisation","Nausea"]},example:{t:"An attack during exam week",p:"A student experiences visual zigzags, then a throbbing headache, nausea and sensitivity to light. A friend's ordinary tension headache does not feel the same. The student should seek a clinical assessment because the symptoms are new and disabling, and should not diagnose by comparing online stories."},practice:["Write three red-flag headache features that require urgent help.","Explain the difference between a trigger and a cause."],myth:{claim:"Migraine is just a bad headache caused by stress.",fix:"Migraine is a neurological condition with multiple mechanisms. Stress can be one trigger, but it is not the whole cause and the condition is not a sign of weakness."},safety:"Call emergency services for a thunderclap headache, new weakness, confusion, fever with a stiff neck, headache after serious head injury or sudden vision loss. Do not take a new medication from an unverified source.",takeaways:["Migraine is a distinct neurological condition with sensory and autonomic features.","Red-flag headaches need urgent assessment.","Treatment plans should be individualised and monitored."],check:{q:"Which feature most strongly suggests a headache requiring urgent assessment?",options:["A familiar pattern that improves with usual treatment","A sudden severe headache peaking within minutes","Mild discomfort after a long screen session","A headache that resolves after drinking water"],a:1,why:"A sudden severe 'thunderclap' headache can signal subarachnoid haemorrhage or another serious cause. Familiar mild patterns may still need review if they change, but sudden maximal onset is a red flag."},refs:["who-headache","ninds-migraine","ninds-headache","nhs-migraine"],related:[39,46,50,78],books:[13,12]},{id:50,part:7,title:"Epilepsy and Seizure Disorders",kicker:"Not every seizure is epilepsy",readMins:10,lead:"A seizure is a transient event of abnormal, excessive neuronal activity. Epilepsy is a condition of recurrent unprovoked seizures or a high long-term risk of them. The difference matters for diagnosis, safety and treatment.",objectives:["Distinguish a seizure from epilepsy and describe broad seizure categories.","Explain safety first aid and when to seek emergency care.","Understand the purpose of EEG and medication without interpreting your own results."],sections:[{h:"Types and diagnosis",p:["Seizures may be focal, starting in one network, or generalised, involving networks in both hemispheres. Motor, sensory, autonomic or behavioural features depend on the paths involved. A person may not lose consciousness and witnesses may miss subtle signs.","Epilepsy has many causes, including genetic factors, brain injury, stroke, infection, tumours and developmental conditions. Diagnosis uses history, eyewitness accounts, examination, EEG and imaging where appropriate. An EEG can support diagnosis but a normal EEG does not exclude epilepsy, and there is no single 'epilepsy test'."]},{h:"First aid and living well",p:["Protect the person from hazards, cushion the head, avoid restraint and never put anything in the mouth. Time the seizure and stay nearby. After movements stop, place the person on their side in a safe recovery position if appropriate and seek help according to local guidance.","Medication reduces seizure frequency for many people, and some surgical, dietary and device treatments are used for selected cases. Sleep, alcohol and missed medication can increase risk. Driving, employment and sport rules differ by country; ask local services for accurate advice."]}],terms:[{t:"Epilepsy",d:"A condition associated with recurrent unprovoked seizures or a persistently high risk of them."},{t:"Focal seizure",d:"A seizure arising from a network in one hemisphere; awareness may or may not be affected."},{t:"Status epilepticus",d:"Prolonged or repeated seizures without recovery, requiring emergency treatment."}],figure:{d:"potential",title:"Normal and seizure-like electrical activity",caption:"Healthy brain activity is rhythmic and varied. A seizure involves abnormal hypersynchrony. EEG is one part of diagnosis and must be interpreted with the clinical history.",variant:"eeg"},example:{t:"A first seizure at school",p:"Witnesses should protect the student, note the time and describe what happened objectively. They should not restrain or put objects in the mouth. A first seizure generally requires medical assessment, and local emergency guidance should be followed."},practice:["List four steps of seizure first aid in order.","Explain why a normal EEG does not rule out epilepsy."],myth:{claim:"You should put a spoon in a person's mouth during a seizure.",fix:"Never put objects or fingers in the mouth. It can cause choking, dental injury or harm to the helper. Protect the head and environment instead."},safety:"Seek emergency help for a first seizure, a seizure lasting more than five minutes, repeated seizures without recovery, injury, breathing difficulty, pregnancy or if the person does not regain awareness. Do not stop prescribed epilepsy medication abruptly.",takeaways:["Seizures are events; epilepsy is a condition defined by recurrence or risk.","Diagnosis combines history, examination and selected tests.","Safe first aid and consistent prescribed treatment reduce harm."],check:{q:"Which action is correct during a generalised convulsive seizure?",options:["Restrain the arms and legs firmly","Put a spoon between the teeth","Protect the person from hazards and cushion the head","Give food and drink straight away"],a:2,why:"The priority is protecting the head and environment and allowing movements to occur safely, while timing the event. Restraint and objects in the mouth can cause harm; nothing should be given by mouth until the person is fully recovered."},refs:["who-epilepsy","ninds-epilepsy","nice-ng217","nice-neuro-rehab","ilae-first-aid"],related:[21,49,59,78],books:[13,15]},{id:51,part:7,title:"Stroke and Cerebrovascular Conditions",kicker:"Time is brain",readMins:10,lead:"Stroke occurs when a blood vessel supplying the brain is blocked or ruptures, causing sudden neurological symptoms. Ischaemic and haemorrhagic strokes differ in mechanism, but both are emergencies.",objectives:["Distinguish ischaemic from haemorrhagic stroke and recognise TIA.","Apply FAST recognition and the correct emergency response.","Explain recovery and risk reduction in broad terms."],sections:[{h:"Mechanisms and recognition",p:["Ischaemic stroke results from blockage by a clot or narrowed vessel; haemorrhagic stroke results from bleeding into or around brain tissue. A transient ischaemic attack (TIA) causes stroke-like symptoms that resolve, but is a warning emergency because risk of further stroke is high.","FAST helps recognise face drooping, arm weakness and speech difficulty and reminds people to call emergency services. Other signs include sudden vision loss, severe headache, dizziness or imbalance. Note the time symptoms started, avoid giving food or drink and do not wait for improvement."]},{h:"Treatment and longer-term care",p:["Selected ischaemic strokes may be treated with clot-dissolving medicine or mechanical thrombectomy within a narrow time window, determined by specialists and imaging. Antiplatelet or anticoagulant, blood-pressure, cholesterol and other treatments depend on the cause. Haemorrhagic stroke requires urgent specialist care, often including neurosurgery.","Rehabilitation after stroke is intensive and individual. Recovery can continue for months and years. Managing blood pressure, smoking, diabetes, physical inactivity and atrial fibrillation reduces risk, but some strokes occur despite good care. Global inequities in acute care and rehabilitation remain substantial."]}],terms:[{t:"Ischaemic stroke",d:"Brain injury due to reduced blood flow, usually from a blocked vessel."},{t:"Haemorrhagic stroke",d:"Brain injury due to bleeding from a ruptured vessel."},{t:"Thrombectomy",d:"Removal of a blood clot from a vessel, used in selected acute strokes."}],figure:{d:"vessel",title:"Ischaemic versus haemorrhagic stroke",caption:"An ischaemic stroke follows obstruction of blood flow; a haemorrhagic stroke follows vessel rupture. Both reduce effective perfusion and can cause oedema or pressure in the brain.",labels:["Blocked vessel","Ruptured vessel","Ischaemic core","Bleed","Brain tissue"]},example:{t:"A sibling notices a drooping smile",p:"At dinner, one side of a father's face droops and his words slur. The family calls emergency services immediately and notes the time. They do not wait overnight or give aspirin. Hospital treatment decisions depend on testing and local protocols."},practice:["State what FAST stands for and what to do next.","Explain why a resolved TIA is still an emergency."],myth:{claim:"Wait an hour to see if stroke symptoms improve before calling for help.",fix:"Do not wait. Effective treatments are time-sensitive. Even symptoms that resolve can be a TIA warning and require urgent assessment."},safety:"Call local emergency services immediately for sudden face droop, one-sided weakness, speech difficulty, vision loss, severe headache, loss of coordination or consciousness. Do not give food, drink or medicines while awaiting help.",takeaways:["Stroke is a sudden vascular brain emergency with two main mechanisms.","Fast emergency response is essential and often time-sensitive.","Risk reduction and rehabilitation are long-term, multidisciplinary processes."],check:{q:"What does the 'S' in FAST represent?",options:["Sudden sleepiness","Speech difficulty","Severe shoulder pain","Swelling of the face"],a:1,why:"FAST stands for Face drooping, Arm weakness, Speech difficulty and Time to call emergency services. Each sign points toward a possible stroke and the need for immediate help."},refs:["who-stroke","cdc-stroke","nhs-stroke","nice-ng128"],related:[37,40,52,78],books:[18,15]},{id:52,part:7,title:"Parkinson's Disease and Movement Disorders",kicker:"More than tremor",readMins:9,lead:"Parkinson's disease is a progressive neurological condition affecting movement and many non-motor functions. Parkinsonism is a clinical syndrome with several causes, so a careful diagnosis matters.",objectives:["Distinguish parkinsonism from Parkinson's disease.","Describe key motor and non-motor features.","Outline broad management principles without prescribing."],sections:[{h:"Mechanisms and features",p:["Parkinson's disease involves degeneration of dopaminergic neurons in the substantia nigra and widespread changes in other systems. Hallmarks include bradykinesia, rigidity and rest tremor, often asymmetric. Diagnosis is clinical; imaging and tests can help exclude other conditions but there is no simple routine blood test.","Non-motor symptoms such as constipation, sleep disturbance, reduced smell, mood change, pain and cognitive change may appear early or later. Not everyone with tremor has Parkinson's, and not everyone with Parkinson's has tremor."]},{h:"Management and support",p:["Medication can substantially improve movement symptoms, but timing, side effects and interactions require monitoring. Physiotherapy, speech therapy, occupational therapy and exercise are important, as is attention to sleep, mental health and nutrition. Selected patients may be considered for specialist therapies such as deep brain stimulation.","There is no proven therapy that universally stops progression, and products claiming to 'repair dopamine neurons' are not supported. Symptoms fluctuate, and a bad day does not mean treatment has failed. Support should include families and care partners, with access adapted to local resources."]}],terms:[{t:"Bradykinesia",d:"Slowness and reduced amplitude of voluntary movement."},{t:"Substantia nigra",d:"A midbrain region containing dopamine neurons that degenerate in Parkinson's disease."},{t:"Parkinsonism",d:"A syndrome of slowness, rigidity and sometimes tremor with multiple possible causes."}],figure:{d:"brainSagittal",title:"Basal ganglia circuits and Parkinson's disease",caption:"Dopamine from the substantia nigra influences movement selection through basal ganglia loops. Loss of dopamine alters circuit balance, contributing to slowness and rigidity, but other systems also change.",variant:"basal"},example:{t:"A non-motor clue",p:"A person notices constipation and reduced smell years before a diagnosis, then develops a smaller handwriting and a shuffling walk. These signs do not prove Parkinson's. A specialist assessment is needed to distinguish it from other causes and plan treatment."},practice:["List three motor features and two non-motor features of Parkinson's disease.","Explain why not all tremor is Parkinson's disease."],myth:{claim:"Parkinson's disease only affects movement.",fix:"Non-motor symptoms are common and can include constipation, sleep disorders, mood changes, pain and cognitive changes. They affect quality of life and require attention."},safety:"New sudden movement difficulty with facial droop, one-sided weakness or speech change may be stroke and needs emergency care. Discuss medication timing and side effects with a clinician rather than making abrupt changes.",takeaways:["Parkinson's disease is a multisystem condition, not just tremor.","Parkinsonism has several causes and requires clinical diagnosis.","Multidisciplinary care and sustained support are central to management."],check:{q:"Which statement distinguishes Parkinson's disease from parkinsonism?",options:["They are exactly the same condition","Parkinsonism is a broad clinical syndrome; Parkinson's disease is one specific cause","Parkinsonism always causes tremor, but Parkinson's disease never does","Parkinson's disease is diagnosed by a routine blood test"],a:1,why:"Parkinsonism describes the syndrome of slowness, rigidity and variable tremor, which can have multiple causes. Parkinson's disease is one aetiology, diagnosed clinically by a specialist rather than a single blood test."},refs:["who-parkinson","ninds-parkinson","nhs-parkinson","parkinson-what","nice-ng71"],related:[22,32,65,75],books:[14,15]},{id:53,part:7,title:"Alzheimer's Disease and Other Dementias",kicker:"Not a normal part of ageing",readMins:10,lead:"Dementia is a clinical syndrome of cognitive decline that interferes with daily function. Alzheimer's disease is the most common cause, but mixed pathology and other conditions are common, and dementia is not an inevitable part of ageing.",objectives:["Distinguish dementia from normal age-related cognitive change.","Describe major causes and the purpose of diagnostic evaluation.","Discuss risk reduction and support without promising prevention."],sections:[{h:"A syndromic diagnosis",p:["Dementia can affect memory, language, attention, visuospatial skills, executive function and behaviour. Changes must represent a decline from previous ability and impair daily life. Normal ageing may slow processing or recall, but it does not usually take away independent function.","Alzheimer's disease involves amyloid and tau pathology, inflammation and network dysfunction over years. Other causes include vascular disease, Lewy body disease, frontotemporal degeneration and mixed pathology. Reversible contributors such as depression, medication effects, thyroid disease, B12 deficiency and sleep disorders should be considered."]},{h:"Care, risk and ethics",p:["Diagnosis can be clinical, supported by cognitive testing, blood tests and imaging. Biomarker tests are evolving and not equally available. Current treatments can improve symptoms and support function; some disease-modifying antibody therapies are approved in certain jurisdictions for selected patients, with significant monitoring and access challenges.","Risk reduction includes managing blood pressure and diabetes, not smoking, limiting excess alcohol, staying active and socially engaged, protecting hearing and treating depression. These may lower risk but do not guarantee prevention. People with dementia must be involved in decisions about their lives and care wherever possible."]}],terms:[{t:"Dementia",d:"A clinical syndrome of progressive cognitive decline affecting daily function."},{t:"Amyloid",d:"A protein fragment that aggregates in Alzheimer's disease and other conditions."},{t:"Mixed dementia",d:"Dementia with features of more than one underlying pathology, common in older age."}],figure:{d:"plaque",title:"Neural changes in Alzheimer's disease",caption:"Amyloid plaques and tau tangles are pathological features. They interact with inflammation, vascular change and synaptic dysfunction over many years. Brain changes begin well before symptoms.",variant:"alzheimer"},example:{t:"Forgetting a name versus forgetting the way home",p:"Occasionally forgetting a new name is common. Getting lost on a familiar route, repeating a whole conversation immediately or losing the ability to manage medications is more concerning. A focused assessment can distinguish many explanations."},practice:["Give two examples of changes that warrant cognitive assessment.","Explain why a diagnosis cannot be made from a single memory test."],myth:{claim:"Dementia is a normal and untreatable result of ageing.",fix:"Dementia is not normal ageing, has multiple causes and often has treatable contributors. Symptoms can be supported and care improved, even when the disease is progressive."},safety:"Seek urgent care for sudden confusion, memory loss with weakness or slurred speech, or a rapid decline. People with cognitive impairment who are unwell may be unable to describe their symptoms accurately.",takeaways:["Dementia is a syndrome, not a single disease or normal ageing.","Assessment can identify treatable contributors and clarify the pattern.","Support includes risk reduction, function, carers and careful decision-making."],check:{q:"Which statement best captures the difference between dementia and normal ageing?",options:["Any forgetting means dementia","Dementia involves cognitive decline that interferes with daily function, while normal ageing is usually milder","Dementia only affects people under 50","Normal ageing always destroys language"],a:1,why:"Dementia is a syndrome of functionally significant cognitive decline. Common age-related changes can be milder and do not usually prevent independence, though any concerning change should be assessed."},refs:["who-dementia","ninds-alzheimer","nia-alzheimer","nia-dementia","alz-what","alz-dementia"],related:[13,59,65,66],books:[15,12]},{id:54,part:7,title:"Multiple Sclerosis and Demyelinating Disorders",kicker:"Immune-mediated nerve injury",readMins:9,lead:"Multiple sclerosis is an inflammatory demyelinating condition of the central nervous system. Its course and symptoms vary widely, and several conditions can mimic it, so diagnosis needs specialist assessment.",objectives:["Explain demyelination and MS lesion location.","Describe common symptoms and diagnostic requirements.","Distinguish MS types and understand the need for tailored care."],sections:[{h:"Mechanisms and patterns",p:["Multiple sclerosis involves inflammatory damage to central myelin and axons. Lesions can occur in the optic nerve, spinal cord, brainstem and cerebral white matter. Symptoms depend on location and include visual change, weakness, numbness, balance problems, bladder and bowel changes and fatigue.","Common subtypes are relapsing–remitting and progressive, but categories overlap and change over time. Clinically isolated syndrome and radiologically isolated syndrome require careful follow-up. NMOSD and MOG antibody disease are distinct demyelinating conditions with specific tests and treatments."]},{h:"Diagnosis and management",p:["There is no single MS test. Diagnosis combines clinical relapses, MRI evidence of lesions in space and time, and exclusion of alternatives; spinal fluid and evoked potentials can be useful. Disease-modifying therapies reduce relapse activity for many people, but access and monitoring vary internationally.","Management also includes symptom relief, physiotherapy, fatigue and sleep support, mental health care and vocational help. Exercise and heat management can improve function. Supplements claiming to replace disease-modifying therapy are not supported."]}],terms:[{t:"Demyelination",d:"Loss or damage of myelin sheath, slowing or blocking conduction."},{t:"Relapse",d:"A new or worsening neurological deficit consistent with inflammatory CNS activity."},{t:"MRI lesion",d:"An area of altered signal on magnetic resonance imaging indicating tissue change."}],figure:{d:"myelin",title:"Demyelinating lesions in the central nervous system",caption:"Inflammatory lesions damage myelin and may injure axons. Conduction becomes slower or blocked. MRI can show characteristic lesions, although imaging alone does not define the diagnosis.",variant:"ms"},example:{t:"Vision change in one eye",p:"A young adult develops painful vision loss in one eye. Optic neuritis can occur in MS and other conditions. It requires urgent assessment. A single episode does not prove MS, and treatment should follow specialist evaluation and imaging."},practice:["Name four areas where MS lesions can cause symptoms.","Explain why a normal MRI does not automatically exclude MS."],myth:{claim:"MS always causes severe disability within a few years.",fix:"The course is highly variable. Many people have relapsing disease controlled with treatment, while others experience progressive disability. Prognosis is individual."},safety:"New neurological symptoms after a known demyelinating diagnosis need prompt specialist advice. Do not start high-dose supplements or alter disease-modifying therapy without your clinical team.",takeaways:["MS is an inflammatory demyelinating condition of the central nervous system.","Diagnosis requires clinical and imaging evidence with exclusion of mimics.","Treatment and support must be individualised and access-aware."],check:{q:"Which is the best description of MS as taught clinically?",options:["A single symptom caused by vitamin deficiency","An immune-mediated demyelinating disorder of the central nervous system","A disease only of peripheral nerves","A condition that always starts after age 60"],a:1,why:"MS is an immune-mediated demyelinating condition affecting the brain and spinal cord. Symptoms are variable, and it most often begins in younger adulthood, though it can occur at other ages."},refs:["who-ms","ninds-ms","nhs-ms","msif-what","mssociety-am"],related:[23,55,72,76],books:[20,24]}],ng=[{id:55,part:7,title:"Peripheral Neuropathy and Nerve Damage",kicker:"When nerve signals become unreliable",readMins:9,lead:"Peripheral neuropathy is damage or dysfunction of nerves outside the brain and spinal cord. It can affect sensation, movement and autonomic function, and its cause matters because some types are treatable.",objectives:["Describe common patterns and causes of peripheral neuropathy.","Distinguish neuropathy from central nervous system conditions.","Explain foot safety and appropriate diagnostic steps."],sections:[{h:"Patterns and causes",p:["Length-dependent polyneuropathy commonly begins with numbness, tingling or pain in the toes and feet and can ascend. Diabetes, alcohol-related harm, vitamin B12 deficiency, some medicines, kidney disease, infections, immune conditions and genetic disorders are among many causes. Focal compression, such as carpal tunnel syndrome, affects a specific nerve distribution.","Symptoms can include reduced sensation, burning or electric pain, weakness and balance difficulty. A clinician examines reflexes, sensation, strength and gait, and may order blood tests, nerve conduction studies or other investigations depending on the pattern."]},{h:"Care and prevention",p:["Treating the cause can stop worsening or improve symptoms: glucose management in diabetes, correcting deficiency, reviewing toxic exposures and stopping alcohol where relevant. Neuropathic pain may be treated with selected medications, physical approaches and self-management skills. Opioids are not a routine first-line choice.","Reduced foot sensation increases injury risk. Inspect feet regularly, wear protective footwear, avoid walking barefoot on hazardous ground and seek professional foot care. Do not use a heat source on numb feet or attempt to cut calluses at home."]}],terms:[{t:"Polyneuropathy",d:"Damage affecting multiple peripheral nerves, often in a length-dependent pattern."},{t:"Paresthesia",d:"An abnormal sensation such as tingling or 'pins and needles'."},{t:"Neuropathic pain",d:"Pain caused by a lesion or disease of the somatosensory nervous system."}],figure:{d:"neuron",title:"A peripheral nerve and its vulnerable fibres",caption:"Long sensory axons are especially susceptible to metabolic and toxic injury. Damage can reduce sensation, cause pain and impair balance, even when muscle strength is preserved.",variant:"neuropathy"},example:{t:"Burning feet in diabetes",p:"High glucose over time damages small nerve fibres and blood vessels. A person may feel burning at night or fail to notice a stone in their shoe. An injury can become an ulcer before it is felt. Daily foot checks are not cosmetic; they are preventive care."},practice:["Name three treatable or modifiable causes of peripheral neuropathy.","List three steps to protect numb feet."],myth:{claim:"A supplement can reverse all nerve damage.",fix:"Some neuropathies improve when a specific deficiency or cause is corrected. Many do not fully reverse, and no universal supplement repairs nerves. Unproven products can delay effective care."},safety:"Seek prompt care for a foot ulcer, spreading redness, sudden inability to walk, new weakness or rapid worsening of numbness. People with diabetes should follow local foot-care guidance.",takeaways:["Peripheral neuropathy has many causes and patterns.","Identifying and treating the cause can prevent further damage.","Foot protection and professional support reduce complications."],check:{q:"Which finding is most typical of a length-dependent sensory neuropathy?",options:["Loss of sensation beginning in the toes and feet","Sudden one-sided weakness of the face","Loss of vision in one eye","A seizure with no other symptoms"],a:0,why:"Long, distal axons are often affected first, producing a stocking-like sensory pattern. Facial weakness, monocular vision loss and seizures point toward central or cranial disorders and need appropriate emergency assessment."},refs:["ninds-neuropathy","nhs-neuropathy","ods-b12","nhs-b12"],related:[18,43,48,72],books:[10,11]},{id:56,part:7,title:"Spinal Cord Injuries and Neurological Disability",kicker:"Injury, rehabilitation and participation",readMins:9,lead:"Spinal cord injury can change movement, sensation, bladder function, blood-pressure control and independence. Modern care combines urgent protection, rehabilitation and long-term participation rather than focusing only on a cure.",objectives:["Distinguish traumatic and non-traumatic spinal cord injury.","Explain potential effects by level and completeness in general terms.","Recognise autonomic dysreflexia and other urgent complications."],sections:[{h:"Mechanisms and consequences",p:["Traumatic injury often follows road collisions, falls or violence. Non-traumatic causes include tumours, infection, vascular problems, inflammation and degenerative disease. Initial mechanical damage can be followed by swelling, inflammation and reduced blood flow, which is why expert early care matters.","The level and completeness of injury influence movement, sensation and autonomic function. Cervical injuries may affect arms and legs; thoracic and lumbar injuries produce different patterns. Effects are not simply about paralysis: bladder, bowel, sexual function, temperature regulation and blood pressure can all change."]},{h:"Rehabilitation, rights and emergencies",p:["High-quality rehabilitation includes mobility, bladder and bowel management, pressure-injury prevention, pain care, speech and occupational therapy and mental health support. Assistive technology and accessible environments are essential. People with spinal cord injury should be involved in decisions and not defined by their diagnosis.","Autonomic dysreflexia is an emergency, especially after high thoracic or cervical injury. It can cause a sudden severe headache, very high blood pressure, sweating, flushing or slow heart rate, often triggered by bladder or bowel problems, pressure injury or another painful stimulus. Seek urgent medical help."]}],terms:[{t:"Complete injury",d:"Absence of sensory and motor function below the injury level in a standardised examination."},{t:"Autonomic dysreflexia",d:"A dangerous autonomic reaction to a noxious stimulus in people with higher-level spinal cord injury."},{t:"Pressure injury",d:"Localised skin and tissue damage caused by sustained pressure, common after reduced mobility."}],figure:{d:"spinal",title:"Injury level and possible functional effects",caption:"Cervical, thoracic and lower injuries affect different functions, but outcomes vary. Rehabilitation and accessible environments shape participation as much as the lesion level.",variant:"injury"},example:{t:"A pressure injury can begin silently",p:"Reduced sensation and mobility make it easy to miss pressure damage. Regular skin checks, repositioning and appropriate seating are essential. People with spinal cord injury often need coordinated support from rehabilitation and primary care."},practice:["Explain why spinal cord injury is more than paralysis.","List the warning features of autonomic dysreflexia."],myth:{claim:"Life after spinal cord injury is necessarily a life without meaningful activity.",fix:"People with spinal cord injury work, study, parent, create and participate in their communities. Accessibility, rehabilitation and support determine opportunity, and disability is not a measure of worth."},safety:"Sudden severe headache, very high blood pressure, flushing, sweating or bradycardia in someone with high-level spinal cord injury may be autonomic dysreflexia. Seek emergency help and address likely triggers only as local protocols advise.",takeaways:["Spinal cord injury has wide-ranging sensorimotor and autonomic effects.","Rehabilitation and accessible environments are central to participation.","Autonomic dysreflexia is a time-critical emergency."],check:{q:"Why is autonomic dysreflexia dangerous?",options:["It only causes mild sleepiness","It can cause severe high blood pressure and other autonomic instability","It is a harmless side effect of exercise","It only affects people without spinal cord injury"],a:1,why:"After high-level spinal cord injury, an unmodulated sympathetic response can produce dangerous hypertension and other signs. It needs urgent recognition and management."},refs:["ninds-sci","openstax-ap","nice-neuro-rehab"],related:[17,32,67,76],books:[14,15,24]},{id:57,part:7,title:"Motor Neuron Diseases and Neuromuscular Conditions",kicker:"When nerves and muscles fail to connect",readMins:9,lead:"Motor neuron diseases damage the neurons controlling movement, while neuromuscular junction disorders interrupt communication between nerve and muscle. They share some symptoms but require different assessments and treatments.",objectives:["Distinguish motor neuron disease, spinal muscular atrophy and myasthenia gravis.","Describe the role of the neuromuscular junction.","Understand multidisciplinary care and the importance of avoiding unproven cures."],sections:[{h:"Motor neuron disease",p:["Amyotrophic lateral sclerosis (ALS) causes progressive degeneration of upper and lower motor neurons. Symptoms can include weakness, muscle wasting, stiffness, twitching and bulbar changes such as slurred speech or swallowing difficulty. Sensation and bladder function are often relatively preserved, but cognitive and behavioural changes can occur in some people.","Spinal muscular atrophy is a different genetic condition affecting lower motor neurons. Diagnosis and management vary. ALS care focuses on function, communication, nutrition, breathing, symptom relief and advance care planning. Multidisciplinary teams can improve quality of life and support families."]},{h:"Neuromuscular junction disorders",p:["The neuromuscular junction converts a motor command into muscle contraction through acetylcholine release and receptor activation. Myasthenia gravis is an autoimmune condition that impairs this transmission, causing fatigable weakness that can affect eyelids, swallowing, speech and limbs. It is not the same as motor neuron disease.","Myasthenic crisis with breathing difficulty or swallowing failure is an emergency. Specific treatments act on the immune system or transmission, while supportive care and monitoring are essential. No unverified supplement or dietary protocol has been shown to replace these treatments."]}],terms:[{t:"Bulbar",d:"Related to the brainstem or functions involving speech, swallowing and facial movement."},{t:"Neuromuscular junction",d:"The synapse between a motor neuron and a muscle fibre."},{t:"Fatigable weakness",d:"Weakness that worsens with repetition or sustained effort and may improve with rest."}],figure:{d:"synapse",title:"The neuromuscular junction",caption:"Motor nerve terminals release acetylcholine onto muscle receptors, triggering contraction. Autoimmune receptor disruption can cause fatigable weakness, while motor neuron degeneration interrupts the command upstream.",variant:"nmj"},example:{t:"Drooping eyelids that worsen through the day",p:"Fluctuating muscle weakness after repeated use can be a clue to a neuromuscular junction disorder. It requires clinical assessment, because different conditions need different treatments. Fatigue alone is not enough to diagnose it."},practice:["Contrast an upper motor neuron sign with a lower motor neuron sign in broad terms.","Explain why swallowing and breathing are monitored in neuromuscular disease."],myth:{claim:"Weakness from a neuromuscular disease can be cured with a high-protein or alkaline diet.",fix:"Nutrition supports strength and breathing but does not correct the underlying disorder. Prescribed treatment, multidisciplinary care and close monitoring are essential."},safety:"New difficulty breathing, swallowing or speaking, or rapidly worsening weakness, is an emergency. Do not stop or change neuromuscular treatment without specialist advice.",takeaways:["Motor neuron disease damages motor neurons; myasthenia affects the neuromuscular junction.","Sensory and cognitive features vary and help distinguish conditions.","Multidisciplinary care emphasises function, dignity, communication and symptom relief."],check:{q:"What happens at the neuromuscular junction?",options:["A motor neuron releases acetylcholine that activates muscle receptors","A sensory neuron detects sound","A gland releases insulin into the brain","Oligodendrocytes form a myelin sheath around the heart"],a:0,why:"Motor neurons release acetylcholine onto muscle nicotinic receptors, triggering contraction. The other options mix up unrelated systems and structures."},refs:["ninds-als","nice-ng42","purves-neuroscience"],related:[32,55,72,76],books:[14,20]},{id:58,part:7,title:"Neuralgia, Chronic Pain and Sensory Disorders",kicker:"Pain that persists and misfires",readMins:9,lead:"Neuropathic pain and neuralgias are caused by damage or dysfunction in sensory pathways. They differ from ordinary pain after injury and often need a broader treatment approach.",objectives:["Distinguish neuropathic pain from nociceptive pain.","Identify red flags and common neuropathic pain patterns.","Describe the principles of multidisciplinary pain care."],sections:[{h:"Patterns and mechanisms",p:["Trigeminal neuralgia produces sudden, severe facial pain in the distribution of the trigeminal nerve, often triggered by touch, eating or cold air. Postherpetic neuralgia can follow shingles, and central post-stroke pain arises from damage to pain pathways in the brain or spinal cord. Peripheral neuropathy can produce burning, electric or shooting pain.","Neuropathic pain may be described as stabbing, burning, freezing or electric, with allodynia (normally non-painful touch causing pain) or hypersensitivity. These descriptions are clues, not a diagnosis. New facial pain with weakness, rash, weight loss or persistent worsening needs assessment."]},{h:"Care that addresses the whole person",p:["Treatment may include selected antidepressants or anticonvulsant-type medicines, topical treatments and physical therapy, alongside sleep, pacing, cognitive-behavioural approaches and support for distress. Opioids are not generally the first-line treatment for chronic neuropathic pain because benefits are limited and risks are substantial.","Persistent pain is influenced by sleep, mood, stress, activity and social context, but that does not mean it is imaginary. A biopsychosocial approach treats the condition seriously while avoiding unhelpful stories of blame. Sudden new neurological signs or severe pain need prompt assessment."]}],terms:[{t:"Neuralgia",d:"Pain along the course of a nerve, often caused by irritation or damage."},{t:"Allodynia",d:"Pain caused by a stimulus that does not normally provoke pain."},{t:"Biopsychosocial model",d:"Understanding pain through interacting biological, psychological and social factors."}],figure:{d:"pain",title:"Pain pathways and neuropathic sensitisation",caption:"Nerve injury can produce ectopic signals and central hyperexcitability. Descending modulation, sleep and mood influence pain. Treatment targets multiple levels of this system.",variant:"neuropathic"},example:{t:"Facial pain while brushing teeth",p:"A brief electric pain when touching the cheek or brushing teeth may suggest trigeminal neuralgia, but dental problems, sinus disease and other conditions also cause facial pain. Dental and medical assessment may both be needed. A self-diagnosis could miss a treatable cause."},practice:["Explain allodynia in one sentence.","Name one medication and one non-medication strategy commonly discussed for chronic pain."],myth:{claim:"Neuropathic pain is all in a person's head or imagination.",fix:"Neuropathic pain has biological mechanisms in sensory pathways and is experienced by the whole person. Psychological and social factors influence pain, but that does not make it unreal."},safety:"Seek urgent help for severe headache or facial pain with weakness, a first seizure, new numbness with difficulty walking or pain after serious injury. Do not start prescription medicines from an unverified source.",takeaways:["Neuropathic pain arises from damage or dysfunction of sensory pathways.","Treatment is multimodal and individualised.","Pain is real even when tests do not show obvious damage; symptoms still need appropriate evaluation."],check:{q:"Allodynia is best defined as:",options:["Pain caused by a stimulus that does not normally provoke pain","Complete loss of pain sensation","Pain only during exercise","Pain that is always caused by anxiety"],a:0,why:"Allodynia is pain elicited by a normally innocuous stimulus, such as light touch. It is a clue to altered sensory processing, not a diagnosis or proof of a psychological cause."},refs:["ninds-neuropathy","nhs-migraine","nice-ng127","ninds-tests"],related:[30,39,54,67],books:[13]},{id:59,part:7,title:"Neurological Infections and Inflammation",kicker:"Urgent conditions and long-term consequences",readMins:9,lead:"Infections and immune inflammation can affect the brain, meninges, spinal cord and peripheral nerves. Some are immediately life-threatening and require emergency treatment, while others cause chronic or relapsing symptoms.",objectives:["Recognise symptoms of meningitis and encephalitis.","Explain how immune responses can harm the nervous system.","Describe prevention and care across different healthcare settings."],sections:[{h:"Acute infection",p:["Meningitis is inflammation of the meninges, commonly caused by bacteria or viruses. Symptoms can include fever, severe headache, neck stiffness, nausea, confusion and sensitivity to light. A rash may occur in some bacterial infections but is not always present.","Encephalitis affects brain tissue and may cause confusion, seizures, behavioural change, drowsiness or focal weakness. Bacteria, viruses, fungi and parasites vary by region. HIV, tuberculosis and other infections can affect the nervous system, especially where access to prevention and treatment is limited."]},{h:"Immune-mediated inflammation",p:["Some neuroinflammatory conditions arise when the immune system mistakenly targets nervous tissue, sometimes after an infection or as part of an autoimmune disease. Guillain–Barré syndrome affects peripheral nerves and can cause progressive weakness; autoimmune encephalitis can produce seizures, cognitive change and psychiatric symptoms.","Diagnosis may involve blood tests, imaging, lumbar puncture and specialist testing. Treatment often targets infection or immune activation and requires close monitoring. Vaccination, safe food and water, HIV prevention and prompt care reduce infection risk."]}],terms:[{t:"Meningitis",d:"Inflammation of the meninges, which can be infectious or non-infectious."},{t:"Encephalitis",d:"Inflammation of brain tissue, often causing altered consciousness or seizures."},{t:"Guillain–Barré syndrome",d:"An immune-mediated polyneuropathy causing progressive weakness."}],figure:{d:"plaque",title:"Meninges, brain and inflammatory involvement",caption:"Meningitis involves the protective membranes; encephalitis involves brain tissue. Symptoms reflect the location and severity of inflammation.",variant:"infection"},example:{t:"A fever with neck stiffness",p:"A teenager develops fever, severe headache and neck stiffness and becomes drowsy. This combination is a medical emergency. The family calls emergency services and does not wait for a rash or try home remedies."},practice:["List four symptoms that should prompt emergency assessment for meningitis.","Explain why vaccination is a neurological health measure."],myth:{claim:"Meningitis always causes a classic rash, so its absence excludes it.",fix:"Rashes vary by cause and may appear late or not at all. Fever with headache, neck stiffness, confusion or drowsiness requires urgent assessment regardless."},safety:"Call emergency services for fever with neck stiffness, severe headache, confusion, photosensitivity, a new rash, seizures or reduced consciousness. Do not delay for a doctor's appointment if the person is rapidly worsening.",takeaways:["Neurological infections can be rapidly life-threatening.","Immune-mediated conditions are a separate but overlapping category of neuroinflammation.","Prevention, prompt treatment and rehabilitation reduce long-term harm."],check:{q:"Meningitis primarily refers to inflammation of:",options:["The meninges","The retina only","The peripheral nerve sheath only","The adrenal glands"],a:0,why:"The meninges are the protective membranes around the brain and spinal cord. Encephalitis refers to brain tissue inflammation, and peripheral neuropathy or adrenal disease are separate conditions."},refs:["nhs-meningitis","ninds-gbs","who-epilepsy","nice-ng127"],related:[4,30,50,78],books:[20,21]},{id:60,part:7,title:"Other Important Neurological Conditions",kicker:"A wider clinical map",readMins:9,lead:"Many neurological conditions do not fit neatly into the previous chapters. This chapter introduces brain tumours, hydrocephalus, functional neurological disorder, cerebral palsy and facial weakness, with a focus on getting appropriate care rather than self-labelling.",objectives:["Recognise broad categories of additional neurological conditions.","Understand functional neurological disorder without stigma.","Identify symptoms that need urgent or specialist assessment."],sections:[{h:"Tumours and pressure",p:["Brain and spinal tumours can be benign or malignant and may cause headache, seizures, weakness, sensory change, speech difficulty or hormonal effects. Headache is common and usually not a tumour, but new persistent headache with neurological signs, vomiting, visual change or progressive deterioration needs assessment.","Hydrocephalus is an abnormal accumulation of cerebrospinal fluid that can raise pressure. It may present with headache, vomiting, drowsiness, visual changes, gait difficulty or, in infants, head enlargement. Urgent assessment is needed for severe or worsening signs."]},{h:"Functional, developmental and facial conditions",p:["Functional neurological disorder (FND) involves genuine neurological symptoms such as weakness, seizure-like episodes, movement disorder or sensory change that are not explained by structural disease. Diagnosis is made by a clinician through positive features, not by dismissing the person. FND is common, treatable and often improves with specialist rehabilitation and psychological support.","Cerebral palsy is a group of movement and posture conditions caused by early brain injury or maldevelopment; support needs vary widely. Bell's palsy is acute facial weakness from inflammation of the facial nerve, while facial weakness from stroke often spares the forehead and may involve other deficits. A clinician should distinguish them."]}],terms:[{t:"Hydrocephalus",d:"Accumulation of cerebrospinal fluid that can increase pressure within the nervous system."},{t:"Functional neurological dis
