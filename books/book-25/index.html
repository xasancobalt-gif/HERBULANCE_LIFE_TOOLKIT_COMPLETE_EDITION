order",d:"A condition of genuine neurological symptoms arising from altered brain network function rather than structural disease."},{t:"Cerebral palsy",d:"A group of lifelong movement and posture disorders arising from early brain injury or maldevelopment."}],figure:{d:"brainSagittal",title:"Spaces, pressure and neurological diversity",caption:"Tumours or hydrocephalus can increase pressure; cerebral palsy and functional disorders reflect altered development or network function. Diagnosis and support differ.",variant:"other"},example:{t:"Two causes of facial weakness",p:"A person cannot close one eye or raise the eyebrow on the same side. This pattern can fit Bell's palsy. If the forehead is spared and an arm is weak or speech is slurred, stroke is more likely and requires emergency care."},practice:["List three reasons a persistent new headache should be assessed.","Explain what functional neurological disorder is not."],myth:{claim:"Functional neurological symptoms are fake or deliberate.",fix:"FND symptoms are real and not intentionally produced. They reflect altered brain network function, cause distress and disability, and deserve competent diagnosis and treatment."},safety:"Seek emergency care for sudden facial weakness with other neurological signs, severe or worsening headache, repeated vomiting, new seizure, confusion or reduced consciousness. Do not attempt to diagnose FND or Bell's palsy yourself.",takeaways:["Additional neurological conditions have distinct mechanisms and care needs.","Brain pressure and tumours need urgent assessment when signs progress.","FND and cerebral palsy deserve respectful, function-focused support."],check:{q:"Which statement about functional neurological disorder is most accurate?",options:["It is a conscious decision to fake symptoms","Its symptoms are real and arise from altered nervous system functioning","It always means a structural brain tumour is present","It never requires rehabilitation"],a:1,why:"FND involves genuine neurological symptoms that are not deliberately produced and are best understood as network-level dysfunction. Good clinical assessment and rehabilitation can improve function."},refs:["ninds-headache","nice-ng127","ninds-brain-basics"],related:[53,55,59,67],books:[15,20]}],ig=[{id:61,part:8,title:"Nervous System Development Before Birth",kicker:"The first construction phase",readMins:9,lead:"The fetal nervous system develops through precisely timed processes of cell division, migration, connection and refinement. Nutrition, infection, medication, environment and broader social conditions can influence these processes.",objectives:["Outline early neural tube formation and cellular development.","Explain how maternal health and exposures can influence brain development.","Discuss prevention without blaming or shaming pregnant people."],sections:[{h:"Building the early nervous system",p:["The neural tube forms from the neural plate and later develops into the brain and spinal cord. Failure of complete closure can produce neural tube defects. Neural stem cells divide, migrate and differentiate into neurons and glia. Axons guide themselves using chemical cues and early activity.","The womb is not a controlled laboratory; development interacts with maternal health, infection, nutrients, medicines, alcohol, smoking, stress and environmental exposures. Folic acid around conception reduces neural tube defect risk. Iodine, iron and other nutrients support thyroid and neural development."]},{h:"Care, uncertainty and respectful language",p:["Not all developmental differences are preventable, and families should not be blamed for conditions beyond their control. Vaccination during pregnancy, avoiding alcohol, managing conditions such as diabetes and accessing antenatal care support better outcomes. Newborn screening and early intervention vary by country.","If a scan or screening test raises concern, families need clear, compassionate information and appropriate specialist input. There is no single supplement or diet that guarantees a particular neurological outcome."]}],terms:[{t:"Neural tube",d:"The embryonic structure that develops into the brain and spinal cord."},{t:"Neural tube defect",d:"A condition from incomplete closure of the neural tube, such as spina bifida."},{t:"Antenatal",d:"The period before birth."}],figure:{d:"development",title:"Early neural development",caption:"Neural tube closure, cell proliferation, migration and early circuit formation occur on a tightly regulated timetable. Folate, iodine and maternal health influence outcomes.",variant:"prenatal"},example:{t:"Folic acid planning before conception",p:"Because the neural tube closes early, folic acid is recommended before conception and in early pregnancy in many jurisdictions. The exact dose depends on local guidance and individual risk. It is a practical prevention measure, not a guarantee."},practice:["Explain why the timing of neural tube closure matters for folate advice.","List two exposures that can affect early brain development."],myth:{claim:"A parent causes a child's developmental difference through one lifestyle choice.",fix:"Development has many interacting genetic, environmental and chance factors. Blaming parents is inaccurate, harmful and does not help the child receive appropriate support."},safety:"Use folic acid and supplements according to local antenatal guidance. Ask a clinician before starting or stopping medicines in pregnancy, and seek care for reduced fetal movement according to local advice.",takeaways:["Prenatal development involves timed construction and refinement.","Folate, iodine, maternal health and avoiding harmful exposures support development.","Prevention advice should be compassionate and not imply parental blame."],check:{q:"Why is folic acid often started before conception?",options:["The neural tube forms and closes early in pregnancy","It guarantees a particular intelligence","It replaces all antenatal care","It prevents every genetic condition"],a:0,why:"The neural tube closes early, often before a person knows they are pregnant. Folate reduces neural tube defect risk but does not guarantee specific developmental outcomes or replace care."},refs:["ods-folate","ninds-brain-basics","ods-iodine"],related:[6,62,68],books:[10,15]},{id:62,part:8,title:"Childhood Brain Development",kicker:"Experience meets biology",readMins:9,lead:"Childhood is a period of rapid brain growth, connectivity and refinement. Children need nutrition, sleep, safety, movement, language-rich relationships and access to education and health care, not just academic pressure.",objectives:["Describe major developmental changes in childhood.","Explain the roles of play, sleep, language and relationships.","Discuss milestones without treating one timeline as universal."],sections:[{h:"Growth and refinement",p:["Brain volume increases quickly, while synapses form and are selectively pruned and myelination progresses. Sensory and motor maps refine with experience. Language networks become more efficient. Executive functions develop gradually and depend on maturation, practice and environmental support.","Sensitive periods are windows when particular experiences have strong effects, such as early language exposure or visual development. Early intervention can be valuable, but brain development continues across childhood and beyond."]},{h:"Everyday foundations and concerns",p:["Children benefit from responsive relationships, adequate sleep, varied food, safe movement and limits on chronic stress. Play supports problem-solving, social understanding and physical coordination. Hearing and vision should be checked because undetected sensory problems affect learning and behaviour.","Milestones are ranges, not a race. Regression of skills, loss of hearing, persistent feeding difficulties, absent response to sound or consistent difficulties at home and school should be discussed with a qualified clinician. A diagnosis does not define a child's potential."]}],terms:[{t:"Developmental milestone",d:"A skill that most children acquire within an approximate age range."},{t:"Early intervention",d:"Support and therapy provided when developmental concerns are identified."},{t:"Sensitive period",d:"A time when a particular experience has especially strong effects on development."}],figure:{d:"development",title:"Childhood development is uneven and individual",caption:"Language, motor, social and cognitive skills develop at different rates. Milestones guide screening but cannot replace individual assessment.",variant:"childhood"},example:{t:"A quiet child at school",p:"Difficulty hearing the teacher may look like inattention. A hearing screen can reveal wax, glue ear or another problem. When sensory and health issues are addressed, some learning difficulties improve. Assessment should be curious, not blaming."},practice:["List three foundations for healthy childhood brain development.","Explain why a milestone should be interpreted as a range rather than a deadline."],myth:{claim:"A child's brain is fully set by age five.",fix:"Early childhood is a period of rapid change, but development continues through adolescence and adulthood. Older children and teenagers can benefit from support and new opportunities."},safety:"Seek assessment for regression, repeated seizures, hearing loss, serious head injury, persistent extreme behavioural change or difficulty breathing during sleep. Do not use unproven supplements to treat learning or behaviour.",takeaways:["Childhood brain development is shaped by biology and experience.","Relationships, sleep, nutrition, play and sensory health matter.","Developmental variation is normal, while regression needs assessment."],check:{q:"Which is a sensible interpretation of developmental milestones?",options:["Every child must meet each milestone on the same day","They are approximate guides that support monitoring and assessment","They are irrelevant to child health","A missed milestone always means permanent disability"],a:1,why:"Milestones provide useful developmental reference points, with broad normal variation. Persistent delays or regression warrant assessment, but timing alone does not determine long-term ability."},refs:["ninds-brain-basics","who-activity","nhlbi-sleep"],related:[6,61,63,66],books:[10,12,20]},{id:63,part:8,title:"Adolescence and Neurological Maturation",kicker:"A period of opportunity and vulnerability",readMins:9,lead:"Adolescence is a distinct neurodevelopmental period. Brain circuits supporting motivation, social learning and self-regulation change rapidly, while the environment shapes risk and opportunity.",objectives:["Describe key adolescent brain changes.","Explain how sleep, risk and social context interact.","Address adolescent mental health without stigma."],sections:[{h:"Networks in transition",p:["Synaptic pruning and myelination refine prefrontal, limbic and reward-related networks. The prefrontal cortex continues to develop into the mid-twenties, but adolescent brains are not simply 'immature'; they are adapted for exploration, peer learning and independence.","Heightened sensitivity to rewards and social evaluation can support learning but also increase risk-taking, especially in emotionally charged settings. This is a reason for graduated independence, safety education and supportive boundaries, not contempt."]},{h:"Sleep, substances and wellbeing",p:["Many adolescents experience a biological shift toward later sleep timing, compounded by early school schedules and screens. Chronic short sleep is linked to poorer attention, mood and learning. Regular schedules and morning light may help; persistent low mood, anxiety or sleep problems need support.","Alcohol, cannabis, nicotine and other substances can affect the developing nervous system, mental health and sleep. Harm-reduction and honest information work better than shame. Adolescents should have private access to trustworthy health advice and know when to seek emergency help."]}],terms:[{t:"Adolescence",d:"The developmental period between childhood and adulthood involving biological, psychological and social change."},{t:"Pruning",d:"Experience-dependent elimination of some synapses, increasing circuit efficiency."},{t:"Reward circuit",d:"Networks that assign value and motivate approach behaviour."}],figure:{d:"development",title:"Adolescent maturation of control and reward systems",caption:"Reward and social networks change alongside developing prefrontal control. The mismatch in timing varies between people and is shaped by sleep, stress and environment.",variant:"adolescence"},example:{t:"A later bedtime and an early start",p:"A teenager who cannot fall asleep until late may genuinely struggle to wake for school. This is not necessarily defiance. Consistent light exposure, limits on late caffeine and a supportive schedule can help; persistent sleepiness may need assessment."},practice:["Explain one adolescent brain change in plain language.","List two ways schools or families can reduce sleep-related harms."],myth:{claim:"Adolescents take risks because their brains are broken.",fix:"Adolescence is an adaptive developmental phase. Risk-taking is influenced by peer context, emotion, sleep, mental health and environment, and it can be reduced through safety and support."},safety:"Seek urgent help for thoughts of suicide, severe agitation, psychosis, drug overdose or a seizure. Confidential adolescent health services can address substance use and mental health without judgement.",takeaways:["Adolescence is a period of active circuit refinement.","Sleep and social context strongly influence learning and wellbeing.","Support and safety are more effective than shame-based approaches."],check:{q:"Which statement best describes adolescent brain development?",options:["Brain development stops at puberty","Prefrontal control networks continue to mature into early adulthood alongside reward and social systems","Adolescents cannot learn new skills","All risk-taking is caused by brain damage"],a:1,why:"Adolescent brain maturation continues into the third decade and involves interacting networks. It supports learning and social adaptation, even as it creates periods of heightened vulnerability."},refs:["ninds-brain-basics","nhlbi-sleep","who-alcohol"],related:[6,62,64,66],books:[12,13,14]},{id:64,part:8,title:"Adult Neuroplasticity and Learning",kicker:"Change with practice, not magic",readMins:8,lead:"Adults retain substantial capacity to learn and adapt. Plasticity is driven by practice, feedback, sleep and meaningful goals, and it is constrained by biology, health and environment.",objectives:["Explain adult synaptic and structural plasticity.","Design a learning approach based on spaced practice and feedback.","Evaluate commercial brain training claims critically."],sections:[{h:"Learning mechanisms",p:["Repeated, appropriately timed activity can strengthen synapses and alter cortical representations. Skill learning often begins effortful and becomes more automatic with practice; this is not a sign that the brain has stopped changing. Sleep and rest support consolidation.","Plasticity is specific. Learning a memory game may improve that game and related strategies, but broad transfer to real-world intelligence is uncertain. Claiming that a product transforms the whole brain is unsupported."]},{h:"Using plasticity well",p:["Choose meaningful skills, break them into manageable steps, space practice across days and seek feedback. Manage sleep, pain, fatigue and stress. For people with neurological injury, rehabilitation should be guided by a qualified team and adjusted to energy limits.","The internet is full of exercises promising permanent cognitive enhancement. Check the evidence for meaningful outcomes, not just performance on the trained task, and be cautious about stopping medication or replacing therapy."]}],terms:[{t:"Consolidation",d:"The stabilisation and integration of new memories or skills over time, often supported by sleep."},{t:"Transfer",d:"Improvement in a related but untrained task or real-world skill after training."},{t:"Spaced practice",d:"Distributing learning sessions over time rather than massing them into one session."}],figure:{d:"network",title:"Practice, feedback and network refinement",caption:"Repeated learning strengthens some connections and reduces others. Effects are strongest for the trained skill, and consolidation continues after practice ends.",variant:"adult-learning"},example:{t:"Learning a language as an adult",p:"Daily short practice, listening, feedback and sleep are more useful than a single marathon session. Progress is uneven. This is genuine learning, but it does not prove a supplement or brain game increases all abilities."},practice:["Plan a skill you want to improve and distribute three practice sessions this week.","Identify one claim of broad 'brain enhancement' that needs better evidence."],myth:{claim:"Adult brains cannot form new neurons, so change is impossible.",fix:"The adult brain shows synaptic, structural and network plasticity, and some regions show evidence of new neuron birth. The extent and function of adult neurogenesis in humans remain actively researched."},takeaways:["Adults can change specific circuits through practice and feedback.","Sleep, health and environment modulate learning.","Commercial brain training rarely produces broad real-world benefits."],check:{q:"Which approach best supports adult learning?",options:["A single exhausting training session","Spaced, specific practice with feedback and adequate sleep","A supplement with no evidence","Avoiding all challenge to protect the brain"],a:1,why:"Spaced practice, specific goals, feedback and sleep optimise consolidation. Single massed sessions, unproven supplements and avoiding challenge are less effective."},refs:["purves-neuroscience","nhlbi-sleep","who-activity"],related:[7,63,65,80],books:[12,14,15]},{id:65,part:8,title:"Ageing and Changes in Neural Function",kicker:"Adaptation across decades",readMins:9,lead:"Ageing brings changes in processing speed, sensory function and some aspects of memory, but many abilities remain stable and some improve. Healthy ageing is shaped by health, environment, social connection and purpose.",objectives:["Distinguish common age-related changes from neurological warning signs.","Describe factors associated with brain health in later life.","Explain why prevention advice must avoid guarantees."],sections:[{h:"What often changes",p:["Processing speed may slow, and divided attention can become harder. Sensory acuity, especially hearing, may decline. Vocabulary and accumulated knowledge often remain strong. Changes vary widely; one person's timeline is not a diagnosis for another.","Stroke, depression, medication effects, sleep problems, hearing loss and vitamin deficiencies can worsen cognition and may be treatable. Sudden or rapid decline, getting lost, personality change or difficulty with daily activities should be assessed."]},{h:"Protecting function",p:["Physical activity, blood-pressure management, avoiding smoking, limiting excess alcohol, hearing correction, social engagement, sleep and a varied diet are associated with healthier ageing. Staying mentally active is helpful and should be enjoyable rather than a fear-driven regimen.","No supplement guarantees prevention of dementia or cognitive decline. Some cognitive changes are not preventable, and people living with them still deserve dignity, meaningful activity and excellent care. Ageing is not a disease."]}],terms:[{t:"Cognitive reserve",d:"The ability to maintain function despite age-related or disease-related brain change, influenced by education, activity and health."},{t:"Presbycusis",d:"Age-related hearing loss, which can affect communication and cognition."},{t:"Delirium",d:"An acute disturbance of attention and awareness, often caused by illness, medication or injury."}],figure:{d:"development",title:"Ageing as adaptation and accumulated health",caption:"Changes in processing speed and sensory function are common, while vocabulary and wisdom can remain stable. Vascular health, hearing, sleep and social connection influence the trajectory.",variant:"ageing"},example:{t:"Hearing and memory concerns",p:"A man's family notices him missing conversation and repeating himself. A hearing assessment is appropriate; so is a review of medications and cognition if daily functioning is affected. Treatable factors are common, and labels should not be applied prematurely."},practice:["Name two common age-related changes and two signs that warrant assessment.","List three later-life factors associated with brain health."],myth:{claim:"Older adults cannot learn new things.",fix:"Learning continues across adulthood. Pace, sensory access and healthy support may need adjustment, but age alone does not eliminate the capacity to learn and adapt."},safety:"Sudden confusion, new weakness or speech difficulty, severe headache, repeated falls or rapid cognitive decline needs prompt assessment. Delirium can be a sign of serious illness.",takeaways:["Ageing involves variable changes, not one inevitable decline.","Treatable health problems can affect cognition and function.","Brain health in later life is supported by broad, practical health care."],check:{q:"Which statement best describes cognitive change with ageing?",options:["Every older adult develops dementia","Some processing speed may slow, while knowledge often remains stable, and changes vary widely","Cognition always improves with age","Hearing loss has no cognitive relevance"],a:1,why:"Ageing trajectories differ, and many abilities remain stable. Hearing loss and other health factors can affect communication and cognition, and dementia is a clinical syndrome, not inevitable ageing."},refs:["nia-brain-aging","nia-dementia","who-dementia","cdc-hearing"],related:[31,53,64,67],books:[12,15,24]},{id:66,part:8,title:"Neurodiversity and Different Neurological Experiences",kicker:"Difference, disability and dignity",readMins:9,lead:"Neurodiversity recognises that neurological development varies. Autism, ADHD, dyslexia and other cognitive profiles can involve real support needs and real strengths. Differences should not be reduced to deficits or treated as personal failures.",objectives:["Explain neurodiversity without erasing support needs.","Use respectful language about disability and diagnosis.","Understand how accessible environments can reduce barriers."],sections:[{h:"A social and medical perspective",p:["Autism, ADHD, dyslexia, dyspraxia and other profiles differ in how information is processed and how a person experiences the world. Some people need accommodations; others do not. A diagnosis may help access support and understanding, but it should not erase individuality or be treated as a defect.","The social model of disability highlights how environments create barriers. A person with sensory sensitivities may be disabled by fluorescent lights and noise, not by their own identity. The medical model remains useful when treating co-occurring conditions, episodic illness or specific symptoms."]},{h:"Support that respects agency",p:["Accessible communication, predictable information, flexible sensory environments, clear expectations and respected decision-making can improve participation. Addressing sleep, anxiety, pain, gastrointestinal and other health issues is part of care, not a denial of neurodiversity.","Language is personal. Some people prefer identity-first terms such as 'autistic person'; others prefer 'person with autism'. Respect the individual. Do not force eye contact, masking or painful therapies as a condition of acceptance. Safeguarding is essential where communication needs are high."]}],terms:[{t:"Neurodiversity",d:"The idea that variation in neurological development and cognitive style is a normal part of human diversity."},{t:"Accommodation",d:"An environmental or procedural adjustment that removes barriers and supports participation."},{t:"Masking",d:"Concealing natural social responses to appear more neurotypical, often at a cost to wellbeing."}],figure:{d:"development",title:"Different profiles, different support needs",caption:"Neurological profiles vary in strengths, sensory processing and communication. Accessible designs can remove barriers and improve participation without demanding uniformity.",variant:"neurodiversity"},example:{t:"A quiet room at a university",p:"A student with sensory sensitivity struggles in a loud cafeteria. A low-stimulation space and written instructions improve participation. The student has not changed their identity; the environment has become more accessible."},practice:["Rewrite a sentence about autism using respectful agency-focused language.","Identify two environmental accommodations that could help a neurodivergent colleague."],myth:{claim:"Neurodiversity means neurodevelopmental conditions never need support.",fix:"Neurodiversity explains variation and challenges stigma; it does not deny the need for accommodations, health care or support. Respecting difference and providing support are complementary."},safety:"Seek urgent care for new neurological symptoms, severe distress or self-harm risk. Never use aversive or restraint-based interventions without stringent safeguards and professional oversight.",takeaways:["Neurodiversity is a framework for understanding variation, not a diagnosis.","Real support needs and human dignity can exist together.","Accessible environments improve outcomes without demanding conformity."],check:{q:"What does an accommodation aim to do?",options:["Cure a neurodevelopmental difference","Remove environmental barriers so a person can participate","Hide disability from others","Replace all medical care"],a:1,why:"Accommodations adjust environments and processes to reduce barriers and support participation. They do not aim to cure identity, conceal disability or replace needed health care."},refs:["who-dementia","ninds-brain-basics","nhlbi-sleep"],related:[8,62,67,76],books:[13,15]},{id:67,part:8,title:"Brain Injury, Rehabilitation and Functional Adaptation",kicker:"Recovery is a process, not a promise",readMins:9,lead:"Brain injury ranges from mild concussion to severe trauma, stroke and acquired injury. Recovery depends on the injury, the person, and access to timely care, rehabilitation and a supportive environment.",objectives:["Describe concussion and moderate-to-severe acquired brain injury.","Explain the goals and limits of rehabilitation.","Recognise safety red flags and support return to activity."],sections:[{h:"Injury and early care",p:["Concussion is a clinical diagnosis following a head injury or forceful movement, with symptoms such as headache, dizziness, confusion, nausea, sensitivity to light or feeling slowed. Most people improve within weeks, but recovery varies. Rest is no longer understood as prolonged, complete inactivity; a tailored return to daily activity after a brief period is commonly recommended.","Moderate-to-severe injury may involve bleeding, swelling, diffuse axonal injury and long-term effects on mobility, cognition, communication, emotion and independence. Urgent concerns include repeated vomiting, worsening headache, seizures, unequal pupils, weakness, confusion or loss of consciousness."]},{h:"Rehabilitation and participation",p:["Rehabilitation is goal-directed and multidisciplinary: physiotherapy, occupational therapy, speech-language therapy, cognitive support, mental health care and family involvement. Progress may involve restitution of function and compensation through strategies or equipment. Both are legitimate.","Outcomes and services vary widely by country and income. Disability is shaped by environment and access. Avoid unproven 'brain repair' products, and follow local return-to-sport or return-to-work protocols."]}],terms:[{t:"Concussion",d:"A clinical diagnosis of mild traumatic brain injury involving functional disturbance rather than necessarily visible structural damage."},{t:"Acquired brain injury",d:"Brain injury that occurs after birth and is not congenital or degenerative."},{t:"Compensatory strategy",d:"A practical method that supports function when full restoration is not possible."}],figure:{d:"safety",title:"Head injury red flags and recovery support",caption:"Most concussions recover with individual guidance, but severe or worsening signs require emergency care. Rehabilitation and accessible environments support participation.",variant:"concussion"},example:{t:"Returning to study after concussion",p:"A student with persistent headache and difficulty concentrating may need short blocks of work, rest breaks, written resources and staged return. Symptoms should not be pushed through to the point of severe worsening. A clinician can guide a gradual plan."},practice:["List three urgent red flags after a head injury.","Explain why both restitution and compensation are valid rehabilitation goals."],myth:{claim:"You must stay in a dark room for weeks after a concussion.",fix:"Prolonged complete rest is not generally recommended. A brief period of relative rest followed by gradual, individually tailored activity is commonly advised, with professional guidance for persistent symptoms."},safety:"Call emergency services for loss of consciousness, repeated vomiting, worsening headache, seizures, unequal pupils, one-sided weakness, severe drowsiness or fluid from the ears or nose after injury.",takeaways:["Brain injury has varied severity, symptoms and recovery trajectories.","Rehabilitation combines restoration, compensation and participation.","Prompt red-flag recognition and individualised return to activity reduce harm."],check:{q:"Which is a red flag after head injury?",options:["Mild tiredness after a long day","One pupil becoming larger with confusion and repeated vomiting","A slight headache that improves with rest","Feeling relieved after a follow-up appointment"],a:1,why:"A pupil difference with confusion and repeated vomiting suggests raised intracranial pressure or serious injury and needs emergency care. Mild symptoms still deserve monitoring, but do not match this pattern."},refs:["cdc-concussion","cdc-headsup","nice-neuro-rehab","ninds-brain-basics"],related:[17,56,69,71],books:[15,24]},{id:68,part:8,title:"Supporting Neurological Health in Daily Life",kicker:"Foundations, not a miracle routine",readMins:9,lead:"There is no single routine that guarantees a healthy brain. The strongest foundations are familiar, accessible and cumulative: sleep, movement, nutrition, safety, social connection and appropriate health care.",objectives:["Identify the strongest everyday foundations for neurological health.","Apply realistic, accessible habits rather than perfectionist optimisation.","Know when to seek professional care and avoid unsupported products."],sections:[{h:"The foundations",p:["Aim for regular sleep and wake times, safe daily movement, varied food, smoking avoidance, awareness of alcohol risk, hearing protection, social connection and management of blood pressure and diabetes. These actions support the brain by supporting the cardiovascular, metabolic and immune systems on which it depends.","Mental engagement, purpose and stress support matter too. There is no requirement to buy an expensive programme. Free activities such as walking, talking, cooking, gardening, reading, making music and volunteering can be meaningful, if accessible."]},{h:"Avoiding the traps",p:["Brain-health marketing relies on fear and oversimplification. Before buying a supplement or device, ask what outcome it has been shown to produce, in whom and compared with what. Be especially cautious with products claiming to repair nerves, 'detox' the brain or prevent dementia in everyone.","Health is not a personal moral score. Neurological conditions can occur despite excellent habits. A sustainable plan should include regular health checks, mental health support and a trusted route to emergency care, adapted to the local system and the person's circumstances."]}],terms:[{t:"Modifiable risk factor",d:"A characteristic or exposure that can be changed and is associated with a health outcome."},{t:"Health equity",d:"Fair access to conditions and care needed for health, acknowledging different needs and barriers."},{t:"Optimisation",d:"Aiming for marginal improvements; in health marketing, often overpromised and under-evidenced."}],figure:{d:"homeostasis",title:"Cumulative supports for neurological health",caption:"Sleep, movement, nutrition, safety, social connection and clinical care interact. Small, consistent actions can support health without promising a particular disease outcome.",variant:"daily"},example:{t:"A neighbourhood walk with a friend",p:"This single activity combines movement, daylight, social connection and stress recovery. It is not a cure for any disease, but it is an accessible foundation that can be repeated. Practical habits often matter more than elaborate protocols."},practice:["Choose one foundation to support this week and define a measurable first step.","Write a short refusal script for an unproven health product."],myth:{claim:"Good habits mean you will never develop a neurological disease.",fix:"Healthy choices can reduce some risks, but many neurological conditions are not preventable and are not caused by personal failure. Compassion is part of good health care."},safety:"Do not delay assessment of new neurological symptoms while trying lifestyle measures. Supplements and extreme routines can cause harm; please inform your clinician about what you use.",takeaways:["Neurological health rests on broad, accessible daily foundations.","No supplement guarantees protection from disease.","Sustainable habits and timely care are more valuable than optimisation."],check:{q:"Which combination best represents established neurological health foundations?",options:["One expensive supplement and a detox","Sleep, movement, varied nutrition, safety, social connection and risk-factor management","Avoiding all medical care to train immunity","Continuous high-stress productivity"],a:1,why:"The most established foundations are behavioural and clinical risk reduction across multiple systems. Detox products and unproven supplements are not substitutes for these foundations."},refs:["who-dementia","who-activity","nhlbi-sleep","ninds-brain-basics","who-alcohol"],related:[41,47,65,79,80],books:[10,12,13,14,15]}],sg=[{id:69,part:9,title:"Understanding Neurological Examinations",kicker:"Evidence from conversation and touch",readMins:9,lead:"A neurological examination samples different levels of the nervous system through observation and simple tests. It helps localise a problem, choose investigations and establish a baseline.",objectives:["Describe the main components of a neurological examination.","Explain the purpose of a focused examination after stroke-like symptoms.","Prepare for an appointment with useful non-sensitive questions."],sections:[{h:"What the examination covers",p:["History is usually the most informative part: what changed, when, how quickly, and what else is involved. Examination may include mental status, cranial nerves, pupil and eye movements, strength and tone, sensation, reflexes, coordination, gait and balance. The order is adapted to the person's presentation.","Reflexes test specific sensory-motor loops but are influenced by relaxation, technique and anxiety. Sensation is tested with light touch, pinprick, temperature and vibration depending on context. A clinician interprets findings in combination; one absent reflex or strange sensation is not a diagnosis."]},{h:"Rights and limitations",p:["Examination may involve undressing or sensitive areas if clinically necessary. You can ask why, request a chaperone, seek a same-gender clinician where possible and decline without losing appropriate care. In emergencies, immediate life-saving assessment may take priority.","A physical examination cannot answer every question. It may be normal in headache, early neuropathy or some seizures. It is one type of evidence, not a test of honesty or mental strength."]}],terms:[{t:"Cranial nerve examination",d:"Assessment of vision, pupils, eye movements, hearing, facial strength and other cranial nerve functions."},{t:"Reflex",d:"A rapid, stereotyped neural response to a specific stimulus."},{t:"Localisation",d:"Using clinical findings to infer which part of the nervous system is involved."}],figure:{d:"imaging",title:"Mapping the neurological examination to the nervous system",caption:"Cranial nerve, motor, sensory, reflex and coordination tests sample different pathways. Findings are integrated with the history rather than interpreted in isolation.",variant:"exam",labels:["Cranial nerves","Motor","Sensory","Reflexes","Coordination"]},example:{t:"The first minutes after stroke-like symptoms",p:"A clinician observes speech and facial symmetry, checks arm and leg power, and may examine vision and eye movements. These quick observations guide urgent imaging and treatment decisions. They are not the same as a routine screening."},practice:["List three questions you can ask before a sensitive examination.","Explain why a normal examination cannot rule out every neurological condition."],myth:{claim:"A neurological examination is a test of personality or strength.",fix:"It samples function to localise a medical problem. Poor performance can be due to pain, fatigue, medication, access needs or illness, not a lack of effort."},safety:"New weakness, speech difficulty, facial droop, sudden severe headache, confusion or loss of consciousness is an emergency. Do not wait for an outpatient examination.",takeaways:["The history and examination are complementary and context-dependent.","Different sections of the examination sample different pathways.","Consent, dignity and a clear explanation are part of good neurological care."],check:{q:"Which part of the neurological assessment usually provides the most important diagnostic clues?",options:["A randomly selected blood test","The clinical history and pattern of symptoms","A commercial brain-training score","The person's hair colour"],a:1,why:"History and symptom evolution are central to neurological diagnosis and guide the examination and tests. No single blood test or commercial score replaces that clinical reasoning."},refs:["ninds-tests","nice-ng127","openstax-ap"],related:[1,16,70,71]},{id:70,part:9,title:"EEG and Electrical Brain Activity",kicker:"Listening to networks from the scalp",readMins:8,lead:"Electroencephalography (EEG) records summed electrical activity at the scalp. It is essential in epilepsy evaluation and useful in sleep, encephalopathy and other states, but it does not read minds or diagnose every cognitive difference.",objectives:["Explain the basic principles and preparation for EEG.","Describe common activation techniques and limitations.","Understand why EEG results require clinical interpretation."],sections:[{h:"Recording electrical rhythms",p:["Electrodes attached to the scalp detect voltage changes from populations of neurons. A recording compares signals across channels to identify rhythms, asymmetries and abnormal discharges. The procedure is painless; preparation includes clean hair, avoiding some hair products and following instructions about sleep and medication.","Provocation methods such as sleep deprivation or photic stimulation may be used in selected cases. Medication should never be stopped without a clinician's instruction, as abrupt withdrawal can trigger seizures. Ambulatory or video telemetry extends recording over hours or days."]},{h:"Limits and safety",p:["EEG is sensitive but not perfectly specific. Abnormal-looking activity can occur without epilepsy, and routine studies can be normal between seizures. Results must be combined with what happened and when. EEG cannot detect all epileptogenic lesions and is not a screening test for intelligence or personality.","EEG is generally low-risk. Skin irritation can occur, and provoking a seizure carries a small risk of injury or prolonged seizure, which is why studies are supervised."]}],terms:[{t:"EEG",d:"Electroencephalography, a non-invasive recording of summed electrical activity at the scalp."},{t:"Epileptiform discharge",d:"An EEG pattern associated with abnormal neuronal activity; not a diagnosis on its own."},{t:"Photic stimulation",d:"Brief flashing light used to provoke EEG activity in selected assessments."}],figure:{d:"potential",title:"EEG channels and rhythms",caption:"Electrodes at standard scalp positions record differences in electrical potential over time. A clinician interprets rhythms, discharges and context; a single trace is not a diagnosis.",variant:"eeg-setup"},example:{t:"A normal EEG before a first seizure",p:"A person has a first seizure and an EEG that day looks normal. This does not necessarily mean nothing happened. A seizure may have been caused by a temporary problem, and the EEG may be normal between events. Follow-up is planned."},practice:["Describe three ways to prepare for an EEG.","Explain why stopping epilepsy medication before an EEG can be risky."],myth:{claim:"EEG can reveal whether a person is lying or can read their thoughts.",fix:"EEG records broad electrical rhythms, not the content of thought. Claims about lie detection or mind reading go beyond validated science."},safety:"Do not stop prescribed anti-seizure medication for a test unless specifically instructed by the clinical team. Seek emergency care for a prolonged or repeated seizure.",takeaways:["EEG detects summed electrical rhythms through the scalp.","It is an important but imperfect piece of epilepsy evaluation.","The clinical team, not the raw trace alone, interprets the result."],check:{q:"What does a routine EEG directly record?",options:["Individual thoughts","Summed electrical activity from populations of neurons at the scalp","Brain blood flow only","The exact concentration of neurotransmitters"],a:1,why:"Scalp EEG detects summed electrical potentials. It has limited spatial resolution, does not decode thoughts and is not a direct measure of blood flow or neurotransmitter concentration."},refs:["ninds-tests","nice-ng217","who-epilepsy"],related:[50,64,69,71]},{id:71,part:9,title:"MRI, CT and Other Neuroimaging Techniques",kicker:"Seeing structure and activity",readMins:9,lead:"CT and MRI create images of brain and spinal structures using different physical principles. Functional imaging adds indirect information about blood flow or metabolism. Each technology has specific strengths, risks and limitations.",objectives:["Compare CT and MRI in principle and typical use.","Describe contrast media, safety screening and incidental findings.","Explain why an imaging result must be interpreted with the clinical picture."],sections:[{h:"CT and MRI",p:["CT uses X-ray beams and is fast and widely available, often used in acute haemorrhage, trauma and some emergency situations. It involves ionising radiation. MRI uses strong magnetic fields and radiofrequency signals without ionising radiation; it offers high soft-tissue detail and can show white-matter lesions, tumours and structural change.","MRI scans are noisy, require stillness and may be difficult for people with claustrophobia, severe pain or implants. Safety screening for metal, pacemakers and devices is essential. Contrast agents can affect kidney function or cause allergic reactions; no contrast is risk-free."]},{h:"Function and interpretation",p:["Functional MRI measures signal changes related to blood oxygenation, not neuronal firing directly. It is powerful for research and selected clinical questions but does not diagnose complex behaviour or prove a subjective experience. PET and SPECT provide metabolic or blood-flow information and involve different tracers and radiation exposures.","Scan findings must be interpreted alongside the history and examination. Incidental findings are common and may cause anxiety while never affecting health. Seek technical results through a clinician who can explain their meaning and limitations."]}],terms:[{t:"CT scan",d:"A computed tomography scan using multiple X-ray images to reconstruct cross-sectional anatomy."},{t:"MRI",d:"Magnetic resonance imaging, using magnetic fields and radio waves to produce detailed tissue images."},{t:"Incidental finding",d:"A finding noticed during a scan that was not the reason for the examination."}],figure:{d:"imaging",title:"CT versus MRI",caption:"CT is fast and useful for acute bleeding; MRI offers detailed soft-tissue contrast without ionising radiation but is slower and requires safety screening. Neither determines a person's potential.",variant:"ct-mri",labels:["CT","MRI","Bone","Soft tissue","Safety screen"]},example:{t:"A scan for a headache",p:"A clinician may not order imaging for a stable typical migraine, but will order it urgently for a sudden severe headache, neurological deficits or other red flags. Imaging is chosen to answer a specific question and avoid unnecessary radiation or anxiety."},practice:["Give one advantage of CT and one of MRI.","List three items you must disclose before an MRI."],myth:{claim:"A clear brain scan means there is no neurological problem.",fix:"Many conditions, including migraine, epilepsy and some neuropathies, can have normal structural imaging. Function and history matter alongside structure."},safety:"Tell the imaging team about implants, metal fragments, pregnancy, kidney disease, allergies and claustrophobia. Seek care for new neurological symptoms rather than relying on a previous scan.",takeaways:["CT and MRI differ in physics, speed, availability, risk and detail.","Functional imaging is indirect and requires cautious interpretation.","Scan results should be explained in clinical context."],check:{q:"Which technique uses ionising radiation and is often used for rapid emergency brain imaging?",options:["MRI","CT","Ultrasound through the skull","EEG"],a:1,why:"CT uses X-rays, is fast and is often used in acute trauma or haemorrhage. MRI does not use ionising radiation, and EEG records electrical activity rather than producing structural images."},refs:["ninds-tests","nice-ng128","ninds-brain-basics"],related:[9,51,69,72]},{id:72,part:9,title:"Nerve Conduction Studies and Electromyography",kicker:"Testing nerves and muscles",readMins:8,lead:"Nerve conduction studies and electromyography (EMG) test the peripheral nervous system and muscle. They can localise or characterise nerve damage that is difficult to identify from examination alone.",objectives:["Explain what nerve conduction studies and EMG measure.","Describe the experience, preparation and limits of testing.","Understand why results must be interpreted by a clinician."],sections:[{h:"How testing works",p:["Nerve conduction studies deliver small electrical impulses to a nerve and record the resulting response from a muscle or sensory nerve. Speed, amplitude and timing help distinguish myelin damage from axonal loss and can localise compression.","EMG records electrical activity from muscle fibres with a fine needle. It helps assess whether weakness comes from nerve, neuromuscular junction or muscle disease. Both are commonly performed together and interpreted with the clinical picture."]},{h:"What to expect",p:["Nerve conduction tests involve brief electrical sensations and muscle twitching; EMG needles may cause discomfort and bruising. The exact experience varies. Tell the team about implanted devices, blood thinners, skin infection or inability to tolerate the procedure.","Results can be normal in small-fibre neuropathy or central disease, and abnormal findings can occur in people without symptoms. They are not a score of pain severity or moral fortitude. No one should interpret a report as a personal diagnosis without clinical discussion."]}],terms:[{t:"Nerve conduction study",d:"A test measuring how electrical signals travel along a peripheral nerve."},{t:"EMG",d:"Electromyography, the recording of electrical activity in muscle, often with a needle electrode."},{t:"Axonal loss",d:"Damage or loss of nerve fibres, reflected in reduced response amplitudes."}],figure:{d:"imaging",title:"Nerve conduction and EMG principles",caption:"Stimulating and recording electrodes assess conduction along a nerve. Needle EMG samples muscle fibre activity at rest and during contraction. Together they help distinguish peripheral patterns.",variant:"ncs-emg"},example:{t:"Numb fingers and a normal scan",p:"A person with numb fingers may have a normal brain scan and still have an entrapped peripheral nerve. Nerve conduction testing can localise compression at the wrist that imaging of the brain would never show. Clinical context determines which test is relevant."},practice:["Explain the difference between a nerve conduction study and EMG.","Name one reason a nerve conduction study can be normal despite symptoms."],myth:{claim:"EMG can diagnose all types of neuropathy and pain.",fix:"EMG and nerve conduction studies assess larger nerve fibres and muscle. Small-fibre neuropathies and central pain conditions may require different tests or a clinical diagnosis."},safety:"Tell the team if you have a pacemaker, implanted electrical device, bleeding risk or skin infection. Seek clinical review of any report rather than changing treatment based on raw results.",takeaways:["NCS and EMG assess peripheral nerve and muscle physiology.","They are supportive tests interpreted with clinical findings.","Normal results do not exclude all nerve or pain conditions."],check:{q:"What is needle EMG mainly used to assess?",options:["Electrical activity in muscle and the nerves supplying it","Vision and the retina","Cerebrospinal fluid pressure","Blood glucose control"],a:0,why:"EMG records muscle electrical activity and can help distinguish nerve, neuromuscular junction and muscle disorders. Retinal, CSF and glucose testing use other methods."},refs:["ninds-tests","ninds-neuropathy","purves-neuroscience"],related:[18,55,57,69]},{id:73,part:9,title:"Blood Tests, Cerebrospinal Fluid and Other Investigations",kicker:"Fluids can reveal what imaging cannot",readMins:8,lead:"Blood tests and cerebrospinal fluid analysis help identify metabolic, inflammatory, infectious and immune causes of neurological symptoms. They are usually targeted rather than universal.",objectives:["Identify common blood tests used in neurological assessment.","Explain the purpose and risks of lumbar puncture.","Distinguish evidence-based testing from internet-based health screening."],sections:[{h:"Blood and other routine tests",p:["Tests may include blood counts, glucose, electrolytes, kidney and liver function, thyroid, vitamin B12 and folate, inflammatory markers, infection screening and autoimmune antibodies. The right panel depends on the presentation. Blood tests are interpreted using reference ranges that vary by laboratory and population.","Routine testing cannot diagnose every condition. Some neurological conditions have normal blood tests. Random test panels bought online often produce uncertain results, false positives and anxiety, and do not replace a clinical assessment."]},{h:"Cerebrospinal fluid",p:["Cerebrospinal fluid circulates around the brain and spinal cord and can reflect infection, inflammation, bleeding or tumour markers. It is collected by lumbar puncture, usually under local anaesthetic. The procedure is performed only when the likely benefit justifies the small risk.","Headache, back discomfort and bruising can follow. Serious complications are uncommon but include bleeding, infection and, rarely, brain herniation when pressure is raised. Imaging or fundoscopy may be performed first. A person should be told what is being tested, why and how results will be communicated."]}],terms:[{t:"Lumbar puncture",d:"Collection of cerebrospinal fluid with a needle, usually in the lower back."},{t:"Cerebrospinal fluid",d:"A clear fluid that cushions the brain and spinal cord and circulates through the ventricles."},{t:"Reference range",d:"The range of values typically seen in a defined healthy reference population."}],figure:{d:"imaging",title:"Cerebrospinal fluid and targeted testing",caption:"CSF is produced in the ventricles and circulates around the brain and spinal cord. Lumbar puncture samples this fluid to investigate infection or inflammation when clinically indicated.",variant:"csf"},example:{t:"Fever and confusion in hospital",p:"A patient with fever and confusion may need blood tests, imaging and, if safe, a lumbar puncture to identify meningitis or encephalitis. The clinical team balances speed and risk. Results are interpreted together, not from one number."},practice:["Name three blood tests a clinician might use in neurological assessment.","Explain why a lumbar puncture is not performed without careful assessment."],myth:{claim:"A comprehensive online blood panel can diagnose the cause of fatigue or brain fog.",fix:"Fatigue and cognitive symptoms have many causes. Broad self-ordered panels often produce noise and unnecessary worry. A clinician can choose targeted tests based on history and examination."},safety:"Seek urgent care for meningitis symptoms, severe headache after lumbar puncture, new weakness or bleeding. Do not interpret your own CSF or blood results without clinical advice.",takeaways:["Blood tests are targeted to the clinical question.","CSF testing can identify infection and inflammation but requires careful selection.","Laboratory reports require clinical interpretation and follow-up."],check:{q:"What is the main reason clinicians target tests rather than ordering everything?",options:["All tests are dangerous for everyone","Untargeted testing can produce misleading results, unnecessary anxiety and cost without answering the clinical question","Blood tests cannot measure anything useful","Only imaging is ever useful"],a:1,why:"Targeted testing improves usefulness and reduces false positives, cost and harm. Tests still provide valuable information when selected for a specific clinical question."},refs:["ninds-tests","nhs-meningitis","ods-b12","ninds-ms"],related:[43,59,71,74]},{id:74,part:9,title:"Genetic Testing and Neurological Risk Assessment",kicker:"Information with responsibilities",readMins:9,lead:"Genetics can clarify some neurological conditions and risk, but not all risk is inherited and not all variants cause disease. Testing must be explained, consented and supported by clinical interpretation and privacy protections.",objectives:["Describe the purposes of diagnostic, carrier and predictive genetic testing.","Explain variants of uncertain significance and the limits of direct-to-consumer tests.","Identify confidentiality and insurance considerations."],sections:[{h:"Different tests, different questions",p:["Diagnostic testing may identify a genetic cause when a condition is already suspected. Carrier testing asks whether someone may pass a variant to children. Predictive testing estimates risk in a person without symptoms, usually only after counselling. Pharmacogenomic testing can inform some medicine choices.","A genetic variant is a DNA difference; many are harmless. 'Variants of uncertain significance' mean the evidence is insufficient, not that disease is certain. Penetrance, age of onset and environmental factors matter. Genetic testing cannot predict a person's entire future or worth."]},{h:"Consent, privacy and access",p:["Results can affect family members, insurance, employment and decisions about children. Legal protections and rules differ by country; ask your clinician or genetic counsellor about jurisdiction-specific safeguards. Direct-to-consumer tests may not be clinically validated and can produce different interpretations.","Do not alter medication, screening or family planning based on an uninterpreted genetic report. A specialist in genetics or a counselling service can review the result and explain uncertainty without coercion. The goal is informed choice, not fear."]}],terms:[{t:"Genetic variant",d:"A difference in DNA sequence from a reference; not all variants cause disease."},{t:"Penetrance",d:"The probability that carrying a disease-associated variant leads to signs of the condition."},{t:"Genetic counselling",d:"Specialist support to understand genetic information, options and implications."}],figure:{d:"imaging",title:"From a genetic variant to clinical meaning",caption:"Testing may identify a variant, but clinical interpretation requires gene knowledge, inheritance pattern, family context and evidence. Direct-to-consumer reports are a starting point at most.",variant:"genetics"},example:{t:"A family history of a neurological condition",p:"A man whose parent had a genetic condition asks whether he should be tested. A genetic counsellor explores the suspected condition, inheritance, test limitations, family implications and insurance rules before any decision."},practice:["Explain the difference between a genetic variant and a disease.","Write two questions to ask before a direct-to-consumer genetic test."],myth:{claim:"A genetic test can tell you exactly whether you will develop every neurological disease.",fix:"Most neurological conditions involve multiple genes and environmental factors. Testing may clarify specific risks but cannot predict all outcomes or guarantee health."},safety:"Discuss genetic results with a qualified professional before changing care. Seek urgent clinical care for new neurological symptoms regardless of genetic risk.",takeaways:["Genetic testing serves different purposes and requires context.","Uncertain results are common and do not equal disease.","Counselling and jurisdiction-specific privacy advice matter."],check:{q:"What does a variant of uncertain significance mean?",options:["The person definitely has a disease","The variant's effect is not yet clear enough to use as a diagnosis","The test failed and has no information","The person is immune to all genetic disease"],a:1,why:"A variant of uncertain significance has insufficient evidence to classify it as disease-causing or benign. It requires specialist interpretation and should not be treated as a diagnosis."},refs:["ninds-tests","ninds-als","ninds-ms","wfn"],related:[53,57,75,76]},{id:75,part:9,title:"Neurological Medicines and Treatment Education",kicker:"Benefits, risks and careful monitoring",readMins:9,lead:"Neurological medicines can reduce seizures, pain, tremor, relapses or symptoms, but effects and risks vary between people. Good treatment education supports informed decisions rather than blind adherence or fear.",objectives:["Explain basic principles of medicine use in neurological care.","Identify common safety and interaction considerations.","Prepare questions for a medication review without giving prescribing advice."],sections:[{h:"How medicines are used",p:["Many neurological medicines act on synapses, ion channels, neurotransmitter systems or the immune system. They must reach the brain or target tissue, which depends on absorption, metabolism, protein binding and the blood-brain barrier. Medicines are started, adjusted and sometimes stopped according to a plan and monitoring.","The same drug can have different effects depending on the condition, dose, genetics, kidney and liver function, other medicines and age. Generic and brand products contain the same active ingredient in regulated systems, but different formulations or local standards can matter."]},{h:"Safety and shared decisions",p:["Common issues include drowsiness, dizziness, nausea, interactions with alcohol or other drugs, and withdrawal effects if medication is stopped abruptly. Some neurological medicines need regular blood tests or gradual tapering. Pregnancy and fertility considerations should be discussed before changes.","Ask your clinician or pharmacist what the medicine is for, what benefit is expected, how long it takes, what side effects matter most, which interactions to avoid and when to seek help. Report suspected side effects through local pharmacovigilance systems. Do not buy unregulated neurological 'cures' online."]}],terms:[{t:"Pharmacokinetics",d:"What the body does to a medicine, including absorption, distribution, metabolism and elimination."},{t:"Taper",d:"A planned gradual reduction in dose to avoid withdrawal or worsen the condition."},{t:"Pharmacovigilance",d:"The surveillance of medicine safety and reporting of adverse effects."}],figure:{d:"imaging",title:"Medicines, monitoring and shared decisions",caption:"Benefits and risks are balanced with the person's goals. Dose, interactions and monitoring depend on the medicine, the condition and individual physiology.",variant:"medicines"},example:{t:"Dizziness after a new prescription",p:"An older adult feels dizzy after starting a new medicine. A pharmacist reviews timing, dose and other medications. The goal is not to assign blame but to find a safe plan. Stopping abruptly could be harmful, so adjustments are made with the prescriber."},practice:["List five questions to ask about a new neurological medicine.","Explain why a medicine works differently in different people."],myth:{claim:"You should stop a neurological medicine immediately if you feel better.",fix:"Many medicines need to be continued or reduced gradually. Stopping abruptly can cause withdrawal, relapse or a seizure. Changes should be discussed with the prescriber."},safety:"Seek urgent help for severe allergic reactions, sudden confusion, suicidal thoughts, breathing difficulty, severe rash, a new seizure or loss of consciousness after taking a medicine.",takeaways:["Medicine effects depend on the person, condition and context.","Tapering, monitoring and interaction review prevent avoidable harm.","Shared decisions and clear questions improve safer medicine use."],check:{q:"Why may stopping a neurological medicine abruptly be dangerous?",options:["All medicines are addictive","It can cause withdrawal, relapse or seizures depending on the medicine","Medicines are never effective","It makes generic medicines brand-name products"],a:1,why:"Abrupt withdrawal can destabilise the condition or cause specific withdrawal syndromes. Some medicines can be taken long term without addiction, and stopping is still a clinical decision requiring advice."},refs:["ninds-tests","nice-ng217","nice-ng71","ninds-epilepsy"],related:[48,69,74,76]},{id:76,part:9,title:"Rehabilitation, Assistive Technology and Multidisciplinary Care",kicker:"Function, participation and choice",readMins:9,lead:"Rehabilitation supports people to regain function, adapt to change and participate in the activities that matter to them. It is a collaboration among the person, families, therapists, clinicians and communities.",objectives:["Describe the roles of physiotherapy, occupational therapy and speech-language therapy.","Explain how assistive technology and accessibility support participation.","Apply person-centred and resource-aware planning."],sections:[{h:"The multidisciplinary team",p:["Physiotherapists address movement, strength, balance and mobility. Occupational therapists focus on daily activity, cognition, equipment and environmental modification. Speech-language therapists support communication and swallowing. Nurses, psychologists, social workers, dietitians and doctors contribute other expertise.","Rehabilitation goals should be meaningful to the person, not only measurable to the system. Recovery and compensation both count. Family members may need education and support; unpaid carers often carry substantial practical and emotional loads."]},{h:"Technology and access",p:["Assistive products include walking aids, wheelchairs, seating, communication devices, screen readers, memory prompts and smart-home controls. A successful device is not just the most advanced one; it must fit the person's body, environment, maintenance capacity and budget, and training must be available.","Access to rehabilitation and equipment is unequal across and within countries. Low-cost solutions and community-based rehabilitation can be valuable. Do not assume that a device is a failure of effort; assistance is a tool for participation."]}],terms:[{t:"Occupational therapy",d:"Support to improve participation in daily activities through adaptation, skills and equipment."},{t:"Assistive technology",d:"Products or systems that support function and participation, from mobility aids to communication devices."},{t:"AAC",d:"Augmentative and alternative communication, including symbols, speech devices and other methods."}],figure:{d:"homeostasis",title:"A person-centred rehabilitation network",caption:"The person is at the centre of decisions. Therapists, clinicians, family and accessible environments each contribute to activity and participation, not just impairment reduction.",variant:"rehab"},example:{t:"Getting back to cooking",p:"After a stroke, an occupational therapist observes the kitchen, suggests seating and equipment, and practises safe steps. Physiotherapy addresses balance and strength; speech therapy may address swallowing. The outcome is meaningful activity, not a generic exercise score."},practice:["List three professional roles that might support a person after stroke.","Choose one assistive product and describe what it enables rather than what it replaces."],myth:{claim:"Assistive technology makes people dependent.",fix:"Assistive tools can reduce dependence, prevent injury and enable participation. Independence is about choice and access, not doing everything without support."},safety:"Equipment should be fitted and maintained properly. New weakness, falls, swallowing difficulty or breathing symptoms during rehabilitation need clinical review, and family carers need practical support.",takeaways:["Rehabilitation is function-focused and person-centred.","Different therapies address movement, daily activity, communication and participation.","Accessible technology and environments are part of good neurological care."],check:{q:"Which professional most directly supports communication and swallowing after a neurological event?",options:["Speech-language therapist","Radiographer","Pharmacist","Podiatrist"],a:0,why:"Speech-language therapists assess and support communication and swallowing. Radiographers perform imaging, pharmacists manage medicines and podiatrists address foot health."},refs:["nice-neuro-rehab","ninds-sci","nice-ng71","wfn"],related:[50,56,57,69,80],books:[14,15,24]}],rg=[{id:77,part:10,title:"Protecting the Brain and Nervous System From Injury",kicker:"Prevention is often practical",readMins:9,lead:"Many neurological injuries are preventable or can be made less severe. Road safety, fall prevention, helmet use, workplace protection and careful medication review matter more than most commercial brain supplements.",objectives:["Identify common mechanisms of brain and spinal injury.","Apply practical prevention across different settings and incomes.","Explain why reporting symptoms after head injury matters."],sections:[{h:"Road, work and sport",p:["Seat belts, child restraints, helmets, safe speeds, road design and avoiding driving while intoxicated or drowsy prevent traumatic brain and spinal injury. Workplace protection, safe ladder use and attention to falls in older people reduce injury rates. In sport, clear removal-from-play rules and graduated return matter more than 'toughness'.","No helmet prevents every injury. After a head impact, worsening headache, vomiting, drowsiness, unequal pupils, seizures, weakness or confusion require urgent care. A person should not return to contact sport while concussed, even if they feel pressure to play."]},{h:"Homes, medicines and vascular health",p:["Improving lighting, removing trip hazards, reviewing sedating medicines and addressing vision and balance problems reduce falls. Secure firearms and hazardous chemicals, supervise children around water and traffic, and use safe sleep and car practices.","Managing blood pressure, avoiding smoking, limiting excess alcohol and treating diabetes reduce stroke risk. People with epilepsy, cognitive impairment or movement disorders may need individual safety planning. Protective equipment and adaptation are not signs of weakness."]}],terms:[{t:"Primary prevention",d:"Reducing the chance an injury or disease occurs."},{t:"Secondary prevention",d:"Early detection or action to limit harm after a risk is present."},{t:"Graduated return",d:"A staged increase in activity after injury, with review before each step."}],figure:{d:"safety",title:"Preventing brain and spinal injury across settings",caption:"Road safety, fall prevention, sport protocols and medication review target different mechanisms. Community design and access to care determine how well prevention works.",variant:"prevention"},example:{t:"A safer bathroom for a parent",p:"A family adds a grab rail, a non-slip mat and better lighting after a near fall. These changes are less dramatic than a supplement advertisement and far more likely to reduce injury risk."},practice:["Identify one fall hazard in a familiar home and one way to reduce it.","Write three concussion red flags for a sports coach."],myth:{claim:"You can 'shake off' a head injury and keep playing.",fix:"Continuing to play after a suspected concussion increases risk. Remove the person from play, assess and return gradually under appropriate guidance."},safety:"After a head injury, seek emergency help for loss of consciousness, repeated vomiting, worsening headache, seizures, unequal pupils, weakness or increasing drowsiness. Do not leave a person with concerning signs alone.",takeaways:["Road, sport, workplace and home safety prevent significant neurological injury.","Concussion protocols and graduated return protect recovery.","Fall prevention and vascular risk management are neurological prevention."],check:{q:"Which action is appropriate for a suspected concussion in sport?",options:["Keep playing if the person wants to","Remove the person from play and arrange appropriate assessment","Give strong painkillers and return immediately","Use a supplement to prevent brain swelling"],a:1,why:"A suspected concussion requires removal from play and assessment, with a graduated return guided by protocol. Continuing play, masking symptoms or using unproven products can increase risk."},refs:["cdc-concussion","cdc-headsup","who-stroke","who-activity"],related:[30,67,78,79],books:[14,18,24]},{id:78,part:10,title:"Recognising Neurological Emergencies",kicker:"Act quickly, do no harm",readMins:9,lead:"Some neurological symptoms are reversible only if treated quickly. Knowing the red flags, calling local emergency services and avoiding harmful first-aid myths can make a major difference.",objectives:["Recognise stroke, seizure, meningitis and acute spinal red flags.","Apply safe first aid and an appropriate emergency response.","Avoid myths and unsafe remedies in neurological emergencies."],sections:[{h:"Time-critical warning signs",p:["Use FAST for stroke: Face drooping, Arm weakness, Speech difficulty, Time to call emergency services. Also act on sudden vision loss, severe unexplained headache, loss of balance or coordination, new confusion and any sudden one-sided weakness or numbness. Note the time of onset and do not drive yourself.","Meningitis warning signs include fever with severe headache, neck stiffness, confusion, sensitivity to light or a non-blanching rash. New weakness with severe back pain, saddle numbness or bladder/bowel changes may be spinal cord compression or cauda equina. Prolonged or repeated seizures, serious head injury and rapidly worsening symptoms are emergencies."]},{h:"First aid and local guidance",p:["For a seizure: protect the person from hazards, cushion the head, do not restrain or put anything in the mouth, time it, and after movements stop place them in a safe recovery position as appropriate. Call emergency services for a first seizure, a seizure over five minutes, repeated seizures without recovery, injury, breathing difficulty or pregnancy.","For stroke, do not give food, drink or aspirin before medical assessment. For head injury, do not move someone with suspected spinal injury unless they are in immediate danger. These are general educational points; local emergency numbers and guidance take priority."]}],terms:[{t:"FAST",d:"Face, Arm, Speech, Time — a stroke recognition aid prompting emergency contact."},{t:"Status epilepticus",d:"Prolonged or repeated seizures without recovery, requiring emergency treatment."},{t:"Non-blanching rash",d:"A rash that does not fade when pressed; can accompany serious infection."}],figure:{d:"safety",title:"Emergency signs and safe first aid",caption:"Stroke, seizure, meningitis, severe head injury and spinal compression have distinct warning signs. In all cases, protect the person, avoid harmful home remedies and contact local emergency services promptly.",variant:"emergency"},example:{t:"A visitor has sudden speech difficulty",p:"At a family gathering, an older relative suddenly cannot find words and one arm drifts down. The family calls emergency services and notes the first time symptoms were seen. They do not give food or wait for the symptoms to pass."},practice:["Write the FAST acronym and the action it prompts.","Recite the main seizure first-aid steps without looking."],myth:{claim:"If stroke symptoms go away quickly, no medical care is needed.",fix:"Transient symptoms can be a TIA, an emergency warning of future stroke. Urgent assessment is required even if the person feels normal again."},safety:"Call local emergency services immediately for sudden facial droop, weakness, speech difficulty, vision loss, severe headache, meningitis signs, spinal red flags, prolonged seizure or serious head injury. Do not delay and do not drive yourself.",takeaways:["Recognition and speed are central to emergency neurological care.","Safe first aid avoids harm and supports breathing and dignity.","Transient or improving symptoms still require urgent assessment."],check:{q:"What is the safest action for someone having a convulsive seizure?",options:["Hold them down and put an object in the mouth","Protect them from hazards, cushion the head and time the seizure","Force them to sit upright and drink water","Leave them alone without timing the event"],a:1,why:"Protect the head and environment, avoid restraint, never put anything in the mouth and time the seizure. Food and drink should not be given until the person is fully alert."},refs:["cdc-stroke","nhs-stroke","nice-ng128","ilae-first-aid","who-epilepsy","nhs-meningitis"],related:[49,50,51,59,77]},{id:79,part:10,title:"Evidence-Based Strategies for Lifelong Neurological Health",kicker:"Small foundations, honest limits",readMins:9,lead:"No strategy can guarantee neurological health. The most defensible approach combines what is strongly established for general health with prompt care for symptoms and honest acknowledgement of uncertainty.",objectives:["Summarise evidence-based strategies for neurological health.","Rank claims by strength of evidence and practicality.","Adapt recommendations across environments and resources."],sections:[{h:"High-value foundations",p:["Manage blood pressure and diabetes, avoid tobacco, limit excess alcohol and treat sleep problems. Stay physically active, keep socially connected, correct hearing and vision problems and eat a varied, culturally appropriate diet. Use helmets and seat belts, prevent falls and protect against neurological infection through available vaccination and safe food and water.","Vaccination, safer roads and smoke-free environments are public-health measures with large effects on neurological injury and stroke. Access to diagnosis and emergency treatment is itself a brain-health strategy. Individual actions cannot compensate for missing infrastructure."]},{h:"Low-certainty and misleading claims",p:["Commercial supplements, extreme diets, detoxes, expensive brain games and unregulated devices are not substitutes for the foundations. Some emerging approaches are genuinely promising and deserve clinical study, but interest is not proof of benefit. A claim of universal prevention is a warning sign.","Not all neurological disorders are preventable, and blame is not prevention. A good plan includes knowing local emergency numbers, having regular medication reviews, asking about recommended screening and seeking care early when something changes."]}],terms:[{t:"Primary prevention",d:"Reducing risk before disease or injury occurs."},{t:"Risk reduction",d:"Actions that lower the probability or severity of harm, without guaranteeing prevention."},{t:"Public health",d:"Population-level measures to prevent disease and improve health, such as vaccination and road safety."}],figure:{d:"compare",title:"Ranking neurological health strategies",caption:"Population measures and everyday foundations have the strongest evidence for broad benefit. Many commercial products make specific claims that outrun their evidence.",variant:"ranking"},example:{t:"Choosing where to spend effort",p:"A person considering an expensive supplement might first review blood pressure, sleep, hearing, activity and smoking. These changes are often cheaper, evidence-based and beneficial across multiple systems. A clinician can address specific risks."},practice:["Choose three high-value strategies and assess your current access to them.","Take one commercial brain-health claim and grade its evidence quality."],myth:{claim:"If a product is natural, it is automatically safe and effective for the brain.",fix:"Natural products can interact with medicines, contain variable doses and be contaminated. Safety and efficacy are established by evidence, not origin."},safety:"Do not delay diagnosis or emergency care for a lifestyle strategy. Discuss supplements and new exercise plans with a clinician if you have a chronic condition or take prescription medicines.",takeaways:["Broad foundations and public-health measures offer the strongest evidence.","Prevention is probabilistic, not a personal guarantee.","Be sceptical of universal brain-health claims and expensive shortcuts."],check:{q:"Which approach has the strongest established evidence for reducing neurological risk?",options:["A universal 'brain detox' supplement","Managing blood pressure and avoiding tobacco","A single superfood eaten every day","A commercial game that promises a younger brain"],a:1,why:"Vascular risk management and tobacco avoidance have strong evidence for reducing stroke and some cognitive outcomes. Detox products, single superfoods and commercial brain-training promises lack comparable support for broad prevention."},refs:["who-stroke","who-dementia","who-activity","nhlbi-sleep","nia-brain-aging","who-tobacco"],related:[41,46,47,68,77],books:[10,12,13,14,15,18]},{id:80,part:10,title:"Building a Personal Nervous System Learning and Wellness Plan",kicker:"Learn, prepare, thrive",readMins:10,lead:"A useful plan is specific, realistic and adjustable. It connects what you have learned about the nervous system to a few priorities, a safe response to emergencies and a route to reliable help.",objectives:["Summarise the book's key takeaways in a personal plan.","Set realistic, non-diagnostic learning and wellness goals.","Identify appropriate emergency and professional-care pathways."],sections:[{h:"Review and choose",p:["Return to the three ideas that matter most: the nervous system is integrated, plasticity is real but constrained, and evidence is essential. Choose one learning goal, one physical-health priority, one safety action and one care-access task. Write them where you can see them and set a review date.","Do not atte
