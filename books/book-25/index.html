itial segment reaches threshold, voltage-gated sodium channels open and Na⁺ enters rapidly, causing depolarisation. The signal is all-or-nothing in amplitude, but its frequency and pattern can encode information."]},{h:"Repolarisation and conduction",p:["Sodium channels inactivate while voltage-gated potassium channels open, returning the membrane toward negative values. A brief after-hyperpolarisation follows. During the absolute refractory period, another action potential cannot be generated, helping enforce direction and limit frequency.","Myelinated axons conduct faster through saltatory conduction between nodes. Larger diameter also increases speed. Damage to myelin slows or blocks conduction, which can produce weakness, sensory change or fatigue."]}],terms:[{t:"Resting membrane potential",d:"The voltage difference across a neuron's membrane when it is not actively signalling."},{t:"Depolarisation",d:"A shift of membrane potential toward a less negative or positive value."},{t:"Refractory period",d:"A short interval after an action potential when the neuron cannot fire again normally."}],figure:{d:"potential",title:"Phases of an action potential",caption:"Threshold triggers sodium entry and rapid depolarisation. Sodium channels inactivate, potassium efflux repolarises the membrane and the Na⁺/K⁺ pump restores ion gradients over time.",labels:["Threshold","Depolarisation","Repolarisation","Hyperpolarisation","Resting potential"]},example:{t:"Local anaesthetic at the dentist",p:"Local anaesthetics block voltage-gated sodium channels so that nociceptive neurons cannot generate or conduct action potentials. Pain signals may be reduced, but tissue injury is not automatically healed. Unusual numbness, weakness or spread beyond the expected area should be reported."},practice:["Draw the action potential and label threshold, peak and refractory phase.","Explain why a larger stimulus changes firing frequency rather than spike height."],myth:{claim:"Action potentials come in different sizes to encode stronger messages.",fix:"Action potentials are usually all-or-nothing in amplitude. Increasing stimulus strength or sensory intensity is encoded mainly by the number and timing of spikes and by recruitment of different cells."},takeaways:["Resting potential is maintained by ion gradients and selective permeability.","Action potentials are rapid, regenerative electrical events.","Myelin, diameter and channel distribution determine conduction speed."],check:{q:"What happens at the peak of an action potential?",options:["Sodium channels open and potassium channels close permanently","Sodium channels inactivate while potassium channels open to repolarise the membrane","The cell immediately divides","Action potentials are reversed"],a:1,why:"Peak depolarisation is followed by sodium-channel inactivation and increased potassium efflux. This repolarises the membrane. Neurons do not divide at the peak, and signals are not simply reversed."},refs:["purves-neuroscience","openstax-ap"],related:[19,20,22,23]},{id:22,part:3,title:"Neurotransmitters and Chemical Communication",kicker:"Context changes everything",readMins:10,lead:"At most synapses, a neuron releases a chemical messenger that diffuses across a narrow cleft and binds to receptors. The same neurotransmitter can have different effects depending on the receptor, the circuit and the brain region.",objectives:["Outline synthesis, release, binding and termination of neurotransmitters.","Contrast ionotropic and metabotropic receptors.","Explain why 'one transmitter, one emotion' is misleading."],sections:[{h:"Release and reception",p:["Neurotransmitters are synthesised in neurons, stored in vesicles and released when calcium enters the presynaptic terminal. They bind to receptors on the postsynaptic membrane, triggering ion channels or signalling cascades. Reuptake transporters, degradation enzymes and diffusion terminate their actions.","Ionotropic receptors open ion channels quickly; metabotropic G-protein-coupled receptors act more slowly through second messengers. Some synapses are excitatory, some inhibitory and many modulatory. Synaptic strength can change with repeated use, which is one basis of learning."]},{h:"Common transmitters and their complexity",p:["Glutamate is the main fast excitatory transmitter, GABA the main fast inhibitory transmitter and glycine is important in the spinal cord. Acetylcholine helps movement, autonomic signalling and attention. Dopamine, norepinephrine and serotonin contribute to movement, reward learning, arousal, mood and many other processes.","Drugs can alter neurotransmitter action, but that does not mean a person has a simple 'chemical imbalance'. Depression, Parkinson's disease and epilepsy involve circuits, development, genetics and environment. Medicines affect those systems without fully explaining the condition."]}],terms:[{t:"Ionotropic receptor",d:"A receptor that directly opens an ion channel when bound by its transmitter."},{t:"Metabotropic receptor",d:"A receptor that signals through intracellular cascades rather than directly opening a channel."},{t:"Reuptake",d:"Transport of neurotransmitter back into the presynaptic cell or neighbouring glia."}],figure:{d:"synapse",title:"Synaptic transmission and reuptake",caption:"Vesicle fusion releases transmitter into the cleft. Different receptor subtypes can mediate excitation, inhibition or slower modulation. Transporters and enzymes are important drug targets.",variant:"transmission"},example:{t:"Why the same drug can help one person and not another",p:"Receptors vary across brain regions and individual biology. A medication may reduce seizures in one person while causing troublesome effects in another. Clinicians adjust treatment gradually, considering benefits, risks and interactions."},practice:["List one neurotransmitter and two different roles it may have in different circuits.","Explain why raising a transmitter level does not guarantee a particular mood."],myth:{claim:"Serotonin is the happiness chemical and dopamine is the pleasure chemical.",fix:"Both are better understood as modulators of many processes. Their effects depend on receptor type, brain region, timing and the rest of the circuit. They cannot be reduced to one emotion."},takeaways:["Synaptic transmission depends on release, receptor binding and termination.","Receptor identity and circuit context determine effects.","Medications modulate systems but do not map cleanly onto popular 'chemical' stories."],check:{q:"What determines the effect of a neurotransmitter at a particular synapse?",options:["Only the neurotransmitter's name","The receptor type, location and surrounding circuits","Whether the person is thinking positively","The amount of myelin in the skull"],a:1,why:"Transmitter identity is only one factor. Receptor subtypes, the ion channels or cascades they engage, and the participating networks determine the response."},refs:["purves-neuroscience","openstax-ap","ninds-parkinson"],related:[20,21,39,49]},{id:23,part:3,title:"Myelin and Neural Signal Transmission",kicker:"Insulation for speed",readMins:9,lead:"Myelin is a lipid-rich multilayered sheath wrapped around many axons. It increases conduction speed, reduces the energy cost of signalling and contributes to the brain's white matter.",objectives:["Explain saltatory conduction and nodal organisation.","Distinguish oligodendrocytes from Schwann cells.","Describe what demyelination can do to function."],sections:[{h:"Structure and function",p:["Oligodendrocytes in the central nervous system and Schwann cells in the peripheral nervous system form myelin. One oligodendrocyte can myelinate several axons, while Schwann cells wrap only one segment of a peripheral axon and support regeneration. Gaps called nodes of Ranvier contain clustered sodium channels.","Action potentials jump from node to node, conserving time and energy. Myelin also clusters channels and molecules that organise the axon. Unmyelinated fibres are slower but still functional, as in some pain and autonomic pathways."]},{h:"Damage, repair and development",p:["Demyelination can slow or block conduction and cause weakness, sensory changes, visual symptoms or fatigue. Multiple sclerosis is an immune-mediated demyelinating condition of the central nervous system; similar pathology occurs in the peripheral nervous system after some infections and in other neuropathies.","Oligodendrocyte precursor cells can repair some myelin, but regeneration is incomplete and variable. Myelination continues during development and can be influenced by learning and activity, though no consumer product has been proven to 'remyelinate' the brain."]}],terms:[{t:"Saltatory conduction",d:"Rapid propagation of an action potential between nodes of Ranvier in a myelinated axon."},{t:"Node of Ranvier",d:"A short unmyelinated gap rich in ion channels where the action potential regenerates."},{t:"Demyelination",d:"Loss or damage of myelin sheaths, impairing conduction."}],figure:{d:"myelin",title:"Myelinated and unmyelinated conduction",caption:"Myelin speeds conduction between nodes of Ranvier. Loss of myelin slows or blocks signalling, depending on the axon and the extent of damage.",labels:["Oligodendrocyte","Myelin sheath","Node of Ranvier","Axon","Schwann cell"]},example:{t:"Why MS symptoms vary so widely",p:"Lesions can affect different parts of the central nervous system at different times. A person may experience visual changes, numbness, weakness or fatigue that shift over days or weeks. Symptoms are not evidence of a personal failure, and management should be guided by specialist services where available."},practice:["Explain saltatory conduction to someone without a science background.","Contrast the myelin-forming cells of the central and peripheral nervous systems."],myth:{claim:"Demyelination is always permanent.",fix:"Some remyelination can occur, and function may improve after inflammation settles. Repair is variable and incomplete; the outcome depends on the disease and the person."},takeaways:["Myelin speeds signalling by allowing saltatory conduction.","Oligodendrocytes and Schwann cells differ in location and repair behaviour.","Demyelinating conditions need specialist assessment; no supplement is proven to replace repair."],check:{q:"Why does a myelinated axon conduct faster than an unmyelinated axon of similar diameter?",options:["It has no ion channels","Action potentials jump rapidly between nodes of Ranvier","It carries larger neurotransmitters","Its action potentials are stronger than threshold"],a:1,why:"Myelin insulates the internodes and clusters channels at nodes, so the spike regenerates at widely spaced points. Unmyelinated axons must regenerate the signal continuously, and action potentials do not vary in the way described."},refs:["purves-neuroscience","ninds-ms","mssociety-am"],related:[19,21,54,55],books:[10]},{id:24,part:3,title:"Neural Networks and Communication Pathways",kicker:"From cells to circuits",readMins:9,lead:"Nervous system function emerges from networks: groups of neurons connected by excitatory and inhibitory pathways. Networks allow coincidence detection, synchronisation, selection and flexible behaviour.",objectives:["Describe how excitation and inhibition shape network output.","Explain convergence, divergence, feedforward and feedback circuits.","Recognise that network-level measurements and claims need careful interpretation."],sections:[{h:"Circuit motifs",p:["Convergence allows many inputs to influence one neuron; divergence lets one neuron influence many targets. Feedforward inhibition sharpens timing, lateral inhibition increases contrast and feedback loops regulate gain and stability. Oscillations reflect rhythmic coordination across populations.","The thalamus and cortex form reciprocal loops important for attention, sleep, awareness and sensory processing. The basal ganglia use loops to select actions; the cerebellum computes corrections. Each is a network rather than a single centre."]},{h:"Measuring and changing networks",p:["EEG records summed electrical activity from large populations and cannot read individual thoughts. Functional MRI indirectly measures blood flow. These methods are powerful and indirect, with strengths and limitations that clinicians interpret alongside symptoms.","Network disorders can distribute their effects. A focal stroke can alter remote networks, and epilepsy reflects abnormal synchronisation. Understanding networks helps explain fatigue, variability and the sometimes surprising effects of rehabilitation."]}],terms:[{t:"Lateral inhibition",d:"Mutual inhibition between neighbouring pathways that sharpens contrast or separation of signals."},{t:"Oscillation",d:"Rhythmic coordinated electrical activity among groups of neurons."},{t:"Functional connectivity",d:"Statistical relationship between activity in different brain regions over time; not proof of causation."}],figure:{d:"network",title:"Convergence, divergence and feedback in neural circuits",caption:"Excitatory and inhibitory connections interact across many neurons. Small circuit motifs can produce complex network behaviour, including stable rhythms and transient coalitions.",variant:"motifs"},example:{t:"Where do 'brainwaves' come from?",p:"When large groups of neurons fire in coordinated rhythms, their electrical activity can be detected at the scalp with EEG. Rhythms change with sleep and alertness. A scan or EEG is interpreted in clinical context, not as a direct translation of a person's thoughts or personality."},practice:["Sketch a feedback loop and a feedforward loop, then compare their functions.","Explain why functional MRI does not directly measure neuronal firing."],myth:{claim:"Brain scans can diagnose any condition or reveal whether someone is telling the truth.",fix:"Neuroimaging and EEG are interpreted in clinical context and have limitations. They cannot reliably diagnose complex psychiatric conditions or determine truthfulness on their own."},takeaways:["Networks and circuit motifs generate flexible behaviour.","Excitation, inhibition and timing shape network outcomes.","Neuroimaging and EEG provide indirect information that must be interpreted carefully."],check:{q:"What is functional connectivity most precisely describing?",options:["A direct anatomical wire between two regions","A statistical relationship between activity signals in different regions","The total number of neurons in the brain","The speed of myelin conduction"],a:1,why:"Connectivity measures are statistical associations over time. They do not prove a single direct anatomical connection or establish causality, and they are unrelated to total neuron counts or myelin speed."},refs:["purves-neuroscience","ninds-tests","ninds-brain-basics"],related:[7,22,70,71],books:[13]}],$f=[{id:25,part:4,title:"How the Body Detects Sensory Information",kicker:"Turning the world into nerve signals",readMins:8,lead:"Sensory receptors are biological transducers. They detect specific forms of energy, convert them into electrical changes and send information along pathways that preserve important features while filtering the rest.",objectives:["Describe receptor types and the concept of adequate stimulus.","Explain adaptation, threshold and sensory coding.","Recognise that perception is shaped by central processing as well as receptor input."],sections:[{h:"Receptor fundamentals",p:["Mechanoreceptors detect pressure and vibration; thermoreceptors detect temperature; photoreceptors detect light; hair cells detect sound and acceleration; chemoreceptors detect molecules. Nociceptors detect potentially damaging stimuli. Each receptor is most sensitive to its adequate stimulus, but can respond to intense stimuli of other kinds.","Stimulus strength is encoded by spike frequency and by recruiting additional receptors. Adaptation reduces the response to sustained input; rapidly adapting receptors signal change, while slowly adapting receptors maintain information about ongoing pressure or pain."]},{h:"Sensing is selective and predictive",p:["The brain does not transmit every possible detail. It prioritises contrast, change and relevance. That is why you stop noticing a wristwatch but immediately feel it when it slips. In persistent pain, sensitisation can amplify signals even after tissues appear to have healed."]}],terms:[{t:"Adequate stimulus",d:"The stimulus form to which a sensory receptor is most responsive under normal conditions."},{t:"Adaptation",d:"A reduction in response during sustained or repeated stimulation."},{t:"Sensitisation",d:"An increased response of sensory or pain pathways to stimuli."}],figure:{d:"sensory",title:"Receptors, transduction and coding",caption:"Different receptor types convert specific forms of energy into receptor potentials. Intensity is represented by firing rate and recruitment, while location and quality are represented by pathways and connections.",variant:"overview"},example:{t:"Stepping out of a warm room",p:"Temperature receptors fire more when you first move from a warm room into cool air. The contrast is vivid, but within minutes the feeling fades as adaptation occurs. The temperature has changed, but your conscious experience of it is relative."},practice:["Name one rapidly adapting and one slowly adapting sensory experience.","Explain in one sentence why receptors do not record the world perfectly."],myth:{claim:"Pain is a direct measure of tissue damage.",fix:"Pain is an experience produced by the nervous system. It often, but not always, reflects tissue damage; context, learning, sleep, mood and sensitisation can alter it."},takeaways:["Receptors transduce specific stimuli into electrical signals.","Adaptation and filter mechanisms make sensation selective.","Perception reflects central interpretation, not only the signal at the receptor."],check:{q:"What is an adequate stimulus for a photoreceptor?",options:["Pressure","Light","Temperature","Sound waves"],a:1,why:"Photoreceptors in the retina are specialised for light. Hair cells process sound and movement, mechanoreceptors process pressure, and thermoreceptors process temperature."},refs:["openstax-ap","purves-neuroscience"],related:[26,27,30,31]},{id:26,part:4,title:"The Visual System and Neural Processing of Sight",kicker:"Light, edges and meaning",readMins:9,lead:"Vision starts with light striking the retina and continues through multiple transformation stages. Colour, contrast, motion and depth are extracted by different circuits and then bound into a stable visual world.",objectives:["Describe retinal processing and the role of rods and cones.","Explain receptive fields and early visual processing.","Identify common visual symptoms that require assessment."],sections:[{h:"The retina and early coding",p:["Photoreceptors hyperpolarise in response to light and transmit to bipolar and ganglion cells. Horizontal and amacrine cells shape contrast and timing. Retinal ganglion cells have centre-surround receptive fields, enhancing edges and local contrasts rather than duplicating the image.","Rods are highly sensitive in dim light but do not support colour discrimination; cones support colour and fine detail in brighter conditions. The fovea has a high cone density and provides sharp central vision, while peripheral retina is more sensitive to movement."]},{h:"Cortical construction and clinical caution",p:["V1 contains neurons tuned to oriented edges and combinations of features. Extrastriate areas process colour, motion and form. Attention, expectation and memory influence what we notice. Optical illusions demonstrate efficient inference, not a malfunction.","New flashes, floaters with a curtain, sudden vision loss or double vision can indicate retinal, vascular or neurological emergencies. Visual symptoms should not be attributed to stress or dehydration without medical assessment."]}],terms:[{t:"Photoreceptor",d:"A light-sensitive retinal cell; rods and cones are the two main types."},{t:"Fovea",d:"The central retinal region with high cone density and sharpest vision."},{t:"Visual acuity",d:"The clarity or sharpness of vision at a standard distance."}],figure:{d:"eye",title:"Retinal circuits and visual pathways",caption:"Light is focused by the cornea and lens onto the retina. Signals pass through retinal layers, the optic nerve and thalamus to the occipital cortex.",variant:"processing"},example:{t:"Why you can miss something obvious",p:"Attention is selective. A person concentrating on traffic may miss a friend across the street. This is not a lack of care or a neurological problem by itself. In some brain injuries, however, attention deficits can be persistent and disabling."},practice:["Explain why edges are more informative than uniform areas for vision.","List two questions to ask about a new visual symptom when contacting a clinician."],myth:{claim:"20/20 vision means your entire visual system is healthy.",fix:"Acuity tests only measure part of vision. Fields, colour, eye movement, retinal health, brain pathways and visual attention are also important."},safety:"Sudden loss of vision, a new curtain across the visual field, flashes with many floaters, or double vision with weakness or slurred speech needs urgent medical care.",takeaways:["The retina already performs filtering and feature extraction.","Visual cortex builds features into networks and interactions.","Sudden visual symptoms should be assessed urgently."],check:{q:"Which retinal cells are most sensitive in dim light?",options:["Cones","Rods","Bipolar cells","Ganglion cells only"],a:1,why:"Rods are highly sensitive to light and support night vision. Cones support colour and detail. Bipolar and ganglion cells relay signals but are not the primary dim-light photoreceptors."},refs:["openstax-ap","purves-neuroscience","nice-ng127"],related:[14,27,52,71]},{id:27,part:4,title:"Hearing, Balance and the Vestibular System",kicker:"Hair cells and the sense of movement",readMins:9,lead:"Hair cells convert mechanical motion into neural signals in both the cochlea and vestibular organs. One set supports hearing, while another supports balance, spatial orientation and stable gaze.",objectives:["Describe the cochlear and vestibular roles of hair cells.","Explain the brainstem and cortical pathways for hearing and balance.","Recognise when hearing or balance symptoms need urgent care."],sections:[{h:"Hearing",p:["Sound waves travel through the ear canal and ossicles to the cochlea, where the basilar membrane separates frequencies. Hair cells at different positions respond to different frequencies and release transmitter onto auditory nerve fibres. The information is organised tonotopically through brainstem and thalamic nuclei to auditory cortex.","Noise-induced hearing loss arises from damage to hair cells and related structures. Both loudness and duration matter. Protection at work and during music or sporting activities can prevent permanent loss, while sudden hearing loss is an urgent medical problem."]},{h:"Balance and vestibular function",p:["Three semicircular canals detect rotational acceleration, while otolith organs detect linear acceleration, head tilt and gravity. Vestibular signals combine with vision and proprioception to stabilise gaze and posture and to produce the vestibulo-ocular reflex.","Dizziness is a broad term that can include vertigo, presyncope, unsteadiness or anxiety. A sensation that the room spins, new hearing loss, headache, weakness, double vision or difficulty walking may indicate a neurological or inner-ear cause and requires assessment."]}],terms:[{t:"Tonotopy",d:"Orderly representation of sound frequency along auditory structures."},{t:"Vertigo",d:"A false sensation of spinning or movement, often due to vestibular imbalance."},{t:"Vestibulo-ocular reflex",d:"A rapid reflex that moves the eyes to stabilise images during head movement."}],figure:{d:"ear",title:"The inner ear: hearing and balance",caption:"The cochlea converts sound into neural signals, while the semicircular canals and otolith organs detect head rotation and linear acceleration.",labels:["Cochlea","Semicircular canals","Auditory nerve","Vestibular nerve","Eustachian tube"]},example:{t:"Reading in a moving car",p:"Your visual system sees a stable page, your vestibular system senses the car's movement and your body senses vibration. The brain integrates these conflicting signals. Some people experience nausea while others adapt quickly; neither response is a sign of weakness."},practice:["Explain the difference between hearing and vestibular hair cell function.","Write down three features that distinguish vertigo from light-headedness."],myth:{claim:"Feeling dizzy is usually just anxiety or low blood pressure.",fix:"Anxiety and blood pressure can contribute, but vertigo, hearing loss, stroke, medication effects, ear disorders and other conditions overlap. New neurological signs require evaluation."},safety:"Sudden hearing loss needs urgent assessment. Vertigo with weakness, facial droop, double vision, severe imbalance or difficulty speaking may indicate stroke; call local emergency services.",takeaways:["Hair cells are central to both hearing and balance.","The brain integrates vestibular, visual and proprioceptive signals.","Acute hearing or balance symptoms can be emergencies, so context matters."],check:{q:"What do the semicircular canals primarily detect?",options:["Sound frequency","Rotational head acceleration","Light intensity","Chemical molecules in the air"],a:1,why:"The semicircular canals detect rotational acceleration and support the vestibular sense. Sound is detected by the cochlea, light by the retina and airborne chemicals by the olfactory system."},refs:["openstax-ap","cdc-hearing","nice-ng127"],related:[26,30,32,52],books:[21]},{id:28,part:4,title:"Smell and Olfactory Processing",kicker:"The direct sense",readMins:8,lead:"Olfaction detects airborne molecules and provides a direct link to brain regions involved in memory and emotion. It also warns us about smoke, gas and spoiled food.",objectives:["Describe the olfactory pathway from epithelium to cortex.","Explain the relationship between smell and flavour.","Recognise safety concerns associated with smell loss."],sections:[{h:"Detection and pathways",p:["Olfactory receptor neurons in the upper nasal epithelium detect chemical structures and send axons through the cribriform plate to glomeruli in the olfactory bulb. Signals project to piriform cortex, amygdala and entorhinal regions, with less reliance on the thalamus than most other senses.","Humans detect many odours but naming them is often harder than detecting or distinguishing them. Odour perception varies with genes, age, exposure and attention. A blocked nose, infection, trauma, medication or neurological condition can alter smell."]},{h:"Flavour and safety",p:["What we call flavour is mainly smell combined with taste, texture, temperature and irritation from the mouth. Losing smell can therefore make food taste bland even when taste buds function. Smell and taste changes are common after some viral infections.","Smell loss reduces warning about smoke, gas and spoilage. Check smoke alarms and food safety practices, especially when the change is sudden or persistent. Persistent loss should be discussed with a clinician; smell training is being studied for some causes but is not a guaranteed cure."]}],terms:[{t:"Olfactory epithelium",d:"The nasal tissue containing receptor neurons that detect odour molecules."},{t:"Olfactory bulb",d:"A structure that receives and begins processing odour signals from the nose."},{t:"Anosmia",d:"Complete or near-complete loss of the sense of smell."}],figure:{d:"sensory",title:"The olfactory pathway",caption:"Odour molecules bind olfactory receptors. Axons pass through the cribriform plate and synapse in the olfactory bulb, then project to areas including piriform cortex and the amygdala.",variant:"olfactory",labels:["Odour molecules","Olfactory epithelium","Cribriform plate","Olfactory bulb","Piriform cortex"]},example:{t:"Why food lacks flavour during a cold",p:"Taste receptors still detect sweet, salty, sour, bitter and umami, but blocked airflow prevents many odour molecules from reaching the olfactory epithelium. The brain receives a reduced 'flavour' package, even though the food has not changed."},practice:["Explain the difference between taste and smell using a familiar food.","List two practical safety steps if a household loses smell."],myth:{claim:"Smell training can restore everyone's sense of smell completely.",fix:"Structured smell training is a low-risk approach being studied for some patients, especially after certain viral illnesses. Evidence is mixed and no approach guarantees full recovery."},safety:"A new loss of smell with facial weakness, difficulty speaking, confusion or severe headache may signal a neurological emergency. Sudden smell loss with smoke or gas exposure risk should be managed with safety precautions.",takeaways:["Olfaction has a comparatively direct pathway to limbic and cortical regions.","Flavour depends strongly on smell, texture and other oral sensations.","Smell loss can affect safety and should be evaluated if persistent or accompanied by neurological signs."],check:{q:"Which statement best explains why food tastes bland during a blocked nose?",options:["Taste buds stop working completely","Flavour relies heavily on odour signals that are reduced","The stomach cannot digest the food","The optic nerve is compressed"],a:1,why:"Taste receptors still provide basic taste qualities, but odour contributes much of flavour. Blocked airflow reduces odour molecules reaching receptors; it does not necessarily stop taste buds or involve digestion or vision."},refs:["openstax-ap","purves-neuroscience"],related:[29,5,59]},{id:29,part:4,title:"Taste and Gustatory Processing",kicker:"Five basic qualities, many experiences",readMins:8,lead:"Taste buds detect a small set of chemical qualities that help guide eating and drinking. Taste is a chemical sense, but the experience of food is multimodal and strongly influenced by smell and learning.",objectives:["Identify the five established taste qualities.","Trace the cranial nerves that carry taste information.","Explain how taste, smell and learning interact."],sections:[{h:"Taste qualities and pathways",p:["Taste buds detect sweet, salty, sour, bitter and umami (savoury) qualities. Receptors are distributed across the tongue, palate and throat, not in a simple map of separate zones. Taste cells signal through cranial nerves VII, IX and X to the brainstem, then thalamus and gustatory cortex.","Sweet and umami often signal nutrients, salty signals electrolytes and bitter can warn of toxins. These are broad tendencies, not a complete safety system. Sensations such as spicy, fatty or metallic involve other receptors and trigeminal pathways, which is why they are not all 'basic tastes'."]},{h:"Food, culture and change",p:["Taste receptor genes vary, so different people experience some bitter compounds differently. Culture, learning, memory and familiarity shape preferences and what 'tastes good'. Changes in taste can occur with medication, infection, vitamin or mineral deficiencies, smoking, dry mouth and some neurological conditions.","Dry mouth, mouth pain, swallowing difficulty or unintended weight loss with a taste change should be reviewed. Zinc or other supplements should not be started as a universal remedy; professional evaluation can identify treatable causes and interactions."]}],terms:[{t:"Umami",d:"A savoury taste quality associated with glutamate and certain nucleotides."},{t:"Gustatory cortex",d:"Cortical regions that process taste information."},{t:"Dysgeusia",d:"A distortion or alteration in the sense of taste."}],figure:{d:"sensory",title:"Taste and flavour pathways",caption:"Taste buds signal through cranial nerves to the brainstem, thalamus and gustatory cortex. Flavour also integrates smell, touch, temperature and trigeminal sensations.",variant:"taste",labels:["Taste buds","Cranial nerves","Brainstem","Thalamus","Gustatory cortex"]},example:{t:"Chili is not a basic taste",p:"The burning quality of chili comes from capsaicin activating TRPV1 receptors normally involved in heat and pain, carried by trigeminal fibres. It is a food sensation, but it is not classified as one of the basic taste qualities."},practice:["Name the five taste qualities without looking.","Identify one non-taste sensation in a food you enjoy."],myth:{claim:"The tongue has a map where sweetness is only on the tip.",fix:"All taste qualities can be detected across most tongue regions. The old tongue map was a misinterpretation; receptor distribution varies but does not create strict zones."},takeaways:["Taste has five established qualities processed through cranial nerves and brain pathways.","Flavour combines taste with smell, texture and trigeminal sensations.","Taste change has many causes and does not automatically respond to supplements."],check:{q:"Which pair lists only basic taste qualities?",options:["Sweet and spicy","Bitter and umami","Fatty and metallic","Cool and sour"],a:1,why:"Bitter and umami are basic taste qualities alongside sweet, salty and sour. Spicy, fatty, metallic and cool are largely other oral or trigeminal sensations."},refs:["openstax-ap","purves-neuroscience"],related:[28,5,41],books:[10]},{id:30,part:4,title:"Touch, Temperature, Pain and Pressure",kicker:"The somatosensory world",readMins:9,lead:"The skin contains a variety of receptors that report contact, vibration, temperature and potential tissue damage. These signals travel through spinal pathways and are shaped by the brain into touch and pain experiences.",objectives:["Distinguish mechanoreceptors, thermoreceptors and nociceptors.","Compare the dorsal-column and spinothalamic pathways.","Explain why pain is an experience, not only a signal."],sections:[{h:"Touch and temperature",p:["Mechanoreceptors detect different features: Merkel discs respond to sustained pressure, Meissner corpuscles to flutter, Pacinian corpuscles to vibration and Ruffini endings to stretch. Thermoreceptors detect warming or cooling. Density and receptive-field size differ across the body, shaping sensitivity.","Fine touch and proprioception travel in the dorsal-column–medial lemniscus pathway and cross in the brainstem. Pain and temperature travel through the spinothalamic tract and cross near their spinal level. This anatomy explains why spinal or brain lesions produce characteristic patterns of sensory loss."]},{h:"Pain is multidimensional",p:["Nociceptors respond to intense mechanical, thermal or chemical stimuli. Their signals are modulated in the dorsal horn and brain, where attention, expectation, mood, sleep and prior experience alter the eventual pain. This is why two people with similar injuries can report different pain.","Persistent pain involves sensitisation and changes in nervous system function, not simply ongoing tissue damage. It deserves a clinical assessment and a person-centred plan combining appropriate movement, sleep, psychological support and medication where indicated."]}],terms:[{t:"Nociceptor",d:"A sensory neuron that responds to stimuli that are or may become damaging."},{t:"Nociception",d:"The neural encoding of potentially damaging stimuli."},{t:"Central sensitisation",d:"Increased responsiveness of central pain pathways, contributing to amplified pain."}],figure:{d:"pain",title:"Nociception, modulation and pain",caption:"Nociceptive signals enter the dorsal horn and ascend through the spinothalamic tract. Descending modulation and brain networks can amplify or reduce pain. Pain is the conscious experience, not the signal alone.",labels:["Nociceptor","Dorsal horn","Ascending pathway","Descending modulation","Pain experience"]},example:{t:"The same bruise feels different at different times",p:"A bruise may hurt intensely when you first notice it, then less while you are absorbed in a task, and more when you are tired or anxious. Tissue damage has not changed in that moment; the nervous system's processing has."},practice:["Explain the difference between nociception and pain.","Identify two non-pharmacological factors that can influence persistent pain."],myth:{claim:"If tests are normal, the pain cannot be real.",fix:"Pain can persist due to altered nervous system sensitivity even when imaging or tissue tests are normal. The experience is real and deserves appropriate support, although it does not mean every proposed treatment is evidence-based."},safety:"New weakness, loss of bladder or bowel control, saddle numbness, pain after significant trauma or pain with fever and neurological signs needs urgent assessment.",takeaways:["Multiple receptor types encode touch, vibration, temperature and nociception.","Sensory pathways have different crossing points and clinical patterns.","Pain is a brain-produced experience shaped by context and biology."],check:{q:"Which statement best distinguishes nociception from pain?",options:["They are exactly the same thing","Nociception is neural signalling, while pain is a conscious experience shaped by the brain","Pain occurs only in the skin","Nociception is always conscious, whereas pain is unconscious"],a:1,why:"Nociception refers to the encoding of potentially damaging stimuli. Pain is the person's experienced state, constructed and modulated by complex nervous system processes."},refs:["openstax-ap","purves-neuroscience","nhs-neuropathy"],related:[25,31,58,67],books:[13]},{id:31,part:4,title:"Proprioception and Body Awareness",kicker:"Knowing where you are",readMins:8,lead:"Proprioception is the sense of body position, movement and effort. It combines information from muscles, tendons, joints and skin and is essential for coordinated movement, balance and a stable sense of self.",objectives:["Identify the receptors and pathways involved in proprioception.","Explain how the brain integrates body signals with vision and balance.","Recognise factors that can disturb body awareness and increase fall risk."],sections:[{h:"Receptors and pathways",p:["Muscle spindles detect stretch and rate of change, Golgi tendon organs detect force and joint receptors contribute position information. Signals travel through large myelinated sensory fibres to the spinal cord and ascend in the dorsal columns to brainstem nuclei, thalamus and somatosensory cortex.","Proprioceptive signals are combined with vestibular and visual input in the cerebellum, parietal cortex and motor regions. This integrated 'body schema' allows you to reach, walk, type and recover balance without constantly looking at your limbs."]},{h:"When body awareness changes",p:["Illness, injury, neuropathies, vestibular disorders and ageing can reduce proprioceptive accuracy. People may trip more, feel unsteady in the dark or need to watch their feet. Strength, balance and sensory training can help, but the right programme depends on the cause.","Phantom sensations after limb loss show that body awareness is constructed by the nervous system, not only by the body's physical structure. These experiences are real and can be distressing; specialised rehabilitation can help."]}],terms:[{t:"Proprioception",d:"The sense of body position and movement."},{t:"Muscle spindle",d:"A stretch-sensitive receptor within skeletal muscle that reports muscle length and change."},{t:"Body schema",d:"An internal model of the body's position, dimensions and movement used for action."}],figure:{d:"sensory",title:"Proprioceptive pathways and integration",caption:"Muscle spindles, tendon organs and joint receptors send information to the spinal cord and brain, where it is combined with vestibular and visual signals to guide movement and balance.",variant:"proprioception",labels:["Muscle spindle","Golgi tendon organ","Dorsal columns","Cerebellum","Parietal cortex"]},example:{t:"Walking in the dark",p:"With vision reduced, you rely more on proprioception and the vestibular system. Some people become more unsteady, especially on uneven surfaces. Holding a rail or using a light is a practical adaptation, not a failure."},practice:["Explain why closing your eyes can make balance harder.","Describe one safe activity that could challenge body awareness with support."],myth:{claim:"Balance is only a matter of strong legs.",fix:"Balance integrates proprioception, vestibular signals, vision, muscle strength and central coordination. Falls can result from problems in any of these systems or their combination."},safety:"New unsteadiness with weakness, numbness, double vision, slurred speech or severe headache can indicate stroke. Repeated falls need assessment to identify preventable causes.",takeaways:["Proprioception combines information from multiple receptors.","The brain integrates body signals with vision and balance.","Balance changes can reflect many causes and may be modifiable with the right support."],check:{q:"Which receptor reports muscle stretch?",options:["Pacinian corpuscle","Muscle spindle","Cone photoreceptor","Olfactory receptor"],a:1,why:"Muscle spindles detect muscle length and change and contribute to proprioception. Pacinian corpuscles detect vibration, cones are visual and olfactory receptors detect odours."},refs:["openstax-ap","purves-neuroscience"],related:[25,30,32,65],books:[14,24]},{id:32,part:4,title:"Motor Control, Coordination and Reflexes",kicker:"From intention to movement",readMins:9,lead:"Movement emerges from a hierarchy of neural circuits. Motor cortex plans and commands, basal ganglia select, the cerebellum corrects and spinal circuits execute, with sensory feedback continuously updating the action.",objectives:["Describe the roles of motor cortex, basal ganglia, cerebellum and spinal cord.","Explain the reflex arc and the difference between reflex and voluntary movement.","Recognise signs of motor system dysfunction."],sections:[{h:"Levels of control",p:["Upper motor neurons in the cortex and brainstem send descending commands through the corticospinal and other tracts. Lower motor neurons in the spinal cord or brainstem connect directly to muscle. Basal ganglia circuits help select desired movements and suppress unwanted ones; the cerebellum calibrates timing and error.","Sensory feedback is essential. Stretch, force, touch and vision update the movement while it is happening. Practised actions become smoother, but they remain adaptable; a skilled athlete still monitors the unexpected."]},{h:"Reflexes and clinical meaning",p:["A reflex arc can involve a sensory neuron, an interneuron and a motor neuron. The knee jerk involves a stretch receptor and a motor response mediated mainly at the spinal level. Reflexes are modulated by the brain, so it is not accurate to call them purely 'unconscious' in every context.","Upper motor neuron damage can increase tone and reflexes, while lower motor neuron damage can cause weakness, wasting and reduced reflexes. Patterns are only clues; diagnosis requires clinical assessment and appropriate tests."]}],terms:[{t:"Upper motor neuron",d:"A neuron whose cell body lies in the brain or brainstem and influences lower motor neurons."},{t:"Lower motor neuron",d:"A neuron that directly innervates skeletal muscle."},{t:"Reflex arc",d:"The neural pathway underlying a rapid, stereotyped response to a stimulus."}],figure:{d:"reflex",title:"A stretch reflex and descending control",caption:"Sensory input from a stretched muscle activates motor neurons serving that muscle. Descending pathways and interneurons modulate the response according to posture and context.",labels:["Muscle spindle","Sensory neuron","Motor neuron","Spinal cord","Muscle"]},example:{t:"Catching a falling object",p:"Visual and touch signals trigger a rapid reach before you consciously plan it, while attention and motor cortex refine grip. Basal ganglia and cerebellum help scale the movement. This coordinated response happens faster than a narrative explanation of each step."},practice:["List the roles of four motor control structures in one movement.","Explain why a reflex is not the same as voluntary movement."],myth:{claim:"All movement is initiated consciously in the motor cortex.",fix:"Some protective responses begin before conscious awareness, and many learned movements are regulated by subcortical systems. The cortex contributes to intention, planning and modulation but is not the only initiator."},safety:"Sudden weakness, particularly on one side, new difficulty walking, slurred speech or loss of coordination may be a stroke. Seek emergency help immediately and note the time symptoms began.",takeaways:["Voluntary movement depends on a coordinated motor network.","Reflexes are rapid circuit responses that can be modulated by higher centres.","Motor symptoms require contextual assessment and prompt emergency care when sudden."],check:{q:"Which structure is most associated with error-based correction of ongoing movement?",options:["The hippocampus","The cerebellum","The occipital cortex","The olfactory bulb"],a:1,why:"The cerebellum uses sensory feedback and error signals to adjust timing and movement. The hippocampus is mainly memory-related, the occipital cortex is visual and the olfactory bulb processes smell."},refs:["openstax-ap","purves-neuroscience","nice-ng127"],related:[15,17,31,67],books:[14,24]}],eg=[{id:33,part:5,title:"Introduction to the Autonomic Nervous System",kicker:"Regulation without micromanagement",readMins:8,lead:"The autonomic nervous system regulates blood vessels, heart, lungs, digestion, sweat, pupil size and other involuntary functions. It is not a pair of on/off switches; it is a set of interacting reflex circuits.",objectives:["Describe the organisation of autonomic pathways.","Compare sympathetic, parasympathetic and enteric divisions.","Explain why conscious control of autonomic functions is limited."],sections:[{h:"A two-neuron chain",p:["Autonomic motor pathways generally use two neurons: a preganglionic neuron from the central nervous system and a postganglionic neuron in a ganglion or organ wall. Sympathetic neurons arise mainly from the thoracolumbar cord; parasympathetic neurons arise from cranial and sacral levels. The enteric nervous system forms local networks in the gut.","Acetylcholine is used in many ganglia and at parasympathetic target synapses. Postganglionic sympathetic fibres mostly release norepinephrine, while sweat glands are a notable cholinergic exception. Organs often receive both sympathetic and parasympathetic input, with the balance helping tune function."]},{h:"Reflexes and limits of control",p:["Autonomic reflexes use sensors, central integration and output. Baroreceptors regulate blood pressure; chemoreceptors influence breathing; stretch and irritation trigger local responses. Breathing exercises or cold exposure may change heart rate and subjective arousal, but they do not give complete voluntary control over all organs.","Claims that a single exercise, supplement or 'nervous system reset' permanently fixes the autonomic system are not supported. Autonomic symptoms can be useful clinical signals and should be assessed when persistent or sudden."]}],terms:[{t:"Preganglionic neuron",d:"The autonomic neuron whose cell body lies in the central nervous system and projects to a ganglion."},{t:"Autonomic tone",d:"The ongoing balance of sympathetic and parasympathetic activity on an organ."},{t:"Dysautonomia",d:"A general term for abnormal autonomic control, with many possible causes."}],figure:{d:"autonomic",title:"The two-neuron autonomic chain",caption:"Preganglionic neurons emerge from the central nervous system and synapse in ganglia. Postganglionic fibres innervate organs, where sympathetic and parasympathetic influences are often integrated.",labels:["Preganglionic","Ganglion","Postganglionic","Target organ","Integration"]},example:{t:"Blushing is not fully voluntary",p:"Blood vessels in the face dilate under autonomic and emotional influences. You may notice the warmth and wish it would stop, but simply deciding not to blush rarely works. Autonomic regulation is accessible to some indirect influences, not direct command."},practice:["Explain the two-neuron chain with a simple drawing.","Separate one evidence-based autonomic self-care option from an unsupported reset claim."],myth:{claim:"You can consciously control every autonomic function with enough practice.",fix:"Some autonomic activity can be influenced indirectly, but blood pressure, digestion and temperature regulation are governed by complex reflex loops. Extreme self-directed control attempts can be dangerous."},safety:"Severe faintness, profound unsteadiness, chest pain, breathing difficulty or new loss of bladder control needs medical assessment. Do not stop cardiac or autonomic medication without clinical advice.",takeaways:["Autonomic pathways use preganglionic and postganglionic neurons.","Sympathetic, parasympathetic and enteric systems interact continuously.","Self-regulation techniques can influence physiology but do not give complete conscious control."],check:{q:"Which statement best describes autonomic regulation?",options:["One nerve directly controls each organ with no integration","It uses multi-neuron pathways and reflex loops that can influence organs in opposing directions","It is entirely under conscious control","It operates only during sleep"],a:1,why:"Autonomic control involves preganglionic and postganglionic neurons, ganglia, sensors and integration. Most organs receive multiple influences, and regulation continues day and night."},refs:["openstax-ap","purves-neuroscience"],related:[34,35,36,40],books:[13,17,18]},{id:34,part:5,title:"Sympathetic Nervous System Function",kicker:"Mobilise and protect",readMins:8,lead:"The sympathetic system mobilises resources during challenges. It can increase heart rate and blood pressure, direct blood flow, relax airways and alter digestion, but it also performs quieter housekeeping functions.",objectives:["Describe the origin and main target effects of sympathetic pathways.","Explain how sympathetic activity supports acute and everyday challenges.","Correct the idea that the system is always 'bad' or overactive."],sections:[{h:"Anatomy and transmitters",p:["Sympathetic preganglionic neurons arise from the thoracic and upper lumbar spinal cord and project to paravertebral or prevertebral ganglia. Many fibres travel in the sympathetic chain. Postganglionic fibres release mainly norepinephrine, while the adrenal medulla releases epinephrine and some norepinephrine into the bloodstream.","Effects include increased heart rate and contractility, vascular constriction in some beds, vasodilation in skeletal muscle, airway relaxation, sweat secretion and reduced digestive activity. Salivary and renal effects are more complex than a simple 'fight-or-flight' story."]},{h:"Adaptive, not villainous",p:["Sympathetic activity helps you stand up, exercise, stay warm and meet a deadline. It supports the baroreflex and normal alertness. Problems arise with excessive, absent or poorly regulated activity, not with having a sympathetic nervous system.","Chronic stress can contribute to sleep disruption, high blood pressure and metabolic risk through sustained behavioural and physiological pathways. Interventions such as regular movement, sleep support and stress skills should be part of broader health care, not framed as turning off a toxic system."]}],terms:[{t:"Sympathetic chain",d:"The paravertebral chain of ganglia alongside the spinal cord that distributes sympathetic fibres."},{t:"Norepinephrine",d:"A catecholamine neurotransmitter used by most postganglionic sympathetic fibres."},{t:"Adrenal medulla",d:"The inner adrenal gland, which releases epinephrine and norepinephrine into the blood."}],figure:{d:"autonomic",title:"Sympathetic pathways and effects",caption:"Thoracolumbar preganglionic fibres synapse in sympathetic ganglia. Output adjusts the heart, blood vessels, lungs, sweat glands, gut and adrenal medulla during challenge and ordinary activity.",variant:"sympathetic"},example:{t:"The moments before speaking in public",p:"Your heart beats faster, hands may sweat and attention narrows. These are normal preparatory responses. They can feel uncomfortable, but they are not proof that something is wrong. Slow breathing and preparation may help some people without eliminating the response entirely."},practice:["Name three sympathetic effects and one normal daily situation they support.","Explain why reducing sympathetic activity is not the goal of all health interventions."],myth:{claim:"The sympathetic nervous system is toxic and should be shut down.",fix:"It is essential for movement, blood pressure, temperature and alertness. The goal is healthy regulation, not eliminating a normal protective system."},takeaways:["Sympathetic pathways arise mainly from the thoracolumbar cord and act through norepinephrine.","The system supports both emergencies and ordinary adjustment.","Chronic stress regulation should be approached through evidence-based, multifaceted care."],check:{q:"Which effect is typically associated with sympathetic activation?",options:["Increased salivation and slow heart rate","Increased heart rate and airway relaxation","Immediate sleep onset","Increased digestive motility"],a:1,why:"Sympathetic activation supports alertness and physical readiness, typically increasing heart rate and relaxing airways. Digestive activity often reduces, and sleep onset is not its direct effect; parasympathetic activity supports rest and digestion."},refs:["openstax-ap","ninds-brain-basics","who-activity"],related:[33,35,39,40],books:[13,14,18]},{id:35,part:5,title:"Parasympathetic Nervous System Function",kicker:"Rest, digest and restore",readMins:8,lead:"Parasympathetic pathways promote digestion, urination, salivation and slower heart rates while supporting recovery. Like the sympathetic system, they are active during waking life, not only at night.",objectives:["Describe craniosacral parasympathetic outflows and their targets.","Explain vagal and sacral contributions to organ regulation.","Evaluate popular claims about vagal tone and 'rest and digest'."],sections:[{h:"Anatomy and acetylcholine",p:["Parasympathetic preganglionic neurons arise from the brainstem and sacral spinal cord. Cranial nerves III, VII, IX and X carry fibres to the eyes, salivary glands, heart, lungs and digestive tract. The vagus nerve is especially extensive, while sacral fibres support bladder, bowel and reproductive function.","Acetylcholine acts at nicotinic receptors in ganglia and muscarinic receptors on target organs. Effects include slowed heart rate, constricted pupils, increased salivation and digestive activity. Local control allows specific organs to be regulated without turning the entire system on or off."]},{h:"Vagal tone claims",p:["Heart rate variability (HRV) is often used as an indirect marker of autonomic regulation, especially vagal influence on the heart. It is affected by fitness, age, breathing, posture, illness and measurement conditions; a single wearable reading does not define your health or personality.","Slow breathing and physical activity can influence vagal tone and wellbeing, but no device or supplement can be guaranteed to 'reset' it. Repeated faintness, abnormal heart racing, severe digestive symptoms or bladder dysfunction merit professional assessment."]}],terms:[{t:"Vagus nerve",d:"A major cranial nerve carrying extensive parasympathetic fibres to the heart, lungs and gut."},{t:"Muscarinic receptor",d:"A type of acetylcholine receptor on many parasympathetic target organs."},{t:"Heart rate variability",d:"Variation in the time between heartbeats, influenced by autonomic activity and many other factors."}],figure:{d:"autonomic",title:"Parasympathetic and vagal pathways",caption:"Cranial and sacral parasympathetic fibres slow the heart, support digestion, regulate pupils and control pelvic organs. The vagus provides extensive connections to the gut and lungs.",variant:"parasympathetic"},example:{t:"A slow exhale",p:"Prolonged exhalation can modestly change heart rate through respiratory and vagal mechanisms. Some people find it relaxing, but effects are variable and not a cure for a heart condition, anxiety disorder or digestive disease."},practice:["List three organs influenced by the vagus nerve.","Explain why one wearable HRV reading is not a diagnosis."],myth:{claim:"A high HRV means your nervous system is healthy and a low HRV means it is damaged.",fix:"HRV is a useful research and clinical signal in context but varies with age, fitness, breathing, sleep, hydration, illness and measurement. It is not a standalone diagnosis."},safety:"Fainting, chest pain, persistent palpitations, severe abdominal symptoms or new bladder/bowel dysfunction should be assessed. Do not adjust prescribed cardiovascular medication based on a wearable.",takeaways:["Parasympathetic fibres arise from cranial and sacral levels and use acetylcholine.","Vagal activity supports heart, lung and digestive regulation.","HRV and self-regulation claims should be interpreted with context and caution."],check:{q:"Which neurotransmitter is central to parasympathetic target-organ effects?",options:["Acetylcholine","Dopamine","Glycine only","Glutamate"],a:0,why:"Parasympathetic postganglionic fibres release acetylcholine onto muscarinic receptors. Dopamine and glutamate are important elsewhere, and glycine is mainly an inhibitory spinal transmitter."},refs:["openstax-ap","purves-neuroscience","who-activity"],related:[33,34,38,46],books:[12,13,21]},{id:36,part:5,title:"The Enteric Nervous System",kicker:"The gut's own nerve network",readMins:8,lead:"The enteric nervous system is a dense network of neurons within the wall of the gastrointestinal tract. It can coordinate motility and secretion locally while communicating continuously with the brain and autonomic nerves.",objectives:["Identify the myenteric and submucosal plexuses.","Explain how local and central signals regulate digestion.","Separate evidence for gut–brain communication from exaggerated wellness claims."],sections:[{h:"Local circuits",p:["The myenteric plexus lies between muscle layers and influences motility; the submucosal plexus regulates secretion and blood flow. Sensory neurons detect stretch and chemical conditions, motor neurons control muscle and glands, and interneurons coordinate patterns such as peristalsis.","The enteric system is not literally a second brain with human emotions or consciousness. It is an extensive autonomous control network with important interactions with the central nervous system. Describing it as a second brain can be a useful metaphor if its limits are clear."]},{h:"Gut–brain signalling",p:["Vagal and spinal afferents carry signals from the gut to the brain. Hormones such as cholecystokinin and ghrelin influence appetite. Microbial products, immune signals and visceral sensation add further complexity. Gut function can influence mood and behaviour, and brain state can alter gut symptoms.","Probiotics, fibre and diets are actively researched for some conditions, but results vary by strain, dose and population. No diet or supplement has been shown to cure a neurological disease through the gut. Irritable bowel syndrome and other disorders need individual evaluation."]}],terms:[{t:"Myenteric plexus",d:"A network between gut muscle layers that mainly controls motility."},{t:"Peristalsis",d:"Coordinated waves of gut muscle contraction that move contents forward."},{t:"Visceral afferent",d:"A sensory nerve fibre carrying information from internal organs to the central nervous system."}],figure:{d:"gut",title:"Enteric plexuses and gut–brain communication",caption:"The myenteric and submucosal plexuses coordinate local motility and secretion. Vagal and spinal afferents, hormones and immune signals connect gut and brain.",labels:["Myenteric plexus","Submucosal plexus","Vagus nerve","Gut wall","Brain"]},example:{t:"The stomach's response to a meal",p:"Stretch receptors detect filling, local enteric circuits adjust motility and vagal pathways carry information to the brain. Hormones signal satiety. Cues such as the sight or smell of food prepare the gut even before eating. This coordination is distributed, not commanded by a single switch."},practice:["Explain the difference between the myenteric and submucosal plexuses.","Write one cautious sentence about the gut–brain axis suitable for a public audience."],myth:{claim:"The enteric nervous system is a second brain that can make decisions like a human.",fix:"It is a large, complex control network but not a second conscious brain. The metaphor can help explain local gut regulation, but it should not be used to sell unproven treatments."},safety:"Severe or persistent abdominal pain, vomiting, rectal bleeding, unexplained weight loss or sudden bowel changes needs medical assessment. Do not delay because of a self-diagnosed gut imbalance.",takeaways:["Enteric plexuses coordinate much of digestion locally.","Gut–brain communication uses neural, hormonal and immune routes.","Microbiome science is promising but frequently overstated commercially."],check:{q:"Which enteric plexus is most directly involved in controlling gut motility?",options:["The myenteric plexus","The brachial plexus","The cervical plexus","The choroid plexus"],a:0,why:"The myenteric plexus lies between muscle layers and primarily controls motility. The brachial and cervical plexuses are peripheral nerve networks, and the choroid plexus produces cerebrospinal fluid."},refs:["openstax-ap","purves-neuroscience","who-alcohol"],related:[4,38,40,48],books:[10,11,20]},{id:37,part:5,title:"Heart Rate, Blood Pressure and Neural Regulation",kicker:"The baroreflex in daily life",readMins:8,lead:"The heart and blood vessels are continuously adjusted by autonomic reflexes and hormones. The baroreflex stabilises blood pressure during posture changes, exercise and rest, working mostly outside awareness.",objectives:["Explain the baroreflex and its components.","Describe neural contributions to heart rate and vascular tone.","Identify symptoms that require medical rather than self-management."],sections:[{h:"Sensors and response",p:["Baroreceptors in the carotid sinus and aortic arch detect stretch. When blood pressure falls, they reduce their firing, the brainstem increases sympathetic outflow and reduces parasympathetic outflow, and heart rate plus vascular tone usually rise. When pressure is high, reflex responses can lower it.","Postural changes also involve skeletal muscle pumps, breathing and hormones. Rapid standing after eating, prolonged bed rest, dehydration, medications and autonomic disorders can impair compensation and cause light-headedness."]},{h:"Measurement and clinical care",p:["Blood pressure readings vary with technique, cuff size, posture and context. Home or ambulatory monitoring can help clinicians. Hypertension often has no symptoms, so screening matters. A single reading is not a diagnosis.","Chest pain, severe shortness of breath, fainting with injury, one-sided weakness, sudden severe headache or a very slow or fast irregular heartbeat can be emergencies. Do not stop blood-pressure medication because readings improve; that can be a sign the medicine is working."]}],terms:[{t:"Baroreceptor",d:"A stretch-sensitive receptor in large vessels that helps regulate blood pressure."},{t:"Baroreflex",d:"A rapid reflex loop that adjusts heart rate and vessel tone to stabilise blood pressure."},{t:"Orthostatic hypotension",d:"A fall in blood pressure on standing that can cause light-headedness or fainting."}],figure:{d:"baroreflex",title:"The baroreceptor reflex",caption:"Stretch receptors report blood pressure to the brainstem. Autonomic output adjusts heart rate, contractility and vessel diameter to keep perfusion stable during changes in posture and activity.",labels:["Carotid sinus","Aortic arch","Brainstem","Heart","Blood vessels"]},example:{t:"Standing up too quickly",p:"Gravity shifts blood downward, but the baroreflex normally corrects pressure within seconds. Dehydration, some medicines, prolonged bed rest or autonomic disorders can make this response less effective. Persistent symptoms should be investigated rather than treated only with salt or supplements."},practice:["Explain the baroreflex in three steps.","Name one measurement or timing factor that can change a blood pressure reading."],myth:{claim:"You can feel whether your blood pressure is high.",fix:"Hypertension is usually silent. Headaches or feeling tense are not reliable indicators. Measurement with a validated device and clinical review are needed."},safety:"Call emergency services for chest pain, severe breathlessness, fainting with injury or neurological symptoms. Do not alter prescribed heart or blood-pressure medicines without advice.",takeaways:["The baroreflex stabilises blood pressure through autonomic adjustments.","Symptoms of low or high pressure may be absent or misleading.","Measurement technique and clinical interpretation matter."],check:{q:"What is the main effect of the baroreflex when blood pressure suddenly falls?",options:["Sensory firing increases and heart rate falls","Sympathetic outflow increases and parasympathetic outflow falls","The vagus nerve strongly slows the heart","Blood vessels dilate throughout the body"],a:1,why:"Baroreceptor stretch signals fall when pressure drops, triggering increased sympathetic and reduced parasympathetic activity. This usually raises heart rate and vascular tone; the other options would worsen the fall."},refs:["openstax-ap","purves-neuroscience","who-stroke"],related:[33,34,40,51],books:[18,22]},{id:38,part:5,title:"Breathing, Digestion and Internal Neural Control",kicker:"Everyday automatic regulation",readMins:8,lead:"Breathing, swallowing, digestion, urination and many other functions are regulated by brainstem, spinal, autonomic and enteric circuits. They can be influenced by behaviour but do not depend on conscious micromanagement.",objectives:["Describe brainstem control of breathing and its chemoreceptor feedback.","Explain neural coordination of swallowing and digestion.","Recognise warning signs in respiratory, digestive and bladder function."],sections:[{h:"Breathing and swallowing",p:["Brainstem networks generate breathing rhythms and adjust them using feedback from central and peripheral chemoreceptors, stretch receptors and higher centres. You can voluntarily hold your breath or speak, but automatic control reasserts itself, usually well before danger.","Swallowing is a complex sequence that closes the airway, moves food and opens the upper oesophageal sphincter. It involves cranial nerves and brainstem coordination. Coughing, choking or a wet voice during meals may signal dysphagia and should be assessed, especially after stroke or in progressive neurological conditions."]},{h:"Digestion and elimination",p:["Parasympathetic activity generally promotes digestion, while sympathetic activity diverts resources away from it. Enteric circuits coordinate peristalsis and secretion. The bladder uses parasympathetic contraction, sympathetic relaxation, and somatic control of the external sphincter.","Continence, bowel and bladder changes can have treatable causes, including medication effects, UTIs, prostate problems, neurological disease and spinal cord injury. They are health information, not shameful secrets, and are appropriate to discuss with a clinician."]}],terms:[{t:"Dysphagia",d:"Difficulty swallowing, which can lead to choking or aspiration."},{t:"Chemoreceptor",d:"A sensor that detects chemical changes such as carbon dioxide or oxygen levels."},{t:"Pelvic floor",d:"The muscle group that supports pelvic organs and contributes to continence."}],figure:{d:"homeostasis",title:"Internal control loops for breathing and digestion",caption:"Chemoreceptors and stretch receptors feed brainstem circuits. Autonomic and enteric output adjusts breathing, swallowing, motility and secretion. Behaviour can modulate but not fully replace these loops.",variant:"breathing",labels:["Brainstem","Chemoreceptors","Airways","Digestive tract","Pelvic organs"]},example:{t:"Eating and talking at the same time",p:"Speaking uses airflow and oral muscles, as does swallowing. The nervous system shifts between patterns, sometimes imperfectly. This is why talking while eating can cause a brief cough or choking sensation, and why difficulty swallowing should be taken seriously."},practice:["List three feedback signals that influence breathing.","Identify two situations in which swallowing difficulty needs professional assessment."],myth:{claim:"You need to consciously control breathing to be healthy.",fix:"Automatic regulation is highly effective. Mindful breathing can be a useful practice, but attempts to constantly override autonomic control can cause dizziness or distress."},safety:"Seek urgent care for severe breathlessness, choking with persistent breathing difficulty, new inability to swallow, coughing with meals and fever, or sudden bowel/bladder changes with neurological symptoms.",takeaways:["Brainstem circuits generate and regulate breathing and swallowing.","Enteric and autonomic pathways control digestion and elimination.","New swallowing, breathing or continence symptoms deserve assessment."],check:{q:"Which receptors most directly inform the brainstem about blood carbon dioxide levels?",options:["Baroreceptors","Central chemoreceptors","Rods and cones","Muscle spindles"],a:1,why:"Central chemoreceptors detect changes in hydrogen ion concentration linked to carbon dioxide. Baroreceptors monitor vessel stretch, rods and cones detect light, and muscle spindles report stretch."},refs:["openstax-ap","ninds-brain-basics","nice-neuro-rehab"],related:[16,35,40,76],books:[21,22]},{id:39,part:5,title:"Stress Responses and Nervous System Regulation",kicker:"Acute adaptation, chronic cost",readMins:9,lead:"Stress is a normal response to demand. The brain coordinates behavioural alertness, autonomic changes and hormonal output, which can be helpful in the short term and costly when sustained.",objectives:["Describe the sympathetic and HPA-axis components of stress.","Distinguish acute stress from chronic stress and allostatic load.","Evaluate evidence-based stress-management options."],sections:[{h:"The stress response",p:["The brain appraises a challenge and activates the sympathetic nervous system within seconds, increasing alertness, heart rate and blood flow to muscles. The hypothalamic–pituitary–adrenal (HPA) axis then releases cortisol, which influences glucose, immune function and energy availability over minutes to hours.","Acute stress can sharpen attention and mobilise action. It becomes a health issue when intense or prolonged, or when recovery is poor. Chronic stress is associated with sleep problems, blood pressure and metabolic risk, and can worsen many neurological symptoms through indirect pathways."]},{h:"Regulation and realistic expectations",p:["Evidence-informed approaches include regular physical activity, adequate sleep, social support, structured relaxation or mindfulness, problem-solving and treatment of anxiety or depression. No single technique is universally effective, and people need access to options that fit their circumstances.","Popular concepts such as 'adrenal fatigue' are not a recognised diagnostic category. Persistent fatigue, low mood, fainting, weight change or cognitive difficulties need clinical assessment to rule out treatable conditions. Supplements should not replace care."]}],terms:[{t:"HPA axis",d:"The hypothalamic–pituitary–adrenal system that regulates cortisol output and stress adaptation."},{t:"Allostatic load",d:"The cumulative wear and tear from repeated or prolonged adaptation to stress."},{t:"Cortisol",d:"A steroid hormone involved in energy regulation, immune modulation and stress responses."}],figure:{d:"stress",title:"Acute stress response and feedback",caption:"Appraisal activates sympathetic output quickly and the HPA axis more slowly. Cortisol feeds back to the brain and affects energy and immune function. Recovery depends on the stressor, coping resources and sleep.",labels:["Threat appraisal","Hypothalamus","Pituitary","Adrenal cortex","Cortisol feedback"]},example:{t:"A deadline week versus a demanding year",p:"Short-term pressure may increase focus and heart rate, then resolve. Sustained pressure with poor sleep, limited recovery and ongoing uncertainty places a heavier allostatic load. Healthful routines matter, but structural and social circumstances also shape stress risk."},practice:["List one immediate stress response and one long-term cost.","Choose one realistic recovery practice and specify when you would use it."],myth:{claim:"A supplement can fix 'adrenal fatigue' caused by stress.",fix:"Adrenal fatigue is not a validated diagnosis. Persistent symptoms should be evaluated; replacing prescribed care with supplements can delay effective treatment."},safety:"Persistent exhaustion, suicidal thoughts, fainting, palpitations at rest, severe weight change or cognitive decline deserves professional support. Seek urgent help if you feel unsafe.",takeaways:["Stress combines rapid autonomic and slower HPA-axis responses.","Chronic stress affects health through multiple interacting pathways.","Effective regulation is broader than one technique or product."],check:{q:"Which hormone is most closely associated with the HPA-axis response to stress?",options:["Insulin","Cortisol","Melatonin","Thyroxine"],a:1,why:"The HPA axis ultimately increases cortisol release from the adrenal cortex. Insulin regulates glucose, melatonin influences circadian timing and thyroxine regulates metabolism, though all can interact with stress physiology."},refs:["ninds-brain-basics","who-activity","nhlbi-sleep"],related:[34,38,46,48],books:[12,13,17]},{id:40,part:5,title:"Homeostasis and the Nervous System",kicker:"Keeping a moving system steady",readMins:8,lead:"Homeostasis is the active regulation of internal conditions around ranges that support life. Sensors, brain integration, autonomic output, hormones and behaviour continuously adjust temperature, fluids, glucose, blood pressure and more.",objectives:["Explain negative and positive feedback with examples.","Describe neural regulation of temperature, fluids and glucose.","Understand why homeostasis is dynamic rather than a fixed constant."],sections:[{h:"Feedback principles",p:["Negative feedback opposes a deviation: a rise in temperature triggers cooling; a fall in blood pressure triggers compensatory vasoconstriction and faster heart rate. Positive feedback amplifies a change and is usually time-limited, such as oxytocin-driven uterine contractions in labour.","Set points are better understood as flexible ranges that change with sleep, illness, pregnancy, exercise and circadian time. Fever is a regulated increase in the temperature set point, not simply the body failing to cool. Treatment depends on the cause and individual circumstances."]},{h:"Integrated examples",p:["Thirst and antidiuretic hormone help conserve water when osmolality rises. Insulin and glucagon regulate glucose, with the brain sensing and influencing intake and autonomic responses. Temperature control involves skin blood flow, sweating, shivering and behaviour.","Homeostatic failure can produce severe symptoms: extreme temperature, confusion, very low or high glucose, electrolyte disturbance and unstable blood pressure. These are medical concerns and cannot be diagnosed from a wellness questionnaire."]}],terms:[{t:"Negative feedback",d:"A regulatory loop in which the response opposes the initial change."},{t:"Osmolality",d:"The concentration of dissolved particles in a fluid, influencing water movement and thirst."},{t:"Thermoregulation",d:"The coordination of heat production and heat loss to regulate body temperature."}],figure:{d:"homeostasis",title:"A general homeostatic feedback loop",caption:"Sensors detect deviation, an integrator compares conditions with a flexible range, effectors produce a response and feedback updates the system. Behaviour and environment are part of the loop.",variant:"feedback",labels:["Sensor","Integrator","Effector","Disturbance","Feedback"]},example:{t:"Exercise on a hot day",p:"Muscles produce heat, skin vessels dilate and sweating increases. Thirst and behaviour help replace fluid, while the kidneys conserve water. If heat production outpaces loss, core temperature can rise dangerously. Confusion, collapse or absent sweating in heat are emergencies."},practice:["Draw a negative feedback loop for body temperature.","Explain why a 'normal' reference range can vary with context."],myth:{claim:"The body always holds every variable at a perfectly fixed value.",fix:"Homeostasis is dynamic regulation around flexible ranges. Values naturally change with activity, sleep, meals, age, pregnancy and illness."},safety:"Seek emergency help for confusion or collapse in heat, severe dehydration, very low or high blood glucose with altered consciousness, or unstable vital signs. Do not rely on consumer devices to diagnose these states.",takeaways:["Homeostasis uses feedback loops and flexible ranges.","The nervous system coordinates behaviour, autonomic output and endocrine signals.","Extreme deviations are medical emergencies, not wellness imbalances to self-treat."],check:{q:"Which is an example of negative feedback?",options:["A rise in temperature triggers sweating and cooling","A small signal becomes progressively larger without a brake","Muscle contraction continues until complete exhaustion","A blood clot activates ever more clotting indefinitely"],a:0,why:"Sweating and cooling oppose the initial temperature rise, which is negative feedback. The other options describe positive feedback or uncontrolled processes, which usually require limiting mechanisms."},refs:["openstax-ap","ninds-brain-basics","who-stroke"],related:[33,37,38,45],books:[17,22,23]}],tg=[{id:41,part:6,title:"Nutrition and Nervous System Function",kicker:"Food supports; it does not cure everything",readMins:9,lead:"The nervous system requires energy, protein, fats, vitamins, minerals and water. Dietary patterns influence neurological health, but no single food, supplement or 'brain diet' has been shown to prevent or cure all neurological disease.",objectives:["Describe how broad dietary patterns support neurological function.","Distinguish nutrient adequacy from treating disease with a food or supplement.","Adapt nutrition advice to varied food systems and budgets."],sections:[{h:"What the evidence supports",p:["Adequate energy and protein support growth, repair and neurotransmitter synthesis. Vitamins and minerals enable essential enzymes; fats form membranes; iron and iodine are needed for development. Dietary patterns rich in vegetables, fruit, legumes, whole grains and unsaturated fats, with minimal ultra-processed foods and excess alcohol, are broadly associated with better health outcomes.","These are population-level associations, not guarantees for an individual. Preventing stroke through blood-pressure and vascular risk management is better established than using supplements for dementia prevention. Nutrition also interacts with sleep, movement and access to care."]},{h:"Culture, access and safety",p:["Nutrient sources differ across regions: legumes, millet, teff, rice, maize, wheat, teff, cassava, fish, eggs, dairy, tofu and fortified products may all play a role. Food fortification and supplementation programmes vary by country and can be important where deficiency is common.","A true deficiency is diagn
