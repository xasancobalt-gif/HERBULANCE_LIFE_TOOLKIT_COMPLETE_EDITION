mpt to optimise every variable. A plan that fits your budget, culture, energy and responsibilities is more useful than an idealised routine. Include rest and flexibility. Use the worksheets and 30-day challenge in this book as starting structures, not as prescriptions."]},{h:"Prepare for real life",p:["Record local emergency numbers and the red flags from Chapter 78. List medications, allergies and relevant conditions to share with a clinician, keeping this book's worksheet free of highly sensitive details you do not want stored. Know how to reach your primary care service, pharmacist and, where relevant, neurological follow-up.","Ask what to do if your symptoms change, what side effects matter and when a new appointment is needed. Share your learning with family only if you choose. If you suspect a medical emergency, do not use this workbook as a diagnostic tool; seek immediate care."]},{h:"Continue learning",p:["Revisit chapters, take the quizzes, discuss the references and compare what you learn with reputable national guidance. The companion HERBULANCE titles can deepen nutrition, sleep, stress, movement, ageing and whole-body topics. Learning is a contribution to your life, not a diagnosis or a performance score."]}],terms:[{t:"Goal",d:"A specific, meaningful outcome you choose and can review."},{t:"Health literacy",d:"The ability to obtain, understand and use information to make health decisions."},{t:"Care pathway",d:"The expected route through services for assessment, treatment and support."}],figure:{d:"homeostasis",title:"A four-part personal plan",caption:"A useful plan balances learning, physical foundations, safety and access to care. It should be reviewed and adjusted rather than judged as a test of willpower.",variant:"personal-plan"},example:{t:"One person's realistic plan",p:"A caregiver chooses to read one chapter each evening, walk three times a week, check home fall hazards and store the local emergency number. They review in a month and adjust around work and family. The plan is modest, measurable and built around real constraints."},practice:["Write one goal in each of the four plan areas.","Record your emergency plan and one question for your next clinical appointment."],myth:{claim:"A perfect wellness plan will make you immune to neurological problems.",fix:"No plan guarantees freedom from disease. A good plan supports health, informs decisions and prepares you to seek appropriate care when something changes."},safety:"If you are worried about sudden neurological symptoms, contact local emergency services now. This workbook does not diagnose or treat any condition, and no plan should delay professional assessment.",takeaways:["A sustainable plan is specific, flexible and linked to real sources of care.","Safety and access belong in every wellness plan.","Learning should increase agency, not fear or unhealthy optimisation."],check:{q:"What is the best role for the plan in this chapter?",options:["To diagnose neurological conditions","To set realistic learning, health, safety and care-access goals","To replace prescribed treatment with supplements","To guarantee prevention of all disease"],a:1,why:"The plan is an educational and organisational tool. It cannot diagnose or guarantee outcomes and must not replace prescribed care or emergency services."},refs:["ninds-brain-basics","who-dementia","nhlbi-sleep","who-activity","wfn"],related:[68,77,78,79],books:[10,12,13,14,15]}],De=[...Pf,...Ff,...Jf,...$f,...eg,...tg,...ag,...ng,...ig,...sg,...rg].sort((c,p)=>c.id-p.id),Xn=c=>De.find(p=>p.id===c);De.map((c,p)=>({n:p+1,chapter:c.id,title:c.figure.title,type:c.figure.d}));const og=c=>[c.title,c.kicker,c.lead,...c.objectives,...c.sections.flatMap(p=>[p.h,...p.p]),...c.terms.flatMap(p=>[p.t,p.d]),c.example.t,c.example.p,c.myth.claim,c.myth.fix,...c.practice,...c.takeaways,c.figure.title,c.figure.caption].join(" ").toLowerCase(),Pn=[{id:1,title:"Foundations of the Human Nervous System",short:"Foundations",descripti `).filter(Boolean).map(c=>{const[p,x,h]=c.split("|");return{term:p.trim(),def:x.trim(),cat:h.trim()}}).filter(c=>c.term&&c.def&&c.cat).sort((c,p)=>c.term.localeCompare(p.term)),dg=[...new Set(Qt.map(c=>c.cat))],ug="All people and details in these cases are fictional composites for education only. They do not depict real patients, prove treatment effectiveness or provide clinical advice.",rn=[{id:1,title:"The student who studied until 3 a.m.",region:"Nairobi, Kenya",age:"19 years",tag:"Sleep & learning",background:"Amina is preparing for university entrance exams. She drinks strong tea at night to study longer and notices that she cannot recall material the next morning.",question:"Why can more study hours produce less learning?",neuroscience:"Memory consolidation involves sleep-dependent replay and synaptic stabilisation. Chronic short sleep impairs attention, working memory and mood, so encoding quality falls even when time at the desk rises.",learning:"Amina experiments for two weeks with a consistent sleep window and morning review. She tracks recall rather than total hours.",care:"She sees a clinician if daytime sleepiness persists despite good habits, or if she develops low mood or unsafe drowsiness.",takeaways:["Study time and learning quality are different variables.","Sleep is part of study, not a competitor to it."],chapters:[7,46,64]},{id:2,title:"A plant-based cook with unexplained tingling",region:"Manchester, United Kingdom",age:"34 years",tag:"B12 education",background:"Daniel has eaten a mostly plant-based diet for years. He notices fatigue and tingling in his fingers and wonders whether a B12 supplement is needed.",question:"Should he self-treat with a high-street supplement?",neuroscience:"B12 is required for normal myelin-related and haematological function. Risk depends on intake, fortified foods and absorption, including intrinsic-factor-related problems.",learning:"He books an appointment, reports his diet and symptoms, and does not assume the cause or start high doses on his own.",care:"Assessment can include tests and a plan for replacement and monitoring when deficiency is found.",takeaways:["Tingling has many causes.","B12 deficiency is treatable but needs proper assessment."],chapters:[43,55,73]},{id:3,title:"An older adult and a missed appointment",region:"Kochi, India",age:"71 years",tag:"Memory changes",background:"Meera's daughter notices she has missed two bill payments. Meera says she is simply busy; relatives disagree about whether this is normal ageing.",question:"What would help distinguish normal variation from a concerning decline?",neuroscience:"Dementia is defined by cognitive decline that impairs daily function. Delirium, medication effects, depression, sleep problems, hearing loss and vitamin deficiencies can also affect cognition.",learning:"The family gathers examples, reviews medicines with a clinician and arranges a hearing check and cognitive assessment rather than jumping to a diagnosis.",care:"The clinician considers reversible contributors and discusses next steps and support.",takeaways:["Changes in daily function matter more than isolated forgetfulness.","Respectful assessment can identify treatable factors."],chapters:[53,65,69]},{id:4,title:"A café worker with recurring attacks",region:"Melbourne, Australia",age:"27 years",tag:"Migraine",background:"Jules has throbbing headaches with nausea and light sensitivity twice monthly. Today they see zigzag lines and then feel confused about the cause.",question:"Is every headache a migraine?",neuroscience:"Migraine can involve aura, trigeminovascular activation and sensory sensitisation. Sudden severe headache, fever, weakness or progressive change are red flags for other causes.",learning:"Jules records symptoms and triggers without over-interpreting them, and reports the new visual aura to a clinician.",care:"A clinician can evaluate headache type, red flags and treatment options, including checking whether acute medicines are used too often.",takeaways:["Migraine is a distinct neurological condition.","New or red-flag symptoms need assessment."],chapters:[49,58,78]},{id:5,title:"A family learns seizure first aid",region:"Cebu, Philippines",age:"Family group",tag:"Seizure safety",background:"A neighbour has a seizure at a community gathering. Several people reach for a spoon and try to hold him still.",question:"What does safe help look like?",neuroscience:"During a seizure, neuronal networks fire abnormally. The first-aid goal is to prevent injury and support breathing, not to stop the movements by force.",learning:"At the next community meeting, the family demonstrates protecting the head, removing nearby hazards, timing the event and never putting anything in the mouth.",care:"They know to call emergency services for a first seizure, a long seizure, repeated seizures or injury.",takeaways:["Never restrain or put objects in the mouth.","A calm, timed response is useful and safe."],chapters:[50,78]},{id:6,title:"Recognising a stroke at the bus stop",region:"São Paulo, Brazil",age:"63 years",tag:"Stroke recognition",background:"A bus driver notices a commuter's face drooping and slurred speech. Some bystanders suggest rest and water.",question:"What should happen next?",neuroscience:"Stroke treatment is time-sensitive. An ischaemic stroke may be treated with clot removal or clot-dissolving medicine in selected cases, but only after urgent assessment.",learning:"The driver calls emergency services, notes the time symptoms began and keeps the person safe without giving food or drink.",care:"Hospital evaluation determines the stroke type and appropriate treatment.",takeaways:["Use FAST and call emergency services.","Do not wait for symptoms to resolve."],chapters:[51,78]},{id:7,title:"A tailor with burning feet",region:"Mysuru, India",age:"52 years",tag:"Peripheral neuropathy",background:"Farah has type 2 diabetes and burning in both feet at night. She does not feel a small cut during work.",question:"Why does reduced sensation raise risk?",neuroscience:"Distal sensory neuropathy reduces protective sensation and can cause neuropathic pain. Diabetes-related vascular and metabolic changes contribute.",learning:"She inspects her feet daily, requests glucose and foot review, and avoids heat on numb skin.",care:"The clinical team can check the cause, review medications, teach foot care and consider pain treatment.",takeaways:["Pain and loss of protective sensation can coexist.","Daily foot checks prevent wounds."],chapters:[30,55,75]},{id:8,title:"A retired teacher with Parkinson's disease",region:"Lyon, France",age:"68 years",tag:"Parkinson's support",background:"Henri has slowness and stiffness. He misses a clinic appointment because he assumes nothing can be done.",question:"What can comprehensive care offer?",neuroscience:"Parkinson's disease affects movement through dopamine networks and involves non-motor symptoms. Benefits come from medication, exercise and multidisciplinary care.",learning:"Henri discusses timing of medicines and side effects, and asks about physiotherapy and speech support.",care:"His team addresses falls, sleep, constipation and mood as well as movement.",takeaways:["Parkinson's is more than tremor.","Management is individual and multidisciplinary."],chapters:[52,76,75]},{id:9,title:"A family explores dementia education",region:"Lagos, Nigeria",age:"Family group",tag:"Dementia care",background:"An uncle's personality and memory have changed. Some relatives believe it is normal ageing and discourage a review.",question:"What is the value of assessment if dementia is progressive?",neuroscience:"Cognitive decline can have reversible contributors, and diagnosis enables support, planning and fair access to care.",learning:"The family keeps a symptom log, reviews medicines and arranges a respectful appointment with the uncle's consent.",care:"They learn to support communication, safety and dignity rather than argue about every forgotten detail.",takeaways:["Not all changes are inevitable ageing.","Care and planning matter after diagnosis."],chapters:[53,60,76]},{id:10,title:"A designer with vision and numbness",region:"Toronto, Canada",age:"31 years",tag:"Multiple sclerosis",background:"Leah has transient blurred vision in one eye and numbness in a foot. She searches online and concludes she has MS.",question:"Can a single symptom diagnose MS?",neuroscience:"MS is a demyelinating central nervous system condition diagnosed through clinical and imaging evidence across time and space. Many conditions can mimic it.",learning:"She avoids self-diagnosis, writes down timing and symptoms, and arranges prompt assessment.",care:"A specialist evaluates the eye, neurological findings and any need for imaging and follow-up.",takeaways:["Symptoms are clues, not diagnoses.","Distinct demyelinating disorders require specific treatment."],chapters:[23,54,71]},{id:11,title:"A gardener rebuilding routines after stroke",region:"Accra, Ghana",age:"58 years",tag:"Stroke rehabilitation",background:"After a stroke, Kofi has left hand weakness and fatigue. He wants to return to light garden work.",question:"How can rehabilitation be meaningful?",neuroscience:"Recovery depends on injury, medical care and guided practice. Plasticity is improved by meaningful, repeated tasks with feedback, not rest alone.",learning:"The team and Kofi choose a graded plan for balance, arm use and energy management, with family support and simple tools.",care:"He knows the warning signs of another stroke and the need for regular follow-up.",takeaways:["Rehabilitation should target meaningful participation.","Fatigue and safety should be planned for, not ignored."],chapters:[7,51,76]},{id:12,title:"A student prepared for an EEG",region:"Seoul, South Korea",age:"21 years",tag:"EEG education",background:"Jisoo has a first seizure-like episode and is understandably frightened about an EEG appointment.",question:"What does an EEG actually do?",neuroscience:"EEG records summed scalp electrical activity. It can support epilepsy assessment but is not a mind reader and can be normal between seizures.",learning:"She washes her hair, confirms whether sleep timing or medicines need special instructions and prepares two questions.",care:"She does not stop medications on her own and knows what to do if a seizure occurs.",takeaways:["A test result is part of a clinical picture.","Preparation and questions reduce fear."],chapters:[70,50,69]},{id:13,title:"A runner who feels faint on standing",region:"Berlin, Germany",age:"29 years",tag:"Autonomic health",background:"Sami feels light-headed every time he stands quickly after long training weeks and low fluid intake.",question:"Is this simply a weak nervous system?",neuroscience:"Standing requires baroreflex adjustment of heart rate and vessel tone. Dehydration, fatigue, medication and medical disorders can impair compensation.",learning:"He tracks symptoms and triggers without assuming a diagnosis, and does not use extreme salt or stimulant strategies.",care:"If symptoms persist, medication is involved or fainting causes injury, he seeks assessment.",takeaways:["Autonomic symptoms have many causes.","Extreme self-treatment can be harmful."],chapters:[33,37,40]},{id:14,title:"An architect with dizzy spells",region:"Dubai, United Arab Emirates",age:"44 years",tag:"Balance difficulties",background:"Layla reports brief spinning when rolling over in bed. She has no weakness, hearing loss or speech difficulty.",question:"How can balance symptoms be approached?",neuroscience:"Balance integrates vestibular, visual and proprioceptive signals. Peripheral vestibular conditions can cause position-dependent vertigo, but stroke and other causes must be excluded in the right context.",learning:"She notes exactly what happens, how long it lasts and associated symptoms, and avoids driving while severely dizzy.",care:"A clinician assesses eye movements, hearing and neurological signs and can organise targeted tests or rehabilitation.",takeaways:["Dizziness is a symptom with many causes.","Associated neurological signs change the urgency."],chapters:[27,31,69]},{id:15,title:"A student tests the limits of practice",region:"Rio de Janeiro, Brazil",age:"17 years",tag:"Neuroplasticity",background:"Tiago believes a viral video that promises to 'unlock 100% of the brain' by a special breathing and supplement programme.",question:"How can he evaluate the claim?",neuroscience:"Plasticity requires specific practice and is constrained by health, sleep and biology. Healthy brains already use distributed networks; there is no dormant majority to unlock.",learning:"He compares the claim with sources from NINDS and his teacher, and tests a safer approach: spaced practice and sleep.",care:"He avoids buying unregulated supplements or replacing prescribed care.",takeaways:["Specific training creates specific change.","Slogans about brain percentages are myths."],chapters:[7,8,64]},{id:16,title:"Adapting a kitchen after spinal cord injury",region:"Kampala, Uganda",age:"26 years",tag:"Spinal injury & accessibility",background:"Nadia uses a wheelchair after a road injury. She wants to cook independently in her family home.",question:"What matters beyond medical treatment?",neuroscience:"Spinal cord injury affects movement, sensation and autonomic function. Function also depends on accessible environments, equipment, skills and social support.",learning:"An occupational therapist reviews counter height, reach, safe transfers and emergency plans with Nadia and her family.",care:"She receives bladder and skin care guidance and knows the warning signs of autonomic dysreflexia.",takeaways:["Rehabilitation targets participation and independence.","Accessible design changes what is possible."],chapters:[56,76,77]},{id:17,title:"A new tremor after a prescription",region:"Valencia, Spain",age:"61 years",tag:"Medication effects",background:"Noor develops hand tremor and drowsiness after a new medicine. She stops taking it without telling anyone and feels worse.",question:"What is the safer approach?",neuroscience:"Many medicines can cause neurological symptoms through brain effects, interactions or metabolism. Abrupt withdrawal can itself be harmful.",learning:"She contacts the pharmacist and prescriber, provides a complete medication list and asks about timing and alternatives.",care:"Any change is planned and monitored, and severe reactions prompt urgent care.",takeaways:["Medication effects are real but need proper review.","Do not stop prescribed medicines abruptly."],chapters:[75,48,73]},{id:18,title:"A family supports a child's development",region:"Vancouver, Canada",age:"Family group",tag:"Child development",background:"A four-year-old has repeated ear infections and speech that is hard for others to understand. A relative says she will simply grow out of it.",question:"Which supports are reasonable?",neuroscience:"Hearing and speech develop together. Otitis media can cause temporary hearing difficulty, and persistent speech concerns benefit from assessment rather than blame.",learning:"The family requests a hearing test and records the child's speech in everyday contexts.",care:"A clinician and speech-language therapist coordinate care if needed.",takeaways:["Sensory health supports learning.","Assessment is support, not labelling."],chapters:[62,27,76]},{id:19,title:"Exploring communication technology",region:"Manila, Philippines",age:"47 years",tag:"Assistive technology",background:"After a progressive neurological condition affects speech, a father wants to be understood and to make his own decisions.",question:"What should guide technology choice?",neuroscience:"Communication is a complex cognitive and motor process; disease can affect breathing, articulation or motor control. Preserved skills vary.",learning:"The speech-language therapist tries low-tech symbol boards alongside a speech-generating app, asking the father what he prefers.",care:"The team includes family and avoids assuming capacity based on speech alone.",takeaways:["Technology should be person-led.","Access to communication is a human right."],chapters:[57,76,66]},{id:20,title:"A realistic wellness plan",region:"Bristol, United Kingdom",age:"39 years",tag:"Sustainable habits",background:"Rosa works shifts and cares for a parent. She is overwhelmed by advice to optimise sleep, diet, exercise and supplements simultaneously.",question:"What is a reasonable first step?",neuroscience:"Health foundations interact. Small, consistent changes in sleep timing, movement and diet can support many systems through vascular, metabolic and psychological pathways.",learning:"Rosa chooses one weekly goal, a 15-minute walk after daylight exposure and a review of her medicines with a pharmacist.",care:"She seeks help for persistent low mood or severe symptoms instead of adding unproven products.",takeaways:["Consistency and feasibility beat perfection.","Wellness advice should fit the person's real life."],chapters:[68,79,80]}],hg=ug,Q="15 November 2026",Xt=[{id:"who-epilepsy",org:"World Health Organization",title:"Epilepsy — fact sheet",date:"Current online edition",url:"https://www.who.int/news-room/fact-sheets/detail/epilepsy",topic:"Epilepsy, seizure first aid, global treatment gap",kind:"Public education",jurisdiction:"International",access:Q},{id:"who-headache",org:"World Health Organization",title:"Headache disorders — fact sheet",date:"Current online edition",url:"https://www.who.int/news-room/fact-sheets/detail/headache-disorders",topic:"Migraine and headache burden",kind:"Public education",jurisdiction:"International",access:Q},{id:"who-dementia",org:"World Health Organization",title:"Dementia — fact sheet",date:"Current online edition",url:"https://www.who.int/news-room/fact-sheets/detail/dementia",topic:"Dementia, risk reduction, care",kind:"Public education",jurisdiction:"International",access:Q},{id:"who-stroke",org:"World Health Or c bedtime reminder and reduce late caffeine.",reflection:"What is one barrier to the sleep window?",takeaway:"Consistency supports sleep more than perfect routines.",alt:"Choose a consistent wake time as the first step."},{day:12,week:2,title:"Morning light",objective:"Understand circadian entrainment.",activity:"Get daylight outside or by a window soon after waking for 10 minutes.",reflection:"How did your alertness change?",takeaway:"Light is a powerful circadian cue.",alt:"Sit near a bright window for ten minutes."},{day:13,week:2,title:"Movement mix",objective:"Combine aerobic, strength and balance activity.",activity:"Do 10–20 minutes of feasible movement and plan one balance practice with support.",reflection:"Which activity fits your life best?",takeaway:"Something sustainable beats an ideal programme.",alt:"Do seated mobility or a short walk in place."},{day:14,week:2,title:"Substance risk review",objective:"Reduce harm without shame.",activity:"Review alcohol, tobacco, nicotine and caffeine patterns and identify one support route.",reflection:"What gets easier with confidential support?",takeaway:"Risk reduction is health care, not a moral contest.",alt:"List one free support service or family contact."},{day:15,week:3,title:"Headache red flags",objective:"Distinguish common headache patterns from emergencies.",activity:"Write the red flags from Chapter 49 onto an emergency card.",reflection:"Which red flag would you act on fastest?",takeaway:"New or sudden severe headache needs urgent assessment.",alt:"Highlight red flags in the chapter text."},{day:16,week:3,title:"Seizure first aid drill",objective:"Practise safe support.",activity:"Role-play protecting the head, moving hazards and timing a seizure.",reflection:"Which harmful myth can you now correct?",takeaway:"Never restrain or place objects in the mouth.",alt:"Read the sequence aloud three times."},{day:17,week:3,title:"FAST practice",objective:"Recall stroke warning signs and action.",activity:"Recite FAST and save the local emergency number.",reflection:"What would you need to note for emergency responders?",takeaway:"Time of onset is important information.",alt:"Write FAST on a card in your preferred language."},{day:18,week:3,title:"Injury prevention sweep",objective:"Reduce a real injury risk.",activity:"Check one route or room for trip, road or collision hazards.",reflection:"What is the easiest fix you can make?",takeaway:"Prevention is practical and environmental.",alt:"Ask a family member to join the audit by phone."},{day:19,week:3,title:"Investigation literacy",objective:"Understand tests as tools with limits.",activity:"Pick EEG, MRI or nerve conduction and write one strength and one limitation.",reflection:"Why can a test be normal despite symptoms?",takeaway:"Results need clinical context.",alt:"Read the relevant chapter summary."},{day:20,week:3,title:"Evidence check",objective:"Evaluate a health claim.",activity:"Use the six questions from Chapter 8 on one advertisement.",reflection:"Which evidence was missing?",takeaway:"Let the claim meet the evidence, not the reverse.",alt:"Discuss the ad with someone you trust."},{day:21,week:3,title:"Care-access questions",objective:"Prepare for communication with a clinician.",activity:"Write three questions for a future appointment.",reflection:"What would make it easier to raise concerns?",takeaway:"Preparation supports agency and clarity.",alt:"Draft one question and save it on your phone."},{day:22,week:4,title:"Plasticity in practice",objective:"Apply spaced practice and feedback.",activity:"Practise a skill for 15 minutes and schedule a second session.",reflection:"Which part needs feedback rather than repetition?",takeaway:"Specific practice shapes specific circuits.",alt:"Break the skill into three small steps."},{day:23,week:4,title:"Learn after sleeping",objective:"Connect sleep and consolidation.",activity:"Review a new concept after sleep and note what stuck.",reflection:"What changed after a night's sleep?",takeaway:"Sleep is part of the learning cycle.",alt:"Re-read a chapter summary after waking."},{day:24,week:4,title:"Later-life brain health",objective:"Recognise supports and treatable concerns.",activity:"Review hearing, blood pressure, sleep, medicines and social connection in your context.",reflection:"Which factor deserves a professional review?",takeaway:"Need for support is not a personal failure.",alt:"List supportive services in your community."},{day:25,week:4,title:"Neurodiversity respect",objective:"Practise accessible, respectful language.",activity:"Identify one environmental accommodation that reduces a barrier.",reflection:"How does environment change participation?",takeaway:"Difference deserves dignity and support.",alt:"Read one first-person account of a neurodivergent experience."},{day:26,week:4,title:"Rehabilitation and assistance",objective:"See function and participation as the goal.",activity:"Choose one assistive tool or accessible service and describe what it enables.",reflection:"What tool would remove a barrier in your daily life?",takeaway:"Assistance is a tool, not a failure.",alt:"Explore an assistive technology catalogue."},{day:27,week:4,title:"Falls and balance review",objective:"Reduce injury risk and support mobility.",activity:"Check lighting, footwear, rails and vision; do a safe balance move near support.",reflection:"Which change will you make first?",takeaway:"Falls risk is modifiable and deserves attention.",alt:"Review your home route while seated."},{day:28,week:4,title:"Emergency plan",objective:"Know how to get help quickly.",activity:"Save emergency contacts, the FAST signs and seizure first-aid steps where accessible.",reflection:"Who would you contact if a family member became confused suddenly?",takeaway:"Preparation can reduce delay and fear.",alt:"Ask a household member to review the plan with you."},{day:29,week:4,title:"Teach it back",objective:"Strengthen knowledge by explaining it.",activity:"Explain one concept from the book to another person or a voice note.",reflection:"What did you explain clearly?",takeaway:"Teaching reveals gaps gently.",alt:"Write a three-sentence explanation."},{day:30,week:4,title:"Build the personal plan",objective:"Choose one goal in learning, health, safety and care.",activity:"Complete Worksheet 20 and set a review date.",reflection:"What will make the plan realistic next month?",takeaway:"A plan supports action; it does not diagnose or guarantee outcomes.",alt:"Choose one priority for the next month."}],tm=[{week:1,title:"Understand your nervous system",focus:"Anatomy, communication, senses and reflexes"},{week:2,title:"Support the foundations",focus:"Nutrition, sleep, movement, hydration and substances"},{week:3,title:"Understand and protect",focus:"Conditions, safety, emergencies, tests and information"},{week:4,title:"Build long-term knowledge",focus:"Plasticity, ageing, diversity, care and planning"}],hr=[{id:"r01",category:"Anatomy",q:"Which structures make up the central nervous system?",options:["The brain and spinal cord","The cranial and spinal nerves","The enteric and sympathetic systems","The heart and lungs"],a:0,why:"The central nervous system comprises the brain and spinal cord. Peripheral nerves, ganglia and autonomic/enteric networks are outside the central axis, though they connect with it."},{id:"r02",category:"Anatomy",q:"Which cerebral lobe lies mainly behind the central sulcus and contains the primary somatosensory cortex?",options:["Frontal lobe","Parietal lobe","Temporal lobe","Occipital lobe"],a:1,why:"The postcentral gyrus of the parietal lobe receives somatic sensory input. The frontal lobe lies anterior to the central sulcus, the temporal lobe is lateral and the occipital lobe is posterior."},{id:"r03",category:"Anatomy",q:"Which brain structure connects the two cerebral hemispheres?",options:["The corpus callosum","The cerebellum","The medulla oblongata","The pituitary gland"],a:0,why:"The corpus callosum is a large white-matter tract linking the hemispheres. The cerebellum supports coordination, the medulla is part of the brainstem and the pituitary is an endocrine gland."},{id:"r04",category:"Anatomy",q:"The layer of protective membranes around the brain and spinal cord is called the:",options:["Meninges","Myelin","Cortex","Perineurium only"],a:0,why:"The meninges consist of the dura, arachnoid and pia mater. Myelin insulates axons, the cortex is outer brain tissue and perineurium is connective tissue around peripheral nerve fascicles."},{id:"r05",category:"Anatomy",q:"Where are the cell bodies of most sensory neurons that enter the spinal cord located?",options:["In the ventral horn","In the dorsal root ganglion","In the cerebellum","In the motor cortex"],a:1,why:"Sensory neuron cell bodies are typically in dorsal root ganglia. Ventral horns contain motor neurons, while the cerebellum and motor cortex serve other functions."},{id:"r06",category:"Anatomy",q:"Which brain region is especially important for balance, timing and error-based motor correction?",options:["Cerebellum","Hippocampus","Olfactory bulb","Occipital cortex"],a:0,why:"The cerebellum integrates sensory feedback and helps calibrate timing and accuracy. The hippocampus is mainly memory-related, and the olfactory bulb and occipital cortex serve smell and vision."},{id:"r07",category:"Physiology",q:"What mainly maintains the resting membrane potential of a neuron?",options:["Rapid action potentials","Ion gradients and selective membrane permeability","The presence of myelin alone","Neurotransmitter vesicles in the blood"],a:1,why:"Differences in ion concentration, pumps such as Na⁺/K⁺-ATPase and selective leak permeability establish the resting voltage. Myelin affects conduction speed but is not the main source of the potential."},{id:"r08",category:"Physiology",q:"During an action potential, rapid depolarisation is caused mainly by:",options:["Potassium leaving the cell","Sodium entering the cell through voltage-gated channels","Calcium entering the nucleus","Chloride entering the axon"],a:1,why:"Voltage-gated sodium channels open at threshold, allowing Na⁺ influx and depolarisation. K⁺ efflux contributes importantly to repolarisation."},{id:"r09",category:"Physiology",q:"What does the absolute refractory period prevent?",options:["Another action potential immediately after the first","Neurotransmitter synthesis forever","Oxygen delivery to the neuron","Sensory input from reaching the brain"],a:0,why:"During the absolute refractory period, sodium channels are inactivated and another action potential cannot be generated. This helps set the maximum firing rate and direction of propagation."},{id:"r10",category:"Signalling",q:"What usually triggers neurotransmitter vesicle release at a chemical synapse?",options:["Calcium entry into the presynaptic terminal","Potassium entry into the postsynaptic cell","Direct contact with myelin","Glucose leaving the synaptic cleft"],a:0,why:"An arriving action potential depolarises the terminal, opening voltage-gated calcium channels. Calcium entry promotes vesicle fusion and transmitter release."},{id:"r11",category:"Signalling",q:"Which is the main fast inhibitory neurotransmitter in the adult central nervous system?",options:["Glutamate","GABA","Dopamine","Acetylcholine"],a:1,why:"GABA is the main fast inhibitory transmitter in the adult CNS. Glutamate is the main fast excitatory transmitter; dopamine and acetylcholine are mainly modulatory in many circuits."},{id:"r12",category:"Signalling",q:"Which cells form myelin in the central nervous system?",options:["Schwann cells","Oligodendrocytes","Microglia","Astrocytes"],a:1,why:"Oligodendrocytes myelinate central axons, and one cell can wrap several. Schwann cells do this in the peripheral nervous system, while microglia are immune cells and astrocytes provide diverse support."},{id:"r13",category:"Sensory",q:"Where does visual information from the right visual field of both eyes ultimately project in the brain?",options:["The right occipital cortex","The left occipital cortex","The cerebellum","The olfactory bulb"],a:1,why:"Fibres cross at the optic chiasm so visual field information is represented in the opposite hemisphere. The left hemisphere processes the right visual field."},{id:"r14",category:"Sensory",q:"Which inner-ear structure is primarily responsible for detecting sound?",options:["The cochlea","The semicircular canals","The otolith organs","The Eustachian tube"],a:0,why:"The cochlea converts sound vibration into neural signals. Semicircular canals and otolith organs are vestibular, and the Eustachian tube helps equalise pressure."},{id:"r15",category:"Sensory",q:"Which pair are established basic taste qualities?",options:["Sweet and sour","Spicy and fatty","Metallic and cool","Crisp and smooth"],a:0,why:"Sweet, sour, salty, bitter and umami are the five established basic tastes. Spicy, fatty, metallic, cool, crisp and smooth involve other receptors and sensations."},{id:"r16",category:"Sensory",q:"What is allodynia?",options:["Pain from a stimulus that normally does not cause pain","Complete loss of all sensation","An increase in visual acuity","A reflex movement of the pupil"],a:0,why:"Allodynia is pain evoked by a normally innocuous stimulus, such as light touch. It reflects altered sensory processing, not a psychological weakness."},{id:"r17",category:"Movement",q:"Which structure directly innervates skeletal muscle at the neuromuscular junction?",options:["Upper motor neuron","Lower motor neuron","Oligodendrocyte","Photoreceptor"],a:1,why:"Lower motor neurons have axons that terminate on skeletal muscle. Upper motor neurons influence them through descending pathways but do not directly synapse on muscle."},{id:"r18",category:"Movement",q:"A stretch reflex such as the knee jerk is initiated by receptors detecting:",options:["Muscle stretch","Blood glucose","Light intensity","Sound frequency"],a:0,why:"Muscle spindles detect stretch and activate sensory pathways that trigger a motor response. The other options are unrelated senses or metabolic signals."},{id:"r19",category:"Autonomic",q:"Which division increases heart rate and airway relaxation during a challenge?",options:["Parasympathetic","Sympathetic","Enteric only","Somatic sensory"],a:1,why:"Sympathetic activity typically increases heart rate and relaxes airways, supporting alertness and physical readiness. Parasympathetic activity typically slows the heart and supports digestion."},{id:"r20",category:"Autonomic",q:"What do baroreceptors detect?",options:["Stretch in large blood vessels","Light entering the eye","Odour molecules","Muscle length"],a:0,why:"Baroreceptors in the carotid sinus and aortic arch detect vessel stretch and help regulate blood pressure. Photoreceptors, olfactory receptors and muscle spindles serve different senses."},{id:"r21",category:"Autonomic",q:"Which hormone is released by the adrenal cortex as part of the HPA stress axis?",options:["Cortisol","Insulin","Melatonin","Adrenaline only"],a:0,why:"The HPA axis ends with cortisol release from the adrenal cortex. Adrenaline comes mainly from the adrenal medulla, while insulin and melatonin have other roles."},{id:"r22",category:"Autonomic",q:"Which network can coordinate gut motility locally even when disconnected from the brain?",options:["The enteric nervous system","The optic pathway","The corticospinal tract","The vestibular system"],a:0,why:"The enteric nervous system contains local sensory, interneuron and motor circuits that regulate gut function. The other structures serve vision, movement and balance."},{id:"r23",category:"Nutrition",q:"Which nutrient is most directly associated with preventing neural tube defects when taken around conception?",options:["Folate","Vitamin E","Sodium","Caffeine"],a:0,why:"Folate is essential for early neural tube development and supplementation around conception reduces risk. It does not guarantee every developmental outcome, and other nutrients have different roles."},{id:"r24",category:"Nutrition",q:"Which nutrient is essential for thyroid hormone production and fetal brain development?",options:["Iodine","Magnesium","Vitamin C","Fibre"],a:0,why:"Iodine is required for thyroid hormones, which are critical for brain development. Requirements and fortification policies vary by region."},{id:"r25",category:"Nutrition",q:"High-dose vitamin B6 taken long term has been associated with which adverse effect?",options:["Peripheral neuropathy","Improved night vision","Guaranteed nerve repair","Permanent loss of taste"],a:0,why:"Excess B6 can cause sensory peripheral neuropathy. This illustrates why 'more is better' is not a safe assumption for micronutrients."},{id:"r26",category:"Sleep",q:"A circadian rhythm is best described as:",options:["An approximately 24-hour biological timing cycle","A reflex that controls pupil size","A type of white blood cell","The speed of an action potential"],a:0,why:"Circadian rhythms are internally generated approximately daily cycles, entrained by light and other cues. They influence sleep, temperature, hormones and alertness."},{id:"r27",category:"Sleep",q:"Which statement about sleep and memory is best supported?",options:["Sleep contributes to the consolidation of some memories","Sleep has no relationship to memory","A single supplement can replace sleep","Dreaming erases all new learning"],a:0,why:"Sleep supports attentional restoration and the consolidation of some memory types. It cannot be replaced by supplements, and dreaming does not erase learning."},{id:"r28",category:"Conditions",q:"Which headache feature is a red flag requiring urgent assessment?",options:["A familiar mild headache","A sudden maximal headache reaching peak intensity within a minute","A headache after a long screen session","Mild headache that improves with rest"],a:1,why:"A thunderclap headache can indicate subarachnoid haemorrhage or another serious cause. Familiar mild patterns may need review if they change, but do not carry the same immediate red flag."},{id:"r29",category:"Conditions",q:"Which is the correct immediate response if you suspect a stroke?",options:["Wait one hour to see if symptoms resolve","Call emergency services immediately and note the onset time","Give aspirin and food","Drive yourself to a routine appointment"],a:1,why:"Stroke care is time-sensitive. Call emergency services, note the time symptoms began and avoid food/drink or self-administered medicines before assessment."},{id:"r30",category:"Conditions",q:"What should you do during a tonic-clonic seizure?",options:["Restrain the limbs","Place an object in the mouth","Protect the head and environment, and time the seizure","Give water immediately"],a:2,why:"The safest response is to prevent injury, avoid restraint and objects in the mouth, and time the event. Food or drink should be given only after full recovery."},{id:"r31",category:"Conditions",q:"Which statement about Parkinson's disease is accurate?",options:["It always causes tremor","It can affect movement, sleep, mood, smell and digestion","It is diagnosed by a single routine blood test","It only affects people over 80"],a:1,why:"Parkinson's disease is multisystem and includes non-motor features. Not everyone has tremor, diagnosis is clinical and onset can occur before old age."},{id:"r32",category:"Conditions",q:"Which condition is an immune-mediated demyelinating disease of the central nervous system?",options:["Multiple sclerosis","Myasthenia gravis","Carpal tunnel syndrome","Essential tremor"],a:0,why:"MS affects central myelin, while myasthenia gravis targets the neuromuscular junction. Carpal tunnel is peripheral compression and essential tremor is a movement disorder."},{id:"r33",category:"Conditions",q:"What is the main distinction between seizures and epilepsy?",options:["A seizure is an event; epilepsy is defined by recurrent unprovoked seizures or high risk","They are identical terms","Epilepsy is always caused by flashing lights","A seizure is always psychogenic"],a:0,why:"A seizure is a transient event of abnormal activity. Epilepsy is a condition associated with recurrent unprovoked seizures or a persistently high risk of them."},{id:"r34",category:"Investigations",q:"Which imaging test is often selected first in an acute head injury because it is fast and detects bleeding?",options:["EEG","CT scan","Nerve conduction study","Bone density scan"],a:1,why:"CT is fast, widely available and sensitive to acute haemorrhage and fracture. EEG measures electrical activity, and the other tests are unrelated to structural trauma."},{id:"r35",category:"Investigations",q:"A routine EEG is most likely to be normal in a person with epilepsy when:",options:["It is recorded between seizures","The person is asleep","The electrodes are attached correctly","The person has any type of epilepsy"],a:0,why:"EEG can be normal between seizures, especially with a routine recording. Sleep and activation methods may improve sensitivity but do not guarantee an abnormal result."},{id:"r36",category:"Investigations",q:"Which test helps assess peripheral nerve conduction and muscle electrical activity?",options:["MRI of the brain","Nerve conduction studies and EMG","Lumbar puncture only","Fundoscopy"],a:1,why:"Nerve conduction studies measure peripheral nerve signalling and EMG measures muscle electrical activity. MRI of the brain, lumbar puncture and fundoscopy answer different clinical questions."},{id:"r37",category:"Investigations",q:"Why is a lumbar puncture not performed without considering raised intracranial pressure?",options:["CSF cannot be analysed in most laboratories","Pressure changes can rarely contribute to dangerous brain herniation","It always causes infection","It cannot be performed after age 50"],a:1,why:"When pressure is dangerously raised, removing CSF may contribute to herniation. Clinicians assess for contraindications and may perform imaging or fundoscopy first."},{id:"r38",category:"Evidence & safety",q:"Which statement is the most scientifically cautious?",options:["A supplement is safe because it is natural","A treatment's benefits and harms should be assessed using controlled human evidence","A single testimonial proves effectiveness","An animal study is always sufficient for clinical decisions"],a:1,why:"Natural origin does not prove safety or efficacy. Controlled human studies and systematic reviews are more reliable for treatment decisions; anecdotes and isolated animal experiments are not enough."},{id:"r39",category:"Evidence & safety",q:"Which symptom combination should prompt urgent assessment for meningitis in a location with emergency services available?",options:["Mild runny nose and sneezing","Fever, severe headache, neck stiffness and confusion","A dry cough without fever","Chronic knee pain"],a:1,why:"Fever with severe headache, neck stiffness and altered awareness can indicate meningitis or encephalitis and requires emergency assessment. Mild cold symptoms and knee pain do not match this pattern."},{id:"r40",category:"Evidence & safety",q:"Which is an appropriate way to use this book?",options:["To diagnose your own neurological condition without a clinician","As an educational support for learning and preparing informed questions","To replace emergency services when stroke symptoms occur","To stop prescribed medication when you feel better"],a:1,why:"The book is education, not diagnosis or treatment. It supports learning and communication with qualified professionals, and emergencies should always be handled by local emergency services."}];function Fg(){const{state:c,completion:p,hasProgress:x,toggleComplete:h}=La(),k=Math.min(80,Math.max(1,c.lastChapter||1)),S=x?c.completed.length>=80?1:De.find(g=>!c.completed.includes(g.id))?.id||k:k;return a.jsxs("main",{id:"main",children:[a.jsxs("section",{className:"relative overflow-hidden border-b border-line bg-surface",children:[a.jsx("div",{class
