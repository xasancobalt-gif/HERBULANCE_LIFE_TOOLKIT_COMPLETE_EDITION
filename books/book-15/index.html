e, which can cause earlier evening tiredness and early waking."],[31,"SC","A person snores loudly with pauses in breathing and feels sleepy during the day. What is the best step?",["Ignore it","Discuss assessment for possible sleep apnoea with a clinician","Start sleeping tablets","Drink alcohol to help sleep"],1,"Loud snoring with breathing pauses and daytime sleepiness may indicate sleep apnoea, which can be treated once diagnosed."],[32,"MC","Which hormone system releases cortisol during stress?",["The thyroid system","The HPA axis","The digestive system","Immune memory"],1,"The hypothalamic–pituitary–adrenal (HPA) axis releases cortisol, which mobilises energy and helps regulate inflammation."],[32,"MF","Relaxation techniques cure depression.",za,0,"Relaxation can reduce stress symptoms, but it is not a cure for depression. Depression is treated with appropriate professional care."],[33,"SC","An older adult has withdrawn, sleeps poorly and says life feels hopeless for three weeks. What is the best next step?",["Wait for the feeling to pass without support","Arrange a professional mental-health assessment through the primary-care team","Start a new hobby alone and say nothing","Increase alcohol to cope"],1,"Persistent low mood and hopelessness are treatable. A professional assessment is the right step."],[33,"TF","Loneliness and living alone are the same thing.",Ra,1,"Loneliness is a subjective feeling that relationships are insufficient. Some people who live alone feel connected, and some people who live with others feel lonely."],[34,"MC","Which statement best describes the evidence linking social relationships with survival?",["Observational meta-analyses show an association, but causation is not proven","Trials prove that making friends extends life","It is entirely unrelated to health","It applies only to animals"],0,"Meta-analyses of observational studies show consistent associations. Causation is not established, and health can also influence relationships."],[35,"MC","Which approach is most inclusive of spiritual and philosophical wellbeing?",["Assume everyone shares one religion","Recognise diverse beliefs, including non-religious approaches","Discuss faith only in healthcare settings","Avoid all discussion of meaning"],1,"Meaning can come from many sources. Inclusive approaches respect diverse beliefs, including the absence of religious belief."],[36,"PD","A family plans a move to be closer to a relative. What should they consider first?",["Only the price of the house","Local health services, transport, accessibility and the older person’s own preferences","Nothing, because moving is always beneficial","Only the weather"],1,"Relocation affects access to healthcare, social networks and independence, so preferences and local services should be considered first."],[36,"MC","Which kind of document can allow a person to appoint someone to make decisions on their behalf in many countries?",["A recipe book","A power of attorney or similar legal document","A library card","A gym membership"],1,"Powers of attorney and similar instruments exist in many countries, but the rules differ. Seek advice from a qualified legal professional."],[37,"MC","Why do screening schedules differ between countries?",["Screening is identical everywhere","Guidelines reflect evidence, health-system capacity, costs and local disease patterns","Only doctors’ personal preferences matter","Screening is only for men"],1,"Recommendations reflect evidence and local circumstances, so ages, intervals and tests vary between health systems."],[37,"TF","A positive screening result means a person definitely has the disease.",Ra,1,"A positive screening result means further tests are needed. Many positive results do not turn out to be disease."],[38,"MC","Which approach is most useful for checking blood pressure over time?",["A single reading in a clinic","Repeated measurements with correct technique, including validated home readings","Pulse rate only","Weight alone"],1,"Patterns over time, measured correctly, are more informative than a single reading."],[38,"SC","A home blood-pressure device gives a high reading. What is the best response?",["Change medicines immediately","Repeat the reading with correct technique and discuss the pattern with a clinician","Ignore it because devices are always wrong","Exercise intensely to lower it"],1,"Repeat readings with correct technique and share the pattern with a clinician. Do not change medicines without advice."],[39,"MC","Which eye condition can progress without early symptoms and needs regular monitoring?",["Glaucoma","Presbyopia","Hay fever","Conjunctivitis"],0,"Glaucoma can damage the optic nerve without early symptoms, which is why regular eye examinations are important."],[39,"SC","A person suddenly loses vision in one eye. What should they do?",["Wait a week for an appointment","Seek urgent assessment the same day","Use home remedies","Rub the eye"],1,"Sudden vision loss is an urgent warning sign and should be assessed the same day."],[40,"MC","What is polypharmacy?",["Taking one medicine for a long time","Taking several regular medicines, which increases the risk of interactions and side effects","Using only herbal products","Taking medicines only at weekends"],1,"Polypharmacy means taking several medicines. The more medicines a person takes, the greater the chance of interactions and side effects."],[40,"PD","A person wants to stop a prescribed blood-pressure medicine because they feel well. What is the best advice?",["Stop it immediately","Discuss the decision with the prescriber before changing treatment","Take double doses to make up for it","Stop all medicines"],1,"Feeling well does not always mean the medicine is no longer needed. Changes should be planned with the prescriber."],[41,"MC","Which approach best protects skin from ultraviolet damage?",["Using tanning oils only","Combining shade, clothing, hats and broad-spectrum sunscreen","Staying in the sun for longer","Avoiding outdoor activity at night only"],1,"Protection works best when several measures are combined, and it matters on cloudy days too."],[41,"MF","Sitting next to a window gives no UV exposure.",za,0,"UVA passes through window glass, so some UV exposure can occur indoors near windows, although UVB is largely blocked."],[41,"SC","A mole has changed shape and colour over the past month. What should be done?",["Ignore it for six months","Arrange a prompt clinical assessment","Apply a home remedy","Cover it with make-up"],1,"Changing moles need prompt clinical assessment, because early evaluation improves outcomes."],[42,"MC","What is immunosenescence?",["Age-related changes in immune function","A type of vaccine","A medicine for infections","A diet for immunity"],0,"Immunosenescence describes the age-related changes in immune responses. It helps explain why infections can be more serious in later life."],[42,"MF","A particular supplement guarantees protection from infection in older adults.",za,0,"No food or supplement has been shown to reliably prevent infection in healthy older adults. Vaccination and hygiene have stronger evidence."],[43,"MC","What is multimorbidity?",["A single rare disease","Two or more long-term conditions","A form of dementia","Taking many medicines only"],1,"Multimorbidity means having two or more long-term conditions, which is common in later life."],[43,"MC","Which team member can help with daily-living adaptations and home-based function?",["Occupational therapist","Car mechanic","Accountant only","Cook only"],0,"Occupational therapists assess function and recommend practical adaptations for daily living."],[44,"PD","During a difficult week, which routine is best?",["Abandon all routines","Keep the minimum viable routine until you can return to the full plan","Follow the full plan despite illness","Start a brand-new full plan"],1,"A minimum routine keeps progress going and makes it easier to return to the full plan."],[45,"MC","Which statement reflects the WHO view on ageism?",["Age stereotypes are harmless","Age-based stereotypes can lead to discrimination in healthcare and other areas","Older adults cannot learn new skills","Ageism affects only workplaces"],1,"The WHO Global report on ageism (2021) documents how stereotypes can cause discrimination across many domains of life."],[46,"MC","What does the social model of disability emphasise?",["Disability is caused only by medical conditions","Barriers in environments, attitudes and systems disable people","Disability requires treatment only","Disabled people cannot make decisions"],1,"The social model recognises that barriers in the environment and society contribute to disability and can be reduced."],[47,"SC","A caregiver feels exhausted and has neglected their own health. What is the most appropriate step?",["Keep going without help","Seek respite, support services and a check of their own health","Stop caring immediately without planning","Ignore the symptoms"],1,"Caregivers need support and their own health care. Planned respite and services protect both the caregiver and the person receiving care."],[48,"MC","Which change most directly reduces bathroom slip risk?",["Removing grab rails","Adding grab rails and non-slip surfaces","Leaving floors wet","Using loose rugs"],1,"Grab rails and non-slip surfaces reduce the risk of slipping, particularly around the bath, shower and toilet."],[49,"MC","Which statement about the determinants of health is most accurate?",["Health depends only on personal choice","Health is shaped by social, economic and environmental conditions","Health is unrelated to income","Health depends only on genetics"],1,"The WHO Commission on Social Determinants of Health emphasised that health reflects the conditions in which people live and age."],[50,"MF","All people within a particular culture share the same views about ageing.",za,0,"Cultures contain great diversity. Individual values, experiences and preferences differ, so respectful care involves asking people directly."],[51,"MC","Which study design is strongest for testing whether an intervention causes an outcome?",["Animal study","Randomised controlled trial","Anecdote","Case report"],1,"Randomised controlled trials allocate participants by chance and are the strongest design for testing causal effects."],[52,"MC","What does reliability mean for a biological-age test?",["It gives consistent results when repeated under the same conditions","It is inexpensive","It is always clinically useful","It matches chronological age exactly"],0,"Reliability is consistency. A test can be reliable and still lack validity or clinical usefulness."],[53,"MC","Which statement about metformin and ageing is most accurate?",["It is approved for healthy ageing","It is an established diabetes medicine, and its use for ageing remains under research","It has been proven to extend human life","It is a dietary supplement"],1,"Metformin is approved for type 2 diabetes. Its use to slow ageing is still being researched, and no trial has yet shown efficacy for that purpose."],[53,"MC","Why are animal lifespan results not automatically applicable to people?",["Animals are never studied","Species differ, and laboratory results may not translate to people","Animals do not age","Animal studies are always fraudulent"],1,"Animal studies generate hypotheses, but biology differs between species and results must be tested in humans."],[54,"MC","Which habit is consistently linked with the greatest health benefit across many studies?",["Avoiding tobacco","Taking a single high-dose vitamin","Using anti-ageing creams","Sleeping only during the day"],0,"Avoiding tobacco is one of the most important actions for health at any age, with strong and consistent evidence."],[55,"PD","When creating a personal plan, how many habits should you start with?",["Ten at once","One to three","None","Every habit recommended by a website"],1,"Starting with one to three habits is manageable and makes success more likely. Habits can be added gradually."],[55,"TF","A personal plan should be reviewed only once a year.",Ra,1,"Habits benefit from monthly review, function and wellbeing from quarterly review, and the whole plan should be revisited when circumstances change."],[56,"SC","Why are the case studies in this book described as fictional?",["To hide real patients","To illustrate principles without presenting them as testimonials or evidence","Because they are advertisements","Because they have been proven false"],1,"The cases are teaching tools. They are not testimonials, clinical evidence or predictions."],[57,"MC","Which balanced-plate proportion is commonly suggested?",["Mostly meat","About half vegetables and fruit, a quarter wholegrain and a quarter protein","Only sweet foods","Only liquids"],1,"This simple pattern is widely used in national and international plate guides, and it can be adapted to culture and budget."],[58,"SC","On a challenge day, you feel unwell. What is the best option?",["Complete the hardest task anyway","Choose the rest or gentle recovery option, and speak with a clinician if symptoms are concerning","Skip water for the day","Double the next day’s tasks"],1,"The challenge includes rest and recovery options. Health comes first, and concerning symptoms need professional advice."],[59,"MC","What is the purpose of a minimum viable routine?",["To prevent any rest","To keep progress going during difficult periods","To replace professional care","To guarantee a longer life"],1,"A minimum routine helps people keep their habits alive during hard periods, without expecting perfection."],[60,"MC","Which statement reflects the book’s final message?",["Ageing must be defeated","Ageing is a natural part of life, and the goal is to support health, dignity and meaningful living","Only young people can be healthy","Healthy ageing is measured by appearance"],1,"Healthy ageing is about function, dignity, relationships and meaning, not about fighting time or achieving a number."],[13,"SC","A family wants to follow a Mediterranean-style pattern on a limited budget. Which approach fits best?",["Buy only imported olive oil and expensive fish","Build meals around affordable legumes, vegetables, whole grains and tinned fish, adapted to local foods","Avoid all vegetables","Eat only nuts"],1,"Dietary patterns can be adapted to budgets and local food traditions. The principles matter more than specific products."],[20,"TF","Tai chi and balance training have evidence for reducing falls in some older adults.",Ra,0,"Balance and multicomponent exercise programmes, including tai chi, have evidence for reducing falls in some older adults."],[36,"MF","Once a legal document is signed, it never needs to be reviewed.",za,0,"Life circumstances and laws change. Legal and advance planning documents should be reviewed regularly with qualified advice."],[52,"MF","A single biological-age score determines a person’s future health.",za,0,"No single score can describe a person’s health. Clinical assessment and functional measures give a fuller picture."]],cn=Oy.map(([l,m,u,p,y,g],k)=>({id:`q${String(k+1).padStart(3,"0")}`,ch:l,kind:By[m],q:u,o:p,a:y,e:g})),$m=[["Ageing terminology","Lifespan","The total number of years a person lives."],["Ageing terminology","Healthspan","The number of years lived in good health, with good physical, cognitive and emotional function."],["Ageing terminology","Longevity","Long life, studied at individual or population level. It does not describe a guaranteed duration."],["Ageing terminology","Chronological age","The number of years since birth. It is a precise count."],["Ageing terminology","Biological age","An estimate of how far the body has aged relative to peers. It has no single agreed measurement."],["Ageing terminology","Functional ability","The capacity to carry out the tasks needed and wanted in daily life."],["Ageing terminology","Multimorbidity","Having two or more long-term conditions at the same time."],["Ageing terminology","Compression of morbidity","A hypothesis that delaying disability can shorten the period of illness before death. It must be tested."],["Biology","Hallmarks of ageing","A research framework of interconnected processes, such as DNA damage, senescence and inflammation."],["Biology","Cellular senescence","A state in which cells stop dividing but remain alive and can release inflammatory signals."],["Biology","Telomere","A protective cap at the end of a chromosome that shortens as cells divide."],["Biology","Autophagy","A cellular recycling process that breaks down and reuses damaged components."],["Biology","Mitochondria","Structures inside cells that produce most of the cell’s usable energy."],["Biology","Immunosenescence","Age-related changes in immune function that can make responses slower or weaker."],["Biology","Epigenetics","Chemical changes that influence which genes are switched on or off, without changing the DNA sequence."],["Nutrition","Nutrient density","The amount of nutrients a food provides relative to its energy content."],["Nutrition","Dietary Reference Intake","A set of nutrient reference values used by US and Canadian authorities, which vary by age and sex."],["Nutrition","Food-first approach","Meeting nutrient needs mainly through varied foods, with supplements used when a specific need is confirmed."],["Nutrition","Free sugars","Sugars added to foods and drinks, plus those naturally present in honey, syrups and fruit juices."],["Nutrition","Vitamin B12","A vitamin needed for nerves and red blood cells. Absorption from food can decline with age."],["Nutrition","Vitamin D","A vitamin that supports calcium absorption and bone and muscle health. Sunlight is a major source."],["Nutrition","Hydration","Maintaining enough body water from drinks and food, which can be harder to judge when thirst is less noticeable."],["Muscle and bone","Sarcopenia","Age-related loss of muscle strength, quantity or quality, assessed with defined steps."],["Muscle and bone","Muscle protein synthesis","The process by which the body builds new muscle proteins, which responds to protein and resistance exercise."],["Muscle and bone","Bone remodelling","The continuous process in which osteoclasts break down bone and osteoblasts build it up."],["Muscle and bone","Peak bone mass","The highest level of bone density typically reached in early adulthood."],["Muscle and bone","T-score","A bone density comparison with a healthy young adult. A score of -2.5 or lower is used in many guidelines to define osteoporosis."],["Muscle and bone","Resistance training","Exercise that works muscles against a force, such as body weight, bands or weights."],["Muscle and bone","Five-times sit-to-stand test","A simple measure of lower-body strength and function, timing five chair rises."],["Brain health","Neuroplasticity","The brain’s capacity to change its connections and function in response to experience."],["Brain health","Cognitive reserve","The brain’s ability to tolerate damage or change without symptoms, often through alternative networks."],["Brain health","Mild cognitive impairment","Measurable cognitive decline with preserved independence. Not everyone with it develops dementia."],["Brain health","Dementia","A syndrome of progressive decline in memory and other cognitive abilities that affects daily functioning."],["Brain health","Delirium","A sudden, fluctuating change in attention and awareness, usually caused by an acute illness or medicine and needing urgent assessment."],["Brain health","Retrieval practice","Learning by trying to recall information before checking, which strengthens memory."],["Brain health","Hippocampus","A brain structure central to forming new memories."],["Brain health","Brain-training claims","Gains from commercial brain-training games usually apply to the trained tasks, and broad protection from dementia is not established."],["Sleep","Sleep architecture","The pattern of sleep stages across a night, including light sleep, deep sleep and REM sleep."],["Sleep","Circadian rhythm","The roughly 24-hour internal clock that regulates sleep, hormones and alertness."],["Sleep","Advanced sleep phase","A tendency to fall asleep and wake earlier, which is common in later life."],["Sleep","Sleep apnoea","A condition in which breathing repeatedly pauses during sleep, often with loud snoring and daytime sleepiness."],["Sleep","Nocturia","Waking at night to pass urine, which can disturb sleep and has many possible causes."],["Sleep","CBT-I","Cognitive behavioural therapy for insomnia, often recommended as a first-line approach for persistent sleep problems."],["Prevention","Screening","Testing for disease in people without symptoms, weighing benefits against harms."],["Prevention","Overdiagnosis","Detection of a condition that would never have caused symptoms or harm during a person’s life."],["Prevention","Shared decision-making","A process in which clinicians and patients weigh options, risks and values together."],["Prevention","Polypharmacy","Taking several regular medicines, which increases the risk of side effects and interactions."],["Prevention","Medication review","A structured check of whether each medicine is needed, appropriate and safe."],["Prevention","Herd protection","Community protection that occurs when enough people are vaccinated to reduce the spread of an infectious disease."],["Longevity research","Randomised controlled trial","A study that allocates participants by chance to compare an intervention with a control, the strongest design for testing cause and effect."],["Longevity research","Observational study","A study that records exposures and outcomes without assigning treatment. It can show associations but not prove causation."],["Longevity research","Confounder","A factor associated with both an exposure and an outcome that can create a false impression of cause and effect."],["Longevity research","Surrogate endpoint","A biomarker used in place of a clinical outcome, which may not translate into real-world benefit."],["Longevity research","Senolytic","A drug designed to remove senescent cells. Human evidence for healthy ageing is not yet established."],["Longevity research","Epigenetic clock","A method that estimates age from DNA methylation patterns. Clocks are research tools with variable reliability."],["Healthy-lifestyle concepts","Talk test","A simple guide to exercise intensity: moderate activity allows conversation, while vigorous activity makes it hard."],["Healthy-lifestyle concepts","Minimum viable routine","The smallest version of a healthy routine that can be maintained during difficult periods."],["Healthy-lifestyle concepts","Social connection","The structure and quality of relationships, including contact, support and belonging."],["Healthy-lifestyle concepts","Psychological flexibility","The ability to accept difficult thoughts and feelings and to act in line with personal values."],["Healthy-lifestyle concepts","Allostatic load","The cumulative wear and tear of repeated or prolonged stress responses."],["Healthy-lifestyle concepts","Self-management","The skills a person uses to understand, monitor and adapt to a long-term condition with support."]],Ji=$m.map(([l,m,u],p)=>({id:`f${String(p+1).padStart(3,"0")}`,cat:l,front:m,back:u})),Ly=Array.from(new Set($m.map(l=>l[0]))),Ba=[{id:"amara-nairobi",title:"Shift work, sleep and budget meals",region:"East Africa (Kenya)",persona:"Amara, 34, hospital administrator on rotating shifts",themes:["Young adulthood","Sleep","Budget nutrition"],background:"Amara works rotating day and night shifts and shares a small flat with a sibling. She eats quickly from roadside stalls, sleeps irregularly and is worried about her long-term health, especially after a relative developed high blood pressure in their fifties.",challenge:"Improve sleep and everyday nutrition within a tight budget and an unpredictable timetable.",principles:["Circadian rhythm and sleep consistency (Chapter 31)","Nutrient-dense, affordable meals (Chapters 8 and 14)","Early blood pressure checks (Chapter 38)"],options:["Batch-cook beans, lentils and greens on her days off","Use a consistent wind-down routine and blackout curtains","Book a free or low-cost blood pressure check at a local clinic"],barriers:["Irregular shifts and fatigue","Limited cooking space and fuel costs","Competing family demands"],adaptations:["Prepare two portable meals per shift","Use a tinned-bean and vegetable soup base","Ask the employer about a predictable rota for sleep blocks"],lessons:["Consistent sleep timing matters even when schedules are imperfect.","Affordable whole foods can be prepared in advance."],focus:[2,1,2,0,1,1]},{id:"miguel-mexico-city",title:"Family cooking and prediabetes",region:"Latin America (Mexico)",persona:"Miguel, 58, retired bus driver who cooks for his family",themes:["Nutrition","Prediabetes","Family traditions"],background:"Miguel enjoys cooking traditional dishes for his grandchildren. A routine check showed blood sugar above the normal range, which the clinician described as prediabetes. He is motivated but worried that changing family recipes will remove the pleasure from mealtimes.",challenge:"Keep culturally important meals while improving carbohydrate quality, fibre and portion balance.",principles:["Dietary patterns and cultural adaptability (Chapter 13)","Blood sugar and prediabetes (Chapter 38)","Physical activity for glucose control (Chapter 18)"],options:["Use beans, lentils and whole maize tortillas in place of refined ingredients","Add vegetables to family soups and salsas","Walk after the main meal with a grandchild"],barriers:["Strong family expectations about food","Fried foods at local gatherings","Limited time for new recipes"],adaptations:["Keep favourite dishes but change the cooking method and proportions","Invite grandchildren to help cook healthy versions","Ask a dietitian to review the plan"],lessons:["Culturally familiar foods can be adapted rather than abandoned.","Shared activities make changes easier to sustain."],focus:[2,1,0,2,2,0]},{id:"priya-chennai",title:"Caregiving for a parent with dementia",region:"South Asia (India)",persona:"Priya, 45, accountant and the main family caregiver",themes:["Caregiving","Stress","Dementia awareness"],background:"Priya’s father has been diagnosed with dementia following a clinical assessment. She lives with her husband and two children, works part-time from home, and provides most of the daily support. She is exhausted and has stopped her own exercise and medical check-ups.",challenge:"Share caregiving responsibilities, protect her own health and plan for professional support.",principles:["Dementia assessment and respectful language (Chapter 27)","Caregiver wellbeing (Chapter 47)","Stress and emotional regulation (Chapter 32)"],options:["Hold a family meeting to share tasks and schedule respite","Contact a local carer support group","Ask the clinician about community day-care options"],barriers:["Cultural expectation that daughters provide care","Limited financial resources for paid care","Lack of information about services"],adaptations:["Create a weekly rota with relatives","Use a shared calendar and notes","Book her own health check and short walks"],lessons:["Caregivers need support too.","Shared responsibility protects both the caregiver and the person cared for."],focus:[0,1,1,2,2,2]},{id:"helen-manchester",title:"Living alone after bereavement",region:"United Kingdom (England)",persona:"Helen, 72, widowed and living alone",themes:["Loneliness","Grief","Community support"],background:"Helen’s husband died last year. She used to walk with him daily and now rarely leaves the house. She feels isolated, has lost some appetite and is less active. Her daughter lives two hours away and calls on weekends.",challenge:"Rebuild social contact, routine and nutrition while processing grief.",principles:["Loneliness and social connection (Chapters 33 and 34)","Grief and transitions (Chapter 36)","Practical nutrition with reduced appetite (Chapter 14)"],options:["Join a community lunch club","Use a local walking group or library activity","Speak to her GP about low mood and appetite"],barriers:["Low energy and motivation","Transport to group activities","Reluctance to ask for help"],adaptations:["Start with a single weekly activity","Ask the daughter to help arrange transport","Use a phone or video call with a friend each evening"],lessons:["Loneliness can be eased by small, regular steps.","Persistent low mood deserves professional assessment."],focus:[1,1,1,2,2,2]},{id:"tomasz-rural-poland",title:"Farm work, back pain and access to care",region:"Europe (rural Poland)",persona:"Tomasz, 66, small-farm owner",themes:["Mobility","Joint health","Rural healthcare"],background:"Tomasz has worked outdoors for decades. He now has persistent low back and knee pain, limits his walking and finds lifting difficult. The nearest specialist clinic is an hour away by bus.",challenge:"Keep working safely and stay mobile despite pain and limited access to specialist care.",principles:["Joint and mobility health (Chapter 21)","Strength and balance training (Chapter 19)","When persistent pain needs assessment (Chapter 21)"],options:["Arrange a clinical assessment, including telehealth if available","Start a short daily mobility and strength routine","Use lifting aids and change his work pattern"],barriers:["Long distances to clinics","Heavy physical workload","Financial pressure"],adaptations:["Split heavy tasks into shorter sessions","Use a wheelbarrow or trolley for lifting","Ask a physiotherapist for a home programme"],lessons:["Persistent joint or back pain deserves assessment rather than endurance.","Work tasks can be redesigned to protect the body."],focus:[0,2,1,0,1,2]},{id:"aisha-abuja",title:"Blood pressure medicines and cost",region:"West Africa (Nigeria)",persona:"Aisha, 61, market trader",themes:["Medication adherence","Blood pressure","Financial barriers"],background:"Aisha was prescribed medicines for high blood pressure. She sometimes skips doses when money is short and is unsure whether she can take traditional herbal drinks alongside her medicines.",challenge:"Support safe medicine use when cost, side effects and beliefs all affect adherence.",principles:["Medication awareness (Chapter 40)","Herbal product interactions (Chapter 15)","Blood pressure management (Chapter 38)"],options:["Discuss cost and side effects with the prescriber","Ask a pharmacist to check herbal drinks for interactions","Use a weekly pill organiser"],barriers:["Cost of medicines and transport","Uncertainty about side effects","Market hours limit clinic visits"],adaptations:["Ask whether a lower-cost, equally suitable medicine is available","Set a reminder linked to a daily market routine","Bring all products, including herbal drinks, to the clinic"],lessons:["Never stop medicines silently. Raise cost and side-effect concerns openly.","Herbal products can interact with medicines."],focus:[1,0,0,0,2,2]},{id:"kenji-osaka",title:"A fall in the bathroom",region:"East Asia (Japan)",persona:"Kenji, 81, lives with his spouse in an older apartment",themes:["Falls prevention","Home safety","Independence"],background:"Kenji slipped while stepping into the bath and bruised his hip. He is anxious about bathing alone and has reduced his outings. His spouse is supportive but also in her seventies.",challenge:"Make the home safer and rebuild confidence in everyday movement without loss of independence.",principles:["Balance and falls prevention (Chapter 20)","Accessible home design (Chapter 48)","Fear of falling and activity (Chapter 20)"],options:["Arrange an occupational therapy home assessment","Install grab rails and a non-slip bath mat","Practise balance and sit-to-stand exercises"],barriers:["Cost of adaptations","Limited space","Reluctance to accept help"],adaptations:["Use a bath stool and a long-handled sponge","Adjust bathroom lighting","Use local subsidy programmes where available"],lessons:["Falls are often preventable through environment and strength changes.","Fear of falling can reduce activity, which increases risk."],focus:[0,2,1,1,2,2]},{id:"grace-auckland",title:"Sleep, sun and midlife change",region:"Oceania (New Zealand)",persona:"Grace, 52, primary-school teacher",themes:["Sleep","Sun protection","Midlife transitions"],background:"Grace has noticed poor sleep and hot flushes during perimenopause. She enjoys outdoor sports in the sunny climate but rarely uses sunscreen. She is unsure whether she should try any supplements for sleep.",challenge:"Improve sleep and sun protection, and discuss midlife symptoms with a clinician rather than self-treating.",principles:["Sleep changes and assessment (Chapter 31)","UV protection (Chapter 41)","Medication and supplement caution (Chapters 15 and 40)"],options:["Discuss menopausal symptoms and sleep with a clinician","Use a daily broad-spectrum sunscreen and a hat for outdoor sport","Keep a consistent bedtime and limit caffeine after midday"],barriers:["Busy school schedule","Uncertainty about treatment options","Strong outdoor culture"],adaptations:["Schedule outdoor sport early or late when UV is lower","Keep sunscreen by the door","Keep a simple sleep diary to share with the clinician"],lessons:["Symptoms in midlife deserve clinical discussion, not self-prescription.","Sun protection in early adulthood and midlife protects later skin health."],focus:[1,2,2,0,2,1]},{id:"samuel-sydney",title:"Hearing loss and withdrawal",region:"Oceania (Australia)",persona:"Samuel, 77, retired engineer and grandfather",themes:["Hearing","Social connection","Skin checks"],background:"Samuel has gradually lost hearing in both ears. He avoids family gatherings and has stopped attending his men’s shed because conversations are hard to follow. He also has a patch of sun-damaged skin on his forearm that he has not had checked.",challenge:"Restore communication and social participation, and arrange a skin check.",principles:["Hearing assessment and assistive devices (Chapter 39)","Social connection and loneliness (Chapter 34)","Skin changes requiring evaluation (Chapter 41)"],options:["Arrange a hearing assessment and discuss hearing aids","Ask group leaders about seating and captioning","Book a skin examination with a clinician"],barriers:["Cost of hearing devices","Embarrassment","Noisy group environments"],adaptations:["Sit where others are visible","Use a loop system or captioned devices where available","Share the plan with family members"],lessons:["Hearing loss is treatable or manageable, and communication aids help.","Withdrawal is a signal to seek support, not a personal failing."],focus:[0,1,0,2,2,1]},{id:"fatima-amman",title:"Fasting and diabetes medicines",region:"Middle East (Jordan)",persona:"Fatima, 49, teacher with type 2 diabetes",themes:["Religious fasting","Diabetes","Medication safety"],background:"Fatima is observing Ramadan this year and wants to fast. She takes diabetes medicines and is unsure how fasting will affect her blood sugar and fluid intake.",challenge:"Plan fasting safely with medicines, fluids and blood-sugar monitoring.",principles:["Medication safety and timing (Chapter 40)","Hydration and fasting (Chapters 12 and 50)","Blood sugar management (Chapter 38)"],options:["Consult her clinician or diabetes team before Ramadan","Plan suhoor and iftar meals with balanced foods","Learn the warning signs of low and high blood sugar"],barriers:["Limited time to see the clinic before Ramadan","Family routines around meals","Hot weather"],adaptations:["Agree a medication timetable with the clinician","Use slow-release carbohydrates at suhoor","Break the fast if advised and when unwell"],lessons:["Religious practice and medical safety can be planned together.","Fasting with diabetes or medicines needs individual clinical advice."],focus:[2,0,1,1,2,1]},{id:"lucas-sao-paulo",title:"Building strength early",region:"South America (Brazil)",persona:"Lucas, 29, software support worker",themes:["Young adulthood","Strength training","Bone health"],background:"Lucas has a desk-based job and little exercise. He wants to build a habit that protects his bones and back for later life. He has a limited budget and no gym membership.",challenge:"Start a low-cost strength routine that supports future bone and muscle health.",principles:["Peak bone mass and weight-bearing activity (Chapter 11)","Strength training fundamentals (Chapter 19)","Sedentary behaviour (Chapter 18)"],options:["Use bodyweight exercises at home or in a public park","Use resistance bands for a short routine","Stand or walk during long calls"],barriers:["Desk-based work","Limited time","No equipment"],adaptations:["Two 20-minute sessions a week","Use backpack loading and stair climbing","Use a timer to break up sitting"],lessons:["Early investment in strength and bone health pays off later.","No equipment is needed to start."],focus:[1,2,1,0,1,1]},{id:"ruth-vancouver",title:"Independent living with sensory changes",region:"North America (Canada)",persona:"Ruth, 88, lives in her own apartment",themes:["Sensory changes","Independence","Assistive technology"],background:"Ruth uses a walker outside her home. Her vision and hearing have declined, which makes cooking and reading labels more difficult. She wants to keep cooking her own meals and remain in her apartment.",challenge:"Maintain independent cooking and communication through sensory and home adaptations.",principles:["Vision and hearing awareness (Chapter 39)","Assistive devices and home design (Chapter 48)","Accessible food preparation (Chapter 14)"],options:["Book eye and hearing examinations","Use high-contrast labels, large-print recipes and talking scales","Arrange an occupational therapy assessment for the kitchen"],barriers:["Cost of devices","Limited mobility","Fear of losing independence"],adaptations:["Use pre-cut ingredients and a seated work station","Enable captions on the television and phone","Use a stable chair and lightweight pans"],lessons:["Sensory aids can preserve independence for many years.","Keep choices with the person; adapt the environment."],focus:[1,1,1,1,2,2]},{id:"daniel-berlin",title:"Strength training after a spinal cord injury",region:"Europe (Germany)",persona:"Daniel, 40, wheelchair user and software developer",themes:["Disability","Adaptive exercise","Inclusive facilities"],background:"Daniel uses a wheelchair following a spinal cord injury. He wants to improve upper-body strength and cardiovascular fitness but finds many gyms inaccessible.",challenge:"Find accessible, effective strength and aerobic options that respect his goals.",principles:["Disability-inclusive movement (Chapter 46)","Cardiovascular fitness (Chapter 18)","Shoulder and joint care (Chapter 21)"],options:["Choose accessible gyms or adapted sports programmes","Use resistance bands and seated pushing exercises","Use a hand-cycle or arm ergometer for aerobic work"],barriers:["Inaccessible facilities","Equipment cost","Limited staff training"],adaptations:["Check transfer and accessibility details before visiting","Adjust exercise to shoulder comfort","Ask a physiotherapist for a balanced programme"],lessons:["Disabled people can pursue strength and fitness goals with adaptation.","Accessible environments make activity possible."],focus:[1,2,1,1,1,2]},{id:"nomvula-rural-south-africa",title:"Food access, heat and shared care",region:"Africa (South Africa)",persona:"Nomvula, 60, cares for her grandchildren in a rural village",themes:["Food security","Climate exposure","Community support"],background:"Nomvula cares for three grandchildren while their parents work in a city. Food is sometimes scarce, water is collected from a distance, and summers are very hot. She sometimes feels tired and dizzy in the afternoon.",challenge:"Improve nutrition, hydration and heat safety within severe resource limits.",principles:["Food affordability and social determinants (Chapter 49)","Hydration and heat (Chapters 12 and 49)","Community-based support (Chapter 50)"],options:["Connect with local community food programmes and cooking groups","Plan shade breaks and water intake during hot afternoons","Ask the clinic about dizziness and blood pressure"],barriers:["Limited income","Water access","Heavy caring workload"],adaptations:["Grow leafy greens and beans where possible","Use shared cooking with neighbours","Shift heavy tasks to cooler times of day"],lessons:["Personal advice works best alongside social and community support.","Dizziness should be assessed, especially in the heat."],focus:[2,1,0,2,1,2]},{id:"chen-shanghai",title:"Retirement, purpose and tai chi",region:"East Asia (China)",persona:"Chen, 67, recently retired engineer",themes:["Retirement","Purpose","Balance"],background:"Chen retired last year and felt unsure what to do with his days. He joined a morning tai chi group in his neighbourhood, and he has since begun volunteering to teach basic phone skills to older neighbours.",challenge:"Build a meaningful routine that supports balance, mood and social contact after retirement.",principles:["Purpose and identity (Chapter 35)","Balance training (Chapter 20)","Retirement transitions (Chapter 36)"],options:["Attend the tai chi group regularly","Volunteer to teach digital skills","Keep a weekly schedule that mixes learning, activity and family time"],barriers:["Losing a work identity","Group access times","Health monitoring needs"],adaptations:["Choose a mix of physical and social activities","Adapt movements to joint comfort","Schedule regular family meals"],lessons:["A sense of purpose can be built from small, valued roles.","Group movement combines balance, mood and connection."],focus:[0,2,1,2,1,1]}],Uy="These lists are adaptable examples for education. They are not universal prescriptions. Choose what suits your health, abilities, budget and culture, and check with a clinician if you have a medical condition.",ep={meals:{label:"Meal ideas (20)",items:[{t:"Lentil and vegetable dhal with brown rice",d:"Legumes, vegetables and wholegrain from South Asian cooking; batch-cook and freeze portions."},{t:"Bean and maize tortillas with tomato and avocado salad",d:"Latin American combination of pulses, wholegrain maize and vegetables."},{t:"Chickpea and bulgur salad with herbs and tomato",d:"Middle Eastern salad that provides plant protein, fibre and vegetables."},{t:"Bean stew with leafy greens and cassava or wholegrain",d:"West African style meal built on affordable pulses and greens."},{t:"Tofu and vegetable stir-fry with brown rice and miso soup",d:"East Asian meal using soy protein, vegetables and a fermented food."},{t:"Porridge with berries, yoghurt and ground nuts",d:"Simple breakfast with wholegrain, fruit, dairy or alternative and unsalted nuts."},{t:"Vegetable omelette with wholemeal toast",d:"Quick egg-based meal with vegetables and fibre, suitable for low-energy days."},{t:"Tinned sardines or mackerel on wholemeal toast with tomato",d:"Affordable oily fish option with a vegetable component."},{t:"Lentil soup with carrots, onions and wholegrain bread",d:"Freezes well and is easy to make in one pot."},{t:"Baked fish with root vegetables and dark greens",d:"Oceanian and European style meal using seasonal produce."},{t:"Wholegrain pasta with bean and vegetable tomato sauce",d:"Budget-friendly meal that adds legumes to a familiar dish."},{t:"Greek-style yoghurt bowl with fruit and seeds",d:"Quick snack or breakfast providing protein, calcium and fibre."},{t:"Congee with egg, vegetables and ginger",d:"Soft, easy-to-chew meal that can be adapted for swallowing or appetite changes."},{t:"Vegetable and bean soup with a boiled egg",d:"Warm, hydrating and filling option that uses inexpensive ingredients."},{t:"Shakshuka with peppers, tomatoes and eggs",d:"North African and Middle Eastern one-pan meal; serve with wholegrain bread."},{t:"Chicken and vegetable traybake with potatoes",d:"Batch-cooked oven meal with lean protein and vegetables."},{t:"Quinoa or millet salad with chickpeas and vegetables",d:"Grain-and-legume salad that travels well for lunch."},{t:"Fruit and vegetable smoothie with milk or fortified alternative",d:"Useful when chewing is hard; add oats or nut butter for extra energy."},{t:"Mushroom and barley soup",d:"Hearty soup that uses affordable grains and vegetables."},{t:"Peanut and vegetable stew with rice",d:"West and Central African inspired dish using groundnuts and leafy greens."}]},movement:{label:"Everyday movement (15)",items:[{t:"Sit-to-stand practice",d:"Rise from a firm chair with support and lower slowly; repeat a few times a day."},{t:"Brisk local walk",d:"Walk to the market, a park or a neighbour; adjust pace and distance."},{t:"Carry shopping in both hands",d:"Builds grip, shoulder and trunk strength during everyday tasks."},{t:"Gardening or raking",d:"Combines walking, bending and sustained arm use; use raised beds if bending is hard."},{t:"Dancing to favourite music",d:"Adds rhythm, balance and social enjoyment; seated dancing is also an option."},{t:"Stair climbing with a rail",d:"Use a stable rail and a low step, practising carefully."},{t:"Household chores",d:"Sweeping, mopping, vacuuming and laundry can add up to meaningful activity."},{t:"Tai chi or qigong class",d:"Slow, flowing movement that supports balance and calm."},{t:"Water-based exercise",d:"Reduces joint load; choose a supervised class where possible."},{t:"Cycling, stationary or outdoors",d:"Low-impact aerobic activity that builds leg strength."},{t:"Standing calf raises at the kitchen counter",d:"Hold a support and rise on the toes, lowering slowly."},{t:"Marching on the spot during television adverts",d:"A simple way to break up sitting time."},{t:"Balance practice while brushing teeth",d:"Stand near a worktop, use a support and shift weight gently from one leg to the other."},{t:"Walking with a group or friend",d:"Combines movement, companionship and routine."},{t:"Playing actively with children or pets",d:"Fun, varied movement that is often more sustainable than formal exercise."}]},brain:{label:"Brain engagement (12)",items:[{t:"Learn five phrases in a new language each week",d:"Spaced practice that combines memory, attention and cultural interest."},{t:"Read a book and discuss it with others",d:"Reading plus conversation builds language and social connection."},{t:"Learn a simple instrument or sing in a group",d:"Music engages memory, movement and emotion."},{t:"Cook a new recipe from memory, then check it",d:"Retrieval practice with practical reward."},{t:"Write a short memoir page each week",d:"Builds episodic memory and personal meaning."},{t:"Play a strategy game such as chess or bridge",d:"Enjoyable reasoning practice; playing with others adds social value."},{t:"Plan a garden layout",d:"Combines planning, measuring and visualisation."},{t:"Learn a practical craft, such as knitting or woodworking",d:"Builds motor skills, planning and a sense of achievement."},{t:"Map a new route in your neighbourhood",d:"Spatial navigation and exploration in a safe, familiar area."},{t:"Use a digital skill class at the library",d:"Builds digital literacy and confidence."},{t:"Keep a simple journal of three good things a day",d:"Supports reflection and mood; does not require special skills."},{t:"Memory practice: name the items in a room, then check",d:"Short, low-cost retrieval exercise that can be varied."}]},sleep:{label:"Sleep-supporting habits (10)",items:[{t:"Keep a regular wake time",d:"A consistent wake time helps anchor the circadian rhythm."},{t:"Get daylight in the morning",d:"Morning light supports the body clock; outdoor time is helpful when safe."},{t:"Limit caffeine after early afternoon",d:"Caffeine can disturb sleep for many people, even hours later."},{t:"Create a wind-down routine",d:"A calm sequence, such as washing, reading and dimming lights, signals bedtime."},{t:"Keep the bedroom cool, dark and quiet",d:"Blackout curtains, earplugs or a fan can help."},{t:"Reduce bright screens before bed",d:"Consider a device-free period, or use lower brightness at night."},{t:"Keep daytime naps short and early",d:"Long or late naps can make night-time sleep harder for some people."},{t:"Limit alcohol near bedtime",d:"Alcohol can fragment sleep, even if it helps people fall asleep."},{t:"Practise slow breathing when awake at night",d:"Longer exhalations can ease arousal; avoid checking the clock repeatedly."},{t:"Get medical advice for persistent problems",d:"Ask about sleep apnoea, nocturia, pain or restless legs if sleep is poor for weeks."}]},social:{label:"Social connection (10)",items:[{t:"Schedule a weekly call with one friend or relative",d:"A regular appointment makes contact more likely."},{t:"Join a class or club with a shared interest",d:"Repeated contact in a group builds friendships over time."},{t:"Volunteer for a few hours a month",d:"Contribution and connection together, at a sustainable level."},{t:"Attend a community meal or lunch club",d:"Shared food and conversation offer social connection and nutrition."},{t:"Plan an intergenerational activity",d:"Shared gardening, storytelling or reading with younger people."},{t:"Start a neighbourhood check-in arrangement",d:"A simple agreement to look in on each other."},{t:"Join a walking group",d:"Combines movement, companionship and a regular plan."},{t:"Attend a faith or cultural gathering, if it suits you",d:"Shared traditions can offer belonging and meaning."},{t:"Share family recipes with younger relatives",d:"Passing on food traditions builds connection and identity."},{t:"Use video calls with family who live far away",d:"Technology can keep relationships close across distances, with help if needed."}]},home:{label:"Home-safety improvements (10)",items:[{t:"Add night lights along the route to the bathroom",d:"Low-cost lighting reduces night-time falls."},{t:"Secure or remove loose rugs",d:"Use non-slip backing or remove rugs that move underfoot."},{t:"Fit grab rails in the bathroom and beside the toilet",d:"Install securely, ideally after an occupational therapy assessment."},{t:"Use non-slip mats in the bath and shower",d:"Choose suction or adhesive mats that stay in place."},{t:"Keep walkways clear of cables and clutter",d:"Tidy cables and remove obstacles from main routes."},{t:"Improve lighting on stairs, with contrast on edges",d:"Bright, even light and visible step edges reduce trips."},{t:"Keep frequently used items between waist and shoulder height",d:"Avoid step stools and overreaching."},{t:"Keep a phone or alert device within reach",d:"Know how to call for help from every main room."},{t:"Check smoke and carbon monoxide alarms",d:"Test regularly and replace batteries as the manufacturer advises."},{t:"Place an emergency information sheet by the phone",d:"Include contacts, conditions, medicines and allergies on paper."}]},questions:{label:"Questions for a healthcare professional (10)",items:[{t:"Which screening tests are appropriate for my age, sex, family history and country?",d:"Helps personalise preventive care."},{t:"Would a bone-density test be appropriate for me?",d:"Discusses fracture risk and the right next step."},{t:"Could any of my medicines cause dizziness, falls or confusion?",d:"Prompts a medication review."},{t:"Should my vitamin B12, vitamin D or iron status be checked?",d:"Asks for testing rather than guessing."},{t:"Are my vaccinations up to date for my age and health?",d:"Checks the national schedule against my record."},{t:"When was my hearing and vision last checked?",d:"Links sensory health to safety and social life."},{t:"Is my protein intake appropriate for my kidney health and goals?",d:"Important for people with kidney disease or other conditions."},{t:"Which physical activities are safe for my heart, joints and balance?",d:"Asks for individual exercise guidance."},{t:"What warning signs should prompt me to call urgently?",d:"Clarifies emergency thresholds for my own situation."},{t:"How can we plan for future support, including preferences and legal documents?",d:"Opens advance care planning in a supportive way."}]}},Ao=[{id:"reflection",title:"Personal healthy-ageing reflection",minutes:15,purpose:"Clarify what matters most to you and which areas you would like to focus on.",intro:"There are no right answers. Write as much or as little as you wish.",fields:[{k:"area",id:"matters",label:"What matters most to me in the years ahead?"},{k:"area",id:"strengths",label:"What already supports my health and wellbeing?"},{k:"area",id:"change",label:"What would I like to change or protect first?"},{k:"scale",id:"energy",label:"How would I rate my energy on an average day? (1 = very low, 5 = high)"},{k:"checks",id:"focus",label:"Areas I would like to focus on",options:["Nutrition","Movement and strength","Balance and home safety","Sleep","Social connection","Mental wellbeing","Preventive care","Skin and sun protection","Hearing and vision","Medicines"]}]},{id:"lifestyle",title:"Current lifestyle assessment",minutes:10,purpose:"Notice current habits without judgement, so you can choose a starting point.",intro:"Answer for a typical week. This is a self-reflection tool, not a diagnosis.",fields:[{k:"choice",id:"activity",label:"On a typical day, how active am I?",options:["Mostly seated","Some light activity","Regular moderate activity","Regular activity including strength"]},{k:"choice",id:"sleep",label:"How well do I usually sleep?",options:["Often poorly","Sometimes poorly","Mostly well","Consistently well"]},{k:"checks",id:"habits",label:"Habits I already practise",options:["Walk most days","Strength exercise twice a week","Balance practice","Vegetables or fruit most days","Drink water regularly","Regular social contact","Up-to-date check-ups","Daily sun protection","Limit alcohol","Do not smoke"]},{k:"scale",id:"variety",label:"How varied is my diet across a week? (1 = limited, 5 = very varied)"},{k:"area",id:"notes",label:"Notes on what gets in the way"}]},{id:"meal-planner",title:"Balanced eating planner",minutes:20,purpose:"Plan a week of balanced meals and snacks within your budget and preferences.",intro:"Write simple meal names. Include vegetables, wholegrains and a protein food where possible.",fields:[{k:"grid",id:"week",label:"Weekly meal plan",cols:["Breakfast","Lunch","Dinner","Snack"],rows:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]},{k:"text",id:"budget",label:"Budget notes (for example, staples to buy in bulk)"}]},{id:"protein-plan",title:"Protein-source planning sheet",minutes:10,purpose:"Spread protein across meals and combine sources for variety.",intro:"Protein needs vary. Use this sheet with advice from a clinician or dietitian if you have kidney, liver or other conditions.",fields:[{k:"grid",id:"protein",label:"Protein plan by meal",cols:["Breakfast","Lunch","Dinner"],rows:["Day 1","Day 2","Day 3","Day 4","Day 5","Day 6","Day 7"]},{k:"checks",id:"sources",label:"Protein sources I can use",options:["Eggs","Dairy or fortified alternative","Fish","Poultry","Lean meat","Tofu or tempeh","Lentils or beans","Nuts and seeds"]}]},{id:"hydration",title:"Hydration tracker (print version)",minutes:5,purpose:"Note glasses of water or other fluids across the day. The interactive tracker is on the Tracker page.",intro:"Your fluid target should be set with your clinician if you have a heart, kidney or liver condition or a fluid restriction.",fields:[{k:"grid",id:"glasses",label:"Glasses per time of day",cols:["Morning","Midday","Afternoon","Evening"],rows:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]},{k:"area",id:"cues",label:"Cues that help me drink regularly"}]},{id:"movement",title:"Weekly movement planner",minutes:15,purpose:"Plan aerobic, strength, balance and everyday movement across the week.",intro:"Aim for a mix of activity types. Adjust sessions to energy, weather and health advice.",fields:[{k:"grid",id:"plan",label:"Weekly movement plan",cols:["Aerobic","Strength","Balance","Everyday movement"],rows:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]},{k:"text",id:"rest",label:"Rest or recovery days I plan"}]},{id:"strength-mobility",title:"Strength and mobility reflection",minutes:10,purpose:"Notice everyday movements that feel easier or harder, and what helps.",intro:"Reflect on everyday movements. If a movement causes pain or worry, discuss it with a clinician.",fields:[{k:"checks",id:"moves",label:"Everyday movements that feel harder lately",options:["Getting up from a chair","Climbing stairs","Carrying shopping","Reaching overhead","Getting in and out of the bath","Bending to the floor","Walking further than before","Turning quickly"]},{k:"scale",id:"confidence",label:"How confident do I feel moving around my home? (1 = low, 5 = high)"},{k:"area",id:"helps",label:"What helps my movement feel better?"}]},{id:"balance-safety",title:"Balance and home-safety checklist",minutes:15,purpose:"Walk through your home and note hazards and improvements to consider.",intro:"Tick what you have checked. Ask an occupational therapist for a full assessment if needed.",fields:[{k:"checks",id:"hazards",label:"Home checks",options:["Rugs secured or removed","Night lights on route to bathroom","Stairs have secure rails on both sides","Bathroom has grab rails and non-slip mats","Clear walkways","Good lighting in halls and stairs","Frequently used items within reach","Phone or alert device within reach","Footwear fits well and has a secure heel","Recent medicine review done"]},{k:"area",id:"priority",label:"The first change I will make"}]},{id:"brain-planner",title:"Brain engagement planner",minutes:15,purpose:"Plan varied, enjoyable mental activities across the week.",intro:"Choose activities that interest you and that you can keep up.",fields:[{k:"grid",id:"brain",label:"Weekly brain activities",cols:["Activity","Time","With someone?"],rows:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]},{k:"checks",id:"types",label:"Types of activity I would enjoy",options:["Reading","Language learning","Music","Creative arts","Puzzles or strategy games","Learning a practical skill","Digital learning","Discussion groups"]}]},{id:"sleep-routine",title:"Sleep routine worksheet",minutes:10,purpose:"Describe your usual sleep pattern and build a calm routine.",intro:"Persistent sleep problems deserve assessment. This worksheet does not save your answers.",fields:[{k:"text",id:"wake",label:"My usual wake time (approximate)"},{k:"text",id:"bed",label:"My usual bedtime (approximate)"},{k:"checks",id:"routine",label:"Wind-down steps I could try",options:["Dim lights an hour before bed","Reading or quiet music","Short stretching or breathing","Warm wash or shower","No screens for 30 minutes","Cool, dark, quiet bedroom","Regular wake time"]},{k:"scale",id:"rested",label:"How rested do I usually feel on waking? (1 = not rested, 5 = well rested)"},{k:"area",id:"notes",label:"Notes on what disturbs my sleep"}]},{id:"social-planner",title:"Social connection planner",minutes:10,purpose:"Plan regular contact with people and groups that matter to you.",intro:"Include family, friends, community groups and digital contacts. Start with one or two.",fields:[{k:"grid",id:"contacts",label:"Four-week contact plan",cols:["Week 1","Week 2","Week 3","Week 4"],rows:["Family","Friends","Community group","Neighbour or volunteer","Online contact"]},{k:"area",id:"barriers",label:"What might make connecting harder, and what would help?"}]},{id:"preventive-discussion",title:"Preventive-health discussion sheet",minutes:10,purpose:"Prepare general questions for a preventive-care conversation with your clinician.",intro:"Do not write sensitive details here if you would rather not. Bring only what you are comfortable sharing.",fields:[{k:"checks",id:"topics",label:"Topics I would like to discuss",options:["Screening that suits my age and risk","Vaccination status","Blood pressure and cholesterol","Blood sugar","Bone health","Hearing and vision","Dental health","Skin checks","Mood and sleep","Medicine review"]},{k:"area",id:"questions",label:"Questions I want to ask"}]},{id:"medication-review",title:"Medication review preparation sheet",minutes:10,purpose:"Prepare for a medication review by listing questions and noticing side effects.",intro:"Bring the packets or a list to your appointment. Use names only if you choose. Do not enter doses here unless your clinician asks you to.",fields:[{k:"area",id:"list",label:"Medicine names (as on the packet), including over-the-counter and herbal products, if I choose"},{k:"checks",id:"effects",label:"Side effects I have noticed",options:["Dizziness on standing","Drowsiness during the day","Confusion","Constipation","Dry mouth","Stomach upset","Changes in appetite","Falls or near-falls","Difficulty passing urine"]},{k:"area",id:"ask",label:"Questions for my clinician or pharmacist"}]},{id:"vitality-goals",title:"Personal vitality goal planner",minutes:20,purpose:"Set one or two goals based on what matters to you.",intro:"Write goals that are specific, personal and achievable in small steps.",fields:[{k:"text",id:"goal",label:"My goal in one sentence"},{k:"area",id:"why",label:"Why this matters to me"},{k:"text",id:"first",label:"The first small step I will take this week"},{k:"choice",id:"horizon",label:"Time frame",options:["One month","Three months","Six months","One year"]},{k:"text",id:"support",label:"Who or what can support me?"},{k:"grid",id:"reviews",label:"Review dates",cols:["Date","What went well","What to adjust"],rows:["Review 1","Review 2","Review 3"]}]},{id:"monthly-review",title:"Monthly progress review",minutes:15,purpose:"Review the month, celebrate progress and decide what to adjust.",intro:"A review is not a test. It is a chance to refine your plan.",fields:[{k:"scale",id:"energy",label:"Overall energy this month (1 = low, 5 = high)"},{k:"scale",id:"mood",label:"Overall mood this month (1 = low, 5 = good)"},{k:"checks",id:"kept",label:"Habits I kept most of the time",options:["Movement","Strength","Balance","Balanced meals","Water","Sleep routine","Social contact","Preventive appointments"]},{k:"area",id:"wins",label:"Wins this month"},{k:"area",id:"hard",label:"What was difficult?"},{k:"area",id:"adjust",label:"What will I adjust next month?"}]}],qy=[["Start simply","Small habits are easier to keep than big changes.","Choose one habit to practise today.","Easier: stand and stretch arms. Standard: 10-minute walk. Stretch: 15 minutes at a comfortable pace.","Add one vegetable or fruit to a meal.","Read one page of something you enjoy.","Go to bed at your usual time with a short wind-down.","Send a message to one person.","What habit did I choose, and why?","Rest fully if you are tired."],["Hydration routine","Regular drinking is more reliable than waiting for thirst.","Keep a glass of water near you and drink at set times.","Easier: seated arm circles. Standard: sit-to-stand, 5 times. Stretch: 10 minutes of walking.","Pair water with a meal or medicine time (if advised).","Name five things you can see in the room, then five you can hear.","Dim lights for the last 30 minutes before bed.","Ask someone how their day is going.","When did I notice thirst, and what helped?","Gentle breathing for two minutes."],["Morning light","Daylight in the morning supports the body clock.","Spend five minutes near a window or outdoors in the morning.","Easier: seated ankle circles. Standard: walk to the window and back. Stretch: a short walk outdoors.","Eat breakfast with a source of protein or fibre.","Describe a memory of a favourite place in detail.","Keep a regular wake time today.","Share a morning greeting with a neighbour.","How did morning light feel?","Rest your eyes for one minute every hour of screen use."],["Mobility minutes","Gentle daily movement keeps joints comfortable.","Do a three-minute mobility routine.","Easier: neck turns and shoulder rolls. Standard: add seated knee extensions. Stretch: add standing hip circles with support.","Include a colourful vegetable at lunch.","Solve one puzzle or riddle.","Avoid large meals close to bedtime.","Phone a family member for five minutes.","Which movement felt easiest today?","Stop if any movement causes sharp pain."],["Plate balance","A balanced plate combines vegetables, wholegrains and protein.","Build one meal using the plate template.","Easier: seated marching. Standard: 10-minute walk. Stretch: 15-minute walk with gentle hills.","Half the plate vegetables or fruit, a quarter wholegrain, a quarter protein.","Plan the meal from memory, then check the plate template.","Keep your bedroom cool tonight.","Share a meal or recipe idea with someone.","What made the plate easy or hard to build?","Light stretching for five minutes."],["Social hello","Regular contact supports mood and wellbeing.","Arrange one contact for this week.","Easier: stand up and sit down twice. Standard: walk while talking on the phone. Stretch: meet someone for a walk.","Share a snack or drink with someone.","Learn one new word in a language you enjoy.","Note how sleep felt last night.","Call, visit or message one person.","Who makes me feel connected, and how can I stay in touch?","A quiet afternoon with no obligations."],["Weekly review","Reviewing progress helps you choose what to keep.","Look back at the week and decide one thing to keep.","Easier: sit-to-stand twice. Standard: 10-minute walk. Stretch: 20 minutes of activity you enjoy.","Write down two meals you enjoyed this week.","Write three sentences about something you learned.","Choose one bedtime habit to keep.","Plan one social activity for next week.","What did I learn about my routine this week?","Rest without guilt."],["Sit-to-stand","Standing from a chair is a useful everyday strength skill.","Practise sit-to-stand from a firm chair with support.","Easier: sit-to-stand with arms helping. Standard: 5 repetitions. Stretch: 8 slow repetitions with control.","Include a legume (beans, lentils or chickpeas) in one meal.","Recall the names of five people you have met recently.","Put a glass of water and a light by your bed.","Share a photo or memory with someone.","Which part of standing up felt strongest?","Rest between sets as needed."],["Protein at each meal","Spreading protein across meals supports muscle maintenance.","Include a protein food at each meal today.","Easier: seated leg raises. Standard: 10-minute walk. Stretch: sit-to-stand 8 times plus a walk.","Choose eggs, yoghurt, beans, fish, tofu or lean meat at each meal.","Describe the steps of making a simple dish.","Limit caffeine after the early afternoon.","Invite someone to share a meal.","How did protein at each meal feel?","Gentle stretch for the legs."],["Walk and talk","Walking with others combines movement and connection.","Walk for ten minutes with someone, or on your own while listening to a podcast.","Easier: walk indoors around a room. Standard: 10 minutes outside. Stretch: 20 minutes at a comfortable pace.","Have a glass of water after your walk.","Listen to a short talk or podcast and summarise it.","Keep screens dim in the evening.","Walk with a neighbour or friend.","How did walking with others change my mood?","Walk slowly as a cool-down."],["Balance practice","Balance can be trained safely with support.","Practise standing with support for 30 seconds.","Easier: stand with feet together near a worktop. Standard: heel-to-toe stance with support. Stretch: one-leg stance with light support.","Include a fruit or vegetable with at least two meals.","Name the steps of a familiar daily routine in order.","Keep a regular bedtime.","Share a balance tip with someone.","Which balance exercise felt most stable?","Stop any exercise that causes dizziness."],["Fibre and fluids","Fibre supports bowel health, especially with enough fluid.","Add one high-fibre food to a meal.","Easier: seated marching. Standard: 10-minute walk. Stretch: 15-minute walk.","Choose wholegrains, beans or vegetables with fluid.","Recall the main points of a recent conversation.","Avoid heavy meals late at night.","Chat with someone about food traditions.","How did I feel after the fibre change?","Rest and hydrate."],["Memory practice","Spaced retrieval strengthens memory.","Read a short passage, then write down what you remember.","Easier: walk slowly while reviewing. Standard: 10-minute walk. Stretch: 15-minute walk.","Share a healthy snack idea with someone.","Read a passage, put it aside, then recall. Check and review.","Keep a consistent evening routine.","Ask someone about their memory of a shared event.","What helped me remember?","Relaxed breathing before bed."],["Sleep wind-down","A calm routine signals bedtime.","Create a 20-minute wind-down routine.","Easier: gentle seated stretches. Standard: 10-minute walk earlier in the day. Stretch: 15-minute walk.","Avoid large meals in the two hours before bed.","Read a calm book or listen to quiet music.","Keep the bedroom cool, dark and quiet.","Send a goodnight message to someone.","Which wind-down step helped most?","Slow breathing for two minutes."],["Strength basics","Strength training supports independence.","Complete two sets of one strength exercise.","Easier: wall press-ups. Standard: sit-to-stand 8 times. Stretch: step-ups with a rail and light band work.","Include protein at breakfast or lunch.","Describe your favourite place from childhood.","Keep your sleep time consistent.","Plan a call with a relative.","Which strength exercise was comfortable?","Rest at least one day before the next session."],["Vegetable variety","Different vegetables provide different nutrients.","Try one vegetable you do not eat often.","Easier: seated arm raises. Standard: 10-minute walk. Stretch: 15-minute walk with hills.","Choose a colourful vegetable at two meals.","Learn a new word in a language you enjoy.","Keep a glass of water by the bed.","Ask someone for a favourite vegetable recipe.","What new food did I try?","Gentle stretch for the neck and shoulders."],["Learning moment","Learning something new supports engagement and wellbeing.","Spend ten minutes learning a new skill or topic.","Easier: stand and sit for one minute. Standard: 10-minute walk. Stretch: 15 minutes of activity.","Include a legume or wholegrain in a meal.","Learn one new fact about a subject you care about.","Keep your bedroom tidy and quiet.","Share what you learned with someone.","What did I enjoy learning?","Rest and reflect for five minutes."],["Stair and step practice","Stepping practice can build leg strength and confidence.","Practise up and down one low step, holding a rail or support.","Easier: step onto the bottom step. Standard: 5 step-ups with a rail. Stretch: 8 step-ups with control.","Eat a source of calcium such as dairy or fortified alternatives.","Plan a route for a walk and visualise it.","Use a night light on the way to the bathroom.","Invite a friend or relative to join you.","How steady did I feel on the step?","Rest between sets."],["Home safety walk","A home walk helps identify hazards.","Walk through your home and note one hazard to fix.","Easier: walk around one room. Standard: walk through the home. Stretch: walk outdoors safely.","Keep frequently used items within reach at meals.","Tidy a drawer and name each item as you put it away.","Check bedroom lighting for night-time use.","Tell someone about your plan to fix the hazard.","Which hazard is easiest to fix first?","Rest and hydrate."],["Gratitude and connection","Noticing good things supports mood.","Write down three things you are grateful for and why.","Easier: sit-to-stand twice. Standard: 10-minute walk. Stretch: 15-minute walk.","Share a meal with someone, if possible.","Write a short description of one good memory.","Practise slow breathing in bed.","Thank someone who has helped you recently.","How did gratitude change my day?","A quiet, unhurried moment."],["Rest-day reflection","Rest supports adaptation and recovery.","Plan a rest day that includes gentle activity you enjoy.","Easier: rest. Standard: slow 10-minute walk. Stretch: none needed today.","Keep regular meals and water.","Read or listen to something calming.","Go to bed at a consistent time.","Connect with someone in a relaxed way.","What does recovery look like for me?","Rest is the activity today."],["Strength repeat","Repeating a routine builds confidence and skill.","Repeat the strength routine from earlier this month.","Easier: sit-to-stand with support. Standard: two sets of two exercises. Stretch: add a band or a light weight.","Include a protein food at each meal.","Solve a simple puzzle with pen and paper.","Keep a regular wake time.","Share a workout with a friend or family member.","What progress have I noticed?","Rest for at least one day before the next session."],["Shopping plan","A plan helps you buy affordable, nutritious food.","Write a short shopping list that includes vegetables, fruit, legumes and wholegrains.","Easier: walk to the shop or rest. Standard: 10-minute walk. Stretch: 15-minute walk with bags.","Choose affordable whole foods and check labels for salt.","Plan your meals for two days.","Plan a calm evening before shopping.","Ask someone to join you or share ideas.","Which food on my list helps me most?","Rest after shopping."],["Brain challenge","Enjoyable challenges can build mental engagement.","Spend 15 minutes on a puzzle or strategy game.","Easier: stand and move every 20 minutes. Standard: 10-minute walk. Stretch: 15 minutes of activity.","Eat a regular meal with a vegetable.","Play a strategy game or solve a crossword.","Turn off screens 30 minutes before bed.","Play or discuss the challenge with someone.","What did I enjoy about the challenge?","Gentle stretch after sitting."],["Balance and reach","Reaching safely supports everyday tasks.","Practise reaching forward and to the side while holding a support.","Easier: seated reaching. Standard: standing reach with support. Stretch: reach while standing on one foot with support.","Include fish or another oily food, if suitable for you.","Describe a route you know well, step by step.","Keep your bed and floor area clear.","Share a shopping or cooking task with someone.","Which reach felt most controlled?","Rest and breathe."],["Preventive checklist","Prevention works best with a plan.","Review the preventive-care checklist and choose one question to ask.","Easier: seated marching. Standard: 10-minute walk. Stretch: 15-minute walk.","Include calcium and vitamin D sources (dairy, fish, eggs, fortified foods) within your plan.","Write down three questions for your clinician.","Set a bedtime reminder.","Ask a relative or friend about their check-ups.","What is my next preventive step?","Rest and hydrate."],["Connection plan","Planned contact is easier to keep.","Plan one social contact for each day next week.","Easier: sit-to-stand twice. Standard: 10-minute walk. Stretch: 15-minute walk with a friend.","Share a meal or drink with a friend.","Learn a short poem or song in a language you enjoy.","Keep a regular bedtime.","Make one call or visit this week.","Who will I connect with next week?","A slow, relaxed afternoon."],["Review your plate","Balanced choices are easier when you review them.","Look at last week’s meals and choose one to repeat.","Easier: sit-to-stand twice. Standard: 10-minute walk. Stretch: 15-minute walk.","Add one new vegetable or wholegrain to a favourite meal.","Write three words that describe your week’s meals.","Keep your sleep routine steady.","Share a healthy recipe with someone.","Which meal habit do I want to keep?","A relaxed evening."],["Plan ahead","A plan that fits your life is easier to sustain.","Choose three habits to keep for the next month.","Easier: a short mobility routine. Standard: 20 minutes of activity across the week. Stretch: a longer weekly plan.","Plan balanced meals for one week.","Choose a learning activity for the next month.","Keep a consistent sleep routine.","Plan regular contact with people who matter.","What habit will I keep, and what support do I need?","Plan a rest day in the coming week."],["Celebrate and continue","Progress is built from small, repeated actions.","Review your 30 days and write down three wins.","Easier: stand and sit. Standard: 10-minute walk. Stretch: 20 minutes of activity you enjoy.","Write your favourite balanced meal from the challenge.","Teach someone one thing you learned.","Notice the sleep habit that helped most.","Share your experience with someone supportive.","What is the one habit I will keep, and how will I keep it?","Rest and celebrate your effort."]],tc=qy.map((l,m)=>({day:m+1,theme:l[0],learn:l[1],activity:l[2],move:l[3],eat:l[4],brain:l[5],sleep:l[6],social:l[7],reflect:l[8],rest:l[9]})),Gy=[["who-wrha","guidance","World Health Organization","2015","World report on ageing and health","WHO, Geneva","https://www.who.int/publications/i/item/9789241565042","HTTP 200","Global"],["who-dha","guidance","World Health Organization","2020","Decade of Healthy Ageing 2021–2030","WHO initiative page","https://www.who.int/initiatives/decade-of-healthy-ageing","HTTP 200","Global"],["who-ageing","guidance","World Health Organization","Current revision","Ageing and health (fact sheet)","WHO","https://www.who.int/news-room/fact-sheets/detail/ageing-and-health","HTTP 200","Global"],["who-diet","guidance","World Health Organization","Current revision","Healthy diet (fact sheet)","WHO","https://www.who.int/news-room/fact-sheets/detail/healthy-diet","HTTP 200","Global"],["who-pa","guidance","World Health Organization","2020","WHO guidelines on physical activity and sedentary behaviour","WHO, Geneva","https://www.who.int/publications/i/item/9789240015128","HTTP 200","Global"],["who-falls","guidance","World Health Organization","Current revision","Falls (fact sh
