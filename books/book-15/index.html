means","What ageing means",c("Ageing is the accumulation of changes over time that gradually alter how the body and mind work. It starts well before old age. Bone density typically peaks in young adulthood, reaction time changes gradually across midlife, and many people notice slower recovery from illness or exercise in their thirties or forties. Ageing is best understood as a lifelong process rather than a stage that begins at a fixed age."),c("The World Health Organization (WHO) describes healthy ageing as “the process of developing and maintaining the functional ability that enables well-being in older age”. The definition is deliberately broad. It does not require the absence of illness, wrinkles or the need for help. It focuses on what people can do, what matters to them, and whether their surroundings support them."),W("lifespan-healthspan"),q("info","A useful distinction","Ageing describes change over time. Disease describes a condition with a specific cause and treatment pathway. Many people age well while living with a long-term condition, and some people experience serious illness early in life. The two should not be confused, and an illness should never be dismissed as “just getting older”.")),d("key-terms","Lifespan, healthspan and longevity",c("Lifespan is the number of years a person lives. Healthspan is the portion of that life lived in good health, usually meaning free from major disease or significant functional limitation. Longevity is a broad term for long life, either for an individual or for a population. Healthspan has no single agreed definition, so researchers measure it in different ways, including self-rated health, the ability to perform daily tasks and specific clinical markers."),Fa("**Lifespan:** the total number of years lived.","**Healthspan:** years lived with good physical, cognitive and emotional function.","**Longevity:** long life, studied at individual or population level.","**Functional ability:** the capacity to do what is needed and wanted in daily life, from washing and dressing to shopping, managing money and keeping in touch with people."),c("Healthy ageing aims to extend the years of good function, rather than adding years of frailty or dependence. This is why healthspan, and not lifespan alone, sits at the centre of this book.")),d("dimensions","Physical, cognitive, emotional and social dimensions",c("Healthy ageing has several interacting dimensions. Physical health covers strength, balance, heart and lung fitness, sensory abilities and bodily comfort. Cognitive health includes memory, attention, language, problem-solving and processing speed. Emotional wellbeing covers mood, stress, resilience and a sense of meaning. Social health describes the quality and number of relationships and the feeling of belonging. Environmental factors such as housing, transport, income, safety and access to services shape all of these."),Pi("Five dimensions of healthy ageing",["Dimension","What it includes","Examples of support"],[["Physical","Strength, balance, cardiovascular fitness, sensory function","Regular walking and strength exercises adapted to ability"],["Cognitive","Memory, attention, language, reasoning","Learning a new skill, reading, conversation with others"],["Emotional","Mood, stress, resilience, sense of purpose","Talking to a professional when low mood persists; meaningful routines"],["Social","Relationships, belonging, participation","Regular contact with family, friends and community groups"],["Environmental","Housing, income, transport, safety, services","Home safety adaptations, accessible transport, community services"]]),q("info","Why the dimensions interact","Loneliness can reduce physical activity. Poor sleep can affect mood and memory. Pain can limit social participation. Improving one dimension often supports the others, which is why integrated approaches are usually more practical than single-focus advice.")),d("function-independence","Functional ability and independence",c("Many experts consider functional ability to be the most meaningful outcome of ageing. Basic activities of daily living (ADLs) include bathing, dressing, eating, toileting and moving from bed to chair. Instrumental activities of daily living (IADLs) include shopping, preparing meals, managing medicines and money, using transport and using the telephone. Difficulty with an IADL can be an early sign of change and a prompt to seek support before a crisis occurs."),c("Independence does not mean doing everything alone. Many people rely on family, neighbours, technology or professional services and still live with dignity and control. Healthy ageing supports choice: the ability to decide how to live, whom to rely on and what matters most."),vo("Why function matters more than appearance","Appearance-based goals are hard to measure and often depend on factors outside a person’s control. Functional goals, such as climbing the stairs to a flat, carrying shopping or getting up from the floor after gardening, are concrete, personal and closely linked to safety and independence.")),d("anti-ageing-culture","Healthy ageing versus anti-ageing culture",c("Commercial anti-ageing culture often frames ageing as a problem to be solved. Products and services may promise to reverse signs of ageing or to slow the biological clock. Some treatments, such as sun protection and certain medically supervised skin treatments, have genuine benefits for skin health. However, claims about reversing ageing itself are not supported by current evidence in humans, and many tests and products are unproven."),c("Healthy ageing takes a different starting point. It accepts that change is normal and focuses on what helps people function, feel well and stay connected. It also recognises that ageing is shaped by social conditions, including income, discrimination, housing and access to healthcare, not only by personal choices."),q("myth","Myth","“Healthy ageing means looking young.” Fact: appearance is not a reliable indicator of health or function. People who look similar can have very different levels of strength, memory and wellbeing.")),d("quality-of-life","Why quality of life matters alongside lifespan",c("Quality of life describes how a person experiences their life, including physical comfort, relationships, autonomy, purpose and satisfaction. It is usually measured by asking the person rather than by an outside observer. Two people with the same diagnosis can have very different experiences depending on support, environment, finances and personal goals."),c("Focusing only on lifespan can miss what matters most. A longer life marked by prolonged pain, isolation or dependence may not reflect the priorities of the person living it. Good healthcare and public health aim to add life to years and years to life, in ways that match each person’s values."),$(14,"Physical activity is one of the most practical ways to protect everyday function. This HERBULANCE title helps readers explore movement, exercise and lifelong fitness in more depth, which is a sensible next step after this chapter."))),K(2,"The Biology of Human Ageing","Ageing is driven by many interacting biological processes. Over time, cells accumulate damage, repair systems become less efficient and the body’s reserve for coping with stress narrows. This chapter explains these processes in accessible terms and shows why people age at different rates.",["Describe how cells, tissues, organs and systems support one another.","Explain the role of cellular maintenance and repair in healthy ageing.","Describe why biological ageing varies between individuals and between body systems."],["Ageing involves gradual accumulation of molecular and cellular damage, combined with declining repair and reserve capacity.","Genes and environment both influence ageing. Neither fully determines it.","Different tissues and systems age at different rates.","Biological age is not identical to chronological age."],["hallmarks-2013","franceschi-2000","kennedy-2014","who-ageing"],d("levels","From cells to whole systems",c("The human body is organised in levels. Molecules form cells, cells form tissues, tissues form organs, and organs work together in systems such as the cardiovascular, nervous, musculoskeletal, immune and digestive systems. Ageing affects every level, but not evenly. Skin cells renew relatively quickly, while many nerve cells and heart muscle cells are long-lived and are replaced only slowly, if at all."),W("cellular-ageing"),c("Many organs have reserve capacity. The kidneys, lungs and heart can usually meet demands far above what is needed at rest. With ageing, reserve tends to decline, so an infection, a change in medicines or a period of inactivity can have a larger effect than it would have at a younger age."),q("info","Reserve capacity","Think of reserve as a safety margin. A person with good reserve may recover quickly from a short infection or a fall. A person with less reserve may take longer to return to their usual function, even though the cause is the same.")),d("maintenance","Cellular maintenance and repair",c("Cells continually repair themselves. DNA repair enzymes correct damage caused by radiation, chemicals and normal metabolism. Protein quality-control systems refold or remove damaged proteins. Autophagy, meaning “self-eating”, recycles damaged components inside cells. Mitochondria, the energy-producing structures, are also repaired and replaced. These processes work very effectively when young, but they are not perfect, and their efficiency can decline with age."),c("Stem cells replenish tissues such as blood, skin and muscle. Over time, stem-cell pools can become less active, and the cells they produce may be less functional. Together, these changes reduce a tissue’s ability to renew itself after injury or stress.")),d("genes-environment","Genetic and environmental influences",c("Genes influence many aspects of ageing, including how efficiently cells repair DNA, how the immune system responds and how the body handles cholesterol. However, genes are only part of the story. Exposures such as tobacco smoke, air pollution, ultraviolet radiation, a diet low in essential nutrients, physical inactivity, chronic stress and poor sleep can accelerate damage or weaken protective processes."),c("Social and economic conditions also shape biology through exposure, stress, nutrition, housing and access to healthcare. This is why ageing patterns differ between groups, and why changing population health depends on more than individual behaviour (see Chapter 49).")),d("variability","Biological variability between individuals",c("Two people of the same chronological age can differ greatly in strength, cognition, metabolic health and disease risk. These differences reflect genetics, exposures, previous illnesses, education, occupation, social support and chance. Researchers call this biological heterogeneity."),c("Variability also exists within a person. Different systems age at different rates. Someone may have excellent cardiovascular fitness alongside early joint stiffness, or sharp memory alongside reduced hearing. Ageing is not a single clock running at one speed."),vo("Why some people seem to age more slowly","Many people with long, healthy lives share features such as stable relationships, regular physical activity, adequate sleep and access to healthcare. Researchers study these patterns, but it is important not to assume that a person who is ageing more quickly is at fault. Many factors are beyond individual control.")),d("different-rates","Why ageing does not happen at the same rate for everyone",c("Some functions follow a broadly predictable pattern. Processing speed often declines gradually from early adulthood, while vocabulary and accumulated knowledge, sometimes called crystallised intelligence, tend to remain stable or even increase into later life. Muscle strength usually declines faster than muscle size, and bone density changes differ between women and men, especially around menopause."),c("Because systems age at different rates, a balanced view is important. Improving one area, such as leg strength, may support balance and independence even when other systems show age-related change."),q("fact","Fact","Ageing is not the same as disease. Many age-related changes are normal. However, the risk of many diseases rises with age, so the two are often linked in practice, and both deserve attention."))),K(3,"The Hallmarks and Mechanisms of Ageing","In 2013, a group of researchers proposed nine hallmarks of ageing, and a 2023 update expanded the framework to twelve. The hallmarks organise a large body of laboratory and animal research. They are a map of research questions rather than a list of treatments, and their importance varies between tissues and species. This chapter explains each concept and its scientific status.",["Describe the main hallmarks of ageing and how they interact.","Distinguish well-established findings from early or speculative research.","Explain why interventions targeting ageing mechanisms remain uncertain in humans."],["The hallmarks framework organises ageing research. It is not a diagnostic checklist.","Most hallmarks are best documented in cells and animals. Human causal evidence is still developing.","Hallmarks interact, so no single pathway explains ageing.","No intervention has yet been proven to slow ageing as a whole in humans."],["hallmarks-2013","hallmarks-2023","blackburn-2015","campisi-2013","sun-2016","covarrubias-2021"],d("framework","What the hallmarks framework is",c("The 2013 paper identified nine hallmarks of ageing: genomic instability, telomere attrition, epigenetic alterations, loss of proteostasis, deregulated nutrient-sensing, mitochondrial dysfunction, cellular senescence, stem-cell exhaustion and altered intercellular communication. The 2023 update added disabled macroautophagy, chronic inflammation and dysbiosis, giving twelve hallmarks, and grouped them into primary, antagonistic and integrative categories."),W("hallmarks"),c("The framework has been valuable because it connects many research fields. It also has limits. The hallmarks overlap, were defined largely from laboratory and animal studies, and do not come with validated tests for routine use in individuals.")),d("damage-repair","Genomic instability, telomeres and epigenetic change",c("Genomic instability refers to the accumulation of DNA damage and repair errors. Damage from ultraviolet light, tobacco smoke and normal metabolism is continually repaired, but repair is imperfect. Telomeres are protective caps at the ends of chromosomes. They shorten as cells divide, and very short telomeres can signal a cell to stop dividing. Telomere length is associated with age and some disease risks, but it is a variable and imperfect marker, and telomere testing has limited clinical value for individuals."),c("Epigenetic alterations change how genes are switched on or off without changing the DNA sequence itself. DNA methylation patterns drift with age, and this drift underlies “epigenetic clocks” that estimate biological age. These clocks are powerful research tools, but they are correlational and are not yet established as clinical tests for individuals (see Chapter 52)."),q("caution","Scientific status","DNA damage and telomere shortening are well documented in cells and tissues. Whether these processes can be modified in humans to extend healthy life is still under investigation.")),d("proteins-energy","Proteostasis, mitochondria and nutrient sensing",c("Proteostasis is the network that keeps proteins correctly folded and removes damaged ones. Autophagy is part of this system. Both tend to decline in many tissues with age. Mitochondria produce energy but also generate reactive oxygen species. Early theories proposed that accumulated oxidative damage was the main driver of ageing. Later research shows that reactive oxygen species also act as signalling molecules and that the picture is more complex. Large trials of antioxidant supplements have not confirmed the benefits once suggested (see Chapter 15)."),c("Nutrient-sensing pathways, including insulin and insulin-like growth factor signalling, mTOR and AMPK, regulate growth, metabolism and cellular stress responses. In laboratory animals, altering these pathways can extend lifespan. In humans the relationships are less clear, and drugs that target these pathways carry risks. The translation from animal findings to human benefit remains uncertain."),q("evidence","Animal research is not human proof","Many lifespan results come from mice, worms or fruit flies. These studies are valuable for discovering mechanisms, but they do not establish that the same intervention will be safe or effective in people.")),d("senescence-stem","Cellular senescence, stem cells and communication",c("Senescent cells stop dividing but do not die. They can release inflammatory signalling molecules that affect neighbouring cells, a pattern known as the senescence-associated secretory phenotype. Small numbers of senescent cells may help tissue repair in the short term, but their accumulation over time may be harmful. In some mouse studies, removing senescent cells improved health markers, which has motivated research into senolytic drugs (see Chapter 53)."),c("Stem-cell exhaustion occurs when stem cells lose their ability to renew tissues. Altered intercellular communication describes changes in how cells signal one another through hormones, cytokines and other messengers. These changes contribute to declining organ function and to inflammation.")),d("inflammation-microbes","Chronic low-grade inflammation and dysbiosis",c("Inflammation is a normal, protective response to injury and infection. With ageing, many people develop chronic, low-grade inflammation, sometimes called inflammageing. Raised inflammatory markers are associated with cardiovascular disease, frailty and cognitive decline in many studies. However, inflammation is also a consequence of many conditions, so cause and effect are difficult to separate."),c("Dysbiosis describes an imbalance in the gut microbial community. Diet, medicines and infections can shift the microbiome, and some researchers link these shifts to inflammation. The link is an active research area. Current evidence supports eating a variety of fibre-rich foods as a practical approach, but it does not allow precise prescriptions."),$(2,"The HERBULANCE Gut Health & Digestion Guide helps readers explore how the gut microbiome, fibre and digestion work together, which complements the discussion of dysbiosis here.")),d("status","Scientific status and limitations",c("The hallmarks are best read as a research framework with varying levels of evidence. Some processes are measured reliably in laboratory systems; others are inferred from indirect markers. Many interventions that worked in animals have not translated into human therapies, and human trials of ageing-related outcomes are difficult, expensive and slow."),Fa("**Strong evidence (cells and animals):** DNA damage responses, telomere biology, senescence and nutrient-sensing pathways.","**Mixed evidence (humans):** epigenetic clocks, inflammatory markers and microbiome patterns.","**Not established (humans):** any single intervention that reliably slows ageing as a whole."))),K(4,"Genetics, Family History and Lifestyle","Genes shape how people age, but they do not decide the future. This chapter explains genetic predisposition, gene–environment interaction, what epigenetics means in practical terms, how family history supports prevention, and why genetic tests give probabilities rather than certainties.",["Explain how genetic predisposition differs from genetic determinism.","Describe gene–environment interaction using clear examples.","Use family history responsibly in preventive planning and understand the limits of genetic testing."],["Most ageing-related conditions involve many genetic variants, each with a small effect.","The same genetic variant can have different consequences in different environments.","Family history is valuable for prevention, but it is not a diagnosis.","Genetic test results are probabilities and require professional interpretation."],["hallmarks-2023","lancet-2024","who-dementia"],d("predisposition","Genetic predisposition",c("Most ageing-related conditions, including heart disease, type 2 diabetes, osteoporosis and dementia, are influenced by many genetic variants that each have a small effect. Rare variants can have large effects on specific conditions, which is why some families show strong patterns of disease. Predisposition means a higher or lower likelihood, not an inevitable outcome."),c("Twin and family studies suggest that genes contribute to variation in lifespan. However, most of the variation between people is not explained by common genetic variants. Environment, behaviour, social conditions and chance all play substantial roles."),q("caution","A common misunderstanding","A parent or grandparent who lived to an old age does not guarantee the same for descendants. A family history of disease does not guarantee that it will appear. Conversely, a person without a family history can still develop a condition.")),d("interaction","Gene–environment interaction",c("Genes and environments interact. For example, carrying the APOE ε4 variant is associated with a higher average risk of Alzheimer’s disease, but the strength of this association varies with factors such as cardiovascular health, hearing, physical activity and education. Similarly, inherited differences in how the body handles cholesterol may matter more for people whose diets are high in saturated fat or who are physically inactive."),W("gene-environment"),c("The practical message is that a genetic predisposition is often modifiable in its expression. Lifestyle and healthcare can change the balance between inherited risk and environmental exposure, even when they cannot change the inherited risk itself.")),d("epigenetics","Epigenetics explained responsibly",c("Epigenetics refers to chemical modifications of DNA and associated proteins that influence which genes are active. Epigenetic patterns respond to age, diet, smoking, physical activity, infection and stress. Some epigenetic changes are linked to health outcomes, and researchers use them to build biological-age estimates. However, epigenetic patterns are not fixed destiny, and the effects of specific habits on particular epigenetic marks in humans are still being studied."),c("The popular idea that you can simply switch genes on or off through lifestyle should be treated cautiously. Gene activity does respond to environment, but the precise effect of an individual’s habits on a particular marker is rarely certain.")),d("family-screening","Family history and preventive screening",c("Family history is one of the most useful pieces of preventive information a person can share with a clinician. A close relative with early heart disease, bowel or breast cancer, or diabetes may mean that screening should begin earlier or happen more often. Guidance varies by country, so the best approach is to discuss family history with a primary-care professional and bring relevant details."),Fa("Write down relatives’ conditions, their ages at diagnosis and any known genetic diagnoses in the family.","Include close relatives, such as parents and siblings, first.","Ask whether a referral for genetic counselling is appropriate when several relatives share the same serious condition.")),d("limits-testing","What lifestyle can and cannot change",c("Lifestyle can change many risk factors, including blood pressure, blood sugar, cholesterol, body weight, physical activity, smoking, sleep, alcohol use and social connection. It cannot change inherited DNA sequence, sex, ancestry or many early-life circumstances. Recognising this difference prevents unfair blame. A person with a strong inherited risk may do everything well and still develop a condition, and the reverse is also true."),c("Genetic testing has grown in popularity, including direct-to-consumer tests that report risk scores. Some results can be informative, but many polygenic risk scores have limited accuracy for individuals, and results are easily misunderstood. Clinical genetic testing can guide prevention when ordered and interpreted with genetic counselling. Legal protection against genetic discrimination in insurance or employment differs between countries."),q("safety","Before you test","Consider what you will do with the result, who will see it, how it will be stored and whether you have access to professional support. Do not change prescribed medicines or stop screening because of a direct-to-consumer result without speaking to a clinician."))),K(5,"Lifespan, Healthspan and the Science of Longevity","Longevity research is often reported through headlines about life expectancy or living to 100. This chapter explains why population statistics are not personal predictions, how healthspan is measured, why survival data must be read carefully and why social conditions shape both how long and how well people live.",["Explain the difference between living longer and living healthier.","Interpret population life expectancy and healthspan measures with appropriate caution.","Identify common biases in longevity research."],["Life expectancy is a population average, not a prediction for an individual.","Healthspan can be measured in several ways, and no single measure is complete.","Compression of morbidity is a hopeful concept that must be tested, not a guaranteed outcome.","Social and environmental conditions strongly shape both lifespan and healthspan."],["fries-1980","dong-2016","who-wrha","who-ageing"],d("living-longer-healthier","Living longer versus living healthier",c("Life expectancy has risen in most countries over the past century. Major contributors include falls in infant and child mortality, improved sanitation, vaccination, better nutrition, treatment of infections and cardiovascular disease, and safer working conditions. Gains in survival in later life have also been substantial in many places. However, the number of years people live in good health does not always rise at the same pace."),c("The question for healthy ageing is therefore not only “How long?” but “How well?”. An increase in years lived with disability or ongoing illness has very different implications for families and health systems than an increase in healthy years."),W("healthspan-independence")),d("population-individual","Population longevity versus individual predictions",c("A life table summarises death rates at each age in a population. Life expectancy at birth is a statistical average across everyone born in a given year and place. It says nothing reliable about any single person’s future. Some people die young despite good habits, and others live into very old age despite risk factors. Predictions about an individual require personal information, and even then they carry uncertainty."),q("myth","Myth","“If life expectancy is 80, I will live to 80.” Fact: life expectancy describes a population average. A person’s own likely lifespan depends on health, circumstances, family history and environment, and it cannot be known precisely.")),d("measuring-healthspan","Measuring healthspan",c("Researchers and clinicians use several measures of healthspan. Self-rated health is simple and often informative. Functional measures include grip strength, the chair-stand test, walking speed and the ability to perform daily activities. Frailty indexes count deficits across many health domains. Cognitive tests and clinical markers, such as blood pressure and kidney function, are also used. Each measure captures part of the picture."),Pi("Examples of healthspan-related measures",["Domain","Example measure","What it can tell you","Limitation"],[["Function","Gait speed, chair-stand test, grip strength","Practical capacity for everyday tasks","Affected by temporary illness or pain; needs standard technique"],["Self-report","Self-rated health; questions about daily activities","Personal experience and perceived ability","Can be influenced by mood and expectations"],["Frailty","Frailty index or clinical frailty scale","Overall vulnerability to adverse outcomes","Requires clinical judgement and time"],["Clinical","Blood pressure, kidney function, HbA1c","Risk of specific diseases","Reflects one system; needs professional interpretation"]])),d("survival-statistics","Survival statistics and their limitations",c("Survival statistics can be presented as period or cohort measures, and the difference matters. Period life tables describe mortality during one time period using current death rates. Cohort data follow a group of people born in the same year as they age, which can differ if conditions change. Estimates also depend on the quality of birth and death registration. Some places have incomplete records, so their estimates are less certain."),c("The compression of morbidity concept, described by James Fries in 1980, proposes that if people delay the onset of chronic disability, the period of disability before death can shrink. It is an encouraging idea, but evidence varies across conditions and populations. Some analyses suggest compression in some settings and others show expansion. The concept should be treated as a hypothesis to be tested.")),d("determinants","Social and environmental determinants",c("Longevity and healthspan vary strongly with income, education, occupation, housing quality, air quality, access to healthcare, personal safety and social support. Differences between regions, and between groups within countries, are often substantial. These patterns reflect structural conditions as much as individual choices, which is why public policy has a central role in healthy ageing (see Chapter 49).")),d("research-interpretation","Why longevity research requires careful interpretation",c("Longevity studies are vulnerable to several biases. Reverse causation occurs when illness leads to lower activity or weight loss, making the activity or weight appear harmful. Survivor bias arises when only people who survived a period are studied. Healthy-user bias can make a treatment look beneficial because people who choose it are often healthier in other ways. Good studies try to address these problems through design and statistical adjustment, but they cannot remove them entirely."),vo("The debate about a possible human lifespan limit","A 2016 analysis published in Nature examined data on the oldest people and proposed that the maximum human lifespan may be limited. Other researchers disputed this interpretation, arguing that the data are sparse and that improvements may continue. The debate shows that even prominent findings can be contested, and that conclusions should be read with care."))),K(6,"Common Myths About Ageing","Myths about ageing are everywhere. Decline is said to be unavoidable, ageing is said to be reversible, a single product is said to transform lifespan, and a test is said to reveal a precise biological age. This chapter examines the most common myths, what the evidence shows and how to recognise misleading claims.",["Identify common myths about ageing and explain the evidence that challenges them.","Evaluate product and service claims using basic evidence questions.","Recognise warning signs of misleading longevity marketing."],["Some age-related change is normal, but decline is neither uniform nor inevitable.","No treatment has been proven to reverse human ageing as a whole.","Single products rarely transform health. Consistent habits have stronger evidence.","Red-flag language is a signal to pause, check and ask a professional."],["who-ageing","hallmarks-2023","bjelakovic-2007","moqri-2023"],d("inevitable-decline","The belief that decline is inevitable",c("Some change with age is universal. Maximum heart rate tends to fall, muscle mass declines, and most people experience some slowing of processing speed. The pace and extent of change vary enormously, however. Many older adults maintain strength, independence and good cognition for many years. Physical activity, strength training, social engagement and effective treatment of conditions such as high blood pressure can change the trajectory for many people."),q("myth","Myth","“Decline is inevitable, so nothing can be done.” Fact: age-related change is real, but its impact depends heavily on activity, healthcare, environment and social support.")),d("reversal","The idea that ageing can be reversed completely",c("Researchers have shown in laboratory and animal models that some ageing-related changes can be partly reversed, including certain features of cells and tissues. These experiments matter, but they do not show that whole-body ageing can be reversed in humans. No treatment has yet been proven in clinical trials to reverse human ageing or extend healthy lifespan."),q("myth","Myth","“Ageing can be fully reversed.” Fact: this is not established in humans. Some promising research is under way, but claims of reversal usually rest on animal studies, small pilot studies or measures that have not been validated.")),d("anti-ageing-products","Anti-ageing product claims",c("Cosmetic products can improve the appearance of skin. Daily sun protection reduces photoageing, and some topical treatments have evidence for improving fine lines and texture. However, anti-ageing marketing often exaggerates results, uses vague terms such as “cellular repair” or “youth proteins”, or relies on before-and-after photographs without controls. Claims should be judged by their evidence, not by their language."),Pi("Questions to ask about a product claim",["Question","Why it matters"],[["Was it tested in people similar to me?","Results in animals or cells may not transfer to humans"],["Was there a control group?","Without a control, apparent improvement may reflect chance or expectation"],["Is the outcome clinically meaningful?","Appearance changes may not reflect health or function"],["Who funded the study, and is this disclosed?","Funding does not automatically invalidate results, but it should be considered"],["Does the claim concern appearance, or a disease?","Claims about disease require stronger evidence and regulatory oversight"]])),d("biological-age-tests","Misleading biological-age tests",c("Biological-age tests are sold directly to consumers and use blood, saliva or DNA methylation analyses to produce an estimated “biological age”. Results can differ between providers, and such scores are not standardised. They may be interesting, but their accuracy for individuals is often unknown and they rarely change the advice a clinician would give. Chapter 52 explains their limits in more detail.")),d("influencers","Longevity influencer misinformation",c("Social media has made longevity advice highly visible, including dramatic daily protocols, expensive supplements and unlicensed clinics. Some creators share personal experiences and are open about uncertainty. Others present untested interventions as proven. Warning signs include promises of guaranteed results, secret formulas, pressure to buy quickly, claims that doctors are hiding information, and testimonials presented as evidence."),q("caution","Red flags in longevity marketing","Guaranteed results; undisclosed commercial ties; claims that one food or supplement transforms ageing; no mention of side effects; encouragement to stop prescribed medicines; and replacement of medical advice with a paid programme.")),d("one-thing","The misconception that one supplement or diet can transform lifespan",c("Large trials of antioxidant supplements, including some taken at high doses, did not show that they extended life, and some analyses linked certain high-dose antioxidants to increased mortality (see Chapter 15). Dietary patterns such as the Mediterranean pattern are associated with better health outcomes in many studies. These associations come from overall patterns and everyday habits, not from a single food. Consistent, varied habits generally have stronger evidence than any one product (see Chapters 13 and 54)."),$(10,"The HERBULANCE title on food nutrition, vitamins, minerals and essential nutrients helps readers explore nutrient sources and how to judge nutrition information critically, which is useful when assessing supplement claims.")))],Sy=[K(7,"How Nutritional Needs Change With Age","Nutritional needs are shaped by body size, body composition, activity, health status, medicines and social circumstances, and they shift across adulthood. This chapter explains how energy, protein, micronutrient, hydration and appetite needs can change, why individual variation is large, and why nutrient density matters more than restriction for many people.",["Describe how energy needs and body composition change across adulthood.","Explain why protein and some micronutrient needs can change with age.","Identify factors that influence appetite, food preferences and hydration."],["Energy needs tend to fall with reduced activity and changing body composition, but nutrient needs do not fall in the same proportion.","Protein needs per kilogram may be higher in later life to protect muscle, and individual needs vary.","Absorption of some micronutrients, including vitamin B12, can decline with age.","Appetite changes are common but are not normal when they cause unplanned weight loss."],["espen-geri","protage","nam-macro","efsa-drv","nhs-eatwell","nih-b12"],d("energy","Changes in energy requirements",W("nutrition-life-stages"),c("Energy needs depend on body size, lean mass and activity. Basal metabolic rate, the energy used at rest, is closely linked to lean body mass, so it tends to fall as muscle mass declines. Physical activity is usually the largest variable. A person who walks, gardens and cooks may need considerably more energy than a person who spends most of the day seated, at any age."),c("Because energy needs can fall, older adults are often encouraged to choose foods that deliver nutrients efficiently. The goal is adequate nutrition and a healthy body weight without unnecessary restriction. Intentional weight loss is generally not advisable for people who are already thin, frail or losing weight. Any weight-management plan should be designed with a clinician (see Book 11 below)."),$(11,"The HERBULANCE weight management guide helps readers explore metabolism and sustainable habits. It is most useful for people who are seeking gradual, medically appropriate change, and it complements the caution about restriction in this chapter.")),d("protein-micronutrients","Protein and micronutrient needs",c("Protein supports muscle, skin, immune cells and enzymes. The US Dietary Reference Intake for adults is 0.8 g per kilogram of body weight per day, and the European Food Safety Authority’s dietary reference value for adults is 0.83 g per kilogram per day. For healthy older adults, the ESPEN geriatric nutrition guideline suggests a higher intake of about 1.0 to 1.2 g per kilogram per day, with individual adjustment by clinicians. People with kidney disease need individual advice, because protein recommendations differ for them."),c("Micronutrient needs also change. Vitamin B12 absorption from food can decline because stomach acid production may fall, and some medicines reduce absorption. Vitamin D synthesis in the skin falls with age and with limited sun exposure. Iron requirements differ by sex and life stage: the US Recommended Dietary Allowance for women aged 19 to 50 is higher than for women aged 51 and over, and is the same as for men at older ages. Figures differ between countries, so check your national guidance.")),d("appetite-preferences","Appetite and food preferences",c("Appetite can change for many reasons: a reduced sense of taste and smell, dental problems, medicine side effects, nausea, low mood, bereavement, loneliness, fatigue, difficulty shopping or cooking, and some illnesses. Food preferences can also shift, sometimes because certain foods have become harder to chew or swallow. A lower appetite is not a harmless or inevitable part of ageing in every case."),q("caution","When to seek advice","Unplanned weight loss, loss of appetite lasting more than a few weeks, difficulty swallowing and persistent nausea should be discussed with a clinician. Do not try to diagnose the cause yourself.")),d("hydration","Hydration considerations",c("The sensation of thirst can become less sensitive with age, and the kidneys may be less efficient at concentrating urine. Diuretics, some heart and blood-pressure medicines, and some laxatives can increase fluid loss. Hydration needs also depend on climate, activity and illness. Chapter 12 covers hydration across the lifespan in detail.")),d("individual-variation","Individual variation",c("Nutritional needs vary between individuals. Factors include body size, sex, genetics, health conditions, medicines, activity, climate, household food access and cultural food practices. Recommendations are reference points, not personal prescriptions. Registered dietitians and clinicians can tailor advice to kidney function, diabetes management, swallowing ability and personal goals."),$(7,"The HERBULANCE meal planning and balanced nutrition guide helps readers explore how to plan regular, varied meals that match changing needs and budgets."))),K(8,"Building a Nutrient-Dense Eating Pattern","A nutrient-dense eating pattern provides plenty of vitamins, minerals, fibre and protein relative to its energy content. It is built from everyday foods that are available in many forms. This chapter shows how to build balanced meals with practical examples from several food cultures, without requiring expensive or specialist products.",["Describe the main components of a balanced eating pattern.","Build meals from affordable, culturally varied ingredients.","Recognise the practical limits of general dietary advice."],["Fill most of the plate with vegetables, fruit, legumes and whole grains, and include suitable protein foods.","The WHO recommends at least 400 g of fruit and vegetables per day, excluding potatoes and other starchy roots.","Unsaturated fats from plants and fish are generally preferred to saturated and trans fats.","The same principles apply across cuisines: variety, whole foods, and moderate salt and sugar."],["who-diet","nhs-eatwell","harvard-plate","fao-fbdg"],d("balanced-meals","Balanced meals",c("A balanced meal usually includes vegetables or fruit, a source of starchy carbohydrate (preferably wholegrain), a protein food and a small amount of unsaturated fat. Many national guides illustrate this as a plate. The Harvard Healthy Eating Plate suggests that about half the plate be vegetables and fruit, a quarter whole grains and a quarter healthy protein, with water as the main drink. Other guides use different proportions, and cultural traditions often arrange the same components differently."),W("balanced-meal"),c("The WHO recommends eating at least 400 g of fruit and vegetables a day, excluding potatoes, sweet potatoes, cassava and other starchy roots. It recommends limiting free sugars to less than 10% of total energy intake and salt to less than 5 g per day. These are population-level guidelines rather than targets for every individual.")),d("plant-foods","Vegetables, fruit, whole grains and legumes",c("Vegetables and fruit provide fibre, vitamins, minerals and other plant compounds. Variety matters, because different colours and types of produce contribute different nutrients. Frozen, tinned (canned) and dried produce all count and are often more affordable. Choose fruit tinned in juice rather than syrup, and rinse tinned beans and pulses to reduce added salt."),c("Whole grains such as oats, brown rice, wholemeal bread, maize, millet, sorghum and quinoa provide fibre and B vitamins. Legumes and pulses, including lentils, chickpeas, beans, peas and groundnuts (peanuts), provide protein, fibre, iron and folate. They are inexpensive and versatile across many cuisines."),q("info","Cultural examples","Lentil dhal with brown rice (South Asia); bean and maize tortillas with salsa (Latin America); chickpea and bulgur salad (Middle East); cowpea or black-eyed pea stew with leafy greens (West Africa); tofu and vegetable stir-fry with brown rice (East Asia); porridge with fruit and yoghurt (Europe and North America). Each can be adapted to local ingredients and budgets.")),d("proteins-fats","Nuts, seeds, protein sources and dietary fats",c("Nuts and seeds provide unsaturated fats, fibre and minerals such as magnesium. Unsalted varieties are preferable. Protein foods include fish (especially oily fish), eggs, poultry, lean meat, dairy or fortified alternatives, tofu, tempeh, legumes and nuts. Choosing a mix of protein sources across the week adds variety and can make meals more affordable."),c("Dietary fats matter for both amount and type. Olive oil, rapeseed (canola) oil, soybean oil and nut oils are rich in unsaturated fats. Butter, ghee, palm oil and coconut oil are higher in saturated fat. Industrially produced trans fats should be avoided. Many dietary guidelines recommend replacing some saturated fat with unsaturated fat, particularly from plants and fish."),q("evidence","What the evidence supports","Dietary patterns rich in vegetables, legumes, whole grains, nuts and fish are associated with better cardiovascular outcomes in many studies. Single foods rarely act alone, so the overall pattern matters more than any one ingredient.")),d("culture-meal-building","Practical meal-building examples from different cultures",c("Balanced meals can be built from familiar foods in any culture. The examples below are illustrations, not prescriptions. Portion sizes should be adapted to appetite, budget and health needs."),Pi("Balanced meal combinations across regions",["Region","Meal example","Main components"],[["Mediterranean","Lentil and vegetable soup, wholegrain bread, olive oil, yoghurt","Legumes, vegetables, wholegrain, unsaturated fat, dairy"],["South Asia","Dhal, vegetable curry, brown rice or whole-wheat chapati, cucumber raita","Legumes, vegetables, wholegrain, yoghurt"],["East Asia","Tofu and greens stir-fry, brown rice, miso soup with seaweed","Soy protein, vegetables, wholegrain, fermented food"],["West Africa","Bean stew with leafy greens, served with cassava or wholegrain, and fruit","Legumes, leafy greens, starchy staple, fruit"],["Latin America","Black beans, corn tortillas, avocado and tomato salad, fish or egg","Legumes, wholegrain maize, healthy fats, vegetables"],["North America and UK","Wholegrain pasta with bean and vegetable sauce, side salad, yoghurt","Wholegrain, legumes, vegetables, dairy or alternative"],["Middle East","Chickpeas, bulgur salad with tomato and herbs, grilled fish or eggs","Legumes, wholegrain, vegetables, protein"],["Oceania","Baked fish, root vegetables and dark greens, wholegrain bread","Fish, vegetables, wholegrain"]]),q("info","Dietary traditions","Vegetarian, vegan, halal, kosher, Jain, Buddhist and other traditions can all follow balanced patterns. Plans that exclude whole food groups need careful planning for vitamin B12, iron, calcium, iodine and protein; a registered dietitian can help."),$(7,"The HERBULANCE meal planning guide helps readers explore practical menus, batch cooking and shopping plans that fit a range of cultures and budgets."))),K(9,"Protein, Muscle Maintenance and Healthy Ageing","Muscle is more than a tool for movement. It stores energy, supports metabolism, helps regulate blood sugar and protects against falls. Protein is essential for building and maintaining muscle, but the amount, quality, timing and level of physical activity all matter. This chapter explains the evidence and the limits of generalised advice.",["Explain how dietary protein supports muscle protein synthesis.","Describe practical strategies for distributing protein across the day.","Identify situations that require individual professional guidance."],["Muscle protein synthesis responds to protein intake and resistance exercise together.","Some older adults show a blunted muscle response to protein, so spreading protein across meals is often suggested.","Protein needs vary. Kidney disease and other conditions require individual planning.","Unplanned weight loss or poor appetite needs assessment rather than guesswork."],["espen-geri","protage","morton-2018","nhs-eatwell"],d("protein-muscle","Protein’s role in muscle maintenance",c("Skeletal muscle is in constant turnover. Muscle protein synthesis builds new muscle proteins, while breakdown removes them. Muscle mass is maintained when synthesis matches or exceeds breakdown over time. Amino acids from dietary protein, particularly leucine, stimulate synthesis. Resistance exercise increases the responsiveness of muscle to protein, so protein and exercise work together."),c("A systematic review and meta-analysis of resistance-training studies in adults found that protein supplementation, on average, increases gains in muscle mass and strength beyond training alone. Benefits depend on the training programme and on the person’s total diet. Supplements are not essential for most people who already eat enough protein from food.")),d("ageing-muscle-response","Age-related changes in muscle and the protein response",c("With ageing, muscle becomes less responsive to some stimuli. Researchers describe a blunted muscle protein synthesis response to a given dose of protein in some older adults, sometimes called anabolic resistance. This is one reason guidance suggests that older adults aim for a meaningful amount of protein at each meal, combined with resistance activity. The exact threshold varies by person, age, health and body size, so a single number should not be treated as universal.")),d("sources-distribution","Dietary protein sources and distribution across the day",c("Good protein sources include eggs, dairy and fortified dairy alternatives, fish, poultry, lean meat, tofu, tempeh, legumes and nuts. Plant proteins can differ in amino-acid profile and digestibility. Combining cereals with legumes across the day can supply all essential amino acids, and total intake matters more than perfect balance at every meal."),c("Spreading protein across meals is a practical strategy. Rather than eating little protein at breakfast and most of it at dinner, a moderate portion at each meal can help. Examples include eggs or yoghurt at breakfast, beans or fish at lunch and tofu, lentils or lean meat at dinner."),W("protein-muscle")),d("limits","Limitations of generalised protein recommendations",c("Protein recommendations are population guidelines. Individual needs differ according to body size, kidney and liver function, medicines, illness, pregnancy and activity. People with chronic kidney disease may be advised to limit protein, and people with liver disease may need specific advice. Higher protein intake is not automatically better, and very high intakes can cause problems for some people."),q("caution","Protein and kidney health","If you have a kidney condition, or have been told your kidney function is reduced, do not increase or decrease protein on your own. Ask a clinician or registered dietitian for personalised advice.")),d("when-to-seek","When professional dietary guidance is appropriate",c("Seek professional guidance if you are losing weight without trying, have a poor appetite for several weeks, have difficulty chewing or swallowing, live with diabetes, kidney or heart conditions, or are recovering from illness or surgery. Registered dietitians, nurses and primary-care clinicians can assess the risk of malnutrition and plan practical changes. Many health systems use screening tools for this purpose."),$(14,"The HERBULANCE physical activity guide helps readers explore how resistance exercise and daily movement work alongside nutrition to support muscle maintenance."))),K(10,"Vitamins, Minerals and Micronutrient Awareness","Micronutrients are needed in small amounts but play essential roles in energy metabolism, immunity, bone health, nerves and blood. Some become harder to obtain or absorb with age. This chapter reviews the micronutrients most often discussed in later life, explains how deficiencies are identified, and promotes a food-first approach with responsible supplementation.",["Describe the roles of key vitamins and minerals in healthy ageing.","Identify common food sources and age-related risks for each.","Explain why testing and professional advice matter before supplementation."],["Vitamin B12 absorption can decline with age. Deficiency can affect nerves and blood, sometimes with subtle early symptoms.","Vitamin D supports bone and muscle. Sunlight, season, skin tone and housebound living all affect status.","Iron, calcium, folate, magnesium, zinc and potassium each have specific roles, sources and risks at high doses.","Supplements can help specific groups but can also cause harm, so they should be used under guidance."],["nhs-vitd","nih-vitd","nih-b12","nih-calcium","nih-iron","nih-folate","nih-mg","nih-zinc","nih-k","efsa-drv"],d("b12-d","Vitamin B12 and vitamin D",c("Vitamin B12 is needed for nerve function and the production of red blood cells. It is found naturally in animal foods such as meat, fish, eggs and dairy, and in fortified foods such as some breakfast cereals and plant milks. With ageing, stomach acid production can fall, reducing absorption of food-bound B12. Some medicines, including metformin and acid-suppressing drugs, can also reduce absorption. Deficiency can cause tiredness, anaemia, numbness or tingling, and problems with memory or balance. Symptoms can be subtle, so testing matters."),c("Vitamin D helps the body absorb calcium and maintain bone and muscle. Most people make vitamin D from sunlight on the skin, but skin type, latitude, season, clothing and limited time outdoors reduce production. Few foods contain much vitamin D: oily fish, egg yolk and fortified foods are the main sources. The UK NHS advises that everyone consider a daily 10 microgram (µg) supplement in autumn and winter, and that people who are rarely outdoors or who have darker skin consider taking it all year round. The NHS also warns that more than 100 µg a day can be harmful for adults."),q("info","Units","1 microgram (µg) is one-thousandth of a milligram. Vitamin D is also expressed in international units (IU): 10 µg equals 400 IU.")),d("calcium-iron-folate","Calcium, iron and folate",c("Calcium is needed for bones, teeth, muscle contraction and nerve signalling. Good sources include dairy and fortified plant milks, tofu set with calcium salts, canned fish with soft edible bones, and leafy greens such as kale and bok choy. Very high calcium intake from supplements can cause problems for some people, including kidney stones, so supplement doses should be discussed with a professional."),c("Iron carries oxygen in haemoglobin. Iron deficiency is common in some groups, but excess iron can be harmful, particularly for people with haemochromatosis, a genetic condition that increases iron absorption. Iron supplements should be taken only after a clinician has confirmed a need. Folate, the natural form of vitamin B9, supports red blood-cell production and DNA synthesis. It is found in leafy greens, pulses, citrus fruit and fortified cereals. Fortification policies vary by country.")),d("magnesium-zinc-potassium","Magnesium, zinc and potassium",c("Magnesium supports muscle and nerve function, energy metabolism and blood-glucose regulation. Whole grains, nuts, seeds, pulses, leafy greens and some mineral waters contribute to intake. Zinc supports immune function, wound healing and taste. Meat, shellfish, dairy, legumes and nuts are good sources. Potassium helps regulate blood pressure and fluid balance, and fruit, vegetables, potatoes and pulses are important sources."),q("caution","Potassium and medicines","People with kidney disease, and people taking certain medicines such as some blood-pressure medicines, need professional advice before using potassium-based salt substitutes or potassium supplements.")),d("other-micronutrients","Other relevant micronutrients",c("Iodine supports thyroid hormone production, and iodised-salt programmes differ across countries. Vitamin A is essential for vision and immunity, but excessive supplementation can be harmful. Vitamin K supports blood clotting and bone metabolism. It interacts with the anticoagulant warfarin, so any change in vitamin K intake must be discussed with the prescribing clinician. Selenium and copper are needed in small amounts, and both can be harmful at high intakes.")),d("deficiency-assessment","Deficiency risks and appropriate assessment",c("Symptoms of micronutrient deficiency are often vague. Tiredness, low mood, poor concentration, muscle cramps and pins-and-needles can have many causes. Guessing is unreliable. A clinician can arrange blood tests where appropriate, review diet and medicines, and recommend a targeted approach. Severe deficiency should be treated under supervision, because high doses can cause harm and can mask other conditions."),W("micronutrients")),d("food-first","Food-first approaches and responsible supplementation",c("A food-first approach emphasises varied, minimally processed foods, with supplements used when there is a clear need or a specific recommendation. Some groups benefit from targeted supplementation, such as people with confirmed deficiency, pregnant women following professional guidance, and people who cannot get enough sunlight or food because they are housebound. Supplements do not replace a balanced diet, and more is not automatically better."),q("caution","Supplement safety","Tell every clinician and pharmacist about all supplements, herbal products and over-the-counter medicines you use. Interactions and high-dose risks are real."),$(10,"The HERBULANCE nutrition guide to vitamins, minerals and essential nutrients helps readers explore nutrient sources and functions in more depth, which is useful when judging supplement claims."))),K(11,"Bone Health and Osteoporosis Prevention","Bone is living tissue that is constantly rebuilt. Peak bone mass is generally reached in early adulthood, and later bone loss can make fractures more likely. This chapter explains bone remodelling, the roles of nutrition and activity, how osteoporosis is assessed, and why bone health should be discussed with a clinician rather than managed from online advice alone.",["Describe bone structure and the process of bone remodelling.","Explain how nutrition, physical activity and other lifestyle factors influence bone health.","Describe bone-density screening, fracture-risk assessment and the limits of self-treatment."],["Bone is remodelled continuously: osteoclasts break it down and osteoblasts build it up.","Peak bone mass is usually reached by the late twenties or early thirties, and later loss is common.","Weight-bearing and resistance activity, adequate calcium and vitamin D, and not smoking all support bone health.","Osteoporosis is diagnosed and treated by clinicians using tests and fracture-risk tools."],["nih-calcium","nih-vitd","who-falls","who-ageing"],d("structure-remodelling","Bone structure and remodelling",c("Bone has two main forms: dense cortical bone that forms the outer shell of long bones, and spongy trabecular bone found at the ends of long bones and inside vertebrae. Bone is constantly remodelled in small units. Osteoclasts break down old bone, osteoblasts lay down new bone, and the new bone is mineralised with calcium and phosphate. In healthy adults the process is balanced. In later life, resorption can outpace formation, causing a gradual loss of bone density."),W("bone-remodelling"),c("Peak bone mass is usually reached in the late twenties or early thirties. It depends on genetics, nutrition, physical activity and hormones during childhood and youth. Bone loss in women accelerates after menopause because oestrogen helps restrain bone resorption. Men also lose bone with age, usually more gradually.")),d("nutrition-activity","Nutrition and physical activity",c("Calcium and vitamin D are needed for bone mineralisation, and protein forms part of the bone matrix. Diets rich in fruit and vegetables are associated with better bone health in observational studies. Diet alone rarely reverses significant bone loss, but a varied diet with adequate calcium and vitamin D forms a sound foundation."),c("Weight-bearing exercise, such as walking, stair climbing and dancing, and resistance exercise, such as lifting, carrying and band work, stimulate bone through mechanical loading. Balance training reduces the risk of falls, which matters because most fractures in older adults result from falls. Smoking and heavy alcohol use increase bone loss and fracture risk.")),d("risk-factors","Risk factors for osteoporosis",c("Risk factors include older age, female sex, early menopause, low body weight, a family history of hip fracture, a previous fragility fracture, long-term use of glucocorticoid (steroid) medicines, medical conditions such as thyroid disorders, coeliac disease and rheumatoid arthritis, low physical activity, smoking, excess alcohol and frequent falls. Assessing risk means considering several of these factors together."),q("caution","Medicines that affect bone","Long-term steroid tablets, some anti-seizure medicines, certain cancer treatments and some other drugs can affect bone. Never stop a prescribed medicine without discussing it first. Ask whether bone protection is appropriate if you take one of these medicines.")),d("screening-fracture","Bone-density screening and fracture-risk assessment",c("Bone density is commonly measured with dual-energy X-ray absorptiometry (DXA), which reports a T-score comparing bone density with that of a healthy young adult. Many guidelines use a T-score of -2.5 or lower to define osteoporosis. Clinicians also use fracture-risk tools, such as the FRAX calculator, which estimates the probability of fracture over ten years using age, sex, bone density, previous fractures and other factors."),c("Screening recommendations vary by country and by individual risk. Ask your clinician whether bone-density testing is appropriate for you, rather than arranging it without guidance."),vo("Interpreting the T-score","The T-score is a statistical comparison, not a direct measure of how strong bones feel. Two people with the same T-score can have different fracture risks depending on age, previous fractures and other factors. A result should always be interpreted alongside a clinical assessment.")),d("treatment-boundaries","Medical evaluation and treatment boundaries",c("Treatment for osteoporosis may include medicines such as bisphosphonates or denosumab, chosen by a clinician. These medicines have benefits and risks, including rare side effects affecting the jaw and thigh bone. Calcium and vitamin D may be recommended if intake is low, but they are not a substitute for medical assessment. Fracture prevention also involves falls prevention, home safety and treatment of vision or hearing problems."),q("safety","After a fall","If you fall and have severe pain, cannot bear weight, or suspect a broken bone, call your local emergency number or go to the nearest emergency department. Do not try to diagnose a fracture yourself."),$(14,"Weight-bearing and resistance activity are central to bone health. The HERBULANCE physical activity guide helps readers explore safe ways to build strength and balance across life.")))],Ay=[K(12,"Hydration, Appetite and Digestive Changes","Water is needed for almost every bodily process, yet hydration is easy to overlook, especially when thirst is less noticeable, mobility is limited or a health condition requires fluid management. This chapter covers hydration across life, signs of dehydration, appetite and digestive changes, chewing and swallowing, and practical ways to build good habits.",["Explain how hydration needs and thirst perception change with age.","Recognise signs of dehydration and situations that need urgent attention.","Describe common digestive and swallowing changes and when to seek assessment."],["Thirst perception can decline with age, so drinking at regular times is more reliable than waiting to feel thirsty.","EFSA’s adequate total water intakes are about 2.0 litres a day for adult women and 2.5 litres for adult men, from all sources including food.","Constipation, dizziness and confusion can have many causes, and persistent symptoms need assessment.","Swallowing difficulty (dysphagia) is a safety issue that requires professional assessment."],["efsa-water","nam-water","nhs-eatwell"],d("hydration-lifespan","Hydration across the lifespan",c("Water makes up a large share of body weight, and the body loses water continuously through urine, breath, sweat and stool. Total water needs depend on body size, activity, climate, illness and the water content of food. EFSA estimates adequate total water intake, from drinks and food together, at about 2.0 litres per day for adult women and 2.5 litres per day for adult men. Water from food, such as fruit, vegetables, soup and yoghurt, makes a substantial contribution."),c("Older adults can be at higher risk of inadequate fluid intake. Thirst sensation may decline, the kidneys concentrate urine less efficiently, mobility can limit access to drinks, and medicines such as diuretics increase fluid loss. Some people drink less on purpose to avoid frequent toilet trips. That concern is understandable and practical, and it should be solved rather than ignored.")),d("thirst-dehydration","Thirst perception and dehydration risks",c("Thirst is a useful signal, but it may not be a reliable guide in later life. Dehydration can develop gradually. Early signs include dark urine, dry mouth, headache, tiredness and dizziness. More serious dehydration can cause confusion, rapid heartbeat, fainting, low blood pressure and kidney problems. Dehydration can also worsen constipation and increase the risk of falls. It is especially risky during heatwaves, illness with vomiting or diarrhoea, and when fluid intake is restricted by a clinician."),W("hydration"),q("safety","Seek urgent help if","Someone is confused, very drowsy, has not passed urine for many hours, has vomiting or diarrhoea that will not stop, or cannot keep fluids down. These can signal serious dehydration or another urgent illness.")),d("appetite-digestion","Appetite changes and digestive health",c("Digestive function changes with age. Some people experience slower bowel movement and constipation. Causes include low fluid intake, low activity, low fibre intake and medicines such as opioid pain medicines, iron and calcium supplements, and some antidepressants. Bowel conditions, diabetes and nerve problems can also contribute. Persistent changes in bowel habits, blood in the stool, unexplained weight loss or new abdominal pain should be checked by a clinician."),c("Fibre supports regular bowel movements when combined with adequate fluid. Gradual increases in fibre from vegetables, fruit, whole grains and pulses usually work best, along with regular physical activity. Sudden large increases can cause bloating, so change slowly. Book 02 explores digestion and the gut in more depth."),$(2,"The HERBULANCE Gut Health & Digestion Guide helps readers explore fibre, the gut microbiome and digestive comfort in more depth.")),d("chewing-swallowing","Chewing, swallowing and oral considerations",c("Chewing and swallowing depend on teeth, saliva, tongue strength, throat muscles and coordination. Tooth loss, dry mouth from medicines, and conditions such as stroke or Parkinson’s disease can affect them. Swallowing difficulty, known as dysphagia, can cause coughing or choking during meals, a wet or gurgly voice after swallowing, food sticking in the throat, repeated chest infections or weight loss. These symptoms need professional assessment, often by a speech and language therapist."),q("caution","Practical eating safety","Sit upright for meals and for a short period afterwards, eat at a steady pace, take smaller mouthfuls and avoid talking with food in your mouth. Ask a clinician about texture changes if you cough or choke when eating or drinking. Do not ignore repeated choking episodes.")),d("practical-hydration","Practical hydration strategies",Fa("Keep a water bottle or jug within reach and refill it at set times, such as on waking, with meals and during television programmes.","Link drinks to routines you already have, such as taking medicines, making tea or sitting down after shopping.","Include water-rich foods such as soups, salads, yoghurt and fruit.","Choose drinks you enjoy: water, herbal tea, milk, unsweetened drinks or diluted fruit juice in small amounts.","Plan toilet access: a clear route to the bathroom, night lights and a bedside drink can make drinking more comfortable.","If you have a heart, kidney or liver condition, or are on a fluid restriction, follow the personal target given by your clinician rather than a general figure."),$(12,"The HERBULANCE sleep guide helps readers explore how evening drinks, night-time toilet trips and sleep quality are connected."))),K(13,"Food Patterns Associated With Healthy Ageing","Researchers study whole dietary patterns, such as Mediterranean, DASH and plant-forward eating, to understand how overall habits relate to health. Patterns are more useful than single foods, but they are not guaranteed formulas for a long life. This chapter compares the main patterns, the evidence behind them and the limits of that evidence.",["Compare major dietary patterns associated with healthy ageing.","Explain the difference between trial evidence and observational associations for diets.","Adapt dietary patterns to culture, budget and personal health needs."],["Mediterranean-style, DASH-style and plant-forward patterns share features: vegetables, legumes, whole grains, nuts, and fish or other protein choices.","Trials show benefits for some outcomes, such as blood pressure, in specific groups.","Dietary findings for dementia and longevity are mainly observational, and some trials show mixed results.","No diet guarantees a long life. Patterns should be adapted to culture, preference and health needs."],["predimed-2018","dash-1997","mind-2023","who-diet","harvard-plate","fao-fbdg"],d("mediterranean","Mediterranean-style patterns",c("Mediterranean-style eating is characterised by abundant vegetables, fruit, legumes, whole grains, nuts and olive oil, with moderate amounts of fish and dairy, limited red meat and sweets, and, in some versions, moderate wine with meals. The term describes a family of patterns rather than one diet, and many countries in the region have changed their traditional habits over time."),c("The PREDIMED randomised trial in Spain compared a Mediterranean-style diet supplemented with extra-virgin olive oil or nuts with a low-fat control diet among adults at high cardiovascular risk. The Mediterranean groups had fewer major cardiovascular events than the control group. The trial’s original 2013 publication was retracted and republished in 2018 with corrections after problems with randomisation procedures, so readers should consult the corrected version."),q("evidence","Read trials carefully","Benefits in one trial population do not automatically transfer to every population or outcome. Participant dropout, changes in diet during the study and the way outcomes were defined all affect interpretation.")),d("dash","DASH-style approaches",c("The DASH (Dietary Approaches to Stop Hypertension) pattern emphasises fruit, vegetables, low-fat dairy, whole grains, poultry, fish, nuts and legumes, and limits sodium, sweets and red meat. A clinical trial published in 1997 found that this pattern lowered blood pressure compared with a typical Western diet. The effect was larger in people with higher starting blood pressure. DASH principles are widely used in blood-pressure management advice.")),d("plant-forward","Plant-forward and traditional patterns",c("Plant-forward eating places plants at the centre of meals while allowing smaller amounts of animal foods. It is flexible and often affordable. Many traditional food systems worldwide are plant-forward in structure, built around cereals, pulses, vegetables, fermented foods and seasonal produce. Examples include Indian vegetarian thalis, East Asian soy-based meals, Ethiopian lentil stews, Mexican bean-and-maize dishes and Middle Eastern legume salads."),c("Plant-forward and vegan patterns need careful planning for vitamin B12 (which requires fortified foods or supplements), iron, calcium, iodine, zinc, long-chain omega-3 fats and protein, especially in later life when protein needs may be higher.")),d("diversity-evidence","Dietary diversity, cultural adaptability and evidence limits",c("Dietary diversity, meaning eating a wide range of foods from each group across the week, is associated with better nutrient intake in many studies, and with greater gut microbial diversity in some. Dietary traditions also differ widely. Some traditional diets have been linked to long lives in observational data, but such claims need caution. Historical age records, population movement, changing diets and reporting errors can all distort the picture."),q("myth","Myth","“Blue Zone” diets alone explain exceptional longevity. Fact: the Blue Zones concept is popular but has been widely criticised on methodological grounds. Health in these communities reflects many factors, including social connection, physical activity, access to healthcare and incomplete historical records.")),d("mind-trial","What the trials show about cognition",c("Observational studies have linked Mediterranean and MIND-style eating with slower cognitive decline. The MIND diet, a hybrid of Mediterranean and DASH approaches, was tested in a three-year randomised trial published in 2023. Both groups were advised to reduce calorie intake modestly. The trial found no significant difference in cognitive change between the MIND diet and the control diet, although both groups improved. Researchers have discussed possible explanations, including the length of the trial and changes in the control group’s diet.")),d("avoid-formula","Avoid presenting diets as guaranteed formulas",c("No dietary pattern guarantees a long or healthy life. Diet interacts with genetics, activity, social circumstances, sleep, environment and healthcare. Patterns are best understood as flexible frameworks that can be adapted to culture, preference, budget, medical needs and religious practice. The most useful pattern is one that a person can sustain over time."),W("food-patterns"),$(7,"The HERBULANCE meal planning guide helps readers explore how to adapt dietary patterns to budgets, households and cultural food traditions."))),K(14,"Meal Planning for Different Life Stages","Good nutrition is practical as well as scientific. Budgets, cooking equipment, energy levels, living arrangements and food safety all shape what people eat. This chapter offers strategies for affordable, simple, accessible and culturally diverse meal planning across life stages, with particular attention to food safety at home.",["Plan affordable and simple meals suited to different households.","Adapt meals for reduced appetite, limited mobility or limited cooking capacity.","Apply basic food-safety principles when storing, thawing and reheating food."],["Batch cooking, legumes, frozen vegetables and seasonal produce reduce cost and waste.","Smaller, nutrient-dense meals and snacks can help people with reduced appetite.","Accessible equipment and seated preparation can make cooking safer and easier.","Chill leftovers promptly, reheat them thoroughly and follow national food-safety guidance."],["nhs-eatwell","fao-fbdg","who-diet"],d("budget","Budget-conscious nutrition",c("Healthy eating can be affordable. Dried and tinned legumes, frozen vegetables and fruit, oats, rice, lentils, eggs, seasonal produce and store-brand staples often offer excellent value. Cooking larger batches of stews, soups and bakes, and freezing portions, spreads costs and reduces waste. A weekly shopping list helps prevent impulse purchases."),c("Affordability depends on income, local prices and access to shops. Where fresh produce is expensive or hard to reach, community food programmes, markets, food banks and home growing can help. Chapter 49 discusses food affordability as a social determinant of health.")),d("simple-prep","Simple meal preparation",c("Simple methods are often the most sustainable: one-pot meals, traybakes, slow-cooked stews, pressure-cooked beans, rice cookers and soups made from what is already in the cupboard. Tinned fish, beans and vegetables are useful store-cupboard staples. Rinsing tinned beans and vegetables can reduce added salt. Keep a short list of reliable recipes that you can make from memory.")),d("living-alone","Meals for people living alone",c("Cooking for one can feel unrewarding, and large packs can be wasteful. Batch cooking with freezing, buying smaller pack sizes, sharing meals with neighbours or friends, and using ready-prepared fresh vegetables all help. Some communities run lunch clubs and meal services that also provide social contact. Eating with other people is linked to better wellbeing and, in some studies, better diet quality.")),d("reduced-appetite","Meals for people with reduced appetite",c("When appetite is low, nutrient-dense foods matter more than large portions. Small, frequent meals and snacks can be easier than three large meals. Options include yoghurt with fruit and nuts, soups enriched with beans or lentils, omelettes, nut butter on wholegrain toast and smoothies made with milk or fortified alternatives. Familiar flavours and favourite foods can help."),q("caution","Persistent appetite loss","If appetite loss lasts more than a few weeks, see a clinician, because the cause may be treatable. Oral nutritional supplement drinks should be used only when recommended by a clinician or dietitian.")),d("accessible-prep","Accessible food preparation",c("Cooking can be made easier and safer. Seated preparation at a table, lightweight pans with two handles, a jar opener, a non-slip chopping board, pre-cut or pre-washed vegetables and a microwave or electric kettle can all reduce strain. Occupational therapists can recommend adaptive utensils. Keep frequently used items between waist and shoulder height, and take care with hot liquids and steam when moving pans.")),d("food-safety","Food safety at home",c("Food safety protects everyone, and it matters particularly for people whose immune responses are less robust. Keep refrigerators at or below 5 °C (41 °F), cool leftovers promptly, store them covered in the fridge and use them within the time stated on the label or in national guidance. Reheat leftovers until they are steaming hot throughout. Thaw food in the fridge or microwave rather than on the worktop, and cook it promptly after thawing. Wash hands and surfaces, and keep raw meat and fish separate from ready-to-eat foods."),$(5,"The HERBULANCE Food Safety & Kitchen Hygiene Guide helps readers explore safe storage, cooking, cleaning and reheating in more depth.")),d("dietary-traditions","Examples for different dietary traditions",c("Meal planning should respect religious, cultural, ethical and medical dietary practices. Examples include vegetarian and vegan meals built around legumes and whole grains, halal or kosher meals that follow dietary laws, Jain meals that avoid certain foods and root vegetables, Ramadan suhoor and iftar plans that balance fluids and energy, and lactose-free meals for people wi
