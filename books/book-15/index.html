en time with social and physical activity."),$(12,"The HERBULANCE sleep guide explores how evening screen habits and bedroom environment affect sleep quality.")),d("misinformation","Online misinformation",c("Misinformation spreads quickly, including false health claims, miracle cures and misleading reports about treatments. Useful habits include checking who wrote the content, whether they are qualified, whether sources are cited, whether the information is current and whether it is trying to sell something. Compare claims with official guidance from national health agencies. If a claim sounds too good to be true, it probably is."),q("caution","Check before you share","Share health information only after checking it with a reliable source, such as a national health service, a national public-health agency or a qualified clinician.")),d("digital-safety","Digital safety",c("Scammers target people with phishing emails and text messages, fake phone calls, fake delivery notices, investment schemes and romance fraud. Protect yourself by using strong, unique passwords, enabling two-factor authentication, keeping software updated and never sharing one-time codes or passwords with someone who contacts you unexpectedly. If you are unsure, end the contact and call the organisation using a number you know to be correct. Report scams to your local consumer-protection or police authority."),q("safety","If you have shared financial details","Contact your bank or card provider immediately, using a number from the back of your card or their official website. Change the passwords for any affected accounts.")),d("independence-connection","Technology for independence and connection",c("Video calls can keep families connected across distances. Online shopping, transport apps, prescription reminders, emergency alert systems and telehealth consultations can reduce barriers to daily life. Telehealth is not suitable for every situation, and urgent symptoms need in-person or emergency care. Technology should complement, rather than replace, human contact and professional support."),W("digital-accessibility")))],Ey=[K(31,"Sleep Changes Across the Lifespan","Sleep is a biological necessity, and its pattern changes across life. Sleep stages shift, the circadian clock tends to move earlier, and sleep can be disrupted by pain, medicines, night-time urination and sleep disorders. This chapter explains normal changes, the role of the sleep environment, and when sleep problems deserve professional assessment.",["Describe the sleep stages and the typical pattern of a night’s sleep.","Explain how the circadian rhythm and sleep timing change with age.","Identify sleep problems that need professional assessment and environmental influences on sleep."],["Adults generally need seven or more hours of sleep per night on a regular basis; individual needs vary.","Sleep architecture changes with age, often with less deep sleep and more waking during the night.","Circadian timing often shifts earlier in later life, which can cause earlier evening tiredness and early waking.","Persistent insomnia, loud snoring with breathing pauses, or excessive daytime sleepiness should be assessed."],["watson-2015","nhs-sleep","beers-2023"],d("architecture","Sleep architecture",c("Sleep cycles through stages. Non-REM sleep includes light stages (N1 and N2) and deep slow-wave sleep (N3). REM sleep is associated with vivid dreaming and memory processing. A typical night contains four to six cycles of roughly 90 minutes, with deep sleep concentrated early in the night and REM sleep more prominent later. Older adults often have less deep sleep, lighter sleep and more brief awakenings, although total sleep needs remain broadly similar for most adults."),W("sleep-architecture"),c("A joint consensus statement from major sleep-medicine and sleep-research organisations recommends that adults sleep seven or more hours per night on a regular basis to support health. Many people sleep less or more and remain well, but persistent short sleep is associated with poorer health outcomes in observational studies.")),d("circadian","Circadian rhythm and changes in timing",c("The circadian rhythm is the roughly 24-hour internal clock that regulates sleep, hormone release, body temperature and alertness. It is set mainly by a master clock in the brain and is synchronised by light, meals, activity and social routines. Many older adults show a shift towards earlier sleep and wake times, sometimes called an advanced sleep phase. This can cause earlier evening sleepiness and early waking. It is not necessarily a problem, but it can be if it leads to fragmented sleep or limits social life."),W("circadian-rhythm")),d("quality","Sleep quality and night-time disturbance",c("Night-time waking, pain, the need to urinate at night (nocturia), restless legs, hot flushes, anxiety, bereavement, noise and light can all disturb sleep. Nocturia is common and has many possible causes, including medicines, fluid timing, heart and kidney conditions, diabetes and prostate changes. Frequent night-time urination that disrupts sleep should be discussed with a clinician. Changes in sleep quality should be considered alongside physical health, medicines and mood.")),d("environment","The sleep environment",c("A good sleep environment is cool, dark and quiet, with a comfortable mattress and bedding. Blackout curtains, earplugs, a fan or a white-noise device can help some people. The bedroom should also be safe for night-time movement, with a clear route to the bathroom and a night light. A consistent bedtime and wake-time supports the circadian rhythm. If a bed partner’s movement or snoring disturbs sleep, separate bedding or a different sleeping arrangement may help."),$(12,"The HERBULANCE sleep guide explores sleep environments, routines and circadian rhythm in more depth, complementing this chapter.")),d("assessment","When sleep disturbances require assessment",c("Seek assessment if you notice any of the following:"),Fa("Loud snoring with pauses in breathing, choking or gasping during sleep, or severe daytime sleepiness, which may indicate sleep apnoea.","Difficulty falling or staying asleep on most nights for more than three months.","Uncomfortable urges to move the legs, especially in the evening or at night.","Acting out dreams, or injuring yourself or a partner during sleep.","Falling asleep unintentionally while driving, talking or doing other activities.","Night-time confusion, hallucinations or frightening experiences during sleep."),c("Sleep medicines can cause dizziness, falls, confusion and dependence in older adults. The AGS Beers Criteria, updated in 2023, advises caution with several sedating medicines in older adults. Cognitive behavioural therapy for insomnia (CBT-I) is recommended as a first-line approach in many clinical guidelines and is worth discussing with a clinician."),q("safety","Seek urgent help","Seek urgent help if you wake with severe breathlessness or chest pain, or if you have sudden confusion, weakness or speech difficulty on waking."))),K(32,"Stress, Resilience and Emotional Regulation","Stress is a normal response to challenge, and short-term stress can sharpen focus and help people act. Chronic stress, however, is linked with poorer physical and mental health. This chapter explains how the stress response works, which coping strategies and relaxation techniques have evidence, how resilience and emotional regulation can be developed, and how social circumstances shape stress.",["Explain the body’s stress-response pathways and their effects.","Compare coping strategies and relaxation techniques with their evidence.","Recognise how chronic stress and social circumstances affect wellbeing."],["Stress triggers rapid hormonal and nervous-system responses that are helpful in the short term.","Chronic activation can contribute to poorer health. Recovery and support matter.","Relaxation practices, physical activity, social support and problem-solving have evidence for reducing stress.","Resilience is a set of adaptable skills and resources, not a fixed trait, and it is shaped by circumstances."],["mcewen-1998","who-ageing","who-csdh"],d("physiology","Stress physiology",c("When a person perceives a threat or demand, the brain activates the sympathetic nervous system. This releases adrenaline and noradrenaline, which raise heart rate and blood pressure and sharpen attention. The hypothalamic–pituitary–adrenal (HPA) axis releases cortisol, which mobilises energy and helps regulate inflammation. These responses are adaptive when the stressor passes. In 1998, Bruce McEwen described allostatic load, the wear and tear that accumulates when stress systems are repeatedly activated without enough recovery."),W("stress-response")),d("coping","Coping strategies",c("Coping can be problem-focused, aiming to change the situation, or emotion-focused, aiming to manage feelings about it. Both have value, depending on circumstances. Flexible coping, which adapts to what a situation requires, is usually more helpful than relying on one approach. Helpful strategies include breaking problems into steps, seeking information, asking for help, keeping routines and using humour. Avoidance can offer short-term relief but may increase distress over time, particularly if it involves withdrawal or heavy alcohol use.")),d("relaxation","Relaxation techniques",c("Slow breathing, with longer exhalations than inhalations, can reduce physiological arousal within minutes. Progressive muscle relaxation involves tensing and then releasing muscle groups. Mindfulness and meditation practices help people notice thoughts without being carried away by them. Tai chi, gentle yoga and walking in nature can also reduce stress. Research supports several of these approaches for stress symptoms, but none of them is a cure for depression or other conditions."),q("info","Try slow breathing","Breathe in gently for about four seconds and out for about six, for two to five minutes. Many people find this calming when they feel tense. It is a helpful skill, not a substitute for treatment of anxiety or other conditions.")),d("psych-flexibility","Psychological flexibility",c("Psychological flexibility is the ability to stay in contact with the present moment, accept uncomfortable thoughts and feelings, and act in line with personal values. Approaches such as acceptance and commitment therapy build these skills. In daily life it can mean noticing a worry, naming it, and still choosing to join a group or make a call that matters.")),d("resilience","Emotional resilience",c("Resilience describes the capacity to adapt well to adversity. It is not toughness, and it does not mean the absence of distress. Resilience is supported by close relationships, a sense of purpose, practical resources, self-compassion, flexible thinking and access to help. Because resilience depends on resources, communities and public policy also contribute to it.")),d("chronic-stress","Chronic stress and social circumstances",c("Chronic stress can arise from poverty, insecure housing, discrimination, caring responsibilities, loneliness, bereavement, poor health and unsafe environments. These conditions can make it harder to use coping strategies, and they have measurable effects on health. Individual techniques are valuable, but they cannot fully offset structural stressors. Practical support, from income assistance to caregiver respite and community services, is an essential part of stress management."),$(13,"The HERBULANCE stress management guide explores stress physiology, coping and emotional wellbeing in depth, which helps readers build personal stress-management routines."))),K(33,"Mental Health and Ageing","Mental health is central to healthy ageing. Depression and anxiety are not a normal part of growing older, yet they are often under-recognised in later life, and their symptoms can be mistaken for physical ageing. This chapter addresses depression, anxiety, loneliness, grief, retirement, life changes and access to support, and explains when professional help is needed.",["Recognise depression and anxiety in later life and understand why they are often missed.","Describe loneliness, grief and retirement transitions in supportive terms.","Identify warning signs that require prompt help and know how to access support."],["Depression and anxiety are treatable and are not a normal part of ageing.","Loneliness differs from living alone, and it is a recognised public-health concern.","Grief and transitions vary widely and do not always need treatment, but support matters.","Thoughts of self-harm or suicide require immediate help from emergency or crisis services."],["who-loneliness","holt-2010","holt-2015","who-ageism"],d("depression-anxiety","Depression and anxiety",W("emotional-wellbeing"),c("Depression can cause persistent low mood, loss of interest, changes in appetite or sleep, fatigue, poor concentration, feelings of worthlessness or hopelessness, and thoughts of death. In older adults, symptoms may appear mainly as physical complaints, memory concerns or withdrawal, so they are sometimes missed. Anxiety can cause persistent worry, restlessness, tension and physical symptoms. Both conditions are treatable with psychological therapy, social support, physical activity and, where appropriate, medicines prescribed by a clinician."),q("caution","Depression is not a normal part of ageing","Feeling low for more than two weeks, losing interest in things you once enjoyed, or feeling hopeless should be discussed with a health professional, at any age.")),d("loneliness","Loneliness",c("Loneliness is the distress of feeling that relationships are not enough. It differs from living alone, and social isolation refers to having few social contacts. Both are associated with poorer physical and mental health, and with higher mortality in observational studies. The WHO Commission on Social Connection reported in 2025 that about one in six people worldwide is affected by loneliness, and that loneliness is linked to an estimated 871,000 deaths each year. The Commission called for coordinated action on policy, research and community programmes."),c("Loneliness can ease through small steps: regular calls, groups with shared interests, volunteering, mutual support and reaching out to neighbours. Chapter 34 explores social connection further.")),d("grief","Grief and bereavement",c("Grief is a natural response to loss, and its expression varies widely across cultures and individuals. Some people feel intense grief for months; others adjust gradually. Anniversaries, holidays and reminders may bring waves of feeling. Support can come from family, friends, faith or cultural communities, bereavement services and counselling. Grief becomes a concern when it persistently prevents daily functioning, or when there are thoughts of self-harm.")),d("retirement","Retirement transitions",c("Retirement can bring freedom, rest and new projects, while also changing routine, income, identity and social contact. Many people adjust well. Others find the loss of work roles and colleagues difficult. Planning helps: keeping structure, pursuing interests, maintaining social contact, volunteering and reviewing financial plans. Chapter 36 covers transitions in more detail.")),d("life-changes","Life changes",c("Moving home, changes in health, caregiving responsibilities, separation, and the loss of friends can all affect mental health. Older adults who experience several changes at once may need additional support. Routine check-ins with a primary-care clinician can identify changes early, and community services often advise on housing, benefits, transport and social groups.")),d("access","Access to mental-health support",c("Access varies widely between countries and communities. Primary-care clinicians can assess mental health, offer treatment and refer people to specialists. Many health systems offer talking therapies, and some accept self-referral. Cost, language, stigma, transport, digital access and limited availability can all be barriers, so asking directly for help is worthwhile. Peer-support groups and helplines add further options.")),d("warning-signs","Warning signs requiring professional attention",Fa("Persistent low mood, hopelessness or emptiness for more than two weeks.","Loss of interest in most activities, or withdrawal from people and usual routines.","A significant change in appetite, weight or sleep.","Neglect of personal care, food, medicines or safety.","New confusion, hallucinations or suspicion of others.","Increased alcohol use, or misuse of medicines, to cope.","Talking about being a burden, or about death or self-harm."),q("safety","If someone may be at risk","If a person is thinking about ending their life or harming themselves, do not leave them alone. Contact your local emergency number, or a crisis or suicide-prevention helpline in your country, without delay."))),K(34,"Social Relationships and Longevity","Relationships influence health through many pathways, including emotional support, shared activity, practical help, health behaviours and a sense of belonging. This chapter examines family, friendship, community involvement and intergenerational relationships, the evidence linking social connection with health, and the cultural contexts that shape how connection is experienced.",["Describe the dimensions of social connection and how they affect health.","Evaluate observational evidence linking relationships with survival.","Identify practical ways to build and sustain social connection across cultures and circumstances."],["Stronger social relationships are associated with better survival in meta-analyses of observational studies.","Association does not prove causation, and health problems can also reduce social contact.","Family, friendship, community and intergenerational contact each offer different benefits.","Cultural norms shape how people seek and offer connection."],["holt-2010","holt-2015","who-loneliness","who-csdh","who-agefriendly"],d("dimensions","Dimensions of social connection",c("Social connection has structural features, such as the number of relationships and how often people meet, and functional features, such as emotional support, practical help and companionship. People can have large networks and still feel lonely, or small networks that are very supportive. Both quantity and quality matter."),W("social-map")),d("longevity-evidence","Social relationships and mortality evidence",c("A 2010 meta-analysis of observational studies found that people with stronger social relationships had a higher likelihood of survival during the follow-up periods studied, with an effect comparable in size to some well-established risk factors. A 2015 meta-analysis reported similar associations for loneliness and social isolation. The findings are consistent across studies, but they come from observational data, and effect sizes depend on how relationships were measured.")),d("family-friendship","Family connections and friendships",c("Family relationships provide care, belonging and practical support, but they can also involve tension, caregiving burdens and conflict. Friendships are often voluntary and can offer companionship, shared interests and emotional support. Maintaining friendships takes effort, such as scheduling time, reaching out and accepting invitations. Friendships formed earlier in life may fade through relocation or changes in health, and new ones can grow from shared activities.")),d("community","Community involvement",c("Community involvement includes volunteering, faith or cultural groups, clubs, neighbourhood associations and mutual-aid networks. These activities create regular contact, purpose and reciprocity. Participation can be limited by transport, cost, disability or language, so accessibility matters. Communities benefit when older people are included as contributors, not only as recipients of services.")),d("intergenerational","Intergenerational relationships",c("Relationships across generations can provide mentoring, storytelling, shared learning and emotional closeness. Intergenerational programmes, such as schools partnering with older volunteers or shared community gardens, can benefit participants of all ages. Tensions can also arise, so clear expectations, mutual respect and flexible roles help relationships last.")),d("cultural","Cultural and community contexts",c("Ideas about family, duty and independence differ between cultures. In some societies, family members are expected to care for older relatives, and multigenerational households are common. In others, independent living and professional care are more typical. Language, religion, migration history and rural or urban settings shape both opportunities and barriers. Social connection should be understood within each person’s own cultural frame.")),d("observational-caution","Avoid overstating observational evidence",q("caution","Association is not proof","Observational studies can show that people with stronger relationships tend to live longer. They cannot prove that building relationships will extend a particular person’s life. Health problems can reduce social contact, and income, education and personality can influence both relationships and health. Treat social connection as a valuable, well-supported part of wellbeing, rather than a guaranteed longevity intervention."),$(13,"The HERBULANCE stress management guide explores emotional wellbeing and mind-body balance, which connect closely with the social and emotional benefits described here."))),K(35,"Purpose, Identity and Meaningful Living","A sense of purpose and identity helps people navigate change, stay engaged and find meaning in everyday life. Purpose can be expressed through work, caring, creativity, faith, community or personal projects. This chapter explores how purpose and identity develop, how hobbies, volunteering and spiritual or philosophical wellbeing can support meaning, and how identity can be sustained beyond employment or physical ability.",["Describe the roles of purpose and identity in wellbeing.","Explore hobbies, volunteering and meaningful routines as sources of purpose.","Consider spiritual and philosophical wellbeing in an inclusive way."],["A sense of purpose is associated with better wellbeing and some health outcomes in observational research.","Identity can be built from many roles, not only paid work or physical capacity.","Volunteering and creative activity can offer meaning, connection and contribution.","Spiritual and philosophical wellbeing can be found within many traditions and in non-religious frameworks."],["who-ageing","who-ageism","who-wrha"],d("purpose","Personal purpose",c("Purpose is a sense of direction and of contributing something that matters. Observational research has linked a sense of purpose in life with better health, functioning and survival. Purpose does not need to be grand. It can come from caring for a grandchild, tending a garden, mentoring a colleague or supporting a local cause. Reflecting on personal values, what gives energy and what feels worthwhile helps people identify their purpose."),W("purpose-framework")),d("hobbies","Hobbies and interests",c("Hobbies provide enjoyment, skill, rhythm and social connection. Returning to an old interest or trying something new both have value. Hobbies that can adapt to changing ability, such as seated crafts, accessible gardening, music, reading groups or local history, can remain meaningful through later life.")),d("volunteering","Volunteering",c("Volunteering can build social connection, a sense of contribution and routine. Observational studies link volunteering with wellbeing, although some of the association may reflect healthier people being more likely to volunteer. Opportunities include tutoring, mentoring, community organisations, museums, libraries, hospitals and environmental groups. Choose roles that match energy levels and interests, and be realistic about the time commitment.")),d("spiritual","Spiritual and philosophical wellbeing",c("Many people find meaning through religious faith, spiritual practice, philosophical reflection, humanist values, nature or service to others. These sources can offer comfort, community, ritual and a framework for understanding loss and change. This book does not assume any religious belief. Whatever a person’s beliefs, reflecting on what matters most, cultivating gratitude, maintaining connection and making peace with difficult experiences can support wellbeing.")),d("routines","Meaningful routines",c("Routines provide structure, predictability and cues for activity. A meaningful routine combines necessary tasks with things that matter, such as a morning walk with a friend, a weekly class, a daily reading session or a regular call with family. Routines should be flexible enough to adapt to changes in health and circumstances.")),d("identity","Identity beyond employment or physical ability",c("Identity is the story a person tells about who they are. It can include roles as parent, grandparent, neighbour, cook, artist, teacher, friend, faith member or advocate, as well as occupational history. Changes in work, health or mobility can challenge identity, but identity can be renewed by drawing on enduring values and new roles. Recognising the strengths and contributions of older people, rather than defining them by decline, supports dignity."),$(13,"The HERBULANCE stress management guide explores emotional wellbeing and mind-body balance, which support a settled sense of self during major change."))),K(36,"Managing Major Life Transitions","Life includes many transitions: retirement, moving home, bereavement, changing family roles, caregiving, financial change and the rebuilding of routines and networks. Each can bring stress and opportunity. This chapter offers practical approaches to planning and adjustment, and it highlights where legal, financial and professional advice is needed.",["Describe common life transitions in later life and the challenges they bring.","Apply planning strategies for retirement, relocation, bereavement and caregiving.","Identify when to seek legal, financial or professional advice."],["Transitions are often stressful even when they are positive, and planning reduces uncertainty.","Rebuilding routines and support networks helps people adjust.","Advance care planning and legal documents vary by country and should be arranged with qualified help.","Financial, housing and caregiving decisions benefit from independent professional advice."],["who-ageing","who-csdh","who-agefriendly","who-loneliness"],d("transitions","Common transitions and their stresses",c("Transitions change roles, routines and relationships. Some are expected, such as retirement. Others are unexpected, such as bereavement, serious illness or a sudden move. Even welcome changes can be stressful because they require adjustment, new identities and new social patterns."),W("transitions")),d("retirement-planning","Retirement",c("Planning for retirement includes finances, housing, health, social life and purpose. Practical steps include reviewing pensions and savings with an independent adviser, considering part-time work or volunteering, and exploring new interests and social networks. Some people transition gradually, which can ease the change.")),d("relocation","Relocation",c("Moving home can mean losing familiar neighbours and services, and it can affect transport and access to healthcare. Before moving, check local services, clinic registration, transport links, community groups and accessibility. Visiting the area several times and building contacts early can help. Moving closer to family can bring support but may also change independence, so discuss preferences openly.")),d("bereavement","Bereavement",c("Bereavement affects practical life as well as emotions. Administrative tasks, legal processes, finances and household roles may need to be managed quickly. Support can come from bereavement services, counselling, faith or cultural communities, and friends. Looking after basic needs, such as eating, drinking and sleep, is especially important during grief. Seek help if grief prevents daily functioning for a long period.")),d("family-roles","Changing family roles",c("Family roles shift as children leave home, grandchildren arrive, partners die or separate, and adults take on new responsibilities. Clear communication about expectations, boundaries and preferences prevents misunderstanding. Respecting older people’s decisions is part of respectful family life.")),d("caregiving","Caregiving transitions",c("Becoming a caregiver, or needing care, can be one of the largest transitions in later life. Chapter 47 explores caregiving in depth. Early planning, including discussing preferences and writing down wishes, helps families make decisions together and reduces crisis-driven choices.")),d("financial","Financial transitions",c("Financial change may follow retirement, widowhood, illness, relocation or the costs of care. Budgeting, reviewing benefits and entitlements, and planning for housing and care costs are important. Scams often target people in transition, so check unsolicited offers carefully. Significant decisions benefit from independent guidance from a qualified financial adviser.")),d("legal-planning","Legal and advance planning",c("Legal arrangements such as wills, powers of attorney, guardianship and advance directives differ between countries. They allow people to record their decisions and appoint trusted representatives. Preparing these documents while able to do so is valuable. Seek advice from a qualified legal professional in your jurisdiction, because this book does not provide legal advice.")),d("rebuilding","Rebuilding routines and social support",c("After a transition, rebuilding routines helps stabilise daily life. Start with small, regular activities, reconnect with people, join groups and set realistic goals. Support can come from family, friends, community organisations, professional services and digital networks. Asking for help is a sign of good planning, not weakness."),q("reflect","Reflection prompt","Which transition in your life, or in the life of someone close to you, feels most uncertain right now? What one small step would make the next month feel more manageable?"),$(13,"The HERBULANCE stress management guide helps readers explore how to manage the emotional load of change while building new routines.")))],My=[K(37,"Preventive Healthcare and Regular Check-Ups","Prevention works best when it is personal, planned and shared with a healthcare team. Primary care, screening programmes, vaccination and clear health records help detect problems early and support informed decisions. This chapter explains screening principles, individual risk assessment, vaccination awareness and shared decision-making.",["Explain screening principles, including benefits and harms.","Describe how individual risk, family history and national guidance shape check-up schedules.","Prepare a personal health summary and use shared decision-making in preventive care."],["Screening can find problems early, but it has benefits and harms, including false positives and overdiagnosis.","Schedules differ by country and personal risk. Ask your primary-care team for a personalised plan.","Vaccination recommendations for older adults vary. Check national schedules for influenza, pneumococcal, shingles and other vaccines.","An up-to-date health summary improves safety and communication."],["who-wrha","nhs-vacc","cdc-vacc","who-ageing"],d("primary-care","Primary care",c("Primary care is the first point of contact for most health concerns. Primary-care teams provide check-ups, monitor long-term conditions, coordinate medicines, arrange screening and refer people to specialists. A relationship with a regular clinician makes it easier to raise concerns early and receive continuity of care. Community nurses, pharmacists and allied health professionals also contribute to prevention.")),d("screening","Preventive screening principles",c("Screening tests look for disease in people who have no symptoms. Good screening programmes rest on evidence that early detection improves outcomes, that the test is accurate and acceptable, and that effective treatment is available. Screening has harms as well as benefits, including false-positive results, anxiety, unnecessary investigations and overdiagnosis, where a condition is found that would never have caused problems. Decisions should weigh these trade-offs."),q("info","Screening is not diagnosis","A positive screening result means that further tests are needed. It does not mean that a person has a disease.")),d("individual-risk","Individual risk factors",c("Risk varies with age, sex, family history, smoking, weight, physical activity, blood pressure, blood sugar, cholesterol, kidney function and other factors. Ancestry can also influence risk for some conditions, such as diabetes and high blood pressure, but it should be used as one part of a careful individual assessment rather than as a stereotype. Clinicians combine risk factors to guide decisions.")),d("vaccination","Vaccination awareness",c("Vaccines reduce the risk of serious infections and their complications. Programmes for older adults commonly include seasonal influenza vaccination, pneumococcal vaccination, shingles (herpes zoster) vaccination, tetanus, diphtheria and pertussis boosters, COVID-19 vaccination where recommended, and RSV vaccination in some countries. Responses to vaccines can be lower with age, and some vaccines are formulated specifically for older people. Recommendations, eligibility and timing differ by country and change over time, so check your national schedule or ask your clinician.")),d("records","Health records",c("A personal health summary helps in emergencies and routine care. It can include current conditions, medicines and doses, allergies, previous surgeries, vaccination history, screening dates, key test results and the names of your clinicians. Keep a paper copy with important documents, or a secure digital copy, and share it with trusted family members. Do not leave sensitive health information in unsecured public places."),$(9,"If you have food allergies or special dietary needs, include them in your health summary. The HERBULANCE Food Allergies, Intolerances & Special Dietary Needs guide helps readers explore safe approaches and label reading.")),d("shared-decisions","Shared decision-making",c("Shared decision-making means that clinicians and patients discuss the options, their benefits, harms and costs, and the person’s values and preferences before a decision is made. Useful questions include: What are the benefits and risks? What happens if I do nothing? What are the alternatives? How likely is each outcome? Bring notes, and a companion if you wish.")),d("schedules-vary","Why screening schedules vary by country and circumstance",W("preventive-timeline"),c("Screening guidelines reflect evidence, health-system capacity, costs and local disease patterns, so recommended ages, intervals and tests differ between countries. Some countries run national programmes that send invitations; others rely more on clinicians’ judgement. Individual circumstances, including family history, previous results and personal preferences, can justify a different schedule. Follow your local health service and your clinician’s advice."))),K(38,"Blood Pressure, Blood Sugar and Cardiovascular Risk","Blood pressure, blood sugar and cholesterol are measurable risk factors for heart attack, stroke, kidney disease and cognitive decline. They often cause no symptoms, so regular measurement matters. This chapter explains what each measure means, how risk is assessed, the role of lifestyle, the limits of home monitoring and the boundaries between self-management and clinical treatment.",["Explain blood pressure, blood sugar and cholesterol measures and why they matter.","Describe cardiovascular risk factors and how lifestyle influences them.","Understand the limits of monitoring and the role of clinical diagnosis and treatment."],["High blood pressure, high blood sugar and high LDL cholesterol often cause no symptoms.","Risk thresholds differ between guidelines and countries, so a clinician should interpret results in context.","Lifestyle changes can lower several risk factors, and medicines are used when clinically indicated.","Home monitoring is useful when devices are validated and the technique is correct."],["who-hypertension","who-diabetes","dash-1997","nhs-stroke","who-tobacco"],d("blood-pressure","Blood pressure",c("Blood pressure measures the force of blood against artery walls. It is recorded as two numbers in millimetres of mercury (mmHg): the systolic pressure, when the heart beats, and the diastolic pressure, between beats. Hypertension is a persistent elevation, and the thresholds used to define it differ between guidelines. High blood pressure is a major risk factor for stroke, heart disease, kidney disease and cognitive decline. It often causes no symptoms, so measurement is essential."),c("Accurate measurement matters. Rest for several minutes, sit with your back supported and feet flat, use a correctly sized cuff, and take more than one reading. Blood pressure is sometimes higher in a clinic than at home, a pattern called the white-coat effect, so home readings can help interpretation.")),d("blood-sugar","Diabetes risk and blood sugar",c("Blood sugar regulation depends on insulin. Type 2 diabetes develops when insulin is insufficient or does not work effectively, and it is strongly associated with excess weight, low physical activity, family history and age. Prediabetes, when blood sugar is higher than normal but below the diabetes threshold, can often be improved with lifestyle changes. Tests include fasting glucose, HbA1c and, in some cases, an oral glucose tolerance test. Diabetes can damage the eyes, kidneys, nerves and blood vessels, so early detection and treatment are important.")),d("cholesterol","Cholesterol",c("Cholesterol is carried in the blood by lipoproteins. LDL cholesterol contributes to plaque build-up in artery walls, and higher LDL is a major cardiovascular risk factor. HDL is often called “good” cholesterol, but raising HDL does not automatically reduce risk. Lipid tests measure total cholesterol, LDL, HDL and triglycerides. Treatment decisions depend on overall risk, and statins or other medicines are prescribed by clinicians when indicated.")),d("cv-risk","Cardiovascular risk factors and lifestyle contributions",c("Cardiovascular risk builds from many factors, including blood pressure, cholesterol, blood sugar, smoking, physical inactivity, poor diet, excess weight, excess alcohol, kidney disease, sleep apnoea and family history. Lifestyle changes can reduce several of these factors at once: regular activity, a varied diet, a healthy weight, not smoking and moderate alcohol use. Figure 39 shows which factors can be modified and which cannot."),W("cv-risk")),d("monitoring-limits","Monitoring limitations",c("Home blood pressure monitors and glucose meters are useful when they are validated, correctly sized and used properly. Readings can vary with timing, posture, stress, caffeine, cuff size and device accuracy. Wearable devices may estimate heart rate, oxygen levels or sleep, but their accuracy varies. A single reading rarely defines a condition. Patterns over time, interpreted by a clinician, are more informative. Do not change medicines based on a single reading without advice.")),d("clinical-boundaries","Clinical diagnosis and treatment boundaries",c("Diagnosing hypertension, diabetes or abnormal cholesterol requires appropriate testing and clinical judgement. Treatment may include lifestyle changes, medicines and monitoring. Medicines for blood pressure, blood sugar and cholesterol carry risks and benefits, and their doses should be individualised. Do not stop or start these medicines without advice, and report dizziness, fainting or other side effects promptly."),q("safety","Urgent symptoms","Sudden severe headache, chest pain, sudden weakness or speech problems, fainting, or very high blood sugar with confusion or vomiting need urgent medical attention."),$(11,"The HERBULANCE healthy weight management guide helps readers explore metabolism and sustainable habits that can support blood pressure, blood sugar and cholesterol goals, alongside clinical care."))),K(39,"Vision, Hearing, Oral Health and Sensory Function","Sight, hearing, taste, smell and oral health shape communication, nutrition, safety and social life. Changes are common with age, and many can be treated or supported. Regular checks are among the most practical preventive steps people can take. This chapter explains common sensory changes, eye and hearing examinations, dental care, the links with nutrition, assistive devices and urgent warning signs.",["Describe common age-related changes in vision, hearing, taste, smell and oral health.","Explain the value of regular eye, hearing and dental checks.","Identify urgent sensory and oral warning signs and suitable assistive options."],["Presbyopia, cataract, glaucoma, macular change and hearing loss are common in later life and often treatable or manageable.","Regular eye examinations can detect conditions that cause no early symptoms, such as glaucoma.","Hearing aids, captioning and communication strategies can improve daily life and social connection.","Oral health affects eating, speech and nutrition, so regular dental care matters at any age."],["lin-2013","lancet-2024","who-ageing","who-dementia"],d("sensory-changes","Age-related sensory changes",W("vision-hearing"),c("Presbyopia, the loss of near focus, usually becomes noticeable in the forties and fifties. Cataracts cloud the lens and are very common in later life; they are treated by surgery. Glaucoma damages the optic nerve, often without early symptoms, and needs monitoring. Age-related macular degeneration affects central vision and can progress. Hearing loss, particularly for high-pitched sounds, is common with age and can make conversation difficult. Taste and smell may decline, which can affect appetite and enjoyment of food.")),d("eye-exams","Eye examinations",c("Regular eye examinations check focus, eye pressure, the optic nerve and the retina. People with diabetes should attend retinal screening as offered by national programmes. Glasses or lenses should be checked regularly, and an optician can advise on suitable options for walking, driving and screen use. Vision is also important for falls prevention (Chapter 20)."),q("safety","Sudden vision loss is urgent","Sudden loss of vision in one or both eyes, a curtain-like shadow, new flashes with floaters, or severe eye pain with nausea should be assessed urgently. Do not wait for a routine appointment.")),d("hearing","Hearing assessment",c("Hearing assessment, carried out by an audiologist or qualified professional, identifies the type and degree of hearing loss. Hearing aids help many people, and fitting and adjustment matter. Some countries now allow over-the-counter hearing aids for mild to moderate hearing loss, but a professional assessment remains valuable. Earwax can cause temporary hearing loss and is best removed by a professional. Do not insert objects into the ear canal."),c("Hearing loss is linked with social withdrawal and, in observational studies, with cognitive decline. The Lancet Commission lists hearing loss as a modifiable risk factor for dementia (Chapter 27).")),d("dental-care","Dental care",c("Regular dental check-ups detect decay, gum disease, oral infections and oral cancer. Brushing twice daily with fluoride toothpaste, cleaning between the teeth, and looking after dentures reduce risk. Dry mouth, often caused by medicines, increases the risk of decay; sipping water, using sugar-free gum and following dental advice can help. Dental pain, swelling, bleeding gums or mouth sores lasting more than two weeks should be checked.")),d("oral-nutrition","Oral health and nutrition",c("Chewing ability influences food choice. Tooth loss or ill-fitting dentures can reduce intake of fruit, vegetables and meat. Adapting food texture, for example with softer vegetables, minced meat or well-cooked legumes, can help while dental care is arranged. Oral health and diet interact with gut health, which Book 02 explores in more detail."),$(2,"The HERBULANCE Gut Health & Digestion Guide helps readers explore how diet, fibre and the wider digestive system interact, which complements the oral-nutrition links described here.")),d("assistive","Assistive devices",c("Assistive devices include glasses and magnifiers, large-print materials, audiobooks, hearing amplifiers and hearing aids, captioned telephones, tactile markers, high-contrast cutlery and plates, and bright task lighting. Occupational therapists and sensory services can recommend devices suited to daily life and budget. The environment matters too: good contrast, clear signage and reduced background noise help everyone.")),d("warning-signs","Warning signs requiring professional attention",Fa("A sudden change in vision or hearing.","Persistent eye pain, redness with vision change, or double vision.","Mouth sores, or red or white patches inside the mouth, that persist for more than two weeks.","Bleeding gums that persist, loose teeth or new dental pain.","Sudden hearing loss, especially in one ear, or persistent ringing with a change in hearing."),q("safety","Seek prompt assessment","Sudden changes in vision or hearing should be assessed the same day or as soon as possible. Do not wait for a routine appointment."))),K(40,"Medication Awareness and Safe Medication Practices","Medicines can extend and improve lives, but every medicine carries potential benefits, risks and interactions. Many people in later life take several medicines, sometimes from different prescribers, alongside over-the-counter and herbal products. This chapter explains polypharmacy, medication reviews, side effects, interactions, adherence and safe practices. It never recommends changing prescribed treatment without professional advice.",["Explain polypharmacy and why it increases risk.","Describe how medication reviews and safe practices reduce harm.","Identify common over-the-counter and herbal interactions and when to seek advice."],["Polypharmacy (taking several medicines) increases the risk of side effects and interactions.","Regular medication reviews with a clinician or pharmacist can identify medicines that are no longer needed or are risky.","Never stop or change prescribed medicines without professional advice.","Tell every clinician about over-the-counter and herbal products you use."],["who-mwh","beers-2023","fda-supp"],d("polypharmacy","Polypharmacy",c("Polypharmacy, commonly defined as taking five or more regular medicines, is common in later life because several long-term conditions often coexist. It can be appropriate when each medicine has a clear purpose. Risks rise with the number of medicines, including side effects, interactions, falls, confusion and hospital admission. Because medicines may be prescribed by different clinicians, a complete and current list is essential.")),d("reviews","Medication reviews",c("A medication review examines whether each medicine is still needed, whether the dose is right, whether it is safe alongside the others, and whether it is being taken as intended. Reviews may be carried out by a family doctor, a pharmacist or a specialist. A practical preparation is to bring all your medicines in their original packaging, including over-the-counter and herbal products. The worksheet on medication review preparation in this book can help you list your questions.")),d("side-effects","Side effects and higher-risk medicines",c("Side effects can include dizziness, drowsiness, confusion, constipation, difficulty passing urine, low blood pressure on standing, dry mouth and changes in appetite. Some medicine groups carry particular risks for older adults, including certain sedatives, sleep medicines, antipsychotics, some pain medicines and medicines with strong anticholinergic effects. The American Geriatrics Society Beers Criteria, updated in 2023, lists medicines that are potentially inappropriate for older adults and supports clinical review. It does not replace individual judgement.")),d("interactions","Drug interactions",c("Interactions can occur between prescribed medicines, between medicines and foods or drinks, and between medicines and supplements. For example, some antibiotics interact with calcium or iron, and grapefruit can alter how some medicines are processed. Alcohol increases sedation and falls risk with several medicines. Ask a pharmacist before starting any over-the-counter product, and check whether it is suitable with your current medicines.")),d("adherence","Adherence",c("Taking medicines as prescribed is harder when there are many, when instructions are complicated, when side effects occur or when cost is a barrier. Helpful tools include pill organisers, blister packs, written schedules, alarms and pharmacy support services. If a medicine is difficult to take or unaffordable, speak with the prescriber rather than stopping or skipping doses on your own.")),d("otc","Over-the-counter products",c("Many common over-the-counter products deserve care. Anti-inflammatory pain relievers can affect the kidneys, stomach and blood clotting, particularly in people with heart disease, kidney disease or those taking anticoagulants. Antihistamines and sleep aids can cause drowsiness, confusion and urinary problems. Decongestants can raise blood pressure. Antacids can interact with other medicines. Check labels and ask a pharmacist, particularly if you have a long-term condition."),q("caution","Sedating antihistamines and sleep aids","Many sedating products containing antihistamines are not recommended for routine sleep problems in older adults, because they can cause confusion, falls and urinary retention. Ask a pharmacist or clinician for safer options.")),d("herbal","Herbal product interactions",c("Herbal and traditional products can interact with medicines, as Chapter 15 explains. St John’s wort, ginkgo, garlic supplements and some traditional remedies can alter bleeding risk or the levels of other medicines in the body. Tell your clinician and pharmacist about all herbal and traditional products, including teas and creams, and bring the packaging to appointments.")),d("never-stop","Never stop or alter prescribed medication without advice",q("safety","Do not stop suddenly","Stopping some medicines abruptly, including beta-blockers, anticoagulants, antidepressants, antiseizure medicines and steroids, can cause serious harm. Discuss any concern about a medicine with your prescriber first. If you have severe or urgent side effects, seek medical help straight away."),W("medication-checklist"))),K(41,"Skin Health and Sun Protection","The skin is the body’s largest organ. It protects against infection, helps regulate temperature and reflects years of sun exposure. Skin changes with age, and cumulative ultraviolet (UV) exposure is one of the most important modifiable influences on skin health and skin cancer risk. This chapter explains skin structure and ageing, UV protection, skin-cancer awareness, moisturising and when skin changes need evaluation.",["Explain how skin changes with age and why sun exposure matters.","Apply practical UV protection strategies in different climates.","Recognise skin changes that require professional evaluation."],["Cumulative UV exposure contributes to photoageing and skin cancer. Protection is one of the most effective measures.","Shade, clothing, hats, sunglasses and broad-spectrum sunscreen work together.","Check the skin regularly. Changing moles and sores that do not heal need assessment.","Be cautious with cosmetic anti-ageing claims, and use medically supervised treatments where appropriate."],["who-uv","cancer-council","nhs-moles"],d("skin-structure","Skin structure and ageing",c("Skin has layers. The epidermis is the outer protective layer. The dermis contains collagen and elastin fibres and blood vessels. Beneath it lies subcutaneous fat. With age, skin renews more slowly, produces less oil and sweat, and may become thinner and drier. Collagen and elastin decline over time, contributing to fine lines and sagging. Sun exposure accelerates these changes, a process known as photoageing.")),d("sun-exposure","Sun exposure and UV radiation",c("Ultraviolet radiation from the sun includes UVA and UVB. UVB causes sunburn and drives much of the risk of skin cancer. UVA penetrates more deeply and contributes to ageing and cancer risk; it also passes through window glass, so indoor exposure near windows is not zero. UV exposure is greatest near midday, at high altitudes and in reflective settings such as water, sand and snow. Cumulative exposure across decades matters most.")),d("uv-protection","UV protection",c("The WHO recommends a combination of approaches. Seek shade, especially when the sun is strongest, usually around midday. Wear protective clothing, a wide-brimmed hat and sunglasses. Use broad-spectrum sunscreen with an SPF of at least 30, applied generously and reapplied regularly, typically about every two hours and after swimming or sweating. Check the local UV index. Protection is still important on cloudy days. Some medicines increase sensitivity to sunlight, so ask a pharmacist about your medicines."),W("skin-protection")),d("skin-cancer","Skin cancer awareness",c("Skin cancers, including basal cell carcinoma, squamous cell carcinoma and melanoma, are among the most common cancers in many countries. Early detection improves outcomes. Check your skin regularly, including areas you cannot easily see, such as the scalp, back, soles and between the toes. For moles, clinicians often use the ABCDE guide: Asymmetry, irregular Border, uneven Colour, Diameter (larger than about 6 mm) and Evolving change. Any new, changing or non-healing lesion should be assessed by a clinician.")),d("moisturising","Moisturising and skin care",c("Dry skin is common in later life and can itch. Gentle cleansing and a regular moisturiser help maintain the skin’s protective barrier. Fragrance-free products suit sensitive skin, and very hot water can make dryness worse. Persistent itching, rashes or skin breakdown should be assessed, because many of these have treatable causes.")),d("evaluation","Skin changes requiring evaluation",Fa("A mole or spot that changes in size, shape or colour, or that bleeds or itches.","A sore that does not heal within about four weeks.","A new lump in the skin.","A persistent rash or itch that does not respond to moisturisers.","Bleeding or crusting that keeps returning."),q("info","Skin check reminder","Many clinics and national health services explain how to check moles. Photographs taken at intervals can help you notice change, but they do not replace a clinical examination.")),d("cosmetic-claims","Avoid cosmetic anti-ageing promises",c("Sunscreen is the most evidence-supported measure for protecting skin from photoageing. Some topical treatments, such as prescription retinoids, have evidence for improving sun-damaged skin when used under medical guidance. Be cautious of products that promise to reverse ageing, rebuild collagen dramatically or repair DNA. Injectable and procedural treatments carry risks and should be carried out by qualified professionals only."),$(5,"The HERBULANCE Food Safety & Kitchen Hygiene Guide helps readers explore hygiene and safe practice in daily routines, a useful companion to the infection-awareness themes in later chapters.")))],Dy=[K(42,"Immune Function and Infection Awareness","The immune system defends against infection and abnormal cells. Its responses change with age, which can make some infections more serious and makes vaccination especially important. This chapter explains immune ageing, infection risks, vaccination, hygiene and food safety, the role of nutrition and sleep, and the warning signs of serious infection. No food or supplement is presented here as a guaranteed way to prevent infection.",["Describe the main components of the immune system and how they change with age.","Explain practical infection-prevention measures.","Recognise warning signs of serious infection that need urgent care."],["Immune responses can become slower and less precise with age, a process called immunosenescence.","Vaccination, hand hygiene and respiratory hygiene are among the most effective infection-prevention measures.","Good nutrition, sleep and physical activity support normal immune function, but no food or supplement guarantees protection.","Sepsis and pneumonia can progress quickly. Confusion, rapid breathing or feeling very unwell requires urgent help."],["franceschi-2000","cdc-vacc","nhs-vacc","who-ageing"],d("immune-overview","Immune-system overview",c("The immune system has two broad parts. The innate system responds quickly to general threats through barriers such as skin and mucus, white blood cells and inflammatory signals. The adaptive system develops targeted responses through T cells and B cells. It produces antibodies and builds immune memory, which allows faster responses to germs encountered before. Vaccines work by training the adaptive system safely, without causing the disease."),W("immune-overview")),d("immunosenescence","Immune-system ageing",c("Immunosenescence describes age-related changes in immune function. The thymus, where T cells mature, shrinks with age, so fewer new T cells are produced. Responses to new infections may be slower, and responses to some vaccines can be weaker. Low-grade inflammation, sometimes called inflammageing, can also disturb immune balance. These changes help explain why infections such as pneumonia and shingles are more common or more serious in later life. Immune ageing varies widely between people.")),d("infection-risk","Infection risk",c("Infection risk depends on age, chronic conditions, nutrition, smoking, living conditions, exposure in hospitals or care homes, and vaccination status. Infections of particular concern in later life include influenza, pneumonia, COVID-19, shingles and urinary tract infections. In some older people, a urinary infection presents mainly with confusion rather than typical urinary symptoms, so a sudden change in thinking should always prompt assessment.")),d("vaccination","Vaccination",c("Vaccination is one of the most effective public-health tools. It protects the individual and, when coverage is high, the wider community. Recommendations for older adults vary by country and change as evidence develops. Chapter 37 summarises vaccines commonly recommended for older adults. Always check your national schedule and discuss your personal situation with a clinician.")),d("hygiene","Hygiene",c("Hand hygiene is one of the simplest protective measures. Wash hands with soap and water before eating, after using the toilet, after contact with animals and after handling shared items. Cover coughs and sneezes, and where practical stay at home when unwell. Clean frequently touched surfaces. Good hygiene in households and care settings protects everyone.")),d("food-safety","Food safety",c("Foodborne infections can be more serious for people with weakened immune responses, older age or chronic illness. Follow the safe chilling, cooking and storage practices described in Chapter 14. Check use-by dates, cook eggs, meat and fish thoroughly, and ask a clinician whether to avoid unpasteurised dairy or undercooked foods if your immune system is weakened."),$(5,"The HERBULANCE Food Safety & Kitchen Hygiene Guide helps readers explore safe storage, cooking and cleaning in depth.")),d("nutrition-immunity","Nutrition and immune function",c("Adequate energy, protein and micronutrients support the immune system. Undernutrition impairs immune responses, so unplanned weight loss and poor appetite should be assessed. However, no single food, herb, vitamin or supplement has been shown to reliably prevent infections in healthy older adults. Claims that particular products “boost immunity” or prevent colds should be treated with scepticism (see Chapter 15).")),d("warning-signs","Warning signs of serious infection",q("safety","Possible sepsis: seek urgent care","Sepsis is a life-threatening response to infection. Warning signs include confusion or unusual drowsiness, very fast breathing, a fast heartbeat, a very high or very low temperature, mottled or pale skin, severe shivering, reduced urine output or feeling extremely unwell. Contact emergency services or go to urgent care immediately."),Fa("Fever with breathlessness, chest pain, confusion or a rash that does not fade when pressed.","A cough with blood or coloured sputum, or breathlessness at rest.","A severe headache with a stiff neck, light sensitivity or a rash.","A painful blistering rash, especially on one side of the body or near the eye, which needs prompt assessment.","Urinary symptoms accompanied by confusion, fever or back pain."))),K(43,"Chronic Conditions and Living Well","Many people live with one or more long-term conditions in later life. Living well with a chronic condition means managing symptoms, maintaining function, taking medicines safely, staying connected and making decisions that reflect personal priorities. This chapter describes common conditions, multidisciplinary care, self-management education, adherence and functional independence.",["Describe common chronic conditions and the concept of multimorbidity.","Explain how multidisciplinary care and self-management support living well.","Plan lifestyle adaptations that respect individual treatment plans."],["Multimorbidity, meaning two or more long-term conditions, is common in later life.","Multidisciplinary teams can coordinate care across medicines, activity, nutrition, mental health and daily living.","Self-management education builds confidence, problem-solving and symptom monitoring.","Personal treatment plans should be respected and adapted together with the clinical team."],["who-ageing","who-diabetes","who-hypertension","nhs-exercise"],d("common-conditions","Common chronic conditions",c("Common long-term conditions in later life include high blood pressure, diabetes, arthritis, heart disease, chronic obstructive pulmonary disease, asthma, kidney disease, osteoporosis, hearing and vision loss, depression and dementia. Many people have more than one condition, known as multimorbidity. Multimorbidity complicates treatment, because medicines and goals must be balanced across conditions and the burden of appointments can be heavy.")),d("multidisciplinary","Multidisciplinary care",c("Care teams may include family doctors, nurses, pharmacists, physiotherapists, occupational therapists, dietitians, speech and language therapists, social workers, psychologists and specialists. Good teams coordinate advice so that the person receives consistent, practical guidance. Ask who is responsible for each part of your care and how to contact them.")),d("self-management","Self-management education",c("Self-management education helps people understand their condition, recognise changes, set goals, monitor symptoms and solve everyday problems. Programmes often run in groups and teach practical skills such as pacing, managing flare-ups, reading food labels and communicating with clinicians. Evidence suggests that structured self-management support can improve confidence and some aspects of wellbeing, although benefits vary between people and programmes."),q("info","Write an action plan","An action plan states what to do when symptoms are stable, what to do when they change, and when to seek urgent help. Keep a copy at home and share it with the people who support you.")),d("medication-adherence","Medication adherence",c("Adherence means taking medicines as agreed with the clinician. Barriers include complicated regimens, side effects, cost, memory and beliefs about medicines. Raise concerns openly rather than stopping treatment silently. Chapter 40 covers medication safety and reviews in more depth.")),d("lifestyle-adaptation","Accessible lifestyle adaptation",c("Lifestyle changes work best when they are realistic. Choose one or two priorities, adapt activity to symptoms, plan meals that suit energy and budget, and build in rest. Adaptations such as seated exercise, pre-prepared meals and a simple daily routine can make self-management more achievable. Setbacks are normal, and returning to the plan is what matters most.")),d("functional-independence","Functional independence",c("Chronic conditions affect more than the body. Their impact on daily life, such as dressing, cooking, managing money or going out, is central to wellbeing. Occupational therapy can identify practical solutions, from energy-saving techniques to equipment. Maintaining independence often depends on early support rather than waiting for a crisis."),$(13,"The HERBULANCE stress management guide helps readers explore how the emotional load of a long-term condition can be eased, which is an important part of living well.")),d("respect-plans","Respect for individual treatment plans",c("Individual treatment plans reflect each person’s condition, preferences and goals. They should be discussed, adapted and reviewed with the clinical team. If a plan seems unworkable, say so, because alternatives often exist. Do not change prescribed treatment independently, and be cautious with online advice that conflicts with your clinician."),W("chronic-framework"))),K(44,"Building a Personal Healthy-Ageing Routine","Knowledge becomes useful when it is built into everyday life. A personal healthy-ageing routine combines nutrition, movement, sleep, social connection and preventive care into a rhythm that suits a person’s circumstances. This chapter shows how to design daily and weekly routines, keep them sustainable, adapt them as life changes, and measure progress without perfectionism.",["Design a daily and weekly healthy-ageing routine that fits your life.","Select a minimum routine that can be kept up during difficult periods.","Use progress indicators that focus on behaviours and function rather than perfection."],["Routines work best when they are anchored to existing habits and built around personal priorities.","A minimum viable routine keeps progress going during illness, grief or busy periods.","Track behaviours and functional abilities, not only appearance or scores.","Review and adapt the routine regularly as health and circumstances change."],["who-pa","who-diet","nhs-sleep","who-loneliness"],d("daily-weekly","Daily and weekly routines",c("A daily routine might include a glass of water on waking, a short mobility routine, a walk or active task, a balanced lunch, one social contact, a calm evening wind-down and consistent sleep timing. A weekly routine adds two strength sessions, several balance practices, time for hobbies or learning, a planned social activity, a shopping and meal-planning session, and a preventive-care task such as checking medicines or booking appointments."),W("daily-routine")),d("components","Nutrition, movement, sleep, social connection and preventive care",Fa("**Nutrition:** build most meals around vegetables, fruit, legumes, whole grains and suitable protein, drink regularly, and batch-cook one meal each week.","**Movement:** aim for regular aerobic activity, strength work on at least two days, balance practice on several days, and breaks from long periods of sitting.","**Sleep:** keep consistent wake and bedtimes, get daylight in the morning, and make the bedroom cool, dark and quiet.","**Social connection:** schedule regular contact, join one group or activity, and reach out to someone each week.","**Preventive care:** keep a health summary, attend screening and eye and hearing checks, and review medicines once a year or whenever they change.")),d("sustainability","Adaptation and sustainability",c("Sustainable routines rest on enjoyment, flexibility and practicality. Start with two or three habits, anchor them to existing routines, and add more only when the first ones feel automatic. Plan a minimum version of each habit for busy or unwell days. Review the routine when circumstances change, because a new diagnosis, bereavement, a move or a change in mobility all call for adjustment.")),d("progress","Progress without perfectionism",c("Progress is rarely a straight line, and missing a day does not undo weeks of effort. Measure what you control: how often you moved, how many people you spoke with, how well you slept, and whether everyday tasks feel easier. Functional measures, such as walking a little further, rising from a chair more easily or carrying shopping without strain, are more meaningful than numbers alone. Review the routine monthly, using the progress review worksheet in this book."),q("reflect","Minimum viable routine","Write down the smallest version of your routine that you could keep up during your hardest week, and keep it somewhere visible. Returning to this minimum keeps a habit alive during difficult periods."),$(7,"The HERBULANCE meal planning guide helps readers build repeatable weekly menus and shopping plans that support nutrition habits.")))],Hy=[K(45,"Healthy Ageing for Different Generations","People of different ages face different health opportunities and challenges. Young adults are building foundations for future health, middle-aged adults are managing risk and responsibilities, older adults often focus on function and independence, and very old people may prioritise comfort, relationships and dignity. This chapter explores these differences without imposing rigid age-based assumptions.",["Describe the health priorities that typically matter at different life stages.","Explain why rigid age-based assumptions can cause harm.","Identify how healthy-ageing approaches can be adapted across generations."],["Early adulthood builds bone mass, habits, mental-health resilience and financial foundations that matter later.","Middle adulthood is a key time for blood pressure, cholesterol, blood sugar, weight and activity management.","Later adulthood often prioritises function, falls prevention, sensory health, medicines and social connection.","Very old age varies widely. Comfort, dignity, relationships and personal choice are central, and capability should not be assumed to be absent."],["who-ageism","who-ageing","who-wrha","who-dha"],d("young-adulthood","Young adulthood and future health",c("Young adults often feel that health is far away, yet decisions made now shape later life. Peak bone mass is largely established by early adulthood, so regular weight-bearing activity and adequate calcium and vitamin D matter. Not smoking, moderate alcohol use, regular activity, good sleep and attention to mental health all lay foundations. Financial planning, including pensions and savings, supports later independence.")),d("middle-adulthood","Middle adulthood and prevention",c("Middle adulthood is a valuable time for prevention. Checks of blood pressure, cholesterol and blood sugar can identify risk early. Many people at this stage balance work, family and caring responsibilities, which can leave little time for self-care. Hormonal changes in midlife, such as the menopause, can affect sleep, mood, bones and sexual health. Discuss symptoms with a clinician, and be cautious about unsupervised hormone products (see Chapter 53).")),d("later-adulthood","Later adulthood and function",c("In later adulthood, many people focus on maintaining function, independence and the ability to do the activities they value. Falls prevention, strength and balance training, hearing and vision care, medicine reviews and social connection are particularly important. Many older adults remain highly active, working, volunteering and caring for others.")),d("very-old","Very old age",c("Very old age is a diverse stage. Some people in their nineties remain independent and socially engaged, while others need considerable support. Priorities often shift towards comfort, relationships, dignity, familiar surroundings and personal choice. Healthcare should continue to look for treatable problems while respecting the person’s goals. Assumptions that very old people cannot learn, decide or contribute are unfounded and harmful.")),d("differences-priorities","Differences in needs and priorities",c("Priorities differ between individuals, not only between age groups. Some people in their twenties live with chronic illness, and some people in their seventies run long-distance events. The most useful approach asks each person what matters to them, what they can do, what they want to change and what support they need.")),d("avoid-rigid","Avoid rigid age-based assumptions",c("The WHO Global report on ageism (2021) describes how age-based stereotypes can lead to discrimination in healthcare, employment and community life. Ageism can reduce access to care, shape how people see themselves and limit participation. Avoiding it means focusing on individual capability, preferences and evidence, rather than on chronological age alone."),W("generational-priorities"))),K(46,"Disability, Accessibility and Adaptive Healthy Living","Disability is a normal part of human diversity, and many disabled people live long, healthy and active lives. Health education should be inclusive, accessible and respectful of autonomy. This chapter explores disability-inclusive approaches to movement, food, technology, home adaptations and communication, and emphasises that disabled people should lead decisions about their own lives.",["Explain disability-inclusive health education and the difference between medical and social models of disability.","Identify adaptive movement, food-preparation and technology options.","Apply accessible communication and respect for autonomy in healthy-living support."],["Many barriers to healthy living are environmental and social, and many of them can be reduced.","Adaptive movement can include seated, supported, water-based and upper-body options.","Accessible food preparation, technology and home adaptations support independence.","Disabled people should be involved in designing their own health and support plans."],["un-crpd","who-ageing","who-wrha"],d("inclusive-education","Disability-inclusive health education",c("The medical model views disability mainly as a condition to be treated, while the social model recognises that barriers in environments, attitudes and systems disable people. Both perspectives help. Inclusive health education avoids assuming that everyone walks, sees, hears or reads in the same way, and it presents information in several formats. The UN Convention on the Rights of Persons with Disabilities (2006) promotes equal rights, participation and inclusion.")),d("adaptive-movement","Adaptive movement",c("Adaptive movement uses equipment and techniques to make activity safe and effective. Seated exercise, chair-based strength work, water-based exercise, arm cycling, band-based training for the upper body and trunk, and supported standing are all options. Figure 47 shows examples. Physiotherapists and clinicians can help design programmes around specific impairments and goals."),W("adaptive-exercise")),d("assistive-tech","Assistive technologies",c("Assistive technologies include mobility aids, hearing devices, screen readers, communication boards, adapted kitchen tools, environmental controls and reminder systems. Choosing equipment works best with a professional assessment and a trial period. Avoid buying equipment that does not fit the person’s needs, and check maintenance and repair arrangements before purchase.")),d("accessible-food","Accessible food preparation",c("Food preparation can be adapted with table-top work surfaces, one-handed chopping boards, lightweight utensils, lever-style tap handles, built-up utensil grips, pre-prepared ingredients and seated cooking stations. Consider texture changes where swallowing is affected, and ask a speech and language therapist for guidance. Safety matters: keep hot liquids away from the edge of the worktop and use appliances with automatic shut-off where possible.")),d("home-adaptations","Home adaptations",c("Home adaptations may include step-free entrances, ramps, wider doorways, lever handles, grab rails, adjustable beds, level-access showers and improved lighting. Some countries offer grants or loans for adaptations. An occupational therapist can recommend priorities and practical solutions. Chapter 48 explores home design in more detail.")),d("communication","Communication accessibility",c("Communication should be clear and accessible. Use plain language, large print, captions, easy-read formats, audio versions, sign-language interpreters where needed, and visual aids. Give people time to respond, face them when speaking, and ask how they prefer to receive information.")),d("autonomy","Respecting autonomy and personal preferences",c("Respecting autonomy means that disabled people decide what they want from healthy living. A health plan that does not reflect a person’s goals is unlikely to succeed. Offer choices, check understanding and support decisions rather than making them on someone’s behalf."),$(14,"The HERBULANCE physical activity guide helps readers explore adaptable exercise and inclusive movement options for people with different abilities."))),K(47,"Caregiving, Family Support and Dignity","Caregiving is a common and valuable part of family and community life. It can be deeply rewarding and demanding at the same time, and caregivers and the people they support both deserve respect, information and help. This chapter discusses shared responsibilities, caregiver wellbeing, communication, respectful assistance, consent and autonomy, and when professional care may be needed.",["Describe the responsibilities and emotional demands of family caregiving.","Explain how communication, consent and respect protect the dignity of the person receiving care.","Identify signs of caregiver strain and when professional services should be considered."],["Caregiving often involves many tasks shared across family and professionals, and clear planning reduces strain.","Caregiver wellbeing matters for safety and sustainability. Respite and support are essential.","Respect, consent and the person’s preferences should guide assistance wherever possible.","Professional care may be needed when safety, health or caregiver wellbeing cannot be maintained."],["who-ageing","who-csdh","who-dementia-plan","nia-caregiving"],d("family-caregiving","Family caregiving",c("Family caregiving includes practical help with shopping, meals, transport and money, personal care such as bathing and dressing, emotional support, supervision and coordination with services. Caregiving roles vary: some people care for a partner, others for a parent, child, sibling or friend. Many caregivers also work, raise children or manage their own health.")),d("shared-responsibilities","Shared responsibilities",c("Shared responsibility works best when tasks are discussed openly. Family meetings, written task lists and agreed boundaries help distribute work fairly. Consider skills, distance, time and preferences. Where possible, include the person receiving care in decisions about their own support.")),d("caregiver-wellbeing","Caregiver wellbeing",c("Caregiver strain can cause exhaustion, anxiety, low mood, sleep problems, resentment and neglect of the caregiver’s own health. Warning signs include feeling constantly overwhelmed, losing interest
