 in your own life, untreated health problems and frequent conflict. Respite care, carer support groups, counselling, financial help and regular breaks reduce strain. Caregivers should attend their own health checks."),q("caution","Caregivers need support too","Asking for help is not a failure. Speak to your family doctor, a social worker or a carer support service if you are struggling, and tell them about your own health needs.")),d("communication-care","Communication",c("Person-centred communication involves listening, asking about preferences, not talking over the person, and avoiding baby talk or childlike language. Explain what you are going to do before helping, and offer choices. When someone has difficulty communicating, use patience, simple questions, visual cues and familiar routines. Ask before making changes.")),d("respectful-assistance","Respectful assistance",c("Respectful assistance supports independence wherever possible. Help the person do as much as they can safely, rather than doing everything for them. Protect privacy during personal care by closing doors and curtains, and check comfort. Dignity is maintained when people can choose clothing, meals, routines and visitors.")),d("consent","Consent and autonomy",c("Consent means agreeing to care after understanding the options. Decision-making capacity is decision-specific and can change over time. Legal frameworks differ between countries and include powers of attorney, guardianship, advance directives and substitute decision-makers. A concern about capacity should be assessed by a qualified professional rather than assumed from a diagnosis alone. Where capacity is limited, involve the person as fully as possible and follow the law and ethical guidance in your area.")),d("professional-care","When professional care may be needed",c("Professional care may be needed when the person’s safety is at risk, when care needs exceed what family can provide safely, when the caregiver’s health is affected, when behaviour changes are distressing, when falls are frequent, or when the person’s wishes can no longer be met at home. Options include home-care services, day centres, respite care, residential care and specialist services. Discuss options early, with the person and family, rather than in a crisis."),W("caregiving-framework"),$(13,"The HERBULANCE stress management guide helps readers explore emotional wellbeing and stress management for family members and caregivers."))),K(48,"Independent Living and Home Safety","Most people want to live in their own homes for as long as possible. Good design, safe spaces and practical adaptations help people stay independent, reduce the risk of falls and respond to emergencies. This chapter covers accessible design, lighting, bathroom and kitchen safety, fall prevention, emergency planning, assistive devices and affordable adaptations.",["Identify features of accessible and safe homes.","Plan low-cost home safety improvements in key rooms.","Prepare an emergency plan and choose assistive devices appropriately."],["Accessible design reduces barriers, including level entrances, good lighting and reachable storage.","Bathrooms and kitchens carry many falls and injury risks, and small changes can help.","Emergency plans include contacts, alert systems, medicine information and plans for power cuts and extreme weather.","Occupational therapy home assessments can prioritise changes and recommend affordable options."],["who-falls","cdc-falls","who-agefriendly","who-ageing"],d("accessible-design","Accessible home design",c("Accessible design includes a step-free or ramped entrance, wide doors and clear paths, a bedroom and bathroom on one level where possible, lever-style handles, non-slip flooring, contrast on the edges of steps and worktops, and storage between waist and shoulder height. These features help people with changing mobility, young families, visitors and everyone in the home."),W("accessible-home")),d("lighting","Lighting",c("Good lighting reduces falls. Use bright, even lighting in hallways, staircases and bathrooms. Night lights along the route to the bathroom and motion-sensor lights can help at night. Avoid glare, and place switches within easy reach. Lamps with large, easy-to-operate switches help people who read or sew.")),d("bathroom","Bathroom safety",c("Bathrooms are high-risk rooms. Fit grab rails near the toilet, bath and shower, use non-slip mats or treads, and consider a shower chair or bath board. Limit hot-water temperature to a safe level according to local guidance to reduce the risk of scalding. Keep essentials within reach, and make sure the route from bed to toilet is well lit.")),d("kitchen","Kitchen safety",c("Keep frequently used items between waist and shoulder height, and avoid step stools. Use lightweight pans, non-slip mats and turn pan handles inwards. Choose appliances with automatic shut-off where possible. Fit smoke alarms, and carbon monoxide alarms where fuel-burning appliances are used, in line with national guidance. Consider a fire blanket and a layout that avoids carrying hot items across the room.")),d("fall-prevention","Fall prevention at home",c("Remove loose rugs and trailing cables, keep walkways clear, secure stair rails on both sides where possible, and check footwear and furniture stability. Install reachable telephones or alert devices in key rooms. Chapter 20 explains balance and falls prevention in more detail, and Figure 19 shows a home layout with common hazards.")),d("emergency","Emergency planning",c("An emergency plan lists emergency numbers, trusted contacts, medical conditions, medicines, allergies and key information. Keep a copy by the telephone and share it with a neighbour or relative who can help. Plan for power cuts, heatwaves, cold snaps, floods and fires. Know where to turn off water and gas, and keep a torch, batteries, drinking water and essential medicines available. Consider a regular check-in arrangement with someone nearby."),q("safety","Calling for help","If you need urgent help, call your local emergency number and describe clearly what has happened and where you are. Keep your address and key information where you can find it quickly.")),d("assistive-devices","Assistive devices",c("Walking aids, reachers, long-handled tools, raised toilet seats, bath boards and stair lifts can all support independence. Devices must fit the person and be used correctly. Ask an occupational therapist or physiotherapist to assess needs and show safe use. Check that equipment is maintained, and that the person is comfortable using it in daily life.")),d("affordable","Affordable adaptations",c("Many improvements cost little: non-slip strips, lamp switches, additional lighting, rearranged furniture, secure storage, and labelled containers. Local councils, charities, housing associations and national programmes may offer grants, loans or equipment schemes. Ask about eligibility rather than assuming help is unavailable."),$(12,"The HERBULANCE sleep guide explores how a dark, safe bedroom and a clear route to the bathroom support restful nights, which connects to the home-safety advice here."))),K(49,"Financial, Environmental and Social Determinants of Ageing","Health is shaped by the conditions in which people are born, grow, live, work and age. Income, housing, food access, transport, climate, environmental exposure and social inequality strongly influence healthy ageing. This chapter explains these determinants, the community resources that can help, and why individual lifestyle advice cannot replace broader social solutions.",["Explain how income, housing, food and transport shape healthy ageing.","Describe environmental risks, including heat, cold and air pollution, and how communities respond.","Explain why personal health advice must be combined with social and policy action."],["The WHO Commission on Social Determinants of Health (2008) emphasised that health reflects the conditions of daily life.","Income, food affordability, housing quality and transport access are major determinants of healthy ageing.","Environmental exposures such as extreme heat, cold, air pollution and flooding affect some groups more than others.","Community resources can reduce inequality, but policy and structural change are essential."],["who-csdh","who-air","who-agefriendly","who-ageing"],d("income-access","Income and healthcare access",c("Income affects almost every aspect of health, from nutrition and housing to medicines and time to rest. Out-of-pocket costs for healthcare can discourage people from seeking help. Health systems vary. Some provide universal coverage through public funding, others rely on insurance, and many combine approaches. Knowing how your system works, including entitlements and waiting times, reduces the risk of delayed care.")),d("food","Food affordability",c("Food insecurity, meaning the lack of reliable access to enough affordable and nutritious food, affects many older adults. Rising food prices, limited shops in rural or deprived areas, and mobility difficulties can all contribute. Community kitchens, food banks, social supermarkets, produce schemes and shared gardens can help. Chapter 14 offers budget-conscious meal strategies.")),d("housing","Housing",c("Housing quality shapes health. Cold, damp and mouldy homes are linked with respiratory problems, and poor heating can strain the heart and raise blood pressure. Insecure housing or unaffordable rent can cause chronic stress. Home adaptations (Chapter 48) and energy-efficiency programmes may help. Housing advice services can explain options and rights.")),d("transport","Transportation",c("Transport enables access to healthcare, food, work, social life and volunteering. People in rural areas, people with disabilities and people who cannot drive are particularly affected. Public transport, community car schemes, accessible taxis, volunteer driver programmes and well-designed streets improve access. Cost and reliability matter as much as availability.")),d("climate","Climate and environmental exposure",c("Extreme heat increases the risk of dehydration, heat exhaustion and cardiovascular events, especially for people who live alone, take certain medicines or have limited mobility. Cold weather increases cardiovascular and respiratory strain. Air pollution is a major environmental risk factor for disease, and floods and wildfires disrupt essential services. Heat plans, cooling centres, warning systems and community check-ins can protect vulnerable people. WHO guidance on outdoor air quality explains the health risks in more detail.")),d("inequality","Social inequality",c("Discrimination based on age, disability, gender, ethnicity, sexuality, migration status or language can limit access to services, employment, housing and social participation. Digital exclusion adds another barrier. Inclusive services, multilingual information and community outreach help reduce these inequalities.")),d("resources","Community resources",c("Local resources include senior centres, libraries, community health workers, peer-support groups, faith and cultural associations, neighbourhood networks, meal programmes and emergency services. Many areas have age-friendly initiatives, following the WHO Global Network for Age-friendly Cities and Communities. Finding out what is available locally is a practical first step.")),d("limits-personal","Why personal advice cannot replace social solutions",q("caution","Individual choice and structural conditions","Healthy choices matter, but people cannot choose clean air, safe housing, affordable food or reliable transport if these are not available. Effective healthy-ageing strategies combine personal support with policies that improve the conditions in which people live."),W("social-determinants"))),K(50,"Ageing Across Cultures and Communities","Ageing is experienced through culture. Beliefs about family, respect, independence, religion, food, work and community shape how people age and how they are cared for. This chapter describes common patterns and variations across regions, while stressing that every community contains enormous diversity. The aim is to inform respectful practice, not to create stereotypes.",["Describe how cultural expectations and family structures shape ageing.","Recognise traditional foods and practices that support health and connection.","Apply culturally respectful approaches to healthy ageing and care."],["Cultural expectations about family and respect vary greatly within and between countries.","Family structures range from nuclear to multigenerational, and from solo living to community living.","Traditional practices such as dance, tai chi, yoga and shared meals can support movement and connection.","Culturally respectful care involves asking individuals about their values, faith needs and preferences."],["who-agefriendly","who-ageism","who-trad","fao-fbdg"],d("expectations","Cultural expectations",c("In many cultures, older people are valued for wisdom, experience and leadership, and younger generations have duties to support them. In East Asian contexts, the concept of filial piety shapes expectations of family care, although the way it is practised has changed over time. In other societies, independence and self-reliance are highly valued, and professional services are more common. Most societies combine these influences. Labels such as collectivist or individualist oversimplify real families, which vary within and across regions.")),d("family-structures","Family structures",c("Family structures include nuclear families, extended families, multigenerational households, single-person households, cohabiting partners, chosen families and communal living arrangements. Structures change with migration, economic pressure, urbanisation and social policy. Each structure brings strengths and strains, and healthy ageing depends on how roles and resources are shared.")),d("traditional","Traditional foods and practices",c("Traditional foods carry cultural meaning, nutritional value and social connection, and they often use affordable local ingredients. Movement traditions such as tai chi and qigong, yoga, dance traditions across Africa, Latin America and the Pacific, and walking or gardening in many rural communities support physical and social health. Traditional remedies deserve respect, but their safety and interactions should be checked, as Chapter 15 explains. Religious fasting, such as Ramadan, requires medical advice for people who take medicines or manage diabetes, kidney disease or other conditions.")),d("intergenerational","Intergenerational living",c("Living with grandchildren, adult children or extended family can provide support, companionship and practical help with childcare. It can also create pressure on space, privacy and finances. Clear agreements about household tasks, personal space, decision-making and expenses help these arrangements work well.")),d("community-support","Community-based support",c("Community-based support includes faith groups, mutual-aid associations, cooperatives, neighbourhood volunteers, cultural centres and savings groups. These networks can provide meals, transport, companionship and information. Formal and informal support often work best together.")),d("rural-urban","Rural and urban differences",c("Rural areas may offer green space, close community ties and a slower pace, but they can also have fewer services, longer journeys to clinics, limited transport and digital gaps. Urban areas may offer more services and transport, but can involve isolation, noise, pollution, high housing costs and a fast pace. Age-friendly design matters in both settings.")),d("avoid-stereotypes","Avoid stereotypes and generalisations",q("caution","Diversity within communities","Individuals within any culture differ in beliefs, health, wealth, education and personal preferences. Ask people how they would like to be supported rather than assuming. Respectful care begins with curiosity."),W("cultural-diversity"),$(9,"The HERBULANCE Food Allergies, Intolerances & Special Dietary Needs guide helps readers explore religious, cultural and medically necessary dietary practices with care and accuracy.")))],Ry=[K(51,"What Longevity Research Can Actually Tell Us","Longevity research is one of the most exciting and most misreported fields in science. Studies range from population cohorts and randomised trials to experiments in worms, flies and mice. Each design answers different questions and has different limits. This chapter explains how to interpret these studies, why biomarkers can mislead, how confounding works and how to evaluate a headline.",["Explain the strengths and limitations of observational studies, clinical trials and animal research.","Identify confounding, bias and surrogate outcomes in longevity claims.","Evaluate headlines and press releases about ageing research."],["Randomised controlled trials are the strongest design for testing causal effects, but they are difficult to run for ageing outcomes.","Observational studies reveal associations, which may be distorted by confounding.","Animal findings guide research but often fail to translate to humans.","A change in a biomarker does not automatically mean that health outcomes have improved."],["ravussin-2015","dong-2016","moqri-2023","barzilai-2016"],d("observational","Human observational studies",c("Cohort studies follow groups of people over time, recording exposures and outcomes. They can include thousands of participants and reveal patterns across decades. However, they cannot prove that an exposure caused an outcome, because people who differ in one factor often differ in others. For example, people who walk more may also have higher incomes, safer housing and better access to care. Statistical adjustment reduces this problem but cannot remove it completely.")),d("trials","Clinical trials",c("Randomised controlled trials allocate participants by chance, which tends to balance known and unknown characteristics between groups. They are the strongest design for testing whether an intervention causes an outcome. Trials of healthy ageing are expensive and long, however, and they often rely on surrogate endpoints, such as biomarkers, that may not translate into real-world benefit. Trial populations may also differ from the wider population. Read trial results with attention to size, duration, adherence and the outcomes measured.")),d("animal","Animal studies",c("Mice, rats, nematode worms, fruit flies and other species are used to study ageing mechanisms and to test interventions, because their lifespans are short enough to study within a laboratory timeframe. Some interventions extend lifespan in one species but not in others, and effects under controlled laboratory conditions may not transfer to people. Animal studies are essential for generating hypotheses, but they are not proof of human benefit."),q("evidence","Animal results are not human results","A finding that a drug extends mouse lifespan is a reason to investigate further, not a reason to take the drug. Human trials must test safety and effectiveness before any use is recommended.")),d("biomarkers","Biomarkers",c("A biomarker is a measurable indicator of a biological process, such as blood pressure, LDL cholesterol or a DNA methylation pattern. Clinical biomarkers with established links to outcomes, such as LDL cholesterol for cardiovascular risk, are very useful. Novel biomarkers used in ageing research may change in response to an intervention without showing that health outcomes improved. Researchers therefore distinguish biomarkers that predict outcomes from those that only track biology.")),d("confounding","Confounding variables and reverse causation",c("A confounder is a factor associated with both an exposure and an outcome, which can create a false impression of cause and effect. Education, income, smoking, social support and early-life conditions are common confounders in ageing research. Reverse causation is another challenge: early disease can influence the exposure. For example, reduced appetite during illness may appear to predict death, when it is really a sign of the illness.")),d("limitations","Research limitations",c("Research has further limitations, including small samples, short follow-up, selective recruitment, changing diagnostic criteria, measurement error, publication bias that favours positive results, and conflicts of interest. Replication in different populations is essential before conclusions are widely accepted.")),d("evaluate-headlines","How to evaluate headlines",c("Headlines often simplify complex studies. Before accepting a claim, ask the questions below. Figure 52 shows how different types of evidence compare in strength."),W("evidence-hierarchy"),Jl("What type of study was it: observational, randomised trial, animal study or laboratory work?","How many participants were studied, and for how long?","Was there a control group, and how were participants allocated?","Which outcome was measured: a clinical outcome such as disease or death, or a surrogate biomarker?","Have the findings been replicated independently?","Who funded the research, and were conflicts of interest declared?","Does the claim describe an association, a cause, or both?","Is the claim about a population average, or about an individual?"),c("Claims that ageing has been reversed in humans should be supported by peer-reviewed human studies with clinical outcomes, not only by press releases or single animal studies."))),K(52,"Biological-Age Tests and Health Biomarkers","Chronological age counts the years since birth. Biological age estimates how far a person’s body has aged relative to peers. Several tests claim to measure biological age, including epigenetic clocks and blood-based panels. These tools are interesting research instruments, but their accuracy, reliability and clinical meaning are still being established. This chapter explains what they can and cannot tell individuals.",["Distinguish chronological age from biological age.","Interpret established clinical biomarkers and understand the status of research biomarkers.","Assess the reliability, validity and clinical relevance of biological-age tests."],["Chronological age is a precise count. Biological age has no single agreed measurement.","Established clinical biomarkers, such as blood pressure and kidney function, guide care.","Epigenetic clocks are research tools with variable reliability and limited validation for individual decisions.","No single score can describe a person’s health. Use clinical assessment and functional measures."],["horvath-2013","levine-2018","moqri-2023","who-wrha"],d("chrono-bio","Chronological versus biological age",c("Chronological age is the number of years since birth. Biological age refers to the functional and molecular state of the body, which may be older or younger than the chronological figure. People with the same chronological age can differ greatly in strength, cognition, metabolic health and disease risk. Biological age is a useful concept, but no single agreed test measures it directly."),W("bio-vs-chrono")),d("biomarkers-interpretation","Biomarker interpretation",c("Clinical biomarkers have well-understood meanings. Blood pressure, HbA1c, LDL cholesterol, kidney function estimated from blood creatinine (eGFR) and haemoglobin are used in routine care, with reference ranges and guidance on action. Their interpretation depends on the individual, the test conditions and trends over time. Some markers, such as C-reactive protein, can rise with infection or injury, so context matters.")),d("epigenetic-clocks","Epigenetic clocks",c("Epigenetic clocks estimate age from DNA methylation patterns at many sites across the genome. The first widely used clock, described by Steve Horvath in 2013, estimated chronological age across many tissues. Later clocks, such as PhenoAge published in 2018, were trained on clinical biomarkers and health outcomes, aiming to capture biological ageing more directly. These clocks are powerful research tools. Results can differ between clocks, laboratories and tissues, and their predictive value for individuals is still being evaluated.")),d("limitations","Biological-age testing limitations",c("Consumer biological-age tests have important limitations. Different methods produce different results. Repeat testing may vary. The reference population may not match the person being tested, and the meaning of a result is often unclear. Results can change with illness, medicines or sample handling. Tests can also cause anxiety, or lead to unnecessary decisions, if they are interpreted without professional guidance."),W("biomarker-limits")),d("reliability","Measurement reliability and clinical relevance",c("Reliability means that repeated measurements give consistent results. Validity means that a test measures what it claims to measure. Clinical relevance means that a result changes decisions in ways that improve outcomes. A biological-age test may be reliable and valid in research and still lack clinical relevance for an individual. Before acting on a result, ask what decision it would change and what evidence supports that decision.")),d("single-score","Why a single score cannot define a person’s health",c("Health is multidimensional. A single number cannot capture strength, mobility, cognition, mood, relationships, sensory function, chronic conditions or purpose. Functional measures, clinical assessment and personal goals are more informative for most people. A biological-age result is best regarded as one piece of information, discussed with a clinician, and never as a verdict on a person’s future."),q("caution","Do not change medicines because of a test","Do not stop, start or change prescribed medicines, or buy expensive products, because of a biological-age result without professional advice."))),K(53,"Emerging Longevity Treatments and Technologies","Researchers are investigating drugs and technologies that target ageing biology, such as senescent cells, metabolic pathways and cellular energy. Some ideas are promising, but most remain experimental. This chapter explains senolytics, metformin, rapamycin, NAD-related products, stem-cell interventions, gene-based approaches and the regulatory and ethical questions they raise. It separates research interest from established treatment.",["Describe the main emerging approaches to ageing research and their current status.","Distinguish experimental research from established medical treatment.","Recognise regulatory, safety and ethical concerns around unproven longevity products."],["Senolytics target senescent cells. Evidence comes mostly from animals and small early human studies.","Metformin is an established diabetes medicine. Its use to slow ageing is not established, and a major trial has not yet reported results.","Rapamycin-related drugs extend lifespan in some animal studies, but they suppress the immune system and are not approved for ageing.","NAD-related products and stem-cell clinics are often marketed beyond the evidence, so caution is essential."],["kirkland-2020","barzilai-2016","mannick-2018","covarrubias-2021","fda-supp"],d("senolytics","Senolytics",c("Senolytics are drugs designed to remove senescent cells selectively. In mouse studies, clearing senescent cells has improved some health markers and extended healthy function in certain models. Early human studies have tested senolytic drug combinations in small groups, mainly in people with specific conditions such as lung fibrosis or bone disease. These studies were designed primarily to assess safety and feasibility. Human benefit for healthy ageing is not established, and senolytic drugs can have side effects. Self-experimentation is not appropriate.")),d("metformin","Metformin research",c("Metformin is a widely used, inexpensive medicine for type 2 diabetes. Observational studies have linked metformin use with lower rates of some age-related diseases, but people who take it differ from those who do not, so these results are confounded. Laboratory and animal research suggests possible effects on ageing pathways. The Targeting Aging with Metformin (TAME) trial was proposed in 2016 to test whether metformin can delay multiple age-related diseases. As of 2026, TAME has not reported efficacy results and has faced funding delays. Metformin is not approved for healthy ageing and has its own side effects and contraindications.")),d("rapamycin","Rapamycin research",c("Rapamycin, also called sirolimus, is an immunosuppressant used after organ transplantation. It inhibits the mTOR pathway, a nutrient-sensing system linked with ageing in animal studies, and several rodent studies have reported extended lifespan. A small randomised trial in older adults, published in 2018, tested everolimus, a close analogue of rapamycin. It found improvements in some immune responses and fewer infections over the study period, but it also raised concerns about immune suppression and side effects. Self-treatment with rapamycin for ageing is unsafe and unsupported.")),d("nad","NAD-related products",c("Nicotinamide adenine dinucleotide (NAD+) is essential for cellular energy and DNA repair, and its levels decline in some tissues with age. Precursors such as nicotinamide riboside and nicotinamide mononucleotide can raise NAD+ levels in human blood in some studies. Evidence that they improve healthy ageing, physical performance or disease outcomes is limited, and their regulatory status differs between countries. Marketing often overstates their benefits.")),d("stem-cells","Stem-cell interventions",c("Stem-cell therapies have approved uses for some blood and immune conditions, usually in specialist hospital settings. Unregulated clinics sometimes offer stem-cell injections for ageing, joint disease or other conditions, often at high cost. These treatments can carry risks, including infection, tumour formation, immune reactions and no benefit at all. Regulators in several countries have warned about unapproved stem-cell products. Stem-cell treatment should be provided only within approved clinical research or licensed medical care.")),d("gene-approaches","Gene-based approaches",c("Gene therapies are approved for some rare and inherited diseases, and gene-editing techniques are under investigation for many other conditions. Gene-based approaches aimed at ageing itself remain experimental. Long-term safety, unintended effects and ethical considerations are central concerns. Direct-to-consumer offers of gene therapy for ageing are often unregulated and should be avoided.")),d("experimental","Experimental therapies",c("Many other approaches are being studied, including interventions in cellular energy, inflammation, autophagy and the gut microbiome. Most remain at laboratory or early trial stages. Experimental treatments should be tested through regulated clinical trials, which provide informed consent, safety monitoring and independent oversight.")),d("regulatory-ethics","Regulatory and ethical concerns",c("Longevity products raise important ethical questions. Who can afford them? Could they widen existing inequalities? How should risks be communicated to people who may be vulnerable to exaggerated claims? Medicines must demonstrate safety and efficacy before approval, but many supplements and wellness products are sold with much less scrutiny. Informed choice depends on accurate information and access to independent advice.")),d("distinction","Distinguishing research interest from established treatment",c("Figure 54 summarises the typical stages of longevity research, from laboratory work to approved treatment. Most candidate interventions never reach the final stage."),W("longevity-overview"),q("caution","Research interest is not clinical proof","A promising result in a laboratory or a mouse study is a hypothesis. Established treatment requires independent evidence of safety and benefit in people, and approval by a regulatory authority. Ask any provider whether the treatment is approved for your condition, and where the supporting evidence has been published."),$(14,"Regular physical activity remains the best-supported way to protect function, and this HERBULANCE title explores it in practical detail."))),K(54,"Lifestyle Habits With the Strongest Practical Foundations","Across decades of research, certain habits consistently appear as foundations of good health in later life: not using tobacco, being physically active, eating a varied diet, sleeping adequately, staying socially connected, using preventive care and managing risk factors. None guarantees a long life, but together they improve the odds of living well for longer. This chapter reviews these habits and explains why consistency matters more than miracle products.",["Summarise the lifestyle habits with the strongest practical evidence.","Explain why combining several habits matters.","Apply a realistic approach to habit change."],["Avoiding tobacco is one of the most important actions a person can take for health at any age.","Regular physical activity, varied nutrition and adequate sleep form a foundation for function and disease prevention.","Social connection and preventive healthcare support wellbeing and early detection.","Consistent habits offer more dependable benefits than any single product."],["who-tobacco","nhs-smoke","who-pa","who-diet","holt-2010","watson-2015"],d("tobacco","Avoiding tobacco",c("Tobacco use is one of the leading causes of preventable death worldwide. It damages blood vessels, increases the risk of many cancers, lung disease and stroke, and is associated with cognitive decline. Stopping at any age brings benefits, and some benefits begin soon after quitting. Support includes behavioural programmes, quitlines, nicotine-replacement products and prescription medicines where appropriate. Avoiding second-hand smoke is important too. The health effects of e-cigarettes and other nicotine products are still being studied.")),d("activity","Physical activity",c("Physical activity improves cardiovascular fitness, strength, balance, mood and sleep. It reduces the risk of several chronic conditions and supports independence. The WHO recommends aerobic and muscle-strengthening activity for adults, and multicomponent activity with balance training for older adults (Chapters 18 to 21). Some activity is better than none, and more is generally better up to a comfortable level.")),d("nutrition","Balanced nutrition",c("A varied eating pattern rich in vegetables, fruit, legumes, whole grains, nuts and fish, and low in ultra-processed foods, added salt and added sugar, supports healthy weight, blood pressure, blood sugar and gut health. Adequate protein and micronutrients matter for muscle and bone. Adapting the pattern to culture, budget and health needs keeps it sustainable (Chapters 8 and 13).")),d("sleep","Sleep",c("Regular sleep of seven or more hours supports memory, mood, immune function and cardiovascular health for most adults. Consistent timing, a suitable environment and treatment of conditions such as sleep apnoea are important (Chapter 31).")),d("social","Social connection",c("Relationships support health through emotional, practical and behavioural pathways. Regular contact, group membership and volunteering all help. Social connection is especially valuable during life changes such as bereavement or retirement (Chapters 34 and 36).")),d("preventive","Preventive healthcare",c("Regular check-ups, screening appropriate to age and risk, vaccination, sensory checks and medicine reviews enable early detection and treatment. Preventive care works best when it is personalised and discussed with a clinician (Chapter 37).")),d("risk-factors","Risk-factor management",c("Managing blood pressure, cholesterol, blood sugar, body weight, kidney health and sleep apnoea reduces cardiovascular and cognitive risk. Treatment decisions should be made with clinicians on the basis of individual risk assessment (Chapter 38).")),d("substances","Avoiding harmful substance use",c("Heavy alcohol use, misuse of prescription medicines, recreational drug use and combining substances increase the risks of falls, accidents, liver and heart disease, cognitive problems and mental-health difficulties. Follow national low-risk drinking guidance, use medicines as prescribed and seek help for substance-use problems. Support is available through health services and specialist organisations.")),d("consistency","Why consistent habits matter more than miracle products",c("Miracle products attract attention because they promise quick and dramatic results. Consistent habits, by contrast, accumulate benefits gradually and have much stronger evidence behind them. A combination of modest, sustainable actions across several domains is more reliable than any single intervention. Chapter 6 explains the warning signs of misleading claims."),W("lifestyle-framework"))),K(55,"Designing a Personal Longevity and Vitality Plan","A personal plan turns knowledge into action. It begins with what matters to you, identifies the functions you want to protect, selects a small number of habits, assesses the resources you have, and includes professional support and regular review. This chapter provides a framework for a plan that is realistic, flexible and focused on quality of life rather than on a single number.",["Define personal goals and functional priorities.","Select habits and assess resources realistically.","Establish progress measures and a review schedule."],["Goals based on values and function are more motivating and useful than goals based on appearance or lifespan alone.","Select one to three habits at a time, and build them gradually.","Assess time, money, transport, support, environment and healthcare access before committing.","Plan periodic reviews, and adjust when health or circumstances change."],["who-ageing","who-wrha","who-pa","nhs-sleep"],d("goals","Personal goals",c("Begin with what you value. Ask: What do I want to be able to do in the next year? Which relationships and roles matter most? What would make daily life feel better? Goals should be specific and personal, such as keeping up with grandchildren, walking to the local market or sleeping through most nights. Goals that describe a healthy life in general terms are harder to act on.")),d("functional","Functional priorities",c("Identify the everyday activities that matter most and rank them. These might include climbing stairs, carrying shopping, cooking, bathing, travelling, working, gardening or taking part in community life. Functional priorities guide the choice of exercise, nutrition and support, and they make it easier to notice change early.")),d("habit-selection","Habit selection",c("Choose one to three habits to start. Good starting habits are specific, linked to an existing routine and easy to repeat. For example, after breakfast, do a five-minute mobility routine; after the evening meal, take a ten-minute walk; on two days each week, practise a short set of chair rises. Add new habits only when the first ones feel automatic.")),d("resources","Resource assessment",c("Consider time, money, transport, social support, home environment, digital access, physical ability and healthcare access. Be honest about constraints, because a plan that ignores real constraints tends to fail. Look for free and low-cost community resources, and identify people who can help.")),d("professional-support","Professional support",c("Decide which professionals might help, such as a family doctor, pharmacist, dietitian, physiotherapist, occupational therapist, audiologist, optician, dentist, mental-health practitioner or social worker. Prepare for appointments with questions, a list of medicines and notes about your goals. The discussion questions in the Library can help you prepare.")),d("progress","Progress measures",c("Choose measures that reflect your goals. Behaviour measures, such as days of activity or nights of regular sleep, show whether habits are happening. Functional measures, such as the number of chair rises or the distance walked, show changes in capability. Wellbeing measures, such as mood or the number of social contacts, show how life feels. Use a few measures that you can record easily.")),d("review","Periodic review",c("Review habits monthly, function and wellbeing every three months, and the whole plan whenever health or circumstances change. Use the progress review worksheet to note what went well, what was hard and what to adjust. A review is not a test. It is an opportunity to refine the plan.")),d("flexibility","Flexibility and sustainability",c("Life is unpredictable. Plan a minimum version of your routine for difficult periods. Treat setbacks as information, and resume without self-criticism. Sustainable plans respect energy, enjoyment and relationships. The aim is a healthy life you can keep living, not a perfect schedule."),W("vitality-planning"),$(14,"The HERBULANCE physical activity guide helps readers turn movement goals into realistic weekly plans.")))],zy=[K(56,"Case Studies in Healthy Ageing","The case studies in this chapter are fictional and created for education. They illustrate how the principles in this book can be applied to people with different ages, cultures, abilities, living situations and resources. They are not patient testimonials, clinical evidence or predictions. Each case shows options, barriers and adaptations rather than a single correct answer.",["Apply healthy-ageing principles to diverse fictional situations.","Compare how barriers and resources shape practical options.","Reflect on how the same principle can be adapted in different settings."],["The fifteen case studies represent different countries, cultures, ages, abilities and financial circumstances.","Each case identifies the main challenge, relevant principles, practical options, barriers and adaptations.","The cases are fictional and must not be read as medical advice or clinical evidence.","The case comparison visual shows which healthy-ageing domains each case emphasises."],["who-ageing","who-csdh","who-ageism"],d("about-cases","About these case studies",c("Each case includes a background, a main challenge, the relevant educational principles, practical options, potential barriers, adaptations and lessons learned. The cases are fictional composites created for teaching. Names, places and details are illustrative. They do not describe real people, and they are not evidence of outcomes."),q("caution","Fictional and educational only","These cases are invented for teaching. Do not treat them as personal advice, clinical evidence or testimonials. Your own situation requires assessment by appropriate professionals.")),d("matrix","Case comparison",c("The matrix below shows which domains each case emphasises: nutrition, movement, sleep, social connection, preventive care and resources. Use it to see how different challenges share common foundations. Open the Case Studies page for the full details of each case."),W("case-comparison")),d("using","How to use the cases",Jl("Read the background and challenge before looking at the options.","Identify which principles from this book apply.","List the barriers you would expect in the same situation in your own community.","Propose two or three options, then consider adaptations that fit local resources.","Note the lessons that could apply to your own life or to someone you care for."))),K(57,"The Healthy-Ageing Food and Lifestyle Toolkit","This toolkit brings together practical resources from earlier chapters: a shopping guide, balanced meal templates, a protein-source comparison, a hydration tracker, a weekly activity planner, a sleep routine tracker, a social connection planner, a preventive-care checklist and a home-safety checklist. Use the interactive versions on the Toolkit and Tracker pages, or print the templates. Nothing here is a prescription.",["Apply the toolkit to plan food, movement and sleep routines.","Use checklists to prepare for preventive and home-safety conversations.","Adapt templates to personal and household needs."],["A shopping list that prioritises affordable whole foods reduces both cost and waste.","Plates and meal templates offer a flexible structure for balanced meals.","Hydration, activity, sleep and social planners make habits visible.","Checklists support preventive care and home-safety actions."],["who-diet","nhs-eatwell","harvard-plate","nhs-sleep","who-falls"],d("shopping","Practical shopping guide",c("A practical shopping list emphasises vegetables and fruit (fresh, frozen or tinned), legumes, wholegrain staples, eggs, fish or other protein foods, dairy or fortified alternatives, unsalted nuts and seeds, herbs and spices, and water as the main drink. Check labels for salt, sugar and portion sizes. The interactive shopping checklist on the Toolkit page can be used for planning."),W("shopping-checklist")),d("meal-templates","Balanced meal templates",c("Use these templates to build meals across cultures and budgets. Vegetables and fruit fill about half the plate, wholegrain foods about a quarter, and protein foods about a quarter. Include a small amount of unsaturated fat, and water to drink. Substitute ingredients to match your traditions and budget."),W("meal-templates")),d("protein-compare","Protein-source comparison",c("The table compares common protein sources by their typical role in meals. Values are indicative and vary by product, portion and preparation. Choose a variety of sources across the week, and seek professional advice for specific protein targets."),Pi("Common protein sources compared",["Source","Typical portion idea","Useful for","Considerations"],[["Eggs","Two eggs in an omelette or scrambled","Breakfast and quick meals","Cook thoroughly; guidance on eggs and cholesterol varies by person"],["Lentils and beans","A cup of cooked lentils or beans in soup or stew","Budget meals and fibre","Rinse tinned versions; increase fibre gradually to limit bloating"],["Tofu or tempeh","A palm-sized portion in a stir-fry","Plant-based meals","Choose calcium-set tofu for calcium; check labels for added salt"],["Fish, especially oily fish","A palm-sized portion, two or more times a week","Omega-3 fats and variety","Check local advice on fish choices; tinned fish is affordable"],["Poultry or lean meat","A palm-sized portion","Familiar family meals","Cook thoroughly; limit processed meats"],["Yoghurt, milk or fortified alternatives","A small pot or a glass","Breakfast, snacks and calcium","Check sugar in flavoured products; choose fortified alternatives"],["Nuts and seeds","A small handful","Snacks and toppings","Calorie-dense; choose unsalted; be careful with allergies (Book 09)"]])),d("hydration-tracker","Hydration tracker",c("Use the interactive hydration tracker on the Tracker page to log glasses each day. Choose a glass size and a personal goal with your clinician if you have a heart, kidney or liver condition or a fluid restriction. Visual cues, such as a filled bottle on the table, can help."),W("hydration-tracker")),d("weekly-planner","Weekly activity planner",c("Plan at least two strength sessions, several balance practices, regular aerobic activity and breaks from sitting across the week. Adjust the planner to your energy and to the weather. Print the blank planner and fill it in, or use the interactive movement planner worksheet."),W("weekly-planner")),d("sleep-routine","Sleep routine tracker",c("A sleep routine tracker records bedtime, wake time and how rested you felt across a week. Look for patterns, such as late caffeine, late screen use or irregular timing. The sleep reflection tool on the Tracker page offers private, on-screen reflection without saving your answers. Discuss persistent problems with a clinician."),W("sleep-tracker")),d("social-planner","Social connection planner",c("Plan contact with family, friends, community groups and digital networks each week. Aim for at least one meaningful contact each day and one shared activity each week, if that suits your life."),W("social-planner")),d("preventive-checklist","Preventive-care checklist",c("Use the checklist to prepare for a conversation with your clinician about screening, vaccination, sensory checks, medicine reviews and bone health. Bring the list to your appointment and add your own questions. Keep your health summary secure."),W("preventive-checklist")),d("home-safety","Home-safety checklist",c("Walk through your home room by room and tick the items you have checked. Prioritise changes that reduce falls and improve emergency response. Use the interactive version on the Toolkit page, and consider an occupational therapy assessment for complex needs."),W("home-safety-checklist"),$(7,"The HERBULANCE meal planning guide helps readers extend these templates into weekly menus and shopping plans."))),K(58,"The 30-Day Healthy Ageing and Lifelong Vitality Challenge","This flexible 30-day challenge introduces manageable habits across nutrition, movement, brain engagement, sleep, social connection and reflection. It is designed to be adapted to any ability and circumstance. It is not a medical treatment, it does not guarantee any measurable reduction in biological age, and it does not replace professional care. Choose the options that suit you, and rest whenever you need to.",["Practise one small healthy-ageing habit each day across several domains.","Adapt daily tasks to ability, schedule and circumstances.","Use reflection to notice what helps and what gets in the way."],["Each day offers a learning objective, a practical activity and options for movement, nutrition, brain engagement, sleep and social connection.","Easier, standard and stretch options allow everyone to take part at their own level.","Rest and recovery options are built in, and missing a day is not a failure.","Progress in the challenge tracker is stored only in this browser."],["who-pa","who-diet","nhs-sleep","who-loneliness"],d("how-to","How to use the challenge",c("Work through one day at a time. Read the learning objective, choose the options that suit you and tick the day when it is done. You can repeat a day, pause or complete two days together. The challenge can be done alone or with a friend or family member. Progress is stored only in this browser, and you can reset it at any time on the Tracker page."),q("safety","Check before starting new activity","If you have a medical condition, are recovering from illness or have concerns about an activity, speak to your clinician before starting. Stop any activity that causes chest pain, dizziness or unusual breathlessness, and seek help if these symptoms occur."),W("challenge-calendar")),d("structure","The 30-day structure",c("Each day in the challenge tracker lists its learning objective, activities and reflection prompt. Week one introduces simple habits. Week two builds movement and nutrition. Week three adds brain engagement and social practices. Week four consolidates the habits and plans ahead.")),d("adaptations","Adaptations for different abilities",c("Movement and brain activities include easier options, and most can be done seated or with support. People who are visually impaired can ask a helper to read tasks aloud or use audio alternatives. People living with dementia or other cognitive conditions may benefit from shorter tasks, reminders and a supporter who shares the activity. Adapt any task that causes pain or distress.")),d("rest","Rest and recovery options",c("Rest days are part of the challenge. On rest days, do the gentle recovery option or simply rest. Sleep, hydration and calm breathing all count as recovery. Your body adapts when it recovers, so rest is productive, not lazy.")),d("limits","What the challenge does not do",q("caution","No guaranteed outcomes","The challenge does not treat illness, slow ageing or reduce biological age. It offers practical habits that many people find useful. Any measurable change depends on many factors beyond the challenge, and it is not a substitute for medical care."))),K(59,"Building a Lifelong Healthy-Ageing Strategy","Knowledge becomes lasting value when it is built into a strategy that can adapt over decades. This chapter explains how to combine evidence-based habits into sustainable routines, maintain them through setbacks and changing health, seek support, reassess priorities and plan ahead, including for care and legal preferences.",["Combine knowledge into a sustainable, personal healthy-ageing strategy.","Use habit-maintenance techniques and manage setbacks constructively.","Plan for changing health, support needs and long-term priorities."],["Strategies work when they are simple, prioritised, reviewed and supported by people and services.","Habit cues, rewards and environmental design help maintain routines.","Setbacks are expected. Reflection and returning to a minimum routine help recovery.","Long-term planning includes financial, housing, care and legal preferences."],["who-ageing","who-wrha","who-dha","who-csdh"],d("combining","Combining knowledge into sustainable routines",c("A lifelong strategy combines the main domains of this book: nutrition, movement, sleep, mental wellbeing, social connection, preventive care and safe, accessible environments. Each domain can be simple and modest, but together they form a coherent pattern. Begin with the domains that matter most to you, and add others as capacity allows.")),d("habit-maintenance","Habit maintenance",c("Habits last when they are cued by a routine, easy to do, rewarding in some way and supported by the environment. Place walking shoes by the door, keep water visible, schedule social calls and store medicines in a consistent place. Track progress with a simple tool, and celebrate consistency rather than perfection. The habit-building cycle shows how cues, actions and reflection repeat."),W("habit-cycle")),d("setbacks","Managing setbacks",c("Illness, injury, grief, travel and busy periods all interrupt routines. Treat setbacks as information. Identify what happened, return to your minimum routine and make a small plan for the next day. Self-criticism tends to prolong setbacks, whereas self-compassion helps people restart.")),d("changing-health","Adapting to changing health circumstances",c("Health can change suddenly or gradually. Adapt your routine with a clinician or therapist, adjust intensity, change environments and ask for equipment or support. Review the plan after any diagnosis, hospital stay, fall, bereavement or change in medicines.")),d("support","Seeking support",c("Support may come from family, friends, peer groups, community organisations, primary care, allied health professionals and national services. Asking for support early is a sign of good judgement. Make a written list of the people and services you can call.")),d("reassessing","Reassessing priorities",c("Priorities change across life. Set a reminder to review your priorities each year and at major transitions. Ask what matters most now, what you want to keep doing and what you are ready to change. The progress review worksheet can help structure this reflection."),W("progress-review")),d("long-term","Long-term planning",c("Long-term planning includes financial security, housing suitable for changing needs, advance care planning, legal arrangements such as powers of attorney, and conversations with family about preferences. Plan while you are able to take part, and review the plan regularly. Seek independent advice from qualified professionals for financial, legal and care decisions."),$(13,"The HERBULANCE stress management guide helps readers explore how to manage the emotional side of planning for change and uncertainty."))),K(60,"Final Perspective: Ageing Well Is a Lifelong Practice","Ageing is a natural part of being human. It is not a problem to defeat, and it is not a number to achieve. Healthy ageing is the continuing practice of supporting health, dignity, independence, connection and meaning through every stage of life. This closing chapter summarises the most important principles in this book and offers a realistic and hopeful perspective.",["Summarise the principles that connect the chapters.","Explain why meaningful ageing is not defined by a number.","Reflect on personal next steps for lifelong vitality."],["Ageing is lifelong, varied and shaped by biology, environment, relationships and social conditions.","The strongest foundations are the evidence-based habits: not smoking, moving regularly, eating well, sleeping well, staying connected and using preventive care.","Claims of reversing ageing or guaranteeing a lifespan should be treated with scepticism.","Dignity, independence, relationships and quality of life define a life well lived."],["who-ageing","who-dha","who-wrha","who-ageism"],d("principles","The most important principles",Jl("Healthy ageing is about function, wellbeing and relationships as much as about the number of years lived.","Ageing is lifelong. It begins early and continues across the whole life course.","Most people benefit from regular movement that includes strength and balance work.","Good nutrition, adequate protein, hydration and attention to micronutrients support strength and resilience.","Sleep, mental engagement, emotional care and social connection protect both mind and body.","Prevention, timely assessment and open conversations with clinicians help catch problems early.","Supportive homes, communities and policies make healthy choices possible for everyone.","Evidence matters. Be sceptical of promises that sound too good to be true.")),d("realistic-optimism","Realistic optimism",c("Research has produced genuine reasons for hope. Many people age well, many conditions are preventable, treatable or manageable, and the knowledge needed for healthy living is more accessible than ever. At the same time, not every outcome is within personal control. Realistic optimism accepts uncertainty and focuses on what can be influenced.")),d("dignity","Dignity, independence and quality of life",c("Dignity is the foundation of a good later life. It is supported by respectful relationships, choices, privacy, meaningful activity and access to the help needed to live as one wishes. Independence is not measured only by doing everything alone. It is measured by the ability to make decisions and take part in life on one’s own terms.")),d("number","Meaningful ageing is not defined by a number",c("No single number, whether an age, a biological-age score, a step count or a life-expectancy figure, can capture a meaningful life. A person can live a shorter life full of love and purpose, or a longer life with limited function and joy. The goal is not to win an argument with time. It is to live each stage well."),q("reflect","A closing reflection","What one value do you most want to protect in the years ahead? Which one small habit would support it this month? Write it down, and share it with someone who matters to you.")),d("closing","A HERBULANCE message",c("HERBULANCE exists to make reliable health, food and everyday-wellness education understandable, practical and accessible. Ageing is a natural part of being human. The goal is not to fight time, but to support health, dignity, independence, connection, adaptability and meaningful living throughout it."),c("Learn what the evidence supports. Prepare small routines that fit your life. Thrive by valuing the people, places and purposes that make life worth living at every age."),W("lifelong-vitality"),$(14,"The HERBULANCE physical activity guide offers a practical next step for turning these principles into daily movement.")))],$n=[{n:1,title:"Understanding Ageing and Longevity",from:1,to:6,intro:"Before deciding what to do, it helps to understand what ageing is, what it is not, and how to separate reliable evidence from hopeful marketing. Part I introduces the key terms, the biology of ageing, the hallmarks studied by researchers, the role of genetics, and the myths that most often mislead readers."},{n:2,title:"Nutrition, Metabolism and Healthy Eating Through Life",from:7,to:15,intro:"Food is one of the most practical levers people have, yet nutritional needs change with age and with circumstances. Part II explains how needs shift, how to build meals that are nutrient-dense and affordable, why protein matters for muscle, which micronutrients deserve attention, and how to think critically about supplements."},{n:3,title:"Physical Vitality, Muscle and Mobility",from:16,to:23,intro:"Movement supports the heart, bones, muscles, joints and balance that together make independent living possible. Part III describes age-related physical changes, explains sarcopenia and strength training, and shows how to build cardiovascular fitness, balance, mobility and recovery into everyday life, adapted to each person’s ability."},{n:4,title:"Brain Health, Memory and Cognitive Ageing",from:24,to:30,intro:"Many people worry about their memory as they age. Part IV distinguishes normal changes from conditions that need assessment, explains what is known about brain health and neuroplasticity, describes dementia respectfully and accurately, and shows how learning, technology and social engagement fit into a realistic approach to cognitive wellbeing."},{n:5,title:"Sleep, Emotional Health and Social Connection",from:31,to:36,intro:"Sleep, emotions, relationships and a sense of purpose shape how people experience later life. Part V explores how sleep and circadian rhythms change, how stress and mood work, how loneliness affects health, and how people can manage the major transitions that come with retirement, relocation, bereavement and caregiving."},{n:6,title:"Prevention, Health Monitoring and Daily Wellness",from:37,to:44,intro:"Prevention works best when it is planned, personal and shared with a healthcare team. Part VI covers screening principles, blood pressure, blood sugar and cardiovascular risk, sensory health, medicines, skin, immunity and chronic conditions, and ends with a practical method for building a personal healthy-ageing routine."},{n:7,title:"Ageing in Real Life: Inclusion, Independence and Care",from:45,to:50,intro:"Healthy ageing is lived in homes, families, communities and countries that differ enormously. Part VII considers the needs of different generations, disability and accessibility, caregiving and dignity, home safety, and the financial, environmental and social conditions that shape health far beyond individual choices."},{n:8,title:"Longevity Science, Practical Application and Future Health",from:51,to:60,intro:"Longevity is a fast-moving research field with real discoveries and many exaggerated claims. Part VIII explains how to read longevity research, why biological-age tests are limited, what emerging treatments can and cannot yet show, which habits have the strongest foundations, and how to turn knowledge into a personal plan, toolkit and lifelong practice."}],Jm={2:"Gut Health & Digestion Guide",5:"The Complete Food Safety & Kitchen Hygiene Guide",7:"The Complete Guide to Meal Planning, Balanced Nutrition & Everyday Food Preparation",9:"The Complete Guide to Food Allergies, Intolerances & Special Dietary Needs",10:"The Complete Guide to Food Nutrition, Vitamins, Minerals & Essential Nutrients",11:"The Complete Guide to Healthy Weight Management, Metabolism & Sustainable Lifestyle Habits",12:"The Complete Guide to Sleep, Circadian Rhythm & Natural Restorative Living",13:"The Complete Guide to Stress Management, Emotional Wellbeing & Mind-Body Balance",14:"The Complete Guide to Physical Activity, Movement, Exercise & Lifelong Fitness"},By={MC:"Multiple choice",TF:"True or false",SC:"Scenario",PD:"Practical decision",MF:"Myth or fact"},Ra=["True","False"],za=["Myth","Fact"],Oy=[[1,"MC","Which definition best describes healthspan?",["The total number of years a person lives","The years lived in good health, free from major disability","The average life expectancy in a country","The age at which a person retires"],1,"Healthspan refers to years lived in good health. Lifespan is the total number of years lived, and life expectancy is a population average."],[1,"TF","Healthy ageing means having no long-term health conditions.",Ra,1,"Healthy ageing focuses on maintaining function, wellbeing and independence. Many people live well with long-term conditions."],[1,"MF","Quality of life can only be judged by doctors.",za,0,"Quality of life is best understood through the person’s own experience of their life, which is why it is usually asked directly."],[2,"MC","What does reserve capacity mean in the body?",["The ability to store fat for later use","A safety margin that helps the body cope with stress or illness","The number of spare cells in the bone marrow","The amount of protein stored in muscle"],1,"Reserve capacity is the margin that organs and systems have beyond what they need at rest. It tends to decline with age."],[3,"MF","All twelve hallmarks of ageing have been proven to be targets for treatment in humans.",za,0,"The hallmarks are a research framework. Most evidence comes from cells and animals, and none has been proven as a human anti-ageing treatment target."],[4,"SC","A relative developed heart disease at a young age. What is the most useful next step for your own preventive planning?",["Assume you will develop it too and stop screening","Share the family history with your primary-care clinician to discuss screening","Use a direct-to-consumer genetic test and act on its result alone","Ignore it, because genes are fixed"],1,"Family history helps clinicians tailor screening. A genetic risk estimate does not give certainty, and lifestyle and healthcare can change the balance of risk."],[5,"MC","Why should a life expectancy figure not be used as a personal prediction?",["It is always inaccurate","It is a population average and cannot predict any individual’s lifespan","It only applies to men","It is calculated only from healthy people"],1,"Life expectancy summarises death rates across a population. Individuals vary widely, so the average cannot predict one person’s future."],[6,"MF","Biological-age tests from different providers always give the same reliable result.",za,0,"Biological-age tests differ in method, validation and interpretation, so results can vary between providers and are not standardised."],[6,"SC","A social media post promises a supplement will “reverse ageing” and says doctors are hiding it. What is the best response?",["Buy the supplement immediately","Treat it as a red flag and check the evidence with a clinician or a reliable source","Share it with friends so they can benefit","Stop prescribed medicines to try it"],1,"Guaranteed results, claims of hidden knowledge and urgency to buy are common warning signs of misleading marketing."],[7,"MC","Which statement about energy needs in later life is most accurate?",["Energy needs always rise with age","Energy needs often fall with reduced activity, while nutrient needs stay important","Energy needs are identical at every age","Energy needs depend only on sex"],1,"Energy needs often fall with lower activity and lean mass, but nutrient needs remain high relative to energy, so nutrient density matters."],[7,"TF","Protein needs per kilogram of body weight may be higher in later life for some healthy older adults.",Ra,0,"Guidance such as ESPEN’s suggests about 1.0 to 1.2 g per kg per day for healthy older adults, with individual adjustment by clinicians."],[8,"MC","The WHO recommends at least how much fruit and vegetables per day, excluding potatoes and other starchy roots?",["100 g","250 g","400 g","1 kg"],2,"The WHO recommends at least 400 g of fruit and vegetables per day, excluding potatoes, sweet potatoes, cassava and other starchy roots."],[9,"SC","An older adult eats little protein at breakfast and lunch and a large portion at dinner. What is a practical adjustment?",["Stop eating protein at dinner","Spread moderate protein portions across meals","Use protein supplements only","Eat protein only at weekends"],1,"Spreading moderate protein portions across meals is a practical strategy supported by research on muscle protein synthesis."],[10,"MC","Which group should be especially considered for vitamin B12 status?",["Young children only","People following vegan diets without fortified foods, and older adults with reduced absorption","People who exercise daily","People who drink plenty of water"],1,"Diets without animal foods or fortified products can be low in B12, and absorption of food-bound B12 can decline with age."],[10,"TF","High-dose iron supplements are always safe, because iron is an essential mineral.",Ra,1,"Iron is essential, but excess iron can be harmful. Supplements should be taken only after a need has been confirmed by testing."],[11,"MC","Which cells break down old bone during remodelling?",["Osteoblasts","Osteoclasts","Chondrocytes","Adipocytes"],1,"Osteoclasts resorb old bone, and osteoblasts then form new bone. Remodelling is a continuous, balanced cycle that shifts with age."],[12,"SC","A person living alone is less thirsty than before, has dark urine and feels dizzy on standing. What is the most appropriate response?",["Wait for thirst to return","Increase fluids gradually and seek advice promptly, especially if symptoms persist or confusion develops","Drink large amounts of energy drinks","Stop all medicines"],1,"Dehydration can develop gradually in later life. Persistent symptoms or confusion need prompt assessment, and fluid targets should follow clinical advice."],[12,"MC","Which symptom suggests swallowing difficulty that needs professional assessment?",["Occasional forgetfulness","Coughing or choking when eating or drinking","Feeling thirsty in hot weather","Mild stiffness after sitting"],1,"Coughing or choking with food or drink, or a wet voice after swallowing, can indicate dysphagia and requires assessment."],[13,"MC","Which statement about the MIND diet trial is most accurate?",["It proved the diet prevents dementia","It found no significant difference in cognitive change over three years compared with a control diet","It showed large benefits in all participants","It was an animal study"],1,"The 2023 randomised trial did not show a significant difference in cognitive change, although both groups improved. The evidence remains promising but inconclusive."],[14,"MC","What maximum refrigerator temperature do many national food-safety guidelines recommend?",["10 °C","5 °C","15 °C","20 °C"],1,"Many national guidelines recommend 5 °C (41 °F) or below. Follow your local food-safety guidance."],[14,"PD","You have leftover soup. What is the best practice?",["Leave it on the stove overnight","Cool it promptly, refrigerate it covered, and reheat until steaming hot","Refreeze it without cooling","Reheat it once and serve it lukewarm"],1,"Prompt cooling, covered refrigeration and thorough reheating reduce the risk of foodborne illness."],[15,"MC","Which supplements have trial and meta-analysis evidence suggesting they did not extend survival and may increase mortality in some analyses?",["Dietary fibre","Beta-carotene, vitamin A and vitamin E supplements","Whole-food vegetables","Lentils"],1,"A 2007 JAMA meta-analysis found no survival benefit from several antioxidant supplements and possible harm in some analyses. Whole foods are different."],[15,"TF","Herbal products labelled “natural” are always safe to take with prescribed medicines.",Ra,1,"Herbal products can have strong pharmacological effects and interact with medicines. Always tell your clinician and pharmacist."],[16,"MC","Compared with muscle size, muscle strength in later life tends to…",["Decline more slowly","Decline at about the same rate","Decline faster","Never decline"],2,"Strength often declines faster than muscle size because it also depends on nerve activation and muscle quality."],[17,"SC","A person has low grip strength and struggles to rise from a chair. What is the best next step?",["Assume it is normal and do nothing","Seek clinical assessment for possible sarcopenia and begin supervised resistance training","Start high-dose protein powders","Take a muscle-building steroid"],1,"Low strength can signal sarcopenia. Assessment, resistance training, adequate nutrition and checks for other causes are the core approach."],[18,"MC","What does the talk test help you judge?",["Blood pressure","Exercise intensity","Blood sugar","Cholesterol level"],1,"The talk test is a simple guide: moderate activity allows conversation, while vigorous activity makes it difficult."],[18,"TF","Long periods of sitting are not a concern if a person is physically active.",Ra,1,"Activity attenuates the association between sitting and mortality, but it does not remove the value of breaking up long periods of sitting."],[19,"MC","How often does the WHO recommend muscle-strengthening activity for older adults?",["Once a year","At least twice a week","Every day without rest","Only when in pain"],1,"The WHO recommends muscle-strengthening activities on at least two days per week for older adults."],[20,"SC","An older adult falls, hits their head while taking blood thinners and feels drowsy afterwards. What should they do?",["Rest and see if it passes","Seek urgent medical assessment or call the local emergency number","Take extra painkillers and go to bed","Wait until the next day"],1,"A head injury in someone taking blood thinners needs urgent assessment, even if they feel reasonably well."],[20,"MC","Which is NOT one of the main systems that contribute to balance?",["Vision","Vestibular system","Proprioception","Digestive enzymes"],3,"Balance depends on vision, the vestibular system, proprioception and brain coordination of muscle responses."],[21,"TF","Osteoarthritis is an inevitable result of ageing.",Ra,1,"Osteoarthritis is common in later life but is a condition with specific causes and treatments, not an unavoidable outcome of ageing."],[22,"MC","Which everyday activity can contribute to both strength and aerobic activity?",["Sitting in front of a screen","Gardening or carrying shopping","Lying down all day","Reading alone"],1,"Gardening and carrying loads involve walking, bending, lifting and sustained effort, so they contribute to fitness."],[23,"MF","Feeling sore after new exercise always means you should stop.",za,0,"Mild soreness is common after new activity. Sharp pain, swelling or symptoms that persist or worsen need assessment."],[24,"MC","Which brain region is central to forming new memories?",["Cerebellum","Hippocampus","Occipital lobe","Spinal cord"],1,"The hippocampus, within the temporal lobe, plays a central role in forming new memories."],[24,"TF","Significant memory loss that disrupts daily life is a normal part of ageing.",Ra,1,"Mild changes in recall can be normal, but memory loss that disrupts daily life is not normal ageing and needs assessment."],[25,"MC","Which learning strategy is particularly effective for long-term retention?",["Cramming the night before","Spaced retrieval practice","Rereading the same page repeatedly","Avoiding any testing"],1,"Spaced practice and self-testing strengthen retention more reliably than cramming or passive rereading."],[25,"MC","Which phase of memory involves paying attention to and connecting new information?",["Encoding","Retrieval only","Forgetting","Sleeping"],0,"Encoding is the first stage of memory. Attention and meaningful connections make encoding more effective."],[26,"MC","Which statement about commercial brain-training games is most accurate?",["They reliably prevent dementia","They have limited evidence of benefits beyond the trained tasks","They replace the need for physical activity","They are fully regulated medical treatments"],1,"Systematic reviews have found that gains from brain-training products usually apply to the trained tasks rather than to broad cognition."],[26,"SC","A friend says a brain-training app will stop memory loss. What is the best response?",["Agree and pay for a lifetime subscription","Explain that the evidence is limited and suggest enjoyable activities alongside healthy lifestyle habits","Encourage them to skip sleep to play more","Suggest the app replaces medical assessment"],1,"Enjoyable mental activity is sensible, but claims of prevention are not established. Broader lifestyle factors have stronger evidence."],[27,"MC","Which is the most common cause of dementia?",["Stroke","Alzheimer’s disease","Head injury","Normal ageing"],1,"Alzheimer’s disease is the most common cause of dementia. Dementia is a syndrome with several possible causes."],[27,"PD","Your parent suddenly becomes confused and drowsy. What should you do?",["Wait a few days to see","Seek urgent medical assessment, because sudden confusion can have treatable causes","Assume dementia has progressed and do nothing","Give extra sedating medicines"],1,"Sudden confusion can be caused by infection, medicines, dehydration or other treatable conditions, so it requires prompt assessment."],[27,"MF","Dementia is a normal part of getting older.",za,0,"Dementia is not a normal part of ageing. Risk increases with age, but dementia itself is a syndrome that requires clinical assessment."],[27,"MC","What does the 2024 Lancet Commission’s “nearly half” figure refer to?",["Half of all people over 65 will develop dementia","The estimated share of cases that could, in theory, be prevented or delayed by addressing 14 modifiable risk factors","Half of dementia drugs are effective","Half of older adults have mild cognitive impairment"],1,"The estimate is a population-level proportion that could in theory be prevented or delayed. It does not guarantee protection for any individual."],[28,"TF","The ACHIEVE hearing trial showed a clear, statistically significant benefit across the full study population.",Ra,1,"No significant difference was found across the full population. A pre-specified analysis of the higher-risk subgroup showed slower decline, which needs confirmation."],[28,"MC","Which factor is included in the Lancet Commission’s list of modifiable dementia risk factors?",["Blue eye colour","Hearing loss","Being tall","Having a sibling"],1,"Hearing loss is among the 14 potentially modifiable risk factors identified by the 2024 Lancet Commission."],[29,"MC","Which lifelong learning activity has supportive evidence for wellbeing?",["Reading and creative arts","Only puzzle apps","Staying indoors all the time","Avoiding other people"],0,"Reading and creative arts are associated with wellbeing and engagement, though evidence for specific cognitive gains is mixed."],[30,"SC","You receive an urgent message asking for your banking password. What should you do?",["Reply with the password","Do not share it, and contact the organisation using a number you know to be correct","Forward it to family","Click the link immediately"],1,"Legitimate organisations do not ask for passwords by unexpected message. Verify through a trusted channel."],[30,"MF","Health information found online is trustworthy if it looks professional.",za,0,"Professional design does not guarantee accuracy. Check authorship, sources, dates and whether the content is trying to sell something."],[31,"MC","How many hours of sleep do adults generally need, according to a consensus statement?",["Five or fewer","Seven or more","Exactly eight","Ten or more"],1,"A joint consensus statement recommends seven or more hours per night for adults on a regular basis, with individual variation."],[31,"MC","Which change is common in later life?",["An advanced sleep phase, with earlier sleep and wake times","A doubling of sleep need","Permanent loss of all sleep stages","No change in circadian rhythm"],0,"Circadian timing often shifts earlier with ag
