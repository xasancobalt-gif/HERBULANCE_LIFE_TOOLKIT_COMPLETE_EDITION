th lactose intolerance. Ramadan fasting while taking medicines or managing diabetes needs advice from a clinician before starting."),$(9,"The HERBULANCE Food Allergies, Intolerances & Special Dietary Needs guide helps readers explore safe substitutions and label reading for medically necessary dietary changes."))),K(15,"Supplements, Functional Foods and Longevity Claims","Supplements are a large global market, yet their benefits vary enormously. Some people need particular supplements to correct a deficiency or to meet a medical need. Many others take products with little or no evidence. This chapter explains how supplements are regulated, how evidence is graded, what research shows for common products, and why more is not automatically better.",["Explain how supplement regulation differs between regions.","Apply an evidence hierarchy to supplement and functional-food claims.","Recognise potential interactions and adverse effects of common supplements."],["Supplement rules differ: products may be regulated as foods or as medicines, and claims are controlled differently in each jurisdiction.","Evidence ranges from high-quality trials to anecdote and marketing. Most supplements have limited evidence for healthy ageing.","Antioxidant supplements have not reliably improved survival, and some high-dose products have been linked to harm.","Supplements can interact with prescribed medicines. Always tell your clinician and pharmacist."],["bjelakovic-2007","cochrane-antiox","fda-supp","eu-supp","eu-claims","nih-omega3","who-trad"],d("regulation","Supplement regulation differences between countries",c("Regulation varies greatly. In the United States, dietary supplements are regulated as a category of food. Manufacturers are generally not required to prove efficacy before marketing, although the Food and Drug Administration (FDA) can act against unsafe products and misleading claims. In the European Union, food supplements are governed by Directive 2002/46/EC, and nutrition and health claims must be authorised under Regulation (EC) No 1924/2006. In Australia, complementary medicines are regulated by the Therapeutic Goods Administration. Other countries use other systems. Regulation does not guarantee effectiveness."),c("Quality also varies. Some markets have independent testing schemes, but labels do not always match contents. Products bought from unfamiliar online sellers or informal markets are more likely to be unreliable.")),d("evidence-grading","Evidence grading",c("A simple way to judge a supplement claim is to ask what kind of evidence supports it. Systematic reviews and meta-analyses of randomised controlled trials give the strongest evidence of benefit or harm. Single trials, observational cohort studies, case reports, animal studies and laboratory work provide weaker support. Testimonials and marketing materials provide no reliable evidence. Figure 13 shows this hierarchy visually."),W("supplement-evidence")),d("vitamins-minerals","Vitamin and mineral supplementation",c("Supplements can correct a proven deficiency, reduce risk in specific groups, or be prescribed for a medical reason. Examples include vitamin D for people who are rarely outdoors, and folic acid before and during early pregnancy. General multivitamins have shown little or no benefit for preventing major cardiovascular disease or cancer in healthy adults in many reviews. Higher doses of some vitamins and minerals can cause harm, which is why upper intake limits exist.")),d("herbal","Herbal products",c("Herbal products vary widely in plant species, plant part, dose, extraction method and contamination. Some herbs have pharmacological effects strong enough to cause harm. St John’s wort, for example, can reduce the effectiveness of many medicines, including some anticoagulants, antidepressants and contraceptives. Ginkgo and garlic supplements can increase bleeding risk in people taking anticoagulant or antiplatelet medicines. The WHO recognises the importance of traditional medicine in many communities, but the presence of a tradition does not establish safety or effectiveness."),q("caution","Herbal products are still medicines","“Natural” does not mean risk-free. Tell your clinician and pharmacist about any herbal product before starting it, before surgery and before changing a prescribed medicine.")),d("omega-3","Omega-3 products",c("Omega-3 fatty acids, including EPA and DHA from marine sources and ALA from plants, are important nutrients. Eating fish, particularly oily fish, provides EPA and DHA. Evidence that omega-3 supplements reduce cardiovascular events in general populations is mixed, although some specific prescription products have shown benefit in trials of particular high-risk groups. High doses may increase the risk of bleeding and may interact with blood-thinning medicines. Product quality varies.")),d("collagen","Collagen claims",c("Collagen supplements are widely marketed for skin, joints and hair. Collagen is a protein, and digestion breaks it into amino acids and peptides. Some small trials have reported improvements in skin hydration or joint discomfort, but many studies are small, short or industry-funded, and results are not consistent. Collagen should not be considered a substitute for adequate dietary protein, and claims that it reverses ageing lack support."),q("caution","Reading supplement studies","Industry funding does not automatically invalidate a study. However, check for independent replication, control groups, meaningful outcome measures and the size of any effect.")),d("antioxidants","Antioxidant supplements",c("For decades, the idea that antioxidant vitamins slow ageing by neutralising free radicals was popular. Large randomised trials and systematic reviews have not supported it. A 2007 systematic review and meta-analysis in JAMA concluded that beta-carotene, vitamin A and vitamin E supplements did not reduce mortality in the studied populations and may increase it in some analyses. A 2012 Cochrane review reached similar conclusions for antioxidant supplements more broadly. Antioxidant-rich foods such as fruit and vegetables are different, because they also provide fibre and many other nutrients.")),d("interactions","Interactions and adverse effects",c("Supplements can interact with prescribed and over-the-counter medicines. Calcium and iron can reduce the absorption of some antibiotics and thyroid medicines when taken together. Vitamin K affects the action of the anticoagulant warfarin. Potassium can interact with some blood-pressure medicines and with kidney disease. Supplements can also cause stomach upset, constipation, diarrhoea or allergic reactions. Bring all products to medical appointments and ask when to take each one.")),d("more-not-better","Why more supplementation is not automatically better",c("Higher doses can be harmful. Vitamin A, iron, selenium and vitamin B6, for example, can cause toxicity at high doses. A varied diet rarely causes excess, whereas high-dose supplements can. Taking several products that each contain the same nutrient may add up unexpectedly. Choose evidence-based products when a need is established, check label doses and seek advice before starting several supplements at once."),$(10,"The HERBULANCE nutrition guide helps readers explore nutrient functions, food sources and safe intake ranges, which supports critical evaluation of supplement labels.")))],jy=[K(16,"Understanding Age-Related Physical Changes","Physical changes with age affect muscle, bone, joints, the heart and circulation, balance, and flexibility. Some changes are common and gradual; others are signs of disease that deserve assessment. This chapter describes typical patterns, the wide differences between individuals and the modifiable factors that shape how people move through later life.",["Describe common age-related changes in muscle, bone, joints, cardiovascular function, balance and flexibility.","Distinguish typical change from changes that require medical attention.","Identify modifiable factors that influence physical function."],["Muscle strength tends to decline faster than muscle size, and strength can be improved at almost any age.","Joint symptoms are common, but osteoarthritis and other joint conditions are not an inevitable result of ageing.","Maximum heart rate typically falls with age, but cardiovascular fitness responds well to training.","Balance depends on vision, inner-ear function, sensation in the feet and joints, and brain coordination. Each can be trained or treated."],["who-ageing","who-pa","acsm-2009","ekelund-2016"],d("muscle-strength","Muscle mass and strength",c("Skeletal muscle mass tends to decline gradually from middle age, and the rate can increase in later life. Strength often declines faster than mass, because strength also depends on the nervous system’s ability to activate muscle fibres quickly and on the quality of muscle tissue. Fat can accumulate within and between muscles. These changes are linked to slower walking, difficulty rising from a chair and a higher risk of falls. Resistance training can increase strength and muscle size in older adults, including people in their eighties and beyond, although individual responses vary.")),d("bone-joints","Bone density and joint changes",c("Bone density changes are discussed in Chapter 11. Joints are lined with cartilage, cushioned by synovial fluid and held together by ligaments and surrounding muscles. With age, cartilage can thin and joints may become stiffer. Osteoarthritis is common in later life, particularly in the knees, hips and hands. It is a condition with specific causes and treatments rather than an unavoidable outcome of ageing. Many people with joint changes have little pain, while others have significant pain. Movement, weight management, strength training and sometimes medical treatment can help.")),d("cardiovascular","Cardiovascular adaptations",c("The heart and blood vessels adapt to ageing. Arteries can become stiffer, maximum heart rate tends to fall, and the heart’s response to exercise may be slower. A common formula, 220 minus age, estimates maximum heart rate, but it is imprecise and should not be used as a fixed target. The most important factor for cardiovascular fitness is regular aerobic activity. Trained older adults often have considerably higher fitness than untrained peers of the same age. Blood pressure should be checked regularly, because high blood pressure accelerates vascular ageing.")),d("balance","Balance and coordination",c("Balance depends on information from the eyes, the inner-ear balance organs (the vestibular system) and sensors in the joints and skin of the feet and legs, known as proprioception. The brain integrates these signals and coordinates muscle responses. With ageing, each system can change, and reaction times may slow. Medicines, dizziness, low blood pressure on standing and nerve damage, for example from diabetes, can also affect balance. Balance is trainable and is a central target of fall-prevention exercise (Chapter 20).")),d("flexibility-mobility","Flexibility and mobility",c("Flexibility describes the length and extensibility of muscles and connective tissue. Mobility describes the ability to move joints through a functional range with strength and control. Both can decline with inactivity. Regular, gentle movement helps maintain a comfortable range of motion (Chapter 21).")),d("individual-modifiable","Individual differences and preventable risk factors",c("Physical ageing varies widely. Genetics, previous injuries, occupations, illnesses and social environments all matter. Several important factors are modifiable, including physical inactivity, smoking, excess alcohol, poor sleep, untreated sensory loss, inadequate nutrition and some medicines. Addressing these factors can improve physical function at any age."),q("caution","Not every change is normal","Sudden weakness, numbness on one side, severe dizziness, chest pain, new breathlessness with minimal effort or a sudden change in walking needs urgent assessment. Gradual changes that affect daily life also deserve a professional review."),$(14,"The HERBULANCE physical activity guide helps readers explore strength, cardiovascular fitness and mobility training, which address many of the changes discussed here."))),K(17,"Sarcopenia and Muscle Preservation","Sarcopenia describes age-related loss of muscle strength, quantity or quality, and it is linked to falls, disability and loss of independence. It is a recognised condition with defined assessment steps, and it responds to exercise and good nutrition. This chapter explains how sarcopenia is defined, why strength matters as much as size, and how muscle can be preserved.",["Explain the definition and assessment steps for sarcopenia.","Describe why muscle strength and muscle quality matter as well as muscle size.","Plan practical strategies for muscle preservation and know when clinical evaluation is needed."],["Sarcopenia is assessed using strength, muscle quantity or quality, and physical performance.","Low grip strength or a slow five-times sit-to-stand test can signal a need for assessment.","Resistance exercise, adequate protein and energy, and treatment of contributing conditions form the core of management.","Unexplained muscle loss needs medical evaluation to rule out other causes."],["ewgsop2","morton-2018","protage","acsm-2009","espen-geri"],d("definition","Definition of sarcopenia",c("Sarcopenia was first described as an age-related loss of muscle mass. The current European consensus, published by the European Working Group on Sarcopenia in Older People in 2019 (EWGSOP2), defines it using muscle strength first. Low muscle strength suggests probable sarcopenia. Confirmation requires low muscle quantity or quality. Physical performance is then assessed, and low performance indicates severe sarcopenia. This approach shifts attention from size alone to what muscle can actually do."),W("sarcopenia")),d("strength-vs-size","Muscle strength versus muscle size",c("Strength depends on muscle size, but also on neural activation, fibre type, tendon stiffness and muscle quality, including the amount of fat within the muscle. This is why two people with similar muscle size can have very different strength. Strength predicts mobility and falls risk well, and it can improve early in a training programme, before large changes in muscle size are visible. Gripping a dynamometer or timing repeated chair rises gives practical information that can be repeated over time."),W("muscle-ageing")),d("contributors","Contributing factors",c("Muscle loss is multifactorial. Physical inactivity is a major contributor. Low protein and energy intake, chronic inflammation, hormonal change, certain chronic diseases such as heart failure, kidney disease, chronic obstructive pulmonary disease and cancer, depression, poor sleep, some medicines and periods of hospitalisation can all contribute. Muscle loss can therefore be a warning sign of another condition that needs attention.")),d("resistance-training","Resistance training",c("Resistance training is the most effective single approach for preserving and building muscle in older adults. The WHO recommends muscle-strengthening activities on at least two days per week for older adults. Good programmes train all major muscle groups, including the legs, hips, back, chest, shoulders and arms. Loads should feel challenging but allow good technique. Progressive overload, in which the difficulty is gradually increased, is the key principle.")),d("nutrition-muscle","Nutrition for muscle",c("Adequate energy and protein support the response to training. Older adults may benefit from attention to protein distribution across meals (Chapter 9). Where vitamin D status is low, it should be addressed through appropriate assessment and supplementation (Chapter 10). Weight loss through energy restriction without adequate protein can accelerate muscle loss, so any change in eating should be planned carefully. People with both obesity and low muscle strength need specialist guidance.")),d("functional-assessment","Functional assessment",c("Clinicians assess sarcopenia with tests of strength and performance. Common measures include handgrip strength, the five-times sit-to-stand test, gait speed over a short walk and the Short Physical Performance Battery. Imaging such as DXA or CT, and bioimpedance devices, can estimate muscle quantity but are less accessible. Home tracking can be useful when people use consistent methods, but home measurements are for monitoring and should not replace clinical assessment.")),d("clinical-boundaries","Clinical evaluation and treatment boundaries",c("Sarcopenia is recognised as a condition, but no medicine is currently licensed specifically for it in most countries. Management focuses on exercise, nutrition and treatment of underlying conditions. Unexplained or rapid muscle loss, unintended weight loss, night sweats, persistent fatigue or new weakness should prompt medical evaluation, because some causes, including thyroid disease, hormone disorders and cancer, need specific treatment. Do not start protein or hormone-based products to treat muscle loss without professional advice."),$(14,"The HERBULANCE physical activity guide helps readers explore resistance training options, progression and safe technique."))),K(18,"Cardiovascular Fitness Throughout Life","The heart, blood vessels and lungs deliver oxygen and nutrients to every tissue. Cardiovascular fitness reflects how well this system responds to activity, and it is strongly associated with long-term health in population research. It can be improved at almost any age through regular, appropriate aerobic activity.",["Explain the principles of aerobic exercise and how intensity can be judged.","Describe the benefits and adaptations of walking, cycling, swimming and other aerobic activities.","Recognise cardiovascular warning signs that require immediate medical attention."],["The WHO recommends, for adults aged 65 and over, 150 to 300 minutes of moderate aerobic activity or 75 to 150 minutes of vigorous activity each week, plus strength and balance work.","The talk test helps judge intensity without equipment.","Long periods of sitting are associated with worse health outcomes, and breaking them up helps.","Chest pain, fainting or severe breathlessness requires urgent help."],["who-pa","ekelund-2016","acsm-2009","uk-cmo-pa","us-pa","nhs-stroke","nia-exercise"],d("heart-circulation","Heart and circulation",c("The heart pumps blood through arteries, capillaries and veins. Aerobic exercise increases the heart’s output, improves blood-vessel function, supports healthy blood pressure and blood sugar, and makes breathing more efficient. Over time, trained muscles and hearts adapt. These changes reduce the effort needed for daily tasks, which is one reason aerobic fitness is so important for independence.")),d("aerobic-activity","Aerobic activity and intensity",c("Moderate-intensity activity makes you breathe harder and feel warmer, but you can still talk comfortably. This is the basis of the talk test. Vigorous activity makes talking difficult, leaving only a few words before the next breath. The WHO recommends that adults aged 65 and over aim for 150 to 300 minutes of moderate aerobic activity, or 75 to 150 minutes of vigorous activity, each week, or an equivalent mix. Activity can be spread across the week and across the day in shorter sessions."),W("cardio-principles")),d("walking-cycling-swimming","Walking, cycling and swimming",c("Walking is the most accessible aerobic activity for many people. It needs little equipment beyond supportive footwear and can be done alone or with others. Cycling, on a stationary bike or outdoors where safe, is low-impact and builds leg strength. Swimming and water-based exercise reduce the load on joints and suit people with arthritis or limited weight-bearing, provided pool access and water safety are considered. Dancing, rowing machines and cross-trainers offer further options.")),d("progression","Fitness progression",c("Start at a level that feels comfortable and increase gradually, perhaps by adding a few minutes or a little more effort each week until the target is reached. Warm up and cool down, and keep a simple record of how you feel. A lighter session may be needed after a demanding week. Progress should feel challenging but sustainable. Sharp pain, unusual breathlessness or dizziness means you should stop and seek advice.")),d("sedentary","Sedentary behaviour",c("Sedentary behaviour means sitting or lying down with low energy expenditure, such as sitting at a desk, watching television or travelling by car. In observational studies, prolonged sedentary time is associated with higher risks of cardiometabolic disease and early death. A large meta-analysis published in The Lancet found that higher sitting time was associated with higher mortality, but that the association was substantially weaker among people who were physically active. Breaking up long periods of sitting with light movement is a practical strategy.")),d("warning-signs","Cardiovascular warning signs",c("Some symptoms require urgent attention. These include chest pain, pressure or tightness, pain spreading to the arm, jaw, neck or back, sudden breathlessness, fainting, a racing or irregular heartbeat with dizziness, and sudden weakness or numbness. Heart attack and stroke can begin suddenly, and immediate emergency help is essential. If symptoms are severe, call your local emergency number rather than driving yourself."),q("safety","Call for emergency help","Call your local emergency number for severe chest pain or pressure, severe breathlessness, fainting, or sudden face drooping, arm weakness or speech difficulty. For stroke, remember FAST: Face drooping, Arm weakness, Speech difficulty, Time to call emergency services.")),d("adapting","Adapting exercise to ability and circumstances",c("People with heart conditions, diabetes, high blood pressure, lung conditions or joint problems can usually be active, but they should ask a clinician about safe intensity and warning signs. Some medicines, such as beta-blockers, lower heart rate, so heart-rate targets may not be reliable. Perceived effort and the talk test are often more practical. Adaptations may include seated options, shorter bouts, water-based activity, supported standing or slower pacing."),$(14,"The HERBULANCE physical activity guide explains aerobic training, pacing and safe progression for different levels of fitness."))),K(19,"Strength Training for Lifelong Independence","Strength is the foundation of everyday independence. It supports standing up, climbing stairs, carrying shopping, reaching shelves and recovering from a stumble. This chapter explains the fundamentals of resistance exercise, how to progress safely, options that need no equipment, the use of bands and weights, and how to adapt training to changing abilities.",["Explain core principles of resistance training for older adults.","Choose safe bodyweight, band or weight-based exercises for the major muscle groups.","Adapt strength training for different abilities, health conditions and settings."],["Train the major muscle groups at least two days per week, with rest between sessions for the same muscles.","Progress gradually: increase difficulty when a set feels comfortable with good technique.","Bodyweight exercises, household items and resistance bands can deliver effective strength training.","Seated, supported and water-based options allow almost everyone to train."],["who-pa","acsm-2009","morton-2018","ewgsop2"],d("fundamentals","Resistance exercise fundamentals",c("Resistance exercise asks muscles to work against a force, which can come from body weight, bands, weights or water. Each exercise follows a movement pattern: pushing, pulling, squatting or sit-to-stand, hinging at the hips, lunging or stepping, carrying, and rotating the trunk. A typical beginner session includes one to three sets of 8 to 12 repetitions per exercise, with the final repetitions feeling challenging but controlled. Avoid holding your breath during hard efforts, especially if you have high blood pressure."),W("strength-fundamentals")),d("progression-strength","Safe progression",c("Progression is what produces adaptation. When a set feels easy and technique is good, increase the challenge gradually. Options include adding repetitions, slowing the lowering phase, using a stronger band, holding a weight, reducing support or increasing range. Change one variable at a time. Two to three sessions per week is a practical starting point for many people, with at least one rest day between sessions for the same muscles. Pain that lasts beyond the next day, or that changes how you move, should be reviewed.")),d("bodyweight","Bodyweight and equipment-free options",c("Many effective exercises need no equipment: sit-to-stand from a firm chair, wall or kitchen-counter press-ups, step-ups onto a low step while holding a rail, glute bridges, standing calf raises while holding a support, side-lying hip raises and seated knee extensions. Bags of rice or tins of food can serve as weights. Practise technique slowly and use a sturdy support for balance.")),d("bands-weights","Resistance bands and weights",c("Resistance bands are affordable, portable and adjustable, which makes them useful for home training. Choose bands with clearly marked resistance levels. Anchor them securely, check them for wear and avoid releasing them under tension. Dumbbells, kettlebells and weight machines can build strength further. If you are new to them, an instructor can teach technique and set appropriate loads. Filled water bottles can serve as light weights.")),d("functional","Functional strength",c("Functional strength is the ability to perform everyday tasks, such as getting out of the bath, standing from a low sofa, lifting a laundry basket, climbing a step, or getting up from the floor after a fall. Training can be designed around these tasks. Practising sit-to-stand, step-ups and carrying makes daily life easier and can reduce fear of movement.")),d("recovery-strength","Recovery",c("Strength is built during recovery. Allow at least one day between sessions for the same muscle groups, get enough sleep, eat adequate protein and energy, and notice fatigue. Mild muscle soreness after new exercise is common and usually settles within a few days. Sharp pain, joint swelling or soreness that lasts more than several days should be assessed. Chapter 23 explores recovery in more depth.")),d("modifications","Modifications for different abilities",c("Almost everyone can strength train with modifications. Seated versions of standing exercises reduce balance demands. Supported standing uses a worktop or chair back. Floor-based exercises can be done on a mat with support, and practising getting up and down from the floor should be done carefully. Water-based training reduces body weight. People who use wheelchairs can train the upper body, trunk and seated leg movements with bands or light weights. Ask a clinician or physiotherapist first if you have a heart, lung, joint or neurological condition, or have had recent surgery."),$(14,"The HERBULANCE physical activity guide helps readers explore exercise programming, equipment options and progression for lifelong fitness.")))],Ty=[K(20,"Balance, Coordination and Fall Prevention","Falls are a leading cause of injury among older adults worldwide, and many falls are preventable. Balance depends on several systems working together, and each can be trained, adapted or assessed. This chapter explains why balance matters, how sensory and nervous-system changes affect stability, which home hazards are most common, and when a fall needs urgent medical attention.",["Explain how vision, the inner ear, proprioception and the brain contribute to balance.","Identify environmental and medical factors that increase fall risk.","Describe balance exercises and when a fall needs urgent or prompt medical review."],["Falls are a leading cause of injury and injury-related death among older adults worldwide.","Balance depends on vision, vestibular function, proprioception and coordinated muscle responses.","Many falls are linked to home hazards, medicines, footwear and vision problems, all of which can be improved.","Balance and strength training, including tai chi, can reduce falls in many older adults."],["who-falls","cdc-falls","sherrington-2019","who-pa","nhs-stroke"],d("why-balance","Why balance matters",c("Balance supports standing, walking, turning, reaching and recovering from a stumble. When balance fails, a fall can cause fractures, head injuries, loss of confidence and reduced activity. Fear of falling can then lead to less movement, which weakens muscles and makes balance worse, creating a cycle. Breaking this cycle through balance and strength training is a central goal of healthy ageing."),W("balance-systems")),d("sensory-systems","Sensory systems and postural control",c("Vision helps judge position and movement. The vestibular organs in the inner ear sense head movement and orientation. Proprioceptors in joints, muscles and skin tell the brain where the limbs are. The brain combines these signals and triggers postural responses. Each system can change with age or disease: eyesight may blur, the inner ear may be affected by conditions that cause vertigo, and sensation in the feet can be reduced by diabetic nerve damage or other causes.")),d("environment","Environmental fall hazards",c("Most falls happen at home, often during everyday activities such as walking, bathing, reaching or climbing. Common hazards include loose rugs, trailing cables, clutter, poor lighting, wet or polished floors, unsafe steps, pets underfoot, unsuitable footwear and furniture that is too low or unstable. The next section and Chapter 48 describe practical solutions.")),d("home-safety","Home safety",c("Home safety assessments can identify hazards and recommend adaptations. Good practice includes clear walkways, secured rugs, grab rails on stairs and in bathrooms, night lights, good task lighting, non-slip flooring, reachable storage and a phone or alert device within reach. Occupational therapists are skilled at assessing homes and recommending affordable changes. Figure 19 shows common hazards and the improvements that address them."),W("fall-prevention-home")),d("exercises","Appropriate balance exercises",c("Balance exercises should be challenging but safe. Examples include standing with feet together and then in tandem (heel to toe) while holding a support; standing on one leg while holding a worktop, then progressing to lighter support; walking heel to toe along a line; controlled sit-to-stand; turning the head from side to side while walking; and reaching forward and sideways. Tai chi and similar movement practices have evidence for reducing falls in some older adults. Practise near a wall, use a stable support and stop any exercise that causes dizziness or pain.")),d("medicines-vision-footwear","Vision, footwear and medication considerations",c("Regular eye examinations ensure that glasses or lenses are correct. Multifocal glasses can affect judgement on stairs and kerbs, so it is worth asking an optician about walking-specific options. Footwear with a secure heel, a non-slip sole and a good fit is safer than loose slippers. Some medicines increase fall risk, including sedatives, some antidepressants, some blood-pressure medicines and diuretics, particularly when they cause low blood pressure on standing. Ask a clinician or pharmacist to review your medicines after any fall (see Chapter 40)."),q("caution","Standing up safely","Rise slowly. Sit on the edge of the bed for a minute before standing, pause if you feel dizzy and hold a stable support. Dizziness on standing can be a sign of low blood pressure and should be reported to a clinician.")),d("after-fall","When a fall requires medical attention",c("Not every fall needs hospital care, but some do. Call your local emergency number if you have hit your head (especially if you take blood thinners), cannot get up or move a limb, have severe pain, suspect a broken bone, have new confusion, chest pain or breathing difficulty, or were unconscious. If you are alone and cannot get up, use an alert device or call for help. After even a minor fall, arrange a medical review if you have fallen more than once, feel dizzy or are worried about your balance."),q("safety","Emergency after a fall","Seek emergency care for a head injury, suspected fracture, inability to get up, new confusion, chest pain, breathing difficulty or fainting. Do not wait to see whether symptoms improve."),$(14,"The HERBULANCE physical activity guide explores balance, coordination and functional training for daily life."))),K(21,"Mobility, Flexibility and Joint Health","Joints allow us to move in many directions every day. Maintaining healthy mobility is a matter of movement, strength and sensible management of discomfort, rather than endless stretching or forcing a joint beyond its comfortable range. This chapter explains mobility, joint function, gentle routines, everyday movement, pain management and when pain needs assessment.",["Distinguish mobility from flexibility and explain why both matter.","Describe joint function and the role of movement in joint health.","Apply gentle movement routines and recognise when joint pain needs professional assessment."],["Mobility combines flexibility, strength and control across a functional range of motion.","Joints depend on movement to nourish cartilage and maintain lubrication.","Mild, short-lived discomfort after movement is different from sharp pain, swelling or night pain.","Exercise is a first-line approach for knee osteoarthritis in many clinical guidelines."],["who-pa","acsm-2009","nhs-exercise","morton-2018"],d("mobility-flexibility","Mobility versus flexibility",c("Flexibility refers to the length and extensibility of muscles and soft tissues. Mobility is broader: it is the ability to move joints through the range needed for functional tasks, with strength, stability and control. A person can be flexible but weak, or strong but stiff. Good mobility usually combines both qualities and supports everyday tasks such as reaching, bending, dressing and walking.")),d("joint-function","Range of motion and joint function",c("Joints connect bones and allow movement. Articular cartilage covers the bone ends and reduces friction. Synovial fluid lubricates the joint and helps nourish cartilage. Ligaments stabilise joints, and muscles move them. Cartilage has no direct blood supply and depends partly on movement and load for nutrition. Gentle, regular movement helps maintain joint fluid and a comfortable range of motion."),W("joint-mobility")),d("gentle-routines","Gentle movement routines",c("A short daily routine can be effective. Start with slow, comfortable movements, breathe steadily and stop before pain increases. Examples include seated neck turns, shoulder rolls, ankle circles, seated knee extensions, standing hip circles while holding a support, gentle heel raises and seated trunk rotations. Hold stretches comfortably for about 20 to 30 seconds where appropriate, and repeat as tolerated."),q("info","A rule of thumb for discomfort","Mild discomfort that eases shortly after exercise is often acceptable. Sharp pain, swelling, warmth, night pain that wakes you, or pain that worsens over several days suggests you should stop and seek advice.")),d("everyday-movement","Occupational and everyday movement",c("Everyday tasks already train mobility when done safely: reaching for objects at waist height, carrying shopping in both hands, gardening, sweeping, or bending with control to pick up a dropped item. For people whose work or hobbies involve repetitive or heavy movement, an occupational health assessment may reduce strain. Changing position regularly and using tools that reduce reaching or bending can protect joints.")),d("managing-discomfort","Managing discomfort responsibly",c("Pain management works best as part of a plan. Options include activity pacing, heat or cold, supportive footwear or braces, weight management, exercise, physiotherapy, psychological strategies and, where appropriate, medicines advised by a clinician. Over-the-counter anti-inflammatory tablets can cause kidney, stomach and bleeding problems, especially in people with heart disease, kidney disease or those taking blood thinners. Ask a pharmacist before using them if you have any other medical condition.")),d("persistent-pain","When persistent pain needs assessment",c("Persistent joint pain, pain that limits sleep or daily activity, swelling that does not settle, joints that lock or give way, or a sudden loss of movement needs professional assessment. Osteoarthritis is common and manageable. Effective options range from exercise and weight management to injections and, in appropriate cases, surgery. Inflammatory arthritis, infection and gout are other possibilities that need specific diagnosis and treatment."),q("caution","A hot, swollen joint","A joint that is hot, red, swollen and very painful, especially with fever or feeling unwell, should be assessed urgently, because infection needs prompt treatment."),$(14,"The HERBULANCE physical activity guide helps readers explore gentle mobility, flexibility and functional movement programmes."))),K(22,"Everyday Movement and Active Living","Most daily movement is not formal exercise, yet it can make a large difference to health and independence. Walking, gardening, housework, dancing and everyday errands all count. This chapter shows how to make movement part of ordinary life, break up sitting and make active living accessible in different environments.",["Describe the health value of daily steps and everyday movement.","Identify low-cost activities that build strength, endurance and balance.","Plan accessible movement suited to home, neighbourhood and community settings."],["Step counts are useful, but intensity, pace and variety also matter.","Household tasks, gardening and dancing can contribute to aerobic and strength activity.","Breaking up sitting with short movement breaks can help.","Accessible environments, safe routes and social groups make activity sustainable."],["paluch-2022","who-pa","uk-cmo-pa","csep-24h","nhs-exercise"],d("walking-steps","Walking and daily steps",c("Walking is one of the most accessible forms of movement. A 2022 meta-analysis of cohort studies reported that more daily steps were associated with lower mortality, and that the benefit levelled off at a lower step count for adults aged 60 and over than for younger adults. Step counts are a helpful guide, but they do not capture everything. Walking pace, hills, carrying loads and varied movement add further value.")),d("gardening-housework","Gardening, household movement and dancing",c("Gardening combines walking, bending, lifting and sustained arm use. Raised beds, container planting and seated gardening tools make it more accessible. Household tasks such as vacuuming, mopping, sweeping and carrying laundry are also physical activity and can be done in short sessions. Dancing, whether social, cultural or in classes, combines aerobic effort, rhythm, balance and social connection. Dance is an important community practice in many traditions around the world."),W("everyday-movement")),d("recreation","Recreational activities",c("Swimming, cycling, walking on easy trails, bowling, golf with a cart, table tennis and adapted team sports can all build fitness. Choose activities you enjoy and can sustain. Clubs, community centres and faith or cultural groups often provide structure and social contact alongside activity.")),d("sitting","Breaking up prolonged sitting",c("Long periods of sitting are linked with poorer metabolic health and higher mortality risk in observational studies. Evidence suggests that interrupting long periods of sitting can have beneficial effects on blood sugar and blood pressure in some studies. Simple breaks include standing up every 30 to 60 minutes, walking to make a drink, doing calf raises while the kettle boils, marching on the spot during television adverts, or using a standing workspace for part of the day. Even short breaks count.")),d("accessible-movement","Accessible movement opportunities",c("Movement is easier when the environment supports it. Look for safe footpaths, benches for rests, good lighting, step-free access, public toilets, and community or sports facilities that welcome older and disabled people. Cost can be a barrier, so free options such as public parks, walking groups, library exercise classes and community programmes are valuable. Extreme weather can make outdoor activity unsafe. Indoor alternatives, such as shopping centres, indoor walking routes or home routines, help all year round."),q("info","Movement that counts","No single activity is required. Regular, enjoyable movement matched to your ability is the target. Start with what you already do, then build gradually."),$(14,"The HERBULANCE physical activity guide helps readers explore everyday movement, fitness planning and lifelong active living."))),K(23,"Recovery, Rest and Exercise Adaptation","Adaptation happens during recovery, not only during exercise. Muscles, bones and the nervous system need time and nutrition to repair and strengthen. Sleep, nutrition, stress and illness all influence how well the body responds to activity. This chapter explains recovery principles, the difference between tiredness and overtraining, and when activity should stop.",["Explain how recovery supports adaptation to exercise.","Recognise fatigue and overtraining, and distinguish them from normal tiredness.","Adjust exercise safely as health, ability or circumstances change."],["Adaptation occurs when training stress is followed by sufficient recovery.","Sleep, nutrition and rest days are essential components of recovery.","Persistent fatigue, falling performance, poor sleep or frequent illness can indicate overtraining or another problem.","Stop activity and seek help for chest pain, dizziness, severe breathlessness or sudden weakness."],["who-pa","acsm-2009","nhs-sleep","morton-2018"],d("recovery-principles","Recovery principles",c("Exercise provides a stimulus, and recovery allows adaptation. After strength training, muscle protein synthesis remains raised for a period, which is one reason adequate protein and rest matter. Cardiovascular fitness adapts when recovery allows the body to repair and rebuild. The principle is simple: train, recover, then train again. Recovery can include lighter activity, sleep, good nutrition and time off."),W("recovery-cycle")),d("sleep-adaptation","Sleep and physical adaptation",c("Sleep is one of the most important recovery tools. During sleep the body repairs tissues and releases hormones that support growth and repair, and sleep helps consolidate motor learning. Chronic sleep loss increases fatigue, lowers mood and can impair the response to training. Chapter 31 and Book 12 explore sleep in more detail.")),d("fatigue-overtraining","Fatigue and overtraining",c("Normal tiredness after exercise usually settles within a day or two. Overtraining is different. It may involve persistent fatigue, declining performance, disturbed sleep, low mood, prolonged muscle soreness, joint pain, more frequent illness or an unusually high resting heart rate. Overtraining is uncommon in older people following moderate programmes, but it can occur when intensity increases quickly or is combined with poor sleep, illness or stress. Persistent symptoms should be discussed with a clinician, because other conditions can mimic overtraining.")),d("progressive-exercise","Progressive exercise",c("Progression should be gradual and responsive. Increase load, duration or intensity in small steps, and allow the body to adapt before the next increase. A simple check is how you feel the next morning and whether your performance is stable across the week. If you feel worse for several days, reduce the load and recover before resuming.")),d("rest-days","Rest days and active recovery",c("Rest days give tissues time to adapt. They do not have to be completely inactive. Gentle walking, mobility work, easy swimming or household tasks can serve as active recovery. Plan at least one rest or lighter day each week, and more if training is intense or new.")),d("adapting-training","Adapting training to changing ability",c("Health and ability change over time. Illness, injury, medicines, extreme temperatures, pregnancy, surgery and changes in mood can all affect capacity. Adapt by reducing load, shortening sessions, choosing alternative exercises or temporarily pausing. Returning after illness should be gradual, and clinicians may advise a graded return after heart problems, surgery or other significant conditions.")),d("stop-signs","Warning signs that require stopping activity",c("Stop exercising and seek advice if you experience chest pain, pressure or tightness; severe breathlessness; dizziness or fainting; a racing or irregular heartbeat with symptoms; sudden weakness, numbness, facial droop or speech difficulty; sudden severe pain; or confusion. Some of these are emergencies, so call your local emergency number."),q("safety","Emergency symptoms","Sudden weakness on one side, facial droop, speech or vision changes, severe chest pain or severe breathing difficulty require immediate emergency help. Do not continue exercising while these symptoms are present."),$(14,"The HERBULANCE physical activity guide helps readers explore safe progression, planning and recovery across fitness levels.")))],Cy=[K(24,"Understanding the Ageing Brain","The brain coordinates movement, perception, memory, language, emotion and decision-making. Its structure and function change with age in ways that are often gradual and variable. This chapter explains the brain’s main regions and systems, normal changes in processing speed and memory, the idea of cognitive reserve, and why people differ so widely.",["Describe the main brain regions and the everyday functions they support.","Distinguish normal age-related changes in cognition from more significant decline.","Explain cognitive reserve and why brain health varies between people."],["Brain regions work together, and many everyday tasks use several networks at once.","Processing speed and some aspects of memory typically slow with age, while vocabulary and accumulated knowledge are often preserved.","Significant memory loss, confusion or changes in daily functioning are not normal ageing and need assessment.","Cognitive reserve, built through education, work, activity and social engagement, can help people cope with brain changes."],["stern-2012","lancet-2024","who-dementia"],d("structure-function","Brain structure and function",c("The cerebral cortex is divided into four lobes. The frontal lobes support planning, decision-making, working memory and voluntary movement. The parietal lobes integrate touch and spatial awareness. The temporal lobes process hearing and language and contribute to memory. The occipital lobes process vision. Deep within the temporal lobes, the hippocampus is central to forming new memories. The cerebellum coordinates movement and balance, and the basal ganglia contribute to movement, habit and reward."),W("brain-anatomy"),c("Neurons communicate across synapses, supported by glial cells, blood vessels and a constant supply of oxygen and glucose. The adult brain uses roughly a fifth of the body’s resting energy, which is one reason blood-vessel health matters for brain function.")),d("processing-speed","Normal changes in processing speed",c("Processing speed, the rate at which the brain takes in and responds to information, tends to decline gradually through adult life. Older adults may take a little longer to find words, switch tasks or respond to unexpected events. Some brain regions show gradual changes in volume, although the relationship between volume and function is complex. These changes are usually subtle, and many older adults maintain effective thinking in daily life."),q("info","Normal does not mean unimportant","Slower processing can matter when driving, crossing busy roads or managing several tasks at once. Adjusting the environment, allowing extra time and taking breaks can make many tasks safer and less stressful.")),d("memory-systems","Memory systems",c("Memory is not a single process. Short-term memory holds small amounts of information for seconds. Working memory manipulates information while it is in use, such as following directions or doing mental arithmetic. Long-term memory stores information for days or years. It includes episodic memory for personal events, semantic memory for facts and meanings, and procedural memory for skills and habits. Some abilities, such as recalling names and recent events, tend to slow with age, while procedural memory and vocabulary are often well preserved.")),d("attention-executive","Attention and executive function",c("Executive functions include sustained attention, the ability to ignore distractions, task switching, planning and self-monitoring. They depend largely on the frontal lobes and their networks. Multitasking becomes harder under stress or fatigue for people of any age. Executive function can be strengthened to some extent with practice, and it is strongly influenced by sleep, mood, health conditions and medicines.")),d("cognitive-reserve","Cognitive reserve",c("Cognitive reserve describes the brain’s ability to tolerate damage or change without showing symptoms, often because it can use alternative networks or strategies. In a 2012 review, Yaakov Stern proposed that education, occupational complexity, leisure and social activity contribute to reserve. The concept helps explain why people with similar brain changes can have different functional outcomes. Reserve is not a guarantee against disease, but building it through enjoyable, varied activity is a sensible goal.")),d("individual-variability","Individual variability",c("Cognitive ageing varies widely between people. Genetics, education, conditions such as hypertension and diabetes, hearing and vision, sleep, mood, physical activity, medicines, alcohol use and social environment all influence brain health. Two people of the same age can have very different cognitive profiles, and a single test result should never be treated as a verdict on a person’s future."),q("caution","Avoid unhelpful labels","Describing someone as “just a bit forgetful” or as “going senile” can be unhelpful and hurtful. Clear, respectful descriptions of what has been noticed, and how it affects daily life, are more useful for everyone involved."),$(13,"The HERBULANCE stress management guide helps readers explore how stress, worry and emotional wellbeing affect attention and memory, which is useful for people who feel anxious about their thinking."))),K(25,"Memory, Learning and Mental Sharpness","Memory is a set of processes for learning, storing and retrieving information. Many everyday memory lapses are normal and can be improved through strategies, practice and realistic expectations. This chapter explains encoding, consolidation and retrieval, the value of spaced and meaningful practice, and how to set sensible goals for cognitive performance.",["Explain encoding, consolidation and retrieval, and how each can be supported.","Use spaced repetition and retrieval practice in everyday learning.","Set realistic expectations and use memory aids without undermining confidence."],["Memory depends on attention at encoding, sleep for consolidation, and cues or practice for retrieval.","Spaced practice and self-testing (retrieval practice) are among the most reliable learning strategies.","Learning new skills is possible at any age, but it takes time, repetition and feedback.","Memory aids such as lists, calendars and reminders are sensible tools, not signs of failure."],["stern-2012","rebok-2014","simons-2016"],d("encoding-retrieval","Encoding, consolidation and retrieval",c("Memory begins with encoding: paying attention and connecting new information to what is already known. Consolidation stabilises memories, largely during sleep. Retrieval brings memories back into awareness, and it is strengthened by practice and by cues. Many memory failures occur at encoding, when information was never properly noticed, or at retrieval, when it is stored but hard to reach."),W("memory-systems")),d("repetition","Repetition and practice",c("Practice works best when it is spaced across time. Reviewing material at increasing intervals, rather than cramming, strengthens long-term retention. Retrieval practice, in which you try to recall information before checking, is especially effective. Simple methods include self-quizzing, explaining a topic aloud, writing key points from memory and using flashcards."),q("info","Try this","Read a short passage, put it aside, and write down everything you can remember. Then check what you missed. Repeat the exercise the next day. This small routine combines spacing and retrieval practice.")),d("meaningful","Meaningful cognitive activities",c("Activities that are meaningful, varied, socially engaging and appropriately challenging tend to be more motivating than repetitive tasks. The best activity is one you enjoy, can sustain and that stretches you a little. Reading, learning a language, playing music, planning a garden, solving problems and taking part in group discussion all provide mental engagement.")),d("learning-adulthood","Learning throughout adulthood",c("Adults continue to learn throughout life. Learning may be slower for some tasks, but it benefits from prior knowledge, motivation and reflection. Older learners often bring experience that helps them connect new material to existing knowledge. Structured classes, peer learning and regular practice schedules help. Learning should be enjoyable, and mistakes are a normal part of the process.")),d("expectations-aids","Realistic expectations and memory aids",c("It is realistic to expect some slower recall of names or details in later life. It is not realistic to expect perfect memory at any age. Calendars, shopping lists, medicine organisers, alarms and labelled containers reduce reliance on memory and free up attention for other tasks. Using them is a sign of good planning. Persistent or worsening memory problems, particularly those affecting daily life, should be assessed by a clinician."),q("caution","Be cautious with bold claims","Products that promise dramatic improvements in memory should be treated with caution. Chapter 26 explains the evidence for brain-training programmes."),$(12,"The HERBULANCE sleep guide explores how sleep supports memory consolidation, which connects directly to the learning routines described here."))),K(26,"Brain Health and Neuroplasticity","Neuroplasticity is the brain’s ability to change its structure and function in response to experience. It is one of the most hopeful ideas in neuroscience, yet translating it into practical advice is still developing. This chapter explains neuroplasticity, how learning, physical activity, sleep and social engagement relate to brain health, and where the evidence is strong or limited.",["Explain neuroplasticity and its relevance to healthy ageing.","Summarise evidence linking physical activity, sleep and social engagement with brain health.","Evaluate claims about brain-training products and neuroplasticity-based programmes."],["Neuroplasticity continues into later life, but benefits depend on sustained, challenging practice.","Aerobic and multi-component activity has supportive evidence for cognition, with modest average effects.","Sleep supports memory consolidation, and animal research suggests sleep supports clearance of brain waste products.","Commercial brain-training games have limited evidence for broad cognitive benefit beyond the trained tasks."],["draganski-2004","xie-2013","finger-2015","simons-2016","rebok-2014","nhs-sleep"],d("what-neuroplasticity","What neuroplasticity means",c("Neuroplasticity refers to the brain’s capacity to change through strengthening or weakening synapses, forming new connections, adjusting networks and, in some regions, producing new neurons. Learning and experience alter these processes. A widely cited 2004 study found increases in grey-matter volume in people who learned to juggle over several weeks, illustrating that practice can change brain structure. The study was small and short-term, so it should be read as an illustration rather than a general prescription."),W("neuroplasticity")),d("learning-adaptation","Learning and adaptation",c("Changes are most reliable when practice is sustained, challenging and supported by feedback. A new skill that needs attention and gradual improvement, such as learning a musical instrument or a language, is more likely to drive adaptation than passive exposure. The brain responds to demands. Easy, repetitive tasks may maintain existing skills but are less likely to produce large gains.")),d("physical-brain","Physical activity and brain health",c("Regular aerobic exercise is associated with better cognitive performance in observational research, and randomised trials of exercise in older adults have shown modest improvements in some measures of cognition. Animal studies show that exercise increases factors that support neuronal health and, in some brain regions, the formation of new neurons. Whether this happens to a meaningful extent in adult humans is still debated. The most robust message is that physical activity supports cardiovascular health, which in turn supports the brain.")),d("sleep-brain","Sleep and cognition",c("Sleep supports memory consolidation, attention and emotional regulation. Poor or disrupted sleep is associated with cognitive difficulties and with higher dementia risk in observational studies. A 2013 study in mice found that the brain’s clearance system was more active during sleep. Mouse findings do not directly establish the same process in people, but they suggest a plausible mechanism for further research. Sleep disorders such as obstructive sleep apnoea should be assessed (see Chapter 31).")),d("social-engagement","Social engagement",c("Social engagement, including conversation, shared activities and community roles, is associated with better cognitive outcomes in observational studies. It also provides mental stimulation, emotional support and motivation. Because people who are cognitively well may be more socially active, cause and effect are difficult to separate. Social connection is valuable for many reasons in its own right (Chapter 34).")),d("limitations-training","Limitations of current evidence",c("The ACTIVE trial, a large US randomised study with a ten-year follow-up published in 2014, tested training in memory, reasoning and processing speed. Participants showed improvement in the skills they practised. Some trained groups reported benefits in everyday functioning at ten years, but transfer to general cognitive ability was limited. A 2016 review of commercial brain-training programmes concluded that evidence for broad benefits was weak. Claims that games prevent dementia are not established."),q("myth","Myth","“Brain games prevent dementia.” Fact: there is no established evidence that commercial brain-training games prevent dementia. Varied, enjoyable mental challenges are sensible, but the strongest evidence for brain health involves broader lifestyle factors such as cardiovascular health, physical activity and hearing care."))),K(27,"Dementia, Alzheimer’s Disease and Cognitive Disorders","Dementia is a syndrome that affects memory, thinking and daily functioning. It is not a normal part of ageing, and it is not a single disease. Alzheimer’s disease is the most common cause. Understanding the difference between normal ageing and concerning symptoms, using accurate and respectful language, and seeking professional assessment are essential for people and families.",["Distinguish dementia, Alzheimer’s disease and mild cognitive impairment.","Recognise warning signs that warrant professional assessment, without self-diagnosis.","Use respectful language and understand the support options for people and families."],["Dementia is a syndrome with several causes. It is not a normal part of ageing.","Warning signs include memory loss that disrupts daily life and changes in planning, language, orientation or behaviour.","Diagnosis requires qualified clinical assessment, which also checks for treatable causes.","The 2024 Lancet Commission estimated that nearly half of dementia cases could, in theory, be prevented or delayed by addressing 14 modifiable risk factors."],["lancet-2024","lancet-2020","who-dementia","alz-10","nhs-dementia","who-dementia-plan"],d("definitions","Definitions and distinctions",c("Dementia describes a group of symptoms, including progressive decline in memory and at least one other cognitive ability, such as language, reasoning, judgement or visual-spatial skills, that interferes with daily functioning. Causes include Alzheimer’s disease, vascular disease affecting the brain, Lewy body disease, frontotemporal disease and combinations of these. Alzheimer’s disease is the most common cause. Mild cognitive impairment (MCI) describes measurable cognitive decline with preserved independence. Not everyone with MCI develops dementia."),c("Delirium is a different condition. It usually comes on suddenly, fluctuates across the day and is often caused by infection, medicines, dehydration, pain, surgery or another acute illness."),q("safety","Sudden confusion is urgent","New or sudden confusion, unusual drowsiness, hallucinations or a change in alertness should prompt urgent medical assessment, even in a person who already has a dementia diagnosis. The cause may be treatable.")),d("normal-vs-concerning","Normal ageing versus concerning symptoms",c("Normal ageing may include occasionally forgetting a name, needing a list, or taking longer to recall a word, with the information often returning later. More concerning changes include repeatedly forgetting recent conversations or events, getting lost in familiar places, struggling with familiar tasks such as using appliances or managing money, new difficulty following conversations, personality or mood changes, and needing increasing help with daily life. Figure 26 contrasts these patterns."),W("normal-vs-concerning")),d("warning-signs","Common warning signs",c("The Alzheimer’s Association lists ten warning signs of Alzheimer’s disease and related dementias. They include memory loss that disrupts daily life, difficulty planning or solving problems, trouble completing familiar tasks, confusion about time or place, visual and spatial difficulties, new problems with words, misplacing things and being unable to retrace steps, poor or changed judgement, withdrawal from work or social activities, and changes in mood or personality. Figure 27 summarises them. These signs are reasons to seek assessment. They are not a self-diagnosis."),W("dementia-awareness")),d("types","Common forms of dementia",c("Alzheimer’s disease typically begins with memory problems and can progress to affect language, orientation and behaviour. Vascular dementia results from reduced blood flow to brain tissue, often after strokes or damage to small blood vessels, and may progress in steps. Dementia with Lewy bodies often involves fluctuating alertness, visual hallucinations and movement changes. Frontotemporal dementia often affects behaviour, personality or language early in the illness. Mixed dementia, with more than one cause, is common in older age.")),d("risk-factors","Risk factors",c("Age is the strongest known risk factor. Genetic factors, including the APOE ε4 variant, influence risk but do not determine outcome. The 2024 Lancet Commission identified 14 potentially modifiable risk factors across the life course. These include less education in early life, hearing loss, high LDL cholesterol, depression, traumatic brain injury, physical inactivity, diabetes, smoking, obesity, hypertension, excessive alcohol use, vision loss, social isolation and air pollution. The Commission estimated that, in theory, addressing these factors could prevent or delay nearly half of dementia cases worldwide, while acknowledging uncertainty in that estimate."),q("caution","What the 45% estimate means","The estimate describes a population-level proportion of cases that could in theory be prevented or delayed if the risk factors were addressed across society. It does not mean that any individual can prevent dementia, and it does not guarantee protection.")),d("assessment","Diagnosis by qualified professionals",c("Dementia should be diagnosed by a qualified clinician after a structured assessment. This usually includes a detailed history from the person and from someone who knows them well, cognitive testing, a physical and neurological examination, and blood tests to check for treatable causes such as vitamin B12 deficiency, thyroid problems, infection, kidney or liver disease, and medicine side effects. Hearing, vision, mood, sleep and alcohol use are also considered. Brain imaging and specialist biomarker tests may be used in some settings."),c("Early assessment matters. It can identify treatable causes, open access to support and planning, and give people time to make decisions while they can still take part in them.")),d("support","Support for individuals and families",c("Support includes information, education, care planning, practical help with daily tasks, occupational therapy, carer support groups, respite services and, where appropriate, medicines discussed with a specialist. Many people with dementia continue to make meaningful choices, enjoy relationships and take part in community life. Families benefit from clear information and from support for their own wellbeing.")),d("language","Respectful language and stigma reduction",c("Language shapes attitudes. Use “person living with dementia” rather than labels such as “sufferer” or “demented”. Avoid outdated and stigmatising words such as “senile” or “senility”. Focus on the person’s abilities and preferences, speak clearly and patiently, and avoid talking about a person as though they are not present. Stigma can delay diagnosis and reduce quality of life.")),d("no-self-diagnosis","No self-diagnosis",c("Online cognitive quizzes and apps are not diagnostic tools. A high or low score on a short online test cannot confirm or rule out dementia. Persistent concern about memory or thinking should lead to a conversation with a clinician, who can take a full history and arrange appropriate tests. Worry about memory is common, and it helps to bring a written list of specific examples to an appointment."),$(13,"The HERBULANCE stress management guide helps readers explore how worry about memory can weigh on families, and how emotional wellbeing can be supported while professional assessment is arranged.")))],Ny=[K(28,"Lifestyle Factors Associated With Brain Health","Many of the factors linked to brain health also support the heart, blood vessels, muscles and emotional wellbeing. This chapter reviews the lifestyle factors with the strongest associations with cognitive outcomes, what trials have and have not shown, and why risk reduction should be described as probability rather than guarantee.",["Explain how cardiovascular health relates to brain health.","Summarise evidence for nutrition, activity, sleep, social connection, hearing, vision and substance use.","Describe evidence-based risk reduction without overstating its certainty."],["Vascular health (blood pressure, cholesterol and blood sugar) is one of the most consistent themes in brain-health research.","Physical activity, sleep, hearing and vision care, and social connection each show associations with cognitive outcomes.","Smoking and heavy alcohol use increase risk, and avoiding them is among the most valuable steps.","Brain-health advice reduces average risk. It does not guarantee outcomes for any individual."],["lancet-2024","finger-2015","lin-2013","achieve-2023","mind-2023","who-tobacco"],d("cardiovascular","Cardiovascular health",c("What is good for the heart is generally good for the brain. High blood pressure, high LDL cholesterol, diabetes and obesity are linked with increased risk of cognitive decline and dementia in many studies, and several of these appear in the Lancet Commission’s list of modifiable factors. Blood pressure, lipid levels and blood sugar are worth checking regularly and managing with a clinician where needed (Chapter 38).")),d("nutrition","Nutrition",c("Dietary patterns rich in vegetables, fruit, legumes, whole grains and fish are associated with better cognitive outcomes in observational studies. The MIND diet trial published in 2023 did not show a significant difference in cognitive change compared with a control diet over three years, although both groups improved. The evidence is therefore promising but not conclusive (Chapter 13).")),d("physical","Physical activity",c("Physical activity is associated with better cognition and lower dementia risk in observational research. The FINGER trial in Finland tested a two-year multidomain programme that combined diet guidance, exercise, cognitive training and vascular risk monitoring in older adults at increased risk of cognitive decline. The intervention group showed better cognitive performance than controls on a composite measure. The effect was modest, and the population was specific. The result supports multidomain approaches rather than any single intervention."),$(14,"The HERBULANCE physical activity guide helps readers explore how to build regular exercise, strength and balance training into a sustainable routine.")),d("sleep","Sleep",c("Poor sleep is associated with poorer cognition and higher dementia risk in observational studies. Conditions such as obstructive sleep apnoea, insomnia and restless legs syndrome should be assessed rather than endured. Sleep and circadian health are explored in Chapter 31 and in Book 12."),$(12,"The HERBULANCE sleep and circadian rhythm guide helps readers explore practical sleep routines that support memory, mood and daily functioning.")),d("social","Social connection",c("Social isolation and loneliness are associated with cognitive decline in observational studies, and social isolation is included in the Lancet Commission’s list of modifiable risk factors. Social connection can be built through community groups, volunteering, learning and family contact (Chapter 34).")),d("hearing-vision","Hearing and vision",c("Hearing loss is one of the most important modifiable risk factors in the Lancet Commission’s analysis. Observational studies have linked hearing loss with faster cognitive decline. The ACHIEVE trial, published in 2023, tested hearing-aid provision and health education in older adults with hearing loss. Across the full study population there was no statistically significant difference in cognitive decline between the groups. In a pre-specified analysis of participants at higher risk of decline, the hearing-intervention group showed slower decline, which needs confirmation in further studies. Vision loss is also on the Commission’s list. Regular hearing and eye checks are worthwhile (Chapter 39).")),d("smoking-alcohol","Smoking and alcohol considerations",c("Smoking is associated with higher risk of vascular disease, cognitive decline and dementia. Quitting at any age benefits overall health, and support is available through national quit services and healthcare providers. Alcohol and brain health have a complex relationship. Heavy drinking is harmful, and the Lancet Commission lists excessive alcohol use as a risk factor. People who do not drink should not start for health reasons. People who drink should follow national low-risk guidance.")),d("risk-probability","Evidence-based risk reduction without guarantees",c("Brain-health strategies reduce average risk across populations. They cannot guarantee that any individual will avoid dementia. Some people develop dementia despite healthy lives, while others remain cognitively well into very old age without following any particular pattern. The most reasonable approach combines several sustainable habits, supported by professional care, and accepts uncertainty."),W("brain-lifestyle"))),K(29,"Learning, Creativity and Lifelong Intellectual Engagement","Learning across life supports curiosity, identity, social connection and wellbeing. Reading, languages, music, creative arts, practical skills and problem-solving can all form part of a lifelong learning routine. This chapter explores each option, what the evidence supports and how to build accessible routines that fit real lives.",["Describe several forms of lifelong learning and their potential benefits.","Distinguish evidence for wellbeing from evidence for specific cognitive effects.","Design a small, sustainable learning routine."],["Lifelong learning supports wellbeing and engagement, even though cognitive benefits vary by activity.","Reading, music and creative arts have supportive evidence for wellbeing; evidence for specific cognitive benefit is mixed.","Learning is most sustainable when it is enjoyable, social and paced to the learner.","Free and low-cost options, including libraries and community courses, make learning accessible."],["stern-2012","simons-2016","who-ageing"],d("reading","Reading",c("Reading engages attention, language, imagination and memory. Book clubs add discussion and social connection. Audiobooks, large-print editions and adjustable e-readers make reading accessible to people with visual or other impairments. Observational studies link reading with better cognitive outcomes, but such studies cannot establish cause and effect. Reading is valuable in its own right, whatever its effect on cognition.")),d("languages","Language learning",c("Learning a new language requires attention, memory and practice, and it can be a rewarding challenge at any age. Some observational studies have linked bilingualism with later onset of dementia symptoms, but the evidence is contested and may reflect education, social environment or other factors. Language learning is worth doing for enjoyment, travel, communication and connection.")),d("music","Music",c("Music engages many brain regions, including those involved in hearing, movement, memory and emotion. Playing an instrument, singing in a choir and taking part in music-based groups are associated with wellbeing and social connection. Music therapy is used in some health services for people living with dementia and other conditions. Evidence for benefit is growing but varies by outcome. Listening to familiar music can also support mood and the recall of personal memories.")),d("creative-arts","Creative arts",c("Painting, drawing, pottery, photography, writing, crafts and textile arts can improve mood, sense of accomplishment and belonging. Community arts programmes have been associated with wellbeing outcomes in several studies. Creative activity does not require talent. The aim is engagement and enjoyment rather than performance."),$(13,"The HERBULANCE stress management guide helps readers explore creative activity as a route to emotional wellbeing and mind-body balance.")),d("skills","Skill development",c("Learning a practical skill, such as woodworking, cooking a new cuisine, using a new device or mastering a sport, combines physical, cognitive and social elements. Skills give structure and a sense of competence, which supports identity and purpose. Adults can learn technical skills at any age with patient instruction and appropriate support.")),d("problem-solving","Problem-solving",c("Puzzles, strategy games, bridge, chess, Sudoku and crosswords challenge reasoning and memory. Enjoyment is the key, and playing with others adds social benefit. Improvement is usually confined to the specific game, so these activities are best seen as enjoyable mental exercise rather than a guaranteed way to protect the brain (see Chapter 26).")),d("routines","Accessible lifelong learning routines",c("A sustainable routine is small, regular and varied. Ten to fifteen minutes a day, three or four times a week, is enough to begin. Libraries, community colleges, adult education programmes, museum talks and free online courses all offer structured learning. Consider transport, cost, device access, captions, audio description and large print. Choose a learning activity that connects with existing interests and social life."),W("lifelong-learning"))),K(30,"Digital Technology and Cognitive Wellbeing","Digital technology can support independence, learning, health management and social connection. It can also create barriers, expose people to scams and misinformation, and disrupt sleep. This chapter explains digital literacy, online learning, assistive technology, healthy screen habits, misinformation, digital safety, and the role of technology in maintaining independence and connection.",["Describe the digital skills that support independence and wellbeing.","Identify assistive technologies and screen habits that suit different needs.","Recognise misinformation and scams, and respond to them safely."],["Digital skills can be learned at any age, and digital exclusion is a social determinant of wellbeing.","Assistive technologies such as magnifiers, captioning and screen readers can extend independence.","Screen habits matter for sleep, posture and eye comfort; simple settings and breaks help.","Scams and misinformation target people of all ages. Verify before acting and protect your accounts."],["who-ageism","who-csdh","who-loneliness"],d("digital-literacy","Digital literacy",c("Digital literacy includes using devices, finding and judging information, managing privacy and security, and communicating online. Many people learn digital skills later in life through family support, classes or libraries. Digital exclusion, caused by cost, access, confidence or disability, can increase isolation and make it harder to access services. Learning is easier with patient, step-by-step guidance and a device to practise on.")),d("online-learning","Online learning",c("Online courses, video lessons, podcasts and library e-resources offer flexible learning. Free courses from universities and public broadcasters are widely available. Check that a course matches your goals and comes from a reputable provider. Learning alongside other people, even online, adds motivation and social benefit.")),d("assistive-tech","Assistive technology",c("Assistive technology includes screen magnifiers, text-to-speech, voice assistants, captioning, large-print displays, high-contrast settings, hearing-amplification devices and reminder systems. Many smartphones and computers include built-in accessibility features. Hearing-amplification and health-tracking apps vary in regulation and accuracy, so check whether they are validated and whether a clinician has recommended them. Occupational therapists and assistive-technology services can help choose suitable devices.")),d("screen-habits","Screen habits",c("Screen use is not inherently harmful, but some habits matter. Bright screens late at night can delay sleep for some people. Long periods of screen use can cause eye strain and reduce movement. Practical habits include setting a device-free period before bed, increasing text size, taking regular breaks (for example, looking at something distant every twenty minutes), keeping screens at a comfortable distance, and balancing scre
