ademy of Sciences","https://doi.org/10.1111/j.1749-6632.2000.tb06651.x","DOI resolves (publisher blocked automated check)","Global"],["horvath-2013","emerging","Horvath S.","2013","DNA methylation age of human tissues and cell types. Genome Biology 14:R115","Genome Biology","https://doi.org/10.1186/gb-2013-14-10-r115","HTTP 200","Global"],["levine-2018","emerging","Levine ME, et al.","2018","An epigenetic biomarker of aging for lifespan and healthspan (PhenoAge). Aging (Albany NY) 10(4):573–591","Aging","https://doi.org/10.18632/aging.101414","DOI resolves (publisher blocked automated check)","Global"],["moqri-2023","emerging","Moqri M, et al. (Biomarkers of Aging Consortium)","2023","Biomarkers of aging. Nature Medicine 29:2221–2240","Nature Medicine","https://doi.org/10.1038/s41591-023-02784-9","HTTP 200","Global"],["bjelakovic-2007","consensus","Bjelakovic G, et al.","2007","Mortality in randomized trials of antioxidant supplements for primary and secondary prevention: systematic review and meta-analysis. JAMA 297(8):842–857","JAMA","https://doi.org/10.1001/jama.297.8.842","DOI resolves (publisher blocked automated check)","Global"],["cochrane-antiox","consensus","Bjelakovic G, et al.","2012","Antioxidant supplements for prevention of mortality in healthy participants and patients with various diseases. Cochrane Database of Systematic Reviews, CD007176","Cochrane","https://doi.org/10.1002/14651858.CD007176.pub2","DOI resolves (publisher blocked automated check)","Global"],["blackburn-2015","emerging","Blackburn EH, Epel ES, Lin J.","2015","Human telomere biology: a contributory and interactive factor in aging, disease risks, and protection. Science 350(6265):1193–1198","Science","https://doi.org/10.1126/science.aab3389","DOI resolves (publisher blocked automated check)","Global"],["campisi-2013","emerging","Campisi J.","2013","Aging, cellular senescence, and cancer. Annual Review of Physiology 75:685–705","Annual Review of Physiology","https://doi.org/10.1146/annurev-physiol-030212-183653","DOI resolves (publisher blocked automated check)","Global"],["kennedy-2014","emerging","Kennedy BK, et al.","2014","Geroscience: linking aging to chronic disease. Cell 159(4):709–713","Cell","https://doi.org/10.1016/j.cell.2014.10.039","HTTP 200","Global"],["sun-2016","emerging","Sun N, Youle RJ, Finkel T.","2016","The mitochondrial basis of aging. Molecular Cell 61(5):654–666","Molecular Cell","https://doi.org/10.1016/j.molcel.2016.01.028","HTTP 200","Global"],["covarrubias-2021","emerging","Covarrubias AJ, et al.","2021","NAD+ metabolism and its roles in cellular processes during ageing. Nature Reviews Molecular Cell Biology 22:119–141","Nature Reviews Molecular Cell Biology","https://doi.org/10.1038/s41580-020-00313-x","HTTP 200","Global"],["barzilai-2016","emerging","Barzilai N, et al.","2016","Metformin as a tool to target aging (proposal for the TAME trial). Cell Metabolism 23(6):1060–1065","Cell Metabolism","https://doi.org/10.1016/j.cmet.2016.05.011","HTTP 200","Global"],["kirkland-2020","emerging","Kirkland JL, Tchkonia T.","2020","Senolytic drugs: from discovery to translation. Journal of Internal Medicine 288(5):518–536","Journal of Internal Medicine","https://doi.org/10.1111/joim.13141","DOI resolves (publisher blocked automated check)","Global"],["mannick-2018","experimental","Mannick JB, et al.","2018","TORC1 inhibition enhances immune function and reduces infections in the elderly. Science Translational Medicine 10(449):eaaq1564","Science Translational Medicine","https://doi.org/10.1126/scitranslmed.aaq1564","DOI resolves (publisher blocked automated check)","United States"]],wo=Gy.map(([l,m,u,p,y,g,k,S,x])=>{const A=k.startsWith("https://doi.org/");return{key:l,cat:m,authors:u,year:p,title:y,source:g,...A?{doi:k.replace("https://doi.org/","")}:{url:k},check:S,scope:x}}),xo={consensus:"Established scientific consensus",guidance:"Official guidance (public-health and clinical agencies)",emerging:"Emerging evidence",observational:"Observational associations",experimental:"Experimental findings (trials, animal and mechanistic studies)",uncertain:"Areas of scientific uncertainty"},_=(l,m,u,p,y,g)=>({no:l,id:m,title:u,caption:p,alt:y,data:g}),ym=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],_y=l=>l>=2?"●":l===1?"◐":"○",ei=[_(1,"lifespan-healthspan","Human lifespan and healthspan comparison","Illustrative only. The bar lengths show the concept that healthspan can be shorter than lifespan. They are not measured values.","Two horizontal bars. The lifespan bar is longer than the healthspan bar, and its extra section represents years lived with some health limitations.",{kind:"bars",max:100,note:"Illustrative proportions only.",rows:[{label:"Healthspan (years in good health)",segs:[{v:70,label:"Good health and function",tone:"a"}]},{label:"Lifespan (total years lived)",segs:[{v:70,label:"Good health and function",tone:"a"},{v:20,label:"Years with some limitations",tone:"b"}]}]}),_(2,"cellular-ageing","Cellular ageing overview","A simplified cell showing where several ageing processes occur.","Schematic cell with a nucleus, telomeres at chromosome ends, mitochondria, protein-folding machinery and a senescent cell.",{kind:"anatomy",variant:"cell",legend:[{n:1,title:"Nucleus and DNA",text:"DNA damage and repair happen here. Repair is imperfect, so errors can accumulate over time."},{n:2,title:"Telomeres",text:"Protective caps at the ends of chromosomes that shorten as cells divide."},{n:3,title:"Mitochondria",text:"Energy-producing structures whose function can decline with age."},{n:4,title:"Protein quality control",text:"Systems that fold, repair or remove damaged proteins. Their efficiency can fall."},{n:5,title:"Senescent cell",text:"A cell that has stopped dividing but remains alive, and may release inflammatory signals."}]}),_(3,"hallmarks","Hallmarks of ageing diagram","The nine hallmarks proposed in 2013. The 2023 update added disabled macroautophagy, chronic inflammation and dysbiosis.","Hub diagram with nine hallmarks of ageing arranged around a central label.",{kind:"hub",center:{title:"Hallmarks of ageing",text:"A research framework, not a checklist for individuals."},nodes:[{title:"Genomic instability",text:"DNA damage and repair errors accumulate."},{title:"Telomere attrition",text:"Chromosome caps shorten with cell division."},{title:"Epigenetic alterations",text:"Gene activity patterns drift with age."},{title:"Loss of proteostasis",text:"Protein quality control becomes less efficient."},{title:"Deregulated nutrient-sensing",text:"Growth and metabolic pathways shift."},{title:"Mitochondrial dysfunction",text:"Energy production becomes less efficient."},{title:"Cellular senescence",text:"Cells stop dividing and may signal inflammation."},{title:"Stem-cell exhaustion",text:"Tissue renewal slows."},{title:"Altered intercellular communication",text:"Signalling between cells changes."}]}),_(4,"gene-environment","Genetics and environment interaction","Genetic predisposition and environmental exposure interact. Neither alone determines an outcome.","Three panels: genetics, environment and their interaction, with examples under each.",{kind:"pillars",cols:[{title:"Genetics",items:["Inherited variation affects predisposition","Many variants each have small effects","Cannot be changed by lifestyle"]},{title:"Environment",items:["Diet, activity, sleep and stress","Air quality, UV exposure and infection","Social and economic conditions"]},{title:"Interaction",items:["The same gene can have different effects in different settings","Lifestyle can change how much inherited risk is expressed","Outcomes are probabilities, not certainties"]}]}),_(5,"bio-vs-chrono","Biological versus chronological age","Chronological age is a precise count. Biological age is an estimate, and no single agreed measurement exists.","Two columns comparing chronological age and biological age.",{kind:"compare",left:{title:"Chronological age",items:["Years since birth","Precise and universal","Does not show health status on its own"]},right:{title:"Biological age",items:["An estimate of functional and molecular state","No single agreed measurement","Research tools are still being validated"]}}),_(6,"nutrition-life-stages","Nutrition across life stages","Emphasis shifts across life. The table describes common priorities, not rules for any individual.","Four columns showing nutrition priorities for young adulthood, middle adulthood, later adulthood and very old age.",{kind:"pillars",cols:[{title:"Young adulthood",items:["Energy for growth and activity","Building bone with calcium and vitamin D","Regular vegetables, fruit and fibre"]},{title:"Middle adulthood",items:["Weight and blood-pressure aware eating","Fibre, unsaturated fats and limited salt","Adequate protein to maintain muscle"]},{title:"Later adulthood",items:["Protein for muscle at each meal","Vitamin B12 and vitamin D checks","Regular fluids and fibre"]},{title:"Very old age",items:["Nutrient-dense, appetising food","Texture changes if swallowing is affected","Mealtimes that are social and comfortable"]}]}),_(7,"balanced-meal","Balanced meal composition","A widely used plate model. Adapt the proportions and foods to your culture, budget and health needs.","A plate divided into three segments: half vegetables and fruit, a quarter wholegrains and a quarter protein.",{kind:"plates",plates:[{title:"Balanced plate",note:"Add water as the main drink.",segs:[{label:"Vegetables and fruit",share:50,tone:"a"},{label:"Wholegrains and starchy foods",share:25,tone:"b"},{label:"Protein foods",share:25,tone:"c"}]}]}),_(8,"protein-muscle","Protein and muscle maintenance","Illustrative pattern only, showing grams per meal in two distribution styles. These figures are not dietary targets.","Two bar groups comparing protein spread evenly across three meals with protein concentrated at dinner.",{kind:"bars",max:50,note:"Illustrative values for teaching only. Individual needs vary.",rows:[{label:"Spread across meals",segs:[{v:25,label:"Breakfast",tone:"a"},{v:25,label:"Lunch",tone:"a"},{v:25,label:"Dinner",tone:"a"}]},{label:"Concentrated at dinner",segs:[{v:5,label:"Breakfast",tone:"b"},{v:10,label:"Lunch",tone:"b"},{v:45,label:"Dinner",tone:"b"}]}]}),_(9,"bone-remodelling","Bone remodelling","Bone is continuously renewed. Load, calcium, vitamin D and hormones influence the balance between breakdown and formation.","A cycle of five stages: resorption, reversal, formation, mineralisation and rest.",{kind:"cycle",steps:[{title:"Resorption",text:"Osteoclasts break down a small area of old bone."},{title:"Reversal",text:"The surface is prepared for new bone."},{title:"Formation",text:"Osteoblasts lay down new bone matrix."},{title:"Mineralisation",text:"Calcium and phosphate harden the new bone."},{title:"Rest",text:"The site rests until the next cycle begins."}],closing:"In healthy adults the cycle is balanced. With age, breakdown can outpace formation."}),_(10,"micronutrients","Micronutrient overview","Key micronutrients in later life. Testing and professional advice are better than guessing.","Eight cards describing vitamin B12, vitamin D, calcium, iron, folate, magnesium, zinc and potassium.",{kind:"cards",cols:4,cards:[{title:"Vitamin B12",text:"Nerves and red blood cells. Food-bound absorption can fall with age; check status if at risk."},{title:"Vitamin D",text:"Calcium absorption and muscle. Sunlight, season and housebound living affect status."},{title:"Calcium",text:"Bones and teeth. Dairy, fortified alternatives, tofu set with calcium and leafy greens."},{title:"Iron",text:"Oxygen transport. Deficiency is common in some groups; excess is harmful."},{title:"Folate",text:"Red blood cells and DNA synthesis. Leafy greens, pulses and fortified foods."},{title:"Magnesium",text:"Muscle and nerve function. Nuts, seeds, pulses and whole grains."},{title:"Zinc",text:"Immunity, wound healing and taste. Meat, shellfish, legumes and dairy."},{title:"Potassium",text:"Blood pressure and fluid balance. Fruit, vegetables and pulses; caution with kidney disease."}]}),_(11,"hydration","Hydration and dehydration awareness","A simple awareness scale. Your personal target should be set with your clinician if you have a fluid restriction.","A three-zone scale from well hydrated, through mild shortfall, to seek advice, with signs for each zone.",{kind:"gauge",marker:.2,zones:[{label:"Well hydrated",text:"Pale straw urine, normal thirst, no dizziness.",tone:"a"},{label:"Mild shortfall",text:"Darker urine, dry mouth or headache. Drink regularly and recheck.",tone:"b"},{label:"Seek advice",text:"Confusion, very little urine, fainting, or vomiting or diarrhoea that will not stop.",tone:"c"}]}),_(12,"food-patterns","Food-pattern comparison","A qualitative summary of typical emphasis. Patterns vary within each category.","A matrix comparing four dietary patterns across vegetables and fruit, legumes, whole grains, nuts and seeds, fish, and red and processed meat.",{kind:"matrix",key:"● central emphasis   ◐ moderate   ○ limited",cols:["Mediterranean-style","DASH-style","Plant-forward","Traditional regional"],rows:[{label:"Vegetables and fruit",cells:["●","●","●","●"]},{label:"Legumes",cells:["●","◐","●","◐"]},{label:"Whole grains",cells:["●","●","●","◐"]},{label:"Nuts and seeds",cells:["●","◐","◐","◐"]},{label:"Fish",cells:["●","◐","○","◐"]},{label:"Red and processed meat",cells:["○","○","○","◐"]}]}),_(13,"supplement-evidence","Supplement evidence hierarchy","A simple hierarchy from the most supported approach at the top to claims that should be avoided at the bottom.","A five-level pyramid from food first at the top to unproven or harmful claims at the bottom.",{kind:"pyramid",levels:[{title:"1. Food first",text:"The foundation of nutrition, with the strongest overall support."},{title:"2. Clinically confirmed need",text:"Supplements prescribed after testing or diagnosis."},{title:"3. Specific group guidance",text:"Recommended for defined groups, such as vitamin D for people with little sun exposure."},{title:"4. Limited or mixed evidence",text:"Many general multivitamins and herbal products, with uncertain benefit."},{title:"5. Unproven or harmful claims",text:"Products promising to reverse ageing or boost immunity without trial evidence."}]}),_(14,"muscle-ageing","Muscle ageing illustration","Schematic cross-section. The older example shows fewer and smaller fibres with more fat between them.","Two cross-sections of muscle. The younger example has uniform fibres. The older example has fewer, smaller fibres and fat between them.",{kind:"anatomy",variant:"muscle",legend:[{n:1,title:"Muscle fibres",text:"Fewer and smaller in the older example, which is typical in some people but not all."},{n:2,title:"Fat between fibres",text:"Intramuscular fat can increase with inactivity and age, reducing muscle quality."},{n:3,title:"Connective tissue",text:"Supports the fibres and transmits force to tendons."}]}),_(15,"sarcopenia","Sarcopenia educational diagram","A simplified assessment pathway based on the EWGSOP2 consensus. Diagnosis belongs to a clinician.","Four steps: screen strength, confirm muscle quantity or quality, assess performance, then plan with a clinician.",{kind:"steps",steps:[{title:"1. Screen strength",text:"Assess grip strength or a chair-stand test."},{title:"2. Confirm muscle",text:"Measure muscle quantity or quality where available."},{title:"3. Assess performance",text:"Check gait speed or a short physical performance test."},{title:"4. Plan with a clinician",text:"Confirm severity, plan resistance training, nutrition and any further tests."}]}),_(16,"cardio-principles","Cardiovascular exercise principles","The FITT framework adapted for older adults. Build gradually and adjust to your health advice.","Four cards describing frequency, intensity, time and type of aerobic activity, plus progression.",{kind:"cards",cols:4,cards:[{title:"Frequency",text:"Most days of the week, spread across the week and the day."},{title:"Intensity",text:"Use the talk test: moderate allows conversation; vigorous makes it hard."},{title:"Time",text:"Work towards 150 to 300 minutes of moderate activity a week, building gradually."},{title:"Type",text:"Walking, cycling, swimming, dancing or other rhythmic activity you enjoy."}]}),_(17,"strength-fundamentals","Strength-training fundamentals","Seven movement patterns cover the main demands of everyday life. Choose safe variations for your ability.","Seven cards for push, pull, sit-to-stand, hinge, step, carry and trunk control exercises.",{kind:"cards",cols:3,cards:[{title:"Push",text:"Wall or kitchen-counter press-ups."},{title:"Pull",text:"Band rows or towel rows."},{title:"Sit-to-stand",text:"Rising from a firm chair with support."},{title:"Hinge",text:"Glute bridges or lifting from the hips."},{title:"Step",text:"Step-ups onto a low step with a rail."},{title:"Carry",text:"Carrying bags or a laundry basket with good posture."},{title:"Trunk control",text:"Seated or standing rotation with light resistance."}]}),_(18,"balance-systems","Balance systems","Vision, the inner ear, proprioception and the brain work together to control balance.","Hub diagram with the brain coordinating vision, vestibular, proprioceptive and muscle systems.",{kind:"hub",center:{title:"Balance control",text:"The brain integrates signals and coordinates responses."},nodes:[{title:"Vision",text:"Judges position, movement and the ground."},{title:"Vestibular system",text:"Senses head movement and orientation in the inner ear."},{title:"Proprioception",text:"Joint, muscle and skin sensors report body position."},{title:"Muscle responses",text:"Strength and reaction speed allow correction."}]}),_(19,"fall-prevention-home","Fall-prevention home diagram","A simplified floor plan. Red markers show hazards; green markers show improvements. This is a teaching example, not a building survey.","Floor plan of a home with numbered hazard and improvement markers, explained in a legend.",{kind:"floorplan",rooms:[{x:5,y:5,w:40,h:28,label:"Living room"},{x:50,y:5,w:45,h:28,label:"Kitchen"},{x:5,y:38,w:90,h:14,label:"Hallway"},{x:5,y:57,w:40,h:36,label:"Bedroom"},{x:50,y:57,w:45,h:36,label:"Bathroom"}],markers:[{n:1,x:22,y:18,tone:"hazard"},{n:2,x:40,y:45,tone:"hazard"},{n:3,x:72,y:75,tone:"hazard"},{n:4,x:90,y:30,tone:"hazard"},{n:5,x:65,y:18,tone:"hazard"},{n:6,x:60,y:90,tone:"improve"},{n:7,x:85,y:84,tone:"improve"},{n:8,x:30,y:62,tone:"improve"}],legend:[{n:1,title:"Loose rug",text:"Secure with non-slip backing or remove it."},{n:2,title:"Trailing cable",text:"Move cables out of the walkway."},{n:3,title:"No grab rail",text:"Fit a secure rail by the toilet and bath."},{n:4,title:"Poor stair lighting",text:"Add bright, even light and visible step edges."},{n:5,title:"Clutter on the worktop",text:"Keep frequently used items at a reachable height."},{n:6,title:"Night light",text:"Light the route from the bedroom to the bathroom."},{n:7,title:"Non-slip bath mat",text:"Use a mat that stays in place."},{n:8,title:"Clear route",text:"Keep the bedroom path clear of obstacles."}]}),_(20,"joint-mobility","Joint mobility illustration","Schematic of a synovial joint showing cartilage, synovial fluid and range of motion.","Schematic joint with labelled cartilage, synovial fluid and an arc representing range of motion.",{kind:"anatomy",variant:"joint",legend:[{n:1,title:"Cartilage",text:"Covers bone ends and reduces friction; it has no direct blood supply."},{n:2,title:"Synovial fluid",text:"Lubricates the joint and helps nourish cartilage through movement."},{n:3,title:"Range of motion",text:"The comfortable arc of movement a joint can achieve. Gentle movement helps maintain it."}]}),_(21,"everyday-movement","Everyday movement infographic","Ordinary tasks can contribute to endurance, strength and balance when done safely.","Eight cards describing everyday activities and the fitness qualities they build.",{kind:"cards",cols:4,cards:[{title:"Walking",text:"Builds endurance and leg strength."},{title:"Gardening",text:"Combines bending, lifting and sustained arm use."},{title:"Housework",text:"Sweeping, mopping and laundry build activity in short bursts."},{title:"Dancing",text:"Adds rhythm, balance and social enjoyment."},{title:"Carrying shopping",text:"Builds grip, shoulder and trunk strength."},{title:"Stair climbing",text:"Builds leg strength; use a rail and go carefully."},{title:"Standing breaks",text:"Interrupt long periods of sitting."},{title:"Active play",text:"Varied, enjoyable movement with children or pets."}]}),_(22,"recovery-cycle","Exercise recovery cycle","Adaptation happens during recovery. Too little recovery can stall progress.","A cycle of five stages: train, recover, adapt, progress and monitor.",{kind:"cycle",steps:[{title:"Train",text:"Apply a manageable challenge."},{title:"Recover",text:"Sleep, nutrition, rest days and lighter activity."},{title:"Adapt",text:"Strength and fitness improve as the body adjusts."},{title:"Progress",text:"Increase the challenge gradually."},{title:"Monitor",text:"Note how you feel, how you sleep and how activity goes."}],closing:"Repeat the cycle. Stop and seek advice if symptoms are unusual or concerning."}),_(23,"brain-anatomy","Brain anatomy educational illustration","A schematic of brain regions discussed in this part of the book. It is not drawn to scale.","Schematic side view of the brain with numbered regions for frontal, parietal, occipital and temporal lobes, the hippocampus and the cerebellum.",{kind:"anatomy",variant:"brain",legend:[{n:1,title:"Frontal lobe",text:"Planning, decision-making, working memory and voluntary movement."},{n:2,title:"Parietal lobe",text:"Touch, spatial awareness and integration of sensory information."},{n:3,title:"Occipital lobe",text:"Visual processing."},{n:4,title:"Temporal lobe",text:"Hearing, language comprehension and memory."},{n:5,title:"Hippocampus",text:"Central to forming new memories."},{n:6,title:"Cerebellum",text:"Coordination and balance."}]}),_(24,"memory-systems","Memory systems","Memory is not one process. These three stages describe how information is held, used and stored.","Three columns describing sensory memory, working memory and long-term memory.",{kind:"pillars",cols:[{title:"Sensory memory",items:["Very brief impressions of sights and sounds","Most is quickly lost unless attended to"]},{title:"Working memory",items:["Holds and manipulates a small amount of information","Used for following directions and mental arithmetic"]},{title:"Long-term memory",items:["Episodic: personal events","Semantic: facts and meanings","Procedural: skills and habits"]}]}),_(25,"neuroplasticity","Neuroplasticity","Practice can strengthen connections between neurons. The schematic shows the idea, not measured data.","Schematic of neurons with thin and thick synaptic connections, showing practice strengthening links.",{kind:"anatomy",variant:"synapse",legend:[{n:1,title:"Neurons",text:"Cells that transmit signals across networks."},{n:2,title:"Synapses",text:"Junctions that can be strengthened or weakened with experience."},{n:3,title:"Branching connections",text:"Practice can encourage new and stronger connections over time."}]}),_(26,"normal-vs-concerning","Normal ageing versus concerning cognitive changes","Examples only. Any new or worsening change that affects daily life deserves professional assessment.","Two columns comparing changes often seen in normal ageing with changes that warrant assessment.",{kind:"compare",left:{title:"Often part of normal ageing",items:["Occasionally forgetting a name but recalling it later","Needing a shopping list more often","Taking longer to learn new technology","An occasional word-finding slip"]},right:{title:"Warrants professional assessment",items:["Repeatedly forgetting recent conversations or events","Getting lost in familiar places","Difficulty with familiar tasks such as following a recipe","New difficulty managing money or medicines","Personality or mood changes"]}}),_(27,"dementia-awareness","Dementia-awareness infographic","The ten warning signs listed by the Alzheimer’s Association. They are reasons to seek assessment, not a self-diagnosis.","Ten numbered cards describing warning signs of Alzheimer’s disease and related dementias.",{kind:"cards",cols:4,cards:[{title:"1. Memory that disrupts life",text:"Forgetting recently learned information or important dates."},{title:"2. Planning and problem-solving",text:"Difficulty with plans or numbers that were once familiar."},{title:"3. Familiar tasks",text:"Trouble completing routine tasks at home or at work."},{title:"4. Time and place",text:"Losing track of dates, seasons or where they are."},{title:"5. Visual and spatial",text:"Difficulty judging distance or reading images."},{title:"6. Words",text:"New problems with speaking or writing."},{title:"7. Misplacing things",text:"Losing items and being unable to retrace steps."},{title:"8. Judgement",text:"Poor or changed decisions, such as with money."},{title:"9. Withdrawal",text:"Stepping back from work, hobbies or social life."},{title:"10. Mood and personality",text:"Confusion, suspicion, anxiety or changed personality."}]}),_(28,"brain-lifestyle","Brain-health lifestyle factors","Many factors that support the heart and body also support brain health. Benefits are probabilistic, not guaranteed.","Hub diagram with eight lifestyle factors around the phrase brain health.",{kind:"hub",center:{title:"Brain health",text:"Risk reduction, not a guarantee."},nodes:[{title:"Cardiovascular health",text:"Blood pressure, cholesterol and blood sugar."},{title:"Nutrition",text:"Varied, vegetable-rich eating."},{title:"Physical activity",text:"Regular aerobic and strength activity."},{title:"Sleep",text:"Regular, sufficient sleep and treatment of sleep disorders."},{title:"Social connection",text:"Relationships, groups and roles."},{title:"Hearing and vision",text:"Regular checks and aids where needed."},{title:"Stress and mood",text:"Support for depression, anxiety and chronic stress."},{title:"Avoiding harm",text:"No tobacco and moderate alcohol."}]}),_(29,"lifelong-learning","Lifelong learning infographic","A repeating cycle that keeps learning sustainable and enjoyable.","Cycle of five stages: choose, practise, connect, reflect and review.",{kind:"cycle",steps:[{title:"Choose",text:"Pick an interest that matters to you."},{title:"Practise",text:"Short, regular sessions of ten to fifteen minutes."},{title:"Connect",text:"Learn with others when possible."},{title:"Reflect",text:"Notice what you enjoyed and what felt useful."},{title:"Review",text:"Adjust the activity and choose the next step."}],closing:"Enjoyment and variety matter more than perfection."}),_(30,"digital-accessibility","Digital accessibility examples","Accessible design helps everyone, and it is especially important for people with sensory, motor or cognitive differences.","Six cards describing digital accessibility features such as large text, screen readers, captions and simple layouts.",{kind:"cards",cols:3,cards:[{title:"Large text and high contrast",text:"Adjustable size and colour contrast make reading easier."},{title:"Screen readers",text:"Software reads headings, links and labels aloud."},{title:"Captions and transcripts",text:"Text alternatives for audio and video content."},{title:"Voice input",text:"Dictation and voice assistants support people who find typing hard."},{title:"Keyboard navigation",text:"Full access without a mouse, with visible focus."},{title:"Simple layouts",text:"Clear labels, logical order and fewer distractions."}]}),_(31,"sleep-architecture","Sleep architecture","An illustrative night with stages shown over time. Real nights vary, and deep sleep often decreases with age.","Stepped chart of sleep stages across a night: wake, REM, light sleep and deep sleep.",{kind:"hypnogram",epochs:[0,1,2,2,3,3,3,2,4,2,3,3,2,4,4,2,2,3,2,4,2,1,2,3,2,4,4,2,1,0,2,4,2,0],note:"Illustrative pattern only."}),_(32,"circadian-rhythm","Circadian rhythm","Illustrative curves for alertness and melatonin over 24 hours. Individual timing varies, and timing often shifts earlier with age.","Two curves over 24 hours. Alertness rises in the morning and dips at night. Melatonin rises in the evening and falls in the morning.",{kind:"curve",labels:["0h","3h","6h","9h","12h","15h","18h","21h","24h"],yLabel:"Relative level (illustrative)",series:[{label:"Alertness",values:[20,10,35,80,85,65,80,55,25],tone:"a"},{label:"Melatonin",values:[70,85,40,10,5,10,30,65,80],tone:"b"}],note:"Curves are schematic. They are not measured data."}),_(33,"stress-response","Stress-response pathway","A simplified pathway. Short-term responses help; repeated activation without recovery can add wear and tear.","Five steps from a perceived stressor through alert, cortisol release, recovery and chronic activation.",{kind:"steps",steps:[{title:"1. Stressor perceived",text:"The brain detects a threat or demand."},{title:"2. Alert",text:"The sympathetic nervous system raises heart rate and sharpens attention."},{title:"3. Mobilise",text:"The HPA axis releases cortisol to mobilise energy and regulate inflammation."},{title:"4. Recovery",text:"The body returns to baseline when the stressor passes."},{title:"5. Chronic activation",text:"Repeated stress without recovery can contribute to wear and tear."}]}),_(34,"emotional-wellbeing","Emotional wellbeing framework","Several domains support emotional wellbeing. Professional help is important when low mood or anxiety persists.","Hub diagram with six domains of emotional wellbeing around a central label.",{kind:"hub",center:{title:"Emotional wellbeing",text:"Supported by many connected domains."},nodes:[{title:"Connection",text:"Relationships that feel supportive and reliable."},{title:"Meaning and purpose",text:"Activities and values that matter."},{title:"Competence and autonomy",text:"Feeling capable and in control of choices."},{title:"Calm and recovery",text:"Rest, breathing and enjoyable pauses."},{title:"Self-compassion",text:"Treating yourself kindly through difficulty."},{title:"Support when needed",text:"Asking for help from people and services."}]}),_(35,"social-map","Social connection map","A map of relationship circles, from the self outward. Each circle offers different kinds of support.","Nested rings from the outer circle of wider society to the inner circle of self, with examples of connection in each.",{kind:"rings",rings:[{title:"Wider society and digital networks",text:"Online communities, public spaces and civic life."},{title:"Community and groups",text:"Clubs, faith or cultural groups, volunteering and neighbours."},{title:"Close friends",text:"Regular contact, shared interests and mutual support."},{title:"Family",text:"Long-standing bonds, shared history and practical help."},{title:"Self",text:"Your own wellbeing, values and daily choices."}]}),_(36,"purpose-framework","Purpose and meaning framework","Four lenses can help identify what gives life meaning. Use the lens that feels most useful.","Four quadrants: values, roles, relationships and contribution, each with a short prompt.",{kind:"quad",items:[{title:"Values",text:"What matters most to me, and how I want to live?"},{title:"Roles",text:"Which roles give me a sense of identity and responsibility?"},{title:"Relationships",text:"Who do I care for, and who cares for me?"},{title:"Contribution",text:"What can I give back to my community?"}]}),_(37,"transitions","Retirement and life-transition illustration","Life transitions often change routines, roles and relationships. Planning and support help people adjust.","Timeline of six common life transitions, with notes on whether they are planned or sudden.",{kind:"timeline",items:[{when:"Often planned",title:"Retirement",text:"Changes routine, income and social contact. Plan structure and interests."},{when:"Planned or sudden",title:"Relocation",text:"Changes access to services and neighbours. Visit first and check local services."},{when:"Often sudden",title:"Bereavement",text:"Brings grief and practical tasks. Support from others is valuable."},{when:"Gradual",title:"Changing family roles",text:"Children leave, grandchildren arrive and responsibilities shift."},{when:"Often unplanned",title:"Caregiving",text:"Brings new responsibilities. Plan support and respite early."},{when:"Planned or sudden",title:"Financial change",text:"Review income, benefits and costs with independent advice."}]}),_(38,"preventive-timeline","Preventive-care timeline","Illustrative only. Screening and vaccination schedules differ by country and individual risk. Follow national programmes and your clinician’s advice.","Timeline of preventive care across early adulthood, midlife, later life and every life stage.",{kind:"timeline",items:[{when:"Early adulthood",title:"Foundations",text:"Blood pressure, cholesterol and blood sugar checks where offered; vaccinations and screening per national programmes."},{when:"Midlife",title:"Risk review",text:"Cardiovascular and diabetes risk review; bowel or breast screening where offered; hearing and vision checks."},{when:"Later life",title:"Function and safety",text:"Falls and balance review; bone-density assessment when indicated; vaccination updates; sensory checks."},{when:"Every life stage",title:"Keep it personal",text:"Maintain a health summary, discuss family history and act on symptoms promptly."}]}),_(39,"cv-risk","Cardiovascular risk-factor diagram","Many cardiovascular risk factors can be modified, and some can be treated. Others, such as age and family history, cannot be changed.","Two columns: modifiable or treatable risk factors on the left and factors that cannot be changed on the right.",{kind:"compare",left:{title:"Modifiable or treatable",items:["Blood pressure","LDL cholesterol","Blood sugar","Smoking","Physical inactivity","Diet and alcohol","Body weight","Sleep apnoea"]},right:{title:"Not modifiable",items:["Age","Sex","Family history","Some inherited conditions"]}}),_(40,"vision-hearing","Vision and hearing awareness","Common changes and the signs that need prompt attention. Regular checks catch many problems early.","Two columns: vision changes and hearing changes, each with common examples and urgent warning signs.",{kind:"compare",left:{title:"Vision",items:["Near focus can blur (presbyopia)","Cataract can cloud vision","Glaucoma may progress without symptoms","Sudden vision loss needs urgent care"]},right:{title:"Hearing",items:["High-pitched sounds are often harder to hear","Conversation in noise can become difficult","Hearing aids and communication strategies can help","Sudden hearing loss needs prompt assessment"]}}),_(41,"medication-checklist","Medication-safety checklist","Use this checklist before a medication review. Tick items as you go; ticks are not saved.","Three checklist groups: preparing for a review, questions to ask, and safe habits.",{kind:"checklist",groups:[{title:"Before a review",items:["Bring all medicines, including over-the-counter and herbal products","Note the reason for each medicine","List any side effects you have noticed"]},{title:"Questions to ask",items:["Is each medicine still needed?","Could any medicine cause dizziness or falls?","Are any medicines unsafe together?"]},{title:"Safe habits",items:["Never stop a prescribed medicine suddenly without advice","Use a pill organiser or reminder if helpful","Ask a pharmacist before starting an over-the-counter product"]}]}),_(42,"skin-protection","Skin protection infographic","A memorable sequence from Cancer Council Australia’s sun-safety messages. Use it alongside shade and clothing.","Five steps: slip on a shirt, slop on sunscreen, slap on a hat, seek shade and slide on sunglasses.",{kind:"steps",steps:[{title:"Slip",text:"Cover up with a shirt or protective clothing."},{title:"Slop",text:"Apply broad-spectrum sunscreen of at least SPF 30 and reapply regularly."},{title:"Slap",text:"Wear a wide-brimmed hat."},{title:"Seek",text:"Seek shade, especially when the sun is strongest."},{title:"Slide",text:"Wear sunglasses that protect against UV."}]}),_(43,"immune-overview","Immune-system overview","The immune system has fast general defences and slower targeted responses. Ageing changes its balance, and protection measures can help.","Three columns describing innate immunity, adaptive immunity and protective measures.",{kind:"pillars",cols:[{title:"Innate immunity",items:["Fast, general defence","Skin, mucus, white blood cells and inflammation"]},{title:"Adaptive immunity",items:["Targeted defence","T cells, B cells, antibodies and immune memory","Vaccines train this system safely"]},{title:"Ageing and protection",items:["Responses can be slower with age (immunosenescence)","Vaccination and hand hygiene","Adequate nutrition and sleep support normal function"]}]}),_(44,"chronic-framework","Chronic-condition management framework","Living well with a long-term condition involves a team, daily self-management and support for independence.","Hub diagram with eight elements of managing a long-term condition around a central label.",{kind:"hub",center:{title:"Living well with a long-term condition",text:"Personal goals guide every part of care."},nodes:[{title:"Care team",text:"Coordinated professionals who share information."},{title:"Medicines",text:"Safe, agreed and reviewed treatment."},{title:"Monitoring",text:"Simple checks and an agreed action plan."},{title:"Activity",text:"Adapted movement that fits the condition."},{title:"Nutrition",text:"Practical eating within the treatment plan."},{title:"Emotional support",text:"Help for stress, low mood and worry."},{title:"Self-management skills",text:"Problem-solving and confidence."},{title:"Daily-living support",text:"Adaptations and services that maintain independence."}]}),_(45,"daily-routine","Daily healthy-ageing routine","An illustrative day. Times are examples only; adapt the routine to your life and health advice.","Timeline of six daily routine moments from morning to evening, each with a healthy-ageing habit.",{kind:"timeline",items:[{when:"Morning",title:"Water and mobility",text:"A glass of water on waking and a five-minute mobility routine."},{when:"Breakfast",title:"Daylight and protein",text:"Eat protein and fibre, and spend a few minutes in daylight."},{when:"Midday",title:"Balanced lunch and a walk",text:"Use the plate template and take a short walk."},{when:"Afternoon",title:"Movement and connection",text:"Stand up every 30 to 60 minutes and contact one person."},{when:"Evening",title:"Balanced dinner",text:"Vegetables, wholegrains and a protein food, eaten calmly."},{when:"Bedtime",title:"Wind-down",text:"Dim lights, a calm routine and a consistent bedtime."}]}),_(46,"generational-priorities","Generational health priorities","Common priorities by life stage. Individuals differ widely, and these are not rigid age rules.","Four columns showing typical health priorities for young adults, middle-aged adults, older adults and very old people.",{kind:"pillars",cols:[{title:"Young adults",items:["Build bone and muscle","Establish activity and sleep habits","Protect mental health","Plan finances for later life"]},{title:"Middle-aged adults",items:["Check blood pressure, cholesterol and blood sugar","Manage stress and work–life balance","Keep strength and activity","Review medicines"]},{title:"Older adults",items:["Protect balance and prevent falls","Maintain hearing and vision","Stay socially connected","Plan home adaptations"]},{title:"Very old age",items:["Comfort and dignity","Relationships and familiar routines","Nutrition and hydration","Choices and advance planning"]}]}),_(47,"adaptive-exercise","Adaptive exercise examples","Examples of adapted activity. Ask a physiotherapist or clinician to tailor a programme to your needs.","Six cards showing adapted exercise options: seated, supported standing, floor-based, water-based, upper-body and breathing-and-balance practices.",{kind:"cards",cols:3,cards:[{title:"Seated strength",text:"Chair-based leg extensions, arm raises and band work."},{title:"Supported standing",text:"Standing exercises holding a stable support."},{title:"Floor-based with support",text:"Exercises on a mat with help nearby for getting up."},{title:"Water-based",text:"Movement in water reduces load on joints."},{title:"Upper body and trunk",text:"Band rows, presses and trunk rotation, seated or with a wheelchair."},{title:"Breathing and balance",text:"Breath control, gentle balance and posture practice."}]}),_(48,"caregiving-framework","Caregiving support framework","A framework for sharing care and protecting dignity, with the person at the centre.","Hub diagram with the person at the centre and six supporting elements of caregiving.",{kind:"hub",center:{title:"The person at the centre",text:"Choices, dignity and preferences guide care."},nodes:[{title:"Shared responsibilities",text:"Clear roles and fair task sharing."},{title:"Communication",text:"Listening, choices and respectful information."},{title:"Caregiver wellbeing",text:"Breaks, health checks and support for the caregiver."},{title:"Respite and services",text:"Planned breaks and community services."},{title:"Professional support",text:"Clinical, therapy and social-care input."},{title:"Legal and financial planning",text:"Advice on decisions, documents and costs."}]}),_(49,"accessible-home","Accessible home design","A teaching floor plan showing accessibility features. Real homes need individual assessment.","Floor plan with six numbered accessibility improvements, explained in a legend.",{kind:"floorplan",rooms:[{x:5,y:5,w:40,h:28,label:"Living area"},{x:50,y:5,w:45,h:28,label:"Kitchen"},{x:5,y:38,w:90,h:14,label:"Entrance hall"},{x:5,y:57,w:40,h:36,label:"Bedroom"},{x:50,y:57,w:45,h:36,label:"Level-access bathroom"}],markers:[{n:1,x:8,y:45,tone:"improve"},{n:2,x:48,y:46,tone:"improve"},{n:3,x:30,y:12,tone:"improve"},{n:4,x:70,y:80,tone:"improve"},{n:5,x:88,y:64,tone:"improve"},{n:6,x:62,y:42,tone:"improve"}],legend:[{n:1,title:"Step-free entrance",text:"A level or ramped entry with a clear width."},{n:2,title:"Lever handles",text:"Easier to operate than round knobs."},{n:3,title:"Bright, even lighting",text:"Reduces trips and supports reading."},{n:4,title:"Grab rails and level shower",text:"Secure support in the bathroom."},{n:5,title:"Reachable storage",text:"Frequently used items between waist and shoulder height."},{n:6,title:"Contrast strips on steps",text:"Makes edges easier to see."}]}),_(50,"social-determinants","Social determinants of healthy ageing","Health is shaped by many layers, from personal factors to policy and environment. Personal advice cannot replace broader action.","Nested rings from the outer layer of policy and environment to the inner layer of individual factors.",{kind:"rings",rings:[{title:"Policy and environment",text:"Housing, transport, climate, income systems and health services."},{title:"Community",text:"Social networks, age-friendly spaces and local resources."},{title:"Relationships",text:"Family, friends, neighbours and carers."},{title:"Individual factors",text:"Health behaviours, knowledge, skills and preferences."}]}),_(51,"cultural-diversity","Cultural diversity in ageing","Examples of diverse approaches. Every community contains great variety, so ask individuals rather than assuming.","Six cards describing varied cultural approaches to ageing and community, from multigenerational homes to urban networks.",{kind:"cards",cols:3,cards:[{title:"Multigenerational households",text:"Common in many regions, with strengths and strains."},{title:"Community kitchens and shared meals",text:"Food, company and practical support."},{title:"Movement traditions",text:"Tai chi, yoga, dance and walking in many communities."},{title:"Faith and community groups",text:"Belonging, ritual and mutual help, where people choose them."},{title:"Rural farming and gardening",text:"Daily activity that also provides food and social contact."},{title:"Urban neighbourhood networks",text:"Local groups, shared services and informal help."}]}),_(52,"evidence-hierarchy","Research evidence hierarchy","Generally, designs higher on the pyramid give stronger evidence about causation, but each design answers different questions.","Six-level pyramid from systematic reviews and meta-analyses at the top to animal and laboratory studies at the base.",{kind:"pyramid",levels:[{title:"Systematic reviews and meta-analyses",text:"Combine many studies; quality depends on the included studies."},{title:"Randomised controlled trials",text:"Test causation through random allocation."},{title:"Cohort studies",text:"Follow people over time; show associations."},{title:"Case-control and cross-sectional studies",text:"Useful for generating and checking hypotheses."},{title:"Case reports and expert opinion",text:"Valuable for observation; limited for proof."},{title:"Animal and laboratory studies",text:"Generate hypotheses; not proof of human benefit."}]}),_(53,"biomarker-limits","Biological-age testing limitations","Five questions to ask before acting on any biological-age or biomarker result.","Five columns: reliability, validity, clinical relevance, interpretation, and access and cost, each with questions to ask.",{kind:"pillars",cols:[{title:"Reliability",items:["Does it repeat consistently?","Does it change with sample handling?"]},{title:"Validity",items:["Does it measure what it claims?","Was it tested in people like me?"]},{title:"Clinical relevance",items:["Would the result change a decision?","Does evidence show better outcomes?"]},{title:"Interpretation",items:["Who explains the result?","Is the reference group appropriate?"]},{title:"Access and cost",items:["Is the test worth the cost?","What happens to my data?"]}]}),_(54,"longevity-overview","Emerging longevity research overview","Typical stages from laboratory discovery to approved treatment. Most candidates never reach the final stage.","Five steps from laboratory discovery through animal studies, early human studies and larger trials to regulatory approval.",{kind:"steps",steps:[{title:"1. Laboratory discovery",text:"Cell and molecular work on senescence, nutrient sensing and energy metabolism."},{title:"2. Animal studies",text:"Tests in mice and other species; results do not always transfer to people."},{title:"3. Early human studies",text:"Small studies that focus on safety and feasibility, such as senolytic combinations."},{title:"4. Larger randomised trials",text:"Trials with clinical outcomes, such as TAME, which has not yet reported results."},{title:"5. Regulatory approval",text:"Approved uses for specific conditions are established treatments."}]}),_(55,"lifestyle-framework","Evidence-supported lifestyle framework","Habits with the strongest practical foundations. They work best together and in consistent, sustainable forms.","Hub diagram with eight evidence-supported lifestyle foundations around a central label.",{kind:"hub",center:{title:"Evidence-supported foundations",text:"Consistent, combined habits."},nodes:[{title:"Avoid tobacco",text:"One of the most important steps at any age."},{title:"Physical activity",text:"Aerobic, strength and balance activity."},{title:"Balanced nutrition",text:"Varied, nutrient-dense eating."},{title:"Sleep",text:"Regular sleep of seven or more hours for most adults."},{title:"Social connection",text:"Regular contact and belonging."},{title:"Preventive care",text:"Check-ups, screening and vaccination."},{title:"Risk-factor management",text:"Blood pressure, cholesterol and blood sugar."},{title:"Avoid harmful substances",text:"Moderate alcohol and no misuse of medicines."}]}),_(56,"vitality-planning","Personal vitality planning","A simple planning loop that keeps a plan realistic and responsive.","Six steps: reflect, set priorities, choose habits, check resources, track progress and review.",{kind:"steps",steps:[{title:"1. Reflect on values th.","Hub diagram with six domains that contribute to independence and quality of life.",{kind:"hub",center:{title:"Independence and quality of life",text:"What people value most in later life."},nodes:[{title:"Physical capacity",text:"Strength, balance, fitness and sensory function."},{title:"Cognitive health",text:"Memory, attention and problem-solving."},{title:"Emotional wellbeing",text:"Mood, stress management and purpose."},{title:"Social connection",text:"Relationships, roles and community."},{title:"Safe environment",text:"Home, transport and neighbourhood."},{title:"Health and social services",text:"Timely care and support when needed."}]}),_(70,"lifelong-vitality","Final lifelong vitality infographic","Seven principles that connect the chapters of this book. Learn • Prepare • Thrive.","Seven cards summarising the principles of lifelong vitality.",{kind:"cards",cols:4,cards:[{title:"Move every day",text:"Include aerobic, strength and balance activity, adapted to your ability."},{title:"Eat for variety",text:"Vegetables, fruit, legumes, wholegrains and adequate protein."},{title:"Sleep consistently",text:"A regular routine, a comfortable room and treatment of sleep problems."},{title:"Stay connected",text:"Relationships, groups and roles that matter to you."},{title:"Keep learning and purpose",text:"Enjoyable learning and meaningful contribution."},{title:"Use preventive care",text:"Check-ups, screening, vaccination and medicine reviews."},{title:"Create supportive places",text:"Safe homes, communities and policies that make healthy choices possible."}]})],ko=Object.fromEntries(ei.map(l=>[l.id,l])),Wy=[["Activities of daily living (ADLs)","Basic self-care tasks such as washing, dressing, eating, toileting and moving from bed to chair.",1],["Adaptive exercise","Movement adapted with equipment, positions or techniques so that people with different abilities can train safely.",46],["Adequate intake","An estimated intake level used when there is not enough evide munity.",3],["Dysphagia","Difficulty swallowing, which can cause coughing, choking, chest infections or weight loss.",12],["DXA scan","Dual-energy X-ray absorptiometry, a common test of bone mineral density.",11],["Encoding","The first stage of memory, when information is attended to and processed for storage.",25],["Endocrine system","The network of glands and hormones that regulates growth, metabolism and many other functions.",42],["Epidemiology","The study of how often health conditions occur in populations and what influences them.",51],["Epigenetics","Chemical changes that influence gene activity without changing the DNA sequence.",4],["Episodic memory","Memory for personal experiences and events, including where and when they happened.",24],["Executive function","Mental skills such as planning, switching tasks, inhibition and self-monitoring.",24],["Falls risk","The likelihood of falling, influenced by balance, strength, vision, medicines, footwear and environment.",20],["Fibre","Plant material that the body does not fully digest, important for bowel regularity and gut health.",12],["Flexibility","The length and extensibility of muscles and connective tissue.",21],["Folate","The natural form of vitamin B9, needed for red blood cell production and DNA synthesis.",10],["Frailty","A state of increased vulnerability to stressors, measured by deficits across several health domains.",5],["Free sugars","Sugars added to foods and drinks, plus those naturally present in honey, syrups and fruit juices.",8],["Fragility fracture","A fracture caused by a fall from standing height or less, which can indicate osteoporosis.",11],["FRAX","A tool that estimates the ten-year probability of fracture using clinical risk factors and bone density.",11],["FITT principle","A framework for exercise planning: frequency, intensity, time and type.",18],["Gait speed","The speed of walking over a set distance, used as a measure of mobility and health.",17],["Genome","The complete set of ge
