zema)",category:"Dermatology & Safety",definition:"A chronic relapsing inflammatory skin disease characterized by intense pruritus, xerosis, barrier defects, and immune dysregulation.",contextOrExample:"Requires ongoing gentle emollient therapy and avoidance of known environmental irritants."},{id:"t-102",term:"Psoriasis",category:"Dermatology & Safety",definition:"A chronic immune-mediated systemic disease causing accelerated keratinocyte turnover, leading to sharply demarcated silvery-scaled plaques.",contextOrExample:"Frequently affects the scalp, elbows, knees, and nails."},{id:"t-103",term:"Rosacea",category:"Dermatology & Safety",definition:"A chronic inflammatory dermatosis causing central facial erythema, flushing, telangiectasias, and inflammatory papules or pustules.",contextOrExample:"Triggers include temperature extremes, spicy foods, alcohol, UV radiation, and Demodex mite proliferation."},{id:"t-104",term:"Acne Vulgaris",category:"Dermatology & Safety",definition:"A multifactorial disorder of the pilosebaceous unit involving hyperkeratinization, excess sebum, Cutibacterium acnes, and inflammation.",contextOrExample:"Ranging from non-inflammatory open/closed comedones to painful inflammatory nodules and cysts."},{id:"t-105",term:"Urticaria (Hives)",category:"Dermatology & Safety",definition:"Transient, intensely itchy erythematous wheals and edematous plaques caused by localized mast cell degranulation and histamine release.",contextOrExample:"Acute urticaria often resolves within days; lesions migrate and individually disappear within 24 hours."},{id:"t-106",term:"Vitiligo",category:"Dermatology & Safety",definition:"A chronic autoimmune disorder in which cytotoxic T-lymphocytes target and destroy melanocytes, resulting in macules of complete depigmentation.",contextOrExample:"Requires photoprotection on affected patches because depigmented skin has zero melanin defense."},{id:"t-107",term:"Melanoma",category:"Dermatology & Safety",definition:"A malignant neoplasm originating from melanocytes, representing the most lethal form of skin cancer.",contextOrExample:"Monitored via the ABCDE dermatological criteria (Asymmetry, Border, Color, Diameter, Evolving)."},{id:"t-108",term:"Basal Cell Carcinoma (BCC)",category:"Dermatology & Safety",definition:"The most frequent form of human skin cancer, arising from basal cells in the epidermis, usually presenting as a pearly or translucent papule.",contextOrExample:"Slow-growing and rarely metastasizes, but locally destructive if neglected."},{id:"t-109",term:"Squamous Cell Carcinoma (SCC)",category:"Dermatology & Safety",definition:"A malignant proliferation of cutaneous epidermal keratinocytes, often arising in sun-damaged skin or actinic keratosis precursor lesions.",contextOrExample:"Can appear as a persistent, non-healing scaly red patch or firm nodule."},{id:"t-110",term:"ABCDE Criteria",category:"Dermatology & Safety",definition:"A clinical screening acronym for melanoma: Asymmetry, Border irregularity, Color variation, Diameter >6mm, and Evolving change.",contextOrExample:"Any mole or lesion exhibiting one or more ABCDE signs mandates professional dermatological inspection."},{id:"t-111",term:"Ugly Duckling Sign",category:"Dermatology & Safety",definition:"A dermatological observation principle that a pigmented lesion that looks visibly distinct or different from all other moles is suspicious.",contextOrExample:"Helps identify potential melanomas even if they don’t cleanly fit all classic ABCDE traits."},{id:"t-112",term:"SPF (Sun Protection Factor)",category:"Skincare Ingredients",definition:"A laboratory measure of how much solar UV energy (primarily UVB) is required to produce erythema on protected skin compared to unprotected skin.",contextOrExample:"SPF 30 filters roughly 97% of UVB rays; SPF 50 filters approximately 98%."},{id:"t-113",term:"Broad-Spectrum UV Protection",category:"Skincare Ingredients",definition:"Sunscreen formulations proven to protect against both UVB radiation (burning) and UVA radiation (deep penetration, photoaging, and DNA alteration).",contextOrExample:"Indicated by the UVA circle logo in Europe or the broad-spectrum FDA claim."},{id:"t-114",term:"PA Rating System",category:"Skincare Ingredients",definition:"A Japanese and East Asian photoprotection rating system based on Persistent Pigment Darkening (PPD) reflecting UVA defense (from PA+ to PA++++).",contextOrExample:"PA++++ provides the highest tier of UVA protection (PPD 16 or greater)."},{id:"t-115",term:"INCI (International Nomenclature of Cosmetic Ingredients)",category:"Dermatology & Safety",definition:"A standardized international naming convention mandated on product packaging to identify cosmetic ingredients unambiguously.",contextOrExample:"Water is listed as Aqua, shea butter as Butyrospermum Parkii, and Vitamin E as Tocopherol."},{id:"t-116",term:"Period After Opening (PAO) Symbol",category:"Dermatology & Safety",definition:'An icon resembling an open jar with a number followed by "M" (e.g., 6M, 12M) indicating how many months the product remains safe after unsealing.',contextOrExample:"Using products beyond their PAO increases microbial contamination and active ingredient oxidation."},{id:"t-117",term:"Comedogenicity",category:"Skincare Ingredients",definition:"The potential of an ingredient or formulation to induce follicular hyperkeratosis and plug pores, forming comedones.",contextOrExample:"Comedogenic scale ratings from 0 to 5 are rough approximations based on rabbit ear models and vary greatly in real human skin."},{id:"t-118",term:"Colourism",category:"Dermatology & Safety",definition:"Prejudice or discrimination against individuals with darker skin tones, typically among people of the same ethnic or racial group.",contextOrExample:"HERBULANCE explicitly rejects colourism, dangerous skin bleaching, and toxic mercury lighteners."},{id:"t-119",term:"Mercury (in Cosmetics)",category:"Dermatology & Safety",definition:"A toxic heavy metal illegally added to counterfeit or unregulated skin-lightening creams that causes kidney damage, neuropathy, and paradoxically darkens skin.",contextOrExample:"Strictly banned internationally by the Minamata Convention on Mercury."},{id:"t-120",term:"Hydroquinone",category:"Skincare Ingredients",definition:"A potent tyrosinase inhibitor used medically for stubborn melasma and hyperpigmentation; restricted or prescription-only in many jurisdictions due to ochronosis risk.",contextOrExample:"Must be monitored by a physician and cycled to avoid paradoxical exogenous ochronosis."},{id:"t-121",term:"Exogenous Ochronosis",category:"Dermatology & Safety",definition:"A rare, difficult-to-treat dermatological condition causing blue-black hyperpigmentation following prolonged, unsupervised use of high-strength hydroquinone.",contextOrExample:"Highlighting why prescription depigmenting agents require medical oversight."},{id:"t-122",term:"Slugging",category:"Skincare Ingredients",definition:"A skincare practice of applying an occlusive petrolatum ointment over moisturized skin overnight to create an impermeable moisture seal.",contextOrExample:"Helpful for severely dry skin or barrier recovery, but may trap sebum and worsen active acne in oily individuals."},{id:"t-123",term:"Double Cleansing",category:"Skincare Ingredients",definition:"A two-step evening cleansing technique utilizing an oil-based cleanser first to melt sunscreen and sebum, followed by a water-based cleanser.",contextOrExample:"Effective for removing water-resistant sunscreen without harsh physical rubbing."},{id:"t-124",term:"Purging (Skincare)",category:"Skincare Ingredients",definition:"A temporary surge of blemishes occurring when an active ingredient that accelerates cell turnover (like retinoids or AHAs) brings microcomedones to the surface.",contextOrExample:"Typically lasts 4 to 6 weeks in areas where breakouts usually occur; sudden widespread rashes indicate irritation or allergy instead."},{id:"t-125",term:"Skin Tear",category:"Dermatology & Safety",definition:"A traumatic separation of the epidermis from the dermis, frequently seen in frail, atrophic skin of older adults due to minor friction or shearing forces.",contextOrExample:"Gentle emollient application and avoiding harsh medical adhesives prevent skin tears."},{id:"t-126",term:"Folliculitis",category:"Dermatology & Safety",definition:"Inflammation or superficial infection of one or more hair follicles, commonly presenting as itchy, tender small pustules.",contextOrExample:"Can be bacterial (Staph), fungal (Pityrosporum/Malassezia), or mechanical from tight synthetic workout gear."},{id:"t-127",term:"Pseudofolliculitis Barbae",category:"Dermatology & Safety",definition:"An inflammatory foreign-body reaction caused by curved hair shafts curling back and re-entering the skin after close shaving.",contextOrExample:"Particularly common in individuals with tightly curled or coily facial hair; improved by gentle single-blade shaving or trimming."},{id:"t-128",term:"Keloid",category:"Dermatology & Safety",definition:"An exaggerated fibroproliferative scar that extends beyond the original boundaries of an incision or wound, rich in dense type I collagen.",contextOrExample:"More common in deeply pigmented skin and requires caution with elective cosmetic incisions or piercings."},{id:"t-129",term:"Hyperkeratosis",category:"Skin Biology",definition:"Thickening of the stratum corneum often associated with increased keratin production in response to repetitive mechanical friction or disease.",contextOrExample:"Calluses on heels or palms are benign physiological examples of hyperkeratosis."},{id:"t-130",term:"Parabens",category:"Skincare Ingredients",definition:"A class of widely evaluated preservatives (e.g., methylparaben, ethylparaben) preventing bacterial and mold growth in aqueous cosmetic formulations.",contextOrExample:"Extensively reviewed and deemed safe at regulated low concentrations (<0.4%) by SCCS and CIR."},{id:"t-131",term:"Fragrance (Parfum)",category:"Skincare Ingredients",definition:"A proprietary blend of natural or synthetic scent compounds; one of the leading causes of cosmetic allergic contact dermatitis.",contextOrExample:"Fragrance-free formulations eliminate both synthetic scents and fragrant essential oils."},{id:"t-132",term:"Essential Oils",category:"Skincare Ingredients",definition:"Concentrated volatile plant hydrophobic liquids containing complex mixtures of terpenes and phenols (e.g., linalool, limonene, eugenol).",contextOrExample:"Natural does not mean non-irritating; undiluted essential oils can cause severe chemical burns and sensitization."},{id:"t-133",term:"Micellar Water",category:"Skincare Ingredients",definition:"A gentle cleansing liquid containing suspended surfactant micelles that attract dirt and oil without requiring vigorous mechanical scrubbing.",contextOrExample:"Useful for quick makeup removal, travel, or individuals with limited sink mobility."},{id:"t-134",term:"Microdermabrasion",category:"Dermatology & Safety",definition:"A non-invasive cosmetic physical exfoliation technique using abrasive crystals or diamond-tipped wands to remove stratum corneum cells.",contextOrExample:"Provides temporary smoothness but carries risks of erythema and PIH in darker skin tones if performed aggressively."},{id:"t-135",term:"Chemical Peel",category:"Dermatology & Safety",definition:"Application of a chemical exfoliating agent (glycolic, salicylic, or TCA) to cause controlled destruction of epidermal or dermal layers.",contextOrExample:"Deep peels require medical administration and strict post-treatment photoprotection."},{id:"t-136",term:"Microneedling",category:"Dermatology & Safety",definition:"A procedure utilizing tiny sterile needles to puncture the skin, creating micro-injuries that stimulate endogenous collagen and elastin synthesis.",contextOrExample:"Must be performed in sterile clinical settings to prevent granulomatous reactions and infections."},{id:"t-137",term:"Botulinum Toxin",category:"Dermatology & Safety",definition:"A neurotoxic protein injected by licensed medical professionals that temporarily blocks neuromuscular acetylcholine release to relax hyperactive muscles.",contextOrExample:"Softens dynamic expression lines (such as glabella furrow lines) for 3 to 6 months."},{id:"t-138",term:"Dermal Fillers",category:"Dermatology & Safety",definition:"Gel-like substances (predominantly cross-linked hyaluronic acid) injected to restore lost soft-tissue volume and contour facial structures.",contextOrExample:"Carries rare but severe medical risks including vascular occlusion and tissue necrosis if accidentally injected into an artery."},{id:"t-139",term:"Minoxidil",category:"Hair & Scalp",definition:"An FDA/EMA approved topical and low-dose oral medication that shortens telogen, prolongs anagen, and increases hair follicle size.",contextOrExample:"Validated at 2% and 5% topical solutions/foams for androgenetic alopecia; requires continuous use to sustain benefits."},{id:"t-140",term:"Finasteride",category:"Hair & Scalp",definition:"A Type II 5-alpha reductase inhibitor medication that blocks the conversion of testosterone to dihydrotestosterone (DHT).",contextOrExample:"Prescription-only medication approved for male pattern hair loss; teratogenic and contraindicated in pregnant females."},{id:"t-141",term:"Tinea Capitis",category:"Hair & Scalp",definition:"A fungal dermatophyte infection of the scalp and hair shafts, causing patchy scaly hair loss with broken hairs, common in schoolchildren.",contextOrExample:"Requires systemic prescription antifungal medication; topical shampoos alone cannot cure tinea capitis."},{id:"t-142",term:"Cradle Cap (Infantile Seborrhoeic Dermatitis)",category:"Hair & Scalp",definition:"A harmless, temporary scalp condition in newborns and infants causing greasy, yellow, crusty scales.",contextOrExample:"Usually resolves spontaneously within months with gentle baby oil application and soft brushing."},{id:"t-143",term:"Ketoconazole",category:"Hair & Scalp",definition:"A broad-spectrum imidazole antifungal agent formulated in medicated shampoos (1% OTC, 2% prescription) for dandruff and seborrhoeic dermatitis.",contextOrExample:"Suppresses Malassezia yeasts on the scalp and has mild anti-androgenic properties."},{id:"t-144",term:"Piroctone Olamine",category:"Hair & Scalp",definition:"A modern, gentle antifungal and antioxidant compound frequently formulated in cosmetic anti-dandruff shampoos.",contextOrExample:"Controls flake-causing microorganisms while maintaining hair softness."},{id:"t-145",term:"Zinc Pyrithione",category:"Hair & Scalp",definition:"A coordination complex of zinc with antimicrobial and antifungal properties long used in over-the-counter anti-dandruff cleansers.",contextOrExample:"Disrupts fungal cellular membrane transport in Malassezia yeasts."},{id:"t-146",term:"Coal Tar",category:"Hair & Scalp",definition:"A byproduct of coal processing with kerato-plastic, antipruritic, and mild antiseptic properties used for scalp psoriasis and severe eczema.",contextOrExample:"Has a strong odor and can temporarily stain light hair."},{id:"t-147",term:"Antiperspirant",category:"Dermatology & Safety",definition:"A product containing aluminum salts that dissolve in sweat to form temporary physical gel plugs in eccrine sweat gland ducts.",contextOrExample:"Reduces wetness and perspiration volume; distinct from deodorants which only mask odor."},{id:"t-148",term:"Deodorant",category:"Dermatology & Safety",definition:"A personal-care formulation containing antimicrobial agents and fragrance to neutralize or cover bacterial odor without stopping sweat production.",contextOrExample:"Does not plug eccrine glands or reduce physiological sweat output."},{id:"t-149",term:"Photodamage (Photoaging)",category:"Skin Biology",definition:"Skin damage caused by cumulative solar UV exposure, leading to coarse wrinkles, solar elastosis, mottled pigmentation, and telangiectasias.",contextOrExample:"Distinct from chronological (intrinsic) aging and largely preventable through photoprotection."},{id:"t-150",term:"Intrinsic Aging",category:"Skin Biology",definition:"The genetically programmed, chronological aging process of human tissues governed by cellular senescence, telomere shortening, and metabolic byproducts.",contextOrExample:"Characterized by gradual thinning, reduced collagen synthesis, and diminished dermal papillae."},{id:"t-151",term:"Extrinsic Aging",category:"Skin Biology",definition:"Accelerated aging caused by external environmental factors including ultraviolet radiation, air pollution, smoking, and poor sleep.",contextOrExample:"UV radiation is responsible for an estimated 80% of visible facial extrinsic aging."},{id:"t-152",term:"Xerosis Cutis",category:"Skin Biology",definition:"The medical term for abnormally dry skin resulting from deficient moisture and intercellular lipids in the stratum corneum.",contextOrExample:"Prevalent in dry winter climates and in older individuals due to declining sebaceous activity."},{id:"t-153",term:"Pruritus",category:"Dermatology & Safety",definition:"The unpleasant cutaneous sensation that provokes an urge to scratch; transmitted via unmyelinated C-nerve fibers in the skin.",contextOrExample:"Chronic pruritus can significantly disturb sleep and quality of life."},{id:"t-154",term:"Erythema",category:"Dermatology & Safety",definition:"Superficial reddening or violet discoloration of the skin caused by dilatation of dermal blood capillaries in response to injury or irritation.",contextOrExample:"Presents as bright red on fair skin, but may appear dusky, purplish, or warm brown on deeply pigmented skin."},{id:"t-155",term:"Hyperpigmentation",category:"Dermatology & Safety",definition:"A common, usually harmless condition where patches of skin become darker in color than the surrounding normal skin due to excess melanin deposition.",contextOrExample:"Includes solar lentigines (age spots), melasma, and post-acne dark marks."},{id:"t-156",term:"Hypopigmentation",category:"Dermatology & Safety",definition:"A reduction in normal skin color resulting from diminished melanin synthesis, often following inflammation (pityriasis alba) or burns.",contextOrExample:"Distinguished from vitiligo by having partial rather than complete loss of melanin pigment."},{id:"t-157",term:"Fitzpatrick Skin Phototypes",category:"Skin Biology",definition:"A numerical classification scale (Type I to Type VI) based on skin response to UV radiation regarding burning and tanning tendencies.",contextOrExample:"Type I burns easily and never tans; Type VI rarely burns and tans deeply; useful for assessing photoprotection needs."},{id:"t-158",term:"Milia",category:"Skin Biology",definition:"Tiny, firm, benign pearly-white cysts trapped beneath the epidermis containing keratin, commonly found around eyes and cheeks.",contextOrExample:"Unlike pimples, milia lack a pore opening and should not be squeezed at home."},{id:"t-159",term:"Comedone",category:"Dermatology & Safety",definition:"A clogged hair follicle pore. An open comedone is a blackhead (darkened by melanin and lipid oxidation); a closed comedone is a whitehead.",contextOrExample:"The non-inflammatory primary lesion of acne vulgaris."},{id:"t-160",term:"Acanthosis Nigricans",category:"Dermatology & Safety",definition:"A skin condition marked by velvety, hyperpigmented, papillomatous plaques in flexural folds (neck, armpits, groin).",contextOrExample:"Often serves as a dermatological sign of underlying insulin resistance or metabolic alterations."},{id:"t-161",term:"Demodex Folliculorum",category:"Skin Biology",definition:"Microscopic commensal mites that inhabit human pilosebaceous units, particularly on facial skin.",contextOrExample:"High densities can contribute to papulopustular rosacea and blepharitis."},{id:"t-162",term:"Cutibacterium acnes (C. acnes)",category:"Skin Biology",definition:"An anaerobic commensal bacterium residing within sebaceous follicles; plays a role in acne pathophysiology through proinflammatory enzyme release.",contextOrExample:"Formerly named Propionibacterium acnes."},{id:"t-163",term:"Malassezia",category:"Hair & Scalp",definition:"A genus of lipid-dependent commensal yeasts naturally residing on human skin and scalp.",contextOrExample:"Hydrolyzes sebum triglycerides into irritating free fatty acids that provoke dandruff and seborrhoeic dermatitis."},{id:"t-164",term:"pH (Skin Potential of Hydrogen)",category:"Skin Biology",definition:"A logarithmic measure of acidity or alkalinity on a scale of 0 to 14. Healthy skin surface pH averages 4.5 to 5.5 (mildly acidic).",contextOrExample:"Alkaline traditional bar soaps (pH 9-10) disrupt the acid mantle and impair lipid processing enzymes."},{id:"t-165",term:"Clean Beauty (Marketing Term)",category:"Dermatology & Safety",definition:"An unregulated marketing term with no legal or scientific definition, frequently relying on chemophobic fear-based advertising.",contextOrExample:"HERBULANCE encourages ingredient literacy based on verified toxicological science rather than clean beauty buzzwords."}];const Jf=u=>u?.replace(/([a-z0-9])([A-Z])/g,"$1-$2").toLowerCase();function $f(u,f,v=[]){if(f==null)throw new Error("[lucide]: iconNode is required when icon name is used");return{name:Jf(u),size:24,node:f,...v.length>0?{aliases:v}:{}}}const ey=u=>{let f="",v=!1;for(const c of u){if(c==="-"||c==="_"||c<=" "){v=f.length>0;continue}f.length===0?f+=c.toLowerCase():f+=v?c.toUpperCase():c,v=!1}return f};const iy=u=>{const f=ey(u);return f.charAt(0).toUpperCase()+f.slice(1)};const jl=(...u)=>u.filter((f,v,c)=>!!f&&f.trim()!==""&&c.indexOf(f)===v).join(" ").trim();const Ga={xmlns:"http://www.w3.org/2000/svg",width:24,height:24,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor","stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round"};function Cl(u){return u!=null}function ay( },{id:2,partId:1,category:"Skin Biology",format:"true-false",question:"True or False: Individuals with darker skin tones possess significantly more melanocytes per square millimeter than individuals with lighter skin tones.",options:["True","False"],correctIndex:1,explanation:"False. Humans across all skin phototypes have roughly the same density of melanocytes. Variations arise from the type of melanin (eumelanin vs pheomelanin), quantity, size, and dispersion of melanosomes."},{id:3,partId:1,category:"Skin Biology",format:"multiple-choice",question:"What is the physiological average pH range of the healthy adult skin acid mantle?",options:["pH 2.0 to 3.0","pH 4.5 to 5.5","pH 7.0 to 7.5","pH 8.5 to 9.5"],correctIndex:1,explanation:"The healthy surface skin acid mantle is mildly acidic, typically between pH 4.5 and 5.5, crucial for barrier lipid enzymes and antimicrobial defense."},{id:4,partId:1,category:"Skin Biology",format:"scenario",question:"A person washes their face with traditional lye bar soap (pH 9.5) and immediately feels intense tightness and stinging. What biological event occurred?",options:["The alkaline soap enhanced natural acid mantle synthesis.","The high pH temporarily disrupted stratum corneum intercellular lipids and elevated TEWL.","The stinging confirms that deep follicular detox is occurring.","Sebaceous glands immediately shut down permanently."],correctIndex:1,explanation:"Alkaline bar soaps swell keratin and strip intercellular barrier lipids, neutralizing the acid mantle and spiking transepidermal water loss."},{id:5,partId:1,category:"Skin Biology",format:"multiple-choice",question:"Which cells located in the dermis are primarily responsible for synthesizing collagen and elastin fibers?",options:["Keratinocytes","Melanocytes","Fibroblasts","Langerhans cells"],correctIndex:2,explanation:"Fibroblasts are the primary structural synthesis factories of the dermis, producing collagen, elastin, and extracellular glycosaminoglycans."},{id:6,partId:1,category:"Skin Biology",format:"myth-fact",question:"Myth vs Fact: Can pores open and close in response to hot and cold water?",options:["Fact: Pores have sphincter muscles that open in heat and close tightly in cold.","Myth: Pores lack muscular tissue; warm water merely softens oily debris and cold water briefly constricts blood vessels."],correctIndex:1,explanation:"Pores do not have muscles to open or close. Pore diameter is determined by genetics, sebaceous volume, and dermal collagen elasticity."},{id:7,partId:1,category:"Skin Biology",format:"multiple-choice",question:'What constitutes the intercellular "mortar" of the stratum corneum lipid matrix?',options:["Roughly 50% ceramides, 25% cholesterol, and 15% free fatty acids","100% pure mineral oil","Equal parts hyaluronic acid and collagen","Sebum wax esters and squalene only"],correctIndex:0,explanation:"The lamellar bilayer of the stratum corneum is composed approximately of 50% ceramides, 25% cholesterol, and 10–15% free fatty acids."},{id:8,partId:1,category:"Skin Biology",format:"multiple-choice",question:"What are Natural Moisturizing Factors (NMF) primarily derived from during epidermal differentiation?",options:["Directly from drinking tap water","The enzymatic breakdown of the protein filaggrin","Sweat minerals only","Dietary Vitamin C"],correctIndex:1,explanation:"Filaggrin breaks down in upper corneocytes into free amino acids, pyrrolidone carboxylic acid (PCA), and urocanic acid, forming NMF."},{id:9,partId:1,category:"Skin Biology",format:"true-false",question:"True or False: Post-inflammatory hyperpigmentation (PIH) is more common and persistent in individuals with Fitzpatrick skin types IV through VI.",options:["True","False"],correctIndex:0,explanation:"True. In darker skin phototypes, epidermal melanocytes are biologically more active and reactive to inflammatory mediators, producing dark pigment deposits."},{id:10,partId:1,category:"Skin Biology",format:"multiple-choice",question:"What happens to the dermo-epidermal junction (DEJ) as a result of intrinsic chronological aging?",options:["It thickens and becomes impenetrable.","It flattens, reducing contact surface area and making skin more prone to shearing and tearing.","It converts into subcutaneous fat tissue.","It produces excess melanin across all body sites."],correctIndex:1,explanation:"Flattening of the rete ridges and dermal papillae weakens mechanical adhesion, making mature skin more fragile and prone to tears."},{id:11,partId:1,category:"Skin Biology",format:"ingredient-literacy",question:"Which skin commensal bacterium is anaerobic and predominantly colonizes the deep pilosebaceous follicle?",options:["Staphylococcus epidermidis","Cutibacterium acnes","Streptococcus pyogenes","Pseudomonas aeruginosa"],correctIndex:1,explanation:"Cutibacterium acnes resides deep within sebum-rich hair follicles and plays a role in acne pathophysiology."},{id:12,partId:1,category:"Skin Biology",format:"safety",question:"If a skin product immediately causes intense burning and blistering on first contact, is this likely an allergy or irritant reaction?",options:["Allergic Contact Dermatitis (requires prior sensitization)","Acute Irritant Contact Dermatitis (direct chemical damage to tissue)"],correctIndex:1,explanation:"Immediate tissue damage on first exposure without an incubation period is typical of acute chemical irritation, not an immune-mediated allergy."},{id:13,partId:1,category:"Skin Biology",format:"multiple-choice",question:"What is Transepidermal Water Loss (TEWL)?",options:["Sweat pumped from eccrine glands during heavy exertion","The passive evaporation of water through the stratum corneum into the atmosphere","The absorption of water during a 20-minute bath","The loss of sebum from washing with micellar water"],correctIndex:1,explanation:"TEWL is the passive, non-sweat diffusion of moisture across the epidermal barrier."},{id:14,partId:1,category:"Skin Biology",format:"scenario",question:"A reader moves from humid coastal Rio de Janeiro to arid, high-altitude Denver in January and notices dry, flaky cheeks. What primary physiological change explains this?",options:["Their genetic skin type changed from oily to dry permanently.","The steep moisture vapor gradient between the body and dry air significantly accelerated TEWL.","Sebaceous glands permanently died due to cold exposure.","They stopped drinking enough water, causing immediate skin atrophy."],correctIndex:1,explanation:"Low ambient humidity increases the vapor pressure difference, driving rapid moisture evaporation out of the stratum corneum."},{id:15,partId:1,category:"Skin Biology",format:"multiple-choice",question:"What type of immune cells reside within the epidermis to sample foreign antigens?",options:["Langerhans cells","Fibroblasts","Adipocytes","Chondrocytes"],correctIndex:0,explanation:"Langerhans cells are dendritic antigen-presenting immune sentinels in the suprabasal epidermis."},{id:16,partId:2,category:"Skincare Ingredients",format:"multiple-choice",question:"Which moisturizing ingredient mechanism physically seals the skin surface to block water evaporation?",options:["Humectant","Emollient","Occlusive","Keratolytic"],correctIndex:2,explanation:"Occlusives (such as petrolatum, squalane, and dimethicone) create an impermeable or semi-permeable physical barrier against TEWL."},{id:17,partId:2,category:"Skincare Ingredients",format:"ingredient-literacy",question:"Which ingredient is clinically recognized as reducing TEWL by greater than 98%?",options:["Jojoba oil","Glycerin","Purified Petrolatum","Hyaluronic acid"],correctIndex:2,explanation:"Purified petrolatum is the most powerful occlusive known in dermatological science, reducing water evaporation by over 98%."},{id:18,partId:2,category:"Skincare Ingredients",format:"multiple-choice",question:"What does SPF (Sun Protection Factor) measure specifically?",options:["Protection against both UVA and UVB rays equally","Protection against solar erythema caused predominantly by UVB radiation","Protection against infrared heat and visible light only","How many minutes you can safely sunbathe without reapplying"],correctIndex:1,explanation:"SPF is a biological measurement of UVB photoprotection against sunburn (erythema). UVA protection must be verified separately."},{id:19,partId:2,category:"Skincare Ingredients",format:"scenario",question:"How much sunscreen is needed for adequate coverage of an adult face and neck?",options:["A tiny pea-sized drop","Two finger lengths (approx. 1/4 teaspoon or 2 mg/cm²)","A dime-sized dot mixed into foundation","A half-cup"],correctIndex:1,explanation:"Testing standards require 2 mg/cm² of skin, which correlates to approximately 1/4 teaspoon or two full finger-lengths of lotion for the face and neck."},{id:20,partId:2,category:"Skincare Ingredients",format:"ingredient-literacy",question:"Why is Salicylic Acid (BHA) uniquely suited for clogged pores and blackheads compared to Glycolic Acid (AHA)?",options:["Because Salicylic Acid is water-soluble and washes away easily.","Because Salicylic Acid is lipid-soluble, allowing it to penetrate sebum-filled sebaceous follicles.","Because Salicylic Acid is an occlusive wax.","Because Salicylic Acid bleaches keratin."],correctIndex:1,explanation:"BHA’s lipophilic structure allows it to mix with follicular sebum and dissolve dead corneocyte impactions within the pore."},{id:21,partId:2,category:"Skincare Ingredients",format:"multiple-choice",question:"Which conversion pathway is correct for cosmetic over-the-counter retinol inside skin cells?",options:["Retinol → Retinoic Acid → Retinyl Palmitate","Retinol → Retinaldehyde → Retinoic Acid","Retinoic Acid → Retinol → Beta-Carotene","Retinyl Acetate → Retinoic Acid → Retinol"],correctIndex:1,explanation:"Retinol is oxidized first into retinaldehyde, which is then oxidized into biologically active all-trans retinoic acid."},{id:22,partId:2,category:"Skincare Ingredients",format:"safety",question:"Why should prescription tretinoin and high-dose systemic retinoids be strictly avoided during pregnancy?",options:["They cause mild dry skin in the mother.","They are known potent teratogens that cause severe fetal structural congenital anomalies.","They neutralize prenatal multivitamins.","They cause tooth staining in adults."],correctIndex:1,explanation:"Retinoids directly govern gene transcription in embryogenesis; excess exogenous retinoids induce severe teratogenic malformations."},{id:23,partId:2,category:"Skincare Ingredients",format:"ingredient-literacy",question:"What is the optimal, clinically validated concentration range for topical Niacinamide (Vitamin B3)?",options:["0.01% to 0.05%","2% to 5%","20% to 50%","100% pure powder"],correctIndex:1,explanation:"Dermatological studies confirm 2% to 5% niacinamide optimizes ceramide synthesis and reduces sebum without the flushing and irritation associated with extreme 15–20% serums."},{id:24,partId:2,category:"Skincare Ingredients",format:"multiple-choice",question:"Which ingredient is an inorganic (mineral) sunscreen filter renowned for broad-spectrum safety and low allergenicity?",options:["Avobenzone","Oxybenzone","Zinc Oxide","Octocrylene"],correctIndex:2,explanation:"Zinc oxide is a photostable, non-sensitizing mineral filter that protects against both UVB and UVA wavelengths."},{id:25,partId:2,category:"Skincare Ingredients",format:"myth-fact",question:"Myth vs Fact: Does a higher sunscreen SPF (like SPF 100) mean you can stay in direct sunlight twice as long without reapplying?",options:["Fact: SPF 100 provides 10 hours of uninterrupted protection without reapplication.","Myth: Sunscreen rubs off, degrades, and dilutes in sweat; reapplication every 2 hours is required regardless of SPF number."],correctIndex:1,explanation:"SPF numbers describe UV filtering ratio when freshly applied, not duration of physical adherence on sweating, active skin."},{id:26,partId:2,category:"Skincare Ingredients",format:"scenario",question:"A reader introduces a new 10% glycolic acid toner every morning, a 1% retinol every night, and a 2% BHA scrub. Within 5 days, skin is red, burning, and stinging from simple water. What should they do?",options:["Push through the purge by scrubbing harder.","Stop all active exfoliants and retinoids immediately; switch to a gentle cleanser, bland ceramide moisturizer, and SPF until recovered.","Apply lemon juice to restore the skin's natural acid balance.","Take high-dose oral biotin pills."],correctIndex:1,explanation:"This is severe irritant barrier breakdown, not purging. Halting all exfoliants and applying barrier-repair lipids is mandatory."},{id:27,partId:2,category:"Skincare Ingredients",format:"multiple-choice",question:"What is the black color of an open comedone (blackhead) caused by?",options:["Trapped street dirt and poor hygiene","Oxidation of melanin pigment and sebum exposed to air","Colonization by black mold spores","Dead blood cells"],correctIndex:1,explanation:"When sebum and keratin in an open pore contact atmospheric oxygen, melanin and lipids oxidize, creating the characteristic dark color."},{id:28,partId:2,category:"Skincare Ingredients",format:"ingredient-literacy",question:"How does Benzoyl Peroxide kill Cutibacterium acnes bacteria without causing bacterial resistance?",options:["By inhibiting fungal cell walls","By releasing reactive oxygen free radicals into the anaerobic follicular environment","By altering human DNA","By freezing the sebaceous gland"],correctIndex:1,explanation:"Benzoyl peroxide breaks down to release oxygen free radicals; C. acnes is an obligate/facultative anaerobe unable to develop resistance to non-specific oxidative damage."},{id:29,partId:2,category:"Skincare Ingredients",format:"multiple-choice",question:"Why are iron oxides valuable in tinted sunscreens for people with melasma or deeper skin tones?",options:["They provide a shiny glitter finish.","They absorb and reflect high-energy visible light (HEVL / blue light), which stimulates melanin synthesis.","They replace the need for cleansing.","They permanently bleach skin blemishes."],correctIndex:1,explanation:"Iron oxides block visible blue wavelengths (400–500 nm) that penetrate deeply and trigger persistent pigment darkening in darker skin."},{id:30,partId:2,category:"Skincare Ingredients",format:"safety",question:"What is the dangerous health risk associated with illegal, unregulated skin-lightening creams containing mercury?",options:["Temporary skin dryness","Severe kidney failure, neurological toxicity, tremors, and paradoxical irreversible darkening","Slight increase in hair growth","Mild temporary facial redness only"],correctIndex:1,explanation:"Mercury is a systemic heavy metal toxin that destroys renal tubules and peripheral nerves and can pass across placenta and breastmilk."},{id:31,partId:2,category:"Skincare Ingredients",format:"multiple-choice",question:"What is the key physiological difference between intrinsic aging and extrinsic photoaging?",options:["Intrinsic aging produces thick leathery skin, while photoaging creates smooth paper-thin skin.","Intrinsic aging is chronological genetic slowing of cell division; photoaging is accelerated elastotic solar damage from cumulative UV.","Intrinsic aging only affects hair, not skin.","Photoaging is completely harmless and cosmetic."],correctIndex:1,explanation:"Intrinsic aging is the gradual chronological decline in cellular turnover, while extrinsic photoaging produces deep wrinkles, solar elastosis, and precancerous lesions."},{id:32,partId:2,category:"Skincare Ingredients",format:"myth-fact",question:"Myth vs Fact: Can any topical cosmetic product eliminate existing facial wrinkles permanently and reverse biological age?",options:["Fact: High-end peptide creams erase wrinkles down to cellular origin permanently.","Myth: No cosmetic product reverses biological aging; retinoids and SPF improve appearance and prevent progression, but natural aging continues."],correctIndex:1,explanation:"HERBULANCE reinforces realistic, ethical expectations: cosmetics support hydration and cellular renewal, but cannot stop biological time."},{id:33,partId:2,category:"Skincare Ingredients",format:"ingredient-literacy",question:"Which dicarboxylic acid is safe in pregnancy and addresses both acne redness and hyperpigmentation?",options:["Hydroquinone","Azelaic Acid","Tretinoin","Formaldehyde"],correctIndex:1,explanation:"Azelaic acid (10–20%) exhibits antibacterial, anti-inflammatory, and tyrosinase-inhibiting properties with an exceptional safety profile."},{id:34,partId:2,category:"Skincare Ingredients",format:"scenario",question:"A reader with sensitive, rosacea-prone skin wants to exfoliate flaking skin. Which option is the most biologically gentle?",options:["A coarse walnut shell mechanical scrub used daily","A 30% glycolic acid chemical peel","A mild Polyhydroxy Acid (PHA) like gluconolactone, or a washcloth with water","Pure lemon juice on a cotton pad"],correctIndex:2,explanation:"PHAs have larger molecular sizes that penetrate slowly without stinging, making them ideal for sensitive barriers."},{id:35,partId:2,category:"Skincare Ingredients",format:"multiple-choice",question:"What is the role of humectants like Glycerin in low ambient humidity (<20%) when used without an occlusive?",options:["They create water out of empty air.","They can potentially draw water from the deeper viable epidermis toward the dry stratum corneum, increasing dehydration unless sealed with an occlusive.","They instantly turn into oil.","They stop TEWL entirely."],correctIndex:1,explanation:"In dry environments with little atmospheric humidity, humectants draw moisture upward from the dermis; sealing with an emollient/occlusive prevents surface evaporation."},{id:36,partId:3,category:"Hair & Scalp",format:"multiple-choice",question:"Which layer of the hair shaft contains melanin granules and structural keratin filaments providing tensile strength?",options:["Cuticle","Cortex","Medulla","Internal root sheath"],correctIndex:1,explanation:"The cortex makes up the bulk of the hair fiber, containing keratin intermediate filaments and pigment granules."},{id:37,partId:3,category:"Hair & Scalp",format:"multiple-choice",question:"What is the active growing phase of the hair cycle called?",options:["Anagen","Catagen","Telogen","Exogen"],correctIndex:0,explanation:"Anagen is the proliferative growth phase, which lasts 2 to 7 years on the human scalp."},{id:38,partId:3,category:"Hair & Scalp",format:"true-false",question:"True or False: Losing 50 to 100 hairs per day is considered a normal physiological part of the exogen phase.",options:["True","False"],correctIndex:0,explanation:"True. Daily shedding of 50 to 100 telogen club hairs is completely normal and expected as new anagen hairs initiate underneath."},{id:39,partId:3,category:"Hair & Scalp",format:"scenario",question:"Three months after recovering from a high-fever viral infection, a person experiences sudden widespread hair shedding when shampooing. What is the most likely cause?",options:["Traction alopecia from wearing a loose hat","Acute Telogen Effluvium triggered by the physiological fever 3 months prior","Permanent genetic pattern baldness overnight","Hair shaft fungal infection"],correctIndex:1,explanation:"Telogen effluvium classically exhibits a 2-to-4 month latency period following a severe systemic stressor or high fever."},{id:40,partId:3,category:"Hair & Scalp",format:"safety",question:"What is the danger of persistently wearing tightly pulled braids, cornrows, or heavy extensions that cause scalp soreness?",options:["Temporary dandruff only","Traction Alopecia, which can progress to irreversible scarring alopecia if tension continues","Excess melanin production in the hair shaft","The hair turning gray prematurely"],correctIndex:1,explanation:"Chronic mechanical tension damages the outer root sheath and dermal papilla, causing fibrosis and permanent follicle loss."},{id:41,partId:3,category:"Hair & Scalp",format:"ingredient-literacy",question:"What microorganism is directly implicated in the pathogenesis of dandruff and seborrhoeic dermatitis?",options:["Candida albicans","Malassezia yeasts","Cutibacterium acnes","Trichophyton tonsurans"],correctIndex:1,explanation:"Malassezia yeasts feed on sebum triglycerides and release irritating free fatty acids that provoke flaking and inflammation."},{id:42,partId:3,category:"Hair & Scalp",format:"multiple-choice",question:"Why does textured, tightly coiled (Type 4) hair tend to be more fragile and dry than straight hair?",options:["Because coily hair contains no keratin protein.","Because elliptical shaft geometry creates natural mechanical stress points, and sebum cannot travel easily down coiled lengths.","Because coily hair has no cuticle scales.","Because coily hair absorbs too much sunlight."],correctIndex:1,explanation:"The curved geometry creates torsion stress points along the fiber, and natural scalp sebum meets physical resistance traveling down curls."},{id:43,partId:3,category:"Hair & Scalp",format:"scenario",question:"How should fragile curly or coiled hair be detangled to minimize mechanical breakage?",options:["Brushed vigorously when completely bone-dry with a fine-tooth comb","Saturated with water and a high-slip conditioner, using fingers or a wide-tooth comb from ends working upward","Detangled only with a hot round brush at 200°C","Never washed or detangled"],correctIndex:1,explanation:"Water and conditioner provide lubrication to reduce inter-fiber friction; detangling from ends upward prevents tightening knots."},{id:44,partId:3,category:"Hair & Scalp",format:"ingredient-literacy",question:"What do chemical relaxers do to the hair cortex to permanently straighten curly hair?",options:["They temporarily coat the hair with water-soluble sugar.","They permanently break strong covalent disulfide bonds in cortical keratin fibrils.","They dissolve the hair medulla completely.","They increase melanin production."],correctIndex:1,explanation:"Alkaline relaxers break disulfide cross-links, reducing hair tensile strength by roughly 30–50%."},{id:45,partId:3,category:"Hair & Scalp",format:"myth-fact",question:"Myth vs Fact: Can hair oils (like coconut or olive oil) hydrate dry hair by themselves?",options:["Fact: Pure oils are rich in water and directly hydrate the inner cortex.","Myth: Oils contain no water; they are hydrophobic lipids that seal and lubricate. Water or water-based products must provide the hydration first."],correctIndex:1,explanation:"Hydration requires water molecules; oils act as emollients and sealants to trap moisture inside the hair fiber."},{id:46,partId:3,category:"Hair & Scalp",format:"multiple-choice",question:"What occurs when wet hair is flat-ironed with high heat (>180°C)?",options:["The hair absorbs more protein.",'Trapped water inside the cortex boils instantly into steam, creating permanent structural voids called "bubble hair".',"The cuticle permanently seals forever.","The hair grows 2 inches faster."],correctIndex:1,explanation:"Flash boiling of intra-cortical water creates steam blisters that fracture keratin fibers, leaving hair irreversibly brittle."},{id:47,partId:3,category:"Hair & Scalp",format:"safety",question:"Why should medicated anti-dandruff shampoo remain on the scalp for 3 to 5 minutes before rinsing?",options:["To allow the shampoo to permanently bleach the hair","To provide adequate contact time for antifungal agents (like ketoconazole or zinc pyrithione) to suppress yeast proliferation","To dissolve all natural hair cuticles","Because water takes 5 minutes to penetrate the skull"],correctIndex:1,explanation:"Topical antifungal compounds require several minutes of physical contact with the stratum corneum and infundibulum to be clinically effective."},{id:48,partId:3,category:"Hair & Scalp",format:"ingredient-literacy",question:"What role do silicones (like amodimethicone or dimethicone) serve in modern conditioners?",options:["They suffocate the scalp and permanently stop hair growth.","They form a microscopic lubricating sheath over damaged cuticles, reducing comb friction, detangling snag, and heat transfer.","They replace dietary protein.","They act as a permanent hair dye."],correctIndex:1,explanation:"Cosmetic silicones provide high slip and protective smoothing over chipped cuticles, reducing mechanical grooming breakage."},{id:49,partId:3,category:"Hair & Scalp",format:"scenario",question:"A mother notices her 8-year-old child has a localized, scaly, itchy bald patch with black hair stubs on the scalp. What is the most appropriate action?",options:["Apply home olive oil and wait 6 months.","Consult a physician for suspected Tinea Capitis (fungal scalp ringworm) requiring oral antifungal medication.","Bleach the scalp with hydrogen peroxide.","Shave the entire head with a razor."],correctIndex:1,explanation:"Tinea capitis penetrates deep into the hair shaft and follicle; topical creams fail to penetrate, making oral prescription antifungals standard of care."},{id:50,partId:3,category:"Hair & Scalp",format:"multiple-choice",question:"What is the only FDA/EMA approved topical over-the-counter active medication proven to stimulate hair regrowth in androgenetic alopecia?",options:["Biotin oil","Minoxidil (2% and 5%)","Rosemary water","Collagen peptides"],correctIndex:1,explanation:"Topical minoxidil has extensive randomized controlled clinical trial data demonstrating efficacy in pattern hair loss."},{id:51,partId:3,category:"Hair & Scalp",format:"true-false",question:"True or False: Temporary shedding can occur during the first 2 to 8 weeks after starting topical minoxidil.",options:["True","False"],correctIndex:0,explanation:"True. Minoxidil shortens the telogen phase, causing old resting club hairs to shed to make way for robust new anagen hair shafts."},{id:52,partId:3,category:"Hair & Scalp",format:"multiple-choice",question:'What causes "split ends" (trichoptilosis)?',options:["A bacterial infection inside the scalp","Physical, chemical, and environmental erosion of the protective outer cuticle, causing cortical keratin fibers to fray","Drinking cold milk","Using conditioner on the ends"],correctIndex:1,explanation:"Loss of cuticle tiles exposes vulnerable inner cortical fibers, which split longitudinally under mechanical wear."},{id:53,partId:3,category:"Hair & Scalp",format:"safety",question:"Why should a chemical hair dye patch test be performed 48 hours before applying hair color?",options:["To test if the color looks nice","To detect Type IV delayed allergic hypersensitivity to paraphenylenediamine (PPD) before severe facial swelling or chemical burns occur","To ensure the dye is permanent","To check water hardness"],correctIndex:1,explanation:"PPD is a potent contact allergen; patch testing screens for severe contact dermatitis that can cause eyelid edema and weeping scalp ulcers."},{id:54,partId:3,category:"Hair & Scalp",format:"myth-fact",question:"Myth vs Fact: Can taking high doses of Biotin gummies cure genetic pattern baldness in healthy adults?",options:["Fact: Biotin reactivates dead hair follicles in 30 days.","Myth: Biotin only benefits hair in documented clinical biotin deficiency; genetic pattern hair loss is driven by DHT and genetics, not biotin."],correctIndex:1,explanation:"There is no clinical evidence that excess biotin improves non-deficient hair thinning, and high doses interfere with critical blood tests."},{id:55,partId:3,category:"Hair & Scalp",format:"multiple-choice",question:"Why does hair shedding increase noticeably 3 to 4 months following childbirth?",options:["Maternal milk production poisons the scalp.","Elevated pregnancy hormones maintained follicles in prolonged anagen; postpartum estrogen drops cause synchronized entry into telogen.","The baby's hair absorbs nutrients from the mother through the air.","Permanent genetic hair loss begins after delivery."],correctIndex:1,explanation:"Postpartum telogen effluvium is a well-documented physiological shedding resulting from the postpartum decline in placental hormones."},{id:56,partId:4,category:"Nails & Grooming",format:"multiple-choice",question:"What anatomical structure generates the cells that form the hard nail plate?",options:["Nail bed","Nail matrix","Hyponychium","Lunula only"],correctIndex:1,explanation:"The nail matrix is the germinative tissue located beneath the proximal nail fold where keratinized nail cells divide and flatten."},{id:57,partId:4,category:"Nails & Grooming",format:"safety",question:"Why do dermatologists strongly recommend against cutting or trimming the nail cuticle (eponychium)?",options:["It makes nails grow too fast.","It destroys the waterproof mechanical seal protecting the sterile nail matrix from bacterial and fungal pathogens (inviting paronychia).","It discolors nail polish.","It weakens hand grip strength."],correctIndex:1,explanation:"Breaching the cuticle barrier allows moisture and microbes into the periungual fold, causing acute or chronic paronychia."},{id:58,partId:4,category:"Nails & Grooming",format:"multiple-choice",question:"Approximately how long does it take for a human fingernail and toenail to completely grow out from matrix to tip?",options:["Fingernails: 1 week; Toenails: 3 weeks","Fingernails: 4 to 6 months; Toenails: 12 to 18 months","Fingernails: 5 years; Toenails: 10 years","Nails do not grow continuously"],correctIndex:1,explanation:"Fingernails grow ~3 mm/month (4–6 months total), while toenails grow at roughly one-third that rate (~1 mm/month, taking 12–18 months)."},{id:59,partId:4,category:"Nails & Grooming",format:"myth-fact",question:"Myth vs Fact: Do small white spots on fingernails (punctate leukonychia) signal calcium or zinc deficiency?",options:["Fact: White spots mean you need to consume 3 glasses of milk daily.","Myth: White spots are almost universally caused by minor micro-trauma to the growing nail matrix that entraps microscopic air spaces."],correctIndex:1,explanation:"Minor impacts or aggressive manicuring cause benign leukonychia that harmlessly grows out with the plate."},{id:60,partId:4,category:"Nails & Grooming",format:"scenario",question:"A reader notices a throbbing, swollen, erythematous lateral nail fold with a small bead of pus 2 days after ripping a hangnail. What condition is this?",options:["Beau's lines","Acute Paronychia","Onycholysis","Melanoma"],correctIndex:1,explanation:"Ripping hangnails tears the periungual barrier, allowing Staphylococcus aureus or Streptococcus to cause acute paronychia."},{id:61,partId:4,category:"Nails & Grooming",format:"multiple-choice",question:"What are Beau’s lines on the nail plate?",options:["Vertical ridges common in normal healthy aging","Horizontal, transverse grooves caused by temporary arrest of nail matrix cell division during severe systemic illness or trauma","White fungal patches","Harmless ink stains"],correctIndex:1,explanation:"Beau’s lines reflect a physiological pause in matrix keratin synthesis during major fever, surgery, or systemic shock."},{id:62,partId:4,category:"Nails & Grooming",format:"ingredient-literacy",question:"What is Onycholysis?",options:["The painless detachment of the nail plate from the underlying pink nail bed","A wart located on the finger","Ingrown toenail curvature","Excessive cuticle growth"],correctIndex:0,explanation:"Onycholysis occurs when the nail plate separates from the nail bed, often from trauma, psoriatic involvement, or frequent chemical soaking."},{id:63,partId:4,category:"Nails & Grooming",format:"safety",question:"Why are DIY gel nail kits causing an epidemic of contact allergies?",options:["Because gel nail polish smells too sweet.","Because uncalibrated UV lamps leave liquid acrylate monomers uncured, sensitizing skin to lifelong (meth)acrylate allergy.","Because gel polish contains too much water.","Because gel nails require too much calcium."],correctIndex:1,explanation:"Incompletely cured gel polish leaves reactive monomers that penetrate epidermis, causing permanent acrylate sensitization."},{id:64,partId:4,category:"Nails & Grooming",format:"scenario",question:"What is the correct way to clip toenails to prevent painful ingrown nails?",options:["Cut deep curved arcs into both lateral borders.","Trim straight across and round only the sharp corner edges gently with an emery board.","Tear them off by hand after a hot bath.","Never clip toenails"],correctIndex:1,explanation:"Cutting curved borders directs growing nail margins directly into lateral periungual tissue folds, precipitating onychocryptosis (ingrown nail)."},{id:65,partId:4,category:"Nails & Grooming",format:"multiple-choice",question:"What does a solitary, new, dark brown-to-black longitudinal band extending from cuticle to tip on a single fingernail require?",options:["Immediate buffing with a nail file","Evaluation by a dermatologist to exclude subungual melanoma (Hutchinson’s sign evaluation)","Application of garlic oil","Covering with thick dark nail polish"],correctIndex:1,explanation:"A new or changing solitary longitudinal melanonychia requires clinical dermoscopy to rule out rare but life-threatening subungual melanoma."},{id:66,partId:4,category:"Nails & Grooming",format:"myth-fact",question:"Myth vs Fact: Does filing nails back and forth in a fast sawing motion make them stronger?",options:["Fact: Sawing friction hardens the keratin plate.","Myth: Fast back-and-forth sawing splinters delicate keratin layers, predisposing edges to flaking and peeling."],correctIndex:1,explanation:"Filing gently in one consistent direction preserves keratin integrity and prevents microscopic edge fractures."},{id:67,partId:4,category:"Nails & Grooming",format:"safety",question:"Why are whirlpool foot spas in nail salons a potential vector for bacterial outbreaks if not properly sanitized?",options:["They cause toenails to fall off from vibration.","Pipes and jet filters harbor resistant biofilms of atypical mycobacteria (e.g. Mycobacterium fortuitum) that cause painful furuncles on legs.","The water gets too cold.","They dissolve skin lipids permanently."],correctIndex:1,explanation:"Inadequately disinfected whirlpool foot bath recirculating pipes cultivate persistent mycobacterial biofilms."},{id:68,partId:4,category:"Nails & Grooming",format:"ingredient-literacy",question:"Which simple plant oil has small enough molecular weight to penetrate the intercellular lipids of the nail plate?",options:["Castor oil","Jojoba oil","Mineral wax","Paraffin oil"],correctIndex:1,explanation:"Jojoba oil is a liquid wax ester with molecular properties that penetrate keratin layers, improving nail plate flexibility."},{id:69,partId:4,category:"Nails & Grooming",format:"multiple-choice",question:"What organism causes the distinctive greenish discoloration beneath an onycholytic nail plate?",options:["Staphylococcus epidermidis","Pseudomonas aeruginosa (producing pyocyanin pigment)","Candida albicans","Malassezia globosa"],correctIndex:1,explanation:"Pseudomonas aeruginosa produces green pyocyanin and pyoverdine pigments under damp, lifted nail plates."},{id:70,partId:4,category:"Nails & Grooming",format:"scenario",question:"An individual cleans dishes and wet floors daily for work and has dry, splitting, brittle nails. What is the single most effective preventive habit?",options:["Taking 10,000 mcg of biotin daily","Wearing cotton-lined rubber or nitrile gloves during wet tasks and applying a hand cream immediately after washing","Soaking nails in lemon water","Painting nails with 4 coats of gel polish"],correctIndex:1,explanation:"Preventing repeated water swelling/drying cycles with gloves stops intercellular lipid stripping and preserves keratin bonds."},{id:71,partId:5,category:"Nutrition & Lifestyle",format:"multiple-choice",question:"Which essential fatty acids cannot be synthesized by the human body and are vital for epidermal ceramide production?",options:["Palmitic and stearic acids","Linoleic acid (omega-6) and alpha-linolenic acid (omega-3)","Oleic acid only","Lauric acid"],correctIndex:1,explanation:"Linoleic acid is an obligatory component of acylceramides (Ceramide 1/EOS), which seal the stratum corneum barrier."},{id:72,partId:5,category:"Nutrition & Lifestyle",format:"scenario",question:"A reader drinks 4 liters of water every day but still has severely dry, flaking facial skin in winter. Why didn’t water cure their dryness?",options:["Because they need to drink 8 liters instead.","Because stratum corneum dryness is caused by a deficient lipid barrier and low environmental humidity, requiring topical emollients and occlusives.","Because water bypasses the skin entirely.","Because tap water contains too many minerals."],correctIndex:1,explanation:"Systemic hydration supports viable organ perfusion, but stratum corneum moisture retention is dictated by surface barrier lipids and ambient humidity."},{id:73,partId:5,category:"Nutrition & Lifestyle",format:"multiple-choice",question:"Which clinical laboratory test is critical when evaluating diffuse hair thinning in menstruating females?",options:["Serum Ferritin (iron storage stores)","Blood type test","Salivary cortisol test","Urine glucose test"],correctIndex:0,explanation:"Low serum ferritin (<30–50 ng/mL) is a frequent contributing trigger for chronic telogen effluvium, even before overt anemia develops."},{id:74,partId:5,category:"Nutrition & Lifestyle",format:"safety",question:"Why has the FDA issued safety warnings regarding high-dose over-the-counter Biotin supplements?",options:["Biotin causes immediate tooth decay.","Biotin interferes with laboratory immunoassay diagnostic tests, falsely lowering Troponin (masking heart attacks) and altering thyroid results.","Biotin turns the skin blue.","Biotin suppresses stomach acid."],correctIndex:1,explanation:"Biotin-streptavidin technology is used in countless clinical lab tests; excess supplemental biotin causes clinically dangerous false readings."},{id:75,partId:5,category:"Nutrition & Lifestyle",format:"multiple-choice",question:"How does psychological stress trigger skin flares in eczema, psoriasis, and acne?",options:["By changing skin pigmentation directly","By releasing neuropeptides like Substance P and elevating cortisol, activating mast cells and compromising barrier lipids","By stopping hair follicles from absorbing shampoo","By turning blood acidic"],correctIndex:1,explanation:"The neuro-immuno-cutaneous axis transmits psychological stress through substance P, cortisol, and pro-inflammatory cytokines."},{id:76,partId:5,category:"Nutrition & Lifestyle",format:"myth-fact",question:"Myth vs Fact: Do oral collagen peptide powders survive stomach digestion and travel directly into facial dermis intact?",options:["Fact: Ingested collagen travels intact through the bloodstream straight to the cheeks.","Myth: Gastric acid and proteases break collagen down into basic amino acids (glycine, proline) identical to those from dietary protein foods."],correctIndex:1,explanation:"Digestive enzymes hydrolyze collagen into individual di-/tri-peptides and amino acids; the body utilizes them wherever protein is systemically needed."},{id:77,partId:5,category:"Nutrition & Lifestyle",format:"multiple-choice",question:"What physiological process peaks in human skin cells during deep nocturnal sleep?",options:["Epidermal cell division, DNA repair of daytime UV damage, and growth hormone release","Sweat gland shutdown permanently","Total cessation of Transepidermal Water Loss","Sebaceous gland hyper-secretion"],correctIndex:0,explanation:"Skin circadian rhythms prioritize nocturnal cellular repair and proliferation, while TEWL naturally rises during sleep."},{id:78,partId:5,category:"Nutrition & Lifestyle",format:"scenario",question:"An active runner notices red, stinging, itchy bumps in the groin and inner thighs after long summer runs in wet synthetic clothes. What is the most likely cause?",options:["Melasma","Mechanical friction and occlusion folliculitis (sweat and friction irritating hair follicles)","Severe dietary deficiency","Sunburn on covered skin"],correctIndex:1,explanation:"Chafing and trapped sweat create mechanical irritation and microbial overgrowth in follicles, causing friction folliculitis."},{id:79,partId:5,category:"Nutrition & Lifestyle",format:"multiple-choice",question:"How does hard water (high calcium and magnesium content) exacerbate skin barrier irritation?",options:["It provides healthy minerals that repair lipids.",'It reacts with surfactants to precipitate insoluble "soap curd" residue that clings to the stratum corneum and raises skin surface pH.',"It bleaches skin melanin.","It freezes the dermis."],correctIndex:1,explanation:"Insoluble calcium stearate salts adhere to skin, impairing the acid mantle and increasing skin permeability and itching."},{id:80,partId:5,category:"Nutrition & Lifestyle",format:"safety",question:"What is the danger of cigarette smoking to dermal architecture?",options:["It turns hair red.","Nicotine causes cutaneous vasoconstriction, reducing microvascular perfusion, while smoke chemicals upregulate MMP enzymes that degrade collagen and elastin.","It causes temporary oily skin only.","It stops nail growth permanently."],correctIndex:1,explanation:"Chronic microvascular hypoxia and matrix metalloproteinase upregulation lead to accelerated skin elastosis, wrinkles, and delayed wound healing."},{id:81,partId:6,category:"Dermatology & Safety",format:"multiple-choice",question:"What is the biological difference between a deodorant and an antiperspirant?",options:["There is no difference; they are identical products.","Antiperspirants use aluminum salts to form temporary plugs in eccrine ducts to reduce sweat; deodorants neutralize odor with antimicrobial agents and fragrance without blocking sweat.","Deodorants stop sweat; antiperspirants add pleasant smell only.","Antiperspirants are illegal in Europe."],correctIndex:1,explanation:"Antiperspirants physically reduce perspiration volume, whereas deodorants target bacterial odor formation."},{id:82,partId:6,category:"Dermatology & Safety",format:"safety",question:"Why should undiluted pure essential oils (e.g. tea tree, oregano, lavender) NEVER be applied straight onto broken or facial skin?",options:["They make skin smell too fragrant.","They contain concentrated reactive terpene allergens and phenols that can cause chemical burns, severe contact sensitization, and phototoxicity.","They stop perspiration.","They dissolve bone."],correctIndex:1,explanation:"Essential oils are concentrated volatile phytochemicals with high sensitization and irritation potential when unbuffered."},{id:83,partId:6,category:"Dermatology & Safety",format:"scenario",question:"A 14-year-old begins puberty and develops small comedones on the nose and chin. Influencers recommend a 7-step peel routine with 30% AHA. What is the evidence-based advice?",options:["Start the 30% acid peel immediately every night.","Advise a gentle, non-stripping cleanser, a light oil-free moisturizer, daily sunscreen, and a gentle OTC active like 2.5% benzoyl peroxide or 10% azelaic acid.","Scrub face with a hard pumice stone.","Avoid all washing until age 20."],correctIndex:1,explanation:"Adolescent skin is vulnerable; aggressive adult chemical peels cause severe barrier destruction and post-inflammatory pigmentation."},{id:84,partId:6,category:"Dermatology & Safety",format:"multiple-choice",question:"Why is the risk of skin tears significantly increased in frail older adults?",options:["Because older skin has thicker stratum corneum than adolescent skin.","Because flattening of the dermo-epidermal junction and dermal collagen loss reduce tensile resistance to shear and friction forces.","Because older adults wash too frequently with moisturizers.","Because of high vitamin levels."],correctIndex:1,explanation:"Atrophy of the dermal extracellular matrix and loss of anchoring rete pegs make the epidermis easily sheared off by adhesive tape or friction."},{id:85,partId:6,category:"Dermatology & Safety",format:"myth-fact",question:"Myth vs Fact: Is it true that people with deeply pigmented skin cannot develop skin cancer or melanoma?",options:["Fact: Melanin completely blocks 100% of skin cancers in people of colour.","Myth: Anyone can develop skin cancer; in darker skin phototypes, melanomas often appear on non-sun-exposed areas (acral lentiginous melanoma on palms, soles, nail beds) and carry worse prognoses due to delayed detection."],correctIndex:1,explanation:"Melanin provides partial UV protection, but acral melanomas occur independently of UV; vigilance across all skin tones is critical."},{id:86,partId:6,category:"Dermatology & Safety",format:"scenario",question:"An individual with limited mobility or hemiplegia from a stroke struggles with twist caps and jars. Which packaging adaptation provides dignity and independence?",options:["Tiny glass dropper bottles requiring two steady hands","Large pump dispensers, flip-top tubes, or automated no-touch dispensers that can be operated with one hand","Small screw-cap metal tins","Individual foil packets that require tearing with teeth"],correctIndex:1,explanation:"Inclusive, accessible packaging design prioritizes one-handed ergonomics, large tactile pumps, and non-slip containers."},{id:87,partId:6,category:"Dermatology & Safety",format:"ingredient-literacy",question:'What is the open jar symbol with "12M" stamped on a cosmetic bottle called?',options:["Minimum age for product use","Period After Opening (PAO) indicating the product remains safe for 12 months after unsealing","Batch code number","Recycling plastic type"],correctIndex:1,explanation:"The PAO symbol denotes how many months the preservative system guarantees safety against microbial proliferation after opening."},{id:88,partId:6,category:"Dermatology & Safety",format:"safety",question:"What immediate medical emergency sign should prompt a reader to seek emergency care rather than reading skincare advice?",options:["A single small whitehead on the chin","Rapid facial or lip swelling, throat tightness, or difficulty breathing following a cosmetic application (anaphylaxis)","Slightly dry cuticles after handwashing","Hair shedding 3 hairs when brushing"],correctIndex:1,explanation:"Angioedema and respiratory compromise represent life-threatening systemic hypersensitivity requiring immediate emergency intervention."},{id:89,partId:6,category:"Dermatology & Safety",format:"multiple-choice",question:"Why is intimate hygiene best maintained with warm water rather than harsh antibacterial fragranced washes?",options:["Because fragranced soaps disrupt delicate mucosal acid mantles and beneficial lactobacilli flora, causing contact dermatitis and vaginosis.","Because water contains natural bleach.","Because mucosal skin is completely non-absorbent.","Because sweat never occurs in skin folds."],correctIndex:0,explanation:"Mucosal epithelial barriers are thin and susceptible to contact sensitization; harsh surfactants eradicate protective acidic commensal flora."},{id:90,partId:6,category:"Dermatology & Safety",format:"multiple-choice",question:'What is the "Ugly Duckling" sign in clinical melanoma detection?',options:["A blemish that looks like a yellow duck","A pigmented mole or lesion that looks distinctly different in color, size, or pattern compared to all other moles on that individual's skin","A wart located on the foot","A fingernail that grows faster than others"],correctIndex:1,explanation:"The ugly duckling sign highlights that melanomas frequently deviate from a patient's prevailing nevus pattern."},{id:91,partId:7,category:"Dermatology & Safety",format:"multiple-choice",question:"What do the letters in the dermatological ABCDE screening criteria for pigmented lesions stand for?",options:["Acne, Bacteria, Collagen, Dermis, Epidermis","Asymmetry, Border irregularity, Color variation, Diameter >6mm, Evolving change","Application, Buffing, Cleansing, Drying, Exfoliating","Antiperspirant, Bleach, Conditioner, Detergent, Emollient"],correctIndex:1,explanation:"ABCDE is the internationally recognized clinical guideline for screening suspicious pigmented lesions for melanoma."},{id:92,partId:7,category:"Dermatology & Safety",format:"scenario",question:"A reader has a pearly, translucent pink bump on their temple with tiny visible blood vessels (telangiectasias) that bleeds slightly and fails to heal after 2 months. What is this?",options:["A common pimple that needs squeezing","A classic presentation of Basal Cell Carcinoma (BCC), warranting prompt dermatological biopsy","A normal freckle","A calcium deposit from hard water"],correctIndex:1,explanation:"Pearly papules with arborizing telangiectasias that bleed easily are classic hallmarks of basal cell carcinoma, the most common skin cancer."},{id:93,partId:7,category:"Dermatology & Safety",format:"safety",question:"What severe medical emergency can occur if cosmetic dermal filler is accidentally injected into a facial arterial vessel by an unqualified practitioner?",options:["Temporary skin flaking","Vascular occlusion leading to rapid ischemic tissue necrosis, scarring, and permanent blindness (if ophthalmic branches are occluded)","The filler turns into bone","No effect occurs"],correctIndex:1,explanation:"Vascular occlusion is a catastrophic medical emergency requiring immediate administration of hyaluronidase and emergency intervention."},{id:94,partId:7,category:"Dermatology & Safety",format:"ingredient-literacy",question:"On an INCI ingredient label, in what order are ingredients listed?",options:["Alphabetical order from A to Z","In descending order of predominance by weight down to 1% concentration; ingredients below 1% may be listed in any order","Random order chosen by the brand","Cheapest to most expensive"],correctIndex:1,explanation:"International INCI regulations mandate descending concentration order for components above 1%."},{id:95,partId:7,category:"Dermatology & Safety",format:"myth-fact",question:"Myth vs Fact: Does a $250 luxury face cream provide five times more skin barrier protection than a $15 pharmacy ceramide cream?",options:["Fact: Luxury creams contain secret biological compounds unavailable to affordable brands.","Myth: Price correlates with packaging, fragrance, and marketing; basic pharmacy creams contain identical, clinically proven ceramides, glycerin, and petrolatum."],correctIndex:1,explanation:"Dermatological efficacy is governed by pharmaceutical active chemistry and formulation stability, not luxury packaging markup."},{id:96,partId:7,category:"Dermatology & Safety",format:"scenario",question:"How should a patient prepare before attending a full-body dermatological skin check?",options:["Wear heavy foundation makeup, dark nail polish, and hair extensions.","Remove all facial makeup and nail polish, wear easily removable clothing, and bring a list of medications and a note of specific changing spots.","Self-treat all moles with apple cider vinegar the day before.","Tanning in a sunbed so moles stand out."],correctIndex:1,explanation:"Dermatologists need unobstructed visualization of bare skin, nail beds, and scalp to evaluate lesions accurately."},{id:97,partId:7,category:"Dermatology & Safety",format:"multiple-choice",question:"What is the diagnostic gold standard used by dermatologists to identify specific Type IV contact allergens in allergic contact dermatitis?",options:["Online quiz","Standardized epicutaneous patch testing (read at 48 and 72–96 hours)","A finger-prick blood test","Smelling the cosmetic bottle"],correctIndex:1,explanation:"Standardized patch testing applies calibrated allergen chambers to the back to elicit delayed hypersensitivity under medical evaluation."},{id:98,partId:7,category:"Dermatology & Safety",format:"safety",question:"Why does HERBULANCE strongly advise AGAINST purchasing high-concentration chemical peels (like 70% glycolic or 35% TCA) on online marketplaces for self-application at home?",options:["Because they are too inexpensive","Because unbuffered high-strength acids cause deep chemical burns, permanent hypertrophic scarring, and irreversible pigment loss without professional neutralization","Because they evaporate too fast","Because they smell bad"],correctIndex:1,explanation:"Deep chemical peels require medical depth assessment, clinical timers, neutralizing solutions, and sterile post-procedure wound management."},{id:99,partId:8,category:"Routine Building",format:"scenario",question:"Which daily 3-step routine represents the most evidence-based, sustainable foundation for healthy skin across any budget?",options:["10-step toner layering + gold mask + face roller","Gentle cleanser + barrier moisturizer + broad-spectrum sunscreen SPF 30+","Abrasive physical scrub + alcohol astringent + tanning oil","Baby powder + pure coconut oil + hot water"],correctIndex:1,explanation:"Cleansing, barrier hydration, and photoprotection form the clinically validated core triad of healthy dermatological care."},{id:100,partId:8,category:"Routine Building",format:"multiple-choice",question:"What is the primary objective of the HERBULANCE 30-Day Healthy Skin and Personal Care Challenge?",options:["To guarantee readers achieve 100% flawless glass skin in 30 days","To build sustainable, evidence-based daily hygiene, photoprotection, and barrier-respecting habits without unrealistic cosmetic promises","To convince readers to buy 30 different luxury products","To test how many days one can go without washing"],correctIndex:1,explanation:"HERBULANCE emphasizes realistic habit formation, understanding physiological boundaries, and practicing dignified personal care."},{id:101,partId:8,category:"Routine Building",format:"myth-fact",question:'Myth vs Fact: Can someone develop a "resistance" to their moisturizer, making it stop working after several months?',options:["Fact: Skin cells mutate and reject creams after 90 days.","Myth: Skin does not become immune to hydration or lipids; changes in perceived efficacy reflect seasonal humidity shifts, hormonal transitions, or aging."],correctIndex:1,explanation:"Moisturizers act on physical barrier lipids and corneocytes; variations in skin feel stem from external environmental or internal physiological changes."},{id:102,partId:8,category:"Routine Building",format:"scenario",question:"When introducing a new active serum (like retinol or azelaic acid), how frequently should it initially be applied?",options:["Three times daily right from the start","1 to 2 nights per week for the first two weeks, gradually increasing frequency as skin tolerates without erythema","Mixed directly into pure alcohol","Only applied when a breakout happens"],correctIndex:1,explanation:"Gradual titration minimizes irritant contact dermatitis, allowing the stratum corneum to adapt cellular turnover safely."},{id:103,partId:8,category:"Routine Building",format:"safety",question:"What should you do if an open jar of cream has developed a sour odor, separated into watery layers, or changed color?",options:["Stir it with a spoon and apply double amount","Discard it safely; these are signs of preservative failure, lipid rancidity, and microbial proliferation","Heat it in the microwave to sterilize it","Freeze it for 1 hour"],correctIndex:1,explanation:"Phase separation, sour odors, and color changes indicate chemical decomposition and bacterial/fungal contamination."},{id:104,partId:8,category:"Routine Building",format:"multiple-choice",question:"What is the guiding editorial principle of HERBULANCE Book 16 regarding personal wellness?",options:["Attaining flawless beauty and eliminating all signs of natural human aging","Healthy personal care supports normal physiological function, barrier defense, hygiene, comfort, and individual self-respect across all life stages","Skin whitening and changing natural hair textures to match commercial beauty ideals","Relying entirely on expensive cosmetic treatments"],correctIndex:1,explanation:"The publication grounds personal care in biology, dignity, evidence-based wellness, and rejection of shame-based beauty standards."},{id:105,partId:8,category:"Routine Building",format:"multiple-choice",question:"What is the HERBULANCE core secondary motto?",options:["Buy • Consume • Repeat","Learn • Prepare • Thrive","Flawless • Ageless • Perfect","Quick • Easy • Miracle"],correctIndex:1,explanation:"Learn • Prepare • Thrive: empowering readers with knowledge, practical tools, and enduring wellness."}],Cy=()=>{const[u,f]=L.useState("all"),[v,c]=L.useState("all"),[j,y]=L.useState(0),[R,P]=L.useState(null),[D,p]=L.useState(!1),[q,M]=L.useState({}),[B,G]=L.useState("practice"),[N,_]=L.useState(!1),K=Ty.filter(le=>{const qe=u==="all"||le.partId===u,je=v==="all"||le.format===v;return qe&&je}),z=K[j]||K[0],oe=le=>{D&&B==="practice"||P(le)},ie=()=>{if(R===null||!z)return;const le=R===z.correctIndex;M(qe=>({...qe,[z.id]:{selected:R,correct:le}})),p(!0)},Se=()=>{j<K.length-1?(y(le=>le+1),P(null),p(!1)):_(!0)},W=()=>{y(0),P(null),p(!1),M({}),_(!1)},he=Object.keys(q).length,$=Object.values(q).filter(le=>le.correct).length,Ae=he>0?Math.round($/he*100):0;return n.jsxs("div",{className:"max-w-4xl mx-auto px-4 sm:px-6 py-8",children:[n.jsxs("div",{className:"text-center max-w-xl mx-auto space-y-2 mb-8",children:[n.jsx("span",{className:"text-xs font-mono font-bold tracking-widest text-[#6E8A5E] uppercase block",children:"100+ KNOWLEDGE CHECKS"}),n.jsx("h1",{className:"font-serif font-bold text-3xl sm:text-4xl text-[#1E3A2F]",children:"Cutaneous & Personal Care Quizzes"}),n.jsx("p",{className:"text-xs sm:text-sm text-[#2C302E]/80",children:"Reinforce your understanding of skin biology, hair and scalp science, nail hygiene, cosmetic literacy, and health safety."})]}),n.
