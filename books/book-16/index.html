ter flex flex-col justify-between ${_?"bg-[#FAF8F5] border-[#1E3A2F] ring-1 ring-[#1E3A2F]":"bg-white border-[#E7DEC8] hover:border-gray-400"}`,children:[n.jsxs("div",{children:[n.jsxs("div",{className:"flex items-center justify-between mb-2",children:[n.jsxs("span",{className:`text-xs font-mono font-bold px-2 py-0.5 rounded-full ${_?"bg-[#1E3A2F] text-white":"bg-[#E7DEC8] text-[#1E3A2F]"}`,children:["Day ",N.day]}),n.jsx("span",{className:"text-[10px] font-semibold text-[#6E8A5E] uppercase tracking-wider",children:N.pillar})]}),n.jsx("h4",{className:"font-serif font-bold text-sm text-[#1E3A2F] mb-1",children:N.title}),n.jsxs("p",{className:"text-xs text-[#2C302E]/90 leading-snug mb-2",children:[n.jsx("strong",{children:"Action: "}),N.practicalAction]})]}),n.jsxs("div",{className:"pt-2 border-t border-[#E7DEC8]/50 mt-2 flex items-center justify-between text-[11px]",children:[n.jsx("span",{className:"italic text-[#2C302E]/70 line-clamp-1",children:N.herbulanceNote}),n.jsx(zi,{className:`w-4 h-4 flex-shrink-0 ml-2 ${_?"text-[#1E3A2F]":"text-gray-300"}`})]})]},N.day)})})]})})]})},im=[{id:1,caseCode:"CS-01",patientProfile:{name:"Maya S.",age:16,gender:"Female",location:"Mumbai, India",climate:"Tropical, hot and humid",fitzpatrickType:"Type IV (Olive/Moderate Brown)",hairTexture:"Type 2B (Wavy, medium density)",occupationOrBudget:"High school student; modest family budget"},mainConcern:"Persistent forehead and chin comedones and inflammatory papules, leaving dark brown marks after every breakout.",biologicalExplanation:"Pubertal androgens stimulate sebaceous glands to produce excess sebum. Combined with follicular hyperkeratinization, microcomedones form. In Fitzpatrick Type IV skin, epidermal melanocytes are reactive to inflammatory cytokines (leukotrienes, prostaglandins), precipitating post-inflammatory hyperpigmentation (PIH). Tropical humidity increases sweat retention and follicular occlusion.",evidenceBasedOptions:["Gently wash face twice daily with a non-stripping, foaming syndet cleanser.","Introduce over-the-counter 2.5% benzoyl peroxide wash or leave-on azelaic acid (10%) which treats acne and suppresses tyrosinase without bleaching surrounding skin.","Apply lightweight, oil-free broad-spectrum SPF 30+ daily to prevent UV rays from darkening PIH marks."],possibleRisksAndCautions:["Avoid high-strength salicylic acid or scrubbing with abrasive cloths which triggers further PIH in brown skin.","Never pick or squeeze papules, as rupture releases bacteria into the dermis, worsening pigment depth."],affordabilityAndAccessibility:"Affordable generic benzoyl peroxide wash and basic drugstore sunscreen cost under $8 equivalent and last 2–3 months.",whenProfessionalEvaluationNeeded:"Presence of deep, painful nodules or cysts, scarring (ice-pick or boxcar scars), or lack of response after 8–12 weeks of consistent OTC care requires evaluation by a dermatologist.",keyLearningPoints:["Post-inflammatory marks in darker skin phototypes are driven by inflammation, so gentle anti-inflammatory care is crucial.","Daily sun protection is a primary treatment for resolving dark spots, not just fair skin sunburn."]},{id:2,caseCode:"CS-02",patientProfile:{name:"Elena K.",age:48,gender:"Female",location:"Stockholm, Sweden",climate:"Subarctic, cold, dry winters with indoor heating",fitzpatrickType:"Type II (Fair, burns easily)",hairTexture:"Type 1B (Straight, fine)",occupationOrBudget:"Accountant; middle budget"},mainConcern:"Severe facial tightness, burning when applying creams, and dry flaking patches around cheeks and mouth during winter.",biologicalExplanation:"Sub-zero outdoor air and dry indoor radiant heat cause an steep vapor pressure gradient, dramatically accelerating Transepidermal Water Loss (TEWL). At perimenopause, declining 17-beta estradiol levels decrease epidermal ceramide synthesis and sebaceous lipid secretion, impairing the stratum corneum barrier.",evidenceBasedOptions:["Switch from foaming cleansers to a non-foaming cleansing lotion or micellar water.","Layer a glycerin/hyaluronic acid serum onto damp skin, followed immediately by a lipid-rich ceramide and squalane barrier cream.","Apply a thin veil of pure petrolatum or dimethicone ointment (slugging) on severely chapped areas at bedtime.","Utilize an indoor bedroom humidifier to maintain relative humidity between 40% and 50%."],possibleRisksAndCautions:["Stop using exfoliating acids (glycolic/salicylic) or retinol until stinging ceases and barrier integrity is restored.","Avoid hot-water facial rinsing, which solubilizes fragile barrier lipids."],affordabilityAndAccessibility:"Pure pharmaceutical petrolatum (petroleum jelly) and basic glycerin cost minimal amounts and provide exceptional barrier occlusivity.",whenProfessionalEvaluationNeeded:"Persistent facial redness with telangiectasias or pustules may indicate rosacea rather than simple xerosis and warrants dermatological diagnosis.",keyLearningPoints:["Barrier compromise leads to sensory hyper-reactivity (stinging from inert products).","Cold climates necessitate transitioning to heavier occlusives and halting active exfoliants."]},{id:3,caseCode:"CS-03",patientProfile:{name:"Marcus T.",age:28,gender:"Male",location:"Atlanta, USA",climate:"Humid subtropical",fitzpatrickType:"Type V (Deep Brown)",hairTexture:"Type 4C (Tightly coiled, kinky hair)",occupationOrBudget:"Warehouse logistics manager; moderate budget"},mainConcern:"Severe razor bumps, itching, and dark scabs on the neck and jawline after close shaving for work grooming guidelines.",biologicalExplanation:"Pseudofolliculitis barbae (PFB). Curved hair follicles produce tightly coiled, curved hair shafts. When shaved closely below the follicular orifice, the sharp beveled hair tip curves backward and pierces the interfollicular epidermis as it grows, eliciting an intense foreign-body inflammatory reaction and secondary PIH.",evidenceBasedOptions:["Stop close clean-shaving with multi-blade cartridge razors; switch to an electric clipper with a 1–2 mm guard or a single-blade safety razor with the grain.","Shave only after showering when hair is softened by warm water and a hydrating shaving cream.","Apply a gentle leave-on azelaic acid 10% or low-strength salicylic acid lotion at night to reduce follicular plugging and inflammation."],possibleRisksAndCautions:["Never shave against the grain or pull skin taut while shaving.","Avoid using alcohol-based aftershaves that sting and dehydrate the epidermal barrier."],affordabilityAndAccessibility:"Switching to an electric beard trimmer with guard requires a one-time purchase ($30–$40) and eliminates recurring expensive razor cartridge costs.",whenProfessionalEvaluationNeeded:"Large suppurative nodules, abscesses, or keloid scar formation on the neck necessitate physician care for prescription topical or systemic therapy.",keyLearningPoints:["PFB is a mechanical foreign-body condition, not poor personal hygiene.","Leaving a 1 mm stubble length prevents curved hair tips from curling back into the skin."]},{id:4,caseCode:"CS-04",patientProfile:{name:"Zahra A.",age:22,gender:"Female",location:"London, UK",climate:"Temperate maritime, overcast",fitzpatrickType:"Type III (Medium, olive undertone)",hairTexture:"Type 3A (Loose curls)",occupationOrBudget:"University student; strict budget"},mainConcern:"Sudden widespread diffuse hair shedding when showering and brushing over the past 6 weeks, causing extreme panic.",biologicalExplanation:"Classic Telogen Effluvium (TE). Detailed history reveals Zahra experienced severe COVID-19 infection with 39°C fever and underwent stressful final university exams roughly 3 months prior. The systemic fever and physiological shock triggered a synchronized premature transition of ~25% of anagen hairs into telogen.",evidenceBasedOptions:["Reassurance that telogen effluvium is non-scarring and self-limiting; shed hairs have already begun regenerating at the root.","Maintain adequate dietary protein (minimum 1.0–1.2 g/kg body weight) and screen basic blood markers (complete blood count, ferritin, TSH, vitamin D).","Gentle scalp handling with wide-tooth detangling in the shower with conditioner."],possibleRisksAndCautions:["Avoid panic-purchasing unproven expensive hair-growth gummies, lasers, or high-dose biotin which lacks clinical evidence for TE and distorts lab tests.","Do not avoid washing hair: hairs shed during washing were already detached in the telogen rest phase."],affordabilityAndAccessibility:"Requires zero expensive products. Focus on balanced whole food nutrition, affordable basic shampoo, and patience.",whenProfessionalEvaluationNeeded:"Shedding persisting beyond 6 months (chronic telogen effluvium), focal round bald patches (alopecia areata), or hairline recession mandates trichological/dermatological review.",keyLearningPoints:["Telogen shedding has a 2-to-4 month time lag from the inciting physiological trigger.","Acute telogen effluvium resolves spontaneously once the underlying stressor or deficiency is corrected."]},{id:5,caseCode:"CS-05",patientProfile:{name:"Carlos R.",age:35,gender:"Male",location:"Bogotá, Colombia",climate:"High-altitude subtropical highland (cool, high UV index)",fitzpatrickType:"Type III (Light brown/olive)",hairTexture:"Type 2A (Loose waves)",occupationOrBudget:"Outdoor civil construction supervisor; modest budget"},mainConcern:"Red, flaky, itchy patches around the sides of the nose (nasolabial folds), eyebrows, and beard, worsening when stressed.",biologicalExplanation:"Seborrhoeic dermatitis. High sebaceous gland density on the central face provides abundant triglycerides. Commensal Malassezia globosa and restricta yeasts break down sebum into irritating free fatty acids, triggering epidermal inflammation and accelerated parakeratotic flaking in genetically predisposed individuals.",evidenceBasedOptions:["Cleanse face and beard 2–3 times weekly with a 1% or 2% ketoconazole or zinc pyrithione medicated wash, leaving lather on for 3 minutes before rinsing.","Use a light, non-greasy moisturizer with squalane and colloidal oatmeal to calm itching.","High-altitude UV index requires broad-spectrum SPF 50 daily with fluid texture."],possibleRisksAndCautions:["Do not apply heavy vegetable oils (like pure olive or coconut oil) directly to affected areas, as Malassezia yeasts metabolize these lipids and proliferate.","Avoid long-term continuous use of high-potency topical steroid creams on the face."],affordabilityAndAccessibility:"Over-the-counter anti-dandruff shampoo used as a face wash is extremely cost-effective ($5–$8 bottle lasts 6 months).",whenProfessionalEvaluationNeeded:"Failure to respond to OTC antifungals, severe facial swelling, or involvement of the eyelid margins (blepharitis) requires medical management.",keyLearningPoints:["Seborrhoeic dermatitis is not caused by dry skin; applying thick oils worsens yeast overgrowth.","Medicated antifungal cleansers must remain on the skin for 3 to 5 minutes to exert biological activity."]},{id:6,caseCode:"CS-06",patientProfile:{name:"Amara N.",age:31,gender:"Female",location:"Lagos, Nigeria",climate:"Tropical wet and dry, high heat and humidity",fitzpatrickType:"Type VI (Deeply pigmented black)",hairTexture:"Type 4B/4C (Tightly coiled, high shrinkage)",occupationOrBudget:"Fashion merchandiser; flexible budget"},mainConcern:"Thinning and tender small bumps along the frontal hairline and temples following continuous tight braided extensions and weaves.",biologicalExplanation:"Early-stage Traction Alopecia. Sustained physical tension on the frontotemporal hair follicles causes perifollicular erythema, mechanical micro-trauma to the outer root sheath, and hair shaft breakage. If tension continues unchecked, chronic follicular inflammation can lead to irreversible scarring (cicatricial) alopecia.",evidenceBasedOptions:["Immediately transition to tension-free hairstyles (loose afro, loose twists, silk wrap, or soft head wraps).","Instruct stylist that braiding must never pull the scalp or cause headaches; front temporal perimeter hairs should be left unbraided.","Moisturize hair shaft with water-based leave-in conditioners sealed with light jojoba or argan oil.","Sleep on a satin/silk pillowcase to minimize frictional drag on fragile edges."],possibleRisksAndCautions:["Do not apply chemical relaxers or hot irons to the weakened perimeter.","Avoid tightly slicking back baby hairs with high-alcohol, drying gels that cause mechanical breakage."],affordabilityAndAccessibility:"Adopting tension-free styling costs nothing and protects hair follicles from permanent destruction.",whenProfessionalEvaluationNeeded:"Smooth, shiny bald patches with complete loss of follicular ostia (pores) indicate scarring alopecia and require urgent evaluation by a board-certified dermatologist.",keyLearningPoints:["Traction alopecia is 100% preventable and completely reversible in its early inflammatory stage.","Pain or tension bumps after braiding is an alarm signal of mechanical follicular trauma."]},{id:7,caseCode:"CS-07",patientProfile:{name:"Kenji T.",age:26,gender:"Male",location:"Tokyo, Japan",climate:"Temperate humid continental",fitzpatrickType:"Type III (East Asian, fair-medium)",hairTexture:"Type 1A (Straight, coarse, thick)",occupationOrBudget:"Software engineer; flexible budget"},mainConcern:"Sudden onset of stinging, peeling, red rash, and breakouts after adopting a 10-step skincare routine featuring multiple exfoliants and retinoids simultaneously.",biologicalExplanation:"Acute Irritant Contact Dermatitis with severe stratum corneum barrier disruption. Using 10% AHA toner, 2% BHA serum, 1% retinol, and 15% Vitamin C in the same week stripped intercellular ceramides and depleted NMF, spiking TEWL. The rash is an irritant reaction, not an acne purge or an allergy.",evidenceBasedOptions:['Institute a complete "skincare elimination reset" for 2–4 weeks: stop all acids, retinoids, scrubs, and Vitamin C immediately.',"Use only a gentle lukewarm water splash or ultra-mild non-foaming cleanser.","Apply a minimalist barrier cream containing ceramides, panthenol (provitamin B5), and colloidal oatmeal twice daily.","Use a pure mineral (zinc oxide) sunscreen during daytime outdoor exposure."],possibleRisksAndCautions:['Do not apply tea tree oil, alcohol toners, or clay masks to "treat" the stinging bumps.',"Never reintroduce all active products at once; introduce only one active ingredient every 4–6 weeks."],affordabilityAndAccessibility:"Simplifying the routine saves significant money; two basic gentle products cost less than complex multistep regimens.",whenProfessionalEvaluationNeeded:"If weeping crusts, facial edema, or severe pain develop, medical evaluation for secondary impetigo or allergic contact dermatitis is warranted.",keyLearningPoints:["More products and higher active percentages do not equal better skin health.","The skin barrier requires time to rebuild lipid lamellae before any active acids are tolerated."]},{id:8,caseCode:"CS-08",patientProfile:{name:"Grace O.",age:72,gender:"Female",location:"Melbourne, Australia",climate:"Temperate, high solar UV radiation index",fitzpatrickType:"Type I (Very fair, burns easily, blue eyes)",hairTexture:"Type 1B (Straight, gray/white, sparse)",occupationOrBudget:"Retired teacher; fixed pension budget"},mainConcern:"Extremely thin, papery skin on forearms that bruises and tears easily from minor household bumps; dry scaly rough patch on nose that does not heal.",biologicalExplanation:"Senile purpura and cutaneous atrophy from chronological intrinsic aging combined with cumulative solar elastosis. Dermal thickness decreases, microvascular collagen support degrades, and capillaries rupture easily. The non-healing, rough scaly patch on the nose has the clinical characteristics of actinic keratosis or early squamous/basal cell carcinoma.",evidenceBasedOptions:["Immediate referral for medical dermatological evaluation of the non-healing nasal lesion.","For arm fragility: apply rich emollient creams containing urea (5%) or ceramides twice daily to maintain stratum corneum hydration and tensile flexibility.","Wear protective UPF 50+ lightweight long-sleeved clothing and soft cotton arm guards during gardening.","Avoid harsh adhesive bandages; use gentle silicone tape or tubular bandages."],possibleRisksAndCautions:["Never ignore a scaly, crusted, or bleeding lesion that fails to heal after 4 weeks.","Avoid vigorous rubbing with towels or coarse loofahs that provoke skin tears."],affordabilityAndAccessibility:"Basic 5% urea cream and petroleum jelly are inexpensive and clinically validated for mature xerosis.",whenProfessionalEvaluationNeeded:"Any non-healing scaly papule, pearly nodule, or changing spot requires urgent skin cancer screening.",keyLearningPoints:["Older skin requires barrier protection and gentle physical handling to prevent painful skin tears.","Chronically sun-exposed skin in high-UV regions warrants regular professional skin cancer checks."]},{id:9,caseCode:"CS-09",patientProfile:{name:"Fatima B.",age:33,gender:"Female",location:"Dubai, UAE",climate:"Arid desert, intense heat, constant indoor air conditioning",fitzpatrickType:"Type IV (Mediterranean/Middle Eastern)",hairTexture:"Type 2C (Coarse waves)",occupationOrBudget:"Graphic designer; moderate budget"},mainConcern:"Symmetrical butterfly-pattern dark brown patches across the bridge of the nose, upper cheeks, and forehead that darken every summer.",biologicalExplanation:"Melasma. Hyperfunctional epidermal and dermal melanocytes produce excessive eumelanin driven by hormonal factors (postpartum, oral contraceptive use) combined with intense ultraviolet (UVA/UVB) and visible high-energy blue light (HEVL). Indoor air conditioning dehydrates the surface barrier.",evidenceBasedOptions:["Daily broad-spectrum SPF 50+ sunscreen containing iron oxides (tinted) to block both UV rays and visible light.","Incorporate evidence-based tyrosinase inhibitors: topical azelaic acid (15–20%), tranexamic acid (2–5%), or niacinamide (4%).","Wear wide-brimmed hats and seek shade between 10 AM and 4 PM."],possibleRisksAndCautions:["Strictly avoid unregulated bleaching creams containing hydroquinone mixtures or corticosteroids sold without prescription.","Avoid high-energy heat treatments (hot saunas, aggressive lasers) which can paradoxically trigger deeper melasma pigment."],affordabilityAndAccessibility:"Tinted mineral sunscreen and azelaic acid are accessible over the counter and form the backbone of safe pigment care.",whenProfessionalEvaluationNeeded:"Severe, recalcitrant melasma may benefit from prescription triple combination cream (Kligman formula) or oral tranexamic acid managed by a dermatologist.",keyLearningPoints:["Melasma is a chronic pigmentary condition requiring long-term photoprotection rather than a temporary spot.","Visible light plays an active role in melasma, making iron oxide tints clinically superior to clear sunscreens."]},{id:10,caseCode:"CS-10",patientProfile:{name:"Lucas M.",age:19,gender:"Male",location:"São Paulo, Brazil",climate:"Subtropical, humid",fitzpatrickType:"Type III (Medium olive)",hairTexture:"Type 3B (Tight springy curls)",occupationOrBudget:"College student & competitive swimmer; strict budget"},mainConcern:"Dry, brittle, greenish-tinged hair that tangles painfully, along with dry, cracking toenails and athlete’s foot itching.",biologicalExplanation:"Chlorinated swimming pool water contains copper ions and hypochlorous acid that oxidize and bind to sulfur groups in keratin, stripping hair surface 18-MEA lipids and depositing copper salts (causing green discoloration in light or porous hair). Constant wet foot environments facilitate tinea pedis fungal proliferation and distal onycholysis.",evidenceBasedOptions:["Wet hair with clean tap water and apply a light silicone conditioner BEFORE putting on a silicone swim cap to block chlorinated water absorption.","Shampoo with a chelating or clarifying shampoo once weekly to remove copper and mineral deposits.","Thoroughly dry between toes after swimming and apply over-the-counter terbinafine or clotrimazole antifungal cream for 2 weeks.","Wear flip-flops in public locker rooms and showers."],possibleRisksAndCautions:["Do not rip or tear brittle toenails; trim straight across with clean clippers.","Never walk barefoot in communal pool facilities."],affordabilityAndAccessibility:"Pre-wetting hair with tap water costs zero; generic athlete's foot cream is widely available and affordable.",whenProfessionalEvaluationNeeded:"Thickened, yellow, crumbling toenails spreading under the nail bed (onychomycosis) require prescription treatment if OTC measures fail.",keyLearningPoints:["Hair functions like a sponge: saturated with fresh water first, it absorbs far less chlorinated pool water.","Moist communal environments are prime vectors for fungal dermatophyte infections."]},{id:11,caseCode:"CS-11",patientProfile:{name:"Chloe D.",age:24,gender:"Female",location:"Toronto, Canada",climate:"Continental, severe freezing winter",fitzpatrickType:"Type II (Fair)",hairTexture:"Type 2A (Fine wavy)",occupationOrBudget:"Nail artist apprentice; modest budget"},mainConcern:"Severe red, itchy, vesicular eczema on finger pads and cuticles that appeared after practicing DIY gel nail sets at home.",biologicalExplanation:"Allergic Contact Dermatitis (ACD) to (meth)acrylates (HEMA, HPMA, ethyl cyanoacrylate). Using an underpowered, uncalibrated UV/LED lamp or touching uncured gel liquid onto periungual skin sensitized cutaneous Langerhans cells, initiating a lifelong Type IV cell-mediated allergy.",evidenceBasedOptions:["Immediately cease using gel nails, uncured acrylics, and UV lamps.","Protect hands with nitrile gloves (acrylates penetrate latex gloves within minutes).","Apply bland petrolatum ointment to calm periungual barrier fissures.","Use medical fragrance-free hand creams frequently after handwashing."],possibleRisksAndCautions:["Beware: acrylate sensitization is lifelong and can cause cross-reactivity with future dental composite restorations and orthopaedic surgical cements.","Do not cut or push down inflamed periungual cuticles."],affordabilityAndAccessibility:"Switching to standard air-drying lacquer nail polish (free of reactive acrylates) is safe, affordable, and requires no UV device.",whenProfessionalEvaluationNeeded:"Immediate patch testing with a contact dermatitis specialist dermatologist to confirm specific acrylate allergens and receive documentation for medical/dental records.",keyLearningPoints:["Acrylate allergies from home gel kits are a major emerging public health problem.","Uncured gel monomer must never contact human skin."]},{id:12,caseCode:"CS-12",patientProfile:{name:"Tariq H.",age:42,gender:"Male",location:"Berlin, Germany",climate:"Temperate oceanic",fitzpatrickType:"Type III (Medium)",hairTexture:"Type 1C (Straight, coarse)",occupationOrBudget:"Bus driver; moderate budget"},mainConcern:"Progressive thinning at the vertex (crown) and receding temporal hairline over the past 4 years; father and maternal uncle had early baldness.",biologicalExplanation:"Androgenetic Alopecia (male pattern hair loss). Genetically susceptible hair follicles on the frontoparietal scalp and vertex exhibit elevated 5-alpha reductase activity, converting testosterone into dihydrotestosterone (DHT). DHT binds to follicle androgen receptors, shortening anagen and causing progressive follicular miniaturization into vellus hairs.",evidenceBasedOptions:["Discuss validated medical therapies with a physician: topical 5% minoxidil (OTC) and prescription oral finasteride 1 mg/day.","Maintain realistic expectations: medications stabilize loss and stimulate partial regrowth over 6–12 months of continuous adherence.","Use a gentle ketoconazole 1–2% shampoo 2 times weekly as an adjunct."],possibleRisksAndCautions:["Stopping minoxidil or finasteride results in rapid loss of all hair maintained by the medication within 3 to 6 months.",'Avoid miracle "DHT blocker" shampoos with zero clinical evidence.'],affordabilityAndAccessibility:"Generic over-the-counter 5% minoxidil liquid or foam is affordable ($10–$15 per month).",whenProfessionalEvaluationNeeded:"Comprehensive dermatological consultation is essential to rule out concurrent scarring alopecia or thyroid dysfunction prior to initiating systemic 5-AR inhibitors.",keyLearningPoints:["Pattern hair loss is progressive; early intervention preserves existing follicles far more effectively than attempting to restore long-lost follicles.","Hair loss therapies require lifelong adherence to maintain results."]},{id:13,caseCode:"CS-13",patientProfile:{name:"Leila K.",age:29,gender:"Female",location:"Casablanca, Morocco",climate:"Mediterranean, warm sunny coastal",fitzpatrickType:"Type IV (Olive)",hairTexture:"Type 3C (Tight corkscrew curls)",occupationOrBudget:"Administrative officer; modest budget"},mainConcern:"Dry, brittle, snapping hair ends after monthly high-heat flat ironing, paired with scalp itching when using heavy argan and olive oils on the scalp.",biologicalExplanation:'Heat-induced cortex protein denaturation (temperatures >185°C vaporize internal water, creating steam bubbles inside the hair cortex known as "bubble hair"). Applying heavy culinary oils directly to the scalp feeds Malassezia yeasts, causing scalp dysbiosis and pruritus, while failing to hydrate the dehydrated hair ends.',evidenceBasedOptions:["Reserve plant oils (argan, jojoba) strictly for the hair shaft lengths and ends; keep heavy oils off the scalp.","Apply a leave-in conditioner formulated with humectants (glycerin, aloe) followed by a heat-protectant silicone spray before any flat ironing.","Lower flat iron heat to below 175°C (350°F) and limit heat passes to once per hair section.","Trim 1–2 cm of damaged split ends to stop splits traveling up the shaft."],possibleRisksAndCautions:["Never flat-iron damp or wet hair: rapid boiling causes catastrophic cortex destruction.","Do not leave raw food oils on the scalp for days without shampooing."],affordabilityAndAccessibility:"Traditional argan oil is excellent when used sparingly on the ends; simple water misting plus a dab of oil provides affordable moisture locking.",whenProfessionalEvaluationNeeded:"Severe scalp scale with hair shedding or localized hair loss requires medical trichology evaluation.",keyLearningPoints:["The scalp is living skin with an active microbiome, whereas the hair shaft is non-living keratin.","Oils seal moisture but do not hydrate on their own; water or water-based products must precede oil."]},{id:14,caseCode:"CS-14",patientProfile:{name:"Samuel P.",age:60,gender:"Male",location:"Johannesburg, South Africa",climate:"Highveld, dry winter, sunny",fitzpatrickType:"Type V (Brown)",hairTexture:"Type 4A (Dense coiled)",occupationOrBudget:"Carpenter; moderate budget"},mainConcern:"Thickened, dry, fissured heel skin that cracks painfully and bleeds during winter; rough calloused palms with splinter-prone cuticles.",biologicalExplanation:"Keratoderma / severe heel xerosis with painful rhagades (deep fissures). Repetitive mechanical pressure from standing combined with dry winter air stimulates epidermal hyperkeratosis. As the thick stratum corneum loses water, its elasticity plummets; under weight-bearing tension, the rigid keratin snaps open into the sensitive dermis.",evidenceBasedOptions:["Soak feet briefly in lukewarm water, gently buff thickened areas with a pumice stone once weekly (never razor blades).","Apply a 20% to 40% urea cream or ointment directly to cracked heels twice daily (urea acts as both a potent humectant and kerato-dissolving agent).","Apply pure petrolatum and wear clean 100% cotton socks overnight to lock in moisture.","Wear supportive, closed-back cushioned shoes to reduce heel rim shearing force."],possibleRisksAndCautions:["Never cut calluses with razor blades or scrapers at home: risk of deep laceration and dangerous infection.","If the patient has diabetes or neuropathy, home rasping is strictly contraindicated; podiatric care is mandatory."],affordabilityAndAccessibility:"Urea creams and petrolatum are widely accessible, low-cost staples available in pharmacies worldwide.",whenProfessionalEvaluationNeeded:"Bleeding fissures with signs of bacterial cellulitis (spreading warmth, red streaks, fever, pus) require urgent medical antibiotic treatment.",keyLearningPoints:["High-concentration urea creams dissolve hard dead keratin while deeply hydrating.","Cracked heels are a mechanical and barrier problem; preventing shearing force is as important as moisturizing."]},{id:15,caseCode:"CS-15",patientProfile:{name:"Hannah W.",age:38,gender:"Female",location:"Denver, Colorado, USA",climate:"Semi-arid, high altitude, 300+ sunny days/year",fitzpatrickType:"Type I (Very fair, freckles, red-blonde hair)",hairTexture:"Type 2B (Wavy, fine)",occupationOrBudget:"Outdoor trail guide; flexible budget"},mainConcern:"Flushing and redness across cheeks after hot drinks, spicy food, or sun exposure, developing small red bumps without blackheads; concerned about a new asymmetrical dark freckle on shoulder.",biologicalExplanation:"Two distinct issues: 1) Erythematotelangiectatic and papulopustular Rosacea, driven by cutaneous neurovascular hyperreactivity and Demodex mite inflammatory response. 2) The asymmetrical dark shoulder freckle triggers dermatological ABCDE melanoma criteria (Asymmetry, Border irregularity) given Hannah’s fair skin phototype and outdoor occupation.",evidenceBasedOptions:["Priority 1: Immediate in-person dermatological examination and dermoscopy of the asymmetrical shoulder lesion.","For Rosacea: Identify and avoid known personal triggers (spicy foods, extreme temperature swings, alcohol).","Apply gentle azelaic acid 10–15% gel to suppress facial papulopustular inflammation and calm redness.","Daily broad-spectrum mineral SPF 50 sunscreen (zinc oxide) which calms heat-sensitive rosacea skin without stinging."],possibleRisksAndCautions:["Do not apply acne scrubs, strong glycolic acid, or alcohol-based witch hazel to rosacea flushing.","Never attempt to burn off, scratch, or treat moles or atypical pigmented lesions at home."],affordabilityAndAccessibility:"Sunscreen, brimmed sun hats, and basic OTC azelaic acid provide affordable foundational care while prioritizing insurance/budget for professional mole checks.",whenProfessionalEvaluationNeeded:"The new asymmetrical pigmented lesion warrants urgent professional biopsy/dermoscopy. Any suspicious mole cannot be managed with cosmetic products.",keyLearningPoints:["Rosacea papules lack comedones (blackheads/whiteheads), distinguishing rosacea from acne vulgaris.","Never delay professional assessment of an asymmetrical, evolving skin lesion."]}],zy=()=>{const[u,f]=L.useState(null),v=u?im.find(c=>c.id===u):void 0;return n.jsxs("div",{className:"max-w-5xl mx-auto px-4 sm:px-6 py-8",children:[n.jsxs("div",{className:"text-center max-w-xl mx-auto space-y-2 mb-8",children:[n.jsx("span",{className:"text-xs font-mono font-bold tracking-widest text-[#6E8A5E] uppercase block",children:"REALISTIC EDUCATIONAL MODELS"}),n.jsx("h1",{className:"font-serif font-bold text-3xl sm:text-4xl text-[#1E3A2F]",children:"Fifteen Case Studies"}),n.jsx("p",{className:"text-xs sm:text-sm text-[#2C302E]/80",children:"Explore realistic educational case scenarios illustrating how dermatological science, hair textures, climates, and budgets intersect in daily life."}),n.jsx("p",{className:"text-[11px] text-gray-400 italic",children:"(Educational fictional models designed for study; not actual clinical patients or diagnostic proof.)"})]}),v?n.jsxs("div",{className:"space-y-6",children:[n.jsxs("div",{className:"flex items-center justify-between pb-4 border-b border-[#E7DEC8]",children:[n.jsxs("button",{onClick:()=>f(null),className:"flex items-center space-x-2 text-xs font-bold text-[#1E3A2F] hover:text-[#6E8A pH cleanser","Light fluid hydrating lotion","Broad-spectrum lightweight sunscreen SPF 30-50"],evening:["Gentle cleanser","Niacinamide serum all over","Richer cream on cheeks, light gel on forehead/nose"],suitableFor:"Classic combination skin, seasonal transitions."},{id:"rt-05",name:"Sensitive & Reactive Skin (Barrier Compromised)",focus:"Extinguishing erythema and rebuilding lipid bilayers with zero fragrance.",morning:["Lukewarm water splash only","Colloidal oatmeal & panthenol soothing cream","100% mineral zinc oxide SPF 50 (fragrance-free)"],evening:["Ultra-gentle non-foaming cleansing milk","Ceramide complex cream with madecassoside","Thin veil of pharmaceutical petrolatum if stinging"],suitableFor:"Burning, stinging, post-procedure, compromised acid mantle."},{id:"rt-06",name:"Acne-Prone Mild Comedonal Care",focus:"Gentle follicular keratoregulation and bacterial moderation.",morning:["Gentle foaming cleanser","Lightweight oil-free moisturizer","Non-comedogenic fluid SPF 30+"],evening:["Gentle cleanser","Alternate nights: Azelaic acid 10% and low-strength Retinol 0.2%","Soothing light barrier lotion"],suitableFor:"Blackheads, closed comedones, mild adolescent or adult breakouts."},{id:"rt-07",name:"Post-Inflammatory Hyperpigmentation (Skin of Colour Focus)",focus:"Inhibiting excess melanogenesis while aggressively calming inflammation.",morning:["Gentle hydrating cleanser","Azelaic acid 10% or tranexamic acid 3% serum","Tinted broad-spectrum SPF 50 with iron oxides (blocks visible blue light)"],evening:["Gentle cleanser","Niacinamide 4% serum","Barrier repairing ceramide cream"],suitableFor:"Fitzpatrick phototypes IV-VI with persistent dark marks."},{id:"rt-08",name:"Mature & Dignified Ageing Skin Support",focus:"Comfort, collagen matrix support, elasticity, and tear resistance.",morning:["Gentle cream wash","Antioxidant serum (Vitamin C or green tea polyphenol)","Peptide barrier cream","Moisturizing SPF 50"],evening:["Nourishing cleanser","Gentle encapsulated Retinol 0.3% (2-3x weekly)","Rich cholesterol and ceramide barrier ointment"],suitableFor:"Thinning skin, fine lines, loss of dermal firmness."},{id:"rt-09",name:"Rosacea & Flushing-Prone Skin Care",focus:"Vasomotor calming and Demodex mite suppression without irritation.",morning:["Lukewarm water rinse","Azelaic acid 10% gel-cream","Unscented 100% zinc oxide mineral SPF 50"],evening:["Gentle no-rub micellar water or cream cleanser","Centella asiatica (Cica) and squalane barrier moisturizer"],suitableFor:"Erythematotelangiectatic and papulopustular rosacea."},{id:"rt-10",name:"Pregnancy-Safe Skin Balance Routine",focus:"Safe brightening and hydration avoiding teratogenic ingredients.",morning:["Gentle pH-balanced cleanser","Vitamin C or Azelaic acid 10%","Broad-spectrum mineral SPF 50 (melasma defense)"],evening:["Hydrating cleanser","Hyaluronic acid + peptide lotion","Rich squalane cream"],suitableFor:"Pregnant and nursing individuals avoiding retinoids and high-dose salicylic acid."},{id:"rt-11",name:"Athletic & High-Sweat Routine",focus:"Preventing sweat-induced folliculitis and chafing.",morning:["Quick water wash","Antioxidant gel","Water-resistant sweat-proof SPF 50"],postWorkout:["Immediate body & face cleanse with zinc pyrithione or mild cleanser","Fresh clean clothes"],evening:["Gentle foaming wash","Lightweight barrier restoring emulsion"],suitableFor:"Athletes, gym-goers, outdoor manual laborers."},{id:"rt-12",name:"Ultra-Low Budget Routine ($15 Total Annualized)",focus:"Maximum pharmacological efficacy with generic store formulations.",morning:["Water rinse","Store-brand generic broad-spectrum SPF 30 or 50 ($6)"],evening:["Store-brand fragrance-free gentle baby wash or syndet bar ($2)","Store-brand petroleum jelly or generic glycerin cream ($3)"],suitableFor:"Students, low-income households, unhoused assistance programs."},{id:"rt-13",name:"Accessible & One-Handed Adapted Routine",focus:"Ergonomic packaging with pump tops, flip caps, and no-scrub solutions.",morning:["Pump micellar water on reusable cotton pad or soft cloth","Pump moisturizing sunscreen SPF 30+"],evening:["Pump no-rinse micellar water","Wide-pump bottle ceramide barrier lotion"],suitableFor:"Individuals with arthritis, hemiplegia, tremors, or limited hand dexterity."},{id:"rt-14",name:"Extreme Hot & Humid Tropical Routine",focus:"Anti-occlusive lightness that breathes while offering maximum UV defense.",morning:["Gentle foaming wash","Oil-free antioxidant water gel","Non-greasy, sweat-resistant SPF 50 dry-touch fluid"],evening:["Cleansing water or light gel wash","Niacinamide 2-5% soothing gel lotion"],suitableFor:"Monsoon climates, equatorial regions, humid coastal areas."},{id:"rt-15",name:"Shift-Worker Circadian Inverted Routine",focus:"Protecting the skin barrier when sleep schedules are nocturnal.",beforeShift:["Gentle cleanse","Antioxidant hydrator","SPF 30 if commuting during daylight"],beforeSleep:["Cleanser to wash off workplace dirt/sweat","Soothing nocturnal barrier cream with ceramides and melatonin"],suitableFor:"Night-shift nurses, factory workers, emergency service personnel."}],Fy=[{id:"ht-01",texture:"Type 1A/1B (Fine, Straight)",title:"Lightweight Weightless Cleansing",tip:"Straight hair allows sebum to travel rapidly down the shaft. Wash every 1–2 days using lightweight clarifying or volumizing shampoos, and apply conditioner only to the bottom two inches to avoid weighed-down roots."},{id:"ht-02",texture:"Type 1C (Coarse Straight)",title:"Cuticle Smoothing & Moisture Balance",tip:"Thicker straight strands resist frizz but can feel stiff. Incorporate lightweight argan or camellia oil on damp ends to soften keratin fibrils and enhance natural shine."},{id:"ht-03",texture:"Type 2A/2B (Loose Waves)",title:"Wave Definition without Build-Up",tip:"Use sulfate-free or gentle syndet shampoos 2–3 times weekly. Detangle gently in the shower with conditioner using a wide-tooth comb rather than brushing dry, which disrupts wave clumping and causes frizz."},{id:"ht-04",texture:"Type 2C (Defined Coarse Waves)",title:"Anti-Humidity Sealing",tip:"Waves with tendency to frizz benefit from leave-in conditioners containing film-forming humectants (flaxseed extract, panthenol) sealed with a pea-sized amount of jojoba oil."},{id:"ht-05",texture:"Type 3A (Loose Spirals)",title:"Squish to Condish Hydration",tip:"Wash weekly or semi-weekly. Apply conditioner lavishly and cup water into the curls with your hands to saturate the cortex before rinsing loosely, leaving a hint of slip."},{id:"ht-06",texture:"Type 3B/3C (Tight Curls & Corkscrews)",title:"The LOC / LGO Layering Method",tip:"Layer Liquid (water/aloe leave-in) + Oil (sweet almond or argan) + Cream (shea or cetyl alcohol butter) to seal moisture into hair shafts with irregular cross-sections."},{id:"ht-07",texture:"Type 4A (Dense Soft Coils)",title:"Sectioned Finger Detangling",tip:"Always divide hair into 4–6 manageable sections before washing or detangling. Never detangle dry coils; always saturate with water and high-slip slippery elm or silicone-rich conditioner."},{id:"ht-08",texture:"Type 4B (Z-Pattern Angular Coils)",title:"Pre-Poo Oil Protection",tip:"Apply coconut or olive oil 30 minutes before shampooing. The low molecular weight of coconut oil penetrates the cuticle to reduce protein loss and hygral fatigue (swelling/shrinking damage)."},{id:"ht-09",texture:"Type 4C (Tightly Coiled / High Shrinkage)",title:"Tension-Free Protective Styling",tip:"Opt for loose two-strand twists, loose braids, or crown buns. Ensure edges and nape are completely loose without tension, and sleep in a smooth silk or satin bonnet to prevent nocturnal frictional breakage."},{id:"ht-10",texture:"Bleached / Color-Treated Hair",title:"Bond-Repairing & Low-pH Rinsing",tip:"Bleaching raises cuticles and oxidizes cortical disulfide bonds. Use acid-balanced products (pH 4.5–5.0) and bond-maintenance treatments containing bis-aminopropyl diglycol dimaleate or maleic acid."},{id:"ht-11",texture:"Chemically Relaxed Hair",title:"Protein-Moisture Balancing",tip:"Relaxed hair has lost 30–50% of tensile strength. Alternate weekly deep-conditioning hydrating masks with hydrolyzed wheat or keratin protein treatments to buffer weakened shaft areas."},{id:"ht-12",texture:"Fine Hair / Prone to Flatness",title:"Reverse Washing Technique",tip:"Apply conditioner first to mid-lengths and ends, let sit for 3 minutes, then apply gentle shampoo directly over it and rinse all together. This hydrates fragile ends without leaving residual weight on fine shafts."},{id:"ht-13",texture:"Oily Scalp with Dry Ends",title:"Scalp Targeted Cleansing",tip:"Direct shampoo nozzles specifically to the scalp skin and lather with fingertips (not nails). Let the run-off wash the lengths rather than bunching and scrubbing hair ends up onto the scalp."},{id:"ht-14",texture:"High-Porosity Damaged Hair",title:"Cold-Water Final Rinse & Seal",tip:"Gently finish hair rinsing with cool water, and apply leave-in conditioner containing ceramides and heavier plant butters to temporarily fill open cuticle voids."},{id:"ht-15",texture:"Gray / Silver / Depigmented Hair",title:"Anti-Yellowing & UV Protection",tip:"Loss of melanin leaves gray hair vulnerable to UV oxidation, which turns keratin yellowish. Use a violet-toned pigment shampoo once every 2 weeks and apply UV hair mist or wear a hat in strong sun."}],My=[{id:"np-01",title:"Never Cut or Aggressively Push Cuticles",guideline:"The eponychium (cuticle) is an essential waterproof barrier protecting the sterile nail matrix from bacteria and yeasts. Cutting it invites painful paronychia and chronic nail dystrophy. Instead, gently massage with jojoba oil."},{id:"np-02",title:"Trim Straight Across and Round Edges Gently",guideline:"To prevent painful ingrown nails (especially toenails), always clip straight across with clean, sharp clippers and round only the sharp outer corners with an emery board."},{id:"np-03",title:"File in One Direction (No Sawing)",guideline:"Filing back-and-forth in a sawing motion creates micro-fissures in the keratin layers of the nail plate, causing peeling and split edges. File in one gentle fluid direction from edge toward center."},{id:"np-04",title:"Wear Lined Rubber Gloves for Wet Household Chores",guideline:"Repeated cycles of wetting and drying cause the nail plate to swell and shrink, weakening intercellular keratin bonds. Dish detergents also strip protective natural nail lipids."},{id:"np-05",title:"Hydrate the Nail Plate and Matrix with Oils",guideline:"Jojoba oil has a molecular structure small enough to penetrate the keratin layers of the nail plate. Apply daily around nail folds to increase nail flexibility and reduce brittleness."},{id:"np-06",title:"Avoid Using Nails as Screwdrivers or Levers",guideline:"Opening soda cans, peeling labels, or scraping stickers with your nails causes traumatic mechanical onycholysis (plate separating from the nail bed)."},{id:"np-07",title:"Choose Acetone-Free Removers for Frequent Changes",guideline:"Pure acetone rapidly dehydrates the nail plate. If you change nail polish weekly, select ethyl acetate or oil-infused removers, and moisturize immediately afterward."},{id:"np-08",title:"Give Nails Periodic Polish Holidays",guideline:"Continuous wearing of dark nail polish can cause harmless yellow keratin staining (granulation). Allow a week of bare nails between polish applications and use a clear base coat."},{id:"np-09",title:"Disinfect Personal Nail Tools Regularly",guideline:"Soak clippers, files, and pushers in 70% isopropyl alcohol for 10 minutes every month. Never share nail files or clippers with someone who has suspected athlete's foot or nail fungus."},{id:"np-10",title:"Inspect Salon Autoclave and Foot Bath Sanitation",guideline:"At professional salons, ensure metal tools are removed from sterile autoclave pouches and foot basins are piped-free or lined with disposable single-use plastic liners to prevent Mycobacterium fortuitum."},{id:"np-11",title:"Keep Nails at Functional, Moderate Length",guideline:"Very long nails act as longer mechanical levers, significantly increasing the risk of painful tears, splits, and subungual bacterial accumulation (including E. coli and Pseudomonas)."},{id:"np-12",title:"Seek Assessment for Dark Longitudinal Streaks",guideline:"While pigmented streaks are common in darker skin phototypes, a solitary new, changing, or widening dark brown-black band on a single digit (especially extending onto cuticle skin) must be evaluated to rule out subungual melanoma."}],Iy=[{id:"st-01",title:"The Two-Finger Rule for Facial Dosing",tip:"To achieve the labeled SPF (tested at 2 mg/cm²), squeeze two full lines of sunscreen along the length of your pointer and middle finger. This supplies the necessary 1/4 teaspoon for face and neck."},{id:"st-02",title:'Look for the "Broad Spectrum" Shield',tip:'SPF measures UVB (sunburn) defense. Ensure your sunscreen also specifies "Broad Spectrum", displays the European UVA circle logo, or has a PA+++/PA++++ rating to safeguard against deep UVA collagen damage.'},{id:"st-03",title:"Reapply Every 2 Hours Outdoors",tip:"Sunscreen filters become depleted through UV photon absorption, sweat, sebum dilution, and accidental facial touching. Reapplication every 2 hours (or after 40-80 min of swimming/sweating) is non-negotiable."},{id:"st-04",title:"Do Not Rely on Makeup SPF Alone",tip:"Achieving the SPF listed on foundation or BB cream requires applying 7 to 14 times the normal cosmetic amount. Always apply a dedicated sunscreen first, allow it 3 minutes to set, and then apply makeup."},{id:"st-05",title:"UVA Penetrates Glass Windows and Overcast Skies",tip:"Up to 80% of solar UV radiation passes through cloud cover, and UVA easily penetrates standard commercial glass windows. Apply sunscreen daily if working near bright sunny windows."},{id:"st-06",title:"Protect Overlooked Vulnerable Zones",tip:"Common sites for skin cancer include the tops of the ears, eyelids, hairline, back of the neck, and tops of the feet. Don’t stop at the jawline."},{id:"st-07",title:"Utilize Lip Balms with SPF 30+",tip:"The vermilion border of the lips has virtually no melanin and an extremely thin stratum corneum, making it vulnerable to actinic cheilitis and squamous cell carcinoma. Reapply SPF lip balm frequently."},{id:"st-08",title:"Tinted Sunscreens (Iron Oxides) for Melasma & PIH",tip:"Visible high-energy blue light (400–500 nm) stimulates melanogenesis in darker skin phototypes. Tinted sunscreens containing iron oxides block visible light far better than untinted formulas."},{id:"st-09",title:"Mineral Filters for Rosacea and Reactive Skin",tip:"Zinc oxide and titanium dioxide do not trap excess heat and rarely provoke contact allergies, making them ideal for eczema, rosacea, and pediatric applications."},{id:"st-10",title:"Clothing is Your First Line of Defense",tip:"Sunscreen is secondary to physical shielding. A wide-brimmed hat (7.5 cm brim), UV-blocking sunglasses (UV400), and UPF 50+ rashguards provide reliable, non-depleting photoprotection."},{id:"st-11",title:"Understand the UV Index (UVI)",tip:"When the UV Index is 3 or higher, photoprotection is recommended. Check your local weather app: high-altitude mountains and snow reflection can double UV exposure."},{id:"st-12",title:"Sunscreen Does Not Block 100% of UV Rays",tip:"SPF 30 blocks ~97% of UVB; SPF 50 blocks ~98%. That remaining 2% still reaches the epidermis. Never use high SPF as an excuse to stay baking in direct midday sun."},{id:"st-13",title:"Do Not Store Sunscreens in Boiling Hot Cars",tip:"Leaving sunscreen in a glove compartment or direct beach sun destabilizes the emulsion and degrades organic chemical UV filters. Keep it in a bag in the shade."},{id:"st-14",title:"Check the Expiration Date and PAO",tip:"Most sunscreens remain stable for 3 years unopened. Once opened, check the PAO symbol (usually 12M). Discard if formula smells sour, separates into water/oil, or changes color."},{id:"st-15",title:"Inclusive Skin-Tone Formulations",tip:"If mineral zinc leaves an unacceptable ghostly white cast on dark skin, opt for modern hybrid or transparent organic filters (such as Tinosorb S/M, Uvinul A Plus) or tinted mineral creams."}],Ry=[{name:"Ceramides (NP, AP, EOP)",function:"Intercellular lipid restoration",mechanism:"Waxy sphingolipids that fill intercellular gaps between corneocytes, halting TEWL and preventing irritant penetration.",concentration:"0.1% to 1% in multi-lipid matrices with cholesterol and fatty acids.",bestFor:"Dry skin, eczema, compromised barriers, post-retinol recovery."},{name:"Hyaluronic Acid (Sodium Hyaluronate)",function:"Surface and intermediate humectant",mechanism:"Glycosaminoglycan polymer capable of binding large amounts of water to keep the stratum corneum pliant.",concentration:"0.5% to 2%. Multi-molecular weights ensure both surface plumping and stratum corneum penetration.",bestFor:"Dehydrated skin, fine surface dehydration lines."},{name:"Glycerin (Glycerol)",function:"Gold standard physiological humectant",mechanism:"Small trihydroxy alcohol that channels through aquaporin-3 water pores, hydrates corneocytes, and stabilizes membrane lipids.",concentration:"3% to 10% in daily lotions; gentle and non-comedogenic.",bestFor:"Every skin type, extremely dry skin, barrier repair."},{name:"Niacinamide (Vitamin B3)",function:"Barrier enhancer & sebum modulator",mechanism:"Precursor to NAD/NADP; upregulates endogenous ceramide synthesis, reduces melanosome transfer, and inhibits sebum oxidation.",concentration:"2% to 5% (ideal therapeutic window). >10% often causes flushing.",bestFor:"Redness, mild acne, enlarged pores, hyperpigmentation."},{name:"Retinol (Vitamin A)",function:"Cellular differentiation & collagen renewal",mechanism:"Converts intracellularly to retinoic acid, accelerating keratinocyte turnover and stimulating dermal fibroblast collagen production.",concentration:"0.1% to 1.0% in encapsulated formulas; apply at night.",bestFor:"Photoaging, fine lines, uneven texture, persistent adult breakouts."},{name:"L-Ascorbic Acid (Pure Vitamin C)",function:"Potent antioxidant & collagen cofactor",mechanism:"Neutralizes reactive oxygen species, suppresses melanogenesis, and serves as an obligatory cofactor for prolyl and lysyl hydroxylase.",concentration:"10% to 20% at pH < 3.5 with ferulic acid and Vitamin E.",bestFor:"Dullness, UV free radical protection, early collagen defense."},{name:"Azelaic Acid",function:"Anti-inflammatory, antibacterial & tyrosinase inhibitor",mechanism:"Inhibits DNA synthesis in hyperactive melanocytes and suppresses C. acnes, while reducing kallikrein-5 inflammation in rosacea.",concentration:"10% OTC; 15% to 20% prescription gel/foam.",bestFor:"Rosacea, acne vulgaris, post-inflammatory hyperpigmentation, melasma."},{name:"Salicylic Acid (Beta Hydroxy Acid)",function:"Lipophilic keratolytic & pore decongestant",mechanism:"Dissolves desmosomes within oily sebaceous follicles, clearing comedones, and provides mild anti-inflammatory aspirin-like calming.",concentration:"0.5% to 2.0% at pH 3.0–4.0.",bestFor:"Blackheads, whiteheads, oily skin, strawberry legs."},{name:"Glycolic Acid (Alpha Hydroxy Acid)",function:"Surface chemical exfoliant",mechanism:"Smallest molecular weight AHA; penetrates quickly to dissolve calcium ions in corneocyte desmosomes, triggering smooth desquamation.",concentration:"5% to 10% for home use; can sting sensitive skin.",bestFor:"Rough texture, dull skin, sun spots; caution in dark skin tones."},{name:"Centella Asiatica (Madecassoside / Asiaticoside)",function:"Soothing anti-inflammatory & wound healer",mechanism:"Stimulates type I collagen synthesis and suppresses pro-inflammatory IL-1 and TNF-alpha in irritated tissue.",concentration:"0.1% to 2.0% pure extract.",bestFor:"Sensitive skin, barrier irritation, post-sunburn."},{name:"Zinc Oxide",function:"Inorganic broad-spectrum UV shield",mechanism:"Reflects, scatters, and absorbs UVA and UVB photons without chemical degradation; has mild anti-inflammatory and soothing properties.",concentration:"10% to 25% in mineral sunscreens.",bestFor:"Sensitive skin, eczema, rosacea, pediatric sunscreen."},{name:"Petrolatum (Petroleum Jelly)",function:"Heavy occlusive sealant",mechanism:"Forms a hydrophobic semi-solid lipid layer over the stratum corneum, reducing TEWL by >98% and accelerating wound re-epithelialization.",concentration:"10% to 100% in ointments.",bestFor:"Severely dry skin, chapped lips, skin tears, wound healing."},{name:"Squalane",function:"Biomimetic lightweight emollient",mechanism:"Hydrogenated, stable plant-derived hydrocarbon identical to natural human sebum squalene; softens skin without clogging.",concentration:"2% to 100% pure oil.",bestFor:"All skin types, oily skin needing moisture, hair shine."},{name:"Colloidal Oatmeal",function:"FDA-approved skin protectant & antipruritic",mechanism:"Rich in beta-glucans and avenanthramides; physically coats dry skin, reduces itching, and calms histamine-induced irritation.",concentration:"1% to 5% in lotions and bath treatments.",bestFor:"Eczema, atopic dermatitis, itchy skin, insect bites."},{name:"Peptides (e.g. Matrixyl, Copper Tripeptide-1)",function:"Cellular signaling & matrix support",mechanism:"Fragmented peptide chains that mimic collagen degradation products, signaling fibroblasts to synthesize fresh collagen and elastin.",concentration:"1% to 3% proprietary peptide complexes.",bestFor:"Preventative ageing support, sensitive skin unable to tolerate retinoids."}],Oy=[{id:"lr-01",rule:"The 1% Rule of INCI Ordering",explanation:"Ingredients are listed in descending order of concentration down to 1%. Anything below 1% can be listed in any order (often active ingredients, preservatives, and dyes)."},{id:"lr-02",rule:"Decoding the PAO (Period After Opening) Symbol",explanation:'Look for the tiny open jar icon on the back. "6M", "12M", or "24M" denotes the number of safe months after unsealing before preservative efficacy declines.'},{id:"lr-03",rule:'"Fragrance-Free" vs "Unscented"',explanation:'"Fragrance-Free" means no scent compounds or essential oils were added. "Unscented" often contains masking fragrances to cover the unpleasant smell of raw chemicals.'},{id:"lr-04",rule:"Recognizing Common Contact Allergens",explanation:'In the EU and other jurisdictions, 26 common fragrance allergens (like Limonene, Linalool, Citronellol, Eugenol) must be explicitly named rather than lumped into "Parfum".'},{id:"lr-05",rule:'The Meaning of "Hypoallergenic"',explanation:'"Hypoallergenic" has NO strict legal standard in cosmetics. It implies the product was formulated without common allergens, but anyone can still react to any ingredient.'},{id:"lr-06",rule:'"Non-Comedogenic" is Not a Guarantee',explanation:"Non-comedogenic claims are based on voluntary manufacturer testing (often on animal ear models or small human panels). Finished formula texture and your sebum dictate clogging."},{id:"lr-07",rule:"Preservatives Protect Your Eyes and Skin",explanation:'Preservatives (Phenoxyethanol, Parabens, Sodium Benzoate) prevent deadly bacterial (Pseudomonas) and fungal growth in water-based cosmetics. "Preservative-free" water formulas are dangerous.'},{id:"lr-08",rule:'Spotting "Active Ingredient" Concentration Claims',explanation:'Beware of marketing claims like "Contains 10% Hyaluronic Complex!"—this usually means a 1% active powder dissolved in 9% water, not 10% pure hyaluronic acid.'},{id:"lr-09",rule:"Understanding Fatty Alcohols vs Drying Alcohols",explanation:"Cetyl, Stearyl, and Cetearyl alcohols are hydrating waxy emollients. In contrast, Alcohol Denat, Isopropyl Alcohol, and Ethanol in high quantities can dehydrate the barrier."},{id:"lr-10",rule:"Look for Batch / Lot Numbers",explanation:"A stamped code on the crimp of the tube or bottom of the bottle allows manufacturers to trace batches in case of contamination or product recall."},{id:"lr-11",rule:"Cruelty-Free / Leaping Bunny Verification",explanation:"Look for certified third-party logos (Leaping Bunny / Cruelty Free International) to verify no animal testing took place at ingredient or finished product levels."},{id:"lr-12",rule:"Recycling Symbols and Resin Codes",explanation:"Numbers inside chasing arrows (1=PETE, 2=HDPE, 5=PP) indicate which packaging components are recyclable in municipal systems."}],By=[{id:"af-01",title:"Prioritize Foundational Over Specialized Actives",strategy:"Spend your budget on sunscreen you enjoy wearing daily and a gentle cleanser. Expensive serums are useless if sun exposure undoes the work every day."},{id:"af-02",title:"Embrace Store-Brand Pharmacy Dupes",strategy:"Generic pharmacy brand moisturizers (with ceramides and petrolatum) contain virtually identical active ingredients to luxury equivalents at one-fifth the price."},{id:"af-03",title:"Utilize Multi-Purpose Products",strategy:"A basic hydrating lotion can be used on face, neck, hands, and body. Pure petroleum jelly serves as lip balm, cuticle ointment, and overnight slugging mask."},{id:"af-04",title:'Resist the "10-Step" Trend',strategy:"Most dermatologists advocate a 3-step routine (Cleanse, Moisturize, SPF). Cutting unnecessary toners, essences, and eye creams saves hundreds of dollars annually."},{id:"af-05",title:"Eye Creams are Usually Redundant",strategy:"Specialty eye creams are fundamentally gentle moisturizers in 15 ml tubes sold at 10x the price per ounce. A gentle fragrance-free facial moisturizer works equally well for the periocular area."},{id:"af-06",title:"Avoid Trend-Driven Active Percentages",strategy:"Higher percentages (e.g., 20% niacinamide or 10% salicylic acid) cause irritation and barrier damage, creating new costs to treat dermatitis. 2% to 5% works best and costs less."},{id:"af-07",title:"Buy Family-Size Pump Packaging",strategy:"500 ml or 1 liter pump bottles of gentle syndet body wash and ceramide lotion cost drastically less per milliliter than 100 ml facial-marketed packaging."},{id:"af-08",title:"Don’t Waste Money on Collagen Supplements for Skin",strategy:"Ingested collagen peptides are broken down by stomach acid into basic amino acids just like eggs, beans, or chicken. Eating balanced dietary protein is far more cost-effective."},{id:"af-09",title:"Use Pure Jojoba or Squalane Oil for Hair and Nails",strategy:"A single $10 bottle of pure plant squalane or jojoba oil replaces expensive cuticle oils, hair smoothing serums, and facial facial oils."},{id:"af-10",title:"Patch Test Before Full-Size Investment",strategy:"Ask for sample sachets or purchase travel sizes when trying new active formulas to prevent buying full bottles of products your skin cannot tolerate."}],Ly=[{id:"dq-01",question:"How do I distinguish my active breakouts from acne rosacea or folliculitis?",whyAsk:"Treatments for bacterial acne, fungal folliculitis, and vascular rosacea are completely different; an accurate diagnosis prevents months of wasted time."},{id:"dq-02",question:"Are any of my moles or pigmented spots showing signs of atypia or requiring biopsy?",whyAsk:"Professional dermoscopic skin examination detects melanoma and non-melanoma skin cancer at earliest, highly curable stages."},{id:"dq-03",question:"Is my hair shedding a temporary telogen effluvium or early androgenetic/scarring alopecia?",whyAsk:"Trichoscopy and scalp biopsy can catch scarring alopecias before permanent follicle destruction occurs."},{id:"dq-04",question:"Would my persistent eczema benefit from patch testing for allergic contact dermatitis?",whyAsk:"Identifies hidden allergens in laundry detergents, shampoos, or personal products keeping eczema active."},{id:"dq-05",question:"What is the most gentle, evidence-based prescription step for my persistent cystic acne?",whyAsk:"Dermatologists can prescribe topical retinoids, fixed combinations, or systemic therapies before permanent scarring takes hold."},{id:"dq-06",question:"Are there any cosmetic ingredients or treatments I should avoid given my medical history or medications?",whyAsk:"Certain medications (like photosensitizing antibiotics, immunosuppressants) dramatically alter skin behavior."},{id:"dq-07",question:"How can I safely treat post-inflammatory marks without triggering more hyperpigmentation in my skin tone?",whyAsk:"Ensures procedures or active acids recommended are safe for deeper Fitzpatrick phototypes IV–VI."},{id:"dq-08",question:"What should my daily routine look like during this specific medical treatment course?",whyAsk:"Medical prescriptions often cause temporary dryness; your dermatologist can provide a coordinated gentle regimen."},{id:"dq-09",question:"Is my nail discoloration caused by a fungal infection, trauma, or a systemic condition?",whyAsk:"Prevents taking months of systemic oral antifungal pills if nail discoloration is actually traumatic or psoriatic."},{id:"dq-10",question:"What warning signs should prompt me to contact your clinic before my next scheduled follow-up?",whyAsk:"Establishes clear safety criteria for severe medication reactions, spreading infection, or rapid flare-ups."}],Py=[{id:"myth-01",myth:"Pores open with hot water and close with cold water.",fact:"Pores have no muscles surrounding them and cannot open or close. Steam and warm water soften sebum plugs, making them easier to cleanse, while cold water causes temporary vasoconstriction, but pore diameter is genetically determined.",danger:"Steaming skin with near-boiling water causes broken facial capillaries (telangiectasias) and barrier burns."},{id:"myth-02",myth:'"Chemical-free" products are safer and healthier for human skin.',fact:"Everything in the physical universe is made of chemicals—including pure water (H2O), air, and skin cells. Many natural plant compounds (poison ivy, citrus bergapten, oak moss) are potent toxins or contact allergens.",danger:"Creates irrational fear of thoroughly tested, safe synthetic ingredients like preservatives while embracing unregulated botanical irritants."},{id:"myth-03",myth:"Shaving facial or body hair causes it to grow back thicker, darker, and coarser.",fact:"Shaving cuts hair at the thickest middle shaft portion, creating a blunt, flat tip that feels coarse as it emerges. The underlying follicle, growth rate, and pigment remain 100% unaltered.",danger:"Discourages people from simple, affordable grooming methods based on false folklore."},{id:"myth-04",myth:"Applying undiluted toothpaste or lemon juice dries up pimples safely overnight.",fact:"Lemon juice is highly acidic (pH ~2) and contains psoralens that cause severe phytophotodermatitis (chemical blistering upon sun exposure). Toothpaste contains abrasive silicates and SLS that burn the epidermal barrier.",danger:"Leaves permanent dark post-inflammatory hyperpigmentation or chemical scarring."},{id:"myth-05",myth:"People with darker skin tones do not need sunscreen.",fact:"While higher eumelanin levels offer natural photoprotection equivalent to roughly SPF 13 against UVB sunburn, UVA still penetrates deeply, driving cellular DNA damage, melasma, skin cancer, and dark spots.",danger:"Late-stage, fatal melanoma diagnoses are significantly higher among people of color due to missed early detection and lack of photoprotection."},{id:"myth-06",myth:"You should scrub your face vigorously with a loofah or abrasive scrub to prevent acne.",fact:"Acne develops deep within the pilosebaceous follicle beneath the surface, not from surface dirt. Aggressive mechanical scrubbing ruptures follicles, spreads bacteria, and intensifies inflammatory redness.",danger:"Worsens acne lesions and damages the stratum corneum lipid barrier."},{id:"myth-07",myth:"White spots on fingernails mean you have a calcium deficiency.",fact:"Punctate leukonychia (small white spots) are almost always caused by minor micro-trauma to the growing nail matrix (e.g. bumping nails, aggressive cuticle manicuring). They grow out harmlessly with the nail plate.",danger:"Encourages unnecessary, expensive mineral supplementation that can cause gastrointestinal distress."},{id:"myth-08",myth:"Drinking 4 liters of water a day will cure dry, flaky facial skin.",fact:"Unless a person is clinically dehydrated, drinking excess water simply increases urine output. Skin dryness (xerosis) is caused by a deficient lipid barrier in the stratum corneum, requiring topical emollients and occlusives.",danger:"Neglecting topical barrier repair in favor of ineffective water gorging."},{id:"myth-09",myth:"Hair conditioners and split-end serums can permanently repair and fuse split ends.",fact:"The hair shaft is dead, non-living keratin with no cellular machinery to repair itself. Conditioning agents temporarily glue or coat split fibers with polymers, but only physically trimming the ends eliminates splits.",danger:"Wasting large sums on miracle repair products while splits continue traveling higher up the shaft."},{id:"myth-10",myth:'Cosmetics labeled "Clean", "Natural", or "Dermatologist Tested" are medically certified as safe for everyone.',fact:'These terms are unregulated marketing language without legal definition in cosmetic law. "Dermatologist tested" simply means at least one dermatologist evaluated a patch test, regardless of whether the product caused reactions.',danger:"Gives false sense of security to people with sensitive skin and contact allergies."}],qy=()=>{const[u,f]=L.useState("routines"),[v,c]=L.useState(""),j=[{id:"routines",label:"15 Skincare Routines",count:15,icon:es},{id:"hair",label:"15 Haircare Tips",count:15,icon:Qa},{id:"nails",label:"12 Nail Practices",count:12,icon:is},{id:"sunscreen",label:"15 Sun Protection Tips",count:15,icon:Fl},{id:"ingredients",label:"15 Key Ingredients",count:15,icon:vy},{id:"labels",label:"12 Label Reading Tips",count:12,icon:zi},{id:"affordability",label:"10 Affordability Strategies",count:10,icon:zl},{id:"questions",label:"10 Questions for
