n cursor-pointer",children:"Submit Answer"}):n.jsxs("button",{onClick:Se,className:"flex items-center space-x-1.5 px-5 py-2 bg-[#1E3A2F] text-white text-xs font-bold rounded-lg hover:bg-[#142921] transition cursor-pointer",children:[n.jsx("span",{children:j===K.length-1?"Finish Assessment":"Next Question"}),n.jsx(Jr,{className:"w-3.5 h-3.5"})]})]})]}):n.jsx("div",{className:"bg-white p-8 rounded-xl text-center text-sm text-gray-500",children:"No questions match your selected filter criteria."})]})},$h=[{id:1,category:"Skin Biology",front:"What are the three primary anatomical layers of human skin?",back:`1. Epidermis (outermost epithelial shield)
2. Dermis (fibrous connective tissue with collagen and elastin)
3. Hypodermis / Subcutaneous tissue (adipose layer providing cushioning and insulation)`,clinicalNote:"Topical cosmetic products act predominantly on the stratum corneum of the epidermis."},{id:2,category:"Skin Biology",front:"What cell type makes up roughly 90% of the epidermis?",back:"Keratinocytes. They originate in the stratum basale and migrate upward, differentiating into flattened, anucleated corneocytes.",clinicalNote:"Total epidermal turnover takes about 28 to 40 days in healthy adults."},{id:3,category:"Skin Biology",front:'What is the "brick and mortar" model of the stratum corneum?',back:'The "bricks" are corneocytes (anucleated cells filled with keratin), and the "mortar" is the intercellular lipid matrix composed of ceramides (~50%), cholesterol (~25%), and free fatty acids (~15%).',clinicalNote:"Barrier disruption occurs when this lipid mortar is stripped by harsh alkaline soaps or solvents."},{id:4,category:"Skin Biology",front:"What is the natural pH range of healthy human skin surface?",back:"pH 4.5 to 5.5 (mildly acidic), known as the acid mantle.",clinicalNote:"An acidic pH is essential for ceramide-producing enzymes and suppressing pathogenic bacteria like S. aureus."},{id:5,category:"Barrier & Hydration",front:"What does TEWL stand for, and why is it important?",back:"Transepidermal Water Loss. It is the rate at which water passively evaporates through the stratum corneum to the atmosphere.",clinicalNote:"Elevated TEWL indicates a compromised skin barrier and is high in atopic dermatitis and contact irritation."},{id:6,category:"Barrier & Hydration",front:"What are Natural Moisturizing Factors (NMF)?",back:"Water-soluble intracellular humectants inside corneocytes, primarily derived from the breakdown of the protein filaggrin (free amino acids, PCA, lactic acid, urea).",clinicalNote:"NMF binds moisture within corneocytes, maintaining flexibility and desquamation enzyme activity."},{id:7,category:"Barrier & Hydration",front:"What is the difference between a humectant, emollient, and occlusive?",back:`• Humectants attract water (e.g., glycerin, hyaluronic acid)
• Emollients soften and smooth rough gaps between corneocytes (e.g., squalane, fatty alcohols)
• Occlusives form a physical seal to stop water evaporation (e.g., petrolatum, dimethicone)`,clinicalNote:"The most effective moisturizers combine all three classes."},{id:8,category:"Ingredients & Sunscreen",front:"Why is petrolatum considered the gold standard occlusive?",back:"Purified petrolatum reduces Transepidermal Water Loss by over 98%, far more than plant oils, while remaining non-comedogenic and hypoallergenic.",clinicalNote:"It does not absorb into viable tissue; it provides an inert, temporary protective shield allowing the skin to repair itself."},{id:9,category:"Skin Biology",front:"Do people of different ethnicities have different numbers of melanocytes?",back:"No. Humans across all skin tones have roughly the same number of melanocytes per unit area. Differences arise from the type (eumelanin vs pheomelanin), quantity, size, and dispersion of melanin-containing melanosomes.",clinicalNote:"Eumelanin provides higher photoprotective absorption of ultraviolet radiation."},{id:10,category:"Ingredients & Sunscreen",front:"What is the difference between UVA and UVB radiation?",back:`• UVA (320–400 nm): Long wavelengths that penetrate deeply into the dermis, present year-round, driving photoaging, wrinkles, and pigment changes.
• UVB (290–320 nm): Shorter, higher-energy rays that primarily damage epidermal DNA and cause solar erythema (sunburn).`,clinicalNote:"Both UVA and UVB contribute to cutaneous carcinogenesis (skin cancer)."},{id:11,category:"Ingredients & Sunscreen",front:"What does SPF measure, and what does it NOT measure?",back:'SPF (Sun Protection Factor) measures protection against UVB-induced erythema (sunburn). It does NOT directly indicate UVA protection; that requires a "Broad Spectrum" label or PA rating.',clinicalNote:"SPF 30 filters ~97% of UVB; SPF 50 filters ~98%. No sunscreen filters 100% of UV."},{id:12,category:"Ingredients & Sunscreen",front:"What is the recommended application amount for facial sunscreen?",back:"Approximately 2 mg/cm² of skin, which equals roughly 1/4 teaspoon (or two finger lengths of product) for the face and neck.",clinicalNote:"Most people apply only 25% to 50% of this amount, receiving vastly less protection than the labeled SPF."},{id:13,category:"Ingredients & Sunscreen",front:"How do mineral (inorganic) and chemical (organic) sunscreen filters differ?",back:`• Mineral (Zinc Oxide, Titanium Dioxide): Work mainly by absorbing UV (~95%) and reflecting/scattering visible light and short UV (~5%). Highly photostable, non-irritating.
• Chemical (Avobenzone, Tinosorb, Mexoryl): Absorb UV photons and dissipate energy as harmless heat.`,clinicalNote:"Both categories are safe and evidence-backed; mineral filters rarely sting sensitive or reactive skin."},{id:14,category:"Ingredients & Sunscreen",front:"How do Alpha Hydroxy Acids (AHAs) differ from Beta Hydroxy Acid (BHA)?",back:`• AHAs (glycolic, lactic) are water-soluble; they loosen corneocyte adhesion on the skin surface to smooth texture.
• BHA (salicylic acid) is lipid-soluble; it penetrates oily pores to dissolve debris and calm inflammation.`,clinicalNote:"Over-exfoliation with either acid compromises barrier lipids and leads to dermatitis."},{id:15,category:"Ingredients & Sunscreen",front:"What is the hierarchy of retinoids from weakest over-the-counter to prescription?",back:`Retinyl Esters → Retinol → Retinaldehyde → Retinoic Acid (Tretinoin, prescription).
Skin cells only bind Retinoic Acid; OTC forms must be enzymatically converted.`,clinicalNote:"Retinoids stimulate collagen and normalize epidermal differentiation, but should be introduced gradually to avoid retinoid dermatitis."},{id:16,category:"Ingredients & Sunscreen",front:"What are the proven benefits of topical Niacinamide (Vitamin B3)?",back:"At 2% to 5%, it stimulates epidermal ceramide synthesis, reduces transepidermal water loss, regulates sebum production, and calms redness.",clinicalNote:"Concentrations above 10% frequently cause flushing and irritation without clinical superiority."},{id:17,category:"Ingredients & Sunscreen",front:"Why is L-Ascorbic Acid (Vitamin C) difficult to formulate stably?",back:"It is highly prone to oxidation upon exposure to light, heat, and air, turning inactive and yellow-brown. It requires an acidic pH (<3.5) to penetrate the stratum corneum.",clinicalNote:"Formulating it with Ferulic Acid and Vitamin E doubles its photoprotective antioxidant stability."},{id:18,category:"Ingredients & Sunscreen",front:"What are the therapeutic properties of Azelaic Acid?",back:"Antibacterial (inhibits C. acnes), anti-inflammatory, keratoregulating, and a competitive inhibitor of tyrosinase (reduces hyperpigmentation without bleaching normal skin).",clinicalNote:"Safe in pregnancy and well-tolerated across all Fitzpatrick skin phototypes."},{id:19,category:"Acne & Pigment",front:"What are the four primary pathogenic factors of Acne Vulgaris?",back:`1. Follicular hyperkeratinization (plugged pores)
2. Excess sebum production (driven by androgens)
3. Proliferation of Cutibacterium acnes bacteria
4. Cutaneous inflammatory response`,clinicalNote:"Acne is not caused by poor hygiene or surface dirt; aggressive scrubbing worsens inflammation."},{id:20,category:"Acne & Pigment",front:"What is the difference between a blackhead and a whitehead?",back:`• Blackhead (Open Comedone): Follicle orifice is open; sebum and keratin oxidize in the air, turning dark.
• Whitehead (Closed Comedone): Follicle opening is completely closed by corneocytes, trapping sebum beneath.`,clinicalNote:"The black color is oxidized melanin and lipid, not trapped dirt."},{id:21,category:"Acne & Pigment",front:"How does Benzoyl Peroxide work against acne?",back:"It releases reactive oxygen species into the anaerobic hair follicle, destroying Cutibacterium acnes. It does not induce bacterial resistance unlike topical antibiotics.",clinicalNote:"A 2.5% concentration is as clinically effective as 10% with significantly less irritation and peeling."},{id:22,category:"Acne & Pigment",front:"What is Post-Inflammatory Hyperpigmentation (PIH)?",back:"Excess melanin deposited in epidermis or dermis following cutaneous inflammation or physical trauma (acne, insect bites, scratching, harsh peels).",clinicalNote:"Far more prevalent in deeper skin phototypes (Fitzpatrick IV–VI). Daily broad-spectrum SPF is critical to prevent darkening."},{id:23,category:"Acne & Pigment",front:"Why are mercury-containing skin bleaching creams dangerous?",back:"Mercury binds to tissues, causing systemic renal failure, neurotoxicity, peripheral neuropathy, and paradoxical irreversible slate-gray disfigurement (ochronosis).",clinicalNote:"Strictly outlawed internationally; beware of unlabelled or imported lightening creams."},{id:24,category:"Acne & Pigment",front:"What is Melasma, and what triggers it?",back:"A symmetric hyperpigmentation disorder appearing on the face (forehead, cheeks, upper lip), triggered by UV radiation, hormonal shifts (pregnancy, contraceptives), and heat/visible light.",clinicalNote:"Iron oxides in tinted sunscreens help block visible light that triggers melasma relapse."},{id:25,category:"Hair & Scalp",front:"What are the three structural layers of a hair shaft?",back:`1. Cuticle (outer shingle-like transparent keratin scales)
2. Cortex (thick middle core with keratin fibrils, melanin, and strength-giving disulfide bonds)
3. Medulla (inner porous central canal, often absent in fine hair)`,clinicalNote:"Conditioners act on the cuticle scales to flatten them and decrease friction."},{id:26,category:"Hair & Scalp",front:"What are the 4 phases of the hair growth cycle?",back:`1. Anagen (Active growth: 2–7 years)
2. Catagen (Transitional regression: 2–3 weeks)
3. Telogen (Resting phase: 2–4 months)
4. Exogen (Active shedding: club hair falls out)`,clinicalNote:"At any given time, 85–90% of hairs are in anagen and 10–15% in telogen."},{id:27,category:"Hair & Scalp",front:"What is a normal daily hair shedding count?",back:"50 to 100 hairs per day. Shedding is a continuous, asynchronous physiological process.",clinicalNote:"On wash days, hairs that were already detached during previous days may shed all at once, which is normal."},{id:28,category:"Hair & Scalp",front:"What is Telogen Effluvium?",back:"A diffuse, non-scarring hair shedding where a systemic stressor (high fever, severe illness, surgery, childbirth, rapid weight loss) prematurely pushes anagen hairs into telogen.",clinicalNote:"Shedding begins 2 to 4 months after the inciting event and typically recovers spontaneously over 6 to 9 months."},{id:29,category:"Hair & Scalp",front:"What is the biological cause of Traction Alopecia?",back:"Mechanical tension on hair follicles caused by tight braids, cornrows, ponytails, weaves, or extensions pulling on the root over months or years.",clinicalNote:"Early signs are small bumps, tenderness, and broken hairs along the hairline; loosening styles prevents permanent scarring alopecia."},{id:30,category:"Hair & Scalp",front:"What is the role of Malassezia yeast in dandruff and seborrhoeic dermatitis?",back:"Malassezia yeasts feed on scalp sebum triglycerides, releasing oleic acid and free fatty acids that irritate susceptible scalp barriers, leading to hyperproliferation and flaking.",clinicalNote:"Treated with antifungal shampoos (ketoconazole, zinc pyrithione, piroctone olamine, selenium sulfide)."},{id:31,category:"Hair & Scalp",front:"Why is textured and coily hair more vulnerable to mechanical breakage?",back:"Curled and coiled hair shafts have elliptical cross-sections with frequent twist points and asymmetrical cuticle distributions, creating structural stress points during dry combing.",clinicalNote:"Detangling should be done with conditioner on wet hair using a wide-tooth comb or fingers."},{id:32,category:"Hair & Scalp",front:"How do chemical relaxers permanently straighten curly hair?",back:"High pH alkaline chemicals (sodium hydroxide, guanidine hydroxide) break the strong covalent disulfide bonds in the hair cortex, allowing the keratin structure to be mechanically flattened.",clinicalNote:"Relaxed hair permanently loses roughly 30–50% of its tensile strength and requires intense conditioning."},{id:33,category:"Hair & Scalp",front:"Why do silicones in haircare help protect against thermal damage?",back:"Silicones (like dimethicone, amodimethicone) coat the hair shaft, reducing friction during combing, smoothing cuticle scales, and creating a heat-transfer buffer.",clinicalNote:"Silicones are safe and easily cleansed with standard surfactant shampoos."},{id:34,category:"Nails & Grooming",front:"What is the nail matrix and why is it critical?",back:"The germinative tissue beneath the proximal nail fold that produces the hard keratin cells forming the nail plate.",clinicalNote:"Any trauma, severe infection, or chronic biting of the matrix can cause permanent dystrophy or ridging of the nail plate."},{id:35,category:"Nails & Grooming",front:"What is the function of the nail cuticle (eponychium)?",back:"It forms a waterproof, mechanical seal between the skin of the finger and the nail plate, preventing bacteria and fungi from entering the sterile matrix.",clinicalNote:"Dermatologists strongly advise against cutting or aggressively trimming cuticles."},{id:36,category:"Nails & Grooming",front:"How fast do fingernails and toenails grow?",back:`• Fingernails grow approximately 3 to 3.5 mm per month (taking 4–6 months to fully replace).
• Toenails grow about 1 to 1.5 mm per month (taking 12–18 months to fully replace).`,clinicalNote:"Because nails grow slowly, treatment for fungal nail infections requires months to see healthy outgrowth."},{id:37,category:"Nails & Grooming",front:"What causes small white spots on fingernails (punctate leukonychia)?",back:"Minor micro-trauma to the growing nail matrix (such as tapping or minor impact) causing air pockets between keratin cells.",clinicalNote:"It is almost never caused by calcium or zinc deficiency, despite common folklore."},{id:38,category:"Nails & Grooming",front:"What is Paronychia and how can it be prevented?",back:"Infection of the soft tissue fold surrounding the nail plate (often Staph or Candida), causing redness, swelling, and throbbing pain.",clinicalNote:"Prevented by avoiding nail biting, hangnail pulling, harsh chemical immersion, and cuticle cutting."},{id:39,category:"Nails & Grooming",front:"What are Beau’s Lines and what do they indicate?",back:"Transverse (horizontal) indentations or grooves across the nail plate caused by a temporary cessation of cell division in the matrix during severe illness, high fever, or shock.",clinicalNote:"The distance of the line from the cuticle indicates how many weeks ago the physiological event occurred."},{id:40,category:"Nails & Grooming",front:"Why are acrylate allergies increasing with DIY gel nail kits?",back:"Incomplete curing of gel nail monomers under weak or mismatched UV/LED lamps leaves unpolymerized methacrylates that penetrate the skin, causing severe lifelong allergic sensitization.",clinicalNote:"Once sensitized, individuals may react to future dental fillings and orthopaedic surgical cements containing acrylates."},{id:41,category:"Nutrition & Lifestyle",front:"What is the role of dietary protein in hair and skin health?",back:"Keratin (the main structural protein of hair and nails) and collagen (skin dermis) require essential amino acids (methionine, cysteine, proline, lysine).",clinicalNote:"Severe protein calorie restriction is a primary driver of acute telogen effluvium."},{id:42,category:"Nutrition & Lifestyle",front:"Does drinking excessive water cure dry skin?",back:"No. While severe whole-body dehydration affects skin turgor, drinking surplus water beyond normal hydration needs does not increase stratum corneum moisture.",clinicalNote:"Skin dryness (xerosis) is a barrier lipid and topical humidity problem, treated with topical humectants and occlusives."},{id:43,category:"Nutrition & Lifestyle",front:"What blood marker is most critical when evaluating diffuse hair loss in women?",back:"Serum Ferritin (iron storage). Low ferritin (<30–50 ng/mL), even without overt anemia, is strongly associated with prolonged telogen effluvium.",clinicalNote:"Supplementation should only occur following confirmed lab deficiency to avoid iron toxicity."},{id:44,category:"Nutrition & Lifestyle",front:"Is taking high-dose Biotin supplements beneficial for everyone?",back:"No. Biotin improves nails and hair only in rare documented clinical deficiencies. Furthermore, excess biotin interferes with laboratory assays, including troponin (heart attack marker) and thyroid panels.",clinicalNote:"The FDA has issued safety alerts advising patients to disclose biotin use prior to blood tests."},{id:45,category:"Nutrition & Lifestyle",front:"How does psychological stress trigger skin inflammation?",back:"Stress stimulates the HPA axis to release cortisol and prompts cutaneous nerves to release neuropeptides like Substance P, triggering mast cells to release histamine and inflammatory cytokines.",clinicalNote:"Explains stress-induced exacerbations of atopic eczema, psoriasis, rosacea, and hives."},{id:46,category:"Nutrition & Lifestyle",front:"What happens to the skin during deep nocturnal sleep?",back:"Blood flow to the dermis increases, growth hormone stimulates cell division and protein synthesis, and cellular DNA repair of daytime UV damage peaks.",clinicalNote:"However, TEWL is also naturally higher at night, making bedtime moisturization particularly important."},{id:47,category:"Nutrition & Lifestyle",front:"How does hard water affect the skin and hair?",back:"Calcium and magnesium minerals in hard water react with soap to form insoluble salts (soap curd) that cling to skin and hair, disrupting the barrier, provoking irritation, and making hair brittle.",clinicalNote:"Synthetic syndet cleansers and chelating shampoos help mitigate hard water buildup."},{id:48,category:"Dermatology & Safety",front:"What is the difference between Irritant Contact Dermatitis (ICD) and Allergic Contact Dermatitis (ACD)?",back:`• ICD: Direct physical/chemical damage to the barrier (anyone will react if concentration or exposure is high enough; no immune sensitization).
• ACD: Delayed Type IV immunological reaction requiring prior sensitization to a specific molecule (e.g., fragrance allergen, nickel).`,clinicalNote:"ICD appears rapidly; ACD typically develops 24 to 72 hours after exposure."},{id:49,category:"Dermatology & Safety",front:"What are the dermatological ABCDE rules for screening suspicious moles?",back:`A — Asymmetry
B — Border irregularity
C — Color variation (mottled shades)
D — Diameter (>6 mm, size of pencil eraser)
E — Evolving (changing in shape, size, color, or symptoms)`,clinicalNote:"Any changing or solitary atypical lesion should be examined promptly by a dermatologist."},{id:50,category:"Dermatology & Safety",front:'What is the "Ugly Duckling" sign in melanoma detection?',back:"A mole or pigmented spot that looks noticeably different in pattern, shade, or size compared to all the other moles on that individual's body.",clinicalNote:"This is often the most sensitive clinical indicator of early melanoma."},{id:51,category:"Dermatology & Safety",front:"What is the difference between a deodorant and an antiperspirant?",back:`• Deodorant: Masks odor with fragrance or suppresses odor-causing bacteria with antimicrobials. Does not reduce sweat volume.
• Antiperspirant: Uses aluminum salts that dissolve in sweat to form temporary plugs in sweat ducts, reducing physical perspiration.`,clinicalNote:"Extensive scientific reviews by WHO, FDA, and European SCCS confirm aluminum antiperspirants are safe."},{id:52,category:"Dermatology & Safety",front:'Can "natural" skincare products trigger allergic contact dermatitis?',back:"Yes. Botanical extracts, unrefined plant oils, and fragrant essential oils (such as tea tree, lavender, citrus) are frequent causes of allergic sensitization and contact dermatitis.",clinicalNote:'"Natural" is a marketing term, not a guarantee of safety or hypoallergenic properties.'},{id:53,category:"Dermatology & Safety",front:"Why should undiluted essential oils never be applied directly to the skin?",back:"They contain high concentrations of reactive terpenes and phenols that can cause chemical burns, severe phototoxic blisters, and permanent contact allergy.",clinicalNote:"Always dilute essential oils in inert carrier oils, or preferably avoid them on sensitive or broken skin."},{id:54,category:"Dermatology & Safety",front:"What are the red flags requiring immediate medical evaluation for skin/hair/nails?",back:`1. Rapidly growing or changing mole
2. Non-healing bleeding ulcer
3. Sudden patchy or scarred hair loss
4. Painful throbbing nail folds with pus
5. Widespread blistering or facial/airway swelling`,clinicalNote:"Cosmetic skincare cannot treat infections, carcinomas, or severe immunological disease."},{id:55,category:"Dermatology & Safety",front:"What is the period-after-opening (PAO) jar symbol on cosmetics?",back:'An open jar graphic showing a number and "M" (e.g., 6M, 12M, 24M) denoting the number of months the product remains stable and microbially safe once unsealed.',clinicalNote:"Preservatives degrade after opening; using expired products risks bacterial and fungal infections."},{id:56,category:"Skin Biology",front:"What happens to skin collagen as chronological age progresses?",back:"Dermal fibroblasts decrease collagen synthesis by roughly 1% per year after age 20 to 25. Existing collagen bundles become fragmented and disorganized.",clinicalNote:"Photoprotection prevents the accelerated enzymatic collagen breakdown caused by UV-induced matrix metalloproteinases (MMPs)."},{id:57,category:"Skin Biology",front:"What are senescent cells and the SASP in skin aging?",back:"Senescent cells have permanently stopped dividing but remain metabolically active, secreting a Senescence-Associated Secretory Phenotype (SASP) of pro-inflammatory cytokines that degrade surrounding tissue.",clinicalNote:"Chronic UV radiation accelerates the accumulation of senescent fibroblasts and keratinocytes."},{id:58,category:"Hair & Scalp",front:'Why do we get "split ends" (trichoptilosis) and can they be glued back together permanently?',back:"Cumulative physical wear, brushing, and UV strip the protective cuticle, causing cortex fibers to unravel longitudinally. No cosmetic product can permanently fuse split ends; only trimming removes them.",clinicalNote:"Silicones and oils temporarily smooth split ends until the next wash."},{id:59,category:"Hair & Scalp",front:"How does Minoxidil stimulate hair growth in pattern hair loss?",back:"It acts as a potassium channel opener and vasodilator that shortens the resting telogen phase, hastening entry into anagen and increasing hair shaft diameter.",clinicalNote:"Temporary shedding often occurs in the first 2 to 8 weeks as old telogen hairs are pushed out by new anagen growth."},{id:60,category:"Ingredients & Sunscreen",front:'What is "Purging" versus "Irritation/Allergic Reaction"?',back:`• Purging: An accelerated clearing of existing microcomedones caused by active turnover agents (retinoids, AHAs/BHAs) occurring in typical acne zones.
• Irritation/Allergy: Redness, burning, hives, or flaking appearing in areas where you never usually break out, caused by barrier damage or allergy.`,clinicalNote:"Moisturizers and sunscreens do NOT cause purging; if they cause bumps, it is clogging or irritation."},{id:61,category:"Acne & Pigment",front:"Why should you never squeeze or pop cystic acne blemishes?",back:"Squeezing ruptures the delicate follicular wall beneath the epidermis, spilling bacterial debris and inflammatory sebum into the deep dermis, greatly increasing scar tissue and PIH risk.",clinicalNote:"Topical soothing agents or warm compresses are safer while awaiting healing."},{id:62,category:"Nails & Grooming",front:"What is Onycholysis, and what are common causes?",back:"Separation of the nail plate from the underlying pink nail bed. Common causes include vigorous cleaning under the nail, trauma, fungal infection, psoriasis, and harsh nail cosmetics.",clinicalNote:"Keep the separated area dry and clipped short to prevent secondary bacterial infection (like Pseudomonas)."},{id:63,category:"Hair & Scalp",front:"Why is postpartum hair shedding common around 3 to 4 months after giving birth?",back:"Elevated estrogen and progesterone during pregnancy prolong the anagen phase, keeping hair from shedding. After delivery, hormone levels drop rapidly, triggering all those hairs into telogen at once.",clinicalNote:"This is a normal physiological telogen effluvium that almost always resolves within 6 to 12 months."},{id:64,category:"Ingredients & Sunscreen",front:'What does the term "Non-Comedogenic" mean legally on cosmetic packaging?',back:"In most countries, it has NO standardized legal regulatory definition. While it indicates the manufacturer believes the formula is less likely to clog pores, it is not an absolute guarantee.",clinicalNote:"Formulation texture and individual skin sebum composition matter more than single ingredient ratings."},{id:65,category:"Dermatology & Safety",front:"What is the proper way to conduct an at-home patch test before using a new active product?",back:"Apply a small pea-sized amount to the clean inner forearm or behind the ear for 3 consecutive days. Watch for erythema, itching, blistering, or burning before applying it to the entire face.",clinicalNote:"If intense itching, burning, or redness develops, wash off immediately and discontinue use."},{id:66,category:"Skin Biology",front:"What is the role of skin commensal bacteria like Staphylococcus epidermidis?",back:"Commensal S. epidermidis produces antimicrobial peptides that suppress pathogenic Staphylococcus aureus, metabolizes sebum into beneficial fatty acids, and communicates with epidermal immunity.",clinicalNote:"Overzealous antibacterial body washes disrupt this protective commensal shield."},{id:67,category:"Hair & Scalp",front:"Does shaving facial or body hair cause it to grow back thicker, darker, or faster?",back:"No. Shaving blunts the naturally tapered hair tip, making the emerging stubble feel coarse and stiff to the touch, but follicle density, growth rate, and color remain completely unchanged.",clinicalNote:"A persistent biological myth debunked by numerous dermatological studies."},{id:68,category:"Ingredients & Sunscreen",front:"Why should Vitamin C (L-Ascorbic Acid) be packaged in dark, airtight bottles?",back:"L-Ascorbic Acid is photolabile and oxidizes rapidly upon contact with ambient oxygen and light into dehydroascorbic acid and diketogulonic acid, turning amber-brown and losing antioxidant potency.",clinicalNote:"Store Vitamin C in a cool, dark cabinet or refrigerator."},{id:69,category:"Nutrition & Lifestyle",front:"How does cigarette smoking damage skin structure?",back:"Nicotine causes cutaneous vasoconstriction, decreasing oxygen and nutrient delivery to the dermis. Smoke chemicals also upregulate matrix metalloproteinases, degrading collagen and elastin.",clinicalNote:'Results in characteristic "smoker’s lines", dull sallow skin tone, and delayed wound healing.'},{id:70,category:"Dermatology & Safety",front:"What are the main risks associated with high-strength at-home chemical peels bought online?",back:"Full-thickness chemical burns, severe post-inflammatory hyperpigmentation, permanent depigmentation, and scarring. Professional peels require strict neutralizing and depth control.",clinicalNote:"HERBULANCE strongly advises against DIY deep or medium-depth chemical peels."},{id:71,category:"Nails & Grooming",front:"What is the green nail syndrome and what organism causes it?",back:"A greenish-black discoloration under the nail plate caused by pyocyanin pigment produced by Pseudomonas aeruginosa bacteria colonizing an onycholytic nail pocket.",clinicalNote:"Often occurs when nails remain wet inside rubber gloves; requires medical topical antiseptic treatment."},{id:72,category:"Skin Biology",front:"What is the central editorial philosophy of HERBULANCE personal care?",back:"Healthy personal care supports normal physiological function, barrier comfort, hygiene, and dignity. It rejects unrealistic cosmetic perfection, colorism, and fear-based marketing.",clinicalNote:"Learn • Prepare • Thrive: sustainable, evidence-based care tailored to individual biology."}],Ny=()=>{const[u,f]=L.useState($h),[v,c]=L.useState(0),[j,y]=L.useState(!1),[R,P]=L.useState("All"),[D,p]=L.useState(()=>{try{const z=localStorage.getItem("herbulance_mastered_flashcards");return z?JSON.parse(z):[]}catch{return[]}}),q=["All","Skin Biology","Barrier & Hydration","Ingredients & Sunscreen","Acne & Pigment","Hair & Scalp","Nails & Grooming","Nutrition & Lifestyle","Dermatology & Safety"];L.useEffect(()=>{localStorage.setItem("herbulance_mastered_flashcards",JSON.stringify(D))},[D]);const M=u.filter(z=>R==="All"||z.category===R),B=M[v]||M[0],G=()=>{y(!1),v<M.length-1?c(z=>z+1):c(0)},N=()=>{y(!1),v>0?c(z=>z-1):c(M.length-1)},_=()=>{y(!1);const z=[...u].sort(()=>Math.random()-.5);f(z),c(0)},K=z=>{p(oe=>oe.includes(z)?oe.filter(ie=>ie!==z):[...oe,z  reduce winter flaking on cheeks, ease scalp itching, stop nail splitting..."},{id:"q2",label:"Current environmental conditions (Climate & Indoor heating/AC)",type:"select",options:["Hot & Humid","Hot & Arid / Desert","Temperate / Maritime","Cold & Dry Winter","Variable / Changing"]},{id:"q3",label:"Daily time available for personal care routines",type:"select",options:["5 minutes (Ultra-minimalist)","10–15 minutes (Balanced core)","20+ minutes (Deliberate ritual)"]},{id:"q4",label:"Any persistent symptoms of discomfort (tightness, itching, redness, flaking)",type:"textarea",placeholder:"Describe when and where discomfort arises..."},{id:"q5",label:"Monthly budget allocated to personal care",type:"select",options:["Under $15 (Generic / Minimal)","$15 to $40 (Moderate)","$40 to $80 (Flexible)","$80+ (Comprehensive)"]}]},{id:"ws-02",number:2,title:"Skin-Type Reflection Worksheet",category:"Skin Biology & Needs",description:"Analyze your skin’s baseline sebum activity, hydration status, and barrier reactivity away from harsh products.",objective:"Understand the difference between genetic skin tendencies and temporary barrier disruption.",fields:[{id:"wash_feel",label:"How does your bare face feel 2 hours after washing with water only?",type:"select",options:["Tight, dry, or slightly dull all over (Dry tendency)","Comfortable on cheeks, shiny on T-zone (Combination)","Slick / shiny all over forehead, nose, and chin (Oily tendency)","Stinging, tight, red, or reactive (Compromised barrier / Sensitive)"]},{id:"midday_shine",label:"Midday sebum observation",type:"select",options:["Zero visible oil; feels tight","Light shine only along forehead/nose","Significant shine requiring blotting","Flakes with sudden red patches"]},{id:"pore_appearance",label:"Visual pore distribution",type:"select",options:["Virtually invisible across the entire face","Visible primarily on nose and central cheeks","Prominent across forehead, nose, and chin","Variable with visible redness around folds"]},{id:"reactivity_history",label:"Reactivity to new products or fragrances",type:"select",options:["Rarely or never reacts","Occasional breakout if product is too heavy","Frequently stings, flushes red, or itches"]},{id:"reflection_notes",label:"Personal observations on how seasonal shifts affect your skin",type:"textarea",placeholder:"e.g., In summer my T-zone gets oily, but in winter my cheeks sting from cold winds..."}]},{id:"ws-03",number:3,title:"Basic Skincare Planner (Morning & Evening)",category:"Daily Routines",description:"Design a simple, sustainable 3-to-4 step routine focusing on cleansing, moisturizing, and sun defense.",objective:"Establish a reliable core daily routine tailored to your specific skin needs.",fields:[{id:"am_cleanser",label:"Morning Cleanse (Water rinse vs Gentle Cleanser)",type:"select",options:["Lukewarm water rinse only (best for dry/sensitive)","Gentle non-foaming hydrating lotion","Mild foaming syndet cleanser (best for oily)"]},{id:"am_moisturizer",label:"Morning Hydrator / Moisturizer (Optional if SPF is hydrating)",type:"text",placeholder:"e.g. Lightweight ceramide lotion or skipped"},{id:"am_spf",label:"Morning Sun Protection (SPF 30+ Broad Spectrum)",type:"text",placeholder:"e.g. Mineral Zinc SPF 50 or Lightweight chemical fluid SPF 50"},{id:"pm_cleanser",label:"Evening Cleanse (Single or Double Cleanse)",type:"select",options:["Gentle syndet cleanser alone","Oil cleanser / micellar water followed by gentle foam (Double cleanse)"]},{id:"pm_moisturizer",label:"Evening Barrier Repair Cream / Ointment",type:"text",placeholder:"e.g. Rich ceramide & squalane cream; thin petrolatum on dry spots"},{id:"pm_targeted",label:"Evening Targeted Active (Max 1 active; 2-3 nights/week)",type:"text",placeholder:"e.g. Azelaic acid 10% on Mon/Wed/Fri"}]},{id:"ws-04",number:4,title:"Product Ingredient Comparison Sheet",category:"Ingredient Literacy",description:"Compare two products side by side to identify active ingredients, base emollients, potential allergens, and price-per-ml.",objective:"Evaluate products objectively by INCI ingredients rather than brand marketing hype.",fields:[{id:"prod_a_name",label:"Product A Name & Price",type:"text",placeholder:"e.g. Pharmacy Ceramide Cream ($14 / 200ml)"},{id:"prod_a_actives",label:"Product A Key Actives & Emollients",type:"text",placeholder:"e.g. Ceramides NP/AP, Glycerin, Petrolatum, Hyaluronic acid"},{id:"prod_a_fragrance",label:"Product A Fragrance Status",type:"select",options:["Fragrance-Free (Zero fragrance / essential oils)","Contains Parfum / Fragrance","Contains Essential Oils (Limonene, Linalool)"]},{id:"prod_b_name",label:"Product B Name & Price",type:"text",placeholder:"e.g. Department Store Luxury Cream ($85 / 50ml)"},{id:"prod_b_actives",label:"Product B Key Actives & Emollients",type:"text",placeholder:"e.g. Glycerin, Shea butter, Peptides, Parfum"},{id:"prod_b_fragrance",label:"Product B Fragrance Status",type:"select",options:["Fragrance-Free","Contains Parfum / Fragrance","Contains Essential Oils"]},{id:"comparison_verdict",label:"Evidence & Value Verdict",type:"textarea",placeholder:"Note whether the expensive product offers meaningful active advantages or merely luxury scent/packaging..."}]},{id:"ws-05",number:5,title:"Sunscreen Habit Tracker",category:"Photoprotection",description:"Track daily application, adequate dosing (two fingers), reapplication during sun exposure, and comfortable formulations.",objective:"Build an automatic, year-round photoprotection habit.",fields:[{id:"spf_name",label:"Sunscreen currently in use",type:"text",placeholder:"e.g. Broad Spectrum SPF 50 Mineral Tinted"},{id:"two_finger_dose",label:"Applying adequate amount (~1/4 tsp or 2 finger-lengths for face/neck)",type:"select",options:["Consistently every morning","Sometimes too thin","Often forgetting neck and ears"]},{id:"outdoor_reapply",label:"Reapplication habit when outdoors >2 hours",type:"select",options:["Always reapply with lotion, stick, or powder","Occasionally reapply","Rarely or never reapply"]},{id:"shade_clothing",label:"Complementary sun safety (wide brim hat, sunglasses, seeking shade)",type:"select",options:["Frequently wear UV sunglasses and hat","Occasional shade","Relying 100% on sunscreen lotion"]},{id:"skin_comfort",label:"How does this sunscreen feel on your skin by midday?",type:"textarea",placeholder:"Does it sting eyes? Cause oiliness? Pill under clothing?"}]},{id:"ws-06",number:6,title:"Skin Reaction & Sensitivity Diary",category:"Safety & Dermatological Care",description:"Document flare-ups, product introductions, environmental triggers, and symptoms to share with a physician.",objective:"Isolate triggers for rashes, breakouts, or dermatitis without guesswork.",fields:[{id:"date_onset",label:"Date and time reaction was first observed",type:"text",placeholder:"e.g. Oct 14, morning after applying new night oil"},{id:"products_used",label:"List all products applied in the past 72 hours",type:"textarea",placeholder:"Cleanser, toner, active serum, moisturizer, sunscreen, laundry detergent..."},{id:"symptoms_experienced",label:"Nature of reaction",type:"select",options:["Itching and red hives / bumps","Burning and stinging sensation with water","Dry flaking and peeling with redness","Tiny whitehead clusters / clogged bumps","Eyelid swelling or facial puffiness"]},{id:"location_body",label:"Specific anatomical area affected",type:"text",placeholder:"e.g. Cheeks only, perioral area around mouth, neck folds"},{id:"action_taken",label:"Immediate actions taken (e.g. washed off, stopped actives, applied petrolatum)",type:"textarea",placeholder:"Describe relief steps and whether symptoms subsided..."}]},{id:"ws-07",number:7,title:"Hair Texture & Routine Reflection",category:"Hair & Scalp Health",description:"Identify your hair curl pattern (1A to 4C), strand diameter, porosity indicators, and current wash cadence.",objective:"Tailor haircare to your actual hair biology rather than mismatched viral trends.",fields:[{id:"curl_pattern",label:"Hair curl pattern / structure",type:"select",options:["Type 1 (Straight: 1A, 1B, 1C)","Type 2 (Wavy: 2A, 2B, 2C)","Type 3 (Curly: 3A, 3B, 3C)","Type 4 (Coily / Kinky: 4A, 4B, 4C)"]},{id:"strand_diameter",label:"Individual hair strand diameter",type:"select",options:["Fine (barely felt between fingertips)","Medium (feels like a cotton thread)","Coarse (thick, wiry feel)"]},{id:"chemical_history",label:"Chemical or thermal processing history",type:"select",options:["Virgin hair (no dyes or relaxers)","Color-treated / bleached","Chemically relaxed / permed","Frequent high heat flat ironing (>180°C)"]},{id:"current_breakage",label:"Current breakage or dryness level",type:"textarea",placeholder:"Do you notice short broken pieces when combing? Are ends rough?"},{id:"protective_habits",label:"Nighttime protection habits",type:"select",options:["Satin / silk pillowcase or bonnet","Loose pineapple / loose braid","Standard cotton pillowcase with no protection"]}]},{id:"ws-08",number:8,title:"Haircare Planner (Washing, Conditioning & Sealing)",category:"Hair & Scalp Health",description:"Organize your weekly wash day, conditioning, leave-in hydration, and detangling process.",objective:"Prevent cuticle erosion and unnecessary mechanical breakage.",fields:[{id:"wash_frequency",label:"Ideal washing cadence for your scalp sebum level",type:"select",options:["Daily (oily straight scalp / heavy sweat)","Every 2 to 3 days (balanced)","Weekly (curly / coily / dry hair)","Every 10 to 14 days (protective styles)"]},{id:"shampoo_type",label:"Primary shampoo type",type:"select",options:["Gentle sulfate-free syndet shampoo","Clarifying shampoo (1x per month for buildup)","Medicated anti-dandruff shampoo (ketoconazole/zinc)","Co-wash cleansing conditioner"]},{id:"detangling_method",label:"Detangling routine",type:"select",options:["In shower with conditioner using wide-tooth comb or fingers","Post-shower damp with leave-in conditioner","Dry brushing (caution: high breakage risk for textured hair)"]},{id:"moisture_seal",label:"Moisture sealing products (Ends and lengths)",type:"text",placeholder:"e.g. Water leave-in mist + light jojoba oil on ends"},{id:"heat_policy",label:"Heat styling guidelines",type:"select",options:["Zero heat / air dry only","Low-heat diffuser with heat protectant","Flat iron max 1x/month with silicone heat shield"]}]},{id:"ws-09",number:9,title:"Scalp-Care Reflection Sheet",category:"Hair & Scalp Health",description:"Distinguish between dry scalp flaking, sebum buildup, seborrhoeic dermatitis, and product accumulation.",objective:"Promote a balanced scalp microbiome and healthy follicular ostia.",fields:[{id:"scalp_sensation",label:"Primary scalp sensation",type:"select",options:["Comfortable, calm, no itching","Tight and dry immediately after washing","Itchy, oily, with greasy yellowish flakes","Tender or sore around hairline / braids"]},{id:"flake_type",label:"Observation of scalp flakes (if any)",type:"select",options:["No visible flaking","Fine, white, powdery dry flakes (dry scalp / hard water)","Large, yellowish, oily clumping flakes (dandruff / seborrhoeic dermatitis)","Silvery thick plaques (possible psoriasis)"]},{id:"oil_application",label:"Do you apply heavy oils directly to your scalp skin?",type:"select",options:["No, I keep oils only on hair lengths/ends (dermatologist recommended)","Yes, I oil my scalp weekly (caution: may feed Malassezia yeasts)","Only lightweight targeted botanical drops occasionally"]},{id:"medicated_shampoo_use",label:"Use of anti-dandruff / keratoregulating washes",type:"select",options:["Not needed","1% Ketoconazole 2x weekly (left on 3-5 min)","Zinc Pyrithione or Piroctone Olamine shampoo","Salicylic acid scalp exfoliating fluid"]},{id:"scalp_notes",label:"Scalp comfort reflection notes",type:"textarea",placeholder:"Note any seasonal scalp changes, workout sweat reactions, or product buildup..."}]},{id:"ws-10",number:10,title:"Nail Hygiene & Integrity Ch tle breathing..."}]},{id:"ws-15",number:15,title:"Nutrition & Skin/Hair Health Learning Sheet",category:"Nutrition & Lifestyle",description:"Review your dietary intake of protein, essential fatty acids, zinc, iron, and antioxidant plant polyphenols.",objective:"Ground cutaneous nutrition in balanced whole foods rather than miracle supplement pills.",fields:[{id:"protein_adequacy",label:"Consistent daily dietary protein intake (for keratin & collagen synthesis)",type:"select",options:["Adequate protein at most meals (beans, lentils, fish, poultry, eggs, tofu)","Borderline or low protein intake","Strict low-calorie dieting / fasting"]},{id:"omega_fatty_acids",label:"Essential fatty acid sources (linoleic & omega-3)",type:"select",options:["Regularly consume flaxseeds, chia, walnuts, fatty fish, or olive oil","Rarely consume healthy plant or marine lipids"]},{id:"iron_zinc_sources",label:"Iron and zinc dietary diversity",type:"select",options:["Diverse intake of leafy greens, seeds, legumes, whole grains, or lean meats","History of low ferritin / iron deficiency"]},{id:"supplement_audit",label:"Current supplements in use (Audit for safety and dosage)",type:"textarea",placeholder:"List any vitamins, biotin gummies, collagen, or minerals; note dosages..."},{id:"whole_food_action",label:"One practical whole-food upgrade this week",type:"text",placeholder:"e.g. Add a tablespoon of ground flaxseed to morning porridge"}]},{id:"ws-16",number:16,title:"Dermatology Appointment Preparation Sheet",category:"Dermatological Care",description:"Prepare a concise medical summary, lesion history, medication list, and priority questions for your doctor.",objective:"Maximize the value of your clinical consultation with clear, organized information.",fields:[{id:"main_complaint",label:"Main reason for consultation (stated in 1–2 clear sentences)",type:"textarea",placeholder:"e.g. Persistent itchy red rash on cheeks that stings with water for 3 months, and review of a dark mole on back..." 3. What is the treatment timeline?`}]},{id:"ws-17",number:17,title:"30-Day Personal-Care Habit Tracker",category:"Habit Formation",description:"Track daily core practices: Gentle morning rinse, SPF application, hydration, gentle PM wash, and restful sleep.",objective:"Build lasting physiological self-respect through 30 days of consistent, low-stress personal care.",fields:[{id:"day_focus",label:"Current 30-Day Challenge Day (Day 1 to 30)",type:"select",options:Array.from({length:30},(u,f)=>`Day ${f+1}`)},{id:"am_spf_done",label:"Applied broad-spectrum SPF 30+ to face and neck this morning",type:"checkbox"},{id:"gentle_cleansing_done",label:"Used gentle lukewarm water/mild cleanser (no aggressive scrubbing)",type:"checkbox"},{id:"barrier_moisture_done",label:"Supported skin barrier with gentle moisturizer",type:"checkbox"},{id:"hair_scalp_respect_done",label:"Treated hair and scalp gently (no harsh tension, detangled with care)",type:"checkbox"},{id:"nail_cuticle_care_done",label:"Preserved cuticles and moisturized hands/nails",type:"checkbox"},{id:"daily_reflection",label:"Daily reflection on comfort, self-respect, and wellbeing",type:"textarea",placeholder:"How did your skin and body feel today? What felt nourishing?"}]},{id:"ws-18",number:18,title:"Monthly Personal-Care Review & Reset",category:"Assessment & Reflection",description:"Review your skin barrier comfort, hair retention, nail strength, and routine satisfaction over the past 30 days.",objective:"Adapt routines thoughtfully without chasing unnecessary products.",fields:[{id:"month_comfort_rating",label:"Overall skin comfort over the past month (1 to 10)",type:"select",options:["10 (Comfortable, calm, resilient)","8–9 (Good comfort, minor flaking/breakouts)","6–7 (Moderate dryness or irritation)","4–5 (Frequent stinging, flares, or itching)","1–3 (Persistent severe distress)"]},{id:"hair_scalp_status",label:"Hair and scalp status review",type:"textarea",placeholder:"Note shedding levels, scalp comfort, moisture retention in curls/ends..."},{id:"nail_condition",label:"Nail condition review",type:"textarea",placeholder:"Any ridges, splits, cuticle peeling? Has glove wearing helped?"},{id:"what_worked_best",label:"Which habit or product provided the greatest comfort and value?",type:"textarea",placeholder:"e.g. Daily mineral sunscreen didn’t sting; switching to gentle syndet cleanser relieved face tightness..."},{id:"adjustments_next_month",label:"What single adjustment will you make for the upcoming month?",type:"text",placeholder:"e.g. Focus on sleeping 7.5 hours and keep heavy oils off scalp skin"}]}],jy=[{day:1,title:"Barrier Audit & The Bare Skin Baseline",pillar:"Skin Barrier",learningObjective:"Understand your skin’s acid mantle and natural barrier state.",practicalAction:"Wash face with lukewarm water and a gentle cleanser only. Avoid active acids or scrubs today; observe how skin feels after 2 hours.",herbulanceNote:"Healthy skin has natural texture and pores. Perfection is an illusion; comfort is the real goal."},{day:2,title:"The Two-Finger Sunscreen Benchmark",pillar:"Photoprotection",learningObjective:"Learn the accurate dosage required for broad-spectrum protection (2 mg/cm²).",practicalAction:"Measure two full finger lengths of SPF 30+ and apply evenly across face, ears, and neck.",herbulanceNote:"Sun protection is lifelong cell preservation, regardless of cloud cover."},{day:3,title:"Lukewarm Water Water Check",pillar:"Skin Barrier",learningObjective:"Understand how hot water solubilizes and strips intercellular lipids.",practicalAction:"Keep facial washing and showers strictly lukewarm. Limit shower time to under 8 minutes.",herbulanceNote:"Protecting your skin barrier starts with the temperature of your tap water."},{day:4,title:"Hair Cuticle Protection & Detangling",pillar:"Hair & Scalp",learningObjective:"Recognize that hair is non-living keratin protected by delicate shingle cuticles.",practicalAction:"Detangle hair only with conditioner or leave-in slip, working from ends upward with a wide-tooth comb.",herbulanceNote:"Gentle handling prevents the mechanical micro-fractures that cause split ends."},{day:5,title:"The Cuticle Preservation Pledge",pillar:"Nail Care",learningObjective:"Understand why the nail eponychium (cuticle) is a biological seal against infection.",practicalAction:"Massage a drop of jojoba oil or petrolatum into nail folds. Pledge not to cut cuticles.",herbulanceNote:"The cuticle seals out bacteria. Protect it as you would an eyelid."},{day:6,title:"Decoding the Cosmetic INCI Label",pillar:"Safety & Literacy",learningObjective:"Learn the 1% concentration rule and identify the first 5 base ingredients.",practicalAction:"Pick one product in your bathroom and read its full INCI ingredient list online.",herbulanceNote:"Informed knowledge liberates you from manipulative advertising buzzwords."},{day:7,title:"Rest & Gentle Reflection Day",pillar:"Skin Barrier",learningObjective:"Allow skin to rest without introducing any new products or techniques.",practicalAction:"Stick to the 3 basic steps: gentle cleanse, hydrate, and sun defense.",herbulanceNote:"Consistency is far more powerful than complexity."},{day:8,title:"Understanding Transepidermal Water Loss (TEWL)",pillar:"Skin Barrier",learningObjective:"Learn how humectants, emollients, and occlusives work together.",practicalAction:"Apply your moisturizer onto slightly damp skin immediately after cleansing to trap water.",herbulanceNote:"Moisturizers lock water in; they don’t create water from thin air."},{day:9,title:"Scalp Skin Biology & Cleansing",pillar:"Hair & Scalp",learningObjective:"Differentiate scalp living skin from dead hair fibers.",practicalAction:"Focus shampoo lather directly onto the scalp with fingertips (never fingernails).",herbulanceNote:"A healthy scalp produces healthy hair; treat scalp skin with facial-level gentleness."},{day:10,title:"Whole-Food Protein & Keratin Synthesis",pillar:"Nutrition & Sleep",learningObjective:"Understand how dietary amino acids (cysteine, methionine) build hair and nails.",practicalAction:"Ensure today’s meals include a balanced source of protein (beans, lentils, fish, eggs, tofu).",herbulanceNote:"Keratin synthesis begins on your plate, not in a supplement bottle."},{day:11,title:"Glove Protocol for Hand & Nail Defense",pillar:"Nail Care",learningObjective:"Prevent the water-swelling cycles that weaken keratin nail plates.",practicalAction:"Wear rubber gloves for all dishwashing and household chemical cleaning today.",herbulanceNote:"Physical barriers prevent more damage than any strengthening polish."},{day:12,title:"UVA vs UVB & Window Photoprotection",pillar:"Photoprotection",learningObjective:"Recognize that UVA penetrates standard window glass and cloud cover.",practicalAction:"Apply SPF even if spending the day working near bright indoor windows.",herbulanceNote:"UVA is present from sunrise to sunset with steady intensity year-round."},{day:13,title:"Fragrance & Essential Oil Literacy",pillar:"Safety & Literacy",learningObjective:"Understand that natural botanical scents can trigger allergic contact dermatitis.",practicalAction:"Check your facial products: verify whether they contain Parfum, Limonene, or Linalool.",herbulanceNote:"Natural extracts are chemically complex; gentle means non-sensitizing."},{day:14,title:"Rest & Routine Audit Day",pillar:"Skin Barrier",learningObjective:"Assess skin comfort at the two-week midpoint.",practicalAction:"Complete Worksheet 1 (Personal-Care Needs Assessment) to evaluate routine simplicity.",herbulanceNote:"Simplifying your routine often yields the greatest improvements in barrier calm."},{day:15,title:"The Period After Opening (PAO) Check",pillar:"Safety & Literacy",learningObjective:"Recognize the open jar symbol and prevent microbial contamination.",practicalAction:"Inspect your bathroom cabinet; discard any mascara >6 months or lotions past their PAO.",herbulanceNote:"Preservatives degrade over time; fresh products safeguard against ocular and skin infections."},{day:16,title:"Tension-Free Haircare & Follicle Safety",pillar:"Hair & Scalp",learningObjective:"Learn the early signs of traction alopecia and follicle mechanical strain.",practicalAction:"Loosen any tight ponytails, buns, or braids. Ensure edges feel zero scalp pulling.",herbulanceNote:"Pain or tension bumps are clear biological warning signals. Style without tension."},{day:17,title:"Safe Toenail Clipping Technique",pillar:"Nail Care",learningObjective:"Prevent painful ingrown toenails (onychocryptosis).",practicalAction:"Clip toenails straight across with clean clippers; never round edges deeply into the lateral folds.",herbulanceNote:"Straight trimming directs nail growth forward and out of delicate periungual tissue."},{day:18,title:"Circadian Rest & Nocturnal Barrier Repair",pillar:"Nutrition & Sleep",learningObjective:"Understand how nocturnal keratinocyte proliferation and DNA repair peak during sleep.",practicalAction:"Aim for 7 to 8 hours of sleep tonight; apply a nourishing barrier cream before bed.",herbulanceNote:"Sleep is the body’s endogenous restorative cycle."},{day:19,title:"Debunking the Pores Open/Close Myth",pillar:"Safety & Literacy",learningObjective:"Understand that pores have no muscles and cannot physically open or close.",practicalAction:"Avoid extreme hot steam on the face; use gentle cleansing oil to soften sebum.",herbulanceNote:"Accepting pore physiology prevents damaging steaming habits that cause broken capillaries."},{day:20,title:"Inclusive Photoprotection & Melanin Biology",pillar:"Photoprotection",learningObjective:"Understand why all skin tones benefit from photoprotection against DNA damage and melasma.",practicalAction:"Choose an inclusive sunscreen (mineral tinted with iron oxides or transparent organic filters).",herbulanceNote:"Melanin is wondrous natural protection, but UVA still damages deep dermal structures."},{day:21,title:"Rest & Habit Reflection Day",pillar:"Skin Barrier",learningObjective:"Review 3 weeks of consistency and habit sustainability.",practicalAction:"Enjoy a soothing bath or shower with fragrance-free wash; moisturize while damp.",herbulanceNote:"Personal care is an act of daily self-respect, not a chore."},{day:22,title:"Essential Fatty Acids in Everyday Nutrition",pillar:"Nutrition & Sleep",learningObjective:"Learn how linoleic and omega-3 fatty acids incorporate into stratum corneum ceramides.",practicalAction:"Add a handful of walnuts, pumpkin seeds, or olive oil to your meals today.",herbulanceNote:"Your skin barrier lipids reflect the healthy dietary fats you ingest."},{day:23,title:"Heat Styling Safety & Bubble Hair Prevention",pillar:"Hair & Scalp",learningObjective:"Understand why flat-ironing damp hair causes cortex steam cavitation.",practicalAction:"Never apply hot tools to wet hair. Ensure hair is 100% dry and protected by silicone serum.",herbulanceNote:"Preserving hair tensile strength today prevents irreversible trims tomorrow."},{day:24,title:"Safe Salon Practices & Tool Disinfection",pillar:"Nail Care",learningObjective:"Identify proper autoclave sanitation and disposable foot bath liners.",practicalAction:"Disinfect your personal nail clippers and emery boards with 70% isopropyl alcohol.",herbulanceNote:"Hygiene in grooming equipment prevents stubborn fungal and bacterial cross-contamination."},{day:25,title:"Patch Testing Protocol Before New Products",pillar:"Safety & Literacy",learningObjective:"Master the 3-day inner forearm patch test for delayed hypersensitivity.",practicalAction:"Practice applying a tiny dot of an active product behind the ear or inner arm for 3 days.",herbulanceNote:"A 3-day patch test on a small area prevents weeks of full-face dermatitis."},{day:26,title:"Stress, Neuropeptides & Skin Calming",pillar:"Nutrition & Sleep",learningObjective:"Learn how the nervous system communicates with mast cells via substance P.",practicalAction:"Take a 15-minute screen-free walk or practice diaphragmatic breathing when feeling rushed.",herbulanceNote:"Calming your nervous system directly downregulates cutaneous inflammatory pathways."},{day:27,title:"Spotting ABCDE Signs for Skin Checks",pillar:"Safety & Literacy",learningObjective:"Learn Asymmetry, Border, Color, Diameter, and Evolving signs for mole screening.",practicalAction:'Perform a gentle self-inspection of your skin. Note any spots that look like "ugly ducklings".',herbulanceNote:"Vigilance and timely professional checks save lives."},{day:28,title:"Rest & Gentle Maintenance Day",pillar:"Skin Barrier",learningObjective:"Consolidate simple, low-cost habits that you enjoy keeping lifelong.",practicalAction:"Maintain your core triad: gentle wash, barrier moisture, broad-spectrum SPF.",herbulanceNote:"The most effective routine is the one you can sustain comfortably every day."},{day:29,title:"Evaluating Your Budget & Cost-Per-Use",pillar:"Safety & Literacy",learningObjective:"Celebrate financial sustainability and freedom from luxury marketing.",practicalAction:"Review Worksheet 12 (Cost-Per-Use) to see how much money you’ve saved by avoiding hype.",herbulanceNote:"Evidence-based dermatology is surprisingly affordable when stripped of commercial vanity."},{day:30,title:"Lifelong Self-Respect & The Herbulance Philosophy",pillar:"Skin Barrier",learningObjective:"Ground your personal care in lifelong physiological health, comfort, and dignity.",practicalAction:"Complete Worksheet 18 (Monthly Personal-Care Review & Reset). Celebrate your progress!",herbulanceNote:"Healthy personal care is not about perfection. It is about understanding your body, protecting its natural functions, making informed choices, and treating yourself with care and respect."}],em=({initialWorksheetId:u})=>{const[f,v]=L.useState(u==="challenge"?"challenge":"worksheets"),[c,j]=L.useState(u&&u!=="challenge"?u:"ws-01"),[y,R]=L.useState(()=>{try{const N=localStorage.getItem("herbulance_worksheets_data");return N?JSON.p
