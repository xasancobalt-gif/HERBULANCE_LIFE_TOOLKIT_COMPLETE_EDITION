all activity","Strength plus balance training (e.g. tai chi, STEADI-style programmes)","Only medication","Bed rest"],answer:1,explanation:"Multi-component programmes with balance and strength reduce falls; inactivity increases risk.",category:"Joints & balance",chapter:29},{q:"The healthiest posture principle is:",options:["One perfect rigid posture all day","Varied posture — your best posture is your next posture","Always slouched","Never change position"],answer:1,explanation:"Tissues tolerate variety; change position frequently during sitting and standing.",category:"Posture & ergonomics",chapter:30},{q:"When carrying a heavy bag, you should:",options:["Carry it all on one side far from the body","Keep the load close, distribute weight evenly, and take breaks","Lean sideways","Hold your breath"],answer:1,explanation:"Close to the body, even distribution (two straps/bags), core braced, breathe normally.",category:"Posture & ergonomics",chapter:30},{q:"Before starting exercise after being sedentary with risk factors, you should:",options:["Never exercise","Consider screening (e.g. PAR-Q+) and clinical advice","Do maximal tests at home","Ignore symptoms"],answer:1,explanation:"Screening tools and clinician guidance identify who needs medical assessment first.",category:"Beginner & planning",chapter:31},{q:"Which weekly template best matches adult public-health guidance?",options:["No movement at all","~150+ min aerobic plus ≥2 strength days, mobility, balance and rest days","Only 10 minutes total","Only balance training"],answer:1,explanation:"A flexible mix of aerobic, strength, mobility, balance and rest — adapted to your life.",category:"Beginner & planning",chapter:32},{q:"For a small home space, the most useful basic equipment is:",options:["A full gym","A mat, resistance bands and/or adjustable dumbbells","Nothing can work at home","Only expensive machines"],answer:1,explanation:"Bands and bodyweight cover all major patterns; household items can add load safely.",category:"Beginner & planning",chapter:33},{q:"In a gym, good etiquette includes:",options:["Dropping weights anywhere","Re-racking weights, wiping equipment, using collars and giving space during lifts","Hovering over others mid-set","Ignoring broken equipment"],answer:1,explanation:"Shared spaces stay safe through courtesy, hygiene and proper equipment use.",category:"Beginner & planning",chapter:34},{q:"Children and adolescents (5–17) are commonly advised to accumulate:",options:["No activity","At least 60 minutes per day of moderate-to-vigorous activity","Only weightlifting","Only screen-based activity"],answer:1,explanation:"Plus vigorous and muscle/bone-strengthening activity ≥3 days/week, with fun and variety prioritised.",category:"Life stages & abilities",chapter:36},{q:"During pregnancy, most women without contraindications are generally advised:",options:["Bed rest always","Around 150 minutes of moderate activity per week, with individual clinician guidance","Maximal HIIT daily","No movement at all"],answer:1,explanation:"ACOG guidance supports moderate activity for most uncomplicated pregnancies; individual advice prevails.",category:"Life stages & abilities",chapter:36},{q:"Seated exercise circuits are:",options:["Not real exercise","A valid, effective form of training for people who cannot or prefer not to stand","Only for older adults","Dangerous for everyone"],answer:1,explanation:"Seated movement raises heart rate and builds strength — a genuine accessible option.",category:"Life stages & abilities",chapter:37},{q:"Adaptation (supercompensation) primarily occurs:",options:["During the workout itself","During recovery — rest, sleep, nutrition and hydration","Only with supplements","Never"],answer:1,explanation:"Training is the stimulus; recovery builds the fitness.",category:"Recovery",chapter:38},{q:"A good warm-up typically lasts and includes:",options:["0 minutes","5–15 minutes of gradual aerobic movement, joint mobility and light rehearsal of the session's movements","60 minutes of static stretching","Skipping it before hard efforts"],answer:1,explanation:"Warm muscles and an activated nervous system perform better and may be less injury-prone.",category:"Recovery",chapter:39},{q:"DOMS usually peaks:",options:["Immediately during the workout","Around 24–72 hours after unaccustomed exercise","After one year","Never"],answer:1,explanation:"It fades within about a week and is not required for progress.",category:"Recovery",chapter:40},{q:"Dark urine with severe muscle pain after exercise can indicate:",options:["Good hydration","Possible rhabdomyolysis — seek urgent medical care","Normal DOMS","Fat burning"],answer:1,explanation:"This combination is a red flag requiring urgent assessment.",category:"Safety",chapter:40},{q:"For muscle repair, athletes are often advised protein intake around:",options:["0.1 g/kg/day","1.2–2.0 g/kg/day depending on training, spread across meals","5 g/kg/day","No protein at all"],answer:1,explanation:"Phillips & Van Loon (2011) summarise athlete protein needs in this range; food can meet them.",category:"Nutrition & hydration",chapter:41},{q:"During prolonged exercise in heat, the key electrolyte to replace is mainly:",options:["Iron","Sodium","Vitamin C","Calcium only"],answer:1,explanation:"Sodium is the main electrolyte lost in sweat; plain water suits most sessions under ~1 hour.",category:"Nutrition & hydration",chapter:42},{q:"Exercise-associated hyponatremia is caused by:",options:["Drinking too little","Drinking far more plain fluid than sweat losses, diluting blood sodium","Eating salt","Sleeping"],answer:1,explanation:"Drink to thirst with modest planned intake — avoid both dehydration and forced over-drinking.",category:"Nutrition & hydration",chapter:42},{q:"Which supplement has one of the strongest evidence bases for strength/power in healthy adults?",options:["Creatine monohydrate (well studied, generally safe in adults)","Any fat burner","Mystery blends","Unregulated steroids (unsafe and banned)"],answer:0,explanation:"The ISSN position stand supports creatine's efficacy and safety in healthy adults; supplements are still optional.",category:"Supplements",chapter:43},{q:"A major risk with some supplements is:",options:["They are too cheap","Contamination with undeclared drugs; choose third-party tested products","They taste good","They are regulated like medicines everywhere"],answer:1,explanation:"Regulation varies; independent testing (e.g. NSF/Informed Sport) reduces contamination risk.",category:"Supplements",chapter:43},{q:"Meta-analytic evidence suggests regular physical activity has what effect on sleep?",options:["Worsens sleep always","Small-to-moderate beneficial effects on sleep quality and duration","No effect ever","Only helps children"],answer:1,explanation:"Kredlow et al. (2015) found modest benefits, moderated by age, baseline activity and timing.",category:"Recovery",chapter:44},{q:"Which symptom during exercise requires stopping and seeking urgent help?",options:["Mild sweating","Chest pain or fainting","Feeling warm","Mild muscle effort fatigue"],answer:1,explanation:"Chest discomfort, fainting, severe breathlessness or one-sided weakness are emergency warning signs.",category:"Safety",chapter:47},{q:"Heat stroke is:",options:["Mild tiredness","A life-threatening emergency — call emergency services and cool immediately","Cured by drinking cold water alone","Not serious"],answer:1,explanation:"Confusion/collapse with heat exposure requires emergency response: cool first, call for help.",category:"Safety",chapter:47},{q:"Signs of possible overtraining include:",options:["Persistent fatigue, declining performance, poor sleep and mood changes","Feeling great always","One tired day","Normal soreness that fades"],answer:0,explanation:"Sustained load–recovery imbalance produces these patterns; respond with rest and reduced load.",category:"Safety",chapter:48},{q:"Which is a healthier, more sustainable measure of progress?",options:["Only the number on a scale","Function, sleep, mood, strength and endurance improvements","Only appearance photos","Only how sore you get"],answer:1,explanation:"Non-scale measures are more durable and respectful; worth is never physical.",category:"Mindset & adherence",chapter:49},{q:"The strongest predictor of long-term exercise adherence is:",options:["Enjoyment and habit cues","Punishing missed days","Perfection","Expensive gear"],answer:0,explanation:"Anchor activity to routines, start small, and choose activities you like.",category:"Mindset & adherence",chapter:50},{q:"Which claim is a myth?",options:["Some activity is better than none","Spot reduction works by training one body part","Gradual progression reduces injury risk","Recovery is part of training"],answer:1,explanation:"Spot reduction is not supported; fat loss is systemic.",category:"Myths",chapter:51},{q:"“No pain, no gain” is:",options:["Evidence-based","A myth — pain that alters movement is a warning sign, not a progress meter","Required for strength","Safe advice"],answer:1,explanation:"Progress comes from progressive, recoverable challenge — not pain.",category:"Myths",chapter:51},{q:"Which statement about the 30-day challenge in this book is true?",options:["It requires daily workouts and weight-loss targets","It is flexible, includes rest and accessible alternatives, and never trains through pain","It is competitive","It requires special equipment"],answer:1,explanation:"The challenge is educational and sustainable by design.",category:"Myths",chapter:53},{q:"This book's guidance is:",options:["A personal medical prescription for you","Educational population-level information — individual clinical advice takes precedence","A diagnosis tool","A supplement recommendation"],answer:1,explanation:"The book educates; qualified professionals personalise advice.",category:"Safety",chapter:54}],cn=[{front:"What is physical activity (WHO definition)?",back:"Any bodily movement produced by skeletal muscles that requires energy expenditure — includes exercise, work, transport and chores.",tag:"Foundations"},{front:"How does exercise differ from physical activity?",back:"Exercise is planned, structured, repetitive activity with a fitness/health purpose — a subset of physical activity.",tag:"Foundations"},{front:"What is sedentary behaviour?",back:"Waking time spent sitting, reclining or lying with low energy expenditure — a risk factor distinct from inactivity.",tag:"Foundations"},{front:"Name the four domains of physical activity.",back:"Occupational, transport, domestic, and leisure-time activity.",tag:"Foundations"},{front:"What is ATP?",back:"Adenosine triphosphate — the immediate energy currency powering muscle contraction and cell processes.",tag:"Energy"},{front:"Name the three energy systems.",back:"Phosphagen (ATP-PC), anaerobic glycolysis, and aerobic (oxidative) metabolism. They always overlap.",tag:"Energy"},{front:"What does the phosphagen system fuel?",back:"Maximal efforts of roughly up to 10 seconds — sprints, jumps, heavy single lifts.",tag:"Energy"},{front:"What is lactate — and what does it NOT cause?",back:"A product of anaerobic glycolysis that can be used as fuel. It clears within hours and does not cause next-day DOMS.",tag:"Energy"},{front:"What is a sarcomere?",back:"The basic contractile unit of muscle, containing actin and myosin filaments that slide past each other.",tag:"Muscle"},{front:"What is a motor unit?",back:"One motor neuron plus all the muscle fibres it activates. Recruited small-to-large (size principle).",tag:"Muscle"},{front:"Concentric vs eccentric vs isometric?",back:"Concentric = muscle shortens (lift up). Eccentric = lengthens under load (lower down). Isometric = force without length change (hold).",tag:"Muscle"},{front:"What drives early strength gains?",back:"Neurological adaptation — better motor-unit recruitment, firing rate and coordination — before muscle growth.",tag:"Strength"},{front:"What is hypertrophy?",back:"Growth of muscle fibres from sustained progressive training plus recovery and nutrition.",tag:"Strength"},{front:"What is mechanical tension?",back:"Force through muscle across a range of motion — the primary proposed driver of muscle adaptation.",tag:"Strength"},{front:"What is progressive overload?",back:"Gradually increasing training demand (load, volume, intensity or difficulty) so adaptation continues.",tag:"Programming"},{front:"What is a deload?",back:"A planned week at roughly 50–70% of usual volume/load to dissipate fatigue — typically every 4–8 weeks.",tag:"Programming"},{front:"Name the major movement patterns.",back:"Squat, hip hinge, push, pull, lunge, carry, rotation/anti-rotation, locomotion.",tag:"Programming"},{front:"What does cardiac output equal?",back:"Heart rate × stroke volume — the blood volume pumped per minute.",tag:"Cardiovascular"},{front:"What is stroke volume?",back:"The volume of blood ejected by the heart per beat; increases with aerobic training.",tag:"Cardiovascular"},{front:"Arteries vs veins?",back:"Arteries carry blood away from the heart; veins return it to the heart.",tag:"Cardiovascular"},{front:"What is the talk test at moderate intensity?",back:"You can talk comfortably but not sing.",tag:"Intensity"},{front:"What is RPE?",back:"Rating of perceived exertion — a 0–10 (or 6–20) scale of how hard exercise feels. Moderate ≈ 5–6/10.",tag:"Intensity"},{front:"Why is “220 − age” limited?",back:"It is a population estimate with wide individual error (±10–20+ bpm); combine with RPE and the talk test.",tag:"Intensity"},{front:"What is VO2max?",back:"Aerobic capacity — the maximum rate of oxygen uptake during exercise; improves with aerobic training.",tag:"Cardiovascular"},{front:"What is HIIT?",back:"High-intensity interval training — short hard intervals alternating with recovery. Optional, not required for health.",tag:"Aerobic"},{front:"Why is walking a strong health intervention?",back:"Low-impact, accessible, and associated with lower risks of cardiovascular disease, diabetes, depression and early death — consistency matters most.",tag:"Aerobic"},{front:"Is 10,000 steps a scientific threshold?",back:"No — it began as marketing. Benefits rise well below 10,000; increase from your own baseline.",tag:"Aerobic"},{front:"Mobility vs flexibility?",back:"Flexibility = available range at a joint. Mobility = active, controlled range using strength — the practical combination.",tag:"Mobility"},{front:"Name four stretching methods.",back:"Static, dynamic, ballistic (generally discouraged), and PNF (contract-relax).",tag:"Mobility"},{front:"Does stretching prevent all injuries?",back:"No — reviews find no clear all-cause prevention effect; load management, strength and warm-up matter more.",tag:"Mobility"},{front:"How is joint cartilage nourished?",back:"By movement — loading/unloading pumps synovial fluid in and out, since cartilage has no blood supply.",tag:"Joints"},{front:"What three senses feed balance?",back:"Vision, the vestibular system (inner ear) and proprioception (muscle/joint sensors).",tag:"Balance"},{front:"What reduces fall risk in older adults?",back:"Strength plus balance training (e.g. tai chi, STEADI-style programmes), medication review, vision checks and home safety.",tag:"Balance"},{front:"Is there one perfect posture?",back:"No — the best posture is the next posture: vary positions frequently.",tag:"Posture"},{front:"Safe lifting basics?",back:"Load close to the body, brace the core, neutral spine, drive through hips/legs, breathe continuously, turn with feet not torso.",tag:"Posture"},{front:"What is DOMS?",back:"Delayed-onset muscle soreness — peaks 24–72 h after unaccustomed (especially eccentric) exercise; fades within a week.",tag:"Recovery"},{front:"Is soreness required for progress?",back:"No — adaptation does not require DOMS; gradual progression limits it.",tag:"Recovery"},{front:"When does adaptation happen?",back:"During recovery — rest, sleep, nutrition and hydration — not during the workout itself.",tag:"Recovery"},{front:"How much sleep do most adults need?",back:"Around 7–9 hours; athletes often more. Poor sleep impairs performance, recovery and injury resilience.",tag:"Recovery"},{front:"Rough athlete protein guidance?",back:"About 1.2–2.0 g per kg body weight per day, spread across meals — achievable from ordinary food.",tag:"Nutrition"},{front:"When are electrolytes most important?",back:"During prolonged (>~1–2 h) or very hot/sweaty exercise — sodium is the key one. Water suffices for most shorter sessions.",tag:"Hydration"},{front:"What is exercise-associated hyponatremia?",back:"Low blood sodium from over-drinking plain water beyond sweat losses — drink to thirst, avoid forced mega-intake.",tag:"Hydration"},{front:"Which supplements have the strongest evidence?",back:"Creatine monohydrate and caffeine (in specific doses/contexts); protein powder is just food. None are compulsory.",tag:"Supplements"},{front:"Main supplement safety concern?",back:"Contamination with undeclared drugs — use third-party tested products only, and check with a clinician, especially with medications.",tag:"Supplements"},{front:"Emergency warning signs during exercise?",back:"Chest pain/pressure, fainting, severe breathlessness, one-sided weakness, severe headache — stop and call emergency services.",tag:"Safety"},{front:"What is heat stroke?",back:"A life-threatening emergency (hot skin, confusion, collapse) — call emergency services and cool immediately.",tag:"Safety"},{front:"What is overtraining syndrome?",back:"Persistent fatigue and performance decline from sustained load exceeding recovery — treat with rest and reduced load.",tag:"Safety"},{front:"What is spot reduction?",back:"A myth — you cannot selectively lose fat from one area by training it; fat loss is systemic.",tag:"Myths"},{front:"Does sweating measure fat loss?",back:"No — sweat is water/electrolytes for cooling; fat loss is not measured by sweat.",tag:"Myths"},{front:"Best predictor of long-term adherence?",back:"Enjoyment plus habit anchoring (cues, consistent context, small starts).",tag:"Adherence"}],In=[{term:"Aerobic capacity (VO2max)",def:"The maximum rate at which the body can take up and use oxygen during exercise; a key measure of cardiorespiratory fitness. Improves with regular aerobic training."},{term:"Aerobic exercise",def:"Sustained, rhythmic activity using large muscle groups that relies mainly on oxygen-dependent energy production, e.g. brisk walking, cycling, swimming."},{term:"Anaerobic metabolism",def:"Energy production that does not require oxygen at that moment — the phosphagen and glycolytic systems. Used during short, hard efforts."},{term:"Antagonist",def:"The muscle that opposes the agonist in a movement, controlling and slowing it — e.g. the hamstrings oppose the quadriceps when extending the knee."},{term:"ATP (adenosine triphosphate)",def:"The immediate energy currency of cells. Muscle contraction, nerve signalling and many processes run directly on ATP, which the body constantly regenerates."},{term:"Agonist",def:"The primary muscle producing a movement — e.g. the quadriceps in knee extension."},{term:"Ballistic stretching",def:"Bouncing, momentum-driven stretching beyond the comfortable range. Generally discouraged because it can trigger stretch reflexes and strain tissue."},{term:"Balance",def:"The ability to keep the body's centre of mass over its base of support, statically or while moving. Trainable at any age."},{term:"Basal metabolic rate (BMR)",def:"The energy the body uses at complete rest to maintain vital functions. A component of total daily energy expenditure."},{term:"Biomechanics",def:"The study of the mechanical principles of human movement — forces, levers, motion and their effects on the body."},{term:"Body composition",def:"The relative proportions of fat, muscle, bone and water in the body. One health-related measure among many — never a measure of worth."},{term:"Cardiac output",def:"The volume of blood the heart pumps per minute — heart rate × stroke volume. Rises several-fold during exercise."},{term:"Cardiovascular endurance",def:"The ability of the heart, lungs and circulation to supply oxygen during sustained physical activity."},{term:"Cartilage",def:"Smooth, firm connective tissue covering the ends of bones in synovial joints; cushions and reduces friction. Nourished by movement."},{term:"Concentric contraction",def:"A muscle action in which the muscle shortens while producing force — e.g. lifting a weight upward."},{term:"Coordination",def:"The ability to use the right muscles at the right time with appropriate sequencing and timing for smooth, accurate movement."},{term:"Core",def:"The muscle cylinder around the trunk — abdominals, obliques, transverse abdominis, multifidus, diaphragm and pelvic floor — that stabilises the spine and manages pressure."},{term:"Delayed-onset muscle soreness (DOMS)",def:"Muscle aching and stiffness peaking 24–72 hours after unaccustomed exercise, especially eccentric work. Temporary; not required for progress."},{term:"Deload",def:"A planned reduction in training volume or load (typically a week at 50–70% of usual) to dissipate fatigue and consolidate adaptation."},{term:"DOMS",def:"See delayed-onset muscle soreness."},{term:"Dynamic stretching",def:"Controlled movement through a joint's range of motion — the preferred stretching style in warm-ups."},{term:"Eccentric contraction",def:"A muscle action in which the muscle lengthens while producing force — e.g. slowly lowering a weight. High force, key for control and soreness."},{term:"Electrolytes",def:"Minerals that carry electrical charge in body fluids — mainly sodium, plus potassium, magnesium, chloride. Lost in sweat; important in prolonged or hot exercise."},{term:"Energy systems",def:"The three pathways that regenerate ATP: phosphagen (seconds), anaerobic glycolysis (~10 s–2 min), and aerobic oxidation (minutes+). They always overlap."},{term:"Exercise",def:"Planned, structured, repetitive physical activity done to improve or maintain fitness or health — a subset of physical activity."},{term:"Exercise-associated hyponatremia",def:"Dangerously low blood sodium from drinking far more plain fluid than sweat losses, sometimes during long endurance events. Prevent by drinking to thirst."},{term:"Exercise intensity",def:"How hard an activity is relative to a person's capacity — light, moderate or vigorous — measurable by the talk test, RPE or heart rate."},{term:"Fartlek",def:"A training method mixing continuous and interval work by feel — e.g. “speed play” with spontaneous surges. Less structured than formal intervals."},{term:"Fascia",def:"Connective tissue that wraps muscles, organs and body regions, transmitting force and contributing to elastic energy storage."},{term:"Fast-twitch (type II) fibres",def:"Muscle fibres that produce high force quickly but fatigue sooner; subtypes IIa and IIx. Used in powerful, short efforts."},{term:"Flexibility",def:"The range of motion available at a joint, influenced by muscle, connective tissue, joint structure and nervous control."},{term:"Functional fitness",def:"The capacity to perform daily-life movements — standing, carrying, stairs, reaching — safely and confidently."},{term:"Gait cycle",def:"One complete cycle of a walking or running step — stance and swing phases (plus flight in running)."},{term:"Glycogen",def:"The stored form of carbohydrate in muscle and liver; the main high-intensity fuel during exercise."},{term:"Heart rate (HR)",def:"Beats per minute. Rises with exercise intensity; resting values vary widely between individuals."},{term:"Heat acclimatisation",def:"The body's adaptation to training in heat over roughly 1–2 weeks — lower heart rate and core temperature, earlier sweating — which improves heat tolerance."},{term:"HIIT (high-intensity interval training)",def:"Alternating short vigorous efforts with recovery periods. Time-efficient and evidence-supported for some outcomes; optional, not required."},{term:"Hypertrophy",def:"An increase in muscle size from sustained progressive resistance training and adequate recovery and nutrition."},{term:"Isometric contraction",def:"A muscle action producing force without changing length — e.g. holding a plank."},{term:"Kinetic chain",def:"The linked segments (joints and muscles) that work together in a movement — e.g. ankle–knee–hip–spine in a squat."},{term:"Lactate",def:"A product of anaerobic glycolysis. Once blamed for fatigue and soreness; now understood as a usable fuel. Clears within hours — it does not cause next-day DOMS."},{term:"Ligament",def:"Fibrous connective tissue connecting bone to bone, stabilising joints — e.g. the ACL in the knee."},{term:"Locomotion",def:"Movement that transports the body through space — walking, running, cycling, swimming, wheeling."},{term:"MET (metabolic equivalent)",def:"A unit of energy cost: 1 MET is resting energy use. Moderate activity is roughly 3–6 METs; vigorous is above 6."},{term:"Mobility",def:"Active, controlled range of motion at a joint — flexibility plus strength and neuromuscular control through that range."},{term:"Motor unit",def:"One motor neuron and all the muscle fibres it activates. Recruited small-to-large (size principle) as effort increases."},{term:"Muscle fibre",def:"A single muscle cell. Types I (slow, fatigue-resistant) and II (fast, powerful) differ in speed, force and endurance."},{term:"Muscle protein synthesis (MPS)",def:"The building of new muscle protein. Raised by resistance exercise and protein intake; must exceed breakdown over time for growth."},{term:"Muscular endurance",def:"The ability of a muscle to sustain repeated contractions or a held contraction over time."},{term:"Muscular strength",def:"The maximum force a muscle or muscle group can produce in a single effort."},{term:"Myofibril",def:"The contractile strands inside a muscle fibre, made of repeating sarcomeres containing actin and myosin."},{term:"Neuromuscular adaptation",def:"Improvements in the nervous system's control of muscle — recruitment, firing rate, coordination — the main driver of early strength gains."},{term:"Neuromuscular junction",def:"The synapse where a motor neuron signals a muscle fibre to contract."},{term:"Overreaching",def:"A short-term performance dip from training load exceeding recovery; resolves with rest (functional) or persists if prolonged (non-functional)."},{term:"Overtraining syndrome",def:"A prolonged state of fatigue and performance decline from sustained load–recovery imbalance, with physical, mood and sleep symptoms."},{term:"Overuse injury",def:"Tissue damage from repeated load exceeding recovery over time — e.g. tendinopathy, shin splints, stress reactions. Usually “too much too soon”."},{term:"PAR-Q+",def:"Physical Activity Readiness Questionnaire — a screening tool identifying people who should seek medical advice before becoming more active."},{term:"Phosphagen system (ATP-PC)",def:"The fastest energy system, using stored ATP and phosphocreatine for maximal efforts of roughly up to 10 seconds."},{term:"Physical activity",def:"Any bodily movement produced by skeletal muscles that requires energy expenditure (WHO definition). Includes exercise, work, transport and chores."},{term:"PNF stretching",def:"Proprioceptive neuromuscular facilitation — stretching combined with muscle contraction (e.g. contract-relax). Effective for range of motion, often used in rehabilitation."},{term:"Power",def:"Force produced quickly — strength × speed. Important for jumping, sprinting and reactive movements like catching a fall."},{term:"Progressive overload",def:"Gradually increasing training demand (load, volume, intensity or difficulty) so the body keeps adapting."},{term:"Proprioception",def:"The sense of body position and movement from sensors in muscles, tendons, joints and the inner ear. Trainable; key for balance."},{term:"Range of motion (ROM)",def:"The extent of movement possible at a joint, in a given direction."},{term:"RED-S (Relative Energy Deficiency in Sport)",def:"A syndrome from sustained low energy availability relative to exercise load, affecting hormones, bones, immunity and performance. Needs professional care."},{term:"Rehabilitation",def:"Professionally guided movement and exercise to restore function after illness or injury."},{term:"Resistance training",def:"Exercise in which muscles work against external resistance — bodyweight, bands, free weights, machines or everyday objects."},{term:"Rest interval",def:"The recovery time between sets or sessions — longer (2–3 min) for heavy strength work, shorter for endurance-type work."},{term:"RPE (rating of perceived exertion)",def:"A subjective scale of how hard exercise feels (e.g. 0–10). Correlates with heart rate and works without any device."},{term:"Sarcomere",def:"The basic contractile unit of muscle, containing actin and myosin filaments that slide past each other during contraction."},{term:"Sedentary behaviour",def:"Waking time spent sitting, reclining or lying with low energy expenditure. A risk factor distinct from physical inactivity."},{term:"Size principle",def:"Motor units are recruited from small to large as force demand increases."},{term:"Skeletal muscle",def:"Voluntary, striated muscle attached to bones via tendons; the tissue trained in resistance exercise."},{term:"Slow-twitch (type I) fibres",def:"Muscle fibres that are fatigue-resistant and suited to endurance activity."},{term:"Sport",def:"Rule-governed, often competitive physical activity involving skill and, typically, structured training."},{term:"Sprain",def:"Stretching or tearing of a ligament, usually around a joint, often with swelling and bruising — e.g. an ankle sprain."},{term:"Static stretching",def:"Holding a muscle in a lengthened position for a set time (typically 15–60 s). Best after activity or for relaxation."},{term:"Strain",def:"Tearing or overstretching of muscle fibres or a tendon, often felt as sudden sharp pain during a loaded movement."},{term:"Strength",def:"The capacity of the neuromuscular system to produce force against resistance."},{term:"Stretch reflex",def:"A protective muscle contraction triggered when a muscle is stretched rapidly — a reason ballistic bouncing is discouraged."},{term:"Stroke volume (SV)",def:"The volume of blood ejected by the heart per beat. Increases with aerobic training."},{term:"Supercompensation",def:"The rebound to a higher performance level after recovery from a training stimulus — the basis of progressive adaptation."},{term:"Synergist",def:"A muscle that assists the agonist in producing a movement."},{term:"Synovial fluid",def:"Lubricating fluid inside synovial joints that nourishes cartilage and reduces friction."},{term:"Tendon",def:"Fibrous connective tissue connecting muscle to bone, transmitting force. Adapts to gradual loading more slowly than muscle."},{term:"Tendinopathy",def:"A painful, degenerative-overload condition of a tendon from repeated excessive load — e.g. Achilles or patellar tendinopathy."},{term:"Talk test",def:"A simple intensity check: moderate = talk but not sing; vigorous = only short phrases."},{term:"Training load",def:"The total training stress imposed — volume × intensity × frequency — which must be balanced by recovery."},{term:"Training volume",def:"The total amount of work in a session or week — sets × reps × load. A key driver of adaptation, progressed gradually."},{term:"Type I / Type II fibres",def:"See slow-twitch and fast-twitch fibres."},{term:"Vestibular system",def:"The inner-ear balance system that senses head position and motion; one of three inputs to balance."},{term:"VO2max",def:"See aerobic capacity."},{term:"Valsalva manoeuvre",def:"Holding your breath and bearing down during a heavy lift; raises blood pressure sharply — breathe continuously instead."},{term:"Warm-up",def:"Gradual preparation raising body temperature, blood flow and neuromuscular readiness — typically 5–15 minutes before a session."},{term:"Workout",def:"A single session of planned exercise."},{term:"1RM (one-repetition maximum)",def:"The maximum load a person can lift once with good technique. Often estimated rather than tested directly for safety."},{term:"Aerobic base",def:"The foundation of low-to-moderate intensity endurance training that supports all other training."},{term:"Active recovery",def:"Very light activity (easy walking, gentle swimming) on recovery days to promote blood flow without adding load."},{term:"Adaptation",def:"The body's structural and functional change in response to repeated, recoverable training stimuli."},{term:"Anabolic window",def:"The overstated idea that protein must be consumed within ~30 minutes post-workout; total daily intake matters most."},{term:"Basal ganglia",def:"Deep brain structures involved in initiating and smoothing movement, alongside the cerebellum and motor cortex."},{term:"BMI (body mass index)",def:"Weight (kg) divided by height (m) squared. A population screening tool — not a measure of individual health or worth."},{term:"Capillary",def:"The smallest blood vessel, where oxygen and nutrients exchange with tissues. Density increases in trained muscle."},{term:"Cardiorespiratory fitness",def:"See cardiovascular endurance — the capacity of heart, lungs and vessels to sustain activity."},{term:"Circadian rhythm",def:"The body's roughly 24-hour internal clock, which influences sleep, hormones and performance timing."},{term:"Closed kinetic chain",def:"An exercise where the moving limb's end is fixed — e.g. a push-up or squat; generally joint-friendly."},{term:"Cool-down",def:"A gradual ease-down after exercise — light activity and gentle stretching — to transition the body back to rest."},{term:"Cross-training",def:"Using varied activities to train the same fitness while reducing repetitive overload — e.g. swimming for a runner."},{term:"Detraining",def:"The partial loss of training adaptations during prolonged inactivity — gradual, and reversible on return."},{term:"Diaphragm",def:"The main breathing muscle; also a key component of the core cylinder for pressure management."},{term:"Dose-response",def:"The relationship where increasing amounts of activity are associated with increasing benefit up to a plateau — the basis of activity guidance."},{term:"Eccentric overload",def:"Emphasising the lengthening phase of a lift; potent for strength and muscle damage — progress it gradually."},{term:"Ergonomics",def:"Designing tasks and spaces to fit the person — e.g. desk and chair setup to support varied, comfortable posture."},{term:"Exercise physiology",def:"The scientific study of how the body responds and adapts to exercise."},{term:"FITT principle",def:"A planning framework: Frequency, Intensity, Time (duration), Type of exercise."},{term:"Golgi tendon organ",def:"A sensory receptor in tendons that detects tension and helps protect muscle-tendon units from excessive force."},{term:"Glycolysis",def:"The anaerobic breakdown of glucose to ATP, producing lactate; dominant in hard efforts of roughly 10 seconds to 2 minutes."},{term:"Heart-rate reserve (HRR)",def:"Maximal heart rate minus resting heart rate — used in some individualised heart-rate zone methods."},{term:"Hypermobility",def:"Joints moving beyond the typical range; may require more strength and control rather than more stretching."},{term:"Isokinetic",def:"Muscle action at constant speed, usually on specialised machines; less common in general training."},{term:"Kinesiology",def:"The study of human movement, integrating anatomy, physiology and biomechanics."},{term:"Lactate threshold",def:"The exercise intensity above which lactate accumulates faster than it is cleared; rises with aerobic training."},{term:"MET-minute",def:"Activity volume expressed as METs × minutes — a common way guidance expresses weekly targets."},{term:"Microcycle",def:"A week of training within a larger programme — the usual planning unit."},{term:"Mitochondria",def:"The cell's aerobic energy factories; their number and efficiency increase with endurance training."},{term:"Motor cortex",def:"The brain region planning and initiating voluntary movement."},{term:"Myosin",def:"The thick contractile protein in sarcomeres; its heads bind actin to generate force."},{term:"Neuromotor exercise",def:"Training of balance, agility and coordination — recommended for all adults and especially older adults."},{term:"Open kinetic chain",def:"An exercise where the limb's end is free to move — e.g. a leg extension; useful for isolating muscles."},{term:"Overtraining",def:"See overtraining syndrome."},{term:"Periodisation",def:"Planned variation of training over weeks and months (cycles) to peak performance and manage fatigue."},{term:"Physical fitness",def:"A set of attributes — endurance, strength, flexibility, balance, power, speed — that allow daily tasks and activity with energy to spare."},{term:"Plyometrics",def:"Jump training using the stretch-shortening cycle to develop power; introduce gradually and only when strength base is solid."},{term:"Prehabilitation",def:"Preventive conditioning of commonly injured areas before demanding training or sport."},{term:"Progressive resistance exercise (PRE)",def:"Systematically increasing resistance over time — the core method of strength training."},{term:"Rating of perceived exertion",def:"See RPE."},{term:"Recovery heart rate",def:"How quickly heart rate falls after exercise — a rough indicator of cardiovascular fitness; individual and context-dependent."},{term:"Repetition (rep)",def:"One complete movement of an exercise."},{term:"Set",def:"A group of consecutive repetitions."},{term:"Sliding filament theory",def:"The mechanism of contraction: myosin heads pull actin filaments within sarcomeres, shortening the muscle."},{term:"Specificity",def:"The principle that adaptations match the specific demands imposed — train the qualities you want."},{term:"Static balance",def:"Holding a stationary position, e.g. standing on one leg."},{term:"Stretch-shortening cycle",def:"A rapid stretch (eccentric) followed immediately by shortening (concentric), storing and releasing elastic energy — the basis of jumping and running efficiency."},{term:"Talk test",def:"See talk test."},{term:"Tendonitis",def:"Older term for acute tendon inflammation; most chronic tendon pain is tendinopathy (degenerative overload)."},{term:"Training frequency",def:"How many training sessions per week."},{term:"Transverse abdominis",def:"The deep, corset-like abdominal muscle that stabilises the trunk and manages intra-abdominal pressure."},{term:"Vestibular",def:"See vestibular system."},{term:"Warm-up (specific)",def:"Light rehearsal of the session's movements and muscles after the general warm-up."},{term:"Weight-bearing exercise",def:"Activity where the body supports its own weight against gravity — important for bone health."},{term:"Work-to-rest ratio",def:"The proportion of work to recovery in interval training — e.g. 1:2 (work 30 s, rest 60 s)."}],Pl=[{id:1,kind:"flow",title:"The human movement system",caption:"Movement is a coordinated chain: the nervous system commands, muscles pull, tendons transmit force, and bones move across joints.",alt:"Flow diagram: nervous system signals muscles, muscles pull tendons, tendons move bones across joints to produce movement.",items:[{label:"Nervous system",sub:"senses, decides, commands"},{label:"Muscles",sub:"contract and produce force"},{label:"Tendons",sub:"transmit the pull"},{label:"Bones & joints",sub:"levers and hinges"},{label:"Movement",sub:"coordinated action"}]},{id:2,kind:"stack",title:"Skeletal muscle structure",caption:"From whole muscle down to the sarcomere, where actin and myosin generate force.",alt:"Stacked layers: whole muscle, fascicle, muscle fibre, myofibril, sarcomere.",items:[{label:"Whole muscle",sub:"wrapped in epimysium"},{label:"Fascicle",sub:"bundle of fibres (perimysium)"},{label:"Muscle fibre",sub:"a single long cell"},{label:"Myofibril",sub:"contractile strands"},{label:"Sarcomere",sub:"actin + myosin units"}]},{id:3,kind:"flow",title:"Muscle contraction, step by step",caption:"A nerve signal triggers calcium release; cross-bridges form and sarcomeres shorten, producing force.",alt:"Sequence: nerve signal, calcium release, cross-bridge cycling, sarcomere shortening, visible force.",items:[{label:"Nerve signal",sub:"at the neuromuscular junction"},{label:"Calcium release",sub:"inside the fibre"},{label:"Cross-bridges",sub:"myosin binds actin"},{label:"Sarcomeres shorten",sub:"sliding filaments"},{label:"Force produced",sub:"movement happens"}]},{id:4,kind:"bars",title:"Energy systems by duration",caption:"All three systems contribute at all times; intensity and duration shift the balance.",alt:"Bar chart: phosphagen system dominates up to about 10 seconds, glycolysis from about 10 seconds to 2 minutes, aerobic metabolism beyond that and for long durations.",segments:[{label:"Phosphagen (ATP-PC)",sub:"maximal, ~0–10 s",w:18},{label:"Anaerobic glycolysis",sub:"hard, ~10 s–2 min",w:38},{label:"Aerobic (oxidative)",sub:"sustainable, minutes–hours",w:100}]},{id:5,kind:"wheel",title:"The fitness components wheel",caption:"Fitness is multidimensional — a balanced life trains several components, not just one.",alt:"Wheel with eight segments: cardiovascular endurance, strength, muscular endurance, flexibility, mobility, balance, coordination and power.",segments:[{label:"Endurance",w:12.5},{label:"Strength",w:12.5},{label:"Muscular endurance",w:12.5},{label:"Flexibility",w:12.5},{label:"Mobility",w:12.5},{label:"Balance",w:12.5},{label:"Coordination",w:12.5},{label:"Power & speed",w:12.5}]},{id:6,kind:"cycle",title:"Blood circulation loop",caption:"Blood travels from the heart to the lungs and body, exchanges gases and nutrients in capillaries, and returns.",alt:"Circular loop: heart, arteries, capillaries in tissues, veins, back to heart, with a branch through the lungs.",stages:[{label:"Heart",sub:"pumps blood out"},{label:"Arteries",sub:"to lungs & body"},{label:"Capillaries",sub:"exchange O2, nutrients, waste"},{label:"Veins",sub:"return blood"}],center:"Circulation"},{id:7,kind:"timeline",title:"Aerobic adaptation over time",caption:"Endurance adaptations accumulate over weeks to months of consistent, recoverable training.",alt:"Timeline: first weeks the same pace feels easier; weeks 4 to 8 lower heart rate at the same workload; months bring more capillaries, mitochondria and blood volume.",stages:[{label:"Weeks 1–2",sub:"same effort feels easier"},{label:"Weeks 4–8",sub:"lower HR at same pace"},{label:"Months",sub:"more capillaries & mitochondria"}]},{id:8,kind:"spectrum",title:"The exercise-intensity spectrum",caption:"Use the talk test and RPE to place yourself: light, moderate, vigorous or maximal.",alt:"Horizontal intensity spectrum from light to maximal, with markers: light can sing, moderate can talk not sing, vigorous short phrases, maximal cannot talk.",markers:[{label:"Light — can sing",x:12,tone:"light"},{label:"Moderate — talk, not sing",x:42,tone:"mod"},{label:"Vigorous — short phrases",x:74,tone:"vig"},{label:"Maximal — cannot talk",x:95,tone:"max"}]},{id:9,kind:"timeline",title:"Progressive endurance development",caption:"Build duration first, then frequency, then modest intensity — always with recovery.",alt:"Four-step progression: establish a walking base, add minutes, add days, then add gentle intervals.",stages:[{label:"Base",sub:"comfortable walks"},{label:"Add duration",sub:"e.g. 20 → 30 min"},{label:"Add frequency",sub:"3 → 4–5 days"},{label:"Add intervals",sub:"optional, gentle first"}]},{id:10,kind:"cycle",title:"The walking gait cycle",caption:"Each step cycles through stance (foot on ground) and swing (foot advancing).",alt:"Cycle of five gait phases: heel strike, foot flat, midstance, heel-off push-off, swing.",stages:[{label:"Heel strike",sub:"foot lands"},{label:"Foot flat",sub:"weight accepted"},{label:"Midstance",sub:"body passes over"},{label:"Push-off",sub:"heel lifts, toe off"},{label:"Swing",sub:"leg advances"}],center:"One step"},{id:11,kind:"cycle",title:"The running gait cycle",caption:"Running adds a flight phase — both feet off the ground between steps.",alt:"Cycle: landing, absorption, push-off, flight, swing.",stages:[{label:"Landing",sub:"foot strikes"},{label:"Absorption",sub:"load accepted"},{label:"Push-off",sub:"drive backward"},{label:"Flight",sub:"both feet off ground"},{label:"Swing",sub:"leg recovers forward"}],center:"One stride"},{id:12,kind:"flow",title:"Cycling pedal cycle",caption:"Power is produced mainly on the downstroke; the upstroke is recovery. A fitted bike keeps this comfortable.",alt:"Pedal cycle: top, downstroke power phase, bottom, upstroke recovery.",items:[{label:"Top",sub:"knee bent"},{label:"Downstroke",sub:"main power"},{label:"Bottom",sub:"ankle flexes"},{label:"Upstroke",sub:"recovery, light pull"}]},{id:13,kind:"flow",title:"Swimming arm cycle (freestyle)",caption:"A rhythmic loop of catch, pull, push and recovery, coordinated with breathing and kick.",alt:"Arm cycle: hand enters and catches water, pulls and pushes back, exits and recovers over the water.",items:[{label:"Entry & catch",sub:"hand grips water"},{label:"Pull",sub:"elbow high"},{label:"Push",sub:"hand exits at hip"},{label:"Recovery",sub:"arm swings forward"}]},{id:14,kind:"intervals",title:"HIIT interval structure",caption:"Example pattern: short hard work blocks (dark) alternating with recovery blocks (light). Optional — not required for health.",alt:"Timeline of alternating work and recovery blocks: four work intervals separated by three recovery intervals.",blocks:[{label:"Work",w:12,tone:"work"},{label:"Rest",w:14,tone:"rest"},{label:"Work",w:12,tone:"work"},{label:"Rest",w:14,tone:"rest"},{label:"Work",w:12,tone:"work"},{label:"Rest",w:14,tone:"rest"},{label:"Work",w:12,tone:"work"},{label:"Cool",w:10,tone:"rest"}]},{id:15,kind:"timeline",title:"How muscle grows over time",caption:"Stimulus → protein synthesis → recovery → gradual fibre growth. Weeks to months, not days.",alt:"Timeline: training stimulus, increased muscle protein synthesis, sleep and nutrition, measurable hypertrophy over weeks to months.",stages:[{label:"Stimulus",sub:"progressive tension"},{label:"MPS rises",sub:"protein synthesis up"},{label:"Recovery",sub:"sleep, food, rest"},{label:"Growth",sub:"fibres enlarge over weeks"}]},{id:16,kind:"compare",title:"Neural vs structural adaptation",caption:"Early weeks are mostly the nervous system learning; months bring structural muscle change.",alt:"Comparison: first weeks neural adaptations (recruitment, coordination); months structural hypertrophy.",left:{title:"First weeks — neural",items:["Better motor-unit recruitment","Higher firing rates","Improved coordination","Tendon stiffness"]},right:{title:"Months — structural",items:["Muscle protein synthesis > breakdown","Fibre cross-section increases","Capillary support grows","Individual variation is large"]}},{id:17,kind:"grid",title:"Bodyweight exercise patterns",caption:"Every pattern can be made easier or harder — choose the version you control well.",alt:"Table of bodyweight patterns with examples and easier regressions: squat, push-up, hinge, lunge, plank, pull.",cols:["Pattern","Example","Easier version"],rows:[["Squat","Sit-to-stand / squat","Chair squat, hold counter"],["Push","Push-up","Wall or incline push-up"],["Hinge","Hip hinge","Hands on hips, light load"],["Lunge","Forward lunge","Supported split squat"],["Core","Forearm plank","Plank from knees"],["Pull","Band or towel row","Lighter band, fewer reps"]]},{id:18,kind:"checklist",title:"Free-weight safety basics",caption:"Simple habits prevent most home and gym lifting problems.",alt:"Checklist: stable stance, braced core, continuous breathing, load close to body, controlled path, learned safe bail, collars on barbells, clear space.",items:[{ es",x:50,y:52},{label:"Hip stabilisers",x:70,y:55},{label:"Calves",x:45,y:86}]},{id:23,kind:"body",title:"Core musculature",caption:"The core is a stabilising cylinder around the spine — not just the six-pack.",alt:"Torso silhouette with labelled core muscles: rectus abdominis, obliques, transverse abdominis, multifidus, diaphragm, pelvic floor.",regions:[{label:"Rectus abdominis",x:50,y:34},{label:"Obliques",x:32,y:40},{label:"Transverse abdominis",x:68,y:40},{label:"Multifidus (deep back)",x:50,y:44},{label:"Diaphragm",x:50,y:24},{label:"Pelvic floor",x:50,y:58}]},{id:24,kind:"grid",title:"Strength programming variables",caption:"Plan these variables; progress them gradually and log your sessions.",alt:"Table of programming variables: frequency, sets, repetitions, load, rest, volume with typical examples.",cols:["Variable","Typical example","Note"],rows:[["Frequency","2–4 sessions/week","rest days included"],["Sets","2–4 per exercise","beginners: 1–2"],["Repetitions","8–12 most adults","lighter loads, higher reps for beginners"],["Load","progressive, controlled","never sacrifice technique"],["Rest","2–3 min heavy; 30–60 s light","match to goal"],["Volume","total hard sets/week","increase gradually"]]},{id:25,kind:"compare",title:"Flexibility versus mobility",caption:"Range is not enough — control through the range is what serves daily life.",alt:"Comparison: flexibility is passive available range; mobility adds strength and neuromuscular control through the range.",left:{title:"Flexibility",items:["Available range at a joint","Passive or active","Increased by stretching","Joint- and direction-specific"]},right:{title:"Mobility",items:["Active, controlled range","Requires strength through range","Built by loaded, controlled movement","More linked to function & resilience"]}},{id:26,kind:"flow",title:"Static stretching protocol",caption:"Best after activity or for relaxation: gentle, held, repeated — never painful.",alt:"Steps: choose target muscle, settle into position, hold 15 to 60 seconds while breathing, repeat 2 to 4 times.",items:[{label:"Choose muscle",sub:"warm, relaxed"},{label:"Settle position",sub:"comfortable end-range"},{label:"Hold 15–60 s",sub:"breathe normally"},{label:"Repeat 2–4×",sub:"no bouncing"}]},{id:27,kind:"flow",title:"Dynamic warm-up sequence",caption:"Controlled movement prepares joints and nervous system before activity.",alt:"Sequence: easy cardio, joint circles, leg swings, walking lunges, arm swings, gradually raise pace.",items:[{label:"Easy cardio",sub:"3–5 min"},{label:"Joint circles",sub:"all major joints"},{label:"Leg swings",sub:"controlled range"},{label:"Walking lunges",sub:"with rotation"},{label:"Raise the pace",sub:"gradually"}]},{id:28,kind:"stack",title:"Joint anatomy",caption:"Cartilage cushions, synovial fluid lubricates, the capsule and ligaments stabilise.",alt:"Layers of a synovial joint: bone ends, articular cartilage, synovial fluid, joint capsule, ligaments.",items:[{label:"Bone ends",sub:"the levers"},{label:"Articular cartilage",sub:"smooth, low-friction"},{label:"Synovial fluid",sub:"lubricates & nourishes"},{label:"Joint capsule",sub:"encloses the joint"},{label:"Ligaments",sub:"stabilise the joint"}]},{id:29,kind:"cycle",title:"The balance loop",caption:"Balance is a continuous sense–decide–act loop that can be trained at any age.",alt:"Cycle: sensory input from vision, inner ear and proprioceptors, integration by the central nervous system, muscle response, then adjustment.",stages:[{label:"Sense",sub:"vision • vestibular • proprioception"},{label:"Integrate",sub:"central nervous system"},{label:"Respond",sub:"muscle corrections"},{label:"Adjust",sub:"learn & improve"}],center:"Balance"},{id:30,kind:"compare",title:"Posture: myth vs reality",caption:"There is no single perfect posture — variety and movement are the real protectors.",alt:"Comparison: myth of one rigid perfect posture versus reality of frequent, comfortable position changes.",left:{title:"Myth",items:["One “perfect” posture","Rigid upright all day","Any slouch is dangerous","Special gear required"]},right:{title:"Reality",items:["Your best posture is your next posture","Change position often","Move through comfortable ranges","Ergonomics support variety"]}},{id:31,kind:"timeline",title:"Beginner progression",caption:"Start with awareness, add small repeatable sessions, then build gradually.",alt:"Timeline: notice your baseline week, take short comfortable walks, build to regular sessions, add optional strength, plan your week.",stages:[{label:"Notice baseline",sub:"log a normal week"},{label:"Short walks",sub:"10–15 min, enjoyable"},{label:"Build routine",sub:"3–4 days/week"},{label:"Add strength",sub:"optional, 2 days"},{label:"Plan ahead",sub:"weekly template"}]},{id:32,kind:"grid",title:"Flexible weekly activity plan",caption:"A sustainable week mixes aerobic, strength, mobility, balance and rest — adapted to your life.",alt:"Sample weekly table: Monday walk plus mobility, Tuesday strength, Wednesday rest, Thursday cycle or swim, Friday strength, Saturday longer enjoyable activity, Sunday rest.",cols:["Day","Activity","Minutes"],rows:[["Mon","Brisk walk + mobility","30 + 10"],["Tue","Bodyweight strength","20"],["Wed","Rest or gentle walk","10"],["Thu","Cycle / swim / dance","30"],["Fri","Strength","20"],["Sat","Enjoyable longer activity","45–60"],["Sun","Rest or gentle stretch","15"]]},{id:33,kind:"grid",title:"Home workout arrangement",caption:"A small, safe space is enough: clear it, ventilate it, keep water nearby.",alt:"Table of home zones: warm-up space, strength area, mobility corner, equipment storage, each with a safety note.",cols:["Zone","Use","Safety"],rows:[["Warm-up space","marching, joint circles","non-slip floor"],["Strength area","squats, push-ups, hinges","clear trip hazards"],["Mobility corner","stretching, balance near wall","sturdy support"],["Equipment","bands, dumbbells, mat","inspect before use"]]},{id:34,kind:"checklist",title:"Gym safety checklist",caption:"Most gym incidents are preventable with a few consistent habits.",alt:"Checklist: take the induction, adjust machines, warm up, use collars, re-rack weights, wipe equipment, wear shoes, stay hydrated, report damage.",items:[{label:"Take the gym induction"},{label:"Adjust seat, pads, range"},{label:"Warm up before lifting"},{label:"Collars on barbells"},{label:"Re-rack weights & dumbbells"},{label:"Wipe equipment before/after"},{label:"Wear closed shoes & suitable clothes"},{label:"Report broken equipment"}]},{id:35,kind:"wheel",title:"Different fitness goals",caption:"Any goal is valid when it serves function, health, skill or joy — never appearance pressure.",alt:"Wheel of goals: general health, strength, endurance, mobility, sport, independence, skill, enjoyment.",segments:[{label:"Health",w:12.5},{label:"Strength",w:12.5},{label:"Endurance",w:12.5},{label:"Mobility",w:12.5},{label:"Sport",w:12.5},{label:"Independence",w:12.5},{label:"Skill",w:12.5},{label:"Enjoyment",w:12.5}]},{id:36,kind:"timeline",title:"Activity across life stages",caption:"Guidance shifts with age — always individualised, always safe.",alt:"Timeline: under 5 active play, ages 5 to 17 at least 60 minutes daily, adults 150 to 300 minutes weekly plus strength, older adults add balance training.",stages:[{label:"Under 5",sub:"active play, limited restraint"},{label:"5–17 years",sub:"≥60 min/day, varied & fun"},{label:"Adults",sub:"150–300 min + strength ≥2 d"},{label:"65+",sub:"same + balance 3+ d/week"}]},{id:37,kind:"grid",title:"Adaptive movement options",caption:"Adapt the movement, position, load and environment — ask the person, never assume.",alt:"Table of adaptations: seated exercise, wheelchair propulsion and sport, tactile guidance for low vision, visual signals for deaf participants, small-space and hot-climate options.",cols:["Situation","Adaptation","Example"],rows:[["Cannot stand","Seated circuits","chair marching, seated rows"],["Wheelchair user","Propulsion & arm ergometry","wheelchair sport, hand-cycling"],["Low vision","Verbal & tactile cues","consistent layout, described moves"],["Deaf / HoH","Visual signals","facing instructor, light signals"],["Small space","Compact routines","10-min circuits, stairs"],["Hot climate","Indoor / cooler hours","early walks, pool exercise"]]},{id:38,kind:"cycle",title:"The recovery cycle",caption:"Training is the stimulus; recovery is when the body adapts and comes back stronger.",alt:"Cycle: training load, fatigue, rest with sleep and food, adaptation, repeat.",stages:[{label:"Training load",sub:"the stimulus"},{label:"Fatigue",sub:"temporary dip"},{label:"Rest & fuel",sub:"sleep, food, fluids"},{label:"Adaptation",sub:"come back stronger"}],center:"Recovery"},{id:39,kind:"flow",title:"Warm-up sequence",caption:"5–15 minutes scaled to the session: raise temperature, mobilise, rehearse.",alt:"Sequence: 3 to 5 minutes easy cardio, joint circles, dynamic mobility, light sets of the first exercise, ready to train.",items:[{label:"Easy cardio",sub:"3–5 min"},{label:"Joint circles",sub:"all major joints"},{label:"Dynamic mobility",sub:"leg swings, lunges"},{label:"Light rehearsal sets",sub:"first exercise, easy"},{label:"Ready",sub:"begin the session"}]},{id:40,kind:"timeline",title:"DOMS: the normal course",caption:"Soreness after new exercise is normal, peaks at 1–3 days and fades — pain with warning features is different.",alt:"Timeline: exercise, onset at 12 to 24 hours, peak at 24 to 72 hours, fades by about a week; warning signs listed separately.",stages:[{label:"Exercise",sub:"new or hard load"},{label:"12–24 h",sub:"stiffness begins"},{label:"24–72 h",sub:"peak soreness"},{label:"3–7 days",sub:"fades, adaptation"}]},{id:41,kind:"wheel",title:"Exercise nutrition overview",caption:"Food fuels and repairs: mostly varied ordinary food; timing is secondary to totals.",alt:"Wheel with six segments: carbohydrates, protein, fats, micronutrients, fluids, meal timing.",segments:[{label:"Carbohydrates",w:17},{label:"Protein",w:17},{label:"Fats",w:17},{label:"Micronutrients",w:17},{label:"Fluids",w:16},{label:"Timing",w:16}]},{id:42,kind:"spectrum",title:"Hydration guidance",caption:"Drink to thirst, plan ahead in heat, replace afterwards — and never force excessive plain-water intake.",alt:"Spectrum from drink to thirst, planned sips in heat, to rehydrate after, with a warning against over-drinking.",markers:[{label:"Drink to thirst",x:18,tone:"light"},{label:"Planned sips in heat / long sessions",x:48,tone:"mod"},{label:"Rehydrate after",x:74,tone:"vig"},{label:"Avoid over-drinking (hyponatremia risk)",x:95,tone:"max"}]},{id:43,kind:"bars",title:"Supplement evidence comparison",caption:"A few supplements have decent evidence in specific contexts; most marketing outruns the science. None are compulsory.",alt:"Bars comparing evidence strength: creatine and protein strong, caffeine moderate, electrolytes context-dependent, most fat burners weak.",segments:[{label:"Creatine (healthy adults)",sub:"strong evidence",w:92},{label:"Protein (as food)",sub:"strong — but optional",w:85},{label:"Caffeine (specific doses)",sub:"moderate-strong",w:62},{label:"Electrolytes (long/heat)",sub:"context-dependent",w:48},{label:"Most fat burners / blends",sub:"weak evidence",w:15}]},{id:44,kind:"cycle",title:"Sleep and training recovery",caption:"Sleep is when repair, hormone release and memory consolidation peak — protect it.",alt:"Cycle: evening wind-down, 7 to 9 hours of sleep, tissue repair and hormones, better next-day performance.",stages:[{label:"Wind-down",sub:"consistent bedtime"},{label:"7–9 h sleep",sub:"deep & REM stages"},{label:"Repair",sub:"growth hormone, tissue repair"},{label:"Perform",sub:"better next session"}],center:"Sleep"},{id:45,kind:"checklist",title:"Exercise safety checklist",caption:"Run through this before most sessions — it prevents the majority of problems.",alt:"Checklist: screening if needed, safe environment, inspected equipment, good footwear, warm-up, gradual progression, hydration, known warning signs, phone and ID.",items:[{label:"Screen first if risk factors (PAR-Q+)"},{label:"Safe, well-lit, clear environment"},{label:"Equipment inspected"},{label:"Appropriate footwear & clothing"},{label:"Warm-up done"},{label:"Progression gradual"},{label:"Hydration planned (heat especially)"},{label:"Warning signs known — phone & ID carried"}]},{id:46,kind:"compare",title:"Acute vs overuse injuries",caption:"Sudden injuries differ from gradual overload problems — both deserve the right response.",alt:"Comparison: acute strain or sprain from a sudden event versus overuse tendinopathy or stress injury from repeated load without recovery.",left:{title:"Acute (sudden)",items:["Muscle strain","Ligament sprain","Often a “pop” or sudden pain","First aid + assessment if severe"]},right:{title:"Overuse (gradual)",items:["Tendinopathy","Shin splints / stress reaction","From too much too soon","Reduce load + rehab guidance"]}},{id:47,kind:"checklist",title:"STOP and seek urgent help for",caption:"Memorise these warning signs. When they occur: stop activity and call emergency services.",alt:"Red-flag checklist: chest pain or pressure, fainting, severe breathlessness, one-sided weakness or numbness, severe sudden headache, heat stroke confusion — stop and call emergency services.",items:[{label:"Chest pain / pressure"},{label:"Fainting or near-fainting"},{label:"Severe or unusual breathlessness"},{label:"Sudden one-sided weakness/numbness"},{label:"Severe sudden headache"},{label:"Heat stroke: confusion / collapse"}]},{id:48,kind:"spectrum",title:"Training load: from under to over",caption:"The goal is the optimal zone — enough load to adapt, enough recovery to absorb it.",alt:"Spectrum from under-training through optimal load, overreaching, to overtraining syndrome.",markers:[{label:"Under-training",x:12,tone:"light"},{label:"Optimal load + recovery",x:45,tone:"mod"},{label:"Overreaching (temporary)",x:75,tone:"vig"},{label:"Overtraining syndrome",x:95,tone:"max"}]},{id:49,kind:"compare",title:"Motivation: appearance vs function",caption:"Durable motivation is anchored in what movement lets you do, feel and live — not in appearance.",alt:"Comparison: fragile appearance-focused motivation versus durable function, health and enjoyment motivation.",left:{title:"Appearance-focused",items:["Fragile to genetics & comparison","Can drive restriction/compulsion","Worth tied to body","Often unsustainable"]},right:{title:"Function & enjoyment",items:["Better sleep, mood, energy","Strength, skills, independence","Social connection","Lasts a lifetime"]}},{id:50,kind:"cycle",title:"The habit loop",caption:"Cue → routine → reward builds automatic habits. Design your environment to support them.",alt:"Cycle: cue such as a scheduled time, the routine of movement, the reward of feeling better, repeated until habitual.",stages:[{label:"Cue",sub:"time, place, reminder"},{label:"Routine",sub:"small, enjoyable movement"},{label:"Reward",sub:"energy, mood, pride"},{label:"Repeat",sub:"habit forms over weeks"}],center:"Habit"},{id:51,kind:"compare",title:"Fitness myth vs evidence",caption:"Common claims checked against the evidence — the pattern: simple promises rarely match biology.",alt:"Comparison of myths such as spot reduction, sweat equals fat loss, and no pain no gain, against evidence-based statements.",left:{title:"Common myths",items:["Spot reduction works","Sweat = fat loss","No pain, no gain","One best exercise for all","Supplements are essential"]},right:{title:"What evidence supports",items:["Fat loss is systemic","Sweat is cooling fluid","Progressive + recoverable load","Individual, safe, enjoyable choices","Food, training, sleep first"]}},{id:52,kind:"flow",title:"Case-study planning structure",caption:"A repeatable way to think through any movement situation — used in Chapter 52.",alt:"Flow: background, educational challenge, relevant science, realistic options, safety, limits of conclusions, professional input, learning points.",items:[{label:"Background"},{label:"Challenge"},{label:"Science"},{label:"Options"},{label:"Safety & limits"},{label:"Learning points"}]},{id:53,kind:"timeline",title:"The 30-day movement challenge",caption:"Four flexible weeks: awareness, foundations, variety, and your own plan. Rest is built in.",alt:"Timeline of four weeks: week 1 movement awareness, week 2 foundations, week 3 variety and balance, week 4 sustainable planning.",stages:[{label:"Week 1",sub:"awareness & enjoyment"},{label:"Week 2",sub:"foundations: walk + strength"},{label:"Week 3",sub:"variety + balance + recovery"},{label:"Week 4",sub:"your own weekly plan"}]},{id:54,kind:"grid",title:"Daily movement examples by domain",caption:"All domains count toward your active life — not just sport.",alt:"Table of daily movement by domain: transport, work, home, leisure with examples.",cols:["Domain","Examples"],rows:[["Transport","walking, cycling or wheeling to school/work/market"],["Work","standing tasks, lifting, walking between meetings"],["Home & chores","cooking, cleaning, gardening, childcare"],["Leisure","walks, dancing, games, sport, swimming"]]},{id:55,kind:"grid",title:"Muscle action comparison",caption:"Daily life uses all three muscle actions — train them all for resilient movement.",alt:"Table comparing concentric, eccentric and isometric actions with muscle length change and examples.",cols:["Action","Muscle length","Example"],rows:[["Concentric","Shortens","lifting a weight up, standing up"],["Eccentric","Lengthens under load","lowering a weight, sitting down"],["Isometric","No change","holding a plank, carrying a bag"]]},{id:56,kind:"compare",title:"Aerobic vs resistance training",caption:"They complement each other — most healthy weeks include both.",alt:"Comparison: aerobic training stresses the heart, lungs and oxygen delivery; resistance training stresses muscles, tendons and bones with load.",left:{title:"Aerobic",items:["Sustained, rhythmic activity","Builds heart & lung capacity","Improves endurance & metabolism","e.g. walk, cycle, swim"]},right:{title:"Resistance",items:["Muscles work against load","Builds strength & muscle","Protects bones & joints","e.g. bodyweight, bands, weights"]}},{id:57,kind:"spectrum",title:"Progression and recovery balance",caption:"Progress the load, then recover — adaptation sits in the recovery phase.",alt:"Spectrum showing plan, load, recover, adapt in sequence, with adaptation emphasized after recovery.",markers:[{label:"Plan",x:15,tone:"light"},{label:"Load (progressive)",x:40,tone:"mod"},{label:"Recover",x:65,tone:"vig"},{label:"Adapt (stronger)",x:90,tone:"max"}]},{id:58,kind:"flow",title:"A 5–10 minute mobility routine",caption:"Short, frequent, controlled — target the joints your life demands.",alt:"Sequence: ankle rocks, hip openers, thoracic rotations, shoulder circles, held comfortable positions.",items:[{label:"Ankles",sub:"rock & circle"},{label:"Hips",sub:"openers & circles"},{label:"Thoracic spine",sub:"rotations"},{label:"Shoulders",sub:"circles & reaches"},{label:"Hold & breathe",sub:"30–60 s each"}]},{id:59,kind:"grid",title:"Glossary map",caption:"The full searchable glossary (120+ terms) lives in the Glossary tool — here is the map.",alt:"Table grouping glossary terms by area: energy, muscle, cardiovascular, programming, mobility and safety.",cols:["Area","Example terms"],rows:[["Energy","ATP, energy systems, lactate, VO2max"],["Muscle","sarcomere, motor unit, hypertrophy, DOMS"],["Cardiovascular","cardiac output, stroke volume, heart rate"],["Programming","progressive overload, volume, deload, FITT"],["Mobility & balance","flexibility, mobility, proprioception, ROM"],["Safety","PAR-Q+, overtraining, hyponatremia, sprain/strain"]]},{id:60,kind:"timeline",title:"The lifelong activity roadmap",caption:"Start, build, vary, recover, adapt to life's changes — movement for the whole of life.",alt:"Roadmap: start where you are, build a base, vary activities, re :[{id:"date",label:"Date",type:"date"},{id:"activity",label:"Activity & duration",type:"text"},{id:"conditions",label:"Conditions",type:"select",options:["Cool","Warm","Hot/humid","Cold","Indoor","High altitude"]},{id:"fluids",label:"Fluids drunk (glasses/ml)",type:"text"},{id:"electrolytes",label:"Electrolytes/salty food (long or hot session?)",type:"select",options:["Not needed","Yes — sports drink","Yes — salty snack/meal"]},{id:"urine",label:"Urine colour",type:"select",options:["Very pale (maybe over-drinking)","Pale straw (good)","Dark (drink more)"]},{id:"thirst",label:"Thirst level during (0–10)",type:"scale",scaleMax:10},{id:"symptoms",label:"Any headache, dizziness, cramps? (stop & seek help if severe)",type:"textarea"}]},{id:"equipment-safety",title:"Equipment Safety Checklist",description:"Run this before using any equipment at home or in a gym.",fields:[{id:"item",label:"Equipment item",type:"text"},{id:"visual",label:"Visual check: no cracks, frays, loose parts, leaks",type:"checkbox"},{id:"function",label:"Function check: moves/pins/locks work smoothly",type:"checkbox"},{id:"floor",label:"Floor dry, non-slip, space clear of trip hazards",type:"checkbox"},{id:"footwear",label:"Suitable footwear worn",type:"checkbox"},{id:"anchors",label:"Anchors/racks secure (bands, bars, machines)",type:"checkbox"},{id:"collars",label:"Collars used on barbells",type:"checkbox"},{id:"issue",label:"Any problem found? (describe — do not use if unsafe)",type:"textarea"}]},{id:"goal-planner",title:"Exercise Goal Planner",description:"Set process goals (what you will do) — not just outcome goals. Function, health and enjoyment are valid reasons.",fields:[{id:"why",label:"Why does movement matter to me?",type:"textarea"},{id:"goal1",label:"Process goal 1 (e.g. walk 20 min, 3×/week)",type:"text"},{id:"goal2",label:"Process goal 2",type:"text"},{id:"goal3",label:"Process goal 3",type:"text"},{id:"cue",label:"My cue / anchor (when & where)",type:"text"},{id:"support",label:"People / resources that will support me",type:"textarea"},{id:"obstacles",label:"Likely obstacles",type:"textarea"},{id:"plan_b",label:"Plan B for hard weeks (shorter, seated, indoor…)",type:"textarea"},{id:"review",label:"Review date",type:"date"}]},{id:"challenge-30",title:"30-Day Challenge Tracker",description:"Flexible tracker for the 30-day programme in Chapter 53. Rest days count as completed. No pain, no competition.",fields:[{id:"week1",label:"Week 1 (Awareness) — days completed & notes",type:"textarea"},{id:"week2",label:"Week 2 (Foundations) — sessions & notes",type:"textarea"},{id:"week3",label:"Week 3 (Variety) — activities tried & notes",type:"textarea"},{id:"week4",label:"Week 4 (Your plan) — weekly plan summary",type:"textarea"},{id:"enjoyed",label:"Most enjoyable movement this month",type:"text"},{id:"learned",label:"What I learned about my body",type:"textarea"},{id:"next",label:"My next-month movement intention",type:"textarea"}]},{id:"appointment-prep",title:"Appointment Preparation Worksheet",description:"Use before seeing a doctor, physiotherapist, dietitian or trainer — bring clear information.",fields:[{id:"appt",label:"Appointment with / date",type:"text"},{id:"goals",label:"What I want from this appointment",type:"textarea"},{id:"history",label:"Relevant history (conditions, injuries, surgeries, medications)",type:"textarea"},{id:"activity",label:"My current activity (from logs)",type:"textarea"},{id:"symptoms",label:"Symptoms: what, when, how long, what eases/worsens",type:"textarea"},{id:"questions",label:"My questions",type:"textarea"},{id:"redflags",label:"Any warning signs? (chest pain, fainting, severe breathlessness — seek urgent care, not a routine appointment)",type:"textarea"}]}],vo=[{id:"squat",name:"Squat / Sit-to-Stand",category:"Lower body — squat pattern",level:"Beginner-friendly",diagram:17,equipment:"None (chair optional for support)",steps:["Stand with feet about shoulder-width, toes slightly turned out.","Breathe in, gently brace your core, and push your hips back as if sitting toward a chair.","Lower until your thighs are about parallel to the floor — or as far as is comfortable and pain-free (a chair is a great depth guide).","Keep your chest up and knees tracking over your toes; do not let knees cave inward.","Press through your whole foot and stand tall, exhaling as you rise.","Repeat 8–15 controlled times."],cues:["Chest up, eyes ahead","Knees follow the toes","Weight through the whole foot","Smooth, controlled tempo"],cautions:["Stop for knee pain, sharp hip pain or dizziness.","Reduce depth or use a higher chair if needed.","People with knee replacements, severe arthritis or recent surgery should follow their clinician/physiotherapist's guidance.","These diagrams are general education — they do not replace individual coaching or physiotherapy."]},{id:"hinge",name:"Hip Hinge",category:"Posterior chain — hinge pattern",level:"Beginner-friendly",diagram:17,equipment:"None (a broomstick or light dumbbell optional)",steps:["Stand tall with feet hip-width, holding a light object close to your body if used.","Keeping a flat back and soft knees, push your hips backward.","Lower your torso until you feel your hamstrings and glutes working — the load stays over your mid-foot.","Pause briefly, then squeeze your glutes and drive your hips forward to stand.","Repeat 8–12 times with control."],cues:["Hips back, not down","Back flat like a table","Load close to the shins","Glutes finish the movement"],cautions:["Never round the lower back under load.","Stop for back pain, leg numbness or tingling — seek assessment.","Start with bodyweight only; add load gradually with guidance."]},{id:"lunge",name:"Forward Lunge (supported)",category:"Lower body — single-leg pattern",level:"Beginner-friendly with support",diagram:17,equipment:"A sturdy chair or counter for balance",steps:["Stand tall, holding a support if needed.","Step one foot forward into a comfortable stride.","Lower until both knees are bent roughly 90 degrees — front knee over the ankle.","Push through the front foot to return to standing.","Repeat 6–10 per side, or alternate sides."],cues:["Upright torso","Front knee tracks over toes","Control the descent","Breathe continuously"],cautions:["Use a shorter stride or shallower depth if knees or hips complain.","Stop for sharp knee pain or loss of balance.","Balance support is a smart progression, not a failure."]},{id:"push",name:"Incline Push-Up",category:"Upper body — push pattern",level:"Beginner-friendly",diagram:17,equipment:"A sturdy wall, counter or table",steps:["Place hands on the surface slightly wider than shoulders, body in a straight line from head to heels (or knees).","Brace your core and lower your chest toward the surface, elbows at a comfortable angle (about 45°).","Pause, then press back up until arms are straight — without locking the elbows hard.","Repeat 8–15 times."],cues:["Straight line head-to-heel/knees","Ribs down, core on","Full controlled range","Exhale on the push"],cautions:["Stop for shoulder pain — try a higher surface or wall version.","Wrist discomfort: use fists, parallettes or push-up handles if available.","Progress to floor push-ups only when incline reps feel easy and controlled."]},{id:"pull",name:"Band / Towel Row",category:"Upper body — pull pattern",level:"Beginner-friendly",diagram:17,equipment:"Resistance band anchored to a sturdy door, or a towel around a post",steps:["Sit or stand facing the anchor, band/towel taut, arms extended.","Pull the band toward your torso, driving elbows back and squeezing your shoulder blades together.","Control the return to the start without letting the shoulders roll forward.","Repeat 10–15 times."],cues:["Shoulder blades squeeze","Elbows close to the body","Upright chest","Slow return"],cautions:["Inspect bands for tears; anchor must be secure — test it before pulling hard.","Stop for shoulder pain or tingling.","Match push volume with pull volume for shoulder health."]},{id:"carry",name:"Farmer's Carry",category:"Full body — carry pattern",level:"All levels",diagram:20,equipment:"Two similar weights (dumbbells, kettlebells, water bottles, bags) or one held at the side",steps:["Stand tall holding the weights at your sides, shoulders down and back, core gently braced.","Walk slowly and upright for 20–40 metres (or 30–60 seconds), keeping a steady breathing rhythm.","Turn around carefully and walk back.","Repeat 2–3 rounds."],cues:["Tall posture, no shrugging","Even, controlled steps","Breathe normally","Start light"],cautions:["Choose a clear, non-slip route; wear grippy shoes.","Stop if you feel unsteady or the grip fails — set the weights down safely.","People with shoulder, wrist or back issues should get individual guidance on load and grip."]},{id:"plank",name:"Forearm Plank (trunk stability)",category:"Core — anti-extension",level:"Beginner-friendly (from knees)",diagram:23,equipment:"A mat or firm surface",steps:["Rest on forearms with elbows under shoulders, body in a straight line from head to knees (or toes).","Gently brace your core — as if preparing for a light push to the stomach — and breathe normally.","Hold 10–30 seconds, keeping hips level (not sagging or piked).","Rest and repeat 2–3 times."],cues:["Straight line","Breathe — never hold breath","Glutes lightly on","Neck neutral"],cautions:["Stop for lower-back pain, shoulder pain or numbness in the arms.","Knees-down is a full-credit version — use it freely.","People with back pain, hernia or postpartum changes should follow individual guidance."]},{id:"walking",name:"Brisk Walking",category:"Aerobic — locomotion",level:"All levels",diagram:10,equipment:"Comfortable supportive shoes; water in heat",steps:["Stand tall with eyes ahead, shoulders relaxed; arms swing naturally at your sides.","Roll each foot from heel to toe; keep a comfortable stride — not overstriding.","Walk at a brisk pace where you can talk but not sing (moderate intensity).","Start with 10–15 minutes and build toward 30; break up sitting with short walks too."],cues:["Heel-to-toe roll","Upright, relaxed posture","Talk-test pace","Steady breathing"],cautions:["Choose safe, well-lit, even routes; check weather and air quality.","In heat, go earlier/later, carry water and slow down.","Use aids or a companion if balance is a concern; stop for any Chapter 47 warning sign."]},{id:"mobility",name:"Basic Mobility Flow",category:"Mobility — daily routine",level:"All levels",diagram:58,equipment:"A wall or chair for balance; 5–10 minutes",steps:["Ankle rocks: 10 per side, holding a support.","Hip circles: 10 each direction per side, hands on hips.","Thoracic rotation: 8 per side, seated or standing, breathing out as you rotate.","Walking lunge with reach: 6 per side, slow and controlled.","Calf and chest doorway stretch: 30–45 seconds each."],cues:["Move within comfortable range","Never force or bounce","Breathe steadily","Short and frequent beats long and painful"],cautions:["Warm up first; avoid end-range forcing on cold joints.","Stop for sharp joint pain, clicking with pain, or swelling — seek assessment if it persists.","These are general mobility suggestions, not a rehabilitation programme."]}],un=[{id:"R01",org:"World Health Organization (WHO)",title:"Physical activity — fact sheet",year:"Updated 2022",venue:"WHO News Room",url:"https://www.who.int/news-room/fact-sheets/detail/physical-activity",accessed:"Accessed 2026",chapters:[1,6,32,36,50],jurisdiction:"Global"},{id:"R02",org:"World Health Organization (WHO)",title:"Guidelines on physical activity and sedentary behaviour",year:"2020",venue:"WHO, Geneva",url:"https://www.who.int/publications/i/item/9789240015128",accessed:"Accessed 2026",chapters:[1,6,10,32,36,45],jurisdiction:"Global"},{id:"R03",org:"World Health Organization (WHO)",title:"Global recommendations on physical activity for health",year:"2010",venue:"WHO, Geneva",url:"https://www.who.int/publications/i/item/9789241599979",accessed:"Accessed 2026",
