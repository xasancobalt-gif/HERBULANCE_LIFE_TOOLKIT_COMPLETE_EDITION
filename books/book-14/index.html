me, nutrient transport and joint lubrication. During exercise, sweat cools the body but loses water and electrolytes — mainly sodium, plus smaller amounts of potassium, magnesium and chloride. Sweat rates vary hugely between people (roughly 0.5–3+ litres per hour depending on intensity, heat, humidity, acclimatisation and body size), which is why no single fluid prescription fits everyone."]},{h:"Practical hydration approach",p:["ACSM guidance (Sawka et al., 2007) supports a simple pattern: start activity well hydrated (pale urine is a rough guide), drink to thirst during activity, and replace fluids after — roughly 1.25–1.5 litres per litre of sweat lost for full rehydration, though weighing yourself before/after can estimate sweat losses if you wish. In heat, drink regularly before thirst strikes; carry water on longer sessions."]},{h:"Electrolytes",p:["Sodium is the main electrolyte lost in sweat and the most important to replace during prolonged exercise (beyond roughly 1–2 hours, especially in heat or if you are a “salty sweater” — visible salt crust on skin/clothes). Most everyday meals provide enough sodium for shorter sessions; for longer or very hot sessions, electrolyte drinks or salty foods help. Plain water is fine for most sessions under an hour."]},{h:"Exercise in heat — and cold",p:["Heat and humidity sharply raise sweat losses and heat-illness risk: plan cooler times, lighter clothing, lower intensity, more breaks and shade; watch for heat illness signs (Chapter 47). In cold weather, thirst is blunted but fluid needs remain — drink regularly; very cold air can also irritate airways in some people."]},{h:"Dehydration and overhydration risks",p:["Mild dehydration (around 2% body-mass loss) can impair performance, mood and cognition; severe dehydration and heat stroke are emergencies. At the other extreme, drinking far more than you sweat — especially plain water over hours — can dilute blood sodium (exercise-associated hyponatremia), causing headache, nausea, confusion and in severe cases seizures; it has occurred in endurance events. The safe pattern is drink to thirst plus modest planned intake, not forced mega-intake."]}],myths:[{claim:"Everyone must drink 3 litres of water a day.",reality:"Needs vary with body size, climate, diet and activity; thirst and urine colour are reasonable guides for most healthy people."},{claim:"Sports drinks are required for every workout.",reality:"For sessions under ~1 hour in moderate conditions, water is enough; electrolytes matter mainly in prolonged or hot-sweaty exercise."},{claim:"Clear urine always means perfect hydration.",reality:"Very pale urine can also mean over-drinking; moderately pale is the practical guide. Trends and how you feel matter more than one colour check."}],safety:["Heat illness signs — confusion, collapse, hot dry skin or profuse sweating with cramps — are emergencies: stop, cool immediately, call emergency services (Chapter 47).","Never exercise if drowsy or impaired; alcohol and some medications worsen dehydration and heat risk.","People with heart, kidney or fluid-restriction conditions need individual fluid advice from their clinician."],takeaways:["Sweat losses vary hugely — drink to thirst, plan a bit ahead in heat, rehydrate after.","Sodium matters in prolonged/heat exercise; plain water suits most shorter sessions.","Both dehydration and overhydration (hyponatremia) are real risks — avoid both extremes."],diagrams:[42],refs:["R24","R15"]},{id:43,part:6,title:"Sports Supplements and Fitness Marketing",standfirst:"Supplements are optional, regulated unevenly, and often overhyped. A small number have decent evidence for specific uses; most marketing outruns the science.",objectives:["Review evidence for protein, creatine, caffeine, electrolytes, pre-workouts and recovery products","Explain contamination/quality concerns, age restrictions and medication interactions","Explain why supplements are not compulsory"],sections:[{h:"The evidence hierarchy",p:["Supplements range from well-studied to poorly studied. Strong evidence exists for a few: creatine monohydrate improves strength/power performance in many (not all) users and is one of the most researched sports supplements, with a strong safety record in healthy adults per the ISSN position stand; caffeine improves endurance and performance at moderate doses in many people; protein powder is simply convenient food. Electrolyte products help in prolonged heat exercise. Most other products (fat burners, testosterone boosters, “recovery” blends) have weak, mixed or no evidence."]},{h:"Quality and contamination concerns",p:["Supplements are regulated less strictly than medicines in many countries. Studies have found undeclared ingredients (including pharmaceuticals and stimulants) in some products, and contamination with banned substances is a real risk for competitive athletes. Choose products tested by independent programmes (e.g. NSF Certified for Sport, Informed Sport, HASTA in some countries) where possible, buy from reputable sources, and never use products from unknown brands."]},{h:"Age, health and medication considerations",p:["Adolescents should generally avoid performance supplements — many are not studied in young people, and some (stimulant-heavy pre-workouts) carry real risks. People with kidney, liver, heart or psychiatric conditions, those on medications (e.g. blood thinners, antidepressants, stimulants), and pregnant or breastfeeding women should only use supplements on specialist advice."]},{h:"Why supplements are not compulsory",p:["No supplement is required for health, strength or fitness. A varied diet, training, sleep and hydration cover the fundamentals. Protein needs can be met with ordinary food. If you consider any supplement, especially with a medical condition or medication, discuss it with a doctor, pharmacist or accredited sports dietitian first. Never use anabolic steroids or unregulated performance-enhancing drugs — they are unsafe, often illegal, and banned in sport."]}],myths:[{claim:"You need supplements to build muscle.",reality:"Muscle growth is driven by training, protein and energy from food, and recovery. Protein powder is optional convenience, not a requirement."},{claim:"Natural supplements are always safe.",reality:"“Natural” does not mean safe — many plants and compounds interact with medications or harm organs. Regulation and evidence vary widely."},{claim:"Pre-workout is needed to have a good session.",reality:"Sleep, food, hydration and a proper warm-up matter far more; many pre-workouts are mostly caffeine plus marketing."}],safety:["Report suspected adverse effects to your clinician; in some countries adverse-event reporting systems exist (e.g. FDA MedWatch in the US).","Competitive athletes: check every product against anti-doping rules (WADA code) via official databases before use.","Stop any supplement causing palpitations, anxiety, insomnia, gastrointestinal or mood changes."],takeaways:["Evidence is strong for only a few supplements (creatine, caffeine in specific doses, protein as food, electrolytes in heat/prolonged exercise).","Contamination and undeclared drugs are real risks — use third-party tested products only if you choose to use any.","Supplements are optional; never compulsory. Avoid steroids and unregulated PEDs entirely."],diagrams:[43],refs:["R39"]},{id:44,part:6,title:"Sleep, Stress and Training Adaptation",standfirst:"Sleep is the foundation of recovery, and stress shapes how much training your body can absorb. Managing both is a core training skill.",objectives:["Explain sleep's role in recovery and circadian rhythms","Describe how stress interacts with training load","Introduce overreaching concepts","Link to HERBULANCE sleep and stress books"],sections:[{h:"Sleep and recovery",p:["During sleep, growth hormone release, tissue repair, immune function and memory consolidation peak. Meta-analytic evidence (Kredlow et al., 2015) shows regular physical activity modestly improves sleep quality and duration, and poor sleep impairs next-day performance, increases injury risk and slows adaptation. Adults generally need around 7–9 hours; athletes often need more. Good sleep hygiene — consistent times, cool dark room, limited evening screens and caffeine — supports both sleep and training."]},{h:"Circadian rhythms and timing",p:["The body's internal clock influences performance, temperature and hormone rhythms; many people perform best in the late afternoon, but individual chronotypes vary, and shift workers must adapt. Late-evening vigorous exercise may delay sleep onset in some people — if it does, move it earlier. Morning light exposure helps anchor the clock."]},{h:"Stress and training load",p:["Psychological stress (work, study, family, finances) consumes the same recovery resources as physical training. High life stress plus high training load raises illness and injury risk and can blunt adaptation. On stressful weeks, reduce training volume or intensity rather than pushing through — this is load management, not weakness."]},{h:"Overreaching in brief",p:["Functional overreaching (short-term performance dip followed by supercompensation after rest) is a normal, planned part of some training. Non-functional overreaching and overtraining syndrome (Chapter 48) occur when load exceeds recovery for weeks — with persistent fatigue, performance decline, mood and sleep disturbance."]},{h:"Whole-person view",p:["Training does not happen in a vacuum: sleep, stress, nutrition, relationships, work and mental health all shape it. For deeper reading on rest and stress, see HERBULANCE Book 12 (Sleep, Circadian Rhythm & Natural Restorative Living) and Book 13 (Stress Management, Emotional Wellbeing & Mind-Body Balance)."]}],myths:[{claim:"I can sleep less if I train harder.",reality:"Sleep debt impairs performance, recovery, immunity and mood; it does not build resilience."},{claim:"Late-night workouts ruin sleep for everyone.",reality:"Effects vary by person; some sleep fine after evening exercise, others do not. Experiment and keep what works."},{claim:"Stress means I should train more to cope.",reality:"Sometimes gentle movement helps mood — but high stress plus high load often backfires. Match intensity to recovery."}],safety:["Never train when severely sleep-deprived before demanding or technical sessions — injury risk rises.","Drowsy driving or operating machinery after poor sleep is dangerous (CDC); do not exercise or drive impaired (Chapter 45).","Persistent sleep problems or stress affecting daily life deserve professional support."],takeaways:["Sleep 7–9+ hours supports recovery, performance and health; exercise itself modestly improves sleep.","Stress and training share recovery resources — adjust training to life load.","Overreaching is normal briefly; persistent imbalance becomes overtraining (Chapter 48)."],diagrams:[44],refs:["R28","R27","R16"]}],dy=[{id:45,part:7,title:"Exercise Safety Fundamentals",standfirst:"Most exercise is safe when done sensibly. Environment, equipment, progression, clothing and knowing your limits prevent the majority of problems.",objectives:["Choose safe exercise environments and inspect equipment","Apply progression, footwear and environmental safety","Recognise personal limits, supervision and screening"],sections:[{h:"Safe environments",p:["Choose well-lit, even, uncluttered spaces; avoid traffic where possible (use paths, parks, schoolyards); check weather, heat, cold, ice and air quality before outdoor activity — on high-pollution days move indoors or shorten sessions; near water, never swim alone and follow lifeguard guidance. At home, clear trip hazards and use non-slip surfaces."]},{h:"Equipment and footwear",p:["Inspect equipment before use: frayed bands, loose dumbbell heads, damaged cables, worn shoe soles. Wear supportive, well-fitting shoes appropriate to the activity (running shoes for running, flat stable shoes for lifting). Use helmets for cycling and protective gear for contact sports. Replace gear when worn — cushioning degrades with use."]},{h:"Progression and personal limits",p:["Progress gradually (Chapter 24); warm up before hard efforts; know your current limits and respect them — fitness is built over months. Never exercise through severe or unexplained pain, and never train when drowsy, feverish, injured or impaired by alcohol, drugs or some medications. Use screening (e.g. PAR-Q+) and clinical advice where risk factors exist. Beginners, older adults and people with conditions benefit most from conservative starts and supervision."]}],myths:[{claim:"If I am young and healthy, I do not need to think about safety.",reality:"Most exercise injuries happen in everyday recreational activity, often from doing too much too soon — at any age."},{claim:"Pain killers before exercise make training safe.",reality:"Masking pain can lead to worse injury; some pain relief also affects kidneys with dehydration. Use only as clinically advised."}],safety:["Carry a phone and identification; tell someone your route for solo outdoor activity.","Know the emergency number for your country and the location of the nearest help.","Stop immediately for the warning signs in Chapter 47."],takeaways:["Safe environment + inspected equipment + sensible footwear + gradual progression = most risk prevented.","Screen when indicated; never train unwell, injured, drowsy or impaired.","Know your limits — they change day to day."],diagrams:[45],refs:["R37","R36","R08","R15","R40","R16"]},{id:46,part:7,title:"Understanding Common Exercise Injuries",standfirst:"Strains, sprains, tendon problems and overuse injuries usually come from too much too soon. Know the patterns, the risk factors, and when to get assessed.",objectives:["Distinguish muscle strains, ligament sprains and tendon problems","Explain overuse injuries, joint irritation and stress injuries","List risk factors and prevention principles (with limits)","Know when professional assessment is needed"],sections:[{h:"The main injury types",p:["A muscle strain is a tear of muscle fibres (often at the muscle-tendon junction), felt as sudden sharp pain during explosive or loaded stretching movements — hamstrings, calves and groin are common. A ligament sprain is stretching or tearing of a ligament (the joint stabilisers) — ankles, knees and wrists are common — usually with swelling and bruising. Tendon problems (tendinopathy) develop gradually from repeated overload — Achilles, patellar, rotator cuff, tennis/golfer's elbow — with pain and stiffness, especially in the morning or at the start of activity."]},{h:"Overuse injuries and stress injuries",p:["Overuse injuries (shin splints, stress reactions, tendinopathies, swimmer's shoulder, runner's knee) arise when tissue load exceeds recovery over weeks — classic “too much too soon” patterns: rapid mileage increases, new surfaces, inadequate rest, poor footwear, technique changes. Stress injuries (bone stress injuries/fractures) are overuse injuries of bone, common in the lower leg and foot in runners and jumpers, signalled by localised bone pain that worsens with loading."]},{h:"Risk factors and prevention principles",p:["Main modifiable risks: training errors (volume/intensity spikes), poor technique, inadequate recovery and sleep, low energy availability, inappropriate or worn footwear, hard/uneven surfaces, and prior injury. Prevention principles with reasonable support: gradual progression, varied training, strength training (especially calves, hips, core), proper warm-up, appropriate equipment, and addressing pain early. No single measure — including stretching — prevents all injuries."]},{h:"When professional assessment is needed",p:["Get assessed by a physician, physiotherapist or sports-medicine clinician for: pain that alters your gait or technique, pain at rest or at night, swelling, joint locking/giving way, numbness or weakness, suspected fracture or tendon rupture, injuries not improving in 1–2 weeks of relative rest, or any injury in a child's growth plate area. Early assessment prevents chronic problems."]}],myths:[{claim:"Rest completely until an injury fully heals.",reality:"Complete rest deconditions tissue; guided, progressive loading within pain limits is the modern standard for most strains, sprains and tendinopathies."},{claim:"Ice and compression cure every injury.",reality:"First-aid measures help symptomatically (PRICE principles), but they do not repair tissue — progressive rehabilitation does."},{claim:"Playing through pain builds toughness.",reality:"Pain that changes how you move predicts worse injury. Modify or stop, and get assessed."}],safety:["Suspected fracture, dislocation, head injury, or tendon rupture: immobilise, do not bear weight, seek urgent care.","This book does not provide injury treatment or rehabilitation prescriptions — it educates recognition and first response only."],takeaways:["Strains = muscle, sprains = ligaments, tendinopathy = tendon overload; overuse = load > recovery over time.","Prevent with gradual progression, strength, warm-up, good equipment and early attention to pain.","Gait-altering, rest/night pain, swelling, numbness or non-improving injuries need professional assessment."],diagrams:[46],refs:["R30","R21"]},{id:47,part:7,title:"Recognising Warning Signs",standfirst:"Some symptoms mean stop now and get help. Memorise this chapter — it could save a life, yours or someone else's.",objectives:["List urgent warning signs during exercise","Describe heat-related illness and emergency response","Explain when to stop activity and seek urgent help"],sections:[{h:"Stop immediately and seek urgent help for",p:["Chest pain, pressure or discomfort; pain spreading to arm, jaw or back; fainting or near-fainting; severe or sudden breathlessness out of proportion to effort; sudden weakness or numbness (especially one-sided); trouble speaking or sudden severe headache; palpitations with dizziness; severe allergic reaction. Call your local emergency number (e.g. 911/112/999/000 — know yours). If someone collapses, call for help, start CPR if trained and the person is unresponsive and not breathing normally, and use an AED if available."]},{h:"Heat-related illness",p:["Heat cramps (painful muscle spasms — stop, rest in shade, sip electrolyte fluid), heat exhaustion (heavy sweating, cool clammy skin, headache, nausea, dizziness, weakness — stop, cool, fluids, monitor), and heat stroke (hot skin, confusion, collapse, seizures — a life-threatening emergency: call emergency services, cool immediately with water/ice/fanning while waiting). Never leave a heat-stroke casualty alone."]},{h:"Other stop-and-assess signs",p:["Severe pain (especially joint or chest), pain with swelling, numbness or tingling, dark urine with severe muscle pain (possible rhabdomyolysis — urgent care), vomiting, extreme fatigue disproportionate to the session, and any symptom that frightens you. When in doubt, stop and get checked — no workout is worth an emergency."]},{h:"After stopping",p:["Do not resume the session that day. Report symptoms to a clinician before returning; after any cardiac-type symptom, exercise only after medical assessment. Keep an emergency contact and basic first-aid knowledge with your sports bag or phone."]}],myths:[{claim:"Feeling faint during exercise is just weakness — push through.",reality:"Faintness can signal cardiac, heat or metabolic problems. Stop, sit/lie down, and seek help if it does not pass quickly."},{claim:"Heat stroke is just exhaustion — rest and it will pass.",reality:"Heat stroke is an emergency with high mortality if untreated; confusion or collapse with heat = call emergency services and cool immediately."}],safety:["This chapter is educational first aid guidance, not a substitute for formal first-aid/CPR training — consider taking a certified course.","People with known conditions should carry prescribed emergency medication (e.g. inhalers, adrenaline auto-injectors) and an emergency plan."],takeaways:["Chest discomfort, fainting, severe breathlessness, one-sided weakness, severe headache → stop, call emergency services.","Heat stroke = emergency: cool first, call for help.","When in doubt, stop and get assessed. No session is worth an emergency."],diagrams:[47],refs:["R15","R36","R37"]},{id:48,part:7,title:"Overtraining and Excessive Exercise",standfirst:"When training load exceeds recovery for weeks, performance falls and health suffers. Recognising the signs early protects both.",objectives:["Explain training-load imbalance, overreaching and overtraining syndrome","List performance, physical, mood and sleep signs","Discuss excessive exercise behaviours and when to seek support"],sections:[{h:"Load versus recovery",p:["Every session adds load; recovery removes it. Short-term imbalance causes functional overreaching — a temporary dip that resolves with a few days' rest and can even precede supercompensation. When imbalance persists for weeks, non-functional overreaching develops, and beyond that, overtraining syndrome: a persistent decline in performance despite continued training, with broad physical and psychological symptoms. “Exercise as medicine” reviews note that the dose must be individualised — what is a stimulus for one person is overload for another."]},{h:"Signs to watch",p:["Performance: declining results, heavier-feeling sessions, slower recovery between sets. Physical: persistent fatigue, frequent illness, resting heart rate elevated, weight loss, menstrual irregularities, persistent soreness, more injuries. Mood/sleep: irritability, low mood, anxiety, poor sleep, loss of enjoyment."]},{h:"Excessive exercise behaviours",p:["Sometimes exercise becomes compulsive — used to control weight, shape, mood or anxiety, with guilt when sessions are missed, and continued despite injury or illness. This pattern can be part of, or coexist with, eating disorders and deserves compassionate, professional support (doctor, psychologist, eating-disorder services). It is not a character flaw."]},{h:"What helps",p:["Planned rest and deload weeks; reducing volume/intensity; prioritising sleep and nutrition; varying activities; addressing life stress; and talking to a professional if exercise feels out of control. Recovery from overtraining can take weeks to months — patience is the treatment."]}],myths:[{claim:"Overtraining only happens to elite athletes.",reality:"It happens to enthusiastic amateurs and beginners too — often from combining hard training with poor sleep, stress or under-fuelling."},{claim:"If I just push harder, I will break through the plateau.",reality:"Plateaus with fatigue usually signal too much load, not too little. Rest is often the fastest route forward."}],safety:["Red flags needing medical assessment: chest symptoms, fainting, persistent tachycardia, unexplained weight loss, or exercise despite serious injury/illness.","Suspected eating disorder or compulsive exercise: seek professional help early — outcomes are better with early support."],takeaways:["Overtraining = sustained load > recovery: performance drops, fatigue/illness/mood/sleep worsen.","Treat with rest, reduced load, sleep, nutrition and stress management.","Compulsive exercise deserves professional, compassionate support — not willpower."],diagrams:[48],refs:["R31","R21"]},{id:49,part:7,title:"Exercise, Body Image and Healthy Motivation",standfirst:"Movement should add to your life, not become a way to judge it. Function and enjoyment are better guides than appearance.",objectives:["Distinguish appearance-focused from function-focused motivation","Discuss fitness culture, social comparison and body diversity","Introduce non-scale measures of progress","Address compulsive exercise support"],sections:[{h:"Appearance versus function",p:["Fitness culture often sells appearance change as the main reward of exercise. But bodies respond differently to the same training — genetics, hormones, age, history and circumstances all shape outcomes — and no body size or shape determines health, effort or worth. Motivation anchored to function (what your body can do), health markers, mood, sleep and enjoyment is more durable and more protective of wellbeing than appearance goals."]},{h:"Social comparison and body diversity",p:["Social media shows edited, selective, often commercially driven images. Comparing your everyday to someone's highlight reel is unfair to you. Human bodies are diverse in size, shape, skin, ability and history — all normal. Speak about bodies, including your own, with the same respect you would offer a friend."]},{h:"Non-scale measures of progress",p:["Track what matters: more energy, better sleep, easier stairs, a heavier lift, a longer walk without stopping, faster recovery between sessions, improved mood, new skills, pain-free movement. These changes are real progress that scales never show."]},{h:"Enjoyment and compulsive exercise",p:["Exercise should fit your life, not consume it. If you feel anxious when you miss a session, exercise through injury or illness, or use exercise to punish food or change your body, that pattern deserves support (Chapter 48). Choose activities you genuinely enjoy; rest without guilt; and remember: your worth is not determined by physical performance or appearance."]}],myths:[{claim:"If I am not sore or exhausted, I did not try hard enough.",reality:"Consistent, enjoyable, progressive movement is the goal — not suffering. Recovery is part of training."},{claim:"Exercise is only worth doing if it changes my body.",reality:"The mental, social, sleep and functional benefits of movement are real and valuable on their own."}],safety:["Avoid exercising to compensate for food or to earn the right to eat — seek help if this pattern appears.","If body image distress or compulsive exercise affects daily life, talk to a qualified mental-health professional."],takeaways:["Anchor motivation in function, health, skill, mood and enjoyment — not appearance.","Progress has many non-scale measures.","Bodies are diverse; worth is never physical.","Compulsive exercise is a support-needing pattern, not a failure of will."],diagrams:[49],refs:["R27"]},{id:50,part:7,title:"Long-Term Exercise Adherence",standfirst:"The best programme is the one you are still doing in ten years. Habits, enjoyment, environment and flexibility do the heavy lifting.",objectives:["Explain habit formation and motivation science","Describe environmental design, social support and handling interruptions","Build sustainable, lifelong goals"],sections:[{h:"Habits over motivation",p:["Motivation fluctuates; habits carry you through. Anchor activity to existing routines (after breakfast, before dinner, Sunday morning), start embarrassingly small (5–10 minutes), and use cues and reminders. Research on habit formation shows repetition in a consistent context builds automaticity — it typically takes weeks to months, so be patient and celebrate showing up."]},{h:"Design your environment and social world",p:["Make movement easy and enjoyable: lay out clothes the night before, keep shoes by the door, choose routes you like, join a walking group, class or team, or find an accountability partner. Tell people your plans. Reduce friction for good habits and increase it for sedentary defaults (e.g. stand during calls)."]},{h:"Handling interruptions",p:["Illness, travel, injury, exams, new jobs, caregiving — life will interrupt. The key skill is the quick, kind restart: when you can, resume at a lower level than before and rebuild — do not quit or “make up” missed sessions. Flexibility is what turns a programme into a lifestyle."]},{h:"Sustainable goals for life",p:["Set process goals (walk 3 times this week) rather than only outcome goals (lose X kg). Review quarterly: what do you enjoy, what fits, what needs changing? Population evidence shows the healthiest pattern is simply moving regularly across the whole lifespan — some activity, most days, forever. Lifelong activity is not a streak; it is a relationship with movement that survives interruptions."]}],myths:[{claim:"Missing one day ruins everything.",reality:"One missed day is a blip. Adherence is measured in months and years; restart without guilt."},{claim:"I need perfect conditions to exercise.",reality:"Adapt: shorter, indoors, seated, different time. Something is always possible — and always counts."}],safety:["Never restart after illness or injury at full intensity — rebuild gradually and seek guidance if symptoms return.","If interruptions are caused by pain or recurring symptoms, get professional assessment rather than repeatedly pushing through."],takeaways:["Habits (cues + consistent context + small starts) beat motivation.","Design your environment and social circle to support movement.","Restart kindly after interruptions; process goals sustain lifelong activity."],diagrams:[50],refs:["R05","R25","R02"]}],hy=[{id:51,part:8,title:"Exercise Science Myths and Misconceptions",standfirst:"Fitness marketing thrives on myths. Here are thirty-plus common claims, what the evidence actually says, and the practical takeaway for each.",objectives:["Evaluate at least 30 common fitness claims against the evidence","Distinguish established science from marketing","Apply practical, safe interpretations"],sections:[{h:"How to read this chapter",p:["Each entry states the claim, what the evidence shows (including its limits), and a practical interpretation you can use. Evidence evolves; the principles here reflect established science and major reviews as cited in our reference register."]}],myths:[{claim:"Spot reduction is possible — train abs to lose belly fat.",reality:"Not supported. Fat loss is systemic; local exercise does not selectively remove local fat. Core training strengthens muscles but does not spot-reduce."},{claim:"Sweating measures fat loss.",reality:"Sweat is water and electrolytes for cooling, not fat. You can sweat heavily with zero fat loss and burn fat without visible sweat."},{claim:"Soreness is necessary for progress.",reality:"DOMS is not required for adaptation. You can progress with minimal soreness; chasing soreness raises injury risk (Chapter 40)."},{claim:"More exercise always produces better results.",reality:"Dose-response curves flatten and then reverse: beyond recovery capacity, more load brings fatigue, illness and injury (Chapter 48)."},{claim:"Women should avoid heavy strength training.",reality:"Women safely train with heavy loads and benefit for bone, muscle and metabolic health; hormonal profiles generally limit bulky gains."},{claim:"Older adults should avoid resistance training.",reality:"Major guidelines recommend strength and balance training for older adults to protect bones, muscle, balance and independence."},{claim:"Stretching prevents every injury.",reality:"Systematic reviews find no clear all-cause injury-prevention effect of static/PNF stretching; strength, load management and warm-up matter more."},{claim:"Cardio destroys muscle.",reality:"Moderate cardio supports heart health and recovery. Extreme endurance volumes without adequate fuel/recovery can reduce muscle, but normal cardio does not “destroy” muscle."},{claim:"Weight training always makes people bulky.",reality:"Hypertrophy takes sustained progressive training, nutrition and often specific genetics; most beginners gain strength first with modest size change."},{claim:"One exercise is best for everyone.",reality:"No single exercise is universally best. The best exercise is the safe, progressive one that fits your body, goals and access."},{claim:"Fasted exercise guarantees superior fat loss.",reality:"Fasted training changes the fuel mix of a session, not long-term fat loss, which depends on overall energy balance. Some people perform poorly fasted."},{claim:"Supplements are essential for muscle growth.",reality:"Training, food protein, energy and recovery build muscle. Only a few supplements have decent evidence, and none are compulsory (Chapter 43)."},{claim:"Everyone must train to failure.",reality:"Research shows similar strength/hypertrophy across loads when effort is adequate; failure adds fatigue and risk without being required."},{claim:"A perfect posture exists.",reality:"No single posture is protective all day. Varied movement and frequent position changes are healthier than any fixed pose (Chapter 30)."},{claim:"Rest days are unproductive.",reality:"Adaptation happens during recovery; rest days are programmed training, not lost time."},{claim:"You need 10,000 steps daily.",reality:"10,000 began as marketing. Benefits rise across the step range well below 10,000; increase from your own baseline."},{claim:"Running ruins your knees.",reality:"Recreational running is not linked to higher knee osteoarthritis in most evidence; unaccustomed overload is the bigger risk."},{claim:"You must never eat after 8 pm.",reality:"Meal timing matters far less than total intake and dietary pattern; late eating affects some people's sleep, which is individual."},{claim:"Natural supplements are safe; drugs are the only danger.",reality:"“Natural” products can be potent, interact with medicines and be contaminated. Regulation and evidence vary — check with a professional."},{claim:"HIIT is the only way to get results fast.",reality:"Continuous moderate training builds fitness reliably; HIIT is time-efficient for some adaptations but optional (Chapter 14)."},{claim:"Lifting weights stunts children's growth.",reality:"Supervised, age-appropriate resistance training is safe for children and does not stunt growth; injuries come from poor supervision and maximal lifts."},{claim:"You can out-train a bad diet.",reality:"You cannot out-train sustained energy excess or deficiency; nutrition and training work together, and extreme restriction harms health."},{claim:"Muscle turns to fat if you stop training.",reality:"Muscle and fat are different tissues. Stopping training shrinks muscle and, if intake stays high, fat can increase — two separate processes."},{claim:"Short workouts do not count.",reality:"Activity accumulates in bouts; several 10-minute sessions contribute meaningfully to weekly totals and health."},{claim:"Heart-rate zones from “220 minus age” are exact.",reality:"That formula has wide individual error (±10–20 bpm or more); combine any zones with RPE and the talk test (Chapter 9)."},{claim:"You must drink a gallon of water daily.",reality:"Fluid needs vary with body, climate, diet and activity; thirst plus urine colour are practical guides for most healthy people."},{claim:"Ice baths are essential after every session.",reality:"Cold-water immersion may blunt some long-term training adaptations and is not essential; it can help symptomatically after very hard sessions."},{claim:"Static stretching before sport prevents injury.",reality:"Long static holds pre-activity can transiently reduce power; dynamic warm-ups are preferred, and stretching alone does not prevent injuries."},{claim:"Anyone can look like a fitness model with discipline.",reality:"Genetics, hormones, lighting, editing and sometimes unsafe practices shape model physiques. Discipline does not guarantee any specific look — and worth is not appearance."},{claim:"Exercise is dangerous for people with chronic disease.",reality:"Appropriate, individually guided activity benefits most chronic conditions; inactivity is usually riskier. Clinical guidance personalises the dose (Chapter 6)."},{claim:"You should feel exhausted after every workout.",reality:"Most sessions should be repeatable; persistent exhaustion signals overload. Sustainable training feels challenging, not destructive."},{claim:"Gym memberships are required to be fit.",reality:"Walking, bodyweight training, dancing, chores and active transport are effective, free and accessible forms of fitness."}],safety:["Be sceptical of claims promising fast, guaranteed or effortless results — they are the classic markers of misleading fitness marketing.","If a claim concerns a supplement, drug or extreme protocol, check it with a qualified clinician before acting."],takeaways:["Most fitness myths share a pattern: they promise simple, fast, universal answers. Biology is rarely that simple.","Trust established principles: progressive overload, recovery, variety, adequate nutrition and hydration, and safety.","When in doubt, consult the reference register and qualified professionals — not influencers."],diagrams:[51],refs:["R29","R23","R32","R39","R24","R21"]},{id:52,part:8,title:"Fifteen Realistic Exercise-Education Case Studies",standfirst:"These fifteen cases are fictional teaching examples — not real patients, testimonials or clinical advice. Each shows how exercise science applies to real-life situations.",objectives:["Apply exercise-science principles to realistic scenarios","Practise identifying what can and cannot be concluded","Recognise when professional guidance is appropriate"],sections:[{h:"How to use these cases",p:["Each case gives a background, the main educational challenge, relevant science, realistic options, safety considerations, what cannot safely be concluded, when professional guidance is appropriate, and learning points. They are deliberately ordinary — movement education is mostly about everyday decisions."]},{h:"Case 1 — A complete beginner starting regular walking",p:["Background: A 34-year-old office worker in Nairobi wants to “get fitter” and has not exercised regularly for years. Challenge: fear of starting, uncertainty about how much to do. Science: any activity beats none; brisk walking at conversational intensity is a genuine aerobic stimulus. Options: 20–30 minute walks 3–4 days/week, plus 2-minute movement breaks at work. Safety: comfortable shoes, safe well-lit routes, hydration in heat. Cannot conclude: that they need a gym, a plan to “burn fat”, or 10,000 steps. Professional guidance if: chest symptoms, dizziness or known conditions. Learning points: start small, enjoy, repeat."]},{h:"Case 2 — Returning after a long inactive period",p:["Background: A 58-year-old in Manchester stopped activity after a surgery five years ago and wants to restart. Challenge: fear of injury and of “doing it wrong”. Science: detraining reverses gradually with progressive, recoverable load; strength and balance training are especially valuable at this age. Options: GP check + PAR-Q+, then walking plus gentle sit-to-stand, hip hinge and balance work near support, 2–3 days/week. Safety: post-surgical clearance, fall precautions. Cannot conclude: that age bars them from strength training. Professional guidance: yes, initially, given the surgical history. Learning points: clearance first, then consistency."]},{h:"Case 3 — Home exerciser with minimal equipment",p:["Background: A university student in São Paulo lives in a small shared flat with little money. Challenge: building strength without a gym. Science: bodyweight progressions and bands can load all major patterns progressively. Options: 3×/week full-body routine (sit-to-stand, incline push-up, hip hinge, lunge, plank, towel row), 20–30 minutes, plus daily walking. Safety: sturdy furniture, non-slip floor. Cannot conclude: that equipment is required for results. Professional guidance if: pain persists. Learning points: small space, big results with consistency."]},{h:"Case 4 — Learning resistance training",p:["Background: A 27-year-old teacher in London joins a gym for the first time. Challenge: technique anxiety and conflicting advice online. Science: early strength gains are neural; technique with light load precedes load. Options: induction, 2–3 sessions/week covering squat, hinge, push, pull, carry; log sessions; consider a few sessions with a qualified trainer. Safety: warm-up, controlled reps, no ego lifting. Cannot conclude: that soreness or failure is required. Professional guidance: trainer for technique; clinician if symptoms. Learning points: patterns over exercises; log and progress gradually."]},{h:"Case 5 — University student with limited time",p:["Background: A 20-year-old in Tokyo has classes 9–5 and commutes by train. Challenge: “no time to exercise”. Science: activity accumulates; walking is transport-compatible; short sessions count. Options: walk or cycle part of the commute, 10-minute morning routine, weekend longer activity, study-walk breaks. Safety: traffic awareness, headphones volume, hydration. Cannot conclude: that short bouts “do not count”. Professional guidance if: stress/sleep problems persist (see Book 12/13). Learning points: anchor movement to existing routines."]},{h:"Case 6 — Desk worker seeking more daily movement",p:["Background: A 45-year-old accountant in Toronto sits 9 hours/day and has gained weight, which worries them. Challenge: sedentary work and appearance-focused goals. Science: breaking up sitting helps cardiometabolic risk markers; health benefits come from activity regardless of weight change. Options: standing desk or sit-stand rotation, 2–5 min walk every hour, lunchtime walk, stairs, evening stroll; strength 2×/week. Safety: ergonomic setup, gradual increase. Cannot conclude: that weight is a fitness score or that they must “earn” food. Professional guidance: dietitian/clinician for sustainable habits (see Book 11), mental-health support if body image distress. Learning points: function and wellbeing first; small breaks add up."]},{h:"Case 7 — Older adult interested in balance and strength",p:["Background: A 72-year-old in Sydney has fallen once at home and wants to feel steadier. Challenge: fear of falling again. Science: strength + balance training reduces falls; tai chi has strong evidence. Options: falls-risk assessment via GP, physiotherapist-led programme, progressive balance ladder near support (Chapter 29), 2 strength sessions/week, tai chi or dancing class. Safety: home hazard check, supportive shoes, avoid exercising when dizzy. Cannot conclude: that they are “too old” or must only do gentle exercise. Professional guidance: yes — assessment and tailored programme. Learning points: balance is trainable; strength protects independence."]},{h:"Case 8 — Recreational runner increasing training gradually",p:["Background: A 38-year-old in Cape Town runs 3×/week and wants to try a 10 km event in three months. Challenge: avoiding overuse injury. Science: gradual volume increase (rough heuristic ≤10%/week), varied surfaces, strength work for calves/hips, rest days. Options: structured plan with run-walk if needed, 2 strength sessions, sleep priority. Safety: pain that alters gait = stop; heat/UV precautions; hydration. Cannot conclude: that more running is always better or that pain should be run through. Professional guidance: physiotherapist for persistent niggles; clinician for chest symptoms. Learning points: progress one variable at a time."]},{h:"Case 9 — Exercising in a hot climate",p:["Background: A 30-year-old in Dubai wants to train outdoors in summer, when temperatures exceed 40 °C. Challenge: heat-illness risk. Science: heat raises cardiovascular strain and sweat losses; acclimatisation helps over 1–2 weeks. Options: train early morning/evening, reduce intensity/duration, loose light clothing, hat, water, electrolyte drinks for long sessions; move indoors on extreme days; know heat-illness signs (Chapter 47). Safety: never train with fever; watch for confusion (emergency). Cannot conclude: that “toughing out” the heat is safe. Professional guidance: clinician for any heat-illness episode. Learning points: respect the environment; hydrate to thirst plus plan."]},{h:"Case 10 — Limited outdoor access",p:["Background: A 50-year-old in a dense city neighbourhood with safety concerns outdoors after dark works night shifts. Challenge: safe, convenient activity. Science: indoor and accumulated activity are fully valid. Options: home circuit 3×/week, stair climbing at work, indoor walking during breaks, online beginner classes, weekend park visits when safe, seated options if needed. Safety: home security, non-slip floors, phone nearby. Cannot conclude: that outdoor exercise is required. Professional guidance: if night-shift sleep issues (Book 12). Learning points: adapt the environment, not your worth."]},{h:"Case 11 — A person with a disability seeking adaptive movement",p:["Background: A 25-year-old wheelchair user in Bogotá wants to get fitter and has heard “you can't train like that”. Challenge: access and assumptions. Science: self-propelled wheelchair use, arm ergometry, seated strength and water exercise are genuine, effective training; adaptive sport exists at all levels. Options: adaptive fitness instructor or physiotherapist for a tailored programme; local adaptive sport clubs; seated circuits at home; swimming with pool access features. Safety: skin checks, transfer safety, autonomic dysreflexia awareness if spinal cord injury. Cannot conclude: any assumption about ability — ask the person. Professional guidance: yes, for individualised programming. Learning points: adaptation enables; assumptions disable."]},{h:"Case 12 — An athlete balancing training and recovery",p:["Background: A 19-year-old footballer in Lagos trains 6 days/week plus matches and feels constantly tired and irritable. Challenge: possible overreaching. Science: load must match recovery; sleep and fuel are performance tools. Options: discuss with coach; add rest day, deload week, prioritise sleep, review nutrition; track mood/energy/RHR. Safety: watch for Chapter 48 signs; medical review if persistent. Cannot conclude: that more training is the answer. Professional guidance: sports-medicine clinician if symptoms persist >2 weeks. Learning points: recovery is training; listen to signals."]},{h:"Case 13 — Recurring exercise discomfort",p:["Background: A 41-year-old gardener in Auckland gets recurring shoulder pain when doing overhead work and DIY. Challenge: is this normal? Science: persistent localised pain with activity suggests overload or technique issue; “push through” worsens it. Options: reduce aggravating load, technique review, shoulder/scapular strengthening with guidance, physio assessment. Safety: stop painful movements; red flags (numbness, weakness) need medical review. Cannot conclude: a diagnosis from this book. Professional guidance: yes — physiotherapist/clinician for assessment and rehab. Learning points: recurring pain is information, not a test of toughness."]},{h:"Case 14 — Concerned about fitness marketing and supplements",p:["Background: A 22-year-old student in Berlin is tempted by influencer-promoted fat burners and a “required” pre-workout. Challenge: separating evidence from marketing. Science: only a few supplements have decent evidence (creatine, caffeine); fat burners have weak evidence and real risks; contamination is documented. Options: prioritise sleep, food, training basics; if considering any supplement, choose third-party tested and check with a pharmacist/doctor; never use steroids/PEDs. Safety: stop any product causing palpitations/anxiety; check WADA lists if competing. Cannot conclude: that supplements are needed. Professional guidance: pharmacist/doctor, especially with medications. Learning points: food + training + sleep first; marketing is not evidence."]},{h:"Case 15 — Symptoms that require professional medical evaluation",p:["Background: A 55-year-old in Vancouver notices chest tightness and unusual breathlessness on hills, and once felt faint. Challenge: recognising red flags. Science: exertional chest symptoms, syncope or disproportionate breathlessness can indicate cardiac or other serious conditions. Options: stop vigorous activity, book urgent medical assessment, follow Chapter 47 emergency guidance if symptoms occur; only resume exercise after clearance with an individualised plan. Safety: this is exactly the Chapter 47 scenario. Cannot conclude: anything about the cause from this book — no diagnosis is made here. Professional guidance: required — this case is a referral, not a plan. Learning points: warning signs exist to be acted on; education never replaces clinical assessment."]}],myths:[{claim:"Case studies like these are real success stories.",reality:"They are fictional teaching examples. They are not patients, testimonials or proof that any approach will work for you."}],safety:["If any real-life situation resembles Case 15 — chest symptoms, fainting, severe breathlessness — stop activity and seek urgent medical care.","These cases never replace individual clinical advice; they teach how to think, not what to do about a specific body."],takeaways:["Realistic planning starts from the person's life, access, health and enjoyment.","In every case, the safe conclusions are modest: gradual, enjoyable, recoverable activity plus professional input when indicated.","Warning-sign cases are referrals to professionals — education supports, never replaces, clinical care."],diagrams:[52],refs:["R37","R36","R15","R02","R07"]}],my=[{id:53,part:8,title:"The 30-Day Sustainable Movement Challenge",standfirst:"A flexible 30-day educational programme. No forced daily workouts, no weight-loss targets, no competition, no training through pain — just awareness, variety and a plan you will keep.",objectives:["Complete a flexible four-week movement-awareness programme","Practise accessible alternatives and rest options throughout","Build a personal, realistic long-term weekly plan"],sections:[{h:"Ground rules (read first)",p:["This challenge has no mandatory workouts, no required weight-loss or body measurements, no leaderboard, and no training through pain. Rest days are part of the plan. Every activity has an accessible alternative (seated, shorter, indoors). If anything hurts or you feel unwell, stop and rest — and see Chapter 47 for warning signs. Use the 30-day tracker worksheet in this book to log your days."]},{h:"Week 1 — Movement Awareness",p:["Goal: notice your current movement without judgement."],list:["Days 1–3: simply log your daily movement (walking, chores, work activity, sitting time) in the activity awareness log.","Days 4–5: take two 10–15 minute comfortable walks (or wheel, or march seated) at a pleasant pace, indoors or out.","Days 6–7: explore one new enjoyable movement (dancing to three songs, a gentle yoga video, gardening) and one 5-minute movement break during a long sitting day. Rest at least one full day."]},{h:"Week 2 — Building Foundations",p:["Goal: establish a repeatable aerobic base and learn the basic movement patterns."],list:["Aerobic: 3 days of 15–30 minutes of accessible aerobic activity (brisk walk, cycle, swim, dance) at conversational intensity.","Strength education (optional but recommended): 2 days of a beginner bodyweight circuit — sit-to-stand, wall/incline push-up, hip hinge, lunge (supported), plank 10–20 s — 1–2 rounds.","Mobility: 5–10 minutes of gentle mobility (hip openers, ankle rocks, thoracic rotation, calf stretch) on 2–3 days.","Rest at least 2 days; add movement breaks on sitting days."]},{h:"Week 3 — Developing Variety",p:["Goal: try different movement forms and practise balance and recovery habits."],list:["Try three different activity types this week (e.g. walk + swim or dance + cycle).","Balance/coordination: 2 sessions of 5–10 minutes — tandem stance near support, single-leg stand (5–10 s), heel-to-toe walk, or a tai chi/dance video.","Strength: repeat Week 2 circuit or add one round / slightly harder variation if comfortable.","Recovery review: note sleep, energy, mood, and any soreness — adjust next week's plan accordingly.","Identify one barrier (time, weather, access, energy) and one adaptation that solves it."]},{h:"Week 4 — Sustainable Planning",p:["Goal: design your own realistic weekly plan going forward."],list:["Review the month: which activities did you enjoy most? Which felt sustainable?","Use the weekly activity planner worksheet to write your own plan: aerobic minutes, 2 strength days, mobility, balance, rest days.","Choose your supports: a walking buddy, a class, an app, a diary, family time outdoors.","List your resources: local safe spaces, indoor options, free/low-cost activities, professional contacts if needed.","Write one sentence about why movement matters to you — and put it where you will see it."]},{h:"Accessibility and rest throughout",p:["Every week includes rest options; every activity has a seated, shorter or indoor alternative. If a day does not happen, log it and move on — the challenge is education and habit-building, not performance."]}],myths:[{claim:"A challenge means doing something every single day.",reality:"This programme deliberately includes rest and optional days. Sustainability beats streaks."}],safety:["No activity in this challenge should be performed through pain; modify or rest instead.","Follow Chapter 47 warning signs at all times; when in doubt, stop and seek help."],takeaways:["Week 1 awareness → Week 2 foundations → Week 3 variety → Week 4 your own plan.","Rest and alternatives are built in; enjoyment drives adherence.","End with a personal weekly plan, supports and resources — not a score."],diagrams:[53],refs:["R02","R05"]},{id:54,part:8,title:"Your Lifelong Fitness Reference Guide",standfirst:"The whole book in one place: principles, references, a 120-term glossary, further reading and a final word from HERBULANCE.",objectives:["Consolidate the fundamental movement and programming principles","Locate the glossary, reference register and further reading","Finish with a sustainable, respectful approach to lifelong movement"],sections:[{h:"Fundamental movement principles",list:["Some movement is better than none — start where you are and progress gradually.","Variety beats monotony: aerobic, strength, mobility, balance and play.","Progress one variable at a time and recover between hard sessions.","Technique and control before load; pain that changes how you move is a stop sign.","Movement is for function, health, skill, mood and connection — never a measure of worth."]},{h:"Fitness components",p:["Cardiovascular endurance, muscular strength, muscular endurance, flexibility, mobility, balance, coordination, power, speed and functional fitness — train several, not just one (Chapter 5)."]},{h:"Strength-training reference",p:["Patterns: squat, hinge, push, pull, lunge, carry, rotate, locomotion. Variables: frequency (2–4×/week), sets (2–4), reps (8–12 for most, lighter/higher for beginners and older adults), load (progressive, controlled), rest (2–3 min heavy; 30–60 s lighter). Log everything; deload every 4–8 weeks (Chapters 20–24)."]},{h:"Aerobic activity reference",p:["Adults: 150–300 min moderate or 75–150 min vigorous weekly, in accumulated bouts, plus strength ≥2 days. Judge intensity with the talk test and RPE; use heart-rate zones only as rough guides (Chapters 8–10, 32)."]},{h:"Mobility, balance and posture reference",p:["Daily short mobility sessions for the joints you use; balance practice near support 2–3×/week (more for older adults); varied posture with frequent position changes (Chapters 25–30)."]},{h:"Exercise safety checklist",list:["Screen first if you have risk factors or symptoms (PAR-Q+; clinician clearance).","Warm up; progress gradually; use inspected equipment and appropriate footwear.","Hydrate to thirst; plan for heat, cold, air quality and water safety.","Never train unwell, drowsy, injured or through severe pain.","Know the warning signs (Chapter 47): chest pain, fainting, severe breathlessness, one-sided weakness → stop, call emergency services."]},{h:"Recovery guide",p:["Rest days and easy days; sleep 7–9+ hours; eat enough varied food with adequate protein; hydrate sensibly; manage stress; deload periodically (Chapters 38–44)."]},{h:"Nutrition and hydration principles",p:["No universal calorie or fluid prescription: eat enough varied food for energy, training and recovery; drink to thirst with planned intake in heat; electrolytes mainly for prolonged/heat exercise. See HERBULANCE Books 07, 10 and 11 for nutrition depth (Chapter 41–42)."]},{h:"Adaptive activity considerations",p:["Adapt position (seated/standing/supported), load, equipment and environment to the person; use adaptive sport and professional guidance; never assume ability or limitation (Chapter 37)."]},{h:"Glossary",p:["This book includes a searchable glossary of 120+ exercise-science terms — open the Glossary tool in the menu. Key terms: aerobic capacity, ATP, concentric/eccentric/isometric contraction, DOMS, HIIT, hypertrophy, mobility, motor unit, neuromuscular adaptation, progressive overload, proprioception, range of motion, resistance training, stroke volume, training volume, VO2max and more."]},{h:"Further reading and the complete reference register",p:["The full, searchable scientific reference register — WHO, CDC, ACSM, NHS, NIH/MedlinePlus, national guidelines (UK, US, Australia), and peer-reviewed reviews and meta-analyses — is available in the References tool, with direct links, publication details, access dates, jurisdictions and the chapters each source supports. Start with WHO's physical-activity guidelines and fact sheets, your national public-health agency, and the ACSM Position Stands."]},{h:"A final HERBULANCE message",p:["Movement is one of the most generous things you can give your future self — not because of how it changes your appearance, but because of what it lets you do, feel and live. Start small. Choose joy. Rest well. Adapt when life changes. And treat every body — including your own — with respect.","This publication is educational. It does not diagnose, clear you for exercise, prescribe rehabilitation or replace advice from qualified health professionals. When in doubt, ask one.","Learn • Prepare • Thrive. — HERBULANCE: Natural Living • Food Education • Everyday Wellness"]}],myths:[{claim:"Finishing this book makes you an expert who can prescribe exercise.",reality:"It makes you informed. Prescribing exercise for medical conditions is the role of qualified, regulated professionals."}],safety:["All Chapter 47 warning signs apply throughout life: stop and seek urgent help for chest pain, fainting, severe breathlessness or one-sided weakness.","This book never replaces individual clinical advice."],takeaways:["Move regularly, vary it, progress gently, recover well, stay safe.","Use the glossary, references, quizzes, flashcards, worksheets and planners in this app to keep learning.","Your worth was never up for debate. Learn • Prepare • Thrive."],diagrams:[59,60],refs:["R01","R02","R09","R17","R19","R21","R25"]}],Wt=[...iy,...sy,...oy,...ry,...ly,...cy,...uy,...dy,...hy,...my],bo=l=>Wt.find(x=>x.id===l),Nm=l=>Wt.filter(x=>x.part===l);function fy({open:l,onClose:x,currentChapter:m,route:u,read:d,bookmarks:f}){const[b,E]=ae.useState(()=>{const M=Wt.find(B=>B.id===m);return[M?M.part:1]}),v=M=>E(B=>B.includes(M)?B.filter(K=>K!==M):[...B,M]),g=u==="#/"||u==="",R=o.jsxs("nav",{"aria-label":"Table of contents",className:"flex h-full flex-col",children:[o.jsx("div",{className:"border-b border-line px-4 py-3",children:o.jsx("p",{className:"font-display text-xs font-bold uppercase tracking-widest text-inksoft",children:"Table of contents"})}),o.jsxs("div",{className:"flex-1 overflow-y-auto px-2 py-2",children:[o.jsxs("a",{href:"#/",onClick:x,className:qt("mb-1 flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium",g?"bg-accentsoft text-accent":"hover:bg-soft"),children:[o.jsx("span",{"aria-hidden":"true",children:"⌂"})," Home & overview"]}),Il.map(M=>{const B=Nm(M.id),K=b.includes(M.id);return o.jsxs("div",{className:"mt-1",children:[o.jsxs("button",{onClick:()=>v(M.id),className:"flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-sm font-semibold text-ink hover:bg-soft","aria-expanded":K,children:[o.jsx("span",{className:"pr-2",children:M.title.replace(/ — /,": ")}),o.jsx("svg",{viewBox:"0 0 24 24",className:qt("h-4 w-4 shrink-0 transition-transform",K&&"rotate-180"),fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round","aria-hidden":"true",children:o.jsx("path",{d:"m6 9 6 6 6-6"})})]}),K&&o.jsx("ul",{className:"ml-2 border-l border-line pl-2",children:B.map(L=>{const F=m===L.id,ie=d.includes(L.id),ee=f.includes(L.id);return o.jsx("li",{children:o.jsxs("a",{href:`#/chapter/${L.id}`,onClick:x,"aria-current":F?"true":void 0,className:qt("flex items-center gap-2 rounded-md px-2 py-1.5 text-[13px] leading-snug",F?"bg-accentsoft font-semibold text-accent":"text-inksoft hover:bg-soft hover:text-ink"),children:[o.jsx("span",{className:"w-6 shrink-0 text-right text-[11px] tabular-nums",children:L.id}),o.jsx("span",{className:"min-w-0 flex-1",children:L.title}),ee&&o.jsx("span",{"aria-label":"Bookmarked",className:"text-amber",children:"★"}),ie?o.jsx("span",{"aria-label":"Read",className:"flex h-4 w-4 shrink-0 items-center justify-center rounded-full bg-botanical text-[9px] text-cream",children:"✓"}):o.jsx("span",{className:"h-4 w-4 shrink-0 rounded-full border border-line","aria-hidden":"true"})]})},L.id)})})]},M.id)})]}),o.jsxs("div",{className:"border-t border-line px-4 py-3 text-xs text-inksoft",children:[d.length," of 54 chapters read"]})]});return o.jsxs(o.Fragment,{children:[o.jsx("aside",{className:"no-print sticky top-[104px] hidden h-[calc(100vh-104px)] w-72 shrink-0 overflow-hidden lg:block xl:w-80",children:o.jsx("div",{className:"card m-3 h-[calc(100%-24px)]",children:R})}),l&&o.jsxs("div",{className:"no-print fixed inset-0 z-50 lg:hidden",children:[o.jsx("div",{className:"absolute inset-0 bg-black/40",onClick:x,"aria-hidden":"true"}),o.jsxs("aside",{className:"absolute left-0 top-0 h-full w-[86%] max-w-xs bg-bg shadow-xl",role:"dialog","aria-label":"Table of contents",children:[o.jsx("button",{onClick:x,className:"absolute right-2 top-2 rounded-lg p-2 hover:bg-soft","aria-label":"Close table of contents",children:o.jsx("svg",{viewBox:"0 0 24 24",className:"h-5 w-5",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",children:o.jsx("path",{d:"M6 6l12 12M18 6 6 18"})})}),R]})]})]})}const ua=[{q:"According to the WHO, physical activity is:",options:["Only structured gym exercise","Any bodily movement produced by skeletal muscles that requires energy expenditure","Only activity that raises heart rate above 120","Movement done at least 30 minutes continuously"],answer:1,explanation:"The WHO definition is deliberately broad and includes walking, chores, transport and play — not just formal exercise.",category:"Foundations",chapter:1},{q:"Which of these is classified as exercise rather than general physical activity?",options:["Walking to the shop","A planned 30-minute brisk walk done to improve fitness","Standing while cooking","Gardening for an hour"],answer:1,explanation:"Exercise is planned, structured and purposeful. Everyday movement is physical activity but not necessarily exercise.",category:"Foundations",chapter:1},{q:"Sedentary behaviour is best defined as:",options:["Not exercising enough in a week","Waking time spent sitting or lying with low energy expenditure","Any screen time","Sleeping poorly"],answer:1,explanation:"Sedentary behaviour (e.g. long sitting) is a distinct risk factor from physical inactivity; both matter.",category:"Foundations",chapter:1},{q:"Population studies show that compared with inactivity, even modest daily movement is associated with:",options:["No measurable benefit until 300 minutes/week","Substantially lower risk of premature mortality, with a dose-response pattern","Benefit only in athletes","Benefit only in young people"],answer:1,explanation:"Harmonised accelerometer meta-analyses (e.g. Ekelund et al. 2019) show a non-linear dose-response: some activity is much better than none.",category:"Foundations",chapter:1},{q:"How many bones are in the typical adult skeleton?",options:["126","206","306","450"],answer:1,explanation:"The adult skeleton has 206 bones, providing levers, protection and mineral storage.",category:"Anatomy",chapter:2},{q:"Tendons connect:",options:["Bone to bone","Muscle to bone","Nerve to muscle","Bone to ligament"],answer:1,explanation:"Tendons attach muscle to bone and transmit force; ligaments connect bone to bone.",category:"Anatomy",chapter:2},{q:"Which system coordinates movement by integrating sensory information and sending motor commands?",options:["The digestive system","The nervous system","The skeletal system alone","The endocrine system alone"],answer:1,explanation:"The nervous system senses, decides and commands movement, with constant feedback from proprioceptors.",category:"Anatomy",chapter:2},{q:"Which list contains only basic movement patterns?",options:["Squat, hinge, push, pull, lunge, carry","Sneeze, blink, yawn","Typing, scrolling, clicking","Breathing, blinking, swallowing"],answer:0,explanation:"The major patterns are squat, hip hinge, push, pull, lunge, carry, rotation and locomotion.",category:"Movement patterns",chapter:2},{q:"Which muscle type is under voluntary control and attached to bones?",options:["Cardiac","Smooth","Skeletal","All three equally"],answer:2,explanation:"Skeletal muscle is voluntary and moves the skeleton; cardiac and smooth muscle are involuntary.",category:"Muscle science",chapter:3},{q:"The functional unit of contraction inside a muscle fibre is the:",options:["Neuron","Sarcomere","Alveolus","Nephron"],answer:1,explanation:"Sarcomeres contain actin and myosin; their coordinated shortening produces contraction via the sliding filament mechanism.",category:"Muscle science",chapter:3},{q:"A motor unit consists of:",options:["One muscle fibre only","One motor neuron and all the muscle fibres it activates","All muscles in a limb","A tendon and a ligament"],answer:1,explanation:"When the motor neuron fires, all its fibres activate together. Recruitment follows the size principle (small to large).",category:"Muscle science",chapter:3},{q:"The size principle means motor units are recruited:",options:["Randomly","From small to large as force demand increases","From large to small","Only during maximal lifts"],answer:1,explanation:"Small motor units handle light efforts; larger units are added as required — a key reason early strength gains are neural.",category:"Muscle science",chapter:3},{q:"Lowering a dumbbell slowly is primarily which type of action?",options:["Concentric","Isometric","Eccentric","Ballistic"],answer:2,explanation:"Eccentric actions lengthen the muscle under load — important for control and a common cause of DOMS when unaccustomed.",category:"Muscle science",chapter:3},{q:"Holding a plank is an example of:",options:["Concentric","Eccentric","Isometric","Isokinetic"],answer:2,explanation:"Isometric actions produce force without changing muscle length.",category:"Muscle science",chapter:3},{q:"Which is the immediate energy source for muscle contraction?",options:["Glucose only","Fat only","ATP","Lactate"],answer:2,explanation:"ATP powers the cross-bridge cycle directly; the energy systems exist to regenerate ATP.",category:"Energy systems",chapter:4},{q:"The phosphagen (ATP-PC) system mainly fuels:",options:["Marathons","Maximal efforts of roughly up to 10 seconds","Hour-long walks","Sleep"],answer:1,explanation:"Stored ATP and phosphocreatine provide instant, high-power energy for very short maximal efforts.",category:"Energy systems",chapter:4},{q:"During a 400-metre sprint, the dominant energy contribution comes mainly from:",options:["Aerobic metabolism only","Anaerobic glycolysis, with all systems contributing","Fat oxidation only","Protein breakdown"],answer:1,explanation:"Hard efforts of tens of seconds to ~2 minutes rely heavily on glycolysis — but no system ever works alone.",category:"Energy systems",chapter:4},{q:"Which energy system has the largest capacity but ramps up slowest?",options:["Phosphagen","Anaerobic glycolysis","Aerobic (oxidative) metabolism","Protein oxidation"],answer:2,explanation:"Aerobic metabolism can sustain activity for hours using oxygen to oxidise carbohydrates and fats in mitochondria.",category:"Energy systems",chapter:4},{q:"Lactate:",options:["Is a poison that causes next-day soreness","Clears within hours and can be used as fuel by other tissues","Only forms during sleep","Is the same as lactic acid crystals in muscle"],answer:1,explanation:"Lactate is a normal fuel and clears quickly; DOMS is a separate process linked to muscle damage.",category:"Energy systems",chapter:4},{q:"Which is NOT one of the main components of fitness?",options:["Cardiovascular endurance","Muscular strength","Balance","Charisma"],answer:3,explanation:"Fitness components include endurance, strength, flexibility, mobility, balance, coordination, power and speed — not personality traits.",category:"Fitness components",chapter:5},{q:"Mobility differs from flexibility because mobility also requires:",options:["Longer holds","Strength and control through the range","A partner","Special shoes"],answer:1,explanation:"Flexibility is available range; mobility is actively controlled range — strength through range.",category:"Fitness components",chapter:5},{q:"Power is best defined as:",options:["Force produced slowly","Force produced quickly (strength × speed)","Endurance at low intensity","Flexibility of the spine"],answer:1,explanation:"Power underlies jumping, sprinting and quickly recovering balance.",category:"Fitness components",chapter:5},{q:"Cardiac output equals:",options:["Heart rate × stroke volume","Stroke volume ÷ heart rate","Blood pressure × heart rate","Heart rate − resting heart rate"],answer:0,explanation:"Cardiac output (Q) = HR × SV, and rises several-fold during exercise to deliver oxygen.",category:"Cardiovascular",chapter:7},{q:"Which vessels carry blood away from the heart?",options:["Veins","Arteries","Capillaries","Lymph ducts"],answer:1,explanation:"Arteries carry blood away from the heart (usually oxygen-rich, except the pulmonary artery); veins return it.",category:"Cardiovascular",chapter:7},{q:"With regular aerobic training, a typical adaptation is:",options:["Lower stroke volume","Increased stroke volume and capillary density","Higher resting heart rate","Smaller mitochondria"],answer:1,explanation:"The heart pumps more per beat, muscles gain capillaries and mitochondria, and submaximal heart rate falls.",category:"Cardiovascular",chapter:7},{q:"At moderate intensity, the talk test means you can:",options:["Sing comfortably","Talk but not sing","Say only a few words","Not talk at all"],answer:1,explanation:"Moderate = conversational; vigorous = only short phrases; light = can sing.",category:"Intensity",chapter:9},{q:"The “220 minus age” formula is:",options:["An exact measurement of your max heart rate","A population estimate with wide individual error","A measure of fitness","A medical clearance"],answer:1,explanation:"Individual maximal heart rate can differ from the estimate by 10–20+ bpm; combine zones with RPE and the talk test.",category:"Intensity",chapter:9},{q:"On the 0–10 RPE scale, general-health moderate effort is typically around:",options:["1–2","5–6","9–10","0"],answer:1,explanation:"Moderate is “fairly hard” (5–6/10); vigorous is 7–8+. RPE works without any device.",category:"Intensity",chapter:9},{q:"Wrist fitness trackers are best used for:",options:["Exact medical-grade heart rate","Trends and motivation — with error","Diagnosing conditions","Replacing how you feel"],answer:1,explanation:"Wearables estimate; symptoms and perceived exertion always outrank the screen.",category:"Intensity",chapter:9},{q:"WHO guidance for adults commonly recommends at least how much moderate aerobic activity per week?",options:["30 minutes","150–300 minutes","600 minutes","No amount specified"],answer:1,explanation:"150–300 min moderate, or 75–150 min vigorous, or an equivalent mix — plus strength work ≥2 days/week. Population guidance, not a personal prescription.",category:"Programming",chapter:10},{q:"A safe beginner running plan usually starts with:",options:["Running 10 km on day one","Run-walk intervals, 3 days/week, at conversational pace","Daily sprints","No warm-up needed"],answer:1,explanation:"Run-walk progression with rest days is the classic safe approach; increase volume gradually.",category:"Aerobic activities",chapter:12},{q:"The “10,000 steps” figure originated as:",options:["A WHO threshold","A marketing slogan, not a scientific requirement","A CDC mandate","A doctor's prescription"],answer:1,explanation:"Benefits rise well below 10,000 steps; increase from your own baseline.",category:"Aerobic activities",chapter:11},{q:"Swimming is considered low-impact because:",options:["Water is cold","Buoyancy unloads the joints while providing resistance","It requires no effort","It is only for children"],answer:1,explanation:"Water supports body weight, reducing joint load, while still providing full-body resistance.",category:"Aerobic activities",chapter:13},{q:"HIIT refers to:",options:["Only yoga","Alternating short hard intervals with recoveries","Training only once a week","Holding one long stretch"],answer:1,explanation:"HIIT is optional — continuous moderate activity also meets health guidance.",category:"Aerobic activities",chapter:14},{q:"Early strength gains in the first weeks of resistance training are mainly due to:",options:["Hypertrophy only","Neurological adaptations — better motor-unit recruitment and coordination","Bone growth","Fat loss"],answer:1,explanation:"The nervous system learns to recruit more units and coordinate better before muscle size changes much.",category:"Strength",chapter:15},{q:"The primary driver of muscle hypertrophy is considered to be:",options:["Muscle damage alone","Mechanical tension, with metabolic stress and damage also contributing","Soreness","Sweating"],answer:1,explanation:"Schoenfeld's review concludes tension is likely dominant, with the other mechanisms contributing.",category:"Strength",chapter:16},{q:"To build muscle over time, net muscle protein balance must be positive, supported by:",options:["Training only","Progressive training plus adequate protein, energy, sleep and recovery","Supplements only","Dehydration"],answer:1,explanation:"Adaptation happens during recovery — food and sleep are part of the programme.",category:"Strength",chapter:16},{q:"Which is a bodyweight progression of a push-up?",options:["Wall push-up is harder than floor push-up","Hands-elevated push-up is easier; feet-elevated is harder","Push-ups cannot be modified","Only machines work"],answer:1,explanation:"Incline/wall versions regress the load; decline and archer versions progress it.",category:"Strength",chapter:17},{q:"A hip hinge primarily trains:",options:["The chest","Hamstrings and glutes with a stable spine","The biceps","The calves only"],answer:1,explanation:"Hinging loads the posterior chain while protecting the lower back — practice the pattern with light load first.",category:"Movement patterns",chapter:17},{q:"When lifting a barbell from the floor, you should:",options:["Round the lower back","Keep the load close, back flat, brace the core and drive through hips and legs","Twist the torso mid-lift","Hold your breath"],answer:1,explanation:"Neutral spine, braced core, continuous breathing and feet turning (not twisting) protect the back.",category:"Strength",chapter:18},{q:"The main advantage of machines for beginners is:",options:["They build the most muscle","The guided path builds confidence and control with light loads","They are always safer","No adjustment needed"],answer:1,explanation:"Machines guide the path but don't train balance; combine with free-weight and bodyweight work.",category:"Strength",chapter:19},{q:"A balanced weekly programme should include which movement patterns?",options:["Only squats","Squat, hinge, push, pull, lunge, carry and some rotation","Only cardio","Only core"],answer:1,explanation:"Covering all patterns prevents imbalances and supports daily function.",category:"Programming",chapter:20},{q:"For shoulder health, a common guideline is:",options:["Only press, never pull","At least match push volume with pull volume","Avoid all pulling","Only machine work"],answer:1,explanation:"Modern life is push-heavy; balanced pulling supports shoulder health and posture.",category:"Strength",chapter:21},{q:"Which muscle group extends the knee?",options:["Hamstrings","Quadriceps","Biceps","Deltoids"],answer:1,explanation:"The quadriceps (front of thigh) straighten the knee — essential for standing and stairs.",category:"Strength",chapter:22},{q:"The core's main role during lifting is to:",options:["Move the spine more","Stabilise the trunk and manage pressure (bracing)","Relax completely","Hold breath"],answer:1,explanation:"Brace gently and breathe continuously; avoid the Valsalva manoeuvre under load.",category:"Strength",chapter:23},{q:"Visible abdominal definition depends mainly on:",options:["Doing hundreds of crunches","Genetics and overall body fat — not spot reduction","Core exercises alone","Sweating"],answer:1,explanation:"You cannot spot-reduce fat; abs visibility is largely genetic and systemic, and never a worth measure.",category:"Strength",chapter:23},{q:"Progressive overload means:",options:["Always training to failure","Gradually increasing training demand over time","Never increasing anything","Randomly changing workouts"],answer:1,explanation:"Add a little load, volume or difficulty over weeks while keeping technique and recovery.",category:"Programming",chapter:24},{q:"A deload week typically involves:",options:["Doubling volume","Reducing volume/load to ~50–70% for a week","Stopping all movement forever","Only cardio at max effort"],answer:1,explanation:"Deloads dissipate fatigue and let adaptation consolidate — usually every 4–8 weeks.",category:"Programming",chapter:24},{q:"ACSM guidance for most adults' strength training is roughly:",options:["1 set of 50 reps daily","2–4 sets of 8–12 reps, 2–3 days/week, with 2–3 min rest for heavy sets","Maximal singles daily","No strength training needed"],answer:1,explanation:"Ranges, not single answers — beginners may start with single sets and lighter loads.",category:"Programming",chapter:24},{q:"Active flexibility is:",options:["Range reached with a strap","Range you can reach and control with your own strength","Range after surgery only","Not real"],answer:1,explanation:"Active, controlled range is more functional than passive range alone.",category:"Flexibility & mobility",chapter:25},{q:"The preferred stretching style in a warm-up is usually:",options:["Long static holds","Dynamic, controlled movement","Ballistic bouncing","No stretching at all ever"],answer:1,explanation:"Reviews find dynamic stretching neutral-to-beneficial before activity; long static holds can transiently reduce power.",category:"Flexibility & mobility",chapter:27},{q:"Systematic reviews find that stretching:",options:["Prevents every injury","Improves range of motion but does not clearly prevent all injuries","Is dangerous for everyone","Builds maximal strength"],answer:1,explanation:"Stretching serves range and relaxation; injury prevention comes mainly from load management, strength and warm-up.",category:"Flexibility & mobility",chapter:27},{q:"Cartilage in joints is nourished mainly by:",options:["Blood vessels inside cartilage","The pumping action of movement squeezing synovial fluid in and out","Static sitting","Supplements"],answer:1,explanation:"Cartilage has no blood supply — regular, varied, pain-free movement keeps it healthy.",category:"Joints & balance",chapter:28},{q:"Balance relies on which sensory inputs?",options:["Vision, vestibular (inner ear) and proprioception","Hearing only","Taste only","Smell only"],answer:0,explanation:"These three systems feed the nervous system, which makes constant corrections. All are trainable.",category:"Joints & balance",chapter:29},{q:"For fall prevention in older adults, strong evidence supports:",options:["Avoiding
