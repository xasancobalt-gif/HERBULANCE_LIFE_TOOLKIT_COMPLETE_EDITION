th-information/digestive-diseases/irritable-bowel-syndrome",chapters:"Ch. 7, 8",supports:"IBS as a disorder of gut–brain interaction; symptoms, diagnosis and management including diet and psychological therapies.",kind:"Health authority"},{id:"nhs-ibs",source:"NHS (UK)",title:"Irritable bowel syndrome (IBS)",date:"Online health information page; accessed November 2026",url:"https://www.nhs.uk/conditions/irritable-bowel-syndrome-ibs/",chapters:"Ch. 7",supports:"Symptoms of IBS and the recommendation to seek medical assessment and dietitian support.",kind:"Health authority"},{id:"lacy2016",source:"Lacy BE, Mearin F, Chang L, et al.",title:"Bowel Disorders (Rome IV)",date:"Gastroenterology, 2016; 150(6): 1393–1407",url:"https://doi.org/10.1053/j.gastro.2016.02.031",chapters:"Ch. 7",supports:"Clinical criteria used by specialists to classify IBS and other functional bowel disorders.",kind:"Peer-reviewed"},{id:"nhs-ibd",source:"NHS (UK)",title:"Inflammatory bowel disease",date:"Online health information page; accessed November 2026",url:"https://www.nhs.uk/conditions/inflammatory-bowel-disease/",chapters:"Ch. 7",supports:"IBD as an umbrella term mainly for Crohn's disease and ulcerative colitis; distinction from IBS.",kind:"Health authority"},{id:"niddk-crohns",source:"NIDDK, NIH",title:"Crohn's Disease",date:"Online health information page; accessed November 2026",url:"https://www.niddk.nih.gov/health-information/digestive-diseases/crohns-disease",chapters:"Ch. 7",supports:"Chronic inflammation that can affect any part of the digestive tract; diagnosis and medical treatment.",kind:"Health authority"},{id:"niddk-uc",source:"NIDDK, NIH",title:"Ulcerative Colitis",date:"Online health information page; accessed November 2026",url:"https://www.niddk.nih.gov/health-information/digestive-diseases/ulcerative-colitis",chapters:"Ch. 7",supports:"Chronic inflammation and ulcers of the large intestine lining; symptoms and medical management.",kind:"Health authority"},{id:"monash-fo t varied between people.",kind:"Peer-reviewed"},{id:"porcari2025",source:"Porcari S, Mullish BH, Asnicar F, et al.",title:"International consensus statement on microbiome testing in clinical practice",date:"The Lancet Gastroenterology & Hepatology, 2025; 10(2): 154–167",url:"https://doi.org/10.1016/S2468-1253(24)00311-X",chapters:"Ch. 2, Myths",supports:"Expert consensus that there is currently insufficient evidence to recommend routine microbiome testing in clinical practice, and that self-prescribed tests are discouraged.",kind:"Peer-reviewed"},{id:"camilleri2019",source:"Camilleri M",title:"Leaky gut: mechanisms, measurement and clinical implications in humans",date:"Gut, 2019; 68(8): 1516–1526",url:"https://doi.org/10.1136/gutjnl-2019-318427",chapters:"Ch. 2, Myths",supports:"Intestinal permeability is a real, measurable property that can be altered in some diseases, but evidence does not support 'leaky gut' as a stand-alone diagnosis treated by commercial products.",kind:"Peer-reviewed"},{id:"cryan2019",source:"Cryan JF, O'Riordan KJ, Cowan CSM, et al.",title:"The Microbiota-Gut-Brain Axis",date:"Physiological Reviews, 2019; 99(4): 1877–2013",url:"https://doi.org/10.1152/physrev.00018.2018",chapters:"Ch. 8",supports:"Communication pathways between gut and brain (vagus nerve, enteric nervous system, immune and endocrine signalling, microbial metabolites); much microbiome–brain evidence comes from animal studies.",kind:"Peer-reviewed"},{id:"reynolds2019",source:"Reynolds A, Mann J, Cummings J, et al.",title:"Carbohydrate quality and human health: a series of systematic reviews and meta-analyses",date:"The Lancet, 2019; 393(10170): 434–445",url:"https://doi.org/10.1016/S0140-6736(18)31809-9",chapters:"Ch. 3, 4",supports:"Higher dietary fibre and whole-grain intakes are associated with lower risk of several non-communicable diseases (mainly observational evidence).",kind:"Peer-reviewed"},{id:"who-diet",source:"World Health Organization (WHO)",title:"Healthy diet — ional Scientific Association for Probiotics and Prebiotics consensus statement on the scope and appropriate use of the term probiotic",date:"Nature Reviews Gastroenterology & Hepatology, 2014; 11: 506–514",url:"https://doi.org/10.1038/nrgastro.2014.66",chapters:"Ch. 5",supports:"Definition of probiotics as live microorganisms that, when administered in adequate amounts, confer a health benefit on the host.",kind:"Peer-reviewed"},{id:"gibson2017",source:"Gibson GR, Hutkins R, Sanders ME, et al.",title:"Expert consensus document: The ISAPP consensus statement on the definition and scope of prebiotics",date:"Nature Reviews Gastroenterology & Hepatology, 2017; 14: 491–502",url:"https://doi.org/10.1038/nrgastro.2017.75",chapters:"Ch. 3, 5",supports:"Definition of a prebiotic as a substrate selectively utilised by host microorganisms conferring a health benefit.",kind:"Peer-reviewed"},{id:"swanson2020",source:"Swanson KS, Gibson GR, Hutkins R, et al.",title:"The ISAPP consensus statement on the definition and scope of synbiotics",date:"Nature Reviews Gastroenterology & Hepatology, 2020; 17: 687–701",url:"https://doi.org/10.1038/s41575-020-0344-2",chapters:"Ch. 5",supports:"Definition of synbiotics and the distinction between complementary and synergistic synbiotics.",kind:"Peer-reviewed"},{id:"marco2021",source:"Marco ML, Sanders ME, Gänzle M, et al.",title:"The ISAPP consensus statement on fermented foods",date:"Nature Reviews Gastroenterology & Hepatology, 2021; 18: 196–208",url:"https://doi.org/10.1038/s41575-020-00390-5",chapters:"Ch. 5",supports:"Definition of fermented foods; not all fermented foods contain live microbes when eaten, and fermented foods should not be called 'probiotic' without strain-specific evidence.",kind:"Peer-reviewed"},{id:"nccih-probiotics",source:"National Center for Complementary and Integrative Health (NCCIH), NIH",title:"Probiotics: What You Need To Know",date:"Online health information page; accessed November 2026",url:"https://www.nccih. "],timing:"Seconds to a few minutes per mouthful",fact:"Thinking about, smelling or seeing food can increase saliva flow — an early example of brain–gut communication.",care:"Chewing comfortably and not rushing meals can help some people feel more comfortable after eating.",color:"#a5482c"},{id:"oesophagus",name:"Oesophagus (esophagus)",short:"The muscular food pipe",role:"A muscular tube that moves swallowed food from the throat to the stomach using wave-like muscle contractions called peristalsis.",happens:["Peristalsis pushes food downward — it even works if you are upside down.","A ring of muscle at the bottom (the lower oesophageal sphincter) relaxes to let food into the stomach and closes to help keep stomach contents from flowing back up."],timing:"A few seconds",fact:"When the lower sphincter relaxes at the wrong time, stomach contents can flow back up — this is reflux.",care:"Persistent difficulty swallowing or food 'sticking' should always be checked by a health professional.",color:"#c9846b"},{id:"stomach",name:"Stomach",short:"Mixing, storing and starting protein digestion",role:"A stretchy muscular organ that stores food, churns it and mixes it with gastric juice containing hydrochloric acid and the enzyme pepsin, which begins protein digestion.",happens:["Muscles mix food into a semi-liquid called chyme.","Stomach acid helps digest protein and kills many microbes swallowed with food.","A protective mucus layer helps shield the stomach lining from its own acid.","Chyme is released gradually into the small intestine."],timing:"Roughly a few hours — varies with meal size and composition",fact:"Stomach contents are strongly acidic, which is one reason relatively few microbes live there compared with the large intestine.",care:"Fatty or very large meals usually stay longer in the stomach; some people find smaller meals more comfortable.",color:"#d38b6f"},{id:"liver",name:"Liver",short:"Makes bile and processes nutrients",role:"The liver produces bile, which helps digest fats, and processes nutrients absorbed from the small intestine. It also filters and processes many substances, including medicines and alcohol.",happens:["Makes bile continuously and sends it to the gallbladder for storage.","Receives nutrient-rich blood from the intestines via the portal vein.","Stores some nutrients and builds many of the proteins the body needs."],timing:"Works continuously",fact:"The liver already performs the body's 'detox' work. Healthy livers do not need special cleanse products.",care:"Limiting alcohol and following medicine instructions supports liver health. Yellowing skin or eyes needs prompt medical assessment.",color:"#8e4f3c"},{id:"gallbladder",name:"Gallbladder",short:"Stores and releases bile",role:"A small pouch under the liver that stores bile between meals and squeezes it into the small intestine when fat arrives.",happens:["Concentrates bile between meals.","Releases bile through the bile ducts into the duodenum after eating.","Bile emulsifies fat — breaking large droplets into tiny ones that enzymes can digest."],timing:"Releases bile mainly after meals",fact:"People can live without a gallbladder; bile then flows more directly from the liver into the intestine.",care:"Severe pain in the upper right abdomen, especially with fever or yellowing skin, needs urgent medical care.",color:"#6f7a33"},{id:"pancreas",name:"Pancreas",short:"Makes digestive enzymes and hormones",role:"The pancreas makes digestive juice containing enzymes that break down carbohydrates, fats and proteins, plus bicarbonate that neutralises stomach acid. It also produces hormones such as insulin.",happens:["Releases enzymes (amylase, lipase, proteases) into the small intestine.","Bicarbonate makes the intestinal environment suitable for enzymes to work.","Separately, releases insulin and glucagon into the blood to help regulate blood sugar."],timing:"Mainly after meals",fact:"The pancreas has two jobs: an 'exocrine' digestive role and an 'endocri ve?",options:["Stomach","Mouth","Large intestine (colon)","Liver"],answer:2,explain:"The colon has the densest microbial community. Stomach acid limits microbial numbers in the stomach."},{q:"Is there one ideal microbiome that everyone should aim for?",options:["Yes — and tests can tell you how far you are from it","No — healthy microbiomes vary greatly between people","Yes — the one with the most species","Only for adults"],answer:1,explain:"Large studies found healthy people have very different microbial compositions. There is no universal ideal."},{q:"According to recent estimates, how do bacterial cells compare with human cells in number?",options:["Bacteria outnumber us 100 to 1","Bacteria outnumber us 10 to 1","Roughly the same order of magnitude (about 1:1)","There are almost no bacteria in the body"],answer:2,explain:"A 2016 analysis revised the old '10 to 1' claim; bacterial and human cell numbers are of the same order of magnitude."}],Db=[{q:"Which is the best approach to increasing fibre?",options:["Add a large amount at once","Increase gradually and drink fluids","Use only fibre supplements","Avoid all fibre if you get gas"],answer:1,explain:"Gradual increases with adequate fluids give gut microbes and the bowel time to adjust, which can reduce gas and bloating."},{q:"Resistant starch is…",options:["Starch that causes allergies","Starch that escapes digestion in the small intestine and is fermented in the colon","A type of sugar","Only found in supplements"],answer:1,explain:"Resistant starch behaves much like fibre. Legumes, slightly green bananas and cooked-and-cooled potatoes or rice are sources."},{q:"Which food is a well-known source of the soluble fibre beta-glucan?",options:["Oats","White rice","Cheese","Chicken"],answer:0,explain:"Oats and barley are rich in beta-glucan, a soluble fibre that forms a gel in water."}],Ob=[{q:"What makes something a probiotic?",options:["It is fermented","It contains any bacteria","Live microorganisms shown to confe ig meal","A rumbling stomach before lunch"],answer:1,explain:"Blood in stool or black, tarry stools are warning signs that need prompt medical assessment."}];function Ub(){return i.jsxs(_t,{id:"ch1",number:1,title:"Understanding Your Digestive System",intro:"From the first bite to the final stage of elimination, digestion is a coordinated journey involving muscles, enzymes, hormones, nerves and microbes.",learn:["The organs of digestion","Chewing, swallowing and stomach acid","Enzymes, bile and absorption","How waste is formed and eliminated"],art:i.jsx(Pr,{className:"mx-auto h-auto w-full max-w-[300px]",title:"Simplified illustration of the digestive system"}),children:[i.jsxs("p",{className:"dropcap",children:["Digestion is the process of breaking food down into molecules small enough for the body to absorb and use — for energy, growth and repair. It involves two kinds of work. ",i.jsx("strong",{children:"Mechanical digestion"})," physically breaks food apart through chewing and the churning of the stomach. ",i.jsx("strong",{children:"Chemical digestion"})," uses digestive juices and enzymes to split large molecules — carbohydrates, proteins and fats — into simpler ones such as sugars, amino acids and fatty acids.",i.jsx(L,{ids:["niddk-digestive"]})]}),i.jsxs("p",{children:["The ",i.jsx("strong",{children:"gastrointestinal (GI) tract"})," is a long, continuous tube running from the mouth to the anus: the mouth, oesophagus, stomach, small intestine, large intestine and anus. Three other organs — the ",i.jsx("strong",{children:"liver"}),","," ",i.jsx("strong",{children:"gallbladder"})," and ",i.jsx("strong",{children:"pancreas"})," — are not part of the tube itself but produce or store digestive juices that flow into it. Nerves, hormones and the gut's resident microbes all help coordinate the process.",i.jsx(L,{ids:["niddk-digestive"]})]}),i.jsx(Zt,{number:"1.1",caption:"Original HERBULANCE illustration of the human digestive system. The liver, gallbladder and pancr })]}),i.jsx("p",{children:"These are comfort practices, not treatments. They may not suit everyone, and that's fine."})]}),i.jsx(Ut,{items:["The gut and brain communicate both ways through nerves, hormones, immune signals and microbial products.","Stress can affect digestion, and digestion can affect how we feel — but symptoms are not 'imaginary'.","Not all digestive conditions are caused by stress, and mindset alone does not cure them.","Sleep, physical activity and emotional support are part of overall digestive well-being.","Much research on the microbiome and the brain is still early, especially in humans."]})]})}function Pb(){const r=[["Eat a varied diet","Include a range of vegetables, fruits, legumes, whole grains, nuts and seeds over the week. Variety offers different fibres and nutrients.","who-diet"],["Chew comfortably and eat mindfully","Eating at a comfortable pace and chewing well may reduce swallowed air and help you notice fullness.","niddk-gas"],["Drink sufficient fluids","Respond to thirst, and drink more in heat, during activity or when increasing fibre — unless advised otherwise.","nhs-water"],["Increase fibre gradually where appropriate","Add fibre step by step over weeks; adjust based on comfort and any medical advice.","nhs-fibre"],["Move regularly","Choose activity you enjoy and can sustain. Movement supports regular bowel habits and overall well-being.","who-activity"],["Keep a consistent sleep routine","Similar sleep and wake times, and a gap between your last meal and lying down, help many people.","niddk-gerd"],["Manage stress in ways that work for you","Walking, breathing exercises, time with others, hobbies, prayer or meditation, or professional support.","niddk-ibs"],["Don't ignore persistent symptoms","Recurring or worsening symptoms deserve assessment. Warning signs need prompt care.","nhs-bowelcancer"],["Follow food hygiene practices","Clean, separate, cook and chill — protecting yourself from foodborne illness.","who-fivekeys"]];return i.jsxs(_t,{id:"ch9",number:9,title:"Everyday Habits for Digestive Well-Being",intro:"No single food or supplement transforms digestion. Small, consistent habits — adapted to your life — matter far more.",learn:["Nine evidence-informed habits","Adapting habits to your circumstances","Building a realistic routine","The Daily Habit Planner"],art:i.jsx(kb,{className:"mx-auto h-auto w-full max-w-[320px]"}),children:[i.jsx("p",{className:"dropcap",children:"The habits in this chapter are reasonable foundations for most people. They are not universal prescriptions. Your best routine depends on your health, culture, budget, work and family life, religious practices, abilities and preferences. Start with one or two changes that feel achievable, and build from there."}),i.jsx("div",{className:"not-prose my-8 grid gap-4 md:grid-cols-2 xl:grid-cols-3",children:r.map(([u,h,d],f)=>i.jsxs("article",{className:"rounded-2xl border border-ivory-300 bg-white p-5",children:[i.jsx("span",{className:"font-serif text-3xl text-terracotta",children:String(f+1).padStart(2,"0")}),i.jsxs("h3",{className:"mt-1 font-serif text-xl font-semibold text-forest",children:[u,i.jsx(L,{ids:[d]})]}),i.jsx("p",{className:"mt-1.5 text-sm leading-relaxed",children:h})]},u))}),i.jsx("h3",{children:"Adapting habits to real life"}),i.jsxs("ul",{children:[i.jsxs("li",{children:[i.jsx("strong",{children:"Shift work:"})," anchor meals and sleep to your shift pattern rather than the clock; plan portable, simple meals."]}),i.jsxs("li",{children:[i.jsx("strong",{children:"Religious fasting:"})," during periods such as Ramadan or Lent, focus on fluids, fibre and balanced meals in eating windows. People with medical conditions should seek advice before fasting."]}),i.jsxs("li",{children:[i.jsx("strong",{children:"Tight budgets:"})," dried or canned legumes, oats, frozen vegetables, seasonal produce and own-brand whole grains are among the most affordable fibre sources."]}),i.jsxs("li",{children:[i.jsx("strong",{children:"Limited cooking facilities:"})," overnight oats, canned beans, pre-washed salad, fruit and wholegrain bread need little or no cooking."]}),i.jsxs("li",{children:[i.jsx("strong",{children:"Disability or limited mobility:"})," chair-based movement, adaptive tools and pre-prepared ingredients make habits more accessible."]}),i.jsxs("li",{children:[i.jsx("strong",{children:"Existing conditions or pregnancy:"})," your clinical team's advice takes priority over general guidance."]})]}),i.jsx(We,{variant:"tip",title:"The 'one small step' method",children:i.jsx("p",{children:`Choose one habit. Make it specific ("add a handful of lentils to my soup on Tuesdays and Fridays"), link it to something you already do, and review after a week. If it worked, keep it and add another. If not, adjust — that's useful information, not failure.`})}),i.jsx(Ii,{topic:"weekly meal planning and grocery strategies for plant-forward eating"}),i.jsx(Jb,{}),i.jsx(Ut,{items:["Variety, comfortable eating, fluids, gradual fibre, movement, sleep, stress care, attention to symptoms and food hygiene form a strong foundation.","Habits should be adapted to your health, culture, budget and circumstances.","Start small, be specific, and review progress kindly.","Professional advice always takes priority for people with medical conditions."]})]})}const Af=[{id:"oats",title:"Overnight Oats with Kiwi, Seeds & Yoghurt",origin:"Global breakfast",image:"images/recipe-oats.jpg",alt:"Overnight oats in a glass jar layered with yoghurt, sliced kiwi, chia seeds and raspberries",intro:"A no-cook breakfast you prepare the night before. Oats provide beta-glucan, a soluble fibre; seeds and fruit add more fibre and texture.",prep:"10 min + overnight",cook:"None",serves:"2",fibre:"≈ 9–10 g",ingredients:["80 g (1 cup) rolled oats","250 ml (1 cup) milk or calcium-fortified plant drink","150 g (⅔ cup) plain yoghurt or plant-based yoghurt","1 tbsp (15 g) chia seeds","1 tbsp (10 g) ground flaxseed (linseed)","2 kiwifruit, peeled or well washed, sliced","Pinch of ground cinnamon","Optional: 1–2 tsp honey or maple syrup; a few berries"],steps:["In a bowl or two jars, stir together the oats, milk, yoghurt, chia, flaxseed and cinnamon.","Cover and refrigerate for at least 4 hours or overnight. The oats and chia absorb liquid and soften.","In the morning, stir. If too thick, add a splash of milk or water.","Top with sliced kiwi, berries and a little honey or maple syrup if you like. Eat within 2 days, kept refrigerated."],subs:["Kiwi → banana, papaya, mango, grated apple, or frozen berries (thawed).","Chia or flax → an extra 2 tbsp oats, or sunflower/pumpkin seeds.","Yoghurt → extra milk for a looser texture.","Rolled oats → quick oats (softer) — buy own-brand for savings."],nutrition:["Oat beta-glucan is a well-studied soluble fibre.","Yoghurt and milk (or fortified alternatives) contribute protein and calcium.","Chia and flax add fibre and plant omega-3 (ALA). Drink fluids alongside high-fibre breakfasts."],adjust:["Lactose intolerance: lactose-free milk and yoghurt.","Dairy allergy: fortified soy or pea-based drink and yoghurt.","Coeliac disease: oats may be contaminated with gluten; use certified gluten-free oats only if your clinician or dietitian advises they suit you.","Following a dietitian-guided low-FODMAP plan: check fruit choice and portion sizes with your dietitian or the Monash app."]},{id:"dal",title:"Red Lentil & Spinach Dal",origin:"South Asian–inspired",image:"images/recipe-dal.jpg",alt:"Golden red lentil dal with wilted spinach in a terracotta bowl, served with brown rice, lemon and coriander",intro:"A comforting, budget-friendly dal that cooks in about 30 minutes. Red lentils soften quickly, need no soaking and are rich in fibre and plant protein.",prep:"10 min",cook:"30 min",serves:"4",fibre:"≈ 7–8 g (dal only)",ingredients:["200 g (1 cup) red lentils, rinsed","1 tbsp vegetable oil or ghee","1 tsp cumin seeds","1 onion, finely chopped","2 garlic cloves, crushed","1 tbsp (about 2.5 cm / 1 inch) fresh ginger, grated","1 tsp ground turmeric and 1 tsp ground coriander","1 can (400 g / 14 oz) chopped tomatoes","750 ml (3 cups) water or low-salt vegetable stock","100 g (3½ oz) spinach, fresh or frozen","Salt to taste; juice of ½ lemon; fresh coriander","To serve: brown rice, roti or other flatbread"],steps:["Heat the oil in a large pan over medium heat. Add cumin seeds and let them sizzle for about 30 seconds.","Add the onion and cook for 6–8 minutes until soft and golden. Stir in garlic and ginger for 1 minute.","Add turmeric and coriander, stir for 30 seconds, then add tomatoes, lentils and water or stock.","Bring to the boil, then simmer gently, partly covered, for 20–25 minutes, stirring now and then, until lentils are soft and broken down. Add water if it gets too thick.","Stir in spinach until wilted. Season with salt and lemon juice; top with coriander.","Serve with brown rice or flatbread. Cool leftovers quickly and refrigerate; use within 2 days or freeze."],subs:["Spinach → kale, amaranth, moringa leaves, chard or frozen spinach.","Red lentils → yellow split peas or mung dal (cook longer).","Fresh ginger → ½ tsp ground ginger; fresh tomatoes → 3 chopped ripe tomatoes.","Use dried lentils bought in bulk for the lowest cost."],nutrition:["Lentils provide fibre, plant protein, folate and iron. Lemon juice adds vitamin C, which helps the body absorb plant iron.","Serving with brown rice adds wholegrain fibre; pairing legumes and grains is common in cuisines worldwide.","Start with smaller portions if you are new to lentils."],adjust:["Onion/garlic sensitivity (e.g. some people with IBS): use garlic-infused oil and the green tops of spring onions, if your dietitian agrees.","Dairy-free: use oil instead of ghee.","Naturally gluten-free — check stock cubes and spice blends for gluten (e.g. asafoetida is often mixed with wheat flour).","Low-salt: rely on spices and lemon; use water instead of stock."]},{id:"bowl",title:"Kimchi & Tofu Brown Rice Bowl",origin:"Korean-inspired",image:"images/recipe-bowl.jpg",alt:"Brown rice bowl with golden tofu cubes, kimchi, spinach, carrot, cucumber, edamame and sesame seeds",intro:"A colourful bowl combining whole grains, vegetables, soy protein and a spoonful of kimchi. Adding kimchi at the end, uncooked, preserves any live microbes it contains.",prep:"15 min",cook:"15 min (plus rice)",serves:"2",fibre:"≈ 8–9 g",ingredients:["300 g (about 2 cups) cooked brown rice","200 g (7 oz) firm tofu, pressed and cubed","1 tbsp neutral oil + 1 tsp toasted sesame oil","1 tbsp soy sauce or tamari","100 g (3½ oz) spinach","1 carrot, cut into thin matchsticks","½ cucumber, sliced","100 g (¾ cup) frozen shelled edamame, cooked","80–100 g (about ½ cup) refrigerated kimchi","1 spring onion, sliced; 1 tsp sesame seeds"],steps:["If cooking rice fresh, start it first. If using leftover rice, reheat until steaming hot throughout.","Pat tofu dry. Heat the neutral oil in a frying pan and cook tofu over medium-high heat for 8–10 minutes, turning until golden. Add soy sauce for the last minute.","In the same pan, wilt the spinach for 1–2 minutes with a few drops of sesame oil.","Cook edamame according to the packet (usually 3–5 minutes in boiling water); drain.","Divide rice between bowls. Arrange tofu, spinach, carrot, cucumber and edamame on top.","Add kimchi last, uncooked. Sprinkle with spring onion and sesame seeds."],subs:["Kimchi → sauerkraut or other refrigerated fermented vegetables, or omit.","Tofu → eggs, chickpeas, or leftover cooked beans.","Edamame → frozen peas; brown rice → millet, barley or white rice with extra vegetables.","Use whatever crunchy vegetables are seasonal: radish, cabbage, bean sprouts."],nutrition:["Tofu and edamame provide plant protein; calcium-set tofu can also contribute calcium.","Kimchi and soy sauce are high in salt — use modest amounts, especially if you've been advised to limit sodium.","Kimchi is a fermented food; whether it contains live microbes depends on how it was made and stored. It is not automatically 'probiotic'."],adjust:["Soy allergy: replace tofu and edamame with eggs/chickpeas and peas; use coconut aminos instead of soy sauce.","Fish/shellfish allergy or vegetarian: many kimchis contain fish sauce or salted shrimp — choose a labelled vegan kimchi.","Gluten-free: use certified gluten-free tamari.","Garlic/onion sensitivity: kimchi usually contains both — omit or seek advice."]},{id:"stew",title:"Black Bean, Sweet Potato & Corn Stew",origin:"Latin American–inspired",image:"images/recipe-stew.jpg",alt:"Bowl of black bean and sweet potato stew with corn, topped with coriander, avocado and lime",intro:"A hearty one-pot stew inspired by flavours from across Latin America — smoky, warming and generous in fibre. Leftovers improve overnight.",prep:"15 min",cook:"35 min",serves:"4",fibre:"≈ 12–15 g",ingredients:["1 tbsp vegetable or olive oil","1 onion, chopped; 2 garlic cloves, crushed","1 red pepper (capsicum), diced","2 tsp ground cumin, 1 tsp smoked paprika, ½ tsp dried oregano","1 large sweet potato (about 400 g / 14 oz), peeled or scrubbed, cut into 2 cm (¾ inch) cubes","2 cans (400 g / 14 oz each) black beans, drained and rinsed","1 can (400 g / 14 oz) chopped tomatoes","150 g (1 cup) sweetcorn, frozen or canned","500 ml (2 cups) low-salt vegetable stock","Juice of 1 lime; fresh coriander; salt and pepper","Optional to serve: avocado, plain yoghurt, corn tortillas or brown rice"],steps:["Heat oil in a large pot over medium heat. Cook onion and pepper for 6–7 minutes until softened; add garlic for 1 minute.","Stir in cumin, paprika and oregano for 30 seconds until fragrant.","Add sweet potato, beans, tomatoes and stock. Bring to the boil, then simmer, partly covered, for 20–25 minutes until the sweet potato is tender.","Stir in sweetcorn and cook 5 minutes more. Mash a few beans against the side of the pot to thicken, if you like.","Season with lime juice, salt and pepper. Top with coriander and avocado; serve with warm tortillas or rice.","Cool leftovers quickly in shallow containers; refrigerate and use within 2 days, or freeze."],subs:["Black beans → kidney, pinto, black-eyed peas or cowpeas; dried beans cooked in bulk are cheapest.","Sweet potato → pumpkin, squash, cassava, yam or potato.","Smoked paprika → regular paprika or a little chilli powder.","Fresh pepper → frozen mixed peppers."],nutrition:["Beans provide fibre, protein, potassium and folate; sweet potato with skin adds fibre and beta-carotene (vitamin A).","This is a high-fibre dish — if you're not used to beans, start with a smaller bowl and increase over time.","Rinsing canned beans reduces added salt."],adjust:["Bean sensitivity: start with ½ cup portions; well-rinsed canned beans are often better tolerated than home-cooked dried beans for some people.","Onion/garlic sensitivity: garlic-infused oil and spring onion greens, if your dietitian agrees.","Naturally gluten-free and vegan (skip yoghurt) — check stock cubes.","Nightshade concerns: omit pepper and paprika; use extra cumin and herbs."]},{id:"salad",title:"Mediterranean Barley, Chickpea & Herb Salad",origin:"Mediterranean & Middle Eastern–inspired",image:"images/recipe-salad.jpg",alt:"Pearl barley and chickpea salad with parsley, mint, cucumber, cherry tomatoes and red onion on a sage platter",intro:"A bright, herb-packed salad in the spirit of tabbouleh and grain salads from around the Mediterranean. Cooked-and-cooled barley adds chewiness and some resistant starch.",prep:"15 min",cook:"30 min (barley)",serves:"4",fibre:"≈ 10–11 g",ingredients:["150 g (¾ cup) pearl barley","1 can (400 g / 14 oz) chickpeas, drained and rinsed","1 cucumber, diced","200 g (about 1⅓ cups) cherry tomatoes, halved","½ small red onion, finely chopped","1 large bunch (about 30 g / 1 cup) flat-leaf parsley, chopped","1 small handful (about 10 g) fresh mint, chopped","3 tbsp extra-virgin olive oil; juice of 1 lemon","½ tsp ground cumin (optional); salt and pepper","Optional: 100 g (3½ oz) feta or a handful of olives"],steps:["Rinse barley and simmer in plenty of water for 25–30 minutes until tender but chewy. Drain well.","Spread barley on a tray to cool quickly, then refrigerate if not using within the hour.","Whisk olive oil, lemon juice, cumin, salt and pepper in a large bowl.","Add cooled barley, chickpeas, cucumber, tomatoes, onion, parsley and mint. Toss well.","Taste and adjust lemon and seasoning. Add feta or olives if using.","Keep refrigerated and eat within 2 days. Great as a packed lunch with an ice pack."],subs:["Barley → bulgur or freekeh (contain gluten), or quinoa, brown rice or buckwheat (gluten-free).","Chickpeas → white beans, lentils or black-eyed peas.","Parsley/mint → any soft herbs available, or finely shredded lettuce or cabbage.","Cherry tomatoes → regular tomatoes or roasted peppers."],nutrition:["Barley contains beta-glucan (soluble fibre); chickpeas add fibre and plant protein.","Cooking then cooling starchy grains increases resistant starch somewhat — always cool and refrigerate promptly for safety.","Olive oil provides mainly unsaturated fat; herbs and lemon add flavour without extra salt."],adjust:["Coeliac disease or gluten avoidance: barley contains gluten — use quinoa, rice or buckwheat.","Dairy-free: skip feta or use olives.","Onion sensitivity: omit red onion or use the green part of spring onions.","Legume sensitivity: start with half the chickpeas."]}];function tc({title:r,groups:u,filename:h}){const d=u.flatMap(v=>v.items),[f,g]=ie.useState(new Set),w=v=>g(y=>{const D=new Set(y);return D.has(v)?D.delete(v):D.add(v),D}),z=Math.round(f.size/d.length*100);return i.jsxs("div",{className:"not-prose my-6 rounded-3xl border border-ivory-300 bg-white p-5",children:[i.jsxs("div",{className:"flex flex-wrap items-center justify-between gap-3",children:[i.jsx("h3",{className:"font-serif text-xl font-semibold text-forest",children:r}),i.jsxs("div",{className:"flex items-center gap-3",childre gluten triggers damage to the small intestine lining."],["Colon","The main part of the large intestine, where water is absorbed and microbes ferment fibre."],["Constipation","Fewer bowel movements than usual for you, or hard, dry, difficult-to-pass stools."],["Crohn's disease","A type of IBD that can cause inflammation anywhere in the digestive tract."],["Dehydration","When the body loses more fluid than it takes in; a key risk with diarrhoea and vomiting."],["Diarrhoea (diarrhea)","Loose, watery stools, usually three or more times a day."],["Digestive enzymes","Proteins that speed up the breakdown of food into absorbable molecules (e.g. amylase, lipase, proteases)."],["Diversity (microbial)","How many different kinds of microbes are present and how evenly they are distributed."],["Duodenum","The first section of the small intestine, where bile and pancreatic juices enter."],["Dysbiosis","A loosely defined term for an imbalanced microbial community; it has no agreed precise definition."],["Dyspepsia","Indigestion: upper abdominal discomfort, burning or early fullness."],["Endoscopy","A procedure using a thin camera to look inside the digestive tract."],["Enteric nervous system","The network of nerve cells within the gut wall that helps control digestion."],["Fermentation","Transformation of food components by microorganisms — in food production or in the colon."],["Fermented food","Food made through desired microbial growth and enzymatic conversions of food components."],["FODMAPs","Fermentable Oligosaccharides, Disaccharides, Monosaccharides And Polyols — short-chain carbohydrates that may trigger symptoms in IBS."],["Food allergy","An immune system reaction to a food, which can be severe."],["Food intolerance","Difficulty digesting a food causing symptoms, without an immune reaction."],["Gastro-oesophageal reflux (GER/GERD)","Stomach contents flowing back into the oesophagus; GERD is frequent or complicated reflux."],["Gluten","A group of proteins found in wheat, barley and rye."],["Gut–brain axis","Two-way communication between the digestive system and the brain."],["IBD","Inflammatory bowel disease — chronic inflammatory conditions, mainly Crohn's disease and ulcerative colitis."],["IBS","Irritable bowel syndrome — a disorder of gut–brain interaction with recurring abdominal pain and altered bowel habits."],["Insoluble fibre","Fibre that does not dissolve in water and adds bulk to stool."],["Intestinal permeability","How easily substances pass across the gut lining; altered in some diseases."],["Lactase","The enzyme that digests lactose (milk sugar)."],["Lactic acid bacteria","Bacteria that produce lactic acid; important in yoghurt, sauerkraut, kimchi and many ferments."],["Microbiome","The community of microorganisms in an environment, together with their genes and surroundings."],["Microbiota","The microorganisms themselves living in a particular environment, such as the gut."],["Oesophagus (esophagus)","The muscular tube carrying food from the throat to the stomach."],["Oral rehydration solution","A precise mixture of water, salts and sugar that helps treat dehydration."],["Peristalsis","Wave-like muscle contractions that move food through the digestive tract."],["Prebiotic","A substrate selectively used by host microorganisms that confers a health benefit."],["Probiotic","Live microorganisms that, when given in adequate amounts, confer a health benefit."],["Resistant starch","Starch that escapes digestion in the small intestine and is fermented in the colon."],["Short-chain fatty acids (SCFAs)","Acetate, propionate and butyrate — produced when gut microbes ferment fibre."],["Soluble fibre","Fibre that dissolves or swells in water to form a gel."],["Strain","A specific genetic variant within a microbial species; probiotic effects are strain-specific."],["Synbiotic","A mixture of live microorganisms and substrates selectively used by host microbes that confers a health benefit."],["Ulcerative colitis","A type of IBD causing inflammation and ulcers in the lining of the large intestine."],["Villi","Tiny finger-like projections lining the small intestine that increase surface area for absorption."]],ry=[["Do I need a probiotic supplement to have a healthy gut?","No. Most people do not need probiotic supplements. Evidence supports specific strains for specific situations only. A varied diet with fibre-rich plant foods is the foundation; talk to a professional before using supplements, especially if you are unwell or immunocompromised.",["nccih-probiotics","nhs-probiotics"]],["Should I try a gut 'reset' or detox?","There is no good evidence that detoxes, cleanses or 'resets' improve gut health, and some can be harmful. Your liver, kidneys and gut already remove waste.",["nccih-detox"]],["Is bloating after beans a sign of intolerance?","Not necessarily. Beans contain carbohydrates that gut bacteria ferment, producing gas — a normal process. Smaller portions, gradual increases and rinsing canned beans can help. Persistent or severe bloating should be discussed with a doctor.",["niddk-gas"]],["Should I go gluten-free to improve digestion?","Only people with coeliac disease, wheat allergy or a clinician-confirmed need must avoid gluten. If you suspect coeliac disease, keep eating gluten until tested. Unnecessary gluten-free diets can be costly and lower in fibre.",["nhs-coeliac"]],["Are home microbiome tests worth it?","Current expert consensus is that there is insufficient evidence to recommend routine microbiome testing; results cannot diagnose or direct treatment on their own.",["porcari2025"]],["How do I know if a symptom is serious?","See the warning-signs section in Chapter 6. Blood in stool, black stools, unexplained weight loss, severe pain, persistent vomiting or significant dehydration need prompt medical care.",["nhs-bowelcancer"]],["Can teenagers follow this book?","Yes — it is written for readers aged 14+. Teenagers have higher nutritional needs for growth; avoid restrictive diets, and talk to a parent, carer, school nurse or doctor about ongoing symptoms.",[]],["Is the low-FODMAP diet good for everyone?","No. It is a short-term, structured approach for some people with IBS, best done with a trained dietitian. It is not a general healthy diet.",["monash-fodmap"]],["Does this book store my journal entries?","No. All tools run in your browser's memory only. Nothing is saved to cookies, local storage or servers, and entries disappear when you close or refresh the page.",[]]],cy=[{myth:"A 3-day gut reset can transform your microbiome.",truth:"Diet can shift microbes within days, but changes are often temporary. Long-term eating patterns matter far more than short 'resets'.",refs:["david2013"]},{myth:"Detox teas and colon cleanses remove toxins.",truth:"There's little compelling evidence for detox programmes, and colon cleansing can cause harm. The liver and kidneys handle detoxification.",refs:["nccih-detox"]},{myth:"Special supplements heal 'leaky gut'.",truth:"Intestinal permeability is real and studied in specific diseases, but 'leaky gut syndrome' is not an established diagnosis and commercial treatment products are unsupported.",refs:["camilleri2019"]},{myth:"One probiotic works for everyone.",truth:"Probiotic effects are strain-, dose- and condition-specific, and responses differ between people.",refs:["nccih-probiotics","wgo-probiotics"]},{myth:"All digestive problems come from poor microbiome diversity.",truth:"Digestive symptoms have many causes, including infections, intolerances, coeliac disease, inflammation and medicines. Diversity is not a diagnosis.",refs:["hmp2012"]},{myth:"Foods, herbs or supplements can cure digestive diseases.",truth:"No food or supplement has been shown to cure conditions like IBD or coeliac disease. Diet can be an important part of management alongside medical care.",refs:["niddk-crohns","niddk-celiac"]},{myth:"An expensive microbiome test will diagnose and solve my problems.",truth:"Experts conclude ther
