articularly with the onset of sexual activity), sports-related hydration and heat, use of supplements such as creatine and protein powders, and the emergence of conditions such as IgA nephropathy.","Rising rates of type 2 diabetes and obesity-related metabolic conditions in young people worldwide are a concern for long-term kidney health.","Young people with chronic kidney conditions transitioning from paediatric to adult services need structured support to take ownership of medicines, appointments and health decisions."],sci:["Adherence to medicines can dip during adolescence; transition programmes improve outcomes. Blood pressure checks in childhood and adolescence can detect hypertension early."],pr:["Teens can learn about their bodies, ask questions about supplements and practise managing their own health appointments."],sc:"Mateus, 16, with a kidney transplant since age 9, joins a transition clinic where he practises explaining his medicines to the adult team.",my:[["Supplements are needed for sport.","Most young athletes meet needs through food; supplements can affect test results and carry risks."]],rc:["UTIs, sports, supplements and emerging conditions are key teen issues.","Metabolic risk is rising in young people.","Structured transition improves outcomes."],rf:["niddk-child","niddk-uti"],bk:[14,11],fl:["Growth & hormones","New risks (sports, supplements)","Health literacy","Transition to adult care"]},{n:75,t:"Kidney Health During Pregnancy",fig:"pregnancy",obj:["Describe normal kidney changes in pregnancy","Explain pre-eclampsia and urinary infections in pregnancy","Recognise the importance of antenatal monitoring"],ex:["Pregnancy causes major kidney changes: renal blood flow and GFR increase by around 40–50%, so creatinine values typically fall. The kidneys and ureters may dilate (more often on the right) due to hormonal effects and compression — a normal finding that differs from obstruction.","Antenatal care includes blood pressure and urine checks. Pre-eclampsia — new high blood pressure after 20 weeks with protein in urine or other organ involvement — can affect kidneys, liver, brain and placenta. Symptoms may include severe headache, vision problems, upper abdominal pain and sudden swelling, but it can be silent.","UTIs are more likely to progress to kidney infection in pregnancy, which is why asymptomatic bacteriuria is screened for and treated in many countries."],sci:["People with pre-existing CKD, diabetes, hypertension, lupus or a kidney transplant need pre-pregnancy counselling and specialist antenatal care, as some medicines (for example, ACE inhibitors and some immunosuppressants) are unsafe in pregnancy. A history of pre-eclampsia is associated with later cardiovascular and kidney risk."],pr:["Attend antenatal appointments and report warning symptoms promptly."],sc:"Ayesha, 34 weeks pregnant, notices a severe headache and flashing lights. She calls her maternity unit and is assessed immediately for pre-eclampsia.",my:[["Lower creatinine in pregnancy means better kidneys.","It reflects normal increased GFR; normal ranges differ in pregnancy."]],sf:"Severe headache, vision changes, upper abdominal pain, sudden swelling, fever with back pain, or reduced fetal movements require urgent assessment.",rc:["GFR rises ~40–50% in pregnancy.","Pre-eclampsia can affect kidneys.","UTIs are more serious in pregnancy.","Pre-pregnancy counselling for existing kidney conditions."],rf:["nice-ng133","nhs-preec","niddk-uti"],bk:[17,18],fl:["Pregnancy hormones","GFR & blood flow rise","Antenatal BP/urine checks","Detect pre-eclampsia & UTI early"]},{n:76,t:"Kidney Health in Adulthood",fig:"risk",obj:["Identify adult kidney risk factors and screening opportunities","Describe workplace and lifestyle considerations","Plan preventive healthcare"],ex:["Adulthood is when most risk factors for CKD — hypertension, type 2 diabetes, cardiovascular disease and obesity-related metabolic changes — develop. Early detection and management have the greatest long-term impact.","Screening practices differ by country. Many guidelines recommend kidney testing (eGFR and urine ACR) for people with diabetes, hypertension, cardiovascular disease, a family history of kidney failure or other risk factors, rather than population-wide screening. Some countries run national health checks that include blood pressure and kidney-related tests.","Work environments, shift patterns, access to water and toilets, heat exposure, and time for healthcare all influence adult kidney health."],sci:["Risk calculators such as the Kidney Failure Risk Equation (KFRE) are used by clinicians to estimate the risk of progression in people with established CKD; national guidance (e.g., NICE NG203) incorporates such tools."],pr:["Know your blood pressure; if you have risk factors, ask about kidney tests; keep vaccinations up to date; and review medicines periodically."],sc:"Sanjay, 42, attends a workplace health check. His blood pressure is raised and he has a family history of diabetes. He books follow-up tests.",my:[["If I feel fine, I don't need check-ups.","Many kidney risk factors are silent."]],rc:["Most CKD risk factors develop in adulthood.","Targeted testing for at-risk groups.","Workplace conditions matter."],rf:["nice-ng203","kdigo-ckd","niddk-ckd-prev"],bk:[11,18],fl:["Know risk factors","Targeted testing","Early management","Regular review"]},{n:77,t:"Kidney Health in Older Adults",fig:"life",obj:["Describe age-related kidney changes","Explain medication sensitivity and dehydration risk","Discuss individualised decision-making"],ex:["On average, GFR declines gradually with age, though the rate varies greatly. Renal reserve, concentrating ability, sodium conservation and potassium excretion may also decline.","Older adults are more vulnerable to dehydration (reduced thirst, mobility or cognitive limitations), to adverse effects of medicines (especially when taking several — polypharmacy), and to acute kidney injury during illness.","Whether a lower eGFR in an older person represents disease or ageing is debated; KDIGO uses the same thresholds for all ages but emphasises risk assessment including albuminuria."],sci:["Decisions about kidney failure treatment in older adults should consider overall health, frailty, personal values and quality of life. Conservative kidney management may be the preferred choice for some people."],pr:["Regular medicine reviews, attention to fluid intake during hot weather and illness, and fall prevention support healthy ageing."],sc:"Margaret, 84, has her medicines reviewed after a fall. Her pharmacist identifies two medicines that could be reduced given her kidney function.",my:[["Kidney decline is inevitable and untreatable in older age.","Some decline is common, but risk factors remain manageable and care can be tailored."]],rc:["Average GFR declines with age (variable).","Higher dehydration and medicine risks.","Care is tailored to goals and frailty."],rf:["kdigo-ckd","nice-ng148","niddk-conserv"],bk:[15],fl:["Ageing kidneys","Reduced reserve","Medicine & dehydration sensitivity","Tailored, goal-based care"]},{n:78,t:"Understanding Kidney Function Tests",fig:"egfr",obj:["Explain creatinine, eGFR, cystatin C, urine ACR and urinalysis","Describe limitations of each test","Understand why tests are repeated"],ex:["Serum creatinine is the most common kidney blood test. It rises as GFR falls but is influenced by muscle mass, diet (cooked meat), creatine supplements, some medicines, age and sex. A person with high muscle mass may have a higher creatinine with normal kidneys; a frail person may have 'normal' creatinine despite reduced function.","Estimated GFR (eGFR) uses creatinine plus age and sex in an equation. The 2021 CKD-EPI equation, which removed race as a variable, is widely used in the US; other countries use other equations or adaptations. eGFR assumes stable kidney function and is less accurate in acute kidney injury, pregnancy, extremes of body size or muscle mass, amputation, and some diets. Cystatin C, a protein less affected by muscle mass, can be combined with creatinine for a more accurate estimate.","Urine albumin-to-creatinine ratio (ACR) detects albumin leakage on a spot urine sample — an early marker of kidney damage and cardiovascular risk. Because exercise, infection, fever and menstruation can temporarily raise ACR, abnormal results are usually confirmed on repeat samples. Urinalysis (dipstick and microscopy) checks for blood, protein, glucose, white cells, nitrites and crystals."],sci:["CKD diagnosis requires abnormalities persisting more than three months. Single results are snapshots. Imaging (ultrasound) and, in some cases, kidney biopsy provide further information."],pr:["Before a test, ask whether you should avoid heavy exercise or meat meals. Keep a record of your results over time and ask your clinician to explain trends."],sc:"Luis, a bodybuilder, is told his eGFR is 58. A cystatin C test and normal ACR suggest his kidney function is likely normal for him; his doctor plans follow-up.",my:[["eGFR is an exact measurement.","It is an estimate with known limitations."],["One high ACR result means kidney disease.","Confirmation on repeat samples is needed."]],sf:"Only qualified clinicians can interpret your test results in the context of your health.",rc:["Creatinine is influenced by muscle, diet and drugs.","eGFR is an estimate; cystatin C helps.","ACR detects early damage; confirm on repeat.","Persistence >3 months defines CKD."],rf:["medline-creat","medline-gfr","medline-acr","medline-ua","inker-2021","kdigo-ckd","niddk-tests"],fl:["Blood: creatinine ± cystatin C","eGFR estimated","Urine: ACR & urinalysis","Repeat & interpret clinically"]},{n:79,t:"Kidney Treatment, Dialysis, Transplantation and Long-Term Care",fig:"hd",obj:["Explain principles of haemodialysis and peritoneal dialysis","Describe kidney transplantation","Describe conservative kidney management and shared decision-making"],ex:["Dialysis replaces some kidney functions by removing waste and excess fluid. It relies on diffusion (solutes move from higher to lower concentration across a semi-permeable membrane) and ultrafiltration (fluid removed by pressure or osmotic gradients).","Haemodialysis (HD) pumps blood through an external filter (dialyser) and back. It usually requires vascular access — an arteriovenous fistula, graft or catheter — and is commonly done three times per week for several hours in a centre, though home and more frequent schedules exist. Peritoneal dialysis (PD) uses the lining of the abdomen (peritoneum) as the membrane: dialysis fluid is placed in the abdomen through a catheter, left to absorb waste, then drained — either manually several times daily (CAPD) or overnight by machine (APD).","Kidney transplantation places a healthy kidney from a living or deceased donor into the lower abdomen; the person's own kidneys usually remain. Transplantation generally offers better survival and quality of life than dialysis for suitable candidates but requires lifelong anti-rejection medicines. Conservative kidney management provides comprehensive supportive care without dialysis, focusing on symptom control and quality of life."],sci:["Dialysis does not replace the kidney's hormonal functions, so anaemia and bone disorder treatment continue. Access to dialysis and transplantation varies enormously worldwide, as documented by the ISN Global Kidney Health Atlas; in some regions, many people who need kidney replacement therapy cannot access it."],pr:["Shared decision-making — combining medical information with personal values, family situation, work and location — helps people choose the right path. Peer support from others on dialysis or with transplants can be valuable."],sc:"Kwabena compares HD and PD with his team. He chooses overnight APD so he can continue working, and is placed on a transplant waiting list.",my:[["Dialysis cures kidney failure.","Dialysis replaces some functions but is not a cure."],["A transplant lasts forever.","Transplants can last many years but may eventually fail; lifelong care is needed."]],sf:"Never skip or stop dialysis sessions or anti-rejection medicines without discussion with your care team.",rc:["Dialysis uses diffusion and ultrafiltration.","HD: external dialyser; PD: peritoneum.","Transplant: best option for many but requires lifelong medicines.","Conservative care is a valid choice."],rf:["niddk-hd","niddk-pd","niddk-tx","niddk-conserv","niddk-choose","nhs-dialysis","nhs-tx","isn-atlas"],bk:[13,20],fl:["Kidney failure","Education & shared decisions","HD / PD / transplant / conservative","Ongoing multidisciplinary care"]},{n:80,t:"Building a Lifelong Kidney Health Plan",fig:"plan",obj:["Integrate knowledge from all parts","Create a personal learning and prevention plan","Know how to seek reliable information and care"],ex:["A lifelong kidney health plan is not a diet or a supplement regime. It is a set of informed habits and relationships with healthcare: knowing your risk factors; measuring blood pressure; managing diabetes and cardiovascular risk with your care team; using medicines safely; staying active; eating balanced, culturally familiar meals with attention to sodium; drinking appropriately for your situation; avoiding tobacco; protecting yourself from heat and occupational hazards; and attending recommended tests.","If you live with a kidney condition, your plan will include specialist follow-up, individual nutrition advice, medication management and support for emotional wellbeing.","Reliable sources include national health services, kidney foundations, KDIGO and ISN. Be cautious of products and influencers making cure claims."],sci:["Prevention works at multiple levels: individual (habits), clinical (screening, treatment) and societal (salt reduction policies, safe water, heat protection laws, access to medicines and kidney replacement therapy)."],pr:["Use the Personal Lifelong Kidney Health Learning Plan worksheet and the 30-day challenge in this app to turn knowledge into steps. Revisit your plan yearly or when circumstances change."],sc:"Amara, whom we met in Chapter 1, completes the 30-day challenge. She now knows her blood pressure, has asked her GP about kidney tests given her family history, and shares what she learned with her parents.",my:[["Kidney health is only about drinking water.","It involves blood pressure, metabolic health, medicines, environment and healthcare access."]],sf:"Your plan should complement — never replace — advice from your healthcare team.",rc:["Know risks, measure, manage, protect, review.","Individual, clinical and societal prevention.","Use reliable sources and your care team."],rf:["niddk-ckd-prev","kdigo-ckd","who-salt","isn"],bk:[7,14,15,18],fl:["Know your risks","Measure & test","Manage with your team","Review yearly"]}],mt=[...Zy,...Jy,...$y,...ep,...tp,...ap,...ip,...np].sort((o,h)=>o.n-h.n),Yn=o=>mt.find(h=>h.n===o);function sp(o){return[o.t,...o.obj,...o.ex,...o.sci,...o.pr,o.sc,...o.my.flat(),o.sf??"",...o.rc].join(" ")}const ml=[{n:1,roman:"I",title:"Introduction to Kidney Health",blurb:"What the kidneys do, why they matter, what influences them and which popular beliefs do not hold up.",range:[1,8]},{n:2,roman:"II",title:"Kidney Anatomy and Renal Physiology",blurb:"From the outer capsule to the nephron: how blood becomes urine and how hormones steer the process.",range:[9,22]},{n:3,roman:"III",title:"Fluids, Electrolytes and Metabolic Balance",blurb:"Water, sodium, potassium, calcium, phosphate, magnesium and acid–base control.",range:[23,32]},{n:4,roman:"IV",title:"Urinary System and Bladder Health",blurb:"Ureters, bladder, urethra, urination and common urinary problems.",range:[33,42]},{n:5,roman:"V",title:"Common Kidney Diseases and Disorders",blurb:"Acute and chronic kidney conditions explained carefully and respectfully.",range:[43,54]},{n:6,roman:"VI",title:"Nutrition and Kidney Health",blurb:"Eviden ytes","Where is most magnesium reabsorbed?","Thick ascending limb of the loop of Henle."],["Electrolytes","Normal blood pH range?","About 7.35–7.45."],["Electrolytes","Main forms of renal acid excretion?","Ammonium and titratable acid."],["Electrolytes","What is hyponatraemia?","Low blood sodium concentration, usually due to relative water excess."],["Electrolytes","Salt to sodium conversion?","Salt ≈ sodium × 2.5."],["Kidney tests","What is creatinine?","A muscle waste product used to estimate kidney function."],["Kidney tests","Name three factors besides kidney function that affect creatinine.","Muscle mass, diet (cooked meat), creatine supplements, some medicines, age, sex."],["Kidney tests","What does eGFR stand for?","Estimated glomerular filtration rate."],["Kidney tests","When is eGFR unreliable?","In acute kidney injury, pregnancy, extremes of muscle mass/body size, amputation and some diets."],["Kidney tests","What is cystatin C?","A blood protein less affected by muscle mass, used to estimate GFR."],["Kidney tests","What does urine ACR measure?","Urine albumin-to-creatinine ratio — albumin leakage."],["Kidney tests","Why is ACR repeated before diagnosis?","Exercise, infection, fever and menstruation can temporarily raise it."],["Kidney tests","KDIGO GFR category G3a range?","45–59 mL/min/1.73 m²."],["Kidney tests","KDIGO albuminuria category A2?","ACR 3–30 mg/mmol (30–300 mg/g)."],["Kidney tests","What does a urinalysis examine?","Physical, chemical (dipstick) and microscopic features: blood, protein, glucose, white cells, nitrites, crystals."],["Kidney tests","Which 2021 equation removed race from eGFR?","The 2021 CKD-EPI equation."],["Kidney tests","How long must abnormalities persist to define CKD?","More than three months."],["Urinary health","Most common bacterium causing UTIs?","Escherichia coli (E. coli)."],["Urinary health","Cystitis vs pyelonephritis?","Cystitis = bladder infection; pyelonephritis = kidney infection."],["Urinary health","Why are U  glomerulonephritis?","Inflammation of the glomeruli."],["Prevention","WHO adult sodium recommendation (general population)?","Less than 2 g sodium (≈5 g salt) per day."],["Prevention","What is the NSAID 'triple whammy'?","NSAID + diuretic + ACE inhibitor/ARB, raising AKI risk."],["Prevention","Can herbal 'kidney cleanses' improve kidney function?","No credible evidence; some herbs (e.g., aristolochic acid) are nephrotoxic."],["Prevention","Three heat-stress prevention measures?","Water, rest, shade (plus acclimatisation)."],["Prevention","Why can excessive water be dangerous?","It can cause hyponatraemia."],["Prevention","What phrase on labels signals phosphate additives?","Ingredients containing 'phos' (e.g., sodium phosphate, phosphoric acid)."],["Prevention","Is potassium restriction needed for everyone with CKD?","No — only when indicated by blood tests and clinical circumstances."],["Prevention","Why is smoking cessation important for kidneys?","Smoking speeds CKD progression and raises kidney/bladder cancer and cardiovascular risk."],["Treatment","Two principles of dialysis?","Diffusion and ultrafiltration."],["Treatment","What is a dialyser?","The filter ('artificial kidney') used in haemodialysis."],["Treatment","Membrane used in peritoneal dialysis?","The peritoneum (abdominal lining)."],["Treatment","CAPD vs APD?","CAPD: manual daytime exchanges; APD: overnight machine exchanges."],["Treatment","Preferred long-term haemodialysis access?","Arteriovenous fistula (where suitable)."],["Treatment","Where is a transplanted kidney usually placed?","Lower abdomen (iliac fossa); native kidneys usually remain."],["Treatment","Why do transplant recipients take lifelong medicines?","To prevent rejection (immunosuppression)."],["Treatment","What is conservative kidney management?","Comprehensive supportive care for kidney failure without dialysis."],["Treatment","Medicine class shown to slow CKD by acting in the proximal tubule?","SGLT2 inhibitors."],["Treatment","Doe st can review and suggest discussing alternatives with her doctor.",sf:"Elena should not stop prescribed medicines herself; she should seek a review.",l:["Keep a complete medicine list.","Ask before using OTC painkillers."],ch:[69,43,77]},{t:"Working in extreme heat",s:"Diego, 29, works in construction in a hot climate, often 10 hours a day with limited water access.",c:["Heat stress","Kidney perfusion","Occupational health"],q:["How does heat affect kidney blood flow?","Which workplace measures help?"],d:"Heat diverts blood to the skin and sweat depletes volume, lowering kidney perfusion. Water, rest, shade and acclimatisation are recommended by occupational agencies.",sf:"Confusion or collapse in heat is an emergency.",l:["Heat safety is a shared employer–worker responsibility."],ch:[72,71,31]},{t:"Confused by a creatinine result",s:"Luis, 31, a competitive bodybuilder who uses creatine supplements, is told his eGFR is 58.",c:["Creatinine limitations","Cystatin C","Muscle mass"],q:["What factors could raise his creatinine without kidney disease?","What additional tests might clarify?"],d:"High muscle mass and creatine supplements raise creatinine. Cystatin C-based eGFR and urine ACR can help; repeat testing over time is needed.",sf:"Only his clinician can interpret his results.",l:["eGFR is an estimate, not a perfect measure."],ch:[78,29]},{t:"Understanding albuminuria",s:"Deepa, 55, has a urine ACR of 8 mg/mmol on a routine test. She feels perfectly well.",c:["Albuminuria","KDIGO categories","Cardiovascular risk"],q:["Which albuminuria category might this fall into?","Why would her clinician repeat the test?"],d:"3–30 mg/mmol corresponds to A2 in KDIGO categories. Repeat testing confirms persistence, as exercise, infection or fever can raise ACR temporarily.",sf:"Category labels are educational; diagnosis is clinical.",l:["Albuminuria is an early and important marker."],ch:[44,78,12]},{t:"Recurrent urinary infections",s:"Aisha, 27, has had three bladder infections in a year.",c:["UTI risk factors","Antibiotic stewardship","Prevention"],q:["What risk factors might contribute?","Why is urine culture sometimes recommended?"],d:"Anatomy, sexual activity and other factors increase risk. Culture identifies bacteria and antibiotic sensitivity, supporting appropriate antibiotic use.",sf:"Fever, back pain or vomiting suggests kidney infection — seek urgent care.",l:["Recurrent UTIs deserve assessment, not just repeated self-treatment."],ch:[39,50]},{t:"Learning about kidney stones",s:"Kofi, 40, had a calcium oxalate stone after a hot summer. His friend tells him to stop eating dairy.",c:["Supersaturation","Stone types","Calcium–oxalate binding"],q:["Why might cutting dairy be unhelpful?","What information guides prevention?"],d:"Adequate dietary calcium binds oxalate in the gut. Stone analysis and urine testing guide individual prevention.",sf:"Stone pain with fever needs emergency care.",l:["Stone prevention is tailored to stone type."],ch:[40,33]},{t:"Kidney monitoring in pregnancy",s:"Ayesha, 32, is pregnant for the first time and wonders why her urine and blood pressure are checked at every visit.",c:["Pregnancy physiology","Pre-eclampsia","UTI in pregnancy"],q:["How does GFR change in pregnancy?","Which symptoms need urgent assessment?"],d:"GFR rises about 40–50%. Severe headache, vision changes, upper abdominal pain and sudden swelling may indicate pre-eclampsia.",sf:"Report warning symptoms immediately to maternity services.",l:["Routine antenatal checks detect silent problems."],ch:[75]},{t:"Family history of PKD",s:"Clara, 25, learns her mother has ADPKD and wonders about her own risk.",c:["Autosomal dominant inheritance","Genetic counselling","Screening"],q:["What is her chance of inheriting ADPKD?","What might genetic counselling cover?"],d:"50% for a child of an affected parent. Counselling covers testing options, implications for insurance and family planning, and monitoring.",sf:"Decisions about testing are personal an
