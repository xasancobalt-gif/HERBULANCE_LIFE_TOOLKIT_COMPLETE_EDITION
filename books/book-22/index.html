 due to obstruction or some neurological conditions), back-pressure can damage the upper urinary tract."],pr:["Pelvic floor muscle training, guided by health professionals such as physiotherapists, can help some forms of bladder leakage."],sc:"A pelvic health physiotherapist explains to Rosa how the external sphincter and pelvic floor work together, using a diagram similar to the one in this chapter.",my:[["Bladder size decides how often you urinate.","Frequency depends on fluid intake, bladder sensation, habits, medicines and conditions, not just capacity."]],rc:["Detrusor relaxes to fill and contracts to empty.","Trigone lies between ureteric and urethral openings.","Internal (involuntary) and external (voluntary) sphincters."],rf:["niddk-ut","niddk-bladder"],fl:["Bladder fills","Detrusor relaxes (low pressure)","Sphincters stay closed","Signal to void when appropriate"]},{n:35,t:"The Urethra and Urination",fig:"urinary",obj:["Compare urethral anatomy in females and males","Relate anatomy to infection and flow problems","Describe the prostate's relevance"],ex:["The female urethra is about 3–4 cm long and opens between the clitoris and the vaginal opening. Its short length and proximity to the anus and vagina make it easier for bacteria to reach the bladder.","The male urethra is about 18–20 cm long and has prostatic, membranous and spongy (penile) parts. It carries both urine and semen.","The prostate gland surrounds the first part of the male urethra. Benign prostatic enlargement is common with ageing and can narrow the urethra, causing a weak stream, hesitancy, frequent night-time urination and incomplete emptying."],sci:["People of all sexes and genders can experience urinary conditions; anatomy, hormones (such as reduced oestrogen after menopause, which affects urethral and vaginal tissues), pregnancy, surgery and neurological conditions all influence urinary function."],pr:["Changes in flow, especially with pain, blood or inability to urinate, should be assessed by a clinician."],sc:"George, 64, notices he gets up three times a night to urinate. His GP discusses prostate enlargement and other possible causes and arranges assessment.",my:[["Urinary problems in older men are just ageing.","They are common but often treatable; assessment rules out other conditions."]],rc:["Female urethra ~3–4 cm; male ~18–20 cm.","Short urethra raises UTI risk.","Prostate enlargement can obstruct flow."],rf:["niddk-ut","niddk-retention"],bk:[15],fl:["Bladder neck","Urethra (sex differences)","External sphincter","Urine exits"]},{n:36,t:"The Process of Micturition",fig:"reflex",obj:["Describe the micturition reflex","Explain the roles of sympathetic, parasympathetic and somatic nerves","Explain how the brain controls timing"],ex:["Micturition (urination) is coordinated by nerves linking the bladder, spinal cord and brain. During filling, sympathetic nerves relax the detrusor and tighten the internal sphincter, while somatic nerves keep the external sphincter closed.","Stretch receptors in the bladder wall send signals to the spinal cord and to a coordinating centre in the brainstem (the pontine micturition centre). Higher brain areas assess whether it is socially appropriate to urinate.","When the decision is made, the pontine centre activates parasympathetic nerves that contract the detrusor, while the internal and external sphincters relax. The pelvic floor relaxes and urine flows."],sci:["In infants, micturition is a spinal reflex; voluntary control develops during early childhood. Spinal cord injury, multiple sclerosis, stroke, diabetes-related nerve damage and Parkinson's disease can disrupt this coordination, causing urgency, incontinence or retention."],pr:["Bladder training programmes and pelvic floor exercises work by retraining these pathways. They should be guided by a health professional when symptoms are troublesome."],sc:"A toddler is learning toilet skills. The family learns that bladder control depends on nervous system maturation, so pressure and punishment are unhelpful.",my:[["Urination is purely voluntary.","It is a reflex modulated by voluntary brain control."]],rc:["Filling: sympathetic + somatic keep bladder relaxed and closed.","Voiding: parasympathetic contracts detrusor; sphincters relax.","Brainstem and cortex coordinate timing."],rf:["niddk-ut","niddk-bladder"],fl:["Stretch receptors signal","Brain decides timing","Parasympathetic contracts detrusor","Sphincters relax → voiding"]},{n:37,t:"Understanding Normal Urination Patterns",fig:"hydration",obj:["Describe typical variation in urination frequency","List factors affecting urination patterns","Recognise changes worth discussing with a clinician"],ex:["There is no single 'normal' number of times to urinate. Many adults urinate roughly 4–8 times during the day and 0–1 times at night, but this depends on how much is drunk, the type of drinks (caffeine and alcohol increase urine output), climate, activity, age, pregnancy and medicines such as diuretics.","Urinary frequency can increase with infection, overactive bladder, high blood glucose, pregnancy, anxiety or prostate enlargement. Nocturia — waking at night to urinate — becomes more common with age and may relate to fluid intake in the evening, sleep problems, heart failure, sleep apnoea or nocturnal polyuria.","A bladder diary — recording drinks, urination times and volumes for a few days — is a common tool used by clinicians to understand patterns."],sci:["Nocturnal urine production normally falls partly because of a night-time ADH rise. This rhythm can weaken with age, contributing to nocturia."],pr:["A sudden or persistent change in your usual pattern, especially with pain, blood, fever, thirst or weight loss, is worth discussing with a clinician."],sc:"Hannah keeps a three-day bladder diary before seeing her nurse, which helps identify that afternoon coffee contributes to her frequency.",my:[["Waking to urinate is always a kidney problem.","Nocturia has many causes, including evening fluid intake, sleep issues, prostate enlargement and heart conditions."]],rc:["Wide normal variation.","Drinks, medicines, age and conditions influence patterns.","Bladder diaries help clinicians."],rf:["niddk-bladder","nhs-incont"],bk:[12],fl:["Fluid & caffeine intake","Kidney output varies","Bladder signals","Personal pattern emerges"]},{n:38,t:"Urine Colour, Appearance and Odour",fig:"urinecolour",obj:["Describe common causes of urine colour variation","Understand the limits of colour as a hydration guide","Know which changes need assessment"],ex:["Urine gets its yellow colour mainly from urochrome, a pigment from haemoglobin breakdown. Pale straw to light yellow is common; darker amber often reflects concentrated urine.","Foods and medicines can change colour: beetroot, blackberries and rhubarb may cause pink or red urine; B vitamins can cause bright yellow; some medicines cause orange, blue or green. Cloudiness can result from phosphate crystals after meals, mucus or infection. Foamy urine can occur with a forceful stream but persistent foam may reflect protein.","Odour changes with concentration, foods (asparagus) and some infections. A sweet or fruity smell can occur with very high blood glucose and ketones."],sci:["Red or brown urine may be caused by blood (haematuria), muscle breakdown products (myoglobin) or foods. Visible blood in urine always warrants medical assessment, even if painless and short-lived, because it can reflect infection, stones, glomerular disease or cancers of the urinary tract."],pr:["Urine colour charts can be a rough everyday hydration hint for some healthy people but are not diagnostic, and are unreliable when taking vitamins or certain medicines."],sc:"Yusuf notices pink urine after a beetroot salad and wonders if it is blood. It clears within a day. He learns that persistent or unexplained red urine would warrant assessment.",my:[["Colour can diagnose kidney disease.","It cannot. Kidney disease is diagnosed with blood and urine tests and clinical assessment."]],sf:"Seek medical assessment for visible blood in urine, brown/cola-coloured urine, or persistent unexplained colour change. Seek urgent care if accompanied by fever, severe pain, clots, inability to urinate or feeling very unwell.",rc:["Urochrome gives yellow colour.","Foods, vitamins and medicines change colour.","Visible blood always needs assessment."],rf:["niddk-hematuria","medline-ua","nhs-dehyd"],fl:["Observe colour/odour","Consider food, vitamins, medicines","Consider concentration","Persistent/red/brown → assessment"]},{n:39,t:"Urinary Tract Infections",fig:"uti",obj:["Distinguish lower from upper urinary tract infection","Identify risk factors and symptoms","Understand antibiotic stewardship"],ex:["Urinary tract infections (UTIs) usually occur when bacteria — most commonly Escherichia coli from the bowel — enter the urethra and multiply. Infection of the bladder is cystitis (lower UTI). Infection spreading to the kidney is pyelonephritis (upper UTI).","Lower UTI symptoms include burning or pain on urination, frequency, urgency, lower abdominal discomfort, and cloudy, smelly or bloody urine. Upper UTI may cause fever, shivering, flank pain, nausea and vomiting. Older adults may show confusion or a change in behaviour instead of typical symptoms.","Risk factors include female anatomy, sexual activity, pregnancy, menopause, urinary catheters, incomplete bladder emptying, kidney stones, diabetes and abnormalities of the urinary tract. In children, UTIs need medical assessment because they can signal anatomical problems."],sci:["Treatment decisions belong to clinicians. Some uncomplicated lower UTIs are managed with short antibiotic courses; others require urine culture. Antibiotic resistance is a growing global problem, and national guidance (such as NICE NG109 in England) aims to use antibiotics appropriately. Bacteria in urine without symptoms (asymptomatic bacteriuria) usually does not need treatment except in specific situations such as pregnancy."],pr:["Practical steps that may reduce risk for some people include not delaying urination for long periods, urinating after sex, and managing constipation. Evidence for cranberry products is mixed and modest; they are not a treatment for an active infection."],sc:"Aisha, 27, has burning on urination for two days. She consults a pharmacist, who assesses her and advises seeing a doctor because she also has back pain and a temperature.",my:[["UTIs always clear on their own.","Some do, but untreated infections can spread to the kidneys. Seek advice."],["Cranberry juice cures UTIs.","It does not treat active infection."]],sf:"Seek urgent care for fever with flank pain, vomiting, confusion, or UTI symptoms in pregnancy, in young children or in men.",rc:["Cystitis = bladder; pyelonephritis = kidney.","E. coli is the commonest cause.","Fever and flank pain suggest upper UTI.","Antibiotics are prescribed by clinicians."],rf:["niddk-uti","nhs-uti","nice-ng109","medline-uti"],bk:[20],fl:["Bacteria enter urethra","Bladder infection (cystitis)","May ascend ureters","Kidney infection (pyelonephritis)"]},{n:40,t:"Kidney Stones and Urinary Calculi",fig:"stone",obj:["Describe how stones form","Name common stone types","Explain risk factors and why prevention is individual"],ex:["Kidney stones form when urine becomes supersaturated with stone-forming substances — so concentrated that crystals form, grow and clump together. Factors that inhibit crystallisation (such as citrate) and urine volume both matter.","Calcium oxalate stones are the most common type. Others include calcium phosphate, uric acid, struvite (associated with certain infections) and cystine (from an inherited disorder). According to NIDDK, kidney stones are common in the United States, and frequency differs among countries and climates.","Risk factors include low urine volume, hot climates and dehydration, diets high in sodium and animal protein, obesity, diabetes, gout, some bowel conditions and surgeries, certain medicines, family history and some inherited conditions."],sci:["Small stones may pass on their own. Larger stones or those causing obstruction or infection may need procedures such as shock wave lithotripsy, ureteroscopy or percutaneous nephrolithotomy. Prevention is tailored to stone type and urine chemistry: for example, people with calcium oxalate stones are generally not advised to cut dietary calcium, because adequate calcium binds oxalate in the gut."],pr:["Clinicians commonly advise people who have had stones to maintain enough fluid intake to produce plenty of urine, but specific targets are individual. Stone analysis and 24-hour urine testing may guide prevention."],sc:"Diego, a delivery driver in a hot city, has a calcium oxalate stone. His urologist discusses fluid habits, salt intake and why he should not cut out dairy.",my:[["Avoid all calcium to prevent stones.","Low calcium diets can increase oxalate absorption and stone risk for many people."],["All stones are the same.","Stone type determines prevention."]],sf:"Stone pain with fever, chills, vomiting or inability to urinate requires emergency care.",rc:["Supersaturation → crystals → stones.","Calcium oxalate most common.","Low urine volume, heat, diet and genetics contribute.","Prevention depends on stone type."],rf:["niddk-stones","nhs-stones","medline-stones"],bk:[10],fl:["Concentrated urine","Crystals nucleate","Crystals grow & aggregate","Stone may obstruct flow"]},{n:41,t:"Urinary Incontinence and Bladder Control",fig:"bladder",obj:["Describe stress, urge, mixed, overflow and functional incontinence","Identify contributing factors","Know that effective help exists"],ex:["Urinary incontinence — involuntary leakage of urine — is common and affects people of all ages, particularly women after childbirth or menopause and older adults. It is not an inevitable part of ageing.","Stress incontinence occurs with coughing, sneezing, laughing or exercise, due to weak pelvic floor support. Urge incontinence occurs with sudden strong urges (overactive bladder). Mixed incontinence combines both. Overflow incontinence occurs when the bladder does not empty and leaks. Functional incontinence occurs when mobility or cognitive problems prevent reaching a toilet in time.","Contributing factors include pregnancy and childbirth, menopause, prostate surgery, obesity-related pressure, chronic cough, constipation, neurological conditions and some medicines."],sci:["First-line treatments include pelvic floor muscle training, bladder training and lifestyle adjustments, ideally supervised by trained professionals. Medicines, devices and surgery are options for some people."],pr:["Many people delay seeking help because of embarrassment. Health professionals discuss incontinence routinely, and effective treatment can greatly improve quality of life."],sc:"Gloria, 58, has stopped attending her dance class due to leakage. Her GP refers her to a pelvic health physiotherapist; after three months of training she returns to dancing.",my:[["Incontinence is normal with ageing and untreatable.","It is common but often improves with treatment."],["Drinking less is the best solution.","Restricting fluids can concentrate urine and irritate the bladder; seek tailored advice."]],rc:["Types: stress, urge, mixed, overflow, functional.","Pelvic floor and bladder training are first-line.","Help is available; there is no need for shame."],rf:["nhs-incont","niddk-bladder"],bk:[14,15],fl:["Identify type","Pelvic floor / bladder training","Address contributors","Medicines/devices/surgery if needed"]},{n:42,t:"Urinary Retention and Obstruction",fig:"obstruction",obj:["Distinguish acute from chronic urinary retention","Identify causes of urinary tract obstruction","Recognise emergencies"],ex:["Urinary retention is the inability to empty the bladder fully. Acute retention is a sudden, painful inability to urinate — a medical emergency usually relieved with a catheter. Chronic retention develops gradually, may be painless, and can cause frequency, weak stream, leakage and repeated infections.","Causes include prostate enlargement, urethral narrowing (stricture), constipation, some medicines (such as certain antihistamines, decongestants, antidepressants and opioids), nerve problems, and after anaesthesia or surgery.","Obstruction can occur anywhere from the kidney to the urethra: stones, tumours, blood clots, strictures or external compression. Prolonged obstruction raises pressure upstream and can cause hydronephrosis and kidney damage."],sci:["Relieving obstruction early can allow kidney function to recover; prolonged obstruction may cause permanent loss. After relief of significant obstruction, some people produce large volumes of urine temporarily (post-obstructive diuresis) and are monitored."],pr:["Check medicine leaflets and ask a pharmacist if a new medicine affects urination, especially if you have prostate enlargement."],sc:"Samuel, 70, takes an over-the-counter cold remedy and later cannot urinate, with severe lower abdominal pain. He attends an emergency department, where a catheter relieves the retention.",my:[["If you can't urinate, just wait.","Inability to urinate with pain is an emergency."]],sf:"Inability to pass urine, especially with pain or a swollen lower abdomen, requires emergency care.",rc:["Acute retention = emergency.","Chronic retention may be silent.","Obstruction anywhere can damage kidneys.","Early relief protects function."],rf:["niddk-retention","nhs-aki"],bk:[15],fl:["Blockage occurs","Pressure builds upstream","Hydronephrosis","Kidney function at risk → relieve early"]}],ap=[{n:43,t:"Acute Kidney Injury",fig:"aki",obj:["Define acute kidney injury (AKI)","Classify causes as pre-renal, intrinsic and post-renal","Distinguish AKI from CKD"],ex:["Acute kidney injury is a sudden decline in kidney function over hours to days. KDIGO defines it using a rise in serum creatinine — for example, an increase of at least 0.3 mg/dL (26.5 µmol/L) within 48 hours or to 1.5 times baseline within seven days — or a reduced urine output for several hours.","Causes are traditionally grouped: pre-renal (reduced blood flow from dehydration, blood loss, heart failure or sepsis), intrinsic (damage to kidney tissue from prolonged low blood flow, toxins, some medicines, contrast agents in susceptible people, muscle breakdown, or inflammation), and post-renal (obstruction of urine flow).","AKI is common among people admitted to hospital, especially older adults and those with infection, surgery or existing CKD."],sci:["Many people recover kidney function after AKI, but recovery may be incomplete. AKI increases the risk of later CKD, and CKD increases the risk of AKI — a bidirectional relationship. Follow-up kidney tests after an episode are often recommended."],pr:["Knowing your baseline kidney function and medicine list helps clinicians during acute illness. Some health systems provide 'sick day' guidance for certain medicines — ask your clinician what applies to you."],sc:"Li, 72, develops severe diarrhoea while taking a diuretic and an NSAID for knee pain. At hospital her creatinine has risen sharply. Fluids and medicine review help her kidneys recover over a week.",my:[["AKI always means permanent damage.","Many people recover, though follow-up is important."],["AKI and CKD are the same.","AKI is sudden (hours–days); CKD lasts more than three months."]],sf:"Markedly reduced urine output, confusion, breathlessness or swelling during illness needs urgent assessment.",rc:["Sudden decline over hours–days.","Pre-renal, intrinsic, post-renal causes.","Often reversible, but raises future CKD risk."],rf:["kdigo-aki","nice-ng148","nhs-aki"],bk:[15],fl:["Trigger (dehydration, sepsis, toxin, obstruction)","Sudden fall in GFR","Creatinine rises / urine falls","Treat cause → recovery or CKD risk"]},{n:44,t:"Chronic Kidney Disease",fig:"ckdgrid",obj:["Describe CKD definition, causes and staging","Explain progression and complications","Recognise CKD as a cardiovascular risk factor"],ex:["Chronic kidney disease is the persistent presence (more than three months) of reduced kidney function or markers of kidney damage. Leading causes worldwide are diabetes and high blood pressure; others include glomerulonephritis, polycystic kidney disease, recurrent obstruction or infection, and in some regions conditions of uncertain cause.","KDIGO classifies CKD using GFR categories (G1 ≥90; G2 60–89; G3a 45–59; G3b 30–44; G4 15–29; G5 <15 mL/min/1.73 m²) and albuminuria categories (A1 <3 mg/mmol [<30 mg/g]; A2 3–30 mg/mmol [30–300 mg/g]; A3 >30 mg/mmol [>300 mg/g]). The combination is displayed as a colour-coded 'heat map' of risk.","CKD is common, often silent, and associated with a markedly increased risk of heart attack, stroke and heart failure. Many people with CKD are more likely to experience cardiovascular events than to reach kidney failure."],sci:["Progression is driven by ongoing damage plus adaptive hyperfiltration, high glomerular pressure, inflammation and scarring (fibrosis). Effective measures include blood pressure control, ACE inhibitors or ARBs where indicated, SGLT2 inhibitors for many people, diabetes management, avoiding nephrotoxins and treating complications — all individually prescribed. CKD is not always progressive, and outcomes vary widely."],pr:["Early detection allows treatments that slow progression. If you have diabetes, high blood pressure, heart disease or a family history of kidney failure, ask whether kidney tests (eGFR and urine ACR) are appropriate."],sc:"Deepa, 55, with type 2 diabetes, learns at a routine review that her ACR is raised. Her clinician discusses medicines and lifestyle steps that may slow progression.",my:[["CKD always leads to dialysis.","Most people with CKD never need dialysis; many remain stable for years with good care."],["CKD can always be reversed.","Some causes improve with treatment, but established scarring is usually not reversible; progression can often be slowed."]],rc:["CKD = abnormalities for >3 months.","Staged by GFR and albuminuria.","Strong link to cardiovascular disease.","Progression can often be slowed."],rf:["kdigo-ckd","nice-ng203","niddk-ckd","niddk-ckd-manage","gbd-ckd"],bk:[18,11],fl:["Initial injury (diabetes, BP, GN…)","Nephron loss & hyperfiltration","Scarring & albuminuria","Slowed by BP, medicines, risk control"]},{n:45,t:"Diabetic Kidney Disease",fig:"dkd",obj:["Explain how high blood glucose damages kidneys","Describe the role of albuminuria screening","Outline evidence-based protection strategies"],ex:["Diabetes is one of the leading causes of kidney failure worldwide. Over years, high blood glucose and high blood pressure damage glomerular blood vessels, thicken the basement membrane, injure podocytes and promote scarring.","An early change is glomerular hyperfiltration, followed in many people by increasing albuminuria and later a decline in GFR. However, not everyone follows this pattern; some people lose GFR without significant albuminuria.","Because early disease is silent, guidelines recommend regular testing — usually at least once a year — of urine albumin-to-creatinine ratio and eGFR for people with diabetes, with timing varying by type of diabetes and national guidance."],sci:["Treatments shown in large trials to slow diabetic kidney disease include blood pressure control, ACE inhibitors or ARBs for people with albuminuria, SGLT2 inhibitors, and in some cases non-steroidal mineralocorticoid receptor antagonists and GLP-1 receptor agonists. Glucose management reduces microvascular complications. All are prescription decisions based on individual circumstances and access."],pr:["Attending diabetes reviews, knowing your ACR and eGFR, managing blood pressure and not smoking all support kidney health."],sc:"Tariq has type 1 diabetes since age 12. At 30, he begins annual ACR testing and learns his results are stable — reassuring him that screening works.",my:[["Diabetic kidney damage causes early symptoms.","It is usually silent until advanced; screening is essential."]],sf:"Do not change diabetes or blood pressure medicines without professional advice.",rc:["High glucose + BP damage glomeruli.","Annual ACR + eGFR screening is recommended for people with diabetes.","Multiple medicines can slow progression."],rf:["niddk-dkd","kdigo-dm","who-dm"],bk:[11,18],fl:["Chronic high glucose","Hyperfiltration & vessel damage","Albuminuria","GFR decline (slowed by treatment)"]},{n:46,t:"Hypertensive Kidney Disease",fig:"htn",obj:["Describe how high blood pressure damages kidney vessels","Explain the vicious cycle of hypertension and CKD","Recognise the importance of detection"],ex:["Long-standing high blood pressure thickens and narrows the walls of small kidney arteries and arterioles (arteriolosclerosis). Reduced blood flow causes some glomeruli to scar (glomerulosclerosis), while others hyperfilter under high pressure.","As nephrons are lost, sodium excretion becomes harder and the RAAS is activated, raising blood pressure further. Hypertension is therefore both a cause and a consequence of CKD.","Severe uncontrolled high blood pressure ('hypertensive emergency') can cause rapid kidney injury along with damage to the brain, eyes and heart."],sci:["Diagnosing hypertension as the cause of CKD can be difficult; other causes, including genetic factors, are often considered. Treatment focuses on blood pressure control with lifestyle measures and medicines, with targets individualised by clinicians according to guidelines such as KDIGO and national bodies."],pr:["Regular blood pressure checks, reducing excess sodium, physical activity, limiting alcohol and taking prescribed medicines consistently all protect the kidneys."],sc:"Musa, 48, has not had his blood pressure checked in years. A community screening finds 168/102 mmHg. Follow-up tests show early kidney involvement, and treatment begins.",my:[["High blood pressure only damages the heart.","It also damages kidneys, brain, eyes and blood vessels."]],sf:"Very high blood pressure with severe headache, chest pain, breathlessness, vision change or confusion is an emergency.",rc:["Hypertension scars small kidney vessels.","CKD raises blood pressure — a vicious cycle.","Detection and control are protective."],rf:["niddk-hbp","who-htn","kdigo-bp"],bk:[18],fl:["High pressure","Arteriole thickening","Glomerular scarring","Sodium retention → higher pressure"]},{n:47,t:"Glomerulonephritis",fig:"gn",obj:["Define glomerulonephritis","Give examples of causes","Distinguish nephritic and nephrotic patterns"],ex:["Glomerulonephritis (GN) means inflammation of the glomeruli. It may be primary (affecting the kidney alone) or secondary to infections, autoimmune diseases (such as lupus or ANCA-associated vasculitis), or other conditions.","Examples include IgA nephropathy (one of the most common primary GNs worldwide), post-infectious GN (for example after streptococcal infection, more common in children in some regions), membranous nephropathy, and rapidly progressive GN.","A 'nephritic' pattern typically involves blood in urine, some protein, raised blood pressure, swelling and reduced kidney function. A 'nephrotic' pattern (Chapter 48) involves heavy protein loss."],sci:["Diagnosis usually requires urine tests, blood tests (including immunological markers) and often a kidney biopsy. Treatments range from supportive care to immunosuppressive therapy, guided by specialists according to guidelines such as KDIGO 2021 for glomerular diseases."],pr:["Persistent blood or protein in urine, especially with swelling or high blood pressure, warrants specialist assessment."],sc:"Kenji, 24, notices cola-coloured urine a few days after a sore throat. Tests show IgA nephropathy. His nephrologist explains treatment options and monitoring.",my:[["Glomerulonephritis is caused by poor hygiene.","Causes include immune processes, infections and genetics — not personal behaviour."]],rc:["GN = glomerular inflammation.","Primary or secondary causes.","Nephritic vs nephrotic patterns.","Biopsy often guides specialist treatment."],rf:["niddk-glom","nhs-gn","kdigo-gd"],bk:[20],fl:["Immune trigger","Glomerular inflammation","Blood/protein leak into urine","Specialist diagnosis & treatment"]},{n:48,t:"Nephrotic Syndrome",fig:"nephrotic",obj:["Describe the features of nephrotic syndrome","Explain the physiology of protein loss and swelling","Identify complications and causes"],ex:["Nephrotic syndrome is defined by heavy protein in urine, low blood albumin, swelling (oedema) and usually high blood cholesterol. It results from damage to the glomerular filtration barrier, especially podocytes.","Swelling often appears around the eyes in the morning and in the legs later in the day. Urine may look very frothy.","In children, minimal change disease is the most common cause and often responds to steroid treatment, though relapses can occur. In adults, causes include membranous nephropathy, focal segmental glomerulosclerosis, diabetes and amyloidosis."],sci:["Complications include increased risk of blood clots (due to loss of anticoagulant proteins), infections (loss of immunoglobulins), high cholesterol and acute kidney injury. Treatment depends on cause and is specialist-led."],pr:["Families of children with nephrotic syndrome are often taught to test urine protein at home under clinical guidance to detect relapse early."],sc:"Six-year-old Arjun develops puffy eyes and swollen legs. Diagnosed with minimal change disease, he responds to treatment; his parents learn to monitor his urine with dipsticks as instructed.",my:[["Swelling means drink less water.","Fluid management in nephrotic syndrome is set by clinicians; self-restriction can be harmful."]],sf:"Leg swelling with pain, sudden breathlessness or chest pain could indicate a clot — seek emergency care.",rc:["Heavy proteinuria, low albumin, oedema, high lipids.","Podocyte injury is central.","Clot and infection risk.","Specialist-led treatment."],rf:["niddk-nephrotic","nhs-nephrotic","kdigo-gd"],fl:["Podocyte injury","Heavy protein loss","Low blood albumin","Oedema, high lipids, clot risk"]},{n:49,t:"Polycystic Kidney Disease",fig:"pkd",obj:["Describe autosomal dominant and recessive PKD","Explain inheritance patterns","Identify features and monitoring"],ex:["Polycystic kidney disease (PKD) is an inherited condition in which many fluid-filled cysts grow in the kidneys, enlarging them and gradually reducing function.","Autosomal dominant PKD (ADPKD) is the most common form, usually caused by variants in the PKD1 or PKD2 genes. A child of an affected parent has a 50% chance of inheriting it. Symptoms often appear in adulthood: high blood pressure, flank pain, blood in urine, kidney stones and urinary infections. Cysts can also occur in the liver, and some families have a higher risk of brain aneurysms.","Autosomal recessive PKD (ARPKD) is rare, usually presents in infancy or before birth, and requires both parents to carry a variant."],sci:["Diagnosis typically uses ultrasound, sometimes with genetic testing. Progression varies widely, even within families. Management includes blood pressure control and, for some people at risk of rapid progression, a medicine that slows cyst growth (tolvaptan), where available and appropriate. Genetic counselling helps families understand risks."],pr:["If PKD runs in your family, discuss with a clinician whether and when testing is appropriate, and the implications for insurance and family planning in your country."],sc:"Clara's mother has ADPKD. At 25, Clara speaks with a genetic counsellor to weigh the pros and cons of screening.",my:[["PKD skips generations.","ADPKD is dominant and usually does not skip generations, though severity varies and new variants can occur."]],rc:["Inherited cysts enlarge kidneys.","ADPKD: 50% inheritance risk per child.","Blood pressure control and specialist care matter.","Genetic counselling helps."],rf:["niddk-pkd","nhs-adpkd"],fl:["Gene variant inherited","Cysts form & grow","Kidneys enlarge","Function declines (variable rate)"]},{n:50,t:"Kidney Infections and Pyelonephritis",fig:"uti",obj:["Describe pyelonephritis","Identify warning signs and complications","Recognise when urgent care is needed"],ex:["Pyelonephritis is a bacterial infection of the kidney, usually ascending from the bladder. It causes fever, chills, flank pain, nausea or vomiting, and often bladder symptoms.","Risk factors include recent bladder infection, pregnancy, kidney stones or other obstruction, urinary catheters, vesicoureteral reflux, diabetes and weakened immunity.","Complications include sepsis, kidney abscess, and, with repeated infections, kidney scarring. In pregnancy it is associated with complications for both parent and baby."],sci:["Treatment requires antibiotics chosen by clinicians based on local resistance patterns and urine culture; some people need hospital admission and intravenous therapy. Infection behind an obstruction (such as a stone) can become an emergency requiring drainage."],pr:["Do not ignore fever with back or side pain during or after bladder symptoms. Prompt treatment reduces complications."],sc:"Esther, 30 weeks pregnant, develops fever and right-sided back pain. She is admitted for antibiotics and monitoring, and makes a full recovery.",my:[["Kidney infections are just bad UTIs that can wait.","They need prompt medical treatment."]],sf:"Fever with flank pain, vomiting, confusion, rapid breathing or feeling very unwell may indicate sepsis — seek emergency care.",rc:["Ascending infection of kidney.","Fever, chills, flank pain.","Can cause sepsis — treat promptly."],rf:["niddk-pyelo","nhs-kinf","nhs-sepsis","who-sepsis"],bk:[20],fl:["Bladder infection","Bacteria ascend","Kidney inflamed","Risk of sepsis → urgent treatment"]},{n:51,t:"Obstructive Kidney Disorders",fig:"obstruction",obj:["Describe obstructive uropathy and hydronephrosis","List causes across life stages","Explain why timely relief matters"],ex:["Obstructive uropathy refers to blocked urine flow; obstructive nephropathy refers to resulting kidney damage. Hydronephrosis — swelling of the renal pelvis and calyces — is a common imaging finding.","Causes vary by age. In infants and children: congenital narrowing at the pelvi-ureteric junction or posterior urethral valves in boys. In adults: kidney stones, prostate enlargement, tumours, strictures, pregnancy-related compression, retroperitoneal fibrosis and neurological bladder dysfunction.","Obstruction may be unilateral or bilateral, partial or complete, acute or chronic."],sci:["Back-pressure reduces GFR, impairs tubular function (including concentrating ability and potassium and acid excretion) and, if prolonged, causes scarring. Infection in an obstructed system is dangerous. Relief via catheter, stent or nephrostomy tube is often urgent."],pr:["Many congenital obstructions are now detected on pregnancy ultrasound and followed by paediatric specialists."],sc:"A prenatal scan shows mild hydronephrosis in Zara's baby. After birth, follow-up ultrasounds show it resolves without treatment, as many mild cases do.",my:[["Hydronephrosis always needs surgery.","Many mild cases, especially in infants, resolve; management depends on cause and severity."]],rc:["Blocked flow → hydronephrosis.","Age-dependent causes.","Prolonged obstruction damages kidneys; infection is dangerous."],rf:["niddk-retention","niddk-child"],fl:["Obstruction","Back-pressure","Hydronephrosis","Relief preserves function"]},{n:52,t:"Kidney Cancer",fig:"cancer",obj:["Describe the main type of kidney cancer","Identify risk factors and symptoms","Understand investigation and treatment approaches"],ex:["The most common kidney cancer in adults is renal cell carcinoma, arising from tubule cells. Cancers can also arise in the lining of the renal pelvis and ureter (urothelial carcinoma). In children, Wilms tumour (nephroblastoma) is the most common kidney cancer.","Many kidney cancers are now found incidentally on scans done for other reasons. Possible symptoms include blood in urine, a persistent flank pain or lump, unexplained weight loss and fatigue — though these have many other causes.","Risk factors include smoking, obesity, high blood pressure, long-term dialysis, certain inherited syndromes and some occupational exposures."],sci:["Investigation uses imaging (ultrasound, CT, MRI) and sometimes biopsy. Treatment depends on size, spread and personal factors, and may include active surveillance for small masses, partial or complete removal of the kidney, ablation, targeted therapy or immunotherapy."],pr:["Not smoking and managing blood pressure and metabolic health reduce risk. Visible blood in urine should always be assessed."],sc:"Ivan, 61, has a CT scan for abdominal pain; a small kidney mass is found incidentally. A multidisciplinary team discusses options, including partial nephrectomy.",my:[["Blood in urine that goes away is not important.","Even one episode of visible haematuria warrants assessment."]],rc:["Renal cell carcinoma is most common in adults.","Often found incidentally.","Smoking, obesity and hypertension raise risk.","Treatment is individualised."],rf:["nci-kidney","nhs-kcancer","niddk-hematuria"],fl:["Risk factors","Symptoms or incidental finding","Imaging ± biopsy","Tailored treatment"]},{n:53,t:"Kidney Failure and Advanced Renal Disease",fig:"ckdgrid",obj:["Define kidney failure (G5)","Describe symptoms and complications of advanced CKD","Introduce treatment pathways"],ex:["Kidney failure means the kidneys can no longer maintain health without support — typically GFR below 15 mL/min/1.73 m² (G5) or a need for dialysis. Some health systems use the term 'end-stage kidney disease', though 'kidney failure' is increasingly preferred.","Symptoms may include tiredness, nausea, poor appetite, itching, muscle cramps, sleep problems, swelling, breathlessness, difficulty concentrating and reduced urine output — though some people still pass normal volumes of urine.","Complications include fluid overload, high potassium, acidosis, anaemia, mineral and bone disorder, and malnutrition."],sci:["Options include kidney transplantation, haemodialysis, peritoneal dialysis and conservative kidney management (comprehensive supportive care without dialysis). The best choice depends on medical factors, personal values, life circumstances and local availability. Preparation should begin well before dialysis is needed."],pr:["Shared decision-making with a multidisciplinary team, including family or carers if desired, helps people choose a pathway that fits their goals."],sc:"Rosa, 78, with several health conditions, discusses options with her team and chooses conservative kidney management focused on comfort and time at home with family.",my:[["Kidney failure means you must start dialysis.","Transplant and conservative management are also options; choices depend on individual circumstances and values."]],sf:"Severe breathlessness, chest pain, confusion or severe weakness in someone with advanced CKD needs emergency care.",rc:["G5 / need for kidney replacement therapy.","Multiple complications.","Options: transplant, HD, PD, conservative care.","Shared decision-making."],rf:["niddk-kf-what","niddk-choose","niddk-conserv","kdigo-ckd"],bk:[13],fl:["Advanced CKD","Symptoms & complications","Education & planning","Chosen pathway"]},{n:54,t:"Anaemia and Kidney Disease",fig:"anaemia",obj:["Explain why anaemia develops in CKD","Describe the role of erythropoietin and iron","Outline treatment principles"],ex:["Anaemia is a reduced level of haemoglobin, the oxygen-carrying protein in red blood cells. It is common in CKD, becoming more frequent as kidney function declines.","The main reason is reduced erythropoietin (EPO) production by the kidneys. Iron deficiency (from reduced absorption, blood loss or blood tests), inflammation, and shortened red cell survival also contribute. Hepcidin, a hormone that rises with inflammation, blocks iron absorption and release.","Symptoms include tiredness, breathlessness on exertion, pale skin, reduced exercise capacity and difficulty concentrating."],sci:["Treatment, directed by clinicians, may include iron (oral or intravenous), erythropoiesis-stimulating agents (synthetic EPO), and in some countries HIF-prolyl hydroxylase inhibitors. Target haemoglobin levels are set cautiously because aiming too high with ESAs has been associated with harms in trials."],pr:["Do not take iron supplements without clinical advice — they can interact with other medicines and are not always appropriate."],sc:"Kalani, with stage 4 CKD, has been exhausted for months. Blood tests show anaemia with low iron stores; treatment with intravenous iron improves her energy.",my:[["Fatigue in CKD is just in your head.","Anaemia is a common, measurable and treatable cause."]],rc:["Reduced EPO is the main cause.","Iron deficiency and inflammation contribute.","Treated with iron, ESAs and newer agents as prescribed."],rf:["niddk-anemia","kdigo-anemia"],bk:[10],fl:["Kidney oxygen sensing","EPO released (reduced in CKD)","Bone marrow red-cell production","Haemoglobin & oxygen delivery"]}],ip=[{n:55,t:"Nutrition and Kidney Function",fig:"plate",obj:["Explain how nutrition influences kidney health directly and indirectly","Distinguish general population advice from CKD-specific advice","Recognise the role of renal dietitians"],ex:["Nutrition influences kidney health in two ways. Indirectly, eating patterns affect blood pressure, blood glucose, body weight and cardiovascular risk — the major drivers of CKD. Directly, the kidneys process the sodium, potassium, phosphorus, protein-derived waste, acid and water that we consume.","For the general population, guidance emphasises balanced dietary patterns rich in vegetables, fruits, legumes, whole grains, nuts and seeds, with moderate amounts of animal foods and limited ultra-processed foods high in sodium, added sugars and saturated fats.","For people with CKD, needs change with stage, laboratory results, other conditions, medicines and dialysis. Advice that suits one person can be harmful for another. Renal dietitians translate laboratory results and medical plans into personalised, culturally appropriate food guidance."],sci:["Malnutrition (protein–energy wasting) is a significant problem in advanced CKD and dialysis. Overly restrictive diets can worsen it. KDOQI's 2020 nutrition guideline emphasises individualised assessment and dietitian involvement."],pr:["If you have kidney disease, ask for referral to a renal dietitian where available. If access is limited, ask your clinician which nutrients, if any, you need to monitor based on your results."],sc:"Wanjiru, newly diagnosed with stage 3 CKD, finds conflicting diet lists online. Her dietitian explains that, based on her results, she needs to focus mainly on reducing salt — not cutting out the vegetables she loves.",my:[["There is one 'kidney diet'.","Nutrition advice is individual and changes over time."]],sf:"This book never provides personal targets for protein, sodium, potassium, phosphorus or fluid.",rc:["Diet affects kidneys directly and through BP, glucose and weight.","General advice ≠ CKD advice.","Renal dietitians personalise plans."],rf:["niddk-eat","kdoqi-nut","who-diet"],bk:[7,10,11],fl:["Food choices","Blood pressure, glucose, weight","Kidney workload & electrolytes","Personalised dietitian advice"]},{n:56,t:"Sodium Intake and Kidney Health",fig:"label",obj:["Describe sources of dietary sodium","Explain sodium's effect on blood pressure and albuminuria","Read sodium information on labels"],ex:["In many countries most dietary sodium comes not from the salt shaker but from processed and prepared foods: bread, processed meats, cheese, sauces, stock cubes, instant noodles, snacks, pickles and restaurant meals. In some regions, salt added during cooking and condiments such as soy sauce or fish sauce are major sources.","WHO recommends adults in the general population consume less than 2 g sodium per day (about 5 g salt). Most populations exceed this. Reducing sodium lowers blood pressure in many people and can enhance the effect of some blood pressure medicines.","Labels may show sodium or salt. Salt ≈ sodium × 2.5. Some countries use front-of-pack colour codes or warning symbols (for example, 'traffic light' labels in the UK or black octagon warnings in several Latin American countries)."],sci:["In CKD, high sodium intake is associated with higher blood pressure, fluid retention and more albuminuria, and can blunt the benefits of RAAS-blocking medicines. Specific sodium advice for people with CKD should come from clinicians."],pr:["Practical approaches include cooking with herbs, spices, citrus and garlic; comparing labels; rinsing canned beans; and gradually reducing salt — taste preferences adapt over weeks."],sc:"Mohammed compares two brands of flatbread and finds one has nearly twice the sodium per 100 g. He switches and uses za'atar and lemon for flavour.",my:[["Sea salt and pink salt are healthier.","They contain similar sodium to table salt by weight."]],sf:"Avoid potassium-based salt substitutes unless your clinician confirms they are safe for you.",rc:["Processed foods supply most sodium in many countries.","WHO: <2 g sodium/day for adults (general population).","Salt ≈ sodium × 2.5."],rf:["who-salt","who-sodium","fda-sodium","niddk-eat"],bk:[7,18],fl:["Identify sodium sources","Read labels per 100 g/serving","Compare & choose","Flavour with herbs & spices"]},{n:57,t:"Protein and Kidney Function",fig:"plate",obj:["Explain protein metabolism and nitrogen waste","Describe why protein advice differs between healthy people, CKD and dialysis","Recognise risks of both excess and insufficient protein"],ex:["Protein provides amino acids for muscles, enzymes, immune cells and hormones. When protein is broken down, the nitrogen is converted to urea in the liver and excreted by the kidneys. Protein intake also increases glomerular filtration temporarily.","For healthy people, normal protein intakes from varied plant and animal sources are appropriate. Very high protein intake from supplements has uncertain long-term effects and may be a concern for people with unrecognised kidney disease.","In CKD not on dialysis, clinicians and dietitians may recommend moderating protein intake for some people to reduce kidney workload and waste build-up. On dialysis, protein needs usually increase because dialysis removes amino acids and the risk of malnutrition is high."],sci:["Plant-based proteins (legumes, grains, nuts) are associated with lower acid production and phosphorus absorption than many animal proteins; research into plant-dominant diets in CKD is active and promising, but advice must remain individual, particularly regarding potassium."],pr:["Never cut protein drastically on your own. Malnutrition and muscle loss can be serious, particularly for older adults and people on dialysis."],sc:"Hiroshi, a gym enthusiast, uses large amounts of protein powder and creatine. His raised creatinine is partly explained by creatine use; his doctor also checks ACR and repeats tests without supplements.",my:[["Protein damages healthy kidneys.","Normal intakes are appropriate for healthy people; questions remain about very high supplement use."],["Everyone with CKD must eat very little protein.","Needs vary — and on dialysis, needs usually increase."]],sf:"Do not adopt low-protein diets without supervision — risk of malnutrition.",rc:["Protein → urea excreted by kidneys.","Needs differ: healthy vs CKD vs dialysis.","Avoid both excess supplements and unsupervised restriction."],rf:["kdoqi-nut","niddk-eat","medline-creat"],bk:[7,10],fl:["Protein eaten","Amino acids used","Nitrogen → urea (liver)","Urea excreted by kidneys"]},{n:58,t:"Potassium in Food and Kidney Health",fig:"kfoods",obj:["Identify potassium-rich foods across cuisines","Explain why potassium is beneficial for most people","Understand why restriction is individual"],ex:["Potassium is found in many whole foods: fruits (bananas, oranges, mangoes, avocados, dried fruit), vegetables (potatoes, sweet potatoes, cassava, tomatoes, leafy greens), legumes (lentils, beans, chickpeas), nuts, dairy and coffee. Many processed foods use potassium-containing additives.","For most people, diets rich in potassium are associated with lower blood pressure and lower stroke risk, partly by counterbalancing sodium.","Some people with CKD develop high blood potassium, particularly in later stages or when taking certain medicines. Only then may a clinician or dietitian recommend adjusting potassium intake. Others with CKD have normal or low potassium and benefit from potassium-rich foods."],sci:["Food preparation techniques such as soaking and boiling some vegetables in plenty of water ('leaching') can reduce potassium content; dietitians may teach these where relevant. Potassium additives (e.g., potassium chloride, potassium phosphate) can contribute significant hidden potassium and are listed in ingredients."],pr:["If you have CKD, ask whether your potassium level needs any dietary attention. Avoid unnecessary restriction that removes nutritious foods."],sc:"Ama, from Ghana, worries she must give up plantain and kontomire. Her blood potassium is normal, so her dietitian advises no restriction but asks her to repeat tests after a medicine change.",my:[["Potassium is bad for kidneys.","It is essential and beneficial for most people; only some people with CKD need restriction."]],sf:"High potassium can cause dangerous heart rhythms. If your care team has advised a potassium limit, follow it and ask before using salt substitutes.",rc:["Potassium-rich foods support BP in the general population.","Restriction only when clinically indicated.","Watch hidden potassium additives if advised."],rf:["ods-k","niddk-eat","medline-k","kdoqi-nut"],bk:[10],fl:["Potassium-rich whole foods","Blood test result","Clinician/dietitian decision","Personalised approach"]},{n:59,t:"Phosphorus and Food Choices",fig:"padditives",obj:["Identify natural and additive sources of phosphorus","Explain differences in absorption","Recognise phosphate additives on labels"],ex:["Phosphorus is a mineral needed for bones, cell membranes and energy (ATP). It is found naturally in protein foods (meat, fish, dairy, eggs, legumes, nuts, whole grains) and added as phosphate additives to many processed foods and drinks.","Absorption differs by source. Phosphorus in plant foods is partly bound as phytate and less absorbed; phosphorus in animal foods is moderately absorbed; inorganic phosphate additives are absorbed most completely.","Phosphate additives appear in ingredient lists with names containing 'phos' — for example, phosphoric acid (in some cola drinks), sodium phosphate, disodium phosphate, sodium tripolyphosphate or calcium phosphate — or as E-numbers in some regions (such as E338–E341, E450–E452)."],sci:["In advanced CKD, the kidneys excrete less phosphate, contributing to mineral and bone disorder. Dietitians may advise reducing additive phosphate, and some people are prescribed phosphate binders taken with meals. For healthy people, phosphorus deficiency is rare."],pr:["Reading ingredient lists for 'phos' is a practical skill for people advised to limit phosphorus. Choosing fresh or minimally processed foods reduces additive intake."],sc:"Pedro, on haemodialysis, learns his favourite processed cheese and cola contain phosphate additives. His dietitian helps him find swaps he enjoys.",my:[["All phosphorus sources are equal.","Additive phosphate is absorbed more completely than plant phosphorus."]],rc:["Phosphorus: natural in protein foods + additives.","Additives are highly absorbed.","Look for 'phos' and E-numbers on labels.","Restriction depends on clinical status."],rf:["ods-p","niddk-mbd","niddk-eat"],bk:[10],fl:["Plant (phytate) – lower absorption","Animal – moderate","Additives – highest","Read labels for 'phos'"]},{n:60,t:"Hydration and Everyday Drinking Habits",fig:"hydration",obj:["Describe factors influencing fluid needs","Evaluate common drinks","Recognise clinical exceptions"],ex:["Water needs vary with climate, altitude, physical activity, body size, age, pregnancy, breastfeeding, diet and illness. EFSA's population reference values for total water intake (from all drinks and food) are about 2.0 L/day for adult women and 2.5 L/day for adult men in temperate climates with moderate activity — population averages, not individual targets.","Plain water is a healthy default. Tea, coffee, milk and soups also contribute fluid; moderate caffeine intake has a mild diuretic effect but still contributes net fluid for habitual consumers. Sugar-sweetened drinks contribute to excess energy and metabolic risk. Alcohol increases urine output by suppressing ADH.","Access to safe drinking water is not universal. WHO reports that a substantial share of the global population lacks safely managed drinking water, which affects both hydration and infection risk."],sci:["Some people need different approaches: those with a history of certain kidney stones may be advised to increase fluids; those with heart failure, advanced CKD, dialysis or some liver conditions may be advised to limit fluids. These decisions require clinical input."],pr:["Keep water accessible, drink with meals and when thirsty, and drink more in heat and with exercise unless advised otherwise. Treat water if supplies are unsafe according to local health guidance."],sc:"Laila, a nurse working 12-hour shifts, keeps a refillable bottle at her station and plans short water breaks, noticing fewer end-of-shift headaches.",my:[["Coffee dehydrates you.","For habitual drinkers, moderate coffee contributes to fluid intake."],["More water always protects kidneys.","Adequate, not excessive, intake is the goal; some people need limits."]],sf:"If you are on dialysis or have heart failure, follow your care team's fluid guidance.",rc:["Needs vary widely.","EFSA values are population averages.","Clinical exceptions exist in both directions."],rf:["efsa-water","who-water","nhs-dehyd"],bk:[7],fl:["Climate & activity","Thirst & routine","Drink choices","Clinical exceptions"]},{n:61,t:"Vitamins, Minerals and Kidney Health",fig:"meds",obj:["Describe how CKD affects vitamin and mineral handling","Identify supplements that may be risky","Understand when supplementation is prescribed"],ex:["A varied diet usually supplies needed vitamins and minerals for healthy people. In CKD, handling changes: some water-soluble vitamins are lost in dialysis; vitamin D activation decreases; and some minerals (potassium, phosphorus, magnesium) and vitamins (such as vitamin A) can accumulate.","High-dose vitamin C can be converted to oxalate, which may contribute to kidney stones or oxalate deposition in people with reduced kidney function. Large doses of fat-soluble vitamins can accumulate. Herbal 'kidney support' blends may contain ingredients that interact with medicines.","People on dialysis are often prescribed specific renal vitamin formulations designed for their needs."],sci:["Evidence does not support routine high-dose supplements for preventing kidney disease in the general population. Supplementation should address documented deficiency or specific clinical needs."],pr:["Bring all supplements — including herbal products and 'natural' remedies — to medication reviews."],sc:"Marta, with stage 4 CKD, takes a high-dose vitamin C supplement for colds. Her pharmacist explains the oxalate concern and they discuss alternatives with her doctor.",my:[["Vitamins are harmless because they're natural.","Some accumulate or convert to harmful products when kidney function is reduced."]],sf:"Discuss supplements with a clinician or pharmacist if you have kidney disease.",rc:["CKD changes vitamin and mineral handling.","High-dose vitamin C, vitamin A, magnesium and potassium supplements can be risky.","Supplement only when indicated."],rf:["ods-d","ods-mg","kdoqi-nut","niddk-eat"],bk:[10],fl:["Dietary intake","Kidney handling changes in CKD","Risk of loss or accumulation","Targeted supplementation if indicated"]},{n:62,t:"Dietary Patterns and Renal Wellness",fig:"plate",obj:["Describe evidence-based dietary patterns","Explain links between diet, cardiovascular and kidney health","Respect cultural diversity in healthy eating"],ex:["Research increasingly focuses on overall dietary patterns rather than single nutrients. Patterns such as the DASH (Dietary Approaches to Stop Hypertension) diet and Mediterranean-style diets — emphasising vegetables, fruits, legumes, whole grains, nuts, olive oil, fish and limited red and processed meat — are associated with lower blood pressure and cardiovascular risk.","Observational studies associate healthier dietary patterns with lower risk of developing CKD and slower progression, though observational research cannot prove cause and effect.","Healthy patterns exist in every food culture: West African bean and vegetable stews, South Asian dals with vegetables, East Asian rice with tofu, fish and greens, Latin American beans with corn and vegetables, Middle Eastern legumes, whole grains and salads."],sci:["For people with advanced CKD, standard healthy patterns may need modification — for example, of potassium or phosphorus — under dietitian guidance. KDOQI 2020 suggests a Mediterranean diet may be considered for some adults with CKD not on dialysis, individualised to their needs."],pr:["Small, sustainable changes — adding a vegetable portion, choosing whole grains, cooking more at home with less salt — matter more than perfection."],sc:"The Okafor family adapts their weekly meals by adding beans and greens and using less stock cube, keeping familiar flavours.",my:[["Healthy eating means expensive 'superfoods'.","Affordable staples like beans, lentils, seasonal vegetables and whole grains form healthy patterns."]],rc:["Patterns matter more than single foods.","DASH/Mediterranean-style patterns support BP and heart health.","Every cuisine can be healthy.","CKD modifications are individual."],rf:["who-diet","kdoqi-nut","who-salt"],bk:[7,18],fl:["Vegetables & fruits","Legumes & whole grains","Healthy fats & moderate animal foods","Less salt & ultra-processed foods"]},{n:63,t:"Food Labels and Kidney-Related Nutrients",fig:"label",obj:["Interpret serving sizes and per-100 g values","Locate sodium, potassium and phosphorus information","Recognise additive names"],ex:["Nutrition labels differ between countries. The US Nutrition Facts label lists sodium in milligrams per serving and %Daily Value; potassium is required, but phosphorus is optional. European labels list energy, fat, carbohydrate, sugars, protein and salt per 100 g (and sometimes per portion). Many countries do not list potassium or phosphorus at all.","Comparing per-100 g values allows fair comparison between products. Serving sizes on packs may be smaller than what people actually eat.","Ingredient lists are ordered by weight. Look for sodium-containing ingredients (salt, monosodium glutamate, sodium bicarbonate, sodium nitrite), potassium additives (potassium chloride, potassium lactate) and phosphate additives (words containing 'phos')."],sci:["Because phosphorus and potassium additives are often not quantified on labels, ingredient-list reading is especially important for people advised to limit them."],pr:["Use the Food-Label worksheet in this app to practise. Bring labels to dietitian appointments to get personalised feedback."],sc:"Anika, caring for her father with CKD, practises with the worksheet and discovers that his 'low-salt' crackers contain potassium chloride — something his dietitian had asked them to watch.",my:[["'Reduced salt' means low salt.","It means less than the original product, which may still be high."]],rc:["Compare per 100 g.","Labels vary by country.","Ingredient lists reveal additives.","Ask a dietitian for personal interpretation."],rf:["fda-sodium","who-salt","ods-p","ods-k"],bk:[7,9],fl:["Check serving size","Compare per 100 g","Scan ingredients for Na, K, 'phos'","Discuss with dietitian"]},{n:64,t:"Food Safety for People with Kidney Conditions",fig:"foodsafety",obj:["Explain why some people with kidney conditions face higher infection risk","Describe core food safety principles","Identify higher-risk foods for immunosuppressed people"],ex:["Food-borne infections can be more serious for people whose immune systems are weakened — including kidney transplant recipients taking anti-rejection medicines, people receiving immunosuppressive treatment for glomerular disease, and some people with advanced CKD or on dialysis.","Core principles: clean (wash hands and surfaces), separate (raw from ready-to-eat foods), cook (to safe temperatures), and chill (refrigerate promptly at about 5 °C/41 °F or below). Use safe water.","Transplant teams often advise avoiding higher-risk foods such as unpasteurised milk and cheeses, raw or undercooked meat, eggs and seafood, and some ready-to-eat deli products, because of risks such as Listeria and Salmonella. Grapefruit and some juices can interact with certain transplant medicines."],sci:["Severe dehydration from food poisoning can also cause acute kidney injury, especially in people with existing kidney disease."],pr:["Follow the specific food safety guidance from your transplant or kidney team, which may vary by medicine and country."],sc:"After his transplant, Ji-ho's team gives him a food safety list. He learns to avoid unpasteurised cheese and checks with his pharmacist about grapefruit.",my:[["Food safety only matters for restaurants.","Home food handling is equally important, especially for higher-risk individuals."]],sf:"Persistent vomiting or diarrhoea in transplant recipients or people with CKD needs prompt medical advice.",rc:["Immunosuppression raises food-borne infection risk.","Clean, separate, cook, chill.","Some foods interact with transplant medicines."],rf:["medline-food","foodsafety-risk","niddk-tx"],bk:[5,20],fl:["Clean","Separate","Cook","Chill"]}],np=[{n:65,t:"Physical Activity and Kidney Health",fig:"activity",obj:["Describe how physical activity supports kidney-related risk factors","Recognise safety considerations in CKD and dialysis","Interpret creatinine changes after exercise"],ex:["Regular physical activity lowers blood pressure, improves insulin sensitivity, supports healthy body weight and benefits cardiovascular health — all factors linked to kidney health. WHO recommends that adults aim for at least 150–300 minutes of moderate-intensity aerobic activity per week, plus muscle-strengthening activities, adapted to ability.","For people with CKD or on dialysis, activity can improve physical function, mood and quality of life. Some dialysis units offer exercise during treatment ('intradialytic exercise').","Very strenuous exercise, particularly in heat with inadequate fluid, can cause rhabdomyolysis — muscle breakdown that releases myoglobin and can injure kidneys."],sci:["Intense exercise can temporarily raise creatinine and urine protein. Clinicians often advise avoiding strenuous exercise for a day or two before kidney function tests to avoid misleading results."],pr:["Choose activities you enjoy and can sustain. People with kidney disease, heart conditions or a fistula should ask their care team about appropriate activities."],sc:"Raj, on haemodialysis, uses a bedside cycle during sessions. Over months his walking distance improves.",my:[["People with kidney disease should rest and avoid exercise.","Appropriate activity is usually beneficial; tailor it with your care team."]],sf:"Dark brown urine with severe muscle pain after extreme exercise needs urgent assessment.",rc:["Activity improves BP, glucose and heart health.","Benefits extend to CKD and dialysis.","Extreme exertion in heat risks rhabdomyolysis."],rf:["who-pa","nhs-ckd-tx"],bk:[14,18],fl:["Regular movement","BP & glucose improve","Cardiovascular benefit","Kidney risk factors reduced"]},{n:66,t:"Sleep and Kidney Function",fig:"sleep",obj:["Describe circadian rhythms in kidney function","Explain links between sleep, blood pressure and kidneys","Distinguish established from emerging evidence"],ex:["Kidney function follows a daily rhythm. GFR, urine flow and sodium excretion are typically lower at night, partly because of hormonal rhythms including night-time ADH. Blood pressure normally dips by about 10–20% during sleep.","Short sleep, poor quality sleep and obstructive sleep apnoea are associated with higher blood pressure and with 'non-dipping' night-time blood pressure, which is linked to cardiovascular and kidney risk.","People with CKD frequently report sleep problems, including restless legs, itching, nocturia and sleep apnoea."],sci:["Associations between short sleep and faster kidney function decline have been reported in observational studies, but causation is not established. Treatment of sleep apnoea improves blood pressure in some people; its effect on kidney outcomes remains under investigation."],pr:["Consistent sleep routines and evaluation of loud snoring or witnessed breathing pauses support overall health. Discuss persistent sleep problems with a clinician."],sc:"Nadia's partner notices she stops breathing at night. A sleep study confirms sleep apnoea; treatment improves her sleep and her blood pressure readings.",my:[["Sleep has nothing to do with kidneys.","Sleep affects blood pressure and hormone rhythms that influence kidney function, though research is ongoing."]],rc:["Kidney function has a daily rhythm.","Poor sleep and sleep apnoea raise BP.","Kidney-specific effects: emerging evidence."],rf:["kdigo-bp","who-htn"],bk:[12],fl:["Circadian clock","Night-time ADH & BP dipping","Sleep disruption","Higher BP risk"]},{n:67,t:"Stress and Kidney Health",fig:"stress",obj:["Describe physiological stress responses","Explain indirect effects of chronic stress on kidney risk","Recognise emotional impacts of kidney disease"],ex:["Acute stress activates the sympathetic nervous system and stress hormones such as cortisol and adrenaline, raising heart rate and blood pressure and reducing kidney blood flow temporarily. These responses are normal and short-lived.","Chronic stress can contribute to sustained high blood pressure, disrupted sleep and behaviours such as smoking, alcohol use, reduced physical activity and difficulty managing medicines or diet — indirectly affecting kidney risk.","Living with kidney disease or caring for someone who does can be emotionally demanding. Depression and anxiety are common among people with CKD and on dialysis, and they deserve recognition and support."],sci:["Psychosocial support, peer support and, where needed, mental health treatment improve quality of life. Direct causal effects of stress on kidney disease progression are less established than indirect effects through blood pressure and behaviour."],pr:["Ask your care team about counselling, social work and patient support groups. Kidney charities in many countries offer peer support."],sc:"Teresa, caring for her husband on dialysis, joins an online carer support group and finds practical tips and emotional relief.",my:[["Feeling low with kidney disease is a weakness.","It is common and treatable; asking for help is a strength."]],sf:"If you have thoughts of self-harm, contact local emergency services or a crisis line immediately.",rc:["Acute stress raises BP temporarily.","Chronic stress affects risk indirectly.","Emotional support is part of kidney care."],rf:["niddk-ckd-manage","nhs-ckd-tx"],bk:[13],fl:["Stressor","Hormonal & nervous response","BP, sleep & behaviour changes","Support & coping strategies"]},{n:68,t:"Smoking, Alcohol and Kidney Health",fig:"risk",obj:["Describe evidence linking smoking to kidney damage and cancer","Explain alcohol's effects on kidneys and blood pressure","Identify respectful support for behaviour change"],ex:["Smoking damages blood vessels, raises blood pressure and is associated with faster CKD progression, higher albuminuria and increased risk of kidney and bladder cancer. It also increases cardiovascular risk, which is already elevated in CKD.","Alcohol suppresses ADH, increasing urine output. Heavy drinking raises blood pressure and is associated with liver disease, which can affect kidneys. Binge drinking with vomiting can cause dehydration and acute kidney injury.","Quitting smoking at any age brings health benefits. WHO emphasises evidence-based cessation support, including counselling and medicines."],sci:["Evidence on light-to-moderate alcohol and kidney outcomes is mixed and largely observational; there is no recommendation to start drinking for health. Some kidney medicines interact with alcohol."],pr:["Ask about local quit-smoking services and alcohol support. Approaches without judgement work best."],sc:"Emeka, a long-term smoker with CKD, uses a combination of counselling and nicotine replacement through his local service and quits after his third attempt.",my:[["It's too late to quit once you have CKD.","Quitting benefits health at any stage."]],rc:["Smoking accelerates CKD and raises cancer risk.","Heavy alcohol raises BP and AKI risk.","Support works better than blame."],rf:["who-tobacco","nci-kidney","nhs-aki"],bk:[18,21],fl:["Exposure","Vessel damage / BP rise","Kidney & cancer risk","Quit support reduces risk"]},{n:69,t:"Medicines, Painkillers and Kidney Safety",fig:"meds",obj:["Identify medicines that may affect kidneys","Explain NSAID risks","Understand the value of medication review"],ex:["Many medicines are cleared by the kidneys, and some can harm them. Non-steroidal anti-inflammatory drugs (NSAIDs) such as ibuprofen, naproxen and diclofenac reduce prostaglandins that help maintain kidney blood flow. Risk increases with dehydration, older age, CKD, heart failure and use with diuretics and ACE inhibitors or ARBs — a combination sometimes called the 'triple whammy'.","Other medicines with potential kidney effects include some antibiotics (e.g., aminoglycosides, vancomycin), lithium, some antivirals, chemotherapy agents, iodinated contrast in susceptible people, proton pump inhibitors (rarely associated with interstitial nephritis) and some herbal products.","When kidney function is reduced, doses of medicines such as some antibiotics, diabetes medicines (e.g., metformin), anticoagulants and pain relievers may need adjustment."],sci:["Not all creatinine changes reflect harm: some medicines (trimethoprim, cimetidine) reduce creatinine secretion; ACE inhibitors and ARBs cause expected haemodynamic changes. Clinicians weigh benefits and risks."],pr:["Keep an up-to-date list of all medicines, including over-the-counter products and supplements, and share it at every appointment. Ask a pharmacist before using NSAIDs if you have kidney disease, heart failure or take blood pressure medicines."],sc:"Elena, 76, takes ibuprofen daily for arthritis plus a diuretic and ACE inhibitor. A medication review identifies the risk and her doctor suggests alternative pain management.",my:[["Over-the-counter painkillers are always safe.","NSAIDs can harm kidneys in susceptible people."]],sf:"Never stop prescribed medicines without professional advice.",rc:["NSAIDs reduce kidney blood flow; triple-whammy risk.","Many drugs need dose adjustment.","Keep a full medicine list; ask a pharmacist."],rf:["nhs-nsaid","nice-ng148","nhs-aki"],bk:[15],fl:["List all medicines","Identify kidney-relevant drugs","Pharmacist/clinician review","Adjust or monitor safely"]},{n:70,t:"Supplements, Herbal Products and Kidney Risks",fig:"meds",obj:["Identify documented kidney risks from some herbal products","Explain regulatory differences","Apply a critical framework to product claims"],ex:["Herbal and dietary supplements are regulated less strictly than medicines in many countries. Products may contain undeclared ingredients, heavy metals or prescription drugs. 'Natural' does not mean safe.","Documented examples of kidney harm include aristolochic acid (found in some Aristolochia species, which have been confused with other herbs) causing severe kidney failure and urothelial cancers; excess liquorice causing high blood pressure and low potassium; and star fruit, which can be toxic to people with reduced kidney function.","Products marketed for 'kidney cleansing' or 'kidney regeneration' lack supporting human clinical evidence. Some contain diuretic herbs or high potassium."],sci:["Interactions matter: St John's wort can reduce levels of transplant medicines such as ciclosporin and tacrolimus, risking rejection. Creatine supplements raise creatinine, potentially confusing test results."],pr:["Before taking any supplement, ask: What is the evidence in humans? Is the product independently tested? Could it interact with my medicines? Tell your clinicians about all products you use."],sc:"Babajide's relative recommends a herbal kidney tonic. He brings the bottle to his pharmacist, who identifies an ingredient that interacts with his blood pressure medicine.",my:[["Herbal products can repair kidneys.","No herbal product has been shown to regenerate kidneys; some cause harm."]],sf:"Transplant recipients should never start supplements without asking their transplant team.",rc:["Supplements are less regulated.","Some herbs are proven nephrotoxins.","Interactions can be serious.","'Cleanse' claims lack evidence."],rf:["niddk-tx","ods-k","medline-creat"],bk:[10],fl:["Product claim","Evidence & regulation check","Interaction check","Professional advice"]},{n:71,t:"Environmental Exposures and Kidney Health",fig:"env",obj:["Identify environmental and occupational kidney hazards","Describe chronic kidney disease of uncertain/non-traditional cause","Recognise protective measures"],ex:["Some heavy metals — including lead, cadmium and mercury — can damage the kidneys with long-term exposure. Exposure may come from occupations (mining, battery recycling, smelting), contaminated water or soil, some traditional remedies, or certain consumer products.","Organic solvents, some pesticides and silica have been associated with kidney damage in occupational studies. Contaminated drinking water is a concern in some regions.","Clusters of chronic kidney disease not explained by diabetes or hypertension have been reported among agricultural communities in Central America, Sri Lanka, India and elsewhere — often called CKD of uncertain or non-traditional aetiology (CKDu). Proposed contributors include recurrent heat stress and dehydration, agrochemicals, heavy metals and infections; the causes are still being researched and may differ by region."],sci:["Occupational health standards, safe water programmes and protective equipment reduce exposure. Evidence quality varies; some associations come from observational studies that cannot prove causation."],pr:["Workers should be informed of hazards and provided protective equipment and health surveillance by employers, according to local regulations."],sc:"Lucas, a battery-recycling worker, learns about lead exposure from his union and requests health monitoring through his employer.",my:[["Only lifestyle affects kidney health.","Environmental and occupational exposures can contribute significantly."]],rc:["Heavy metals, solvents and some agrochemicals can harm kidneys.","CKDu affects some agricultural communities; causes under investigation.","Protection is a shared employer–community responsibility."],rf:["who-water","who-heat","isn-atlas"],fl:["Hazard source","Exposure route","Kidney effect","Protection & monitoring"]},{n:72,t:"Heat Stress, Dehydration and Renal Risk",fig:"heat",obj:["Explain how heat stress affects kidneys","Identify high-risk groups and settings","Describe prevention measures"],ex:["During heat exposure, the body diverts blood to the skin and loses water and salt through sweat. Kidney blood flow falls and urine becomes concentrated. With prolonged or repeated heat and inadequate fluid replacement, acute kidney injury can occur, and severe heat stroke can cause multi-organ failure including the kidneys.","Higher-risk groups include outdoor workers (agriculture, construction), athletes, older adults, young children, people with chronic illnesses, and people taking diuretics or other medicines that affect fluid balance. Climate change is increasing the frequency and intensity of heatwaves, according to WHO.","Occupational health agencies such as NIOSH recommend water, rest and shade, gradual acclimatisation for new workers, and monitoring for heat-related illness."],sci:["Repeated subclinical kidney injury from heat is one hypothesis for CKDu, still under investigation. Fluid replacement during heavy sweating may need to include electrolytes; excessive plain water can cause hyponatraemia."],pr:["Plan activities for cooler times, wear light clothing, take shade breaks and drink regularly in heat. Check on vulnerable neighbours during heatwaves."],sc:"Esperanza's sugarcane cooperative introduces a water-rest-shade programme. Workers report fewer heat-related symptoms.",my:[["Only athletes get heat illness.","Workers, older adults, children and people with chronic illness are at risk."]],sf:"Confusion, collapse, very high body temperature or stopping sweating in heat suggests heat stroke — an emergency.",rc:["Heat reduces kidney blood flow.","Repeated heat stress may harm kidneys.","Water, rest, shade and acclimatisation protect."],rf:["who-heat","niosh-heat","osha-heat","nhs-dehyd"],bk:[21],fl:["Heat exposure","Sweat losses & skin blood flow","Reduced kidney perfusion","AKI risk → water-rest-shade"]},{n:73,t:"Kidney Development in Childhood",fig:"life",obj:["Describe kidney development before and after birth","Identify common childhood kidney and urinary conditions","Recognise when children need assessment"],ex:["Kidneys develop from around the fifth week of pregnancy, with nephron formation completed before birth in full-term babies (around 34–36 weeks). Preterm babies may continue forming nephrons briefly after birth but may end up with fewer.","At birth, GFR is low and rises rapidly in the first years, reaching adult levels (adjusted for body size) by about age two. Infants have limited ability to concentrate urine, making them vulnerable to dehydration.","Common childhood conditions include congenital anomalies of the kidney and urinary tract (CAKUT), vesicoureteral reflux, UTIs, nephrotic syndrome, post-infectious glomerulonephritis and haemolytic uraemic syndrome (sometimes following certain E. coli infections)."],sci:["Low birth weight and prematurity are associated with fewer nephrons and higher later-life risk of hypertension and CKD. Many congenital anomalies are detected on prenatal ultrasound."],pr:["Fever without an obvious cause in infants may be a UTI and needs medical assessment. Food safety (Book 05) reduces risk of E. coli infections."],sc:"Baby Noor has a fever without other symptoms. Her doctor tests her urine and diagnoses a UTI, then arranges a kidney ultrasound.",my:[["Children don't get kidney disease.","Children can have congenital and acquired kidney conditions."]],sf:"Infants with fever, poor feeding, very few wet nappies or lethargy need urgent medical assessment.",rc:["Nephrons form before birth.","Infant GFR rises to adult-adjusted levels by ~2 years.","CAKUT, UTI and nephrotic syndrome are key childhood conditions."],rf:["niddk-child","nhs-nephrotic"],bk:[5],fl:["Fetal kidney forms","Nephrons complete before birth","GFR matures by ~2 years","Childhood monitoring"]},{n:74,t:"Kidney Health During Adolescence",fig:"life",obj:["Identify kidney-relevant issues in adolescence","Describe transition from paediatric to adult care","Discuss supplements and sports"],ex:["Adolescence brings growth, hormonal change and increasing independence. Kidney-relevant issues include UTIs (p
