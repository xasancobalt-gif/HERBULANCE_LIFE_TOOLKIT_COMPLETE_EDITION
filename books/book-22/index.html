lying against the back muscles of the upper abdomen on either side of the spine. Together they receive around one-fifth of the blood pumped by the heart every minute — a remarkable share for organs that make up well under 1% of body weight.","Their best-known job is making urine, but urine is really a by-product. The real purpose is to keep the fluid that bathes every cell — the 'internal environment' — remarkably stable: the right amount of water, the right concentrations of sodium, potassium, calcium and phosphate, the right acidity, and the removal of waste products such as urea and creatinine. The kidneys also produce or activate hormones that influence blood pressure, red blood cell production and bone health.","Kidney health matters to everyone because kidney disease is common and often silent. A peer-reviewed global analysis estimated that about 9% of the world's population — roughly 700 million people — were living with chronic kidney disease in 2017, with the greatest burden in low- and middle-income regions. Many people do not know they are affected because early disease rarely causes symptoms."],sci:["Physiologists describe the kidneys as regulators rather than simple filters. In a healthy young adult the kidneys filter about 180 litres (≈48 US gallons) of plasma each day, yet usually produce only 1–2 litres of urine. That means about 99% of what is filtered is taken back into the blood. By adjusting how much of each substance is reclaimed, the kidneys match output to intake with great precision.","Each kidney contains on the order of a million microscopic filtering units called nephrons, although the number varies widely between individuals and is partly set before birth. Nephrons cannot be regenerated once lost, which is one reason prevention and early detection are emphasised throughout this book."],pr:["Understanding the kidneys helps you make sense of common health advice — why blood pressure checks, diabetes care, careful medicine use and routine urine tests matter even when you feel well. It also helps you ask better questions when talking with health professionals and judge claims made by products promising to 'cleanse' the kidneys."],sc:"Amara, a 34-year-old teacher, sees a poster saying 'Love your kidneys'. She realises she cannot say what kidneys do besides making urine. By the end of this chapter she can explain that kidneys balance water, salts, acidity and waste, and help control blood pressure.",my:[["The kidneys just make urine.","Urine is the by-product of a much bigger job: keeping the body's internal chemistry stable and producing hormones."],["If kidneys were failing, you would feel it.","Chronic kidney disease is often silent until advanced. Testing (blood eGFR and urine albumin) is how it is usually detected."]],sf:"This book is for general education. It cannot diagnose, interpret your personal results or replace care from a qualified health professional.",rc:["Two kidneys sit at the back of the upper abdomen.","They filter about 180 L of plasma daily and reclaim about 99% of it.","They balance water, electrolytes, acid and waste, and make important hormones.","Kidney disease is common worldwide and frequently silent."],rf:["niddk-how","gbd-ckd","isn-atlas"],bk:[18,10],fl:["Blood arrives (≈20% of cardiac output)","Plasma filtered (~180 L/day)","Useful substances reclaimed (~99%)","Wastes & excess leave as urine (1–2 L/day)"]},{n:2,t:"The Role of the Kidneys in Human Survival",fig:"homeostasis",obj:["List the main functions of the kidneys","Explain why loss of kidney function affects many body systems","Describe the kidneys' endocrine (hormone) roles"],ex:["Human life depends on chemical stability. Nerves fire, muscles contract and the heart beats correctly only when electrolytes stay within narrow ranges. The kidneys are central to that stability. Their functions can be grouped into five families: filtration of blood; regulation of body water; control of electrolytes such as sodium, potassium, calcium, phosphate and magnesium; removal of metabolic wastes and many medicines; and hormone production or activation.","Waste removal includes urea (from protein breakdown), creatinine (from muscle), uric acid (from the breakdown of purines) and a wide range of other compounds. The kidneys also help clear many medicines, which is why doses of some drugs are adjusted when kidney function is reduced.","The kidneys' hormone roles are often overlooked. They release renin, which starts a chain of signals that raises blood pressure and conserves sodium; they produce erythropoietin (EPO), which tells bone marrow to make red blood cells; and they convert vitamin D into its most active form, calcitriol, which helps the gut absorb calcium. The kidneys can also make glucose (gluconeogenesis) during fasting."],sci:["Because the kidneys connect to so many systems, advanced kidney failure affects the whole body: fluid can build up, causing swelling and breathlessness; potassium can rise to levels that disturb heart rhythm; acid can accumulate; anaemia can develop; and bone and mineral metabolism can become disordered. Before modern dialysis and transplantation, complete kidney failure was fatal. Today these treatments, along with supportive conservative care, allow many people to live for years — though access varies greatly between countries."],pr:["When a doctor checks kidney function, they are indirectly checking a hub that influences blood pressure, heart rhythm, bones and blood. This is why people with diabetes or high blood pressure are offered regular kidney tests."],sc:"Ravi, 52, is told his kidneys 'help control his blood pressure'. He had assumed blood pressure was only about the heart. Learning about renin helps him understand why his doctor monitors both.",my:[["Kidneys only remove waste.","They also regulate water, electrolytes and acid–base balance and make hormones such as renin and erythropoietin."],["Losing kidney function only affects urination.","Advanced kidney failure can affect the heart, blood, bones, nerves and breathing."]],rc:["Five function families: filtration, water, electrolytes, waste removal, hormones.","Renin, erythropoietin and calcitriol link kidneys to blood pressure, blood and bone.","Kidney failure affects many organ systems."],rf:["niddk-how","niddk-kf-what","statpearls-renal"],bk:[17,18],fl:["Filter blood","Balance water & salts","Remove wastes & drugs","Make hormones (renin, EPO, calcitriol)"]},{n:3,t:"The Urinary System: An Overview",fig:"urinary",obj:["Name the four main parts of the urinary system","Trace the path of urine from kidney to outside the body","Describe anatomical differences between sexes relevant to urinary health"],ex:["The urinary system has four main parts. The two kidneys make urine. Two ureters — muscular tubes about 25–30 cm (10–12 in) long — carry urine down to the bladder. The bladder is a stretchy muscular bag in the pelvis that stores urine. The urethra carries urine from the bladder to the outside.","Urine leaves each kidney through the renal pelvis, a funnel-shaped collecting area, and enters the ureter. Waves of muscle contraction (peristalsis) push urine down the ureters even when a person is lying down. The ureters enter the bladder at an angle, creating a flap-like mechanism that helps stop urine flowing back up towards the kidneys.","The urethra differs between sexes. In females it is short (about 3–4 cm) and opens just in front of the vagina, which partly explains why bladder infections are more common in women. In males it is longer (about 18–20 cm), passes through the prostate gland and also carries semen. Prostate enlargement with age can narrow the urethra and affect urine flow."],sci:["The lower urinary tract — bladder and urethra — has two jobs that seem opposite: storing urine at low pressure without leaking, and emptying completely when appropriate. This depends on coordinated activity between bladder wall muscle (the detrusor), sphincter muscles, the pelvic floor and nerve pathways linking the bladder, spinal cord and brain."],pr:["Knowing the anatomy explains why symptoms differ: pain in the side or back (flank) may relate to the kidney or ureter, whereas burning on urination usually relates to the bladder or urethra. Only a clinician can assess the actual cause."],sc:"Lucía, 15, is studying for a biology exam. Drawing the pathway kidney → ureter → bladder → urethra, and labelling the renal pelvis and the ureter's entry into the bladder, helps her remember how infection can travel upward.",my:[["Urine is made in the bladder.","Urine is made in the kidneys; the bladder only stores it."],["Urine only moves down the ureters because of gravity.","Muscular peristalsis moves urine, so it flows even when lying down."]],rc:["Kidneys → ureters → bladder → urethra.","Peristalsis moves urine through the ureters.","The ureter–bladder junction resists backflow.","Urethral length differs between sexes, influencing infection risk."],rf:["niddk-ut"],bk:[20],fl:["Kidneys produce urine","Ureters transport by peristalsis","Bladder stores at low pressure","Urethra releases urine"]},{n:4,t:"Kidneys and the Body's Internal Balance",fig:"homeostasis",obj:["Define homeostasis and negative feedback","Explain how the kidneys interact with the heart, lungs, brain, bones and liver","Describe examples of organ cross-talk"],ex:["Homeostasis is the process of keeping internal conditions stable despite changes outside. It usually works by negative feedback: a sensor detects a change, a control centre compares it with a set point, and an effector acts to reverse the change. The kidneys are one of the body's most important effectors.","Consider a hot day. Sweating loses water, blood becomes slightly more concentrated, and sensors in the brain detect the change. The brain triggers thirst and releases antidiuretic hormone (ADH), which tells the kidneys to reclaim more water. Urine becomes darker and smaller in volume until balance is restored.","The kidneys constantly work with other organs. With the heart and blood vessels they regulate blood pressure. With the lungs they control blood acidity: the lungs adjust carbon dioxide within minutes; the kidneys adjust bicarbonate and acid excretion over hours to days. With the liver they handle nitrogen waste — the liver makes urea and the kidneys excrete it. With the gut, bones and parathyroid glands they manage calcium and phosphate. With bone marrow they control red blood cell production through erythropoietin."],sci:["Clinicians describe 'cardiorenal' and 'hepatorenal' relationships, in which disease in one organ affects another. For example, severe heart failure can reduce kidney blood flow, and kidney disease can raise blood pressure and strain the heart. These links explain why kidney, heart and metabolic care are increasingly coordinated."],pr:["Thinking in systems helps explain why caring for blood pressure, blood glucose, weight-related metabolic health and medicines supports the kidneys too."],sc:"Kwame, a nursing student, maps a 'balance web' with the kidneys in the centre and arrows to the heart, lungs, liver, bones and brain. He uses it to revise for his physiology exam.",my:[["Each organ works independently.","Organs constantly exchange signals; the kidneys are a hub of this communication."]],rc:["Homeostasis relies on negative feedback.","Kidneys are key effectors of fluid, electrolyte and acid–base balance.","They cooperate with heart, lungs, liver, bones, marrow and brain."],rf:["statpearls-renal","niddk-how"],bk:[18,21,17],fl:["Change detected (e.g., water loss)","Brain/sensors compare to set point","Hormones signal kidneys","Kidneys adjust output → balance restored"]},{n:5,t:"What Does Kidney Health Mean?",fig:"ckdgrid",obj:["Distinguish normal function, reduced function and kidney disease","Explain why 'normal' varies with age and body characteristics","Understand the KDIGO concept of cause, GFR and albuminuria"],ex:["Kidney health is not a single number. Clinicians consider how well the kidneys filter (glomerular filtration rate, GFR), whether they are leaking protein (albuminuria), whether the structure looks normal on imaging, and whether urine contains abnormal findings such as blood.","Chronic kidney disease (CKD) is defined internationally by KDIGO as abnormalities of kidney structure or function present for more than three months, with implications for health. In practice this usually means an estimated GFR below 60 mL/min/1.73 m², or signs of kidney damage such as persistently raised urine albumin, even if GFR is normal.","CKD is classified by cause, by GFR category (G1 to G5) and by albuminuria category (A1 to A3). Combining these predicts risk better than either alone. Someone with good filtration but heavy albuminuria may be at higher risk than someone with mildly reduced filtration and no albuminuria."],sci:["GFR naturally varies. It is higher during pregnancy, tends to decline gradually with age on average, and differs between individuals. A mildly reduced eGFR in an older adult without albuminuria or other markers may carry different implications than the same value in a young person. Interpretation always depends on context, repeated testing and clinical judgement.","Kidney health also has a 'reserve': healthy kidneys can increase filtration when needed, such as after a protein-rich meal or after donating one kidney. Loss of this reserve may occur before standard tests change."],pr:["If you hear terms such as 'stage 3' or 'G3a A2', you now know they describe filtration and albuminuria categories. Your clinician is the right person to explain what they mean for you."],sc:"Mei, 68, is told her eGFR is 58. Her friend says that means kidney disease. Mei learns that diagnosis depends on repeated results over three months, albuminuria, age and her overall health — and makes an appointment to discuss it.",my:[["One abnormal blood test means kidney disease.","CKD requires abnormalities lasting more than three months and is interpreted in clinical context."],["Normal eGFR means perfectly healthy kidneys.","Albuminuria or structural changes can indicate disease even with normal eGFR."]],sf:"Do not use the categories in this chapter to label your own results. Discuss any test result with the clinician who ordered it.",rc:["Kidney health = filtration + albuminuria + structure + urine findings.","CKD: abnormal structure/function for >3 months.","Staged by Cause, GFR (G1–G5) and Albuminuria (A1–A3)."],rf:["kdigo-ckd","kdigo-ckd-doi","nice-ng203","niddk-ckd-what"],bk:[15],fl:["Cause identified","GFR category G1–G5","Albuminuria A1–A3","Combined risk guides care"]},{n:6,t:"Factors That Influence Kidney Health",fig:"risk",obj:["Identify medical, genetic, environmental and social factors linked with kidney disease","Distinguish modifiable from non-modifiable factors","Recognise socioeconomic influences without blame"],ex:["Worldwide, diabetes and high blood pressure are the leading causes of chronic kidney disease. Other important causes include glomerular diseases, inherited conditions such as polycystic kidney disease, repeated kidney infections, urinary obstruction, kidney stones, and some medicines or toxins.","Non-modifiable factors include age, family history and genetics, and being born with low birth weight or prematurely (which may be associated with fewer nephrons). Some genetic variants are more common in certain ancestral populations — for example, APOL1 variants found mainly among people with recent West African ancestry are associated with higher risk of some kidney diseases.","Modifiable or partly modifiable factors include blood pressure, blood glucose, smoking, obesity-related metabolic health, physical inactivity, high sodium intake, and repeated use of certain medicines such as non-steroidal anti-inflammatory drugs (NSAIDs). Environmental factors include extreme heat exposure, contaminated water, heavy metals and some occupational chemicals."],sci:["Social determinants strongly shape kidney health: income, education, food and water security, housing, distance from clinics and the cost of medicines all affect who develops CKD and who receives timely care. The ISN Global Kidney Health Atlas documents large differences between countries in nephrology workforce and access to dialysis and transplantation. These are structural issues, not personal failings."],pr:["Knowing your risk factors helps you decide, with a clinician, whether kidney testing is appropriate. Many guidelines recommend testing people with diabetes, hypertension, cardiovascular disease or a family history of kidney failure."],sc:"Joseph, 45, works long hours and lives far from a clinic. He has a family history of kidney failure. He learns that community screening programmes and pharmacy blood pressure checks are practical first steps.",my:[["Kidney disease is caused by personal lifestyle choices.","Genetics, other illnesses, environment and social circumstances play major roles."],["Only older people get kidney disease.","Kidney disease can occur at any age, including childhood."]],rc:["Diabetes and hypertension are leading causes.","Genetics, birth factors and age matter.","Environment and social conditions strongly influence risk and access to care."],rf:["niddk-ckd-causes","isn-atlas","who-htn","who-dm"],bk:[11,18],fl:["Medical (diabetes, BP)","Genetic & birth factors","Environment & work","Social access to care"]},{n:7,t:"Understanding Kidney and Urinary Symptoms",fig:"symptoms",obj:["Recognise symptoms that can be associated with kidney or urinary conditions","Understand why early kidney disease is often silent","Know which symptoms need urgent medical attention"],ex:["Urinary tract symptoms tend to be noticeable: burning or pain when urinating, needing to urinate urgently or frequently, cloudy or bloody urine, or difficulty starting the stream. Kidney stones often cause severe, wave-like pain in the side or back that can spread to the groin. Kidney infections may cause fever, shivering and flank pain.","Chronic kidney disease, by contrast, is often silent until it is advanced. When symptoms appear they can be vague: tiredness, swelling of the ankles or around the eyes, foamy urine (which may reflect protein), itching, poor appetite, nausea, muscle cramps, trouble sleeping or needing to urinate at night. These symptoms have many possible causes and are not specific to kidneys.","Because symptoms are unreliable, kidney disease is usually detected through blood tests (creatinine to estimate GFR) and urine tests (albumin-to-creatinine ratio, urinalysis) — particularly in people with risk factors."],sci:["Silence in early CKD reflects the kidneys' reserve: remaining nephrons increase their individual workload (hyperfiltration), keeping blood chemistry near normal until a large proportion of function is lost."],pr:["Do not wait for symptoms if you have risk factors — ask about testing. And do not assume a symptom means kidney disease; many are common and harmless, but persistent changes deserve assessment."],sc:"Sofia notices ankle swelling after a long flight. It settles within a day. Her neighbour's swelling, by contrast, has persisted for weeks along with foamy urine — a pattern that warrants medical assessment.",my:[["Back pain usually means kidney problems.","Most back pain is musculoskeletal. Kidney pain is typically higher, in the flank, and often accompanied by other symptoms."],["No symptoms means healthy kidneys.","Early CKD is often symptom-free; testing is needed to detect it."]],sf:"Seek urgent help for: inability to urinate with pain, severe flank pain with fever, visible blood in urine with clots or feeling unwell, confusion, or breathlessness with swelling. See the Emergency Information page.",rc:["Urinary symptoms are often obvious; CKD often silent.","Late CKD symptoms are non-specific.","Testing, not symptoms, detects early disease."],rf:["niddk-ckd-what","nhs-ckd","nhs-kinf","niddk-hematuria"],fl:["Noticeable urinary symptoms","Silent early CKD","Vague late symptoms","Testing detects disease"]},{n:8,t:"Common Kidney Health Myths",fig:"urinecolour",obj:["Evaluate popular kidney 'detox' and 'cleanse' claims","Explain why more water is not always better","Understand what urine colour can and cannot tell you"],ex:["Myth: kidneys need detox drinks or herbal cleanses. Healthy kidneys continuously clear waste without special products. No credible clinical evidence shows that commercial 'kidney cleanse' products improve kidney function, and some herbal products have caused kidney injury — for example, products containing aristolochic acid have been linked with severe kidney disease and urinary tract cancers.","Myth: the more water, the healthier. Adequate fluid matters, and some people (for example, those prone to certain kidney stones) may be advised by clinicians to drink more. But drinking very large volumes quickly can dilute blood sodium (hyponatraemia), which can be dangerous. Fluid needs vary with climate, activity, body size, pregnancy, breastfeeding and health conditions — and people with heart failure or advanced kidney disease may need limits set by their care team.","Myth: urine colour diagnoses kidney health. Pale straw-coloured urine often suggests adequate hydration and darker urine more concentrated urine, but colour is influenced by foods (beetroot), vitamins (B vitamins can turn urine bright yellow), medicines and time of day. Colour cannot diagnose kidney disease; red, brown or persistently unusual urine needs assessment."],sci:["Supplement claims of 'kidney regeneration' are not supported by human clinical trials. Supplements may contain contaminants, interact with medicines, or contain potassium, phosphorus or herbs that are unsafe when kidney function is reduced. Animal or cell studies cannot prove human benefit."],pr:["When you see a kidney product claim, ask: Who is selling it? What human evidence exists? Has a regulator reviewed it? Could it interact with my medicines? Discuss with a pharmacist or doctor before use."],sc:"Daniel sees an online advert for a '7-day kidney flush'. Using the questions above, he finds no clinical trials, an unlisted ingredient list and testimonials only. He decides not to buy it.",my:[["'Kidney cleanses' remove toxins.","Healthy kidneys already clear waste; cleanse products lack evidence and some herbs are harmful."],["Clear urine all day is the goal.","Consistently colourless urine can mean drinking more than needed; very large intakes can be harmful."],["Cranberry cures kidney disease.","Evidence for cranberry relates mainly to reducing recurrent bladder infections in some groups — not treating kidney disease."]],sf:"Never stop prescribed medicines or begin supplements for kidney health without professional advice.",rc:["No product 'cleanses' kidneys.","More water is not always better.","Urine colour is a rough hint, not a diagnosis.","Some herbal products are nephrotoxic."],rf:["medline-hypona","efsa-water","nhs-dehyd","niddk-how"],bk:[10],fl:["Claim appears","Check human evidence","Consider safety & interactions","Ask a professional"]}],Jy=[{n:9,t:"Location and External Anatomy of the Kidneys",fig:"external",obj:["Describe the position of the kidneys relative to the spine and ribs","Name the protective layers around each kidney","Identify structures at the renal hilum"],ex:["The kidneys lie behind the lining of the abdominal cavity (retroperitoneal), roughly between the levels of the twelfth thoracic and third lumbar vertebrae. The right kidney usually sits slightly lower than the left because the liver lies above it. The lower ribs partly protect the upper poles.","Each adult kidney is about 10–12 cm long, 5–7 cm wide and 3 cm thick, typically weighing around 120–170 g. Its concave inner border contains the hilum — the entry point for the renal artery and nerves and the exit point for the renal vein and the ureter (via the renal pelvis).","Three protective layers surround each kidney: the renal (fibrous) capsule, a tough membrane directly on the surface; the perirenal fat, a cushioning layer; and the renal fascia, connective tissue that anchors the kidney to surrounding structures. On top of each kidney sits an adrenal gland, which produces hormones including aldosterone and cortisol but is a separate organ."],sci:["The kidney's position explains why kidney pain is usually felt in the flank (the side of the back below the ribs) and why some imaging and biopsy procedures are performed from the back. Kidney size on ultrasound is one clue clinicians use: small kidneys often suggest long-standing disease, while enlarged kidneys can occur in polycystic kidney disease or obstruction."],pr:["Contact sports injuries to the flank can occasionally injure a kidney; blood in urine after trauma always needs medical assessment."],sc:"Aiyana, a physiotherapy student, palpates surface landmarks on a classmate and marks the approximate kidney positions relative to the twelfth rib and the spine.",my:[["Kidneys are in the lower back near the hips.","They are higher — partly under the lower ribs."],["The adrenal glands are part of the kidney.","They sit on top of the kidneys but are separate endocrine glands."]],rc:["Retroperitoneal, roughly T12–L3.","Right kidney slightly lower.","Capsule, perirenal fat and renal fascia protect each kidney.","The hilum carries vessels, nerves and the ureter."],rf:["niddk-how","statpearls-renal"],bk:[17],fl:["Renal fascia (anchor)","Perirenal fat (cushion)","Renal capsule (surface)","Hilum: artery in, vein & ureter out"]},{n:10,t:"Internal Kidney Structure",fig:"cross",obj:["Identify the cortex, medulla, pyramids, papillae, calyces and renal pelvis","Explain how internal structure supports urine concentration and drainage"],ex:["Cut a kidney lengthwise and two zones are visible. The outer renal cortex is granular and contains the glomeruli and most of the tubules' twisting segments. The inner renal medulla is arranged into 8–18 cone-shaped renal pyramids, striped because of parallel loops of Henle, collecting ducts and blood vessels.","Between the pyramids, extensions of cortex called renal columns carry blood vessels. The tip of each pyramid, the renal papilla, releases urine into a cup-shaped minor calyx. Several minor calyces join to form major calyces, which drain into the funnel-shaped renal pelvis, which narrows into the ureter.","The renal sinus is the space within the kidney that holds the pelvis, calyces, vessels and fat."],sci:["The arrangement is functional: the cortex is where filtration occurs, while the medulla's parallel tubules and vessels create a salt gradient that becomes most concentrated at the papillae. This gradient lets the kidneys produce urine more concentrated than blood when water must be conserved (see Chapters 15 and 30)."],pr:["Kidney stones often form in the calyces and pelvis; imaging reports may mention these locations. Swelling of the pelvis and calyces from blocked drainage is called hydronephrosis."],sc:"Using the Anatomy Explorer in this app, Tomás clicks each region of the cross-section and writes its function in his own words.",my:[["The kidney is uniform inside.","It has distinct zones — cortex and medulla — with different roles."]],rc:["Cortex = filtration zone.","Medulla = pyramids and concentrating gradient.","Papilla → minor calyx → major calyx → renal pelvis → ureter."],rf:["niddk-how","statpearls-renal"],fl:["Cortex filters","Pyramids concentrate","Calyces collect","Pelvis drains to ureter"]},{n:11,t:"The Nephron: The Functional Unit of the Kidney",fig:"nephron",obj:["Name the parts of a nephron in order","Distinguish cortical from juxtamedullary nephrons","Explain why nephron number matters"],ex:["A nephron is a microscopic tube with a filtering unit at one end. Its parts, in order of fluid flow, are: the renal corpuscle (glomerulus plus Bowman's capsule), the proximal convoluted tubule, the loop of Henle (descending and ascending limbs), and the distal convoluted tubule, which drains into a collecting duct shared by many nephrons.","Most nephrons (about 85%) are cortical nephrons with short loops that dip only slightly into the medulla. About 15% are juxtamedullary nephrons with long loops reaching deep into the medulla; these are especially important for building the concentration gradient.","Each nephron is wrapped in blood vessels. Blood leaving the glomerulus flows into peritubular capillaries around the tubules, and in juxtamedullary nephrons into long, straight vessels called vasa recta."],sci:["Nephron number is largely fixed before birth and varies widely between people. When nephrons are lost through disease or ageing, the remaining ones increase their filtration. This adaptation preserves overall function in the short term but may contribute to further damage over time, especially when combined with high blood pressure or diabetes."],pr:["Protecting the nephrons you have — by managing blood pressure and blood glucose and avoiding unnecessary nephrotoxic medicines — is a central idea in kidney health."],sc:"Priya builds a pipe-cleaner model of a nephron for a school science fair, colour-coding each segment to match this book's diagrams.",my:[["Damaged nephrons regrow.","Tubule cells can repair after some injuries, but lost nephrons are not replaced."]],rc:["Corpuscle → PCT → loop of Henle → DCT → collecting duct.","Cortical vs juxtamedullary nephrons.","Nephron loss leads to compensatory hyperfiltration."],rf:["niddk-how","statpearls-renal"],fl:["Glomerulus filters","Tubules reclaim & secrete","Loop builds gradient","Collecting duct fine-tunes"]},{n:12,t:"Glomeruli and Glomerular Filtration",fig:"barrier",obj:["Describe the three layers of the glomerular filtration barrier","Explain the forces that drive filtration","Define GFR, filtration fraction and autoregulation"],ex:["The glomerulus is a tuft of specialised capillaries. Blood enters through the afferent arteriole and leaves through the efferent arteriole. Because the efferent arteriole is relatively narrow, pressure inside the glomerulus stays high, pushing fluid out into Bowman's space.","The filtration barrier has three layers: the fenestrated endothelium (capillary lining with pores), the glomerular basement membrane (a negatively charged mesh), and podocytes — cells with interlocking foot processes separated by slit diaphragms. Together they let water and small solutes (sodium, glucose, urea) pass freely while largely holding back blood cells and large proteins such as albumin.","Glomerular filtration rate (GFR) is the volume of fluid filtered by all glomeruli per minute — around 90–120 mL/min in healthy young adults, often adjusted to a standard body surface area of 1.73 m². The filtration fraction is the share of plasma flowing through the kidneys that is filtered — typically about 20%."],sci:["Filtration depends on the balance of 'Starling forces': glomerular capillary pressure pushes fluid out, while pressure in Bowman's space and the protein-driven (oncotic) pressure of blood oppose it.","Renal autoregulation keeps GFR relatively stable across a wide range of blood pressures (roughly a mean arterial pressure of 80–180 mmHg). Two mechanisms work together: the myogenic response, in which the afferent arteriole constricts when stretched, and tubuloglomerular feedback, in which the macula densa senses salt delivery and adjusts afferent arteriole tone."],pr:["Damage to the filtration barrier — from diabetes, high blood pressure or glomerular disease — allows albumin to leak into urine. That is why urine albumin testing is a sensitive early marker of kidney damage."],sc:"A teacher uses a kitchen sieve analogy: water and salt pass, rice grains (blood cells) and beans (albumin) are held back. Students then discuss where the analogy falls short — the barrier is also charge-selective and dynamic.",my:[["Filtration means the kidney chooses what to remove.","Filtration is largely non-selective for small molecules; selection happens mainly afterward in the tubules."],["Protein in urine is harmless.","Persistent albuminuria is a marker of kidney damage and higher cardiovascular risk."]],rc:["Three-layer barrier: endothelium, GBM, podocytes.","Pressure balance drives filtration.","GFR ~90–120 mL/min; filtration fraction ~20%.","Autoregulation stabilises GFR."],rf:["statpearls-renal","kdigo-ckd","medline-gfr"],fl:["Afferent arteriole delivers blood","High pressure in glomerulus","Barrier sieves by size & charge","Filtrate enters Bowman's space"]},{n:13,t:"Bowman's Capsule and Filtrate Formation",fig:"glomerulus",obj:["Describe the structure of Bowman's capsule","List what filtrate normally contains and lacks","Explain the juxtaglomerular apparatus"],ex:["Bowman's capsule is a double-walled cup surrounding the glomerulus. Its inner layer is formed by podocytes hugging the capillaries; its outer (parietal) layer is a thin sheet of flat cells. The space between them — Bowman's space — collects the filtrate and channels it into the proximal tubule.","Filtrate initially resembles plasma without most of its proteins. It contains water, sodium, potassium, chloride, bicarbonate, glucose, amino acids, urea, creatinine and many small drug molecules. It normally contains almost no red blood cells and very little albumin.","Next to each glomerulus lies the juxtaglomerular apparatus: specialised cells of the distal tubule (the macula densa) that sense salt, and granular cells in the afferent arteriole that release renin. This tiny structure links filtration to whole-body blood pressure control."],sci:["Filtrate composition changes immediately once it enters the tubule. Its glucose concentration at the start equals that of plasma; normally nearly all of it is reabsorbed in the proximal tubule. When blood glucose exceeds the tubules' transport capacity (as in uncontrolled diabetes), glucose appears in urine."],pr:["Finding red cells or protein in urine suggests something has disrupted the corpuscle or urinary tract — a reason for further assessment, not self-diagnosis."],sc:"In a revision group, students compare a list of plasma components with filtrate and identify the 'missing' items: blood cells and most proteins.",my:[["Filtrate is the same as urine.","Filtrate is modified extensively before becoming urine; ~99% of its volume is reclaimed."]],rc:["Bowman's capsule collects filtrate.","Filtrate ≈ plasma minus cells and most proteins.","Juxtaglomerular apparatus links salt sensing to renin release."],rf:["statpearls-renal","niddk-how"],fl:["Blood in glomerulus","Podocyte slits filter","Bowman's space collects","Filtrate → proximal tubule"]},{n:14,t:"Proximal Tubule Function",fig:"pct",obj:["Describe the bulk reabsorption role of the proximal tubule","Explain sodium-coupled transport","Describe secretion of organic acids and drugs"],ex:["The proximal convoluted tubule (PCT) is the workhorse of reabsorption. Its cells are packed with mitochondria and have a 'brush border' of microvilli that greatly increases surface area. It reclaims about two-thirds of filtered sodium and water, nearly all filtered glucose and amino acids, most bicarbonate, and much of the potassium, phosphate and calcium.","Most transport is driven by the sodium–potassium pump (Na⁺/K⁺-ATPase) on the blood side of the cell, which keeps sodium inside the cell low. Sodium then flows in from the tubule, carrying glucose (via SGLT2 and SGLT1 transporters), amino acids or phosphate with it. Water follows by osmosis, partly through aquaporin-1 channels.","The PCT also secretes substances into the tubule, including many organic acids and bases and medicines such as penicillins and some diuretics. It produces ammonia and creates new bicarbonate, contributing to acid–base balance, and it hosts the enzyme that activates vitamin D."],sci:["SGLT2 inhibitor medicines, originally developed for diabetes, block glucose and sodium reabsorption in the PCT. Large clinical trials have shown they slow kidney disease progression in many people with CKD, with or without diabetes. They are prescription medicines chosen by clinicians based on individual circumstances."],pr:["Because the PCT is metabolically busy, it is vulnerable to low oxygen and to some toxins and medicines — one reason it is often injured in acute kidney injury."],sc:"Hassan learns that his diabetes medicine works partly in the proximal tubule. He writes down questions to ask his pharmacist about how it relates to his kidneys.",my:[["Glucose in urine is always normal after sweets.","In people without diabetes, glucose is normally fully reabsorbed; glycosuria warrants assessment (some medicines cause it intentionally)."]],rc:["PCT reclaims ~65–70% of sodium & water, nearly all glucose & amino acids.","Na⁺/K⁺-ATPase powers transport.","PCT secretes drugs and organic acids and activates vitamin D."],rf:["statpearls-renal","kdigo-ckd"],bk:[11],fl:["Na⁺/K⁺ pump lowers cell sodium","Sodium enters with glucose/amino acids","Water follows osmotically","Drugs & acids secreted"]},{n:15,t:"Loop of Henle",fig:"loop",obj:["Contrast the permeability of descending and ascending limbs","Explain countercurrent multiplication","Explain countercurrent exchange by the vasa recta"],ex:["The loop of Henle is a hairpin that dips into the medulla. The thin descending limb is permeable to water but not very permeable to salt. The ascending limb — especially the thick ascending limb — is impermeable to water but actively pumps sodium, potassium and chloride out via the NKCC2 transporter.","Because salt is pumped out of the ascending limb without water following, the surrounding medullary tissue becomes salty. This draws water out of the descending limb, making the fluid inside more concentrated as it travels down. The more concentrated fluid then reaches the ascending limb, where even more salt can be pumped out. Repeating this 'single effect' along the loop multiplies a small difference into a large gradient — from about 300 mOsm/kg in the cortex to as much as 1,200 mOsm/kg at the papilla in humans. This is countercurrent multiplication.","The vasa recta — long hairpin capillaries — run alongside the loops. Blood flowing down picks up salt and loses water; flowing back up, it does the reverse. This countercurrent exchange supplies oxygen and nutrients to the medulla without washing away the gradient."],sci:["Urea recycling adds to the gradient: urea leaving the inner medullary collecting duct accumulates in the interstitium. Loop diuretics such as furosemide block NKCC2, reducing the gradient and greatly increasing urine output; they are prescribed for conditions such as fluid overload."],pr:["The gradient built here allows the collecting duct, under ADH, to concentrate urine and conserve water during dehydration (Chapter 30)."],sc:"Using the Nephron Simulator, Emma watches salt pumped from the ascending limb and water leaving the descending limb, then explains 'multiplication' to a classmate.",my:[["The loop of Henle concentrates urine directly.","Fluid leaving the loop is actually dilute; the loop creates the medullary gradient that the collecting duct uses under ADH."]],rc:["Descending limb: water out.","Ascending limb: salt out, water stays.","Countercurrent multiplication builds a gradient up to ~1,200 mOsm/kg.","Vasa recta exchange preserves it."],rf:["statpearls-renal"],fl:["Ascending limb pumps salt out","Medulla becomes salty","Descending limb loses water","Gradient multiplies along the loop"]}],$y=[{n:16,t:"Distal Tubule and Collecting Duct",fig:"dct",obj:["Describe fine-tuning of sodium, potassium and calcium in the distal nephron","Explain the roles of principal and intercalated cells","Link these segments to aldosterone and ADH"],ex:["After the loop, the distal convoluted tubule (DCT) reabsorbs a further 5–10% of filtered sodium through the sodium–chloride cotransporter (NCC), the target of thiazide diuretics. It is also a key site of hormonally regulated calcium reabsorption, influenced by parathyroid hormone.","The collecting duct contains two main cell types. Principal cells reabsorb sodium through epithelial sodium channels (ENaC) and secrete potassium; both processes are increased by aldosterone. Principal cells also insert aquaporin-2 water channels when ADH is present. Intercalated cells secrete acid (type A) or bicarbonate (type B) to fine-tune blood pH.","Although these segments handle only a small fraction of the filtered load, they determine the final composition of urine. They are where hormones exert precise control."],sci:["Some medicines act here: thiazides on the DCT, and potassium-sparing diuretics (such as amiloride or mineralocorticoid receptor antagonists) on principal cells. Because these medicines alter sodium and potassium handling, blood tests are often used to monitor people taking them."],pr:["This explains why blood pressure medicines and diuretics can change blood potassium and sodium levels, and why clinicians check blood tests after starting or changing them."],sc:"Grace's doctor mentions a blood test two weeks after starting a new blood pressure tablet. Grace learns this checks electrolytes the distal nephron controls.",my:[["Small segments do little.","The distal nephron sets final urine composition under hormonal control."]],rc:["DCT: NCC sodium transport and calcium regulation.","Principal cells: ENaC, potassium secretion, aquaporin-2.","Intercalated cells: acid–base fine-tuning."],rf:["statpearls-renal","medline-k"],bk:[17],fl:["DCT reclaims Na⁺ & Ca²⁺","Aldosterone → Na⁺ in, K⁺ out","ADH → water channels","Intercalated cells adjust pH"]},{n:17,t:"Renal Blood Supply",fig:"blood",obj:["Trace blood from the renal artery to the renal vein","Explain the significance of two capillary beds in series","Describe why the medulla is vulnerable to low oxygen"],ex:["Each kidney receives a renal artery branching directly from the abdominal aorta. It divides into segmental, interlobar, arcuate and interlobular (cortical radiate) arteries, then into afferent arterioles that supply each glomerulus.","Unusually, blood passes through two capillary beds in series. After the glomerular capillaries, it flows into the efferent arteriole and then into peritubular capillaries (in the cortex) or vasa recta (in the medulla), where reabsorbed substances are taken back into the blood. Veins then follow a reverse pathway to the renal vein and inferior vena cava.","Together the kidneys receive about 1–1.2 litres of blood per minute at rest — roughly 20–25% of cardiac output."],sci:["Most renal blood flow goes to the cortex. The medulla receives relatively little, and its oxygen levels are low because of countercurrent exchange in the vasa recta and the high energy demand of the thick ascending limb. This makes the outer medulla vulnerable during low blood pressure or severe dehydration — a factor in acute kidney injury."],pr:["Conditions that reduce kidney blood flow — severe dehydration, blood loss, heart failure, narrowing of the renal arteries — can lower GFR. Some medicines alter arteriole tone, which is why combinations such as NSAIDs with certain blood pressure medicines and diuretics need care."],sc:"A medical student traces the vascular tree on the app's diagram and explains why a narrow renal artery could reduce filtration and trigger renin release.",my:[["The kidneys need little blood because they are small.","They receive about a fifth of cardiac output — much more than their size suggests."]],rc:["Aorta → renal artery → … → afferent arteriole → glomerulus → efferent arteriole → peritubular capillaries/vasa recta → veins.","~20–25% of cardiac output.","Medulla has low oxygen and is vulnerable."],rf:["statpearls-renal","nice-ng148"],bk:[18],fl:["Renal artery from aorta","Afferent → glomerulus","Efferent → peritubular/vasa recta","Renal vein to vena cava"]},{n:18,t:"Kidney Filtration and Reabsorption",fig:"stages",obj:["Define filtration, reabsorption, secretion and excretion","Write the renal handling equation in words","Give examples of substances handled differently"],ex:["Four processes determine what ends up in urine. Filtration moves fluid and small solutes from blood into Bowman's space. Reabsorption moves substances from the tubule back into blood. Secretion moves substances from blood into the tubule. Excretion is what finally leaves in urine.","In words: amount excreted = amount filtered − amount reabsorbed + amount secreted.","Different substances follow different patterns. Glucose is filtered and normally almost completely reabsorbed, so excretion is near zero. Creatinine is filtered and slightly secreted, with little reabsorption, which is why it is used to estimate GFR. Potassium is filtered, mostly reabsorbed early, and then secreted in the distal nephron according to the body's needs. Many drugs are actively secreted in the proximal tubule."],sci:["Clearance is the volume of plasma completely cleared of a substance per minute. A substance freely filtered and neither reabsorbed nor secreted (such as inulin, used in research) has a clearance equal to GFR. Creatinine clearance slightly overestimates GFR because of tubular secretion."],pr:["This framework explains why some medicines (for example, trimethoprim) can raise blood creatinine without damaging the kidneys — they block creatinine secretion. Interpreting such changes requires clinical expertise."],sc:"Students sort cards (glucose, sodium, creatinine, penicillin, albumin, urea) into handling patterns and check their answers in the Nephron Simulator.",my:[["Filtration and reabsorption are the same thing.","Filtration moves fluid out of blood into the tubule; reabsorption returns substances to blood."]],rc:["Excreted = filtered − reabsorbed + secreted.","Glucose: reabsorbed; creatinine: filtered + slightly secreted; drugs: often secreted.","Clearance links handling to GFR."],rf:["statpearls-renal","medline-creat"],fl:["Filtration (blood → tubule)","Reabsorption (tubule → blood)","Secretion (blood → tubule)","Excretion (urine)"]},{n:19,t:"How Urine Is Formed",fig:"stages",obj:["Trace a drop of plasma through every nephron segment","Describe how volume and composition change along the way","List the main components of normal urine"],ex:["Imagine 180 L of plasma filtered in a day. In the proximal tubule about two-thirds of the water and sodium, nearly all glucose and amino acids, and most bicarbonate are reclaimed. Drugs and organic acids are secreted.","In the loop of Henle, water leaves the descending limb and salt leaves the ascending limb, building the medullary gradient and delivering dilute fluid to the distal tubule. The distal tubule fine-tunes sodium and calcium. In the collecting duct, aldosterone adjusts sodium and potassium, intercalated cells adjust acid, and ADH determines how much water is reclaimed.","The result is usually 1–2 L of urine per day, though volume varies widely with intake, climate and activity. Urine is mostly water, with urea, creatinine, uric acid, sodium, potassium, chloride, ammonium and other solutes. Its pH typically ranges from about 4.5 to 8."],sci:["Urine passes from collecting ducts into papillae, calyces and the renal pelvis, then down the ureter. Small amounts of protein (mostly not albumin) and occasional cells are normal; persistent albumin, blood, glucose or many white cells are not."],pr:["A urinalysis checks several of these components. Abnormal findings point clinicians toward further tests rather than providing a diagnosis on their own."],sc:"Leila keeps a learning journal tracking an imaginary 'drop' of filtrate through each station and writes one sentence for what happens there.",my:[["Urine is sterile and pure water.","Urine contains many dissolved substances; and while normally it has few bacteria, it is not 'pure water'."]],rc:["PCT bulk reabsorption → loop gradient → DCT tuning → collecting duct hormonal control.","Typical output 1–2 L/day, highly variable.","Urine composition reflects intake and body needs."],rf:["niddk-how","medline-ua","statpearls-renal"],fl:["180 L filtered","PCT reclaims ~2/3","Loop & DCT adjust","Collecting duct sets final 1–2 L"]},{n:20,t:"Hormones That Regulate Kidney Function",fig:"adh",obj:["Describe the actions of ADH, aldosterone, angiotensin II, natriuretic peptides and PTH on the kidney","Describe hormones made by the kidney: renin, EPO, calcitriol"],ex:["Antidiuretic hormone (ADH, also called vasopressin) is released from the posterior pituitary when blood becomes too concentrated or blood volume falls substantially. It inserts aquaporin-2 channels into collecting duct cells, allowing water to be reclaimed and urine to be concentrated.","Aldosterone, from the adrenal cortex, increases sodium reabsorption and potassium secretion in the collecting duct. It is released in response to angiotensin II and to high blood potassium. Natriuretic peptides (ANP and BNP), released by the stretched heart, do the opposite: they promote sodium and water excretion. Parathyroid hormone (PTH) increases calcium reabsorption, decreases phosphate reabsorption and stimulates vitamin D activation. FGF23, from bone, also increases phosphate excretion.","The kidney itself makes renin (starting the RAAS), erythropoietin (stimulating red blood cell production when oxygen delivery falls) and calcitriol (active vitamin D, formed in the proximal tubule)."],sci:["When kidney function declines, EPO production often falls, contributing to anaemia; calcitriol production falls and phosphate excretion decreases, contributing to mineral and bone disorder. These hormone effects explain several complications of advanced CKD."],pr:["Hormone systems are targets of many common medicines — ACE inhibitors, angiotensin receptor blockers, diuretics and mineralocorticoid receptor antagonists. Never adjust these without your prescriber."],sc:"Olumide creates a two-column table: 'hormones acting on the kidney' and 'hormones made by the kidney' to prepare for an exam.",my:[["Kidneys are not endocrine organs.","They produce renin, erythropoietin and active vitamin D."]],rc:["ADH → water; aldosterone → Na⁺ in/K⁺ out; ANP → Na⁺ out; PTH → Ca²⁺ in/phosphate out.","Kidney makes renin, EPO, calcitriol."],rf:["statpearls-renal","niddk-anemia","niddk-mbd","ods-d"],bk:[17],fl:["Brain: ADH","Adrenal: aldosterone","Heart: natriuretic peptides","Kidney: renin, EPO, calcitriol"]},{n:21,t:"The Renin-Angiotensin-Aldosterone System",fig:"raas",obj:["Describe each step of the RAAS cascade","List triggers for renin release","Explain how medicines target the system"],ex:["The renin–angiotensin–aldosterone system (RAAS) defends blood pressure and body sodium. Renin is released from the juxtaglomerular cells when blood pressure in the afferent arteriole falls, when the macula densa senses low salt delivery, or when sympathetic nerves are activated.","Renin converts angiotensinogen (made by the liver) into angiotensin I. Angiotensin-converting enzyme (ACE), found especially in the lungs' blood vessels, converts angiotensin I into angiotensin II.","Angiotensin II constricts blood vessels, stimulates aldosterone release, increases sodium reabsorption in the proximal tubule, triggers thirst and ADH release, and constricts the efferent arteriole more than the afferent, helping maintain GFR when pressure is low."],sci:["Over-activity of the RAAS contributes to hypertension, heart failure and kidney damage. ACE inhibitors and angiotensin receptor blockers (ARBs) reduce angiotensin II effects and lower intraglomerular pressure, which reduces albuminuria and slows progression in many types of CKD. Because they relax the efferent arteriole, a small, expected rise in creatinine can occur after starting them; clinicians interpret this in context."],pr:["If you take an ACE inhibitor or ARB, your clinician will usually check kidney function and potassium. Some health systems give advice about these medicines during dehydrating illnesses — ask your own clinician or pharmacist what applies to you."],sc:"Ahmed's creatinine rose slightly after starting an ACE inhibitor. His doctor explained this can be an expected effect, and planned a repeat test. Ahmed did not stop the medicine on his own.",my:[["Any creatinine rise on blood pressure medicine means damage.","A small rise can be an expected haemodynamic effect; clinicians decide what is acceptable."]],sf:"Never stop or change blood pressure medicines without professional advice.",rc:["Renin → angiotensin I → (ACE) → angiotensin II → aldosterone.","Raises blood pressure and conserves sodium.","ACE inhibitors/ARBs reduce albuminuria and protect kidneys in many people."],rf:["statpearls-renal","kdigo-bp","niddk-hbp"],bk:[18],fl:["Low pressure → renin","Angiotensinogen → Ang I","ACE → Ang II","Vasoconstriction + aldosterone"]},{n:22,t:"Kidney Function and Blood Pressure",fig:"bp",obj:["Explain the two-way relationship between kidneys and blood pressure","Describe pressure natriuresis","Recognise hypertension as a silent risk"],ex:["The kidneys set long-term blood pressure largely by controlling sodium and water balance. When pressure rises, healthy kidneys excrete more sodium and water — 'pressure natriuresis' — bringing pressure back down. If the kidneys need a higher pressure to excrete the same amount of sodium, blood pressure settles at a higher level.","The relationship runs both ways. High blood pressure damages small blood vessels in the kidneys, scarring glomeruli over time. Damaged kidneys, in turn, retain sodium and activate the RAAS, raising blood pressure further — a vicious cycle.","The World Health Organization reports that hypertension affects over a billion adults worldwide and that many are unaware of it, because it usually causes no symptoms."],sci:["In CKD, blood pressure control and reducing albuminuria are two of the most effective ways to slow progression and reduce cardiovascular risk. Target blood pressures differ between guidelines and individuals; KDIGO and national bodies publish recommendations that clinicians tailor."],pr:["Regular blood pressure checks — at clinics, pharmacies or with validated home monitors — are one of the simplest ways to protect kidney health. Reducing excess dietary sodium supports blood pressure for many people."],sc:"Ana's pharmacy offers free blood pressure checks. A raised reading leads her to see a doctor, who recommends repeat measurements and a kidney blood and urine test.",my:[["You can feel high blood pressure.","Usually you cannot — measurement is the only reliable way to know."]],rc:["Kidneys control long-term pressure via sodium balance.","Hypertension damages kidneys; kidney damage raises pressure.","Measure blood pressure regularly."],rf:["niddk-hbp","who-htn","kdigo-bp","who-salt"],bk:[18],fl:["Pressure rises","Kidneys excrete more Na⁺/water","Volume falls","Pressure normalises (if kidneys healthy)"]}],ep=[{n:23,t:"Water Balance and Kidney Function",fig:"water",obj:["Describe sources of water gain and loss","Explain how thirst and ADH maintain balance","Describe body fluid compartments"],ex:["About half to two-thirds of adult body weight is water, depending on age, sex and body composition. Roughly two-thirds is inside cells (intracellular fluid) and one-third outside (extracellular fluid: plasma and the fluid between cells).","Water comes from drinks, food (fruits, vegetables, soups, porridges) and metabolism. It is lost through urine, faeces, breath and skin — insensible losses — and sweat. Losses rise in heat, with exercise, fever, vomiting or diarrhoea.","Balance is controlled mainly by two linked systems: thirst, which drives intake, and ADH, which controls how much water the kidneys reclaim. Both respond primarily to blood concentration (osmolality), sensed in the brain's hypothalamus, and also to large falls in blood volume or pressure."],sci:["Plasma osmolality is normally kept around 275–295 mOsm/kg. A change of only 1–2% triggers ADH changes. The kidneys can vary urine concentration from very dilute (about 50 mOsm/kg) to very concentrated (up to about 1,200 mOsm/kg), giving great flexibility."],pr:["For most healthy people, thirst together with regular drinking at meals and in hot conditions is a reasonable guide. Some groups — infants, older adults, people with cognitive impairment, athletes and outdoor workers in heat — may not rely on thirst alone. People with heart failure or advanced kidney disease may be given individual fluid guidance by their care team."],sc:"Chen, an office worker in Singapore, notices he drinks more on humid days and his urine is darker after a long meeting without a drink. He connects this to thirst and ADH.",my:[["Everyone needs exactly 8 glasses a day.","Needs vary with climate, activity, body size, diet and health; food also provides water."]],rc:["Body water: ~2/3 intracellular, 1/3 extracellular.","Thirst controls intake; ADH controls output.","Kidneys adjust urine from very dilute to very concentrated."],rf:["efsa-water","statpearls-renal"],bk:[21],fl:["Water in: drinks, food, metabolism","Water out: urine, sweat, breath, faeces","Hypothalamus senses osmolality","Thirst + ADH restore balance"]},{n:24,t:"Sodium and Fluid Regulation",fig:"sodium",obj:["Explain sodium's role in extracellular fluid volume","Distinguish sodium balance from sodium concentration","Describe where the nephron reabsorbs sodium"],ex:["Sodium is the main positively charged particle in extracellular fluid. Because water follows sodium, total body sodium largely determines extracellular fluid volume — and so blood volume and blood pressure.","It is important to separate two ideas. Sodium balance (total amount) controls volume and is regulated mainly by the RAAS, natriuretic peptides and pressure natriuresis. Blood sodium concentration reflects the ratio of sodium to water and is controlled mainly by ADH and thirst. Low blood sodium (hyponatraemia) usually means too much water relative to sodium, not necessarily too little sodium in the diet.","The nephron reclaims more than 99% of filtered sodium: about 65% in the proximal tubule, 25% in the thick ascending limb, 5–10% in the distal tubule and the remainder in the collecting duct."],sci:["Diuretics work at different sodium transport sites: loop diuretics (thick ascending limb), thiazides (distal tubule), and potassium-sparing diuretics (collecting duct). SGLT2 inhibitors also cause modest sodium loss in the proximal tubule."],pr:["High sodium intake raises blood pressure in many people. WHO recommends adults in the general population consume less than 2 g sodium (about 5 g salt, roughly one level teaspoon) per day. People with kidney disease receive individual advice."],sc:"Fatima's hospital result shows low sodium; she wonders if she should eat more salt. Her clinician explains her low sodium relates to water balance and a medicine, not salt intake.",my:[["Low blood sodium means eat more salt.","Hyponatraemia usually reflects water imbalance; treatment depends on cause and must be guided by clinicians."]],rc:["Sodium amount → fluid volume.","Sodium concentration → water balance.","Most sodium reclaimed in the PCT and loop."],rf:["who-salt","statpearls-renal","medline-hypona"],bk:[10,18],fl:["Sodium intake","Kidney excretes or retains","Water follows sodium","Blood volume & pressure change"]},{n:25,t:"Potassium Balance",fig:"potassium",obj:["Explain why potassium matters for nerves, muscles and heart","Describe internal and external potassium balance","Understand why potassium advice differs between people"],ex:["About 98% of the body's potassium is inside cells; only about 2% is in extracellular fluid. This steep difference creates the electrical potential across cell membranes that allows nerves to fire and muscles — including the heart — to contract properly. Both high (hyperkalaemia) and low (hypokalaemia) blood potassium can cause dangerous heart rhythms.","Internal balance shifts potassium between cells and blood: insulin and adrenaline drive potassium into cells, while acidosis and tissue breakdown can push it out. External balance — matching excretion to intake — is mainly the job of the kidneys, with a smaller role for the gut.","Filtered potassium is mostly reabsorbed early in the nephron; the amount in urine is set by secretion in the collecting duct, which increases with aldosterone, higher blood potassium and greater flow and sodium delivery to the distal nephron."],sci:["When kidney function is significantly reduced, or with medicines such as ACE inhibitors, ARBs, mineralocorticoid receptor antagonists or some potassium-sparing diuretics, potassium excretion can fall. Conversely, diarrhoea, vomiting and some diuretics can cause potassium loss. Blood tests guide management."],pr:["Potassium-rich foods (fruits, vegetables, legumes) support blood pressure in the general population. Restriction is appropriate only for some people with kidney disease, based on blood test results — not for everyone with CKD. Potassium-based salt substitutes can be risky for people with reduced kidney function or taking certain medicines."],sc:"Noura was told to limit potassium years ago; her new tests are normal and her dietitian now encourages more vegetables. She learns that advice changes as results change.",my:[["Everyone with kidney disease must avoid bananas.","Potassium advice depends on blood levels, medicines and stage; many people with CKD do not need restriction."]],sf:"Do not take potassium supplements or salt substitutes containing potassium chloride without professional advice if you have kidney disease or take medicines affecting potassium.",rc:["98% of potassium is inside cells.","Kidneys control external balance via collecting duct secretion.","Both high and low levels affect heart rhythm.","Restriction is individual."],rf:["medline-k","ods-k","niddk-eat","kdoqi-nut"],bk:[10],fl:["Potassium eaten","Insulin shifts K⁺ into cells","Collecting duct secretes K⁺","Blood level stays in range"]},{n:26,t:"Calcium and Phosphorus Regulation",fig:"caphos",obj:["Describe the roles of PTH, calcitriol and FGF23","Explain the kidney's role in mineral balance","Introduce CKD–mineral and bone disorder"],ex:["Calcium and phosphate are essential for bones, teeth, nerve signalling, muscle contraction and energy metabolism. Their blood levels are regulated by a triangle of organs — gut, bone and kidney — and three hormones.","Parathyroid hormone (PTH) is released when blood calcium falls. It increases calcium release from bone, increases calcium reabsorption in the distal tubule, decreases phosphate reabsorption in the proximal tubule, and stimulates the kidney to activate vitamin D. Calcitriol (active vitamin D) increases calcium and phosphate absorption from the gut. FGF23, made by bone, increases urinary phosphate excretion and reduces calcitriol production.","The kidneys are therefore central: they activate vitamin D and adjust urinary calcium and phosphate excretion."],sci:["As CKD progresses, phosphate excretion falls, FGF23 and PTH rise, and calcitriol falls. Over time this can lead to CKD–mineral and bone disorder (CKD-MBD), which affects bone strength and is associated with blood vessel calcification. Management is individual and may include dietary advice, phosphate binders and vitamin D-related medicines."],pr:["Calcium and vitamin D supplements are not automatically helpful or safe for people with kidney disease; decisions should be made with clinicians based on blood tests."],sc:"Pedro, on dialysis, learns why his care team monitors phosphate, calcium and PTH and why his dietitian talks about phosphate additives.",my:[["More calcium is always better for bones.","In CKD, excess calcium can contribute to vascular calcification; needs are individual."]],rc:["PTH, calcitriol and FGF23 control calcium–phosphate balance.","Kidneys activate vitamin D and excrete phosphate.","CKD disrupts this system (CKD-MBD)."],rf:["niddk-mbd","kdigo-mbd","ods-p","ods-d"],bk:[10,17],fl:["Low Ca²⁺ → PTH","Kidney activates vitamin D","Gut absorbs more Ca²⁺","FGF23 & PTH increase phosphate excretion"]},{n:27,t:"Magnesium and Other Electrolytes",fig:"sodium",obj:["Describe the roles of magnesium, chloride and bicarbonate","Explain where magnesium is reabsorbed","Recognise supplement risks in reduced kidney function"],ex:["Magnesium participates in hundreds of enzyme reactions, energy production, nerve and muscle function and heart rhythm. Unlike most electrolytes, most filtered magnesium (about 60–70%) is reabsorbed in the thick ascending limb of the loop of Henle, with fine-tuning in the distal tubule.","Chloride, the main negatively charged particle outside cells, usually travels with sodium and helps maintain electrical neutrality and acid–base balance. Bicarbonate is the body's main buffer and is discussed in Chapter 28. Other substances handled by the kidney include uric acid, sulphate and trace elements.","Low magnesium can result from diarrhoea, some diuretics, long-term use of proton pump inhibitors, alcohol use disorder and certain inherited tubular conditions. It can make low potassium and low calcium harder to correct."],sci:["When kidney function is markedly reduced, magnesium excretion decreases. Magnesium-containing laxatives and antacids can then cause high magnesium levels, which may be dangerous. This is one example of why over-the-counter products deserve pharmacist review."],pr:["Food sources of magnesium include whole grains, legumes, nuts, seeds and leafy greens. Supplements should be discussed with a clinician if you have kidney disease."],sc:"Ines, who has CKD, asks her pharmacist before buying a magnesium-based antacid and is advised on a safer option for her situation.",my:[["Over-the-counter means safe for everyone.","Some OTC products (magnesium, phosphate enemas, NSAIDs) can be risky with reduced kidney function."]],rc:["Magnesium is reabsorbed mainly in the thick ascending limb.","Chloride accompanies sodium; bicarbonate buffers acid.","Reduced kidney function raises magnesium toxicity risk from supplements."],rf:["ods-mg","statpearls-renal"],bk:[10],fl:["Mg²⁺ filtered","Loop reclaims ~60–70%","DCT fine-tunes","Reduced GFR → accumulation risk"]},{n:28,t:"Acid-Base Balance",fig:"acidbase",obj:["Explain blood pH and buffers","Describe the lung and kidney roles in acid–base control","Describe bicarbonate reclamation, new bicarbonate generation and ammonium excretion"],ex:["Blood pH is normally kept between about 7.35 and 7.45. Metabolism constantly produces acid: carbon dioxide (a 'volatile' acid removed by the lungs) and non-volatile acids from protein metabolism, which the kidneys must excrete.","The bicarbonate buffer system neutralises acid quickly. The lungs adjust carbon dioxide within minutes; the kidneys adjust bicarbonate over hours to days. Together they keep pH stable.","The kidneys do three things: reclaim filtered bicarbonate (mostly in the proximal tubule); generate new bicarbonate; and excrete acid, mainly as ammonium (NH₄⁺) and as 'titratable acid' bound to phosphate. Intercalated cells in the collecting duct provide final adjustment."],sci:["In advanced CKD the kidneys produce less ammonium, and metabolic acidosis can develop. Acidosis is associated with bone and muscle loss and faster CKD progression. Clinicians may treat it with dietary changes or medicines such as sodium bicarbonate, based on blood bicarbonate levels. Diets richer in fruits and vegetables produce less acid; research on their role in CKD is promising but advice remains individual."],pr:["Rapid deep breathing, confusion or severe illness in someone with diabetes or kidney disease can signal serious acid–base problems and needs urgent assessment."],sc:"A sports science student compares how the lungs respond in minutes during sprinting, while the kidneys respond over days at high altitude.",my:[["Alkaline water changes blood pH.","Blood pH is tightly controlled by lungs and kidneys; drinks do not meaningfully change it in healthy people."]],rc:["Normal blood pH ≈ 7.35–7.45.","Lungs: fast CO₂ control; kidneys: slower bicarbonate & acid control.","Kidneys excrete acid as ammonium and titratable acid."],rf:["statpearls-renal","kdigo-ckd"],bk:[21],fl:["Metabolism produces acid","Bicarbonate buffers","Lungs exhale CO₂","Kidneys excrete H⁺ & make HCO₃⁻"]},{n:29,t:"Kidney Function and Blood Chemistry",fig:"tests",obj:["Identify common blood tests related to kidney function","Explain what each marker reflects","Recognise that reference ranges vary"],ex:["A 'kidney panel' or 'renal profile' commonly includes creatinine, an estimated GFR, urea (or blood urea nitrogen, BUN), sodium, potassium, chloride and bicarbonate. Calcium, phosphate, albumin, haemoglobin, PTH and uric acid may be added depending on the situation.","Creatinine is made at a fairly steady rate from muscle creatine and cleared mainly by filtration; as GFR falls, creatinine rises. Urea reflects protein intake, liver function, hydration and kidney function, so it is less specific. Electrolytes reflect the kidneys' regulatory work, but also diet, medicines and other illnesses.","Laboratories use different units — creatinine in µmol/L in most countries and mg/dL in the United States (1 mg/dL ≈ 88.4 µmol/L) — and reference ranges vary by laboratory, age and sex."],sci:["Because the relationship between creatinine and GFR is curved, a small rise in creatinine when it is low may reflect a large proportional fall in GFR, while a similar rise at higher levels reflects a smaller proportional change. This is one reason equations are used to estimate GFR."],pr:["Ask your clinician to explain results in context: trends over time often matter more than a single value."],sc:"Mateo sees a 'flag' next to his urea after a weekend of heavy exercise and low fluid intake. His doctor repeats the test a week later, and it is within range.",my:[["A result outside the reference range always means disease.","Ranges cover most healthy people; some healthy individuals fall outside, and results must be interpreted clinically."]],sf:"Do not use this book to interpret your own laboratory results. Discuss them with the clinician who ordered them.",rc:["Renal panel: creatinine, eGFR, urea, electrolytes, bicarbonate.","Units and ranges vary.","Trends and context matter."],rf:["medline-creat","medline-gfr","medline-k","niddk-tests"],fl:["Blood sample","Creatinine & electrolytes measured","eGFR calculated","Clinician interprets in context"]},{n:30,t:"Urine Concentration and Dilution",fig:"adh",obj:["Explain how ADH and the medullary gradient produce concentrated urine","Explain how dilute urine is produced","Describe conditions affecting concentrating ability"],ex:["Fluid leaving the loop of Henle is dilute because the ascending limb has removed salt without water. What happens next depends on ADH.","When ADH is high (for example during dehydration), aquaporin-2 channels are inserted into collecting duct cells. As the duct passes through the salty medulla, water leaves by osmosis and urine becomes concentrated — up to about four times the concentration of blood. When ADH is low (after drinking a lot), the collecting duct remains relatively impermeable to water and dilute urine is excreted.","Urea recycling between the inner medullary collecting duct and the loop strengthens the gradient."],sci:["Diabetes insipidus — now often termed arginine vasopressin deficiency (central) or resistance (nephrogenic) — causes large volumes of dilute urine because ADH is missing or ineffective. Ageing, CKD, high blood calcium, low potassium and lithium can reduce concentrating ability. Conversely, inappropriately high ADH can cause water retention and hyponatraemia."],pr:["Reduced concentrating ability means some people, including many older adults, become dehydrated more easily during illness or heat."],sc:"After a night out without drinking water, Jae notices dark urine in the morning; later, after several glasses of water, it becomes pale — ADH in action.",my:[["Dark urine always means kidney disease.","Concentrated urine often reflects normal ADH response; persistent unusual colour needs assessment."]],rc:["High ADH → aquaporins → concentrated urine.","Low ADH → dilute urine.","Medullary gradient + urea recycling enable concentration."],rf:["statpearls-renal","nhs-dehyd"],bk:[17],fl:["Dilute fluid leaves loop","ADH inserts aquaporin-2","Water leaves into salty medulla","Concentrated urine"]},{n:31,t:"Dehydration and Kidney Function",fig:"hydration",obj:["Describe how dehydration affects kidney blood flow","Recognise signs of dehydration and danger signs","Identify groups at higher risk"],ex:["Dehydration occurs when water losses exceed intake. Mild dehydration triggers thirst, darker urine and reduced urine volume as the kidneys conserve water. More severe fluid loss reduces blood volume, which can reduce kidney blood flow and filtration.","If blood flow falls enough, the kidneys may develop 'pre-renal' acute kidney injury — reduced function due to inadequate perfusion. This is often reversible when fluid is restored, but prolonged or severe reductions can damage tubules.","Common causes include vomiting, diarrhoea, fever, heat exposure, strenuous work or exercise without adequate fluid, and reduced intake due to illness or frailty."],sci:["Higher-risk groups include infants and young children (higher surface area and dependence on carers), older adults (reduced thirst and concentrating ability), people with diabetes or CKD, and those taking diuretics, ACE inhibitors, ARBs or NSAIDs, which can impair the kidney's ability to protect its filtration during low volume."],pr:["Oral rehydration solutions are valuable in diarrhoeal illness, especially for children, as recommended by WHO and national health services. Seek urgent help for signs of severe dehydration."],sc:"During a bout of gastroenteritis, Maria's elderly father becomes drowsy and passes very little urine. The family seeks urgent care, where he is treated for dehydration and acute kidney injury.",my:[["Dehydration only matters to athletes.","Illness, heat and age are common causes; older adults and children are particularly vulnerable."]],sf:"Urgent signs: confusion, fainting, very little or no urine for many hours, rapid heartbeat, or a child who is very drowsy. Seek urgent medical help.",rc:["Dehydration reduces kidney blood flow.","Severe cases can cause acute kidney injury.","Children, older adults and people on certain medicines are at higher risk."],rf:["nhs-dehyd","nhs-aki","nice-ng148"],bk:[15],fl:["Fluid loss","Blood volume falls","Kidney perfusion falls","Risk of acute kidney injury"]},{n:32,t:"Excessive Fluid Intake and Water Balance",fig:"water",obj:["Explain hyponatraemia caused by excessive water intake","Identify situations of higher risk","Understand why fluid targets are individual"],ex:["Healthy kidneys can excrete a large amount of dilute urine, but there is a limit — very roughly up to about 0.8–1.0 L per hour in healthy adults. Drinking faster than this, especially in a short period, can dilute blood sodium.","Hyponatraemia (low blood sodium) can cause headache, nausea, confusion and, in severe cases, seizures, brain swelling and death. Risk situations include drinking very large volumes during endurance events, water-drinking contests, some psychiatric conditions, and situations in which ADH is inappropriately high (some medicines, illnesses or after surgery).","People with heart failure, advanced CKD, liver cirrhosis or on dialysis may have limited ability to excrete water and may be given individual fluid guidance by their care team."],sci:["The goal is balance, not maximum intake. Population reference values (for example from EFSA) describe average total water intakes — including water from food — for healthy people in temperate climates; they are not targets for individuals with medical conditions."],pr:["Drink in response to thirst, with meals, and more during heat or activity — unless a clinician has advised otherwise. Endurance athletes may benefit from individualised hydration plans."],sc:"During a charity marathon, Ben drinks at every station though not thirsty and develops nausea and confusion. Medical staff identify exercise-associated hyponatraemia.",my:[["You can't drink too much water.","Excessive intake can cause dangerous hyponatraemia."],["Drinking more water 'flushes' kidney disease away.","Extra water does not treat kidney disease and can be harmful for some people."]],sf:"Confusion, severe headache, vomiting or seizure after heavy water intake requires emergency care.",rc:["Kidney water excretion has limits.","Excess water can cause hyponatraemia.","Fluid needs are individual."],rf:["medline-hypona","efsa-water"],fl:["Rapid large water intake","Excretion capacity exceeded","Blood sodium diluted","Cells (incl. brain) swell"]}],tp=[{n:33,t:"The Ureters and Urine Transport",fig:"ureter",obj:["Describe ureter structure and course","Explain peristalsis and anti-reflux mechanisms","Identify the narrow points where stones commonly lodge"],ex:["Each ureter is a muscular tube about 25–30 cm long and a few millimetres wide, running from the renal pelvis down the back of the abdomen, over the pelvic brim and into the back of the bladder.","Its wall has an inner lining (urothelium) that resists urine, a layer of smooth muscle and an outer fibrous coat. Pacemaker cells near the renal pelvis trigger rhythmic waves of peristalsis several times a minute, pushing small amounts of urine downward.","The ureter tunnels obliquely through the bladder wall. As the bladder fills, pressure compresses this tunnel, acting like a valve that prevents urine flowing back up (vesicoureteral reflux)."],sci:["Three natural narrowings — where the pelvis joins the ureter, where the ureter crosses the iliac vessels, and where it enters the bladder — are common sites for kidney stones to become stuck, causing severe colicky pain. In some children, the anti-reflux mechanism is incomplete, allowing reflux that can increase the risk of kidney infection."],pr:["Stone pain that moves from flank toward the groin reflects a stone travelling down the ureter. Fever with this pain may signal infection behind a blockage — a medical emergency."],sc:"Kofi has sudden flank pain spreading to the groin. At hospital, imaging shows a small stone at the ureter–bladder junction. He learns why this narrow point is a common site.",my:[["Ureters are passive pipes.","They actively pump urine using peristalsis."]],sf:"Severe flank pain with fever or vomiting needs urgent medical assessment.",rc:["Ureters ~25–30 cm.","Peristalsis moves urine.","Oblique bladder entry prevents reflux.","Three narrowings trap stones."],rf:["niddk-ut","niddk-stones","niddk-child"],fl:["Renal pelvis fills","Pacemaker triggers peristalsis","Urine pushed downward","Valve-like entry prevents reflux"]},{n:34,t:"The Urinary Bladder",fig:"bladder",obj:["Describe bladder structure and the detrusor muscle","Explain low-pressure storage","Identify the trigone and sphincters"],ex:["The bladder is a hollow muscular organ behind the pubic bone. When empty it is flattened; as it fills it rises into the lower abdomen. Adults typically store several hundred millilitres comfortably, though capacity varies.","Its wall consists of a stretchy lining (urothelium), which folds into ridges when empty, and the detrusor muscle, a meshwork of smooth muscle that relaxes during filling and contracts to empty. The triangular region between the two ureter openings and the urethral opening is the trigone.","Two sphincters control outflow: the internal sphincter (involuntary smooth muscle at the bladder neck) and the external sphincter (voluntary skeletal muscle supported by the pelvic floor)."],sci:["The bladder's ability to fill without a rise in pressure — compliance — protects the kidneys. If bladder pressure stays high (for example
