. Cardiovascular disease is a major cause of illness in this population, so cardiovascular prevention matters alongside liver care."],["Assessment","Evaluation includes history, examination, blood tests and imaging. Risk-stratification tools such as FIB-4 can help clinicians identify people who may need elastography or specialist referral, but these tools are not self-diagnosis devices. Results must be interpreted in context."]],safety:"Do not try to diagnose MASLD from a scan report or your own risk score. Ask your clinician what your results mean, and how liver and cardiovascular risk should be monitored.",recap:"MASLD is steatosis with metabolic risk, assessed in context. It links liver and cardiovascular health and varies widely in outcome.",refs:["aasld-masld","easl-masld","niddk-masld","nice-nafld"],books:[11,18,7]},{n:43,title:"Metabolic Dysfunction–Associated Steatohepatitis (MASH)",summary:"MASH is the inflammatory, cell-injury form of metabolic steatotic liver disease. It can progress to fibrosis even when symptoms are absent.",mins:11,visual:{kind:"spectrum",title:"MASH and fibrosis",caption:"Inflammation and hepatocyte ballooning accompany fat. Fibrosis stage is a key predictor of outcomes.",nodes:["Steatosis","Inflammation","Cell injury","Fibrosis"]},obj:["Define MASH and its relationship to MASLD","Explain why symptoms poorly predict severity","Describe the role of fibrosis assessment"],secs:[["Histology plus metabolic risk","MASH denotes steatohepatitis in a person with MASLD: fat, inflammation and injury to hepatocytes. Confirming it historically required biopsy, though non-invasive tests increasingly guide care. Severity is assessed mainly by fibrosis stage, not symptom intensity."],["Treatment directions","Management centres on treating the whole metabolic condition: sustainable weight change where relevant, physical activity, sleep, glucose and lipid control, and avoiding alcohol harm. Some medicines have evidence for MASH in specific populations and are prescribed by specialists. No herbal regimen is proven to treat it."],["Monitoring","Clinicians may repeat enzymes, imaging, elastography or risk scores. Trends matter more than isolated values. People with advanced fibrosis need monitoring for cirrhosis complications and liver cancer. Any new jaundice, confusion, bleeding or swelling requires assessment."]],safety:"MASH can be silent even when advanced. Do not wait for symptoms, and do not use unregulated supplements to ‘reverse’ fibrosis. Specialist care is important when liver scarring is suspected.",recap:"MASH combines steatosis with inflammation and injury. Fibrosis assessment guides prognosis and follow-up.",refs:["aasld-masld","easl-masld","niddk-masld"],books:[11,18]},{n:44,title:"Alcohol-Associated Liver Disease",summary:"Alcohol can injure the liver through several mechanisms. Risk depends on amount, pattern, duration, genetics and other conditions — not on character.",mins:12,visual:{kind:"spectrum",title:"Alcohol-related spectrum",caption:"Steatosis, steatohepatitis, fibrosis and cirrhosis can occur, sometimes together. The liver can be affected before symptoms appear.",nodes:["Steatosis","Hepatitis","Fibrosis","Cirrhosis"]},obj:["Describe the spectrum of alcohol-associated liver disease","Explain factors that modify individual risk","Approach alcohol discussions without stigma"],secs:[["Mechanisms","Alcohol is metabolised to acetaldehyde, a reactive compound, and forms reactive oxygen species. It alters hepatic fat metabolism, increases gut permeability and promotes inflammation. These effects can interact with metabolic dysfunction, viral hepatitis and nutrition."],["Risk is not just volume","Average intake, heavy episodic drinking, duration, genetic variation, body composition, other liver disease and overall nutrition all contribute. Established advice is that less alcohol is better; for many conditions, avoiding alcohol is recommended. No universally ‘safe’ threshold for liver disease progression is established."],["Support and treatment","Care focuses on reducing or stopping alcohol safely, nutrition support, medical management of liver complications and treatment for alcohol use disorder where present. Abrupt withdrawal can be dangerous in dependent drinking, so medically supported withdrawal planning is important. Language should be respectful and person-centred."]],safety:"If you drink heavily and want to stop, seek medical advice about withdrawal, which can be dangerous without support. Alcohol-related liver disease is a medical condition, not a moral failing.",recap:"Alcohol-associated liver disease is a spectrum driven by dose, pattern and vulnerability. Stigma-free, medically supported care is essential.",refs:["who-alcohol","easl-cirrhosis","niddk-liver"],books:[13,20]},{n:45,title:"Alcohol-Associated Hepatitis",summary:"Alcohol-associated hepatitis is a severe inflammatory form of alcohol-related liver injury. It is not the same as viral hepatitis and requires urgent specialist assessment.",mins:10,visual:{kind:"compare",title:"Not a viral infection",caption:"Alcohol-associated hepatitis is caused by toxic and inflammatory injury from alcohol, not by a transmissible virus.",nodes:["Alcohol injury","Inflammation","Liver failure risk","Specialist care"]},obj:["Distinguish alcohol-associated hepatitis from viral hepatitis","Recognise severe features that need urgent care","Explain the limits of educational information in acute illness"],secs:[["A severe syndrome","Alcohol-associated hepatitis can develop after heavy drinking, often with jaundice, fever, tender liver, poor appetite and sometimes ascites. Severity scores guide treatment decisions. Some people develop liver failure, infection or kidney injury and need hospital care."],["Medical management","Treatment includes alcohol cessation support, careful nutrition and management of complications. Corticosteroids may be considered in selected severe cases. Clinicians assess for infection and other conditions. Liver transplantation may be considered in highly selected situations at specialist centres."],["What not to do","Do not attempt to treat suspected alcohol-associated hepatitis at home or use supplements to compensate. New jaundice with fever, confusion, vomiting blood or abdominal swelling requires urgent medical attention. Abrupt unsupervised withdrawal may be dangerous."]],safety:"New jaundice, fever, confusion, vomiting, black stools or rapidly worsening illness in a person who drinks heavily needs urgent medical assessment.",urgent:!0,recap:"Alcohol-associated hepatitis is a serious alcohol-related inflammatory syndrome, not a contagious infection. Specialist care is required.",refs:["who-alcohol","easl-cirrhosis","niddk-liver"],books:[13]},{n:46,title:"Viral Hepatitis: An Overview",summary:"Hepatitis viruses differ in transmission, duration and treatment. Accurate distinctions prevent fear and support prevention.",mins:10,visual:{kind:"compare",title:"Different viruses, different routes",caption:"A, B, C and D have distinct transmission patterns. They are not interchangeable, and none should be stigmatised.",nodes:["HAV: faecal–oral","HBV: blood/sexual","HCV: blood","HDV: with HBV"]},obj:["Outline the main hepatitis viruses and their routes","Explain the difference between acute and chronic infection","Recognise effective prevention strategies"],secs:[["A family of different viruses","Hepatitis A and E are primarily spread by contaminated food or water. Hepatitis B spreads through blood, semen, vaginal fluids and perinatally. Hepatitis C spreads mainly through infected blood. Hepatitis D requires hepatitis B to replicate. Each has different vaccine and treatment options."],["Acute versus chronic","Hepatitis A and E usually cause acute, self-limiting infection, though severe disease can occur, especially in pregnancy for HEV. Hepatitis B can become chronic, especially after infant infection. Hepatitis C becomes chronic in most untreated cases. Chronic infection can lead to fibrosis and liver cancer."],["Prevention and testing","Safe water and food, hand hygiene, safe injections, screening of blood products, condom use where appropriate, and vaccination prevent many infections. Testing is essential because chronic hepatitis B and C are often silent. Effective treatments exist; access varies by country."]],myth:["Hepatitis always spreads through casual contact.","Hepatitis A/E require contaminated substances; hepatitis B/C spread via blood and certain body fluids. Casual touching or sharing food does not transmit hepatitis C."],recap:"Hepatitis viruses are distinct. Route-specific prevention and appropriate testing are better than fear-based stigma.",refs:["who-hepatitis","cdc-hepa","cdc-hepb","cdc-hepc"],books:[5,20]},{n:47,title:"Hepatitis A and Hepatitis E",summary:"Hepatitis A and E are mainly enterically transmitted. Safe food and water are central to prevention; hepatitis A vaccines are widely available.",mins:10,visual:{kind:"pathway",title:"Contamination pathway",caption:"Faecal contamination of food or water can transmit HAV and HEV. Hygiene and safe water interrupt the route.",nodes:["Contaminated water/food","Intestine","Liver","Recovery","Prevention"]},obj:["Describe transmission of hepatitis A and E","Explain who may be at greater risk of severe disease","List evidence-based prevention measures"],secs:[["Hepatitis A","HAV is transmitted by the faecal–oral route, often through contaminated food or water or close contact. It is usually acute and resolves, but can cause severe illness and, rarely, liver failure. Hepatitis A vaccine is recommended in many countries for children and groups at higher risk. Post-exposure immunisation or immunoglobulin may be used in some settings."],["Hepatitis E","HEV also spreads enterically and is a major cause of acute hepatitis globally. Most people recover. Pregnant women, especially in the third trimester, and people with immunosuppression or chronic liver disease are at greater risk of severe outcomes. A hepatitis E vaccine is licensed only in China, so availability is country-specific."],["Prevention in practice","Use safe water, wash hands after toileting and before food preparation, cook food thoroughly and follow local food safety guidance. Travellers should check national vaccine recommendations. Immunisation guidance varies by country and personal risk."]],safety:"Severe illness, jaundice in pregnancy, or confusion in someone with acute hepatitis needs urgent medical care. Do not assume all jaundice is benign.",recap:"HAV and HEV are mainly food- and water-borne. HAV vaccination is widely available; HEV vaccine availability is country-specific.",refs:["who-hav","who-he","cdc-hepa","who-hepatitis"],books:[5]},{n:48,title:"Hepatitis B",summary:"Hepatitis B can become a chronic, life-long infection. Vaccination is highly effective, and antiviral treatment can reduce complications.",mins:12,visual:{kind:"timeline",title:"Hepatitis B over a lifetime",caption:"Infant infection is most likely to become chronic. Monitoring and treatment can reduce progression.",nodes:["Exposure","Acute","Chronic","Monitoring","Care"]},obj:["Explain hepatitis B transmission and prevention","Describe what chronic infection means","Recognise the importance of monitoring even when feeling well"],secs:[["Transmission and prevention","HBV is transmitted through blood, semen, vaginal fluids and perinatally. It is not spread by hugging, sharing food or casual conversation. Hepatitis B vaccine is safe and effective; many countries recommend a birth dose and completion of the series. Safe injection practices and screening of blood products are also essential."],["Chronic infection","The likelihood of chronic infection is highest with infant exposure and declines with age at infection. Chronic HBV can cause inflammation, fibrosis, cirrhosis and liver cancer. Many people feel well. Monitoring includes viral markers, liver enzymes, fibrosis assessment and liver cancer surveillance when indicated."],["Treatment and access","Antiviral treatments can suppress the virus and reduce complications but usually do not cure the infection. Treatment criteria depend on viral activity, enzyme levels, fibrosis and other factors. Access varies globally. People should avoid starting or stopping medicines without specialist advice."]],myth:["A person with hepatitis B must avoid all contact with others.","HBV is not transmitted by casual contact. Standard precautions, vaccination of contacts and appropriate medical advice allow normal social and family life."],safety:"Pregnant people should be tested for hepatitis B according to local guidance; timely birth-dose vaccination and sometimes immunoglobulin protect newborns. Ask a clinician about your country’s programme.",recap:"Hepatitis B is vaccine-preventable. Chronic infection needs long-term monitoring and, for some, antiviral treatment.",refs:["who-hbv","cdc-hepb","niddk-viral"],books:[20,5]},{n:49,title:"Hepatitis C",summary:"Hepatitis C is blood-borne and curable in most people with direct-acting antiviral medicines. Many countries recommend wider testing.",mins:11,visual:{kind:"timeline",title:"Testing to cure",caption:"Antibody screening, RNA testing, treatment and confirmation of cure are steps on a well-established pathway.",nodes:["Risk","Antibody test","RNA test","DAA treatment","Cure check"]},obj:["Describe hepatitis C transmission and testing","Explain what a cure means after direct-acting antivirals","Reinforce non-stigmatising language"],secs:[["Transmission","HCV spreads mainly when infected blood enters the body — for example through unsafe injections, unsterilised equipment, blood products in unscreened settings, or sharing drug-use equipment. Sexual transmission is possible but less common than for HBV. There is no vaccine, so prevention focuses on blood safety and harm reduction."],["Testing and treatment","Screening uses an antibody test; a positive result is followed by RNA testing to detect current infection. Direct-acting antivirals cure the great majority of treated people, with shorter, better-tolerated regimens than older interferon-based therapy. Reinfection is possible, so prevention remains relevant."],["Care and stigma","Many people with hepatitis C have no symptoms and may carry the virus for years. Earlier diagnosis can prevent advanced liver disease. Everyone deserves care without judgement, including people who use drugs. Treatment access varies by country and insurance system."]],myth:["Hepatitis C can be spread by sharing food or utensils.","HCV is blood-borne and is not transmitted through food, water, hugging or sharing eating utensils."],recap:"Hepatitis C is blood-borne, often silent and usually curable with modern treatment. Screening and non-judgemental care are key.",refs:["who-hcv","cdc-hepc","niddk-viral"],books:[20,5]},{n:50,title:"Autoimmune Hepatitis",summary:"Autoimmune hepatitis is immune-mediated liver inflammation that can be controlled, slowed or sometimes remitted with treatment.",mins:10,visual:{kind:"cells",title:"Immune targeting",caption:"The immune system attacks liver cells. Diagnosis combines antibodies, enzymes, imaging and sometimes biopsy.",nodes:["Immune activation","Inflammation","Fibrosis","Immunosuppression"]},obj:["Explain the concept of autoimmune hepatitis","Describe typical diagnostic tools","Explain why prescribed immunosuppression should not be stopped"],secs:[["What it is","Autoimmune hepatitis (AIH) is a chronic inflammatory liver disease of uncertain cause. It occurs when immune responses target hepatocytes. It can present with elevated aminotransferases, fatigue, jaundice or with advanced liver disease, and is more common in women but can affect anyone."],["Diagnosis","Clinicians use liver enzymes, autoantibodies (such as ANA, anti-smooth muscle antibody, anti-LKM), serum immunoglobulins, viral testing, imaging and often liver biopsy. Other causes must be excluded. There is no single diagnostic test, and a scoring system supports expert judgment."],["Treatment and safety","Immunosuppressive medicines such as corticosteroids and azathioprine are commonly used, with careful monitoring and vaccination planning. Most people need long-term therapy, and relapses may occur if stopped abruptly. Liver tests and side effects need follow-up. Advice should come from a specialist team."]],safety:"Never stop immunosuppressive medicines abruptly. Report fever, infection, new jaundice, black stools or unusual bruising promptly.",recap:"AIH is immune-mediated. Diagnosis is composite, and treatment can control disease but requires long-term specialist follow-up.",refs:["niddk-aih","nih-liver","wgo"],books:[20]},{n:51,title:"Primary Biliary Cholangitis",summary:"PBC is a chronic autoimmune condition targeting small bile ducts. Earlier diagnosis and treatment reduce complications.",mins:10,visual:{kind:"biliary",title:"Small duct injury",caption:"Immune injury to small bile ducts impairs bile flow, causing cholestatic liver chemistry and potential fibrosis.",nodes:["Small ducts","Cholestasis","Inflammation","Fibrosis"]},obj:["Describe what PBC affects","Explain common tests and symptoms","Understand the role of ursodeoxycholic acid"],secs:[["A cholestatic disease","PBC is characterised by immune injury to small intrahepatic bile ducts, leading to reduced bile flow and cholestatic liver tests, particularly raised ALP. It usually affects middle-aged women, though anyone can develop it. Fatigue and itching are common and may significantly affect quality of life."],["Diagnosis","Testing commonly shows raised ALP and antimitochondrial antibodies (AMA), supported by history and imaging. Liver biopsy is used when the picture is unclear or another condition is suspected. Fibrosis and portal hypertension can develop over years."],["Treatment","Ursodeoxycholic acid (UDCA) is first-line treatment and improves outcomes for many people. Additional options are used for incomplete response or intolerance. Monitoring includes liver tests, symptom management and bone health, since cholestatic disease is associated with osteoporosis. Itching and fatigue need clinical advice, not unregulated remedies."]],recap:"PBC is an autoimmune cholestatic disease of small bile ducts. UDCA and specialist monitoring reduce risk.",refs:["niddk-pbc","wgo","nhs-liver"],books:[20,15]},{n:52,title:"Primary Sclerosing Cholangitis",summary:"Primary sclerosing cholangitis (PSC) causes inflammation and scarring of larger bile ducts. It is closely associated with inflammatory bowel disease.",mins:10,visual:{kind:"biliary",title:"Duct narrowing and scarring",caption:"PSC produces strictures and beading of bile ducts, which imaging can reveal.",nodes:["Large ducts","Strictures","Cholestasis","Cirrhosis"]},obj:["Describe the pattern of duct involvement in PSC","Explain its association with inflammatory bowel disease","Outline the importance of specialist monitoring"],secs:[["Two diseases, similar names","Primary sclerosing cholangitis (PSC) involves inflammation and fibrosis of medium and large bile ducts, causing strictures. Primary biliary cholangitis (PBC) affects small ducts. The names sound similar but the diseases differ in imaging, antibodies and associations."],["Associated conditions","Many people with PSC have inflammatory bowel disease, especially ulcerative colitis. PSC is also associated with an increased risk of bile duct and colorectal cancer, so surveillance programmes are used in specialist care. Symptoms may include fatigue, itching, abdominal discomfort or recurrent cholangitis."],["Management","There is no universally proven disease-modifying medical therapy, though several are under study. Care focuses on managing strictures and complications, nutrition, symptom relief and surveillance. Liver transplantation may be required for advanced disease. A new stricture or worsening jaundice should be assessed promptly."]],recap:"PSC affects larger bile ducts, commonly with IBD, and requires specialist surveillance. It is distinct from PBC.",refs:["nih-liver","wgo","nhs-liver"],books:[2,20]},{n:53,title:"Genetic and Inherited Liver Disorders",summary:"Inherited conditions such as haemochromatosis and Wilson disease reveal how single gene variants can disturb metal handling and liver function.",mins:11,visual:{kind:"compare",title:"Metal handling disorders",caption:"Both can silently damage the liver. Early detection enables treatment and family screening.",nodes:["Haemochromatosis: iron","Wilson: copper","Family screening","Specialist care"]},obj:["Explain the basic mechanism of haemochromatosis","Explain the basic mechanism of Wilson disease","Describe why family screening can be valuable"],secs:[["Haemochromatosis","Hereditary haemochromatosis can cause excessive intestinal iron absorption due to impaired hepcidin signalling, most often related to HFE variants. Iron deposits in the liver, heart, pancreas and joints. Treatment includes monitoring and iron removal by venesection in appropriate cases; some people need other treatment."],["Wilson disease","Wilson disease is an inherited disorder of copper transport. Copper accumulates in the liver, brain and other tissues, causing liver disease and neurological or psychiatric features. Diagnosis uses copper studies, sometimes genetic testing and liver biopsy. Lifelong treatment with chelating agents or zinc is often required."],["Genetics is not destiny","Many genetic variants increase risk without causing disease. A genetic result needs expert interpretation. Family screening may be recommended for some conditions, but implications for insurance, employment and privacy vary by country. Genetic counselling can help."]],safety:"Do not take iron or copper supplements for fatigue or for ‘liver support’ without assessment. Suspected metal overload requires specialist diagnosis and treatment.",recap:"Inherited disorders can cause silent liver damage. Family history and clinical clues matter, and treatment should be specialist-led.",refs:["niddk-hemochromatosis","niddk-wilson","nih-liver"],books:[10,9]},{n:54,title:"Liver Cirrhosis",summary:"Cirrhosis is advanced scarring with architectural distortion. Compensated cirrhosis may be silent; decompensation brings serious complications.",mins:13,visual:{kind:"spectrum",title:"Fibrosis to cirrhosis",caption:"Progressive fibrosis can form nodules and alter blood flow. Decompensation is marked by specific complications.",nodes:["Normal","Fibrosis","Cirrhosis","Decompensation"]},obj:["Define fibrosis and cirrhosis","Differentiate compensated from decompensated cirrhosis","Describe why specialist monitoring is needed"],secs:[["What cirrhosis means","Cirrhosis describes advanced fibrosis with regenerative nodules and altered liver architecture. It is the end result of many different injuries. Fibrosis stage is assessed by elastography, blood-based scores, imaging or biopsy. Cirrhosis is not a single moment and its clinical course varies widely."],["Compensated and decompensated","Compensated cirrhosis may cause no symptoms and be detected incidentally. Decompensation is defined by complications such as ascites, variceal bleeding, encephalopathy or jaundice. Each episode increases risk and requires specialist care. Some causes can improve with treatment, but not everyone’s scarring reverses completely."],["Care and everyday life","Care includes treating the cause, nutrition, vaccination, avoiding harmful substances, monitoring for liver cancer and managing complications. People with cirrhosis should avoid unsupervised supplements and discuss all medicines with their clinicians. A new or worsening symptom deserves early assessment."]],safety:"Confusion or unusual drowsiness in someone with cirrhosis, vomiting blood, black stools, rapidly increasing abdominal swelling or fever with abdominal pain requires urgent medical care.",urgent:!0,recap:"Cirrhosis is advanced structural liver disease. Compensated disease may be silent, while decompensation is serious and requires experienced care.",refs:["niddk-cirrhosis","easl-cirrhosis","nice-cirrhosis"],books:[11,22]},{n:55,title:"Portal Hypertension",summary:"Portal hypertension is increased pressure in the portal venous system, usually due to resistance from liver disease. It drives major complications.",mins:11,visual:{kind:"pathway",title:"Pressure and shunts",caption:"Increased resistance raises portal pressure. Collateral veins and fluid shifts lead to varices and ascites.",nodes:["Cirrhosis","Resistance","Portal pressure","Collateral veins","Complications"]},obj:["Explain the basic mechanism of portal hypertension","Describe how varices and ascites develop","Recognise symptoms requiring urgent assessment"],secs:[["Pressure and resistance","Portal pressure rises when resistance to flow increases, usually in a scarred liver. Splanchnic vasodilation and increased blood flow can worsen the picture. Clinicians may measure pressure indirectly with imaging or endoscopy and assess severity through clinical complications."],["Consequences","Blood can divert through collateral veins, producing oesophageal or gastric varices that may bleed. Fluid retention and low albumin contribute to ascites. Portosystemic shunting of blood can affect brain function. Treatments include blood-pressure–lowering medicines for selected varices, endoscopic therapy, diuretics, drainage procedures and TIPS in specialist settings."],["What to watch for","Vomiting blood or black tarry stools is an emergency. Rapidly increasing abdominal girth, breathing difficulty, fever with abdominal pain or confusion needs urgent care. Do not take NSAIDs or start new medicines without asking about portal hypertension and bleeding risk."]],safety:"Vomiting blood may be a variceal bleed and is an emergency. Call local emergency services immediately. Black, tarry stools should be assessed urgently.",urgent:!0,recap:"Portal hypertension is a mechanical consequence of liver disease and a key driver of bleeding and fluid complications.",refs:["easl-cirrhosis","niddk-cirrhosis","nice-cirrhosis"],books:[18,22]},{n:56,title:"Liver Failure and Advanced Liver Disease",summary:"Liver failure means severely impaired function. It can occur suddenly or on top of chronic disease, and it is a medical emergency requiring coordinated specialist care.",mins:11,visual:{kind:"spectrum",title:"Acute and acute-on-chronic",caption:"Acute liver failure may occur without prior liver disease; acute-on-chronic failure is a rapid decline in someone with existing disease.",nodes:["Acute injury","Acute liver failure","Chronic disease","Acute-on-chronic"]},obj:["Define acute liver failure and acute-on-chronic liver failure","List recognised emergency features","Explain why clinical care is essential"],secs:[["Different presentations","Acute liver failure is severe liver injury with impaired synthesis and encephalopathy, often in a person without known chronic liver disease. Causes include certain medicines, viral hepatitis and other conditions. Acute-on-chronic liver failure is a rapid deterioration in someone with existing liver disease, often triggered by infection or bleeding."],["Why it is urgent","The liver may fail to clear ammonia, make clotting proteins and regulate glucose. Brain swelling, infection, bleeding, kidney failure and low blood pressure can develop. Admission to a specialist liver unit and consideration of transplantation may be necessary. Timing matters."],["Early recognition","Jaundice, confusion, drowsiness, bleeding, easy bruising, low urine output or worsening swelling should prompt urgent medical assessment. Do not wait for a scheduled appointment. Do not give sedatives or unregulated remedies, and tell clinicians about all medicines and supplements."]],safety:"Confusion or unusual drowsiness in a person with liver disease, or prominent jaundice with rapidly worsening illness, is a medical emergency. Use local emergency services.",urgent:!0,recap:"Liver failure is life-threatening and time-sensitive. Early recognition and specialist care can change outcomes.",refs:["easl-cirrhosis","niddk-cirrhosis","who-hepatitis"],books:[15,20]},{n:57,title:"Liver Cancer",summary:"Hepatocellular carcinoma is the commonest primary liver cancer. Surveillance, when indicated, can find tumours at a more treatable stage.",mins:11,visual:{kind:"organs",title:"Primary versus secondary",caption:"HCC arises from liver cells; secondary tumours spread from elsewhere. Risk and management differ.",nodes:["HCC","Cirrhosis risk","Surveillance","Treatment"]},obj:["Describe hepatocellular carcinoma and its main risk factors","Explain the concept of surveillance in high-risk people","Recognise that detection does not equal cure"],secs:[["What HCC is","Hepatocellular carcinoma (HCC) is the most common primary liver cancer. It is strongly associated with cirrhosis and is also linked to chronic hepatitis B and C, alcohol-related injury and metabolic liver disease. Cholangiocarcinoma arises from bile ducts and is a distinct cancer."],["Surveillance and diagnosis","In appropriate high-risk groups, six-monthly liver ultrasound with or without a blood marker is used to detect HCC earlier. Surveillance has limitations and does not prevent all deaths. Diagnosis uses characteristic imaging in the right clinical context, sometimes with biopsy or other tests."],["Treatment context","Options depend on tumour size and number, liver function and overall health. They include surgery, ablation, transplantation in selected cases, embolisation techniques and systemic therapy. Multiple specialists should be involved. Prognosis is highly variable and should be discussed honestly by the clinical team."]],safety:"New jaundice, weight loss, upper abdominal pain or rapidly worsening illness should be assessed. Do not rely on supplements to prevent or treat cancer.",recap:"HCC is a major complication of chronic liver disease. Surveillance and specialist teams improve the chance of timely treatment.",refs:["aasld-hcc","easl-hcc","niddk-liver"],books:[20,15]},{n:58,title:"Gallstones and Biliary Obstruction",summary:"Gallstones form from imbalanced bile components. Many are silent; stones that obstruct ducts can cause serious complications.",mins:10,visual:{kind:"biliary",title:"From stone to obstruction",caption:"Stones may remain in the gallbladder, pass into the bile duct, or obstruct the cystic duct or duodenal ampulla.",nodes:["Bile imbalance","Stones","Cystic duct","CBD obstruction"]},obj:["Describe how gallstones form","Differentiate asymptomatic stones from complications","Recognise biliary emergency features"],secs:[["Why stones form","Cholesterol stones account for most cases and form when bile is supersaturated with cholesterol. Pigment stones occur in some haemolytic or biliary conditions. The gallbladder’s concentration of bile contributes to crystal formation. Risk factors include sex, older age, weight, genetics and some medical conditions."],["Spectrum of disease","Many people with gallstones have no symptoms. Symptoms can include pain after fatty meals or right upper abdominal discomfort. Cholecystitis involves gallbladder inflammation; choledocholithiasis means a stone in the bile duct; cholangitis is infection in an obstructed biliary system; pancreatitis can follow a stone impacting the pancreatic duct."],["Management","Symptomatic gallbladder stones often lead to laparoscopic cholecystectomy, but clinical assessment is essential. Asymptomatic stones are usually managed conservatively unless there is a specific reason. A stone in the bile duct may be removed with ERCP. Jaundice with fever and pain requires urgent care."]],safety:"Fever with upper abdominal pain and jaundice may indicate cholangitis and is an emergency. Seek immediate medical care. Persistent vomiting or severe pain also requires urgent assessment.",urgent:!0,recap:"Most gallstones are harmless. Obstructive complications can be serious and need prompt medical or surgical treatment.",refs:["niddk-gallstones","wgo","nhs-liver"],books:[2,7]},{n:59,title:"Nutrition and Liver Function",summary:"Overall dietary adequacy supports liver metabolism and metabolic health. There is no single ‘liver diet’ that suits everyone.",mins:11,visual:{kind:"compare",title:"Diet quality, not perfection",caption:"A varied, mostly plant-based pattern supports metabolic health. Individual needs vary with disease and access.",nodes:["Variety","Adequate energy","Fibre","Food safety","Individual advice"]},obj:["Explain why overall dietary pattern matters more than single foods","Identify components of a liver-supportive eating pattern","Recognise when individual clinical nutrition advice is needed"],secs:[["Whole-pattern evidence","Evidence most strongly supports a Mediterranean-style pattern balanced in energy: vegetables, fruit, legumes, whole grains, nuts, olive oil and fish, with limited ultra-processed foods and added sugars. Such a pattern is associated with better metabolic health. No individual food ‘detoxifies’ the liver."],["Energy and protein adequacy","Severe restriction can cause muscle loss and worsen fatigue. People with cirrhosis may need more frequent meals and a late-evening snack to reduce catabolism, with individual advice. Malnutrition in cirrhosis is under-recognised and serious; it cannot be diagnosed by appearance alone."],["Access and culture","Food choices are shaped by affordability, culture, religion, climate and access to clean water. Alternatives such as beans, lentils, canned fish, seasonal vegetables and local whole grains are nourishing. Education should respect constraints rather than idealise expensive foods."]],safety:"Consult a registered dietitian or clinical team before making major dietary changes if you have cirrhosis, kidney disease, diabetes or a history of disordered eating.",recap:"Nutrition supports liver health through overall pattern and adequacy. Individual conditions may require tailored clinical advice.",refs:["aasld-masld","niddk-cirrhosis","who-hepatitis"],books:[7,11,10]},{n:60,title:"Carbohydrates, Added Sugars and Liver Metabolism",summary:"Carbohydrates are not inherently harmful. Dose, source, fibre and energy balance shape metabolic effects.",mins:10,visual:{kind:"compare",title:"Quality and quantity",caption:"Whole grains, legumes and fruit provide fibre and nutrients. Frequent sugary drinks add energy without satiety.",nodes:["Whole grains","Fruit","Added sugars","Sugar drinks"]},obj:["Define added sugars and distinguish them from naturally present sugars","Explain the link between energy-dense diets and hepatic fat","Identify practical substitutions"],secs:[["Why quality matters","Whole or minimally processed carbohydrates are digested slowly and provide fibre, which supports the gut microbiome and satiety. Refined sugars and syrups provide energy but little fibre or nutrients. A high intake of sugar-sweetened beverages has been linked to fatty liver and metabolic risk."],["Energy and lipogenesis","Excess energy can contribute to fat synthesis in the liver. Fructose is metabolised in the liver and can promote lipogenesis when consumed in excess from sweetened drinks. Fruit contains fructose but also fibre, water and micronutrients; the whole food behaves differently from a sweetened beverage."],["Practical approach","Choose water, unsweetened tea or other unsweetened drinks most often. Use fruit when sweet cravings arise. Read labels for added sugar. National guidance on free-sugar limits varies, so use local recommendations. Do not turn food into a purity test."]],myth:["Fruit juices are a healthy way to ‘hydrate the liver’.","Juice contains little fibre and can deliver a large sugar load quickly. Whole fruit is generally more filling. Anyone with liver disease and diabetes should seek individual advice."],recap:"Carbohydrate quality and total energy matter. Limit sugar-sweetened drinks and favour fibre-rich whole foods.",refs:["aasld-masld","who-hepatitis","niddk-masld"],books:[7,11]},{n:61,title:"Dietary Fats and Liver Health",summary:"Fatty acids are essential, and the type of dietary fat influences cardiometabolic risk. Avoidance of all fat is neither necessary nor beneficial.",mins:10,visual:{kind:"compare",title:"Types of dietary fat",caption:"Unsaturated fats are associated with better cardiovascular health. Highly processed products combine fat, sugar and salt.",nodes:["Unsaturated","Saturated","Trans fats","Whole foods"]},obj:["Distinguish major types of dietary fat","Explain why Mediterranean-style fats are associated with better health","Recognise that dietary fat is not a liver toxin"],secs:[["The essentials","Essential fatty acids must come from food. Unsaturated fats from nuts, seeds, olive oil, avocado and oily fish are associated with better cardiovascular outcomes. Saturated fat is not necessarily harmful in small amounts within a balanced pattern, but consistently high intake can raise LDL cholesterol in some people."],["Avoiding confusion","Liver-related benefit comes from overall metabolic health and weight balance rather than eliminating fat. Olive oil, for example, is energy-dense and should be used in appropriate portions, but it is a key component of Mediterranean-style eating. Fish provide omega-3 fatty acids and protein."],["Practical choices","Replace some saturated fat with unsaturated sources, cook with minimally processed oils, and choose whole foods over industrial products high in fat, sugar and salt. People with fat malabsorption or pancreatitis need individual clinical advice, not a universal low-fat rule."]],recap:"Fats are essential. Favour unsaturated sources within an energy-balanced pattern and avoid unnecessary extremes.",refs:["aasld-masld","who-hepatitis","nih-liver"],books:[7,18]},{n:62,title:"Protein and Liver Health",summary:"Protein supports muscle, immunity and protein synthesis. In advanced liver disease, needs may increase — not decrease — and nutrition should be individualised.",mins:10,visual:{kind:"cells",title:"Protein for repair",caption:"Hepatocytes need amino acids to build albumin and clotting factors. Muscle is an important amino acid reserve.",nodes:["Dietary protein","Amino acids","Albumin","Muscle mass"]},obj:["Explain why protein restriction is often inappropriate","List protein-rich foods suitable in different settings","Recognise when clinical nutrition support is needed"],secs:[["Protein matters more, not less","People with cirrhosis often develop protein-energy malnutrition and sarcopenia, which are linked to poorer outcomes. Clinical guidance generally recommends adequate protein, sometimes around 1.2–1.5 g/kg/day in compensated disease, with individual adjustment by a dietitian. Actual targets depend on clinical context."],["Safety in encephalopathy","Historically, protein was restricted in hepatic encephalopathy. Current practice usually avoids severe restriction and focuses on adequate nutrition, frequent meals, lactulose and treating precipitants. Anyone with persistent confusion needs medical assessment, not a self-designed diet."],["Accessible sources","Eggs, fish, poultry, lean meat, dairy, tofu, beans, lentils and combinations of grains and legumes can provide protein. Powdered supplements are not automatically better; whole foods provide other nutrients. If intake is poor, clinical nutrition support may be appropriate."]],safety:"Do not follow severe protein restriction for liver disease. If you have kidney disease and liver disease together, your protein needs need joined-up specialist advice.",recap:"Adequate protein supports muscle and hepatic protein synthesis. Restriction is not a universal liver treatment.",refs:["easl-cirrhosis","niddk-cirrhosis","aasld-masld"],books:[7,11,22]},{n:63,title:"Vitamins and Minerals in Liver Health",summary:"Deficiencies can occur in liver disease, but indiscriminate high-dose supplements can also cause harm. Nutrient needs should be assessed, not guessed.",mins:10,visual:{kind:"risk",title:"Nutrient balance",caption:"Both low and excessive intakes can affect the liver. Supplements are medicines in effect and deserve the same care.",nodes:["Deficiency","Excess","Interactions","Assessment"]},obj:["Recognise nutrients of concern in specific liver conditions","Explain the risks of high-dose fat-soluble vitamins","Describe a sensible approach to supplements"],secs:[["Nutrients of concern","Cholestatic liver disease can impair absorption of fat-soluble vitamins A, D, E and K. Vitamin D deficiency and bone disease are common in chronic liver disease. Iron deficiency can still occur, and over-replacement is harmful in iron overload. Vitamin and mineral needs should be assessed, not assumed."],["Too much can hurt","Vitamin A excess can cause liver injury. Iron overdose can be severe, and copper excess occurs in Wilson disease. Some herbal preparations contain undeclared medicines or contaminants. High-dose niacin, green tea extracts and certain other products have been associated with liver injury in reports."],["A safer process","Tell your clinician about every supplement, including multivitamins, protein powders and teas. Ask whether a specific deficiency has been documented and what dose is appropriate. Use products from regulated supply chains. For many people, a varied diet supplies adequate nutrients without high-dose supplements."]],safety:"Seek urgent care for suspected iron overdose or accidental ingestion of any supplement, and contact a poison information service where available. Do not exceed label directions.",recap:"Nutrient status deserves assessment rather than assumptions. Both deficiency and excess can affect the liver.",refs:["nih-supplements","niddk-hemochromatosis","nih-otc"],books:[10,9]},{n:64,title:"Fibre, Gut Health and the Gut–Liver Connection",summary:"Fibre supports bowel function, satiety and gut microbial diversity. These effects may influence metabolic and liver health indirectly.",mins:9,visual:{kind:"pathway",title:"Fibre to microbial products",caption:"Fermentable fibre is converted by gut bacteria into short-chain fatty acids that interact with gut and liver biology.",nodes:["Fibre","Gut bacteria","SCFAs","Gut barrier","Metabolic signals"]},obj:["Identify types and sources of dietary fibre","Explain how fibre may influence metabolic health","List practical ways to increase fibre without discomfort"],secs:[["Types and sources","Soluble and fermentable fibres can slow glucose absorption and support bacteria. Insoluble fibre adds bulk and can improve constipation. Whole grains, legumes, oats, vegetables, fruit, nuts and seeds are practical sources across different cuisines. Fibre needs vary, and increasing intake gradually helps tolerate it."],["Gut–liver pathways","Fermentation produces short-chain fatty acids, which support intestinal cells and modulate immunity. Fibre can also influence bile acid metabolism and satiety. These pathways may influence liver fat and inflammation, but the evidence is mostly observational or mechanistic; fibre is not a liver therapy in itself."],["Practical and safe","Add beans, whole grains or an extra vegetable gradually, and drink adequate water. People with certain intestinal diseases or a liver-related fluid restriction should follow clinical advice. Fibre supplements are not superior to food sources and can interact with medicines if used incorrectly."]],recap:"Fibre supports gut and metabolic health, indirectly favouring the liver. Food sources are preferred, with gradual increases.",refs:["wgo","aasld-masld","who-hepatitis"],books:[2,7]},{n:65,title:"Coffee, Tea and Liver Research",summary:"Observational studies link coffee to better liver-related outcomes, but this is not a treatment recommendation. Tea research is less consistent.",mins:10,visual:{kind:"compare",title:"What the evidence supports",caption:"Observational associations exist for coffee; causality is uncertain. Beverages should not replace evidence-based care.",nodes:["Coffee","Tea","Observational data","Clinical care"]},obj:["Describe the strength and limits of coffee–liver evidence","Explain why association is not causation","Identify situations where caffeine or herbal teas need caution"],secs:[["Coffee and observational findings","Coffee is associated with lower risk of several liver outcomes in observational studies, including cirrhosis and liver cancer, and some data suggest slower fibrosis progression. However, residual confounding, recall bias and differences in coffee preparation limit causal claims. Some clinical guidance notes coffee is not harmful and may be reasonable in established liver disease."],["Tea evidence","Green tea and other teas have been studied, but evidence for liver-related outcomes is less consistent. High-dose green tea extracts have been linked to liver injury. ‘Detox’ teas may contain laxatives or undisclosed herbs, and are not liver cleanses."],["Individual context","Caffeine may worsen sleep or anxiety and is unsuitable for some medical conditions. Herbal teas may interact with medicines. Avoid added sugars and syrups. If you have cirrhosis or advanced disease, ask your clinician whether coffee is appropriate."]],myth:["Coffee cures or regenerates a damaged liver.","Coffee is not a treatment. Observational associations do not justify replacing medical care with a beverage."],recap:"Coffee is associated with better liver outcomes in observational research, but it is not a therapy. Tea evidence is weaker and herbal products can harm.",refs:["nih-coffee","easl-cirrhosis","nih-supplements"],books:[7,10]},{n:66,title:"Alcohol, Nutrition and Liver Risk",summary:"Alcohol affects nutrition, gut barrier function and liver metabolism. Reducing intake is a meaningful health step that should be supported without blame.",mins:10,visual:{kind:"risk",title:"How alcohol interacts",caption:"Alcohol can displace nutrients, alter absorption and increase inflammation, compounding liver injury.",nodes:["Alcohol","Oxidative stress","Gut permeability","Nutrient gaps"]},obj:["Explain how alcohol affects nutritional status","Discuss benefits of reducing or avoiding alcohol","Identify safe ways to seek help"],secs:[["Nutrition and metabolism","Alcohol provides energy but few nutrients. Heavy use can displace meals, impair absorption of some vitamins and promote inflammation. Thiamine, folate and other deficiencies can occur. Nutrition support is important in clinical care, but supplements do not offset alcohol-related liver injury."],["Risk and benefit of reducing","Reducing or stopping alcohol lowers risk of further injury for most people with liver disease, though the specific advice depends on the condition. National guidance recommends limits for general health, but lower intake is better for the liver. There is no established safe threshold for advanced liver disease."],["Seeking support","Medications and behavioural support can help reduce alcohol use. Abrupt withdrawal in dependent drinking can be dangerous, so medical advice is important. Support should be confidential, respectful and tailored to culture and circumstances. No one should be denied care because of stigma."]],safety:"Seek urgent medical help for heavy alcohol withdrawal symptoms such as tremors, sweating, confusion, hallucinations or seizures. Do not abruptly stop heavy drinking unsupervised.",recap:"Alcohol contributes to liver injury through metabolic and nutritional effects. Reduction is beneficial and should be supported without stigma.",refs:["who-alcohol","easl-cirrhosis","niddk-liver"],books:[13,7]},{n:67,title:"Food Labels and Everyday Liver-Conscious Choices",summary:"Labels can support informed choices, but overall dietary pattern matters more than a single number. Serving sizes are a frequent source of confusion.",mins:9,visual:{kind:"compare",title:"Reading a label",caption:"Check serving size, added sugars, fibre, fat quality, sodium and ingredients — not just one headline claim.",nodes:["Serving size","Added sugars","Fibre","Sodium","Ingredients"]},obj:["Interpret serving size and nutrient amounts","Identify added sugars and high-fibre products","Evaluate marketing claims critically"],secs:[["Start with serving size","Nutrition information is often given per serving rather than per package. A bottle may contain two or more servings. Compare products per 100 g or 100 ml where available, and consider how much you actually eat. Percent daily values are based on local reference intakes and differ between countries."],["What to look for","Choose products with more fibre and less added sugar for everyday use. Fibre naturally present in grains, legumes and produce is preferable to isolated additives. Sodium matters for blood pressure, which is relevant to cardiometabolic health. Ingredient lists are ordered by weight."],["Claims need context","‘Natural’, ‘detox’, ‘liver-friendly’, ‘no added sugar’ and ‘sugar-free’ are not proof of health benefit. A syrup may be sugar-free but sweetened with other compounds. Marketing should not replace reading the numbers and asking what the evidence is."]],recap:"Labels help compare similar products when read carefully. Whole-food patterns matter more than a health claim.",refs:["who-hepatitis","aasld-masld","niddk-masld"],books:[7,5]},{n:68,title:"Nutrition in People Living with Liver Disease",summary:"Advanced liver disease has specific nutrition implications. Restrictive diets should not be applied universally, and professional support matters.",mins:11,visual:{kind:"compare",title:"Individual needs",caption:"The same diagnosis can require different nutrition plans. Ask a clinician or dietitian rather than adopting a restrictive template.",nodes:["Cirrhosis","Steatosis","Cholestasis","Transplant"]},obj:["Explain why nutrition in liver disease is individualised","Describe common issues such as muscle loss and sodium","Recognise the risks of restrictive diets"],secs:[["Different conditions, different needs","A person with steatotic liver disease may focus on metabolic risk reduction, while someone with cirrhosis needs monitoring for malnutrition and complications. Cholestatic disease affects fat-soluble vitamin absorption. Post-transplant care includes infection and metabolic considerations. There is no single diet for every liver disease."],["Energy, protein and sodium","Circular disease can increase protein breakdown. Frequent meals and a late-evening snack may be advised in some circumstances. Sodium restriction may help manage ascites, but should be set by the clinical team. People should avoid rigid self-imposed restrictions that reduce intake and worsen nutrition."],["When to seek help","Ask for referral if weight or appetite changes, if you cannot cook or shop, if you have persistent vomiting, or before starting a restrictive diet. A dietitian can adapt advice to culture, religion, budget and access. Supplements should be reviewed like medicines."]],safety:"Do not follow a ‘liver cleanse’, prolonged fasting or very-low-calorie diet if you have cirrhosis or another serious liver condition without specialist advice. Seek urgent care for vomiting, confusion or dehydration.",recap:"Nutrition care in liver disease is individualised. Adequate intake, muscle preservation and professional support matter.",refs:["easl-cirrhosis","niddk-cirrhosis","aasld-masld"],books:[7,11,15]},{n:69,title:"Physical Activity and Liver Health",summary:"Movement improves cardiometabolic health and can reduce liver fat independently of weight change. The best activity is one that is sustainable and safe.",mins:10,visual:{kind:"risk",title:"How movement helps",caption:"Activity improves insulin sensitivity, muscle fuel use and cardiovascular fitness — all relevant to liver health.",nodes:["Activity","Muscle","Insulin sensitivity","Liver fat","Cardiovascular health"]},obj:["Describe evidence linking activity to liver health","Outline practical activity goals","Identify safety considerations before starting"],secs:[["Beyond weight loss","Randomised and observational studies suggest moderate to vigorous aerobic and resistance activity can reduce hepatic fat and improve metabolic markers, even without substantial weight loss. Resistance training supports muscle mass, which is particularly relevant in chronic disease and ageing."],["Practical goals","General health guidance recommends regular moderate activity most days, plus muscle-strengthening work twice weekly, tailored to ability. Small amounts are better than none. Walking, cycling, household tasks, dancing and seated exercises all count. Build gradually and choose enjoyable activities."],["Safety and adaptation","People with advanced liver disease, frailty, bone disease, varices or heart conditions should discuss exercise with their clinical team. Stop and seek advice for chest pain, fainting, severe breathlessness, bleeding or unusual swelling. Avoid dehydration and excessive heat."]],safety:"If you have cirrhosis, portal hypertension, significant heart disease or are pregnant, discuss exercise intensity with a clinician.",recap:"Regular movement supports metabolic and cardiovascular health and can reduce liver fat. It should be adapted to the individual.",refs:["aasld-masld","easl-cirrhosis","niddk-masld"],books:[14,11]},{n:70,title:"Sleep, Circadian Rhythm and Liver Metabolism",summary:"Sleep and circadian timing influence appetite, glucose metabolism and behaviour. They may affect liver health both directly and indirectly.",mins:9,visual:{kind:"cycle",title:"24-hour metabolic rhythm",caption:"Hormones, meals and activity follow circadian rhythms. Irregular sleep can disrupt metabolic regulation.",nodes:["Light","Sleep timing","Hormones","Meals","Activity"]},obj:["Explain how circadian rhythms influence metabolism","Describe associations between short sleep and metabolic risk","List practical sleep habits"],secs:[["A biological clock in metabolism","The circadian system influences insulin sensitivity, appetite hormones and hepatic glucose production. Shift work and irregular sleep are associated with higher metabolic risk. Experimental sleep restriction can alter glucose tolerance and food preferences, though individual effects vary."],["Sleep and liver disease","Poor sleep is common in chronic liver disease and may worsen fatigue and quality of life. Some people with liver disease develop sleep–wake inversion, which should be assessed. Sleep apnoea is associated with fatty liver and cardiovascular risk and is treatable."],["Supporting rhythm","Aim for a consistent sleep and wake schedule, morning light, regular activity and a wind-down routine. Limit late caffeine and alcohol, which disturb sleep quality. Screen for treatable sleep disorders rather than relying on unregulated sleep supplements."]],recap:"Sleep and circadian regularity support metabolic health. Persistent sleep problems deserve clinical assessment.",refs:["nih-liver","aasld-masld","niddk-cirrhosis"],books:[12,13]},{n:71,title:"Stress and Metabolic Health",summary:"Stress affects behaviour, sleep, hormones and cardiovascular function. There is no direct evidence that stress alone causes cirrhosis.",mins:9,visual:{kind:"risk",title:"Indirect pathways",caption:"Stress can influence sleep, food choices, activity, alcohol and healthcare access — all relevant to liver health.",nodes:["Stress","Sleep","Food choices","Alcohol","Healthcare access"]},obj:["Explain indirect links between stress and liver health","Avoid overstating direct causation","Describe evidence-informed coping strategies"],secs:[["Indirect effects matter","Chronic stress can disrupt sleep, increase reliance on alcohol or highly palatable foods, reduce activity and make appointments harder to attend. It may also raise blood pressure and affect glucose regulation. These pathways can influence metabolic risk without stress acting as a direct liver toxin."],["Evidence and caution","Claims that unresolved emotions cause liver disease are not scientifically established and can lead to shame. Trauma and mental health conditions deserve compassionate care, not blame. Some medicines for mental health conditions affect weight or liver enzymes; these risks need review, not automatic avoidance."],["Practical support","Breathing exercises, regular movement, social connection, psychotherapy and sleep support can help. For people with liver disease, fatigue and uncertainty can be distressing; psychological support is a legitimate part of care. Avoid alcohol or unregulated herbal stress remedies as self-medication."]],recap:"Stress influences liver health mainly through behaviour and physiology. Support should be practical, non-judgemental and integrated into care.",refs:["nih-liver","who-alcohol","easl-cirrhosis"],books:[13,12]},{n:72,title:"Body Composition and Liver Health",summary:"Where fat is stored and how much muscle is present influence metabolic risk. Weight alone is an incomplete measure, and stigma harms care.",mins:10,visual:{kind:"risk",title:"Beyond weight",caption:"Visceral fat and muscle mass contribute to metabolic health. BMI is a population screening tool, not a diagnosis.",nodes:["BMI","Waist","Visceral fat","Muscle","Metabolic health"]},obj:["Explain why body weight is an incomplete health measure","Describe the relevance of visceral fat and muscle","Commit to respectful, non-stigmatising language"],secs:[["Weight and risk","Obesity is associated with MASLD and metabolic disease, but liver disease also occurs in people with a BMI in the ‘normal’ range, particularly with high visceral fat and low muscle mass. Ethnicity-specific thresholds matter. BMI does not distinguish fat from muscle or show fat distribution."],["Muscle and function","Sarcopenia is common in chronic liver disease and contributes to fatigue, falls and poorer outcomes. Preserving muscle requires adequate nutrition and resistance activity. Weight loss advice in cirrhosis must be careful not to reduce muscle mass unintentionally, and should be supervised."],["Respectful care","Weight stigma can delay healthcare and worsen mental health. Language should be neutral and person-first. Recommendations should focus on behaviours and health outcomes achievable for the individual, not on appearance or a number. Access to care should not depend on body size."]],recap:"Body composition, fat distribution and muscle matter more than a single weight. Care should be respectful and avoid assumptions.",refs:["aasld-masld","easl-masld","easl-cirrhosis"],books:[11,14,13]},{n:73,title:"Medicines and Liver Safety",summary:"The liver processes many medicines, and some can cause injury. The risk depends on the medicine, dose, interactions and the individual.",mins:11,visual:{kind:"pathway",title:"Medicine and the liver",caption:"A medicine may injure the liver directly, through reactive metabolites or via immune reactions. Most people take medicines safely.",nodes:["Medicine","Hepatic metabolism","Metabolites","Injury risk"]},obj:["Explain the concept of drug-induced liver injury","Identify steps to use medicines safely","Recognise symptoms that require prompt review"],secs:[["A spectrum of injury","Drug-induced liver injury (DILI) can range from mild enzyme elevation to acute liver failure. Some medicines cause predictable dose-related injury, while others cause idiosyncratic reactions in a small number of people. Herbal products and dietary supplements also account for a meaningful proportion of cases in some countries."],["Reducing risk","Tell every prescriber and pharmacist about your other medicines and supplements. Follow dosing instructions, especially for paracetamol (acetaminophen), and do not combine products containing the same ingredient. Ask whether liver tests are needed if you have risk factors or symptoms. Avoid alcohol binges and unsupervised supplements."],["When to act","New jaundice, dark urine, pale stools, severe fatigue, nausea, upper abdominal pain or fever after starting a medicine should be assessed. Do not stop a prescribed medicine without advice unless a clinician or emergency service tells you to. Suspected overdose needs immediate help."]],safety:"Suspected paracetamol (acetaminophen) overdose can be treated effectively if addressed early, even if you feel well. Contact local emergency services or a poison information service immediately.",urgent:!0,recap:"Most medicines are safe when used correctly. DILI risk can be reduced with careful medicine review and prompt reporting of symptoms.",refs:["nih-otc","nih-supplements","nih-liver"],books:[9,10]},{n:74,title:"Supplements, Herbal Products and Liver Injury",summary:"‘Natural’ does not mean safe, and liver injury has been reported with many supplements. Product quality and interactions vary.",mins:11,visual:{kind:"risk",title:"Why supplements can harm",caption:"Risk arises from intrinsic toxicity, high doses, contamination, mislabelling and interactions.",nodes:["Herbs","Dose","Contamination","Interactions","Unregulated products"]},obj:["Explain how supplements can cause liver injury","Identify products that warrant particular caution","Describe a safer approach to supplement use"],secs:[["A regulatory gap","In many countries, dietary supplements are not required to prove efficacy before marketing, and quality control may be limited. Labels can be inaccurate. Recognised examples of hepatotoxicity include high-dose green tea extract, some anabolic and bodybuilding products, and certain herbal mixtures. This does not mean every supplement is dangerous, but caution is warranted."],["Interactions and contaminants","Herbal products can modify drug-metabolising enzymes and transporters, altering medicine levels. Contamination with heavy metals, synthetic drugs or plant misidentification has been reported. Combination products make it difficult to identify the culprit if injury occurs."],["A practical checklist","Ask whether the product is necessary and evidence-based, check for a regulated quality mark, record the name and dose, and tell your clinician. Stop and seek advice if jaundice, dark urine, itching, abdominal pain or marked fatigue appears after starting a product. Do not use supplements as a substitute for treatment."]],safety:"Do not use supplements marketed to ‘cleanse’ or ‘regenerate’ the liver. If you suspect a supplement is causing symptoms, stop it and contact a clinician promptly; keep the packaging.",recap:"Supplements can cause liver injury through direct toxicity, contaminants or interactions. ‘Natural’ is not a safety guarantee.",refs:["nih-supplements","nih-otc","nih-liver"],books:[10,9]},{n:75,title:"Environmental Exposures and Liver Health",summary:"Certain industrial chemicals, pesticides, aflatoxins and water contaminants can affect the liver. Exposure patterns vary widely by region and occupation.",mins:10,visual:{kind:"risk",title:"Exposure routes",caption:"Inhalation, ingestion and skin contact can deliver hepatotoxic substances. Protective measures and regulation matter.",nodes:["Occupational","Air","Water","Food","Consumer products"]},obj:["List routes of environmental exposure","Explain why prevention is preferable to ‘detox’","Recognise regional differences in exposure risk"],secs:[["Chemical exposures","Solvents such as carbon tetrachloride, vinyl chloride and some pesticides can injure the liver in high exposures. Occupational protection, ventilation, gloves and training reduce risk. Some traditional medicines and cosmetics may contain heavy metals or undisclosed compounds; product testing and regulation are important."],["Food and water contaminants","Aflatoxins produced by moulds on certain nuts and grains are associated with liver cancer, particularly with hepatitis B co-infection. Safe storage of food, food safety regulation and hepatitis B vaccination reduce risk. Contaminated water and poor sanitation also contribute to infection-related liver disease."],["What you can do","Use protective equipment if your workplace requires it, store food safely, avoid mouldy foods and choose regulated products. If you suspect a hazardous exposure, contact occupational health or a poisons service. Individual susceptibility varies, and risk depends on dose and duration."]],recap:"Environmental liver risks are often preventable through regulation, workplace protection and food safety. Detox products cannot undo hazardous exposure.",refs:["who-hepatitis","nih-supplements","nih-liver"],books:[5,20]},{n:76,title:"Infection Prevention and Liver Protection",summary:"Vaccination, safe food and water, safe injections and harm reduction prevent infections that can cause chronic liver disease.",mins:11,visual:{kind:"risk",title:"Prevention layers",caption:"Multiple practical measures reduce infection-related liver disease.",nodes:["Vaccines","Safe water","Food hygiene","Blood safety","Harm reduction"]},obj:["Describe vaccines relevant to liver health","Explain safe food and injection practices","Adapt advice to local epidemiology and resources"],secs:[["Vaccination","Hepatitis A and B vaccines are widely used. Many countries recommend hepatitis B at birth and in childhood; health workers and other groups may be offered vaccination. There is no widely licensed HCV vaccine, and HEV vaccine availability is country-specific. Check national schedules, especially for travel and pregnancy."],["Food, water and injections","Safe water, hand hygiene, thorough cooking and safe food storage reduce HAV and HEV risk. Never share needles or drug-use equipment. Sterile equipment for tattoos, piercings and medical injections matters. Blood donations are screened in most countries, but the system quality varies."],["Harm reduction and care","Needle and syringe programmes reduce HCV transmission without judgement. Access to testing, treatment and vaccination for hepatitis B should be planned together. People in prisons, migrants and other underserved groups deserve equitable care, not blame."]],safety:"If you think you were exposed to hepatitis B or HIV, seek urgent advice about post-exposure prophylaxis. Timing matters and should not be delayed.",recap:"Infection prevention is a practical, community-level way to protect the liver. Access varies, so local guidance is essential.",refs:["cdc-vaccine","who-hepatitis","who-hbv","who-hcv"],books:[5,20]},{n:77,title:"Liver Health in Children, Pregnancy and Older Adults",summary:"Developmental differences, pregnancy-specific disorders and age-related changes require tailored assessment and care.",mins:12,visual:{kind:"timeline",title:"Special life stages",caption:"Neonatal jaundice, pregnancy-related liver conditions and age-related polypharmacy all require specific approaches.",nodes:["Newborn","Childhood","Pregnancy","Older adult"]},obj:["Identify common and serious liver-related issues in pregnancy","Explain special considerations in children","Describe medication and frailty issues in older adults"],secs:[["Children and adolescents","Neonatal jaundice is common and usually physiological, but persistent conjugated jaundice requires urgent investigation. Billary atresia needs early surgery for best outcomes. Children can develop viral hepatitis, autoimmune liver disease, metabolic disorders and MASLD. Growth, immunisation and school support must be part of care."],["Pregnancy","Pregnancy changes liver chemistry and increases the risk of gallstones. Conditions such as intrahepatic cholestasis of pregnancy cause itching and elevated bile acids and need monitoring. HELLP syndrome, pre-eclampsia and acute fatty liver of pregnancy are emergencies. Hepatitis B testing and birth-dose vaccination protect the baby."],["Older adults","Frailty, polypharmacy, multiple conditions and altered nutrition affect liver health. Older people may have atypical presentations and higher risk of drug interactions. Decompensation can follow infections or dehydration. Treatment goals should reflect function, quality of life and what matters to the person."]],safety:"In pregnancy, new severe itching, jaundice, vomiting, headache, visual changes or reduced fetal movements needs urgent obstetric assessment. Do not wait for a routine appointment.",urgent:!0,recap:"Children, pregnant people and older adults need tailored liver assessment. Certain pregnancy-related conditions are emergencies.",refs:["niddk-liver","who-hbv","nhs-liver","easl-cirrhosis"],books:[15,17,20]},{n:78,title:"Understanding Liver Tests, Imaging and Clinical Assessment",summary:"Liver tests are signals, not a diagnosis. Clinicians interpret patterns, trends, history and imaging together.",mins:14,visual:{kind:"labs",title:"Interpreting patterns, not labels",caption:"ALT/AST suggest hepatocyte injury; ALP/GGT suggest cholestasis; bilirubin, albumin and INR reflect different functions.",nodes:["ALT / AST","ALP / GGT","Bilirubin","Albumin","INR"]},obj:["Explain the meaning of common liver-related tests","Describe what elastography and ultrasound assess","Recognise the limitations of a single result"],secs:[["Enzymes and patterns","ALT is relatively liver-specific; AST is also found in muscle and red cells. ALT/AST elevation often suggests hepatocyte injury, but severity does not correlate neatly with enzyme level. ALP and GGT more often reflect bile duct or cholestatic processes. GGT can also be raised by alcohol and medicines. Patterns narrow differentials but do not confirm diagnoses."],["Synthetic and excretory markers","Bilirubin processing, albumin and clotting time (INR or PT) reflect different aspects of function. Low albumin can indicate chronic illness or malnutrition as well as liver disease. INR is influenced by warfarin and vitamin K status. Platelets may fall with portal hypertension. Numbers must be interpreted with context and trend."],["Imaging and elastography","Ultrasound identifies fat, masses, dilated ducts and fluid. CT or MRI clarify lesions. Elastography estimates liver stiffness and is used to assess fibrosis; it is less accurate in acute inflammation, congestion or obesity depending on technique. Liver biopsy remains useful in selected cases. No single test excludes every liver disease."]],safety:"Do not use internet interpretation to diagnose yourself or change prescribed treatment. Ask your clinician to explain your results and what follow-up is needed. New jaundice or confusion needs urgent review.",recap:"Tests reflect different processes and must be interpreted together. Normal enzymes do not exclude all liver disease, and one abnormal value is not a diagnosis.",refs:["niddk-liver","nice-nafld","wgo","nih-liver"],books:[10,11]},{n:79,title:"Liver Disease Prevention, Vaccination and Early Assessment",summary:"Prevention combines vaccination, food and water safety, metabolic risk reduction, alcohol harm reduction, medication safety and appropriate screening.",mins:11,visual:{kind:"risk",title:"Prevention by cause",caption:"Different causes need different prevention strategies. There is no single ‘liver protection’ product.",nodes:["Vaccines","Metabolic health","Alcohol","Medicines","Screening"]},obj:["List cause-specific prevention strategies","Explain the role of vaccination and screening","Describe an approach to early assessment"],secs:[["Preventing infections","Check your national hepatitis B vaccination schedule, especially for infants, health workers and people at higher risk. Use safe water and food handling. Avoid sharing injection equipment. Ask about post-exposure prophylaxis after relevant exposures. Ask whether hepatitis B or C screening applies to you, based on country and risk."],["Preventing metabolic and alcohol injury","Support metabolic health through varied nutrition, daily movement, sleep and weight change when relevant — without stigmatising. Reducing alcohol lowers risk. Early detection of MASLD, diabetes and hypertension allows coordinated care. Do not use supplements as prevention substitutes."],["Early assessment","Prompt assessment is appropriate for persistent fatigue, new jaundice, dark urine, itching, upper abdominal discomfort, unexplained weight loss, or abnormal liver tests. People with known chronic liver disease need scheduled monitoring. Bring a list of medicines, supplements, immunisations and family history to appointments."]],recap:"Prevention is cause-specific and practical. Vaccination, safe food and blood practices, metabolic care, alcohol support and medicine review all matter.",refs:["who-hbv","cdc-hepc","aasld-masld","who-alcohol"],books:[5,11,10]},{n:80,title:"Building a Lifelong Liver Health Plan",summary:"A sustainable plan focuses on the factors you can influence, regular clinical follow-up and realistic learning — not perfection or a quick cleanse.",mins:12,visual:{kind:"cycle",title:"A lifelong learning cycle",caption:"Learn, act, review and adjust. Share decisions with clinicians and adapt to circumstances.",nodes:["Learn","Act","Review","Adjust","Share"]},obj:["Create a personal educational plan without self-prescribing","Identify sustainable habits and appropriate monitoring","Prepare for clinical conversations and safety planning"],secs:[["Build a foundation","Choose one or two sustainable changes: a vegetable at lunch, a short daily walk, replacing a sugary drink, a consistent bedtime, or reviewing all medicines and supplements with a pharmacist. Plan for barriers such as cost, shift work and caring responsibilities. Progress is not linear."],["Use healthcare well","Keep track of appointments, tests and vaccination records. Ask why a test is being done, what the results mean and when to follow up. For anyone with chronic liver disease, ask about liver cancer surveillance, fibrosis assessment, nutrition support and medication safety. Country-specific programmes vary, so check local guidance."],["Know when to get urgent help","Know the warning signs and your local emergency and poison information numbers. Avoid universal assumptions about emergency numbers. Share your plan with someone you trust. Learning about liver health should increase confidence, not fear or self-treatment."]],safety:"If you experience vomiting blood, black tarry stools, confusion, collapse, severe abdominal pain with fever, rapidly increasing abdominal swelling or suspected poisoning, seek emergency care immediately.",recap:"Lifelong liver wellness is built from sustainable habits, prevention, review, and timely professional care — not a product or a reset.",refs:["niddk-liver","easl-cirrhosis","who-hepatitis","aasld-masld"],books:[7,10,11,14,15]}],Im={11:{t:"Why the lobule is a model, not a brick",items:["The hexagon is a teaching simplification. Real liver tissue is a continuous three-dimensional labyrinth of plates, sinusoids and canaliculi.","Oxygen falls as blood moves from portal tracts to central veins, creating metabolic zones with different enzyme profiles and vulnerabilities.","Blood flows centripetally toward the central vein; bile flows centrifugally into canaliculi and portal ducts. The two systems are physically separate.","The acinus model emphasises metabolic gradients, which helps explain why certain toxins injure specific zones."]},12:{t:"Organelles and hepatocyte output",items:["Rough endoplasmic reticulum supports protein synthesis; smooth endoplasmic reticulum is rich in cytochrome P450 enzymes and lipid-handling machinery.","Mitochondria supply ATP for gluconeogenesis and urea synthesis. Peroxisomes shorten very-long-chain fatty acids and participate in detoxification.","Hepatocytes are polarised: one surface faces blood, another faces the bile canaliculus. Transporters on each side determine direction of movement.","Many hepatocytes are polyploid, with more than the usual chromosome sets — a feature linked to metabolic capacity and adaptation to injury."]},14:{t:"Portal circulation and first-pass processing",items:["The portal vein is formed by the superior mesenteric and splenic veins; it carries absorbed nutrients, hormones, bile acids and gut-derived microbial signals.","First-pass hepatic metabolism can remove, activate or modify oral medicines before systemic availability, which is why routes and doses differ.","Portal pressure is normally low. Resistance from fibrosis or vascular disease raises it and drives portosystemic collateral formation.","Caput medusae, oesophageal varices and haemorrhoids are examples of collateral pathways, but varices and ascites are the most clinically significant in cirrhosis."]},15:{t:"Arterial supply and the buffer response",items:["The common hepatic artery usually arises from the coeliac trunk; it supplies roughly a quarter of total hepatic blood flow but a substantial fraction of oxygen.","The hepatic arterial buffer response increases arterial flow when portal flow falls, helping protect oxygen delivery.","Hepatic venous outflow enters the inferior vena cava. Obstruction causes hepatic congestion (Budd–Chiari syndrome) and can lead to fibrosis.","Arterial anatomy is variable and is mapped before liver resection or transplantation."]},16:{t:"Kupffer cells and the immune balance",items:["Kupffer cells are resident macrophages positioned mainly near portal inflow, where they sample gut-derived material.","Phagocytosis and scavenger receptors clear particles and endotoxin; cytokine release coordinates inflammation and repair.","Chronic activation can amplify hepatocyte injury, linking gut permeability, alcohol and metabolic stress to liver inflammation.","Their dual protective and harmful potential makes them targets of research, but no immune “boosting” supplement is an established liver therapy."]},17:{t:"Bile formation and the cholangiocyte contribution",items:["Hepatocytes secrete bile acids, cholesterol, phospholipids and bilirubin across the canalicular membrane using ATP-dependent transporters.","Bile is at least partly modified downstream: cholangiocytes secrete bicarbonate-rich fluid, especially after secretin stimulation.","Conjugated bilirubin is water-soluble and moves into bile through specific transporters such as MRP2.","Obstruction anywhere along the tract can cause jaundice, cholestatic enzymes and complications such as cholangitis."]},19:{t:"Dual circulation and pressure dynamics",items:["Hepatic blood volume is large because of low vascular resistance and sinusoidal capacitance. Flow depends on both portal inflow and cardiac output.","Portal and arterial blood mix within sinusoids, allowing efficient oxygen extraction and nutrient processing.","In cirrhosis, fixed structural resistance is compounded by dynamic vasoconstriction and splanchnic vasodilation, worsening portal pressure.","Blood pressure, sepsis, heart failure and kidney function can all alter hepatic perfusion, which is why the liver cannot be assessed in isolation."]},20:{t:"Regeneration and its boundaries",items:["After partial resection, remaining hepatocytes re-enter the cell cycle within hours and restore functional mass over weeks.","Regeneration is regulated by cytokines, growth factors and metabolic demand. It restores mass and function, not necessarily original shape.","In repeated or chronic injury, hepatocyte proliferation can be impaired. Progenitor cells and ductular reactions may contribute, but fibrosis can dominate.","Living-donor transplantation uses regeneration, yet donors require careful safety assessment. No commercial supplement is proven to regenerate a diseased liver."]},21:{t:"The glucose buffer in detail",items:["Glucokinase in the liver phosphorylates glucose after a rise, promoting glycogen storage when insulin is high.","Glycogenolysis releases glucose between meals; gluconeogenesis sustains glucose during longer fasting.","The liver shares glucose with the brain and red blood cells. Muscle glycogen is stored locally and used by muscle.","Chronic insulin resistance increases hepatic glucose output and de novo lipogenesis, linking diabetes with steatotic liver disease."]},22:{t:"Insulin resist
