ance and hepatic energy balance",items:["Insulin normally suppresses hepatic glucose production and lipogenesis; in resistance, these effects fail while compensatory hyperinsulinaemia persists.","Increased adipose lipolysis raises plasma free fatty acids, increasing hepatic fat delivery.","Excess fatty acids and glucose-derived precursors promote triglyceride accumulation, lipotoxicity and endoplasmic reticulum stress.","Skeletal muscle and adipose tissue also contribute; treating metabolic risk requires whole-body approaches, not liver products."]},23:{t:"Protein synthesis is not just albumin",items:["Hepatocytes produce albumin, fibrinogen, most clotting factors, transferrin, ceruloplasmin and acute-phase proteins.","Amino acid availability, energy and inflammatory mediators all regulate protein synthesis. Albumin can fall with inflammation even when intake is adequate.","The liver releases amino acids to peripheral tissues and uses others for synthesis, transamination and energy.","Severe protein restriction can worsen muscle loss and nutritional status, which is why it is not a universal liver-disease treatment."]},24:{t:"The urea cycle at a glance",items:["Carbamoyl phosphate synthetase I uses ammonia and bicarbonate in mitochondria, forming carbamoyl phosphate.","The cycle incorporates a second nitrogen from aspartate, generating argininosuccinate, arginine and finally urea.","Ornithine is regenerated. Inherited enzyme deficiencies can cause hyperammonaemia and neurological harm if untreated.","In advanced liver disease, urea synthesis falls and shunting can worsen hyperammonaemia; treatment starts with addressing precipitants."]},25:{t:"Fat in, fat out, fat burned",items:["Hepatic fat comes from plasma free fatty acids, chylomicron remnants and de novo lipogenesis.","Triglycerides can be stored in lipid droplets or packaged into VLDL. Oxidation provides energy but is limited when substrate is high.","In steatotic liver disease, fat accumulation is often accompanied by lipotoxic species and inflammation, particularly in MASH.","The presence of fat alone is not the same as active injury; fibrosis and inflammation determine risk more closely."]},26:{t:"Cholesterol is essential and tightly regulated",items:["HMG-CoA reductase is the rate-limiting enzyme of synthesis and the target of statins, which also increase hepatic LDL receptor expression.","Cholesterol can be converted into bile acids, exported in bile, or used for membranes and steroid hormones.","Bile acid sequestration and absorption drugs illustrate the liver's central role in lipid balance.","Some inherited disorders raise LDL markedly and require specialist management; diet alone may not be sufficient."]},27:{t:"Lipoprotein trafficking",items:["Chylomicrons carry dietary fat from the intestine via lymph; the liver clears their remnants.","VLDL exports hepatic triglycerides. Lipoprotein lipase in tissues releases fatty acids, converting VLDL to remnants and LDL.","Hepatic LDL receptors remove LDL particles. Receptor activity determines how long LDL circulates.","Hypertriglyceridaemia and hepatic fat export can increase in MASLD, contributing to cardiovascular risk."]},28:{t:"The enterohepatic circulation",items:["The liver synthesises primary bile acids from cholesterol and conjugates them to glycine or taurine to enhance solubility.","Most bile acids are reabsorbed in the terminal ileum through specific transporters and returned via portal blood.","Hepatocytes efficiently extract returning bile acids, maintaining a large circulating pool with minimal daily replacement.","Bile acid sequestrants interrupt this circulation, increasing bile acid synthesis and lowering LDL cholesterol."]},29:{t:"Bilirubin conjugation and cholestasis",items:["Haem is degraded to biliverdin and then bilirubin, mostly in the mononuclear phagocyte system.","UGT1A1 conjugates bilirubin with glucuronic acid in the liver, producing water-soluble bilirubin diglucuronide.","Conjugated bilirubin is exported by MRP2 into bile. Impaired export raises conjugated bilirubin in blood.","Unconjugated bilirubin is albumin-bound and does not enter urine; conjugated bilirubin can darken urine when bile flow is impaired."]},32:{t:"A rebalanced clotting system",items:["The liver synthesises procoagulant factors, anticoagulant proteins and fibrinogen. Vitamin K is required for several of these.","In advanced liver disease, both bleeding and thrombotic risks may exist. The INR does not capture the whole haemostatic balance.","Cholestasis can impair vitamin K absorption, but vitamin K should be used with clinical guidance.","Anticoagulation and procedures in liver disease require individual assessment, sometimes with haematology input."]},35:{t:"Gut–liver signalling pathways",items:["Portal venous drainage gives the liver first access to microbial products and dietary compounds.","The intestinal barrier limits translocation; increased permeability can raise hepatic exposure to endotoxin and microbial DNA.","Microbial fermentation produces short-chain fatty acids, while microbial bile acid metabolism changes the bile acid pool.","These pathways are biologically plausible and actively studied, but interventions must be tested rather than assumed."]},37:{t:"Cytochrome P450 in context",items:["CYP3A4 is abundant in liver and intestine and metabolises a large share of medicines.","CYP2E1 is induced by chronic alcohol use and metabolises alcohol and some medicines, increasing reactive oxygen species.","Genetic variation, age, inflammation, diet and co-medication can alter CYP enzyme activity.","Induction can lower medicine levels, while inhibition can raise them and cause toxicity. Herbal products can do both."]},38:{t:"Two phases, one coordinated system",items:["Phase I reactions functionalise compounds, often through cytochrome P450 oxidation.","Phase II reactions conjugate groups such as glucuronate, sulfate or glutathione, generally increasing water solubility.","Transporters export metabolites into bile or blood. If export or conjugation is overwhelmed, reactive intermediates can injure cells.","Enzyme activity is tightly regulated. Inducing enzymes indiscriminately can make a medicine ineffective or produce more reactive metabolites."]},40:{t:"From inflammation to fibrosis",items:["Injured hepatocytes release signals that recruit immune cells and activate stellate cells.","Stellate cells transform into collagen-producing myofibroblasts. Initially protective, this response becomes pathological when persistent.","Fibrosis progressively disrupts sinusoidal exchange and increases portal resistance. Advanced fibrosis is described as cirrhosis.","Removing the cause can reduce inflammation and sometimes fibrosis, but regression is variable and cannot be guaranteed."]},41:{t:"Steatosis is a finding, not a diagnosis",items:["Hepatic triglycerides accumulate when supply and synthesis exceed oxidation and export.","Causes include metabolic risk, alcohol, medicines, viral infection, rapid weight change and inherited conditions.","Fibrosis stage, rather than fat amount alone, is a major determinant of long-term risk.","The 2023 nomenclature distinguishes MASLD, MetALD and alcohol-associated liver disease, while retaining a category for other causes."]},44:{t:"Alcohol metabolism and tissue injury",items:["Alcohol dehydrogenase and cytochrome P450 2E1 convert alcohol to acetaldehyde, a reactive and toxic compound.","Chronic alcohol use induces CYP2E1, increases oxidative stress and alters fat metabolism.","Alcohol increases gut permeability, allowing microbial products to reach the liver and amplify inflammation.","Nutritional deficiencies are common and clinically important, but supplements do not neutralise ongoing alcohol injury."]},54:{t:"What cirrhosis does to the liver",items:["Bridging fibrosis and regenerative nodules alter blood flow and hepatocyte function.","Compensated cirrhosis may produce no symptoms and normal or near-normal routine liver tests.","Portal hypertension, impaired protein synthesis and reduced clearance create complications such as varices, ascites and encephalopathy.","Risk of hepatocellular carcinoma persists, so surveillance should be considered in eligible patients."]},55:{t:"Portal pressure and its complications",items:["Increased intrahepatic resistance and increased splanchnic inflow combine to raise portal pressure.","Collateral vessels form, including oesophageal and gastric varices that can bleed catastrophically.","Fluid retention and low oncotic pressure contribute to ascites; spontaneous bacterial infection of ascites is serious.","Management may include non-selective beta-blockers, endoscopic treatment, diuretics, paracentesis or TIPS in selected cases."]},57:{t:"Why surveillance is used",items:["HCC is strongly associated with cirrhosis and chronic hepatitis B, and can also occur in other liver diseases.","Surveillance uses six-monthly ultrasound with or without a blood marker in defined high-risk groups.","Surveillance aims to detect cancer earlier, when more treatment options may be available. It does not prevent all deaths.","Diagnosis and treatment are multidisciplinary and depend on tumour stage, liver function and overall health."]},78:{t:"Reading patterns rather than single numbers",items:["ALT and AST reflect hepatocyte injury but not the severity of fibrosis or functional reserve.","ALP and GGT suggest cholestasis, although bone, medicines and alcohol can raise them.","Bilirubin, albumin and INR reflect distinct processes; albumin is also affected by inflammation and nutrition.","Elastography estimates fibrosis but can be confounded by acute inflammation, congestion and technical factors. No single test diagnoses every liver condition."]}},Ti=[{id:1,numeral:"I",title:"Introduction to Liver Health",range:[1,8],blurb:"What the liver does, why it matters, how health is measured, and how to recognise misleading claims.",accent:"#75804f"},{id:2,numeral:"II",title:"Liver Anatomy & Physiology",range:[9,20],blurb:"From organ position and lobes to hepatocytes, sinusoids, blood supply, the biliary tree and regeneration.",accent:"#9a6b43"},{id:3,numeral:"III",title:"Metabolism & Biochemical Functions",range:[21,32],blurb:"Carbohydrate and fat handling, protein synthesis, urea, bile, bilirubin, vitamins, hormones and clotting.",accent:"#b08a3a"},{id:4,numeral:"IV",title:"Digestion, Detoxification & Immunity",range:[33,40],blurb:"Bile in digestion, the gut–liver axis, biotransformation, cytochrome P450 and hepatic immune defence.",accent:"#5a7d5a"},{id:5,numeral:"V",title:"Common Liver Conditions",range:[41,58],blurb:"Steatotic disease, alcohol-related injury, viral hepatitis, autoimmune and genetic conditions, cirrhosis and cancer.",accent:"#a65d4f"},{id:6,numeral:"VI",title:"Nutrition & Liver Wellness",range:[59,68],blurb:"Evidence-informed eating patterns, fibre, fats, protein, coffee research and reading food labels.",accent:"#8a8f4a"},{id:7,numeral:"VII",title:"Lifestyle, Medicines & Environment",range:[69,76],blurb:"Movement, sleep, stress, body composition, medication safety, supplements and environmental exposure.",accent:"#5f7c73"},{id:8,numeral:"VIII",title:"Liver Health Throughout Life",range:[77,77],blurb:"Developmental differences, pregnancy-related liver conditions and the ageing liver.",accent:"#7d6f95"},{id:9,numeral:"IX",title:"Testing, Diagnosis & Clinical Care",range:[78,78],blurb:"Liver enzymes, bilirubin, albumin, clotting, imaging, elastography and the limits of a single result.",accent:"#5c7392"},{id:10,numeral:"X",title:"Prevention & Lifelong Wellness",range:[79,80],blurb:"Vaccination, risk reduction, medication safety and a realistic personal learning plan.",accent:"#75804f"}],Xf=m=>Ti.find(d=>m>=d.range[0]&&m<=d.range[1])??Ti[0],Zf=[...Kf,...Qf],Le=Zf.map(m=>m.dive||!Im[m.n]?m:{...m,dive:Im[m.n]}),Ff=m=>Le.find(d=>d.n===m),eh=m=>{const d=m.trim().toLowerCase();return d?Le.filter(h=>h.title.toLowerCase().includes(d)||h.summary.toLowerCase().includes(d)||h.obj.join(" ").toLowerCase().includes(d)||h.secs.some(([c,u])=>(c+" "+u).toLowerCase().includes(d))):Le},th=[["Anatomy",[["Liver","The largest internal solid organ, located in the upper right abdomen; central to metabolism, bile production, protein synthesis and substance processing."],["Hepatocyte","The main functional liver cell, responsible for metabolism, protein synthesis, bile secretion and biotransformation."],["Right lobe","The larger main lobe of the liver, lying predominantly on the right side of the abdomen."],["Left lobe","The smaller main lobe extending across the midline, separated on the surface by the falciform ligament."],["Caudate lobe","A smaller lobe on the posterior visceral surface of the liver, near the inferior vena cava."],["Quadrate lobe","A small lobe on the inferior surface between the gallbladder fossa and the ligamentum teres."],["Falciform ligament","A peritoneal fold separating the left and right lobes on the anterior surface."],["Porta hepatis","The ‘hilum’ of the liver, transmitting the portal vein, hepatic artery and bile ducts."],["Couinaud segments","Eight functional liver segments, each with its own portal inflow, arterial supply and biliary drainage."],["Hepatic lobule","A hexagonal model of liver microanatomy with portal triads at the corners and a central vein."],["Portal triad","A portal vein branch, hepatic artery branch and bile duct running together in connective tissue."],["Sinusoid","A specialised, fenestrated liver capillary in which blood exchanges with hepatocytes."],["Central vein","A small vein at the centre of a classic lobule that collects sinusoidal blood."],["Kupffer cell","A liver-resident macrophage that clears particles and coordinates immune responses."],["Hepatic stellate cell","A perisinusoidal cell that stores vitamin A and can become fibrogenic after chronic injury."],["Bile canaliculus","A tiny channel between hepatocytes into which bile is secreted."],["Cholangiocyte","A bile duct epithelial cell that modifies and transports bile."],["Gallbladder","A pear-shaped sac that stores and concentrates bile and contracts after fatty meals."],["Ampulla of Vater","The junction where the common bile duct and pancreatic duct enter the duodenum."],["Sphincter of Oddi","A muscular valve controlling bile and pancreatic juice flow into the duodenum."],["Portal vein","A large vein carrying nutrient-rich blood from the intestines and spleen to the liver."],["Hepatic artery","The artery supplying oxygen-rich blood to the liver and biliary tree."],["Hepatic veins","Veins that drain blood from the liver into the inferior vena cava."],["Diaphragm","The muscle separating the chest and abdomen; the liver lies directly beneath it."],["Peritoneum","The membrane lining the abdominal cavity and partly covering the liver."],["Glisson’s capsule","The thin connective tissue capsule covering the liver surface."],["Ligamentum teres","A fibrous remnant of the umbilical vein on the liver’s surface."],["Visceral surface","The inner surface of the liver moulded by nearby organs."],["Acimus / acinus","A metabolic model of liver tissue dividing it into zones based on oxygen and nutrient gradients."],["Ductus choledochus","The common bile duct, carrying bile toward the duodenum."],["Hepatorenal relationship","The interaction between liver disease, splanchnic blood flow, kidney perfusion and fluid balance."]]],["Physiology & metabolism",[["Metabolism","The sum of chemical reactions that build, break down and transform molecules in the body."],["Glycogenesis","The synthesis of glycogen from glucose, promoted by insulin after meals."],["Glycogenolysis","The breakdown of glycogen to release glucose into the blood."],["Gluconeogenesis","The creation of new glucose from non-carbohydrate precursors such as lactate, glycerol and amino acids."],["Glycogen","A branched storage form of glucose found mainly in liver and muscle."],["Insulin resistance","Reduced responsiveness of tissues to insulin, associated with type 2 diabetes and steatotic liver disease."],["Gluconeogenic substrate","A molecule such as lactate or an amino acid used to make glucose."],["De novo lipogenesis","Synthesis of new fat in the liver from carbohydrate and other precursors."],["Beta-oxidation","Mitochondrial breakdown of fatty acids to produce energy."],["Triglyceride","A storage and transport lipid made of glycerol and three fatty acids."],["Steatosis","Accumulation of fat, chiefly triglycerides, inside hepatocytes."],["Lipoprotein","A particle that transports lipids and cholesterol in the blood."],["VLDL","Very-low-density lipoprotein, produced by the liver to export triglycerides."],["LDL","Low-density lipoprotein, a cholesterol-carrying particle associated with cardiovascular risk when elevated."],["HDL","High-density lipoprotein, involved in reverse cholesterol transport and other protective functions."],["Chylomicron","A lipoprotein assembled in the intestine to transport dietary fat."],["Cholesterol","A structural lipid used in membranes, hormones, vitamin D and bile acids, synthesised largely in the liver."],["HMG-CoA reductase","The rate-limiting enzyme of cholesterol synthesis and the target of statins."],["Bile acid","A cholesterol-derived molecule that emulsifies fat and is recycled through the gut–liver circulation."],["Albumin","The main circulating protein, made by the liver, which maintains oncotic pressure and transports many substances."],["Globulin","One of a group of plasma proteins, including carrier proteins and immunoglobulins."],["Urea","A water-soluble nitrogen waste product made in the liver and excreted by the kidneys."],["Urea cycle","The enzymatic pathway converting ammonia nitrogen into urea."],["Ammonia","A nitrogen-containing compound produced by amino acid metabolism and gut bacteria; excessive levels are toxic."],["Amino acid","A building block of proteins that also participates in metabolism and signalling."],[" plement scrutiny",objective:"Evaluate a product claim critically.",task:"Complete worksheet 10; check evidence and quality marks.",reflection:"What claims have you seen that promise a cure?",safety:"Report suspected supplement-related symptoms to a clinician."},{day:21,title:"Read liver tests",objective:"Explain six common markers.",task:"Read chapter 78 and complete worksheet 13.",reflection:"Why can one test not diagnose everything?",safety:"Do not self-diagnose from test results."},{day:22,title:"Vaccination planning",objective:"Identify relevant vaccines and local guidance.",task:"Read chapter 76 and worksheet 12; visit an official local source.",reflection:"What is one vaccine question for your clinician?",safety:"Do not rely on this book for an individual vaccine schedule."},{day:23,title:"Food and water safety",objective:"Reduce hepatitis A/E and contaminant risk.",task:"Read chapters 75–76 and list two practical food safety steps.",reflection:"What storage practice could you improve?",safety:"Avoid mouldy nuts and grains; use safe water where advised."},{day:24,title:"Movement and sleep",objective:"Plan sustainable metabolic support.",task:"Complete worksheet 17 and do one short walk or seated activity.",reflection:"What barrier needs a realistic solution?",safety:"Check exercise plans with your clinician if you have advanced disease."},{day:25,title:"HCC surveillance concepts",objective:"Explain surveillance without assuming diagnosis.",task:"Read chapter 57 and write what surveillance means.",reflection:"Who in your life might need to ask about screening?",safety:"Surveillance is not a guarantee of prevention."},{day:26,title:"Build a learning goal",objective:"Choose a realistic health-learning priority.",task:"Write one goal for the next 30 days.",reflection:"How will you know you have made progress?",safety:"Do not replace clinical care with self-help."},{day:27,title:"Your care team",objective:"Identify who can help with different questions.",task:"Write roles of a pharmacist, dietitian, nurse and clinician.",reflection:"Which professional should you contact first?",safety:"Use emergency services for emergencies, not routine questions."},{day:28,title:"Safety plan",objective:"Know the warning signs and local numbers.",task:"Complete worksheet 18 and record local emergency and poison numbers.",reflection:"Who could you call in an emergency?",safety:"Do not assume a universal emergency number."},{day:29,title:"Share accurate information",objective:"Correct one myth responsibly.",task:"Complete worksheet 19 and explain a myth without shaming.",reflection:"What is the evidence-based alternative?",safety:"Do not give personal medical advice to others."},{day:30,title:"Lifelong plan",objective:"Bring learning into everyday life.",task:"Complete worksheet 20; write down one learning habit and one care review.",reflection:"What part of this month will you keep?",safety:"Seek individual advice for any personal health decision."}],No=fg.map(m=>({...m,block:pg(m.day)})),To=[{id:1,title:"Understanding the workload",scenario:"A 16-year-old studying biology asks why the liver is described as a chemical factory.",concepts:["Metabolism","Protein synthesis","Bile"],questions:["Name four broad liver functions.","Why is “filter” an incomplete description?"],explanation:"The liver performs thousands of simultaneous reactions: it stores and releases glucose, builds proteins, produces bile, handles substances and participates in immunity. Calling it a factory or a chemical hub is more accurate than calling it a filter.",safety:"This is general education, not personal health advice.",points:["Liver functions overlap.","Analogies help, but organs are not machines."]},{id:2,title:"Metabolic risk in a normal-weight adult",scenario:"A 38-year-old with type 2 diabetes and high blood pressure learns that a scan shows liver fat. They are surprised because their BMI is in the “normal” range.",concepts:["MASLD","Insulin resistance","Fibrosis assessment"],questions:["What is MASLD?","Why does weight alone not determine risk?"],explanation:"MASLD is steatosis plus at least one cardiometabolic criterion. Body fat distribution, muscle mass, ethnicity and genetics influence risk; BMI is an incomplete measure. Clinical risk stratification helps decide who needs further assessment.",safety:"Scan findings and risk scores need clinical interpretation.",points:["MASLD is not limited to fat tissue.","Cardiovascular risk also matters."]},{id:3,title:"The detox drink advertisement",scenario:"An adult sees an advertisement claiming a juice cleanse will ‘flush years of toxins’ from the liver and asks whether to try it.",concepts:["Biotransformation","Evidence","Product risk"],questions:["Is there a medically required liver cleanse?","Which claims are red flags?"],explanation:"The liver continuously performs biotransformation using phase I and phase II systems. No commercial cleanse is required to remove a physical sludge. Severe restriction may reduce nutrient intake, and unlisted ingredients can cause injury. Evidence-based care should target the actual cause.",safety:"Stop and seek advice if symptoms develop after any product.",points:["Detox marketing is not clinical evidence.","Questionable products delay care."]},{id:4,title:"A family and hepatitis A",scenario:"A family is planning a journey to an area where hepatitis A is more common and asks about prevention.",concepts:["Faecal–oral transmission","Vaccination","Food safety"],questions:["How is hepatitis A transmitted?","Which prevention measures are available?"],explanation:"Hepatitis A spreads by the faecal–oral route. Safe water, hand hygiene, careful food handling and hepatitis A vaccination reduce risk. Country-specific travel recommendations should be checked with official sources before departure.",safety:"Vaccine recommendations differ by country and personal risk.",points:["Food and water safety matter.","Travel planning is individual."]},{id:5,title:"Hepatitis B vaccination questions",scenario:"A young adult with a household contact with hepatitis B wonders if they need vaccination.",concepts:["HBV transmission","Vaccine","Screening"],questions:["Is HBV spread by casual contact?","What should they ask a clinician?"],explanation:"Hepatitis B spreads through blood, semen, vaginal fluids and perinatally. Household contacts may be offered vaccination and testing based on local guidance. A completed vaccine series can provide immunity, and a blood test may confirm protection when appropriate.",safety:"Follow national immunisation and screening guidance.",points:["Casual contact is not a transmission route.","Household prevention protects everyone."]},{id:6,title:"Hepatitis C testing",scenario:"A person with a past history of unsafe injections is offered hepatitis C testing and feels anxious about stigma.",concepts:["HCV antibody","RNA testing","Treatment"],questions:["What does a positive antibody test mean?","What is the next test?"],explanation:"An antibody test indicates past exposure. If positive, HCV RNA testing shows whether infection is current. Direct-acting antivirals can cure most treated infections. Testing should be confidential and non-judgemental; reinfection prevention remains important.",safety:"Care is confidential and should not involve blame.",points:["Antibody is not the same as current infection.","Cure is possible."]},{id:7,title:"Many medicines",scenario:"An older adult takes five medicines and a multivitamin, and asks whether their liver can ‘handle’ them.",concepts:["Polypharmacy","Interactions","Review"],questions:["Why ask for a medicine review?","Which products should be disclosed?"],explanation:"Liver processing is individual, and medicine effects depend on dose, interactions, genetics and other conditions. A pharmacist or clinician can review all products, including supplements, and check whether monitoring is appropriate.",safety:"Do not stop prescribed medicines independently.",points:["Disclose every product.","Review is collaborative."]},{id:8,title:"An unverified herbal product",scenario:"A friend recommends an imported herbal liver tonic that claims to ‘reverse scarring’.",concepts:["Supplement regulation","Hepatotoxicity","Evidence"],questions:["What is known about the product?","What could go wrong?"],explanation:"Supplements may lack proof of efficacy and may be contaminated or cause liver injury. A claim to reverse fibrosis is not established. The person should discuss evidence and alternatives with a clinician, and keep the packaging if symptoms arise.",safety:"Do not replace treatment with an unverified product.",points:["“Natural” does not mean safe.","Proven treatments are cause-specific."]},{id:9,title:"Reducing alcohol",scenario:"An adult with alcohol-related liver injury wants to stop drinking but is worried about withdrawal.",concepts:["Alcohol-related injury","Withdrawal","Harm reduction"],questions:["Why seek medical advice before stopping?","What support exists?"],explanation:"Heavy alcohol withdrawal can cause serious symptoms including seizures. Medical support makes stopping safer. Care may combine monitoring, nutrition support and behavioural or medicine-based treatment, offered without shame.",safety:"Seek urgent help for severe withdrawal symptoms.",points:["Plan withdrawal with a clinician.","Support works; stigma does not."]},{id:10,title:"Preparing for an appointment",scenario:"An adult has raised liver enzymes and wants to use their appointment well.",concepts:["Liver tests","Context","Question preparation"],questions:["What information should they bring?","Which test is missing?"],explanation:"Bring medicines, supplements, symptoms, family history and any previous results. Clinicians will ask about alcohol, metabolic risk, viral hepatitis risk and exposures. One result is not a diagnosis; the clinician will interpret patterns and arrange follow-up.",safety:"Do not self-prescribe or change medicines while waiting.",points:["Context matters more than a single number.","Prepare questions."]},{id:11,title:"Pain after fatty meals",scenario:"A person reports intermittent upper-right abdominal pain after heavy meals and wonders if it is gallstones.",concepts:["Biliary colic","Ultrasound","Emergency signs"],questions:["When does pain become urgent?","What test might be arranged?"],explanation:"Gallstones can cause pain, but many are asymptomatic. Ultrasound is commonly used when symptoms suggest biliary colic. Fever, jaundice, persistent vomiting or severe pain warrant urgent assessment because obstruction and infection are possible.",safety:"Do not treat severe abdominal pain with remedies at home.",points:["Many gallstones need no surgery.","Fever with jaundice is urgent."]},{id:12,title:"A caregiver and cirrhosis",scenario:"A family member cares for an adult with cirrhosis and wants to know how to help safely.",concepts:["Cirrhosis","Nutrition","Encephalopathy"],questions:["Which symptoms need urgent attention?","Why is a medicine review important?"],explanation:"Care can include help with appointments, nutrition, medicines and observations. Confusion, vomiting blood, black stools, fever, rapidly increasing abdominal swelling or reduced urine output all need urgent assessment. Nutrition is individual and may include adequate protein.",safety:"Emergency symptoms need local emergency services.",points:["Know the warning signs.","Caregivers need support too."]},{id:13,title:"What does bilirubin mean?",scenario:"A student has mild jaundice and a blood test shows raised bilirubin; they ask if this means liver failure.",concepts:["Bilirubin metabolism","Conjugation","Clinical interpretation"],questions:["What are the sources of bilirubin?","Which patterns exist?"],explanation:"Bilirubin comes from haem breakdown. Unconjugated bilirubin is albumin-bound; the liver conjugates it for bile excretion. Patterns differ with haemolysis, inherited conjugation changes, liver injury and bile duct obstruction. Symptoms, other tests and clinical assessment are needed.",safety:"Jaundice with fever, confusion or pain requires urgent care.",points:["One pigment does not diagnose a cause.","Clinical context is essential."]},{id:14,title:"Gut health products",scenario:"An adult wondering about liver health wants to start a probiotic and a ‘gut cleanse’.",concepts:["Gut–liver axis","Microbiome evidence","Fibre"],questions:["What is established about the microbiome?","Which steps have stronger evidence?"],explanation:"The microbiome influences metabolism and immunity, and diet shapes it. Specific probiotic benefits depend on strain and condition. Fibre-rich whole foods, food safety and avoiding unnecessary medicines have broader support than commercial cleanses.",safety:"Discuss probiotics with a clinician if immunocompromised or seriously ill.",points:["Evidence is evolving.","Diet is foundational."]},{id:15,title:"A family history of iron overload",scenario:"An adult has a parent with haemochromatosis and asks whether testing is needed.",concepts:["Inherited risk","Iron studies","Family screening"],questions:["What is haemochromatosis?","What should they discuss?"],explanation:"Haemochromatosis can cause progressive iron loading, but inheritance does not guarantee disease. A clinician can assess iron studies and genetics and arrange family screening according to guidance. Early detection allows monitoring and treatment where indicated.",safety:"Do not start iron supplementation without assessment.",points:["Family history is a conversation starter.","Genetic results need expert interpretation."]},{id:16,title:"Family history of liver cancer",scenario:"A person has a relative with chronic hepatitis B and liver cancer and wonders about their own risk.",concepts:["HCC","Surveillance","Hepatitis B"],questions:["Who may need HCC surveillance?","Why is this a clinical decision?"],explanation:"Guidelines recommend surveillance for defined high-risk groups, often using six-monthly ultrasound with or without a blood marker, based on local guidance. Surveillance is not a guarantee, and risk depends on the cause and degree of liver disease.",safety:"Do not arrange repeated scans without clinical guidance.",points:["Surveillance is targeted.","Chronic hepatitis B can cause cancer without cirrhosis."]},{id:17,title:"Itching in pregnancy",scenario:"A pregnant person develops severe itching, especially at night, and asks whether it is harmless.",concepts:["Obstetric cholestasis","Bile acids","Fetal monitoring"],questions:["Why does this need assessment?","What should not be delayed?"],explanation:"Intrahepatic cholestasis of pregnancy causes itching and raised bile acids and requires obstetric assessment and monitoring. Severe itching, jaundice, headache, visual changes or reduced fetal movements should not be managed with home remedies alone.",safety:"Contact obstetric services promptly.",points:["Pregnancy changes liver and bile physiology.","Prompt assessment matters."]},{id:18,title:"Reviewing medicines in older age",scenario:"An 82-year-old takes sleeping tablets, anticoagulants and herbal supplements and is unsure what is safe.",concepts:["Polypharmacy","Frailty","Medicine review"],questions:["Which risks should be reviewed?","Who can help?"],explanation:"Ageing, frailty, kidney function, nutrition and multiple medicines increase risk of adverse effects and interactions. A structured medicine review with a pharmacist and prescriber can adjust doses and eliminate unnecessary products. Symptoms should be taken seriously.",safety:"Do not stop anticoagulants or other prescribed medicines abruptly.",points:["Polypharmacy is not inevitable.","Ask for a review."]},{id:19,title:"Learning about transplantation",scenario:"An adult with advanced cirrhosis asks when transplantation is considered.",concepts:["Transplant assessment","Immunosuppression","Outcomes"],questions:["What does assessment involve?","What is lifelong follow-up?"],explanation:"Transplant assessment considers severity, complications, other conditions and likely benefit. Multidisciplinary teams evaluate candidates and living-donor options. After transplant, immunosuppression and regular monitoring are lifelong. Outcomes vary and should be discussed with the transplant team.",safety:"Transplant decisions cannot be based on internet information alone.",points:["Assessment is holistic.","Immunosuppression needs careful management."]},{id:20,title:"Recognising an emergency",scenario:"A person with known liver disease becomes unusually drowsy, then vomits blood.",concepts:["Encephalopathy","Variceal bleeding","Emergency response"],questions:["What should be done first?","What should not be done?"],explanation:"Drowsiness and vomiting blood are red flags in liver disease. Emergency services should be contacted immediately. Do not wait, do not give food or sedatives, and do not attempt a home remedy. Bring medicine information if safely possible.",safety:"Call local emergency services now. Do not delay for internet advice.",points:["Speed matters.","Emergency numbers vary by country."]}],gg={1:1,42:2,8:3,47:4,48:5,49:6,73:7,74:8,44:9,78:10,58:11,54:12,29:13,35:14,53:15,57:16,77:17,72:18,56:19,6:20};function bg({chapter:m,navigate:d}){const h=Ff(m??1),{progress:c,isOn:u,toggle:N,setNote:j,setFontSize:S}=ii(),[g,y]=G.useState(""),[L,B]=G.useState(!1),E=h?.n??1;if(G.useEffect(()=>{y(c.notes[E]??""),B(!1)},[E]),G.useEffect(()=>{const U=setTimeout(()=>{if(g!==(c.notes[E]??"")){j(E,g),B(!0);const _e=setTimeout(()=>B(!1),2200);return()=>clearTimeout(_e)}},600);return()=>clearTimeout(U)},[g,E]),!h)return a.jsxs("div",{className:"mx-auto max-w-2xl px-4 py-20 text-center",children:[a.jsx("p",{className:"font-display text-2xl text-ink",children:"Chapter not found"}),a.jsx("button",{onClick:()=>d("toc"),className:"mt-4 rounded-lg bg-forest px-4 py-2 text-sm text-cream",children:"Return to contents"})]});const O=Xf(h.n),ie=Le.filter(U=>U.n>=O.range[0]&&U.n<=O.rang he portal vein, hepatic artery and bile ducts."],["What is a portal triad?","A portal vein branch, hepatic artery branch and bile duct travelling together."],["How many functional segments does the Couinaud system describe?","Eight segments, each with its own vascular inflow and biliary drainage."],["Which vessel supplies most of the liver’s blood flow?","The portal vein — about 75% — although it is less oxygenated than arterial blood."],["Which vessel carries oxygen-rich blood to the liver?","The hepatic artery."],["Where do hepatic veins drain?","Into the inferior vena cava, just below the diaphragm."],["What is a hepatic sinusoid?","A fenestrated, low-resistance capillary where blood contacts hepatocytes."],["Which immune cells line the liver sinusoids?","Kupffer cells, resident macrophages that clear particles and release cytokines."],["What are hepatic stellate cells?","Vitamin A–storing cells that can become myofibroblast-like and produce scar tissue after injury."],["What is the gallbladder’s role?","To store and concentrate bile, then contract after meals to release it."],["Where does bile enter the small intestine?","At the ampulla of Vater in the duodenum, through the sphincter of Oddi."],["What is the falciform ligament?","A peritoneal fold on the liver’s surface separating right and left lobes."],["Which vessels carry nutrient-rich blood from the gut?","The portal vein, formed by the superior mesenteric and splenic veins."]]],["Metabolism",[["What is glycogenesis?","Synthesis of glycogen from glucose, promoted by insulin."],["What is glycogenolysis?","Breakdown of glycogen to release glucose into the blood."],["What is gluconeogenesis?","Synthesis of new glucose from lactate, glycerol and certain amino acids."],["Which enzyme controls the rate-limiting step of cholesterol synthesis?","HMG-CoA reductase, the target of statins."],["What is de novo lipogenesis?","Creation of new fat in the liver from carbohydrate-derived precursors."],["What is beta-oxidation?","Breakdown of fatty acids in mitochondria to release energy."],["How does the liver export triglycerides?","It packages them into VLDL particles."],["What is the end product of the urea cycle?","Urea, excreted by the kidneys."],["What is albumin?","A major plasma protein made by the liver that maintains oncotic pressure and carries substances."],["Name four vitamin K–dependent clotting factors.","Factors II, VII, IX and X (prothrombin is factor II)."],["What does ceruloplasmin transport?","Copper; it is made in the liver and measured in Wilson disease assessment."],["What is hepcidin?","A liver hormone that reduces iron absorption and release."],["How does the liver affect vitamin D?","It contributes to the activation pathway of vitamin D through hydroxylation."],["What is the difference between phase I and phase II metabolism?","Phase I modifies molecules, often by oxidation; phase II conjugates them with water-soluble groups."],["What is first-pass metabolism?","Metabolism of a swallowed medicine by gut wall or liver before it reaches systemic circulation."],["What is insulin resistance?","Reduced responsiveness of tissues to insulin, contributing to higher glucose and hepatic fat accumulation."]]],["Bile & digestion",[["What is the main function of bile salts?","Emulsifying fat and forming micelles to aid absorption."],["What is emulsification?","Breaking large fat droplets into smaller ones, increasing surface area for lipase."],["Which hormone stimulates gallbladder contraction?","Cholecystokinin (CCK)."],["Which hormone stimulates bicarbonate-rich secretion?","Secretin."],["Where does the liver make bile?","Hepatocytes secrete it into canaliculi, which drain into bile ducts."],["Does the gallbladder produce bile?","No. It stores and concentrates bile made by the liver."],["What is the enterohepatic circulation?","Recycling of bile acids from the intestine back to the liver via portal blood."],["Where are most bile acids reabsorbed?","In the terminal ileum."],["What is conjugated bilirubin?","Bilirubin made water-soluble in the liver by glucuronidation."],["What causes pale stools?","Reduced bilirubin reaching the gut, often from bile flow obstruction."],["What causes dark urine in jaundice?","Water-soluble conjugated bilirubin entering the blood and being excreted in urine."],["What is cholestasis?","Reduced bile formation or flow, causing bile components to accumulate in blood."],["Which vitamins depend on bile for absorption?","Vitamins A, D, E and K."],["What is steatorrhoea?","Fatty, greasy stools from impaired fat absorption."],["Which duct connects the gallbladder to the biliary tree?","The cystic duct."],["What is the ampulla of Vater?","The junction where the common bile duct and pancreatic duct enter the duodenum."]]],["Conditions",[["What does MASLD stand for?","Metabolic dysfunction–associated steatotic liver disease."],["What replaced the term NASH?","MASH — metabolic dysfunction–associated steatohepatitis."],["How is MASLD defined?","Hepatic steatosis plus at least one specified cardiometabolic criterion."],["What is MASH?","Steatohepatitis in a person with MASLD — fat, inflammation and hepatocyte injury."],["What is the main risk factor for HCC in many countries?","Cirrhosis; chronic hepatitis B can also cause HCC without cirrhosis."],["Which hepatitis viruses are mainly food- and water-borne?","Hepatitis A and hepatitis E."],["Which hepatitis virus requires hepatitis B to replicate?","Hepatitis D."],["Which hepatitis infection is curable with direct-acting antivirals?","Hepatitis C."],["Is there a widely available hepatitis C vaccine?","No. Prevention focuses on blood safety and harm reduction."],["At what infection age is chronic hepatitis B most likely?","Infancy and early childhood, especially perinatal exposure."],["Which autoantibody is strongly associated with PBC?","Antimitochondrial antibody (AMA)."],["What does PSC often co-occur with?","Inflammatory bowel disease, especially ulcerative colitis."],["What organ system does Wilson disease prominently affect besides the liver?","The brain and nervous system, plus eyes and other tissues."],["How is haemochromatosis treated in many cases?","Venesection to remove iron, with monitoring in specialist care."],["What is portal hypertension?","Increased pressure in the portal venous system, often due to cirrhosis."],["What is ascites?","Fluid accumulation in the peritoneal cavity, a common complication of cirrhosis."],["What are varices?","Enlarged collateral veins, often in the oesophagus or stomach, prone to bleeding."],["What causes hepatic encephalopathy?","Severe liver dysfunction and portosystemic shunting affecting brain function."],["What is decompensated cirrhosis?","Cirrhosis with complications such as ascites, bleeding or encephalopathy."],["Which gallstone complication requires urgent care?","Cholangitis — fever, jaundice and abdominal pain suggest infection of obstructed ducts."],["What is acute-on-chronic liver failure?","Rapid deterioration of liver function in someone with existing chronic liver disease."],["Can cirrhosis be cured by a commercial cleanse?","No. No commercial cleanse is proven to reverse cirrhosis."]]],["Tests",[["What does ALT mainly indicate?","Hepatocyte injury; it is relatively liver-specific."],["Which tissue besides liver contains AST?","Muscle, red blood cells and other tissues."],["Which enzymes suggest cholestasis?","ALP and GGT."],["Does a normal ALT exclude all liver disease?","No. Some conditions, including cirrhosis or viral hepatitis, can have normal or near-normal levels."],["What does albumin suggest in liver disease?","Synthetic capacity, though inflammation, nutrition and kidney loss also affect it."],["What is INR used for?","Standardised clotting measurement; it monitors warfarin and can reflect liver synthetic function."],["What does platelet count suggest in cirrhosis?","A falling count may reflect portal hypertension and splenic sequestration."],["What does ultrasound assess in the liver?","Size, fat content, masses, bile duct dilation and fluid."],["What is elastography?","A non-invasive estimate of liver stiffness, used as a proxy for fibrosis."],["What is FIB-4?","A blood-based fibrosis risk score used to guide further assessment."],["When is a liver biopsy useful?","When non-invasive tests are inconclusive or the cause needs clarification."],["What is HCC surveillance?","Regular imaging, usually six-monthly ultrasound, in higher-risk people."],["What is the Child–Pugh score?","A cirrhosis severity score using bilirubin, albumin, INR, ascites and encephalopathy."],["Does one abnormal test diagnose liver disease?","No. Results are interpreted in clinical context, along with trends and other tests."],["What does a positive hepatitis C antibody test require?","RNA testing to determine whether infection is current."],["What is a R value in liver injury assessment?","A ratio of ALT to ALP used to classify the pattern of injury."]]],["Nutrition & lifestyle",[["Which eating pattern has the best evidence for metabolic liver health?","A balanced Mediterranean-style pattern, adapted to access and culture."],["Do you need to eliminate all fat for liver health?","No. Type and overall energy balance matter; unsaturated fats are encouraged in balanced amounts."],["Is protein usually restricted in liver disease?","No. Adequate protein is generally advised; severe restriction can worsen sarcopenia."],["What is sarcopenia?","Loss of muscle mass and strength, common in advanced liver disease."],["Are fruit juices a good sugar replacement?","No, juice has little fibre and delivers sugar rapidly; whole fruit is preferable."],["Does fibre support gut health?","Yes. Diverse fibre sources support bowel function and microbial fermentation."],["Is coffee a proven liver treatment?","No. Observational associations exist, but it is not a treatment."],["Can high-dose vitamin A harm the liver?","Yes. Excessive vitamin A is hepatotoxic."],["What does physical activity do for liver health?","It improves insulin sensitivity and can reduce liver fat even without substantial weight loss."],["Does 'natural' mean safe?","No. Herbal products can cause liver injury, interact with medicines or be contaminated."],["What is harm reduction?","Practical support to reduce drug- or alcohol-related harm without requiring abstinence first."],["Should heavy drinkers stop alcohol abruptly without support?","No. Withdrawal can be dangerous and should be medically planned."],["Is a detox juice cleanse medically necessary?","No. The liver continuously performs biotransformation; no cleanse is required."],["What is an accessible protein source?","Eggs, fish, dairy, tofu, beans or lentils, depending on culture and affordability."],["Why does sleep matter for liver health?","Sleep and circadian regularity influence appetite, glucose metabolism and behaviour."],["What is the safest approach to a new supplement?","Discuss it with a clinician or pharmacist, check the product, and report symptoms promptly."]]]];let jg=0;const Ha=oh.flatMap(([m,d])=>d.map(([h,c])=>({id:++jg,topic:m,front:h,back:c}))),Fm=oh.map(([m])=>m),ch=[{topic:"Anatomy & physiology",items:[["Where is the liver mainly located?",["Left lower abdomen","Right upper abdomen beneath the diaphragm","Behind the sternum","Inside the pelvis"],1,"The liver lies predominantly in the right upper quadrant, beneath the diaphragm."],["Which vessel supplies about three-quarters of liver blood flow?",["Hepatic artery","Portal vein","Hepatic vein","Aorta"],1,"The portal vein delivers most of the liver’s blood volume, although the hepatic artery supplies much of its oxygen."],["In a classic lobule, which direction does bile flow?",["From the central vein toward portal triads","From portal triads toward the central vein","Into the sinusoids","Into hepatic veins"],0,"Blood flows toward the central vein, while bile flows outward to portal ducts."],["Kupffer cells are best described as:",["H
