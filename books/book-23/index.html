ategies for lifelong wellness."}),a.jsxs("svg",{viewBox:"0 0 220 120",className:"mt-4 w-full max-w-[210px]","aria-hidden":"true",children:[a.jsx("path",{d:"M18 58c12-24 57-37 100-28 45 9 72 34 68 53-4 20-31 26-53 20-17-5-24-16-39-19-22-4-45 1-62-7-9-4-17-10-14-19z",fill:"#c9d3ae",opacity:"0.15"}),a.jsx("path",{d:"M18 58c12-24 57-37 100-28 45 9 72 34 68 53-4 20-31 26-53 20-17-5-24-16-39-19-22-4-45 1-62-7-9-4-17-10-14-19z",fill:"none",stroke:"#d8c99b",strokeWidth:"1.1",opacity:"0.8"}),a.jsx("path",{d:"M96 31c-3 18 3 35 16 46M72 42c6 8 9 17 9 27M150 37c-7 12-7 26 0 38",fill:"none",stroke:"#c9d3ae",strokeWidth:"0.9",opacity:"0.7"}),a.jsx("circle",{cx:"133",cy:"68",r:"5",fill:"none",stroke:"#a97525",strokeWidth:"1.2"}),a.jsx("circle",{cx:"35",cy:"34",r:"1.2",fill:"#d8c99b",opacity:"0.7"}),a.jsx("circle",{cx:"186",cy:"48",r:"1",fill:"#d8c99b",opacity:"0.5"}),a.jsx("circle",{cx:"164",cy:"99",r:"1.2",fill:"#d8c99b",opacity:"0.6"})]})]}),a.jsxs("div",{className:"border-t border-[#d6c79f]/20 pt-2.5",children:[a.jsx("p",{className:"font-display text-[12px] italic leading-snug text-[#eee5cf]",children:"Understanding the body’s quiet metabolic centre."}),a.jsxs("div",{className:"mt-2 flex items-center justify-between gap-2",children:[a.jsx("span",{className:"font-sans text-[7.5px] uppercase tracking-[0.16em] text-[#cdd7b9]/70",children:"Learn · Prepare · Thrive"}),a.jsx("span",{className:"shrink-0 font-display text-[10px] text-[#d8c99b]",children:"HERBULANCE"})]})]})]})]})}const Kf=[{n:1,title:"Understanding Liver Health",summary:"The liver is a large, metabolically active organ that coordinates nutrients, substances, immune signals and energy storage. Liver health is about how well that work is supported — not about passing a purity test.",mins:9,visual:{kind:"organs",title:"The liver in context",caption:"The liver sits in the upper right abdomen, beneath the diaphragm and next to the stomach, gallbladder and intestines.",nodes:["Liver","Stomach","Gallbladder","Intestine"]},obj:["Describe the liver’s main roles in plain language","Explain why liver health is relevant to everyone, not only people who drink alcohol","Distinguish educational information from personal medical advice"],secs:[["A quiet, indispensable organ","The liver is the body’s largest internal solid organ, typically around 1.3–1.5 kg (about 3 lb) in adults. It receives roughly a quarter of the heart’s output each minute, mostly through the portal vein and hepatic artery. It is involved in processing food-derived nutrients, making proteins, storing fuel, handling medicines and supporting immune defence."],["More than a filter","Describing the liver as a ‘filter’ undersells it. The liver is a metabolic hub: it stores and releases glucose, builds and breaks down fats and proteins, produces bile for digestion, and makes many circulating proteins including albumin and clotting factors. It also participates in immune surveillance through specialised resident cells."],["What this book can and cannot do","This book explains established science and supports better conversations with clinicians. It cannot tell you whether your liver is healthy, interpret your blood tests, or recommend treatment. Those decisions require clinical assessment that includes your history, examination and results."]],myth:["The liver only matters if you drink alcohol.","Metabolic, immune, infectious, genetic, medication-related and environmental factors all influence liver health. Many people living with liver disease have never consumed alcohol."],recap:"The liver is a central metabolic and immune organ. Education helps you ask better questions, but it does not replace individual medical assessment.",refs:["niddk-liver","who-hepatitis","nih-liver"],books:[7,10,11]},{n:2,title:"The Liver: One Organ, Many Responsibilities",summary:"A guided tour of the liver’s major jobs: nutrient handling, bile production, storage, protein synthesis, and the metabolism of medicines and other substances.",mins:10,visual:{kind:"risk",title:"Responsibilities at a glance",caption:"Hundreds of functions are grouped into a few overlapping roles. They run simultaneously in a single organ.",nodes:["Fuel storage","Bile","Proteins","Substance handling","Immunity"]},obj:["List five broad categories of liver function","Explain why these functions overlap rather than working in sequence","Recognise how impairment in one area can affect others"],secs:[["Nutrition and fuel","After a meal, the liver absorbs glucose and stores some as glycogen, converts some to fat, and packages lipids for transport. Between meals it releases glucose and processes fatty acids for energy. It stores vitamins A, D, B12 and iron within regulated limits, and handles amino acids arriving from the intestine."],["Construction and recycling","The liver produces albumin and many carrier proteins, clotting factors, enzymes and immune proteins. It also breaks down worn-out proteins and converts nitrogen waste into urea, which the kidneys excrete. This balance of building and recycling is central to whole-body stability."],["Handling substances","Enzymes in the liver chemically modify medicines, hormones, alcohol and other compounds so they can be eliminated more easily. Sometimes this creates active or more reactive metabolites. This is why medicine doses, liver disease and interactions need professional review."]],myth:["Every liver job is a separate ‘mode’ you can switch on with a health product.","Liver functions are interwoven, regulated by hormones and demand. No commercial product is required to make them work."],recap:"The liver manages fuel, builds and recycles proteins, produces bile, handles substances and participates in immunity — all at once.",refs:["niddk-liver","nih-liver","nih-otc"],books:[7,10,17]},{n:3,title:"The Liver and Whole-Body Health",summary:"The liver communicates with the gut, heart, kidneys, endocrine system and immune system. Its health is inseparable from broader metabolic and circulatory health.",mins:9,visual:{kind:"organs",title:"Connected systems",caption:"Liver function influences, and is influenced by, digestion, circulation, hormones and immunity.",nodes:["Digestion","Circulation","Hormones","Immunity","Kidneys"]},obj:["Describe the liver’s relationship with the gut and circulation","Explain how liver metabolism affects hormones and blood lipids","Identify overlaps between liver and kidney processes"],secs:[["The gut is the liver’s main supplier","Nutrient-rich blood from the intestines reaches the liver through the portal vein. This allows the liver to process absorbed substances before they reach the rest of the circulation. The gut barrier and the liver therefore work as a linked system, often called the gut–liver axis."],["Circulation and hormones","The liver makes cholesterol and bile acids, participates in lipoprotein handling, and contributes to blood pressure regulation through volume and protein balance. It also processes insulin, cortisol, thyroid hormones and sex hormones, altering their availability and activity."],["Kidneys, fluid and waste","The liver converts ammonia into urea while the kidneys excrete it. In advanced liver disease, changes in pressure and proteins can affect kidney function and fluid balance. These interactions explain why clinicians assess the whole person, not one organ in isolation."]],myth:["You can judge your liver health from your energy level alone.","Fatigue has many causes. Only clinical assessment and appropriate tests can clarify the source of symptoms."],recap:"The liver works within networks of organs and signals. Caring for metabolic, circulatory and digestive health also supports the liver.",refs:["nih-liver","wgo","niddk-cirrhosis"],books:[2,18,22]},{n:4,title:"What Does Healthy Liver Function Mean?",summary:"Normal physiology, liver injury, inflammation, impaired function and advanced disease are related but not identical ideas. Clarity here prevents a common and harmful confusion.",mins:10,visual:{kind:"spectrum",title:"From injury to impairment",caption:"Injury can occur without loss of function; functional impairment may appear late. Diagnosis depends on multiple pieces of information.",nodes:["Injury","Inflammation","Fibrosis","Impaired function"]},obj:["Distinguish liver injury from impaired liver function","Explain what a liver enzyme result does and does not tell you","Describe how chronic injury can lead to fibrosis and advanced disease"],secs:[["Injury is not the same as function","When liver cells are damaged, enzymes such as ALT and AST can leak into the blood. That signals possible injury, not loss of overall function. Conversely, some advanced conditions cause little early enzyme elevation. Normal enzymes reduce concern but cannot exclude every liver disease."],["The liver has reserve","The organ can often maintain essential functions despite substantial injury, which is why early disease may be silent. Over time, repeated or continuous injury can cause scar tissue (fibrosis). When scarring is extensive, liver structure and blood flow change."],["What clinicians assess","Assessment combines history, examination, blood tests, imaging and sometimes a biopsy. Clinicians look at severity, cause, complications and the person’s other conditions. Single numbers are interpreted in context, and results are measured over time."]],myth:["A normal ALT means the liver is completely healthy.","ALT is one indicator. It can be normal in some people with sonographic steatosis, hepatitis B, cirrhosis, or certain genetic conditions. Completeness of assessment depends on risk and context."],recap:"Distinguish injury, inflammation, fibrosis and functional impairment. No single test establishes the whole picture.",refs:["niddk-liver","wgo","nice-nafld"],books:[11,10]},{n:5,title:"Factors That Influence Liver Health",summary:"Liver health reflects a combination of exposures and circumstances — not personal worth. Genetics, infections, diet patterns, alcohol, medicines, metabolic conditions and environment all contribute.",mins:10,visual:{kind:"risk",title:"Multiple influences",caption:"Risk factors interact. A single-factor explanation rarely captures a person’s situation.",nodes:["Genetics","Infections","Metabolic risk","Medicines","Alcohol","Environment"]},obj:["Identify categories of factors that influence liver health","Explain why risk factors should be discussed without blame","Recognise that risk does not equal diagnosis"],secs:[["Metabolic and lifestyle factors","Insulin resistance, excess energy intake over time, low activity and altered body fat distribution can promote fat accumulation in the liver. Sleep and stress influence behaviour and metabolism indirectly. These pathways are common but modifiable, and they are never a moral verdict."],["Infections and immune conditions","Hepatitis B and C viruses are major global causes of chronic liver disease. Autoimmune liver conditions occur when immune responses target liver or bile duct tissue. These are medical conditions, not evidence of lifestyle failure."],["Medicines, supplements and environment","Some medicines, herbal products and industrial chemicals can injure the liver, especially with high doses, interactions, contamination or unsupervised use. Occupational and water-related exposures vary widely by region and population."]],myth:["Liver disease has one obvious cause you can identify at home.","Causes are frequently multiple. A clinician integrates history, tests and risk context to reach a probable explanation."],recap:"Liver health is shaped by interacting factors. Public health and medical care should address causes and barriers without stigma.",refs:["who-hepatitis","niddk-liver","nih-supplements"],books:[11,20]},{n:6,title:"Understanding Common Liver Symptoms",summary:"Fatigue, itching, discomfort and jaundice are possible signals, but none is specific. Early liver disease may produce no symptoms at all.",mins:11,visual:{kind:"anatomy",title:"Where symptoms may appear",caption:"Symptoms are not distributed only over the liver. Systemic effects such as fatigue and itching can occur anywhere.",nodes:["Upper-right discomfort","Jaundice","Itching","Swelling"]},obj:["Explain why liver disease may be silent early","List symptoms that could relate to liver problems","Distinguish symptoms needing urgent assessment from routine review"],secs:[["Often silent","The liver has large functional reserve and no pain fibres within its substance. Many people with early steatotic liver disease, chronic viral hepatitis or compensated cirrhosis feel well. Symptoms usually reflect advanced disease, complications or another condition entirely."],["Possible but nonspecific signals","Fatigue, reduced appetite, nausea, tender enlargement of the liver, dark urine, pale stools, itching and jaundice can occur. Each has several causes. Jaundice in particular should prompt prompt medical assessment because it reflects bilirubin processing or drainage problems."],["Urgent warning signs","Vomiting blood, black tarry stools, confusion or unusual drowsiness in someone with liver disease, rapidly increasing abdominal swelling, severe abdominal pain with fever, collapse, or suspected poisoning require urgent local emergency care. Do not wait to see whether symptoms settle."]],safety:"For vomiting blood, confusion, collapse, severe illness or suspected poisoning, contact local emergency services or the appropriate poison information service immediately. Do not use this book to self-triage.",urgent:!0,recap:"No symptom is a diagnosis. Early liver disease may be silent, and certain warning signs require immediate emergency assessment.",refs:["nhs-liver","niddk-cirrhosis","wgo"],books:[2,15]},{n:7,title:"Liver Health Across Different Life Stages",summary:"The liver grows, adapts and changes with age. Pregnancy and ageing create specific metabolic and clinical considerations.",mins:9,visual:{kind:"timeline",title:"A life course view",caption:"Liver-related needs evolve. Prevention begins in childhood and continues through pregnancy and older adult life.",nodes:["Childhood","Adolescence","Adulthood","Pregnancy","Older age"]},obj:["Describe major liver-related differences across life stages","Identify preventive opportunities at each stage","Explain why medicines require special review in pregnancy and older age"],secs:[["Growth and development","In newborn babies, immature enzymes can cause transient jaundice, which is commonly monitored. Inherited metabolic disorders may present early. Universal hepatitis B vaccination at birth is recommended in many countries and is highly effective at preventing chronic infection."],["Reproductive years and pregnancy","Hormonal changes affect the liver and biliary system. Pregnancy can trigger specific conditions such as intrahepatic cholestasis of pregnancy, pre-eclampsia with liver involvement, or — rarely — acute fatty liver of pregnancy. These require obstetric and medical assessment, not self-management."],["Ageing and medicines","Older adults have a higher likelihood of taking multiple medicines, which increases interaction and adverse-effect risk. Liver blood flow and size decline modestly with age. General function is often preserved, but acute illness can decompensate a previously stable liver."]],myth:["Liver disease only appears late in life.","Viral hepatitis, genetic disorders, autoimmune disease and paediatric liver conditions can affect infants, children and young adults."],recap:"Life-stage context matters. Prevention, medicine review and early clinical assessment should be tailored to age and circumstances.",refs:["who-hbv","niddk-liver","nih-otc"],books:[10,15,17]},{n:8,title:"Liver Health Myths and Misinformation",summary:"Commercial ‘detoxes’ do not replace the liver’s biochemistry, and ‘cleansing’ claims often obscure risk. This chapter builds a practical filter for misleading health information.",mins:11,visual:{kind:"compare",title:"Evidence versus advertising",caption:"Advertising language emphasises quick transformation. Evidence emphasises cause-specific care and sustainable behaviour.",nodes:["Claims","Evidence","Safety"]},obj:["Explain why commercial liver detox programs are not medically necessary","Identify red flags in liver-related marketing","Describe a safer approach to evaluating supplements"],secs:[["The liver is not a clogged pipe","The liver continuously performs chemical transformations using enzymes, energy and cofactors. It does not accumulate a visible sludge that a juice, tea or enema can flush. There is no established clinical treatment called ‘liver detoxification’ that regenerates or cleanses the liver."],["When claims become risky","Detox products can contain unlisted herbs, laxatives or high-dose vitamins. Some cause drug interactions, electrolyte disturbance or liver injury. Delaying evidence-based care is also a harm. Cutting out entire food groups or using extreme fasting can worsen nutrition."],["A useful information filter","Ask: who is making the claim, what evidence supports it, is the outcome an authenticated medical endpoint, and what is the risk? Be cautious with testimonials, before-and-after photographs, urgency tactics and promises that one product treats many unrelated conditions."]],myth:["Feeling tired proves your liver is full of toxins.","Fatigue is nonspecific and has many possible causes. Blood tests and clinical assessment — not detox products — are the reasonable next step if concern persists."],safety:"Some herbal and dietary supplements are associated with liver injury. Tell your clinician about every supplement, including teas and powders. Seek urgent care for signs such as jaundice, dark urine, severe abdominal pain or vomiting.",recap:"The liver detoxifies by design. Commercial detox programs are not required, and some products can harm. Evaluate claims by evidence and risk.",refs:["nih-supplements","niddk-liver","nih-otc"],books:[7,10]},{n:9,title:"Location and External Anatomy of the Liver",summary:"The liver occupies much of the upper right abdomen, tucked under the diaphragm. Its relationships with surrounding organs explain what clinicians feel and image.",mins:9,visual:{kind:"anatomy",title:"Surface anatomy",caption:"The liver lies mainly in the right upper quadrant, spanning the upper abdomen and protected by the lower ribs.",nodes:["Right upper quadrant","Diaphragm","Ribs","Stomach"]},obj:["Describe the liver’s anatomical position","Relate the liver to the diaphragm, stomach and gallbladder","Explain why physical examination is not diagnostic"],secs:[["Position and shape","The liver lies beneath the diaphragm, predominantly on the right. It has a smooth diaphragmatic surface and a visceral surface moulded by adjacent organs. In adults it is roughly 1.3–1.5 kg, or about 2.5% of body weight; proportions differ in infancy."],["Surrounding structures","The gallbladder sits in a fossa on the liver’s inferior surface. The porta hepatis is the gateway for the portal vein and hepatic artery, and the exit for bile ducts. The stomach, duodenum, right kidney and colon lie close by, which is why symptoms can overlap."],["Why examination is limited","A clinician may assess liver size, tenderness or evidence of fluid by examination, but findings are imprecise. Imaging is used when enlargement, lesions or structural disease needs clarification. The liver is not visible or palpable in most healthy adults except perhaps a small edge below the ribs."]],recap:"Accurate anatomy explains physical findings, surgical approaches and the way liver disease can affect neighbouring organs.",refs:["niddk-liver","wgo"],books:[11]},{n:10,title:"Liver Lobes and Structural Organization",summary:"Surface anatomy describes lobes; modern clinical anatomy describes functional segments supplied by specific vessels and drained by specific ducts.",mins:9,visual:{kind:"anatomy",title:"Four surface lobes",caption:"The right and left lobes are the main divisions. The smaller caudate and quadrate lobes are described in relation to surface landmarks.",nodes:["Right lobe","Left lobe","Caudate","Quadrate"]},obj:["Name the main liver lobes and their landmarks","Explain the difference between surface and functional anatomy","Recognise why segmental anatomy matters in surgery"],secs:[["Surface lobes","The liver is divided by the falciform ligament into a large right lobe and a smaller left lobe. On the visceral surface, the caudate lobe lies posterior and the quadrate lobe lies anterior, adjacent to the gallbladder fossa. These terms are traditional anatomical descriptions."],["Functional segments","Surgeons and radiologists often use the Couinaud system of eight segments. Each segment has its own portal venous inflow, arterial supply and biliary drainage. This functional organisation makes it possible to remove a diseased segment while preserving maximal healthy tissue."],["Why it matters","Tumour resections, living-donor transplantation and radiological interventions depend on precise segmental understanding. The left and right hemilivers are functionally distinct even though some boundaries are not obvious on the surface."]],recap:"Know both the surface lobes and the functional segments. The latter guide safe liver surgery and imaging interpretation.",refs:["nih-liver","niddk-liver"],books:[10]},{n:11,title:"Hepatic Lobules",summary:"The lobule is a teaching model of liver microstructure. Blood perfuses plates of hepatocytes from the portal periphery toward the central vein.",mins:10,visual:{kind:"lobule",title:"Inside a lobule",caption:"Portal triads sit at the corners. Sinusoids carry mixed blood past hepatocytes toward a central vein.",nodes:["Portal triad","Hepatocytes","Sinusoid","Central vein"]},obj:["Describe the arrangement of hepatocytes around sinusoids","Trace blood and bile flow within a lobule","Explain the metabolic zones that emerge across the sinusoid"],secs:[["A repeating unit","The classic hexagonal lobule has portal triads at its corners — each containing a portal vein branch, hepatic artery branch and bile duct. Plates of hepatocytes radiate toward a central vein. Blood flows from the portal periphery through sinusoids to the centre."],["Bile travels the other way","Bile drains through canaliculi between hepatocytes toward the portal periphery, away from the central vein. This opposing direction is a common exam point and a useful reminder that blood and bile are separate transport systems."],["Acinar zoning","The acinus model divides the tissue into zones based on blood oxygen and nutrient gradients. Zone 1 near the portal tract is oxygen-rich and favours oxidative metabolism. Zone 3 near the central vein is the commonest site of some toxic injuries because oxygen tension is lower."]],myth:["Blood and bile flow in the same direction through a lobule.","They travel in opposite directions. Sinusoidal blood flows centripetally, while bile flows centrifugally to portal ducts."],recap:"The lobule’s architecture creates distinct metabolic zones and separates blood flow from bile flow.",refs:["nih-liver","wgo"],books:[2]},{n:12,title:"Hepatocytes: The Main Functional Cells",summary:"Hepatocytes are polygonal epithelial cells that carry out most liver biosynthetic, metabolic and biotransformation functions. Their cell biology explains both capacity and vulnerability.",mins:11,visual:{kind:"cells",title:"Hepatocyte functions",caption:"A single hepatocyte can store glycogen, synthesise proteins, detoxify substances and secrete bile components.",nodes:["Glycogen","Albumin","Enzymes","Bile"]},obj:["Describe key structural features of hepatocytes","List their main biosynthetic and metabolic tasks","Explain why hepatocyte injury can cause cytolytic enzyme elevation"],secs:[["Structure supports output","Hepatocytes are large, often binucleate cells arranged in cords. Abundant smooth and rough endoplasmic reticulum supports lipid handling and protein synthesis, while plentiful mitochondria provide energy. Peroxisomes handle very-long-chain fatty acids and detoxify certain compounds."],["Metabolic factories","Hepatocytes store and mobilise glycogen, perform gluconeogenesis, synthesise plasma proteins, convert ammonia to urea, produce bile acids and conjugate bilirubin. They also express transporters that move molecules into and out of blood and bile."],["Injury and transport","When hepatocytes are damaged, intracellular enzymes such as ALT enter the circulation. Cholestasis, by contrast, particularly affects bile transporters and may show a different pattern with ALP and GGT. Understanding the mechanism helps you interpret the pattern."]],recap:"Hepatocytes are the workhorses of the liver. Their orientation explains what leaks into blood and what happens in cholestasis.",refs:["nih-liver","wgo"],books:[10,21]},{n:13,title:"Sinusoids and Liver Blood Flow",summary:"Hepatic sinusoids are specialised capillaries that allow close contact between blood and hepatocytes, supported by non-parenchymal cells.",mins:10,visual:{kind:"lobule",title:"Sinusoid exchange",caption:"Fenestrated endothelial cells allow plasma to contact hepatocytes. Kupffer cells patrol the sinusoidal lumen.",nodes:["Fenestrations","Kupffer cell","Stellate cell","Hepatocyte"]},obj:["Describe the structure of hepatic sinusoids","Name the non-parenchymal liver cells and their roles","Explain how fibrosis impairs exchange"],secs:[["A unique capillary bed","Sinusoids have fenestrated endothelial cells without a conventional basement membrane. This allows rapid exchange of fluids, nutrients and proteins with hepatocytes. Blood flow is slow relative to other capillary beds, increasing contact time."],["Resident cell partners","Kupffer cells monitor the bloodstream, hepatic stellate cells store vitamin A and regulate extracellular matrix, and lymphatic cells such as NK cells support immune surveillance. Endothelial cells also participate in inflammation and injury responses."],["When architecture changes","Chronic injury can activate stellate cells into myofibroblasts and increase collagen deposition. The sinusoids may progressively narrow or ‘capillarise’. Distorted exchange impairs synthetic and clearance functions and raises pressure in the portal circulation."]],recap:"Sinusoids are exchange vessels lined by specialised cells. Scarring disrupts this interface and contributes to portal hypertension.",refs:["nih-liver","niddk-cirrhosis"],books:[20]},{n:14,title:"The Hepatic Portal Vein",summary:"The portal vein delivers nutrient-rich, partly deoxygenated blood from the digestive tract and spleen to the liver — a defining feature of hepatic circulation.",mins:10,visual:{kind:"pathway",title:"Portal circulation",caption:"Blood from the intestines, stomach and spleen passes through the liver before entering the systemic circulation.",nodes:["Intestine","Portal vein","Sinusoids","Hepatic veins"]},obj:["Trace the origin and destination of portal venous blood","Explain the advantage of first-pass liver processing","Recognise the clinical significance of portal hypertension"],secs:[["Where it begins","The portal vein is formed by the superior mesenteric and splenic veins behind the head of the pancreas. It carries roughly three-quarters of hepatic blood flow, rich in nutrients, hormones, microbial products and some drugs absorbed from the gut."],["Why the liver comes first","The intestinal-to-liver route allows the liver to process absorbed substances before they reach the general circulation. This is known as first-pass metabolism and explains why some oral medicines have low bioavailability or require careful dose selection."],["When pressure rises","Portal hypertension is usually caused by resistance to portal flow in a diseased liver, but can be caused by pre-hepatic or post-hepatic conditions. It can lead to varices, ascites and portosystemic shunting. These are serious complications requiring specialist care."]],recap:"Portal blood connects gut and liver, giving the liver first access to absorbed nutrients and substances.",refs:["nih-liver","niddk-cirrhosis"],books:[2,18]},{n:15,title:"The Hepatic Artery and Hepatic Veins",summary:"The hepatic artery supplies oxygen-rich blood, while hepatic veins drain the liver into the inferior vena cava. Together with the portal vein, they form the liver’s dual circulation.",mins:9,visual:{kind:"pathway",title:"Inflow and outflow",caption:"Portal vein and hepatic artery carry blood in; hepatic veins drain it out — a complete circuit.",nodes:["Portal vein","Hepatic artery","Capillary bed","Hepatic vein","IVC"]},obj:["Compare portal venous and hepatic arterial supply","Describe hepatic venous drainage","Explain basic clinical relevance of arterial and venous imaging"],secs:[["Two inlets","The common hepatic artery arises from the coeliac trunk and supplies about 25% of liver blood flow but a large share of oxygen. It divides into right and left branches. The portal vein supplies the majority of flow but is less oxygenated."],["One outlet","Hepatic veins drain into the inferior vena cava just below the diaphragm. Right, middle and left hepatic veins are usual, though anatomy varies. In Budd–Chiari syndrome, hepatic venous outflow is obstructed, causing congestion and liver injury."],["Why anatomy matters","Variations in arterial anatomy are common and are identified before liver surgery or transplantation. Imaging of inflow and outflow is also essential when assessing vascular liver conditions."]],recap:"Hepatic arterial inflow keeps the organ oxygenated; portal inflow brings nutrients; hepatic veins drain to the systemic circulation.",refs:["nih-liver","wgo"],books:[18]},{n:16,title:"Kupffer Cells and Liver Immune Defence",summary:"Kupffer cells are liver-resident macrophages that clear particles, respond to gut-derived signals and coordinate inflammation and repair.",mins:10,visual:{kind:"cells",title:"Kupffer cells at work",caption:"These macrophages sit within the sinusoid lumen, sampling blood and responding to microbial and inflammatory signals.",nodes:["Microbes","Kupffer cell","Cytokines","Hepatocyte"]},obj:["Describe the location and basic functions of Kupffer cells","Explain their role in clearing portal-derived material","Recognise how chronic immune activation can promote injury"],secs:[["Patrolling the portal flood","Kupffer cells arise largely from yolk-sac precursors and self-renew locally. Positioned in the sinusoids near portal inflow, they encounter bacteria, endotoxin, damaged cells and debris. Phagocytosis helps prevent systemic spread of gut-derived material."],["Immune signalling matters","Kupffer cells release cytokines and reactive oxygen species. In controlled amounts this is protective; when exaggerated or prolonged, it can damage hepatocytes and promote inflammation. Their balance of pro- and anti-inflammatory signals shapes injury and repair."],["A broader immune network","The liver is enriched in innate and adaptive immune cells, including natural killer cells and T lymphocytes. This partly explains the liver’s tolerance for harmless food proteins and microbial products, and its capacity to respond to pathogens."]],recap:"Kupffer cells defend the liver and the body, but excessive activation can contribute to tissue injury.",refs:["nih-liver","wgo"],books:[20,2]},{n:17,title:"The Biliary System",summary:"Bile flows from canaliculi to ductules, then to larger ducts that converge at the porta hepatis and eventually into the intestine.",mins:10,visual:{kind:"pathway",title:"The biliary tree",caption:"Bile is secreted by hepatocytes, modified in ducts, stored or released by the gallbladder, and delivered to the duodenum.",nodes:["Canaliculi","Ductules","Hepatic ducts","Common bile duct","Duodenum"]},obj:["Trace the biliary pathway","Explain the difference between bile production and bile flow","Relate biliary obstruction to clinical features"],secs:[["From cell to duct","Hepatocytes secrete bile into canaliculi, tiny channels formed by adjacent cell membranes. These drain into ductules and interlobular ducts. Bile duct cells (cholangiocytes) modify the fluid by adding bicarbonate and water in response to signals, including secretin."],["Convergence and sphincters","Right and left hepatic ducts join to form the common hepatic duct. After the cystic duct from the gallbladder joins, the common bile duct enters the duodenum at the ampulla of Vater, surrounded by the sphincter of Oddi. Flow is coordinated with meals."],["When drainage fails","Obstruction can cause jaundice, pale stools, dark urine, itching and sometimes pain or fever. Common causes include gallstones, strictures and tumours. Clinical assessment needs imaging and sometimes endoscopic intervention."]],safety:"Jaundice with fever, severe abdominal pain or confusion may suggest infection of the bile ducts and requires urgent medical assessment.",recap:"The biliary tree is a drainage system distinct from blood vessels. Obstruction is a structural problem, not a ‘sluggish liver’.",refs:["niddk-gallstones","wgo","nhs-liver"],books:[2]},{n:18,title:"The Gallbladder and Its Relationship with the Liver",summary:"The gallbladder concentrates and stores bile between meals. It is not a filter, and removing it does not remove the liver’s ability to digest food.",mins:9,visual:{kind:"organs",title:"Storage, not production",caption:"The liver produces bile continuously. The gallbladder stores it and releases it when fat enters the small intestine.",nodes:["Liver","Gallbladder","Bile duct","Duodenum"]},obj:["Distinguish bile production from bile storage","Describe gallbladder contraction after a meal","Explain what changes after cholecystectomy"],secs:[["A concentrating reservoir","Bile is produced continuously by the liver, but most is stored in the gallbladder between meals. The gallbladder absorbs water and electrolytes, concentrating bile by several-fold and increasing the relative proportion of bile salts and cholesterol."],["Meal-triggered release","Fatty food in the duodenum stimulates cholecystokinin (CCK) release. CCK causes gallbladder contraction and sphincter relaxation, delivering bile into the intestine. The liver also contributes bile directly, and the enterohepatic circulation recycles bile salts efficiently."],["Life without a gallbladder","After cholecystectomy, bile flows continuously into the intestine. Most people adapt well. Some notice looser stools or altered fat tolerance, especially after large fatty meals. Persistent symptoms should be medically assessed rather than assumed."]],myth:["The gallbladder makes bile.","It stores and concentrates bile. The liver produces it."],recap:"Liver makes bile; gallbladder stores and concentrates it. Bile release is coordinated with digestion.",refs:["niddk-gallstones","wgo"],books:[2,7]},{n:19,title:"Blood Supply and the Dual Circulation of the Liver",summary:"The liver has a unique, low-resistance dual supply and a large blood volume. Pressure and flow relationships shape both normal physiology and disease complications.",mins:9,visual:{kind:"compare",title:"Two inflow systems",caption:"Portal and arterial inflow differ in volume, oxygen content and pressure but converge in sinusoids.",nodes:["Portal vein · ~75% flow","Hepatic artery · oxygen-rich","Sinusoid mixing","Hepatic veins"]},obj:["Compare portal and arterial contributions","Explain the hepatic arterial buffer response","Describe how cirrhosis changes hepatic blood pressure"],secs:[["A distinctive arrangement","The liver receives about 25% of cardiac output through both inflow systems. Portal venous blood is low in oxygen but rich in nutrients; arterial blood is oxygen-rich. They mix in sinusoids, allowing hepatocytes to extract oxygen and process absorbed substances."],["Autoregulation, partially","When portal flow falls, hepatic arterial flow can rise — the hepatic arterial buffer response. This helps preserve oxygen delivery. Portal flow also depends on splanchnic vasoconstriction and cardiac output, which explains why systemic illness can affect the liver."],["Cirrhosis and resistance","Fibrous tissue and regenerative nodules increase intrahepatic resistance. Portal pressure rises, and compensatory splanchnic dilation worsens the picture. Varices, ascites and encephalopathy are consequences of these haemodynamic changes. Management is complex and specialist-led."]],recap:"The liver’s dual supply is essential to its function. In cirrhosis, structural resistance causes serious circulatory complications.",refs:["nih-liver","niddk-cirrhosis","easl-cirrhosis"],books:[18]},{n:20,title:"Liver Regeneration and Repair",summary:"The liver has remarkable regenerative capacity, but it is not unlimited and does not erase all injury. Surgery, toxins and chronic disease reveal its boundaries.",mins:11,visual:{kind:"spectrum",title:"Repair versus progression",caption:"Acute injury may resolve with regeneration. Chronic injury can drive fibrosis, which impairs function despite continued cellular turnover.",nodes:["Injury","Proliferation","Scarring","Architectural change"]},obj:["Explain what liver regeneration does and does not mean","Describe the role of hepatocyte proliferation and progenitor cells","Identify why chronic injury can overwhelm repair"],secs:[["Regrowth after resection","After partial hepatectomy, remaining hepatocytes can re-enter the cell cycle and restore much of the liver mass within weeks. This is true regeneration of tissue volume and function, not regrowth of a missing lobe in its original shape. Living-donor transplantation relies partly on this capacity."],["Repair is not regeneration of everything","Regeneration helps restore function after acute injury such as an overdose or short illness. However, repeated or continuous injury drives inflammation, stellate cell activation and collagen deposition. Advanced fibrosis and cirrhosis are not simply reversed by rest or a commercial product."],["Supporting recovery","Clinical care focuses on removing the cause where possible, preventing further injury, maintaining nutrition and managing complications. In severe cases, transplantation may be the only definitive option. Regeneration research is active but should not be marketed as a guaranteed cure."]],myth:["The liver can completely regrow and any damage is reversible.","Regenerative capacity is substantial but limited. Advanced scarring can persist, and some causes of injury cause ongoing damage."],recap:"The liver has genuine regenerative ability after acute injury, but chronic injury can cause irreversible structural disease. No supplement is proven to regenerate a damaged liver.",refs:["nih-liver","niddk-cirrhosis","easl-cirrhosis"],books:[15,20]},{n:21,title:"Carbohydrate Metabolism",summary:"The liver buffers blood glucose by storing, releasing and creating carbohydrate fuel. This rhythmic handling is tightly regulated by insulin and glucagon.",mins:10,visual:{kind:"cycle",title:"Glucose buffering",caption:"Glycogen synthesis and breakdown are balanced with gluconeogenesis to keep circulating glucose stable between meals.",nodes:["Glucose","Glycogen","Gluconeogenesis","Systemic use"]},obj:["Define glycogenesis, glycogenolysis and gluconeogenesis","Explain the roles of insulin and glucagon in the liver","Relate impaired liver glucose handling to systemic metabolic health"],secs:[["Storage: glycogenesis","After a carbohydrate-containing meal, blood glucose rises and insulin promotes glucose uptake in the liver. Here, glucokinase phosphorylates glucose and hexose-6-phosphate is polymerised into glycogen for storage. The liver can hold tens of grams of glycogen in a typical adult, varying widely with diet and training."],["Release: glycogenolysis","When blood glucose falls between meals, glucagon signals the liver to break down glycogen and release glucose into the circulation. This helps maintain brain and tissue fuel supply. Muscle glycogen, in contrast, is used locally and not directly released as blood glucose."],["Creation: gluconeogenesis","After longer fasting or during prolonged exercise, the liver creates glucose from lactate, glycerol and certain amino acids. Although commonly simplified as ‘making sugar from scratch’, it uses energy and carbon skeletons to meet systemic demand. This is a normal physiological process, not a purification step."]],myth:["Eating carbohydrates always overloads the liver.","Whole-food carbohydrate sources are part of normal metabolism. Health effects depend on overall diet, energy balance, fibre, activity and individual conditions."],recap:"The liver stores and releases glucose and generates it when needed. Its glucose handling is central to metabolic stability.",refs:["nih-liver","wgo","aasld-masld"],books:[7,11]},{n:22,title:"Blood Glucose Regulation",summary:"Hepatic glucose production and insulin sensitivity are linked. When the liver becomes insulin-resistant, glucose metabolism changes in ways that can promote steatosis.",mins:10,visual:{kind:"pathway",title:"Regulating blood glucose",caption:"Insulin restrains hepatic glucose output; glucagon promotes it. Other hormones and the nervous system also contribute.",nodes:["Pancreas","Insulin / glucagon","Liver","Blood glucose"]},obj:["Describe the liver’s response to insulin and glucagon","Explain how insulin resistance affects hepatic fat","Recognise the diagnostic limits of glucose testing"],secs:[["A feedback loop","Pancreatic hormones act on the liver. Insulin promotes glycogen synthesis and lipid synthesis and suppresses glucose production. Glucagon increases glycogen breakdown and gluconeogenesis. Cortisol and growth hormone also influence fuel use, which is one reason illness and stress can alter glucose control."],["Insulin resistance","When tissues respond poorly to insulin, the pancreas compensates. The liver continues producing glucose despite high insulin levels, while free fatty acids increase. Extra fatty acid delivery plus increased de novo lipogenesis can lead to intrahepatic triglyceride accumulation, the substrate for steatotic liver disease."],["Testing context","Fasting glucose, HbA1c and oral glucose tolerance tests assess different things. One borderline reading does not confirm a diagnosis. For people with diabetes, liver health assessment should be integrated into their broader care, and medication choices reviewed."]],recap:"The liver is a central controller of blood glucose. Insulin resistance can shift it toward fat storage and increased glucose output.",refs:["aasld-masld","easl-masld","nih-liver"],books:[11,17]},{n:23,title:"Protein Metabolism",summary:"The liver builds circulating and intracellular proteins, processes amino acids, and coordinates nitrogen disposal. Protein turnover is continuous and energy-expensive.",mins:10,visual:{kind:"cells",title:"Protein synthesis",caption:"Hepatocytes assemble albumin, carrier proteins, clotting factors and enzymes from amino acids.",nodes:["Amino acids","Ribosomes","Secreted proteins","Nitrogen waste"]},obj:["Describe how the liver uses amino acids","List important proteins made by the liver","Explain why protein intake should not be automatically restricted in liver disease"],secs:[["Building circulating proteins","Hepatocytes synthesise albumin, transferrin, ceruloplasmin, haptoglobin, hormone-binding globulins, clotting factors and acute-phase proteins. These proteins depend on adequate transcription, amino acid supply and energy. Chronic inflammation can suppress albumin synthesis even when protein intake is adequate."],["Handling amino acids","Amino acids absorbed from the gut enter the portal circulation. The liver uses some, releases others to peripheral tissues, and removes excess nitrogen. This balance is part of whole-body protein turnover, which is faster in growing children and during healing."],["Avoiding oversimplification","‘Liver diets’ sometimes encourage severe protein restriction. In some situations with advanced disease, protein needs may actually be higher, while specific management may be needed for encephalopathy. Anyone with liver disease should receive individualised nutrition advice from a qualified professional."]],safety:"Do not restrict protein or use protein supplements to “treat” liver disease without advice. People with cirrhosis or kidney disease may need individual clinical nutrition assessment.",recap:"The liver builds many circulating proteins and handles nitrogen. Protein restriction is not a universal liver treatment.",refs:["niddk-cirrhosis","easl-cirrhosis","nih-liver"],books:[7,10,22]},{n:24,title:"The Urea Cycle",summary:"Ammonia is toxic in excess. The liver converts ammonia into urea — a water-soluble molecule the kidneys can excrete.",mins:11,visual:{kind:"cycle",title:"The urea cycle",caption:"Nitrogen from amino acid breakdown is channelled into urea through a coordinated enzymatic cycle, largely in the liver.",nodes:["Ammonia","Carbamoyl phosphate","Citrulline","Arginine","Urea"]},obj:["Explain why ammonia must be handled","List the general purpose of the urea cycle","Relate impaired hepatic clearance to encephalopathy"],secs:[["Ammonia is not just a waste product","Gut bacteria and amino acid breakdown produce ammonia. While small amounts are used in synthesis, excess ammonia is toxic. The liver removes most ammonia and converts nitrogen into urea, which is less toxic and efficiently excreted by the kidneys."],["A coordinated cycle","The urea cycle uses carbamoyl phosphate and aspartate to donate nitrogen, generating citrulline, argininosuccinate, arginine and finally urea. Mitochondrial and cytosolic enzymes cooperate, requiring energy and specific transporters. Inherited enzyme deficiencies can cause hyperammonaemia."],["Clinical relevance","In advanced liver disease, ammonia clearance and portosystemic shunting can raise blood ammonia. Encephalopathy is a clinical diagnosis; ammonia is a supportive marker, not a stand-alone diagnostic test. Management includes addressing precipitants and is led by clinicians."]],myth:["A higher blood ammonia always confirms encephalopathy.","Encephalopathy is diagnosed clinically. Ammonia can support assessment but does not reliably confirm or exclude it in every person."],recap:"The liver converts ammonia to urea. When clearance fails, clinical encephalopathy can develop and requires medical management.",refs:["nih-liver","niddk-cirrhosis","easl-cirrhosis"],books:[22]},{n:25,title:"Fat and Lipid Metabolism",summary:"The liver takes up fatty acids, packages lipids, shifts them between storage and oxidation, and exports them as lipoproteins. Imbalance produces hepatic steatosis.",mins:11,visual:{kind:"pathway",title:"Hepatic lipid traffic",caption:"Fatty acids enter, are oxidised or esterified, and triglycerides are packaged into VLDL for export.",nodes:["Fatty acids","Triglycerides","VLDL export","Beta-oxidation"]},obj:["Explain fatty acid uptake, oxidation and esterification","Describe how triglycerides are exported from the liver","Describe the multiple pathways that can lead to steatosis"],secs:[["Traffic across the hepatocyte","The liver takes up free fatty acids from plasma, derived from adipose tissue and dietary fat. Fatty acids can be oxidised in mitochondria for energy, incorporated into cell membranes, or converted to triglycerides. Triglycerides can be stored in lipid droplets or packaged into VLDL for export."],["Why fat accumulates","Hepatic fat rises when uptake and synthesis exceed oxidation and export. Insulin resistance increases peripheral lipolysis and hepatic de novo lipogenesis. There is no single culprit food, and the liver is not ‘weak’ for storing fat; accumulation reflects systemic metabolic pressures."],["Steatosis and beyond","Simple steatosis is common and may be stable. In some people, lipotoxicity, inflammation and endoplasmic reticulum stress drive cell injury, called steatohepatitis. This distinction is why liver health assessment looks at enzymes, metabolic risk and imaging, not fat content alone."]],recap:"Hepatic lipid balance depends on input, oxidation, storage and export. Imbalance can lead to steatosis, and in some people, inflammation.",refs:["aasld-masld","easl-masld","niddk-masld"],books:[7,11,18]},{n:26,title:"Cholesterol Production and Regulation",summary:"The liver synthesises most endogenous cholesterol and regulates it through HMG-CoA reductase, LDL receptors and bile acid pathways.",mins:10,visual:{kind:"pathway",title:"Cholesterol pathways",caption:"Cholesterol is used for membranes, steroid hormones and bile acids, and is removed from circulation through hepatic receptors.",nodes:["HMG-CoA","Cholesterol","Bile acids","LDL uptake"]},obj:["Explain that cholesterol is essential and regulated","Describe how hepatic LDL receptors affect circulating LDL","Distinguish dietary cholesterol from blood cholesterol regulation"],secs:[["Many roles, tight control","Cholesterol is needed for cell membranes, steroid hormones, vitamin D and bile acids. The liver synthesises a large share, with synthesis controlled by HMG-CoA reductase. When cholesterol supply rises, hepatic synthesis typically falls, and bile acid production and excretion increase."],["Receptor-mediated clearance","Hepatic LDL receptors remove LDL particles from the blood. Receptor number and activity affect plasma LDL cholesterol. Statins work partly by increasing hepatic LDL receptor expression. Some inherited conditions cause markedly elevated LDL because receptors are absent or dysfunctional."],["Bile acids as a route out","Cholesterol is converted into bile acids, secreted in bile and largely reabsorbed. Bile acid sequestrants reduce reabsorption, prompting increased use of cholesterol for bile acid synthesis. These mechanisms illustrate the liver’s central role in lipid balance."]],myth:["Dietary cholesterol alone determines blood cholesterol.","Blood lipids result from synthesis, intake, absorption, receptor activity, genetics and overall diet. Dietary pattern and clinical context guide management."],recap:"The liver is central to cholesterol balance. Its receptors and bile acid pathways are targets of clinically used lipid therapies.",refs:["nih-liver","niddk-masld","wgo"],books:[18]},{n:27,title:"Lipoproteins and Liver Function",summary:"Lipoproteins transport lipids between liver, intestine and tissues. Their assembly and clearance illustrate the liver’s integration of fat and cardiovascular health.",mins:9,visual:{kind:"pathway",title:"Lipoprotein traffic",caption:"Chylomicrons, VLDL, LDL and HDL shuttle lipids. The liver is a major production and clearance site.",nodes:["Chylomicrons","VLDL","LDL","HDL","Hepatic receptors"]},obj:["Name the main lipoprotein classes and their functions","Describe the liver’s role in VLDL assembly and LDL clearance","Explain why lipid profiles need clinical interpretation"],secs:[["Packaging fats","In the intestine, chylomicrons transport exogenous fat via lymph and blood to tissues. The liver packages triglycerides and cholesterol into VLDL. Lipoprotein lipase in tissues releases triglycerides, converting VLDL to VLDL remnants and then LDL. HDL participates in reverse cholesterol transport and other protective functions."],["The liver is a clearing house","The liver removes remnants, LDL and HDL particles via receptors, while producing apolipoproteins and regulatory enzymes. This interplay affects cardiovascular risk. When hepatic fat export increases, VLDL production can rise, contributing to hypertriglyceridaemia."],["Don’t overread a single number","Lipid results are interpreted with age, blood pressure, diabetes, smoking, kidney function and other factors. A low or high number in isolation is not a verdict. Treatment decisions require professional assessment and shared decision-making."]],recap:"Lipoproteins carry lipids; the liver both packages and clears them. Lipid results are contextual, not personal labels.",refs:["nih-liver","wgo","aasld-masld"],books:[18,11]},{n:28,title:"Bile Production and Bile Acid Metabolism",summary:"Bile is a complex secretion containing bile acids, phospholipids, cholesterol, bilirubin and water. It is essential for fat digestion and carries waste products.",mins:11,visual:{kind:"cycle",title:"Bile acid recycling",caption:"Bile acids are conjugated, secreted, reabsorbed in the ileum, and returned to the liver — the enterohepatic circulation.",nodes:["Synthesis","Bile secretion","Intestine","Reabsorption","Return to liver"]},obj:["List the main components and functions of bile","Describe bile acid synthesis and conjugation","Explain the enterohepatic circulation"],secs:[["What bile contains","Bile is mostly water with bile salts, cholesterol, phospholipids, bile pigments, electrolytes and bicarbonate. Bile acids are synthesised from cholesterol in hepatocytes, conjugated with glycine or taurine, and actively secreted. Bile salts act as detergents, forming micelles that help absorb fats and fat-soluble vitamins."],["Flow and storage","Bile flows through canaliculi and ducts. Between meals, the sphincter of Oddi resists flow, and bile is stored and concentrated in the gallbladder. With a meal, gallbladder contraction delivers bile to the duodenum. The liver also secretes bicarbonate-rich fluid that helps neutralise stomach acid."],["Recycling efficiency","Most bile acids are reabsorbed in the terminal ileum, though some are absorbed in the colon. They return via portal blood and are taken up by hepatocytes. This enterohepatic circulation conserves bile salts; only a small fraction escapes in stool and must be replaced."]],myth:["Bile is a toxin the gallbladder stores until a cleanse removes it.","Bile is a physiological digestive secretion, not a toxin. The body recycles it efficiently; no cleanse is medically required."],recap:"The liver makes bile; the gallbladder stores and concentrates it. Bile acids are recycled through the enterohepatic circulation.",refs:["niddk-gallstones","nih-liver","wgo"],books:[2,7]},{n:29,title:"Bilirubin Metabolism",summary:"Bilirubin is produced from haem breakdown, processed in the liver, and excreted in bile. Its pathways connect red cell turnover, liver uptake and bile flow.",mins:11,visual:{kind:"pathway",title:"Bilirubin handling",caption:"Haem is converted to bilirubin, bound to albumin, taken up by hepatocytes, conjugated, and secreted into bile.",nodes:["Haem","Unconjugated bilirubin","Albumin transport","Conjugation","Bile"]},obj:["Describe the origin and transport of bilirubin","Explain conjugation and excretion","Distinguish pre-hepatic, hepatic and post-hepatic causes of jaundice conceptually"],secs:[["From haem to bilirubin","Haem from red blood cells and other haem proteins is degraded to biliverdin and then bilirubin, largely in the spleen and macrophages. Unconjugated bilirubin is not water-soluble and travels bound to albumin. The liver takes it up and conjugates it with glucuronic acid via UGT1A1, making it water-soluble."],["Excretion and the gut","Conjugated bilirubin is secreted into bile and reaches the intestine. Bacteria convert it to urobilinogen, some of which is reabsorbed and some excreted in stool. Bilirubin-related pigment contributes to stool colour; dark urine can occur when conjugated bilirubin backs up into blood."],["Patterns, not labels","Raised unconjugated bilirubin can occur with increased haem breakdown or inherited conjugation differences. Conjugated hyperbilirubinaemia suggests impaired secretion or bile flow. Patterns narrow possibilities, but diagnosis requires clinical and laboratory correlation."]],safety:"Jaundice in a newborn, during pregnancy, or accompanied by fever, abdominal pain, dark urine, confusion or bleeding requires timely medical assessment. Do not attempt to interpret bilirubin results alone.",recap:"Bilirubin travels from haem breakdown to hepatic conjugation and biliary excretion. Jaundice is a sign, not a diagnosis.",refs:["niddk-bilirubin","nhs-liver","nih-liver"],books:[2,10]},{n:30,title:"Vitamin and Mineral Storage",summary:"The liver stores several vitamins and regulates iron and copper within narrow ranges. Both deficiency and excess can cause harm.",mins:10,visual:{kind:"cells",title:"Hepatic nutrient storage",caption:"The liver stores vitamin A, vitamin D, B12 and copper, and regulates iron via hepcidin.",nodes:["Vitamin A","Vitamin D","B12","Iron","Copper"]},obj:["Identify vitamins stored in the liver","Explain the liver’s role in iron regulation","Recognise the risks of indiscriminate supplementation"],secs:[["Vitamins","The liver stores vitamin A in stellate cells and vitamin D in smaller quantities. It stores vitamin B12 and handles fat-soluble vitamins absorbed with dietary fat. Fat malabsorption from cholestasis can cause deficiencies, so supplementation may be prescribed in specific clinical settings."],["Iron, carefully controlled","The liver produces hepcidin, which reduces iron absorption and release when body iron is high. In haemochromatosis, impaired hepcidin signalling causes excessive iron absorption and deposition in the liver, heart and pancreas. Iron deficiency and iron overload can both cause harm."],["Copper and other trace minerals","Copper is essential for enzymes but toxic in excess. Wilson disease impairs copper export from hepatocytes, causing accumulation and injury. These examples show why ‘more’ is not automatically better, and why supplement doses need care."]],safety:"High-dose vitamin A and iron supplements can be dangerous. Avoid starting supplements for a suspected deficiency without assessment. Iron poisoning is a medical emergency.",recap:"The liver stores and regulates several micronutrients. Both deficiency and toxicity are possible, so supplementation should be purposeful.",refs:["niddk-hemochromatosis","niddk-wilson","nih-supplements"],books:[10,9]},{n:31,title:"Hormone Metabolism and Regulation",summary:"The liver processes and influences hormones involved in growth, stress, thyroid function and reproduction. It also produces hormone-like proteins that regulate growth and appetite.",mins:9,visual:{kind:"organs",title:"Endocrine dialogue",caption:"Hormones act on the liver; the liver modifies them and produces IGF-1 and hormone-binding proteins.",nodes:["Insulin","Thyroid","Cortisol","IGF-1","Sex hormones"]},obj:["Give examples of hormones influenced by the liver","Explain how binding proteins alter hormone availability","Recognise that abnormal hormone patterns require medical assessment"],secs:[["Processing and binding","The liver metabolises insulin, cortisol, thyroid hormones and sex hormones, while producing binding proteins such as SHBG and thyroid hormone–binding globulin. Presence of a hormone in blood does not indicate how much is biologically active; binding matters."],["Growth and metabolism","The liver produces insulin-like growth factor 1 (IGF-1), largely in response to growth hormone. It also produces proteins such as angiotensinogen and hepcidin that influence blood pressure and iron. These connections explain why liver disease can affect growth and multiple systems."],["Context matters","Hormone tests can be influenced by pregnancy, contraceptives, illness, weight change, alcohol and medicines. Interpretation should consider the whole person. Educational resources can help you prepare questions for an endocrine or liver specialist."]],recap:"The liver is part of the endocrine network. It modifies hormones and produces binding proteins and growth signals.",refs:["nih-liver","wgo"],books:[17,15]},{n:32,title:"Liver Function in Blood Clotting",summary:"The liver synthesises most clotting factors and proteins involved in anticoagulation. Liver disease can therefore affect bleeding and clot formation — sometimes both.",mins:10,visual:{kind:"cells",title:"Clotting protein production",caption:"Vitamin K–dependent factors II, VII, IX and X, plus fibrinogen and other proteins, are produced by hepatocytes.",nodes:["Vitamin K","Factors II/VII/IX/X","Fibrinogen","Balance"]},obj:["Name clotting proteins synthesised by the liver","Explain the relationship between vitamin K and clotting","Recognise that INR is not a simple bleeding risk score in liver disease"],secs:[["Synthesis and vitamin K","Hepatocytes produce fibrinogen and factors II, VII, IX and X, as well as proteins C, S and Z. Vitamin K is required for carboxylation of several factors. Biliary obstruction can impair fat and vitamin K absorption, causing a prolonged prothrombin time that may correct with vitamin K supplementation."],["A rebalanced system","Advanced liver disease reduces both procoagulant and anticoagulant proteins. The INR may rise, yet people can experience thrombosis as well as bleeding. The INR was designed to monitor warfarin, not to be a standalone measure of bleeding tendency in liver disease."],["Clinical care","Procedures and anticoagulant decisions in liver disease require specialist assessment, sometimes with haematology input. People should not start or stop medicines affecting clotting without advice. Educating yourself helps you ask about risks and monitoring."]],safety:"Do not adjust anticoagulants, antiplatelet medicines or vitamin K on your own. Seek urgent care for uncontrolled bleeding, vomiting blood or suspected overdose.",recap:"The liver makes clotting and anticoagulant proteins. Clotting in liver disease is complex and needs specialist interpretation.",refs:["nih-liver","niddk-cirrhosis","easl-cirrhosis"],books:[18,20]},{n:33,title:"The Liver and Digestive Health",summary:"The liver, gallbladder, pancreas and intestine act as a coordinated digestive team. Their timing depends on hormones, nerves and nutrient signals.",mins:9,visual:{kind:"organs",title:"The digestive network",caption:"Bile, pancreatic enzymes and intestinal absorption work together, much of it coordinated by hormones.",nodes:["Liver","Pancreas","Gallbladder","Duodenum"]},obj:["Describe the liver’s role in digestion","Explain how bile and pancreatic enzymes cooperate","Identify overlapping digestive conditions that require assessment"],secs:[["Coordination around a meal","Food entering the duodenum triggers CCK and secretin release. CCK causes gallbladder contraction and pancreatic enzyme secretion. Secretin stimulates bicarbonate-rich bile and pancreatic fluid, helping neutralise acid and optimise enzyme activity."],["Bile and fats","Bile salts emulsify fat into smaller droplets, increasing the surface area for pancreatic lipase and colipase. Mixed micelles carry fatty acids, cholesterol and fat-soluble vitamins toward the intestinal mucosa. Without adequate bile, fat absorption declines and steatorrhoea can develop."],["Overlapping symptoms","Bloating, upper abdominal discomfort or altered stools can arise from the gut, gallbladder, pancreas or liver. A clinician selects investigations based on history and examination. Self-diagnosing a ‘sluggish liver’ can delay appropriate care."]],recap:"Digestion depends on coordinated liver, biliary, pancreatic and intestinal function. Symptoms can overlap, so assessment matters.",refs:["wgo","niddk-gallstones","nih-liver"],books:[2,7]},{n:34,title:"How Bile Helps Digest and Absorb Fat",summary:"Bile salts emulsify dietary fat and enable micelle formation. This allows absorption of fatty acids and fat-soluble vitamins.",mins:9,visual:{kind:"pathway",title:"Emulsification to absorption",caption:"Bile salts break up large fat droplets so lipase can act, then carry products to the intestinal wall.",nodes:["Fat droplets","Bile salts","Micelles","Absorption","Lymph"]},obj:["Explain emulsification and micelle formation","Describe how bile supports absorption of vitamins A, D, E and K","Recognise causes and signs of fat malabsorption"],secs:[["Emulsification","Bile salts are amphipathic, meaning they have water-loving and fat-loving parts. They coat fat droplets, reducing surface tension and breaking large globules into smaller ones. This mechanical-like action is not a chemical digestion of fat but a way to expose more surface area."],["Micelles and transport","Bile salts form micelles that solubilise digestion products. This allows transport across the watery intestinal fluid to the brush border. Absorbed lipids are re-esterified, packaged into chylomicrons and transported in lymph. Fat-soluble vitamins depend on this pathway."],["When absorption fails","Cholestasis, bile duct obstruction, pancreatic disease or extensive ileal disease can impair fat absorption. Floating or pale, greasy stools, weight loss and vitamin deficiencies can result. These symptoms warrant medical assessment."]],myth:["Bile digests fat by itself.","Bile salts emulsify fat and enable absorption. Pancreatic lipase performs much of the actual fat digestion."],recap:"Bile salts make fat absorbable. Their deficiency or obstruction can cause malabsorption and fat-soluble vitamin problems.",refs:["niddk-gallstones","wgo","nih-liver"],books:[2,10]},{n:35,title:"The Gut–Liver Axis",summary:"The intestine and liver communicate through portal blood, immune signals, bile acids, microbial metabolites and the nervous system.",mins:11,visual:{kind:"pathway",title:"Gut–liver communication",caption:"Microbial products cross a permeable barrier and reach the liver via the portal vein; bile and immune signals travel back.",nodes:["Gut microbes","Barrier","Portal vein","Liver","Bile return"]},obj:["Explain the main routes of gut–liver communication","Describe how barrier function influences liver exposure","Recognise uncertainty in microbiome-based interventions"],secs:[["An anatomical conversation","The venous drainage of the intestine means the liver samples microbial products, dietary compounds and bile acids before they enter systemic circulation. Kupffer cells and other immune cells detect these signals and help maintain tolerance or mount responses."],["Barrier and inflammation","The intestinal barrier includes mucus, epithelial tight junctions and immune defences. When permeability increases, bacterial products such as lipopolysaccharide can reach the liver and promote inflammation. This mechanism is studied in steatotic liver disease and other conditions."],["Evidence and uncertainty","The microbiome is complex and varies by diet, geography, medicines and health. Associations with liver disease do not yet translate into proven universal probiotic treatments. Fibre-rich diets, food safety and avoiding unnecessary medicines matter; individual microbiome products should be discussed with a clinician."]],recap:"The gut and liver communicate continuously. Barrier integrity, diet, microbes and immunity interact, but evidence for microbiome treatments is early.",refs:["wgo","aasld-masld","nih-liver"],books:[2,20,5]},{n:36,title:"The Liver and the Gut Microbiome",summary:"Microbes produce metabolites that influence metabolism and immunity. This is an active research field with more hypotheses than established therapies.",mins:10,visual:{kind:"cells",title:"Microbial metabolites",caption:"Short-chain fatty acids, secondary bile acids and other products can influence hepatic inflammation and metabolism.",nodes:["Fibre","SCFAs","Bile acids","Liver signals"]},obj:["Describe how microbial metabolites may affect the liver","Separate associations from proven treatments","Explain dietary approaches to supporting a diverse microbiome"],secs:[["Metabolites as signals","Some gut bacteria ferment fibre to short-chain fatty acids such as butyrate, which support intestinal cells and influence immune signals. Microbial enzymes modify bile acids into secondary forms that interact with receptors in the gut and liver. These pathways are biologically important but treatment implications remain under investigation."],["Evidence still developing","Studies show differences in microbiome composition between groups with and without liver disease, but causality and clinical utility are not established for most settings. Microbiome testing is not routinely recommended for liver diagnosis. Commercial tests may use unvalidated interpretations."],["Practical foundations","A varied plant-rich diet, adequate fibre, safe food handling and sensible antibiotic use support gut health generally. Probiotic supplements vary by strain and quality; safety and benefit should be discussed with a clinician, especially in people who are immunocompromised or critically ill."]],myth:["A probiotic capsule can ‘repair’ liver disease.","Probiotics are specific live microorganisms, not a generic liver treatment. Evidence varies by strain and condition, and products are not closely regulated in all countries."],recap:"The microbiome is a promising research area. Diet supports gut health; commercial microbiome products are not established liver treatments.",refs:["wgo","nih-supplements","aasld-masld"],books:[2,7]},{n:37,title:"The Liver’s Role in Substance Metabolism",summary:"The liver processes many medicines, alcohol, hormones and environmental chemicals. The same enzymes can be involved in activation, detoxification and harm.",mins:11,visual:{kind:"pathway",title:"From substance to metabolite",caption:"A substance may be activated to a reactive intermediate, then conjugated for elimination — or cause injury if the balance fails.",nodes:["Substance","Phase I","Reactive metabolite","Phase II","Excretion"]},obj:["Explain why the liver is important in pharmacology","Describe how first-pass metabolism affects oral medicines","List factors that change individual susceptibility to liver injury"],secs:[["First-pass handling","Oral medicines absorbed from the gut enter the portal circulation and pass through the liver before reaching the systemic bloodstream. Hepatic metabolism can reduce bioavailability. This is why some drugs have low oral availability, require different routes or cause liver injury even at therapeutic doses."],["Activation and deactivation","Metabolism usually makes compounds more water-soluble for elimination. However, some are converted into active drugs — or reactive metabolites. If these overwhelm antioxidant defences or cause immune responses, drug-induced liver injury can occur. The risk varies with dose, genetics, age, illness and interactions."],["Alcohol and other substances","Alcohol is metabolised mainly through alcohol dehydrogenase and cytochrome P450 2E1, with further oxidation and metabolism. Heavy use can increase oxidative stress and interact with other conditions. Abrupt cessation of heavy alcohol use may require medical support for withdrawal."]],safety:"Do not stop prescribed medicines without advice. Suspected medicine-related liver injury, overdose or poisoning requires prompt clinical or poison-centre support.",recap:"The liver processes many substances, sometimes creating reactive intermediates. Medicine and alcohol safety depends on context, dose and individual factors.",refs:["nih-otc","nih-supplements","who-alcohol"],books:[9,13]},{n:38,title:"Understanding Liver Detoxification Pathways",summary:"Biotransformation is a set of regulated enzyme systems, not a commercial cleansing ritual. Phase I and phase II reactions prepare substances for elimination.",mins:12,visual:{kind:"pathway",title:"Two phases, not a cleanse",caption:"Phase I oxidation can create reactive intermediates; phase II conjugation makes them more water-soluble; transporters export them.",nodes:["Phase I","Intermediate","Phase II","Water-soluble","Bile / urine"]},obj:["Explain the purpose of phase I and phase II reactions","Understand why reactive intermediates can cause harm","Explain why detox products are not required for normal function"],secs:[["Phase I: functionalisation","Cytochrome P450 enzymes and related systems add or expose functional groups, often through oxidation. This can make a compound more water-soluble, but can also produce more reactive metabolites. Antioxidant and conjugation systems normally handle these intermediates."],["Phase II: conjugation","Enzymes such as UDP-glucuronosyltransferase, sulfotransferases, glutathione S-transferases and N-acetyltransferases attach water-soluble groups to substances. This generally facilitates export by transporters into bile or blood. Phase I and II are coordinated, not a simple on/off switch."],["What actually supports the system","Adequate nutrition, avoidance of excessive alcohol, careful medicine use and protection from toxic exposures support the normal systems. There is no evidence that juices, coffee enemas, herbal concoctions or fasting ‘flush’ the liver. Some of these products can cause injury."]],myth:["You can activate phase I and phase II with a supplement to flush toxins.","Enzyme systems are tightly regulated. Inducing or inhibiting them with unregulated products can alter medicine levels and cause harm rather than enhance health."],safety:"Avoid herbal, dietary or ‘detox’ products marketed as liver cleanses. They may contain hepatotoxic compounds or interact with prescribed medicines.",recap:"Biotransformation prepares substances for elimination through coordinated phase I and II reactions. No commercial detox regimen is required.",refs:["nih-supplements","nih-otc","wgo"],books:[10,9]},{n:39,title:"The Liver and Immune Defence",summary:"The liver contains many immune cells and helps balance defence against infection with tolerance of harmless gut substances.",mins:10,visual:{kind:"cells",title:"Hepatic immune players",caption:"Kupffer cells, natural killer cells, dendritic cells and lymphocytes form a specialised immune environment.",nodes:["Kupffer cells","NK cells","T cells","Endothelial cells"]},obj:["Describe the immune roles of the liver","Explain immune tolerance in the liver","Recognise how immune-mediated liver injury occurs"],secs:[["A tolerogenic yet defensive organ","The liver is continuously exposed to microbial and dietary molecules from the gut. It uses mechanisms that dampen unnecessary inflammation while retaining the ability to respond to pathogens. This balance may allow some infections to persist and can shape vaccine responses."],["Immune-mediated disease","In autoimmune hepatitis, the immune system targets hepatocytes, causing inflammation and potential fibrosis. Primary biliary cholangitis targets small bile ducts. These are not caused by ‘poor lifestyle’. Diagnosis uses clinical features, antibodies, imaging and sometimes biopsy."],["Inflammatory consequences","Immune activation also contributes to alcohol-associated and metabolic liver injury. The goal is not to suppress immunity indiscriminately but to treat the specific cause and manage complications with specialist care."]],recap:"The liver is both defensive and tolerogenic. Immune responses can cause disease as well as protect against infection.",refs:["niddk-aih","niddk-pbc","nih-liver"],books:[20]},{n:40,title:"The Liver and Inflammation",summary:"Acute inflammation is a protective response. Chronic inflammation, driven by ongoing injury, can promote fibrosis and structural liver disease.",mins:10,visual:{kind:"spectrum",title:"Acute to chronic",caption:"A short-lived response can resolve; a sustained cycle of injury, inflammation and repair can lead to scarring.",nodes:["Injury","Inflammation","Repair","Fibrosis"]},obj:["Distinguish acute from chronic inflammation","Describe how inflammatory mediators affect hepatocytes","Explain why removing the cause is central to treatment"],secs:[["The inflammatory response","Damaged cells release signals that recruit neutrophils, monocytes and lymphocytes. Cytokines such as TNF and interleukins orchestrate defence and repair. This is necessary and can resolve. In the liver, however, intense inflammation can impair synthetic function and cause cholestasis."],["When inflammation persists","Continuous triggers such as viral infection, alcohol metabolites, fat-related stress or autoimmune activation keep the response going. Stellate cells become activated and deposit collagen. Over time, this alters architecture and blood flow, creating a pathway toward fibrosis and cirrhosis."],["What helps","Treating the underlying cause — antiviral therapy, metabolic risk reduction, alcohol support, immunosuppression where indicated — is central. Nutrition, vaccine-preventable infection and medicine safety also matter. Anti-inflammatory supplements are not an established substitute for medical care."]],recap:"Inflammation is a normal defence but can cause harm when sustained. Managing the cause is the foundation of liver treatment.",refs:["nih-liver","aasld-masld","niddk-cirrhosis"],books:[20,13]}],Qf=[{n:41,title:"Fatty Liver Disease: An Introduction",summary:"Fat inside liver cells is common and not automatically a disease experience. Modern terminology describes the cause and metabolic context rather than using vague labels.",mins:10,visual:{kind:"spectrum",title:"Steatosis to steatohepatitis",caption:"Fat accumulation can remain stable or be accompanied by inflammation and cell injury. Terminology now reflects metabolic context.",nodes:["Steatosis","Metabolic risk","Inflammation","Fibrosis"]},obj:["Explain what hepatic steatosis means","Differentiate steatosis from steatohepatitis","Describe why terminology changed from NAFLD/NASH"],secs:[["What steatosis means","Steatosis is the accumulation of fat, mainly triglycerides, inside hepatocytes. It is detectable by imaging or histology. It can occur with metabolic risk, alcohol, medicines, viral hepatitis, rapid weight changes, pregnancy or genetic conditions. Finding fat is a starting point, not a complete diagnosis."],["The new terminology","In 2023, a global consensus introduced steatotic liver disease (SLD) as an umbrella term. Metabolic dysfunction–associated steatotic liver disease (MASLD) replaces NAFLD and requires at least one cardiometabolic criterion. MASH replaces NASH. A separate category, MetALD, describes combined metabolic and alcohol-related risk."],["Why names matter","Old terms implied a simple fatty/non-alcoholic dichotomy and could stigmatise. The new framework encourages clinicians to identify all contributing factors, including alcohol, medicines, genetics and other diseases. Accurate labels support better prevention and treatment conversations."]],myth:["Any fat on the liver means permanent liver disease.","Steatosis can be stable and may improve with treatment of the underlying cause. Risk of progression varies with metabolic factors, fibrosis and exposures."],recap:"Steatosis is a finding with many possible contributors. MASLD and MASH are more precise terms requiring metabolic context and, for MASH, inflammation.",refs:["aasld-masld","easl-masld","niddk-masld"],books:[11,7]},{n:42,title:"Metabolic Dysfunction–Associated Steatotic Liver Disease (MASLD)",summary:"MASLD describes hepatic steatosis in the presence of cardiometabolic risk factors. It is common worldwide and closely linked to type 2 diabetes and obesity, but not limited to them.",mins:12,visual:{kind:"risk",title:"MASLD risk network",caption:"Cardiometabolic factors cluster. The presence of one or more can support a MASLD diagnosis when steatosis is present.",nodes:["Steatosis","Insulin resistance","Dyslipidaemia","Hypertension","Central adiposity"]},obj:["Outline the diagnostic requirements for MASLD","Explain why liver health and cardiometabolic health overlap","Identify sensible next steps after a possible diagnosis"],secs:[["Defining MASLD","MASLD is defined as hepatic steatosis plus at least one of five cardiometabolic criteria: overweight or specific body-fat thresholds, type 2 diabetes, hypertension, dyslipidaemia, or a relevant metabolic/genetic risk factor. Alcohol consumption must be considered in a separate category; clinicians interpret all contributors."],["Mechanisms and course","Insulin resistance increases fat delivery to the liver and lipogenesis, while inflammation and genetic variation influence disease progression. Many people remain stable. Some develop steatohepatitis, fibrosis, cirrhosis or liver cancer
